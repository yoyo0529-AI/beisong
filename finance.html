”。附件里那张股权结构图像一座{{castle}}（城堡）：七圈围墙，中间是空的。\n\nRuiz 提了个{{suggestion}}（提议）：绕开跨境，直接查交易所。作为{{self-regulatory organization}}（自律监管组织），它手上有会员的完整下单记录，比等备忘录快得多。Elena 让他先把{{membership}}（会员资格）名册拉一遍。结果很有意思：这家通道公司挂过一年会员，后来主动退了，退会那个月，正好是票据发行的月份。\n\n下午三点，她在东{{wing}}（侧翼）的小会议室里跟上司谈了四十分钟。她要提一个{{motion}}（动议），请法院在{{discovery}}（证据开示）程序里强制对方交出与底稿相关的往来邮件。上司第一个问题是{{burden of proof}}（举证责任）：你怎么证明这些邮件存在？\n\n“用他们自己的合规手册。”她说，“手册里写着，每一次跨境沟通都要留痕。”\n\n上司笑了。这人口味一向很{{catholic}}（宽泛的），什么线索都愿意听。他同意了，但要求同时申请一份{{gag order}}（禁言令）。理由很{{apparent}}（显然的）：一旦对方知道我们在找底稿，那批纸的{{outcome}}（结果）就只剩一种。\n\n“还有，现在有多少人知道这个案子？”\n\nElena 报了个数。就控制在这个数以内，上司说，任何{{variation}}（变化）先告诉我。这不是不信任，是防{{tipping}}（通风报信）——嘴松的未必是坏人，一个{{slip}}（差错）就够。\n\n散会时天暗了。窗下是排队进隧道的车灯，一条红线从楼脚铺到城市另一头的{{crown}}（顶点）。\n\n她想起 Ruiz 在飞机上写的那份跨境取证{{pilot}}（试点）方案，最后一页只有一句：如果拿不到底稿，就去证明它从来不存在。\n\nElena 把那页翻过来，在背面写下今天真正的问题：那封信是谁写的？他现在还在里面吗？","ft":[{"w":"Financial Crimes Enforcement Network","z":"美国金融犯罪执法局","d":"财政部下属机构，负责反洗钱情报收集与相关合规监管","a":"FinCEN","p":""},{"w":"Schedule 13D","z":"大额持股披露表","d":"持股超过百分之五并有意影响公司控制权时须提交的申报","a":"","p":""},{"w":"burden of proof","z":"举证责任","d":"某一方须提出证据证明主张成立的诉讼责任分配","a":"","p":""},{"w":"continuing obligations","z":"持续责任；持续披露义务","d":"公司上市后须长期遵守的定期报告与即时披露等要求","a":"","p":""},{"w":"discovery","z":"证据开示","d":"诉讼双方在开庭前依法互相调取文件与证词的程序","a":"","p":"dis'kʌvәri"},{"w":"gag order","z":"禁言令","d":"法院或监管禁止当事人对外披露案件信息的命令","a":"","p":""},{"w":"know your customer","z":"客户身份识别；了解你的客户","d":"开户与持续经营中核实客户身份与背景的强制程序","a":"KYC","p":""},{"w":"nominee account","z":"代名人账户","d":"以他人名义开立、实际由幕后人控制的账户，常见于操纵案","a":"","p":""},{"w":"politically exposed person","z":"政治公众人物","d":"担任重要公职者及其亲属，属反洗钱重点关注对象","a":"PEP","p":""},{"w":"responsible officer","z":"负责人员","d":"香港持牌法团中获证监会核准监督受规管活动的高管","a":"RO","p":""},{"w":"self-regulatory organization","z":"自律监管组织","d":"交易所或行业协会等有权制定规则并处分会员的非政府监管主体","a":"SRO","p":""},{"w":"tipping","z":"泄露内幕信息；通风报信","d":"把内幕信息透露给他人以供交易，泄露方同样承担责任","a":"","p":"'tipiŋ"}],"iw":[{"w":"appreciate","p":"ә'pri:ʃieit","t":"vt. 赏识, 鉴别, 为...而感激, 领会, 欣赏; vi. 增值, 涨价"},{"w":"sick","p":"sik","t":"n. 病人; a. 不舒服, 有病的, 恶心的, 厌恶的, 渴望的, 病态的; vt. 呕吐, 追击, 使(狗)去攻击"},{"w":"outcome","p":"'autkʌm","t":"n. 结果, 出口"},{"w":"alternative","p":"ɒ:l'tә:nәtiv","t":"n. 两者择一, 供替代的选择; a. 两者择一的, 供选择的; 选择对象"},{"w":"wing","p":"wiŋ","t":"n. 翅膀, 翼, 机翼, 派别; vt. 给...装上翼, 飞过, 使飞, 空运, 增加...速度; vi. 飞行"},{"w":"catholic","p":"'kæθәlik","t":"n. 天主教徒; a. 天主教的, 普遍的, 广泛的, 宽宏大量的"},{"w":"lane","p":"lein","t":"n. 小路, 巷, 弄, 单行道"},{"w":"crown","p":"kraun","t":"n. 王冠, 王权, 顶点; vt. 使成王, 加冕, 居...之顶"},{"w":"variation","p":".vєәri'eiʃәn","t":"n. 变更, 变化, 变种, 变奏; 变异, 变易; 变度"},{"w":"airport","p":"'єәpɒ:t","t":"n. 飞机场; 航空站, 机场"},{"w":"castle","p":"'kæsl. 'kɑ:sl","t":"n. 城堡, 象棋中的车; vt. 置于城堡中, 盘踞于"},{"w":"motion","p":"'mәuʃәn","t":"n. 移动, 手势, 动作, 意向, 请求, 提议; v. 打手势"},{"w":"apparent","p":"ә'pærәnt","t":"a. 清晰可见的, 显然的, 表面上的; 外在的"},{"w":"membership","p":"'membәʃip","t":"n. 会员的资格, 全体会员, 会员数目; 会员资格, 成员资格, 会籍"},{"w":"pilot","p":"'pailәt","t":"n. 飞行员, 领航员, 航船者, 导向器, 驾驶仪, 向导, 领导人; vt. 领航, 驾驶, 引导, 试用; a. 引导的, 控制的, 试点的; 引导"},{"w":"ultimately","p":"'ʌltimәtli","t":"adv. 最后, 最终; 最后, 终究, 总之"},{"w":"suggestion","p":"sә'dʒestʃәn","t":"n. 提议, 意见; 暗示"},{"w":"attractive","p":"ә'træktiv","t":"a. 吸引人的, 有魅力的; 有吸引力的, 有迷惑力的"},{"w":"passage","p":"'pæsidʒ","t":"n. 通道, 通过, 移居, 航行, 一段, 走廊; vi. 通过, 经过, 航行, 横渡, 争吵; vt. (使)马以斜横步前进, 使传代"},{"w":"slip","p":"slip","t":"n. 滑, 滑行, 事故, 溜, 差错, 滑台, 下降, 插条, 后裔, 板条, 瘦长的年轻人; vi. 滑动, 滑倒, 失足, 溜走, 滑落, 犯错, 变坏; vt. 使滑动, 滑过, 摆脱, 闪开, 塞入, 从...取接枝; a. 滑动的, 滑移的, 活络的, 有活结的; 串行线接口协议"}],"doc":{"k":"跨境司法协助请求函","en":"Pursuant to the memorandum of understanding between our authorities, this Office requests assistance in obtaining the audit working papers supporting the receivables described in Annex A. Our review of records held by the Financial Crimes Enforcement Network indicates that the funding entity operates through a nominee account whose beneficial owner failed ordinary know your customer verification and was flagged as a politically exposed person. A Schedule 13D filed three years ago names an affiliate whose responsible officer has declined to produce the underlying ledgers. Because the listed issuer remains subject to continuing obligations in your market, and because membership records held by the relevant self-regulatory organization are incomplete, this Office intends to seek discovery of related correspondence. Given the burden of proof in a criminal proceeding and the risk of tipping, we further request that a gag order be respected.","zh":"根据我方主管机关之间签署的合作备忘录，本办公室请求协助调取附件一所述应收账款对应的审计底稿。我们对美国金融犯罪执法局所存记录的审查显示，出资主体通过一个代名人账户运作，其实益拥有人未能通过常规的客户身份识别核查，并被标记为政治公众人物。三年前提交的一份大额持股披露表点出了一家关联机构，该机构的负责人员已拒绝提供底层账簿。鉴于该上市发行人在贵方市场仍负有持续披露义务，且相关自律监管组织所存的会员资格记录并不完整，本办公室拟就相关往来函件申请证据开示。考虑到刑事程序中的举证责任以及通风报信的风险，我们另请求对一项禁言令予以尊重。"}},{"i":27,"ti":"他还在里面，上周一刚刚销假回来","dom":"reg","sc":"举报人制度","tx":"Elena 把那张表重新打印了一遍，这次连页边距都没动。\n\n如果举报人在外面，他不可能拿到这张表；如果他在里面，问题就变成两个：他是谁，他还在不在。\n\n三条{{criterion}}（判据）写在白板上。第一，有权限打开这张表的人有多少；第二，它是从哪个系统导出来的；第三，导出的时间。\n\n第一条最好办。Ruiz 去问那家机构的技术部门，报上来的是个{{percentage}}（百分比）：全公司能调这张报表的人占员工总数的百分之四——一百多号人里，五个。\n\n第二条要靠做{{engineering}}（工程）的人。表里保留了原始列名和{{index}}（索引）字段，取证工程师从中{{derive}}（推导）出了导出模板的版本号，{{effectively}}（实际上）把范围又砍掉一半。他们还{{recover}}（恢复）出一段被删掉的元数据，里面留着一个用户组的名字：交易监控组。\n\n那是做{{trade surveillance}}（交易监控）的人。\n\nElena 盯着这四个字看了很久。她原本以为举报人在后台做估值，现在看来不是——是每天筛异常委托的那批人。这类岗位天天处理{{layering}}（分层报单操纵）的告警，一天几百条，顺手还要审员工买卖股票的{{pre-clearance}}（事前审批）申请，看久了对不自然的形状特别敏感。他们的职业{{characteristic}}（特征）就是不相信平滑。\n\n这就说得通了。一条三年不出现{{valley}}（低谷）的净值曲线，在别人眼里是业绩，在他眼里是一条待处理的告警。\n\n第三条是时间。导出发生在一个周日的凌晨，那一周公司两位高管在{{Italy}}（意大利）出差。那天晚上公司大半个投研部都在城里，参加一场为{{AIDS}}（爱滋病）研究募款的慈善晚宴；Ruiz 调了门禁，那晚刷卡进楼的只有七个人。他把七个人和五个人的名单一叠，{{estimate}}（估算）出重合的是三个。\n\n“能不能直接找他们谈？”Ruiz 问。\n\n不能。一问就等于告诉全公司我们在找人。他如果还在职，接下来不会是开除——是调岗，是撤掉一个项目，是年底那句“结构性调整”，体面得让他连{{blame}}（归咎）谁都找不到对象。\n\n她在白板另一头写下两个名字：{{Securities and Exchange Commission}}（美国证监会）、{{Financial Industry Regulatory Authority}}（美国金融业监管局）。两家都有自己的举报通道，都有赏金。这个人为什么绕开这两条正规的路，把一封没有署名的信寄到检察官办公室？\n\n答案只有一个：他要的不是钱。\n\n那天下午她穿过法院外的{{square}}（广场），风很大。她想起入行时一位老检察官的话：真正{{vital}}（至关重要的）的证人从来不是被你挖出来的，是他自己走出来的；你只能别把地踩硬——线人长在{{soil}}（土壤）里，土松才长得出来。\n\n回到办公室，她开始给这个人设计一个出口。\n\n如果他站出来，她手上能给什么？她列了一遍：如果他本人也牵涉其中，可以谈{{non-prosecution agreement}}（不起诉协议）；如果公司肯{{self-report}}（主动报告）并且{{cooperate with the investigation}}（配合调查），民事那一头也许只到一纸{{cease-and-desist order}}（停止违规令），加上{{disgorgement}}（退还非法所得）和面向投资者的{{restitution}}（赔偿投资者）。这些是能端上桌的{{meat}}（实质），不是空话。\n\n她也清楚，一旦{{grand jury}}（大陪审团）启动，节奏就不归她管了。\n\n傍晚，Ruiz 抱着三份人事资料进来。\n\n第一个人每周六去打{{golf}}（高尔夫球），同一个球场，第七洞旁边有个人工{{lake}}（湖），照片贴在朋友圈里，同行的是他的直属主管。第二个人也在那张合影里。\n\n第三个不在。\n\n第三个人四十七岁，入职九年，做交易监控，从没换过岗。上个月他请了三周病假，理由那一栏写着{{surgery}}（手术）。假条的日期，比那封信寄出的日期晚了六天。\n\nElena 把三份材料摊在桌上，很久没说话。\n\n他还在里面。而且上周一，他已经销假回来上班了。","ft":[{"w":"Financial Industry Regulatory Authority","z":"美国金融业监管局","d":"美国券商行业自律组织，负责会员机构与从业人员的纪律处分","a":"FINRA","p":""},{"w":"Securities and Exchange Commission","z":"美国证券交易委员会；美国证监会","d":"美国证券市场的联邦监管机构，负责信息披露审核与民事执法","a":"SEC","p":""},{"w":"cease-and-desist order","z":"停止违规令","d":"责令立即停止并不得再犯特定违规行为的监管命令","a":"","p":""},{"w":"cooperate with the investigation","z":"配合调查","d":"公司或个人主动提交材料并接受问询，可换取处罚从轻","a":"","p":""},{"w":"disgorgement","z":"退还非法所得","d":"责令交出违法行为所获利益，性质上属返还而非罚款","a":"","p":"dɪs'gɔ:dʒˌmənt"},{"w":"grand jury","z":"大陪审团","d":"美国刑事程序中决定是否正式起诉的秘密审查机构","a":"","p":"ɡrænd ˈdʒuəri"},{"w":"layering","z":"分层报单操纵","d":"在多个价位挂撤虚假委托以制造买卖压力假象的行为","a":"","p":"'leiәriŋ"},{"w":"non-prosecution agreement","z":"不起诉协议","d":"检方承诺不提起指控以换取企业配合与整改的协议","a":"NPA","p":""},{"w":"pre-clearance","z":"事前审批；交易前报备","d":"员工买卖证券前须取得合规部门批准的内部控制要求","a":"","p":""},{"w":"restitution","z":"赔偿投资者","d":"责令违规方向受损投资者返还款项的救济措施","a":"","p":".resti'tju:ʃәn"},{"w":"self-report","z":"主动报告；自查上报","d":"在监管发现之前主动上报违规事实，通常可获处罚减免","a":"","p":"'selfrɪp'ɔ:t"},{"w":"trade surveillance","z":"交易监控","d":"通过系统筛查异常下单与成交以发现操纵或内幕交易线索","a":"","p":""}],"iw":[{"w":"percentage","p":"pә'sentidʒ","t":"n. 百分比, 比率, 部分, 可能性; 百分比"},{"w":"meat","p":"mi:t","t":"n. 肉, 餐, 食物; 肉类"},{"w":"soil","p":"sɒil","t":"n. 土壤, 土地, 国家, 国土, 温床, 污物, 粪便, 水池; vt. 弄脏, 污辱; vi. 变脏"},{"w":"AIDS","p":"eidz","t":"n. 爱滋病(获得性免疫缺陷综合征); 高级综合数据系统, 先进交互调试系统, 自动图解文档编制系统; 美国决策学学会, 信息自动显示系统, 自动综合调试系统"},{"w":"index","p":"'indeks","t":"n. 索引, 指针, 指数, 指标; vt. 编入索引中, 指出; vi. 做索引; 下标; 附标; 变址; 索引; 编索引"},{"w":"surgery","p":"'sә:dʒәri","t":"n. 外科, 手术, 手术室, 换球术"},{"w":"valley","p":"'væli","t":"n. 山谷, 溪谷, 流域, 凹地; 谷"},{"w":"blame","p":"bleim","t":"n. 过失, 责备; vt. 责备, 归咎于"},{"w":"derive","p":"di'raiv","t":"vt. 得自; vi. 起源"},{"w":"estimate","p":"'estimeit","t":"n. 估计, 判断; vt. 估计, 评价, 判断; vi. 估计"},{"w":"criterion","p":"krai'tiәriәn","t":"n. 标准, 准则, 规范; 判据"},{"w":"golf","p":"gɒlf","t":"n. 高尔夫球; vi. 打高尔夫球"},{"w":"square","p":"skwєә","t":"n. 正方形, 街区, 广场, 平方, 直角尺; a. 正方形的, 正直的, 公正的, 平方的, 方正的, 结清的; adv. 成直角地, 对准地; vi. 一致, 符合, 结清; vt. 使成方形, 使平方自乘, 调正, 结清, 使一致"},{"w":"vital","p":"'vaitl","t":"a. 生命的, 重要的, 充满活力的, 生死攸关的, 致命的; 生命的, 生活的, 生活上必需的, 紧要的"},{"w":"recover","p":"ri'kʌvә","t":"vt. 重新获得, 恢复, 复原, 拯救; vi. 痊愈, 复原, 胜诉; 恢复"},{"w":"effectively","p":"i'fektivli","t":"adv. 有效地, 有力地, 实际上"},{"w":"Italy","p":"'itәli","t":"n. 意大利"},{"w":"characteristic","p":".kærәktә'ristik","t":"n. 特性, 特征, 特色; a. 特性的, 特有的, 有特色的; 阶; 指数"},{"w":"lake","p":"leik","t":"n. 湖, 池, 色淀; v. (使)血球溶解"},{"w":"engineering","p":".endʒi'niәriŋ","t":"n. 工程学, 工程, 操纵; 机器; 机器学"}],"doc":{"k":"监管举报人计划指引摘录","en":"The Commission encourages persons with knowledge of possible violations to come forward. A person may self-report conduct and cooperate with the investigation before any subpoena is issued. Information concerning trade surveillance alerts, failures of pre-clearance, or patterns consistent with layering is of particular interest, whether reported to the Securities and Exchange Commission or to the Financial Industry Regulatory Authority. Depending on the facts, the staff may recommend a cease-and-desist order together with disgorgement and restitution to affected investors, and in appropriate cases the Department may consider a non-prosecution agreement. Employers are reminded that retaliation against a reporting employee is independently actionable. Where a matter is presented to a grand jury, the confidentiality of the reporting person will be protected to the fullest extent permitted by law.","zh":"本委员会鼓励知悉可能违规行为的人士主动前来反映。相关人员可在任何传票签发之前主动报告有关行为并配合调查。涉及交易监控告警、事前审批失效，或与分层报单操纵相符之模式的信息尤受关注，无论是向美国证监会还是向美国金融业监管局报告。视具体事实而定，工作人员可能建议作出停止违规令，并一并责令退还非法所得及向受损投资者赔偿；在适当情形下，司法部门亦可考虑不起诉协议。谨提醒各雇主：对举报员工实施打击报复本身即可另行追责。案件一旦提交大陪审团，举报人的保密身份将在法律允许的最大范围内受到保护。"}},{"i":28,"ti":"第一个开口的人，把条件写在一张纸的背面","dom":"reg","sc":"和解与认罪","tx":"电话是早上七点四十打进来的，Elena 还在楼下等电梯。\n\n对方自报家门：一家中型律所的合伙人，声音很老，措辞也很旧，用的全是{{ancient}}（古老的）说法，什么“敝所”、什么“敬悉”。\n\n“我代表一位客户。”他说。他不肯说客户的名字，不肯说职务，甚至不肯说{{gender}}（性别）。他只说了一句：我的当事人希望在被你们找到之前，先自己走进来。\n\nElena 站在电梯厅里，把手机换到另一只耳朵。\n\n十一点，双方在律所见面。四十六楼，会议室朝东，窗外那一片是{{ocean}}（海洋）的方向，什么都看不见。做{{host}}（东道主）的是那位老律师，他先讲了二十分钟规矩，才把一张纸推过来。\n\n一张纸，四条。\n\n第一条：不做{{cooperating witness}}（污点证人）出庭，除非先拿到完整的{{immunity deal}}（豁免协议）。第二条：香港那边不能同时开火——他要求美方在与{{Securities and Futures Commission}}（香港证监会）沟通时，明确把他归入配合方一侧。第三条：他的名字不得出现在任何一份新闻稿里。第四条最短，写得也最直白：家人先走。纸的背面{{attach}}（附上）了一个地址，在{{Australia}}（澳大利亚）南部；地址下面还有一行小字，说两位{{elderly}}（年迈的）老人走不了，希望有人偶尔去看一眼。\n\n“这不{{typical}}（典型的）。”Elena 说。多数人来谈的第一句话都是钱。\n\n“我的当事人不一样。”老律师说。\n\n她开始问{{observation}}（观察）性的问题，一条一条{{eliminate}}（排除）可能性：你的当事人接触过{{restricted list}}（限制名单）吗？他见过发往内地那一侧的付款审批吗？有没有出现过可能触及{{Foreign Corrupt Practices Act}}（反海外腐败法）的情形——比如钱最后落到了某位官员手上？\n\n老律师只答第三个，答得极其小心：我当事人看到的是，没有现金交到任何官员手里；但有一笔资产收购被包装成一项{{notifiable transaction}}（须予公布的交易）公告了出去，而公告里的买方，是卖方那个人自己的{{creation}}（创造物）。\n\nElena 把这句话一字不落记了下来。\n\n她提出自己的{{request}}（请求）：谈条件之前，先给我一件能核实的东西。老律师笑了笑，说这个顺序他理解，于是给了一个日期、一个内部系统的名字，外加一句提示——你们发那份{{document request}}（文件调取要求）的时候，别只要邮件，要附件的版本历史。\n\n回办公室的路上，Elena 一直在想这个人坐在哪张桌子后面。\n\n能看到付款审批，能看到公告草稿，还能看到限制名单——这三样东西同时经过的地方只有一间办公室：{{chief compliance officer}}（首席合规官）那间，或者他{{deputy}}（副手）的那间。\n\n下午她跟民事那条线通了个气。集体诉讼已经有三家律所在抢{{lead plaintiff}}（首席原告）的位置，法院还没指定。真走到{{settlement}}（和解）那一步，赔的钱要连{{prejudgment interest}}（判决前利息）一起算，从获利那天起算，数字会非常难看；对方多半还得签一份{{undertaking}}（承诺），保证限期整改。\n\n“这套{{regime}}（制度）最有意思的地方，”同事说，“是民事和刑事的{{landscape}}（格局）根本不一样。你们要的是人，他们要的是钱。”\n\nElena 说，我要的其实也不是人。\n\n她要的是把这个东西{{solve}}（解决）掉——不是抓一个副手，是让这套结构没办法再被用第二次。这类案子{{rare}}（罕见的）的地方从来不是有人违规，而是每一步看上去都合规。设计它的人很{{smart}}（聪明的），聪明到用一种极其体面的{{fashion}}（方式），把风险一层一层放到别人身上。\n\n晚上她把那张纸又读了一遍。四条里，分量最{{grand}}（重大的）的是最后一条：家人先走。\n\n写下这一条的人，不是在谈判。他是在害怕。","ft":[{"w":"Foreign Corrupt Practices Act","z":"反海外腐败法","d":"美国禁止向外国官员行贿并要求保持真实账簿的法律","a":"FCPA","p":""},{"w":"Securities and Futures Commission","z":"香港证监会","d":"香港证券期货市场的法定监管机构，负责发牌、调查与执法","a":"SFC","p":""},{"w":"chief compliance officer","z":"首席合规官","d":"对机构合规体系负总责并直接对董事会汇报的高管","a":"CCO","p":""},{"w":"cooperating witness","z":"污点证人；配合证人","d":"为换取减刑而指证他人的涉案人员，常是执法突破口","a":"","p":""},{"w":"document request","z":"文件调取要求","d":"监管或检方要求提供指定期间往来邮件与记录的书面通知","a":"","p":""},{"w":"immunity deal","z":"豁免协议","d":"检方承诺不追究以换取当事人如实作证的协议","a":"","p":""},{"w":"lead plaintiff","z":"首席原告","d":"集体诉讼中获法院指定代表全体成员主导案件的原告","a":"","p":""},{"w":"notifiable transaction","z":"须予公布的交易","d":"达到规模测试门槛因而必须公告的收购或出售事项","a":"","p":""},{"w":"prejudgment interest","z":"判决前利息","d":"对违法所得从获利日起计算的利息，随退赔一并追缴","a":"","p":""},{"w":"restricted list","z":"限制名单","d":"因存在利益冲突而禁止自营与员工买卖并暂停发布研究的名单","a":"","p":""},{"w":"settlement","z":"和解","d":"当事人与监管或原告达成协议了结案件，避免继续诉讼","a":"","p":"'setlmәnt"},{"w":"undertaking","z":"承诺；具结","d":"当事人向监管作出的书面保证，违反可另行追责","a":"","p":".ʌndә'teikiŋ"}],"iw":[{"w":"ancient","p":"'einʃәnt","t":"a. 古代的, 古老的, 年老的, 旧的"},{"w":"request","p":"ri'kwest","t":"n. 请求, 需要, 申请书; vt. 请求, 要求, 邀请; 请求"},{"w":"gender","p":"'dʒendә","t":"n. 性; vt. 产生"},{"w":"solve","p":"sɒlv","t":"vt. 解决, 付给, 溶解; vt. 求解; vi. 求解; 求解"},{"w":"deputy","p":"'depjuti","t":"n. 副手，代理人"},{"w":"landscape","p":"'lændskeip","t":"n. 风景, 山水, 风景画; vi. 从事景观美化; vt. 美化...景观; 横向"},{"w":"rare","p":"rєә","t":"a. 稀罕的, 罕有的, 珍奇的, 稀薄的, 半熟的, 非常好的; adv. 非常"},{"w":"Australia","p":"ɒ'streiljә","t":"n. 澳洲, 澳大利亚"},{"w":"typical","p":"'tipikl","t":"a. 典型的, 象征性的; 典型的"},{"w":"elderly","p":"'eldәli","t":"a. 过了中年的, 稍老的"},{"w":"eliminate","p":"i'limineit","t":"vt. 除去, 排除, 剔除, 消除"},{"w":"host","p":"hәust","t":"n. 主人, 旅馆老板, 节目主持人; vt. 当主人招待, 作...节目主持人; 主机, 宿主机"},{"w":"observation","p":".ɒbzә:'veiʃәn","t":"n. 观察, 注意, 观测, 观察力; 观察"},{"w":"ocean","p":"'әuʃәn","t":"n. 海洋, 广阔, 许多, 一大片; 海洋, 海"},{"w":"creation","p":"kri:'eiʃәn","t":"n. 创造, 创作物, 发明; 产生"},{"w":"regime","p":"rei'ʒi:m","t":"n. 政权, 当权期间, 政体, 社会制度, 体制, 情态; 制度, 生活制度"},{"w":"attach","p":"ә'tætʃ","t":"vt. 附上, 使依附, 使附属, 使喜爱, 系, 缚; vi. 附属, 归属, 联系在一起; 挂接服务器命令, 关联, 挂接, 附加"},{"w":"grand","p":"grænd","t":"a. 庄重的, 壮观的, 显赫的, 重大的, 最高的, 雄伟的, 宏大的, 豪华的, 傲慢的; 重大的, 主要的, 伟大的"},{"w":"fashion","p":"'fæʃәn","t":"n. 流行, 风尚, 时样; vt. 形成, 造, 作"},{"w":"smart","p":"smɑ:t","t":"a. 聪明的, 漂亮的, 刺痛的, 剧烈的, 敏捷的, 巧妙的, 伶俐的, 潇洒的; n. 刺痛, 痛苦; vi. 刺痛"}],"doc":{"k":"认罪与豁免协议条款草案","en":"Subject to execution, this immunity deal is offered to the individual identified in Annex B, presently serving as deputy to the chief compliance officer. The individual shall appear as a cooperating witness, shall respond in full to any document request served by this Office or by the Securities and Futures Commission, and shall not be charged under the Foreign Corrupt Practices Act in respect of the disclosed conduct. The individual will identify each instance in which a name was added to the restricted list and each acquisition announced as a notifiable transaction. Nothing in this instrument limits any civil settlement, any award of prejudgment interest, or the standing of the lead plaintiff. The individual gives an undertaking to preserve all records.","zh":"在签署生效的前提下，本豁免协议向附件二所列个人提出，该人现任首席合规官之副手。该人应以配合证人身份出庭作证，应对本办公室或香港证监会送达的任何文件调取要求作出完整回应，并且就其所披露的行为不会依据反海外腐败法受到指控。该人将逐一指认每一次将标的加入限制名单的情形，以及每一宗以须予公布的交易形式公告的收购。本文件的任何内容均不限制任何民事和解、任何判决前利息的裁定，亦不影响首席原告的诉讼地位。该人就保全全部记录作出承诺。"}},{"i":29,"ti":"下午两点四十，港交所的问询函挂上了网","dom":"reg","sc":"交易所问询","tx":"香港时间下午两点四十，中环下着那种下不大的雨。Danny 在交易台那头站起来喊我名字时，我正在重算这家公司的应收账款周转天数。\n\n“上了，”他说，“港交所的函。”\n\n我点开交易所网站。信挂在公告栏里，标题平得像白开水：有关本公司若干财务资料之查询。八个问题。第三条问应收账款账龄和前五大客户的回款；第七条最狠，问公司是否知悉任何构成内幕消息而尚未披露的事项。\n\nDanny 在背后念出声，念到第七条停住：“这条是留后路的。”对——以后真出事，交易所可以说，我问过了。\n\n整封信没出现“怀疑”，全是“请解释”和“请提供依据”。这是个聪明的{{mechanism}}（机制）：交易所不做事实认定，只把问题摆上桌，看你怎么答；答不好，市场自己给答案——{{external}}（外部的）压力最省力的用法。\n\nRay 靠在门框上听了会儿，问了两个问题。第一个：会不会停牌。我说不一定，港股停牌多半是公司自己申请的，理由写“以待刊发内幕消息公告”；停下之后，什么时候{{resumption of trading}}（复牌）就不由公司说了算。第二个：把美国那条线翻一遍。\n\n我翻了。那家在美国上市的下游客户，三天前有位董事提交{{Form 4}}（董监高持股变动报告），卖了不到两万股，数字小得{{somewhat}}（多少有点）刻意——刚好避开{{short-swing profit rule}}（短线交易归入权规则）的六个月窗口。同一天有财经媒体报了句没信源的话：{{U.S. Attorney's Office}}（联邦检察官办公室）在了解一批以中国应收账款为底层的票据。没下文。\n\nRay 说，这个{{topic}}（话题）先别在群里聊。\n\n我明白：Zenith 是{{licensed corporation}}（持牌法团），对外的东西都要过合规，而我们手上是空头。别人{{accuse}}（指控）我们太容易：说我们{{churning}}（过度交易）刷成交，说我们联手{{cornering the market}}（逼仓）。这类指控在香港走民事程序，只需{{preponderance of the evidence}}（优势证据标准）——不必证到无可置疑，只要显得可能性更大。这就是刑事和民事之间那道{{distinction}}（区别）。\n\n“主经纪商上周做了{{enhanced due diligence}}（强化尽职调查），”Danny 说，“十七个问题，六个问这票。”\n\n上次有家基金栽在类似的事上，和解条件里塞了个{{independent compliance monitor}}（独立合规监督人）：外人坐进你办公室看三年。\n\nRay 让所有人从今天起什么都不许删。删了就不是市场行为，是{{obstruction of justice}}（妨碍司法）。他语气很轻，没人吭声。\n\n晚上九点二十，公司发了份{{voluntary announcement}}（自愿性公告）：董事会确认业务营运一切正常，生产、交付与员工{{welfare}}（福利）安排均未受影响，将适时回复。三百字，客气，什么也没说。\n\n我把那三百字打印出来，{{tear}}（撕）下一角当书签。盯着“一切正常”四个字：这也是一种{{marketing}}（营销）。\n\n十一点，我把三年数据拉成一张图：收入、回款、开工率、那笔中资美元债的{{bond}}（债券）价格，再加一个自造的{{variable}}（变量）——应收账款从确认到收回的天数。四条线三条往下掉，只有收入这条{{mass}}（大量的）往上冲。\n\n我们的{{coverage}}（研究覆盖）里，这形状我只见过两次，结局都一样：有人在{{milk}}（榨取）这家公司，直到榨不出来。而市场对它的{{perception}}（观感）还停在“高成长”。\n\n最后我翻招股书。有一条关联方担保的{{clause}}（条款）我一直没读懂，绕得不自然，像被人特意{{engineer}}（设计）过；它不{{bind}}（约束）任何人，却把责任放到一个很奇怪的位置。\n\nDanny 收拾东西，忽然问：“万一将来真有人当上{{defendant}}（被告），会是谁？”\n\n我没答。我在想这封函的{{origin}}（起源）：是交易所自己看出来的，还是有人递了纸条。它只给公司五天。\n\n后来我才知道，这个问题问错了。他们不需要五天——他们要的时间，早在几个月前就花掉了。","ft":[{"w":"Form 4","z":"董监高持股变动报告","d":"美股内部人买卖本公司股票后须两个工作日内提交的申报","a":"","p":""},{"w":"U.S. Attorney's Office","z":"联邦检察官办公室","d":"各联邦司法辖区的检察机关，负责本区内证券欺诈等刑事起诉","a":"","p":""},{"w":"churning","z":"过度交易；炒单","d":"经纪商为赚取佣金而频繁买卖客户账户的违规行为","a":"","p":"'tʃә:niŋ"},{"w":"cornering the market","z":"逼仓；垄断市场","d":"控制大量筹码使对手方无法平仓从而操纵价格的行为","a":"","p":""},{"w":"enhanced due diligence","z":"强化尽职调查","d":"针对高风险客户采取的更严格身份与资金来源核查","a":"EDD","p":""},{"w":"independent compliance monitor","z":"独立合规监督人","d":"和解中由外部人士入驻企业监督整改执行的安排","a":"","p":""},{"w":"licensed corporation","z":"持牌法团","d":"获香港证监会发牌从事受规管活动的公司主体","a":"","p":""},{"w":"obstruction of justice","z":"妨碍司法","d":"销毁证据、串供或干扰调查的行为，本身即构成犯罪","a":"","p":"əbˈstrʌkʃən ʌv ˈdʒʌstɪs"},{"w":"preponderance of the evidence","z":"优势证据标准","d":"民事案件的证明标准，只需证明事实存在的可能性更大","a":"","p":""},{"w":"resumption of trading","z":"复牌","d":"停牌原因消除并满足条件后恢复股票交易","a":"","p":""},{"w":"short-swing profit rule","z":"短线交易归入权规则","d":"美股内部人六个月内反向交易所得利润须归还公司","a":"","p":""},{"w":"voluntary announcement","z":"自愿性公告","d":"非规则强制但公司主动披露的事项公告，常见于港股","a":"","p":""}],"iw":[{"w":"mass","p":"mæs","t":"n. 块, 大多数, 质量, 大量, 群众, 弥撒; a. 群众的, 大规模的, 整个的; vt. 使集合, 集中; vi. 聚集"},{"w":"topic","p":"'tɒpik","t":"n. 主题, 论题, 话题"},{"w":"tear","p":"tiә. tєә","t":"n. 泪滴, 眼泪, 撕, 扯, 裂缝, 激怒, 飞奔; vi. 流泪, 撕破, 赶快, 飞奔, 被撕破; vt. 撕裂, 戳破, 拉掉, 撕掉, 使分裂, 使精神不安, 折磨"},{"w":"variable","p":"'vєәriәbl","t":"n. 易变的事物, 变数, 可变物, 变量; a. 可变的, 不定的, 易变的, 变量的; 变量"},{"w":"distinction","p":"dis'tiŋkʃәn","t":"n. 区别"},{"w":"perception","p":"pә'sepʃәn","t":"n. 知觉, 感觉, 领悟力, 获取; 知觉"},{"w":"mechanism","p":"'mekәnizm","t":"n. 机械, 机构, 结构, 机理, 技巧; 机理; 历程; 机构"},{"w":"external","p":"ik'stә:nl","t":"n. 外部, 外面; a. 外部的, 客观的, 表面的"},{"w":"clause","p":"klɒ:z","t":"n. 子句, 条款; 子句"},{"w":"marketing","p":"'mɑ:kitiŋ","t":"n. 行销, 买卖; 推销, 在市场买卖, 销售"},{"w":"defendant","p":"di'fendәnt","t":"n. 被告; 被告方"},{"w":"coverage","p":"'kʌvәridʒ","t":"n. 覆盖的范围, 保险总额, 新闻报导; 可达范围; 覆盖度"},{"w":"bond","p":"bɒnd","t":"n. 捆绑物, 结合, 债券, 契约, 粘合剂, 保证人, 键, 关栈保留; vt. 存入关栈, 使黏合; vi. 结合"},{"w":"milk","p":"milk","t":"n. 奶, 乳状物; vt. 挤乳, 榨取; vi. 产乳"},{"w":"welfare","p":"'welfєә","t":"n. 福利, 安宁, 幸福, 福利事业; a. 福利的"},{"w":"bind","p":"baind","t":"vt. 绑, 约束, 装订, 包扎, 使结合; vi. 凝固, 有约束力; 赋值, 绑定"},{"w":"engineer","p":".endʒi'niә","t":"n. 工程师, 工兵; vt. 设计, 监造, 精明地处理, 策划"},{"w":"accuse","p":"ә'kju:z","t":"vt. 指责, 控告, 归咎于; vi. 指责, 控告"},{"w":"somewhat","p":"'sʌmhwɒt","t":"n. 某物, 几分; adv. 多少, 几分"},{"w":"origin","p":"'ɒridʒin","t":"n. 起源, 起因, 出身, 开端; 原点; 起始地址; 信件来源的相关数据"}],"doc":{"k":"交易所问询函段落","en":"The Exchange refers to the voluntary announcement published by the Company and to recent movements in the price and turnover of its shares. Please provide the ageing profile of trade receivables, the settlement record of the five largest customers, and details of the enhanced due diligence performed before credit was extended to them. Please state whether any director has filed a Form 4 in any overseas market and whether any dealing would fall within the short-swing profit rule. Please confirm that no licensed corporation acting for the Company has engaged in churning or in cornering the market in its shares, and that no conduct amounting to obstruction of justice has occurred. A reply is required within five business days; any resumption of trading may be subject to conditions.","zh":"本交易所兹提述贵公司刊发的自愿性公告，以及贵公司股份价格及成交量近期的变动。请提供贸易应收款项的账龄结构、前五大客户的回款记录，以及在向该等客户授予信用之前所进行的强化尽职调查详情。请说明是否有任何董事曾在任何境外市场提交董监高持股变动报告，以及是否有任何买卖将落入短线交易归入权规则的范围。请确认并无任何为贵公司行事的持牌法团就贵公司股份从事过度交易或逼仓行为，亦无发生任何构成妨碍司法的行为。回复须于五个营业日内提交；任何复牌均可能须附带条件。"}},{"i":30,"ti":"四十一页，漂亮得不像五天写出来的","dom":"reg","sc":"停牌与信息披露","tx":"回复公告晚上十一点二十挂上网，我还在办公室。窗外雨开始{{pour}}（倾泻），中环那栋顶上带灯冠的大楼，雨里看着像座{{palace}}（宫殿）。\n\n四十一页。\n\n第一反应是不对劲。五个营业日写四十一页，还附了三十七个附件——{{accompany}}（随附）的文件从出货单、报关单排到第三方检测报告，编号连贯，页脚统一。我从头读到尾，两个半小时。\n\n它逐条{{cite}}（引用）依据。问账龄，给按订单的明细，附{{contemporary}}（当时的）签收单，日期和物流轨迹对得上；问回款，列每笔流水。问是否知悉未披露事项，答得极漂亮：董事会已作合理查询，确认不存在任何构成{{price-sensitive information}}（股价敏感信息）的未披露事项。\n\n它还主动{{exclude}}（排除）一个我们根本没问的风险：公司及附属公司均不在任何{{entity list}}（实体清单）上，境外销售不受出口管制影响；又补一句，上市当年已完成{{overseas listing filing}}（境外上市备案），文号在附件二十九。问到客户，它贴了三页{{customer due diligence}}（客户尽职调查）流程图，比很多银行还规范。\n\n读到最后我坐不住了，把椅子往后推，腿{{stretch}}（伸展）开，盯着天花板。不是它答得对，是它答得太对了。\n\n一份好的回函不该长这样。真被问到的公司语气总有点毛边：某条说“正在核实”，某条说“将于稍后补充”。这份没有。四十一页，语气{{constant}}（不变的），从头到尾一个温度，像早排好版、只等填函件编号的文件。\n\n我给老周发消息：一家公司要多久才准备得出这么一份东西？\n\n二十分钟后他回：不是准备，是预演；预演过的人知道会被问哪八个问题。\n\n我背后凉了一下。\n\n第二天早上 Danny 拿咖啡进来说盘口怪：开盘半小时，买一挂了十几万股，价格一动就撤，反复七八次。他问是不是{{spoofing}}（幌骗）。我说别猜，截图存下来——不做判断，只留证据。\n\nRay 让合规当天发了{{litigation hold}}（证据保全通知）到全所邮箱：与这只票相关的记录不得删除、覆盖或修改。他还说了件旧事：五年前他被{{wall crossing}}（越过隔离墙）过一次，投行让他签保密文件、纳入限制名单，结果交易黄了，白锁三个月。“知道得早不一定是好事。”\n\n十点，海外媒体出了条短讯：一家美国上市的下游客户提交{{Form 8-K}}（重大事项临时报告），披露收到监管问询；市场传言另一家机构收到{{Wells notice}}（韦尔斯通知）。传言而已，没有{{indictment}}（起诉书），也没有正式的{{intervention}}（干预）。\n\n但股价那天涨了 4%。\n\n我第一次认真想：如果这东西真的滴水不漏，我该怎么办。\n\n我手上全是{{circumstantial evidence}}（间接证据）：用电量、招工、卫星图、供应链倒推，单看每条都能被解释掉。要证明它假，得有内部的人；而那个人一旦开口，等着他的是{{retaliation}}（打击报复），不是{{hero}}（英雄）的待遇。这份{{liability}}（责任）太重。\n\nRay 问我要不要{{withdraw}}（撤回）一部分仓位。他说得平静：市场对这份回函的反应会很{{severe}}（严厉的），空头这几天不好过。\n\n我说不。\n\n不是我{{oppose}}（反对）风控，也不是我想当那个{{champion}}（拥护者）。是因为我知道一件他不知道的事：那四十一页里，有个附件的日期比它回应的那个问题早了四个月。\n\n我本该马上告诉他，但那晚我没说。我下楼买了盒{{vegetable}}（蔬菜）沙拉，坐在大堂，把那个日期抄进备忘录，抄了三遍。\n\n{{hence}}（因此）我确信：他们不是在回答问题，是在核对一份早就写好的答案。\n\nDanny 在群里发了张照片，西贡某个{{beach}}（海滩）的日落，配文“周末快乐”。我看了眼时间：凌晨一点四十。\n\n这是我们做空这只票的第一百零三天。距离股价冲到{{height}}（顶点）还有六周，距离停牌还有四个月。而{{ideal}}（理想的）结局——真相自己走出来那种——我一次都没见过。","ft":[{"w":"Form 8-K","z":"重大事项临时报告","d":"美股公司发生重大事件时须在数个工作日内提交的临时公告","a":"","p":""},{"w":"Wells notice","z":"韦尔斯通知","d":"证监会告知拟提起指控并给予当事人书面申辩机会的通知","a":"","p":""},{"w":"circumstantial evidence","z":"间接证据","d":"不能直接证明事实但可推断结论的证据，内幕交易案常用","a":"","p":""},{"w":"customer due diligence","z":"客户尽职调查","d":"对客户身份、资金来源与交易目的进行核查的合规流程","a":"CDD","p":""},{"w":"entity list","z":"实体清单","d":"美国限制向其出口特定技术与产品的受限主体名单","a":"","p":""},{"w":"indictment","z":"起诉书；刑事指控","d":"检方正式提出刑事控罪的法律文件，标志案件进入诉讼","a":"","p":"in'daitmәnt"},{"w":"litigation hold","z":"证据保全通知","d":"预见诉讼或调查时要求停止销毁相关文件的内部指令","a":"","p":""},{"w":"overseas listing filing","z":"境外上市备案","d":"内地企业赴境外发行上市须向证监会履行的备案程序","a":"","p":""},{"w":"price-sensitive information","z":"股价敏感信息","d":"一旦公开即可能显著影响股价的信息，须及时对外披露","a":"","p":""},{"w":"retaliation","z":"打击报复","d":"对举报人实施解雇或降职等报复，本身构成违法","a":"","p":"ri.tæli'eiʃәn"},{"w":"spoofing","z":"幌骗","d":"挂出无意成交的大单诱导他人跟随后迅速撤单的操纵手法","a":"","p":""},{"w":"wall crossing","z":"越过隔离墙","d":"经合规批准让特定人员接触内幕信息并纳入保密限制的程序","a":"","p":""}],"iw":[{"w":"pour","p":"pɒ:","t":"n. 流出, 倾泻, 骤雨; vt. 倒, 灌, 注, 倾泻, 诉说, 倾吐; vi. 倾泻, 蜂涌而来, 下大雨"},{"w":"beach","p":"bi:tʃ","t":"n. 海滩"},{"w":"accompany","p":"ә'kʌmpәni","t":"vt. 陪伴, 伴随, 补充, 为...伴奏; vi. 伴奏, 伴唱"},{"w":"hence","p":"hens","t":"adv. 因此, 从此"},{"w":"liability","p":"laiә'biliti","t":"n. 责任, 债务, 倾向; 责任, 义务, 负债"},{"w":"hero","p":"'hiәrәu","t":"n. 英雄, 超越常人者, 男主角"},{"w":"height","p":"hait","t":"n. 高度, 海拔, 高地, 顶点; 高度"},{"w":"constant","p":"'kɒnstәnt","t":"n. 常数, 恒量; a. 不变的, 一定的, 时常的; 常量; 常数; 恒值"},{"w":"stretch","p":"stretʃ","t":"n. 伸展, 张开, 连绵, 一段路, 一段时间; a. 可伸缩的, 弹性的; vt. 伸展, 张开, 曲解, 使过度伸展; vi. 伸展, 延伸; 伸展"},{"w":"ideal","p":"ai'diәl","t":"n. 理想, 典范, 观念, 思想, 最后目标; a. 理想的, 完美的, 空想的, 观念的, 唯心论的"},{"w":"withdraw","p":"wið'drɒ:","t":"vt. 撤回, 取回, 撤消, 使撤退, 拉开, 移开; vi. 撤退, 离开"},{"w":"severe","p":"si'viә","t":"a. 严格的, 尖锐的, 严肃的, 严重的, 严厉的, 朴素的; 严厉的, 苛刻的, 严重的"},{"w":"intervention","p":".intә'venʃәn","t":"n. 插入, 介入, 调停; 干预"},{"w":"cite","p":"sait","t":"vt. 引用, 引证, 表彰; 引证, 指引"},{"w":"vegetable","p":"'vedʒәtәbl","t":"n. 蔬菜, 植物, 无精打采之人; a. 蔬菜的, 植物的"},{"w":"palace","p":"'pælis","t":"n. 宫, 宫殿, 华丽大厦"},{"w":"champion","p":"'tʃæmpiәn","t":"n. 冠军, 拥护者, 战士; vt. 保卫, 拥护; a. 优胜的"},{"w":"exclude","p":"iks'klu:d","t":"vt. 除外, 排除, 排斥; 除外(诊断)"},{"w":"oppose","p":"ә'pәuz","t":"vt. 反对, 以...对抗, 抗争; vi. 反对"},{"w":"contemporary","p":"kәn'tempәrәri","t":"n. 同时代的人; a. 同时代的, 属于同一时期的"}],"doc":{"k":"上市公司回复公告摘录","en":"The Board refers to the Exchange's enquiry letter and responds as follows. Having made reasonable enquiry, the Board confirms that there exists no matter constituting price-sensitive information which has not been disclosed. Contemporary delivery records, bank confirmations and the Company's customer due diligence files are annexed. Neither the Company nor any subsidiary appears on any entity list, and the overseas listing filing was completed prior to admission. No Wells notice, indictment or comparable proceeding has been received by the Company. A litigation hold has been implemented across all business units, and the Company has instructed staff that any retaliation against an employee who reports a concern is prohibited. The Board is not aware of any spoofing or wall crossing in respect of its securities.","zh":"董事会兹提述联交所的问询函，并回应如下。经作出合理查询后，董事会确认，并不存在任何构成股价敏感信息而尚未披露的事项。当时的签收记录、银行回单及本公司的客户尽职调查档案已随附于后。本公司及任何附属公司均未列入任何实体清单，且境外上市备案已于上市前完成。本公司并未收到任何韦尔斯通知、起诉书或类似程序文件。本公司已在全部业务单元实施证据保全通知，并已指示员工：严禁对提出关切的员工实施任何打击报复。董事会并不知悉就本公司证券存在任何幌骗或越过隔离墙的情形。"}},{"i":31,"ti":"一万两千笔，没有一笔她听说过","dom":"derivatives","sc":"结构化产品","tx":"发行文件四百一十页，Elena 从最后一页开始读。\n\n{{Wednesday}}（星期三）早上七点，传票要的东西到齐。整摞纸{{occupy}}（占据）了整张会议桌，前三百多页是律师写的，滴水不漏；她要的在附录 C：资产明细表，一万两千行。\n\n每行都一样：债务人代码、省份、发票开出日期、金额、约定收款日，没有公司名。她挑三行去查：一家江西的零部件厂；一家紧挨着货运{{rail}}（铁路）线、卫星图上{{barely}}（几乎不）看得清门牌；一家给锂{{mine}}（矿）供设备。一万两千笔，没有一笔她听说过。\n\n她走到白板前画：中间一个方框写\"开曼\"，左边一万两千笔应收账款进去，右边票据出来。票据不是一张，是切成几层的——最上面那层{{senior tranche}}（优先档）先拿钱，最下面那层{{equity tranche}}（权益档）最后拿钱、最先赔钱，中间靠{{subordination}}（劣后安排）撑着。钱从上往下流，损失从下往上啃。\n\n调查员 Dale Ruiz 靠在门框上看。他六十岁，2007 年办过一年次贷案子。他说当年至少还有{{ABX index}}（ABX 指数），一条公开的价格线，谁都看得见那些证券在往下掉；这次没有，价格只存在于发行人自己的估值表里。当年最疯的时候有{{NINJA loan}}（无收入无工作无资产贷款）；这次的底层不是穷人，是发票——发票不会失业，只会被人开出来。\n\n评级那节写着，发行人\"依据市场{{convention}}（惯例）\"选定两家机构出评级。Dale 笑了一声：人话就是{{ratings shopping}}（评级选购），谁给的分高用谁。那个违约模型出自某大学一个{{faculty}}（院系）十五年前的论文。\n\n底层收人民币，票据付美元，所以载体签了一笔{{cross-currency swap}}（货币互换）换汇，又签了一笔{{forward rate agreement}}（远期利率协议）锁利率。两笔都在{{over-the-counter}}（场外交易）市场做的，没走{{central counterparty}}（中央对手方），双方之间只有一份{{netting}}（净额结算）协议把几十笔头寸轧成一个净数，再交一笔{{initial margin}}（初始保证金）。\n\n她让助理往上查一层互换的对手方。答复回来时她放下了笔：那家香港机构的母公司，和一万两千张发票里出现最多的那个买方，是同一个集团。\n\n这有名字，叫{{wrong-way risk}}（错向风险）——底层烂掉的那天，恰好是替你换汇的人还不出钱的那天。不是两件事，是同一件事。\n\n还有一层她一开始没看懂：B 档嵌着一个{{barrier option}}（障碍期权），累计损失一碰某个水平，条款立刻改变。香港的联络人举了个更直白的例子：牛熊证有{{mandatory call event}}（强制收回事件），一触收回价当场终止，剩下的可能一分不值。这不是{{switch}}（开关）慢慢下滑，是啪的一声。\n\n附录 F 里，载体还自己滚动持有期货。那两年市场处在{{contango}}（期货升水），远月比近月贵，每次展期都贴钱，两年贴掉七位数——钱不多，但这不是个被动收发票的空壳。\n\n扫描件{{resolution}}（分辨率）很低，有几行糊成一团，但最后一页看得清：{{equity tranche}}（权益档）的登记持有人只有一个开曼名字，下面一行小字——该持有人已通过一笔{{total return swap}}（总收益互换），把全部经济收益让渡给一名未具名第三方。\n\n真正拿走这一档收益和风险的人，名字不在任何一页纸上。\n\n她跟助理{{emphasize}}（强调）：先画完结构，别急着找人。这堆纸不足以{{justify}}（证明…有理由）搜查，更撑不起{{criminal}}（刑事的）指控；她需要能坐上证人席的{{witness}}（证人）。那笔货币互换的对手方，是眼下最强的{{signal}}（信号）。\n\n她把三天来的午餐{{diet}}（日常饮食）——自动售货机的苏打饼干——扫进垃圾桶，补了两行。一：收款日和实际到账的{{gap}}（缺口），谁在填？二：把一万两千张发票变成一张能卖给养老金的纸，本身是项{{achievement}}（成就）；规模{{enormous}}（巨大的），干净耐用——它不是权宜之计，是被当成{{permanent}}（永久的）安排造的。\n\n而且它有前科：两年前有过一只几乎一样的票据，路演到一半{{abortion}}（夭折）了。Elena 想知道，那次是谁喊的停。","ft":[{"w":"ABX index","z":"ABX 指数","d":"跟踪次级按揭证券价格的指数，当年做空次贷的公开标尺","a":"","p":""},{"w":"NINJA loan","z":"无收入无工作无资产贷款","d":"没收入没工作没资产也能批的贷款，次贷疯狂期的产物","a":"","p":""},{"w":"barrier option","z":"障碍期权","d":"价格触碰约定水平后生效或失效的期权，结构化产品的常用件","a":"","p":""},{"w":"central counterparty","z":"中央对手方","d":"介入买卖双方之间承担履约责任的清算机构","a":"CCP","p":""},{"w":"contango","z":"期货升水","d":"远月合约价格高于近月，展期时会持续损耗收益","a":"","p":"kәn'tæŋgәu"},{"w":"cross-currency swap","z":"货币互换","d":"交换不同币种本息现金流，用来管理外币融资成本","a":"","p":""},{"w":"equity tranche","z":"权益档；劣后档","d":"最后受偿、最先承担损失的层级，也叫第一损失档","a":"","p":""},{"w":"forward rate agreement","z":"远期利率协议","d":"锁定未来某段期间利率水平的场外合约","a":"FRA","p":""},{"w":"initial margin","z":"初始保证金","d":"开仓时必须存入的履约保证金，按合约风险计算","a":"IM","p":""},{"w":"mandatory call event","z":"强制收回事件","d":"牛熊证标的触及收回价即刻终止交易，剩余价值可能归零","a":"MCE","p":""},{"w":"netting","z":"净额结算","d":"把双方多笔头寸轧差成一个净敞口，大幅降低风险暴露","a":"","p":"'netiŋ"},{"w":"over-the-counter","z":"场外交易","d":"不通过交易所而由双方直接议价成交的市场","a":"OTC","p":"'әuvәðә'kauntә"},{"w":"ratings shopping","z":"评级选购","d":"发行人挑给分最高的机构出评级，是评级虚高的重要成因","a":"","p":""},{"w":"senior tranche","z":"优先档","d":"最先获得偿付的层级，评级最高但票息最低","a":"","p":""},{"w":"subordination","z":"次级安排；劣后","d":"下层为上层承担先行损失，是结构化增信的基本手段","a":"","p":"sә.bɒ:di'neiʃәn"},{"w":"total return swap","z":"总收益互换","d":"一方支付资产全部收益，另一方付融资成本，常用于加杠杆","a":"TRS","p":""},{"w":"wrong-way risk","z":"错向风险","d":"对手违约概率恰好与敞口同向上升，危机中最要命的组合","a":"","p":""}],"iw":[{"w":"convention","p":"kәn'venʃәn","t":"n. 大会, 协定, 惯例, 约定; 约定"},{"w":"switch","p":"switʃ","t":"n. 开关, 电闸, 转换, 软枝, 鞭子, 道岔; vt. 转变, 切换, 摆动, 转换, 使转轨; vi. 转换, 变换, 摆动; 开关; 翻转; 转移"},{"w":"criminal","p":"'kriminәl","t":"n. 罪犯, 犯人, 刑事; a. 犯了罪的, 刑事的, 有罪的"},{"w":"justify","p":"'dʒʌstifai","t":"vt. 替...辩护, 证明; vi. 证明合法; 段落重排, 两端对齐"},{"w":"signal","p":"'signl","t":"n. 信号, 暗号, 近因, 导火线; vt. 向...作信号, 标志, 用信号通知; vi. 发信号; a. 作为信号的, 显著的; 信号"},{"w":"rail","p":"reil","t":"n. 横杆, 围栏, 栏杆, 铁轨, 扶手, 秧鸡; vt. 以横木围栏, 给...铺铁轨; vi. 责骂, 抱怨"},{"w":"diet","p":"'daiәt","t":"n. 日常饮食, 议会; vt. 照规定饮食; vi. 忌食"},{"w":"resolution","p":".rezә'lu:ʃәn","t":"n. 解析, 决心, 坚定, 决定, 决议, 消除, 解答, 分解; n. 图形分辨率; 图形分辨率"},{"w":"abortion","p":"ә'bɒ:ʃәn","t":"n. 流产, 堕胎, 失败, 夭折, 中止; 流产, 小产; 顿挫"},{"w":"witness","p":"'witnis","t":"n. 证人, 目击者, 证据, 证词; vt. 目击, 作证, 证明, 表明; vi. 作证人, 作为证据"},{"w":"mine","p":"main","t":"n. 矿, 矿藏, 地雷; vt. 挖掘, 开采, 在...布雷, 破坏; vi. 开矿, 埋设地雷; pron. 我的"},{"w":"barely","p":"'bєәli","t":"adv. 几乎不"},{"w":"emphasize","p":"'emfәsaiz","t":"vt. 强调, 加强语气, 着重"},{"w":"achievement","p":"ә'tʃi:vmәnt","t":"n. 完成, 成就, 功业"},{"w":"Wednesday","p":"'wenzdi","t":"n. 星期三"},{"w":"faculty","p":"'fækәlti","t":"n. 才能, 能力, 全体教员, (大学的)系; 能力, 院系"},{"w":"gap","p":"gæp","t":"n. 缝隙, 缺口, 间断, 间距, 通用汇编程序; vt. 打开缺口, 造成缝隙; vi. 豁开; 通用汇编程序, 图形应用程序, 间距"},{"w":"occupy","p":"'ɒkjupai","t":"vt. 占领, 占(时间、空间等), 住进, 担任, 使从事, 使全神贯注; 占领, 占据, 占有"},{"w":"permanent","p":"'pә:mәnәnt","t":"a. 永久的, 不变的, 固定的, 持久的; n. 烫发; 永久的"},{"w":"enormous","p":"i'nɒ:mәs","t":"a. 巨大的, 庞大的"}],"doc":{"k":"结构化产品发行文件的条款说明","en":"Priority of Payments. On each Payment Date, available funds shall be applied first to the Class A Notes, being the senior tranche, then to the Class B Notes, and finally to the equity tranche, which absorbs first losses by way of subordination. The Issuer has entered into a cross-currency swap and a forward rate agreement with the Hedge Counterparty. Both transactions are documented over-the-counter, are not cleared through a central counterparty, and are subject to netting under the Master Agreement, against which the Issuer has posted initial margin. Upon a mandatory call event, the affected Class shall terminate immediately and may return no value. Noteholders are advised that economic interests in the equity tranche have been transferred by way of a total return swap.","zh":"偿付顺序。于每个付款日，可用资金应首先支付 A 类票据（即优先档），其次支付 B 类票据，最后支付权益档；权益档以劣后安排的方式承担第一顺位损失。发行人已与对冲交易对手签订一笔货币互换及一笔远期利率协议。上述两笔交易均以场外交易方式订立，未通过中央对手方进行清算，并适用主协议项下的净额结算安排，发行人已就此缴纳初始保证金。一旦发生强制收回事件，相关类别票据将立即终止，并可能不返还任何价值。谨提请票据持有人注意，权益档项下的经济权益已通过一笔总收益互换予以转让。"}},{"i":32,"ti":"优先档拿到 AA，签字的人在西班牙度假","dom":"derivatives","sc":"分层与评级","tx":"优先档拿到了 AA，而在评级报告上签字的那个人，当时人在{{Spain}}（西班牙）度假。\n\n冯启邦四十六岁，在香港卖了十二年结构化产品，两年前离开行业，现在在一家{{charity}}（慈善机构）挂闲职。他自带{{breakfast}}（早餐）来，一杯加{{cream}}（奶油）的咖啡；办公室的咖啡他{{decline}}（婉拒）了。他把{{hat}}（帽子）摘下放桌上，转椅的{{wheel}}（轮子）滚了半米。\n\nElena 翻到分层那页。票据切成三档：A 档占七成八，评级 AA；B 档一成四；剩下八个点是最底下那档，没有评级。她问得很直接——一万两千笔中国中小企业的应收账款，凭什么最上面那七成八能拿 AA。\n\n冯启邦点了点表里的一{{column}}（列）：因为这一列。\n\n那一列叫{{default correlation}}（违约相关性），模型里填的是 0.05。\n\n他说分层本身没有魔法。{{tranche}}（分层）说白了就是排队，谁先拿钱谁后拿钱；{{overcollateralization}}（超额抵押）也不神秘——底层塞进十二亿五的资产，只发出去十亿票据，多出来的两亿五就是垫子，先赔它。真正{{crucial}}（决定性的）的只有那一个数：这一万两千个债务人，会不会同时出事。\n\n填 0.05，意思是几乎不会。理由写得漂亮：分散在十九个省、六个行业，单笔平均只占资产池的万分之零点八。\n\n\"把它改成 0.6，\"冯启邦说，\"A 档立刻从 AA 掉到 B。\"\n\nElena 问真实的数字是多少。他说不知道，但知道该往哪儿看：这一万两千张发票的付款方，一多半是同一个集团的下游，流动资金又几乎都来自同一家城商行的授信额度。他们不是十九个省的十九种命运，是一根绳子上的十九个结。相关性接近 1。\n\n\"所以不是模型算错了，\"他说，\"是有人把最{{massive}}（巨大的）一块风险，塞进了一个小数点后面。\"\n\n他讲起 2007 年的{{subprime mortgage}}（次级按揭贷款）：那时一个个借款人看着也互不相干，直到房价整体开始跌。Elena 没{{shock}}（震惊），只把那一格用红笔圈了起来。\n\n接下来一小时，他讲自己卖过的东西：给私行客户配{{equity-linked note}}（股票挂钩票据）；给做出口的老板做{{non-deliverable forward}}（无本金交割远期）对冲离岸人民币；给赌区间的客户开{{inline warrant}}（界内证）；算窝轮理论价，第一步永远是先看{{conversion ratio}}（换股比率）。也卖{{American option}}（美式期权），到期前哪天都能行权。他最不愿提{{accumulator}}（累计期权）——市场一跌，客户得按折扣价加倍买进，一路收{{margin call}}（追加保证金通知）；2008 年的{{complaint}}（投诉）信他见过几百封。\n\n但他强调了一个区别，Elena 觉得这才是他真正想说的。\n\n他卖的那些多数站在阳光底下：交易所里有{{futures contract}}（期货合约），每天有官方的{{settlement price}}（结算价），有{{clearing house}}（清算所）做登记和担保，{{basis}}（基差）会变但看得见，{{realized volatility}}（已实现波动率）你自己就能算。客户{{invest}}（投资）之前，至少查得到昨天收盘多少。\n\n那只票据什么都没有。它的价格{{via}}（经由）发行人自己的估值表产生，一个月一次，没人能复核。\n\nElena 问，那评级机构呢。\n\n冯启邦说了句她记了很久的话：评级机构的{{independence}}（独立性）不是被收买的，是被排班表磨掉的。同一个模型跑了六年，分析师的{{territory}}（业务区域）横跨三个时区，一年签几百单。轮到这一单时他在{{Spain}}（西班牙）休假，远程点了确认。\n\n\"你觉得{{odd}}（古怪的）吗？\"他说，\"我们那时候管这个叫效率。\"\n\n窗外那片人造{{grass}}（草坪）被雨打湿了，桌上一团没收好的{{cable}}（电缆）横在两人中间。Elena 问了最后一个问题：谁需要这个 AA？\n\n他说，不是买家需要，是买家的规矩需要。养老金和保险的投资守则白纸黑字写着只能买投资级。AA 不是判断，是通行证——你只要把资产{{expose}}（暴露）在正确的那个字母底下，钱自己会走过来。\n\nElena 写下当天的第二个问题：这张通行证，是谁去申请的。","ft":[{"w":"American option","z":"美式期权","d":"到期日之前任何时点都可以行权的期权","a":"","p":""},{"w":"accumulator","z":"累计期权","d":"按折扣价分期累计买入标的的场外合约，跌市里亏损会加倍","a":"","p":"ә'kju:mjuleitә"},{"w":"basis","z":"基差","d":"现货价与期货价之差，反映持有成本与市场情绪","a":"","p":"'beisis"},{"w":"clearing house","z":"清算所","d":"负责登记、轧差和担保交割的机构，管理保证金体系","a":"","p":""},{"w":"conversion ratio","z":"换股比率","d":"多少份窝轮对应一股正股，换算权证理论价格时必用","a":"","p":""},{"w":"default correlation","z":"违约相关性","d":"资产池内各笔贷款同时违约的相关程度，定价 CDO 的关键假设","a":"","p":""},{"w":"equity-linked note","z":"股票挂钩票据","d":"收益与个股表现挂钩的票据，香港私行客户的常见配置","a":"ELN","p":""},{"w":"futures contract","z":"期货合约","d":"在交易所标准化交易、每日盯市结算的远期买卖合约","a":"","p":""},{"w":"inline warrant","z":"界内证","d":"标的到期落在指定区间内即固定派付，港交所特有的品种","a":"","p":""},{"w":"margin call","z":"追加保证金通知；追保","d":"保证金不足时要求补钱的通知，不补就被强平","a":"","p":"ˈmɑ:dʒin kɔ:l"},{"w":"non-deliverable forward","z":"无本金交割远期","d":"到期只结算汇率差额的远期，离岸人民币常用","a":"NDF","p":""},{"w":"overcollateralization","z":"超额抵押","d":"抵押资产规模超过发行证券金额，用富余部分吸收损失","a":"OC","p":""},{"w":"realized volatility","z":"已实现波动率","d":"标的价格历史上实际的波动幅度，用来对照隐含波动率","a":"","p":""},{"w":"settlement price","z":"结算价","d":"交易所每日用来计算盈亏和保证金的官方价格","a":"","p":""},{"w":"subprime mortgage","z":"次级按揭贷款","d":"发放给信用记录较差借款人的住房贷款，违约率明显更高","a":"","p":""},{"w":"tranche","z":"分层；档次","d":"结构化产品按偿付顺序切分的层级，越优先的档评级越高、收益越低","a":"","p":"trɑ:nʃ"}],"iw":[{"w":"complaint","p":"kәm'pleint","t":"n. 诉苦, 抱怨, 控诉; 陈诉; 病"},{"w":"massive","p":"'mæsiv","t":"a. 大而重的, 宽大的, 宏伟的; 大块的, 整块的, 大量的"},{"w":"shock","p":"ʃɒk","t":"n. 震动, 冲突, 震惊, 冲击, 突击, 禾束堆, 休克, 长毛狗; vt. 使震动, 使休克, 使受电击, 震惊得; vi. 震动, 吓人; a. 蓬乱浓密的"},{"w":"wheel","p":"hwi:l","t":"n. 轮子, 车轮, 轮, 方向盘, 旋转, 机构, 重要人物; vt. 使旋转, 转动, 使转向; vi. 旋转, 转弯, 盘旋"},{"w":"decline","p":"di'klain","t":"n. 衰退, 跌落, 下降; vt. 使降低, 婉谢; vi. 下降, 衰落, 偏斜"},{"w":"invest","p":"in'vest","t":"vt. 投资, 花费, 笼罩, 授予; vi. 投资, 利用"},{"w":"odd","p":"ɒd","t":"a. 奇数的, 古怪的, 剩余的, 零散的, 各种各样的, 少量的; n. 奇特的事物, 怪人; 奇数, 奇校验, 光数据数字转换器"},{"w":"cable","p":"'keibl","t":"n. 电缆, 海底电报, 缆, 索; vi. 打海底电报; vt. 发海底电报, 缚住; 电缆"},{"w":"grass","p":"græs","t":"n. 草, 草原, 牧场; 草, 禾本"},{"w":"via","p":"vaiә","t":"prep. 经由, 经过, 通过; 病毒灭活剂"},{"w":"expose","p":"ik'spәuz","t":"vt. 使暴露, 使曝光, 揭穿, 陈列; 暴露, 露置"},{"w":"column","p":"'kɒlәm","t":"n. 专栏, 圆柱, 纵队, 列, 柱形物; 列, 柱形图"},{"w":"charity","p":"'tʃæriti","t":"n. 慈悲, 博爱, 慈善团体, 施舍; 宽大, 宽恕, 慈善机关"},{"w":"cream","p":"kri:m","t":"n. 乳酪, 奶油, 面霜; 乳油, 乳皮; 乳膏, 霜"},{"w":"territory","p":"'teritәri","t":"n. 领土, 领地, 版图, 地区, 活动范围; (推销员等的)推销区域"},{"w":"independence","p":".indi'pendәns","t":"n. 独立, 自立, 自主; 自主性, 独立性"},{"w":"crucial","p":"'kru:ʃәl","t":"a. 决定性的, 重要的, 严厉的; 十字形的; 决断的, 定局的"},{"w":"hat","p":"hæt","t":"n. 帽子; vt. 给...戴帽子"},{"w":"breakfast","p":"'brekfәst","t":"n. 早餐"},{"w":"Spain","p":"spein","t":"n. 西班牙"}],"doc":{"k":"评级报告摘要","en":"Rating Summary. We have assigned a preliminary AA (sf) rating to the Class A tranche and BBB (sf) to the Class B tranche of the Programme. Our analysis assumes a base-case default correlation of 0.05 across approximately 12,000 obligors and gives credit to 20 per cent overcollateralization. The methodology is adapted from the framework we apply to subprime mortgage pools, adjusted for short-dated trade receivables. Currency exposure is hedged bilaterally through a non-deliverable forward that is not novated to a clearing house, and no daily settlement price is published for the Notes, so realized volatility of the collateral is not observable. A material increase in correlation, or a margin call at the hedge provider, could produce a multi-notch downgrade.","zh":"评级摘要。我们已对本计划项下 A 类分层给予 AA（sf）初评，对 B 类分层给予 BBB（sf）初评。分析中假设约一万两千个债务人之间的基准违约相关性为 0.05，并认可 20% 的超额抵押所提供的信用增级。所用方法沿用我们评估次级按揭贷款资产池的框架，并针对短期应收账款作了调整。汇率敞口通过一笔无本金交割远期以双边方式对冲，该合约未转由清算所承接；本票据亦无每日公布的结算价，因此底层资产的已实现波动率无法观察。相关性若显著上升，或对冲交易对手遭遇追加保证金通知，均可能导致评级被连降数档。"}},{"i":33,"ti":"有人在这只票据上买了保护，量大得离谱","dom":"derivatives","sc":"信用违约互换","tx":"\"你自己看一眼这个数，\"Ray 把屏幕转过来，\"然后告诉我是不是我老了。\"\n\n晚上八点，中环，办公室只剩三个人。他指着报价单最右边那一栏：有人在那只票据上买了保护，量大得离谱。\n\nRay 说，合约挂的{{reference entity}}（参考实体）不是东亚新能源这家上市{{corporation}}（法人主体），是那个开曼载体和它发的票据本身。买保护的人赌的不是股价跌，是这堆发票收不回来。\n\n然后是量。所有报价加起来的{{notional amount}}（名义本金），是这只票据发行规模的三倍多。这道{{addition}}（加法）我做了三遍。\n\n\"三倍的意思是，\"Ray 说，\"至少三分之二背后没有真实债券。不需要{{physical delivery}}（实物交割），到期不用真把券交出来，赔钱就行——那是纯下注。\"\n\n我说也可能是有人在对冲。Ray 说对冲不会对冲到三倍。他把外套{{cast}}（甩）到椅背上：这不是有人跟我们想到一块儿了，是有人比我们早，早很多。\n\n我调出二十六个月的月报。{{delinquency rate}}（逾期率）一直是 0.3%，一个月都没动过；{{excess spread}}（超额利差）——资产池收息扣掉票息和费用后的那点缓冲——也稳得跟{{fundamental}}（基本面）该有的样子对不上。三个月前评级机构还给它做了一次{{upgrade}}（上调评级）。\n\n\"太干净了。\"我说。\n\nRay 说 2007 年他见过一模一样的干净。那时底层是{{adjustable-rate mortgage}}（浮动利率按揭），头两年利率低，逾期率漂亮得像广告；重设日一到，全国的逾期率同一个月一起{{sharp}}（急剧地）往上跳。那不是坏运气，是设计——底层什么时候开始烂，是被条款{{permit}}（允许）出来的。\n\n我们回头看自己的仓位。我们做空股票，别人做空票据，两样{{virtually}}（事实上）挂在同一条链上却不同步，中间隔着一层{{basis risk}}（基差风险）：票据先爆，股票可能还撑一个月。我们每天{{mark to market}}（盯市）的是股票，扛的却是另一头的时间。\n\nDanny 说，那就把{{underlying}}（标的）换掉，直接去做票据。\n\n不行。我们没那个牌照，基金合同里也没这一条。我们的{{boundary}}（边界）就在股票和港股衍生品这一格，真要碰那个市场，光{{licence}}（执照）就得重新申请，而且交易全在场外，{{counterparty risk}}（对手方风险）得自己扛。\n\nRay 说他一度想加个{{collar}}（领口策略）：买看跌、卖看涨，几乎零成本，把上下都锁住——但赢的那一半也锁没了。他把用{{Black-Scholes model}}（布莱克—斯科尔斯模型）反推的隐含波动率调给我看：价格里已经有人在下注；真到那天，{{gamma}}（伽马）会大到我们每小时都得调一次对冲。\n\n我问现在能确认什么。三件事。第一，这条{{yield curve}}（收益率曲线）——市场对未来利率和{{inflation}}（通货膨胀）的看法——解释不了这只票据的定价，除非有人认定它活不到到期。第二，载体自己签了{{interest rate swap}}（利率互换）和{{swaption}}（互换期权）对冲利率，请得起真正懂行的人。第三，那些保护头寸是三笔完成的，间隔不到六周，很{{unusual}}（罕见的）。\n\n老周晚上打电话来。他刚从{{physician}}（内科医师）那儿复诊回来，说明天回大学{{campus}}（校园）上课。我给他订了学校旁边的{{accommodation}}（住宿），顺口说了这事。\n\n他沉默一会儿，说：内地卖得最凶的{{snowball product}}（雪球产品）也有敲入敲出，买的人以为在收利息，其实是把尾巴卖掉了。结构从来不{{dominate}}（支配）市场，它只是把某些人的风险，安静地搬到另一些人身上。\n\nDanny 说这一定是某家宏观基金的常规{{transaction}}（交易）；我说不可能，这个规模、这个时点、这个标的，没人会当成常规。我们{{dispute}}（争论）了半小时，谁也没{{convince}}（说服）谁。Ray 最后把杯子放下：唯一的{{exception}}（例外）是——这个人知道我们不知道的东西。\n\n他父亲是四十年前来香港的{{immigrant}}（移民）。他常说：别人跑得比你快的时候，先别追，先想他是不是看过地图。\n\n我问能查到买保护的是谁吗。他说场外没有名单。然后补了一句：不用查，全世界一次能买这么多的，不超过五家。","ft":[{"w":"Black-Scholes model","z":"布莱克—斯科尔斯模型","d":"期权定价的经典模型，隐含波动率就是由它反推出来的","a":"","p":""},{"w":"adjustable-rate mortgage","z":"浮动利率按揭","d":"利率随基准定期重设的房贷，重设日是违约集中爆发点","a":"ARM","p":""},{"w":"basis risk","z":"基差风险","d":"对冲工具与被对冲资产走势不完全一致带来的残余风险","a":"","p":""},{"w":"collar","z":"领口策略","d":"买看跌加卖看涨，零成本锁定持仓的上下波动区间","a":"","p":"'kɒlә"},{"w":"counterparty risk","z":"对手方风险","d":"交易对手违约导致合约无法兑现的风险，场外交易的核心风险","a":"","p":""},{"w":"delinquency rate","z":"逾期率","d":"资产池中逾期未还贷款的比例，判断底层恶化的先行指标","a":"","p":""},{"w":"excess spread","z":"超额利差","d":"资产池利息收入扣掉票息和费用后的剩余，第一道缓冲","a":"","p":""},{"w":"gamma","z":"伽马","d":"德尔塔本身的变化速度，衡量对冲头寸需要调整的频率","a":"","p":"'^æmә"},{"w":"interest rate swap","z":"利率互换","d":"双方交换固定利率与浮动利率现金流的场外合约","a":"IRS","p":""},{"w":"mark to market","z":"盯市；按市值计价","d":"每日按市价重估头寸并结清盈亏，期货的核心机制","a":"","p":""},{"w":"notional amount","z":"名义本金","d":"计算衍生品现金流的基准金额，本身通常不需要交换","a":"notional","p":""},{"w":"physical delivery","z":"实物交割","d":"到期真正交付标的资产，商品期货和部分个股产品适用","a":"","p":""},{"w":"reference entity","z":"参考实体","d":"信用衍生品所挂钩的发债主体或资产池","a":"","p":""},{"w":"snowball product","z":"雪球产品","d":"带敲入敲出条款的自动赎回票据，内地卖得很多的挂钩结构","a":"","p":""},{"w":"swaption","z":"互换期权","d":"买入未来进入某笔利率互换的权利，利率波动的对冲工具","a":"","p":""},{"w":"underlying","z":"标的；标的资产","d":"衍生品所挂钩的资产，可以是个股、指数、商品或利率","a":"","p":".ʌndә'laiiŋ"},{"w":"upgrade","z":"上调评级","d":"评级机构调高评级等级，通常带动利差收窄","a":"","p":"'ʌpgreid"},{"w":"yield curve","z":"收益率曲线","d":"不同期限债券收益率连起来的曲线，判断定价的基准","a":"","p":""}],"iw":[{"w":"permit","p":"pә'mit","t":"n. 许可证, 许可, 执照, 通行证; vt. 允许, 容许, 可能, 使放手做; vi. 容许, 给以机会, 提供可能"},{"w":"corporation","p":".kɒ:pә'reiʃәn","t":"n. 公司, 合作, 法人团体; 法人团体, 社团, 法人"},{"w":"inflation","p":"in'fleiʃәn","t":"n. 胀大, 夸张, 通货膨胀; 充气吹胀; 膨胀"},{"w":"fundamental","p":".fʌndә'mentәl","t":"n. 基本原理, 原则, 基波; a. 基本的, 重要的, 原音的"},{"w":"virtually","p":"'vә:tʃuәli","t":"adv. 事实上"},{"w":"cast","p":"kɑ:st. kæst","t":"n. 演员阵容, 投掷, 铸件, 预测, 特性; vt. 投, 掷, 抛, 脱落, 铸, 使弯曲, 计算; vi. 投, 计算, 浇铸成型"},{"w":"sharp","p":"ʃɑ:p","t":"n. 半升音调, 利刃, 骗子; a. 锋利的, 明显的, 敏锐的, 急剧的, 尖刻的, 严厉的, 刺耳的, 精明的; adv. 锐利地, 急速地"},{"w":"unusual","p":".ʌn'ju:ʒu:l","t":"a. 不寻常的, 罕见的, 与众不同的"},{"w":"convince","p":"kәn'vins","t":"vt. 说服, 使相信; 使确信, 使信服, 使人认识错误"},{"w":"dominate","p":"'dɒmineit","t":"v. 支配, 占优势"},{"w":"physician","p":"fi'ziʃәn","t":"n. 医师, 内科医师, 解除痛苦者; 主治医师"},{"w":"exception","p":"ik'sepʃәn","t":"n. 例外, 除外, 异议; 例外; 异常"},{"w":"accommodation","p":"ә.kɒmә'deiʃәn","t":"n. 膳宿, 预订铺位, 适应性调节, 调和, 贷款; 调节(眼); 适应"},{"w":"addition","p":"ә'diʃәn","t":"n. 加法, 增加的人(或物); 加法"},{"w":"boundary","p":"'baundri","t":"n. 边界, 分界线; 边界"},{"w":"licence","p":"'laisns","t":"n. 执照, 许可证, 特许; vt. 许可, 特许, 认可"},{"w":"campus","p":"'kæmpәs","t":"n. 校园, 大学生活"},{"w":"transaction","p":"træn'sækʃәn","t":"n. 交易, 办理, 学报, 和解协议; 事务处理"},{"w":"dispute","p":"dis'pju:t","t":"n. 争论; v. 争论"},{"w":"immigrant","p":"'imigrәnt","t":"n. 移民; a. 移入的, 移民的"}],"doc":{"k":"债券募集说明书的风险因素段","en":"Risk Factors — Credit Protection and Hedging. Investors should note that protection written or purchased in respect of the Reference Entity may substantially exceed the aggregate principal amount of the Notes outstanding. Such contracts may settle in cash rather than by physical delivery, and the notional amount of contracts outstanding is not disclosed to Noteholders. The Issuer's interest rate swap and swaption arrangements reduce, but do not eliminate, basis risk between the Notes and the underlying receivables. The delinquency rate and excess spread reported monthly are calculated by the Servicer and are not independently verified. Positions may suffer mark to market losses if the yield curve shifts, and Noteholders remain exposed to the counterparty risk of each hedge provider.","zh":"风险因素——信用保护与对冲。谨提请投资者注意，就参考实体所卖出或买入的保护，其规模可能远超本票据尚未偿付的本金总额。该等合约可能以现金方式结算而非通过实物交割了结，且未平仓合约的名义本金并不向票据持有人披露。发行人所安排的利率互换与互换期权可以降低、但不能消除本票据与底层应收账款之间的基差风险。每月披露的逾期率与超额利差均由服务机构自行计算，未经独立核验。若收益率曲线发生变动，相关头寸可能产生盯市损失；票据持有人亦将持续承担各对冲提供方的对手方风险。"}},{"i":34,"ti":"Danny 想用期权替掉三成空头","dom":"derivatives","sc":"期权与希腊字母","tx":"\"借券太贵了，\"Danny 站在白板前说，\"三成的现券空头，我想用期权替掉。\"\n\n那天早上券商又提了一档借券费率。这笔仓位光借券成本每月吃掉的钱，已超过去年整只基金的管理费。提议不算离谱，但我第一反应是{{suspect}}（怀疑）他想简单了。\n\n他把账算给我看：买认沽期权，权利金付掉就没有后续成本，也不会被券商召回。问题是买多少。一张期权的{{delta}}（德尔塔）是 0.4，标的动一块钱期权只动四毛，得买两倍半的合约数才顶得掉同样的暴露。而且这行权价是虚值，{{intrinsic value}}（内在价值）等于零，付的全是时间价值：股价三个月不动就烧光，连{{exercise}}（行权）的机会都没有。他还想在别的仓位上做{{covered call}}（备兑开仓），用放弃上涨换权利金。\n\n我把上方几个行权价的{{open interest}}（未平仓合约量）拉出来，数字在涨。这才是我担心的：认购期权堆得太多，做市商为了对冲敞口就得不停买进正股，越涨越买，形成{{gamma squeeze}}（伽马挤压）——推着我们走的就不是基本面，是别人的对冲程序。\n\n风控放行，但要求同时挂一个{{bull call spread}}（牛市看涨价差）盖住逼空的尾巴，成本封顶，赔付也封顶。做期权还要交{{collateral}}（抵押品），每天按盈亏划{{variation margin}}（变动保证金）。Danny 顺口提到，主经纪商协议允许对我们的抵押品做{{rehypothecation}}（再抵押）——这条我们签过，当时没人多想，链条上又一处{{fault}}（隐患）。\n\n中午 Ray 从纽约拿到新东西，我啃着便利店的{{cheese}}（芝士）三明治看完：那只票据不是一层，是两层。\n\n资产池里确实有一万两千笔发票，但只占六成。剩下四成里，一块是别的{{asset-backed security}}（资产支持证券）的分层——买的是另一个打包产品切下来的一块，再打包一次，这有专门的名字叫{{CDO squared}}（CDO 平方）：风险不是被分散了，是被叠了两层楼，从窗口往下看已看不见地面。另一块更干脆：{{synthetic CDO}}（合成 CDO）不持有真实资产，靠卖出违约保护复制敞口——发票在不在它不关心，只关心赔不赔。壳是开曼{{incorporate}}（注册成立）的{{special purpose vehicle}}（特殊目的载体），账上没有员工。\n\n估值谁做的？没有市场报价，所以是{{mark to model}}（按模型计价）；这票据的{{secondary}}（二级的）市场一年只有四笔成交。模型里唯一被认真处理的风险是{{prepayment risk}}（提前还款风险）。我{{interpret}}（解读）不出别的意思：他们防的是钱回来得太早，完全没防钱回不来。\n\n最要命的一条在第 74 页：明年三月十七日之前不赎回，票息从 5.2% 跳到 11%——{{step-up coupon}}（票息跳升）。这不是罚款，是闹钟：发起人必须在那天之前借到新钱还旧。我又看了同一发起人的{{term spread}}（期限利差）：短端反而比长端贵——市场担心的不是三年后，是明年。\n\nDanny 问能不能写进报告。不能——里面没有一条是{{illegal}}（违法的）：评级是合规拿的，载体是合规设的，连那个 0.05 都披露了。问题从来不是有人违反规则，是规则允许这么写。Ray 说：好的结构不该有{{personality}}（个性）；这一只有。\n\n下午我们决定{{proceed}}（继续推进），建自己的{{database}}（数据库），把一万两千笔发票的省份、行业、金额录进去，枯燥得像在{{lab}}（实验室）数样本。Danny 拉了两个实习生{{assistance}}（协助）：任何一条对不上的记录都不许{{dismiss}}（打发掉）。\n\n四点有{{journalist}}（记者）打进来问我们是不是在做空东亚新能源，我说不评论，办公室的{{tension}}（紧张）一下起来了。Danny 说晚上得陪太太看{{musical}}（音乐剧）。我说去吧——这周谁都别搞成{{depression}}（消沉）的样子；做空久了有一种{{spiritual}}（精神上的）后遗症，看什么都像假的。他走时补一句：镍价在动，{{Russia}}（俄罗斯）那边供应有变数。\n\n我那晚没看镍价。我把这只票据重画了一遍，发现整个设计的核心动作只有一个：{{wrap}}（包装）——把一堆没人愿意单独买的东西包起来，贴上一个字母，它就成了另一样东西。\n\n然后我在日历上圈了三月十七号，圈完才发现，那天离我们这批借券到期只差九天。","ft":[{"w":"CDO squared","z":"CDO 平方","d":"以其他 CDO 的分层为底层资产再打包，风险被层层放大","a":"","p":""},{"w":"asset-backed security","z":"资产支持证券","d":"以信用卡、车贷等资产池现金流为支撑发行的证券","a":"ABS","p":""},{"w":"bull call spread","z":"牛市看涨价差","d":"买低行权价卖高行权价，看涨但把成本和收益都封顶","a":"","p":""},{"w":"collateral","z":"抵押品；担保品","d":"为衍生品敞口提供的资产担保，通常是现金或国债","a":"","p":"kә'lætәrәl"},{"w":"covered call","z":"备兑看涨；备兑开仓","d":"持有正股同时卖出看涨期权，用放弃上涨换权利金","a":"","p":""},{"w":"delta","z":"德尔塔；对冲比率","d":"标的价格变动一元时期权价格的变动幅度","a":"","p":"'deltә"},{"w":"exercise","z":"行权","d":"期权买方主动使用权利，按行权价完成买入或卖出","a":"","p":"'eksәsaiz"},{"w":"gamma squeeze","z":"伽马挤压","d":"做市商对冲期权敞口被迫追买标的，把股价推得更高","a":"","p":""},{"w":"intrinsic value","z":"内在价值","d":"期权立刻行权能拿到的价值，等于现价与行权价之差","a":"","p":""},{"w":"mark to model","z":"按模型计价","d":"没有市场报价时用内部模型估值，次贷危机中争议极大","a":"","p":""},{"w":"open interest","z":"未平仓合约量","d":"市场上尚未平仓的合约数量，看资金参与程度的指标","a":"OI","p":""},{"w":"prepayment risk","z":"提前还款风险","d":"借款人提前还贷导致现金流提前终止，按揭证券的特有风险","a":"","p":""},{"w":"rehypothecation","z":"再抵押","d":"经纪商把客户抵押品拿去再融资，会放大整个链条的杠杆","a":"","p":""},{"w":"special purpose vehicle","z":"特殊目的载体","d":"为持有资产池而设的独立实体，实现资产与发起人的隔离","a":"SPV","p":""},{"w":"synthetic CDO","z":"合成 CDO","d":"不持有真实资产，靠卖出 CDS 复制敞口的 CDO","a":"","p":""},{"w":"variation margin","z":"变动保证金","d":"按每日盯市盈亏在双方之间划转的现金","a":"VM","p":""},{"w":"step-up coupon","z":"票息跳升","d":"未在约定日赎回则票息大幅上调的惩罚性条款","a":"","p":""},{"w":"term spread","z":"期限利差","d":"同一发行人长短端债券之间的收益率差","a":"","p":""}],"iw":[{"w":"illegal","p":"i'li:gәl","t":"a. 违法的, 不合规定的; 非法的, 犯规的"},{"w":"database","p":"'deitәbeis","t":"n. 数据库; 数据库"},{"w":"fault","p":"fɒ:lt","t":"n. 过错, 故障, 毛病; vt. 挑剔; vi. 产生断层, 弄错; 故障"},{"w":"personality","p":".pә:sә'næliti","t":"n. 个性, 人格, (团体、地方、国家)特有特性, 名人; 人格; 个性"},{"w":"assistance","p":"ә'sistәns","t":"n. 协助, 援助; 援助, 帮助"},{"w":"lab","p":"læb","t":"n. 实验室, 研究室; 凝乳酶"},{"w":"proceed","p":"prәu'si:d","t":"vi. 继续进行, 进行, 开始, 发出, 起诉; 所得, 收入, 收益"},{"w":"wrap","p":"ræp","t":"n. 外套, 围巾, 包裹物, 限制, 约束, 秘密, 换行; vt. 包装, 卷, 缠绕, 包, 裹, 覆盖, 遮蔽, 隐藏, 掩护; vi. 缠绕, 穿外衣, 包起来; 换行"},{"w":"tension","p":"'tenʃәn","t":"n. 紧张, 不安, 拉紧, 张力, 压力, 电压; vt. 拉紧, 使紧张"},{"w":"interpret","p":"in'tә:prit","t":"vt. 解释, 演出, 翻译, 理解; vi. 翻译, 解释"},{"w":"depression","p":"di'preʃәn","t":"n. 不景气, 消沉, 沮丧, 洼地; 抑郁 , 阻抑, 压低, 凹, 窝, 衰退, 俯角"},{"w":"incorporate","p":"in'kɒ:pәreit","t":"a. 合并的, 组成公司的, 一体化的; vt. 吸收, 合并, 使组成公司, 体现; vi. 合并, 混合, 组成公司"},{"w":"spiritual","p":"'spiritʃuәl","t":"a. 精神上的, 神圣的, 崇高的, 高尚的, 鬼的, 招魂术的; n. 有关教会的事"},{"w":"musical","p":"'mju:zikl","t":"n. 音乐片, 音乐舞台剧; a. 音乐的, 声音美妙的, 喜爱音乐的"},{"w":"secondary","p":"'sekәndәri","t":"a. 中级的, 中等的, 次要的, 第二的, 从属的, 辅助的; 仲(指CH-3...CH(CH-3)-型支链烃基或指二元胺及R-2CHOH型的醇); 第二"},{"w":"journalist","p":"'dʒә:nәlist","t":"n. 新闻记者, 从事新闻杂志业的人"},{"w":"dismiss","p":"dis'mis","t":"vt. 解散, 开除, 解职; vi. 解散; 解散"},{"w":"suspect","p":"sә'spekt","t":"n. 被怀疑者, 嫌疑犯; a. 令人怀疑的, 不可信的, 可疑的; v. 怀疑, 猜想"},{"w":"Russia","p":"'rʌʃә","t":"n. 俄国, 俄罗斯; 俄罗斯, 苏联"},{"w":"cheese","p":"tʃi:z","t":"n. 乳酪; 干酪"}],"doc":{"k":"内部合规邮件","en":"From: Risk & Compliance. Subject: Proposed option overlay. The desk has requested approval to replace approximately thirty per cent of the cash short with listed puts. Risk has no objection subject to the following conditions. First, the aggregate delta of the overlay must be reported daily and may not exceed the exposure it replaces; positions with no intrinsic value are to be flagged separately. Second, any covered call written against existing holdings requires prior sign-off. Third, the desk must maintain a bull call spread as protection against a gamma squeeze, and open interest at upper strikes is to be monitored weekly. Fourth, collateral and variation margin must be tracked separately and the prime broker's rehypothecation rights reviewed. Any position carried at mark to model requires Valuation Committee approval.","zh":"发件人：风控与合规部。主题：拟议期权覆盖方案。交易台申请以场内认沽期权替换约三成的现券空头。风控原则上不反对，但须满足以下条件。第一，该覆盖头寸的总德尔塔须每日上报，且不得超过其所替换的敞口；不具内在价值的头寸须单独标注。第二，针对现有持仓的任何备兑开仓操作，均须事先取得批准。第三，交易台须同时持有一个牛市看涨价差，以防范伽马挤压，并须每周监控高行权价档位的未平仓合约量。第四，抵押品与变动保证金须分别跟踪，并须复核主经纪商的再抵押权利。任何按模型计价的头寸，均须经估值委员会批准。"}},{"i":35,"ti":"报价最好的那一家，我们从没打过交道","dom":"derivatives","sc":"对手方与清算","tx":"报价回来时，Danny 只说了一句：\"这家我没听过。\"\n\n我们要买的不复杂：三个月期认沽期权，加一小笔{{call option}}（看涨期权）盖住上方。五家交易台，四家的{{option premium}}（权利金）差不多，第五家便宜 22%——场外市场里，这不是好消息。\n\n第五家叫 Ardenmoor Securities (HK)，地址在中环一栋{{tower}}（写字楼）二十七层。注册处资料：十四个月前成立，实缴资本很小，董事三人，两个是信托挂名。它报出最好的价，还吃得下我们全部的量。\n\nRay 说，先别{{bother}}（费神）猜动机，先把交易拆开看。\n\n我们想买的不是方向，是波动：停牌、问询、复牌，哪一件都能让股价一天动 20%。所以最初想买{{straddle}}（跨式组合）——同一行权价，看涨看跌各一份，赌它会动。行权价选在{{at the money}}（平值）附近，时间价值最厚也最贵；这笔头寸的{{vega}}（维加）很大，隐含波动率涨一个点我们就赚一笔。\n\nDanny 更想省钱。Ardenmoor 主动提了另一个方案：定制一个带{{knock-in}}（敲入）条款的{{exotic option}}（奇异期权），跌破某价位才激活，再省一半。\n\n我说不做。\n\n理由不是价格。这样一份合约，卖方要靠{{delta hedging}}（德尔塔对冲）一天调好几次仓位管敞口——一家成立十四个月、占半层楼的机构凭什么做？他要么找人转手，要么根本没打算对冲。哪一种，我们买到的都不是保护，是欠条。\n\nRay 说了一个词：{{tail risk}}（尾部风险）。尾部有个特点：所有人在正常的日子里都付得起钱，只有那一天付不出来。\"你要它兑现的那天，\"他说，\"正好是它最难兑现的那天。\"\n\n然后我把 Ardenmoor 的公司{{constitution}}（公司章程）一页页翻，里面有一条{{restricted payments}}（限制性支付条款）式的安排，限制它向股东分配，指向一份与母公司的协议。母公司注册在开曼——那家的通讯地址，跟纽约文件里替载体做货币互换的对手方一模一样。\n\n那一行我读了三遍。{{emotion}}（情绪）在办公室没什么用，但那一刻我手是凉的。\n\n我们要买保护的这家机构，跟我们做空的那个结构是一家人。\n\nRay 讲得很慢：{{credit default swap}}（信用违约互换）里，付保费的一方是{{protection buyer}}（保护买方），等于做空这个主体的信用；{{CDS spread}}（CDS 利差）就是这保险每年的价格。可如果卖保险的人和被保主体绑在一起，再便宜也一文不值。\"2007 年很多{{residential mortgage-backed security}}（住宅按揭支持证券）的保护就这么成了废纸，\"他说，\"那些{{mezzanine tranche}}（夹层档）保护，是向自己也塞满同类资产的人买的。\"\n\n{{moreover}}（而且），抵押品也不是万能的：可以要求对方缴，但要打{{haircut}}（折扣率），风险越大折得越狠。何况那家机构的{{collateral pool}}（资产池）里有什么，我们看不见。\n\n我们改了{{agenda}}（议程）：下午的{{schedule}}（时间表）从执行改成尽调。\n\nDanny 转向两家老交道的大行，价格贵。我们{{alter}}（改变）了结构：量拆开，行权价下挪一档，期限做了{{extension}}（延长），改成五个月，报价{{currency}}（货币）统一成美元。他算完说，这等于把两周收益提前交了出去。我说我知道，但{{premise}}（前提）不对，价格再好也没意义。\n\nRay 补了句更难听的：这行里便宜的报价{{rarely}}（很少）是善意。\n\n奇怪的是，这个月那批票据的{{spreads tightened}}（利差收窄），市场对它的风险定价反而更低；同一时间却有人买巨量保护。只有一种解释：买保护的人和定价的人，不是同一群人。\n\n{{subsequent}}（后来的）一周，公司{{spokesman}}（发言人）还在回应媒体：江西基地那次{{pollution}}（污染）通报已整改，主要客户是几家大型{{steel}}（钢铁）与电池集团，一切正常——语气平稳得像在做{{therapy}}（心理治疗）。\n\n老周说过，造假不是手法，是{{gene}}（基因）：同一批人做第二遍，动作长得一模一样。新方案{{implement}}（执行）下去，成交在周四下午，没有{{dramatic}}（戏剧性的）事情发生。\n\n第二天我把 Ardenmoor 的董事名单翻到最后一页。第二个名字，我在纽约那份文件里见过。","ft":[{"w":"CDS spread","z":"CDS 利差","d":"买这份违约保险每年要付的费率，是市场看违约概率的温度计","a":"","p":""},{"w":"at the money","z":"平值","d":"行权价与标的现价基本相等，时间价值最厚的位置","a":"ATM","p":""},{"w":"call option","z":"看涨期权；认购期权","d":"有权按约定价格买入标的的合约，看涨方向的基础工具","a":"","p":""},{"w":"collateral pool","z":"资产池；抵押池","d":"被打包进结构化产品的一篮子底层贷款或债券","a":"","p":""},{"w":"credit default swap","z":"信用违约互换","d":"为债券违约买的保险，《大空头》里做空次贷用的就是它","a":"CDS","p":""},{"w":"delta hedging","z":"德尔塔对冲","d":"按德尔塔比例用标的动态对冲期权敞口，做市商的日常操作","a":"","p":""},{"w":"exotic option","z":"奇异期权","d":"条款比标准期权复杂的品种，多数只能在场外定制","a":"","p":""},{"w":"haircut","z":"折扣率；折价","d":"抵押品估值时打的折扣，风险越大折扣越高","a":"","p":"'hєәkʌt"},{"w":"knock-in","z":"敲入","d":"标的跌破约定价位后条款被激活，投资者开始承担下跌损失","a":"","p":""},{"w":"mezzanine tranche","z":"夹层档","d":"介于优先和权益之间的层级，次贷危机中损失最惨烈","a":"","p":""},{"w":"option premium","z":"权利金；期权费","d":"买方为取得权利付给卖方的价格，卖方的最大收益","a":"","p":""},{"w":"protection buyer","z":"保护买方","d":"付保费买违约保护的一方，等于做空该主体的信用","a":"","p":""},{"w":"residential mortgage-backed security","z":"住宅按揭支持证券","d":"底层是个人住房贷款的证券化产品","a":"RMBS","p":""},{"w":"straddle","z":"跨式组合","d":"同时买入同一行权价的看涨和看跌，赌波动放大不赌方向","a":"","p":"'strædl"},{"w":"tail risk","z":"尾部风险","d":"概率很低但一旦发生损失极大的风险，衍生品定价常低估它","a":"","p":""},{"w":"vega","z":"维加","d":"隐含波动率变动一个点时期权价格的变化幅度","a":"","p":"'vi:^ә"},{"w":"restricted payments","z":"限制性支付条款","d":"对分红、回购和对外投资设定上限的约定","a":"","p":""},{"w":"spreads tightened","z":"利差收窄","d":"信用债溢价下降，反映风险偏好改善或基本面好转","a":"","p":""}],"iw":[{"w":"moreover","p":"mɒ:'әuvә","t":"adv. 而且, 此外"},{"w":"subsequent","p":"'sʌbsikwәnt","t":"a. 后来的, 接下去的; 后来的"},{"w":"currency","p":"'kʌrәnsi","t":"n. 货币, 通货, 流通, 通用; 货币, 货币型"},{"w":"emotion","p":"i'mәuʃәn","t":"n. 情绪, 激动, 强烈的情感; 情绪, 情感"},{"w":"dramatic","p":"drә'mætik","t":"a. 戏剧性的, 生动的"},{"w":"alter","p":"'ɒ:ltә","t":"v. 改变"},{"w":"rarely","p":"'rєәli","t":"adv. 很少地, 罕有地"},{"w":"extension","p":"ik'stenʃәn","t":"n. 延长, 扩充, 范围, 扩展名; a. 伸缩的; 扩展名, 扩充名"},{"w":"agenda","p":"ә'dʒendә","t":"pl. 议程, 日常工作事项; 待议事件"},{"w":"tower","p":"'tauә","t":"n. 塔, 高楼, 堡垒; vi. 高耸, 翱翔"},{"w":"bother","p":"'bɒðә","t":"vt. 烦扰, 迷惑; vi. 烦恼, 操心; n. 麻烦, 纠纷, 讨厌的人"},{"w":"premise","p":"'premis","t":"n. 前提, 房屋连地基, 上述各项; vt. 预先提出, 引出, 作为...的前提; vi. 作出前提"},{"w":"therapy","p":"'θerәpi","t":"n. 治疗; 疗法, 治疗"},{"w":"schedule","p":"'skedʒuәl","t":"n. 时间表, 一览表, 计划表, 议事日程; vt. 预定, 编制目录, 制...表, 安排"},{"w":"spokesman","p":"'spәuksmәn","t":"n. 发言人, 代言者"},{"w":"pollution","p":"pә'lu:ʃәn","t":"n. 污染, 玷污; 污染"},{"w":"constitution","p":".kɒnsti'tju:ʃәn","t":"n. 构成, 宪法, 体格; 体质; 结构, 组织"},{"w":"implement","p":"'implimәnt","t":"n. 工具, 器具, 手段; vt. 实现, 使生效, 执行"},{"w":"gene","p":"dʒi:n","t":"n. 基因; 基因(遗传因子)"},{"w":"steel","p":"sti:l","t":"n. 钢, 钢制品, 钢铁, 坚硬, 坚固; a. 钢的, 钢制的, 钢铁业的, 坚强的; vt. 使坚强, 钢化, 使冷酷"}],"doc":{"k":"场外衍生品交易确认书","en":"Transaction Confirmation. This Confirmation evidences a credit default swap between the parties. Party A acts as protection buyer in respect of the Reference Obligations identified in the Schedule. The CDS spread is payable quarterly in arrears as set out in Annex I. The parties acknowledge that the Reference Obligations include mezzanine tranche exposure to a residential mortgage-backed security and to a collateral pool of trade receivables. Eligible collateral is subject to the haircut specified in the Credit Support Annex. Party B may discharge its delta hedging obligations in any manner it determines. Party A confirms that it has independently assessed the tail risk of this transaction and that any exotic option or knock-in feature agreed hereunder is bespoke and may have no secondary market.","zh":"交易确认书。本确认书用以证明双方之间的一笔信用违约互换交易。甲方就附表所列参考债务担任保护买方。CDS 利差按附件一的约定于每季度末支付。双方确认，参考债务包含对一只住宅按揭支持证券的夹层档敞口，以及对一个贸易应收账款资产池的敞口。合格抵押品须按信用支持附件所载的折扣率计价。乙方可以自行决定以任何方式履行其德尔塔对冲义务。甲方确认，其已就本交易的尾部风险作出独立评估，并知悉本协议项下约定的任何奇异期权或敲入条款均属定制安排，可能不存在二级市场。"}},{"i":36,"ti":"抵押品要在同一个交易日收市前到账","dom":"derivatives","sc":"抵押品与保证金","tx":"报价单进来的时候我还没坐下，Danny 已经把它投到会议室墙上了。\n\n发件人叫 Ardent Meridian，一家我们从来没打过交道的机构。邮件主题行是一句干巴巴的英文：{{regarding}}（关于）collateral arrangements——关于抵押品安排。\n\nDanny 把第七页那张 {{slide}}（幻灯片）放大。整页就一张图，做得很漂亮，{{visual}}（视觉的）效果比数字强得多：一条平滑的绿线，底下一行小字，说这套结构能给客户带来多大的成本 {{saving}}（节约）。会议室桌角有个 {{chip}}（磕掉的小豁口），我一边听一边用指甲抠它。\n\n我们想要的东西其实不复杂。Danny 前几天提的方案是用期权替掉一部分现券空头：买一组 {{European option}}（欧式期权），{{expiration date}}（到期日）压在明年三月业绩期之后，再配一个 {{protective put}}（保护性看跌）兜住万一被逼空的那一段。Ardent 的报价单把它改成了一个 {{strangle}}（宽跨式组合），理由写得很客气：这只票的 {{implied volatility}}（隐含波动率）已经不便宜，而 {{volatility skew}}（波动率偏斜）明显偏向下方，价外看跌贵得离谱，不如两头都买一点。\n\n这句话是对的。但我盯着的是他们把自己放在了什么位置——他们是 {{option writer}}（期权卖方），收我们的权利金，承担被行权的义务。愿意在这个时点站到卖方那一边的人，要么手里已经有对冲，要么知道一些我不知道的事。\n\nDanny 又翻出港股这边的便宜替代品：{{callable bull/bear contract}}（牛熊证），{{effective gearing}}（实际杠杆）能做到十几倍。问题是它带强制收回，股价一旦 {{knock-out}}（敲出），合约当场终止，你判断对不对都不重要了。我摇头。我们要的是能扛住一次 {{violent}}（猛烈的）反弹的东西，不是一根绷到极限的橡皮筋。\n\n真正让我把笔放下的，是条款附件。\n\n{{framework}}（框架）是标准的，抵押品条款却一点都不标准。他们要求每天按市值重估，{{delivery}}（交付）时间写的是同一个交易日收市前。也就是说，价格一旦反向，追缴不是\"过两天再说\"，是当天下午就得把钱打过去。我把那一段读了三遍，才 {{perceive}}（意识到）它真正的意思：我们把期权当成了一个 {{port}}（避风港），可这个港口的水位每天早上重设一次。\n\n\"最坏一天要拿出多少？\"Ray 问。他从进门起就是 {{silent}}（沉默的），这是第一句话。\n\nDanny 敲了两分钟计算器，报了一个数。Ray 没表态，只让我们把这家机构自己在卖什么翻一遍。\n\n我翻了。报价单最后附着他们的 {{advertising}}（广告）材料，一整套自营产品。头一个就是 {{collateralized debt obligation}}（担保债务凭证），切成好几个 {{layer}}（层），每层标着 {{attachment point}}（起赔点），底下一 {{string}}（一串）精确到小数点后两位的百分比。旁边一栏是 {{credit enhancement}}（信用增级）安排：超额抵押，外加一家 {{monoline insurer}}（单一险种保险商）的担保。再往后是一只 {{perpetual bond}}（永续债），头两年给 {{teaser rate}}（初期优惠利率），重设之后票息跳一大截。最后一页是一张 {{rating migration}}（评级迁移）统计表，用来证明他们过去五年评过的东西没怎么被下调。\n\n盘口 {{depth}}（深度）够不够我不知道，但这家机构做的生意，跟我们做空的那家公司之间，隔的不是一道墙，是一张纸。\n\n顺手我还算了一下指数对冲那条腿的 {{roll yield}}（展期收益）——光是移仓换月这一项，每个季度就要吃掉一小 {{portion}}（部分）收益。\n\n下午三点，Ray 给了 {{resolve}}（决定）：签，但只签一半的量。\n\nDanny 收电脑要走，说周末得回东莞喝一场 {{wedding}}（婚礼）的喜酒。走到门口他回头问我：万一这家机构反手把我们的持仓透给 {{opponent}}（对手），公司会不会把我们俩 {{boot}}（开掉）？\n\n我没回答。我还在看那张分层图。最底下那一档的底层资产说明里，写着一行小字：中国制造业应收账款。","ft":[{"w":"European option","z":"欧式期权","d":"只能在到期日当天行权的期权，港股结构化产品常见","a":"","p":""},{"w":"attachment point","z":"起赔点","d":"资产池损失超过该比例后该档开始承担亏损","a":"","p":""},{"w":"callable bull/bear contract","z":"牛熊证","d":"带强制收回机制的杠杆产品，港股与窝轮并列的两大品种","a":"CBBC","p":""},{"w":"collateralized debt obligation","z":"担保债务凭证","d":"把一堆债券或按揭证券再打包分层发行的产品","a":"CDO","p":""},{"w":"credit enhancement","z":"信用增级","d":"通过分层、超额抵押或担保把评级抬上去的一整套安排","a":"","p":""},{"w":"effective gearing","z":"实际杠杆","d":"正股涨跌一个百分点时窝轮的涨跌幅度，比名义杠杆更实用","a":"","p":""},{"w":"expiration date","z":"到期日","d":"期权或期货合约失效的日期，到期未行权则权利作废","a":"expiry","p":""},{"w":"implied volatility","z":"隐含波动率","d":"从期权价格倒推出的市场预期波动率，报价的核心变量","a":"IV","p":""},{"w":"knock-out","z":"敲出","d":"标的触及约定价位后合约提前终止，投资者的收益随之封顶","a":"","p":""},{"w":"monoline insurer","z":"单一险种保险商","d":"专门为结构化产品提供担保的保险公司，危机中集体被拖垮","a":"","p":""},{"w":"option writer","z":"期权卖方；义务方","d":"卖出期权收取权利金的一方，承担被行权的义务","a":"writer","p":""},{"w":"protective put","z":"保护性看跌","d":"持股同时买入看跌期权，相当于给持仓买保险","a":"","p":""},{"w":"roll yield","z":"展期收益","d":"移仓换月本身带来的正负收益，商品和股指对冲都要算","a":"","p":""},{"w":"strangle","z":"宽跨式组合","d":"买入不同行权价的价外看涨和看跌，比跨式便宜但需更大波动","a":"","p":"'stræŋgl"},{"w":"teaser rate","z":"诱惑利率；初期优惠利率","d":"前两年极低的按揭利率，重设后月供会大幅跳升","a":"","p":""},{"w":"volatility skew","z":"波动率偏斜","d":"不同行权价的隐含波动率不一致，价外看跌通常更贵","a":"","p":""},{"w":"perpetual bond","z":"永续债","d":"没有固定到期日、发行人可选择赎回的债券","a":"perp","p":""},{"w":"rating migration","z":"评级迁移","d":"一段时间内发行人评级上调或下调的分布变化","a":"","p":""}],"iw":[{"w":"regarding","p":"ri'gɑ:diŋ","t":"prep. 关于"},{"w":"visual","p":"'viʒuәl","t":"a. 视觉的; 视觉的, 视力的, 视觉性记忆优势者"},{"w":"violent","p":"'vaiәlәnt","t":"a. 暴力的, 猛烈的, 激烈的, 极端的, 凶暴的"},{"w":"chip","p":"tʃip","t":"n. 屑片, 薄片, 碎片; vt. 削, 切, 削成碎片, 使摔倒, 凿; vi. 削下屑片; 孔屑; 组件; 晶片; 芯片"},{"w":"depth","p":"depθ","t":"n. 深度, 深处, 深奥; 深度"},{"w":"silent","p":"'sailәnt","t":"a. 沉默的, 安静的, 无声的, 静止的; 静止的, 无症状的"},{"w":"saving","p":"'seiviŋ","t":"n. 存款, 挽救, 节约; a. 搭救的, 节约的, 保留的, 补偿的; prep. 除...之外"},{"w":"perceive","p":"pә'si:v","t":"vt. 感觉, 认知, 理解, 意识到"},{"w":"port","p":"pɒ:t","t":"n. 港口, 埠, 舱门, 避风港, 左舷, 炮眼, 姿势, 意义; vt. 左转舵, 持(枪); vi. 左转舵; 端口, 移植"},{"w":"layer","p":"'leiә","t":"n. 层, 产卵鸡, 放置者; vt. 分层堆积, 压植; 层"},{"w":"delivery","p":"di'livәri","t":"n. 递送, 交付, 分娩, 交货, 引渡; 交货额"},{"w":"string","p":"striŋ","t":"n. 线, 细绳, 一串, 字符串; vt. 串起, 成串, 收紧, 缚, 扎; vi. 成一串; 字符串, 串"},{"w":"resolve","p":"ri'zɒlv","t":"vi. 决定, 分解, 决心; vt. 使分解, 解析, 解决, 消除, 决心; n. 决定之事, 决心, 坚决"},{"w":"slide","p":"slaid","t":"n. 滑, 滑道, 山崩, 雪崩, 幻灯片; vt. 使滑动, 偷偷放入; vi. 滑动, 滑落, 不知不觉陷入, 偷偷地走"},{"w":"boot","p":"bu:t","t":"n. 长靴, 踢, 解雇, 效用; vt. 使穿靴, 踢, 解雇, 有用; 引导, 自举"},{"w":"wedding","p":"'wediŋ","t":"n. 婚礼, 结婚, 结婚周年纪念日, 结合; 结婚, 婚礼, 结婚纪念日"},{"w":"framework","p":"'freimwә:k","t":"n. 结构, 骨架, 参照标准, 准则, 观点; 构架组织"},{"w":"portion","p":"'pɒ:ʃәn","t":"n. 部分, 一份, 命运, 嫁妆; vt. 分配, 给...嫁妆"},{"w":"advertising","p":"'ædvәtaiziŋ","t":"n. 广告业, 广告; a. 广告的; 发广告"},{"w":"opponent","p":"ә'pәunәnt","t":"n. 对手, 敌手, 反对者; a. 敌对的, 反对的, 对面的"}],"doc":{"k":"交易确认书","en":"This Confirmation supplements and forms part of the Master Agreement between the parties. Transaction: a strangle on the Reference Share, comprising two European option components purchased by the Counterparty, each carrying the same expiration date of 20 March. The Dealer acts as option writer for both legs. Premium has been computed from the implied volatility levels set out in Schedule A, adjusted for the prevailing volatility skew. The Counterparty may treat the put leg as a protective put against an existing short position. For the avoidance of doubt, this Transaction contains no knock-out feature, is not a callable bull/bear contract, and no effective gearing figure is quoted or warranted. Collateral is revalued daily and must be delivered before the close of the same business day.","zh":"本确认书构成双方之间主协议的补充并作为其组成部分。交易内容：以参考股份为标的的宽跨式组合，由交易对手买入的两项欧式期权构成，二者到期日相同，均为 3 月 20 日。交易商就两条腿均担任期权卖方。权利金依据附表 A 所列隐含波动率水平计算，并按当时的波动率偏斜作出调整。交易对手可将其中的看跌一腿视为对既有空头持仓的保护性看跌。为免生疑问，本交易不含敲出条款，亦非牛熊证，且不对任何实际杠杆数值作出报价或保证。抵押品每日重估，并须于同一营业日收市前完成交付。"}},{"i":37,"ti":"名义本金加起来，是这家公司市值的四倍","dom":"derivatives","sc":"名义本金与杠杆","tx":"凌晨一点，Danny 在茶水间泡 {{protein}}（蛋白质）粉，我在会议室地板上摊开了七张纸。\n\n我干的事很笨：把所有挂钩这只票的衍生品，一笔一笔加起来。\n\n公开市场那部分好查。港交所网站上挂着一百四十多只 {{warrant}}（窝轮），发行商九家，凌晨两点有数据 {{maintenance}}（维护）窗口，我卡着点把当天的存续量拉了下来。这部分不算大。\n\n大头在场外。券商卖给内地和东南亚私人银行客户的 {{autocallable}}（自动赎回结构）产品，条款大同小异：股价只要不跌破约定的 {{strike price}}（行权价），每个月付一笔漂亮的票息；一旦跌破，客户就等于凭空写了一张 {{put option}}（看跌期权），亏损随跌幅线性放大。到期不交股票，只做 {{cash settlement}}（现金交割）。销售材料里最不起眼的那句话，是关于 {{embedded option}}（内嵌期权）的描述。客户以为自己买的是高息理财，实际上他们卖掉的是尾部风险。\n\n这些产品对发行商来说是很 {{efficient}}（有效率的）的生意：客户在股价 {{in the money}}（价内）的日子里天天开心，发行商靠 {{theta}}（西塔）一天一天收时间的钱。谁在承担 {{obligation}}（义务），要翻到第四十一页的定义部分才看得清。\n\n我把窝轮、雪球、场外互换、还有几笔要按季 {{rollover}}（移仓）的合约全部折成同一个口径，加总。\n\n四点二十，我 {{reckon}}（算出）了一个数。名义本金合计，是这家公司总市值的四倍多。\n\n我把纸摊在 Ray 桌上的时候，天刚亮。他没说话，先去把窗帘拉开，然后从抽屉里翻出一本旧 {{album}}（相册），抽出一张照片推给我。照片上是二十年前的一间交易室，白板上密密麻麻。\n\n\"两千零六年，\"他说，\"我做的东西比这个还离谱。\"\n\n他讲了半小时。当年那批 {{mortgage-backed security}}（抵押贷款支持证券），底层是一堆 {{FICO score}}（FICO 信用分）刚过门槛的借款人，{{loan-to-value ratio}}（贷款价值比）高到几乎没有首付。银行走的是 {{originate-to-distribute}}（发起—分销模式）：放完款立刻打包卖掉，风险不留在自己表上，审核标准自然就 {{bend}}（弯）了。等房价一转，{{foreclosure}}（止赎）像春天的野草一样冒出来。后来同样的做法被搬到企业贷款上，变成 {{collateralized loan obligation}}（贷款抵押凭证）。他手上还有一批 {{Spanish}}（西班牙的）银行发的东西，出事那年他连夜看的就是那几份文件。\n\n\"关键不在底层烂不烂，\"Ray 说，\"在于名义本金能被 {{transform}}（转化）成多大一张网。一个 {{credit event}}（信用事件），网上所有节点同时抖。\"\n\n我问他，这一次谁在网的另一头。\n\n他没答，反问我：如果这家公司境外的债出问题，谁来谈？我说，通常会冒出一个 {{offshore creditor group}}（境外债权人小组），请顾问、拉名单、跟发行人对坐。他点头，说别忘了它境内还发过 {{panda bond}}（熊猫债），两边的债权人处在完全不同的 {{mode}}（模式）里，很难坐到一张桌子上。\n\n那天上午我改了三件事。一是把风险敞口的口径从\"我们持仓多少\"改成\"整个市场挂在这只票上有多少\"，那是一个 {{extensive}}（广泛得多）的口径。二是把公司 IR 一年来的所有 {{recommendation}}（建议）和沟通记录 {{restore}}（还原）成时间线。三是把我们那部分对冲的价格 {{lock}}（锁定）住，先 {{preserve}}（保住）本金再说。\n\nDanny 打着哈欠说，这一行的 {{profession}}（职业）病就是把周期当天气。我说不是天气，是 {{cycle}}（周期），而且我们正好站在 {{transition}}（转换）那一段上。\n\n他把杯子洗了，说：我又不是 {{cop}}（警察），我只负责按你说的价挂单。\n\n我也不是。可写这些产品条款的人，早就在文件里把自己 {{desert}}（抛弃）客户的那条路铺好了——只是没人读到第四十一页。\n\n我把那本相册还给 Ray 的时候，看见照片背面有一行钢笔字，是他自己的笔迹：别做最后一个还在买的人。","ft":[{"w":"FICO score","z":"FICO 信用分","d":"美国个人信用评分，是划分次级与优质贷款的主要门槛","a":"","p":""},{"w":"autocallable","z":"自动赎回结构","d":"标的高于约定水平就提前赎回付息，雪球类产品的核心条款","a":"","p":""},{"w":"cash settlement","z":"现金交割","d":"到期只结算价差不交付实物，股指期货采用的方式","a":"","p":""},{"w":"collateralized loan obligation","z":"贷款抵押凭证","d":"以杠杆贷款为底层资产的分层证券化产品","a":"CLO","p":""},{"w":"credit event","z":"信用事件","d":"触发赔付的事件，包括破产、拒付和债务重组","a":"","p":""},{"w":"embedded option","z":"内嵌期权","d":"嵌在债券或票据条款里的期权，如可赎回或可转换条款","a":"","p":""},{"w":"foreclosure","z":"止赎；收楼","d":"借款人违约后贷款方依法收回并拍卖抵押房产","a":"","p":"fɔ:'klәjʒә(r)"},{"w":"in the money","z":"价内；实值","d":"行权立刻有正收益的状态，期权含内在价值","a":"ITM","p":""},{"w":"loan-to-value ratio","z":"贷款价值比","d":"贷款金额与抵押物价值之比，越高说明首付越少风险越大","a":"LTV","p":""},{"w":"mortgage-backed security","z":"抵押贷款支持证券","d":"以住房按揭还款为现金流来源的证券，次贷危机的主角","a":"MBS","p":""},{"w":"originate-to-distribute","z":"发起—分销模式","d":"银行放贷后立刻打包卖出，不留风险因而放松审核标准","a":"","p":""},{"w":"put option","z":"看跌期权；认沽期权","d":"有权按约定价格卖出标的的合约，做空或保护持仓时用","a":"","p":""},{"w":"rollover","z":"移仓；展期","d":"近月合约临近到期时平仓并开仓远月，维持原有敞口","a":"roll","p":"'rәul,әuvә"},{"w":"strike price","z":"行权价；执行价","d":"期权合约里约定的买卖价格，决定实值还是虚值","a":"","p":"straik prais"},{"w":"theta","z":"西塔","d":"时间每过一天期权价值减少多少，卖方的主要收益来源","a":"","p":"'θeitә"},{"w":"warrant","z":"认股权证；窝轮","d":"发行商发行的杠杆凭证，港股散户交易最活跃的衍生工具","a":"","p":"'wɒ:rәnt"},{"w":"offshore creditor group","z":"境外债权人小组","d":"境外持有人联合聘请顾问与发行人谈判的组织形式","a":"","p":""},{"w":"panda bond","z":"熊猫债","d":"境外机构在中国境内发行的人民币债券","a":"","p":""}],"iw":[{"w":"obligation","p":".ɒbli'geiʃәn","t":"n. 义务, 责任, 约束, 契约, 恩惠, 债务; 待付款, 债务, 义务"},{"w":"extensive","p":"ik'stensiv","t":"a. 广的, 广泛的, 多方面的; 广大的, 扩大的"},{"w":"transform","p":"træns'fɒ:m","t":"vt. 使转换, 改变, 改造, 使...变形; vi. 改变, 转化, 变换; 变换"},{"w":"protein","p":"'prәuti:in","t":"n. 蛋白质; a. 蛋白质的"},{"w":"bend","p":"bend","t":"vi. 变弯曲, 屈服; vt. 使弯曲, 使屈服; n. 弯曲"},{"w":"desert","p":"'dezәt. di'sә:t","t":"n. 沙漠, 应得的赏罚, 功劳; a. 沙漠的, 不毛的; vt. 放弃, 遗弃, 擅离; vi. 逃掉"},{"w":"efficient","p":"i'fiʃәnt","t":"a. 有效率的, 能干的"},{"w":"maintenance","p":"'meintәnәns","t":"n. 维护, 保持, 维修, 生活费用, 坚持, 扶养; 维护; 维修"},{"w":"cop","p":"kɒp","t":"n. 警官; vt. 抓住"},{"w":"cycle","p":"'saikl","t":"n. 周期, 循环, 自行车, 一段时间, 整套; vi. 循环, 轮转, 骑自行车; vt. 使循环, 使轮转; 环路; 周期; 循环"},{"w":"reckon","p":"'rekәn","t":"vt. 计算, 总计, 估计, 认为, 猜想; vi. 数, 计算, 估计, 依赖, 料想"},{"w":"Spanish","p":"'spæniʃ","t":"n. 西班牙人, 西班牙语; a. 西班牙的"},{"w":"recommendation","p":".rekәmen'deiʃәn","t":"n. 推荐, 介绍, 推荐信, 劝告; 建议书"},{"w":"preserve","p":"pri'zә:v","t":"vt. 保护, 保持, 保存, 维持, 腌, 禁猎; vi. 加工食品, 禁猎; n. 加工成的食品, 禁猎地, 保护区, 防护物"},{"w":"profession","p":"prә'feʃәn","t":"n. 职业, 表白, 声明; 工种; 职业"},{"w":"transition","p":"træn'ziʃәn","t":"n. 转变, 转换, 变迁, 过渡时期, 临时转调; 跃迁"},{"w":"album","p":"'ælbәm","t":"n. 粘贴簿, 唱片套; 白色物"},{"w":"restore","p":"ri'stɒ:","t":"vt. 回复, 恢复, 归还, 修补, 修复; vt. 还原; vi. 还原; 还原; DOS外部命令:从备份盘中取回文件"},{"w":"mode","p":"mәud","t":"n. 模态, 调式, 样式, 文体, 状态, 方式, 风尚; 方式; DOS外部命令:设定各种设备命令"},{"w":"lock","p":"lɒk","t":"n. 锁, 刹车, 水闸, 一缕头发; vt. 锁, 锁上, 拘禁, 隐藏, (用锁等)拴住, 刹住; vi. 锁住, (齿轮等)啮合, (船)过闸"}],"doc":{"k":"结构化产品发行文件的条款说明","en":"Product Terms — Series 2024-11. The Notes are autocallable: if the Reference Share closes at or above the strike price on any observation date, the Notes are redeemed early and settled by cash settlement. Investors are exposed to the risk of a written put option through the embedded option contained in the Notes; principal is not protected. Where the Reference Share is in the money for the Issuer, coupon accrual ceases. Time decay, measured by theta, accrues to the Issuer. The Issuer may hedge using listed warrant positions and quarterly rollover of futures. The occurrence of a credit event in respect of the Reference Entity may terminate the Notes at fair value, which could be zero.","zh":"产品条款——2024 年第 11 期。本票据为自动赎回结构：若参考股份在任一观察日收盘价不低于行权价，票据将提前赎回并以现金交割方式结算。投资者通过票据所含的内嵌期权，承担相当于卖出一张看跌期权的风险；本金不受保障。当参考股份对发行人而言处于价内状态时，票息停止计提。以西塔衡量的时间价值损耗归发行人所有。发行人可使用上市窝轮头寸及按季移仓的期货进行对冲。若参考实体发生信用事件，本票据可按公允价值提前终止，而该价值可能为零。"}},{"i":38,"ti":"一笔都没留在交易所","dom":"derivatives","sc":"场外交易","tx":"老周住在元朗一间带院子的 {{cottage}}（小屋）里，院门口那段 {{stairs}}（楼梯）陡得吓人。我拎着两盒点心爬上去，他正在削苹果，手上那把 {{knife}}（刀）比苹果还大。\n\n\"你不是来送点心的，\"他说，\"你是来问东西的。\"\n\n我把打印好的清单放在石桌上。这两周我在追一个很简单的问题：这些交易到底在哪里成交的。\n\n答案是：哪儿都不在。\n\n一笔挂在交易所的都没有。所有敞口都是场外一对一签的，走 {{ISDA master agreement}}（ISDA 主协议）那套框架，抵押品安排另外挂一个 {{credit support annex}}（信用支持附件）。里面写了每天怎么估值、{{maintenance margin}}（维持保证金）跌到什么水平触发追缴、追缴要在几个小时内到账。这些数字不上盘面，不进任何一张成交回报，外面看不见。\n\n\"所以你看到的价格是真的，\"老周把苹果切成两半，\"你看不到的那部分才决定谁活着。\"\n\n他让我拿最普通的例子练手。比方白银——{{silver}}（白银）期货前几年出现过一次 {{backwardation}}（期货贴水），近月比远月贵，那时候做 {{cash-and-carry arbitrage}}（期现套利）的人反着算账；股票这边则简单得多，机构不想动用额度买正股，就签一笔 {{equity swap}}（股票收益互换），或者一张 {{forward contract}}（远期合约），把 {{exposure}}（敞口）拿到手，正股一股都不用持有。要对冲系统性风险，另一头挂上 {{index futures}}（股指期货）就行。整套动作从头到尾不需要交易所的 {{approval}}（批准）。\n\n\"你 {{regularly}}（定期）看的那些数据，\"他说，\"记录的是市场的 {{habit}}（习惯），不是它的骨头。\"\n\n我把话题拐回那份分层图。老周问我，卖给美国那边的到底是什么。我说是 {{securitization}}（资产证券化）产品，一部分包成 {{structured note}}（结构性票据），底层现金流按 {{waterfall}}（现金流瀑布）自上而下分：优先级先拿，劣后级最后拿，甚至拿不到。发行文件里还有一段 {{non-call period}}（不可赎回期），三年之内发行人不能赎回，等于把持有人锁在里面。\n\n他问评级。我说 {{rating agency}}（评级机构）给了优先级 AA，理由是分层加担保。他笑了一声，说他见过更荒唐的：同一批 {{commercial mortgage-backed security}}（商业地产按揭支持证券），底下的写字楼一半空着，评级只下调了一 {{notch}}（一档）。\n\n\"评级机构的 {{reputation}}（声誉）是资产，\"他说，\"资产是可以慢慢消耗的。\"\n\n我说我最难受的地方 {{opposite}}（恰恰相反）——不是他们评错了，是他们每一步都按流程走了。\n\n老周点头。他说这个行业里，真正 {{deserve}}（值得）警惕的从来不是明目张胆的谎，是一整套合规的安排。当年他签的那份报告也一样，没有一条违规。他停了停，说那年他见过一批客户变成 {{negative equity}}（负资产），房子卖了还欠钱，一群人组成 {{coalition}}（联合体）去 {{protest}}（抗议），银行门口站了三天，最后什么都没改变。\n\n回程的巴士上我在想 {{principal}}（本金）这个词。学校里教你算利息，没人教你，本金在这些结构里是可以被 {{convert}}（转换）成别人的收益的。\n\n我在手机上把持仓那张表 {{export}}（导出）成 PDF，顺手看了一眼我们那几张价外期权——它们现在 {{out of the money}}（价外），只剩 {{time value}}（时间价值），每天都在往下掉。这些东西也不 {{pose}}（构成）什么保护，最多算个念想。\n\n股价这两周在一个位置反复卡住，图上看是一条很硬的 {{resistance}}（阻力）线，成交却清淡得反常。{{slight}}（轻微的）异常我见得多了，这一次不一样：没有人在这个价位卖，也没有人愿意往上追。\n\n下车前收到 Elena 那条线的消息——不是给我的，是转了两手才到我这儿的。纽约那边启动了 {{discovery}}（证据开示）程序，第一批调取的文件里，有一家香港持牌机构过去三年签过的全部主协议附件。\n\n我认得那个名字。上周它刚给我们报过价。","ft":[{"w":"ISDA master agreement","z":"ISDA 主协议","d":"场外衍生品的标准合同框架，规定违约与终止的处理","a":"ISDA","p":""},{"w":"backwardation","z":"期货贴水","d":"近月价格高于远月，做多展期反而能赚到正收益","a":"","p":".bækwә'deiʃәn"},{"w":"cash-and-carry arbitrage","z":"期现套利","d":"买现货同时卖期货锁定基差，到期收敛时赚无风险价差","a":"","p":""},{"w":"commercial mortgage-backed security","z":"商业地产按揭支持证券","d":"底层是写字楼、商场等商业物业贷款的证券化产品","a":"CMBS","p":""},{"w":"credit support annex","z":"信用支持附件","d":"ISDA 项下约定抵押品如何缴纳与追加的文件","a":"CSA","p":""},{"w":"equity swap","z":"股票收益互换","d":"收益与股票表现挂钩的互换，机构不持股也能拿到敞口","a":"","p":""},{"w":"forward contract","z":"远期合约","d":"场外一对一约定未来买卖价格的合约，条款可以定制","a":"","p":""},{"w":"index futures","z":"股指期货","d":"以股票指数为标的的期货，机构对冲系统性风险的主力工具","a":"","p":""},{"w":"maintenance margin","z":"维持保证金","d":"账户权益必须保持的最低水平，跌破就触发追保","a":"","p":""},{"w":"negative equity","z":"负资产","d":"房价跌到低于贷款余额，借款人更容易选择直接断供","a":"","p":"ˈneɡətiv ˈekwiti"},{"w":"out of the money","z":"价外；虚值","d":"行权无收益的状态，价格只剩时间价值","a":"OTM","p":""},{"w":"rating agency","z":"评级机构","d":"给结构化产品打评级的机构，评级由发行人付费一直受诟病","a":"","p":""},{"w":"securitization","z":"资产证券化","d":"把一池现金流资产打包成可交易证券的过程","a":"","p":"sɪ'kjʊrətɪzeɪʃn"},{"w":"structured note","z":"结构性票据","d":"债券加衍生品打包的产品，收益挂钩股票、指数或汇率","a":"","p":""},{"w":"time value","z":"时间价值","d":"权利金里超出内在价值的部分，随到期临近不断衰减","a":"","p":"taim ˈvælju"},{"w":"waterfall","z":"现金流瀑布","d":"资金按优先顺序自上而下分配的机制，决定谁先拿钱","a":"","p":"'wɒtәfɒ:l"},{"w":"non-call period","z":"不可赎回期","d":"发行后一段时间内发行人不得行使赎回权","a":"","p":""},{"w":"notch","z":"子级；一档","d":"评级的最小调整单位，如从BBB下调一档到BBB-","a":"","p":"nɒtʃ"}],"iw":[{"w":"opposite","p":"'ɒpәzit","t":"a. 相对的, 相反的, 对面的; prep. 对面; n. 对立面"},{"w":"stairs","p":"","t":"n. 楼梯"},{"w":"approval","p":"ә'pru:vl","t":"n. 赞成, 批准; 核准"},{"w":"cottage","p":"'kɒtidʒ","t":"n. 小屋, 茅舍"},{"w":"deserve","p":"di'zә:v","t":"vt. 该得到, 值得; vi. 应得报答"},{"w":"principal","p":"'prinsipәl","t":"n. 校长, 首长, 本金, 主犯, 资本, 委托人; a. 主要的, 最重要的, 首要的"},{"w":"resistance","p":"ri'zistәns","t":"n. 抵抗力, 反抗, 耐力, 阻力, 电阻; 抵抗; 抗性; 阻力; 抗药性; 电阻"},{"w":"discovery","p":"dis'kʌvәri","t":"n. 发现, 被发现的事物; 要求告知, 发现, 发觉"},{"w":"exposure","p":"ik'spәuʒә","t":"n. 暴露, 揭发, 揭露; 曝光量; 照射; 照射量"},{"w":"protest","p":"prә'test","t":"n. 抗议, 反对, 抗议书, 断言; v. 反对, 抗议, 断言"},{"w":"pose","p":"pәuz","t":"n. 姿势, 姿态, 装模作样, 伪装; vi. 摆姿势, 装模作样, 假装; vt. 使摆好姿势, 提出, 造成"},{"w":"export","p":"ik'spɒ:t","t":"n. 输出品, 输出; vt. 输出, 出口; vi. 输出物资; 导出"},{"w":"reputation","p":".repju'teiʃәn","t":"n. 名誉, 名声, 声望; 名声, 名誉, 公认证据"},{"w":"slight","p":"slait","t":"n. 轻蔑, 怠慢; a. 轻微的, 纤细的, 脆弱的, 苗条的; vt. 轻视, 忽略, 怠慢"},{"w":"regularly","p":"'regjulәli","t":"adv. 有规则地, 一丝不苟地, 正式地"},{"w":"habit","p":"'hæbit","t":"n. 习惯, 嗜好, 习性; vt. 使穿衣"},{"w":"knife","p":"naif","t":"n. 小刀, 匕首; vt. 切割, 伤害, 切, 戳; vi. 劈开, 穿过"},{"w":"coalition","p":".kәuә'liʃәn","t":"n. 结合体, 结合, 联合; 联合, 联盟"},{"w":"silver","p":"'silvә","t":"n. 银, 银币, 银器; a. 银的, 银制的, 银器的; vt. 镀银; vi. 变银白色"},{"w":"convert","p":"kәn'vә:t","t":"n. 皈依者, 改变宗教信仰者; vt. 使改变信仰, 转换, 兑换, 倒置; vi. 皈依; 转换"}],"doc":{"k":"ISDA 主协议条款说明","en":"Clause 11 — Credit Support. Each Transaction under this ISDA master agreement is governed by the credit support annex executed on the same date. The parties shall value all positions daily, including any equity swap, forward contract, index futures hedge or structured note held as eligible collateral. If a party's account equity falls below the maintenance margin threshold, that party shall transfer eligible credit support within one business day. Positions that are out of the money retain time value only and shall be valued accordingly. Where collateral consists of securitization exposures, including any commercial mortgage-backed security, a downgrade of one notch by a recognised rating agency shall reduce the applicable valuation percentage.","zh":"第 11 条——信用支持。本 ISDA 主协议项下的每一笔交易，均受同日签署的信用支持附件约束。双方应每日对全部头寸进行估值，包括任何股票收益互换、远期合约、股指期货对冲头寸，以及作为合格抵押品持有的结构性票据。若一方账户权益低于维持保证金门槛，该方应于一个营业日内划转合格信用支持。处于价外状态的头寸仅保留时间价值，并应据此估值。若抵押品包含资产证券化敞口（含任何商业地产按揭支持证券），经认可评级机构下调一档评级的，适用的估值折算比例应相应下调。"}},{"i":39,"ti":"股价还在原地，债先动了","dom":"credit","sc":"债券与利差","tx":"周四早上，也就是 {{Thursday}}（星期四），债券组的同事在群里丢了一张截图，附了三个字：你看看。\n\n我点开。是这家公司那笔中资美元债的报价。五亿美元，三年前发的，走 {{144A}}（144A 私募发行）通道卖给美国的合格机构投资者。发行时票息不到五厘，现在的 {{credit spread}}（信用利差）已经从三百二十个基点走到七百八十。\n\n股价还在原地。债先动了。\n\n我盯着那条曲线看了很久。{{online}}（在线）的行情终端上，这只债的成交笔数一天不到十笔，报价宽得能开进一辆车。但方向没有任何含糊。\n\n我一直觉得利差是 {{symptom}}（症状），不是病。真正的 {{illness}}（病）在别处。可症状出现的顺序，往往比病历本身诚实。\n\n我把这家公司的 {{debt maturity profile}}（债务期限结构）拉出来铺满一整页。明年二月一笔境内私募到期，四月是这只美元债的付息日，八月还有一笔 {{dim sum bond}}（点心债）到期，规模不大但是硬钱。再往后是一只 {{convertible bond}}（可转债），转股价高得离谱，早就没人当股票看了，只当债看。\n\n{{numerous}}（众多的）到期日堆在同一年，本身就说明当年发债时没人 {{keen}}（热切地）关心过节奏，大家只关心票面。\n\n我把发行文件调出来，先看契约。{{covenant}}（债务契约条款）分两种：{{incurrence covenant}}（产生性契约）只在公司新增负债或者分红的时候才需要满足，平时你怎么烂都没人管；{{maintenance covenant}}（维持性契约）才是要按季度考核财务指标的那种。这只债里的维持性条款只有一条，门槛松得像没有。\n\n我还得 {{distinguish}}（区分）两件事：{{issuer rating}}（主体评级）和具体债项的评级不是一回事。上个月评级机构把主体展望改成了 {{negative outlook}}（负面展望），一句话，没有第二句。如果再往下一档，它就从投资级掉进高收益，变成一只标准的 {{fallen angel}}（堕落天使），一批指数基金会被迫卖出——不是因为看空，是因为规则。\n\nDanny 探头进来问要不要去吃饭。我说等一下。他自己带了外套，那件 {{jacket}}（夹克）洗得发白，说这是他跑江西基地那趟穿的。我想起那趟：厂区外面全是 {{agriculture}}（农业）用地，{{countryside}}（乡下地方）的路上一层土，车开过去，后视镜里 {{dust}}（灰尘）能扬三米高。\n\n吃饭的时候他往米线里挤了半盒 {{sauce}}（酱料），一边挤一边问：公司现在要是想活，能干什么？\n\n我说三条路。第一条，发 {{consent solicitation}}（征求同意），请持有人同意改条款，通常跟展期打包一起 {{submit}}（提交）表决；第二条，开 {{bondholder meeting}}（债券持有人会议），走法定程序；第三条，什么都不做，赌自己撑得过去。\n\n\"赌\"这个字我说出口就后悔了。以它现在的现金状况，第三条不是勇气，是 {{suicide}}（自杀式的选择）——只要错过一次付息，三十天的 {{grace period}}（宽限期）一过就是正式违约，债权人可以宣布 {{acceleration}}（加速到期），全额立刻要钱。以这家公司的 {{liquidity crunch}}（流动性紧张）程度，那一天来了就是终点。\n\nDanny 说他 {{volunteer}}（自告奋勇）去问几个做债的朋友，看有没有人愿意 {{voluntary}}（自愿）透一点持仓结构。我说好，但别问深了。\n\n下午我把 {{duration}}（久期）和 {{carry}}（票息收益）算了一遍。这只债的久期不长，真正吃人的不是利率，是信用。而现在的票息收益已经补不回违约概率——市场早就不在赌它还得起，是在赌回收率。\n\n我们这行的人对 {{recession}}（衰退）这种大词都没什么 {{passion}}（热情），大家更在意的是具体的一笔钱在哪一天到期。一次晚点付息，就足以 {{constitute}}（构成）一场连锁反应的起点。\n\n五点四十，Ray 站在我桌边看那张到期表。他等我把话说完，只问了一句：募集说明书你看到第几页了？\n\n我说风险因素那一段。\n\n他说，往后翻，翻到违约事件那一节。那一节的 {{arrival}}（到来）才是真正要命的。","ft":[{"w":"144A","z":"144A","d":"面向美国合格机构投资者的私募发行豁免条款","a":"144A","p":""},{"w":"acceleration","z":"加速到期","d":"债权人宣布债务立即到期并要求全额清偿","a":"","p":"әk.selә'reiʃәn"},{"w":"bondholder meeting","z":"债券持有人会议","d":"表决展期、豁免等重大事项的法定程序","a":"","p":""},{"w":"carry","z":"票息收益；carry","d":"持有一段时间赚到的票息扣除资金成本后的净收益","a":"","p":"'kæri"},{"w":"consent solicitation","z":"征求同意","d":"发行人请求持有人同意修改条款，常与展期打包","a":"","p":""},{"w":"convertible bond","z":"可转债","d":"可按约定价格转换为发行人股票的债券","a":"CB","p":""},{"w":"covenant","z":"债务契约条款","d":"借款协议里对借方的限制条件，违反即构成技术性违约","a":"","p":"'kʌvәnәnt"},{"w":"credit spread","z":"信用利差","d":"债券收益率高于同期限无风险利率的部分，信用定价核心","a":"","p":""},{"w":"debt maturity profile","z":"债务期限结构","d":"各年度到期债务的分布情况，判断偿付压力节奏","a":"","p":""},{"w":"dim sum bond","z":"点心债","d":"在香港市场发行的离岸人民币债券，规模不大但很常提","a":"","p":""},{"w":"duration","z":"久期","d":"衡量债券价格对利率变动敏感程度的核心指标","a":"","p":"dju'reiʃәn"},{"w":"fallen angel","z":"堕落天使","d":"从投资级被下调到高收益级的发行人，指数被动卖出压力大","a":"","p":""},{"w":"grace period","z":"宽限期","d":"错过付息后仍可补付而不构成正式违约的期限，通常三十天","a":"","p":""},{"w":"incurrence covenant","z":"产生性契约","d":"只在新增负债或分红等特定动作时才需满足的条款","a":"","p":""},{"w":"issuer rating","z":"主体评级","d":"针对发行人整体偿债能力给出的评级，不区分具体债项","a":"","p":""},{"w":"liquidity crunch","z":"流动性紧张","d":"手上现金不足以覆盖短期到期债务的状态","a":"","p":""},{"w":"maintenance covenant","z":"维持性契约","d":"要求持续满足杠杆或利息保障等财务指标的条款","a":"","p":""},{"w":"negative outlook","z":"负面展望","d":"提示未来一到两年评级有下调可能的前瞻表述","a":"","p":""}],"iw":[{"w":"countryside","p":"'kʌntrisaid","t":"n. 乡下地方, 乡下居民"},{"w":"symptom","p":"'simptәm","t":"n. 症状, 征候, 征兆; 症状"},{"w":"online","p":"","t":"联机"},{"w":"Thursday","p":"'θә:zdi","t":"n. 星期四"},{"w":"submit","p":"sәb'mit","t":"vt. 使服从, 使受到, 委托, 提交, 认为; vi. 屈服, 服从"},{"w":"dust","p":"dʌst","t":"n. 灰尘, 尘埃, 粉末, 花粉, 土, 骚乱; vt. 拂去灰尘, 撒, 弄成粉末; vi. 拂去灰尘, 化为粉末"},{"w":"voluntary","p":"'vɒlәntәri","t":"a. 自动的, 自愿的, 故意的, 志愿的, 自发的; n. 自愿行动, 志愿者, 自由调"},{"w":"distinguish","p":"dis'tiŋgwiʃ","t":"v. 区别, 辨别"},{"w":"jacket","p":"'dʒækit","t":"n. 夹克, 外套, 护套; vt. 给...穿夹克, 给...装护套"},{"w":"constitute","p":"kәn'stitjut","t":"vt. 构成, 组成, 任命; 构造, 组成"},{"w":"recession","p":"ri'seʃәn","t":"n. 后退, 凹处, 衰退, 归还; 退缩"},{"w":"agriculture","p":"'ægrikʌltʃә","t":"n. 农业; 农业, 农学"},{"w":"suicide","p":"'sjuisaid","t":"n. 自杀, 自杀者; v. 自杀; a. 自杀的"},{"w":"numerous","p":"'nju:mәrәs","t":"a. 很多的, 数目众多的, 多数的; 多数的, 甚多的"},{"w":"keen","p":"ki:n","t":"a. 锋利的, 敏锐的, 强烈的, 敏捷的, 热心的, 渴望的; n. 挽歌, 痛哭; v. 唱挽歌, 痛哭"},{"w":"arrival","p":"ә'raivl","t":"n. 到达, 抵达, 到达者; 到达, 到达物"},{"w":"passion","p":"'pæʃәn","t":"n. 激情, 酷爱, 热爱, 强烈感情, 耶稣受难(故事)"},{"w":"volunteer","p":".vɒlәn'tiә","t":"n. 志愿者; a. 志愿的; v. 自愿"},{"w":"sauce","p":"sɒ:s","t":"n. 酱油, 调味汁, 酱; vt. 给...调味, 使增加趣味"},{"w":"illness","p":"'ilnis","t":"n. 疾病, 恶意; 病"}],"doc":{"k":"债券募集说明书的风险因素段","en":"Risk Factors — Our indebtedness. The Notes were offered under Rule 144A to qualified institutional buyers and have not been registered. Our debt maturity profile is concentrated, and a widening of the credit spread on our outstanding notes may materially raise our future funding cost. Our issuer rating was recently placed on negative outlook. A further downgrade would render us a fallen angel and could force index-linked holders to sell. The Notes contain an incurrence covenant but only a limited maintenance covenant. If we fail to pay interest and do not cure within the applicable grace period, holders may declare acceleration of the Notes. A liquidity crunch could t
