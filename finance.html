n must be supported by an independent cross-check and a documented peer comparison before circulation. Please also record the prevailing borrow cost at the time of each execution. Given the risk of a long suspension, and the issuer's history as a serial acquirer engaged in stock promotion, no employee may discuss the position with any external party.","zh":"内部——合规。各位，就今早的复核，请注意以下事项。我们的做空逻辑建立在有据可查的危险信号之上，而非市场传言：盈利质量持续恶化、收入确认环节存在激进会计处理、每个期末均有粉饰报表迹象，以及最近三份年报所披露的存贷双高特征。任何结论在对外传阅之前，均须有独立的交叉验证和留痕的同业对比作为支撑。同时请记录每一笔执行当时的借券成本。鉴于该发行人可能面临长期停牌，且其历来是一家依靠吹票的连环并购者，任何员工不得与外部人士讨论本头寸。"}},{"i":54,"ti":"老周的那张纸","dom":"fraud","sc":"造假手法复盘","tx":"老周把一张 A4 纸横过来，放在我们中间，说：\"你坐好，我只画一次。\"\n\n他先在纸的正中画了一个长方形，写上\"报表\"两个字，然后用笔帽{{tap}}（轻敲）了两下纸面。\n\n\"我不会做假账。我这辈子只做一件事：看假账。方法只有一条——{{conservation}}（守恒）。钱不会凭空长出来，只会换个地方待着。所以我从来不去找假的那一笔，我去找不守恒的那一处。\"\n\n他从长方形往外画了六条线，一条一条编号，先给我看{{outline}}（轮廓），再往里填。\n\n第一条：{{electricity consumption}}（用电量）。\"产量是它自己说的，电是电网说的。两个数放一起，差多少是工艺，差多少是谎，做过工厂的人一眼能看出来。它的差值是三倍。\"\n\n第二条：{{implausible margins}}（毛利率高得不合理）。\"同行十二个点，它三十四个点。这一条我不下结论，我只把它挂在墙上，等原材料价格塌的那一年再看。碳酸锂塌了六成，它纹丝不动——这时候这条线才有{{conviction}}（坚信）。\"\n\n第三条：{{low interest income}}（利息收入偏低）。\"账上八十亿现金，一年利息收入四千万。同时它还在借年息八个点的钱。\"他抬头看我，\"这一条最好用，因为它不需要你懂这个行业。任何一个有存款的人都懂。\"\n\n第四条：{{phantom assets}}（虚假资产）。\"账上有，地上没有。所以你去了江西，所以有人给你拍了三年的停车场。\"\n\n第五条：{{related party loans}}（关联方借款）。\"钱是怎么走出去的。\"\n\n第六条：{{asset stripping}}（剥离掏空资产）。\"钱走出去以后，好东西怎么跟着走出去的。\"\n\n他把六条线的末端连起来，围成一个圈。\n\n\"你看，\"他说，\"每一条单独拿出来，公司都能给你一个解释，而且都不算撒谎。可六条放在一起，它们互相{{reinforce}}（加强）。这就是{{insight}}（洞察）——不在任何一条里，在它们的交叉点上。\"\n\n我问他，二十年前他是不是也画过这张图。\n\n他沉默了几秒，那句话在{{tongue}}（舌）上滚了一圈才出来：\"画过。画完我签了字。那一{{episode}}（插曲）我到现在还没{{readily}}（轻易地）过去。\"\n\n他又在纸的右下角写了两个字：质押。\n\n\"{{share pledge}}（股权质押）不是财务问题，是时间表。大股东质押了九成二，股价跌到平仓线，他必须动。你要判断的不是他会不会造假，而是他还剩几天。\"\n\n然后他在纸的左边写下公司这一年的动作：停牌、独立调查、审计师辞任，还有那份{{announcement}}（公告）里最响的一句——{{sue the short seller}}（起诉做空方）。\n\n\"这一步几乎每家都会走，\"他说，\"以诽谤为由把你告上去，先在{{magistrate}}（地方法官）那边走一轮程序。他们要的不是判决，是时间。你要做的是把每一句话都留下书面记录，别在这上面浪费{{craft}}（技艺）。\"\n\n\"最后呢？\"\n\n他在长方形上打了个叉，写：{{cancellation of listing}}（除牌）。\n\n\"这一步是{{inevitable}}（必然的）的。停牌超期，规则自己会走完。不需要谁下{{ban}}（禁令），也不会有人替它{{crash}}（崩溃）负责。\"\n\n他放下笔，把纸推到我面前。\n\n\"这张纸给你。但我要说三件事。\"\n\n\"第一，造假的人会{{adapt}}（适应）。你封了一条路，下一家换一条走，所以别背这张图，要背这套问法。\"\n\n\"第二，你要学会替对方辩护。每一条你都得先给它想一个{{counter}}（相反的）解释，想不出来，才算数。当年我要是肯多{{consult}}（请教）一个人，就不会签那个字。\"\n\n\"第三，\"他敲了敲那个圈，\"你现在的问题已经不是它假不假了。\"\n\n我说我知道。券商刚发来数据：这只票的空头占流通股比例四成一，{{crowded short}}（拥挤的空头）。券源紧到年化利率二十四，一旦复牌有人抢跑，先被抬走的是我们。\n\n\"这行的{{reward}}（酬谢）从来不给最先说话的人，\"老周把那个空盘子推开，笑了一下，\"给活到最后的人。我现在只打{{tennis}}（网球），不看盘。\"\n\n我把纸折成四折，放进内袋。\n\n出门的时候手机响了。Ray，两句话。\n\n\"三个 LP 同时递了赎回申请。\"\n\n\"用词都很客气。\"","ft":[{"w":"asset stripping","z":"剥离掏空资产","d":"以低价把优质资产卖给关联方，只留下空壳","a":"","p":""},{"w":"cancellation of listing","z":"除牌","d":"港股退市的正式说法，停牌超期即被取消上市地位","a":"","p":""},{"w":"crowded short","z":"拥挤的空头","d":"过多资金做空同一标的，轧空风险显著上升","a":"","p":""},{"w":"electricity consumption","z":"用电量","d":"工厂真实开工率的硬指标，可对照产量披露核验","a":"","p":""},{"w":"implausible margins","z":"毛利率高得不合理","d":"利润率远超同行又无合理解释，是常见的切入点","a":"","p":""},{"w":"low interest income","z":"利息收入偏低","d":"账上巨额现金却几乎没有利息收入，现金真实性存疑","a":"","p":""},{"w":"phantom assets","z":"虚假资产","d":"账上有、实地却没有的厂房、设备或矿山","a":"","p":""},{"w":"related party loans","z":"关联方借款","d":"上市公司与关联方的资金往来，易变成变相占用","a":"","p":""},{"w":"share pledge","z":"股权质押","d":"大股东把股票抵押融资，股价下跌会触发平仓风险","a":"","p":""},{"w":"sue the short seller","z":"起诉做空方","d":"以诽谤为由提告，实务上很少能反转基本面质疑","a":"","p":""}],"iw":[{"w":"adapt","p":"ә'dæpt","t":"vt. 使适应, 改编; vi. 适应"},{"w":"reward","p":"ri'wɒ:d","t":"n. 报酬, 酬谢, 赏金; vt. 奖赏, 酬谢, 给...应有报应"},{"w":"conservation","p":".kɒnsә'veiʃәn","t":"n. 保护, 保存; 保存"},{"w":"ban","p":"bæn","t":"n. 禁令; vt. 禁止, 取缔"},{"w":"announcement","p":"ә'naunsmәnt","t":"n. 公告, 发表, 告知; 通告, 布告, 公告"},{"w":"consult","p":"kәn'sʌlt","t":"vi. 商讨, 商量, 协商, 会诊; vt. 向...请教, 查阅, 考虑"},{"w":"counter","p":"'kauntә","t":"n. 计算器, 计算者, 柜台, 筹码; a. 反方向的, 相反的; adv. 反方向地, 相反地; 计数器; 计数字"},{"w":"tongue","p":"tʌŋ","t":"n. 舌, 语言能力, 讲话方式, 语言; vt. 舔, 斥责, 发...的音; vi. 使用舌头, 吹管乐器"},{"w":"crash","p":"kræʃ","t":"n. 哗啦声, 猛撞, 崩溃, 粗布; v. 撞碎, 破碎, (使)...坠毁; a. 速成的; 崩溃"},{"w":"inevitable","p":"in'evitәbl","t":"a. 不可避免的, 必然的; 不可避免的, 无法规避的, 必然的"},{"w":"outline","p":"'autlain","t":"n. 大纲, 轮廓, 概要; vt. 描画轮廓, 描述要点; n. 大纲, 分级, 轮廓; 大纲, 分级, 轮廓"},{"w":"craft","p":"kræft","t":"n. 技艺, 手艺, 诡计; vt. 精心制作"},{"w":"reinforce","p":".ri:in'fɒ:s","t":"vt. 加强, 增援, 补充; vi. 求援, 得到增援; n. 加固材料"},{"w":"conviction","p":"kәn'vikʃәn","t":"n. 定罪, 信服, 坚信; 定罪, 证明有罪, 判罪"},{"w":"insight","p":"'insait","t":"n. 察看, 洞察力, 见识; 自知力, 洞察, 顿悟"},{"w":"tap","p":"'tæp","t":"n. 轻打, 水龙头; vt. 轻打, 轻敲, 敲打出, 选择, 装上嘴子, 使流出, 开发, 分接, 向...乞讨; vi. 轻叩, 轻拍, 啪塔啪塔地走; 接头"},{"w":"magistrate","p":"'mædʒistreit","t":"n. 长官, 法官, 推事; 司法行政官, 治安法官, 地方法官"},{"w":"episode","p":"'episәud","t":"n. 插曲, 插话, 有趣的事件, 一段情节; 插话, 插曲, 发作"},{"w":"tennis","p":"'tenis","t":"n. 网球"},{"w":"readily","p":"'redili","t":"adv. 迅速地, 轻易地, 乐意地"}],"doc":{"k":"审计复核备忘录","en":"MEMORANDUM - REVIEW OF IDENTIFIED IRREGULARITIES. The reviewer's approach has been reconciliation rather than allegation. Reported output was tested against reported electricity consumption at each site, and the variance is not explicable by process efficiency. Implausible margins persist through a period of sharply falling input prices. Low interest income is inconsistent with the cash balance disclosed. Site inspection supports the conclusion that certain fixed assets are phantom assets. Funds appear to have left the group through related party loans, followed by asset stripping at prices below independent valuation. The controlling shareholder's share pledge ratio exceeds ninety per cent. The issuer's decision to sue the short seller does not address these matters, and cancellation of listing remains the likely outcome. Note also that a crowded short raises squeeze risk.","zh":"备忘录——已识别异常事项的复核。复核人采取的是勾稽核对而非指控的进路。各基地披露的产量已与其披露的用电量逐一比对，差异无法以工艺效率解释。在投入品价格大幅下跌的整个期间，毛利率高得不合理的状况依然持续。利息收入偏低与所披露的现金余额互相矛盾。实地查勘支持如下结论：部分固定资产属虚假资产。资金似经由关联方借款流出集团，其后又以低于独立评估的价格发生剥离掏空资产。控股股东的股权质押比例已超过九成。发行人选择起诉做空方并未回应上述任何一项，除牌仍是最可能的结局。另请注意，拥挤的空头会抬高轧空风险。"}},{"i":55,"ti":"三封很客气的信","dom":"fund","sc":"LP 与赎回","tx":"三封信是同一个下午到的，间隔不到四十分钟。\n\n第一封来自一家新加坡的家族办公室，第二封是欧洲一家母基金，第三封来自我们最老的那个客户——2016 年就在的保险资金。\n\n三封都写得很{{pleasant}}（愉快的）：感谢过去几年的合作，出于内部资产配置调整的需要，拟于本季度末赎回全部份额，祝一切顺利。\n\nRay 把三封信打印出来，并排摊在会议桌上，看了很久。\n\n\"你有没有觉得，\"他说，\"这三封信是同一个人教着写的。\"\n\n我拿起来对。第一封和第三封的第二段，句式一模一样，连\"内部资产配置调整\"这七个字的位置都一样。\n\nDanny{{shrug}}（耸肩）了一下：\"也可能是同一家律所的模板。\"\n\n\"是同一家律所的模板，\"Ray 说，\"问题是这三家以前不用同一家律所。\"\n\n会计把数字发过来的时候，会议室安静了三秒。\n\n本季{{maximum drawdown}}（最大回撤）二十九个点，是这只基金成立以来最深的一次。{{net return}}（净收益）为负。{{high-water mark}}（高水位线）还挂在两年前那个位置，意味着今年 Ray 一分业绩报酬都拿不到，明年大概率也拿不到。\n\n真正麻烦的不是数字，是结构。\n\n\"我们有{{liquidity mismatch}}（流动性错配）。\"我说。\n\n这句话说出口，我自己都觉得刺耳。我们的核心仓位是一只停牌的股票——它一天都不能交易，而 LP 的赎回条款是季度、三十天通知。持仓卖不动，钱随时能走。教科书上关于基金爆雷的那一章，第一句写的就是这个。\n\nRay 问 Ivy：能不能设{{gate}}（赎回限制）。\n\nIvy 说条款上可以，单季赎回超过百分之十五就能按比例限制。但她提醒了一句：那家保险资金签过{{side letter}}（补充协议），条款里明确{{entitle}}（给予权利）它在任何情况下享有{{prior}}（在先的）赎回顺位，且不受设闸约束。\n\n\"抽屉协议。\"Danny 说。\n\n\"是我签的。\"Ray 说，\"2016 年，我们只有四千万规模，那时候他愿意进来，我什么都肯签。\"\n\n那一刻我看见他脸上有种很少见的东西，不是愤怒，是那种被自己五年前的决定{{assault}}（袭击）到的表情。\n\n我们把仓位摊开算。剩下的空头里，{{stock borrow}}（券源）最紧的那部分年化二十四，每多拿一天就是钱；能平的那些属于{{relative value}}（相对价值）和{{event-driven}}（事件驱动）的小仓，加起来不到组合的三成。也就是说，为了满足赎回，我们只能卖掉那些还活着的头寸，把最不流动的东西留下来给剩下的 LP{{absorb}}（承担）。\n\n\"这才是{{controversy}}（争论）会来的地方，\"我说，\"不是我们亏了多少，是留下来的人要替走掉的人扛多少。\"\n\n下午三点，主经纪商那边的人打来电话，语气非常{{monetary}}（金钱的）——一句寒暄没有，直接说融资成本上调，同时\"善意提醒\"我们，他们的{{capital introduction}}（资本引荐）团队近期恐怕排不出档期。\n\n我挂了电话，跟 Ray 说：他们上个月还想拉我们去做路演。\n\n\"一家{{pod shop}}（多经理平台）上周挖了 Danny，\"Ray 说，\"你知道吗。\"\n\n我说我知道。Danny 没答应。\n\n\"他们给的条件比我们好，\"Ray 说，\"我不拦。\"\n\n傍晚数据出来，我把这一年的{{tracking error}}（跟踪误差）拉了一遍，图上那条线在三月之后就彻底脱离基准，越走越远。这不是风格漂移，这是我们把全部身家押在一件事上。所谓{{alpha}}（超额收益），到今天为止都是浮的——账面上很好看，账户里没有一分钱。\n\n我又拉了一张持仓重合度的图。同一时间做空 2318 的机构从两家变成了十一家。{{crowded trade}}（拥挤交易）四个字这一年被我说了无数遍，第一次是形容别人，今天是形容自己。\n\nRay 让我们都回去。他一个人在会议室里坐到很晚。\n\n我十点回办公室拿东西，灯还亮着。他在改给 LP 的回信，改到第九稿。我在门口站了一会儿。\n\n\"别写得像{{funeral}}（葬礼）请柬，\"我说。\n\n他笑了一下：\"那写成什么？\"\n\n\"写成一份研究报告。你把逻辑摆出来，摆到人家能自己判断。\"\n\n他点头，删掉了整整一段。屏幕上那段字{{fade}}（消失）的时候，我看见了删掉的是什么——是他解释为什么这不算{{tragedy}}（惨事）的那段。全是形容词。\n\n我把老周那张纸从内袋里掏出来，压在他键盘旁边。\n\n\"这个你留着。\"\n\n他没抬头，只是用手指{{trace}}（描绘）了一遍纸上那六条线。这个{{gesture}}（姿态）我看懂了：他在确认自己有没有漏掉哪一条。\n\n\"林砚，\"他忽然说，\"你去查一件事。\"\n\n\"查什么？\"\n\n\"这三家 LP，问问他们各自的顾问是谁。\"他把眼镜摘下来，用衬衫下摆{{rub}}（擦）了两下，\"我不需要{{shelter}}（庇护），我只想知道我们现在站在哪个{{pit}}（深坑）边上。\"\n\n那天夜里，我给三家分别发了邮件。第二天中午，三份回复摆在我面前。\n\n三家的现金管理顾问不是同一家。但三家在过去十八个月里，都参加过同一个由某家纽约多策略基金主办的{{intellectual}}（智力的）沙龙——名字很文雅，叫\"跨周期配置研讨\"。\n\n主办方的{{highlight}}（精彩场面）环节，是首席投资官的闭门演讲。\n\n那个人，被主办方在议程上{{characterize}}（描绘特性）为\"过去十年最擅长在别人恐慌时{{venture}}（冒险）的投资人\"。\n\n我知道他是谁。\n\n我把那份议程转给了 Ray，一个字没加。","ft":[{"w":"alpha","z":"阿尔法；超额收益","d":"剔除市场涨跌影响后，靠选股和择时赚到的那部分收益","a":"","p":"'ælfә"},{"w":"capital introduction","z":"资本引荐","d":"主经纪商牵线把基金介绍给潜在出资人的增值服务","a":"","p":""},{"w":"crowded trade","z":"拥挤交易；抱团","d":"太多资金挤在同一笔交易上，一旦反转就是集体踩踏","a":"","p":""},{"w":"event-driven","z":"事件驱动","d":"围绕并购、重组、增发等具体事件下注的策略","a":"","p":""},{"w":"gate","z":"赎回限制；设闸","d":"单期赎回超过上限时按比例限制赎回，防止挤兑","a":"","p":"geit"},{"w":"high-water mark","z":"高水位线","d":"基金净值创新高才能提业绩报酬，防止亏了又赚重复收费","a":"","p":""},{"w":"liquidity mismatch","z":"流动性错配","d":"持仓卖不动但投资人随时能赎回，是基金爆雷的常见诱因","a":"","p":""},{"w":"maximum drawdown","z":"最大回撤","d":"历史上最惨的那一次跌幅，是出资人尽调必问的数字","a":"","p":""},{"w":"net return","z":"净收益；费后收益","d":"扣掉管理费和业绩报酬后投资人实际拿到手的收益","a":"","p":""},{"w":"pod shop","z":"多经理平台；pod制","d":"平台下挂多个独立小组各自管钱，风控极严做不好就走人","a":"","p":""},{"w":"relative value","z":"相对价值","d":"赚两个相关标的估值差回归的钱，不赌绝对方向","a":"","p":""},{"w":"side letter","z":"补充协议；抽屉协议","d":"单独给某个大客户的额外条款，如更低费率或优先赎回","a":"","p":""},{"w":"stock borrow","z":"券源","d":"做空前必须先借到的股票，借不到就做不成这笔空单","a":"","p":""},{"w":"tracking error","z":"跟踪误差","d":"组合收益偏离基准的幅度，偏离越大主动程度越高","a":"","p":""}],"iw":[{"w":"highlight","p":"'hailait","t":"n. 加亮区, 精彩场面; vt. 加亮, 使显著, 以强光照射, 突出; 突出"},{"w":"prior","p":"'praiә","t":"a. 更重要的, 较早的, 在先的; n. 小隐修院院长, 大隐修院副院长"},{"w":"intellectual","p":".intә'lektʃuәl","t":"n. 有知识者, 知识分子, 凭理智做事者; a. 智力的, 用脑力的, 聪明的"},{"w":"characterize","p":"'kærәktәraiz","t":"vt. 描绘...的特性, 刻划...的性格"},{"w":"assault","p":"ә'sɒ:t","t":"n. 攻击, 袭击; vt. 袭击, 攻击; vi. 发动攻击"},{"w":"monetary","p":"'mʌnitәri","t":"a. 货币的, 金钱的; 货币的, 金融的"},{"w":"shrug","p":"ʃrʌg","t":"n. 耸肩; v. 耸肩"},{"w":"trace","p":"treis","t":"n. 痕迹, 踪迹, 微量, 迹线, 缰绳; vt. 追踪, 回溯, 描绘; vi. 追溯, 沿路走"},{"w":"shelter","p":"'ʃeltә","t":"n. 庇护所, 避难所, 庇护, 隐蔽处, 掩蔽; vt. 庇护, 保护, 隐匿; vi. 躲避"},{"w":"rub","p":"rʌb","t":"n. 摩擦, 困难, 障碍, 磨损处; vt. 擦, 搓, 摩擦, 惹怒; vi. 摩擦, 擦破"},{"w":"controversy","p":"'kɒntrәvә:si","t":"n. 论争, 辩论, 论战, 争论; 论战, 争论, 争吵"},{"w":"absorb","p":"әb'sɒ:b","t":"vt. 吸收, 使全神贯注, 同化, 买进, 理解, 承受, 忍受, 承担; 吸收"},{"w":"pleasant","p":"'pleznt","t":"a. 愉快的, 可爱的, 活泼的, 亲切的"},{"w":"fade","p":"feid","t":"vi. 褪色, 消失, 凋谢; vt. 使褪色; n. 淡入, 淡出; a. 平淡的"},{"w":"pit","p":"pit","t":"n. 深坑, 矿井, 果核, 地窖, 深渊, 绝境, 陷阱; vt. 窖藏, 使凹下, 使有麻点, 去...之核, 使留疤痕, 使相斗, 使竞争; vi. 起凹点, 凹陷"},{"w":"gesture","p":"'dʒestʃә","t":"n. 手势, 姿态; vi. 作手势, 作姿态"},{"w":"tragedy","p":"'trædʒidi","t":"n. 悲剧, 惨案, 悲剧作品; 惨事, 灾难, 不辛"},{"w":"funeral","p":"'fju:nәrәl","t":"n. 葬礼, 出殡"},{"w":"entitle","p":"in'taitl","t":"vt. 给...权利, 取名为, 给予名称, 叫做; 给...权利, 使有资格, 称呼"},{"w":"venture","p":"'ventʃә","t":"n. 冒险, 风险; vt. 敢于, 冒...的危险; vi. 冒险"}],"doc":{"k":"基金致投资人通函","en":"Dear Investor, We write further to the redemption requests received for the current quarter. The Fund's net return remains materially below its high-water mark following the maximum drawdown recorded in the period. The Manager has reviewed the liquidity mismatch between the Fund's remaining positions, for which stock borrow is limited and secondary liquidity minimal, and the redemption terms, and has resolved not to apply the gate on this occasion. Investors holding a side letter conferring priority redemption rights have been notified separately. The Manager acknowledges that the principal position has become a crowded trade. Tracking error against the benchmark, together with the alpha attributable to our event-driven and relative value books, is set out in the appendix.","zh":"尊敬的投资人：就本季度收到的赎回申请，谨函告如下。继本期录得最大回撤之后，本基金的净收益仍显著低于其高水位线。管理人已就以下两者之间的流动性错配进行检视：一方面是基金余下持仓，其券源有限且二级市场流动性极低；另一方面是赎回条款。管理人决定本次不启用赎回限制。持有补充协议并据此享有优先赎回权的投资人，已另行获得通知。管理人确认，主要持仓已成为一笔拥挤交易。组合相对基准的跟踪误差，连同事件驱动与相对价值两个子组合所贡献的超额收益，详见附录。"}},{"i":56,"ti":"高水位在两年前","dom":"fund","sc":"业绩报酬与高水位","tx":"高水位线钉在两年前那个数字上，一动不动。\n\n十一月最后一个星期一，Ivy 把结算表推到 Ray 面前，只有一页。\n\n\"{{crystallization}}（业绩报酬计提）那一栏是零，\"她说，\"今年零。按现在的净值，明年大概也是零。\"\n\nRay 没接话。他是这只基金的{{portfolio manager}}（基金经理），也是它的{{architect}}（缔造者）：条款他谈的，风格他定的，四千万做到十九亿。现在他要在自己盖的房子里白干两年。\n\n会议室安静得像座{{cathedral}}（大教堂），Danny 坐在最远那头，一句话都不敢出。\n\n我把{{attribution}}（业绩归因）表投到屏幕上。这活儿做起来像当{{detective}}（侦探），把每一分钱的来路拆开：行业、个股、汇率、费用。今年的{{excess return}}（超额收益）分成两段看，前十个月是正的，后两个月一口气吃回去。{{hit rate}}（胜率）其实不差，六成二，可赚的都是小钱，亏的那一笔太大。\n\n\"这就是问题，\"Ivy 说，\"{{composition}}（构成）没病，权重有病。\"\n\n我把持仓按行业切成六个{{segment}}（片段），最{{prominent}}（突出的）那一块占净值四成二，就是 2318。这个数字不用解释，谁看都懂。\n\nRay 终于开口，问能不能把停牌的那部分放进{{side pocket}}（侧袋账户），单独隔离，不影响其他份额的估值和赎回。\n\n\"技术上可以，\"Ivy 说，\"但那等于告诉市场我们卖不掉。\"\n\n\"我们本来就卖不掉。\"\n\n\"知道和公告是两件事。\"\n\nRay 用手指敲了两下桌面。这个动作我认得，他在算时间。留下来的 LP 里还有两家在{{lock-up}}（锁定期）里，走不了；其余的随时能走。要活下去只有两条路：等复牌，或者做一轮{{capital raise}}（募资）。前一条不由我们，后一条要看今年的数字，而今年的数字{{nowhere}}（无处）可藏。\n\n\"我不会为了好看去{{trim}}（减仓），\"Ray 说，\"减了就等于承认。\"\n\n\"你可能没得选。\"我说，\"风控那边的{{risk limit}}（风控限额）已经在响，再跌四个点就到线。\"\n\n\"到线怎么样？\"\n\n\"到线就不是你决定{{stop loss}}（止损）不止损，是系统替你决定。\"\n\n他{{deaf}}（装聋）了三秒，然后笑了一下，说他懂。\n\n隔壁楼那家平台上个月挖 Danny，条件确实好：底薪、分成比例，还配了做{{global macro}}（全球宏观）和{{merger arbitrage}}（并购套利）的同事帮他摊平波动。Danny 把 offer 给我看过，我只提醒他看一条——{{netting risk}}（轧差风险）。平台里有人赚有人亏，公司照付赚钱那组的提成，却收不到亏钱那组的费；这个窟窿最后会以各种形式{{confine}}（限制）到每个人头上：风控更紧，额度更少，{{squeeze}}（挤压）更狠。\n\n\"所以那边不{{violate}}（违反）任何规则，\"Danny 说，\"就是把你活活压小。\"\n\n\"对。{{thereby}}（因此）你会变成一个非常{{steady}}（稳定的）的人。\"\n\n他没笑。\n\n下午三点，那家欧洲母基金的人从{{Berlin}}（柏林）打来电话，语气很{{pacific}}（平和的），说他们内部的年度{{summit}}（高层会议）刚开完，配置委员会对\"单一持仓集中度\"有了新的看法。他一次都没提赎回两个字，可整通电话说的都是这个。\n\n挂了电话，我盯着那张归因表看了很久。真正让我后背发凉的不是零业绩报酬，是我意识到：这张表里最漂亮的那一段，恰恰是我们把{{structural}}（结构性的）问题当成周期问题的那两个月。数字曾经很好看，而好看这件事本身，就是最好的{{mask}}（掩饰）。\n\nRay 站起来收东西，忽然问我：\n\n\"你去年最{{excitement}}（兴奋）的是哪一天？\"\n\n我说是我把十九条列成一张表拿给你看的那天。\n\n\"我也是。\"他说，\"{{regardless}}（不管）后面怎么样，那天我们是对的。\"\n\n他走了。我留下来关灯。屏幕暗掉之前，最后一行小字还亮着：本期计提基准——上一高水位。\n\n第二天早上八点四十，风控经理站在我工位旁边，手里捏着一张打印纸。\n\n他说：\"砚姐，昨晚收盘，我们过线了。\"","ft":[{"w":"attribution","z":"业绩归因","d":"拆解收益来自行业、个股还是大盘，找出真正的贡献来源","a":"","p":"әtri'bju:ʃәn"},{"w":"capital raise","z":"募资","d":"向出资人筹集新资金的过程，通常伴随路演和尽调","a":"","p":""},{"w":"crystallization","z":"业绩报酬计提；结算","d":"把账面上的浮动业绩提成在约定时点真正落袋的动作","a":"","p":"'kristәlai'zeiʃәn"},{"w":"excess return","z":"超额收益","d":"组合收益减去基准收益的部分，是主动管理的价值所在","a":"","p":""},{"w":"global macro","z":"全球宏观","d":"从利率、汇率和大宗商品的大方向出发做跨市场配置","a":"","p":""},{"w":"hit rate","z":"胜率","d":"赚钱的持仓占全部持仓的比例，反映选股的命中率","a":"","p":""},{"w":"lock-up","z":"锁定期；封闭期","d":"投进来后不能赎回的一段时间，帮基金稳住资金来源","a":"","p":""},{"w":"merger arbitrage","z":"并购套利","d":"买入被收购方，赚取交易对价与现价之间的价差","a":"","p":""},{"w":"netting risk","z":"轧差风险","d":"平台里有人赚有人亏，公司照付提成却收不到费的风险","a":"","p":""},{"w":"portfolio manager","z":"基金经理；组合经理","d":"对组合最终拍板的人，决定买什么、买多少、什么时候卖","a":"PM","p":""},{"w":"risk limit","z":"风控限额","d":"对单票、行业和回撤设的上限，触碰就必须被动降仓","a":"","p":""},{"w":"side pocket","z":"侧袋账户","d":"把流动性差的资产单独隔离，不影响其他份额估值和赎回","a":"","p":"said ˈpɔkit"},{"w":"stop loss","z":"止损","d":"跌到设定的线就砍仓，平台化基金里通常是硬性规定","a":"","p":""},{"w":"trim","z":"减仓","d":"卖掉一部分持仓但不清仓，多用于兑现浮盈或控制风险","a":"","p":"trim"}],"iw":[{"w":"architect","p":"'ɑ:kitekt","t":"n. 建筑师, 设计者, 缔造者"},{"w":"squeeze","p":"skwi:z","t":"n. 紧握, 挤, 榨, 榨取, 佣金; vt. 紧握, 挤, 榨取; vi. 压榨, 榨"},{"w":"excitement","p":"ik'saitmәnt","t":"n. 刺激, 兴奋; 兴奋, 激动"},{"w":"mask","p":"mæsk","t":"n. 面具, 假面具, 掩饰, 石膏面模; vt. 戴面具, 掩饰, 使模糊; vi. 化装, 戴面具, 掩饰, 参加化装舞会; 屏蔽; 掩码"},{"w":"cathedral","p":"kә'θi:drәl","t":"n. 大教堂"},{"w":"deaf","p":"def","t":"a. 聋的; 聋的"},{"w":"prominent","p":"'prɒminәnt","t":"a. 卓越的, 显著的, 突出的, 凸出的"},{"w":"confine","p":"kәn'fain","t":"vt. 限制, 使不外出, 禁闭; vi. 邻接, 交界; n. 边缘, 范围, 区域"},{"w":"regardless","p":"ri'gɑ:dlis","t":"a. 不管, 不注意, 不顾"},{"w":"detective","p":"di'tektiv","t":"n. 侦探; a. 侦探的"},{"w":"Berlin","p":"bә:'lin","t":"n. 柏林, (软质)柏林毛线"},{"w":"summit","p":"'sʌmit","t":"n. 顶点, 最高阶层, 最高级会议; a. 政府首脑的, 最高级的"},{"w":"violate","p":"'vaiәleit","t":"vt. 违犯, 亵渎, 违反, 侵犯, 妨碍; 违犯, 违反"},{"w":"thereby","p":"'ðєәbai","t":"adv. 因此"},{"w":"composition","p":"kɒmpә'ziʃәn","t":"n. 作文, 创作, 组成; 成分; 组成"},{"w":"pacific","p":"pә'sifik","t":"n. 太平洋; a. 太平洋的, 太平洋沿岸的, 爱好和平的, 安静的, 平息的"},{"w":"steady","p":"'stedi","t":"a. 稳定的, 不动摇的, 沉着的, 稳固的, 坚定的, 经常的; vt. 使稳定, 使坚定; vi. 变为沉着, 稳固"},{"w":"structural","p":"'strʌktʃәrәl","t":"a. 结构的, 建筑的; 结构的"},{"w":"segment","p":"'segmәnt","t":"n. 片段, 部分, 分节, 段; v. 分割, 分裂; 段"},{"w":"nowhere","p":"'nәuhwєә","t":"adv. 无处, 到处都无"}],"doc":{"k":"业绩报酬计提备忘录","en":"MEMORANDUM - PERFORMANCE FEE CRYSTALLIZATION. Following the annual valuation date, the Manager confirms that no performance fee will crystallize in respect of the current period. Net asset value per share remains below the applicable high-water mark, and the incentive allocation is accordingly nil for the portfolio manager and the investment team. The attribution analysis appended hereto shows that excess return for the period was concentrated in a single position, notwithstanding a hit rate of 62 percent across the book. The Manager is reviewing whether the suspended holding should be transferred to a side pocket. Investors remaining within their lock-up will be consulted before any capital raise is launched. The risk limit framework is unchanged; any requirement to trim will be applied mechanically.","zh":"备忘录——业绩报酬计提。截至年度估值日，管理人确认本期不会有任何业绩报酬计提落袋。每份份额净值仍低于适用的高水位线，因此基金经理及投研团队本期的业绩提成分配为零。随附的业绩归因分析显示，本期超额收益集中于单一头寸，尽管整个持仓账簿的胜率为百分之六十二。管理人正在评估是否应将停牌持仓转入侧袋账户。在启动任何募资之前，仍处于锁定期内的投资人将获事先征询。风控限额框架维持不变；任何触发减仓的要求将按机制自动执行。"}},{"i":57,"ti":"差零点八个点","dom":"fund","sc":"回撤与风控限额","tx":"那张纸上只有三行，最后一行加粗：建议即时下调总敞口三成。\n\n拿纸来的人叫何锐，我们的{{risk manager}}（风控经理），入行十四年，说话像念条款。他把纸放在我桌上，站着等我看完。\n\n\"昨晚收盘，季度回撤二十九点八，硬线是二十九。\"\n\n\"差零点八个点。\"\n\n\"线就是线。\"他说，\"我不是来商量的，是来通知你，然后把你的{{objection}}（异议）记进纪要。\"\n\nRay 端着杯子出来，听完只问一句：谁的线。\n\n\"董事会的。\"何锐说，\"两年前你自己签的那版手册，第七页。\"\n\nRay 让 Ivy 去{{shelf}}（架子）上把蓝夹子拿下来。Ivy 说不用找，她背得出。\n\n四个人挤在小会议室里，像个临时凑起来的{{tribe}}（一群人）。桌上摊着当前的{{gross exposure}}（总敞口）：多头一点九倍，空头一点四倍，合计三点三。何锐要压到两点三。\n\n\"压哪一边？\"\n\n\"两边都压。按{{position sizing}}（定仓位）的规矩，先动权重最大的。\"\n\n我说不行。最大的空头停着牌，动不了；能动的全是对冲用的多头。把多头砍掉三成，等于把{{margin}}（余裕）全交出去，剩下的组合只会更{{vulnerable}}（脆弱的），不是更安全。\n\n\"我知道。\"何锐说，\"限额不管这个。它保护的是{{stability}}（稳定性），不是收益。\"\n\n这就是风控的本质：它不负责让你赚钱，它负责让你别死在明天。像个{{guardian}}（监护人）把病人绑在{{ward}}（病房）的床上——你可以骂他，但松开的那一刻，他就不再负责。\n\n\"这条规则本来是写给{{infant}}（新手）看的，\"何锐说，\"防止有人第一年就把杠杆开上天。\"\n\nRay 问能不能先跟{{custodian}}（托管行）核一遍当日可动用头寸。何锐说已经核过。\n\n降仓的直接后果是{{cash drag}}（现金拖累）：账上多出一大笔现金，赚不到钱，还得照付{{expense ratio}}（综合费率）。我们收的是老派的{{two and twenty}}（两点管理费加两成提成），管理费跟规模走，规模没变，费照收，只是这笔钱现在躺在那儿，{{repair}}（修复）不了任何东西。\n\n\"还有一件事。\"何锐翻到第二页，\"{{information ratio}}（信息比率）掉到零点一以下了。\"\n\n\"零点一什么意思？\"Danny 问。\n\n\"意思是从统计上看，我们过去一年跑赢{{benchmark}}（基准）的那点东西，跟运气分不开。\"\n\nRay 笑了：\"从统计上看，所有真话在被证明之前都是运气。\"\n\n那天下午的{{evolution}}（演变）比我想的快。降仓指令一出，成交量把我们暴露了。三点半，一个跑基金口的{{correspondent}}（记者）打进{{reception}}（前台），问我们是不是在{{flee}}（撤离）这个仓位。Ivy 回了六个字：我们不评论持仓。\n\n四点，两家原本观望的{{smart money}}（聪明钱）开始往同一个方向做。五点，一家{{long-only}}（纯多头）公募给我发消息，说他们内部把 2318 下调了评级。我读出来的意思是：终于有人替我们说话，可惜是在我们被迫减仓之后。\n\n晚上我翻自己的{{diary}}（工作日志）。三月那一页写着一句：仓位不是判断，仓位是判断乘以时间。当时觉得是漂亮话，现在像张诊断书。\n\n我把这一年从头捋了一遍，越捋越{{desperate}}（绝望的）。我们没有{{style drift}}（风格漂移），做的事和募集时说的一模一样；{{minimum investment}}（起投门槛）、{{notice period}}（赎回通知期）、条款、披露，一条都没走样。我们唯一\"错\"的地方，是对的时点比资金的耐心晚了三个月。\n\n十点多我下楼买水。楼下那片小{{lawn}}（草地）上有人遛狗，隔壁{{dining}}（餐厅）的招牌还亮着。我忽然想起老周说过，他年轻时住在一条{{canal}}（水道）边上，涨水的时候，最先被冲走的从来不是最烂的房子，是最靠水的那一间。\n\n\"这行没什么{{wisdom}}（智慧）可言，\"他说，\"只有活得够久的人。\"\n\n回办公室时何锐还在，把降仓后的组合重跑了一遍。\n\n\"你的异议我写进去了，\"他说，\"一字不改。还有件事可能跟你有关：今天我去券商核券源，同一只票的借券队列里，排在我们前面的机构变多了。\"\n\n\"多少家？\"\n\n\"至少六家。\"","ft":[{"w":"benchmark","z":"基准","d":"用来对照业绩的指数，长期跑赢基准才算真本事","a":"","p":""},{"w":"cash drag","z":"现金拖累","d":"手上现金留得太多，在上涨行情里拖累整体收益","a":"","p":""},{"w":"custodian","z":"托管行","d":"保管基金资产的银行，资产与管理人分开存放以防挪用","a":"","p":"kʌ'stәudjәn"},{"w":"expense ratio","z":"综合费率","d":"管理费加各项运营开支占规模的比例，直接侵蚀净收益","a":"","p":""},{"w":"gross exposure","z":"总敞口","d":"多头与空头绝对值的合计，反映一共用了多少杠杆","a":"","p":""},{"w":"information ratio","z":"信息比率","d":"超额收益除以跟踪误差，衡量主动管理的稳定程度","a":"","p":""},{"w":"long-only","z":"纯多头","d":"只能做多不能做空的产品，A股公募基本都属于这一类","a":"","p":""},{"w":"minimum investment","z":"起投门槛","d":"单个投资人认购的最低金额，机构产品动辄百万美元起","a":"","p":""},{"w":"notice period","z":"赎回通知期","d":"赎回前必须提前告知的天数，让基金有时间腾出现金","a":"","p":""},{"w":"position sizing","z":"仓位分配；定仓位","d":"决定每只票放多少钱，往往比选对股票更影响最终结果","a":"","p":""},{"w":"risk manager","z":"风控经理","d":"盯敞口、杠杆和限额的人，有权要求基金经理砍仓","a":"","p":""},{"w":"smart money","z":"聪明钱","d":"指嗅觉灵敏的机构资金，与散户的所谓笨钱相对","a":"","p":""},{"w":"style drift","z":"风格漂移","d":"实际持仓偏离宣称的策略，是出资人最忌讳的事情之一","a":"","p":""},{"w":"two and twenty","z":"二二十；两个点加二十个点","d":"对冲基金经典费率结构，两点管理费加两成业绩提成","a":"","p":""}],"iw":[{"w":"reception","p":"ri'sepʃәn","t":"n. 接待, 接受, 招待会; 接受, 感受"},{"w":"shelf","p":"ʃelf","t":"n. 架子, 搁板; 架子"},{"w":"objection","p":"әb'dʒekʃәn","t":"n. 异议, 反对, 不喜欢, 缺点, 缺陷, 妨碍, 拒绝之理由; 异议, 反对, 抗议"},{"w":"correspondent","p":".kɒri'spɒndәnt","t":"n. 通讯记者, 通信者; 客户, 代理商行, 代理银行"},{"w":"diary","p":"'daiәri","t":"n. 日记; 日记簿"},{"w":"desperate","p":"'despәrәt","t":"a. 不顾一切的, 危急的, 令人绝望的, 极渴望的"},{"w":"repair","p":"ri'pєә","t":"n. 修理, 补救, 修复; vt. 修理, 修补, 补救, 恢复, 补偿; vi. 修理, 修补, 补救, 恢复, 去, 常去, 集合"},{"w":"flee","p":"fli:","t":"vt. 逃避, 逃跑, 逃走; vi. 逃, 消失"},{"w":"evolution","p":".i:vә'lu:ʃәn","t":"n. 进化, 发展, 进展, (气体)放出, 开方; 进化, 演化, 旋出"},{"w":"infant","p":"'infәnt","t":"n. 婴儿, 儿童, 初学者; a. 婴儿的, 幼稚的"},{"w":"tribe","p":"traib","t":"n. 宗族, 部落, 一群人; 族(生物分类)"},{"w":"ward","p":"wɒ:d","t":"n. 病房, 守卫, 保卫, 保护, 监护, 牢房, 行政区, 锁孔内的榫舌; vt. 使入病房, 守护, 保卫"},{"w":"guardian","p":"'gɑ:diәn","t":"n. 看守者, 监护人, 保护人; a. 保护的"},{"w":"lawn","p":"lɒ:n","t":"n. 草地, 草坪, 上等细麻布; 细筛"},{"w":"dining","p":"'dainiŋ","t":"n. 正餐, 宴会"},{"w":"wisdom","p":"'wizdәm","t":"n. 智慧, 明智行为, 学识, 名言, 贤人"},{"w":"vulnerable","p":"'vʌlnәrәbl","t":"a. 易受伤害的, 有弱点的, 易受影响的, 脆弱的, 成局的; 易损的"},{"w":"margin","p":"'mɑ:dʒin","t":"n. 页边的空白, 边缘, 界限, 余裕, 差数, 差额, 保证金; vt. 加边于, 加旁注于; 页边距"},{"w":"stability","p":"stә'biliti","t":"n. 安定, 稳定性, 坚实, 巩固; 稳定性"},{"w":"canal","p":"kә'næl","t":"n. 运河, 水道, 管, 沟渠; vt. 开运河"}],"doc":{"k":"风控限额通知邮件","en":"INTERNAL - RISK NOTICE. Effective immediately, the Fund has breached the drawdown limit set out in Section 7 of the Risk Manual. As risk manager I am directing a reduction of gross exposure by thirty percent, to be executed within two trading days. Position sizing will be reset pro rata across the liquid book; the suspended holding cannot be reduced and will remain outsized until trading resumes. The custodian has confirmed available positions. Members should note the resulting cash drag and its effect on returns net of the expense ratio under our two and twenty terms. Information ratio against the benchmark has fallen below 0.1 and must be disclosed in the quarterly report. Any objection will be minuted.","zh":"内部文件——风控通知。即日起，本基金已突破风控手册第七节所载的回撤限额。本人以风控经理身份，指令将总敞口下调百分之三十，须于两个交易日内执行完毕。仓位分配将在可交易持仓中按比例重设；停牌持仓无法减持，在复牌前其权重将持续偏高。托管行已确认当日可动用头寸。各位须注意由此产生的现金拖累，及其在本基金两点管理费加两成提成的费率结构下，对扣除综合费率后收益的影响。相对基准的信息比率已跌破零点一，须在季度报告中披露。任何异议均将记入会议纪要。"}},{"i":58,"ti":"六条线，同一个周二","dom":"fund","sc":"策略与拥挤交易","tx":"\"六家\"这个数字，我拼了三个下午。\n\n香港有一条{{guideline}}（指引）：空头持仓一旦达到已发行股本的千分之二就要报备，每周公布汇总。数字是匿名的，只有总量，没有名字。可总量会动，动的形状会说话。\n\n我把过去十四周的报备量画成一张{{plot}}（图），再叠上三家券商的借券余额、隔夜费率，以及{{prime broker}}（主经纪商）给我们的调券记录。三条线在同样的位置出现同样的{{crack}}（裂口）：都在周二上午，量级都差不多。\n\n同一时点、同一方向、同一节奏。这不是六个人各自想通了同一件事，是六个人在同一个房间里听了同一场路演。\n\nDanny 拍掉{{trousers}}（裤子）上的灰，凑过来看：\"这活儿你哪儿学的？\"\n\n\"没人教。\"我说，\"就是把{{expertise}}（专门知识）当{{grammar}}（语法）用——先认句子结构，再猜谁在说话。\"\n\n会议桌是块很旧的{{timber}}（木料），边角磨得发亮。我把六条推断摊在上面。\n\n第一家，一只{{long/short equity}}（股票多空）基金，在{{overseas}}（海外）注册，去年刚做过{{soft close}}（软封闭），只接受老客户加仓。第二家是{{multi-strategy}}（多策略）平台底下的一个小组，规模不大，{{gross return}}（费前收益）报得很高。第三家和第四家共用同一家主经纪商。第五家我不确定。第六家最有意思：它的{{offering memorandum}}（私募说明书）我两年前读过，里面写明不做单一市场超过百分之十五的敞口——它现在明显超了。\n\n\"所以他们的{{investment committee}}（投委会）批了例外。\"Ray 说。\n\n\"批例外的理由通常只有一个：有人告诉他们这笔一定成。\"\n\n后半夜我们聊的是{{psychology}}（心理）。做空最难的不是判断，是熬。六家一起熬时，任何一家先撑不住，剩下五家就得替它接下买盘。这才是拥挤交易的真正含义——不是大家想法一样，是大家的止损线离得太近。\n\n\"'拥挤交易'这词是谁{{coin}}（杜撰）的？\"Danny 问。\n\n\"不知道，但形容得准。\"我说，\"我们不是一群思想家，我们是一群{{cattle}}（牛群），走在同一条窄道上，谁先受惊，谁就把别人踩死。\"\n\nRay 走到白板前写下三个字：谁先跑，然后把手按上去，{{palm}}（手掌）留下一个模糊的印子。\n\n\"我们的{{value at risk}}（风险价值）模型算的是价格波动，\"他说，\"它假设我们只是市场的一小部分。可现在我们和另外五个人加起来，就是这只票的空头市场本身。\"\n\n我把{{factor exposure}}（因子暴露）跑了一遍。表面上{{beta}}（贝塔）接近零，多空对冲得很干净。但当我把\"与其他做空者的重合度\"当成一个因子塞进去，数字立刻难看：我们真正暴露的不是大盘，是同行。\n\n\"{{risk-adjusted return}}（风险调整后收益）这套东西有个{{fantasy}}（幻想），\"Ray 说，\"它假设风险可以被度量。可最大的风险从来是别人的资金约束，那玩意儿不在任何模型里。\"\n\nDanny 问要不要主动{{de-risk}}（降风险），趁还有人接盘先减。\n\n\"减了就等于替另外五家降成本。\"我说。\n\n\"不减，就等着他们替我们抬成本。\"\n\n这就是那晚没解开的结。窗外中环的灯一片片亮起来，像一个很小的{{galaxy}}（星系）。\n\n十一点，Ivy 进来，脸色不对。一家很大的多策略平台刚刚在{{publicity}}（公开场合）里放了话，说他们对\"中国新能源材料板块的做空拥挤度\"表示关注，并已开始下调相关策略的{{subscription}}（申购）额度。\n\n这句话翻译过来就是：我们要撤了。\n\n\"这是{{alarm}}（警报），\"Ray 说，\"不是{{ongoing}}（还在进行的）讨论。\"\n\n碳酸锂现货当天又跌，整条{{carbon}}（碳）系材料链都在往下走。基本面每一天都在朝我们靠，价格却和基本面早就{{divorce}}（脱钩）了，而我们要的那个{{catalyst}}（催化剂）迟迟不来。\n\n\"复牌就是催化剂。\"我说，\"复牌那天，所有事都会{{fulfil}}（实现）。\"\n\n\"问题是，\"Ray 把眼镜摘下来，\"我们撑不撑得到那天。\"\n\n第二天早上，主经纪商发来一封信，标题只有六个字：融资条件变更。","ft":[{"w":"beta","z":"贝塔","d":"组合相对大盘的敏感度，贝塔为一表示与大盘同涨同跌","a":"","p":"'beitә"},{"w":"catalyst","z":"催化剂","d":"能让股价兑现价值的具体事件，如业绩反转或资产注入","a":"","p":"'kætәlist"},{"w":"de-risk","z":"降风险；降仓","d":"主动砍掉敞口和杠杆，先把风险降下来再谈收益","a":"","p":""},{"w":"factor exposure","z":"因子暴露","d":"组合在各类风格因子上的偏离，常是意外亏损的来源","a":"","p":""},{"w":"gross return","z":"毛收益；费前收益","d":"扣费之前的收益，用来看策略本身的赚钱能力","a":"","p":""},{"w":"investment committee","z":"投委会","d":"集体审议重大投资决策的机构，通常对新建仓有否决权","a":"IC","p":""},{"w":"long/short equity","z":"股票多空","d":"同时做多看好的和做空看衰的，赚两边的相对价差","a":"","p":""},{"w":"multi-strategy","z":"多策略","d":"一只基金里同时跑多条策略线，靠分散把波动拉平","a":"","p":""},{"w":"offering memorandum","z":"私募说明书；募集说明书","d":"写明策略、费率和风险的法律文件，是募资的核心材料","a":"OM","p":""},{"w":"prime broker","z":"主经纪商","d":"给对冲基金提供融资、融券、托管和清算的综合服务商","a":"PB","p":""},{"w":"risk-adjusted return","z":"风险调整后收益","d":"把承担的风险考虑进去后的收益，只看涨幅没有意义","a":"","p":""},{"w":"soft close","z":"软封闭","d":"不再接受新客户但老客户仍可加仓的阶段性关闭","a":"","p":""},{"w":"subscription","z":"认购；申购","d":"投资人出钱买入基金份额的动作，多按月或按季开放","a":"","p":"sәb'skripʃәn"},{"w":"value at risk","z":"风险价值","d":"在给定置信度下一段时间内可能出现的最大亏损估计","a":"VaR","p":""}],"iw":[{"w":"coin","p":"kɒin","t":"n. 硬币, 金钱, 货币; vt. 铸币, 创造, 杜撰"},{"w":"fantasy","p":"'fæntәsi","t":"n. 幻想, 想象的产物; 幻想"},{"w":"fulfil","p":"ful'fil","t":"vt. 实践, 履行, 实行, 完成, 结束, 满足; 履行(契约), 满期"},{"w":"plot","p":"plɒt","t":"n. 小块土地, 地区图, 图, 阴谋, 情节; vt. 划分, 绘图, 密谋; vi. 密谋, 策划; 绘制"},{"w":"trousers","p":"'trauzәz","t":"pl. 裤子, 长裤"},{"w":"ongoing","p":"'ɒngәuiŋ","t":"a. 前进的, 进行的, 不间断的; n. 前进, 发展"},{"w":"psychology","p":"sai'kɒlәdʒi","t":"n. 心理学, 心理状态; 心理学"},{"w":"timber","p":"'timbә","t":"n. 木材, 木料; vt. 用木材建造"},{"w":"cattle","p":"kætl","t":"n. 牛, 家畜; 家畜"},{"w":"divorce","p":"di'vɒ:s","t":"n. 离婚; vt. 与...离婚"},{"w":"grammar","p":"'græmә","t":"n. 语法学, 入门书; 语法检查"},{"w":"expertise","p":".ekspә:'ti:z","t":"n. 专家意见, 专门技术; 专门知识, 专家意见"},{"w":"overseas","p":"'әuvә'si:z","t":"a. 海外的, 国外的; adv. 在海外, 在国外"},{"w":"palm","p":"pɑ:m","t":"n. 手掌, 棕榈, 胜利; vt. 与...握手, 藏...于掌中"},{"w":"guideline","p":"'gaidlain","t":"n. 指导路线, 方针, 指标; 指导路线, 方针, 准则"},{"w":"publicity","p":"pʌb'lisiti","t":"n. 名声, 宣传, 公开场合; 宣传, 广告"},{"w":"alarm","p":"ә'lɑ:m","t":"n. 惊恐, 警报, 警钟; vt. 使惊恐, 警告; 报警信号"},{"w":"carbon","p":"'kɑ:bәn","t":"n. 碳, 副本, 复写纸; 碳"},{"w":"crack","p":"kræk","t":"n. 裂缝, 爆裂声; v. (使)爆裂, (使)裂开, (使)发出爆裂声; a. 第一流的; adv. 啪地一声"},{"w":"galaxy","p":"'gælәksi","t":"n. 银河, 星系, 一群(显赫的人物); 银河系"}],"doc":{"k":"私募说明书节选","en":"STRATEGY AND RISK FACTORS (EXTRACT). The Fund pursues a long/short equity strategy and may allocate to a multi-strategy sleeve at the discretion of the investment committee. Gross return is stated before fees; investors should assess risk-adjusted return over a full cycle. The Manager monitors value at risk and factor exposure daily through its prime broker. Investors are cautioned that positions may become crowded: where several managers hold identical short exposure, an adverse move may be amplified irrespective of fundamentals, and the anticipated catalyst may not materialise. The Manager may de-risk without notice. Subscription may be restricted and the Fund may implement a soft close at any time. This offering memorandum should be read in full.","zh":"策略与风险因素（节选）。本基金采用股票多空策略，并可由投委会酌情决定配置一部分资金至多策略子仓。所列毛收益为费前口径；投资人应以完整周期来评估风险调整后收益。管理人通过其主经纪商每日监控风险价值与因子暴露。谨提请投资人注意，持仓可能变得拥挤：当多家管理人持有完全相同的空头敞口时，不利波动可能被放大，且与基本面无关，而预期中的催化剂亦可能始终不出现。管理人可不经通知即行降风险。申购可被限制，本基金亦可随时实施软封闭。本私募说明书应完整阅读。"}},{"i":59,"ti":"四十二层的雨","dom":"fund","sc":"主经纪商","tx":"信的标题只有六个字，正文四段，理由一句话：风险偏好调整。\n\n会在他们楼的四十二层。电梯里全是穿同一种{{uniform}}（统一制式的）深色西装的人，我和 Ray 缩在角落，像走错{{porch}}（门廊）的客人。\n\n来了两个人。一个是对了三年的客户经理，另一个名片上写着风险管理部。后者一开口我就知道，今天不是谈判。\n\n\"融资利差从 SOFR 加一百八十调到加四百二，抵押品折扣率上调五个点，借券费率改成每日重定。\"\n\nDanny 算过：三条加起来，我们一年凭空多付一千一百万港币。相对那点{{management fee}}（管理费），这是一次成本{{explosion}}（激增）。\n\nRay 问：为什么。\n\n\"风险偏好调整。\"\n\n\"这不是理由，是措辞。\"\n\n对方很客气，也很{{clever}}（精明的）。他说他们在重估{{discretionary}}（主观多头）类客户占用的资本；相比之下，跑{{systematic strategy}}（系统化策略）和{{factor investing}}（因子投资）的{{quant fund}}（量化基金）客户持仓分散、单一{{name}}（个股）暴露小，占用资本少得多。\n\n\"我们被罚，不是因为我们错，是因为我们集中。\"\n\n\"我们不用'罚'这个字。\"\n\n第二件事：他们的{{operational due diligence}}（运营尽调）团队想再来一次现场，看估值、合规、后台。这本来是开户前才做的事，做第二次等于说：我们在评估你会不会{{blow up}}（爆掉）。问卷比三年前那份{{sophisticated}}（精细复杂的）得多，一百四十七题。\n\n第三件事最小，也最疼：{{soft dollars}}（佣金换研究）额度砍掉六成——以后要看{{sell-side research}}（卖方研究），得自己掏现金。\n\n\"研究是我们唯一还在赚钱的东西。\"\n\n\"我们理解。\"他说，\"但资源要重新{{allocate}}（分配）。\"\n\nRay 一直没发火。等对方说完，他慢慢说了一段，一个字都没{{wander}}（离题）：\n\n\"融资是{{privilege}}（特权），不是权利，这句我懂。我不懂的是另一件事：我们这笔头寸的核心是一个{{variant perception}}（差异化认知）——市场认为这家公司在扩产，我们认为它在造账。错了我们该死。可如果我们对了，最后决定我们死不死的，不是这家公司真不真，是你们今天签的这张纸。\"\n\n对方沉默几秒，说了句真话：\"关先生，我们不判断对错，我们判断谁先爆。\"\n\n出来时天在下雨。我们沿着那条种满树的{{mall}}（林荫路）往回走，Ray 没打伞。\n\n\"最{{incredible}}（难以置信的）是什么你知道吗，\"他说，\"三年前我们赚钱时，同一家机构派了整个团队来做资本引荐。条款是骨头，关系是{{flesh}}（血肉）。骨头没变，肉今天掉光了。\"\n\n我说我查过一件事。这家主经纪商的母公司，同时是几家纽约多策略基金的主要对手方。其中一家的{{chief investment officer}}（首席投资官）上个月在闭门会上讲过一段，题目叫\"拥挤的空头遇上坚硬的资产负债表\"。录音没流出来，议程流出来了。\n\nRay 停下，把雨从眼镜上抹掉。\"你觉得他{{exploit}}（利用）了这条线？\"\n\n\"我不知道。\"我说，\"他不需要利用。只要把一笔生意分配给这家机构，剩下的会自己发生。这里面没有{{scandal}}（丑闻），一条规则都没被碰到。\"\n\n\"这才是最{{medieval}}（中世纪式的）地方。\"他说，\"领主不用亲手打人。\"\n\n回到办公室已经七点。Ivy 提醒我们，办公室{{lease}}（租约）明年三月到期，续约价涨两成。这消息今天显得很滑稽，像一个由无数小事{{patch}}（拼凑）起来的结局。\n\nRay 说他要写{{investor letter}}（投资人信），这封打算写得很短。\n\n\"我们早该做{{hard close}}（硬封闭），\"他说，\"三年前策略容量就满了，是我贪。\"\n\n我说这不是{{scholarship}}（学问）问题。\n\n\"我知道。\"他笑了笑，\"我只是想留一点{{reservation}}（保留），证明我不是完全愚蠢。\"\n\n十一点，Danny 还没走，在交易台前算券息，算完抬头，说了今晚唯一让我踏实的一句：\"砚姐，要不要个{{companion}}（伴儿）？我请你吃夜宵。\"\n\n夜宵是牛腩面，一碗三十八块，{{equivalent}}（相当于）当天多付融资成本的三十万分之一。\n\n第二天，Ivy 说年度归因表跑完了。\n\n\"你最好坐下再看。\"","ft":[{"w":"blow up","z":"爆仓；基金炸掉","d":"因巨亏或杠杆断裂导致基金清盘的极端情况","a":"","p":""},{"w":"chief investment officer","z":"首席投资官","d":"统管整个投研平台的最高负责人，对总体风险和风格负责","a":"CIO","p":""},{"w":"discretionary","z":"主观；主观多头","d":"靠基金经理个人判断做决策，与系统化策略相对","a":"","p":"dis'kreʃәnәri"},{"w":"factor investing","z":"因子投资","d":"按价值、动量、质量等因子系统化地构建投资组合","a":"","p":""},{"w":"hard close","z":"硬封闭","d":"彻底停止接受新资金，通常因为策略容量已经打满","a":"","p":""},{"w":"investor letter","z":"投资人信","d":"定期写给出资人的信，交代业绩、持仓思路和市场看法","a":"","p":""},{"w":"management fee","z":"管理费","d":"按管理规模每年固定收取的费用，与业绩好坏无关","a":"","p":""},{"w":"name","z":"个股；标的","d":"基金圈指某只股票的口语说法，如这个name我们不碰","a":"","p":"neim"},{"w":"operational due diligence","z":"运营尽调","d":"查估值、合规、后台和托管等非投资环节的尽职调查","a":"ODD","p":""},{"w":"quant fund","z":"量化基金","d":"靠模型和程序批量选股下单，很少人工干预个股决策","a":"","p":""},{"w":"sell-side research","z":"卖方研究","d":"券商研究所出的研报和服务，主要卖给基金换取佣金","a":"","p":""},{"w":"soft dollars","z":"软美元；佣金换研究","d":"用交易佣金抵付研究和数据服务，不直接掏现金支付","a":"","p":""},{"w":"systematic strategy","z":"系统化策略；程序化","d":"完全按既定规则执行，不掺杂基金经理的临场判断","a":"","p":""},{"w":"variant perception","z":"差异化认知","d":"与市场主流看法不同、且事后被验证正确的判断","a":"","p":""}],"iw":[{"w":"privilege","p":"'privilidʒ","t":"n. 特权, 特别恩典, 基本权利, 特免; vt. 给与...特权, 特免"},{"w":"sophisticated","p":"sә'fistikeitid","t":"a. 复杂的, 久经世故的; 尖端的, 高级的, 非常有经验的"},{"w":"explosion","p":"ik'splәuʒәn","t":"n. 爆发, 激增, 爆炸(声); 爆炸"},{"w":"companion","p":"kәm'pænjәn","t":"n. 朋友, 陪伴, 指南, 升降口围罩; vt. 陪伴"},{"w":"clever","p":"'klevә","t":"a. 聪明的, 精明的"},{"w":"incredible","p":"in'kredәbl","t":"a. 难以置信的"},{"w":"wander","p":"'wɒndә","t":"vi. 游荡, 漫步, 徘徊, 迷路, 离题, 蜿蜒; vt. 在...漫游"},{"w":"exploit","p":"'eksplɒit","t":"n. 功绩, 勋绩; vt. 开发, 利用, 开拓, 剥削"},{"w":"allocate","p":"'ælәukeit","t":"vt. 分派, 分配; 分配"},{"w":"flesh","p":"'fleʃ","t":"n. 肉, 肉体, 肉欲, 人性, 亲属, 人类, 众生, 人体; vt. 以肉喂, 激起...的杀戳情绪, 使肥, 赋以血肉; vi. 长胖"},{"w":"patch","p":"pætʃ","t":"n. 片, 补缀, 碎片, 斑, 傻瓜; vt. 补缀, 掩饰, 拼凑, 平息; 修补; 拼凑"},{"w":"medieval","p":".medi'i:vl","t":"a. 中古的, 中世纪的"},{"w":"porch","p":"pɒ:tʃ","t":"n. 门廊, 走廊"},{"w":"uniform","p":"'ju:nifɒ:m","t":"n. 制服; a. 统一的, 一律的, 始终如一的"},{"w":"scholarship","p":"'skɒlәʃip","t":"n. 学问, 学术成就, 奖学金"},{"w":"reservation","p":".rezә'veiʃәn","t":"n. 保留, 预定, 保留品, 保留地; 预定, 预约, 权益保留"},{"w":"lease","p":"li:s","t":"n. 租约, 租期, 租; vt. 出租, 租出, 租得"},{"w":"mall","p":"mɔ:l","t":"n. 林荫路"},{"w":"equivalent","p":"i'kwivәlәnt","t":"n. 同等物, 等价物, 相等物; a. 相等的, 相当的, 同意义的; 等价的"},{"w":"scandal","p":"'skændәl","t":"n. 丑闻, 中伤, 耻辱, 反感, 流言蜚语; 丑事, 丑闻, 干丑事的人"}],"doc":{"k":"主经纪商融资条件变更通知","en":"RE: AMENDMENT TO FINANCING TERMS. Further to the margin lending agreement, we notify you of a revision to your financing terms, effective in ten business days, following a firm-wide risk appetite adjustment. The financing spread will increase to SOFR plus 420 basis points, collateral haircuts will rise by five percentage points, and stock loan rates on concentrated positions will be repriced daily. Our review distinguishes discretionary mandates from clients running a systematic strategy or a factor investing programme at a quant fund, whose exposure to any single name is materially lower. Our operational due diligence team will conduct a further on-site review, and your soft dollars allocation for sell-side research will be reduced accordingly.","zh":"事由：融资条件变更。兹就保证金融资协议事宜函告：经本行全行范围的风险偏好调整，阁下之融资条件将作修订，自十个营业日后生效。融资利差将上调至 SOFR 加四百二十个基点，抵押品折扣率上调五个百分点，集中持仓的借券费率改为每日重定。本行的评估将主观多头类委托，与在量化基金处运行系统化策略或因子投资项目的客户加以区分，后者对任何单一个股的暴露明显更低。本行的运营尽调团队将再次进行现场检视，阁下用于支付卖方研究的佣金换研究额度亦将相应削减。"}},{"i":60,"ti":"一页纸，一整年","dom":"fund","sc":"归因与超额收益","tx":"年度归因表只有一页。Ivy 说得对，我该坐下再看。\n\n第一行：全年毛收益负百分之十一点四。第二行才要命：剔掉 2318，全年是负百分之十一点九。\n\n我们其他所有的活儿——出差、电话、模型——加起来净贡献正零点五个点。\n\n\"这张表{{resemble}}（类似）什么，你说。\"\n\n我说：{{closet indexing}}（隐性指数化）。收着主动管理的费，做出来的跟抱住基准差不多。\n\n\"更难听的说法是，\"她说，\"你们只做了一笔交易，剩下的都是用来{{ease}}（缓解）焦虑。\"\n\n我把{{book}}（持仓账簿）拆开重排。多头那边每笔都很小，因为大的那件占掉了全部风险预算：2318 是全市场最{{hard to borrow}}（难借券）的票之一，光券息一年吃掉净值两个多点，而这两点没有{{dividend}}（股利）去抵——这公司上市六年，一分钱红没派过。\n\n关键数字抄进{{tear sheet}}（业绩单页）：年内最大{{drawdown}}（回撤）二十九点八，{{net asset value}}（净值）零点七九一，{{sortino ratio}}（索提诺比率）负零点六。这单页的{{format}}（版式）是三年前定的，同一个模板，换一年，填的就是另一样东西。\n\nIvy 一个人在做{{investor relations}}（投资者关系），最难回的是专户那家。那是个{{separately managed account}}（专户），条款单独谈，客户能随时看穿仓，按自己的{{mandate}}（投资授权口径）判断我们有没有越界。他们发来一张表，每笔持仓对照授权清单打了勾，三笔画问号。我翻了基金的{{charter}}（组织章程），没有一条禁止我们这么做。\n\n\"他们要{{contest}}（争辩）什么？\"\n\n\"不争辩，\"Ivy 说，\"在建档。\"\n\n我懂了。这不是投资对话，是为将来某个{{judicial}}（司法上的）场合留纸。\n\n下午三点，第二批{{redemption}}（赎回）通知到，连{{founders share class}}（创始份额）的两家都在——最早进来，费率最低，理论上最该等得起。\n\n\"不是不信你，\"Ivy 说，\"他们自己也在{{undergo}}（经历）赎回。\"\n\n链条比我想的长：他们的钱也是别人的钱，也有别人的期限。这行没有耐心资本，只有还没到期的资本。\n\nRay 傍晚才回来，去见了一家想做{{pass-through fee}}（成本转嫁收费）结构的机构——研究、数据、人员成本全部实报实销进基金，连{{taxation}}（课税）处理都要重设。这在纽约常见，香港会骂。\n\n\"你会做吗？\"\n\n\"会考虑。前提是有人肯给钱。\"\n\n他挂好外套要走那张表，看完{{sigh}}（叹）了口气，说三个字：\"很干净。\"\n\n我问什么意思。\n\n\"没有{{trick}}（花招）。\"他说，\"浮盈全来自一个判断，亏的全来自撑住这个判断的成本。它不{{organic}}（自然生长的），但诚实。\"\n\n灯关一半。Ray 说起 2008 年：那年他也对，最后活下来靠的不是{{wise}}（明智的）决定，是个客户临时改了主意。\n\n\"这行有个{{myth}}（神话），\"他说，\"市场终究会回报正确的人。这不是规律，是一种{{ideology}}（意识形态）。真正的规律只有一条：正确的人必须活到那一天。\"\n\n窗外油轮的灯在动。一{{barrel}}（桶）原油从装船到卸货要六周，中间价格怎么翻，船得开完。\n\n\"我们就是那条船。\"\n\nRay 笑了：\"别问对不对，问油够不够。\"\n\n他从抽屉里拿出两张行程单，推给我一张。\n\n\"下周去纽约见新的投资人，你跟我一起去。\"\n\n我愣住了。这些年他都是一个人去。\n\n\"为什么是我？\"\n\n\"他们会问同一个问题：你们凭什么觉得自己是对的。\"他把眼镜擦干净，\"这问题我答过一百遍，每次都被当成{{controversial}}（有争议的）说辞。该由做调研的人答。\"\n\n我把行程单折进包里。那一刻的念头很奇怪：这只基金不像一门生意了，更像玻璃罐里的一件{{specimen}}（标本），所有人围观它能撑多久。\n\n\"还有，\"Ray 说，\"到那边注意{{privacy}}（隐私），别用酒店的网。\"\n\n\"防谁？\"\n\n\"我们的{{rival}}（对手）。\"他说，\"也可能是东道主。\"\n\n我问那家机构叫什么。他没答，把手机日程转过来——第二天下午两点，会面方是一个我熟得不能再熟的名字。\n\nHalberd Partners。","ft":[{"w":"book","z":"持仓；仓位账簿","d":"基金经理手上的整个组合，常说多头book和空头book","a":"","p":"buk"},{"w":"closet indexing","z":"隐性指数化；伪主动","d":"收着主动管理费却抱住基准配置，做不出真正的超额","a":"","p":""},{"w":"drawdown","z":"回撤","d":"净值从阶段高点到低点的跌幅，衡量基金风险最直观的指标","a":"","p":"'draudaun"},{"w":"founders share class","z":"创始份额","d":"给早期投资人的优惠份额，费率明显低于常规份额","a":"","p":""},{"w":"hard to borrow","z":"难借券；券源紧张","d":"借券成本极高甚至根本借不到，做空这类票代价很大","a":"","p":""},{"w":"investor relations","z":"投资者关系","d":"对接出资人的岗位，负责募资、路演和日常沟通","a":"IR","p":""},{"w":"mandate","z":"投资授权；委托口径","d":"出资人给管理人划定的投资范围和各项约束条件","a":"","p":"'mændeit"},{"w":"net asset value","z":"净值","d":"基金每份份额的价值，扣费后的净值才是投资人的真实回报","a":"NAV","p":""},{"w":"pass-through fee","z":"成本转嫁费；实报实销","d":"把研究、数据和人员成本直接算进基金的收费方式","a":"","p":""},{"w":"redemption","z":"赎回","d":"投资人把份额换回现金，集中赎回会逼基金被动卖股","a":"","p":"ri'dempʃәn"},{"w":"separately managed account","z":"专户；单一客户账户","d":"为单一客户单独开设的账户，条款和策略都可以定制","a":"SMA","p":""},{"w":"sortino ratio","z":"索提诺比率","d":"只看下行波动的夏普改良版，更贴近投资人对亏损的感受","a":"","p":""},{"w":"tear sheet","z":"业绩单页；月报单页","d":"一页纸的基金概览，含净值、回撤和敞口等关键数据","a":"","p":"tiə ʃi:t"}],"iw":[{"w":"dividend","p":"'dividend","t":"n. 被除数, 股利; 被除数"},{"w":"resemble","p":"ri'zembl","t":"vt. 相似, 类似"},{"w":"rival","p":"'raivl","t":"n. 对手, 竞争者; a. 竞争的"},{"w":"undergo","p":".ʌndә'gәu","t":"vt. 遭受, 经历, 忍受; 经受, 经历, 忍受"},{"w":"privacy","p":"'praivәsi","t":"n. 隐私, 隐居, 秘密; 个人保密权"},{"w":"contest","p":"'kɒntest","t":"n. 竞赛, 争论; vt. 竞争, 争取, 争辩; vi. 竞争"},{"w":"charter","p":"'tʃɑ:tә","t":"n. 特许状, 执照, 宪章; vt. 特许, 发给特许执照"},{"w":"trick","p":"trik","t":"n. 诡计, 欺诈, 谋略, 恶作剧, 习惯, 决窍; vt. 愚弄, 欺骗, 装饰; vi. 哄骗, 戏弄; a. 有决窍的, 特技的, 欺诈的, 漂亮的, 靠不住的"},{"w":"organic","p":"ɒ:'gænik","t":"a. 器官的, 有机的, 组织的, 根本的; 器官的, 有生命的, 有机的, 器质的"},{"w":"specimen","p":"'spesimәn","t":"n. 样品, 标本, 试料; 试样"},{"w":"taxation","p":"tæk'seiʃәn","t":"n. 课税, 征税, 抽税, 税款, 估定的税额; 征税, 纳税, 税制"},{"w":"myth","p":"miθ","t":"n. 神话, 虚构的事, 虚构的人"},{"w":"ideology","p":".aidi'ɒlәdʒi","t":"n. 思想体系, 意识形态, 观念学, 空论; 观念学, 观念形态"},{"w":"format","p":"'fɒ:mæt","t":"n. 开本, 版式, 形式, 格式; vt. 格式化; 格式; DOS外部命令:对磁盘进行格式化"},{"w":"judicial","p":"dʒu:'diʃәl","t":"a. 法庭的, 公正的, 审判上的, 司法的; 司法的, 审判上的, 法官的"},{"w":"barrel","p":"'bærәl","t":"n. 桶; vt. 装入桶内"},{"w":"sigh","p":"sai","t":"n. 叹息; vi. 叹息, 渴望; vt. 叹息着说"},{"w":"wise","p":"waiz","t":"a. 明智的, 慎虑的, 聪明的, 博学的, 狡猾的, 机灵的; vi. 知道; vt. 教导, 告诉, 劝导; n. 方法, 方式; 教育信息系统"},{"w":"controversial","p":".kɒntrә'vә:ʃәl","t":"a. 争论的, 论争的, 被议论的"},{"w":"ease","p":"i:z","t":"n. 安乐, 安逸, 悠闲; vt. 使安乐, 使安心, 减轻, 放松; vi. 减轻, 放松, 灵活地移动"}],"doc":{"k":"基金致投资人年度信","en":"Dear Investor, This letter accompanies the Fund's annual tear sheet. Net asset value per share closed the year at 0.791, after a maximum drawdown of 29.8 percent, and the Sortino ratio for the period was negative. Attribution shows that performance was determined almost entirely by a single short position in the book, which remains hard to borrow and costly to maintain. The Manager has not deviated from the mandate. Redemption requests received to date, including from holders of the founders share class and from one separately managed account, will be met in the order prescribed by the offering documents. Investor relations will circulate the full appendix next week. No pass-through fee arrangement is proposed.","zh":"尊敬的投资人：随函附上本基金的年度业绩单页。经历百分之二十九点八的最大回撤后，每份份额净值于年末收于零点七九一，本期索提诺比率为负。业绩归因显示，全年表现几乎完全由持仓账簿中的一笔空头决定，该标的至今仍属难借券，维持成本高昂。管理人未曾偏离投资授权口径。截至目前收到的赎回申请，包括来自创始份额持有人及一个专户的申请，将按募集文件规定的顺序办理。投资者关系将于下周分发完整附录。目前不拟采用任何成本转嫁收费安排。"}},{"i":61,"ti":"隔着一张桌子","dom":"fund","sc":"募资与投资人关系","tx":"飞机落地是纽约时间下午一点，我一夜没睡。\n\nRay 在车上补妆，他真带了粉底。车拐上高速，一股淡淡的{{petrol}}（汽油）味，窗外是一排排低矮的仓库和{{garage}}（车库）。快到{{downtown}}（市中心区）时，河面上掠过一架{{helicopter}}（直升机）。Ray 说，坐那个的人不是我们今天要见的人。\n\n我第一次跟他出来募资。六年里我是纯粹的{{buy-side analyst}}（买方分析师），跑工厂、跟经销商吵架，钱从哪来不归我管。今年三笔赎回，Ray 说你得看看钱长什么样。\n\n第一场在中城四十二层。年轻的那位一开场就推来一份{{due diligence questionnaire}}（尽调问卷），一百四十七题：{{fund administrator}}（基金行政管理人）是谁、多久出对账单、服务器在哪、谁能改交易记录。\n\nRay 讲得稳。远岑的{{thesis}}（投资逻辑）：不赌方向，只赌数字对不对；{{net exposure}}（净敞口）常年压在正负一成五，{{hedge ratio}}（对冲比例）跟着波动率调；我们既不是{{market neutral}}（市场中性）也不是{{statistical arbitrage}}（统计套利）——那两种靠分散和高胜率，我们靠把一家公司啃穿。\n\n五十多岁那位一直没出声。第四十分钟，他抬手{{prompt}}（提示）Ray 跳过策略部分。\n\n\"你们去年的收益，有多少来自同一个头寸？\"\n\nRay 说了个数。房间静了两秒。\n\n\"那不是策略，\"那人说，\"那是一{{stroke}}（笔）好运。\"\n\n我听见自己开口了：不是运气。十四个月，九个厂区，用电量和物流单据一条条对过；收益的{{concentration}}（集中度）高，是因为我们只在确定的地方下重手。\n\n他笑了一下，问了三个问题，全在数字上。\n\n条款 Ray 谈。他们要一个单独的{{share class}}（份额类别），费率低一档；{{performance fee}}（业绩报酬）从二十个点降到十五；{{redemption fee}}（赎回费）写死，一年内走扣三个点；还要一条{{key man clause}}（关键人条款）。\n\n\"这条我签，\"Ray 说，\"但你们得接受：我离开的时候，可能不是因为我想走。\"\n\n那句话是{{bitter}}（带苦味的），说完他自己都愣了半秒。\n\n下午还有两场。有人问我们平常怎么过日子，Ray 替我答：这行没有{{lifestyle}}（生活方式）可言，只有持仓。\n\n傍晚走回酒店。Ray 说他二十九岁也在这条街跑过路演，那时他{{girlfriend}}（女朋友）在投行做承销；后来市场{{collapse}}（崩溃），他做空赚了第一笔大钱，她那家公司没了。\n\n\"你{{anticipate}}（预料）不到的从来不是价格，\"他说，\"是人。\"\n\n最后一场在四十七街。接待台后挂着一幅旧画，画的是教堂里的{{organ}}（管风琴）。会议室里只有一个人在等，深灰西装，袖口露出{{modest}}（不张扬的）一截衬衫。他起身跟 Ray 握手，用中文说了两个字：\"久仰。\"\n\nMarcus Feldman。\n\n我{{undoubtedly}}（确实）知道这名字，过去一年在它底下画过至少二十条线。可我没想过隔一张桌子看见他是这个感觉——他不像对手，像这栋楼本身。\n\n他说今天不谈基金，只是路过，然后问 Ray：你们那条净值曲线，去年十月之后的{{slope}}（斜率）变了，是加仓，还是有人替你们把股价推上去了？\n\nRay 说是加仓。\n\nMarcus 点头，转向我，说了整场唯一一句冲我来的话：\n\n\"林小姐，你的{{narrative}}（故事）非常好，市场喜欢好故事。但故事最怕的不是被证伪，是被{{suspend}}（中止）——公司一停牌，你的对手有的是时间，你的成本每天都在跳。这只票我看了很久。它的应收账款为什么会那样{{explode}}（激增），我大概比你更早知道答案。\"\n\n出门时天黑了。Ray 一路没说话，走到路灯把{{horizon}}（地平线）压成一条橘线的地方才开口：\"他是在提醒你，还是在威胁你？\"\n\n\"都不是，\"我说，\"他在告诉我们，他知道得比我们早。\"\n\n那晚我没睡，把这公司上市那年的文件全翻了出来。翻到第三份，在一张再没人{{frequent}}（常来翻查）的旧披露表里，我看见一行字——\n\n上市前十四个月，有人对它发起过一次收购。\n\n那次收购，没成。","ft":[{"w":"buy-side analyst","z":"买方分析师","d":"在基金内部做研究的人，结论直接服务于自家持仓","a":"","p":""},{"w":"concentration","z":"集中度","d":"前几大持仓占净值的比例，越集中净值波动越剧烈","a":"","p":".kɒnsәn'treiʃәn"},{"w":"due diligence questionnaire","z":"尽调问卷","d":"出资人发来的标准化问卷，逐项摸清策略和运营细节","a":"DDQ","p":""},{"w":"fund administrator","z":"基金行政管理人","d":"独立第三方机构，负责估值、计算净值和出具对账单","a":"","p":""},{"w":"hedge ratio","z":"对冲比例","d":"用多少空头或衍生品去对冲多头风险的比例","a":"","p":""},{"w":"key man clause","z":"关键人条款","d":"核心基金经理离任时出资人可以提前赎回的保护条款","a":"","p":""},{"w":"market neutral","z":"市场中性","d":"多空敞口基本抵消，只赚选股的钱不赌大盘方向","a":"","p":""},{"w":"net exposure","z":"净敞口","d":"多头减空头的差额，代表基金对大盘方向的真实押注","a":"","p":""},{"w":"performance fee","z":"业绩报酬；提成","d":"从超额收益里按比例分走的钱，通常是二十个点","a":"","p":""},{"w":"redemption fee","z":"赎回费","d":"提前赎回时扣掉的费用，用来惩罚短期资金频繁进出","a":"","p":""},{"w":"share class","z":"份额类别","d":"同一只基金下费率、锁定期和币种不同的几种份额","a":"","p":""},{"w":"statistical arbitrage","z":"统计套利","d":"用历史统计规律捕捉价格偏离，靠高胜率小赚积累","a":"","p":""},{"w":"thesis","z":"投资逻辑；投资论点","d":"买入一只票的核心理由，逻辑被证伪就应该走人","a":"","p":"'θi:sis"}],"iw":[{"w":"lifestyle","p":"'laifstail","t":"n. 生活方式"},{"w":"collapse","p":"kә'læps","t":"n. 崩溃, 倒塌, 虚脱; vi. 倒塌, 崩溃, 瓦解; vt. 使倒塌, 折叠; 折叠"},{"w":"bitter","p":"'bitә","t":"a. 苦的, 痛苦的, 怀恨的; adv. 刺骨; v. (使)变苦"},{"w":"narrative","p":"'nærәtiv","t":"n. 叙述, 故事; a. 叙述的, 叙事的, 故事体的"},{"w":"helicopter","p":"'helikɒptә","t":"n. 直升机; vt. 由直升机运送; vi. 乘直升机"},{"w":"petrol","p":"'petrәl","t":"n. 汽油; 汽油, 挥发油, 石油"},{"w":"modest","p":"'mɒdist","t":"a. 谦逊的, 羞怯的, 端庄的, 适度的; 适当的"},{"w":"organ","p":"'ɒ:gәn","t":"n. 风琴, 器官, 元件, 机构, 机关; 风琴"},{"w":"anticipate","p":"æn'tisipeit","t":"vt. 预期, 占先, 加速, 提前使用; 提前出现, 先期发生"},{"w":"explode","p":"ik'splәud","t":"vi. 爆炸, 爆发, 激增; vt. 使爆炸"},{"w":"stroke","p":"strәuk","t":"n. 笔划, 打, 中风, 抚, 摩, 冲程; vt. 划尾桨, 抚, 摩, 划去; 笔划"},{"w":"frequent","p":"'fri:kwәnt","t":"a. 时常发生的, 频繁的, 快速的; vt. 时常来访, 常常聚集, 常与...交往"},{"w":"garage","p":"gә'rɑ:ʒ. 'gærɑ:ʒ","t":"n. 车库, 汽车修理厂, 机库; vt. 把车送入修车场"},{"w":"horizon","p":"hә'raizәn","t":"n. 地平线, 眼界, (天)视地平"},{"w":"prompt","p":"prɒmpt","t":"n. 激励, 提示, 提醒物, 提词, 付款期限; a. 迅速的, 敏捷的, 立刻的, 提词员的; vt. 激励, 鼓动, 提示; adv. 准时地; 提示符; DOS内部命令:设定DOS命令行的提示符"},{"w":"girlfriend","p":"","t":"n. 女朋友"},{"w":"downtown","p":"'daun'taun","t":"n. 市中心区; a. 市中心的; adv. 往闹市区"},{"w":"suspend","p":"sә'spend","t":"vt. 悬, 吊, 使悬浮, 暂停, 中止, 推迟; vi. 暂停, 中止, 悬浮, 停止偿付债务; 暂停"},{"w":"undoubtedly","p":"ʌn'dajtidli","t":"adv. 无疑, 必定, 确实地"},{"w":"slope","p":"slәup","t":"n. 倾斜, 斜坡, 斜率, 扛枪姿势; vt. 使倾斜, 弄斜, 扛; vi. 倾斜, 走, 逃走"}],"doc":{"k":"基金推介材料","en":"CONFIDENTIAL - FOR PROFESSIONAL INVESTORS ONLY. Zenith Capital operates a fundamental, research-led strategy executed by a small team of buy-side analyst professionals. The Fund is neither market neutral nor a statistical arbitrage vehicle; positions are deliberately few, and investors should expect concentration materially above peer funds. Net exposure is maintained within a stated band and the hedge ratio is adjusted as realised volatility changes. Independent valuation is performed by the fund administrator. The Class B share class carries a reduced management fee, a performance fee of fifteen per cent above the high water mark, and a redemption fee applicable within twelve months. A key man clause permits full redemption should the Chief Investment Officer cease to be actively involved. Our due diligence questionnaire is available on request; every investment thesis is documented in writing before capital is committed.","zh":"机密文件，仅供专业投资者参阅。远岑资本采取基本面驱动、以研究为核心的策略，由一支人数很少的买方分析师团队执行。本基金既非市场中性策略，也不是统计套利工具；持仓刻意集中，投资者应预期本基金的集中度显著高于同业。净敞口维持在既定区间之内，对冲比例随已实现波动率的变化进行调整。估值由基金行政管理人独立完成。B 类份额类别适用较低的管理费率、以高水位线为基准按百分之十五计提的业绩报酬，以及在十二个月内赎回时适用的赎回费。关键人条款约定：若首席投资官不再实际参与管理，投资者有权全额赎回。本基金的尽调问卷可应要求提供；每一项投资逻辑在投入资金之前均已形成书面记录。"}},{"i":62,"ti":"没成的那一笔","dom":"deal","sc":"并购往事","tx":"纽约第二天，Ray 去谈他的钱，我去了一家档案馆。\n\n那是家做公开文件检索的机构，在四十街和第六大道的{{junction}}（交叉路口）上。门厅是旧式的{{imperial}}（气派的）大理石，三楼只剩几台老电脑。前台说旧盘要单独申请。\n\n我要查的是它上市前那十四个月。招股书只写结果不写过程；可一家公司挂牌前被人碰过，痕迹会散到别处——买方年报、律师行备案、一份没人看的{{registration}}（登记）表。\n\n线索从一家澳洲基金的年报里跳出来。那是一家{{financial sponsor}}（财务投资人），负责人是个{{Australian}}（澳大利亚人），报告只写了一句：本年度我们就一家中国正极材料企业提交了{{non-binding offer}}（无约束力报价），并在完成初步工作后终止流程。\n\n连名字都没有。我把那年的项目编号一个个对，第七个配上了。\n\n管理员从地下室搬来一个纸盒，盒口用{{cotton}}（棉）线捆着：打印件、一份没定价的{{red herring}}（预披露招股书）——封面红字褪成粉色——还有一张{{disc}}（光盘）。那年的数据室还流行刻盘。\n\n他们给的{{pre-money valuation}}（投前估值）是四十二亿，按{{cash-free debt-free}}（无现金无负债口径）报的，结构是{{share deal}}（股权交易），历史包袱一并接走。报价不是死数，是跟着碳酸锂价格{{float}}（浮动）的区间，下沿挂着{{discount}}（折价）条款：应收账款回收天数超过阈值，报价自动下调。\n\n我盯着那行看了很久。十年前，他们就已经知道要防什么了。\n\n再往后是条款清单。{{drag-along right}}（拖售权）写得很硬：持股过半的股东同意出售，其余股东必须同条件跟着卖。创始团队的{{vesting}}（股权归属）重设四年；管理层持股要走一个{{conversion}}（转股）安排；还有一页讲{{assignment}}（权利转让）——未经买方同意不得转给第三方。\n\n买方非常{{flexible}}（灵活的）：付款方式可以谈，交割节奏可以谈，甚至让原团队再管三年。唯独一件事没得谈——他们要一份关于前三年收入的书面{{assurance}}（保证）。\n\n盒底压着一份两页纸的内部备忘录，末页三个签名缩写，是三个人一起{{compose}}（写成）的。写的人很不高兴：标的方对我们的{{motivation}}（动机）反复试探；管理层{{assert}}（断言）产能已经打满，却拒绝我们进三号线；中途对方一位财务负责人交了{{resignation}}（辞呈），解释是家庭原因。\n\n最后一句是手写的：They will float this thing anyway.——他们反正会把这东西弄上去。\n\n中缝里还有一句被铅笔圈住：卖方反复强调合并后的{{synergy}}（协同效应），却拒绝提供任何可核实的客户名单。\n\n那是这份文件里唯一一句像人话的。\n\n上楼我在{{terrace}}（露台）给 Ray 打电话：\"当年有人想买它，尽调做到一半跑了。\"\n\n\"跑了之后呢？\"\n\n\"之后它自己上的市。\"\n\nRay 沉默两秒：\"那你要问的不是它为什么被放弃，是——放弃它的那些人后来去哪了。\"\n\n我查过。那家基金三年前把资产打包进一只{{continuation fund}}（接续基金），老 LP 拿钱走人，新 LP 接盘，业绩基准还是那个{{hurdle rate}}（门槛收益率）。经手的两人，一个退休，一个换了东家。\n\n\"换去哪了？\"\n\n我看着屏幕上那行小字，喉咙有点紧。\n\n\"Halberd。\"\n\n电话那头 Ray 很轻地骂了一句。\n\n我又说：它上市前还试过两条路。一条是发{{American depositary receipt}}（美国存托凭证）去美国，尽调阶段就被劝退；一条是走{{listing by introduction}}（介绍上市），只挂牌不融资——可它缺钱。\n\n\"那它到底做没做过{{bookbuilding}}（簿记建档）？\"\n\n\"做过，\"我说，\"但不是在你以为的那一年。\"\n\n回酒店路上下雨，我把复印件抱在怀里，像抱一只怕水的猫。街角有人骂抢他位置的司机，用了{{rat}}（变节者）这个词。我想起报告发出去第二天，公司公告也用过差不多的词，还说要{{sue}}（起诉）我们。\n\n我一直以为那份报告是我写过最狠的东西。现在我知道，最狠的那份十年前就有人写完了，而所有本该看见的人都刚好{{overlook}}（没注意到）了它。\n\n我要看那份完整的尽调报告。","ft":[{"w":"American depositary receipt","z":"美国存托凭证","d":"境外公司股票在美交易的凭证形式，中概股主流载体","a":"ADR","p":""},{"w":"bookbuilding","z":"簿记建档","d":"向机构询价收集订单，据此确定发行价和配售名单","a":"","p":""},{"w":"cash-free debt-free","z":"无现金无负债口径","d":"报价假设标的既无现金也无负债，交割时再调整","a":"CFDF","p":""},{"w":"continuation fund","z":"接续基金","d":"GP把明星资产装进新基金继续持有，给老LP提供流动性","a":"","p":""},{"w":"drag-along right","z":"拖售权","d":"大股东卖公司时可强制小股东按同等条件一并出售","a":"","p":""},{"w":"financial sponsor","z":"财务投资人；PE买家","d":"以退出获利为目的的私募基金买家，不看协同看回报率","a":"","p":""},{"w":"hurdle rate","z":"门槛收益率","d":"LP先拿到这个回报，GP才开始分carry","a":"","p":"ˈhə:dl reit"},{"w":"listing by introduction","z":"介绍上市","d":"只挂牌不发新股融资的上市方式，港股允许","a":"","p":""},{"w":"non-binding offer","z":"无约束力报价","d":"竞价第一轮提交的初步报价，不构成正式承诺","a":"NBO","p":""},{"w":"pre-money valuation","z":"投前估值","d":"本轮融资进来之前的公司估值","a":"","p":""},{"w":"red herring","z":"预披露招股书","d":"未定价的初步招股书，封面有红色警示字样因此得名","a":"","p":""},{"w":"share deal","z":"股权交易","d":"直接买公司股权，历史债务和或有负债一并承接","a":"","p":""},{"w":"synergy","z":"协同效应","d":"合并后省下的成本或多做的收入，是并购最常用的说服理由","a":"","p":"'sinәdʒi"},{"w":"vesting","z":"股权归属","d":"创始人或员工股权按服务年限分期到手，防止提前离场","a":"","p":"'vestiŋ"}],"iw":[{"w":"Australian","p":"ɒ'streiljәn","t":"n. 澳大利亚人; a. 澳大利亚的, 澳洲的, 澳洲人的"},{"w":"junction","p":"'dʒʌŋkʃәn","t":"n. 连接, 会合处, 交叉点; 接 处, 接点. 界"},{"w":"motivation","p":".mәuti'veiʃәn","t":"n. 动机, 刺激, 推动; 促动, 推动, 诱导"},{"w":"flexible","p":"'fleksәbl","t":"a. 易曲的, 灵活的, 柔顺的, 能变形的, 可通融的; 能屈的"},{"w":"assignment","p":"ә'sainmәnt","t":"n. 分配, 功课, 任务, 转让, 归因, 陈述; 赋值"},{"w":"compose","p":"kәm'pәuz","t":"vt. 组成, 写作, 作曲, 使平静; vi. 创作, 排字; 编写"},{"w":"conversion","p":"kәn'vә:ʃәn","t":"n. 转变, 转换, 改变宗教信仰, 换位法; 转换"},{"w":"imperial","p":"im'piәriәl","t":"a. 帝王的, 宗主国的, 至尊的, 壮丽的; n. 特等品"},{"w":"assurance","p":"ә'ʃuәrәns","t":"n. 保证, 把握, 信心, 保险; 保证, 担保, 保险"},{"w":"registration","p":".redʒi'streiʃәn","t":"n. 登记, 挂号, 注册; 登记; 定位; 对齐; 记录"},{"w":"cotton","p":"'kɒtn","t":"n. 棉花; vi. 和谐, 有好感, 理解"},{"w":"disc","p":"disk","t":"n. 圆盘, 唱片; vt. 灌唱片"},{"w":"sue","p":"su:","t":"vt. 控告, 起诉, 请求; vi. 提出诉讼, 提出请求"},{"w":"terrace","p":"'terәs","t":"n. 阶地, 梯田, 房屋之平顶, 阳台, 沿岸防地, 露台; a. 叠层式的; vt. 使成梯田, 使成有平台屋顶"},{"w":"overlook","p":".әuvә'luk","t":"vt. 俯瞰, 远眺, 没注意到; n. 眺望, 俯瞰到的景色"},{"w":"rat","p":"ræt","t":"n. 鼠, 卑鄙的人, 破坏者, 变节者; vi. 捕鼠, 变节; vt. 弄蓬松"},{"w":"float","p":"flәut","t":"n. 漂流物, 浮舟, 漂浮, 浮萍, 彩车; vi. 浮动, 飘动, 散播, 摇摆, 动摇, 浮动; vt. 使漂浮, 容纳, 淹没, 发行, 实行; 浮动"},{"w":"discount","p":"'diskaunt","t":"n. 折扣, 贴现率; vt. 打折扣; vi. 贴现"},{"w":"resignation","p":".rezig'neiʃәn","t":"n. 辞职, 辞呈, 听从; 辞职"},{"w":"assert","p":"ә'sә:t","t":"vt. 主张, 坚称, 断言; 宣称, 断言, 维护"}],"doc":{"k":"无约束力报价函","en":"PRIVATE AND CONFIDENTIAL. On behalf of our client, a financial sponsor, we submit this non-binding offer for the entire issued share capital of the Company. The proposal is structured as a share deal on a cash-free debt-free basis and implies a pre-money valuation within the range set out in Appendix A. Consideration is subject to downward adjustment where receivable days exceed the agreed threshold. We assume that the drag-along right will be exercised so that one hundred per cent of the equity is delivered at completion, and that founder vesting will be reset over four years. No value has been ascribed to synergy at this stage. Internal approval requires the transaction to clear our stated hurdle rate. This letter creates no legal obligation on either party.","zh":"私密文件。我们谨代表客户（一家财务投资人）就贵公司全部已发行股本提交本份无约束力报价。本方案按股权交易结构设计，并以无现金无负债口径报出，所隐含的投前估值处于附录 A 所列区间之内。若应收账款回收天数超过双方约定的阈值，对价将作向下调整。我们假定拖售权将获行使，以确保交割时百分之百的股权一并交付，并假定创始人的股权归属安排将重设为四年。现阶段我们未就协同效应赋予任何价值。本交易须通过我方既定的门槛收益率方可获得内部批准。本函不对任何一方产生法律约束力。"}},{"i":63,"ti":"一份没人销毁的报告","dom":"deal","sc":"尽职调查","tx":"那份完整的尽调报告，是第三天早上到我手里的。\n\n来路很干净：当年的项目合伙人退休后把不涉密的材料捐给一所商学院做案例。学校编号摆在开架上，十年了，借阅记录是空的。\n\n一百六十页。封面右下角一行小字：本报告依据一份{{non-disclosure agreement}}（保密协议）项下取得的资料编制。\n\n我在飞机的{{cabin}}（客舱）里读完了前八十页。\n\n第一部分是技术。买方取了十七个批次样品，用电镜看{{particle}}（颗粒）形貌和粒径分布。结论客气又致命：一致性只能支持{{experimental}}（实验性的）中试规模，量产良率缺乏证据。报告引了研发总监一句原话——他们的{{innovation}}（创新）在工艺不在配方，无法提供复现路径。\n\n第二部分是财务。买方带会计师做了{{audit}}（审计）式核查，抽三十六家客户函证，回函率四成一。行业那两年正在{{boom}}（繁荣期）里，报告有一句我读了两遍：这样的景气度下，一家真实经营的公司不该有这么多客户找不到人。\n\n第三部分是法律，我看得最慢。\n\n{{representations and warranties}}（陈述与保证）列了六页，要求卖方就三年的收入、应收账款和关联交易逐项书面承诺，并配一份无上限的{{indemnity}}（赔偿条款）。律师批了一行：卖方拒绝无上限赔偿，建议在{{signing}}（签约）前解决，否则我们没有任何可用的{{remedy}}（救济手段）。\n\n卖方那时已有两轮外部投资，进来的都是{{preferred shares}}（优先股），带{{tag-along right}}（随售权）。买方算过，小股东若全部跟卖，要付的{{control premium}}（控制权溢价）比原计划高两成。\n\n第四部分是市场。整体转让做不成，就推它去港股做{{H-share}}（H股）上市，成为一家上市{{applicant}}（申请人）。他们问过两家{{bookrunner}}（簿记管理人），反馈是：它的{{free float}}（自由流通股）设计得太低，挂牌后价格很容易被少数人控制。有人问能否比照刚开口子的{{chapter 18A}}（18A章），被否了——这不是生物科技。\n\n看到第一百二十页，我停下来喝水。杯子里飘着一片{{lemon}}（柠檬）。\n\n下一页是内部时间表，倒数第二行：建议{{cancel}}（取消）本项目。三条理由，{{automatic}}（不带感情地）陈述事实：一、无法就收入真实性提供可核查证据；二、量产可行性存疑；三、卖方对赔偿安排的态度显示其对自身陈述缺乏信心。\n\n第三条最重。它没说对方造假，它说的是：一个人如果连自己讲过的话都不肯担保，那句话大概率是假的。\n\n页边有人写了半句英文，没写完：The emperor——我猜他本来想写{{emperor}}（皇帝）的新衣，写到一半觉得太便宜了。\n\n最后一页合伙人签字，日期旁边一行铅笔字：Not a lemon. A costume.——不是次品，是一套戏服。\n\n那家基金的{{vintage year}}（基金年份）是个好年份，手上{{dry powder}}（待投资金）多得烧手，人人都在抢项目。那种时候还肯把一个已经报价的项目毙掉，需要勇气——他们一开始给的估值相当{{generous}}（慷慨的）。\n\n也可能只是算清了：赢面{{versus}}（对比）代价，代价太大。报告里有整整一页对照表，左边买方看到的，右边卖方声称的，几乎没有一行对得上。\n\n落地前一小时，我给老周发了几张照片。他回得很快：这不是{{heritage}}（遗留物），这是证据。\n\n紧接着又来一条：他们跑掉时锁定还没开始算。也就是说，这公司后来上市定的那个{{lock-up period}}（锁定期）是重新设计的。你去看看是谁设计的。\n\n我忽然{{grin}}（咧嘴笑）了一下——不是高兴，是那种终于摸到边的、有点疼的笑，像有什么东西轻轻{{bite}}（咬）了我一口。邻座老太太看我一眼，我随口找了个{{excuse}}（借口），说想起一件旧事。\n\n云散了，底下是海，远处一排像针一样的{{pine}}（松树）沿着海岸线站着。\n\n我脑子里只剩一个问题：一家被专业买方判过死刑的公司，怎么在十四个月后正大光明地敲响了那口锣？\n\n答案很快就有了。它走的是{{reverse}}（反方向的）那条路——它根本没从正门进去。","ft":[{"w":"H-share","z":"H股","d":"内地注册公司在香港上市发行的股份","a":"","p":""},{"w":"bookrunner","z":"簿记管理人","d":"承销团中主导询价簿记和最终配售的核心角色","a":"","p":""},{"w":"chapter 18A","z":"18A章","d":"港交所允许未盈利生物科技公司上市的特别章节","a":"","p":""},{"w":"control premium","z":"控制权溢价","d":"为取得公司控制权而在市价之上多付的部分","a":"","p":""},{"w":"dry powder","z":"待投资金；干火药","d":"基金已募集但尚未投出去的钱，多说明市场竞价会激烈","a":"","p":""},{"w":"free float","z":"自由流通股","d":"实际可在市场买卖的股份，太低会导致股价被少数人操纵","a":"","p":""},{"w":"indemnity","z":"赔偿条款","d":"约定特定风险发生时由哪一方买单的安排","a":"","p":"in'demniti"},{"w":"lock-up period","z":"锁定期","d":"上市后大股东和基石不得卖出的时间窗口，解禁常压股价","a":"","p":""},{"w":"non-disclosure agreement","z":"保密协议","d":"接触交易信息前必签的文件，泄密即构成违约","a":"NDA","p":""},{"w":"preferred shares","z":"优先股","d":"分红和清算顺序优先于普通股，VC投资的标准工具","a":"","p":""},{"w":"representations and warranties","z":"陈述与保证","d":"卖方对公司状况作出的书面承诺，不实即需赔偿","a":"R&W","p":""},{"w":"signing","z":"签约","d":"双方签署正式交易协议，通常与交割间隔数月","a":"","p":""},{"w":"tag-along right","z":"随售权；共同出售权","d":"大股东转让时小股东有权按同等条件跟着卖","a":"","p":""},{"w":"vintage year","z":"基金年份","d":"基金首次投资的年份，是横向比较业绩的基准维度","a":"","p":""}],"iw":[{"w":"experimental","p":"ik.speri'mentәl","t":"a. 实验的, 根据实验的; 实验的"},{"w":"innovation","p":".inәu'veiʃәn","t":"n. 改革, 创新; 创新, 改革, 刷新"},{"w":"cabin","p":"'kæbin","t":"n. 小屋, 客舱; vt. 关在小屋"},{"w":"bite","p":"bait","t":"n. 咬, 一口; v. 咬, 刺痛, 穿透"},{"w":"particle","p":"'pɑ:tikl","t":"n. 颗粒, 粒子, 质点, 极小量; 粒子; 质点"},{"w":"remedy","p":"'remidi","t":"n. 药物, 治疗法, 治疗, 补救, 赔偿; vt. 治疗, 补救, 矫正, 改善, 修补, 修缮"},{"w":"pine","p":"pain","t":"n. 松树, 松木; vi. 消瘦, 憔悴, 痛苦, 怀念, 渴望; 邮件程序"},{"w":"applicant","p":"'æplikәnt","t":"n. 申请者; 申请人, 请求人, 谋事人"},{"w":"versus","p":"'vә:sәs","t":"prep. 对...; 诉, 对, 相形"},{"w":"emperor","p":"'empәrә","t":"n. 皇帝, 君主"},{"w":"grin","p":"grin","t":"n. 露齿笑; v. 露齿而笑"},{"w":"boom","p":"bu:m","t":"n. 繁荣, 隆隆声; vi. 急速发展, 发隆隆声; vt. 使兴旺, 发隆隆声"},{"w":"audit","p":"'ɒ:dit","t":"n. 审计, 查帐; vt. 查(帐), 旁听; vi. 查账; 查帐; 审查; 检查"},{"w":"heritage","p":"'heritidʒ","t":"n. 遗产, 祖先遗留物, 继承物; 遗传性"},{"w":"reverse","p":"ri'vә:s","t":"n. 相反, 背面, 倒退, 挫折, 失败; a. 反面的, 相反的, 反向的, 颠倒的; vt. 使颠倒, 使逆转, 使倒退, 使反向; vi. 倒退, 反向, 倒转, 反转; 反转"},{"w":"generous","p":"'dʒenәrәs","t":"a. 慷慨的, 有雅量的, 大量的, 丰富的"},{"w":"lemon","p":"'lemәn","t":"n. 柠檬, 柠檬树, 柠檬色; 柠檬"},{"w":"excuse","p":"ik'skju:z","t":"vt. 原谅, 申辩, 做为...的托辞; n. 致歉, 理由, 饶恕, 借口"},{"w":"cancel","p":"'kænsәl","t":"n. 取消, 撤消, 盖销(邮票); vt. 取消, 删去, 抵销, 盖销; vi. 相互抵销; 作废"},{"w":"automatic","p":".ɒ:tә'mætik","t":"n. 自动手枪, 自动机械; a. 自动的, 机械的, 必然的, 无意识的"}],"doc":{"k":"尽职调查报告执行摘要","en":"EXECUTIVE SUMMARY - STRICTLY PRIVATE. This report has been prepared under the non-disclosure agreement referred to on the cover and is addressed solely to the Investment Committee. Confirmation procedures on trade receivables produced a response rate of forty-one per cent. Management declined an uncapped indemnity and negotiation of the representations and warranties has not converged; we regard the residual risk as unacceptable in advance of signing. The outstanding preferred shares carry a tag-along right which would materially increase the control premium payable. Soundings with a prospective bookrunner indicate that an H-share listing would leave the free float below customary levels. Notwithstanding the dry powder available to a fund of this vintage year, we recommend that the project be discontinued and that discussion of the lock-up period be closed.","zh":"执行摘要，绝密。本报告依据封面所述保密协议编制，仅呈送投资委员会。应收账款函证程序的回函率为百分之四十一。管理层拒绝接受无金额上限的赔偿条款，陈述与保证的谈判亦未取得一致；我们认为在签约之前留存的风险不可接受。现存优先股附带随售权，一旦行使将显著抬高须支付的控制权溢价。我们与一家潜在簿记管理人的接触显示，若以 H 股方式上市，其自由流通股比例将低于通常水平。尽管本年份基金手上仍有充裕的待投资金，我们仍建议终止本项目，并结束有关锁定期的全部讨论。"}},{"i":64,"ti":"熊不卖，笼子卖","dom":"deal","sc":"借壳与反收购","tx":"壳公司叫华骏实业，主营业务：塑胶玩具及{{electrical}}（电动的）玩具制造。\n\n我在旧名录里翻到它。代码没变，名字换过三次。往前推十二年，它还在年报封面印过一只戴帽子的熊。\n\n第七页是产品线：毛绒类填充物用聚酯{{fibre}}（纤维）；{{battery}}（电池）驱动类，两节五号。第九页说产品过了阻燃{{inspection}}（检验），拿明火{{flame}}（火焰）烧过样品。本地一本财经{{weekly}}（周刊）采访过它的厂长。毛利十几个点，年年微利，很正经。\n\n第十四页开始不对劲。那年它换了大股东，新股东注册在维尔京群岛，董事只有一个人。公告里有句很官方的话：新股东对本公司未来发展抱有长远{{ambition}}（抱负），并将适时检讨现有业务。\n\n翻译过来就是：玩具不做了。\n\n两年后它把玩具业务整体卖掉，作价一块钱，做成一笔资产{{disposal}}（处置）。买家是原管理层——本质是一次很小的{{take-private}}（私有化退市），私有化的是业务，不是上市地位。卖完它就没主业了，账上只剩{{bare}}（光秃秃的）现金和一个壳。这是把鸡杀了，留下鸡笼。\n\n第三年，注入。\n\n东亚新能源的资产就是那时装进来的。这种操作绕过新上市审核，要拿股东大会的{{sanction}}（核准），还得请{{independent financial adviser}}（独立财务顾问）出意见函。那封信最有价值的是脚注：本顾问所依据的资料由公司提供，未作独立核实。\n\n我把链条画在纸上：玩具厂→空壳→注资→新故事。它的{{logic}}（逻辑）漂亮得可怕：每一步都{{legitimate}}（合法的），都有公告，都有中介签字，合起来是另外一回事。\n\nDanny 问：它为什么不直接上市？\n\n因为它走不通正门。真做 IPO，先得进{{virtual data room}}（虚拟数据室）让保荐人和律师翻底朝天——那系统会记录谁哪天打开了哪份文件。走 18C 也不行：{{chapter 18C}}（18C章）要披露研发投入和商业化路径，它那套一进去就{{naked}}（无遮蔽的）了。Danny 说那不就是港版{{special purpose acquisition company}}（特殊目的收购公司）？不一样：那种壳先说清楚要找标的，全程有规则管；这个是先买笼子再说。他顺手发来一张纽约在下{{shower}}（阵雨）的照片。\n\n我把材料发给 Ray，标题很直白：《它不是上市，它是搬家》。Ray 回了三个问题。\n\n第一，注入时资产怎么定价？\n\n用的是{{locked box}}（锁箱机制），按签约前某个基准日的报表定价，交割后不再调整。对一家数字是编的公司，这等于把编好的那张表当场钉死。\n\n第二，中介怎么说服市场？\n\n路演材料有整页讲{{revenue synergies}}（收入协同）：玩具厂的欧洲渠道可以卖新材料。我看到这页笑出声，像一出{{comedy}}（喜剧）。还有一页说交易{{accretive}}（增厚每股收益的），柱状图一根比一根高——做图的人很懂：不用说谎，只要把{{orientation}}（方向）摆对，就能把一个空壳{{depict}}（描绘）成平台。\n\n第三，钱是谁的？\n\n我沿着注资方往上爬到第四层，看见一家开曼基金的{{general partner}}（普通合伙人），注册地址是某栋楼第九层。我把地址扔进搜索框，跳出一{{cluster}}（一簇）公司，二十几家全在同一层。名字没一个重复，{{gross}}（总共）算下来管的钱是个很大的数。\n\n那夜我梦见自己站在堆满玩具的仓库里，脚下全是拆开的包装{{rubbish}}（垃圾）。有人背对我给一只熊装电池。我问这熊多少钱。他没回头：熊不卖，笼子卖。\n\n醒来四点。我重看那份注入公告，这次不看资产，看认购。\n\n借壳上来的公司是没有基石的。借壳不招股，不定{{price range}}（发行价区间），不做{{over-allotment}}（超额配售），也谈不上{{break issue}}（破发）——它连发行价都没有。\n\n可东亚新能源官网的\"上市历程\"里，明明白白写着{{cornerstone investor}}（基石投资者）。\n\n那说明它后来还做过一次真正的公开发售。我查到了：它从单一上市变成{{dual primary listing}}（双重主要上市），同时配售新股。名单很短——短到我一眼看见那个问题：这批人为什么不参加更早、更便宜的那一轮？\n\n名单一共十一家。第十家我不认识，但它的注册地址，跟我昨天扔进搜索框的那栋楼是同一层。","ft":[{"w":"accretive","z":"增厚每股收益的","d":"收购后每股收益上升，投行推销交易时必提的一个词","a":"","p":""},{"w":"break issue","z":"破发","d":"上市首日跌破发行价，承销商和基石都难看","a":"","p":""},{"w":"chapter 18C","z":"18C章","d":"港交所面向特专科技公司的上市通道，门槛按市值分档","a":"","p":""},{"w":"cornerstone investor","z":"基石投资者","d":"港股IPO中承诺认购并锁定的机构，用来给市场信心","a":"","p":""},{"w":"dual primary listing","z":"双重主要上市","d":"两地都按主板标准全面合规，可纳入港股通","a":"","p":""},{"w":"general partner","z":"普通合伙人","d":"管理基金、作出投资决策并承担无限责任的一方","a":"GP","p":""},{"w":"independent financial adviser","z":"独立财务顾问","d":"港股关连交易中为独立股东提供意见的持牌机构","a":"IFA","p":""},{"w":"locked box","z":"锁箱机制","d":"以签约前某个基准日的资产负债表定价，交割后不再调整","a":"","p":""},{"w":"over-allotment","z":"超额配售","d":"绿鞋机制下多卖出的那部分股份","a":"","p":""},{"w":"price range","z":"发行价区间","d":"招股时给出的价格区间，最终定价可上限也可下限","a":"","p":""},{"w":"revenue synergies","z":"收入协同","d":"交叉销售带来的增量收入，最容易被夸大的一类协同","a":"","p":""},{"w":"special purpose acquisition company","z":"特殊目的收购公司","d":"先募资上市再找标的合并的空壳，俗称空白支票公司","a":"SPAC","p":""},{"w":"take-private","z":"私有化退市","d":"把上市公司整体收购后从交易所摘牌，中概股回归常走这条路","a":"","p":""},{"w":"virtual data room","z":"虚拟数据室","d":"线上受控的尽调资料平台，谁看了哪份文件都有记录","a":"VDR","p":""}],"iw":[{"w":"ambition","p":"æm'biʃәn","t":"n. 野心, 志向"},{"w":"naked","p":"'neikid","t":"a. 裸体的, 无装饰的, 无保护的, 赤贫的; 裸露的"},{"w":"weekly","p":"'wi:kli","t":"n. 周刊, 周报; a. 每周的, 一周一次的, 周刊的; adv. 每周, 一周一次"},{"w":"electrical","p":"i'lektrikәl","t":"a. 电的, 有关电的; 电的"},{"w":"battery","p":"'bætәri","t":"n. 电池, 殴打; 蓄电池"},{"w":"logic","p":"'lɒdʒik","t":"n. 逻辑, 逻辑学, 推理的方法, 推理, 逻辑性; 逻辑"},{"w":"inspection","p":"in'spekʃәn","t":"n. 检验, 检查, 视察; 检查, 视察, 监督, 望诊"},{"w":"flame","p":"fleim","t":"n. 火焰, 火舌, 热情, 光辉; vt. 焚烧, 用火焰给...灭菌, 用火焰传送(信号), 点燃, 激动; vi. 燃烧, 爆发, 闪耀; 无聊邮件, 无益邮件"},{"w":"legitimate","p":"li'dʒitimәt","t":"a. 合法的, 正当的, 婚生的; vt. 认为正当, 立为嫡嗣, 使合法"},{"w":"bare","p":"bєә","t":"a. 赤裸的, 缺少的, 无遮蔽的, 坦率的; vt. 使赤裸, 露出"},{"w":"orientation","p":".ɒ:rien'teiʃәn","t":"n. 定方位, 适应, 向东方; n. 方向; 方向"},{"w":"gross","p":"grәus","t":"n. 总数, 总量; a. 总共的, 未打折扣的, 恶劣的, 粗野的; vt. 总共收入"},{"w":"cluster","p":"'klʌstә","t":"n. 串, 丛, 群, 簇; vi. 成串, 丛生; vt. 使聚集; 簇"},{"w":"shower","p":"'ʃauә","t":"n. 阵雨, 淋浴, 一阵, 展出者, 显示者; vi. 淋浴, 下阵雨; vt. 淋湿, 倾注"},{"w":"depict","p":"di'pikt","t":"vt. 描述, 描写"},{"w":"rubbish","p":"'rʌbiʃ","t":"n. 废物, 垃圾, 胡说"},{"w":"disposal","p":"dis'pәuzәl","t":"n. 丢掉, 处理, 排列, 销毁, 布置; 处理, 处置"},{"w":"fibre","p":"'faibә","t":"n. 纤维, 构造, 纤维制品; 纤维"},{"w":"comedy","p":"'kɒmidi","t":"n. 喜剧, 有趣的事情"},{"w":"sanction","p":"'sæŋkʃәn","t":"n. 核准, 制裁, 处罚, 约束力; vt. 制定制裁规则, 认可, 核准, 同意"}],"doc":{"k":"上市公司通函段落","en":"LETTER FROM THE INDEPENDENT FINANCIAL ADVISER. The Acquisition constitutes a very substantial acquisition and a reverse takeover of the Company. Consideration has been determined on a locked box basis by reference to the audited balance sheet at the Locked Box Date. The Directors consider the Acquisition to be accretive to earnings per share and anticipate revenue synergies arising from the enlarged group's existing distribution network. Diligence materials were made available to the advisers through a virtual data room. Following Completion the Company intends to seek a dual primary listing and to place new shares; the price range, the size of any over-allotment and the identity of each cornerstone investor will be announced in due course. Shareholders' attention is drawn to the risk of a break issue.","zh":"独立财务顾问函件。本次收购构成本公司的非常重大收购事项及反向收购。对价按锁箱机制厘定，以锁箱基准日经审计的资产负债表为依据。董事会认为本次收购将增厚每股收益，并预期扩大后集团的现有分销网络可带来收入协同。尽职调查资料已通过虚拟数据室向各中介顾问开放。交割完成后，本公司拟申请双重主要上市并配售新股；发行价区间、超额配售的规模以及各基石投资者的身份将于适当时候公告。谨请股东注意破发风险。"}},{"i":65,"ti":"名单上的第十家","dom":"deal","sc":"基石与锁定期","tx":"开曼，第九层，二十几家公司，其中一家在东亚新能源的基石名单上。\n\n我花两天把十一家全拆开。明面上的很快划掉：保险、主权基金、券商平台。\n\n剩下六家里有四家追到同一批服务商：同一家秘书公司，同一个地址，同一位授权签字人。四份文件上那名字的笔画走势完全{{correspond}}（一致），并排贴在墙上，像四张同一个人的{{identification}}（身份证明）。\n\n第十家最难。名字很中性，业务描述四个字：\"投资控股\"。往上是荷兰、卢森堡、特拉华——那边不披露受益人，线就断了。\n\n我换个办法：不查它是谁，查它做过什么——把名字扔进监管的公开库找{{declaration}}（权益披露申报）。持股过线都要申报，要签名留联系人。\n\n跳出七条，六条无关。第七条是三年前一家美国公司，留的邮箱后缀是 halberdpartners。\n\n不是 Halberd 本身，是它的影子——不出现在名单上，却能在需要时按住一批股票。\n\n我给 Ray 打电话：\"我不确定他们控制它，我确定他们知道它。\"他说这在法律上差很远，在市场上差不多。\n\n第二个发现才真让我睡不着。那次配售，公开发售部分被大幅{{oversubscribed}}（超额认购），触发了{{clawback}}（回拨机制）——要把机构那部分调一块给散户，基石的比例本该被压缩。\n\n可分配结果里基石一股没少：回拨只动国际配售那部分。这不违规，只是把规则读得比所有人都仔细——合规到让人恶心。\n\nRay 说：\"他不{{devise}}（设计）骗局，他设计规则的用法。\"\n\n我把当年那份方案从头再读。它本来要做一次正经的{{initial public offering}}（首次公开发行），连{{cost synergies}}（成本协同）都算好了。里面留了{{earn-out}}（对赌）：一部分对价挂钩三年业绩，达标才付；还有一条{{go-shop clause}}（询价期条款），签约后卖方有四十五天找更高报价，谁毁约谁付{{break-up fee}}（分手费）。这么周到的方案，一步都没执行。\n\n它的章程写着{{weighted voting rights}}（同股不同权）：创始人那类股份一股抵十票。所以任何{{tender offer}}（要约收购）都做不成，{{activist investor}}（维权投资者）买再多也按不动他。这结构的{{conception}}（构想）从第一天就不是为融资。\n\n基石锁定六个月。一到期，成交量三天放大十一倍，卖出席位分散得不自然——分散是{{artistic}}（有讲究的）。\n\n配售文件里还有一条没人注意：公司若在上市后三十六个月内完成{{spin-off}}（分拆上市），基石锁定自动解除。那正好是它宣布把材料和贸易分开做的那年。\n\n我把这些做成时间轴发给老周。他说他见过的局都不是败在造假上，是败在有人{{devote}}（投入）太多时间去看没人看的附件。但你得接受：这些证据在道德上{{acute}}（尖锐的），在法律上{{inadequate}}（不充分的）；你可以{{swear}}（发誓）你看见了什么，{{physically}}（实际上）却什么都没拿到。\n\n他说得对。这不足以{{condemn}}（谴责）任何人，{{attribute}}（归因）到某一个人身上更不对——这条链上每个人都{{rational}}（理性的），只走了对自己最划算的那步。\n\n那晚我走去下城。老楼中间夹着一座小{{chapel}}（小教堂），门开着。木头长椅被摸了两百年，{{grain}}（纹理）发亮。一个穿卫衣的{{youngster}}（年轻人）进来，插上耳机睡着了。\n\n我想起 Marcus 那句：市场喜欢好故事。我们这些{{civilian}}（平民）能做的是把故事拆回数字。\n\nRay 发来消息，说明天最后一场特别：一家做{{private equity}}（私募股权）的老基金，去年刚做完一笔{{management buyout}}（管理层收购）。\n\n我坐在床边，把这周的东西试着{{modify}}（修改）成能给 Wendy 看的版本，写到一半停住了。\n\n我一直把上市当成起点。可它上市前就被判过死刑。那之后是谁决定还要把它推上去？\n\n我翻回配售文件最后几页，\"其他安排\"那节有一行加粗小字：若交易未能于约定日期完成，本公司须向投资方支付{{reverse break fee}}（反向分手费）。\n\n一家公司在自己的融资文件里，给投资人写了一条反向分手费。我算过{{odds}}（胜算）——正常方案里这条出现的概率接近于零。\n\n这是有人在收保护费。","ft":[{"w":"activist investor","z":"维权投资者；激进股东","d":"持股后公开施压要求分拆、回购或换管理层的机构","a":"","p":""},{"w":"break-up fee","z":"分手费；终止费","d":"一方单方面终止交易需向对方支付的补偿","a":"","p":""},{"w":"clawback","z":"回拨机制","d":"散户认购过热时把机构份额调拨给散户的港股规则","a":"","p":""},{"w":"cost synergies","z":"成本协同","d":"合并后裁撤重复职能、集中采购省下来的钱，比收入协同可信","a":"","p":""},{"w":"earn-out","z":"对赌；业绩对价","d":"部分收购款挂钩标的未来业绩，达标才付","a":"","p":"ə:n aut"},{"w":"go-shop clause","z":"询价期条款","d":"签约后给卖方一段时间去寻找更高报价的例外安排","a":"","p":""},{"w":"initial public offering","z":"首次公开发行","d":"公司首次向公众发售股票并挂牌上市","a":"IPO","p":"iˈniʃəl ˈpʌblik ˈɔ:fərɪŋ"},{"w":"management buyout","z":"管理层收购","d":"现任管理层联合资本方把公司买下来，通常伴随私有化","a":"MBO","p":""},{"w":"oversubscribed","z":"超额认购","d":"申购量远超发行量，港股散户认购倍数高会触发回拨","a":"","p":"ˌəʊvəsəbˈskraɪbd"},{"w":"private equity","z":"私募股权","d":"投资非上市公司股权、主导经营改善后退出的资产类别","a":"PE","p":"ˈpraivit ˈekwiti"},{"w":"reverse break fee","z":"反向分手费","d":"买方因融资失败或未获批而毁约时付给卖方的赔偿","a":"","p":""},{"w":"spin-off","z":"分拆上市","d":"把子公司股份按比例分给现有股东，形成两家独立上市公司","a":"","p":""},{"w":"tender offer","z":"要约收购","d":"直接向全体股东发出按固定价格收购其股份的公开要约","a":"","p":""},{"w":"weighted voting rights","z":"同股不同权","d":"创始人持特别投票权股份，一股抵多票","a":"WVR","p":""}],"iw":[{"w":"inadequate","p":"in'ædikwәt","t":"a. 不充分的, 不适当的; 不充分的, 不适当的"},{"w":"civilian","p":"si'viljәn","t":"n. 平民, 民法专家; a. 平民的, 百姓的, 民用的"},{"w":"devise","p":"di'vaiz","t":"vt. 设计, 发明, 图谋, 遗赠给; n. 遗赠"},{"w":"grain","p":"grein","t":"n. 谷粒, 颗粒, 谷类, 纹理, 本质; v. (使)成谷粒"},{"w":"condemn","p":"kәn'dem","t":"vt. 判刑, 责备, 谴责; 定罪, 判刑, 宣告有罪"},{"w":"swear","p":"swєә","t":"vt. 发誓, 咒骂, 使宣誓; vi. 发誓, 诅咒; n. 诅咒, 誓言"},{"w":"devote","p":"di'vәut","t":"vt. 投入于, 献身"},{"w":"declaration","p":".deklә'reiʃәn","t":"n. 宣告, 说明, 宣布; 说明"},{"w":"identification","p":"ai.dentifi'keiʃәn","t":"n. 识别, 身份证明, 认同; 鉴定; 鉴别; 鉴别法; 认证"},{"w":"correspond","p":".kɒri'spɒnd","t":"vi. 符合, 通信, 相当; 符合, 一致, 相当"},{"w":"modify","p":"'mɒdifai","t":"vt. 修正, 变更, 修饰, 缓和, 减轻; vi. 被修改; 修改"},{"w":"odds","p":"ɒdz","t":"n. 可能性, 几率, 机会, 胜算, 不平等"},{"w":"chapel","p":"'tʃæpәl","t":"n. 小教堂, 礼拜式"},{"w":"youngster","p":"'jʌŋstә","t":"n. 小孩, 年轻人, 少年; 儿童, 少年, 青年"},{"w":"physically","p":"'fizikli","t":"adv. 按自然规律, 完全地, 实际上, 真正地, 身体上地"},{"w":"rational","p":"'ræʃәnl","t":"a. 理性的, 合理的; n. 有理数"},{"w":"conception","p":"kɒn'sepʃәn","t":"n. 观念, 概念; 妊娠, 受孕; 概念"},{"w":"attribute","p":"ә'tribju:t","t":"n. 属性, 标志, 定语; vt. 把...归于, 认为...属于; 属性"},{"w":"acute","p":"ә'kju:t","t":"a. 尖锐的, 敏锐的, 激烈的, 严重的, 急性的; 急性的; 尖锐的"},{"w":"artistic","p":"ɑ:'tistik","t":"a. 艺术的, 艺术家的, 富有艺术性的"}],"doc":{"k":"基石投资协议条款","en":"CLAUSE 7 - SUBSCRIPTION AND LOCK-UP. The Investor irrevocably agrees to subscribe for the Shares at the offer price determined in the initial public offering. Where the public offer is oversubscribed and the clawback mechanism is triggered, the Investor's allocation shall not be reduced. The Investor shall not dispose of the Shares for six months, provided that this restriction shall lapse automatically upon completion of any spin-off or material reorganisation. The Investor acknowledges the weighted voting rights attaching to the Founder Shares and undertakes not to act in concert with any activist investor, nor to accept any tender offer, without prior written consent. If Completion does not occur by the Long Stop Date, the Company shall pay the reverse break fee set out in Schedule 3.","zh":"第七条：认购与锁定。投资方不可撤销地同意，按首次公开发行所厘定的发售价认购本协议项下股份。若公开发售部分出现超额认购并触发回拨机制，投资方所获配售数量不得因此减少。投资方在六个月内不得处置该等股份，但若本公司完成任何分拆上市或重大重组，则该项限制自动失效。投资方确认创始人股份所附带的同股不同权安排，并承诺未经事先书面同意，不与任何维权投资者一致行动，亦不接受任何要约收购。倘交割未能于最后截止日之前完成，本公司应支付附表三所载的反向分手费。"}},{"i":66,"ti":"保荐人写过的那句话","dom":"deal","sc":"保荐与招股书","tx":"那句话印在招股章程第 iv 页，黑体，四十七个字。我读到第三遍的时候笑出了声，把隔壁工位的 Danny 吓了一跳。\n\n\"本公司之独家保荐人已就本文件所载资料进行合理尽职审查，并有合理理由相信该等资料在各重大方面均属真实、准确及完整。\"\n\n{{sole}}（唯一的）{{sponsor}}（保荐人）。一家投行，一个签字的人，一句话，把七百页担了下来。\n\n昨晚在基石名单最后一栏看见那个影子之后我就没睡。早上六点，我把当年的招股书从交易所存档里调了出来。扫描件，页眉有折角。\n\n我先看它怎么{{portray}}（描绘）自己。第 12 页印着高镍正极的{{molecule}}（分子）结构图，蓝色小球排得很漂亮；第 78 页那组市场规模数据，出处是一家我没听说过的材料工业{{federation}}（联合会）；第 141 页把产业补贴称为\"长期的政策{{stimulus}}（刺激）\"，说至少还有五年。补贴第二年就开始退坡了。\n\n说到底，招股书是一份写了七百页的{{advertisement}}（广告）。这不丢人。丢人的是它写得太像一本{{cooking}}（烹饪）手册——每一步都列了，火候一个字没提。\n\n真正让我坐直的是\"业务\"那一章后面的附录。\n\n保荐人老老实实披露了整个流程：开了{{data room}}（数据室），放进六千四百份文件；附了一张尽职调查{{kit}}（成套工具）清单，一百零七项，每项后面都打了勾；做了两轮{{pilot fishing}}（预路演），见了三十九家机构；据此把估值区间下调一档，\"以体现{{moderate}}（稳健的）的定价策略\"。\n\n每一句都对。每一句都合规。合在一起读，是另一回事。\n\n我把那三十九家机构抄下来，跟后来的{{anchor investor}}（锚定投资者）名单对了一遍。十一家重合，这不奇怪。奇怪的是其中两家在预路演阶段报的价格区间跟最终定价一模一样——不是接近，是{{identical}}（完全相同的）。\n\n我给老周打电话。他退休前是{{accountant}}（会计师），这种文件他一辈子看过几千份。\n\n\"你别激动，\"他说，\"猜中很正常。\"\n\n\"两家同时猜中小数点后两位？\"\n\n那头安静了几秒。\"把{{term sheet}}（条款清单）找出来，如果披露了的话。\"\n\n披露了。招股书里有一段\"上市前投资\"，克制得要命：某投资方于上市前十四个月入股，附{{right of first refusal}}（优先购买权）；管理层股权计划设一年{{cliff}}（归属悬崖），上市满一年起分四年归属；控股股东承诺持股不触及{{mandatory general offer}}（强制全面要约）的门槛。\n\n还有一笔{{bridge loan}}（过桥贷款）。八千万港币，用途写着\"支付重组开支\"，还款来源写着\"上市所得款项\"。借款方注册在开曼一个小{{isle}}（小岛）上，名字里带着 Trading。\n\n我算了当年的{{enterprise value}}（企业价值），倒推那一轮的{{internal rate of return}}（内部收益率）：如果真是十四个月里从入股价走到发行价，年化超过一百四十个点。\n\n\"这个数不{{reliable}}（可靠的），\"老周说，\"因为入股价是他们自己填的。\"\n\n我说我知道。真正{{disturb}}（扰乱）我的是另一句：发行设了{{greenshoe option}}（绿鞋机制），上限百分之十五，由保荐人兼稳市代理行使。\n\n\"那就有稳定价格行动公告，\"老周说，\"三十天里每天买了多少都是公开的。去查那个。\"\n\n天亮了。我调出那张很{{ugly}}（难看的）的股价图：上市首日涨百分之六十一，之后半年没有一次跌破发行价。那一年的港股里，这几乎是个{{miracle}}（奇迹）。\n\n我有一个不敢写下来的{{hypothesis}}（假设）：这家公司从来不需要{{white knight}}（白衣骑士），因为骑士从第一天起就坐在轿子里。它也从来不缺钱，上市后做过两次{{private investment in public equity}}（上市公司定向增发投资），认购方一次比一次陌生。\n\nDanny 端着咖啡凑过来：\"你查这个干嘛，七年前的事了。\"\n\n我说，因为那些钱要有个{{carrier}}（载体）才能过河，而这家公司就是那个载体。它不是谁的{{pet}}（宠儿），它是一辆车。\n\n\"那你现在要干嘛？\"\n\n我把公告检索页打开，输进日期，深吸一口气，像要咽下一{{dose}}（剂量）很苦的药。\n\n\"看看上市第一天，到底是谁在托。\"","ft":[{"w":"anchor investor","z":"锚定投资者","d":"提前表态大额认购但不锁定的机构，比基石灵活","a":"","p":""},{"w":"bridge loan","z":"过桥贷款","d":"交割前的短期融资，等长期债或股权到位后偿还","a":"","p":"bridʒ ləun"},{"w":"cliff","z":"归属悬崖","d":"服务满一定期限才开始归属，通常是一年","a":"","p":"klif"},{"w":"data room","z":"数据室","d":"卖方为买方尽调开放的资料库，现在基本都是虚拟数据室","a":"","p":""},{"w":"enterprise value","z":"企业价值","d":"股权价值加净负债，衡量买下整个生意要花多少钱","a":"EV","p":""},{"w":"greenshoe option","z":"绿鞋机制；超额配售权","d":"承销商可超额发售15%并在破发时回购护盘","a":"","p":""},{"w":"internal rate of return","z":"内部收益率","d":"让净现值为零的折现率，PE最常用的业绩口径","a":"IRR","p":""},{"w":"mandatory general offer","z":"强制全面要约","d":"持股触及30%门槛须向全体股东发出收购要约","a":"MGO","p":""},{"w":"pilot fishing","z":"预路演","d":"正式路演前小范围试探机构反应，摸估值区间","a":"","p":""},{"w":"private investment in public equity","z":"上市公司定向增发投资","d":"机构折价买入已上市公司新股，常带锁定期","a":"PIPE","p":""},{"w":"right of first refusal","z":"优先购买权","d":"股东转让股份时现有股东有权优先按同等条件受让","a":"ROFR","p":""},{"w":"sponsor","z":"保荐人","d":"港股IPO中对招股书真实性负责并接受证监会问责的投行","a":"","p":"'spɒnsә"},{"w":"term sheet","z":"条款清单","d":"把估值、股权比例、保护性条款一页纸列清的投资框架文件","a":"","p":""},{"w":"white knight","z":"白衣骑士","d":"被敌意收购的公司主动找来的友好第三方买家","a":"","p":"hwait nait"}],"iw":[{"w":"dose","p":"dәus","t":"n. 剂量, 服用量; vt. 给药, (用药)医治; vi. 服药"},{"w":"stimulus","p":"'stimjulәs","t":"n. 刺激, 激励, 刺激品; 刺激特, 刺激"},{"w":"federation","p":"fedә'reiʃәn","t":"n. 联邦, 联合, 联盟; 联邦, 联盟, 联邦政府"},{"w":"ugly","p":"'ʌgli","t":"a. 丑陋的, 邪恶的, 险恶的, 不祥的; n. 丑陋的人(或物)"},{"w":"portray","p":"pɒ:'trei","t":"vt. 描绘, 描写, 描绘...的肖像"},{"w":"moderate","p":"'mɒdәrәt","t":"a. 适度的, 稳健的, 中等的, 节制的; vt. 节制, 减轻, 使缓和; vi. 变缓和, 主持会议"},{"w":"hypothesis","p":"hai'pɒθәsis","t":"n. 假设; 假设"},{"w":"molecule","p":"'mɒlikju:l","t":"n. 分子, 些微; 分子"},{"w":"cooking","p":"'kukiŋ","t":"n. 烹饪; 熬炼; 热炼; 蒸煮"},{"w":"carrier","p":"'kæriә","t":"n. 运送者, 邮递员, 带菌者; 载波"},{"w":"reliable","p":"ri'laiәbl","t":"a. 可靠的, 可信赖的; 可靠的, 可信赖的, 确实的"},{"w":"disturb","p":"dis'tә:b","t":"vt. 扰乱, 妨碍, 使不安; 滋扰, 扰乱"},{"w":"identical","p":"ai'dentikәl","t":"a. 同一的, 恒等的, 完全相同的; 同一的, 同等的"},{"w":"isle","p":"ail","t":"n. 小岛, 群岛; vt. 使成为岛状; vi. 住在岛屿上"},{"w":"sole","p":"sәul","t":"n. 脚掌, 鞋底, 底部; a. 唯一的, 仅有的, 单独的, 独身的; vt. 上鞋底, 触底"},{"w":"advertisement","p":".ædvә'taizmәnt","t":"n. 广告, 启事, 广告宣传; 广告, 公告, 告示"},{"w":"kit","p":"kit","t":"n. 装备, 工具箱, 成套工具; 成套部件; 成套零件"},{"w":"pet","p":"pet","t":"n. 宠物, 受宠爱的人, 宠坏的孩子, 不悦, 生气; a. 宠爱的, 表示亲昵的, 养着观赏的, 特别珍爱的, 格外的; vt. 宠爱, 溺爱, 抚摸; vi. 拥抱, 爱抚, 生气, 发脾气"},{"w":"miracle","p":"'mirәkl","t":"n. 奇迹, 奇事"},{"w":"accountant","p":"ә'kauntәnt","t":"n. 会计人员, 会计师; 会计师, 会计人员"}],"doc":{"k":"保荐人声明","en":"SPONSOR'S DECLARATION. The sole sponsor confirms that it has conducted reasonable due diligence in respect of the Company, including a review of the documents made available in the data room, and that it has reasonable grounds to believe that the information contained in this prospectus is true, accurate and complete in all material respects. Feedback obtained during pilot fishing was taken into account in setting the indicative price range, and each anchor investor has entered into an agreement on substantially the same terms. The greenshoe option may be exercised by the sponsor acting as stabilising manager. The bridge loan disclosed above will be repaid out of the proceeds of the Offering. The term sheet governing the pre-IPO investment confers a right of first refusal, and the controlling shareholder has undertaken not to trigger a mandatory general offer.","zh":"保荐人声明。独家保荐人确认，其已就本公司进行合理尽职审查，包括查阅数据室内所提供的文件，并有合理理由相信本招股章程所载资料在各重大方面均属真实、准确及完整。预路演期间取得的反馈已于厘定指示性价格区间时予以考虑，各锚定投资者所订立的协议条款大致相同。绿鞋机制可由担任稳定价格操作人的保荐人行使。上文披露的过桥贷款将以本次发售所得款项偿还。规管上市前投资的条款清单授予优先购买权，而控股股东已承诺不会触发强制全面要约。"}},{"i":67,"ti":"二十三点六倍","dom":"deal","sc":"IPO 定价与簿记","tx":"他把 U 盘推过来之前，先看了一眼门。\n\n我们约在中环一栋{{colonial}}（殖民地时期的）老楼二层，楼下是家由旧{{cinema}}（电影院）改成的书店。他叫阿邦，老周从前的学生，当年在承销团簿记台上做执行，现在在一家小券商管{{placing}}（配售）。\n\n\"不给原件，\"他说，\"截图，水印洗掉了。你拿去发报告，我不认。\"\n\n我说我不发报告，我只想知道那个数字怎么长出来的。\n\n那个数字是 23.6。公告写得清清楚楚：国际配售录得约 23.6 倍认购。这个数上了所有财经版，成了那一年的{{consensus}}（一致看法）——好公司，市场抢着要。\n\n他把笔记本转过来。订单簿，四百多行，按时间排。\n\n我看了两分钟，后背发凉。\n\n不是哪一条有问题，是节奏。四百多行里，十四个账户占了总金额六成一，全部落在簿记截止前四十分钟内，金额清一色是五千万美元的整数倍。那种{{rhythm}}（节奏）不像市场，像有人在弹{{piano}}（钢琴），照着{{script}}（谱子）一个键一个键按。\n\n\"其中九笔，\"阿邦说，\"下单席位是同一家私人银行。\"\n\n\"客户不同？\"\n\n\"客户名字不同。\"他把\"名字\"咬得很重。\n\n我问这在当时算不算问题。\n\n他说不算。每一笔都是真实下单、真实划款、真实交收，合规流程全过。你从任何一个{{interior}}（内部的）环节去查都查不出毛病。问题是摊成一张{{blanket}}（总括的）图来看——整体比每一块拼图都难看。\n\n\"{{tactic}}（策略）很简单，\"他说，\"你不用造出真需求，你只要造一道看起来像需求的{{tide}}（潮水）。潮水一来，散户自己跟。\"\n\n后来才是最脏的。他往下翻：{{closing}}（交割）之后第三周，那十四个账户里有九个把配到的股票以大宗{{private placement}}（定向增发；私募配售）的方式转了出去，接盘的是一家中港{{joint venture}}（合资企业），成立时间比上市还晚三个月。\n\n\"所以他们根本没打算持有。\"\n\n\"他们从来没打算持有。\"\n\n我在纸上画出来，越画越像一条食物链：基石撑起{{equity value}}（股权价值）的门面，倍数制造新闻，新闻制造散户，散户{{swallow}}（吞下）配售盘。每一环都有合同，每份合同都合法。\n\n阿邦说了一句我记到现在的话：\"这行的{{prescription}}（处方）都一样。药是好药。剂量是他们定的。\"\n\n我又问上市前一天的{{grey market}}（暗盘）。他说成交量很小，价格却一路被抬上去，收在发行价上方 32%。\"那不是市场，那是给第二天开盘定的锚。\"\n\n路上我翻招股书。上市前最后一轮带了{{anti-dilution}}（反稀释条款）——发行价定低了会自动调他们的转换价，定价对那一轮从来不是风险。那家接盘的合资公司后来一路加到 29.8%，差 0.2 个点触线；第二年干脆开股东会拿到一张{{whitewash waiver}}（清洗豁免），把全面要约义务免掉。\n\n我还想起 2018 年那家跑掉的买方：本来要做{{trade sale}}（出售给产业方）式整体收购，尽调做完，用一条{{material adverse change}}（重大不利变化）条款把自己摘了出去。阿邦笑：\"放在今天，它大概率走{{de-SPAC}}（SPAC合并上市）。省事。\"\n\n保荐人当年把它写成一个{{buy-and-build}}（买入整合策略）的平台；哪天真要私有化退市，剩下的小股东会被{{squeeze-out}}（强制挤出）扫干净。工具一个都不坏，是有人把它们排成了流水线。\n\n我在楼下{{chase}}（追）了很久才拦到{{taxi}}（出租车）。广播正讲另一家公司的{{rights issue}}（供股）：大股东全额包销，小股东不跟就被稀释。\n\n回办公室已经七点。Danny 探头：\"你脸色像刚从{{removal}}（搬迁）公司搬完一天家。\"\n\n我说我需要一块{{cloth}}（布）把白板擦了重画。\n\n他递过来抹布和笔。我在白板正中写下一个很{{concrete}}（具体的）问题：\n\n上市第一天，是谁在托？\n\n这个问题总会让某个人{{liable}}（要负责的），我只是还不知道是谁。底下我又添一行，是明天第一件事：把三十天稳市期里每天的护盘量，一天一天{{recruit}}（收集）齐。\n\n如果绿鞋真的全额行使过，这个故事就该{{render}}（呈现）出本来的样子了。","ft":[{"w":"anti-dilution","z":"反稀释条款","d":"后续融资降价时自动调整前轮投资人的转换价格","a":"","p":""},{"w":"buy-and-build","z":"买入整合策略","d":"先买一个平台再连续并购同业，靠估值套利赚钱","a":"","p":""},{"w":"closing","z":"交割","d":"资金与股权正式完成交换的那一刻，交易才算真正做成","a":"","p":"'klәuziŋ"},{"w":"de-SPAC","z":"SPAC合并上市","d":"标的与SPAC合并从而完成上市的过程","a":"","p":""},{"w":"equity value","z":"股权价值","d":"归属股东的那部分价值，就是市值口径","a":"","p":""},{"w":"grey market","z":"暗盘","d":"港股上市前一日的场外交易，可提前看出开盘情绪","a":"","p":""},{"w":"joint venture","z":"合资企业","d":"两方以上共同出资设立的公司，跨境进入市场的常用结构","a":"JV","p":""},{"w":"material adverse change","z":"重大不利变化","d":"标的经营严重恶化时允许买方解约的条款，简称MAC条款","a":"MAC","p":""},{"w":"placing","z":"配售","d":"上市公司向机构折价发新股快速融资，港股很常见","a":"","p":"'pleisiŋ"},{"w":"private placement","z":"定向增发；私募配售","d":"向特定投资者非公开发行股份融资","a":"","p":""},{"w":"rights issue","z":"供股；配股","d":"按持股比例向老股东低价发新股，不参与就被稀释","a":"","p":""},{"w":"squeeze-out","z":"强制挤出","d":"收购方持股达法定比例后强制收购剩余小股东股份","a":"","p":"sk'wi:z'aʊt"},{"w":"trade sale","z":"出售给产业方","d":"把被投企业卖给同行业买家退出，最常见的退出方式","a":"","p":""},{"w":"whitewash waiver","z":"清洗豁免","d":"豁免因增持触发的全面要约义务，需独立股东通过","a":"","p":""}],"iw":[{"w":"rhythm","p":"'riðәm","t":"n. 旋律, 节奏, 韵律, 匀称, 张弛节律; 节律"},{"w":"tide","p":"taid","t":"n. 潮, 潮汐, 趋势, 潮流, 涨潮, 高潮; vt. 使随潮漂流; vi. 顺潮行驶"},{"w":"script","p":"skript","t":"n. 手迹, 手稿, 正本, 手写体; vt. 改编为演出本; 手写体, 小型程序"},{"w":"tactic","p":"'tæktik","t":"n. 一项战术, 一条策略; a. 战术的, 顺序的, 排列的"},{"w":"swallow","p":"'swɒlәu","t":"n. 燕子, 吞咽, 喉; vt. 咽, 淹没, 吞没, 耗尽, 轻信, 忍受, 抑制; vi. 吞下, 咽下"},{"w":"piano","p":"pi'ɑ:nәu","t":"n. 钢琴"},{"w":"liable","p":"'laiәbl","t":"a. 有义务的, 应负责的, 有...倾向的; 有责任的, 可受处理的, 应受罚的"},{"w":"removal","p":"ri'mu:vl","t":"n. 移动, 移居, 迁移, 排除, 切除; 切除, 除去"},{"w":"blanket","p":"'blæŋkit","t":"n. 毛毯, 毯子; vt. 掩盖, 覆盖; a. 总共的"},{"w":"cloth","p":"klɒ:θ. klɒθ","t":"n. 布料, 织品, 布; 布"},{"w":"interior","p":"in'tiәriә","t":"n. 内部, 内政; a. 内部的, 心灵的, 内地的, 内政的"},{"w":"concrete","p":"'kɒnkri:t","t":"n. 凝结物, 混凝土; a. 具体的, 实在的, 混凝土的; v. (使)凝结, 用混凝土浇筑"},{"w":"prescription","p":"pri'skripʃәn","t":"n. 处方, 命令, 指定; 处方, 药方"},{"w":"chase","p":"tʃeis","t":"n. 追求, 狩猎, 追逐; vt. 追捕, 追逐, 雕刻, 在...上镶嵌宝石; vi. 追赶, 奔跑"},{"w":"recruit","p":"ri'kru:t","t":"n. 新兵, 新手, 新会员, 补给品; vt. 恢复, 补充, 充实, 征募; vi. 征募新兵, 复原, 得到补充"},{"w":"render","p":"'rendә","t":"vt. 回报, 给于, 付给, 汇报, 提出, 舍弃, 反映, 表示, 表演, 致使, 执行, 实施; vi. 给予补偿; n. 交纳, 打底"},{"w":"consensus","p":"kәn'sensәs","t":"n. 合意, 一致, 同感; 合意"},{"w":"taxi","p":"'tæksi","t":"n. 出租车; vi. 乘出租车; vt. 用出租车送"},{"w":"colonial","p":"kә'lәunjәl","t":"a. 殖民的, 殖民地的; 殖民地居民"},{"w":"cinema","p":"'sinәmә","t":"n. 电影院, 电影"}],"doc":{"k":"招股章程「风险因素」段","en":"RISK FACTORS. There has been no prior public market for our Shares. Trading in the grey market on the day preceding listing may not be indicative of the price at which our Shares will trade after closing of the Global Offering, and our equity value may decline materially. We may in the future raise additional funds by way of a placing, a private placement or a rights issue, any of which may dilute the holdings of existing shareholders; certain pre-IPO investors benefit from anti-dilution protection that will not be available to public investors. Our joint venture arrangements may be terminated upon a material adverse change affecting either party, and there is no assurance that our buy-and-build strategy will be successfully executed.","zh":"风险因素。本公司股份此前并无公开市场。上市前一日暗盘的交投情况未必能反映本次全球发售交割后股份的交易价格，本公司的股权价值亦可能大幅下跌。本公司日后可能透过配售、定向增发或供股筹集额外资金，上述任何一种方式均可能摊薄现有股东的持股；部分上市前投资者享有反稀释条款保护，而公众投资者并不享有该等保护。本公司的合资企业安排可能因任何一方发生重大不利变化而被终止，且本公司无法保证其买入整合策略能够成功执行。"}},{"i":68,"ti":"开盘九分钟","dom":"deal","sc":"绿鞋与稳市","tx":"那份稳定价格行动公告只有两页，我读了四个小时。\n\n它跟所有公告一样无聊：稳定价格期自上市日起计三十天，稳定价格操作人为{{underwriter}}（承销商），期内进行了若干项稳定价格行动，价格不高于发行价。落款、日期、完。\n\n问题是另一块屏幕上开着当年的逐笔成交。\n\n我把首日切成一{{slice}}（切片）一{{slice}}（切片）看，每五分钟一段。第一段就不对：开盘九分钟成交了全天量的四成一，全在发行价上方，最高一笔高出五成八。\n\n按规矩，稳市只能在不高于发行价的价位买入。也就是说，那九分钟的巨单没有一张是{{underwriter}}（承销商）打的。\n\n那是谁打的？\n\n我把交易所参与者编号做成一张{{pie}}（饼图）：一个席位吃掉了首日买盘的三成三。这个编号我认识——就是阿邦那份簿记记录里替九个账户下单的私人银行。\n\n台{{lamp}}（灯）把纸照得发白。这已经不是{{clue}}（线索），这是脚印。\n\n公告披露的护盘集中在第四到第九天，全在发行价下方几分钱，量小，动作规矩——那是真的稳市。可股价从头到尾没认真跌过，绿鞋根本用不上。\n\n于是出现一个很{{grave}}（严重的）矛盾：自然买盘真那么强，为什么还要有人在头九分钟砸那么多钱？\n\n除非那些钱不是为了买股票，是为了垫一根{{underlying}}（在下面的）柱子；不是为了赚钱，是为了{{induce}}（引诱）后面的人跟进。\n\nDanny 凑过来。我说，有人要撑住一张桌子，不站在桌面上，蹲在底下用背顶着——公告写的是桌面。\n\n\"你怎么证明？\"\n\n\"证明不了。\"我说，\"我
