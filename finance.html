财政政策对增长的边际拉动力度，看变化量而非赤字水平","a":"","p":""},{"w":"higher for longer","z":"利率在高位维持更久","d":"市场用来描述央行虽停止加息、但短期内不会降息的政策状态","a":"","p":""},{"w":"jawboning","z":"口头干预","d":"官员靠公开表态影响市场预期或汇率，并不实际动用工具","a":"","p":"'dʒɒ:bәuniŋ"},{"w":"maximum employment","z":"充分就业","d":"美联储双重使命的另一半，指在不引发通胀前提下的最高就业水平","a":"","p":""},{"w":"on hold","z":"按兵不动；维持利率不变","d":"央行本次会议不调整政策利率，声明和纪要里常见的表述","a":"","p":"ɔn həuld"},{"w":"policy rate","z":"政策利率","d":"央行直接设定并用来引导市场利率的基准利率，是货币政策的核心抓手","a":"","p":""},{"w":"real interest rate","z":"实际利率","d":"名义利率减去通胀（或通胀预期），决定实际融资成本和资产估值","a":"","p":""},{"w":"revision","z":"数据修正","d":"统计局对已公布数据的回溯调整，美国非农的大幅下修常引发行情","a":"","p":"ri'viʒәn"},{"w":"sticky inflation","z":"通胀黏性；通胀下不去","d":"物价涨幅在高位停留、回落速度慢于预期的状态","a":"","p":""},{"w":"terminal rate","z":"终端利率；加息终点","d":"市场预期本轮加息周期最终会把政策利率抬到的最高水平","a":"","p":""}],"iw":[{"w":"handicap","p":"'hændikæp","t":"n. 障碍, 困难, 不利条件; vt. 加障碍于, 妨碍"},{"w":"outfit","p":"'autfit","t":"n. 用具, 配备, 机构; vt. 配备, 供应; vi. 得到装备"},{"w":"defect","p":"di'fekt","t":"n. 缺点; 缺损, 缺陷"},{"w":"patent","p":"'pætnt. 'peitnt","t":"n. 专利权, 许可证, 执照, 专利品, 素质; a. 专利的, 特许的, 显著的, 新奇的; vt. 取得...的专利权, 请准专利"},{"w":"lounge","p":"laundʒ","t":"n. 闲逛, 休闲室, 长沙发; vi. 闲混, (懒洋洋地)躺; vt. 闲混"},{"w":"texture","p":"'tekstʃә","t":"n. (织物的)密度, (材料等的)结构, 纹理; 纹理"},{"w":"frontier","p":"'frʌntjә","t":"n. 边界, 边境; 国境, 边境, 边界"},{"w":"spray","p":"sprei","t":"n. 水沫, 浪花, 水花, 喷雾, 喷雾器, 小树枝; vt. 喷雾, 扫射, 喷射; vi. 喷, 溅开"},{"w":"magnetic","p":"mæg'netik","t":"a. 有磁性的, 有吸引力的, 催眠术的; 磁 的"},{"w":"bureaucracy","p":"bjuә'rɒkrәsi","t":"n. 官僚, 官吏; 官僚主义, 官僚政治, 官僚机构"},{"w":"ballet","p":"'bælei","t":"n. 芭蕾舞"},{"w":"tourism","p":"'tuәrizm","t":"n. 观光业, 游览; 旅游业"},{"w":"notebook","p":"'nәutbuk","t":"n. 笔记本, 手册, 期票簿"},{"w":"bowel","p":"'bauәl","t":"n. 肠, 内脏, 内部; vt. 挖...的内脏"},{"w":"tremble","p":"'trembl","t":"n. 战栗, 颤抖; vi. 战栗, 忧虑, 摇晃"},{"w":"behalf","p":"bi'hɑ:f","t":"n. 利益, 方面"},{"w":"tag","p":"tæg","t":"n. 标签, 附属物, 碎片, 结束语, 口头禅, 附加语, 浑名, 标记, 标记符; vt. 附以签条, 尾随, 添饰, 起浑名, 连接; vi. 紧紧跟随; 标记"},{"w":"catalog","p":"'kætәlɒg","t":"n. 目录, 大学概况手册; vt. 编目录; 目录; 编目"},{"w":"empirical","p":"em'pirikәl","t":"a. 完全跟据经验的, 经验主义的; 经验主义的"},{"w":"referendum","p":".refә'rendәm","t":"n. （就重大政治或社会问题进行的）全民公决，全民投票"}],"doc":{"k":"宏观策略研报摘要","en":"Macro Strategy: Pricing an Outcome That Will Not Arrive. The Federal Reserve left the policy rate unchanged with a single dissent, which the market read as the beginning of a pivot. We disagree. Core PCE price index has decelerated, but the remaining distance is dominated by sticky inflation in shelter and services, and maximum employment is not currently a binding constraint. Futures continue to imply a terminal rate sixty basis points below the published projection. With the real interest rate at a fifteen-year high, credit spreads should not be narrowing; animal spirits and an unusually positive fiscal impulse explain more than policy does. We expect higher for longer to be tested by a revision rather than by jawboning, and we would not describe the Committee as behind the curve.","zh":"宏观策略：为一个不会到来的结局定价。美联储维持政策利率不变，仅有一票反对，市场将其解读为政策转向的开端。我们不认同。核心个人消费支出物价指数确已放缓，但剩下的这段距离主要由住房与服务中的通胀黏性主导，而充分就业目前并不构成约束。期货隐含的终端利率仍比官方公布的预测低六十个基点。在实际利率处于十五年高位的情况下，信用利差本不应继续收窄；动物精神与异常为正的财政脉冲，比政策本身更能解释这一现象。我们预计\"利率在高位维持更久\"这一判断，将由一次数据修正而非口头干预来检验，我们也不会把委员会形容为落后于形势。"}},{"i":96,"ti":"复牌第一小时","dom":"trading","sc":"平仓","tx":"复牌公告是周三晚上八点十七分挂出来的，两页纸，最后一行写着股份将于翌日上午九时起恢复买卖。\n\n我在办公室的{{aisle}}（过道）里来回走了十几趟。停牌两百一十天，公司在这两页纸里{{proclaim}}（宣告）独立调查\"实质性完成\"，却一个字没提结论。这种写法本身就够{{suspicious}}（可疑的）了——真有干净的结论，会写在标题上。\n\nDanny 把四台屏{{stack}}（叠）成两排，自己搬了把椅子坐中间。他的{{mobile}}（手机）在桌上一直震，几个群里在{{circulate}}（流传）同一张截图：某个论坛的帖子说这是黄金坑，配了一张均线图，说月线要走出{{golden cross}}（金叉）了，底下几百条回复，{{enthusiastic}}（热情高涨的）得吓人，全在喊{{buy the dip}}（逢低买入）。我看了两分钟就关掉。停牌前那三个月它是{{range-bound}}（区间震荡）的，横在四十二到四十六之间，很多人把这个叫\"底部构筑\"，其实那只是没人敢动。\n\nRay 站在门口问我明天怎么走。我说不知道。真的不知道。两年里所有情景我都推过，唯独没推过复牌那天该怎么办。\n\n第二天早上八点半，{{opening auction}}（开盘集合竞价）一开，我就知道这天会很难看。参考价一路往下掉，卖盘一层压一层，买盘那一侧几乎是空的。\n\n九点整，第一笔成交价出来：11.4 港元。前收 39.6。跌 71%。\n\nDanny 只说了一个字。\n\n然后是{{sell-off}}（抛售）。开盘二十分钟里没有任何理性可言，个股的{{circuit breaker}}（冷静期熔断机制）触发过一次，暂停五分钟，重开之后继续往下砸。{{volatility spike}}（波动率飙升）把我们所有的模型都打爆了，风控按{{rigid}}（刚性的）限额自动弹了三封邮件——这次弹的方向是反的：我们赚得太多，单一头寸的盈利占比超标了。\n\n十点二十出现了一次{{intraday reversal}}（日内反转），从 9.8 拉到 12.1。{{fear of missing out}}（怕踏空）这东西很难描述，那一刻连我都心跳快了一下。论坛上{{loyal}}（忠实的）散户在喊主力回来了。二十分钟后它跌回 9.2。\n\nDanny 转过椅子问：全平吗？\n\n问题在于怎么平。买回来才叫平仓，可你得有人卖给你。\n\n{{Stock Connect}}（沪深港通）那条路早断了，停牌期间它就被剔出名单，内地资金进不来。指数公司更快，三个月前删的，{{passive flows}}（被动资金）那一天全部出清完毕，之后再没有一分钱按规则进来。剩下的买方只有本地散户和几家做特殊情况的小基金。\n\n盘口是{{thinly traded}}（交投清淡）的：每一档只有零星几手，这只票的{{board lot}}（每手股数）是两千股，也就是说一档挂单可能只值几万块钱。我要买回的量，是这个的六千倍。\n\n我不敢下{{market order}}（市价单）。一个市价单扔进去，价格能被自己顶上去 15%，那是{{fatal}}（致命的）——最后你会发现赚的钱全{{compensate}}（补偿）给了自己的冲击成本。\n\nDanny 开了{{algo execution}}（算法交易执行），参与率设成 8%，让程序跟着量走。他又给三家券商打电话，去{{dark pool}}（暗池）里问有没有对手盘。半小时后他挂了电话，说：没有。\n\n下午两点之后，成交量开始{{shrink}}（萎缩）。三点，盘口{{peculiar}}（诡异）地干净了——买一档 8.9，只有一手；上面卖档空着。这就是{{liquidity dry-up}}（流动性枯竭）的样子。它在{{textbook}}（教科书）里从来不会被画出来，因为不好看。\n\n那天我们买回了计划量的百分之四。\n\n收盘后 Danny 摘了耳机，说这一天像被{{sack}}（洗劫）过一样。券商刚发来通知，借券费率要{{hike}}（上调）到年化 40%——他们也{{scent}}（嗅）出味道了，知道我们出不去。\n\n我坐了一会儿，才发现自己一直{{neglect}}（忽略）着一件最简单的事：一笔交易，只有在你能出来的时候，才算一笔交易。\n\n我们没有被{{compel}}（迫使）做任何事。我们只是被困住了。\n\n下楼进地铁站，我摸出八达通付{{fare}}（车费），刷了两次才刷进去。\n\n第二天开盘，买一档还是 8.9，还是一手。","ft":[{"w":"Stock Connect","z":"沪深港通","d":"内地与香港交易所互联互通的跨境股票交易机制","a":"","p":""},{"w":"algo execution","z":"算法交易执行","d":"用程序按预设规则拆单下单，减少冲击成本和交易痕迹","a":"","p":""},{"w":"board lot","z":"每手股数；一手","d":"港股每次买卖的最小股数单位，各只股票规定不同","a":"","p":""},{"w":"buy the dip","z":"逢低买入","d":"把回调当作加仓机会，前提是上升趋势没有被破坏","a":"","p":""},{"w":"circuit breaker","z":"熔断","d":"指数跌幅达到阈值时全市场暂停交易的机制","a":"","p":""},{"w":"dark pool","z":"暗池","d":"不公开挂单信息的场外撮合平台，机构用来隐藏大额意图","a":"","p":""},{"w":"fear of missing out","z":"怕踏空；踏空焦虑","d":"担心错过行情而被迫追进，常出现在市场情绪高点","a":"FOMO","p":""},{"w":"golden cross","z":"金叉","d":"短期均线向上穿过长期均线，被视为偏多的技术信号","a":"","p":""},{"w":"intraday reversal","z":"日内反转","d":"盘中方向逆转，表现为高开低走或者低开高走","a":"","p":""},{"w":"liquidity dry-up","z":"流动性枯竭","d":"买卖挂单同时消失，价格出现跳空且很难成交","a":"","p":""},{"w":"market order","z":"市价单","d":"不限价格立即按当前最优价成交的委托，速度优先但价格不可控","a":"","p":"ˈmɑ:kit ˈɔ:də"},{"w":"opening auction","z":"开盘集合竞价","d":"开盘前集中撮合形成开盘价的时段","a":"","p":""},{"w":"passive flows","z":"被动资金流","d":"指数基金和ETF按规则产生的买卖，与基本面判断无关","a":"","p":""},{"w":"range-bound","z":"区间震荡","d":"股价在明确的上下沿之间反复运行，缺乏突破动力","a":"","p":""},{"w":"sell-off","z":"抛售；砸盘","d":"大量卖单集中涌出，导致股价在短时间内快速下跌","a":"","p":""},{"w":"thinly traded","z":"交投清淡；没量","d":"日常成交量很小，稍大的委托就会明显推动股价","a":"","p":""},{"w":"volatility spike","z":"波动率飙升","d":"市场剧烈震荡使波动指标短期跳升，常伴随恐慌情绪","a":"","p":""}],"iw":[{"w":"compel","p":"kәm'pel","t":"vt. 强迫, 迫使"},{"w":"proclaim","p":"prә'kleim","t":"vt. 宣布, 公告, 宣言, 表明, 赞扬; 宣布, 宣告, 公布"},{"w":"hike","p":"haik","t":"n. 徒步旅行, 远足, 涨价, 提高; vi. 步行, 徒步旅行, 上升; vt. 使高涨, 拉起"},{"w":"enthusiastic","p":"in.θju:zi'æstik","t":"a. 狂热的, 热心的, 热烈的"},{"w":"scent","p":"sent","t":"n. 气味, 香味, 香水, 踪迹, 痕迹, 线索, 嗅觉; vt. 闻出, 嗅, 发觉, 使充满气味; vi. 嗅猎, 发出气味"},{"w":"loyal","p":"'lɒiәl","t":"a. 忠诚的, 忠实的, 忠贞的"},{"w":"suspicious","p":"sә'spiʃәs","t":"a. 可疑的, 多疑的, 怀疑的; 怀疑的, 令人怀疑的, 可疑的"},{"w":"fatal","p":"'feitәl","t":"a. 致命的, 重大的, 命运注定的, 粗心的, 不幸的; 致命的, 致死的"},{"w":"compensate","p":"'kɒmpenseit","t":"v. 偿还, 补偿, 付报酬"},{"w":"stack","p":"stæk","t":"n. 堆叠, 堆, 大量, 书库, 枪架, 烟囱, 堆积, 存贮栈; vt. 堆积, 堆满, 暗中对...做手脚; vi. 堆起; 堆积, 堆栈"},{"w":"sack","p":"sæk","t":"n. 麻布袋, 洗劫; vt. 把...装入袋, 洗劫"},{"w":"mobile","p":"'mәubil","t":"a. 移动的, 易变的, 机动的; n. 活动物体"},{"w":"textbook","p":"'tekstbuk","t":"n. 教科书"},{"w":"shrink","p":"ʃriŋk","t":"n. 收缩, 萎缩, 回避; vi. 收缩, 退缩, 萎缩, 缩小, 回避; vt. 使收缩, 使缩小"},{"w":"rigid","p":"'ridʒid","t":"a. 坚硬的, 刚性的, 严格的, 精密的, 刻板的"},{"w":"peculiar","p":"pi'kju:ljә","t":"a. 奇特的, 罕见的, 特殊的, 特别的; n. 特有财产, 特权"},{"w":"neglect","p":"ni'glekt","t":"n. 疏忽, 忽略, 漏做; vt. 疏忽, 忽视, 不顾"},{"w":"fare","p":"fєә","t":"n. 费用, 旅客, 食物; vi. 进展, 进步, 经营, 过活"},{"w":"circulate","p":"'sә:kjuleit","t":"v. (使)流通, (使)循环, (使)传播"},{"w":"aisle","p":"ail","t":"n. 走廊, 侧廊, 过道; 走道"}],"doc":{"k":"交易所复牌交易安排通告","en":"TRADING ARRANGEMENTS FOR THE RESUMPTION OF DEALINGS. Dealings in the shares of the Company will resume at 9:00 a.m. on Thursday. Exchange Participants are reminded that the shares will re-enter the market through the opening auction, and that the board lot size remains 2,000 shares. The shares have been removed from the eligible securities list under Stock Connect and will not be reinstated during this session; northbound and southbound orders will be rejected. Participants should note that index deletion has already been completed, so no passive flows will support the counter. Following an extended suspension the shares may be thinly traded, and periods of liquidity dry-up and a volatility spike should be expected. The market control circuit breaker may be triggered. Participants are urged to review any use of a market order.","zh":"关于恢复股份买卖之交易安排。本公司股份将于周四上午九时起恢复买卖。谨提醒各交易所参与者，股份将经由开盘集合竞价重新进入市场，每手股数维持为 2,000 股。该股份已从沪深港通合资格证券名单中剔除，本时段内不会恢复；北向及南向委托将被拒绝。参与者请注意，指数剔除已经完成，因此不会有被动资金为该股提供支撑。经长时间停牌后，股份可能交投清淡，并可能出现流动性枯竭时段及波动率飙升。市场调节机制（熔断）有可能被触发。敦请参与者审慎评估任何市价单的使用。"}},{"i":97,"ti":"四百一十天","dom":"trading","sc":"流动性枯竭","tx":"第二周的周一早上，我做了一张表，整张表只有一行数。\n\n上面写着：按过去二十个交易日的{{average daily volume}}（日均成交量），我们把空头全部买回来需要四百一十天。\n\n四百一十天。这个数叫{{days to cover}}（空头回补天数），平时它只是个技术指标，那天早上它是一句判决。\n\nDanny 把{{order book}}（订单簿）截图发到群里。买盘只有四档，加起来一百多手；卖盘十几档，全是零散挂单。这只票的{{tick size}}（最小变动价位）是 0.005 港元，本来是为了让买卖价差{{compact}}（紧凑），可现在买一和卖一之间空着七个价位，中间什么都没有。我们的委托扔进去，像被那片空白{{drown}}（淹没）掉。\n\n我们要做的动作叫{{buy to cover}}（空头回补）。听起来简单得可笑：买回来，还给券商，结束。\n\n问题是没有人卖。\n\nRay 十点{{summon}}（召集）全组开会，只讲了两句：这笔仓位账面盈利 4.1 亿港元，其中我们只实现了不到 5%。有人问要不要趁跌{{leverage up}}（加杠杆）再空一点，Ray 一句话否掉了——加杠杆的前提是你出得来。\n\n散会之后 Danny 写了个很{{crude}}（粗糙的）脚本，把当天要买的量切成两百个{{bucket}}（小份），沿时间轴摊开，尽量不{{distract}}（惊动）盘面。我们同时{{embark}}（着手）做第二套方案：能不能走大宗、能不能换券、能不能找特殊机会基金整{{chunk}}（大块）接走。全走不通。中介问了一圈，最后一家愿意报价的也{{depart}}（退出）了，理由是\"没兴趣做没有退出路径的东西\"。\n\n那两周股价是{{grind lower}}（阴跌）的。不暴跌，每天掉两三个点，配着极低的成交。这叫{{volume dry-up}}（缩量）。你能感觉到市场的{{terrain}}（地形）变了——原来它有坡有坎，现在是一块平的、干的、什么也长不出来的地。\n\n有几天会有{{bottom fishing}}（抄底）的账户{{invade}}（涌）进来，通常在上午十点半，买几百万，第二天就没了。论坛上有人讲{{mean reversion}}（均值回归），讲跌了 90% 之后总会反弹。我们不能赌这个。我们要的不是反弹，是有人接单。\n\n第九天出了事。出借方发来{{recall}}（券源召回）通知，要回其中一笔券，两个交易日内归还。港股{{T+1 settlement}}（T+1交收）意味着明天就得买到，否则是交收失败，罚息按天算，还要上记录。券商的{{protocol}}（规程）写得清清楚楚，没有商量余地。\n\n那两天我们在市场上追着自己买。{{slippage}}（滑点）大到荒谬：早上挂 8.65，成交在 9.30；下午再挂，已经跳到 9.80。最后一笔在{{closing auction}}（收盘集合竞价）里勉强{{fill}}（成交），价格比下单时贵了 14%。\n\nDanny 说这行是个{{jungle}}（弱肉强食的地方），可丛林里至少还有猎物。\n\n同一周还有两条消息。一是公司放风要做折价{{placement}}（配售），八折发新股给\"战略投资者\"，没人接，第三天不了了之。二是原始股东的{{lock-up expiry}}（解禁）到了，几亿股可以流通。放在从前这是天大的利空，现在一点意义都没有——他们跟我们一样卖不掉。\n\n我翻着两年的记录，忽然想起江西那个{{warehouse}}（仓库），门口的锁三年没换过；想起停车场里那辆没人开的车，{{tyre}}（轮胎）早就瘪了。我们做对了每一步，我们证明了那批货不存在，证明了那些收入是被{{manufacture}}（制造）出来的。\n\n然后我们发现，流动性是造不出来的。你可以编收入，编不出买盘。\n\n我一直以为自己是个{{planner}}（计划者）：把一件事从头推到尾，推到没有漏洞为止。可我从来没算过退出这一段。账面盈利是真的，它每天被重新估值、写进净值、报给 LP，可它没有{{outlet}}（出口）。\n\n我们不是没赢。我们是赢了以后，被{{deprive}}（剥夺）了把它拿走的资格。\n\nRay 说，这才是这个市场真正的样子：钱的{{migration}}（迁移）从来不是自由的，它只在有人愿意站在对面的时候才发生。\n\n那天夜里我把那张只有一行字的表打印出来，压在键盘下面。\n\n四百一十天。\n\n我们还剩多少天。","ft":[{"w":"T+1 settlement","z":"T+1交收","d":"成交后于下一个交易日完成股份与资金的交割","a":"","p":""},{"w":"average daily volume","z":"日均成交量","d":"一段时间内平均每天的成交金额，衡量个股的容量","a":"ADV","p":""},{"w":"bottom fishing","z":"抄底","d":"在大跌之后买入押注见底，判断错误就会越买越套","a":"","p":""},{"w":"buy to cover","z":"空头回补","d":"买回此前卖空的股票以了结空头头寸","a":"","p":""},{"w":"closing auction","z":"收盘集合竞价","d":"尾盘集中撮合确定收盘价，被动资金常在此时下单","a":"","p":""},{"w":"days to cover","z":"空头回补天数","d":"现有空头头寸按日均成交量需要多少天才能买回","a":"","p":""},{"w":"fill","z":"成交；成交回报","d":"委托被执行的动作或价格，数量全部执行称完全成交","a":"","p":"fil"},{"w":"grind lower","z":"阴跌；闷杀","d":"没有大跌但每天小幅下滑，持仓者被慢慢磨到出局","a":"","p":""},{"w":"leverage up","z":"加杠杆","d":"借入资金放大仓位，收益和亏损被同比例放大","a":"","p":""},{"w":"lock-up expiry","z":"解禁","d":"限售股到期可以流通，市场普遍担心新增的抛压","a":"","p":""},{"w":"mean reversion","z":"均值回归","d":"价格偏离过多之后向长期中枢回落的倾向","a":"","p":""},{"w":"order book","z":"订单簿；盘口","d":"交易所按价位汇总的买卖委托队列，反映即时供求","a":"","p":""},{"w":"placement","z":"配售；折价增发","d":"向特定投资者折价发行新股，短期摊薄并压制股价","a":"","p":"'pleismәnt"},{"w":"recall","z":"券源召回","d":"出借方提前要回股票，迫使空头临时买回平仓","a":"","p":"ri'kɒ:l"},{"w":"slippage","z":"滑点","d":"实际成交价与下单时预期价的偏离，流动性差时尤其明显","a":"","p":"'slipidʒ"},{"w":"tick size","z":"最小变动价位","d":"股价每次跳动的最小单位，直接影响买卖价差的宽窄","a":"","p":""},{"w":"volume dry-up","z":"缩量","d":"成交量萎缩到低位，通常代表观望或趋势临近变盘","a":"","p":""}],"iw":[{"w":"protocol","p":"'prәutәkɒl","t":"n. 草案, 礼仪, 协议; v. 拟定; 协议, 协议列表实用程序"},{"w":"deprive","p":"di'praiv","t":"vt. 剥夺, 使丧失; 剥夺, 剥夺, 夺去"},{"w":"warehouse","p":"'wєәhaus","t":"n. 仓库, 货栈, 大商店; vt. 储入仓库"},{"w":"tyre","p":"'taiә","t":"n. 轮胎; vt. 装轮胎于"},{"w":"drown","p":"draun","t":"vi. 淹死; vt. 把...淹死, 淹没"},{"w":"terrain","p":"'terein","t":"n. 地带, 地区, 地形, 领域, 范围"},{"w":"bucket","p":"'bʌkit","t":"n. 桶; 存储桶; 桶"},{"w":"compact","p":"kәm'pækt","t":"a. 紧凑的, 紧密的, 简洁的; vt. 使紧密结合, 压缩; vi. 变坚实"},{"w":"embark","p":"im'bɑ:k","t":"vi. 乘船, 着手, 从事, 上飞机; vt. 使上船, 使上飞机, 使从事"},{"w":"depart","p":"di'pɑ:t","t":"vi. 离开, 出发, 背离, 违反, 去世"},{"w":"distract","p":"dis'trækt","t":"vt. 转移, 分心, 使发狂"},{"w":"planner","p":"'plænә","t":"n. 计划者, 设计者, 安排者; 刨床机"},{"w":"chunk","p":"tʃʌŋk","t":"n. 大块, 矮胖的人(或物); 定样"},{"w":"crude","p":"kru:d","t":"a. 天然的, 未成熟的, 粗糙的, 粗鲁的; n. 天然的物质"},{"w":"summon","p":"'sʌmәn","t":"vt. 召唤, 召集, 号召, 振奋, 唤起, 鼓起; 传唤, 传讯"},{"w":"manufacture","p":".mænju'fæktʃә","t":"n. 产品, 制造; vt. 制造, 假造; vi. 制造"},{"w":"jungle","p":"'dʒʌŋgl","t":"n. 丛林, 杂乱的一堆, 弱肉强食的地方"},{"w":"outlet","p":"'autlet","t":"n. 出口, 发泄方法, 市场; 出口"},{"w":"migration","p":"mai'greiʃәn","t":"n. 移民, 移往, 移动; 迁移"},{"w":"invade","p":"in'veid","t":"vt. 侵入, 拥入, 侵略, 侵袭; 强入, 侵犯, 侵略"}],"doc":{"k":"基金给 LP 的月度信","en":"MONTHLY LETTER TO LIMITED PARTNERS - OCTOBER. The Fund's core short position is now carried at a substantial mark-to-market gain following the resumption of dealings. Investors should understand that this gain is largely unrealised. Average daily volume in the security has collapsed since resumption, and on current turnover our days to cover exceeds four hundred trading days. The order book is negligible at every level; slippage on each fill has been material, and several orders have been completed only in the closing auction. A partial recall by a stock lender required us to buy to cover into a rising price under T+1 settlement. We have not chosen to leverage up. A proposed placement failed, and the recent lock-up expiry has produced no incremental liquidity amid continuing volume dry-up.","zh":"致有限合伙人月度信——十月。复牌之后，本基金的核心空头头寸目前录得可观的按市值计价浮盈。请各位投资人理解，这笔收益绝大部分尚未实现。该证券复牌以来日均成交量急剧萎缩，按当前换手计算，我们的空头回补天数已超过四百个交易日。订单簿各档几乎为空；每一笔成交回报的滑点都相当显著，部分委托只能在收盘集合竞价中完成。出借方的一次部分券源召回迫使我们在 T+1 交收的约束下于上涨中空头回补。我们没有选择加杠杆。公司拟议的一次配售未能成事，而近期的解禁在持续缩量的环境下并未带来任何增量流动性。"}},{"i":98,"ti":"六个小时","dom":"reg","sc":"作证","tx":"他们让我九点整到，我八点四十就到了，在楼下便利店买了瓶水，站着喝完。\n\n那天雨横着打在玻璃上，像一场小型{{hurricane}}（飓风）。出门前 Ray 说：你今天不是去当 Zenith 的{{ambassador}}（使节），你是去做记录。别替公司说话，也别替自己辩解。\n\n会议室在二十八楼，长桌，四个人。陈婉如坐我对面，右手边一个同事负责记录，左手边两位没作自我介绍。桌上一台录音机，一份《警诫及誓言》。\n\n程序先走一遍：我作出的陈述具有法律效力，明知不实而作出，构成{{perjury}}（伪证罪）。她读得很慢，读完抬头看我一眼，问我明不明白。我说明白。她没有{{reassure}}（安抚）我一句，也没有{{suppress}}（压低）语气，就是照着念。\n\n然后是六个小时。\n\n我交出了全部东西：两年的交易流水、每一笔借券的成交单、内部备忘的每一版草稿、我和 Danny 的全部聊天记录、我个人账户的对账单。打印出来是一摞{{immense}}（庞大）的纸，装了三个箱子。前一晚我和合规通宵把无关的私人邮件{{weed}}（剔除）出去，剩下的一页没删。\n\n她的问题按一张{{timetable}}（时间表）走，从三年前展会那天开始，一天一天往下{{unfold}}（展开）。她没有{{skip}}（跳过）任何一页。\n\n问建仓：哪一天开始有仓位，报告哪一天发的，中间隔了多久。我说十四个月。她问为什么不早发。我说因为我还没把握，一份不成立的报告本身就是{{false or misleading statement}}（虚假或误导性陈述），我不想变成我要指控的那种人。\n\n问我们有没有跟别的基金约好一起做，有没有{{matched orders}}（对敲）。我说没有。她让我重复一遍，录音机就在中间。\n\n问 Zenith 内部的{{information barrier}}（信息隔离墙）：谁知道这份报告，什么时候知道的。我说四个人，发布前七十二小时。\n\n问个人账户。我说按{{code of ethics}}（职业操守准则）报备过，两年里没碰过任何一只我覆盖的股票，包括每一次我本可以赚钱的{{dip}}（下探）。\n\n问我们算不算{{substantial shareholder}}（主要股东）——空头到底要不要披露。我照实说了持仓比例和申报口径。\n\n问那封匿名信。问我知不知道{{whistleblower award}}（举报奖励）在美国是按罚没金额分成的，最高三成。我说知道。她问我申请了没有。我说没有，我不是内部人，不符合条件。\n\n下午两点半，节奏慢下来。她开始问公司那边：那份迟了四十天的{{profit warning}}（盈利警告），是不是应该更早发；哪些安排违反了{{Listing Rules}}（上市规则）下的持续披露义务；那条从开曼绕回来的资金链，触发了多少条{{anti-money laundering}}（反洗钱）申报义务。\n\n我说，那些不归我判断。\n\n她说，我知道，但我需要你说出你看见了什么，因为你是唯一一个从头看到尾的人。\n\n四点多，她提到纽约。说那边有一方已经在谈{{deferred prosecution agreement}}（暂缓起诉协议），条件包括罚金、整改和三年的独立监察人。她说这话的语气很{{passive}}（平淡被动的），像在念一段跟自己无关的新闻。\n\n我问：那 Halberd 呢。\n\n她没有回答，只是把笔记本合上，说：林小姐，你的研究观点受{{safe harbor}}（安全港条款）保护，我们不会因为一个判断去追究谁。我们看的是行为。\n\n六点二十，录音机停了。我签了字。站起来的时候腿有点麻，眼前{{plunge}}（猛地一沉）了一下，扶了扶桌子。\n\n我没有{{boast}}（夸口）过什么，也没有{{stall}}（拖延搪塞）过。整个过程里我{{likewise}}（同样地）没有得到任何一句\"你做得对\"。\n\n她送我到电梯口，问我还打算不打算继续做研究。我说打算。\n\n她点点头：那你要习惯这个——你交出去的东西，会被人拿去{{activate}}（启动）一些你控制不了的程序。这些程序有它们自己的{{validity}}（有效性），跟你的动机无关。\n\n电梯门开的时候她说：这些记录会{{revive}}（重新唤起）很多人的记忆，包括一些你希望他们忘掉的人。你要有准备。\n\n下楼时雨停了，天上有一块{{excess}}（多余的）亮。这一整天没有{{arouse}}（引起）我任何情绪，直到我站上天桥，才觉出手在抖。","ft":[{"w":"Listing Rules","z":"上市规则","d":"交易所对发行人持续披露与公司治理提出要求的规则体系","a":"","p":""},{"w":"anti-money laundering","z":"反洗钱","d":"识别、监控并报告可疑资金往来的法定合规体系","a":"AML","p":""},{"w":"code of ethics","z":"职业操守准则","d":"机构对员工利益冲突与个人交易等行为设定的内部规范","a":"","p":""},{"w":"deferred prosecution agreement","z":"暂缓起诉协议","d":"检方暂不起诉、企业整改并缴纳罚金的协议安排","a":"DPA","p":""},{"w":"false or misleading statement","z":"虚假或误导性陈述","d":"公开发布不实信息诱使他人交易，构成证券欺诈","a":"","p":""},{"w":"information barrier","z":"信息隔离墙","d":"券商内部阻断投行与研究、交易部门信息流通的合规机制","a":"","p":""},{"w":"matched orders","z":"对敲","d":"事先约定由多个账户互相成交，虚增交易活跃度的行为","a":"","p":""},{"w":"perjury","z":"伪证罪","d":"在宣誓后作虚假陈述，属独立的刑事罪名","a":"","p":"'pә:dʒәri"},{"w":"profit warning","z":"盈利警告","d":"公司预计业绩将大幅低于市场预期时发布的提示性公告","a":"","p":""},{"w":"safe harbor","z":"安全港条款","d":"满足特定条件即可免于承担陈述失实责任的法律豁免机制","a":"","p":""},{"w":"substantial shareholder","z":"主要股东；大股东","d":"持股比例达到申报门槛的股东，须履行权益披露义务","a":"","p":""},{"w":"whistleblower award","z":"举报奖励","d":"举报线索促成执法后按罚没金额一定比例发放的奖金","a":"","p":""}],"iw":[{"w":"hurricane","p":"'hә:rikәn","t":"n. 飓风, 暴风, 暴风雨"},{"w":"passive","p":"'pæsiv","t":"a. 消极的, 被动的, 冷漠的, 顺从的, 无源的; 被动的"},{"w":"skip","p":"skip","t":"n. 跳跃, 跳读; vi. 跳越, 跳读, 跳绳, 遗漏, 跳级; vt. 跳过, 遗漏; 跳过"},{"w":"ambassador","p":"æm'bæsәdә","t":"n. 大使; 大使, 使节, 代理"},{"w":"revive","p":"ri'vaiv","t":"vt. 使苏醒, 使复兴, 使振奋, 回想起, 重播; vi. 苏醒, 复活, 复兴, 恢复精神"},{"w":"reassure","p":".ri:ә'ʃuә","t":"vt. 使...安心, 向...再保证; 重新保证, 再保险, 使清除疑虑"},{"w":"likewise","p":"'laikwaiz","t":"adv. 同样地, 也"},{"w":"dip","p":"dip","t":"v. 浸, 降下, 把(手、勺等)伸入, 舀取; n. 浸, 涉猎; 双列直插式组件, 分布式输入输出系统, 双排直插封装"},{"w":"stall","p":"stɒ:l","t":"n. 厩, 停车处, 牧师职位, 货摊, 托辞, 拖延; vt. 关入厩, 停顿, 推托, 支吾, 使陷于泥中; vi. 被关在厩内, 陷于泥中, 停止, 支吾"},{"w":"boast","p":"bәust","t":"n. 吹牛; vi. 吹牛, 自夸; vt. 夸口说, 自恃有"},{"w":"plunge","p":"plʌndʒ","t":"n. 钻进, 跳进, 跳水, 跳水池, 猛跌, 落下, 投入, 开始从事, 盲目投资; vi. 投入, 投身于, 跳进, 陷入, 下降; vt. 使投入, 使插入, 使陷入, 使遭受"},{"w":"timetable","p":"'taimteibl","t":"n. 时间表"},{"w":"excess","p":"ik'ses","t":"n. 过度, 剩于, 超过, 超额; a. 过量的, 额外的"},{"w":"unfold","p":".ʌn'fәuld","t":"vt. 展开, 打开, 披露, 开展, 挑明; vi. 伸展, 开花, 呈现"},{"w":"validity","p":"vә'liditi","t":"n. 有效性, 正确性; 有效性"},{"w":"activate","p":"'æktiveit","t":"vt. 使活动, 使激活, 正式建成; vi. 有活力"},{"w":"suppress","p":"sә'pres","t":"vt. 镇压, 使止住, 禁止, 抑制, 查禁; 镇压, 平定, 禁止出版"},{"w":"immense","p":"i'mens","t":"a. 极广大的, 无边的, 非常好的"},{"w":"weed","p":"wi:d","t":"n. 杂草, 野草; vi. 除草; vt. 除...的草, 剔除"},{"w":"arouse","p":"ә'rauz","t":"vt. 唤醒, 鼓励, 引起; vi. 醒来"}],"doc":{"k":"证监会取证通知书节录","en":"NOTICE REQUIRING PRODUCTION OF RECORDS AND ATTENDANCE FOR INTERVIEW. You are required to produce all trading, order and communication records relating to the securities named in the Schedule. The interview will be recorded. Any statement you make that you know to be false may constitute perjury. The Commission is examining whether any false or misleading statement was published, whether matched orders were placed between connected accounts, whether the firm's information barrier and code of ethics were observed, and whether disclosure obligations applicable to a substantial shareholder and the continuing obligations under the Listing Rules were met. Related enquiries concern the delayed profit warning and applicable anti-money laundering reporting. Nothing in this notice limits any safe harbor available in respect of published research opinion.","zh":"要求提交记录及出席讯问通知书。现要求 阁下提交与附表所列证券有关的全部交易、委托及通讯记录。讯问过程将予录音。阁下作出明知为不实的陈述，可能构成伪证罪。证监会正在审查：是否曾发布任何虚假或误导性陈述；关连账户之间是否存在对敲；本机构的信息隔离墙与职业操守准则是否得到遵守；以及适用于主要股东的披露义务和《上市规则》项下的持续责任是否已履行。相关查询亦涉及延迟发布的盈利警告及适用的反洗钱申报事宜。本通知书的任何内容，均不限制就已发布研究观点可享有的安全港条款保护。"}},{"i":99,"ti":"他没有违反任何一条规则","dom":"fraud","sc":"结算","tx":"除牌决定是周五下午四点零五分公布的，公告只有一页半。\n\n我以为会有点什么感觉。等了一会儿，什么都没有。不是一声{{bang}}（巨响），是一张纸从传真机里慢慢吐出来的声音。\n\n同一天早上，独立调查的最终报告挂上网，三百八十七页。老周说，直接读附录 C。\n\n附录 C 是法证会计师{{compile}}（汇编）的一张表，六年的东西全在一页上：{{inconsistent disclosures}}（披露前后矛盾）——招股书说三条产线，年报说五条，工商备案只有两条；{{customer concentration}}（客户集中度）——前五大客户占收入 81%，三家在签约前四十天才注册；{{supplier concentration}}（供应商集中度）——单一供应商占采购 63%，注册地址跟那家客户在同一层楼；{{related party transaction}}（关联方交易）——那家开曼公司的最终{{beneficial}}（实益的）拥有人，是 CFO 大学同学的配偶；{{shell company}}（空壳公司）——链条上十一家，没有一家有员工社保记录；{{capitalisation of expenses}}（费用资本化）——三年 11 亿元研发和人工计进在建工程，从没转固。\n\n还有一句写在第 214 页，很平：账面 27.4 亿元银行存款中，24.9 亿元无法取得原始函证。\n\n{{phantom cash}}（虚假现金）。造假的最后一站。所有花活都是为了把这一个洞{{decoration}}（装饰）起来。\n\n内控那节里，{{material weakness}}（内控重大缺陷）出现了十九次。审计线也清楚：六年{{auditor change}}（更换审计师）三次；倒数第二任辞任前加过一段{{emphasis of matter}}（强调事项段），提示持续经营存在重大不确定性。\n\n老周说：全都在里面。识别造假不需要{{injection}}（注入）任何新信息，只需要把公开的东西按顺序摆好。难的不是发现，是相信自己的发现。\n\n然后说到 Marcus。\n\n那天下午 Halberd 发了一封给 LP 的信。信里一次都没提这家公司的名字，只说某只亚洲持仓已于上一年度分批退出，对全年业绩的影响\"在预期范围内\"。没有致歉，也没有{{clarify}}（澄清）任何东西。\n\n我把公开披露倒着查了一遍。他的基金在停牌前一个完整季度就把持股降到申报门槛以下，从那以后，报表上再也{{glimpse}}（瞥见）不到他。没写过公开研究报告，没签过任何一份需要披露的安排。他的{{compliance}}（合规）记录干净得像新的。\n\n他没有违反任何一条成文规则。\n\n念到第三遍我才意识到一件很{{dreadful}}（可怕的）事：他不是钻空子。空子是给要藏东西的人用的，他不需要藏。他做的每一件事单拿出来都站得住；规则要求的，他一样不落，规则没要求的，他一句也没多说。\n\n{{supposedly}}（照道理说）我们有一整套东西处理这种情况——披露、问责、诚信义务。可这套东西{{entail}}（要求承担）的只是\"你做过什么\"，管不了\"你知道什么\"。知情不是行为，沉默不是能被记录的{{occurrence}}（事件）。你没法在表格里填上\"他明白这是假的\"。\n\n法律和对错之间有一道缝。它不宽，但足够一个人从容走过去，连衣角都不蹭到。\n\n我曾经有点{{worship}}（崇拜）他。他不吼，不撒谎，从不{{fling}}（抛出）没有依据的话。我一直以为他知道的是公司的事。现在我明白，他知道的是规则的事。\n\n除牌{{cure}}（治愈）不了任何东西，它只是把这家公司从名单上划掉。那些买过它的人、把退休金放进那只票据里的人，是接不回来的。两个月后交易所对上市规则做了一次{{revision}}（修订），读起来像迟到的道歉。\n\n我用一晚上重排了模型的{{layout}}（版面），最后一栏改成\"已核实／未核实\"，把没有原始凭证支持的数字全删掉。删完剩下的是负的。没有什么能{{substitute}}（替代）原始凭证。\n\n第二天 Danny 发来一张照片：江西那个基地，围墙推倒一段，里面一堆建筑{{debris}}（残骸），三号车间的钢架还立着。现在这里连保安都没有了。\n\n我把照片存进那个叫\"2318\"的文件夹，拖进归档。\n\n很晚的时候，对面楼里有人{{thrust}}（推）开一扇窗。\n\n灯还亮着。有人在加班。有人正在读一份年报的第一页。","ft":[{"w":"auditor change","z":"更换审计师","d":"频繁换所或换成小所，往往是为了躲避质疑","a":"","p":""},{"w":"capitalisation of expenses","z":"费用资本化","d":"把当期费用记成资产延后摊销，短期虚增利润","a":"","p":""},{"w":"customer concentration","z":"客户集中度","d":"收入高度依赖少数客户，客户成立时间短更可疑","a":"","p":""},{"w":"emphasis of matter","z":"强调事项段","d":"审计报告中特别提醒关注的事项，常涉及持续经营","a":"","p":""},{"w":"inconsistent disclosures","z":"披露前后矛盾","d":"招股书、年报与工商资料的口径互不一致","a":"","p":""},{"w":"material weakness","z":"内控重大缺陷","d":"内部控制失效到可能导致重大错报的程度","a":"","p":""},{"w":"phantom cash","z":"虚假现金","d":"银行存款根本不存在或早被占用，造假的终极形态","a":"","p":""},{"w":"related party transaction","z":"关联方交易","d":"与股东、高管及其控制企业之间的交易，是利益输送高发区","a":"RPT","p":""},{"w":"shell company","z":"空壳公司","d":"没有实际经营的公司，常被用来走账或承接虚假交易","a":"","p":""},{"w":"supplier concentration","z":"供应商集中度","d":"单一供应商占比过高，可能是关联方假装第三方","a":"","p":""}],"iw":[{"w":"compliance","p":"kәm'plaiәns","t":"n. 遵从, 顺从, 屈从; 柔顺; 顺应"},{"w":"substitute","p":"'sʌbstitju:t","t":"n. 代理, 代理人, 代用品, 代替者, 代替物; vt. 代替; vi. 替代, 取代, 代用; a. 代替的, 代用的, 代用品的; 置换; 替代"},{"w":"supposedly","p":"sә'pәuzidli","t":"adv. 想象上, 看上去像, 被认为是, 恐怕, 按照推测"},{"w":"clarify","p":"'klærifai","t":"vi. 澄清, 阐明; vt. 使明晰"},{"w":"decoration","p":".dekә'reiʃәn","t":"n. 装饰, 装饰品"},{"w":"glimpse","p":"glimps","t":"n. 一瞥, 一闪; vi. 投以一瞥, 闪烁不定; vt. 瞥见"},{"w":"entail","p":"in'teil","t":"vt. 使成为必需, 需要, 使承担, 遗传给; n. 限定继承"},{"w":"occurrence","p":"ә'kʌrәns","t":"n. 发生, 事件, 出现; 发生"},{"w":"layout","p":"'leiaut","t":"n. 布局, 陈列, 规划图, 页面布局, 版面编排; 页面布局, 版面"},{"w":"injection","p":"in'dʒekʃәn","t":"n. 注射, 注射剂; 注入; 注射"},{"w":"compile","p":"kәm'pail","t":"vt. 编译, 编辑, 编纂, 收集; 编译"},{"w":"dreadful","p":"'dredful","t":"a. 可怕的"},{"w":"bang","p":"bæŋ","t":"n. 重击, 突然巨响, 刘海; v. 发巨响, 重击; adv. 砰然地, 突然巨响地, 直接地; 撞击符"},{"w":"debris","p":"'deibri:","t":"n. 碎片, 残骸; 碎屑"},{"w":"fling","p":"fliŋ","t":"n. 投掷, 急冲, 嘲弄; vt. 投, 丢下, 抛弃, 使陷入, 挥动, 嘲笑, 扫视; vi. 猛冲"},{"w":"worship","p":"'wә:ʃip","t":"n. 崇拜, 礼拜, 尊敬; vi. 参加礼拜; vt. 崇拜, 尊敬"},{"w":"beneficial","p":".beni'fiʃәl","t":"a. 有益的, 受益的; 有使用权的, 可享利益的"},{"w":"cure","p":"kjuә","t":"n. 治疗, 治愈, 治疗法; vt. 治疗, 治愈, 改正, 腌制, 加工处理, 使硫化; vi. 受治疗, 被加工处理, 被硫化"},{"w":"revision","p":"ri'viʒәn","t":"n. 校订, 修正, 修订本, 修订版; 修订版"},{"w":"thrust","p":"θrʌst","t":"n. 插, 戳, 刺, 猛推, 口头攻击, 推力; vt. 插入, 猛推, 刺, 戳, 强加, 延伸; vi. 插, 刺, 戳, 延伸, (用力)推"}],"doc":{"k":"联交所取消上市地位决定公告","en":"DECISION TO CANCEL THE LISTING. The Listing Committee has resolved to cancel the listing of the issuer's shares with effect from the date below. The independent investigation identified pervasive related party transaction arrangements routed through eleven shell company vehicles, extreme customer concentration and supplier concentration among counterparties incorporated shortly before contracting, and inconsistent disclosures between the prospectus, subsequent annual reports and filed registration records. The investigation further reported improper capitalisation of expenses, material weakness in internal control over financial reporting, and phantom cash of approximately RMB2.49 billion for which no original confirmation could be obtained. The Committee notes three instances of auditor change during the period and the emphasis of matter paragraph included by a former auditor regarding going concern.","zh":"取消上市地位的决定。上市委员会决议，自下述日期起取消该发行人股份的上市地位。独立调查发现，公司存在经由十一家空壳公司通道进行的普遍性关联方交易安排；交易对手方在签约前不久方才注册成立，客户集中度与供应商集中度均属极端；招股章程、其后各年度报告与工商登记备案之间存在披露前后矛盾。调查另报告称，公司存在不当的费用资本化，财务报告内部控制存在内控重大缺陷，并有约人民币 24.9 亿元的虚假现金无法取得任何原始函证。委员会注意到，期间共发生三次更换审计师，且前任审计师曾就持续经营事项加入强调事项段。"}},{"i":100,"ti":"从产能那一页开始","dom":"industry","sc":"重新开始","tx":"三个月后一个周二下午，我在桌上摊开一份新的年报，四百六十页，封面是一片蓝色的屋顶光伏。\n\n报告发出去之后，我得到了一点不想要的{{fame}}（名声）：半夜的邮件，有一个月连着收到同一个人的{{harassment}}（骚扰）信息。这两年的{{toll}}（代价）大概就是这么算的。后来慢慢少了，人会往前走，市场尤其。\n\nZenith 还在，小了一圈。Ray 话很少，只在一次晨会上说过一句：这一单我们赚了钱，但我不确定我们赢了。\n\n早上我坐{{ferry}}（渡轮）过海，见一个做户用储能的销售总监。回程在船尾看见对岸山腰那一片{{cemetery}}（墓地）。海风有点{{chill}}（凉意）。我们这行也有这么一片地方，埋的都是故事讲对了、时间讲错了的人。\n\n回到办公室泡了杯茶，我翻到第 148 页：产能。\n\n三条主线，两个基地，还有一条在建。管理层写：预计明年二季度完成{{ramp-up}}（产能爬坡）。我在页边写下第一行字，画了个问号，然后一格一格往下核。\n\n在建那条线所在的省份去年出过{{dual control of energy consumption}}（能耗双控）文件，用电{{quota}}（配额）按季度下发，我得查它今年拿到多少。它披露的{{logistics data}}（物流数据）可以从港口和货代那边交叉验证；欧洲客户现在要求供应商出具产品的{{carbon footprint}}（碳足迹）核算报告，这东西造不了假，要第三方核查，还要跟用电量对得上——绕了三年，我最后还是回到用电量。\n\n它在两个欧洲国家还没进并网的{{eligible}}（合格）名录。海外渠道两条腿：一半给当地{{dealer}}（代理商）分销，一半自己做{{franchise model}}（加盟模式）。我更在意{{point of sale data}}（终端零售数据）：发给经销商不叫卖掉，终端刷了卡才算。它在几家建材连锁拿到了{{shelf space}}（陈列位），那种位置不是花钱买得到的。官网询盘{{traffic}}（流量）同比涨六成，这数要打折。\n\n真正要看的是{{order momentum}}（订单动能）：不看绝对量，看环比，看它有没有把去年四季度的单挪到今年一季度确认。管理层已经在电话会上用上了{{moderating growth}}（增速放缓），还试图把话题往新产品上{{steer}}（引导）。这个词出现，通常意味着他们看见拐点了。\n\n上游是{{input cost inflation}}（原材料涨价压力）：碳酸锂和芯片都在涨，它的{{safety stock}}（安全库存）从三十天提到六十天。短期难看，可真断供的时候，它是唯一还能交货的那家。\n\n{{barriers to entry}}（进入壁垒）在哪儿？认证周期、渠道、并网资质，都算，但都不高。这个行业正在往{{commoditization}}（同质化）走，所以我必须做一张{{supply-demand balance}}（供需平衡表），看哪一年供给翻过需求那条线。补贴是根{{carrot}}（胡萝卜），去年退了一半，明年可能全退。\n\n我把去年那套模板{{amend}}（修改）了一遍：加两列，\"数据来源\"和\"是否可交叉验证\"。不能交叉验证的数字，我不再往下算。这是这两年唯一改了我工作方式的东西。\n\n老周寄来一本他八十年代做审计时的{{manuscript}}（手稿）。里面一页画着{{graph}}（曲线图），横轴是年份，纵轴写着\"我相信的比例\"，那条线一路往下，几乎贴着底。旁边一行小字：贴底不等于零。\n\n下午四点，太阳照到杯子的{{rim}}（杯沿）上，晃了一下。我{{blink}}（眨）了眨眼。\n\n这家公司我可能会看好，也可能三个月后写一份看空的。{{likelihood}}（可能性）现在谈不上。\n\n我不是谁的{{heir}}（继承人）。我只有一样东西：一份三年没断过的{{continuity}}（连续性）：同一套问题，问同一批人，问到他们烦。\n\n三年前在展会上，我也是在产能这一页愣住的。那时候我以为自己看见的是一个太大的数字。现在我知道，我看见的是一个太干净的数字。\n\n那个愣住的人会立刻掏出手机去查用电量。今天我没有。我先把这一页读了三遍，才写下要核的第一项：在建那条线的反应釜{{diameter}}（直径）多少，年产多少吨，对不对得上。\n\nDanny 从背后经过，看了眼屏幕：又来？\n\n我说：又来。\n\n他端着咖啡走了。走廊那头有人在为一个不相干的消息{{cheer}}（欢呼）。\n\n我把这一页折了个角，翻到下一页。\n\n附注，一共一百四十七页。","ft":[{"w":"barriers to entry","z":"进入壁垒；准入门槛","d":"新玩家想进这个行业要跨过的资金、技术或牌照门槛","a":"","p":""},{"w":"carbon footprint","z":"碳足迹","d":"产品全生命周期的排放量，出口企业越来越被客户要求核算","a":"","p":"ˈkɑ:bən ˈfʊtˌprɪnt"},{"w":"commoditization","z":"同质化；商品化","d":"产品差异消失后只能拼价格，定价权随之丧失","a":"","p":"kəmɒdɪtaɪ'zeɪʃn"},{"w":"dealer","z":"代理商；4S 店","d":"代理品牌产品的终端渠道，汽车和家电最常提到","a":"","p":"'di:lә"},{"w":"dual control of energy consumption","z":"能耗双控","d":"对能源总量和强度同时设限的政策，会限制高耗能产能","a":"","p":""},{"w":"franchise model","z":"加盟模式","d":"把门店交给加盟商开，扩张快但管控难度大","a":"","p":""},{"w":"input cost inflation","z":"原材料涨价压力","d":"上游价格上行推高成本，毛利率是否受损取决于能否提价","a":"","p":""},{"w":"logistics data","z":"物流数据","d":"货运量、发货单和运价变化，用来交叉验证出货是否真实","a":"","p":""},{"w":"moderating growth","z":"增速放缓","d":"增长仍在但速度下台阶，管理层降预期时的常用措辞","a":"","p":""},{"w":"order momentum","z":"订单动能","d":"新增订单的环比趋势，比绝对量更能说明景气方向","a":"","p":""},{"w":"point of sale data","z":"终端零售数据","d":"门店实际成交数据，比厂商出货口径更贴近真实需求","a":"POS","p":""},{"w":"ramp-up","z":"产能爬坡；上量","d":"新产线从投产到满产的过程，期间良率和成本都还没优化","a":"","p":"'ræmp'ʌp"},{"w":"safety stock","z":"安全库存","d":"为应对断供或需求波动而多备的货，缺芯时期显著抬高","a":"","p":""},{"w":"shelf space","z":"陈列位；货架资源","d":"商品在终端占据的展示空间，是快消品竞争的战场","a":"","p":""},{"w":"supply-demand balance","z":"供需平衡表","d":"逐年测算供给和需求缺口，周期品价格判断的基本工具","a":"","p":""},{"w":"traffic","z":"流量","d":"访问量或曝光量，是电商与广告业务收入的源头","a":"","p":"'træfik"}],"iw":[{"w":"amend","p":"ә'mend","t":"vt. 修改, 改善, 改良; vi. 改过自新"},{"w":"cemetery","p":"'semitәri","t":"n. 墓地, 公墓; 公墓, 墓地"},{"w":"ferry","p":"'feri","t":"n. 渡船, 渡口; 摆渡营业权, 轮渡"},{"w":"harassment","p":"'hærәsmәnt","t":"n. 困扰, 烦扰, 烦恼; 折磨, 骚扰, 侵扰"},{"w":"fame","p":"feim","t":"n. 名望, 名声, 传说"},{"w":"manuscript","p":"'mænjuskript","t":"n. 手稿, 原稿, 底稿; a. 手写的"},{"w":"graph","p":"græf","t":"n. 曲线图, 图表, 图形; 图形"},{"w":"likelihood","p":"'laiklihud","t":"n. 可能, 可能性"},{"w":"carrot","p":"'kærәt","t":"n. 胡萝卜; 胡萝卜"},{"w":"continuity","p":".kɒnti'nju:iti","t":"n. 连续性; 连续性"},{"w":"toll","p":"tәul","t":"n. 通行费, 代价, 钟声; vt. 征收, 敲钟, 鸣钟, 勾引, 引诱; vi. 征税, 鸣钟"},{"w":"rim","p":"rim","t":"n. 边, 轮缘, 框; vt. 镶边, 为...装边; vi. 形成边缘"},{"w":"quota","p":"'kwәutә","t":"n. 配额, 限额; 定额"},{"w":"blink","p":"bliŋk","t":"vi. 眨眼, 闪亮; vt. 眨眼, 使闪亮; n. 眨眼, 瞬间, 闪光, 闪烁; 闪烁"},{"w":"heir","p":"єә","t":"n. 继承人, 嗣子, 后嗣; 继承人, 后嗣"},{"w":"eligible","p":"'elidʒәbl","t":"a. 有资格当选的, 合格的; n. 有资格者, 合格者, 适任者"},{"w":"diameter","p":"dai'æmitә","t":"n. 直径; 直经, 径"},{"w":"chill","p":"tʃil","t":"n. 寒冷, 寒意, 失意; a. 寒冷的, 冷漠的; vt. 使寒心, 冷冻; vi. 变冷"},{"w":"cheer","p":"tʃiә","t":"n. 愉快, 振奋, 欢呼; vi. 欢呼, 喝彩, 快活起来; vt. 使振奋, 欢呼"},{"w":"steer","p":"stiә","t":"vt. 引导, 驾驶, 航行, 控制; vi. 驾驶, 掌舵, 行驶; n. 驾驶指示, 劝告"}],"doc":{"k":"卖方研报摘要（首次覆盖）","en":"INITIATION OF COVERAGE - Residential Energy Storage. We initiate with a Neutral rating. Management guides to completion of the ramp-up at the third plant by the second quarter, a schedule we regard as dependent on provincial dual control of energy consumption approvals. Order momentum has decelerated for two consecutive quarters and the company now describes moderating growth. We prefer point of sale data to shipment disclosure, and we cross-check reported volumes against independent logistics data and third-party carbon footprint verification. Overseas distribution is split between a dealer network and a franchise model; incremental shelf space at two building-materials chains is a genuine advantage, while website traffic is a weak proxy for demand. Input cost inflation has lifted safety stock. Our supply-demand balance points to commoditization by 2028; barriers to entry are low.","zh":"首次覆盖——户用储能。我们给予中性评级。管理层指引第三工厂的产能爬坡将于二季度完成，我们认为这一时间表取决于省级能耗双控的审批。订单动能已连续两个季度减速，公司目前采用\"增速放缓\"的措辞。相较于出货口径的披露，我们更看重终端零售数据，并以独立的物流数据与第三方碳足迹核查结果对报告销量进行交叉验证。海外分销分为代理商网络与加盟模式两条线；在两家建材连锁获得的新增陈列位是实实在在的优势，而官网流量只是需求的一个弱代理指标。原材料涨价压力已推高安全库存。我们的供需平衡表指向 2028 年出现同质化；该行业的进入壁垒偏低。"}}];

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function rec(i) { var k = '' + i; if (!DB.p[k]) DB.p[k] = { pos: 0, read: false, cleared: false, rIdx: 0, next: '', lastRev: '', wrong: [] }; return DB.p[k]; }

/* ---------- 章节与词 ---------- */
function unit(i) { return DATA[i - 1]; }

/* 故事里的语境句 */

}

function step5(c, u) {
  c.appendChild(el('div', 'sub', '最后一步：这一章剧情里那份文件的英文原文。先裸读，读不懂再看中文对照。'));
  docBlock(c, u, false);
  var b = el('button', 'btn-primary', '读完了，收工');
  b.style.marginTop = '18px';
  b.onclick = function () { finishSeg(); };
  c.appendChild(b);
}

function finishSeg() {
  var u = unit(S.i), r = rec(S.i);
  r.pos = S.seg.to; r.read = true;
  var ws = Object.keys(S.wrong);
  r.wrong = (r.wrong || []).concat(ws).filter(function (v, i, a) { return a.indexOf(v) === i; });
  DB.plan.lastNewDate = today();
  if (DB.days.indexOf(today()) < 0) DB.days.push(today());
  if (r.pos >= total(u)) { r.cleared = true; if (!r.next) { r.rIdx = 0; r.next = addDays(today(), STEPS[0]); } }
  save();
  var root = $('#app'); root.innerHTML = '';
  var done = S;
  root.appendChild(topbar('第 ' + done.i + ' 章', function () { S = null; go({ name: 'home' }); }));
  var cc = el('div', 'card');
  cc.appendChild(el('h2', null, r.pos >= total(u) ? '第 ' + done.i + ' 章读完了 ✓' : '这一段完成 ✓'));
  cc.appendChild(el('div', 'sub', '本段 ' + done.body.length + ' 词，错过 ' + ws.length + ' 个' + (r.cleared && r.next ? '　·　' + r.next + ' 安排第一次复习' : '')));
  if (ws.length) {
    var wl = el('div', 'wlist');
    done.body.forEach(function (x) { if (done.wrong[x.w]) wl.appendChild(anyRow(x, true)); });
    cc.appendChild(wl);
  }
  var row = el('div', 'row wrap'); row.style.marginTop = '16px';
  var b = el('button', 'btn-primary', '回首页');
  b.onclick = function () { S = null; go({ name: 'home' }); };
  row.appendChild(b);
  if (segOf(done.i)) {
    var b2 = el('button', null, '接着背下一段');
    b2.onclick = function () { startLearn(done.i); };
    row.appendChild(b2);
  } else if (done.i < DATA.length) {
    var nx = done.i + 1, b3 = el('button', null, '看下一章');
    b3.onclick = function () { S = null; startLearn(nx); };
    row.appendChild(b3);
  }
  cc.appendChild(row);
  root.appendChild(cc);
}

/* ---------- 复习 ---------- */
var R = null;
function startReview(i) {
  var u = unit(i), all = words(u), r = rec(i);
  var pri = all.filter(function (x) { return (r.wrong || []).indexOf(x.w) >= 0; });
  var pick = pri.slice(0, REVIEW_SAMPLE);
  if (pick.length < REVIEW_SAMPLE) {
    var fin = all.filter(function (x) { return x.k === 'f' && pick.indexOf(x) < 0; });
    pick = pick.concat(sample(fin, Math.min(fin.length, REVIEW_SAMPLE - pick.length)));
  }
  if (pick.length < REVIEW_SAMPLE) {
    var rest = all.filter(function (x) { return pick.indexOf(x) < 0; });
    pick = pick.concat(sample(rest, Math.min(rest.length, REVIEW_SAMPLE - pick.length)));
  }
  var order = {}; all.forEach(function (x, k) { order[x.w] = k; });
  pick.sort(function (a, b) { return order[a.w] - order[b.w]; });
  R = { i: i, list: pick, k: 0, err: 0, shown: false, last: '', clean: true, wrong: {}, phase: 'w' };
  go({ name: 'review' });
}
function renderReview(root) {
  var u = unit(R.i);
  root.appendChild(topbar('复习 · 第 ' + R.i + ' 章', function () {
    if (confirm('退出复习？这次不算完成。')) { R = null; go({ name: 'home' }); }
  }));
  var c = el('div', 'card');
  if (R.phase === 'w') reviewWord(c, u); else reviewDone(c, u);
  root.appendChild(c);
}
function reviewWord(c, u) {
  if (R.k >= R.list.length) { R.phase = 'done'; render(); return; }
  var x = R.list[R.k];
  c.appendChild(el('div', 'sub', '抽查 ' + (R.k + 1) + ' / ' + R.list.length + '　·　' + u.ti));
  c.appendChild(el('div', 'quiz-t', x.t));
  if (x.k === 'f' && x.d) c.appendChild(el('div', 'mini2', x.d));
  if (R.err > 0 || R.shown) {
    var h = el('div', 'hint');
    h.innerHTML = R.shown ? '<b>' + esc(x.w) + '</b>' : maskHint(x.w, R.last);
    c.appendChild(h);
  }
  var inp = el('input'); inp.type = 'text'; inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.placeholder = '打出这个词';
  c.appendChild(inp);
  setTimeout(function () { inp.focus(); }, 30);
  function submit() {
    var v = inp.value.trim(); if (!v) return;
    if (wordOK(v, x.w)) { speak(x.w); R.k++; R.err = 0; R.shown = false; R.last = ''; render(); }
    else { R.err++; R.last = v; R.wrong[x.w] = 1; R.clean = false; if (R.err >= 3) R.shown = true; inp.value = ''; render(); }
  }
  inp.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  var row = el('div', 'row wrap'); row.style.marginTop = '12px';
  var ok = el('button', 'btn-primary', '确认'); ok.onclick = submit; row.appendChild(ok);
  var sa = el('button', 'btn-ghost btn-sm', '想不起来了，看答案');
  sa.onclick = function () { R.shown = true; R.clean = false; R.wrong[x.w] = 1; render(); };
  row.appendChild(sa);
  var cx = contextOf(R.i, x.w);
  if (cx) {
    var hb = el('button', 'btn-ghost btn-sm', '看故事里那一句');
    hb.onclick = function () { R.clean = false; var d = el('div', 'ctx'); d.innerHTML = ctxHTML(cx, x.w); c.appendChild(d); hb.disabled = true; };
    row.appendChild(hb);
  }
  c.appendChild(row);
}
function reviewDone(c, u) {
  var r = rec(R.i);
  r.lastRev = today();
  var oldIdx = r.rIdx;
  if (R.clean) r.rIdx = Math.min(r.rIdx + 1, STEPS.length - 1);
  r.next = addDays(today(), STEPS[r.rIdx]);
  r.wrong = Object.keys(R.wrong);
  if (DB.days.indexOf(today()) < 0) DB.days.push(today());
  save();
  c.appendChild(el('h2', null, R.clean ? '干净通过 ✓' : '这次有磕绊'));
  c.appendChild(el('div', 'sub', (R.clean ? '档位 ' + (oldIdx + 1) + ' → ' + (r.rIdx + 1) : '档位保持 ' + (r.rIdx + 1)) + '　·　下次复习 ' + r.next));
  if (r.wrong.length) c.appendChild(el('div', 'mini', '记下的：' + r.wrong.join('、') + '（下次优先抽这些）'));
  var row = el('div', 'row wrap'); row.style.marginTop = '16px';
  var b = el('button', 'btn-primary', '回首页');
  b.onclick = function () { R = null; go({ name: 'home' }); };
  row.appendChild(b);
  var i = R.i, b2 = el('button', null, '重读这一章');
  b2.onclick = function () { R = null; go({ name: 'read', i: i, from: 'home' }); };
  row.appendChild(b2);
  c.appendChild(row);
}

/* ---------- 设置 ---------- */
function renderSettings(root) {
  root.appendChild(topbar('设置与备份', function () { go({ name: 'home' }); }));
  var c = el('div', 'card');
  c.appendChild(el('h2', null, '只背金融术语'));
  var r0 = el('div', 'row');
  var cb0 = el('input'); cb0.type = 'checkbox'; cb0.checked = DB.plan.finOnly; cb0.id = 'fo';
  cb0.style.width = '18px'; cb0.style.height = '18px';
  var lb0 = el('label', 'sub', '跳过雅思词，一章只过金融术语，进度快一倍'); lb0.setAttribute('for', 'fo');
  r0.appendChild(cb0); r0.appendChild(lb0);
  c.appendChild(r0);

  var h1 = el('h2', null, '一章分几次做'); h1.style.marginTop = '20px'; c.appendChild(h1);
  c.appendChild(el('div', 'sub', '留空 = 一章一次做完（推荐）。填数字 = 每次只背这么多词。'));
  var r1 = el('div', 'row'); r1.style.marginTop = '10px';
  var n1 = el('input'); n1.type = 'number'; n1.min = '5'; n1.max = '60'; n1.value = DB.plan.perDay || ''; n1.placeholder = '整章';
  r1.appendChild(n1); r1.appendChild(el('span', 'sub', '词／次'));
  c.appendChild(r1);

  var h2 = el('h2', null, '只读到第几章'); h2.style.marginTop = '20px'; c.appendChild(h2);
  var r2 = el('div', 'row');
  var n2 = el('input'); n2.type = 'number'; n2.min = '0'; n2.max = '' + DATA.length; n2.value = DB.plan.unlockTo || ''; n2.placeholder = '不限';
  r2.appendChild(n2); r2.appendChild(el('span', 'sub', '留空 = 不限制'));
  c.appendChild(r2);

  var h3 = el('h2', null, '读故事时默认显示中文释义'); h3.style.marginTop = '20px'; c.appendChild(h3);
  var r3 = el('div', 'row');
  var cb = el('input'); cb.type = 'checkbox'; cb.checked = DB.plan.showGloss; cb.id = 'gl';
  cb.style.width = '18px'; cb.style.height = '18px';
  var lb = el('label', 'sub', '关掉就是纯裸读'); lb.setAttribute('for', 'gl');
  r3.appendChild(cb); r3.appendChild(lb);
  c.appendChild(r3);

  var sv = el('button', 'btn-primary', '保存设置'); sv.style.marginTop = '16px';
  sv.onclick = function () {
    var v = parseInt(n1.value, 10);
    DB.plan.perDay = (v >= 5 && v <= 60) ? v : 0;
    var uu = parseInt(n2.value, 10);
    DB.plan.unlockTo = (uu >= 1 && uu <= DATA.length) ? uu : 0;
    DB.plan.showGloss = !!cb.checked;
    DB.plan.finOnly = !!cb0.checked;
    save(); refresh(); toast('已保存');
  };
  c.appendChild(sv);
  root.appendChild(c);

  var c2 = el('div', 'card');
  c2.appendChild(el('h2', null, '备份进度'));
  c2.appendChild(el('div', 'sub', '进度只存在这台设备的浏览器里。以后换新版本（补足 100 章）时，用这里的备份把进度搬过去。'));
  var ta = el('textarea'); ta.id = 'bk'; c2.appendChild(ta);
  var row = el('div', 'row wrap'); row.style.marginTop = '10px';
  var dl = el('button', null, '下载 .json');
  dl.onclick = function () {
    var blob = new Blob([JSON.stringify(DB)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'fin-progress-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  row.appendChild(dl);
  var cp = el('button', null, '复制到剪贴板');
  cp.onclick = function () { ta.select(); try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，手动选中吧'); } };
  row.appendChild(cp);
  var rs = el('button', null, '粘贴恢复');
  rs.onclick = function () {
    try { var d = JSON.parse(ta.value); if (!d || !d.p) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); load(); refresh(); toast('已恢复'); }
    catch (e) { toast('这段内容读不出来'); }
  };
  row.appendChild(rs);
  var cl = el('button', null, '清空进度');
  cl.onclick = function () { if (!confirm('所有进度都会没有，确定？')) return; localStorage.removeItem(KEY); load(); refresh(); toast('已清空'); };
  row.appendChild(cl);
  c2.appendChild(row);
  root.appendChild(c2);
  refresh();
}
function refresh() { var t = $('#bk'); if (t) t.value = JSON.stringify(DB); }

/* ---------- 启动 ---------- */
load();
if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) { } }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();

window.__app = {
  DATA: DATA, get DB() { return DB; }, go: go, load: load, save: save, rec: rec, unit: unit,
  words: words, total: total, segOf: segOf, nextNew: nextNew, dueList: dueList, addDays: addDays,
  today: today, wordOK: wordOK, contextOf: contextOf, docHTML: docHTML, finTotal: finTotal,
  startLearn: startLearn, startReview: startReview, get S() { return S; }, get R() { return R; }
};
})();

</script>
</body>
</html>
