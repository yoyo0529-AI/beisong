只能证明这两页公告每个字都是真的。\"\n\n这才是最难受的。四个小时，我没找到一处违规。稳市代理每一笔都在{{statute}}（法规）允许范围内；超额配售的股份从控股股东借来，还躺在{{escrow}}（托管账户）里等着归还。交易所审的是上市{{fitness}}（适合性），不是动机。\n\n我翻开{{prospectus}}（招股说明书）的股权结构一章。{{cap table}}（股权结构表）上市前列了十一轮，最后三轮名字都陌生：一轮标着{{growth equity}}（成长期投资），一轮是三家机构合做的{{club deal}}（俱乐部交易）。\n\n招股书把它写成一家{{platform company}}（平台公司），要靠连续并购做大。{{roadshow}}（路演）上管理层也这么讲：已跟四家同业签了{{memorandum of understanding}}（谅解备忘录），两家进到{{letter of intent}}（意向书）阶段，其中一笔准备做成{{asset deal}}（资产交易）；还强调这些收购都不会是{{dilutive}}（摊薄每股收益的）。\n\n七年，一笔都没发生。\n\n还有一条我当年没在意：董事会是{{staggered board}}（分期分级董事会），分三批改选，一次股东大会最多换三分之一。写在\"企业管治\"章里，读着像保护小股东。\n\n我把这些碎{{fragment}}（片段）{{knit}}（编织）起来，{{integrate}}（整合）成一个说得通的故事：一家公司在上市那几天被人用真金白银顶住开盘价，从此有了\"从不破发\"的名声，这名声替它省掉七年解释。\n\n麻烦的是，\"顶住开盘价\"在法律的{{domain}}（领域）里没有名字。不叫操纵，因为没有对倒；不叫稳市，因为不是稳市代理干的。它就叫——买入。\n\n念书时老师说，市场的{{equity}}（公平）不靠善意，靠信息对称。这话现在听着像笑话。\n\n我做了个很{{marginal}}（边缘的）动作：给那家私人银行的合规部发邮件，问七年前那批订单的最终受益人。当然没有回音。\n\nIvy 提醒我提防{{cognitive}}（认知的）偏差，说我看什么都像证据。所以我把标准定死：只认能在公开文件里{{namely}}（即）指名道姓查到的东西。\n\n十一点，只剩最后一件事——把股权结构表往上追。不是往下追股东，是往上追股东的股东。\n\n第一层，香港公司。第二层，BVI。第三层，还是 BVI。\n\n放零食的{{container}}（贮存箱）旁边，Danny 趴在桌上睡着了，{{lap}}（膝盖）上摊着他打印的公告。我忽然有种很不{{sacred}}（神圣的）的感觉：我以为我在做研究，其实我在挖坟。\n\n追到第七层，链条停了。\n\n停在一个很长的名字上，后面跟着两个词：Discretionary Trust。","ft":[{"w":"asset deal","z":"资产交易","d":"只买资产不买股权，可以把历史负债留在原公司","a":"","p":""},{"w":"cap table","z":"股权结构表","d":"逐轮记录谁持有多少股、什么价格进来的表格","a":"","p":""},{"w":"club deal","z":"俱乐部交易","d":"多家PE联手完成单笔过大的收购","a":"","p":""},{"w":"dilutive","z":"摊薄每股收益的","d":"收购后每股收益下降，通常需要额外理由说服股东","a":"","p":"dai'lju:tiv"},{"w":"escrow","z":"托管账户","d":"部分对价先存在第三方账户，约定条件满足后再释放给卖方","a":"","p":"'eskrәu"},{"w":"growth equity","z":"成长期投资","d":"介于VC和并购之间，投已验证商业模式但仍需扩张的公司","a":"","p":""},{"w":"letter of intent","z":"意向书","d":"交易双方就主要条款达成的初步文件，多数条款不具约束力","a":"LOI","p":""},{"w":"memorandum of understanding","z":"谅解备忘录","d":"比意向书更松散的合作意向文件，常见于跨境交易早期","a":"MOU","p":""},{"w":"platform company","z":"平台公司","d":"PE用来承接后续一系列并购的第一家核心标的","a":"","p":""},{"w":"prospectus","z":"招股说明书","d":"发行时的法定披露文件，风险因素那一节最值得读","a":"","p":"prәs'pektәs"},{"w":"roadshow","z":"路演","d":"管理层向机构投资者巡回推介，为发行争取订单","a":"","p":"ˈrəʊdʃəʊ"},{"w":"staggered board","z":"分期分级董事会","d":"董事分批改选，收购方一次股东大会换不掉整个董事会","a":"","p":""},{"w":"underwriter","z":"承销商","d":"负责发行、定价、销售股票的投行","a":"","p":"'ʌndә.raitә"}],"iw":[{"w":"pie","p":"pai","t":"n. 馅饼, 财富, 总额, 贪污受贿, 杂乱, 喜鹊; 饼图"},{"w":"induce","p":"in'dju:s","t":"vt. 引诱, 招致, 归纳出, 感应; 诱导, 感应"},{"w":"clue","p":"klu:","t":"n. 线索, 暗示; vt. 暗示, 提供线索"},{"w":"slice","p":"slais","t":"n. 薄的切片, 一部分, 菜刀; vt. 切成薄片, 切下; vi. 切; 片"},{"w":"underlying","p":".ʌndә'laiiŋ","t":"a. 在下面的; 优先的, 基础的, 放在下面的"},{"w":"sacred","p":"'seikrid","t":"a. 神圣的, 献给上帝的, 庄严的, 祭祀的; 神圣的, 不可侵犯的"},{"w":"lamp","p":"læmp","t":"n. 灯; vt. 照亮; 逻辑模拟分析系统"},{"w":"cognitive","p":"'kɒgnitiv","t":"a. 认知的, 认识的"},{"w":"domain","p":"dәu'mein","t":"n. 领域, 领土, 产业, 范围; 域, 区域, 支配命令"},{"w":"namely","p":"'neimli","t":"adv. 即, 就是, 换句话说"},{"w":"knit","p":"nit","t":"v. 编织, 结合"},{"w":"integrate","p":"'intigreit","t":"vt. 综合, 使完整, 使成整体; vi. 成一体; a. 完整的, 完全的"},{"w":"fragment","p":"'frægmәnt","t":"n. 碎片, 破片, 片段; 段落; 片段; 分段"},{"w":"equity","p":"'ekwiti","t":"n. 公平, 公正; 权益, 产权"},{"w":"fitness","p":"'fitnis","t":"n. 适合, 合宜, 合理, 恰当, 健康; 适合性, 适应性"},{"w":"grave","p":"greiv","t":"n. 墓穴, 坟墓, 终结, 死亡; a. 庄重的, 严肃的, 重大的, 低沉的; vt. 雕刻"},{"w":"statute","p":"'stætju:t","t":"n. 法令, 成文法律, 法规, 章程, 条例; 法令, 法规, 成文法"},{"w":"lap","p":"læp","t":"n. 膝盖, 舔, 一圈, 下摆, 衣兜, 山坳; vi. 重叠, 围住, 轻拍, 舔; vt. 包围, 抱...在膝上, 使重叠, 舔, 拍打, 泼溅; 链接访问程序"},{"w":"container","p":"kәn'teinә","t":"n. 容器, 集装箱; 集装箱; 贮存箱; 容器(任何一种)"},{"w":"marginal","p":"'mɑ:dʒinәl","t":"a. 边缘的, 最低限度的, 有旁注的; 缘的"}],"doc":{"k":"稳定价格行动公告","en":"STABILISING ACTION ANNOUNCEMENT. The underwriter, acting as stabilising manager, announces that stabilising transactions were effected during the stabilisation period described in the prospectus. All such purchases were made at prices not exceeding the offer price. The over-allotted shares were borrowed from the controlling shareholder and are held in escrow pending return. No dilutive issue of new shares was made during the period, and the cap table set out in the prospectus remains unchanged. Statements made during the roadshow concerning the Company's strategy as a platform company for further acquisitions, and concerning the growth equity investment completed prior to listing, should be read together with this announcement. The staggered board of the Company has been informed of the foregoing.","zh":"稳定价格行动公告。担任稳定价格操作人的承销商宣布，于招股说明书所述稳定价格期内已进行若干项稳定价格交易。所有该等购入均以不高于发售价的价格进行。超额配售的股份系向控股股东借入，现存放于托管账户内待返还。期内并无发行任何摊薄每股收益的新股，招股说明书所载的股权结构表亦维持不变。管理层于路演期间就本公司作为后续并购平台公司的战略所作陈述，以及就上市前已完成的成长期投资所作陈述，应与本公告一并阅读。本公司的分期分级董事会已获知会上述事项。"}},{"i":69,"ti":"第七层是一个信托","dom":"deal","sc":"VIE 与红筹","tx":"链条停在第七层的时候，是凌晨一点十分。\n\n我把七层画在一张 A3 纸上，从下往上：第一层，江西那家真有厂房、有工人、有电表的公司。第二层，一组协议——控制权不靠股权靠合同，教科书上管这个叫{{variable interest entity}}（可变利益实体）。第三层，一家外商独资企业。第四层，香港。第五层，BVI。第六层，开曼上市主体上面还压着一家 BVI。第七层，一个信托，注册在一个我要查地图才知道在哪的岛上，受益人写着\"一类可自由裁量的受益人\"。\n\n我在右下角画了个方框做{{legend}}（图例）。这图像小时候自然课的标本盒：一只{{insect}}（昆虫）被别针钉住，翅膀一层层展开，你看得见每一根脉络，就是碰不到那只虫子本身。\n\n这结构不违法。红筹加协议控制是一整代中概股的{{norm}}（准则），律师意见书一份不少。\n\n问题是，从第一层到第七层，每层都有人签字，但没有任何一层上，我能指着一个人说：钱是他的。\n\n我给纽约发了邮件。Elena 回得很快，只有一句：Whose signature is on the trust deed?\n\n我说信托契约不公开。她回：Then that is the question.\n\n周六我去老周家。客厅那张{{couch}}（长沙发）用了二十年。我把纸摊在茶几上，他戴上眼镜从下往上摸了一遍，中间{{murmur}}（低声嘟囔）了两句我没听清的话。\n\n\"这结构本身是{{superb}}（极好的）的，\"他说，\"设计的人很懂。\"\n\n\"懂什么？\"\n\n\"懂每一条线在哪里停。\"他用铅笔在第五层和第六层之间点了一下，\"从这儿往上，香港看不到；往下，内地{{regulate}}（管理）得到，但盯的是运营公司，看不见上面。中间这一段，谁都不算失职。\"\n\n我问顶上那个信托呢。\n\n\"信托本来是好东西，是给家族养孩子的{{nursery}}（苗圃）。\"他说，\"同一个工具，也能拿来当{{trap}}（陷阱）的盖板——你看得见坑，看不见谁挖的。\"\n\n{{sheer}}（纯粹的）体量也吓人。那个信托间接握着的那块，占了上市主体股份的{{bulk}}（大部分），七年里只{{decrease}}（减少）过一次。中间层公司换过三次名字、两次地址，{{grip}}（控制）一次都没松过，任何改动都没{{upset}}（打乱）过最上面那一层。这设计最厉害的地方在于，它能{{accommodate}}（容纳）任意数量的新股东进来，而完全不惊动第七层。\n\n我又问：如果有人想从外面动它呢。\n\n他笑了。\"动不了。章程里根本不用写{{poison pill}}（毒丸计划），这七层本身就是毒丸。你想打{{proxy fight}}（委托书争夺战），投票权在第七层，你征集不到；想走{{scheme of arrangement}}（协议安排）私有化，会撞上{{head count test}}（人数测试），十个人反对就卡住你；想收购，对方会先请你签{{standstill agreement}}（停止增持协议），签完三年动不了。\"\n\n\"那 2018 年那家买方是怎么进来的？\"\n\n\"卖方一开始想走{{auction process}}（竞价流程），只来了两家，后来干脆给了其中一家{{exclusivity}}（排他期）。那家想做{{leveraged buyout}}（杠杆收购），投行的{{mergers and acquisitions}}（并购）团队都进场了，尽调到一半人跑了。\"\n\n他递给我一份纸边发黄的基金年度报告，那家买方的顾问留下的。第七层信托下面挂的正是这只基金：{{committed capital}}（认缴资本）四亿美元，七年只发过两次{{capital call}}（资本催缴），{{distributions to paid-in}}（已分配倍数）却写着 2.4。\n\n\"钱没怎么进去，分出来的倒不少。\"\n\n我把纸弄得一团{{mess}}（乱七八糟）：这家律所是它{{exclusive}}（独家的）的顾问，从上市到现在没换过；每年上市{{anniversary}}（周年纪念）都发一篇很热闹的稿，配同一张剪彩照片，像一年一次的{{ritual}}（仪式）。\n\n送我下楼时老周说，他这辈子只学会一件事：有些事你{{forgive}}（原谅）不了自己，第二天还得接着干活。\n\n地铁上我一直想那三个数字：四亿认缴，两次催缴，2.4 倍分配。只有一种解释——这只基金真正赚钱的地方不在被投企业。\n\n第二天早上我调出上市前最后一轮的入股日期和退出日期。\n\n进来到出去，九十四天。","ft":[{"w":"auction process","z":"竞价流程","d":"卖方组织多轮报价择优成交，通常能卖出更高价","a":"","p":""},{"w":"capital call","z":"资本催缴","d":"GP通知LP按承诺出资额实际打款","a":"","p":""},{"w":"committed capital","z":"认缴资本","d":"LP承诺投入基金的总额，未必已经实际到账","a":"","p":""},{"w":"distributions to paid-in","z":"已分配倍数","d":"已真金白银分给LP的钱与实缴资本之比，比IRR更硬","a":"DPI","p":""},{"w":"exclusivity","z":"排他期","d":"卖方承诺一段时间内不与其他买家谈判的安排","a":"","p":",eksklu:'siviti"},{"w":"head count test","z":"人数测试","d":"港股协议安排私有化中反对票人数不得超过10%的规则","a":"","p":""},{"w":"leveraged buyout","z":"杠杆收购","d":"主要靠举债收购一家公司，再用标的自身现金流还债","a":"LBO","p":"ˈlevərɪdʒd, ˈli:vərɪdʒd"},{"w":"mergers and acquisitions","z":"并购","d":"企业间的合并与收购活动的统称，投行最核心的业务线之一","a":"M&A","p":""},{"w":"poison pill","z":"毒丸计划","d":"触发后让新股大量增发稀释收购方的反收购条款","a":"","p":"ˈpɔizən pil"},{"w":"proxy fight","z":"委托书争夺战","d":"收购方或维权股东征集投票权，在股东大会上直接对决","a":"","p":"ˈprɔksi: fait"},{"w":"scheme of arrangement","z":"协议安排","d":"经法院批准的私有化路径，通过后可强制少数股东出让","a":"","p":""},{"w":"standstill agreement","z":"停止增持协议","d":"约定一方在一定期限内不再增持或发起收购","a":"","p":""},{"w":"variable interest entity","z":"可变利益实体","d":"通过协议而非股权控制境内公司的结构，中概股经典安排","a":"VIE","p":""}],"iw":[{"w":"murmur","p":"'mә:mә","t":"n. 低语, 低声的怨言; vi. 低语, 低声而言; vt. 低声说"},{"w":"sheer","p":"ʃiә","t":"a. 绝对的, 全然的, 纯粹的, 透明的, 峻峭的; vi. 偏转, 偏航; vt. 使急转向, 使偏航; adv. 完全, 全然, 峻峭; n. 偏航"},{"w":"bulk","p":"bʌlk","t":"n. 大小, 体积, 大块, 大多数; vt. 显得大, 显得重要"},{"w":"decrease","p":"'di:kri:s","t":"n. 减少, 减少量; v. 减少"},{"w":"trap","p":"træp","t":"n. 圈套, 陷阱, 诡计, 存水弯; vi. 设圈套, 设陷阱; vt. 诱捕, 诱骗, 抓住, 使受限制; 俘获; 陷井"},{"w":"anniversary","p":"æni'vә:sәri","t":"n. 周年纪念"},{"w":"couch","p":"kautʃ","t":"n. 长沙发, 睡椅, 卧榻; vt. 横躺, 表达; vi. 躺下, 蹲伏"},{"w":"grip","p":"grip","t":"n. 紧握, 柄, 握力, 握手方式, 手提包, 掌握, 支配, 控制; vt. 抓紧, 抱住, 吸住, 掌握; vi. 握牢, 有吸引力"},{"w":"exclusive","p":"ik'sklu:siv","t":"a. 排外的, 独占的, 唯一的; 独占的"},{"w":"mess","p":"mes","t":"n. 食堂, 伙食, 用膳, 一份食品, 混乱, 乱七八糟, 困境; vt. 将...弄糟, 妨碍, 使紊乱, 使就餐; vi. 陷入困境, 搞乱, 用膳"},{"w":"legend","p":"'ledʒәnd","t":"n. 传说, 传奇文学, 图例; 图例"},{"w":"nursery","p":"'nә:sәri","t":"n. 托儿所, 苗圃, 温床; 婴儿室, 托儿所"},{"w":"regulate","p":"'regjuleit","t":"vt. 管理, 控制, 调节, 调整, 校准; 控制, 管理"},{"w":"superb","p":"sju'pә:b","t":"a. 极度的, 华丽的, 极好的"},{"w":"norm","p":"nɒ:m","t":"n. 基准, 模范, 标准, 准则, 平均数; 定额"},{"w":"upset","p":"ʌp'set","t":"a. 弄翻的, 混乱的, 心烦的; vt. 弄翻, 颠覆, 推翻, 打乱, 使不适, 使心烦; vi. 翻倒"},{"w":"forgive","p":"fә'giv","t":"vt. 原谅, 宽恕, 免除; 免除, 宽恕, 原谅"},{"w":"accommodate","p":"ә'kɒmәdeit","t":"vt. 使适应, 调和, 通融, 容纳, 向...提供; vi. 适应"},{"w":"ritual","p":"'ritʃuәl","t":"n. 仪式, 典礼, 宗教仪式; a. 仪式的, 依仪式进行的"},{"w":"insect","p":"'insekt","t":"n. 昆虫, 卑鄙的人; 昆虫"}],"doc":{"k":"招股章程「股权结构」披露段","en":"SHAREHOLDING STRUCTURE. The Group conducts its principal operations in the PRC through a variable interest entity controlled by contractual arrangements rather than by direct equity ownership. The ultimate holding vehicle is held by a discretionary trust established outside the PRC. The Articles do not contain any poison pill or similar defensive mechanism, and no standstill agreement has been entered into with any shareholder. Any proposal to privatise the Company would be implemented by way of a scheme of arrangement and would be subject to the head count test. The Directors confirm that no auction process, leveraged buyout proposal or other mergers and acquisitions discussion is ongoing, and that no exclusivity has been granted to any party.","zh":"股权结构。本集团于中国境内的主要业务，是透过一家以协议安排而非直接股权持有方式控制的可变利益实体经营。最终控股主体由一项设立于中国境外的全权信托持有。公司章程并未载有任何毒丸计划或类似反收购机制，本公司亦未与任何股东订立停止增持协议。任何将本公司私有化的建议，均须以协议安排方式实施，并须符合人数测试的规定。董事确认，目前并无正在进行的竞价流程、杠杆收购建议或其他并购磋商，亦未向任何一方授予排他期。"}},{"i":70,"ti":"九十四天","dom":"deal","sc":"私募股权与退出","tx":"进来和出去之间，隔了九十四天。\n\n我把日期抄在便利贴上贴在屏幕边框，然后一份一份{{hunt}}（搜寻）文件。三天，别的什么都没干。\n\n上市前四个月，最后一轮进来一家叫 Ashgrove 的基金，一亿两千万美元。招股书那一段写得很漂亮，说它是\"极为{{desirable}}（可取的）的战略投资者\"，理由是\"补充营运资金以应对上游原材料{{shortage}}（短缺）\"。上市后三个月，它全部走人。\n\n按常理这不可能。上市前六个月内入股的投资者要锁十二个月，白纸黑字。可它一天都没被锁到。\n\n原因很干净：它买的从来不是上市主体的股份，是第六层那家 BVI 的股权——文件里管它叫\"{{superior}}（上级的）持股主体\"。锁定期约束的是上市主体的股份持有人，而它持的是持有人的股东。规则一个字没违反，因为规则压根没写到那一层。\n\n九十四天，本金一亿二，退出拿回三亿七。{{multiple on invested capital}}（投资本金倍数）3.1 倍，{{holding period}}（持有期）三个月。年化是个我不好意思写进模型的数——{{compound}}（复合的）口径下那条曲线直接{{leap}}（剧增）成一条竖线。\n\n这不是投资，这是{{magic}}（魔术）。\n\n我把{{exit}}（退出）的过程一条条排出来，越排越安静。\n\n卖方先自己做了一份{{vendor due diligence}}（卖方尽调）报告，四家意向买家共用；投行还配了一套{{staple financing}}（卖方备好的收购融资），谁都能拿。最后只有一家提交{{binding offer}}（有约束力报价）。{{conditions precedent}}（先决条件）全部在同一天满足，同一天交割，甚至没触发任何{{purchase price adjustment}}（价格调整机制）——净债务和营运资本一分钱都不用调。\n\n我从没见过一笔交易的价格调整是零。它干净得像{{surgeon}}（外科医生）的刀口。\n\n买方是一家开曼基金，往上穿两层，最终的{{limited partner}}（有限合伙人）名单里有一只 feeder。那个名字我在基石名单最后一栏见过。像{{echo}}（回声）一样，Halberd 又回来了。\n\n我把这一整套摊在会议室桌上给 Ray 看。他穿着周末的{{jeans}}（牛仔裤），看了十分钟没说话。\n\n\"你知道这里面最难的是什么吗，\"他最后说，\"不是找出他们赚了多少。是解释他们为什么要这么麻烦。\"\n\n\"因为要有人在上市前把估值{{initiate}}（发起）上去。\"我说，\"最后一轮的价格比前一轮高一大截，保荐人才有底气把发行价定在那个位置。这一轮不是来投资的，是来给发行价当垫脚石的。三个月后垫脚石撤走，筹码交到指定的人手里。\"\n\n\"{{carried interest}}（业绩分成）呢？\"\n\n\"当年就分掉了。\"我说，\"GP 那一年的业绩报酬按 3.1 倍算，钱早就到账了。\"\n\nRay 站起来走到窗边。\"所以这不是一次{{raid}}（突袭）。\"\n\n\"不是。这是一件{{sculpture}}（雕塑）。\"我说，\"每一刀都提前想好了。\"\n\n我们的{{counsel}}（法律顾问）下午来了一趟。他一页一页翻完，说了一句很职业的话：从香港法的角度，他找不到可以起诉的点。\n\n我说我知道。我跟自己{{combat}}（斗争）了两个晚上才接受一件事：没有任何一条现成规则能{{stem}}（阻止）它发生。规则约束的是上市主体，而这套结构的动作全在上市主体的上游。\n\n\"每一份文件都像{{crystal}}（水晶）一样透明，\"我跟 Ray 说，\"你能看穿它，就是拿不住它。\"\n\n\"这才是最{{undermine}}（破坏）人的地方。\"他说。\n\n有件事我一直没想通，直到那天晚上：这只基金后来没再募新的，GP 团队第二年就散了。它从头到尾只做过这一笔像样的{{exit}}（退出），没做过任何{{divestiture}}（资产出售；剥离），也没做过任何{{post-merger integration}}（并购后整合）——它本来就不打算持有任何东西。它不是一家 PE，它是一个动作。\n\n一个{{fleet}}（快速的）、干净、三个月完事的动作。\n\n我把整个过程记进研究{{log}}（记录），最后一行写着：Ashgrove 已注销，注销日期在公司披露拟做{{secondary listing}}（第二上市）的两周前。\n\n我盯着这一行看了很久。\n\n然后我打开当年那份 pre-IPO 的投资协议附件目录，第七项写着四个字：业绩承诺。","ft":[{"w":"binding offer","z":"有约束力报价","d":"完成尽调后提交的正式报价，中标即须签约","a":"","p":""},{"w":"carried interest","z":"业绩分成；carry","d":"GP在超过门槛收益后分走的那部分利润，通常20%","a":"","p":""},{"w":"conditions precedent","z":"先决条件","d":"交割前必须全部满足的条件，如反垄断审批、股东会通过","a":"CP","p":""},{"w":"divestiture","z":"资产出售；剥离","d":"卖掉非核心业务回笼资金或满足监管要求","a":"","p":"dai'vestitʃә"},{"w":"exit","z":"退出","d":"通过上市、并购或转让把投资变现，PE的最终目的","a":"","p":"'eksit"},{"w":"holding period","z":"持有期","d":"从投资到退出的时间跨度，PE通常三到七年","a":"","p":""},{"w":"limited partner","z":"有限合伙人","d":"出钱不管事的基金投资人，以出资额为限承担责任","a":"LP","p":""},{"w":"multiple on invested capital","z":"投资本金倍数","d":"回收金额除以投入本金，不考虑时间因素的粗口径","a":"MOIC","p":""},{"w":"post-merger integration","z":"并购后整合","d":"交割后把两家公司的人、系统、业务真正合到一起","a":"PMI","p":""},{"w":"purchase price adjustment","z":"价格调整机制","d":"按交割日实际净债务和营运资本对成交价作事后微调","a":"","p":""},{"w":"secondary listing","z":"第二上市","d":"已在别处上市的公司再到另一交易所挂牌，中概股回港常用","a":"","p":""},{"w":"staple financing","z":"卖方备好的收购融资","d":"卖方投行预先安排好、任何买家都可用的收购贷款包","a":"","p":""},{"w":"vendor due diligence","z":"卖方尽调","d":"卖方先自己做一份尽调报告供所有潜在买家参考","a":"VDD","p":""}],"iw":[{"w":"shortage","p":"'ʃɒ:tidʒ","t":"n. 不足, 缺乏; 缺额"},{"w":"desirable","p":"di'zairәbl","t":"a. 令人想望的, 可取的"},{"w":"undermine","p":".ʌndә'main","t":"vt. 在...下面挖, 渐渐破坏, 暗地里破坏; 暗中破坏, 以阴谋中伤伤害"},{"w":"superior","p":"sju:'piәriә","t":"n. 长者, 占优势的人, 上级; a. 上级的, 出众的, 高傲的"},{"w":"magic","p":"'mædʒik","t":"n. 魔术, 魔法; a. 魔术的, 有魔力的, 不可思议的"},{"w":"combat","p":"'kɒmbæt","t":"n. 争斗, 战斗; vi. 战斗, 争斗; vt. 与...战斗, 与...斗争"},{"w":"surgeon","p":"'sә:dʒәn","t":"n. 外科医生, 军医, 船医; 外科医师"},{"w":"stem","p":"stem","t":"n. 茎, 干, 柄, 船首, 血统, 堵塞物; vt. 摘掉茎, 装柄于, 阻止, 堵住, 逆行; vi. 堵住, 逆行"},{"w":"fleet","p":"fli:t","t":"n. 舰队, 港湾, 小河; a. 快速的, 敏捷的, 浅的, 短暂的; adv. 浅; vi. 疾驰, 飞逝, 掠过; vt. 消磨, 变换船(或船员)的位置"},{"w":"counsel","p":"'kaunsәl","t":"n. 商议, 忠告, 法律顾问; v. 商议, 劝告"},{"w":"crystal","p":"'kristl","t":"n. 水晶, 水晶装饰品, 结晶; a. 水晶的, 水晶一样的, 透明的"},{"w":"hunt","p":"hʌnt","t":"n. 狩猎, 追捕, 搜寻, 猎区; vt. 狩猎, 打猎, 搜索; vi. 打猎, 猎食, 搜寻"},{"w":"jeans","p":"dʒi:nz","t":"n. 工装裤, 牛仔裤"},{"w":"initiate","p":"i'niʃieit","t":"n. 入会, 开始; a. 新加入的; vt. 开始, 传授基本知识给"},{"w":"log","p":"lɒg","t":"n. 记录, 圆木, 日志, 计程仪; vt. 伐木, 切, 航行; vi. 伐木; 日志"},{"w":"echo","p":"'ekәu","t":"n. 回声, 回音, 回波; vi. 发回声, 随声附和; vt. 摹仿, 重复, 反射; 回显; DOS批处理命令:控制MS-DOS命令是否在屏幕上显示"},{"w":"leap","p":"li:p","t":"n. 跳跃, 剧增, 急变, 被越过之物; vi. 跳跃, 突然经过; vt. 跃过, 使跃过"},{"w":"sculpture","p":"'skʌlptʃә","t":"n. 雕刻, 雕塑; vt. 雕刻, 雕塑; vi. 当雕刻师"},{"w":"compound","p":"kәm'paund","t":"n. 混合物, 复合词, 化合物, 院子; a. 复合的, 混合的, 化合的; vi. 化合, 和解, 妥协; vt. 使复合, 使化合"},{"w":"raid","p":"reid","t":"n. 袭击, 突袭, 搜捕; v. 奇袭, 搜捕; 廉价磁盘冗余阵列"}],"doc":{"k":"股东权益变动披露公告","en":"DISCLOSURE OF INTERESTS. The Company has been notified that the pre-IPO investor has completed the exit of its entire indirect holding, following a holding period of approximately three months from the date of listing. The disposal was effected pursuant to a binding offer submitted after the purchaser had reviewed the vendor due diligence report, with staple financing arranged by the seller's bank. All conditions precedent were satisfied on the date of transfer and no purchase price adjustment was required. The general partner has advised its limited partner base that the transaction produced a multiple on invested capital of 3.1 times. The Company confirms that the disposal does not constitute a divestiture of any business and does not affect its proposed secondary listing.","zh":"股东权益变动披露公告。本公司获知会，上市前投资者已完成其全部间接持股的退出，自上市之日起计，其持有期约为三个月。该项出售系根据买方查阅卖方尽调报告后提交的有约束力报价而完成，收购融资由卖方银行预先安排的融资包提供。所有先决条件已于转让当日全部满足，且无需作出任何价格调整。普通合伙人已知会其有限合伙人，该笔交易实现的投资本金倍数为 3.1 倍。本公司确认，该项出售不构成任何业务的资产出售或剥离，亦不影响本公司拟进行的第二上市。"}},{"i":71,"ti":"承诺的数字","dom":"deal","sc":"对赌与业绩承诺","tx":"老周把那本蓝皮的融资协议推过来的时候，已经过了{{midnight}}（午夜）。\n\n这栋楼是{{colony}}（殖民地）时期留下来的，楼道窄，灯昏黄。楼下面包房开始揉面，风一灌进来全是{{flour}}（面粉）的味道。我们挤在一间勉强算{{closet}}（小储藏间）的资料室里，六个小时没挪过窝。\n\n上市前最后一轮进来的那笔钱，三个月就走了，走的路子是{{secondary sale}}（老股转让）——不增发新股，只把手上的老股卖给下一个接盘的人。我原先以为那是精明。今晚我改主意了，那是跑。\n\n蓝皮本子记的是更早的一轮，2016 年。领投的是一家做{{venture capital}}（风险投资）的机构，条款清单印得很讲究，右下角的编号后来被{{sponsor}}（保荐人）在招股书里引用过。第一页写着{{post-money valuation}}（投后估值）：四十二亿。\n\n老周不{{drinking}}（喝酒），泡了杯浓茶，用笔尖敲第九条。\n\n第九条叫\"业绩承诺\"，措辞是那种{{harsh}}（苛刻的）风格：2017 到 2019 三年，扣非净利润分别不低于 3.1 亿、5.8 亿、9.4 亿。做不到，三件事同时发生——估值按公式重算，构成一次{{down round}}（降价轮）；优先股启动{{liquidation preference}}（优先清算权），按两倍本金先走；创始人个人拿现金补足差额。\n\n\"这不是投资，\"老周说，\"这是把人押上去。\"\n\n条款的{{specification}}（详细说明）在附件三，密密麻麻六页。里面还有一条{{no-shop clause}}（禁止招标条款）：签约起十八个月内，公司不得接触任何{{strategic buyer}}（战略买家），也不得为任何股权出售聘请顾问出具{{fairness opinion}}（公平意见书）。另有一条防着{{hostile takeover}}（敌意收购）——任何绕开董事会直接向股东出的价，视同违约。\n\n门被锁死了，只剩一条路：把利润做出来。\n\n我把三个承诺数抄在纸上，回办公室调出那张虚增表。\n\n那是我做了七个月的东西：按季度、按客户、按产品，把我们认为不成立的收入和利润一条条剔出来。\n\n三个数对上了。不是接近，是对上。差额在小数点后第二位。\n\n我坐在那儿，手指发凉。这件事的{{essence}}（本质）忽然翻了个面：他们不是贪。他们是被合同逼的。\n\n2016 年签下那张纸的时候，我猜他们是真心想{{comply}}（照做、遵守）的。可技术路线没走通，产能爬不起来，第二年就缺一大截。于是先在体系内做一笔{{connected transaction}}（关连交易），把货压过去，把利润补齐；第三年缺口更大，就买一家小厂做{{bolt-on acquisition}}（补强收购），把并表利润算进承诺口径；第四年干脆把一块设备资产做{{carve-out}}（分拆剥离），确认一笔处置收益。\n\n每一步，都是为了把那个数字{{pump}}（打气、撑）上去。\n\n后来它以{{red chip}}（红筹股）架构在香港挂牌，路演材料上印着\"技术壁垒近乎{{monopoly}}（垄断）\"。会议室那面墙挂了一排{{medal}}（奖牌），最上面那块是省级科技进步奖。壳公司的旧业务是{{hardware}}（五金件）{{retail}}（零售），玩具和螺丝，如今只剩一个注册地址。\n\n天快亮时我陪老周走回去。他家楼下有座小{{temple}}（庙宇），香灰味压过海风。\n\n\"当年做那些{{oral}}（口头的）承诺的人，多半以为差一年，补一年就过去了。\"他说，\"差别很{{subtle}}（微妙的）：第一年是补，第二年是编，第三年是不得不编下去。\"\n\n\"这是{{integrity}}（正直）的问题吗？\"\n\n\"是算术的问题。\"他停下来，\"算术一旦开始骗人，正直就不重要了。\"\n\n回到办公室，我把蓝皮本子{{slam}}（砰地）合上。\n\n然后我意识到一件更麻烦的事：如果虚增的部分正好等于承诺的部分，那我该重新算的就不是造假规模，而是这家公司剥掉承诺之后，到底还剩下什么。\n\n我打开模型，决定把每一块业务拆到最小。","ft":[{"w":"bolt-on acquisition","z":"补强收购","d":"围绕平台公司做的小型收购，用来快速扩规模摊薄估值","a":"","p":""},{"w":"carve-out","z":"分拆剥离","d":"把一块业务从母公司独立出来单独出售或上市","a":"","p":"'kɑ:v'aʊt"},{"w":"connected transaction","z":"关连交易","d":"与大股东或其关联方的交易，港股需独立股东批准","a":"","p":""},{"w":"down round","z":"降价轮","d":"估值低于上一轮的融资，会触发反稀释并打击士气","a":"","p":""},{"w":"fairness opinion","z":"公平意见书","d":"独立财务顾问就交易对价是否公允出具的意见","a":"","p":""},{"w":"hostile takeover","z":"敌意收购","d":"绕开目标公司董事会直接向股东出价，管理层反对的收购","a":"","p":"ˈhɔstail ˈteɪkˌəʊvə"},{"w":"liquidation preference","z":"优先清算权","d":"退出时优先股先按约定倍数拿回本金再谈分配","a":"","p":""},{"w":"no-shop clause","z":"禁止招标条款","d":"签约后禁止卖方再去兜售自己或接触其他买家","a":"","p":""},{"w":"post-money valuation","z":"投后估值","d":"投前估值加本轮融资额，媒体报道的通常是这个","a":"","p":""},{"w":"red chip","z":"红筹股","d":"境外注册但主要业务和控制权在内地的香港上市公司","a":"","p":""},{"w":"secondary sale","z":"老股转让","d":"把已持有的股权转让给另一投资人，不新增公司资本","a":"","p":""},{"w":"strategic buyer","z":"战略买家；产业买家","d":"同行业买家，能算协同所以通常出价高于财务投资人","a":"","p":""},{"w":"venture capital","z":"风险投资；创投","d":"投早期高成长公司，靠少数几个大赢家覆盖整体亏损","a":"VC","p":"ˈventʃə ˈkæpitl"}],"iw":[{"w":"flour","p":"'flauә","t":"n. 面粉, 粉沫, 碎粉; 面粉, 麦粉"},{"w":"hardware","p":"'hɑ:dwєә","t":"n. 硬件, 五金器具, 零件; 硬件"},{"w":"subtle","p":"'sʌtl","t":"a. 敏锐的, 精细的, 狡猾的, 稀薄的, 灵巧的, 微妙的; 锐敏的; 精细的"},{"w":"drinking","p":"'driŋkiŋ","t":"n. 喝, 喝酒"},{"w":"comply","p":"kәm'plai","t":"vi. 顺从, 依从; 遵守, 承诺, 照做"},{"w":"colony","p":"'kɒlәni","t":"n. 殖民地, 移民队; 菌(集)落, 菌丛; 移民区"},{"w":"pump","p":"pʌmp","t":"n. 抽水机, 打气筒, 泵, 抽吸; vt. 用唧筒抽水, 打气, 盘问, 倾注, 使疲惫; vi. 抽水, 上下(或往复)运动"},{"w":"monopoly","p":"mә'nɒpәli","t":"n. 垄断, 专卖权, 独占事业; 垄断, 专利品, 垄断(权)独占"},{"w":"temple","p":"templ","t":"n. 圣堂, 庙宇, 教堂, 礼拜堂, 太阳穴, 鬓角; 颞颥, 颞部"},{"w":"medal","p":"'medl","t":"n. 奖牌, 勋章; vt. 授勋予"},{"w":"sponsor","p":"'spɒnsә","t":"n. 保证人, 赞助者, 发起者, 倡议者, 教父; vt. 发起, 赞助, 倡议"},{"w":"slam","p":"slæm","t":"n. 砰然声, 猛然, 猛烈的抨击; vt. 猛然关上, 砰地关上, 猛烈抨击; vi. 砰地关上, 猛攻"},{"w":"specification","p":".spesifi'keiʃәn","t":"n. 规格, 详述, 详细说明书; 规范; 形式说明; 说明; 说明书; 规格"},{"w":"midnight","p":"'midnait","t":"n. 午夜, 子夜, 半夜; a. 午夜的, 半夜的"},{"w":"integrity","p":"in'tegriti","t":"n. 正直, 廉正, 完整; 完整性"},{"w":"essence","p":"'esns","t":"n. 实质, 本质, 香精; 香精"},{"w":"oral","p":"'ɒ:rәl","t":"n. 口试; a. 口头的, 口述的, 口部的"},{"w":"harsh","p":"hɑ:ʃ","t":"a. 粗糙的, 刺耳的, 严厉的; 粗糙的, 严厉的, 苛刻的"},{"w":"closet","p":"'klɒzit","t":"n. 壁橱, 小室; a. 秘密的, 空谈的; vt. 把...关入小室"},{"w":"retail","p":"'ri:teil","t":"n. 零售; a. 零售的; vt. 零售, 详述, 传播; vi. 零售"}],"doc":{"k":"投资协议业绩承诺与退出条款","en":"EXTRACT - SERIES B SUBSCRIPTION AGREEMENT, CLAUSE 9 (PERFORMANCE UNDERTAKING). The Founders undertake that audited net profit shall be not less than RMB310m, RMB580m and RMB940m respectively for the three financial years ending 31 December 2019. Upon any shortfall, the post-money valuation shall be recalculated in accordance with Schedule 3, such recalculation constituting a down round for all purposes; the Preferred Shares shall rank ahead of the ordinary shares by way of a two-times liquidation preference; and the Founders shall settle the deficiency in cash. During the Restricted Period the Company shall observe the no-shop clause and shall not approach any strategic buyer, procure any fairness opinion, or permit any secondary sale, carve-out or connected transaction without the prior written consent of the Lead Investor.","zh":"节录——B 轮认购协议第九条（业绩承诺）。创始人承诺，截至 2019 年 12 月 31 日止的三个财政年度，经审计净利润分别不低于人民币 3.1 亿元、5.8 亿元及 9.4 亿元。一旦出现任何缺口，投后估值须按附表三的公式重新计算，该重新计算就一切目的而言均构成一次降价轮；优先股须以两倍优先清算权的方式优先于普通股受偿；创始人并须以现金补足差额。在限制期内，公司须遵守禁止招标条款，未经领投方事先书面同意，不得接触任何战略买家、取得任何公平意见书，亦不得进行任何老股转让、分拆剥离或关连交易。"}},{"i":72,"ti":"拆到最小的那块","dom":"valuation","sc":"分部估值","tx":"窗外一艘拖船正在{{dock}}（靠码头），维港上午十点，光很硬。我把模型另存了一版，叫 v14_clean。\n\nDanny 端着一个{{sandwich}}（三明治）过来，{{elbow}}（手肘）杵在我桌上：\"你不是算过一遍了吗？\"\n\n我说算过的是整体，这次要拆。\n\n昨晚那张纸就摆在旁边——2016 年的三个承诺数。既然虚增的部分等于承诺的部分，那这家公司剥掉承诺之后剩什么，就得一块一块看。\n\n第一版我做的是{{top-down forecast}}（自上而下预测）：全球高镍正极需求乘以它自称的份额。数字很{{convenient}}（省事的），也很没用——那不过是它自己讲的故事的镜像。\n\n我推翻重来，把公司拆成五块：正极材料、前驱体、回收、设备、贸易。\n\n正极那块，剔掉并购和汇率影响，只看{{organic growth}}（内生增长）；海外那点收入用{{constant currency}}（固定汇率口径）折一遍，增速从 41% 掉到 9%。前驱体那块产能是真的，但客户名单里有三家我们查过是壳。回收业务只有两页 PPT，没有产线照片，收入却占了一成——我给它零。设备那块我用{{free cash flow to equity}}（股权自由现金流）折，{{discount rate}}（折现率）取 11.5%。贸易那块净资产厚、利润薄，我套了{{P/B-ROE framework}}（PB-ROE框架）：长期 ROE 只有 5%，给 0.5 倍 PB 都算客气。\n\n五块加起来，比现价低六成。它现在相对可比公司的{{premium/discount to peers}}（相对同业的溢价或折价）是正 140%，而基本面差异只支持折价。\n\n我把{{street estimate}}（卖方一致预期）拉出来对了一遍。十一家覆盖，收入预测的分歧只有 3%——一个健康的行业不会这么整齐。这种整齐是{{artificial}}（人为的）。上一次业绩会的{{attendance}}（出席人数）我数过，从四十多家掉到十二家；市场上已经有{{rumour}}（传闻）说它准备配股。\n\n\"整齐说明大家都在抄同一份指引。\"Danny {{mutter}}（嘟囔）了一句。\n\n屏幕上跳出一行红字，{{flash}}（闪）了一下就没了，是它当天第五次拉尾盘。\n\n我真正想知道的其实很{{straightforward}}（直接了当的）：{{what's in the price}}（现价隐含了什么预期）。我倒推了一遍——现价对应未来五年收入复合 34%、净利率维持 19%。这两个数没有一个我敢签字。\n\n过去八个季度，它每季都是{{beat and raise}}（超预期并上调指引），{{earnings surprise}}（业绩超预期幅度）平均正 4.2%，一次{{miss}}（不及预期）都没有。制造业没有这种命。\n\nDanny 问，那要是它哪天来一次{{kitchen sink}}（财务大洗澡），把减值一次性出清呢？\n\n我说那反而是好消息，说明还有人想把公司救回来。现在的问题是根本没人打算认。\n\n中午我下楼买咖啡，路过{{harbour}}（海港）边那排长椅，风把报纸吹起来。一{{fraction}}（一小部分）的疑问一直在我脑子里{{drift}}（漂）着：如果这五块业务我都能证伪，市场为什么还给它两千亿。\n\n回来的路上我想通了一半——不是市场信它，是市场懒得不信。\n\n下午我把{{read-across}}（外溢解读）那一节补上：如果它的出货量是假的，上游那两家锂盐公司的收入也就有问题，而那两家还在高位。这个推论我们内部有人{{reluctant}}（不情愿的）写进报告，因为会得罪的人太多。\n\nRay 在会上问了{{house view}}（研究所统一观点）的事。远岑没有卖方那一套，但 LP 会问口径。我说口径就一句——{{underperform}}（跑输大市）。\n\n\"那你打算给多少目标价？\"\n\n我说明天给，先把{{scenario analysis}}（情景分析）做完。\n\n散会时天已经暗了。窗外{{deadly}}（死一般的）安静，货轮的灯在水面上排成一列。我想起下午的一个电话：一家{{suburb}}（郊区）小厂的采购主管，语气里带着{{plead}}（恳求）的意味，反复问我们的报告什么时候发。\n\n\"你们别{{confuse}}（弄混）了，\"他说，\"我们不是他们的供应商，我们是被他们欠着钱的。\"\n\n那不是{{hint}}（暗示），那是求救。\n\n而车间里那种{{humanity}}（人性）的东西，我的模型里一格都装不下。","ft":[{"w":"P/B-ROE framework","z":"PB-ROE框架","d":"用净资产收益率解释合理市净率，银行股研报的标配方法","a":"","p":""},{"w":"beat and raise","z":"超预期并上调指引","d":"当期业绩超预期同时上调全年指引，最强的正面组合","a":"","p":""},{"w":"constant currency","z":"固定汇率口径","d":"剔除汇率波动后看增速，海外收入占比高的公司常用","a":"","p":""},{"w":"discount rate","z":"折现率","d":"把未来现金流折回现值用的收益率，反映资金成本与风险","a":"","p":""},{"w":"earnings surprise","z":"业绩超预期幅度","d":"实际盈利偏离一致预期的百分比，决定业绩日股价反应","a":"","p":""},{"w":"free cash flow to equity","z":"股权自由现金流","d":"再扣掉利息和债务本息变动后归属股东的现金流","a":"FCFE","p":""},{"w":"house view","z":"研究所统一观点","d":"机构对宏观或行业的官方立场，可能与个股分析师略有出入","a":"","p":""},{"w":"kitchen sink","z":"财务大洗澡；一次性出清","d":"新管理层把坏消息和减值一次做完，为以后轻装上阵","a":"","p":"'kitʃinsiŋk"},{"w":"miss","z":"不及预期","d":"业绩低于一致预期，通常引发预测下修和目标价下调","a":"","p":"mis"},{"w":"organic growth","z":"内生增长","d":"不含并购和汇率影响的自身增长，反映真实经营能力","a":"","p":""},{"w":"premium/discount to peers","z":"相对同业溢价或折价","d":"倍数高于或低于可比公司均值，需要用基本面差异解释","a":"","p":""},{"w":"read-across","z":"外溢解读；对标传导","d":"一家公司的数据或事件对产业链其他公司的推断意义","a":"","p":""},{"w":"scenario analysis","z":"情景分析","d":"设定几套整体假设分别测算估值，展示结果的分布区间","a":"","p":""},{"w":"street estimate","z":"卖方一致预期；街上的预测","d":"the Street指整个卖方群体，这个说法等同于市场一致预期","a":"","p":""},{"w":"top-down forecast","z":"自上而下预测","d":"先看行业空间再乘市占率，倒推公司的收入规模","a":"","p":""},{"w":"underperform","z":"跑输大市","d":"预期表现弱于基准指数，是卖出评级的常见叫法","a":"","p":",ʌndәpә'fɔ:m"},{"w":"what's in the price","z":"当前股价隐含了什么预期","d":"反推现价对应的增长和倍数假设，判断市场预期高低","a":"","p":""}],"iw":[{"w":"mutter","p":"'mʌtә","t":"n. 喃喃低语; vi. 喃喃自语, 作低沉声; vt. 出怨言, 抱怨地说"},{"w":"straightforward","p":"streit'fɒ:wәd","t":"a. 笔直的, 率直的, 明确的, 简单的, 直接的"},{"w":"hint","p":"hint","t":"n. 暗示, 提示; v. 暗示, 示意"},{"w":"convenient","p":"kәn'vi:njәnt","t":"a. 方便的, 合宜的; 适当的, 合理而可行的, 方便的"},{"w":"rumour","p":"'ru:mә","t":"n. 谣言, 传闻; vt. 谣传"},{"w":"artificial","p":".ɑ:ti'fiʃәl","t":"a. 人造的, 假的, 非原地产的; 人工的, 人造的, 伟牟"},{"w":"flash","p":"flæʃ","t":"n. 闪光, 闪现, 一瞬间; vi. 闪光, 闪现, 反射; vt. 使闪光, 反射"},{"w":"humanity","p":"hju:'mæniti","t":"n. 人性, 人类, 博爱"},{"w":"attendance","p":"ә'tendәns","t":"n. 出席, 出席的人数, 照料; 管理, 照料, 资助"},{"w":"fraction","p":"'frækʃәn","t":"n. 小部分, 破片, 分数; 部分, 成分, 分散"},{"w":"reluctant","p":"ri'lʌktәnt","t":"a. 不情愿的, 勉强的; 不愿的, 勉强的, 难以处理的"},{"w":"elbow","p":"'elbәu","t":"n. 手肘, 弯头, 扶手; v. 用手肘推开, 推挤"},{"w":"deadly","p":"'dedli","t":"a. 致命的, 致死的; adv. 非常, 如死一般地"},{"w":"confuse","p":"kәn'fju:z","t":"vt. 使混乱, 使狼狈, 使困惑; 混淆"},{"w":"drift","p":"drift","t":"n. 漂流物, 漂流, 动向; v. (使)漂流"},{"w":"plead","p":"pli:d","t":"vi. 辩护, 恳求; vt. 为...辩护, 提出...借口, 托称, 恳求"},{"w":"harbour","p":"'hɑ:bә","t":"n. 港, 避难所; v. 庇护, 藏匿, (使)入港停泊"},{"w":"sandwich","p":"'sændwitʃ","t":"n. 三明治, 夹心面包, 夹层板; vt. 插入, 夹入, 把...制成三明治"},{"w":"dock","p":"dɒk","t":"n. 码头, 船坞, 被告席, 尾巴的骨肉部分; vt. 使靠码头, 使(船)进港, 剪短; vi. 进港"},{"w":"suburb","p":"'sʌbә:b","t":"n. 市郊住宅区, 郊区, 边缘"}],"doc":{"k":"内部估值备忘录","en":"INTERNAL VALUATION MEMORANDUM - 2318.HK. We have rebuilt the model on a segment basis and abandoned our earlier top-down forecast. Adjusting for acquisitions and restating on a constant currency basis, organic growth in the cathode segment falls from 41% to 9%. The equipment business is valued off free cash flow to equity at a discount rate of 11.5%; the trading arm is valued under a P/B-ROE framework at 0.5x book. The resulting sum is approximately 60% below the current price, against a street estimate cluster whose dispersion is implausibly narrow. We note the read-across to two upstream lithium names. Pending completion of the scenario analysis, we move the internal rating to underperform. Management has yet to take any kitchen sink charge.","zh":"内部估值备忘录——2318.HK。我们已按分部口径重建模型，并放弃了先前的自上而下预测。在剔除并购影响并以固定汇率口径重述后，正极业务的内生增长由 41% 降至 9%。设备业务以股权自由现金流折现，折现率取 11.5%；贸易业务采用 PB-ROE 框架，按 0.5 倍市净率估值。加总结果较现价低约 60%，而卖方一致预期的分歧度窄得不合常理。我们提示对上游两家锂盐公司的外溢解读意义。在情景分析完成之前，我们将内部评级下调至跑输大市。管理层至今未做任何财务大洗澡式的一次性计提。"}},{"i":73,"ti":"最后一页那个数","dom":"valuation","sc":"目标价与评级","tx":"评审会安排在十七楼那间{{magnificent}}（气派的）会议室，长桌能坐二十个人，我们只有六个。\n\n我把报告投上去，四十一页。前四十页是证据，最后一页只有一行：目标价 3.20 港元。现价 11.80。\n\n有人笑了一声。\n\nRay 没笑。他第一句话就是个{{proposition}}（命题）：\"你最后这一页，是估值结论，还是情绪？\"\n\n我说是三种方法交叉出来的。\n\n第一种是{{discounted cash flow}}（现金流折现）。我用{{free cash flow to firm}}（公司自由现金流）折，WACC 11.5%，永续增长 2%。这套最容易挨骂，因为参数一动结果就变；但我把每一格的来源写在批注里，谁想{{contend}}（提出异议）都可以逐格来。\n\n第二种是相对估值。{{price-to-earnings ratio}}（市盈率）用我剔干净之后的盈利算，不是它报的。剔完 2024 年 EPS 是 0.26，给行业中位数 12 倍，就是 3.1。\n\n第三种是{{segment breakdown}}（分部拆分）加总，昨晚做完那版，3.4。\n\n三个数挤在一起，我取了中间。\n\n\"{{implied upside}}（隐含上涨空间）是负 73%，\"我说，\"评级只能写{{underweight}}（减持）。\"\n\n风控的老徐把眼镜推上去，说这个数太{{provoke}}（挑衅）人了。\n\n\"研报通常怎么写？\"\n\n\"通常写一句'{{our estimates are conservative}}（我们的预测偏保守）'，\"我说，\"然后把目标价放在现价下面一点点，给自己留退路。我不想留。\"\n\n我把{{bottom-up forecast}}（自下而上预测）那几页翻出来。这版是从单条产线、单个客户往上加的，剔掉新并表的两家，全部按{{like-for-like}}（可比口径）重排。逻辑的{{trunk}}（主干）只有一句：产能上不去，出货就上不去。\n\n老徐问，那卖方为什么全是买入。\n\n我调出一张{{array}}（一大批）假设的对照表。三家券商把它放进了{{conviction list}}（高信心推荐名单），理由清一色是{{PEG ratio}}（PEG）0.6——市盈率除以增速，看着便宜。可分母是假的。分母假，PEG 就是个装饰。\n\n\"是什么在{{motivate}}（驱动）这些评级？\"Ray 问。\n\n\"承销、路演、席位分仓。\"我说，\"{{seemingly}}（表面上看来）是研究，实际上是关系。\"\n\n我换了个{{lens}}（视角）讲下一段：{{earnings visibility}}（盈利可见度）。市场愿意给高倍数，前提是未来看得清。它的未来只由一份自己发的指引撑着——昨天公司还{{reiterate guidance}}（维持指引），一个字没改。\n\n\"所以我押的不是业绩崩，是倍数崩。\"我说，\"{{multiple contraction}}（估值压缩）——盈利一分不变，股价也能腰斩。现在这个{{stretched valuation}}（估值偏高）撑着的是信心，不是现金。\"\n\n有人问股息呢，按{{total return}}（总回报）算是不是好一点。\n\n我说分红是借钱发的，越发越糟。\n\n会议开了两个半小时。我把所有材料{{assemble}}（汇编）成一个附件包，二百多张照片、四十七段访谈摘要。这不是{{theft}}（盗窃）案，没有人拿走保险柜里的东西；这是{{fraud}}（欺诈），是在纸面上做出一段不存在的{{chemistry}}（化学体系）。\n\n散会时老徐拍拍我肩膀，说他不同意，但会投赞成票。他没有{{cave}}（让步），只是选择不挡。\n\n\"你要有心理准备，\"Ray 在门口说，\"这种报告发出去，第一年没人信，第二年有人骂，第三年才有人说早就看出来了。\"\n\n我说我知道。我不指望{{triumph}}（胜利）。\n\n\"香槟别提前开。\"他真说了这句，\"{{champagne}}（香槟）开早了会跑气。\"\n\n我回工位，把最后一页又看了一遍。港交所那边不会替我{{enforce}}（强制执行）什么，监管有监管的节奏。真正能{{stimulate}}（刺激）市场重新定价的，只有第一个不及预期的季度。\n\n而那个季度会像一道{{cliff}}（悬崖），来的时候没有台阶。\n\n第二天早上，我收到三封邮件，都是同一句话的不同写法——礼貌的{{refusal}}（拒绝）：他们不会转发我的报告。","ft":[{"w":"PEG ratio","z":"PEG","d":"市盈率除以盈利增速，判断高估值是否被增长消化掉","a":"PEG","p":""},{"w":"bottom-up forecast","z":"自下而上预测","d":"从单店单产品单项目往上加总，得出公司整体预测","a":"","p":""},{"w":"conviction list","z":"高信心推荐名单","d":"券商精选的强推组合，进出名单本身就会影响股价","a":"","p":""},{"w":"discounted cash flow","z":"现金流折现；DCF估值","d":"把未来自由现金流按折现率折回今天，绝对估值的主流方法","a":"DCF","p":""},{"w":"earnings visibility","z":"盈利可见度","d":"未来业绩的可预测程度，可见度高市场才愿意给高倍数","a":"","p":""},{"w":"free cash flow to firm","z":"公司自由现金流","d":"经营现金流扣掉资本开支和营运资金后归属全体出资人的钱","a":"FCFF","p":""},{"w":"implied upside","z":"隐含上涨空间","d":"目标价相对现价的百分比空间，直接决定给什么评级","a":"","p":""},{"w":"like-for-like","z":"可比口径","d":"剔除新增、关闭和并表影响之后的同口径比较","a":"LFL","p":""},{"w":"multiple contraction","z":"估值压缩","d":"市场给的倍数往下走，盈利没变股价也会跌","a":"","p":""},{"w":"our estimates are conservative","z":"我们的预测偏保守","d":"研报常用表述，为后面上调预测和目标价留出余地","a":"","p":""},{"w":"price-to-earnings ratio","z":"市盈率；PE","d":"股价除以每股盈利，A股港股研报里最常引用的估值指标","a":"P/E","p":""},{"w":"reiterate guidance","z":"维持指引","d":"重申原有全年目标，在市场担心下修时本身就是利好","a":"","p":""},{"w":"segment breakdown","z":"分部拆分","d":"按业务板块披露收入和利润，分部估值与建模的基础","a":"","p":""},{"w":"stretched valuation","z":"估值偏高；估值透支","d":"倍数明显高于历史和同业，再涨需要更强的基本面逻辑","a":"","p":""},{"w":"total return","z":"总回报","d":"股价涨幅加上股息，港股高息标的评级常按总回报衡量","a":"","p":""},{"w":"underweight","z":"减持；低配","d":"建议配置低于基准权重，相当于看空的委婉说法","a":"","p":"'ʌndәweit"}],"iw":[{"w":"magnificent","p":"mæg'nifisnt","t":"a. 华丽的, 高尚的, 宏伟的"},{"w":"trunk","p":"trʌŋk","t":"n. 树干, 干线, 躯干, 主干, 象鼻, 箱子; vt. 把...放入旅行箱内; a. 树干的, 躯干的, 干线的, 箱形的; 中继线; 母线"},{"w":"motivate","p":"'mәutiveit","t":"vt. 给与动机, 刺激, 提高...的学习欲望, 促动; 促动, 激发, 激励"},{"w":"seemingly","p":"'si:miŋli","t":"adv. 看来似乎, 表面上看来"},{"w":"lens","p":"lenz","t":"n. 透镜, 镜头, 镜片, 晶状体; vt. 给...摄影"},{"w":"proposition","p":".prɒpә'ziʃәn","t":"n. 建议, 命题, 主张; vt. 向...提议, 向...提出猥亵的要求"},{"w":"enforce","p":"in'fɒ:s","t":"vt. 强迫, 执行, 坚持; 予以强制执行"},{"w":"theft","p":"θeft","t":"n. 盗窃, 失窃, 盗窃罪, 赃物; 盗窃行为, 偷窃, 失窃"},{"w":"triumph","p":"'traiәmf","t":"n. 凯旋, 胜利, 欢欣; vi. 得胜, 成功"},{"w":"cliff","p":"klif","t":"n. 悬崖, 绝壁"},{"w":"fraud","p":"frɒ:d","t":"n. 欺骗, 欺诈, 诡计, 骗子; 欺诈, 舞弊, 骗子"},{"w":"contend","p":"kәn'tend","t":"vi. 奋斗, 斗争, 竞争; vt. 为...斗争"},{"w":"array","p":"ә'rei","t":"n. 排列, 衣服, 大批, 军队; vt. 布署, 打扮, 排列; 数组; 阵列"},{"w":"chemistry","p":"'kemistri","t":"n. 化学, 化学过程; 化学"},{"w":"assemble","p":"ә'sembl","t":"vt. 集合, 收集, 装配; vi. 集合; 汇编"},{"w":"champagne","p":"ʃæm'pein","t":"n. 香槟酒, 香槟酒色; 香槟酒"},{"w":"provoke","p":"prә'vәuk","t":"vt. 激怒, 惹起, 诱导; 刺激, 煽动, 激怒"},{"w":"stimulate","p":"'stimjuleit","t":"vt. 刺激, 激励, 鼓舞; vi. 起刺激作用"},{"w":"cave","p":"keiv","t":"n. 洞, 穴; vi. 凹陷, 塌落; vt. 挖洞, 使凹陷, 损坏...的基础"},{"w":"refusal","p":"ri'fju:zl","t":"n. 拒绝, 推却, 优先决定权; 拒绝, 谢绝, 取舍权"}],"doc":{"k":"卖方研报摘要","en":"ORIENT KINETIC MATERIALS (2318.HK) - INITIATION. Rating: underweight. Target price HK$3.20 against a spot of HK$11.80, an implied upside of minus 73%. Our bottom-up forecast, built line by line and stated on a like-for-like basis, produces 2024 EPS of RMB0.26. On a discounted cash flow basis, using free cash flow to firm and a WACC of 11.5%, we derive HK$3.10; our segment breakdown supports HK$3.40. We do not regard the PEG ratio as meaningful where the denominator is unverifiable, and we view the price-to-earnings ratio as a stretched valuation resting on poor earnings visibility. Management continues to reiterate guidance. We expect multiple contraction, rather than an earnings cycle, to drive the total return outcome.","zh":"东亚新能源材料（2318.HK）——首次覆盖。评级：减持。目标价 3.20 港元，对应现价 11.80 港元，隐含上涨空间为负 73%。我们的自下而上预测逐条构建，并以可比口径列示，得出 2024 年每股盈利人民币 0.26 元。以现金流折现法、按公司自由现金流并采用 11.5% 的加权平均资本成本测算，得到 3.10 港元；我们的分部拆分结果支持 3.40 港元。在分母无法验证的情况下，我们不认为 PEG 具有参考意义；我们认为当前市盈率属于估值偏高，且建立在很低的盈利可见度之上。管理层仍在维持指引。我们预计推动总回报结果的将是估值压缩，而非盈利周期。"}},{"i":74,"ti":"三种情景","dom":"valuation","sc":"情景分析","tx":"周三早上，Ray 把一张手写的纸拍在我桌上，三行字：好、一般、坏。\n\n\"别给我一个点，给我一个{{spectrum}}（区间）。\"\n\n我说好。\n\n做{{sensitivity analysis}}（敏感性分析）是最省事的一步：动一个变量，看估值走多远。{{risk-free rate}}（无风险利率）我取十年期国债 3.0%，{{equity risk premium}}（股权风险溢价）取 6.0%，{{cost of equity}}（股权成本）就是 9%。三个数一摆，后面全是{{mathematics}}（数学）。\n\n但 Ray 要的不是这个。他要三套完整假设，每一套自己能站住。\n\n我用{{sum-of-the-parts}}（分部估值）做底座，五块业务各给一组开工率和价格。\n\n坏的那种：正极产能只有披露口径的四成，回收和贸易归零，应收账款计提五成。每股 1.10 港元。\n\n一般的那种：虚增部分全部冲销，剩下的业务按行业平均恢复。2.80。\n\n好的那种，我做得很{{diplomatic}}（留足余地的），几乎所有假设都往好里给：行业景气回来，管理层对 2026 年的目标真的有{{line of sight}}（看得见的确定性），公司也没有被除牌。\n\n5.90。\n\n现价 11.80。\n\n最好的那种，也只有一半。\n\n我把三行贴到白板上，退了两步。那一刻它像个{{monster}}（怪物）——不是数字吓人，是三种情景里没有一种能让我改主意。\n\n我又单做了一版{{dividend discount model}}（股利折现模型），假设它的分红能持续下去，算出来 1.9 元，比我的坏情形还低。因为分红本来就是借来的。\n\nDanny 在旁边撕一包凉茶冲剂，{{herb}}（草药）味呛人，他{{rip}}（撕）掉包装扔进垃圾桶。\n\n\"那利好情形你怎么写，才不会被人说你只会看空？\"\n\n我说照规矩写：{{bull case}}（乐观情形）单列一段，把触发条件写清楚——什么情况下算我错。\n\n\"比如？\"\n\n\"比如它哪天公布一次真实的{{free cash flow yield}}（自由现金流收益率）转正；比如季报只是{{in line}}（符合预期），而不是每一次都超。\"\n\n隔壁组的{{supervisor}}（主管）过来看白板，问我{{valuation band}}（估值区间）取的什么。我说历史三年 PB 的十分位到九十分位。他点点头，走的时候绕了一下，{{skirt}}（绕过）了白板上\"除牌\"那一行。\n\n下午 Ray 把我叫进他办公室。那间是{{basement}}（地下室）改的，搬家时他自己挑的，说安静。\n\n\"如果所有人都觉得坏消息已经{{priced in}}（反映在股价里）了呢？\"\n\n\"那就是没反映。真反映了，公告出来股价不会动。它每次都动。\"\n\n他笑了一下。\n\n\"你这三格里，市场现在站在哪一格？\"\n\n\"{{above/below consensus}}（高于或低于一致预期）这个说法在这儿没意义，\"我说，\"一致预期本身建在假账上。\"\n\n他敲桌子的节奏停了。\n\n\"那{{total shareholder return}}（股东总回报）呢，涨幅加分红加回购。\"\n\n\"过去两年它涨的部分，八成来自{{multiple expansion}}（估值扩张），不是盈利。倍数给回去，什么都不剩。\"\n\nRay 说，我要的不是你说服我，是你说服风控委员会。委员会有它自己的{{hierarchy}}（层级），流程能{{facilitate}}（推进）也能挡。\n\n我说我准备了一份两页的{{leaflet}}（单页材料），每人一份，第一页只有三个数。\n\n最大的{{obstacle}}（障碍）他没说，我知道是什么：如果我们加仓，股价再涨 30%，这就是一场{{nightmare}}（噩梦）。\n\n我们讨论了一个机制，{{whereby}}（据此）每上涨 10% 就减一档名义敞口，用期权替掉一部分现券。\n\n\"这不是{{arena}}（角斗场），\"Ray 说，\"别想着一拳打死。\"\n\n回工位路上我经过{{marine}}（海洋主题的）那面装饰墙，公司装修时挂的鲸鱼照片。有部纪录片里说过一句，{{wildlife}}（野生动物）不跟你讲道理，它只等你先累。\n\n我盯着屏幕上最后一个{{indicator}}（指标）：借券余额，又涨了。\n\n我在{{outperform}}（跑赢大市）那一栏画了个叉，把{{filter}}（筛选）条件设成\"覆盖它的分析师里，谁下调过一次\"。\n\n结果返回：零。\n\n第二天早上，我订了去合肥的高铁票。有个人的电话我打过四次，第五次他接了。","ft":[{"w":"above/below consensus","z":"高于或低于一致预期","d":"分析师预测与市场平均的偏离，是看多看空的常见论据","a":"","p":""},{"w":"bull case","z":"乐观情形","d":"关键假设向好时算出的估值，用来说明上行空间有多大","a":"","p":""},{"w":"cost of equity","z":"股权成本；权益资本成本","d":"股东要求的回报率，通常用CAPM由无风险利率和风险溢价推出","a":"","p":""},{"w":"dividend discount model","z":"股利折现模型；DDM","d":"用未来分红折现来估值，银行保险等高分红行业最常用","a":"DDM","p":""},{"w":"equity risk premium","z":"股权风险溢价","d":"股票相对无风险资产要求的超额回报，成熟市场取五到七个点","a":"ERP","p":""},{"w":"free cash flow yield","z":"自由现金流收益率","d":"每股自由现金流除以股价，衡量造血能力相对估值的性价比","a":"","p":""},{"w":"in line","z":"符合预期","d":"业绩基本落在一致预期附近，股价反应主要看指引","a":"","p":""},{"w":"line of sight","z":"看得见的确定性","d":"管理层说对某目标有line of sight，意思是路径已经清晰","a":"","p":""},{"w":"multiple expansion","z":"估值扩张；倍数抬升","d":"股价上涨主要来自倍数变高，而不是盈利本身增长","a":"","p":""},{"w":"outperform","z":"跑赢大市","d":"预期个股表现优于基准指数的评级，实质等同买入","a":"","p":".autpә'fɔ:m"},{"w":"priced in","z":"已经反映在股价里","d":"利好或利空市场已经预期到，真兑现时股价可能不动","a":"","p":""},{"w":"risk-free rate","z":"无风险利率","d":"一般取十年期国债收益率，是所有折现率的起点","a":"","p":""},{"w":"sensitivity analysis","z":"敏感性分析","d":"改动折现率或增长率等单一变量，看估值结果变化幅度","a":"","p":""},{"w":"sum-of-the-parts","z":"分部估值；SOTP","d":"把各块业务分开估值再加总，适合多元化控股型公司","a":"SOTP","p":""},{"w":"total shareholder return","z":"股东总回报","d":"股价涨幅加分红再加回购贡献的整体回报","a":"TSR","p":""},{"w":"valuation band","z":"估值区间；估值中枢带","d":"历史倍数上下限构成的区间，判断当前贵还是便宜的参照","a":"","p":""}],"iw":[{"w":"monster","p":"'mɒnstә","t":"n. 怪物, 恶人, 巨物; 畸胎"},{"w":"diplomatic","p":".diplә'mætik","t":"a. 外交的, 老练的; 外交的, 外交上的, 文献上的"},{"w":"facilitate","p":"fә'siliteit","t":"vt. 使容易, 促进, 帮助; 使容易, 使便利, 推进"},{"w":"whereby","p":"(h)weә'bai","t":"adv. 靠什么, 如何, 为何, 靠那个, 因此, 由此; 因此, 由是"},{"w":"obstacle","p":"'ɒbstәkl","t":"n. 障碍, 妨害物, 阻碍"},{"w":"leaflet","p":"'li:flit","t":"n. 小叶, 传单; 小叶"},{"w":"rip","p":"rip","t":"n. 裂痕, 破绽, 拉裂, 浪子, 巨浪; vi. 被拉开, 裂开, 猛冲; vt. 撕, 扯, 劈"},{"w":"herb","p":"hә:b","t":"n. 药草, 香草; 草, 草本, 草药"},{"w":"indicator","p":"'indikeitә","t":"n. 指示器, 指示剂, 指标; 指示器"},{"w":"filter","p":"'filtә","t":"n. 滤波器, 过滤器, 滤光器, 过滤嘴, 去尘器; vt. 过滤, 渗透, 走漏; vi. 滤过, 渗入; 过滤器, 筛选"},{"w":"marine","p":"mә'ri:n","t":"n. 舰队, 水兵, 海景画; a. 海的, 海产的, 海底的, 船舶的, 海运的"},{"w":"spectrum","p":"'spektrәm","t":"n. 光谱, 范围, 系列; 光谱"},{"w":"nightmare","p":"'naitmєә","t":"n. 梦魇, 恶梦, 可怕的事物(或情景、人物); 梦魇, 恶梦"},{"w":"supervisor","p":".sju:pә'vaizә","t":"n. 管理者, 监督者, 指导者, 视导员; 管理程序"},{"w":"arena","p":"ә'ri:nә","t":"n. 角斗场, 舞台, 场地; 尿沉渣, 尿沙; 脑沙"},{"w":"skirt","p":"skә:t","t":"n. 裙子, 下摆, 边缘, 郊区; vt. 位于...边缘, 绕过, 回避; vi. 位于边缘"},{"w":"hierarchy","p":"'haiәrɑ:ki","t":"n. 等级制度, 僧侣统治, 等级体系; 分级结构; 分层结构; 新闻组, 新闻组分层"},{"w":"mathematics","p":".mæθә'mætiks","t":"n. 数学; 数学"},{"w":"wildlife","p":"'waildlaif","t":"n. 野生动植物"},{"w":"basement","p":"'beismәnt","t":"n. 地下室, 墙脚; 地下室"}],"doc":{"k":"研报情景分析附录","en":"APPENDIX II - SCENARIO FRAMEWORK. All three cases are built on a sum-of-the-parts basis. The cost of equity is derived from a risk-free rate of 3.0% and an equity risk premium of 6.0%. In the bull case, which assumes utilisation recovers and that management has genuine line of sight to its 2026 target, we reach HK$5.90, approximately half the current price. The base case implies a free cash flow yield consistent with the lower bound of the historical valuation band. Our sensitivity analysis indicates that a 100bp move in the cost of equity shifts fair value by 14%. We do not believe the downside is priced in. Only results materially in line with guidance would justify an outperform rating or further multiple expansion; total shareholder return remains negative in all three cases.","zh":"附录二——情景框架。三种情形均以分部估值为基础构建。股权成本由 3.0% 的无风险利率与 6.0% 的股权风险溢价推出。在乐观情形下，我们假设开工率回升、且管理层对其 2026 年目标确有看得见的确定性，测算结果为 5.90 港元，约为现价的一半。中性情形对应的自由现金流收益率与历史估值区间的下沿一致。敏感性分析显示，股权成本每变动 100 个基点，公允价值变化 14%。我们不认为下行风险已经反映在股价里。只有业绩确实符合预期，才可能支持跑赢大市的评级或进一步的估值扩张；在三种情形下，股东总回报均为负值。"}},{"i":75,"ti":"教授的两个小时","dom":"industry","sc":"技术路线与研发","tx":"材料学院的楼在校区最里面，走过去十分钟，是那种让人后悔穿皮鞋的{{walking}}（步行）距离。\n\n冯教授六十出头，办公室堆满样品瓶。他先问我：\"你是记者？\"\n\n我说我是研究员。他说那更麻烦。\n\n我把来意讲了。他没接话，起身在白板上画了一条曲线。\n\n\"先说结论：这条路线，在他们说的成本下，做不到他们说的良率。\"\n\n接下来两个小时，他讲得像上课。\n\n第一件事是{{cost structure}}（成本结构）。高镍正极的钱主要花在金属盐、烧结用电和折旧上，他把比例写在角上：57、18、14。\"剩下 11 是人工和辅材。你们看的那个{{processing fee}}（加工费）口径，在这个行业根本覆盖不了烧结这一段。\"\n\n第二件事是{{technology roadmap}}（技术路线图）。他从抽屉里翻出公司三年前发的那张规划图，边角都卷了。\"图上写着 2023 年上单晶，2025 年上无钴。做单晶要换窑炉，换窑炉的{{lead time}}（交货周期）现在十四个月起。他们说九个月做完一次{{brownfield expansion}}（技改扩建）——不是不可能，是没人做到过。\"\n\n\"我拿到的{{supplier audit}}（供应商审核）记录只有两页。\"我说。\n\n\"两页说明没做。\"他笑，\"真做过审核的，光是{{receipt}}（单据）就有一摞。\"\n\n他问我怎么做调研。我说做过{{field research}}（实地调研），也发过{{channel survey}}（渠道问卷调研）。\n\n\"{{questionnaire}}（问卷）发给谁？\"\n\n\"三十七家经销商和电池厂采购。\"\n\n\"那是{{sociology}}（社会学），不是材料学。\"他说，\"问卷能告诉你他们信什么，不能告诉你炉子里发生了什么。\"\n\n我承认他说得对，也承认这话听着{{uncomfortable}}（不自在）。\n\n\"我以前看消费品，习惯盯{{average revenue per user}}（单用户平均收入）和{{direct-to-consumer}}（直营模式）那一套，\"我说，\"转到制造业，很多直觉不管用。\"\n\n\"消费品你可以骗自己，材料骗不了。\"他指着窗外，\"那边实验楼的{{drain}}（排水沟）能看出一个组的真实工作量。他们每天往里{{dump}}（倾倒）多少废液，我看一眼就知道跑了多少批次。\"\n\n他讲{{productivity}}（生产率）：同一条线，头部厂商一年跑 320 天，{{second-tier player}}（二线厂商）跑 240 天，因为良率不稳，要停下来清炉。\n\n\"那{{penetration rate}}（渗透率）现在多少？\"\n\n\"装机口径三成出头。有人跟你说五成，那是把送样也算进去了，{{ridiculous}}（荒谬的）。\"\n\n讲到{{import substitution}}（国产替代）时他的语气变了。\"这条线上确实有{{merit}}（可取之处），设备和辅材这几年是替出来了。但替代不等于领先。有人故意把这两个词搅在一起，很{{unfair}}（不公平的）——对真正在做事的人不公平。\"\n\n我问他怎么看{{vertical integration}}（纵向一体化）。\n\n\"往上游做矿是对的，往下游做电芯就{{weird}}（奇怪）了。客户变成对手，谁还给你留{{avenue}}（通道）。\"\n\n天开始暗。他泡第二壶茶，用的是那个{{spare}}（备用的）杯子，缺了个口。\n\n\"你们那家公司，说自己{{off-season}}（淡季）也满产？\"\n\n我说是。\n\n\"那更可疑。淡季所有人都在检修，它凭什么？除非它的订单是{{random}}（随手编的）。\"\n\n我笑了。他没笑。\n\n他说这行有一种{{doctrine}}（教条）：只要投得够多，产能自然会有需求。\"补贴年代成立过，现在不成立。\"\n\n最后半小时他讲{{restocking}}（补库存）：真正的补库存会先反映在辅材订单上，因为辅材便宜、周期短。\"今年到现在，辅材一点没动。\"\n\n我问他愿不愿意把这些写下来。\n\n他沉默了一会儿，说他签过一份{{materiality assessment}}（实质性议题评估）的外部意见，那次之后就不签字了。\n\n\"为什么？\"\n\n\"因为签字的人要{{execute}}（承担）后果，讲话的人不用。\"\n\n他送我到楼下，路灯刚亮。他伸手把一根挡路的{{limb}}（树枝）拨开，说了最后一句：\n\n\"你要是真{{intelligent}}（聪明），就别去证明他做不到。去证明——如果他做不到，这三年的利润是从哪儿来的。\"\n\n那句话像有人拿吸管{{suck}}（吸）走了我肺里的空气。\n\n因为我已经知道答案：从一张 2016 年签的纸上来的。\n\n高铁上我把冯教授每一条填进模型。第二天早上，行业开工率数据出来了：全行业六成。\n\n只有它，还说自己满产。","ft":[{"w":"average revenue per user","z":"单用户平均收入","d":"总收入除以活跃用户数，衡量变现效率","a":"ARPU","p":""},{"w":"brownfield expansion","z":"技改扩建","d":"在现有厂区里改造增产，投资省、投产快","a":"","p":""},{"w":"channel survey","z":"渠道问卷调研","d":"批量问卷收集经销商和终端反馈，把点上信息变成面上结论","a":"","p":""},{"w":"cost structure","z":"成本结构","d":"原材料、人工、折旧各占多大比重，决定利润对什么最敏感","a":"","p":""},{"w":"direct-to-consumer","z":"直营；DTC 模式","d":"品牌自己触达消费者，毛利更高但要自建团队和门店","a":"DTC","p":""},{"w":"field research","z":"实地调研","d":"走到产业一线获取一手信息，卖方深度报告的立身之本","a":"","p":""},{"w":"import substitution","z":"国产替代","d":"本土厂商替换进口产品的过程，A股制造业的长期主线之一","a":"","p":""},{"w":"lead time","z":"交货周期","d":"从下单到交货所需的时间，拉长通常说明供给紧张","a":"","p":""},{"w":"materiality assessment","z":"实质性议题评估","d":"识别对公司最关键的可持续议题，是披露框架的第一步","a":"","p":""},{"w":"off-season","z":"淡季","d":"需求低谷期，厂商往往安排检修或去库存","a":"","p":""},{"w":"penetration rate","z":"渗透率","d":"某产品在潜在用户或场景中的普及比例，成长股的核心跟踪指标","a":"","p":""},{"w":"processing fee","z":"加工费","d":"代工环节收取的费用，锂电和金属冶炼常用这个口径","a":"","p":""},{"w":"restocking","z":"补库存","d":"库存降到低位后重新采购，往往是订单回暖的第一个信号","a":"","p":""},{"w":"second-tier player","z":"二线厂商","d":"份额和技术都排在龙头之后的玩家，景气下行时最先出清","a":"","p":""},{"w":"supplier audit","z":"供应商审核","d":"客户到工厂现场核查质量与产能，通过才能进入合格名录","a":"","p":""},{"w":"technology roadmap","z":"技术路线图","d":"公司未来几代产品的技术演进规划，路线选错代价极大","a":"","p":""},{"w":"vertical integration","z":"纵向一体化","d":"往上游或下游延伸自己做，目的是控成本或锁供应","a":"","p":""}],"iw":[{"w":"drain","p":"drein","t":"n. 排水沟, 消耗, 排水; vt. 排出, 喝光, 耗尽; vi. 排水, 流干"},{"w":"productivity","p":".prәudʌk'tiviti","t":"n. 生产力; 生产率, 生产能力"},{"w":"doctrine","p":"'dɒktrin","t":"n. 教条, 学说; 学说"},{"w":"questionnaire","p":"kwestʃә'nєә","t":"n. 调查表, 问卷; 调查表"},{"w":"sociology","p":".sәusi'ɒlәdʒi","t":"n. 社会学; 社会学"},{"w":"spare","p":"spєә","t":"n. 剩余, 备用品, 备件, 备用零件, 备用轮胎; a. 多余的, 备用的, 空闲的, 节约的, 瘦的; vi. 节约, 省掉, 宽恕; vt. 节约, 省用, 剩下, 饶恕, 赦免"},{"w":"suck","p":"sʌk","t":"vt. 吸, 吮, 吸入, 吮吸, 吸收; vi. 吸, 吸奶; n. 吸, 吸入, 吮吸"},{"w":"random","p":"'rændәm","t":"n. 随意, 随机; a. 任意的, 随便的, 胡乱的, 随机的; adv. 胡乱地"},{"w":"intelligent","p":"in'telidʒәnt","t":"a. 聪明的, 智能的, 了解的"},{"w":"unfair","p":".ʌn'fєә","t":"a. 不公平的, 不正直的, 不正当的; 不正直的, 不公平的, 偏颇的"},{"w":"ridiculous","p":"ri'dikjulәs","t":"a. 荒谬的, 可笑的"},{"w":"weird","p":"wiәd","t":"a. 怪异的, 超自然的, 不可思议的; n. 命运, 预言, 符咒"},{"w":"receipt","p":"ri'si:t","t":"n. 收据, 收入, 收到; vt. 开...的收据"},{"w":"avenue","p":"'ævәnju:","t":"n. 大街, 途径, 林荫路"},{"w":"walking","p":"'wɒ:kiŋ","t":"n. 步行, 步态; a. 步行的, 步行用的"},{"w":"dump","p":"dʌmp","t":"n. 垃圾场; vt. 倾倒, 倾销; vi. 倒垃圾, 倾销商品; 转出; 转储; 倾卸; 切断电源"},{"w":"uncomfortable","p":".ʌn'kʌmfәtәbl","t":"a. 不舒服的, 不自在的, 不安的"},{"w":"merit","p":"'merit","t":"n. 优点, 功绩, 价值, 功过, 真相; vt. 值得; vi. 应受"},{"w":"execute","p":"'eksikju:t","t":"vt. 执行, 实行, 完成, 处死, 制成; 执行"},{"w":"limb","p":"lim","t":"n. 四肢, 枝干, 翼, 边缘; vt. 切断...之手足"}],"doc":{"k":"技术尽职调查意见","en":"TECHNICAL DUE DILIGENCE OPINION - SUMMARY OF FINDINGS. Based on field research at two comparable plants, a channel survey of eleven converters and a review of the issuer's published technology roadmap, we do not consider the stated yield achievable on the announced timetable. The roadmap assumes a brownfield expansion completed within nine months, whereas the lead time for the sintering furnaces alone exceeds fourteen months. The issuer's disclosed cost structure implies a processing fee below the level at which any second-tier player can operate. Claims of vertical integration are not supported by the supplier audit records made available to us, nor by the materiality assessment filed last year. We regard the penetration rate assumed for this chemistry, and the import substitution narrative attached to it, as materially optimistic.","zh":"技术尽职调查意见——结论摘要。基于对两家可比工厂的实地调研、面向十一家加工厂的渠道问卷调研，以及对发行人已公开技术路线图的复核，我们认为在其公布的时间表下无法实现所宣称的良率。该路线图假设一次技改扩建在九个月内完成，而仅烧结窑炉的交货周期就超过十四个月。发行人披露的成本结构所隐含的加工费，低于任何二线厂商可以维持运营的水平。其关于纵向一体化的说法，既未获得我们所取得的供应商审核记录支持，也未获得去年提交的实质性议题评估支持。我们认为，该技术体系所假设的渗透率，以及附着其上的国产替代叙事，均显著偏于乐观。"}},{"i":76,"ti":"六成，和一百","dom":"industry","sc":"产能与开工率","tx":"从教授{{residence}}（住宅）楼下出来的时候快十点了，我在小区门口站了五分钟没动。两个小时，他一次都没提过公司的名字，只讲了一件事：这条技术路线在实验室里成立，在产线上不成立，因为{{yield rate}}（良率）爬不上去，再给三年也爬不上去。\n\n回香港的高铁上我没睡。教授是一个人的判断，我要的是全行业的数。\n\n第二天我干了件笨活：把国内报过高镍产能的厂，一家一家列出来。行业协会每月{{administer}}（管理执行）一次开工情况统计，表的{{heading}}（标题栏）写着\"重点企业运行情况\"，我把三年的全拖下来，一格一格对。\n\n数出来很{{nasty}}（难看）。全行业开工率六成出头，{{indigenous}}（本土的）二线厂只有四成，整个{{midstream}}（中游）在流血。这不是一时的，是{{chronic}}（慢性的）过剩。{{per-tonne margin}}（单吨盈利）从八千块掉到一千二，一半的厂已经是负的，剩下一半在等同一件事：{{capacity closure}}（产能出清）。谁先关，活下来的人才有一个{{decent}}（像样的）价格。\n\n只有一家在这张表上填了\"满产\"。\n\n我打给协会做统计的那位老师，问他核不核。他说不核，企业自己报。\"我们就是个{{directory}}（名录），谁爱写什么写什么。\"他还笑，说报数的时候大家都会往上{{pad}}（夸大）一点，行业里叫\"报个面子数\"。可没人敢从六成报到一百。\n\n我又去翻三家整车厂公布的合格供应商名单，东亚新能源在{{tier-1 supplier}}（一级供应商）那一栏一次都没出现过，只在二级里出现过一回，还是三年前。一家真正的一供，每年要过一轮{{supply chain due diligence}}（供应链尽调）——环保、劳工、合规，报告几百页。我一份都找不到。\n\n卖方的故事我背得出来，因为三年前我自己也写过：电动化是{{secular trend}}（长期趋势），它有{{first mover advantage}}（先发优势），沿着{{learning curve}}（学习曲线）往下滑，成本会比{{incumbent}}（现有龙头）还低，等出货量起来，{{operating leverage}}（经营杠杆）一放，利润会很{{spectacular}}（惊人）。\n\n问题是{{average selling price}}（均价）已经腰斩。学习曲线确实在往下滑，价格滑得更快。\n\n上个月的行业年会我去了。开场是个{{dancer}}（舞蹈演员），一个人在台上跳了四分钟，跳完主席上来，第一句话是\"今年很难\"。台下没人鼓掌。中场我端着咖啡站在走廊上，手一抖{{spill}}（洒）了半杯在裤子上，正好听见墙角两个人说话，一个说他们厂停了两条线，另一个说\"你至少还敢说\"。那天所有人的{{tune}}（调子）是一样的：熬。只有一家不在这个调上。\n\n价格的{{transmission}}（传导）是有先后的：碳酸锂先跌，前驱体跟着跌，正极最后跌。任何一个数字放进{{isolation}}（孤立状态）里都能自圆其说，可你把开工率、用电量、招工数、物流单据摞在一起，它们必须互相咬得住。\"满产\"这两个字会{{trigger}}（触发）一整串检验——满产就要用电，就要招人，就要发货。它的满产是一种{{virtual}}（实质上不存在的）满产：口径是{{fluid}}（可变的），去年叫\"设计产能\"，今年改叫\"有效产能\"，明年大概会叫别的。\n\n还有个{{twist}}（新手法）。这份年报多了一块新业务，家庭储能，整整六页，用的全是消费品公司的口径：{{distribution coverage}}（铺货率）四千七百个网点，{{customer acquisition cost}}（获客成本）同比下降三成，{{retention rate}}（留存率）九成三，{{churn rate}}（流失率）只有百分之一点二，{{product cycle}}（产品周期）十八个月。\n\n一家做正极材料的公司，突然开始跟你讲留存率。我读了三遍。材料的故事讲不动了，就换一个还讲得动的。\n\n我不能{{convict}}（给…定罪）任何人，我只能把六成和一百这两个数印在同一页纸上，贴在工位隔板上。\n\n第二天早上 Ray 路过，站着看了两秒。\n\n\"碳酸锂已经从五十六万跌到八万了，\"他说，\"去看它的毛利率。\"","ft":[{"w":"average selling price","z":"均价；单价","d":"单位产品的平均售价，量价拆分里最重要的一半","a":"ASP","p":""},{"w":"capacity closure","z":"产能出清；关停退出","d":"落后或亏损产能永久退出，是周期反转的必要条件","a":"","p":""},{"w":"churn rate","z":"流失率；退订率","d":"一定时期内流失用户占比，订阅制公司最看重的经营指标","a":"","p":""},{"w":"customer acquisition cost","z":"获客成本","d":"拉来一个新用户平均要花多少钱，补贴退坡时会明显上升","a":"CAC","p":""},{"w":"distribution coverage","z":"渠道覆盖；铺货率","d":"产品进入了多少家终端网点，反映渠道扩张深度","a":"","p":""},{"w":"first mover advantage","z":"先发优势","d":"先进入市场积累的客户、品牌和成本优势，后来者难以复制","a":"","p":""},{"w":"incumbent","z":"现有龙头；在位者","d":"已经占据主要份额的老玩家，通常有渠道和客户积累优势","a":"","p":"in'kʌmbәnt"},{"w":"learning curve","z":"学习曲线","d":"累计产量翻倍带来的单位成本下降，光伏行业最典型","a":"","p":""},{"w":"midstream","z":"中游","d":"加工制造环节，两头受挤压，盈利常取决于价差","a":"","p":"'midstri:m"},{"w":"operating leverage","z":"经营杠杆","d":"收入增长时固定成本被摊薄，利润增速明显快于收入","a":"","p":""},{"w":"per-tonne margin","z":"单吨盈利","d":"每吨产品赚多少钱，钢铁化工等周期品最常用的口径","a":"","p":""},{"w":"product cycle","z":"产品周期","d":"新品从推出到被替代的完整周期，消费电子最典型","a":"","p":""},{"w":"retention rate","z":"留存率","d":"一段时间后仍在使用产品的用户比例，产品力的硬指标","a":"","p":""},{"w":"secular trend","z":"长期趋势；结构性趋势","d":"跨越周期的长期方向，如电动化、老龄化","a":"","p":""},{"w":"supply chain due diligence","z":"供应链尽调","d":"核查供应商在环保、劳工和合规上的表现，出口业务的必修课","a":"","p":""},{"w":"tier-1 supplier","z":"一级供应商；一供","d":"直接给整车厂或品牌商供货的厂商，地位高于二三级供应商","a":"","p":""},{"w":"yield rate","z":"良率","d":"合格品占总产出的比例，新产线良率爬升直接改善成本","a":"","p":""}],"iw":[{"w":"spectacular","p":"spek'tækjulә","t":"a. 公开展示的, 惊人的, 壮观的; n. 奇观, 惊人之举, 展览物"},{"w":"nasty","p":"'nɑ:sti","t":"a. 污秽的, 下流的, 险恶的"},{"w":"tune","p":"tju:n","t":"n. 歌曲, 主旋律, 心情, 声调, 和谐, 一致, 语调, 程度; vt. 为...调音, 调整, 调谐, 使一致; vi. 协调, 调谐"},{"w":"chronic","p":"'krɒnik","t":"a. 慢性的, 习惯性的; n. 慢性病患者"},{"w":"residence","p":"'rezidәns","t":"n. 住宅, 居留, 驻扎, 居住期间; 住房"},{"w":"administer","p":"әd'ministә","t":"vt. 管理, 料理, 执行; vi. 执行遗产管理人的职责, 给予帮助"},{"w":"heading","p":"'hediŋ","t":"n. 标题, 起始字, 方向; 上标题"},{"w":"dancer","p":"'dɑ:nsә","t":"n. 舞蹈演员, 跳舞者"},{"w":"pad","p":"pæd","t":"n. 填补, 衬垫, 印色盒, 路; vt. 填补, 走, 夸大; vi. 步行; 焊接点; 包装配/拆卸"},{"w":"transmission","p":"træns'miʃәn","t":"n. 传输, 传送, 变速器; 传输"},{"w":"isolation","p":".aisә'leiʃәn","t":"n. 隔绝, 孤立, 隔离; 分离; 生物分离"},{"w":"trigger","p":"'trigә","t":"n. 触发器, 扳机; vt. 触发, 发射, 引起; vi. 松开扳柄; 切换开关"},{"w":"spill","p":"spil","t":"n. 溢出, 溅出, 摔下, 溢出量, 木片, 小塞子; vt. 使溢出, 使散落, 洒, 使流出, 倒出, 使摔下; vi. 溢出, 涌流, 摔下"},{"w":"twist","p":"twist","t":"n. 一扭, 扭曲, 曲折, 歪曲, 螺旋状, 新手法; vt. 拧, 扭, 捻, 编织, 使扭转, 缠绕, 盘绕, 歪曲, 使转动, 使苦恼, 使混乱, 使旋转; vi. 转向, 弯曲, 缠绕, 扭动, 呈螺旋形"},{"w":"virtual","p":"'vә:tʃuәl","t":"a. 实际上起作用的, 虚的, 实质的, 有效的, 事实上生效的; 虚拟"},{"w":"fluid","p":"'flu:id","t":"n. 液体, 分泌液, 流体; a. 流动的, 可改变的"},{"w":"convict","p":"kәn'vikt","t":"n. 囚犯, 罪犯; vt. 宣告有罪, 使知罪"},{"w":"indigenous","p":"in'didʒinәs","t":"a. 本土的, 国产的, 固有的; 原产的, 本土的"},{"w":"directory","p":"di'rektәri","t":"n. 目录, 工商名录, 指南; 目录"},{"w":"decent","p":"'di:sәnt","t":"a. 有分寸的, 得体的, 大方的"}],"doc":{"k":"行业景气度研报摘要","en":"SECTOR UPDATE - Cathode Materials: Utilisation at 60%, One Outlier. Industry utilisation across the midstream fell to approximately 60% in the quarter, with second-tier plants below 45%. Average selling price declined 38% year on year, and per-tonne margin for the median producer is now negative. We believe meaningful capacity closure is a precondition for any recovery; operating leverage cannot assist until volumes stabilise. We continue to regard electrification as a secular trend, but note that learning curve gains are being outpaced by price deflation. Only one listed producer reports full utilisation. We find no record of that issuer appearing as a tier-1 supplier to any major OEM, and no published supply chain due diligence report. We downgrade the sector to Neutral and identify yield rate disclosure as the principal risk.","zh":"行业更新——正极材料：开工率六成，只有一个异类。本季度中游行业开工率降至约 60%，二线厂低于 45%。均价同比下滑 38%，中位数厂商的单吨盈利已转负。我们认为有实质意义的产能出清是任何复苏的前提；在销量企稳之前，经营杠杆无从发挥。我们仍将电动化视为长期趋势，但需指出，学习曲线带来的成本下降正被价格通缩所超越。仅有一家上市厂商披露满产。我们未找到该发行人出现在任何主要整车厂一级供应商名单中的记录，也未见其公开发布过供应链尽调报告。我们将行业评级下调至中性，并将良率披露列为首要风险。"}},{"i":77,"ti":"一条直线","dom":"industry","sc":"价格与成本曲线","tx":"碳酸锂从五十六万一吨跌到八万，用了十四个月。\n\n我去上海参加一个{{seminar}}（专题研讨会），题目八个字：\"成本曲线与出清路径\"。主办方是一所大学，材料学院的{{dean}}（院长）致开幕辞，讲了七分钟，没有一句是关于价格的。会场在四楼，我从一楼商场穿上来的时候顺手看了眼{{footfall}}（客流量）：周三下午，整层楼二十几个人。今年这个国家所有跟制造业沾边的地方，大概都是这个体感。\n\n茶水间后面一排{{cupboard}}（柜子）塞满了往年的会议纪念品，落着灰。有人开玩笑说明年就不办了。\n\n上午的主题是{{cyclical downturn}}（周期下行）。一位盐湖厂的老总讲他们四月就停产了，讲得很平静：\"我们早就把{{towel}}（毛巾）扔了。\"他翻出手机里一张照片给我看：一片{{wilderness}}（荒野）中间几个方形卤水池，蓝得不像真的。\n\n下午讲{{capacity discipline}}（产能自律）。龙头主动把{{operating rate}}（开工率）压到五成五，指望价格能{{boost}}（提振）一点。协会反复强调这只是倡议，不是{{mandate}}（强制指令）——他们没有那个权力，也不敢有。会上还搞了个匿名{{ballot}}（投票）：明年谁会先减产。结果贴在墙上，没有一个人投自己。\n\n所有人都同意一件事：这一轮之后{{industry concentration}}（行业集中度）会提升。分歧只在{{duration}}（持续时间）。价格已经{{succession}}（连续）十一个月创新低，需求端没有任何{{driving}}（强劲的）力量，回暖的信号很{{faint}}（微弱）。\n\n有人讲{{circular economy}}（循环经济），说电池回收能把边际成本再压一档。有人讲前两年花大价钱囤的原料——那阵子满世界都在讲{{supply chain resilience}}（供应链韧性），现在那批货全成了包袱。一家二线厂在台上讲新一代材料的{{pilot production}}（小批量试产），说自己的{{time to market}}（上市速度）比对手快六个月。我私下问他{{backlog}}（在手订单）能撑到什么时候，他停了两秒，说二季度。\n\n这就是整条链现在的真实温度。一吨碳酸锂只{{fetch}}（卖得）八万出头，按当期{{run rate}}（年化运行水平）算，一半的产能今年会亏现金。\n\n回酒店我打开东亚新能源的三份年报。\n\n毛利率：34.1%、34.3%、34.0%。\n\n三年，上游原料跌了八成五，它的毛利率动了不到三十个基点。\n\n它给的{{justification}}（理由）是{{product mix}}（产品结构）改善带来的{{mix shift}}（结构变化）——高镍占比上去了，所以均价扛得住。这套{{rhetoric}}（说辞）三年一个字没改。我把高镍产品的行业价格拉出来，跌得比常规型号还狠。\n\n储能那块的收入是{{sell-in}}（发给渠道的出货），发给{{distributor}}（经销商），年报里还认真算了{{lifetime value}}（用户生命周期价值），一个用户五年能贡献多少利润，算到小数点后一位。至于发给经销商的货有没有真卖掉，年报没有{{explicit}}（明确）说，一个字都没有。\n\n整条产业链是一张{{web}}（网），你动一个点，别的点都会跟着抖。它不抖。它是这张网里唯一一个不抖的点。\n\nDanny 打电话问要不要加仓。我说等一下。一个数字太稳，说明它想{{convey}}（传达）的东西比它本身重要——它想说的是\"我们不受周期影响\"。可这个行业里没有人不受周期影响。价格再低，别人都在{{compromise}}（妥协）：减产、降价、裁人。只有它一步不让。\n\n亏损会{{breed}}（滋生）出一些奇怪的做法，这我知道。但奇怪到这个程度的，我第一次见。\n\n我把三年的毛利率和碳酸锂价格画进同一张图：一条从左上角砸到右下角，一条是直的。截图发给 Ray。\n\n他回了七个字：把 ESG 报告调出来。","ft":[{"w":"backlog","z":"在手订单；订单储备","d":"已签约但尚未交付的订单量，能见度高的行业最看这个","a":"","p":"'bæklɔ^"},{"w":"capacity discipline","z":"产能自律","d":"行业内厂商克制扩产以维持价格，周期反转的重要前提","a":"","p":""},{"w":"circular economy","z":"循环经济","d":"以回收再利用替代新增资源投入的模式，如废钢和电池回收","a":"","p":""},{"w":"cyclical downturn","z":"周期下行","d":"行业景气进入回落阶段，价格和盈利同步收缩","a":"","p":""},{"w":"distributor","z":"经销商","d":"买断货再往下卖的渠道商，承担库存风险","a":"","p":"dis'tribjutә"},{"w":"footfall","z":"客流量","d":"进店人数，商业地产和线下零售最基础的经营指标","a":"","p":"'futfɒ:l"},{"w":"industry concentration","z":"行业集中度","d":"头部几家企业的份额之和，集中度提升往往意味着盈利改善","a":"","p":""},{"w":"lifetime value","z":"用户生命周期价值","d":"一个用户长期能贡献的总利润，要和获客成本比着看","a":"LTV","p":""},{"w":"mix shift","z":"结构变化","d":"产品或客户结构变化带来的均价与毛利波动","a":"","p":""},{"w":"operating rate","z":"开工率","d":"装置或产线实际运转的比例，周期品高频跟踪的关键数据","a":"","p":""},{"w":"pilot production","z":"小批量试产","d":"量产前的试制阶段，用来打磨工艺和良率","a":"","p":""},{"w":"product mix","z":"产品结构","d":"高端和低端产品的销售占比，结构变好能拉动整体均价","a":"","p":""},{"w":"run rate","z":"年化运行水平","d":"把当期水平简单年化，用来说明业务当前的运行体量","a":"","p":""},{"w":"sell-in","z":"出货；发货给渠道","d":"厂商发给经销商的量，容易被压货粉饰，要和动销对照看","a":"","p":""},{"w":"supply chain resilience","z":"供应链韧性","d":"断供、涨价等冲击下维持稳定交付的能力，近年被反复提及","a":"","p":""},{"w":"time to market","z":"上市速度","d":"从立项到产品上市所需时间，快慢直接影响能否吃到红利","a":"","p":""}],"iw":[{"w":"convey","p":"kәn'vei","t":"vt. 传达, 运输, 转让; 转让(财产等), 搬运"},{"w":"towel","p":"'tauәl","t":"n. 手巾, 毛巾; v. 擦干身子"},{"w":"compromise","p":"'kɒmprәmaiz","t":"n. 妥协, 折中, 折中方案, 和解; vi. 妥协处理; vt. 危害"},{"w":"fetch","p":"fetʃ","t":"n. 取得, 拿, 诡计, 魂; vt. 接来, 取来, 售得, 带来, 推出, 引出, 杀死, 吸引, 到达; vi. 取物, 前进; 取"},{"w":"boost","p":"bu:st","t":"n. 推进, 吹捧; vt. 推进, 提高, 宣扬, 促进"},{"w":"cupboard","p":"'kʌpbɒ:d","t":"n. 食橱, 碗柜, 餐具柜"},{"w":"faint","p":"feint","t":"n. 昏厥, 昏倒; a. 模糊的, 微弱的, 无力的; vi. 昏倒, 变得微弱"},{"w":"duration","p":"dju'reiʃәn","t":"n. 持续时间, 持续; 持续时间"},{"w":"succession","p":"sәk'seʃәn","t":"n. 连续, 继承权, 继位, 演替, 地层次序; 继承, 继承权, 继位"},{"w":"ballot","p":"'bælәt","t":"n. 投票, 投票用纸, 抽签; vi. 投票, 抽签; vt. 投票选出, 拉选票"},{"w":"web","p":"web","t":"n. 网, 蛛丝, 蹼, 织物, 圈套, 卷筒纸; vi. 结网, 形成网; vt. 织蜘蛛网于, 使落入圈套"},{"w":"justification","p":".dʒʌstifi'keiʃәn","t":"n. 辩护, 证明正当, 释罪; 调整"},{"w":"dean","p":"di:n","t":"n. 院长, 主持牧师; 外交团长, 学院院长, 教务长"},{"w":"driving","p":"'draiviŋ","t":"n. 赶, 操纵, 驾驶; a. 推进的, 强劲的, 精力旺盛的"},{"w":"rhetoric","p":"'retәrik","t":"n. 修辞, 修辞学, 雄辩(术)"},{"w":"wilderness","p":"'wildәnis","t":"n. 荒野, 荒地, 大量"},{"w":"breed","p":"bri:d","t":"n. 种类, 品种; v. 养育, 引起, 饲养, 繁殖"},{"w":"explicit","p":"ik'splisit","t":"a. 详述的, 清楚的, 直言的"},{"w":"mandate","p":"'mændeit","t":"n. 命令, 指令, 要求; vt. 委任统治"},{"w":"seminar","p":"'seminɑ:","t":"n. 研究班, 专题讨论会; 讨论会, 专家讨论会"}],"doc":{"k":"业绩电话会问答片段","en":"ANALYST: Lithium carbonate prices are down more than eighty percent from the peak, yet your gross margin has moved less than thirty basis points in three years. Could you be explicit about what is driving that?\nCFO: Three factors. First, product mix; the mix shift toward high-nickel grades continues to support pricing. Second, our operating rate has remained above ninety percent while the industry has entered a cyclical downturn, which reflects our capacity discipline and our investment in supply chain resilience. Third, our circular economy programme lowers input cost. On volumes, sell-in to our distributor network is running ahead of plan, and the current backlog implies a run rate above guidance. We are comfortable with the full-year outlook and see no reason to revise it.","zh":"分析师：碳酸锂价格已从高点回落逾八成，而贵司毛利率三年之内变动不足三十个基点。可否明确说明背后的驱动因素？\n首席财务官：有三点。第一是产品结构，高镍型号占比提升带来的结构变化持续支撑价格。第二，在行业进入周期下行的同时，我们的开工率始终保持在九成以上，这体现了我们的产能自律以及在供应链韧性上的投入。第三，我们的循环经济项目降低了投入成本。就销量而言，向经销商体系的出货进度快于计划，当前在手订单所对应的年化运行水平高于指引。我们对全年展望有信心，暂无修正的理由。"}},{"i":78,"ti":"他没去过工厂","dom":"industry","sc":"ESG 与披露","tx":"那份 ESG 报告有一百四十页，纸很厚，封面是{{canvas}}（帆布）质感的深绿色，摸上去像本画册。\n\n我用{{thumb}}（拇指）把它一路翻到最后一页，董事长的{{signature}}（签名）是扫描件。我调出三年前那份，同一个签名，连墨点的位置都一样。照片里他站在一排光伏板前面{{beam}}（笑逐颜开）。\n\n正文全是形容词，真东西都在{{appendix}}（附录）里，数据{{scatter}}（散布）在六个章节，得自己拼。附录 C 写着{{safety incident rate}}（安全事故率）连续三年为零。三年，零。一家有高温窑炉、有粉尘、有强碱的工厂，三年一次事故都没有。这不是好，这是{{horrible}}（糟透的）——因为它只说明没有人在记。\n\n给它评级的机构打了 AAA，最高一档。我托纽约的朋友要到那位分析师的邮箱，因为时差，我们约在香港时间晚上十点通话。\n\n他很客气，也很坦率。\n\n我问他做没做过{{plant tour}}（实地参观工厂）。\n\n他说没有。整个亚洲区的材料和化工，一百四十家公司，只有他一个人在看。现场核查{{delegate}}（委派）给第三方，第三方在当地又转包一次。评分的输入九成来自公司自己填的问卷。他说内部提过要{{abolish}}（废除）这套自评问卷，提了两年，没下文——评级这门生意本身也被{{lobby}}（游说）着，有专门的顾问公司帮企业\"优化\"得分，按分档报价。\n\n\"你们报告里{{allege}}（宣称）它的{{localization rate}}（国产化率）是 96%，\"我说，\"这个数是谁给的？\"\n\n\"公司。\"\n\n我问他知不知道全行业正陷在{{supply glut}}（供给过剩）里，而这家公司还在讲{{capacity expansion}}（扩产）。他停了一下，说 ESG 评级不评{{industry cycle}}（行业周期），只评披露质量和治理流程。\n\n这话是对的。这也正是最{{profound}}（深刻）的地方：他们评的从来不是真假，是格式。\n\n报告里有一整章把可持续实践写成一条{{moat}}（护城河），说在这样一个{{fragmented market}}（格局分散的市场）里，绿色资质会带来持续的{{share gain}}（份额提升）；说它对上游有很强的{{bargaining power}}（议价能力）——一家开工率存疑的公司，哪来的议价能力；说{{downstream}}（下游）需求旺盛，{{total addressable market}}（可触达市场空间）还有五倍。它还写自己已经通过三家欧洲车企的{{qualification}}（认证导入）。我把那三家的公开公告和供应商名单都查了一遍，一个字都没有。\n\n最让我想笑的是第九章。储能那块，它在 ESG 报告里讲\"让每个家庭参与绿色转型\"，附上了{{daily active users}}（日活跃用户）、{{order frequency}}（下单频次），还一本正经做了{{cohort analysis}}（同期群分析）。一份 ESG 报告里出现日活。我笑出声，笑完心里发凉。\n\n拿到 AAA 之后，一批 ESG 主题基金把它买进{{portfolio}}（投资组合），照着规则不得不买。跟{{comparable}}（可比公司）比，它的估值高出一倍，多出来的那部分就叫\"ESG {{premium}}（溢价）\"。它去年还在一个可持续{{forum}}（论坛）上领了奖，照片挂在官网首页。\n\n造假的公司有一个共同的{{trait}}（特征）：非财务披露永远比财务披露漂亮。因为非财务的东西没人审。\n\n我把这些写进备忘录，压成一页{{abstract}}（摘要）发给 Ray。他看完{{frown}}（皱眉），说市场现在这么{{chaos}}（混乱），你还有心思看这个。\n\n我说，你翻到附录 D。\n\n附录 D 是\"主要合作金融机构\"。第一家我从来没听说过，一家城商行。授信余额是名单上第二名的四倍。","ft":[{"w":"bargaining power","z":"议价能力","d":"公司对上游供应商或下游客户谈价格和账期的话语权","a":"","p":""},{"w":"capacity expansion","z":"扩产","d":"新增产能的投资动作，扩产节奏直接决定未来几年的供需","a":"","p":""},{"w":"cohort analysis","z":"同期群分析；分层看用户","d":"把同期获取的用户分组跟踪，判断留存和回本的常用方法","a":"","p":""},{"w":"daily active users","z":"日活跃用户","d":"单日活跃用户数，和月活之比常用来看粘性","a":"DAU","p":""},{"w":"downstream","z":"下游","d":"靠近终端客户的环节，需求好坏最先在这里体现出来","a":"","p":"'daun'stri:m"},{"w":"fragmented market","z":"行业格局分散","d":"没有明显龙头、大量小厂并存的市场，往往有整合空间","a":"","p":""},{"w":"industry cycle","z":"行业周期","d":"供需错配带来的景气起伏，周期品研究的核心变量","a":"","p":""},{"w":"localization rate","z":"国产化率","d":"关键零部件或设备中本土供应的比例，反映替代进展","a":"","p":""},{"w":"moat","z":"护城河","d":"让公司长期维持超额回报的竞争壁垒，如品牌、技术、网络效应","a":"","p":"mәut"},{"w":"order frequency","z":"下单频次","d":"单个用户在一定周期内下单的次数，衡量消费习惯是否养成","a":"","p":""},{"w":"plant tour","z":"参观工厂；产线参观","d":"实地看产线运转和在建产能，判断扩产进度是否兑现","a":"","p":""},{"w":"qualification","z":"认证导入；验证通过","d":"通过客户的产品与产线审核，是拿到订单的前置条件","a":"","p":".kwɒlifi'keiʃәn"},{"w":"safety incident rate","z":"安全事故率","d":"单位工时内的事故次数，化工和采矿行业的硬约束","a":"","p":""},{"w":"share gain","z":"份额提升","d":"在行业增长之外靠抢对手份额实现的增长","a":"","p":""},{"w":"supply glut","z":"供给过剩","d":"短期集中投产导致供大于求，通常伴随价格快速下跌","a":"","p":""},{"w":"total addressable market","z":"可触达市场空间；行业天花板","d":"按最理想情况估算的整个市场规模，用来判断成长上限","a":"TAM","p":""}],"iw":[{"w":"chaos","p":"'keiɒs","t":"n. 大混乱, 混沌; 混沌; 浑沌"},{"w":"abstract","p":"'æbstrækt","t":"a. 抽象的, 深奥的; n. 摘要, 抽象概念; vt. 摘要, 提炼, 使抽象化; 摘录; 摘要; 抽象"},{"w":"delegate","p":"'deligeit","t":"n. 代表; vt. 委派...为代表"},{"w":"canvas","p":"'kænvәs","t":"n. 帆布, 画布, 油画; 帆布"},{"w":"portfolio","p":"pɒ:t'fәuliәu","t":"n. 皮包, 公文包, 部长职务, 有价证券财产目录, 艺术代表作选辑; 公文包, 文件夹, 阁员职务"},{"w":"profound","p":"prә'faund","t":"a. 极深的, 深厚的, 深刻的, 渊博的"},{"w":"abolish","p":"ә'bɒliʃ","t":"vt. 废止, 革除, 消灭; 废除, 取消, 裁撤"},{"w":"lobby","p":"'lɒbi","t":"n. 大厅, 休息室, 游说议员者; vi. 游说议员, 游说; vt. 游说"},{"w":"trait","p":"treit","t":"n. 特征, 特性, 一笔, 少许"},{"w":"allege","p":"ә'ledʒ","t":"vt. 宣称, 主张, 提出, 断言; 断言, 指称, 指证"},{"w":"beam","p":"bi:m","t":"n. 横梁, 杆, 光线, 容光焕发; vi. 用梁支承, 微笑, 射出光线; vt. 照耀, 感到欣喜; 束"},{"w":"comparable","p":"'kɒmpәrәbl","t":"a. 可比较的, 比得上的"},{"w":"premium","p":"'pri:miәm","t":"n. 额外补贴, 奖金, 奖赏, 保险费; 保险费"},{"w":"appendix","p":"ә'pendiks","t":"n. 附录, 附加物, 阑尾; 增补"},{"w":"thumb","p":"θʌm","t":"n. 拇指; vt. 以拇指拨弄, 笨拙地摆弄, 用拇指翻旧, 迅速翻阅, 作搭车手势"},{"w":"horrible","p":"'hɒrәbl","t":"a. 可怕的, 遭透的, 极讨厌的"},{"w":"scatter","p":"'skætә","t":"n. 消散, 分散, 散播, 散射, 散布, 酒馆; vi. 散布, 散播, 消散; vt. 使消散, 使分散, 撒, 散布, 散播, 散射; 散点图"},{"w":"forum","p":"'fɒ:rәm","t":"n. 论坛, 公开讨论的广场, 法庭, 讨论会; 讨论会, 专题讨论, 公共论坛"},{"w":"frown","p":"fraun","t":"n. 皱眉; vi. 皱眉头; vt. 皱眉表示"},{"w":"signature","p":"'signәtʃә","t":"n. 签字, 识别标志, 调号; 签名附件"}],"doc":{"k":"ESG 评级报告摘要","en":"ESG RATING SUMMARY - Rating: AAA (Leader). The issuer is assessed as a leader within a fragmented market. Governance disclosure is comprehensive; the reported safety incident rate has been nil for three consecutive years, and the localization rate of critical inputs exceeds ninety-five percent. Management's capacity expansion programme is aligned with stated decarbonisation targets, and we regard sustainability practice as a durable moat supporting share gain through the industry cycle. Bargaining power with upstream suppliers appears strong, and downstream demand within the company's total addressable market remains supportive notwithstanding the present supply glut. This assessment draws on company-reported data, third-party databases and management interviews. No plant tour was conducted. Underlying data have not been independently verified by us.","zh":"ESG 评级摘要——评级：AAA（领先）。本发行人在一个格局分散的市场中被评定为领先者。治理层面披露完整；其披露的安全事故率已连续三年为零，关键原料的国产化率超过 95%。管理层的扩产计划与其公开的脱碳目标一致，我们认为其可持续实践构成一条持久的护城河，可支撑其穿越行业周期实现份额提升。公司对上游供应商的议价能力看似强劲，尽管当前存在供给过剩，其可触达市场空间内的下游需求依然向好。本次评估依据公司自报数据、第三方数据库及与管理层的访谈。未进行实地工厂参观。相关基础数据未经我们独立核验。"}},{"i":79,"ti":"第 137 页","dom":"bank","sc":"银行授信","tx":"那家银行叫江右银行，一家城商行，总部在一个我得查地图才知道在哪的地级市。\n\n我{{click}}（点开）它最新的年报 PDF，四百二十页。银行年报是这世上最{{dull}}（枯燥）的文体之一，前一百页全是套话，我花了两个小时才翻到第 137 页。\n\n那一页讲客户集中度。前面几段都正常：单一集团客户授信余额占{{tier 1 capital}}（一级资本）的 9.6%，低于监管上限；计量口径遵循{{Basel Committee on Banking Supervision}}（巴塞尔银行监管委员会）的指引；{{capital conservation buffer}}（储备资本缓冲）完整未动用，因此分红不受限制。\n\n然后是那一句。\n\n\"本行对某单一集团客户的授信敞口，已于第四季度完成结构性调整，相关资产不再纳入本行并表范围内的信用风险计量，并已取得{{partial}}（部分的）增信安排。\"\n\n我读了四遍。措辞很{{delicate}}（微妙）：没说卖掉，没说出表，没说是谁，用的是\"结构性调整\"。这句话不像是写出来的，像是被人一个字一个字{{conceive}}（构思）出来，再{{insert}}（插入）进一段本来很平淡的文字里。前后两段的句式和它完全不是一个人的手笔。\n\n一家银行不会平白{{dedicate}}（专门辟出）半页去讲一个不点名的客户。它{{carve}}（切分）出去的是谁，我大概知道。\n\n我把这段{{extract}}（摘录）出来贴进备忘录，然后往前往后各翻五十页。\n\n这家银行的{{cost-to-income ratio}}（成本收入比）是 24.1%，低得不像一家地级市城商行——同规模的同行普遍在 32% 上下。{{non-interest income}}（非息收入）三年翻了两倍，主要来自{{fee and commission income}}（手续费及佣金收入），而这部分几乎全是代销{{wealth management product}}（理财产品）和几只{{money market fund}}（货币市场基金）拿到的分成。高管{{bonus}}（奖金）当年涨了四成，写得很{{casual}}（不经意），夹在一张表的第七行。\n\n{{liquidity coverage ratio}}（流动性覆盖率）报的是 128%。压力测试的{{adverse scenario}}（不利情景）假设 GDP 掉到 3%、房价跌两成，跑出来资本充足率只降 0.4 个百分点。\n\n更奇怪的在后面。它披露了一份完整的{{resolution plan}}（恢复与处置计划），三条路径写得清清楚楚：一是{{bail-in}}（内部纾困），由股东和次级债持有人先承担损失；二是由一家健康银行做{{purchase and assumption}}（收购承接），储户无感；再不行是{{deposit insurance}}（存款保险）基金介入。\n\n我给老周打电话，一段一段念给他听。他沉默了一会儿，说：一家真觉得自己没事的银行，不会把最后那三条写得这么细。\n\n那个客户的贷款还挂在{{special mention loan}}（关注类贷款）里，报告期内一分{{impairment charge}}（减值损失）都没提。这个说法在三份年报里{{persist}}（持续）出现，一年比一年短。\n\n授信余额那条曲线很{{steep}}（陡），三年翻了近三倍，中段还鼓出一个{{belly}}（肚子）——正好对上东亚新能源上调全年指引的那两个季度。\n\n我给他们董秘发了封邮件，两分钟后{{bounce}}（退回）回来了，邮箱不存在。年报上印的电话是空号。新来的首席风险官的{{resume}}（简历）我在别处查到一栏：上一份工作是\"某新能源材料企业财务顾问\"。上一任行长退休，他{{inherit}}（继承）了一堆存量。\n\n我有点{{panic}}（心慌）。不是怕，是发现这条线比我想的长得多。我告诉自己这只是一段话，不是什么{{riot}}（暴动）的前奏。\n\n十一点半，Danny 在群里说他{{spouse}}（配偶）问他今晚还回不回。我说你回吧。\n\n然后我往前翻，翻到资产质量那一章。\n\n不良率：1.48%、1.48%、1.47%、1.48%……我一个季度一个季度往下抄，抄到第十二个的时候，笔停住了。","ft":[{"w":"Basel Committee on Banking Supervision","z":"巴塞尔银行监管委员会","d":"制定全球银行资本和流动性监管标准的组织","a":"BCBS","p":""},{"w":"adverse scenario","z":"不利情景","d":"压力测试中假定的经济严重恶化路径","a":"","p":""},{"w":"bail-in","z":"内部纾困；自救","d":"让股东和债权人先承担损失，而不是动用财政资金","a":"","p":""},{"w":"capital conservation buffer","z":"储备资本缓冲","d":"日常必须多留的一层资本，动用后要限制分红","a":"","p":""},{"w":"cost-to-income ratio","z":"成本收入比","d":"业务及管理费除以营业收入，衡量银行经营效率","a":"CIR","p":""},{"w":"deposit insurance","z":"存款保险","d":"对一定额度内存款提供兜底，防止挤兑的制度安排","a":"","p":""},{"w":"fee and commission income","z":"手续费及佣金收入","d":"代销、结算、托管等中间业务贡献的收入，轻资本属性","a":"","p":""},{"w":"impairment charge","z":"减值损失；计提减值","d":"当期确认的资产减值金额，是利润波动的主要来源","a":"","p":""},{"w":"liquidity coverage ratio","z":"流动性覆盖率","d":"优质流动性资产能否覆盖三十天净流出，短期流动性红线","a":"LCR","p":""},{"w":"money market fund","z":"货币市场基金","d":"高度依赖短期资产的基金，跌破面值会引发赎回潮","a":"MMF","p":""},{"w":"non-interest income","z":"非息收入；中间业务收入","d":"手续费、投资收益等不靠利差赚的钱，占比越高越受青睐","a":"","p":""},{"w":"purchase and assumption","z":"收购承接","d":"由健康银行收购倒闭银行的资产和存款，储户无感","a":"P&A","p":""},{"w":"resolution plan","z":"恢复与处置计划；生前遗嘱","d":"大型银行事先制定的破产处置方案","a":"living will","p":""},{"w":"special mention loan","z":"关注类贷款","d":"还没变不良但已有风险迹象，是不良的先行指标","a":"","p":""},{"w":"tier 1 capital","z":"一级资本","d":"核心一级加其他一级，持续经营条件下的损失吸收资本","a":"","p":""},{"w":"wealth management product","z":"理财产品","d":"银行代客投资产品，曾是刚兑和期限错配的重灾区","a":"WMP","p":""}],"iw":[{"w":"delicate","p":"'delikәt","t":"a. 细致优雅的, 微妙的, 美味的; 柔弱的"},{"w":"panic","p":"'pænik","t":"n. 恐慌, 惊慌; a. 惊慌的, 没有理由的, 恐慌的; vt. 使惊慌, 使狂热; vi. 惊慌"},{"w":"spouse","p":"spauz","t":"n. 配偶"},{"w":"bonus","p":"'bәunәs","t":"n. 奖金, 红利; 奖金, 红利, 额外补贴"},{"w":"resume","p":"ri'zju:m","t":"vt. 重新开始, 取回, 恢复; vi. 再开始; n. 摘要, 个人简历; 继续执行"},{"w":"casual","p":"'kæʒjuәl","t":"a. 偶然的, 不经意的, 便装的; n. 临时工, 待命士兵"},{"w":"riot","p":"'raiәt","t":"n. 暴动, 喧闹, 放纵; vi. 发动, 暴动, 纵情, 放荡; vt. 浪费, 挥霍"},{"w":"persist","p":"pә'sist","t":"vi. 坚持, 固执, 持续, 坚称; 持续"},{"w":"inherit","p":"in'herit","t":"vt. 继承, 遗传; vi. 接受遗产"},{"w":"extract","p":"ik'strækt","t":"n. 榨出物, 精汁, 摘录, 选段; vt. (费力地)取出, 采掘, 榨取, 摘录, 吸取; 提取"},{"w":"bounce","p":"bauns","t":"n. 跳, 跳跃, 弹力, 撞击; vi. 反跳, 弹跳; vt. 使跳回, 撞击; 打回"},{"w":"steep","p":"sti:p","t":"n. 浸渍, 悬崖; a. 险峻的, 陡峭的, 急剧升降的, 夸大的; v. 浸, 泡"},{"w":"click","p":"klik","t":"n. 咔哒声, 啪嗒声; vi. 作咔哒声; vt. 使发咔哒声; 单击"},{"w":"insert","p":"in'sә:t","t":"n. 插入物; vt. 插入, 把(人造卫星)射入(轨道), 添写; vi. 附着; 插入"},{"w":"dedicate","p":"'dedikeit","t":"vt. 献出, 贡献"},{"w":"dull","p":"dʌl","t":"a. 钝的, 无趣的, 呆滞的, 阴暗的; vt. 使迟钝, 使阴暗, 缓和; vi. 变迟钝, 减少"},{"w":"carve","p":"kɑ:v","t":"v. 雕刻, 切开"},{"w":"partial","p":"'pɑ:ʃәl","t":"a. 部分的, 偏袒的, 偏爱的; n. 分音"},{"w":"belly","p":"'beli","t":"n. 腹部, 食欲; vt. 使鼓起; vi. 鼓起, 匍匐前进"},{"w":"conceive","p":"kәn'si:v","t":"vt. 构思, 认为; vi. 怀孕"}],"doc":{"k":"银行年报授信集中度段落","en":"CREDIT CONCENTRATION AND CAPITAL MANAGEMENT (extract). Aggregate exposure to the Bank's largest single group client represented 9.6% of tier 1 capital at year end, within the regulatory limit and consistent with guidance issued by the Basel Committee on Banking Supervision. Following a structural adjustment completed in the fourth quarter, part of this exposure is no longer measured within the Bank's consolidated credit risk framework. The related facilities remain classified as special mention loan balances and no impairment charge was recognised in the period. The liquidity coverage ratio stood at 128% and outcomes under the adverse scenario remained above internal thresholds. Non-interest income rose 62%, driven by fee and commission income from distribution of wealth management product and money market fund units. The Bank's resolution plan contemplates bail-in, purchase and assumption, and deposit insurance support.","zh":"授信集中度与资本管理（节录）。截至年末，本行对最大单一集团客户的合计敞口占一级资本的 9.6%，处于监管上限之内，并与巴塞尔银行监管委员会所发布的指引保持一致。在第四季度完成结构性调整后，该敞口的一部分已不再纳入本行并表信用风险计量框架。相关授信仍归类为关注类贷款余额，报告期内未确认任何减值损失。流动性覆盖率为 128%，不利情景下的测算结果仍高于内部阈值。非息收入增长 62%，主要由代销理财产品及货币市场基金份额所产生的手续费及佣金收入拉动。本行的恢复与处置计划设想了内部纾困、收购承接以及存款保险支持三种路径。"}},{"i":80,"ti":"一个基点都没动","dom":"bank","sc":"不良与拨备","tx":"十二个数字，三年，十二个季度。最高 1.48%，最低 1.47%。波动一个基点。\n\n我把它们打出来，在纸上连成一条线。那条线是平的。太{{neat}}（整齐）了，{{elegant}}（优雅）得像是画出来的，不像是量出来的。\n\n真实的{{non-performing loan}}（不良贷款）率不长这样。它会{{crawl}}（爬），会抖，会在某个季度突然跳一下，再被一笔核销压回去，然后慢慢往上爬。看一家银行的资产质量，不是{{diagnose}}（诊断）它有没有病，是看它的数字像不像活的。这句话是老周教我的。\n\n第二天一早我去他家，把纸摊在桌上。他没戴老花镜，眯着眼看了很久。\n\n\"{{allowance-to-loan ratio}}（拨贷比）呢？\"\n\n2.51%、2.51%、2.52%、2.51%。也是一条直线。拨备覆盖率 320%，一个相当{{handsome}}（可观的）数字，同行羡慕的那种。\n\n\"{{restructured loan}}（重组贷款）？\"\n\n三年涨了六倍。\n\n老周笑了一下。重组贷款的定义就是银行对借款人作出{{concession}}（让步）——展期、降息、免罚息。一家银行的让步涨六倍，不良率纹丝不动，只有两种可能：要么它的客户在让步之后真的全活了，要么这些贷款在被重新分类之前，先被{{isolate}}（隔离）走了。\n\n它去年设了{{wealth management subsidiary}}（理财子公司）。年内有一批\"非标资产\"划了过去。划过去之后，这些资产就不在银行的资产质量口径里了。它们变成{{invisible}}（无形的）——不是消失，是换了个地方待着。\n\n\"这个数是给谁看的？\"我问。\n\n\"{{cater}}（迎合）监管，也{{cater}}（迎合）储户。\"老周说，\"一个不良率三年不动的银行，网点玻璃上贴的{{poster}}（海报）就可以写'稳健'两个字，没人会来问你。\"\n\n他起身去厨房烧水，回来时手里拿着一张发黄的旧纸——二十年前他签过的一单{{engagement}}（审计业务约定）的复印件。\n\n\"资本这一块它也算得漂亮，\"他说，\"报表上{{Basel III}}（巴塞尔协议III）的每条线都过，一级资本加上{{tier 2 capital}}（二级资本）冗余很多，{{countercyclical capital buffer}}（逆周期资本缓冲）要求为零，董事会说不需要{{capital injection}}（注资）。但你要记住，资本充足和资不抵债是两回事：{{insolvency}}（资不抵债）是资产盖不住负债，{{liquidity squeeze}}（流动性紧张）是钱一时接不上。这两件事经常在同一个星期里发生，可它们不是一个东西。\"\n\n我问他，如果真出事，会从哪里先看出来。\n\n\"从最不起眼的地方。二十年前那一次，最早的信号是一家小行在{{real-time gross settlement}}（实时全额结算系统）里排队排不上，一天被退了几笔大额。三天之后才有第一笔{{deposit outflow}}（存款流失），一个月之后是{{fire sale}}（火线抛售），什么好资产都往外甩。等到有人喊{{rescue}}（救助）的时候，账已经算不清了。\"\n\n他说{{bailout}}（救助）从来不解决问题，只搬运问题，代价是{{moral hazard}}（道德风险）——这次救了，下次所有人都敢再多冒一点险。而真正难办的是{{spillover}}（风险外溢）：一家小行的事会顺着同业往外传，传到跟它体量相当的{{counterpart}}（对应机构）身上，那时候谁也说不清是谁先倒的。\n\n我站起来倒水，头有点{{swimming}}（发晕），坐太久，{{ankle}}（脚踝）都是麻的。窗外楼下那班{{shuttle}}（接驳车）刚好开走。\n\n我说我不想{{envisage}}（设想）那种场面。老周说你可以不设想，市场不会。\n\n\"你现在可以{{opt}}（选择）继续往下挖，也可以到此为止。\"他说，\"往下挖会很{{intensive}}（密集），一天十几个小时那种。{{amid}}（在……之中）这么多不确定的东西，你得抓住确定的那一条——这条线是假的。这一点我可以给你签字。\"\n\n他把纸推回来，手指点在最上面那一行。\n\n\"去看它的压力测试。结果越好看，越说明它自己知道该怕什么。\"","ft":[{"w":"Basel III","z":"巴塞尔协议III","d":"危机后出台的国际银行资本与流动性监管框架","a":"","p":""},{"w":"allowance-to-loan ratio","z":"拨贷比","d":"贷款损失准备占贷款总额的比例，监管有最低要求","a":"","p":""},{"w":"bailout","z":"救助；纾困","d":"用公共资金给濒临破产的机构注资，纳税人买单","a":"","p":"'beilaut"},{"w":"capital injection","z":"注资；补充资本","d":"股东或政府向银行补充资本金，常见于风险处置","a":"","p":""},{"w":"countercyclical capital buffer","z":"逆周期资本缓冲","d":"信贷过热时多提资本，衰退时释放，用来熨平顺周期","a":"CCyB","p":""},{"w":"deposit outflow","z":"存款流失；存款搬家","d":"储户把钱取走或转投他处，银行负债端最怕的事","a":"","p":""},{"w":"fire sale","z":"火线抛售；贱卖资产","d":"被迫低价甩卖资产回笼资金，进一步压低市场价格","a":"","p":"ˈfaiə seil"},{"w":"insolvency","z":"资不抵债","d":"资产不足以覆盖负债，与流动性危机是两回事","a":"","p":"in'sɒlvәnsi"},{"w":"liquidity squeeze","z":"流动性紧张；钱荒","d":"市场上短期资金骤然抽紧，利率飙升、融资困难","a":"","p":""},{"w":"moral hazard","z":"道德风险","d":"知道有人兜底就更敢冒险，救助政策的最大副作用","a":"","p":""},{"w":"non-performing loan","z":"不良贷款","d":"逾期或已确认难以收回的贷款，银行资产质量的核心指标","a":"NPL","p":""},{"w":"real-time gross settlement","z":"实时全额结算系统","d":"逐笔实时完成大额资金清算，降低结算风险","a":"RTGS","p":""},{"w":"restructured loan","z":"重组贷款","d":"调整期限或利率后重新安排的贷款，风险通常未真正解除","a":"","p":""},{"w":"spillover","z":"外溢效应；风险外溢","d":"风险从一个市场或国家传导到另一个的影响","a":"","p":"'spil.әuvә"},{"w":"tier 2 capital","z":"二级资本","d":"次级债等，只有在清算或处置时才吸收损失","a":"","p":""},{"w":"wealth management subsidiary","z":"理财子公司","d":"银行设立的独立理财牌照子公司，净值化转型的产物","a":"","p":""}],"iw":[{"w":"cater","p":"'keitә","t":"v. 提供饮食及服务, 投合, 迎合"},{"w":"shuttle","p":"'ʃʌtl","t":"n. 穿梭, 梭子, 往返移动之物; v. (使)穿梭移动, 往返运送"},{"w":"invisible","p":"in'vizәbl","t":"a. 看不见的, 无形的; 无形的, 表面上看不见的, 未列在公开帐目的"},{"w":"engagement","p":"in'geidʒdmәnt","t":"n. 诺言, 约会, 婚约, 交战; 衔接"},{"w":"ankle","p":"'æŋkl","t":"n. 踝; 踝, 踝关节"},{"w":"swimming","p":"'swimiŋ","t":"n. 游泳, 眩晕"},{"w":"rescue","p":"'reskju:","t":"n. 援救, 解救, 营救; vt. 援救, 救出, 营救"},{"w":"counterpart","p":"'kauntәpɑ:t","t":"n. 副本, 复本, 配对物, 相应物; 副本, 正副二份中之一"},{"w":"neat","p":"ni:t","t":"a. 整洁的, 巧妙的, 匀称的, 简洁的; n. 牛"},{"w":"amid","p":"ә'mid","t":"prep. 在其间, 在其中; 在...中"},{"w":"opt","p":"ɒpt","t":"vi. 选择"},{"w":"intensive","p":"in'tensiv","t":"a. 加强的, 内涵的, 集中的; n. 加强器"},{"w":"isolate","p":"'aisәleit","t":"vt. 使隔离, 使孤立, 使绝缘; n. 隔离种群"},{"w":"diagnose","p":"'daiәgnәuz","t":"v. 诊断"},{"w":"envisage","p":"in'vizidʒ","t":"vt. 面对, 正视, 想象"},{"w":"elegant","p":"'eligәnt","t":"a. 优雅的, 端庄的, 高雅的"},{"w":"poster","p":"'pәustә","t":"n. 海报, 招贴, 驿马"},{"w":"concession","p":"kәn'seʃәn","t":"n. 特许, 让步, 认可; 核准, 许可, 特殊(权)"},{"w":"crawl","p":"krɒ:l","t":"n. 爬行, 匍匐而行, 养鱼池; v. 爬行"},{"w":"handsome","p":"'hænsәm","t":"a. 英俊的, 大方的, 慷慨的, 相当可观的, 美观的, 灵敏的"}],"doc":{"k":"银行年报资产质量段落","en":"ASSET QUALITY (extract). The non-performing loan ratio was 1.48% at year end, unchanged from the two preceding reporting periods. The allowance-to-loan ratio stood at 2.51% and provision coverage at 320%. Restructured loan balances increased, reflecting concessions granted to borrowers in cyclical sectors; such exposures are not automatically downgraded where repayment is assessed as probable. Certain non-standard assets were transferred to the Bank's wealth management subsidiary during the year. Capital ratios remain above Basel III minima following inclusion of tier 2 capital instruments, and the countercyclical capital buffer requirement is nil. The Board considers the Bank's position robust and no capital injection is contemplated. Management notes no deposit outflow, no liquidity squeeze and no fire sale of assets during the period.","zh":"资产质量（节录）。截至年末，不良贷款率为 1.48%，与此前两个报告期持平。拨贷比为 2.51%，拨备覆盖率为 320%。重组贷款余额有所上升，反映本行对周期性行业借款人作出的让步；在还款被评估为很可能实现的情况下，此类敞口不会自动下调分类。年内，部分非标资产已划转至本行理财子公司。在计入二级资本工具后，各项资本比率仍高于巴塞尔协议III的最低要求，逆周期资本缓冲要求为零。董事会认为本行状况稳健，不考虑进行注资。管理层注意到，报告期内未发生存款流失、流动性紧张或资产的火线抛售。"}},{"i":81,"ti":"假设渠道保持通畅","dom":"bank","sc":"资本充足与压力测试","tx":"我在早上七点四十的{{pavement}}（人行道）上点开了那份压力测试报告，雨顺着伞骨往手背上流。\n\n老周昨晚那句话还在耳朵里：结果越好看，越说明它自己知道该怕什么。他是我的{{tutor}}（导师），三十年审计，从不轻易下断语。\n\n这家城商行官网首页是一只展翅的{{eagle}}（鹰），底下写着稳健经营二十六年。报告挂在投资者关系栏，十九页，叫《内部资本充足评估初步结果》。把\"{{preliminary}}（初步的）\"写进标题，本身就是一句留后路的话。\n\n进办公室时衬衫下摆已经{{damp}}（潮湿的）了。\n\n第七页有一张{{diagram}}（图表）。三根{{vertical}}（垂直的）柱子并排立着，分别是基准、轻度、重度情景下的核心一级资本充足率，一根比一根矮一点点。重度情景假设经济增速掉到 2.1%、房价跌三成、失业率翻倍——在那样一个世界里，它的资本充足率也只从 9.8% 降到 9.1%。\n\n监管红线是 7.5%。\n\n做过这个测算的人都知道，重度情景里最先塌的不是资本，是利润：{{loan loss provision}}（贷款损失准备）要一次性打足，{{credit cost}}（信用成本）瞬间跳上去，先吃光利润再咬资本。而它这张表里，三年累计{{charge-off}}（核销）只多了 47 亿。\n\n47 亿，对两万亿资产的银行是个很{{fancy}}（讲究的）数字：大到显得诚实，小到不影响结论。\n\n中午我改签了高铁，下午三点到它总部。大堂立着一尊铜{{statue}}（雕像），刻着\"实业兴邦\"。{{elevator}}（电梯）里挤了十几个来开中期业绩说明会的卖方。进楼时人行道边停着一辆{{ambulance}}（救护车），没鸣笛；两个半小时后散会，它还在。\n\n会开得很顺。行长在任十一年，这十一年的{{reign}}（当政）里总资产从三千亿做到两万亿，他讲的第一个词就是{{balance sheet growth}}（扩表）。PPT 第九页拿自己和三家同省同业做{{parallel}}（并列的）对比，{{return on assets}}（总资产收益率）0.92%，全省第一。\n\n提问环节第三个举手的是我认识的一位固收分析师。他只问两句：贵行{{wholesale funding}}（同业负债）占计息负债多少；重度情景下续作假设是什么。\n\n台上停了两秒。副行长说，占比\"在监管要求以内\"，压力情景下\"假设同业融资渠道保持通畅\"。\n\n他又追一句，语气不客气，跟台上小小地{{clash}}（起了冲突）。主持人打圆场，说这问题\"不在今天议程的{{sphere}}（范围）之内\"。副行长最后{{concede}}（承认）了半句：个别客户确实有压力。\n\n散场时一个多年没见的同行给了我一个{{hug}}（拥抱），说你怎么也来了。我说随便看看。\n\n假设同业融资渠道保持通畅——那这份压力测试压的到底是什么？杀死一家银行的从来不是资产慢慢烂，是{{interbank market}}（银行间市场）在一个星期里对你关门。我的{{instinct}}（直觉）很明确：这张表把最危险的那个变量当成了常数。\n\n晚上给老周打电话。他讲了三件事。\n\n第一，{{five-tier loan classification}}（五级分类）是银行自己分的，算关注还是次级常常是一支笔的事；国际口径叫{{stage 3 loan}}（第三阶段贷款），两者能差出一倍。\n\n第二，处置的路子就那么几条。美国是{{Federal Deposit Insurance Corporation}}（美国联邦存款保险公司）周五收市接管，周一换块牌子开门；不够格叫{{too big to fail}}（大而不倒）的小银行，说倒就倒。国内是先把坏账剥给{{asset management company}}（资产管理公司），代价是打折卖；再往下是{{recapitalisation}}（资本重组），股东和财政一起补资本；最后才轮到{{nationalisation}}（国有化）。\n\n第三，{{discount window}}（贴现窗口）那种救急渠道，真缺钱的银行反而最后一个去——去了等于承认缺钱，第二天没人跟你拆借。\n\n我问他，这十九页为什么一个字都没提理财。\n\n\"它当然不提，\"老周说，\"{{off-balance-sheet exposure}}（表外敞口）不进这张表。压力测试测的是表内，可风险住在表外那些{{entity}}（实体）里。\"\n\n挂了电话，我把那三根柱子重画一遍，旁边写了一行：它测的是它不怕的那一部分。\n\n然后我打开它理财子公司的产品页。在售，1,412 只。这家银行对规模的{{pursuit}}（追求），原来还有一整块我从来没看过。","ft":[{"w":"Federal Deposit Insurance Corporation","z":"美国联邦存款保险公司","d":"为美国银行存款提供保险并负责接管处置的机构","a":"FDIC","p":""},{"w":"asset management company","z":"资产管理公司；四大AMC","d":"专门收购处置银行不良资产的机构，如信达、华融","a":"AMC","p":""},{"w":"balance sheet growth","z":"扩表；规模扩张","d":"总资产增速，规模驱动是中资银行盈利的重要来源","a":"","p":""},{"w":"charge-off","z":"核销；冲销","d":"欧美银行的说法，指把坏账从账面上冲掉","a":"","p":"t'ʃɑ:dʒ'ɔ:f"},{"w":"credit cost","z":"信用成本","d":"当期计提的信用减值除以贷款余额，直接吃掉利润","a":"CoR","p":""},{"w":"discount window","z":"贴现窗口","d":"银行向央行抵押融资的常规救急渠道，用了怕被贴标签","a":"","p":""},{"w":"five-tier loan classification","z":"五级分类","d":"正常、关注、次级、可疑、损失，中国的贷款质量分类口径","a":"","p":""},{"w":"interbank market","z":"银行间市场","d":"银行之间融通短期资金的市场，是流动性传导的枢纽","a":"","p":""},{"w":"loan loss provision","z":"贷款损失准备；拨备","d":"为可能收不回的贷款预先计提的准备金，直接冲减利润","a":"","p":""},{"w":"nationalisation","z":"国有化","d":"政府直接持股接管银行，危机时的极端手段","a":"","p":",næʃәnәlai'zeiʃәn; -li'z-"},{"w":"off-balance-sheet exposure","z":"表外敞口","d":"不体现在资产负债表上的风险，出事时往往要回表","a":"","p":""},{"w":"recapitalisation","z":"资本重组；再资本化","d":"通过增资或转股修复资本充足率的整体安排","a":"","p":""},{"w":"return on assets","z":"总资产收益率","d":"净利润除以平均总资产，剔除杠杆看资产盈利能力","a":"ROA","p":""},{"w":"stage 3 loan","z":"第三阶段贷款","d":"已发生信用减值的贷款，大体对应不良口径","a":"","p":""},{"w":"too big to fail","z":"大而不倒","d":"规模太大不能让其倒闭，倒逼政府出手救助","a":"TBTF","p":""},{"w":"wholesale funding","z":"批发融资；同业负债","d":"靠同业和市场融资而非存款，成本敏感且容易被抽走","a":"","p":""}],"iw":[{"w":"tutor","p":"'tju:tә","t":"n. 家庭教师, 导师, 助教, 监护人; vt. 当...的教师, 教, 指导, 约束, 克制; vi. 当家庭教师, 受家庭教师的指导"},{"w":"instinct","p":"'instiŋkt","t":"n. 本能, 直觉; a. 充满着的"},{"w":"damp","p":"dæmp","t":"n. 潮湿, 湿气; a. 潮湿的; vt. 使潮湿, 使阻尼, 抑止; vi. 变潮湿, 衰减"},{"w":"eagle","p":"'i:gl","t":"n. 鹰, 鹰状标饰"},{"w":"preliminary","p":"pri'liminәri","t":"n. 初步做法, 初步措施, 预试, 预选赛; a. 初步的, 开始的, 预备的"},{"w":"diagram","p":"'daiәɡræm","t":"n. 图表；图解"},{"w":"vertical","p":"'vә:tikl","t":"a. 垂直的, 直立的; 垂直的, 顶的, 头顶的"},{"w":"hug","p":"hʌg","t":"n. 紧抱, 拥抱; vt. 紧抱, 坚持, 使沾沾自喜"},{"w":"fancy","p":"'fænsi","t":"n. 想象力, 幻想, 喜好; a. 想象的, 精美的, 新奇的, 奇特的, 高价的, 特级的; vt. 想象, 设想, 相信, 喜爱; vi. 想象, 幻想"},{"w":"ambulance","p":"'æmbjulәns","t":"n. 救护车; 救护车"},{"w":"pavement","p":"'peivmәnt","t":"n. 路面, 人行道, 铺面路, 铺路材料"},{"w":"concede","p":"kәn'si:d","t":"vt. 承认, 退让; vi. 让步"},{"w":"sphere","p":"sfiә","t":"n. 球, 球面, 球体, 天体, 地球仪, 范围; vt. 包围, 使成球体, 放入球内"},{"w":"reign","p":"rein","t":"v. 为王，为君；当政；统治; n. 为王，为君；当政；统治"},{"w":"parallel","p":"'pærәlel","t":"n. 平行, 对比, 相匹敌之物; a. 平行的, 相似的; vt. 与...平行, 与...相似, 相比, 使平行; 并联; 并行"},{"w":"elevator","p":"'eliveitә","t":"n. 电梯, 升降机; 提升机"},{"w":"statue","p":"'stætju","t":"vt. 以雕像装饰; n. 雕像"},{"w":"clash","p":"klæʃ","t":"n. 冲突, 撞击声, 抵触; vi. 冲突, 抵触; vt. 使发出撞击声; 对撞"},{"w":"pursuit","p":"pә'sju:t","t":"n. 追踪, 追求, 追赶, 娱乐, 职业; 追捕, 追求"},{"w":"entity","p":"'entiti","t":"n. 实体, 实存物, 存在; 实体"}],"doc":{"k":"压力测试结果披露段落","en":"INTERNAL CAPITAL ADEQUACY ASSESSMENT - PRELIMINARY RESULTS (extract). Under the severe adverse scenario, the Bank's common equity ratio declines from 9.8% to 9.1% and remains above regulatory minima throughout the three-year horizon. Cumulative charge-off of RMB 4.7bn is assumed, with loan loss provision charges lifting credit cost to 89 basis points in year two. Return on assets remains positive in each projected year. Migration under the five-tier loan classification is assumed to be orderly, and no additional stage 3 loan formation is projected beyond the modelled path. The scenario further assumes continued access to the interbank market and to wholesale funding at spreads not exceeding 120 basis points. Off-balance-sheet exposure of the Bank's wealth management subsidiary falls outside the scope of this exercise. No recapitalisation is contemplated.","zh":"内部资本充足评估——初步结果（节录）。在重度不利情景下，本行核心一级资本充足率由 9.8% 降至 9.1%，在三年测算期内始终高于监管最低要求。测算假设三年累计核销人民币 47 亿元，贷款损失准备的计提使第二年的信用成本升至 89 个基点。各测算年度的总资产收益率均保持为正。五级分类下的贷款迁徙假设为有序迁徙，除模型既定路径外，不再预计新增第三阶段贷款。情景还假设本行可持续获得银行间市场资金，并以不超过 120 个基点的利差取得同业负债。本行理财子公司的表外敞口不在本次测算范围之内。本行不考虑进行资本重组。"}},{"i":82,"ti":"1,412 只","dom":"bank","sc":"表外与影子银行","tx":"1,412 只在售理财产品。我用四个晚上看完了其中 106 只。\n\n{{starting}}（起点）是一个很
