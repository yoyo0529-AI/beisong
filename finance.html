<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="对手盘">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6df6'/%3E%3Cpath d='M14 44 L26 30 L36 38 L50 20' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>对手盘 · 金融英语</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#f5f6f8;color:#1c1d20;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
#app{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
h1{font-size:21px;margin:0 0 2px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:#8b8f98;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:#eceef1;color:#1c1d20;transition:background .15s}
button:hover{background:#e2e5e9}
button:disabled{opacity:.45;cursor:default}
.btn-primary{background:#2f6df6;color:#fff}
.btn-primary:hover{background:#215ada}
.btn-ghost{background:transparent;color:#6a6f78;padding:8px 10px}
.btn-ghost:hover{background:#eceef1}
.btn-sm{padding:6px 12px;font-size:14px;border-radius:8px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#eceef1;color:#6a6f78}
.pill.due{background:#fdecec;color:#c33}
.pill.new{background:#e8f0fe;color:#2f6df6}
.pill.ok{background:#e6f6ec;color:#1f8a4c}
.bar{height:8px;border-radius:99px;background:#eceef1;overflow:hidden}
.bar>i{display:block;height:100%;background:#2f6df6;transition:width .3s}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f1f3;cursor:pointer}
.task:last-child{border-bottom:none}
.task:hover{background:#fafbfc}
.task .ttl{flex:1;min-width:0}
.task .ttl b{font-weight:600}
.task .ttl div{font-size:13px;color:#8b8f98;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en{font-size:20px;line-height:1.75;letter-spacing:.1px}
.en .kw{border-bottom:2px solid #ffd98a;cursor:pointer;padding-bottom:1px}
.en .kw:hover{background:#fff6e0}
.zh{color:#454a52;margin-top:10px}
.struct{margin-top:12px;padding:12px 14px;background:#f7f8fa;border-radius:10px;font-size:14px;color:#5a5f68;line-height:1.8}
.wlist{margin-top:6px}
.witem{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f2f3f5;align-items:baseline}
.witem:last-child{border-bottom:none}
.witem .w{font-weight:600;min-width:130px}
.witem .ph{color:#a0a4ac;font-size:13px;min-width:120px}
.witem .t{flex:1;color:#454a52;font-size:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;padding:13px 16px;background:#f7f8fa;border:1.5px solid transparent;line-height:1.5}
.opt:hover{background:#eef1f5}
.opt.right{background:#e6f6ec;border-color:#43b26f;color:#136c39}
.opt.wrong{background:#fdecec;border-color:#e28b8b;color:#a33}
.quiz-w{font-size:30px;font-weight:600;text-align:center;margin:14px 0 4px;word-break:break-word}
.quiz-ph{text-align:center;color:#a0a4ac;font-size:14px;margin-bottom:4px}
.quiz-t{font-size:22px;text-align:center;margin:16px 0;line-height:1.6}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border:1.5px solid #dfe2e7;border-radius:10px;background:#fff;outline:none}
input[type=text]:focus{border-color:#2f6df6}
input[type=number]{font:inherit;width:88px;padding:8px 10px;border:1.5px solid #dfe2e7;border-radius:8px;outline:none}
.hint{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;letter-spacing:5px;text-align:center;margin:12px 0;color:#8b8f98}
.hint b{color:#1f8a4c;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{padding:8px 13px;background:#f0f2f5;border-radius:8px;font-size:15px;cursor:pointer;user-select:none}
.tile:hover{background:#e3e7ec}
.tile.used{opacity:.25;pointer-events:none}
.built{min-height:56px;padding:12px 14px;background:#f7f8fa;border-radius:10px;line-height:2;font-size:17px}
.built .ok{color:#1c1d20}
.shake{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gates{display:flex;gap:8px;margin-bottom:14px}
.gate{flex:1;text-align:center;font-size:13px;padding:8px 4px;border-radius:9px;background:#eceef1;color:#8b8f98}
.gate.on{background:#2f6df6;color:#fff}
.gate.done{background:#e6f6ec;color:#1f8a4c}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;line-height:1.9;word-break:break-word}
.diff .g{color:#1f8a4c}
.diff .b{color:#c33;text-decoration:line-through}
.diff .m{color:#c33;background:#fdecec;border-radius:3px;padding:0 3px}
.mini{font-size:13px;color:#8b8f98;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ucell{padding:10px;border-radius:9px;background:#f7f8fa;cursor:pointer;font-size:13px;line-height:1.4}
.ucell:hover{background:#eef1f5}
.ucell b{display:block;font-size:14px}
.ucell.cleared{background:#e6f6ec}
.ucell.doing{background:#e8f0fe}
textarea{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;width:100%;height:110px;padding:10px;border:1.5px solid #dfe2e7;border-radius:10px;outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c1d20;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.94}
@media(max-width:520px){
  #app{padding:12px}
  .card{padding:15px}
  .en{font-size:18px}
  .witem{flex-wrap:wrap;gap:4px 10px}
  .witem .w{min-width:0}
  .witem .ph{min-width:0}
  .witem .t{flex-basis:100%}
}

/* ---- 故事版追加样式 ---- */
.chtitle{font-size:20px;line-height:1.5;margin:0 0 4px}
.tb{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.story{margin-top:16px;font-size:17px;line-height:2.05;color:#22242a}
.story p{margin:0 0 16px}
.story .inw{color:#1f4fbf;font-weight:600;cursor:pointer;padding:0 1px}
.story .inw:hover{background:#e8f0fe;border-radius:3px}
.story .gloss{color:#c2557a;font-size:14px}
.ctx{margin:14px 0 4px;padding:12px 14px;background:#f7f8fa;border-radius:10px;font-size:15px;line-height:1.95;color:#5a5f68}
.ctx .inw{color:#1f4fbf;font-weight:600}
.ctx .hl{color:#c2557a;font-weight:700;background:#fdeef3;border-radius:3px;padding:0 3px}
.witem.bad .w{color:#c33}
.witem.bad{background:#fff8f8}
@media(max-width:520px){.story{font-size:16px;line-height:1.95}.chtitle{font-size:18px}}

/* ---- 金融版追加样式 ---- */
.witem.fin{display:block;padding:11px 0}
.ftop{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.ftop .w{font-weight:600;min-width:0;color:#0f3d8a}
.ftop .zh2{color:#1c1d20;font-size:15px}
.abbr{font-size:11px;font-weight:700;letter-spacing:.5px;background:#e8f0fe;color:#2f6df6;padding:2px 6px;border-radius:5px}
.fdesc{margin-top:4px;font-size:13.5px;color:#6a6f78;line-height:1.65}
.quiz-w.fin{font-size:26px;color:#0f3d8a}
.mini2{text-align:center;font-size:13.5px;color:#8b8f98;margin:-4px 0 10px;line-height:1.6}
.doc{margin-top:12px;padding:16px 18px;background:#f7f8fa;border-left:3px solid #2f6df6;border-radius:0 10px 10px 0;font:15.5px/1.85 ui-monospace,SFMono-Regular,Menlo,Consolas,"Segoe UI",sans-serif;color:#22242a}
.doc .inw{color:#0f3d8a;font-weight:700;background:#e8f0fe;border-radius:3px;padding:0 2px}
.docz{margin-top:12px;padding:14px 16px;background:#fff8f0;border-radius:10px;font-size:14.5px;line-height:1.9;color:#5a5f68}
.tb{max-width:52%}
@media(max-width:520px){.doc{font-size:14.5px;padding:13px 14px}.ftop .zh2{font-size:14px}}

/* ---- 手机端 ---- */
body{-webkit-text-size-adjust:100%;padding-bottom:max(40px,env(safe-area-inset-bottom))}
#app{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
input,textarea{font-size:16px}  /* 防止 iOS 聚焦时自动放大 */
@media(max-width:520px){
  #app{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .gates{gap:5px}
  .gate{font-size:11.5px;padding:7px 2px;letter-spacing:-.2px}
  .opt{padding:14px 15px}
  button{padding:11px 15px}
  .btn-sm{padding:8px 12px}
  .quiz-w{font-size:25px}
  .quiz-w.fin{font-size:21px}
  .quiz-t{font-size:19px}
  .hint{font-size:22px;letter-spacing:4px}
  .row.wrap{gap:8px}
  .tb{max-width:46%;font-size:14px}
}

</style>
</head>

<script>
var DATA = [{"i":1,"ti":"对方报的产能数字，我当场就愣住了","dom":"industry","sc":"工厂与产能","tx":"展会最后一天下午，三号馆的空调已经不太行了，我站在东亚新能源的展台边上，手里那杯冰美式化成了糖水。\n\n早上的开幕式我是从头听到尾的。地方行业{{council}}（理事会）请了一位{{minister}}（部长）来剪彩，讲了二十分钟{{carbon neutrality}}（碳中和）和产业升级，台下掌声很整齐。这种场合的{{political}}（政治的）意味我懂，也不反感——补贴、能耗指标、审批，哪一样不落在这上头。真正让我留下来的，是展台后面那块滚动的屏。\n\n屏上是他们的产能规划：三条线，年内满产，年化{{shipment volume}}（出货量）四万八千吨。\n\n我把这个{{figure}}（数字）记进手机的时候，手指顿了一下。\n\n来接待我的那个{{guy}}（家伙）姓吴，市场总监，名片印得很厚。他讲得非常顺，一听就是这套{{program}}（说辞方案）已经讲过几十遍。他说他们的{{order visibility}}（订单能见度）排到了明年二季度；头部客户都签了{{long-term agreement}}（长协），价格机制锁死，另有{{rebate}}（返利）按提货量返；他们刚过了两家海外客户的{{sample validation}}（送样验证），下一步就要进人家的{{dual sourcing}}（二供导入）名单；整个行业的{{green shoots}}（复苏迹象）已经冒出来了。\n\n我一句都没打断，只是在心里跑另一套{{system}}（体系）。\n\n我们上个月刚做完一轮{{dealer survey}}（经销商调研），访了十九家中游和贸易商，拿回来的{{inventory days}}（库存天数）平均是九十一天，比去年同期长了三成。整个{{competitive landscape}}（竞争格局）里，二线厂商的开工率没有一家过七成。他嘴里的那个数，跟我手上那张表不在同一个世界里。\n\n于是我问了一个很土的问题：三条线全开，一个月大概用多少电。\n\n他愣了半秒，说这个要问生产口。\n\n我笑笑说没事。因为{{power consumption data}}（用电量数据）是我这两年最偏爱的一{{type}}（类）证据——它不由公司的口径决定，{{local}}（当地的）供电部门每个月都在公布，工业口径还能拆到区。那个增长{{rate}}（速度）不会说谎。回酒店我就查了他们园区所在区的月度工业用电，同比只增了个位数。三条线满产要多少度电，其实不需要多复杂的{{process}}（推算过程），拿{{bill of materials}}（物料清单）和单吨能耗一乘就出来了，缺口是好几{{million}}（百万）度。\n\n隔壁展台在卖储能软件，我一个覆盖互联网的同事在那边站台，他张口闭口{{monthly active users}}（月活跃用户），我们平时互相听不懂。但那天我们在同一个{{subject}}（话题）上达成了一致：任何一家公司，只要它披露的运营指标和它必须付出的成本对不上，它的{{unit economics}}（单位经济模型）就一定是编出来的。\n\n回程的高铁上，我翻完了他们去年的{{sustainability report}}（可持续发展报告）。{{ESG}}（环境、社会与治理）评级 AA，能耗和排放那一章写得极漂亮，图做得比正文还好看，评级机构给的{{view}}（评价）是\"行业领先\"。而我关心的只有一件事：如果那三条线根本没有满负荷转过，那些设备的{{recoverable amount}}（可收回金额）到底该怎么算。\n\n这已经不是一个{{effect}}（结果）好不好看的问题，这是一个{{case}}（案子）的开头。\n\n那天晚上我给 Ray 发了条微信，只有一句：有个票，你可能有兴趣。他半小时后回：什么{{issue}}（问题）。\n\n我盯着屏幕想了想，打了两个字：产能。\n\n我没告诉他的是，我脑子里已经在转另一件事——一家公司要把这样一个故事撑住，需要多少人配合。它的供应商、它的客户、它所在的那个{{community}}（社区）、还有在批文上盖章的那个{{authority}}（主管部门）。这么大的{{power}}（力量）不可能凭空冒出来。\n\n第二天早上进办公室，我做的第一件事，是把它上市以来所有的公告下载了一遍。","ft":[{"w":"ESG","z":"环境、社会与治理","d":"评估公司非财务风险的框架，外资机构决策时权重较高","a":"ESG","p":""},{"w":"bill of materials","z":"物料清单；BOM 成本","d":"一台产品所需全部零件及其成本明细，拆成本时的起点","a":"BOM","p":""},{"w":"carbon neutrality","z":"碳中和","d":"净排放降到零的长期目标，重塑高耗能行业的成本结构","a":"","p":""},{"w":"competitive landscape","z":"竞争格局","d":"行业里有几家玩家、各自份额多少以及竞争烈度如何","a":"","p":""},{"w":"dealer survey","z":"经销商调研","d":"批量访谈经销商了解库存、动销和价格，草根调研的常规动作","a":"","p":""},{"w":"dual sourcing","z":"双供应商；二供导入","d":"客户同时引入两家供应商，既保供也压价","a":"","p":""},{"w":"green shoots","z":"复苏迹象","d":"下行周期里出现的零星回暖信号，管理层常用来暗示见底","a":"","p":""},{"w":"inventory days","z":"库存天数","d":"现有库存按当前销售速度能卖多少天，越高说明积压越重","a":"DIO","p":""},{"w":"long-term agreement","z":"长协；长单","d":"约定多年供货量和定价机制的合同，上游资源品常见","a":"LTA","p":""},{"w":"monthly active users","z":"月活跃用户","d":"一个月内使用过产品的去重用户数，平台规模的基础口径","a":"MAU","p":""},{"w":"order visibility","z":"订单能见度","d":"公司能看清未来几个月的订单情况，业绩会高频用词","a":"","p":""},{"w":"power consumption data","z":"用电量数据","d":"工业用电量变化可近似反映开工和产量，月度高频可得","a":"","p":""},{"w":"rebate","z":"返利","d":"按销量或回款返还给渠道的补贴，是变相调价手段","a":"","p":"ri'beit"},{"w":"sample validation","z":"送样验证","d":"把样品送给客户测试，通过后才可能转入批量供货","a":"","p":""},{"w":"shipment volume","z":"出货量","d":"当期实际发出的产品数量，多数制造业月度跟踪的核心量","a":"","p":""},{"w":"sustainability report","z":"可持续发展报告","d":"披露环境与社会表现的年度报告，与年报同期发布","a":"","p":""},{"w":"unit economics","z":"单位经济模型","d":"单个产品或单个用户是否赚钱，新业务能否跑通的关键","a":"","p":""},{"w":"recoverable amount","z":"可收回金额","d":"公允价值减处置费用与使用价值两者中的较高者","a":"","p":""}],"iw":[{"w":"system","p":"'sistәm","t":"n. 系统, 体系, 制度, 方式, 秩序, 分类原则; 系统; 体制; 体系"},{"w":"case","p":"keis","t":"n. 情形, 情况, 箱, 容器, 事实, 病例, 案例, 框子; vt. 装箱, 包盖"},{"w":"local","p":"'lәukәl","t":"a. 地方性的, 当地的, 局部的, 乡土的, 本地的; n. 当地居民, 本地新闻, 局部; 本地的; 局部"},{"w":"program","p":"'prәugræm","t":"n. 节目, 节目单, 程序, 纲要, 大纲, 计划; vt. 规划, 拟...计划; vi. 安排节目, 编程序; 程序"},{"w":"million","p":"'miljәn","t":"n. 百万, 无数; num. 百万"},{"w":"power","p":"'pauә","t":"n. 力, 体力, 力量, 势力, 动力, 权力, 强国, 乘方, 强度, 幂, 功率; vt. 使...有力量, 供以动力, 激励; 乘幂; DOS外部命令:能控制许多电池电源计算机上的电源管理特性"},{"w":"issue","p":"'isju","t":"n. 发行, 问题, 后果, 流出, 出口, 争端; vi. 发行, 流出, 造成...结果, 传下; vt. 使流出, 放出, 发行, 发布, 发给"},{"w":"council","p":"'kaunsәl","t":"n. 会议, 委员会; 委员会"},{"w":"effect","p":"i'fekt","t":"n. 结果, 影响, 效果, 印象; vt. 实行, 引起, 完成; 效果"},{"w":"political","p":"pә'litikl","t":"a. 政治的, 政治上的, 政党的, 从事政治的; 政治的, 政治上的, 党派政治的"},{"w":"authority","p":"ɒ:'θɒriti","t":"n. 权力, 当权者, 当局, 权威, 专家; 代理权, 授权, 权威"},{"w":"minister","p":"'ministә","t":"n. 部长, 牧师, 公使; vi. 服侍, 救助, 主持宗教仪式"},{"w":"community","p":"kә'mju:niti","t":"n. 社区, 公众, 共有, 共同体; 公众, 共有, 社会"},{"w":"rate","p":"reit","t":"n. 比率, 率, 速度, 价格, 费用, 等级; vt. 估价, 认为, 鉴定等级, 责骂; vi. 被评价, 责骂"},{"w":"view","p":"vju:","t":"n. 视野, 风景, 见解, 视力, 观看, 视图, 指望, 意图, 印象; vt. 看, 考虑, 视察, 查看, 估量; 视图"},{"w":"figure","p":"'figә","t":"n. 数字, 价格, 图形, 形状; vt. 描绘, 表示, 演算, 认为; vi. 计算, 出现, 估计"},{"w":"process","p":"'prɒses","t":"n. 程序, 进行, 过程; vt. 加工, 使...接受处理, 对...处置, 对...起诉; a. 经加工的, 有特殊光效的; 进程"},{"w":"type","p":"taip","t":"n. 类型, 样式, 典型, 榜样, 标志, 符号, 型, 式; vi. 打字; vt. 作为代表, 测定类型, 用打字机打; 类型; 键入; DOS内部命令:在屏幕上显示指定文件的内容"},{"w":"subject","p":"'sʌbdʒekt","t":"n. 科目, 主题, 臣民, 主语, 题目, (事物的)经受者, 学科, 受治疗者, 原因, 理由; a. 服从的, 易患...的, 隶属的, 受支配的; adv. 在...条件下; vt. 使隶属, 使受到; 主题, 主体"},{"w":"guy","p":"gai","t":"n. 家伙, 支索; vt. 用支索撑住, 取笑, 嘲弄; vi. 逃跑"}],"doc":{"k":"卖方研报摘要","en":"We initiate coverage of Orient Kinetic Materials (2318.HK) with an Outperform rating and a target price of HK$46. Management guides to annualised shipment volume of 48,000 tonnes by year-end, supported by three lines ramping towards full utilisation. Order visibility now extends into the second quarter of next year, with the top five customers covered by long-term agreement pricing and volume-linked rebate arrangements. Two overseas platforms have completed sample validation, and the company expects inclusion in their dual sourcing lists. Within a consolidating competitive landscape, we expect unit economics to improve as scale builds. The latest sustainability report and an AA ESG rating should further support institutional ownership. Key risks: slower certification, raw material volatility, and our own dealer survey pointing to elevated inventory days across the channel.","zh":"我们首次覆盖东亚新能源材料（2318.HK），给予跑赢大市评级，目标价 46 港元。管理层指引年底年化出货量达到 4.8 万吨，由三条产线爬坡至满产支撑。订单能见度目前已延伸至明年二季度，前五大客户均已被长协定价和与提货量挂钩的返利安排所覆盖。两家海外平台客户已完成送样验证，公司预计将被纳入其二供导入名单。在持续集中的竞争格局中，我们预计随着规模扩大，其单位经济模型将得到改善。公司最新的可持续发展报告以及 AA 级 ESG 评级，应会进一步支撑机构持仓。主要风险：认证进度慢于预期、原材料价格波动，以及我们自己的经销商调研所显示的渠道库存天数偏高。"}},{"i":2,"ti":"上游给不出这么多料","dom":"industry","sc":"产业链与上游","tx":"我用了两天，把它上游的账倒着算了一遍。\n\n方法很笨。高镍正极要吃两样东西：锂盐和三元前驱体。一吨正极大概要多少碳酸锂当量、多少前驱体，这是化学，不是{{management}}（管理层）能商量的事。我把它披露的年产能乘回去，得出它一年需要的{{upstream}}（上游）原料量，再去数——全国有资格给它供货的前驱体厂，一共就那么几家。\n\n数据源有三个。一个是总部在{{Britain}}（英国）的一家化工咨询公司的产能数据库，我们{{department}}（部门）每年花不少钱订它；一个是各家上市公司自己的公告；第三个最土，我给每家厂的销售挨个打电话。\n\n第一家的销售很客气，说去年做了一轮{{debottlenecking}}（打通瓶颈提产），老线改完产量提了 12%，但今年不打算再扩，因为下游{{soft demand}}（需求疲软）。第二家更直接，说整个行业早就{{overcapacity}}（产能过剩）了，他们那个{{greenfield project}}（新建产能项目）在江西挖了个坑就停工，环评卡在{{carbon peaking}}（碳达峰）指标上，{{scope 1 emissions}}（范围一排放）超了地方给的盘子。第三家的{{staff}}（工作人员）在电话里直叹气，说现在谁上量谁亏，只有真跑出{{economies of scale}}（规模效应）的那两家还有口气。\n\n我把这些数加起来。全行业能供给它的量，不到它宣称需求量的六成。\n\n六成。这不是误差，这是缺口。\n\n周一晨会，研究部把各人这个{{stage}}（阶段）的进展过一遍。覆盖消费的同事在讲他的连锁品牌，季度{{net store openings}}（净开店数）三十七家，靠{{premiumization}}（高端化）把{{blended ASP}}（综合均价）拉了 9%，线上{{conversion rate}}（转化率）还在往上走；覆盖能源的同事在骂{{refining margin}}（炼油毛利）被原油打崩。轮到我，我只说了一件事：一家公司说它要吃掉这个行业六成的原料，而这个行业根本没有这么多东西给它吃。\n\nRay 坐在后排，全程没出声。他问的第一个问题是：它的{{R&D pipeline}}（研发管线）呢，有没有可能换了路线，少吃锂。\n\n我说查过了，专利和送样口径还是常规高镍，没有旁门。而且它对下游反复强调的恰恰是{{switching cost}}（转换成本）低、随时可以顶替二供——一个真有技术优势的{{product}}（产品）不会这么卖。\n\n他点头说继续，又补一句：别急着下结论，现在整个板块有{{macro overhang}}（宏观压制），需求本来就差，你要分清哪些是行业的问题，哪些是这家公司的问题。这是个很{{economic}}（经济上的）的提醒，也是个很稳的提醒。\n\n散会后我去翻它两年前那笔收购。它买了一家小前驱体厂，对价十一亿，{{purchase price allocation}}（收购价格分摊）做得很有意思：可辨认净资产只认了三亿，剩下八亿全塞进商誉，附注里那一{{section}}（部分）只有六行字。被收购方的{{former}}（从前的）总经理，交割完第二年就走了。这笔交易还{{involve}}（牵涉）了一家我没查到底细的中间方。\n\n我又拉了它的{{inventory turns}}（库存周转次数）：披露值是一年 8.4 次，行业里做得最好的那家才 5.1 次。一个买不到足够原料的公司，库存周转比谁都快——除非它的库存从来没真正进过厂。\n\n真正让我在椅子上坐直的，是一条不起眼的{{evidence}}（证据）。江西那个基地隔壁的前驱体厂，{{union}}（工会）在本地论坛贴了一份倒班表，说三季度只排两班。而东亚新能源同一时间在招聘网站上挂的是四班三倒，招 600 人。同一个工业园，同样的{{material}}（原料）供应半径，两家公司过着两种日子。\n\n行业协会那个{{committee}}（委员会）在展会期间办过一场{{event}}（活动），会刊里印了各家的产能表。我把那张表拍下来，和公告口径对了一遍，谁的话能被别人{{support}}（支撑），谁的话只有自己在说，一目了然。\n\n我把这些整理成一页纸，标题六个字：供给端对不上。我给出的产量{{range}}（区间）是两万一到两万六千吨，和它说的四万八差着一个数量级的信誉。我和这些供应商的{{relationship}}（关系）都还在，每一个{{account}}（说法）我都能再核一遍。\n\n{{major}}（主要的）结论只有一句：如果上游给不出这么多料，那它报出来的产量、出货和收入，就只能有一个来源——不是生产出来的。","ft":[{"w":"R&D pipeline","z":"研发管线；产品储备","d":"在研项目的排布情况，决定未来几年有没有新品接力","a":"","p":""},{"w":"blended ASP","z":"综合均价","d":"不同型号混合后的平均单价，结构变化会影响这个数","a":"","p":""},{"w":"carbon peaking","z":"碳达峰","d":"排放总量见顶的时间点，直接约束新增产能审批","a":"","p":""},{"w":"conversion rate","z":"转化率","d":"从访问到下单的比例，流量能否变成生意的关键一环","a":"","p":""},{"w":"debottlenecking","z":"打通瓶颈提产","d":"小投入改造瓶颈工序换来产量提升，性价比高于新建","a":"","p":""},{"w":"economies of scale","z":"规模效应","d":"产量放大后单位成本下降，是制造业龙头最常见的优势来源","a":"","p":""},{"w":"greenfield project","z":"新建产能项目","d":"从零开始拿地建厂，建设周期长但产能是纯增量","a":"","p":""},{"w":"inventory turns","z":"库存周转次数","d":"一年里库存周转几轮，反映供应链和动销效率","a":"","p":""},{"w":"macro overhang","z":"宏观压制","d":"宏观不确定性对需求和信心的持续压制","a":"","p":""},{"w":"net store openings","z":"净开店数","d":"新开门店减去关店数，连锁扩张速度的直接读数","a":"","p":""},{"w":"overcapacity","z":"产能过剩","d":"行业总产能明显超过需求，价格和盈利长期承压","a":"","p":".әuvәkә'pæsәti"},{"w":"premiumization","z":"高端化","d":"把销售重心往更高价位段迁移，消费品提价的主要方式","a":"","p":""},{"w":"refining margin","z":"炼油毛利；裂解价差","d":"成品油与原油的价差，炼化企业盈利的核心变量","a":"","p":""},{"w":"scope 1 emissions","z":"范围一排放；直接排放","d":"企业自有设施直接产生的温室气体排放","a":"","p":""},{"w":"soft demand","z":"需求疲软","d":"终端需求偏弱的委婉说法，通常伴随下调指引","a":"","p":""},{"w":"switching cost","z":"转换成本","d":"客户换供应商要付出的代价，越高则客户粘性越强","a":"","p":""},{"w":"upstream","z":"上游","d":"离原材料和资源端更近的环节，通常掌握资源或核心材料","a":"","p":"'ʌp'stri:m"},{"w":"purchase price allocation","z":"收购价格分摊","d":"把收购对价分摊到可辨认净资产，剩余部分确认为商誉","a":"PPA","p":""}],"iw":[{"w":"Britain","p":"'britәn","t":"n. 英国"},{"w":"major","p":"'meidʒә","t":"n. 主修课, 成年人, 陆军少校; a. 主要的, 较多的, 大部分的, 成年的, 严重的; vi. 主修; 主要, 主要刻度"},{"w":"economic","p":".i:kә'nɒmik","t":"a. 经济上的, 实用的, 节省的; 经济的"},{"w":"section","p":"'sekʃәn","t":"n. 区段, 部分, 区域, 节, 截面, 处, 科, 区, 扇区; vt. 把...分段, 把...切片; vi. 被切成片; 扇区"},{"w":"involve","p":"in'vɒlv","t":"vt. 包括, 使陷于, 潜心于, 包围; 累及, 牵涉, 包含"},{"w":"staff","p":"stɑ:f","t":"n. 全体人员, 工作班子, 棍棒, 杆, 拐杖, 支柱, 权杖; a. 职员的, 雇员的, 参谋的; vt. 为...配备人员"},{"w":"former","p":"'fɒ:mә","t":"a. 从前的, 前者的; n. 起形成作用的人(或物), 模型, 样板"},{"w":"management","p":"'mænidʒmәnt","t":"n. 经营, 支配, 管理; 管理处"},{"w":"department","p":"di'pɑ:tmәnt","t":"n. 部门, 系, 机关; 部, 科"},{"w":"committee","p":"kә'miti","t":"n. 委员会; 委员会"},{"w":"product","p":"'prɒdʌkt","t":"n. 产品, 结果, 乘积; 生产物"},{"w":"evidence","p":"'evidәns","t":"n. 根据, 证据, 迹象; 证据, 凭证"},{"w":"union","p":"'ju:njәn","t":"n. 联盟, 联合, 结合, 工会; 联合; 联管节; 活接头"},{"w":"event","p":"i'vent","t":"n. 事件, 结果, 事情的进程, 竞赛项目; 事件"},{"w":"support","p":"sә'pɒ:t","t":"n. 支持, 支撑, 援助, 供养, 支撑物; vt. 支援, 支撑, 帮助, 支持, 忍受, 供养, 证实; 后援; 支持"},{"w":"stage","p":"steidʒ","t":"n. 阶段, 舞台, 场所, 戏剧, 站, 驿站, 级, 层, 脚手架; vt. 上演, 表演, 筹划; vi. 适于上演, 乘驿车旅行"},{"w":"range","p":"'reindʒ","t":"n. 排, 行, 山脉, 范围, 行列, 射程; vt. 排列, 归类于, 使并列, 放牧; vi. 平行, 延伸, 漫游; 量程; 范围; 域; 距离"},{"w":"relationship","p":"ri'leiʃәnʃip","t":"n. 关系, 关联; 关系"},{"w":"account","p":"ә'kaunt","t":"n. 报告, 解释, 估价, 理由, 利润, 算账, 帐目; vi. 报帐, 解释, 导致, 报偿, 占, 杀死; vt. 认为; 帐户, 帐号"},{"w":"material","p":"mә'tiәriәl","t":"n. 材料, 物资, 素材, 布料, 资料; a. 物质的, 肉体的, 重要的"}],"doc":{"k":"债券募集说明书的风险因素段","en":"Risk Factors - Industry Conditions. The precursor and lithium salt segments in which the Issuer operates are currently characterised by overcapacity and soft demand. Aggregate nameplate capacity across the upstream supply chain exceeds forecast downstream consumption for at least the next two years, and the Issuer's blended ASP declined by 18.4% year on year. The Issuer has suspended its greenfield project in Jiangxi pending environmental approval, and expects provincial carbon peaking targets to constrain permitted scope 1 emissions and therefore future output. The debottlenecking of existing lines may not deliver the economies of scale assumed in the Issuer's business plan. Customers face limited switching cost and may reallocate orders at short notice. Investors should not rely on any capacity guidance published by industry participants.","zh":"风险因素——行业状况。发行人所处的前驱体与锂盐板块目前呈现产能过剩与需求疲软的特征。上游供应链的名义总产能，在未来至少两年内将超过预测的下游消耗量，且发行人的综合均价同比下降 18.4%。发行人位于江西的新建产能项目已暂停，等待环评批复，并预计省级碳达峰目标将限制其获批的范围一排放，进而限制未来产量。对现有产线的打通瓶颈提产，未必能带来发行人业务计划中所假设的规模效应。客户面临的转换成本有限，可能在极短时间内重新分配订单。投资者不应依赖行业参与者所公布的任何产能指引。"}},{"i":3,"ti":"十七个电话，没人承认拿过那么多货","dom":"industry","sc":"渠道与经销","tx":"十七个电话，我打了两天，从周二下午一点打到周三晚上九点。\n\n名单是我自己拉的：国内装机量前二十的电池厂，加上四家海外的。高镍正极这种东西，客户就那么多，绕不开。我的{{approach}}（做法）很直接——不问敏感数字，只问一句话：贵司去年有没有从这家公司批量采购过高镍正极。\n\n第一个接电话的是华东一家二线厂的采购经理。他先反问我：你说的是哪家？我把名字念了一遍，他想了三秒，说，送过样，做过几轮{{iteration}}（迭代验证），没量产导入。\n\n第二个、第三个、第五个，答案几乎一模一样。有两家干脆说没听过。有一家承认去年确实拿过，但只有十几吨的{{amount}}（数量），试产用。\n\n打到第九个，我碰到一个愿意多说的{{player}}（行业参与者）。华南一家中型厂的技术负责人，入行十六年。他说现在大家在打{{price war}}（价格战），全行业只看两件事：谁的{{cash cost}}（现金成本）低，谁站在{{cost curve}}（成本曲线）的左边。一个{{new entrant}}（新进入者）想挤进他们的合格供应商名单，光{{quality}}（质量）体系审核就要走一年，产线要装摄像头，每批留样，还要把过程{{data}}（数据）接进他们的系统。\n\n我问他，那有没有可能一家新厂两年就做到年供四万吨。\n\n他笑出声。他说，我们现在还要供应商填{{scope 3 emissions}}（范围三排放）的表，报{{emission intensity}}（排放强度），报{{renewable energy}}（可再生能源）用电占比——欧洲客户查得比我们还细。这些表他们连交都没交过，你告诉我它那四万吨供给谁了？\n\n我把这句逐字记下来，标红。\n\n第十一个电话打给一个前同事，现在在电池厂做战略。他给了我一个{{detail}}（细节）：他们评估供应商时会先看{{patent portfolio}}（专利布局），高镍这条路线上真有硬专利的就三家，东亚不在里面。他还说，材料这行的物理{{property}}（特性）摆在那儿，配方能不能稳定，是要靠时间{{establish}}（确立）的，不是靠公关。\n\n第十四个电话，对方一听我是买方研究员，直接挂了。\n\n那天晚上我把另一条线也拉出来。公司在最近一次路演里讲了个新故事：他们做了个材料交易平台，季度{{gross merchandise volume}}（平台成交额）九个亿，{{user stickiness}}（用户粘性）\"行业领先\"。我让 Danny 帮我把那个 App 下下来。注册流程做得很糙，最新版本停在十四个月前。一个真在运营的平台不会长这样。它更像是给估值多加一个{{scheme}}（方案说法）。\n\n我还买了一批{{alternative data}}（另类数据）：卫星影像、招聘和物流单据。卫星那家供应商发来的{{image}}（影像）我先扫了一眼，江西{{site}}（厂区）的堆场是空的。这条我先按住，留到后面再展开。\n\n公司自己的口径当然是另一套。他们在业绩会上{{claim}}（宣称）三季度{{book-to-bill ratio}}（订单出货比）是 1.4，行业出现{{demand pickup}}（需求回暖），碳酸锂跌价带来{{tailwinds}}（顺风因素），加工{{spread}}（价差）在走阔。他们还给了一版{{pro forma}}（备考口径）报表，把去年收购那家厂假设成年初就并了进来。而颁给他们\"年度最佳材料商\"那个{{award}}（奖项）的{{organization}}（机构），我查了半天，注册地址是一间办公室。\n\n我手上这十七通电话说的是另一件事。\n\n这个{{project}}（研究项目）已经吃掉我三周。最{{central}}（核心）的一问其实很简单：货去了哪里。我的{{theory}}（假设）是，这些货压根没离开过纸面；而这套推理方式，{{apply}}（适用）到任何一家制造业公司都成立。我在草稿里把这一段单独立成一{{chapter}}（章节），标题叫\"客户端\"。\n\n下周三，公司在中环安排了一场{{management meeting}}（管理层交流），只请了六家机构，我在名单上。他们的研发{{center}}（中心）负责人也会到。\n\n我把想问的列了十一条，反复删，最后只留三条。\n\n第一条：请问贵司去年出货量前五大客户，分别贡献了多少收入。","ft":[{"w":"alternative data","z":"另类数据","d":"财报之外的数据源，如卫星、招聘、刷卡数据，用来先于市场验证","a":"","p":""},{"w":"book-to-bill ratio","z":"订单出货比","d":"新增订单除以当期出货，大于一说明订单在累积","a":"","p":""},{"w":"cash cost","z":"现金成本","d":"不含折旧的实际现金支出成本，判断谁能在低价时挺住","a":"","p":""},{"w":"cost curve","z":"成本曲线","d":"把行业内各厂商按成本从低到高排序，用来判断谁会先亏损停产","a":"","p":""},{"w":"demand pickup","z":"需求回暖","d":"订单和出货重新加速，业绩会上最想听到的表述","a":"","p":""},{"w":"emission intensity","z":"排放强度","d":"单位产量或单位收入对应的排放量，横向对比更公平","a":"","p":""},{"w":"gross merchandise volume","z":"平台成交额","d":"平台上成交的商品总金额，不等于公司自己的收入","a":"GMV","p":""},{"w":"iteration","z":"迭代；版本更新","d":"产品持续小步改进升级，互联网和硬件公司都常提","a":"","p":".itә'reiʃәn"},{"w":"management meeting","z":"管理层交流；小范围调研","d":"与公司高管当面沟通经营细节，纪要往往是核心信息源","a":"","p":""},{"w":"new entrant","z":"新进入者","d":"刚切入这个行业的厂商，常以低价或新技术抢份额","a":"","p":""},{"w":"patent portfolio","z":"专利布局","d":"公司积累的专利组合，是技术壁垒的量化体现","a":"","p":""},{"w":"price war","z":"价格战","d":"行业内厂商竞相降价抢份额，通常同时压垮全行业毛利","a":"","p":""},{"w":"renewable energy","z":"可再生能源","d":"风光水等非化石能源，绿电比例是出口客户的审核项","a":"","p":""},{"w":"scope 3 emissions","z":"范围三排放；价值链排放","d":"上下游产生的间接排放，占比最大也最难核算","a":"","p":""},{"w":"spread","z":"价差","d":"产成品价格减去原材料价格，中游企业盈利的核心变量","a":"","p":"spred"},{"w":"tailwinds","z":"顺风；有利因素","d":"推动业务向好的外部助力，如补贴、原料下跌或需求回暖","a":"","p":""},{"w":"user stickiness","z":"用户粘性","d":"日活与月活的比值，数值越高说明用户使用越频繁","a":"","p":""},{"w":"pro forma","z":"备考口径","d":"假设并购或重组在期初已完成而模拟编制的财务数据","a":"","p":"prәu'fɔ:mә"}],"iw":[{"w":"project","p":"'prɒdʒekt","t":"n. 计划, 设计, 事业; vt. 计划, 设计, 投掷, 发射, 使凸出, 放映; vi. 凸出"},{"w":"player","p":"'pleiә","t":"n. 竞赛者, 上场队员, 游戏者, 演员; 交易者"},{"w":"central","p":"'sentrәl","t":"a. 中央的, 重要的; 中央的, 中心的, 中枢的"},{"w":"apply","p":"ә'plai","t":"vt. 涂, 应用; vi. 申请, 适用"},{"w":"center","p":"'sentә","t":"n. 中心, 中心点, 中锋; a. 中央的, 位在正中的; vt. 集中, 定中心; vi. 居中; 居中; 中央"},{"w":"site","p":"sait","t":"n. 位置, 场所, 地点; vt. 给...择址"},{"w":"claim","p":"kleim","t":"n. 要求, 要求权, 断言, 权利; vt. 要求, 认领, 主张; vi. 提出要求, 主张, 断言"},{"w":"quality","p":"'kwɒlәti","t":"n. 品质, 特性, 才能, 质量; a. 优质的; 品质"},{"w":"data","p":"'deitә","t":"pl. 资料, 数据; 数据; DOS内部命令:用于显示或设定系统的日期"},{"w":"image","p":"'imidʒ","t":"n. 影像, 肖像, 想象, 图像, 形象, 翻版; vt. 作...的像, 反映, 想象, 象征; n. 图像; 图象"},{"w":"detail","p":"'di:teil","t":"n. 细节, 详情; vt. 详述, 选派; vi. 画详图; 详细数据"},{"w":"establish","p":"i'stæbliʃ","t":"vt. 建立, 确立, 制定; vi. 移植生长"},{"w":"approach","p":"ә'prәutʃ","t":"n. 接近, 入门; vt. 接近, 近似, 找...商量; vi. 靠近"},{"w":"amount","p":"ә'maunt","t":"n. 总数, 总额; vi. 总计, 等同"},{"w":"scheme","p":"ski:m","t":"n. 方案, 计划, 组合, 系统, 图解, 诡计, 阴谋; v. 计划, 设计, 图谋, 策划"},{"w":"award","p":"ә'wɒ:d","t":"n. 奖品, 裁定, 判决; vt. 授予, 给予"},{"w":"chapter","p":"'tʃæptә","t":"n. 章, 篇, 重要章节; 章; 段"},{"w":"organization","p":".ɒ:gәnai'zeiʃәn","t":"n. 组织, 结构, 团体, 体制; 组织, 机构, 机化(血栓或坏死组织)"},{"w":"theory","p":"'θiәri","t":"n. 理论, 学说, 原理, 意见, 推测; 理论"},{"w":"property","p":"'prɒpәti","t":"n. 财产, 所有权, 性质, 属性; 属性"}],"doc":{"k":"内部合规邮件","en":"From: Compliance. To: Research. Subject: Channel checks and third-party datasets. Colleagues, ahead of next week's management meeting with the issuer, please note the following. Any alternative data acquired for this project must come from vendors on the approved list and must not contain customer-identifiable information. When contacting downstream purchasers you may discuss general industry conditions, including the current price war, relative cash cost positions, or the arrival of any new entrant. You must not solicit unpublished figures such as order backlog, book-to-bill ratio, gross merchandise volume, or pro forma segment results. Publicly filed information, including the issuer's patent portfolio, remains unrestricted. Every call must be logged in the research system within twenty-four hours.","zh":"发件人：合规部。收件人：研究部。主题：渠道调研与第三方数据。各位同事，在下周与该发行人的管理层交流之前，请注意以下几点。为本项目取得的任何另类数据，必须来自批准名单内的供应商，且不得包含可识别客户身份的信息。在联系下游采购方时，你们可以讨论一般性的行业状况，包括当前的价格战、各家的现金成本位置，或任何新进入者的出现。但不得索取未公开的数字，例如在手订单、订单出货比、平台成交额或备考口径的分部业绩。已公开披露的信息，包括该发行人的专利布局，不受限制。每一通电话都必须在二十四小时内登记进研究系统。"}},{"i":4,"ti":"翻到应收账款那一栏，我把咖啡放下了","dom":"accounting","sc":"财报科目","tx":"周六早上八点，办公室没别人。我泡了咖啡，把它上市以来的五份年报摊在桌上，从最新那份开始翻。\n\n前面都很好看。收入三年涨了三倍，{{gross profit}}（毛利）率 34.6%，比行业老大还高六个点；{{operating profit}}（营业利润）翻倍；{{adjusted net profit}}（调整后净利润）增长 96%，中期还发过一份{{positive profit alert}}（盈喜）。按{{EBITDA}}（息税折旧摊销前利润）口径算，它的利润率是全行业最高的。整份{{financial}}（财务的）报告读下来，像一场做得很用心的宣传{{campaign}}（宣传攻势）。\n\n翻到{{balance sheet}}（资产负债表）那一页，我把咖啡放下了。\n\n应收账款 61.8 亿，同比增 214%。而收入同比增 118%。\n\n这个{{factor}}（比例关系）不对。收入涨一倍，应收涨两倍，{{represent}}（意味着）每做一块钱生意，回款比去年更难。我把周转天数算出来：应收从 98 天拉到 187 天。同一年，它的{{days payable outstanding}}（应付账款周转天数）从 71 天拉到 143 天——两头都在占别人的钱。这种{{behavior}}（做法）在一家高增长公司身上{{occur}}（出现），只有两种解释：要么它对上下游都强势得离谱，要么这些交易本身有问题。\n\n{{free cash flow}}（自由现金流）连续三年为负。{{investing activities}}（投资活动）那一栏，三年出去了 87 亿，说是建产线。可{{depreciation}}（折旧）只增加了 20%。产能翻了两倍，折旧不动，这说明大部分钱要么没变成能用的固定资产，要么根本没花在{{production}}（生产）上。我把每一笔{{non-cash charge}}（非现金支出）加回去重算了一遍经营现金流，缺口还是堵不上。\n\n真正的东西都在{{notes to the financial statements}}（财务报表附注）里。我一条一条读。第 34 条：为一家参股公司提供的连带责任担保 9.6 亿，列为{{contingent liability}}（或有负债），管理层认为\"发生{{loss}}（损失）的可能性极低\"。第 41 条：一家持股 32% 的联营企业按{{equity method}}（权益法）核算，去年贡献投资收益 1.4 亿，占税前利润的两成，而这家企业的{{various}}（各种）业务描述只有一行字。第 47 条：商誉减值测试把整个新材料业务当成一个{{cash-generating unit}}（资产组），{{carrying amount}}（账面价值）24 亿，测试结论是不需要计提。\n\n还有一处：{{income tax expense}}（所得税费用）除以税前利润，实际税率 6.2%。他们说是地方政府的高新技术优惠{{application}}（申请）获批了，还有一笔研发加计扣除。三年里这个数字一直是 6% 上下，像有人在按住它。\n\n我顺手对了一下在美上市的两家同行，它们按{{US GAAP}}（美国会计准则）披露，口径不同，但应收账款占收入的比重都在 25% 以内。这家是 71%。前两年美国{{congress}}（国会）为了中概股审计底稿吵得很凶，那阵子我还觉得离自己很远。\n\n咖啡凉了。我把桌上五份年报按年份排开，发现一个更难受的{{source}}（来源）问题：它每年新增的{{contract}}（合同）里，前五大客户名字年年在换。一家真正卖出去东西的公司不会这样。\n\n这个国家的{{economy}}（经济）里，一家公司做假账不新鲜。新鲜的是这家做得太漂亮，漂亮到连审计{{firm}}（事务所）都签了标准无保留意见，漂亮到我需要花一个周末才看出哪里不对。\n\n窗外天亮透了。我给自己找了个安慰：这至少是个{{opportunity}}（机会）。对研究员来说，一家所有科目都在说谎的公司，比一家所有科目都干净的公司值钱得多——干净的公司只能{{benefit}}（受益）于估值，说谎的公司会崩。\n\n但我得先证明它在说谎。而证明这件事，靠的不是{{administration}}（行政）手段，是把每一笔钱追到它落地的地方。\n\n我打开新的一页，在最上面写下三个字：现金流。然后在下面画了一条线，写：{{current}}（当期的）经营性净额，−19.4 亿。\n\n三年，{{per}}（每）一年都是负的。\n\n钱到底去哪了。","ft":[{"w":"EBITDA","z":"息税折旧摊销前利润","d":"在营业利润上加回折旧摊销，常用于重资产行业的横向比较","a":"","p":""},{"w":"US GAAP","z":"美国会计准则","d":"在美上市公司适用的准则，在研发和租赁处理上与国际准则有差异","a":"","p":""},{"w":"adjusted net profit","z":"调整后净利润","d":"剔除股权激励和并购摊销等项目后的口径，港美股公司常用","a":"","p":""},{"w":"balance sheet","z":"资产负债表","d":"反映某一时点资产、负债和权益状况的报表，港股也叫状况表","a":"B/S","p":""},{"w":"carrying amount","z":"账面价值","d":"资产扣除累计折旧摊销和减值准备后在报表上列示的金额","a":"","p":""},{"w":"cash-generating unit","z":"资产组","d":"能独立产生现金流入的最小资产组合，是商誉减值测试的单位","a":"CGU","p":""},{"w":"contingent liability","z":"或有负债","d":"结果取决于未来事项、暂不满足确认条件的潜在义务，只在附注披露","a":"","p":""},{"w":"days payable outstanding","z":"应付账款周转天数","d":"对供应商实际付款的平均天数，天数长意味着占用上游资金","a":"DPO","p":""},{"w":"depreciation","z":"折旧","d":"固定资产成本按使用年限分摊计入费用，是不影响现金的支出","a":"","p":"di.pri:ʃi'eiʃәn"},{"w":"equity method","z":"权益法","d":"对联营合营企业按持股比例确认投资收益，不并表","a":"","p":""},{"w":"free cash flow","z":"自由现金流","d":"经营性现金流扣除资本开支后的余额，反映真正可分配的现金","a":"FCF","p":""},{"w":"gross profit","z":"毛利","d":"收入减营业成本后的利润，反映产品本身的赚钱能力","a":"","p":""},{"w":"income tax expense","z":"所得税费用","d":"当期所得税加递延所得税，与税前利润的比值即实际税率","a":"","p":""},{"w":"investing activities","z":"投资活动","d":"购建长期资产和买卖金融资产等产生的现金进出","a":"","p":""},{"w":"non-cash charge","z":"非现金支出","d":"折旧、摊销和减值等不涉及现金流出的费用，做现金流时要加回","a":"","p":""},{"w":"notes to the financial statements","z":"财务报表附注","d":"报表科目的明细和会计政策说明，研究员真正的信息富矿","a":"","p":""},{"w":"operating profit","z":"营业利润","d":"收入扣除营业成本和期间费用后的利润，接近息税前利润","a":"EBIT","p":""},{"w":"positive profit alert","z":"盈喜","d":"港股中预告业绩大幅改善的公告，与盈警相对","a":"","p":""}],"iw":[{"w":"source","p":"sɒ:s","t":"n. 来源, 水源, 根源, 原始资料, 源; 来源, 源程序"},{"w":"financial","p":"fai'nænʃәl","t":"a. 财政的, 金融的; 财政的, 金融的, 财务的"},{"w":"firm","p":"fә:m","t":"n. 公司, 商号; a. 坚定的, 坚强的, 牢固的, 结实的, 坚硬的, 坚挺的, 严格的, 确定的; vt. 使牢固, 使坚定; vi. 变稳固, 变坚实; adv. 稳固地"},{"w":"application","p":".æpli'keiʃәn","t":"n. 应用, 申请, 志愿书, 应用程序; 应用, 应用程序"},{"w":"production","p":"prә'dʌkʃәn","t":"n. 制造, 生产, 产物; 产生, 生成"},{"w":"opportunity","p":".ɒpә'tju:niti","t":"n. 机会, 时机"},{"w":"contract","p":"'kɒntrækt","t":"n. 合约, 婚约, 契约; vt. 使皱缩, 使缩短, 感染, 订约, 缔结; vi. 皱缩, 订约, 收缩"},{"w":"occur","p":"ә'kә:","t":"vi. 发生, 被想到, 存在"},{"w":"administration","p":"әd.mini'streiʃәn","t":"n. 行政, 管理, 政府机关; 给药"},{"w":"congress","p":"'kɒŋgres","t":"n. 国会, 会议, 讨论会; 会议, 会合"},{"w":"campaign","p":"kæm'pein","t":"n. 战役, 运动, 竞选运动; vi. 参加运动, 作战"},{"w":"various","p":"'vєәriәs","t":"a. 不同的, 各种的, 多方面的, 许多的, 个别的, 杂色的; 不同的, 种种的, 各式各样的"},{"w":"economy","p":"i'kɒnәmi","t":"n. 经济, 理财, 节约; 经济, 整体"},{"w":"represent","p":".repri'zent","t":"vt. 表现, 表示, 描绘, 讲述, 代表, 象征, 回忆, 再赠送, 再上演; vi. 提出异议"},{"w":"loss","p":"lɒs","t":"n. 损失, 遗失, 失败, 输, 错过, 伤亡; 损失; 损耗"},{"w":"current","p":"'kʌrәnt","t":"n. 涌流, 趋势, 流; a. 流通的, 现在的, 当前的, 流行的; 当前的"},{"w":"benefit","p":"'benifit","t":"n. 利益; vt. 有益于; vi. 受益"},{"w":"behavior","p":"bi'heivjә","t":"n. 行为, 举止; 行为"},{"w":"factor","p":"'fæktә","t":"n. 因素, 因数, 系数, 基因, 代理人; 因式"},{"w":"per","p":"pә:","t":"prep. 每一, 通过, 经, 按照; 每, 按照"}],"doc":{"k":"业绩电话会问答片段","en":"Analyst: Vivian, following the positive profit alert, revenue was up 118% but receivables grew far faster. Could you walk us through the balance sheet? CFO: Gross profit and operating profit both expanded, and adjusted net profit rose 96%. Our EBITDA margin was broadly stable. Analyst: Free cash flow was negative again. How much of that sits in investing activities versus working capital? CFO: The majority relates to investing activities and to prepayments made to strategic suppliers. Days payable outstanding lengthened by design. Depreciation and other non-cash charge items are set out in the notes to the financial statements. Analyst: And the guarantee disclosed as a contingent liability? CFO: It is fully disclosed, and we do not expect it to crystallise.","zh":"分析师：Vivian，在发出盈喜之后，收入增长了 118%，但应收账款增长得快得多。能否请你带我们过一遍资产负债表？首席财务官：毛利和营业利润都实现了扩张，调整后净利润增长 96%，我们的息税折旧摊销前利润率大体保持稳定。分析师：自由现金流再次为负。其中有多少属于投资活动，多少属于营运资金？首席财务官：绝大部分与投资活动，以及向战略供应商支付的预付款有关。应付账款周转天数的拉长是我们主动安排的。折旧以及其他非现金支出项目，都已在财务报表附注中列示。分析师：那么被披露为或有负债的那笔担保呢？首席财务官：它已被完整披露，我们预计它不会实际发生。"}},{"i":5,"ti":"收入涨了两倍，钱去哪了","dom":"accounting","sc":"现金流量表","tx":"现金流量表我看了整整一个下午，看到最后手心是凉的。\n\n收入三年涨了两倍，经营活动产生的现金流量净额三年都是负的。这两句话放在同一张{{statement}}（报表）里，本身就是一个{{significant}}（重大的）矛盾。它按{{IFRS}}（国际财务报告准则）编报，该披露的一样没少，每一栏都填得整整齐齐——问题从来不在有没有填，在填进去的钱最后落在了哪儿。\n\n我按科目往下追。\n\n{{prepayments}}（预付款项）三年从 4 亿涨到 39 亿，全是付给供应商的。理由写的是锁定原料。可我上周才把上游数完，那些厂根本没有这么多货可锁。同一时间，{{accounts payable}}（应付账款）从 22 亿掉到 9 亿——它一边急着把钱付出去，一边不占供应商一分钱账期。这个{{pattern}}（模式）反过来了。正常做生意的公司不会这么干，除非付出去的钱本来就是要绕一圈回来的。\n\n{{contract asset}}（合同资产）那一栏更奇怪，两年翻了六倍，说是已履约未到收款条件。而{{deferred revenue}}（递延收入）几乎为零——它收不到客户的预付款，却愿意大笔预付给上游。钱的流向是单向的，从公司出去，不回来。\n\n坏账那块最见功夫。{{allowance for doubtful accounts}}（坏账准备）计提比例从 5.8% 降到 2.1%，附注解释是一次{{change in accounting estimate}}（会计估计变更），依据是\"历史回收{{performance}}（表现）良好\"。同一年，一年以上账龄的应收占比从 11% 涨到 34%。账龄在恶化，计提在下降，这不是判断问题，这是{{design}}（设计）。少提的这笔{{charge}}（费用）差不多正好等于当年利润的增量，也就是说，那个漂亮的{{bottom line}}（净利端）数字，有一大半是从坏账准备里省出来的。\n\n再往下。{{cash and cash equivalents}}（货币资金）账上 58 亿，看着很厚。但我翻到受限资金那条：其中 41 亿是保证金和质押，动不了。{{goodwill}}（商誉）和{{intangible assets}}（无形资产）加起来 31 亿，一分钱{{impairment}}（减值）都没提。它在合肥还有一块{{investment property}}（投资性房地产），用公允价值模式计量，去年一笔{{fair value}}（公允价值）重估收益 3.2 亿，进了{{other comprehensive income}}（其他综合收益）——不影响利润表，但把净资产撑起来了，也就把它的负债率压了下去。评估报告是本地一家我没听过的{{agency}}（机构）出的。\n\n还有{{non-controlling interests}}（少数股东权益）：并表子公司里少数股东占的那部分，利润分得极少，出资却很积极。以及那些{{off-balance-sheet}}（表外）的东西——担保、代持、抽屉协议，你在报表里永远看不见，只能从别人的报表里反推。\n\n我把这一{{series}}（一连串）线索连起来，写成一段话，发给了老周。他二十年前签过审计报告，现在退休了，在深圳带孙子。\n\n他很快回电话，第一句是：小林，你的{{focus}}（关注点）对了。他说，看这种公司别看利润，利润是{{author}}（作者）写出来的；看现金，现金是发生过的事。\n\n我说我怕自己有偏见，怕先有结论再找证据。他说，那你就把每一条都做成可以被推翻的{{analysis}}（分析）。别人来{{argue}}（辩驳）你，你得有底。\n\n挂了电话，我盯着那本年报的封面看了很久。设计公司在文件名里管这个{{color}}（颜色）叫 {{royal}}（皇家的）blue，深蓝，烫金，做得比很多央企的还讲究。\n\n我把公司分{{region}}（地区）的收入也拉了一遍，华东占七成，可华东那几个省的中游产能加起来都吃不下这个数。最后一个让我不安的点是它去年那次配股：融了 26 亿，摊薄了老股东 8% 的股份，公告里把这次{{dilution}}（摊薄）说成\"为长期{{goal}}（目标）所必需\"。一家账上有 58 亿现金的公司，为什么要在股价高位融 26 亿。\n\n答案其实很简单，简单到我不太愿意承认：因为账上那 58 亿，可能只是一个数字。\n\n我把这些整理成十九页，起了个很谨慎的标题，叫《关于经营性现金流的若干疑问》。写完已经晚上十点，办公室的{{pressure}}（压力）感很实在——一旦我把这个东西交上去，Ray 就会开始建仓，而我就得为每一条{{basis}}（依据）负责。\n\n我{{further}}（进一步）核了一遍数据源，把不确定的三条标成黄色。剩下十六条，我签了自己的名字。\n\n唯一让我{{concern}}（担心）的是最后那一条，我暂时没有证据，只有直觉：这么多钱付出去，总要有个地方接。\n\n那个地方在哪儿。","ft":[{"w":"IFRS","z":"国际财务报告准则","d":"港股和多数境外上市公司采用的会计准则体系，理事会为IASB","a":"","p":""},{"w":"accounts payable","z":"应付账款","d":"采购商品或服务后尚未支付的款项，账期拉长说明对上游话语权强","a":"AP","p":""},{"w":"allowance for doubtful accounts","z":"坏账准备","d":"按账龄或预期损失对应收款计提的减值准备，冲减应收账款","a":"","p":""},{"w":"bottom line","z":"净利端；最终利润","d":"口语说法，指利润表最下方的净利润，与 top line 相对","a":"","p":"ˈbɔtəm lain"},{"w":"cash and cash equivalents","z":"货币资金","d":"库存现金和三个月内到期的高流动性存款，要与受限资金区分","a":"","p":""},{"w":"change in accounting estimate","z":"会计估计变更","d":"折旧年限、坏账比例等估计的调整，只影响当期及以后期间","a":"","p":""},{"w":"contract asset","z":"合同资产","d":"已履约但收款权利尚未无条件成立的金额，属于新收入准则科目","a":"","p":""},{"w":"deferred revenue","z":"递延收入；预收款","d":"已收款但尚未履约确认收入的金额，是未来收入的先行指标","a":"","p":""},{"w":"dilution","z":"摊薄","d":"增发、转股或行权导致股本增加，从而摊薄每股收益","a":"","p":"dai'lju:ʃәn, di'l-"},{"w":"fair value","z":"公允价值","d":"市场参与者在有序交易中形成的计量价格，分三个层级披露","a":"","p":""},{"w":"goodwill","z":"商誉","d":"收购对价超过被购方可辨认净资产公允价值的部分，只测减值不摊销","a":"","p":"^jd'wil"},{"w":"impairment","z":"减值","d":"资产账面价值高于可收回金额时计提的损失，商誉减值最常见","a":"","p":"im'peәmәnt"},{"w":"intangible assets","z":"无形资产","d":"专利、软件、特许权等没有实物形态的长期资产，需摊销","a":"","p":""},{"w":"investment property","z":"投资性房地产","d":"出租或增值目的持有的地产，可选成本模式或公允价值模式","a":"","p":""},{"w":"non-controlling interests","z":"少数股东权益；少数股东损益","d":"并表子公司中不属于母公司的那部分权益和利润","a":"NCI","p":""},{"w":"off-balance-sheet","z":"表外","d":"未在资产负债表内列示的安排，如担保和部分结构化主体","a":"","p":""},{"w":"other comprehensive income","z":"其他综合收益","d":"未计入当期损益的公允价值和外币折算变动等项目","a":"OCI","p":""},{"w":"prepayments","z":"预付款项","d":"提前支付给供应商但尚未收到货物或服务的款项","a":"","p":""}],"iw":[{"w":"argue","p":"'ɑ:gju","t":"vi. 提出理由, 争论, 辩论; vt. 主张, 辩论, 证明, 说服"},{"w":"charge","p":"tʃɑ:dʒ","t":"n. 指控, 费用, 冲锋, 电荷, 炸药, 主管, 被托管人, 命令; vt. 控诉, 加罪于, 使充满, 使充电, 使承担; vi. 冲锋, 要价, 收费"},{"w":"performance","p":"pә'fɒ:mәns","t":"n. 施行, 工作情况, 成绩, 行为, 表现, 演出; 绩效, 性能"},{"w":"pattern","p":"'pætәn","t":"n. 模范, 典型, 式样, 样品, 图案, 格调, 模式; vt. 模仿, 仿造, 以图案装饰; vi. 形成图案; 模式, 图案"},{"w":"design","p":"di'zain","t":"n. 设计, 图样, 方案, 企图; v. 设计, 计划"},{"w":"goal","p":"gәul","t":"n. 目标, 终点, 得分, 球门, 守门员; vi. 攻门, 射门得分"},{"w":"royal","p":"'rɒiәl","t":"n. 王室, 皇族; a. 王室的, 皇家的, 盛大的, 庄严的"},{"w":"author","p":"'ɒ:θә","t":"n. 作家, 作家的著作, 创始人; 作者, 著作人, 本人"},{"w":"pressure","p":"'preʃә","t":"n. 压, 榨, 按, 强制, 压力, 压迫, 压强; vt. 迫使, 使增压, 密封"},{"w":"focus","p":"'fәukәs","t":"n. 焦点, 焦距; vi. 聚焦, 注视; vt. 使聚焦, 调焦, 集中; 焦点"},{"w":"agency","p":"'eidʒәnsi","t":"n. 代理机构, 经销商, 中介; 办事处"},{"w":"basis","p":"'beisis","t":"n. 基础, 主要成分; 基底"},{"w":"further","p":"'fә:ðә","t":"a. 更远的, 此外的, 更多的; vt. 促进, 增进, 助长; adv. 更进一步地, 更远地, 此外"},{"w":"color","p":"'kʌlә","t":"n. 颜色, 面色, 颜料, 外貌; vt. 把...涂上颜色, 粉饰, 使脸红, 歪曲; vi. 变色"},{"w":"series","p":"'siәri:z","t":"n. 串联, 序列, 连续, 系列, 丛书, 套, 级数, 组; 系列"},{"w":"analysis","p":"ә'nælәsis","t":"n. 分析; 分析机; 分析员; 分析; 分析程序"},{"w":"region","p":"'ri:dʒәn","t":"n. 区域, 地带, 地区, 领域, 范围, 区; 区, 区域"},{"w":"concern","p":"kәn'sә:n","t":"n. 关心, 忧虑; vt. 与...有关, 使担心, 使挂念"},{"w":"statement","p":"'steitmәnt","t":"n. 陈述, 指令, 声明; 程序语句; 语句"},{"w":"significant","p":"sig'nifikәnt","t":"a. 重要的, 有效的, 有含义的, 暗示的, 值得注意的"}],"doc":{"k":"基金给 LP 的月度信","en":"Dear Partners, during the month the research team completed forensic work on a Hong Kong listed materials producer reporting under IFRS. Revenue has tripled over three years while operating cash flow has remained negative throughout. The gap is explained almost entirely by prepayments to suppliers, a rapidly growing contract asset balance, and accounts payable falling as receivables rise. A change in accounting estimate reduced the allowance for doubtful accounts even as ageing deteriorated. Goodwill and intangible assets carry no impairment, while fair value gains on investment property flatter other comprehensive income rather than the bottom line. Cash and cash equivalents are substantially pledged, deferred revenue is negligible, and we are still reviewing off-balance-sheet guarantees and the treatment of non-controlling interests.","zh":"尊敬的合伙人：本月内，研究团队对一家按国际财务报告准则编报的香港上市材料生产商完成了取证式研究。该公司收入在三年内增长了两倍，而经营活动现金流始终为负。这一缺口几乎完全可以由以下几项解释：向供应商支付的预付款项、快速膨胀的合同资产余额，以及在应收账款上升的同时反而下降的应付账款。一次会计估计变更调低了坏账准备，而与此同时应收账款的账龄却在恶化。商誉与无形资产未计提任何减值，投资性房地产的公允价值收益则粉饰了其他综合收益，而非净利端。公司的货币资金大部分已被质押，递延收入可忽略不计，我们仍在核查其表外担保以及少数股东权益的处理方式。"}},{"i":6,"ti":"门口保安说，三号线从来没开过","dom":"industry","sc":"实地走访与用电量","tx":"从赣州往北开一个半小时，最后那段连导航都放弃了，司机靠一块褪色的路牌把车拐进厂区门口。\n\n这趟我自己掏钱。上个月那轮{{channel check}}（渠道调研）里，下游电池厂的{{response}}（回答）个个含糊，我不想再隔着电话猜。这是我第三次{{attempt}}（尝试）靠近它的真实产能。\n\n门口保安五十来岁，制服洗得发白。我说我找三号线的人。他抬头看我一眼：三号线从来没开过。\n\n我手里那杯豆浆停在半空。\n\n按披露，这个基地四条线去年下半年全部投产，全年{{utilization rate}}（产能利用率）九成二。同行做到七成就敢敲锣。我在门口站了四十分钟，进出货车三辆。\n\n保安很健谈。他在这儿干了快十年，前面大半个{{decade}}（十年）这地还是荒的；一号线开得最勤，二号线时开时停。我问四号线。他说，没有四号线。\n\n围墙侧面的配电房挂着公示牌，写着当月用电量。我拍了照，回车上按{{energy consumption per unit}}（单位能耗）一算：这点电顶多支撑披露产量的三分之一。制造业最不会撒谎的是电表：可以不发货、不收钱，但产线转起来就得吃电。\n\n我把数发给 Danny。他回一串省略号，问：会不会是{{normalization}}（恢复常态）？我说，检修的线不会连停三个季度。\n\n厂门口停着一辆沿海牌照的商务车，下来两个穿正装的{{individual}}（个人），其中一个我认得，会计师事务所的。\n\n县城找家宾馆住下。它的故事很顺：高镍正极是整条链的{{bottleneck}}（瓶颈环节），谁先做出来谁就有{{pricing power}}（定价权）；它拿到两家头部电池厂的{{design win}}（定点），一家{{key account}}（大客户）就贡献四成收入，{{market share}}（市场份额）从百分之三推到十一。管理层也提过{{headwinds}}（不利因素）：锂价波动、客户压价。汽车链的{{annual price reduction}}（年降）是明规则，供应商只能靠{{cost down}}（降本）扛。它说它扛住了，毛利率还做上去了。\n\n问题在这儿。真做到那个良率的公司，{{scrap rate}}（报废率）低到不像话；它招股书披露过一次报废数据，比同行还高。产品线也太宽，光正极就有十九个{{stock keeping unit}}（单品），一条线切十九次配方，良率稳不了。\n\n我{{career}}（职业生涯）最初两年做互联网，看{{take rate}}（变现率）、{{paying ratio}}（付费率）、{{repeat purchase rate}}（复购率）。转到制造业才明白，这行没那么讨巧的{{feature}}（特色）：所有{{growth}}（增长）最后都落到电、人和货上。\n\n晚上我把去年的{{profit attributable to shareholders}}（归母净利润）和这块地的产出摆一起，怎么摆都对不上。这只{{stock}}（股票）十八个月涨了两倍。\n\n十点多，Ray 在群里发照片，他在{{Scotland}}（苏格兰）见养老金 LP，说别一个人硬扛，{{resource}}（资源）不够跟我讲。我没回。我在想：线没开，那些收入是谁记上去的，谁签的字。\n\n我把要问的按{{function}}（职能）列成三栏：生产、财务、法务。合规提醒过我，走访要守{{legal}}（法律的）边界——不进厂区、不拍员工；手册那条{{provision}}（条款）很硬：不得诱导对方泄露未公开信息。我们唯一的{{defence}}（辩护依据）是流程干净。行业{{association}}（协会）的开工率我再买一份。\n\n十一点半，手机震了一下。陌生号码，落款投资者关系部：林小姐，听说您今天到过赣州基地，明早我们 CFO 想跟您聊十分钟。\n\n我没登记、没进厂、没跟任何{{media}}（媒体）打招呼。\n\n这条短信就是最清楚的{{sign}}（征兆）：我已经开始{{affect}}（影响）他们了。这行里最先被{{identify}}（识别）的人，通常也最先被处理。\n\n我想起 Ray 的{{style}}（风格）——对方主动找你，说明你问到了不该问的那格。\n\n明天上午十点，施慧敏。","ft":[{"w":"annual price reduction","z":"年降","d":"客户每年要求供应商降价的固定机制，汽车链最常见","a":"","p":""},{"w":"bottleneck","z":"瓶颈环节","d":"产业链中供给最紧、最难扩产的那一环，往往最赚钱","a":"","p":"'bɒtlnek"},{"w":"channel check","z":"渠道调研","d":"直接问经销商、门店、供应商来验证公司说法，买方最常用的手段","a":"","p":""},{"w":"cost down","z":"降本；年降","d":"持续压低单位成本的动作，汽车零部件每年都要跟客户谈","a":"","p":"kɔst daun"},{"w":"design win","z":"定点；设计导入","d":"被客户选中进入新产品设计方案，量产收入通常滞后一到两年","a":"","p":""},{"w":"energy consumption per unit","z":"单位能耗","d":"每单位产品消耗的能源，能耗双控下直接影响开工","a":"","p":""},{"w":"headwinds","z":"逆风；不利因素","d":"管理层用来指压制经营的外部阻力，如成本上涨或需求走弱","a":"","p":"ˈhedˌwɪndz"},{"w":"key account","z":"大客户；重点客户","d":"贡献主要收入的核心客户，丢单会直接冲击业绩","a":"","p":""},{"w":"market share","z":"市场份额","d":"公司销量或收入占全行业的比例，是竞争力最直接的证据","a":"","p":"ˈmɑ:kit ʃɛə"},{"w":"normalization","z":"恢复常态","d":"超高或超低的经营水平回归到正常区间","a":"","p":".nɒ:mәlai'zeiʃәn"},{"w":"paying ratio","z":"付费率","d":"付费用户占活跃用户的比例，游戏和内容平台的关键变量","a":"","p":""},{"w":"pricing power","z":"定价权","d":"能主动涨价而不明显丢客户的能力，业绩会上最常被问到","a":"","p":""},{"w":"repeat purchase rate","z":"复购率","d":"老客户再次购买的比例，反映产品和品牌的真实粘性","a":"","p":""},{"w":"scrap rate","z":"报废率","d":"生产中报废的比例，越高说明工艺越不成熟","a":"","p":""},{"w":"stock keeping unit","z":"单品；库存单位","d":"最小可售卖的商品条目，SKU 数量反映产品线宽度","a":"SKU","p":""},{"w":"take rate","z":"变现率；抽佣比例","d":"平台从成交额中抽取的比例，是平台商业模式的核心杠杆","a":"","p":""},{"w":"utilization rate","z":"产能利用率","d":"实际产出占设计产能的比例，制造业景气度的直接读数","a":"","p":""},{"w":"profit attributable to shareholders","z":"归母净利润","d":"扣除少数股东损益后归属于母公司股东的利润，A股最常用口径","a":"","p":""}],"iw":[{"w":"response","p":"ri'spɒns","t":"n. 反应, 回答, 响应; 应答"},{"w":"decade","p":"'dekeid","t":"n. 十年, 十"},{"w":"individual","p":".indi'vidʒuәl","t":"n. 人, 个人, 个体; a. 个别的, 个人的, 独特的"},{"w":"attempt","p":"ә'tempt","t":"n. 尝试, 企图; vt. 尝试, 企图"},{"w":"stock","p":"stɒk","t":"n. 树干, 祖先, 血统, 原料, 备料, 库存, 牲畜, 股票, 股份, 保留剧目; a. 存货的, 常备的, 平凡的, 普通的, 股票的, 保留剧目的, 繁殖用的; vt. 装把手于, 进货, 备有, 放牧; vi. 出新芽, 备货, 囤积"},{"w":"career","p":"kә'riә","t":"n. 事业, 生涯, 成功; 职业, 专业, 履历"},{"w":"feature","p":"'fi:tʃә","t":"n. 面孔的一部分(如眼、口等), 特征, 容貌, 特色, 特写; vt. 是...的特色, 特写, 放映; vi. 起重要作用; 特性"},{"w":"association","p":"ә.sәuʃә'eiʃәn","t":"n. 协会; 关联"},{"w":"affect","p":"ә'fekt","t":"vt. 影响, 感动, 假装, 模仿, 爱好, 倾向于; n. 自觉感情"},{"w":"identify","p":"ai'dentifai","t":"vt. 识别, 认为...等同于, 确定, 使参与; vi. 一致, 认同"},{"w":"media","p":"'mi:diә","t":"n. 媒体; 媒质"},{"w":"sign","p":"sain","t":"n. 符号, 招牌, 征兆, 正负号, 手势; vt. 签名, 打手势表达; vi. 签名; 正负号; 符号; 符号字符"},{"w":"legal","p":"'li:gәl","t":"a. 法律的, 法定的, 合法的; 法定权利; 法律(上)的, 合法的"},{"w":"Scotland","p":"'skɒtlәnd","t":"n. 苏格兰"},{"w":"resource","p":"ri'sɒ:s","t":"n. 资源, 财力, 办法, 策略, 急智, 消遣; 资源"},{"w":"growth","p":"grәuθ","t":"n. 生长, 栽培, 增长; 等比级数"},{"w":"function","p":"'fʌŋkʃәn","t":"n. 官能, 职务, 功能, 函数; vi. 活动, 运行, 行使职责; 功能, 函数"},{"w":"provision","p":"prә'viʒәn","t":"n. (政府提供的)钱和设备, 准备, 供应品, 规定, 条款; vt. 供给...食物及必需品"},{"w":"defence","p":"di'fens","t":"n. 防卫, 防卫设备; (诉讼程序中的)辩护"},{"w":"style","p":"stail","t":"n. 风格, 时尚, 文体, 风度, 字体, 类型; vt. 称呼, (根据新款式)设计, 使合潮流; n. 风格, 样式; 风格, 样式"}],"doc":{"k":"业绩电话会问答片段","en":"Analyst: Thank you for taking my question. Could management give more colour on plant-level utilization rate at the Jiangxi base? Our own channel check points to softer offtake than guided. CFO: Blended utilization rate for the full year was 92%, and energy consumption per unit fell 7% year on year after the line upgrade. We secured an additional design win with a top-tier cell maker in the fourth quarter, and that key account now represents a meaningful share of volume. Despite headwinds from lithium price swings and the annual price reduction requested by customers, our cost down programme protected pricing power, market share expanded to 11%, and scrap rate stayed below the industry average.","zh":"分析师：谢谢管理层回答我的问题。能否就江西基地分产线的产能利用率给出更多说明？我们自己做的渠道调研显示，实际出货比指引要弱。首席财务官：全年综合产能利用率为 92%，产线升级后单位能耗同比下降 7%。第四季度我们又拿到一家头部电池厂的定点，这个大客户目前在我们的出货量中占有相当比重。尽管面临锂价波动以及客户提出年降这些不利因素，我们的降本工作保住了定价权，市场份额提升至 11%，报废率也保持在行业平均水平以下。"}},{"i":7,"ti":"存货躺了一百三十九天，减值是零","dom":"accounting","sc":"存货与成本","tx":"施慧敏比照片上年轻。她把一杯手冲推过来，说，林小姐，我看过你写的东西，你比很多人认真。\n\n这是恭维，也是警告。她的{{title}}（头衔）是首席财务官，坐在我对面却像一位耐心的{{professor}}（教授）。\n\n我只问了一个问题：存货周转天数为什么是同行的两倍，而减值一分钱都没提。\n\n她说这正是他们最想澄清的。一，产线在爬坡，备料周期长；二，年底做过{{impairment test}}（减值测试），可收回金额高于账面价值，没有计提迹象；三，客户端在备货，{{contract liability}}（合同负债）上半年会集中兑现。\n\n她给的每一条都成立。问题是每一条都刚好差一点。\n\n回香港的高铁上，我把{{consolidated financial statements}}（合并报表）一行一行看。\n\n去年{{capital expenditure}}（资本开支）二十七个亿，账上几乎看不到对应的折旧——大部分挂在在建工程没转固。{{amortization}}（摊销）倒涨得飞快，涨的是无形资产。它租的厂房按{{IFRS 16}}（国际财务报告准则第16号）全部入表，形成一大笔{{lease liability}}（租赁负债），资产更重，利润却更好看。\n\n{{interest-bearing debt}}（有息负债）九十四个亿，{{finance costs}}（财务费用）只有一点九个亿。这个利率是{{previous}}（早先的）三年里我在这行没见过的。它{{maintain}}（维持）的解释是：银行认可我们的{{industrial}}（产业的）地位。\n\n它还有一块设备安装业务用{{percentage-of-completion}}（完工百分比法）确认收入，进度自己估，估多估少没人拦。另一块金属贸易按总额法确认——它在{{principal versus agent}}（主要责任人与代理人）的判断里把自己认成主要责任人，一转手就是几十亿收入。它实际承担的{{responsibility}}（责任）有多少，附注里只有一句话。\n\n{{deferred tax asset}}（递延所得税资产）确认了四点六个亿，前提是未来赚够利润把它抵掉——一个对自己下的注。\n\n我拉了一家在{{France}}（法国）上市的同类公司做对照，它存货周转六十二天，东亚一百三十九天。同一门生意，{{throughout}}（自始至终）不可能差一倍。\n\n{{government grant}}（政府补助）三点二个亿计在其他收益里。公司把它归进{{non-recurring items}}（非经常性损益），却又在业绩会上拿它讲增长。当成{{one-off item}}（一次性项目）剔掉，净利润少四成。\n\n最要命的还是那条老账：{{accounts receivable}}（应收账款）增速是收入的两倍，{{cash flow from operations}}（经营性现金流）连续两年为负。收入是真的，{{earnings per share}}（每股收益）也是真的，只有钱是假的。\n\n晚上我去找老周。他退休后住在筲箕湾，桌上永远摆着一只放大镜。\n\n他听完没评论存货，先问：审计师做过{{physical}}（实地的）盘点吗，去了几个仓库，抽了多少比例。\n\n我说附注里没写。\n\n他说，那你已经知道答案了。\n\n他又翻到员工构成那一页，按{{sex}}（性别）和工龄分的那张表，说它比利润表诚实——一万两千吨的产能，员工总数三千一百。\n\n他说，这样的账不一定构成{{crime}}（犯罪），也可能只是激进。但你要把它写出来，每一条{{argument}}（论据）都得能在一个{{lawyer}}（律师）面前站住。对方的{{executive}}（高管）团队口径高度{{united}}（一致的），你一个人去撞，第一波{{attack}}（攻击）会冲着你个人来。\n\n我说，我知道。\n\n他说，那你的{{strategy}}（策略）是什么。\n\n我说，先把所有对不上的地方列出来，不下结论，只列。这是我现在{{prime}}（首要的）的事。\n\n他说，还有，去看它的{{environmental}}（环保的）批复文件——产能要备案，备案数字骗不了人。\n\n那晚我把这几年的{{investment}}（投资）逻辑重想了一遍：我们不是在赌故事好不好，是在赌一份报表真不真。\n\n第二天一早，我打开的不是模型，是年报最后那一百多页——附注。\n\n那是我一直没细读的地方。","ft":[{"w":"IFRS 16","z":"国际财务报告准则第16号","d":"租赁准则，要求把经营租赁纳入表内，抬高资产负债和折旧","a":"","p":""},{"w":"accounts receivable","z":"应收账款","d":"已确认收入但尚未收款的款项，异常增长是财务风险的常见红旗","a":"AR","p":""},{"w":"amortization","z":"摊销","d":"无形资产和长期待摊费用按期分摊计入损益的过程","a":"","p":"ә,mɔ:ti'zeiʃәn"},{"w":"capital expenditure","z":"资本开支","d":"购建固定资产和无形资产的支出，是产能扩张的直接信号","a":"capex","p":""},{"w":"cash flow from operations","z":"经营性现金流","d":"主营经营活动产生的现金净额，与净利润的背离要重点追问","a":"CFO","p":""},{"w":"consolidated financial statements","z":"合并报表","d":"把母公司和子公司数据合并列报，区别于母公司单体报表","a":"","p":""},{"w":"contract liability","z":"合同负债","d":"新收入准则下的预收款科目，订单景气度的重要观察点","a":"","p":""},{"w":"deferred tax asset","z":"递延所得税资产","d":"可抵扣暂时性差异形成的未来税收利益，能否确认取决于盈利预期","a":"DTA","p":""},{"w":"earnings per share","z":"每股收益","d":"归母净利润除以加权平均股数，分基本和摊薄两种口径","a":"EPS","p":""},{"w":"finance costs","z":"财务费用；利息支出","d":"借款利息、汇兑损益等筹资相关支出，净负债高的公司要重点看","a":"","p":""},{"w":"government grant","z":"政府补助","d":"政府给予的补贴和奖励，常计入其他收益，属于非经常性来源","a":"","p":""},{"w":"impairment test","z":"减值测试","d":"每年或有迹象时对商誉和长期资产可收回金额的评估","a":"","p":""},{"w":"interest-bearing debt","z":"有息负债","d":"短期借款、长期借款和债券等需要支付利息的债务合计","a":"","p":""},{"w":"lease liability","z":"租赁负债","d":"承租人按未来租金现值确认的负债，与使用权资产同时入表","a":"","p":""},{"w":"non-recurring items","z":"非经常性损益","d":"与主营无关或偶发的损益，如资产处置收益和政府补助","a":"","p":""},{"w":"one-off item","z":"一次性项目","d":"仅影响当期、不具持续性的收支，做趋势分析时通常剔除","a":"","p":""},{"w":"percentage-of-completion","z":"完工百分比法","d":"按工程完工进度确认收入和成本，进度估计存在较大调节空间","a":"","p":""},{"w":"principal versus agent","z":"主要责任人与代理人","d":"判断按总额法还是净额法确认收入，直接影响收入规模","a":"","p":""}],"iw":[{"w":"attack","p":"ә'tæk","t":"n. 攻击, 抨击; vt. 攻击, 抨击, 动手干; vi. 攻击"},{"w":"physical","p":"'fizikl","t":"a. 身体的, 物质的, 自然的, 物理学的, 好色的; n. 体格检查"},{"w":"sex","p":"seks","t":"n. 性别, 性欲; vt. 区别...的性别, 引起...的性欲"},{"w":"investment","p":"in'vestmәnt","t":"n. 投资; 包埋料, 围模料, 包埋法, 围模法"},{"w":"lawyer","p":"'lɒ:jә","t":"n. 律师; 律师"},{"w":"environmental","p":"in.vaiәrәn'mentәl","t":"a. 周围的, 环境的; 环境的, 环保的"},{"w":"previous","p":"'pri:viәs","t":"a. 早先的, 前面的, 过急的; 以前的, 生前的, 前述的"},{"w":"maintain","p":"mein'tein","t":"vt. 维持, 维修, 保持, 坚持, 供养, 主张; 维修"},{"w":"professor","p":"prә'fesә","t":"n. 教授"},{"w":"crime","p":"kraim","t":"n. 犯罪, 罪行, 罪恶; 犯罪, 罪, 罪恶"},{"w":"France","p":"frɑ:ns","t":"n. 法国"},{"w":"responsibility","p":"ri.spɒnsә'biliti","t":"n. 责任, 职责, 负担, 可靠性; 职责"},{"w":"argument","p":"'ɑ:gjumәnt","t":"n. 争论, 论证, 论据, 自变量; 参数"},{"w":"prime","p":"praim","t":"n. 最佳部分, 初期, 全盛期; a. 主要的, 最初的, 根本的; v. 加油启动, 灌注, 填装"},{"w":"strategy","p":"'strætidʒi","t":"n. 战略, 策略; 战略, 策略"},{"w":"title","p":"'taitl","t":"n. 头衔, 名称, 标题, 书名, 扉页, 权利, 资格, 冠军, 字幕; vt. 授予头衔, 加标题于; 标题"},{"w":"throughout","p":"θru:'aut","t":"adv. 到处, 贯穿全部地, 自始至终; prep. 遍及, 在各处; 吞吐量"},{"w":"executive","p":"ig'zekjutiv","t":"n. 执行部门, 执行委员会, 执行者, 经理主管人员; a. 执行的, 善于执行的, 善于经营的; 执行程序"},{"w":"industrial","p":"in'dʌstriәl","t":"a. 工业的, 供工业用的, 工业高度发展的, 产业的; n. 工业工人, 工业股票"},{"w":"united","p":"ju:'naitid","t":"a. 联合的, 团结的, 一致的, 和睦的; 联合的, 统一的, 一致的"}],"doc":{"k":"卖方研报摘要","en":"We reiterate our Buy rating on Orient Kinetic Materials with a target price of HK$46. Investors have raised concerns over the inventory build and the absence of any write-down, but management completed its annual impairment test in December and identified no indicators of loss. We forecast earnings per share of RMB2.10 for FY25. The gap between reported profit and cash flow from operations reflects the timing of accounts receivable settlement with key customers, elevated capital expenditure ahead of the new base, and the adoption of IFRS 16, which lifts amortization and finance costs. Government grant income is disclosed within non-recurring items and is excluded from our core estimates. Key risks: slower ramp-up and customer concentration.","zh":"我们维持对东亚新能源材料的买入评级，目标价 46 港元。投资者对其存货累积以及未计提任何减值表示担忧，但管理层已于 12 月完成年度减值测试，未发现减值迹象。我们预测 2025 财年每股收益为 2.10 元人民币。报告利润与经营性现金流之间的缺口，反映的是与主要客户之间应收账款的结算时点、新基地投产前较高的资本开支，以及采用国际财务报告准则第 16 号后摊销与财务费用的抬升。政府补助收入披露于非经常性损益项下，已从我们的核心盈利预测中剔除。主要风险：产能爬坡慢于预期以及客户集中度过高。"}},{"i":8,"ti":"那个良率，这条路线做不到","dom":"industry","sc":"竞争格局与护城河","tx":"约到那个人花了我三周。\n\n他是同行一家老厂的工艺负责人，做正极十四年。合规部对这次{{expert call}}（专家访谈）批得很谨慎：走审批过的平台，平台收{{commission}}（佣金），全程录音，问题事先报备。这类{{procedure}}（程序）我以前嫌烦，现在觉得是保护。\n\n他一上来就问：你要听官方版本，还是听实话。\n\n我说实话。\n\n他说，那你把它披露的良率写在纸上。我写了。他看一眼，说，做不到。\n\n不是\"很难\"，是做不到。他解释：这条路线烧结的温度窗口极窄，{{Germany}}（德国）产的辊道窑参数最稳，它买的却是国产二手改造的。从{{trial}}（试验性的）小试到{{mass production}}（量产），良率会掉一大截，全行业都知道。\n\n我问，那它对外报的数字怎么来的。\n\n他说，换个角度想：良率是这行唯一的{{weapon}}（武器）。真有的公司不会到处讲，它会闷声抢{{customer}}（客户）。\n\n回来我把{{value chain}}（产业链）从矿到电池重排一遍，一环一环找{{lead indicator}}（领先指标）。前驱体开工率、锂盐周度报价、正极厂发出{{request for quotation}}（询价）的频次——这些{{high-frequency data}}（高频数据）比业绩早两个月动。它们全在往下走，只有东亚说自己在往上走。\n\n我又跑了一趟华东做{{primary research}}（一手调研）。经销商压着的{{channel inventory}}（渠道库存）比去年同期高一半，行业在{{destocking}}（去库存），出货明显弱于终端需求。有个老板说他的{{average order value}}（客单价）掉了三成，大客户把订单拆小，谁都不敢囤。\n\n三季度本该是{{peak season}}（旺季）。我拿掉{{seasonality}}（季节性）再看环比，还是负的。\n\n行业里已经有人在说{{bottoming out}}（见底企稳），好几家{{institution}}（机构）的策略会都在讲这个词。我不敢下这个判断——我只{{measure}}（衡量）我量得到的东西。\n\n真正让我睡不着的是{{obsolescence}}（淘汰风险）。这条路线迭代太快，如果它库存压的是上一代型号，那些货不是存货，是废铁。而那么大一笔{{property, plant and equipment}}（固定资产），一旦路线切换也一起贬值。\n\n它对外讲{{structural growth}}（结构性增长）——不看周期，只看渗透率。这个说法给了市场不必追问细节的理由，估值也就撑住了。\n\n我在电话里问那位{{expert}}（专家）最后一个问题：如果原材料涨价，它有没有能力做{{cost pass-through}}（成本转嫁）。\n\n他笑了，说，除非你手里握着{{take-or-pay contract}}（照付不议合同），否则你没有谈价的余地。整个{{sector}}（行业）里能签下这种合同的，一只手数得过来。\n\n他说，我讲个我不该讲的{{circumstance}}（情况）。去年有一家贸易公司把它一半的货吃下去了，名字没人听过，注册地不在国内。我们几个厂的人都{{aware}}（知道的），但没人说，大家都在同一张{{network}}（网络）里混。\n\n我问，你确定是一半。\n\n他说，我不确定{{specific}}（具体的）比例，我只知道那个数字大到不{{appropriate}}（适当的）。一家新公司，第一年就吃掉行业老二一半的产能，这不是生意，这是安排。\n\n我说，那家公司叫什么。\n\n他说，不能讲。但你去翻它年报附注里关联方那一节。写年报的人不是{{original}}（最初的）设计者，只是照着填，有时候会填出真话。\n\n挂掉电话，我在办公室坐了十分钟。\n\n我一直在算产能、算电、算良率，算的都是物理世界。可一家公司的{{profit}}（利润）可以不来自任何物理世界。我一直{{assume}}（假定）造假的边界在工厂里，现在我得承认，边界可能在开曼。\n\n我打开年报，跳到第一百四十七页。\n\n这一页给我的{{impact}}（冲击），比赣州那扇没开过的门还大。因为那位{{client}}（客户）——那家吃掉一半货的贸易公司——就写在里面。","ft":[{"w":"average order value","z":"客单价","d":"每笔订单的平均金额，和订单量一起拆解成交额","a":"AOV","p":""},{"w":"bottoming out","z":"见底企稳","d":"最差阶段已经过去，数据开始不再恶化","a":"","p":""},{"w":"channel inventory","z":"渠道库存","d":"压在经销商和门店手里的货，判断出货真实性的关键","a":"","p":""},{"w":"cost pass-through","z":"成本转嫁","d":"把原材料涨价传导给下游客户的能力和节奏","a":"","p":""},{"w":"destocking","z":"去库存","d":"产业链主动消化过剩库存，期间出货明显弱于终端真实需求","a":"","p":"di:'stɔkiŋ"},{"w":"expert call","z":"专家访谈","d":"付费访谈行业内人士，快速补齐产业认知的常用方式","a":"","p":""},{"w":"high-frequency data","z":"高频数据","d":"周度或日度更新的开工、价格、物流数据，用来抢先判断拐点","a":"","p":""},{"w":"lead indicator","z":"领先指标","d":"比公司业绩更早变化的变量，如新增订单或开工率","a":"","p":""},{"w":"mass production","z":"量产","d":"产品进入规模化生产阶段，收入才真正开始释放","a":"","p":""},{"w":"obsolescence","z":"产品过时；淘汰风险","d":"技术或型号被替代导致库存和产线贬值","a":"","p":".ɒbsә'lesәns"},{"w":"peak season","z":"旺季","d":"一年中出货和价格最强的时段，公司常提前备货","a":"","p":""},{"w":"primary research","z":"一手调研","d":"自己获取的原始信息，区别于研报和媒体的二手资料","a":"","p":""},{"w":"request for quotation","z":"询价；报价邀请","d":"客户发出的报价请求，是订单流程的起点","a":"RFQ","p":""},{"w":"seasonality","z":"季节性","d":"需求或产量按月份规律波动，环比数据必须剔除这一因素","a":"","p":"ˌsi:zəˈnæləti"},{"w":"structural growth","z":"结构性增长","d":"不依赖经济周期的增长来源，估值容忍度更高","a":"","p":""},{"w":"take-or-pay contract","z":"照付不议合同","d":"不提货也要付钱的长期合同，锁量锁价，收入稳定性高","a":"","p":""},{"w":"value chain","z":"产业链；价值链","d":"从原材料到终端产品的各个环节，行业研究的基本分析框架","a":"","p":""},{"w":"property, plant and equipment","z":"固定资产","d":"厂房、机器设备等长期经营性资产，按成本减折旧和减值列示","a":"PP&E","p":""}],"iw":[{"w":"customer","p":"'kʌstәmә","t":"n. 消费者; 顾客"},{"w":"institution","p":".insti'tju:ʃәn","t":"n. 机构, 惯例, 制度; 机关, 机构, 设施"},{"w":"network","p":"'netwә:k","t":"n. 网络, 广播网, 网状物; 网络"},{"w":"specific","p":"spi'sifik","t":"n. 特效药, 特性; a. 特殊的, 明确的, 具有特效的, 特定地, 具体地"},{"w":"appropriate","p":"ә'prәupriәt","t":"a. 适当的; 适当的, 拨出, 占用"},{"w":"profit","p":"'prɒfit","t":"n. 利润, 赢利, 利益; vi. 有益, 获利, 赚钱; vt. 有益于"},{"w":"assume","p":"ә'sju:m","t":"vt. 假定, 承担, 呈现; vi. 装腔作势, 僭越"},{"w":"measure","p":"'meʒә","t":"n. 尺寸, 量度器, 量度标准, 测量, 量具, 程度, 范围, 限度, 分寸, 措施, 方法; vt. 测量, 测度, 估量, 权衡, 调节, 拿(自己或自己的力量等)作较量; vi. 度量"},{"w":"procedure","p":"prә'si:dʒә","t":"n. 程序, 过程, 手续; 规程; 过程"},{"w":"commission","p":"kә'miʃәn","t":"n. 委任状, 任官令, 所委职责, 佣金, 犯, 委托, 所托之事; vt. 委任, 委托制作, 使服役"},{"w":"trial","p":"'traiәl","t":"n. 审判, 试验, 艰苦, 麻烦事, 考验; a. 审讯的, 试验性的"},{"w":"expert","p":"'ekspә:t","t":"n. 专家, 行家; a. 老练的, 内行的, 专门的; 高级"},{"w":"circumstance","p":"'sә:kәmstәns","t":"n. 环境, 状况, 事件"},{"w":"client","p":"'klaiәnt","t":"n. 客户, 顾客, 委托人; 客户, 客户机, 客户机程序"},{"w":"sector","p":"'sektә","t":"n. 扇形, 部门, 部分, 函数尺, 象限仪, 段, 区段; vt. 把...分成扇形; 扇面; 扇区; 段; 区段"},{"w":"original","p":"ә'ridʒәnl","t":"a. 最初的, 原始的, 有创意的; n. 原物, 原作"},{"w":"impact","p":"'impækt","t":"n. 冲击, 冲突, 影响, 效果; vt. 挤入, 撞击, 压紧, 对...发生影响"},{"w":"aware","p":"ә'wєә","t":"a. 知道的, 有觉悟的"},{"w":"Germany","p":"'dʒә:mәni","t":"n. 德国"},{"w":"weapon","p":"'wepәn","t":"n. 武器, 兵器; vt. 武装"}],"doc":{"k":"内部合规邮件","en":"To: Research. From: Compliance. Subject: Expert network procedures. Effective immediately, every expert call must be booked through an approved provider and pre-cleared by this office. Consultants may not be current employees of a covered issuer or of its customers along the value chain. Discussion is to remain at industry level: analysts may ask about mass production timelines, typical yield ranges, seasonality and peak season patterns, and channel inventory or destocking behaviour, but must not solicit unpublished order data, the content of a specific request for quotation, or the terms of any take-or-pay contract. Notes from primary research and any high-frequency data purchased externally must be filed with Compliance within one business day.","zh":"致：研究部。发自：合规部。主题：专家网络使用规程。即日起，所有专家访谈必须通过经审批的服务商预约，并事先经本部门审核。受访顾问不得为覆盖标的公司或其产业链上客户的在职员工。访谈内容须停留在行业层面：分析师可以询问量产时间表、通常的良率区间、季节性与旺季规律，以及渠道库存或去库存的情况，但不得索取未公开的订单数据、某一份具体询价的内容，或任何照付不议合同的条款。一手调研的访谈记录，以及外部采购的高频数据，须在一个工作日内报备合规部。"}},{"i":9,"ti":"第一百四十七页，注册地开曼","dom":"accounting","sc":"审计与附注","tx":"第一百四十七页，附注四十一，关联方及关联交易。\n\n一家我从没听说过的公司，注册地开曼，成立比我入行还晚，去年跟东亚新能源的交易金额三十一亿。\n\n我把这页打印出来圈了两遍，然后做最笨的事：一个{{item}}（科目）一个科目地对。\n\n先看{{income statement}}（利润表）：收入九十六亿，{{cost of goods sold}}（营业成本）六十一亿，{{gross margin}}（毛利率）三十六点五，比同行高十个点。\n\n{{operating expenses}}（期间费用）里销售费用只占收入的百分之一点二，{{sales}}（销售）团队按披露四十一人——四十一个{{employee}}（员工）做九十六亿{{goods}}（货物）流转，人均两亿三。\n\n{{capitalized R&D}}（研发资本化）比例六成八：研发钱只有三分之一进当期费用，其余全变成无形资产躺着。资本化合规，到这个{{extent}}（程度）就成了{{technique}}（手法）。\n\n{{construction in progress}}（在建工程）四十三亿，十九亿挂了三年没转固。不转固不折旧，不折旧不进成本。补提一遍，毛利率掉六个点。\n\n{{deferred tax liability}}（递延所得税负债）几乎为零，{{effective tax rate}}（实际税率）百分之八点四——高新优惠也才十五。附注只有一句\"适用区域性优惠\"。\n\n{{inventory}}（存货）我昨天看过。{{notes receivable}}（应收票据）二十二亿，商业承兑占七成，客户自己开的票。这在产业链里只意味着：对方没钱。\n\n{{cash flow statement}}（现金流量表）里经营净流出十四亿，{{financing activities}}（筹资活动）净流入三十九亿。账面利润二十亿的公司靠借钱活着。\n\n最后是{{auditor's report}}（审计报告）：标准无保留意见。出具的是一家{{medium}}（中等）规模的本地所，三年前换的。\n\n我给老周打电话念给他听。他只说，你看看它的{{performance obligation}}（履约义务）怎么描述的。\n\n我翻回去：货物交付至客户指定仓库即视为控制权转移。指定仓库——不是客户的仓库。\n\n老周说，这就是那扇门。货可以一直待在那仓库里，钱先记进利润表，两年后用一次{{prior period adjustment}}（前期差错更正）改回来，那时没人再看这份年报。\n\n我说，那审计师呢。\n\n他说，我签过一份到现在还后悔的报告。别用道德理解，用{{employment}}（雇用）理解——收入来自谁，就很难{{challenge}}（质疑）谁。{{professional}}（专业的）判断有价格。这不是{{cultural}}（文化的）问题；任何市场的历史里，{{majority}}（多数）爆雷案的审计意见都干净。\n\n我问，那我该找谁。\n\n他说，谁都别找。把两个{{version}}（版本）的数字并排放——按{{PRC GAAP}}（中国会计准则）报的，和按你自己假设还原的。中间那个差额就是它的故事。\n\n我把五年毛利率画成{{bar}}（条形图），旁边放同行。所有人往下走时，它那根线稳得像用尺子画的。\n\n我又把{{accrued expenses}}（预提费用）拉出来，工资水电跟披露的员工数、用电量一对，全对不上。它还用{{non-GAAP measure}}（非公认会计准则口径）讲经调整利润，剔掉的项目里有一笔\"一次性物流费用\"——连续三年出现。\n\n凌晨两点我停下来。老周还说过：做这行得像个{{adult}}（成年人），别指望有人递答案，你只会拿到一堆{{variety}}（种类）不同的碎片。\n\n开曼那家公司我只搜到一条注册信息，写它的{{writer}}（撰稿者）大概是律师助理。地址底下一行小字：该辖区依其{{parliament}}（议会）通过的公司法设立豁免公司。\n\n一个空壳，一个地址，三十一亿。\n\n它对散户的{{appeal}}（吸引力）在于故事，对我的在于它太完整——完整到不像真的。\n\n我把这条写进表格，编号第九。我知道列不完了——这表已经不像笔记，更像指控。\n\n天亮时，它上面有十九行。我得拿着它去敲一扇从没主动敲过的门；门后那个{{candidate}}（人选），我不确定会不会信我。","ft":[{"w":"PRC GAAP","z":"中国会计准则","d":"A股公司适用的企业会计准则，与国际准则已基本趋同但仍有差异","a":"CAS","p":""},{"w":"accrued expenses","z":"预提费用；应计费用","d":"已发生但尚未支付或开票的费用，如工资、水电和奖金","a":"","p":""},{"w":"auditor's report","z":"审计报告","d":"会计师事务所对报表是否公允反映所出具的正式意见文件","a":"","p":""},{"w":"capitalized R&D","z":"研发资本化","d":"把部分研发支出计入无形资产而非费用，会推高当期利润","a":"","p":""},{"w":"cash flow statement","z":"现金流量表","d":"按经营、投资、筹资三类列示现金进出，用来验证利润的含金量","a":"","p":""},{"w":"construction in progress","z":"在建工程","d":"尚未达到可使用状态的工程支出，转固后开始计提折旧","a":"CIP","p":""},{"w":"cost of goods sold","z":"营业成本","d":"与收入直接对应的产品或服务成本，决定毛利水平","a":"COGS","p":""},{"w":"deferred tax liability","z":"递延所得税负债","d":"应纳税暂时性差异形成的未来纳税义务，常见于加速折旧","a":"DTL","p":""},{"w":"effective tax rate","z":"实际税率","d":"所得税费用除以税前利润，税收优惠到期会明显抬高该比率","a":"ETR","p":""},{"w":"financing activities","z":"筹资活动","d":"借款、还款、发股和分红等与资本结构相关的现金流","a":"","p":""},{"w":"gross margin","z":"毛利率","d":"毛利占收入的比例，制造业研究里最常被追问的指标","a":"GPM","p":""},{"w":"income statement","z":"利润表；损益表","d":"反映一段期间收入、成本费用和利润的报表，卖方模型的核心","a":"P&L","p":""},{"w":"inventory","z":"存货","d":"原材料、在产品和产成品的合计，周转天数变化能预警需求转弱","a":"","p":"'invәntәri"},{"w":"non-GAAP measure","z":"非公认会计准则口径","d":"公司自行调整的业绩指标，需核对调节表看剔除了什么","a":"","p":""},{"w":"notes receivable","z":"应收票据","d":"以银行承兑汇票等形式收取的货款凭证，A股产业链中很常见","a":"","p":""},{"w":"operating expenses","z":"期间费用；营业费用","d":"销售、管理、研发等日常经营费用的统称，不含营业成本","a":"opex","p":""},{"w":"performance obligation","z":"履约义务","d":"合同中承诺向客户转让可明确区分商品或服务的义务","a":"","p":""},{"w":"prior period adjustment","z":"前期差错更正","d":"对以往年度报表错误的追溯调整，通常同时调整期初留存收益","a":"","p":""}],"iw":[{"w":"employee","p":".emplɒi'i:","t":"n. 职员, 员工, 受雇人员; 职工; 雇员"},{"w":"cultural","p":"'kʌltʃәrәl","t":"a. 文化的, 教养的, 修养的; 培养的"},{"w":"employment","p":"im'plɒimәnt","t":"n. 雇用, 职业, 工作; 职业, 雇用, 职工招请"},{"w":"appeal","p":"ә'pi:l","t":"n. 恳求, 诉请, 上诉, 吸引力; vi. 呼吁, 诉请, 要求, 上诉, 有吸引力; vt. 将...上诉"},{"w":"professional","p":"prә'feʃәnl","t":"n. 专业人才; a. 专业的, 职业的"},{"w":"technique","p":"tek'ni:k","t":"n. 技巧, 技术, 方法; 工艺方法; 技巧"},{"w":"item","p":"'aitәm","t":"n. 项目, 条款, 一则, 项; 项"},{"w":"medium","p":"'mi:diәm","t":"n. 媒体, 方法, 媒介; a. 半生熟的, 中间的; 媒体, 中"},{"w":"version","p":"'vә:ʒәn","t":"n. 一种描述, 版本, 译文; 版本"},{"w":"candidate","p":"'kændideit","t":"n. 候选人, 投考者; 候选, 候补者"},{"w":"sales","p":"","t":"a. 销售的; 销售"},{"w":"adult","p":"'ædʌlt","t":"n. 成人, 成虫; a. 成年的, 成熟的"},{"w":"variety","p":"vә'raiәti","t":"n. 多样, 种类, 变种, 杂耍; 变种"},{"w":"writer","p":"'raitә","t":"n. 作家, 撰稿者, 抄写员; 记录器"},{"w":"challenge","p":"'tʃælindʒ","t":"n. 挑战, 盘问; vt. 向...挑战, 要求, 怀疑; vi. 挑战, 对(证据等)表示异议"},{"w":"majority","p":"mә'dʒɒriti","t":"n. 多数, 大半; 多数逻辑"},{"w":"extent","p":"ik'stent","t":"n. 范围, 程度, 区域; 范围"},{"w":"bar","p":"bɑ:","t":"n. 条, 棒, 酒吧, 栅, 障碍物; vt. 禁止, 阻挡, 妨碍; 棒形图"},{"w":"parliament","p":"'pɑ:lәmәnt","t":"n. 国会, 议会; 会议, 国会, 议院"},{"w":"goods","p":"guds","t":"n. 货物; 货物, 商品, 动产"}],"doc":{"k":"债券募集说明书的风险因素段","en":"Risk Factors - Related Party Transactions and Financial Reporting. The Group's accounts are prepared under PRC GAAP and the auditor's report for the year included two key audit matters. A substantial portion of sales is settled in notes receivable rather than cash, and the cash flow statement shows a net outflow from operating activities offset by financing activities. Gross margin has been supported by capitalized R&D and by construction in progress that has not been transferred to fixed assets and therefore attracts no depreciation within cost of goods sold. Investors should note the Group's low effective tax rate, its immaterial deferred tax liability, and its use of a non-GAAP measure when presenting operating expenses. A prior period adjustment cannot be excluded.","zh":"风险因素——关联方交易与财务报告。本集团财务报表按中国会计准则编制，本年度审计报告中列示了两项关键审计事项。销售收入中有相当比例以应收票据而非现金结算，现金流量表显示经营活动产生净流出，并由筹资活动的流入予以弥补。毛利率的支撑来自研发资本化，以及尚未转入固定资产、因而未在营业成本中计提折旧的在建工程。投资者应注意本集团较低的实际税率、金额极小的递延所得税负债，以及在列报期间费用时使用非公认会计准则口径的做法。不排除发生前期差错更正的可能。"}},{"i":10,"ti":"十九行","dom":"fraud","sc":"红旗信号","tx":"Ray 的办公室在三十七楼，门永远开着，没人敢随便进。\n\n我站了两秒，捏了捏那张表。A3，两页，十九行。\n\n他抬头说，坐，你脸色很差。\n\n我说三天没睡。\n\n他推过一杯咖啡：别铺垫，讲{{stuff}}（东西）。\n\n我把表格转过去：编号、异常事实、证据{{reference}}（出处），和我还没{{access}}（拿到权限）的部分。\n\n一，赣州三号线从未运行，用电量只够披露产量三分之一。二，员工数与产能不匹配。三，销售费用率百分之一点二。四，{{capitalised R&D}}（研发资本化）六成八，{{research and development expense}}（研发费用）连降三年。\n\n五，前十大客户三家查不到实体，疑似{{phantom customer}}（虚构客户）。六，{{customs data}}（海关数据）出口额只有披露外销的六分之一。七，{{tax filings}}（税务申报数据）对不上二十亿利润。\n\n他没说话，只在第六条旁点了一下。\n\n八，应收票据里商业承兑占七成。九，那家开曼关联方一年吃掉三十一亿货。十，{{remaining performance obligations}}（在手订单金额）翻倍，预收款没动。\n\n十一，{{recurring net profit}}（扣非净利润）只有净利润六成。十二，{{retained earnings}}（未分配利润）四十七亿，从没分过红。十三，有对外担保，{{provisions}}（预计负债）却是零。\n\n十四，{{Beneish M-score}}（比尼什M值）八项超六项。十五，去年两位独董同月离任，公告写\"个人原因\"——{{independent director resignation}}（独立董事辞任）从来不是个人原因。\n\n十六，大股东通过三家关联公司拿走十四亿，就是{{misappropriation of funds}}（资金占用）。十七，设备清单里一批{{German}}（德语的）铭牌窑炉，查不到厂商。十八，现金几乎全在一家城商行，那家行又给它二十亿授信{{facility}}（授信额度）。\n\n十九，全市场{{short interest}}（空头持仓比例）不到百分之一点五——没人在做空它。\n\n最后我写了三个触发点：{{restatement}}（财务重述）、{{auditor resignation}}（审计师辞任）、交易所的{{enquiry letter}}（问询函）。只要它{{restate}}（重述）任何一年的数字，故事就结束。还有一条我犹豫过：管理层去年授出一大批{{restricted share unit}}（限制性股票单位），解锁只挂收入。\n\n我念完。Ray 把表格倒着往回看。\n\n他说，哪几条是你亲眼看见的。\n\n我说，第一条、第五条那两家、第八条的票据复印件，还有那份{{survey}}（调研）的十七通录音。其余是交叉验证。\n\n他说，够了。他走到窗边：我在纽约做过十年信用衍生品，学会一件事——造假分{{species}}（种类）。一种是没钱了临时补一笔，破绽是慌出来的。另一种从第一天就设计好，每一环都{{effective}}（有效的），禁得起单独问；你抓不住任何人，因为没有人违规。\n\n他说，你想过没有，为什么它每一步都刚好卡在披露要求的边上。\n\n我说想过，所以才害怕。\n\n他说，害怕是{{positive}}（肯定的）信号。做空最危险的是不害怕。\n\n他转过身：这公司的钱，最后谁付的。\n\n我说，{{consumer}}（消费者）不会买单，那是{{commercial}}（商用的）产品。掏钱的是给它下{{payment}}（付款）的客户、放款的银行，和买了它{{collection}}（回款）的人。\n\nRay 说，最后那半句你听见了吗。\n\n我愣住。\n\n他说，应收账款能打包，打包完能卖。卖到哪儿你不知道，但一定不在这个{{context}}（语境）里。有人把这些纸{{extend}}（延伸）出去了，量还{{considerable}}（相当可观的）。\n\n他坐回来：我在 New {{york}}（纽约）见过这种东西，二〇〇六年。\n\n我说，做不做。\n\n他说，做。但会很{{tough}}（艰苦的）：他们会告你、查你，给你名字配个故事。\n\n他把表格锁进抽屉。\n\n他说，问题会一条条{{arise}}（出现）。今天我只问一个。\n\n他看着我：你有没有{{skin}}（切身利害）押在里面？如果你是对的，这个票值多少。","ft":[{"w":"Beneish M-score","z":"比尼什M值","d":"用一组财务比率打分，判断报表被操纵的概率","a":"","p":""},{"w":"auditor resignation","z":"审计师辞任","d":"审计师中途辞职，通常是最强烈的危险信号之一","a":"","p":""},{"w":"capitalised R&D","z":"研发资本化","d":"研发投入计入资产而非费用，资本化比例异常高需警惕","a":"","p":""},{"w":"customs data","z":"海关数据","d":"进出口报关记录，可与公司披露的外销收入对比","a":"","p":""},{"w":"enquiry letter","z":"问询函","d":"交易所要求公司解释异常事项的公开函件","a":"","p":""},{"w":"independent director resignation","z":"独立董事辞任","d":"独董集体请辞，说明内部人已经看到问题","a":"","p":""},{"w":"misappropriation of funds","z":"资金占用","d":"大股东挪用上市公司资金，A股问询函中的高频措辞","a":"","p":""},{"w":"phantom customer","z":"虚构客户","d":"报表上的大客户查无实体，或与公司由同一批人控制","a":"","p":""},{"w":"restatement","z":"财务重述","d":"重新更正已披露的历史报表，往往是暴雷的前兆","a":"","p":".ri:'steitmәnt"},{"w":"short interest","z":"空头持仓比例","d":"被卖空的股份占流通股比例，反映市场看空程度","a":"","p":""},{"w":"tax filings","z":"税务申报数据","d":"缴税额与披露利润严重不匹配，说明利润可能虚构","a":"","p":""},{"w":"provisions","z":"预计负债","d":"为担保、诉讼或质保等很可能发生的义务预先计提的负债","a":"","p":""},{"w":"recurring net profit","z":"扣非净利润","d":"扣除非经常性损益后的净利润，A股研究中衡量真实盈利的口径","a":"","p":""},{"w":"remaining performance obligations","z":"在手订单金额；未履约合同额","d":"已签约但尚未确认收入的合同金额，是收入的前瞻指标","a":"RPO","p":""},{"w":"research and development expense","z":"研发费用","d":"当期费用化的研发投入，科技和医药公司的关键跟踪项","a":"R&D","p":""},{"w":"restate","z":"重述","d":"因差错或政策变更而重新编制并对外披露以前年度的财务数据","a":"","p":".ri:'steit"},{"w":"restricted share unit","z":"限制性股票单位","d":"约定条件达成后交付股票的激励工具，港股和美股中较常见","a":"RSU","p":""},{"w":"retained earnings","z":"未分配利润","d":"历年累计净利润扣除分红后的留存部分，是分红能力的上限之一","a":"","p":""}],"iw":[{"w":"stuff","p":"stʌf","t":"n. 原料, 要素, 东西, 材料, 素质, 织品, 废物, 废话; vt. 装填; vi. 狼吞虎咽"},{"w":"access","p":"'ækses","t":"n. 通路, 入口, 接近, 进入, 使用权, 发作; vt. 访问, 存取, 接近, 使用; 访问, 存取"},{"w":"effective","p":"i'fektiv","t":"a. 有效的, 有力的, 实际的; n. 有生力量"},{"w":"payment","p":"'peimәnt","t":"n. 付款, 支付的款项(或实物), 偿还, 报应, 惩罚; 支付, 缴纳, 支付款额"},{"w":"york","p":"jɔ:k","t":"n. 约克郡；约克王朝"},{"w":"tough","p":"tʌf","t":"n. 恶棍; a. 强硬的, 艰苦的, 坚固的, 坚韧的, 粗暴的, 咬不动的"},{"w":"facility","p":"fә'siliti","t":"n. 容易, 灵巧, 设备; 设施; 设备; 装备"},{"w":"survey","p":"sә'vei","t":"n. 纵览, 视察, 测量, 俯瞰, 调查; vt. 审视, 视察, 俯瞰, 通盘考虑; vi. 测量土地"},{"w":"reference","p":"'refәrәns","t":"n. 参考, 索引, 参照; vt. 给...加上参考资料; vt. 引用; vi. 引用; 引用"},{"w":"German","p":"'dʒә:mәn","t":"n. 德国人, 德语; a. 德国的, 德国人的, 德国语的, 同父母的"},{"w":"context","p":"'kɒntekst","t":"n. 上下文, 背景, 来龙去脉; n. 上下文; 上下文"},{"w":"skin","p":"skin","t":"n. 皮肤, 皮; vt. 剥皮, 在...植皮; vi. 长皮, 愈合, 蜕皮"},{"w":"extend","p":"ik'stend","t":"v. 扩充, 延伸, 伸展, 扩大; 扩展"},{"w":"commercial","p":"kә'mә:ʃәl","t":"a. 商业的, 商用的, 商品化的; n. 商业广告节目"},{"w":"collection","p":"kә'lekʃәn","t":"n. 收集, 采集, (一批)收藏品, 募捐; 收集; 收集品, 标本"},{"w":"considerable","p":"kәn'sidәrәbl","t":"a. 相当的, 可观的, 重要的"},{"w":"arise","p":"ә'raiz","t":"vi. 站立, 出现, 起来"},{"w":"species","p":"'spi:ʃiz","t":"n. 种, 类, 外形; 茶剂; 种"},{"w":"positive","p":"'pɒzitiv","t":"a. 肯定的, 积极的, 有把握的; 正的, 阳性的"},{"w":"consumer","p":"kәn'sju:mә","t":"n. 消费者; 消费者, 用户"}],"doc":{"k":"做空报告的执行摘要","en":"Executive Summary (internal draft, not for distribution). We believe Orient Kinetic Materials materially overstates revenue. Customs data and tax filings are inconsistent with disclosed export sales, and at least three of the top ten counterparties appear to be a phantom customer with no verifiable operations. Recurring net profit is flattered by aggressive capitalised R&D, while research and development expense recognised in the period has fallen for three consecutive years. Remaining performance obligations have doubled with no matching increase in deposits, and provisions remain at zero despite outstanding guarantees. The Beneish M-score exceeds the manipulation threshold on six of eight components. We regard a restatement, an auditor resignation, an exchange enquiry letter, or further independent director resignation as likely catalysts. Short interest is below 1.5%.","zh":"执行摘要（内部草稿，不对外分发）。我们认为东亚新能源材料存在重大收入虚增。海关数据与税务申报数据同其披露的外销收入无法匹配，前十大交易对手中至少有三家疑为虚构客户，查不到可验证的实际经营。扣非净利润因激进的研发资本化而被美化，同期费用化的研发费用则已连续三年下降。在手订单金额翻倍，预收款却没有相应增加；公司存在对外担保，预计负债却仍为零。按比尼什 M 值测算，八项指标中有六项超过操纵阈值。我们认为财务重述、审计师辞任、交易所问询函，或进一步的独立董事辞任，都可能成为触发因素。当前空头持仓比例低于 1.5%。"}},{"i":11,"ti":"Ray 只问了一句：如果你是对的，它值多少","dom":"valuation","sc":"估值与倍数","tx":"十九条我列了三天，Ray 只看了四分钟。\n\n他手指压在第七条上，一直没抬头。我以为他会问江西那条从来没开过的三号线，或者{{exchange}}（交易所）公告里前后打架的产能数字。他一句都没问，把纸推回来，抬眼看我：如果你是对的，这个票值多少。\n\n我愣在那儿。我花了一整晚准备怎么证明它有问题，没准备怎么给它定价。\n\n\"有问题是{{opinion}}（看法），\"他说，\"值多少钱才是{{requirement}}（硬要求）。我不能拿一个看法去下单。\"\n\n他起身走到墙边，那儿挂着一幅整面墙的深蓝色{{painting}}（画），据说是他 2009 年在纽约买的。\"你现在的{{audience}}（受众）不是我。是风控，是 LP，是三年以后可能坐在你对面的{{attorney}}（律师）。他们要的不是十九条疑点，是一个数。\"\n\n我回工位，把{{existing}}（现有的）那版模型整个删掉，重新搭。\n\n先看市场现在给的价。它的{{trailing P/E}}（静态市盈率）四十二倍，同业中位数十四倍。有人会说它增速快，可它那笔{{revenue}}（营业收入）里到底有多少是能变成钱的，正是我那十九条在问的事。我把口径换成{{adjusted EPS}}（调整后每股盈利），把政府补贴、汇兑收益、一笔来路不明的资产处置全剔掉，四十二倍变成六十一倍。\n\n同业里有一家两地上市的公司，{{A-H premium}}（AH溢价）常年挂在四成上下，我统一用 H 股口径去比，免得自己骗自己。\n\n然后是{{net debt}}（净负债）。账上现金七十亿，短债六十二亿，看着还算干净。可这七十亿里有二十多亿是受限的保证金存款——这笔钱架在企业价值到股权价值那座桥上，根本不能当现金算。\n\n{{dividend yield}}（股息率）零点三。一家账上趴着七十亿现金、还天天喊扩产的公司，{{lack}}（缺乏）任何把钱还给股东的动作：没有{{share buyback}}（股份回购），分红聊胜于无。我在便签上写下四个字，{{capital allocation}}（资本配置）。真赚到现金的公司，钱总得有个去处；它的钱既不回股东，也没变成看得见的产线，那就只剩下一个去处。\n\nDanny 探头进来问，借券的{{budget}}（预算）要不要他先去问着。我说等等，还没到那一步。\n\n下午我去{{attend}}（出席）了一场同业的线上业绩会，为的是听{{management commentary}}（管理层表述口径）——不是听数字，是听措辞。同行讲到补贴退坡，明说去年四季度有一轮很凶的{{pull forward}}（需求前置），今年一季度会是真空期。而东亚新能源的{{guidance}}（业绩指引）上个月刚往上调过。同一个行业，同一个季度，两种世界。\n\n真正让我停下来的是卖方的动作。过去六个月，覆盖它的十一家里有九家做过向上的{{estimate revision}}（盈利预测调整），措辞几乎一模一样：我们看到了{{inflection point}}（拐点）。没有一家{{cut/raise numbers}}（下调或上调盈利预测）的理由是自己算出来的，全部照抄公司给的口径。这不是研究，这是传话。\n\n晚上八点，我把三种情形的{{target price}}（目标价）摆在一页纸上。乐观情形——假设我全错了，产能和收入都是真的——三十一块，现价四十四。中性十九块。悲观情形，如果那些应收账款收不回来，五块，甚至更低。\n\n{{risk-reward}}（风险收益比）我算得很笨：往上最多亏三成，往下能赚六到八成。这个{{option}}（选择）不难做。\n\n我把这一页拿给 Ray。他看完，第一次笑了一下，说这才是能下单的东西。然后他从抽屉里抽出一份研报扔到我面前——同一家公司，某家大行上周刚发的，评级{{overweight}}（增持），最后一行写着{{we remain constructive}}（我们维持积极看法）。\n\n\"这是全市场的{{solution}}（解法）。\"他说，\"你的解法要是对的，受{{damage}}（损失）的就不止这一家公司。\"\n\n那个{{occasion}}（场合）我记得很清楚：办公室只剩我们两个人，他一个{{senior}}（资深的）基金经理，站在那里像在交代一件{{mission}}（任务）。他说，做{{bear}}（空头）是没有掌声的，你{{eventually}}（最终）只能靠一样东西活下来，就是你的数比他们准。\n\n他又压低声音补了一句，像是{{extra}}（额外的）叮嘱：\"在你把{{target}}（目标）价交出去之前，先去看看那十一家研报的假设是怎么来的。\"\n\n我当时没听懂后半句。","ft":[{"w":"A-H premium","z":"AH溢价","d":"同一家公司A股相对H股的价差，反映两地投资者定价差异","a":"","p":""},{"w":"adjusted EPS","z":"调整后每股盈利","d":"剔除一次性项目后的每股收益，估值和一致预期多用此口径","a":"","p":""},{"w":"capital allocation","z":"资本配置","d":"公司在资本开支、分红和回购之间的取舍，直接影响估值","a":"","p":""},{"w":"cut/raise numbers","z":"下调或上调盈利预测","d":"研报口语里的砍预测和抬预测，通常先于评级调整出现","a":"","p":""},{"w":"dividend yield","z":"股息率","d":"每股分红除以股价，高股息标的估值锚定的关键指标","a":"","p":""},{"w":"estimate revision","z":"盈利预测调整","d":"分析师上调或下调预测，是股价中期方向的重要领先信号","a":"","p":""},{"w":"guidance","z":"业绩指引","d":"公司对下一期收入利润给出的预测区间，上调下调都是催化剂","a":"","p":"'gaidns"},{"w":"inflection point","z":"拐点","d":"增长或盈利由降转升的转折时点，研报最爱找的机会","a":"","p":""},{"w":"management commentary","z":"管理层表述口径","d":"业绩会上对经营和展望的说法，措辞变化本身就是信号","a":"","p":""},{"w":"net debt","z":"净负债","d":"有息负债减现金及等价物，是企业价值和股权价值之间的桥梁","a":"","p":""},{"w":"overweight","z":"增持；超配","d":"建议配置比例高于基准指数权重的评级用语","a":"","p":"'әuvә'weit"},{"w":"pull forward","z":"需求前置；提前透支","d":"补贴或促销把后面的需求提前释放，之后往往出现真空","a":"","p":""},{"w":"risk-reward","z":"风险收益比","d":"上行空间与下行空间的比值，决定这个仓位值不值得下","a":"","p":""},{"w":"share buyback","z":"股份回购","d":"公司用自有资金回购股票，股本减少可直接抬高每股盈利","a":"","p":""},{"w":"target price","z":"目标价","d":"分析师给出的十二个月合理价位，是评级的量化落点","a":"TP","p":""},{"w":"trailing P/E","z":"历史市盈率；静态PE","d":"用过去十二个月已实现盈利算的市盈率，滞后但不靠预测","a":"","p":""},{"w":"we remain constructive","z":"我们维持积极看法","d":"卖方常用措辞，表示继续看好但语气比强推克制","a":"","p":""},{"w":"revenue","z":"营业收入；收入","d":"企业销售商品或提供服务确认的收入总额，模型的第一行","a":"","p":"'revinju:"}],"iw":[{"w":"budget","p":"'bʌdʒit","t":"n. 预算; vi. 编预算; vt. 编入预算, 安排; a. 廉价的"},{"w":"painting","p":"'peintiŋ","t":"n. 画, 绘画, 油漆; 涂漆"},{"w":"solution","p":"sә'lu:ʃәn","t":"n. 解决, 解答, 溶液; 溶液"},{"w":"existing","p":"i^'zistiŋ","t":"a. 存在的, 目前的, 现存的, 现有的; 现成的, 已有的, 现存的"},{"w":"bear","p":"bєә","t":"n. 熊; vt. 忍受, 支承, 产生, 怀有, 通过卖空使跌价; vi. 忍受, 结果实, 压挤, 行进, 转向"},{"w":"opinion","p":"ә'pinjәn","t":"n. 意见, 评价, 主张; 意见"},{"w":"attorney","p":"ә'tә:ni","t":"n. 代理人, 律师; 律师, 代理人"},{"w":"audience","p":"'ɒ:diәns","t":"n. 听众, 观众, 读者; 听讼, 观众, 听众"},{"w":"damage","p":"'dæmidʒ","t":"n. 损害, 伤害; v. 损害"},{"w":"requirement","p":"ri'kwaiәmәnt","t":"n. 需求, 必要条件, 要求; 要求; 合同要求"},{"w":"extra","p":"'ekstrә","t":"n. 额外的事物, 另外的收费; a. 额外的, 特别的; adv. 额外地, 特别地, 非常地"},{"w":"exchange","p":"iks'tʃeindʒ","t":"n. 交换, (电话)交换局, 交换机, 汇兑, 交易所; v. 交换, 交易, 兑换; 交换; 电话局"},{"w":"option","p":"'ɒpʃәn","t":"n. 选择权, 挑选, 选项; 选项"},{"w":"eventually","p":"i'ventʃuәli","t":"adv. 最后, 终于"},{"w":"occasion","p":"ә'keiʒәn","t":"n. 场合, 时机, 机会, 诱因, 理由; vt. 惹起, 引起"},{"w":"senior","p":"'si:njә","t":"n. 年长者, 资深者, 毕业班学生; a. 年长的, 高级的, 资深的"},{"w":"mission","p":"'miʃәn","t":"n. 任务, 代表团, 使命, 传教团; vt. 派遣, 向...传教"},{"w":"target","p":"'tɑ:git","t":"n. 目标, 靶子, 指标; vt. 对准, 订指标"},{"w":"attend","p":"ә'tend","t":"vt. 参加, 照料, 伴随; vi. 专心于, 照顾, 服侍, 出席"},{"w":"lack","p":"læk","t":"n. 缺乏, 无, 不足; vt. 缺乏, 短少, 不足, 需要; vi. 缺乏"}],"doc":{"k":"卖方研报摘要","en":"We initiate coverage of Orient Kinetic Materials (2318.HK) with an overweight rating and a twelve-month target price of HK$62. The shares trade on a trailing P/E of 42x, a premium we consider justified by the inflection point now visible in high-nickel cathode demand. Management has raised guidance twice this year, and recent management commentary points to further upward estimate revision as new lines ramp. Revenue should compound at 48% through 2026, lifting adjusted EPS to RMB1.94. Net debt is modest at 0.4x EBITDA, and disciplined capital allocation leaves room for a higher dividend yield or a share buyback. Risk-reward remains attractive; key risks are subsidy withdrawal and receivable extension. We remain constructive.","zh":"我们首次覆盖东亚新能源材料（2318.HK），给予增持评级，十二个月目标价 62 港元。公司股价对应静态市盈率 42 倍，我们认为这一溢价是合理的，因为高镍正极需求的拐点已经显现。管理层今年两次上调业绩指引，近期的管理层表述口径也显示，随着新产线爬坡，盈利预测调整仍有向上空间。我们预计到 2026 年营业收入年均复合增长 48%，带动调整后每股盈利升至 1.94 元人民币。净负债仅相当于 0.4 倍 EBITDA，审慎的资本配置为提高股息率或实施股份回购留出了余地。当前风险收益比依然有吸引力；主要风险在于补贴退出与应收账款账期拉长。我们维持积极看法。"}},{"i":12,"ti":"第九版模型：把假的那一半砍掉之后","dom":"valuation","sc":"盈利预测","tx":"我把模型另存成第九版的时候，窗外天已经开始亮了。前八版不是算错，是问错了问题：我一直在替它算增长，而没有先{{confirm}}（确认）哪一部分收入是真的。\n\n这一版我换了做法。我把每块业务的{{driver}}（驱动因子）拆到最细——正极材料拆成量、价、单吨加工费；量再往下拆成有效产能、开工率、良率。这样拆的好处是，每一个数都得有出处，我没有随便填的{{freedom}}（自由度）。\n\n第一刀砍在{{revenue recognition}}（收入确认）上。它对经销商是发货即确认，账期给到一百八十天，还允许退换。按准则{{reform}}（改革）之后的口径，这种安排里控制权到底有没有转移，是要论证的；它的年报里对此只写了两行。我把经销商那块收入按能真正收到现金的比例重算，再把{{credit}}（信用账期）超过一年的部分整块拿掉。砍完，二〇二三年的收入从九十四亿变成五十一亿。\n\n第二刀砍在产能上。我把它披露的{{equipment}}（设备）投入除以行业单位投资额，倒推出来的产能只有它自己说的六成；再用江西基地的用电量算，只有四成。我{{adopt}}（采用）了两者里对它更宽松的那个，五成。也就是说，即使我尽量对它好，它的{{scale}}（规模）也只有账面的一半。\n\n我又用三季度的{{run-rate}}（年化运行水平）往全年推了一次，缺口是十九个亿。重算之后的三年{{CAGR}}（复合年均增长率）是 11%，不是它挂在嘴上的 62%。\n\n接下来是估值。我{{file}}（归档）了两套：一套折现，一套倍数。折现率按{{capital asset pricing model}}（资本资产定价模型）走了一遍，无风险利率取十年期国债，贝塔用同业三年滚动，市场风险溢价 6%，出来 11.4%。终值我不敢用永续增长——一家技术路线还没被验证的公司，{{terminal growth rate}}（永续增长率）取多少都是艺术，我取了 1.5%，再用{{exit multiple method}}（退出倍数法）按 6 倍 EBITDA 交叉验证一遍。\n\n两条路算出来的{{net present value}}（净现值）落在十一块到十四块之间。现价四十四。\n\n剩下的部分，不值现价的三成。\n\n我顺手又算了一遍{{payout ratio}}（分红率）：就算把它未来五年的自由现金流全部拿去分，也撑不起市场给的这个估值。这一步是{{critical}}（决定性的）——如果一家公司永远不能把钱还给股东，那所有高倍数都只能靠下一个买家接手。\n\n天亮的时候我给自己留了一行字：{{margin of safety}}（安全边际）不是我算出来的那个价格，是我算错了也不至于亏钱的那个价格。\n\n八点半，公司{{release}}（发布）了一份经营{{status}}（状态）更新，说三季度\"符合预期\"。我{{recall}}（回想起）三个月前它刚{{raise guidance}}（上调指引）过一次。一个正在往上抬预期的公司，是不会主动{{guide down}}（下调指引）的，除非它已经撑不住了。\n\n十点，我接到一个陌生电话，是个{{male}}（男性的）声音，自称某券商，说他们下周要{{initiate coverage}}（首次覆盖）这家公司，想约我聊聊，顺便问问我们的看法。我说我们没有看法。\n\n挂了电话，我调出它的历史倍数{{band}}（区间）——三年来一直贴着上沿走，中间从来没出现过一次像样的{{de-rating}}（杀估值）。三年，一次都没有。这在任何一个{{global}}（全球的）市场里都不正常。\n\n我还{{track}}（追踪）了一件旧事：上游一家厂去年因为一次{{strike}}（罢工）停产两周，全行业交货都往后推，只有它那个季度的收入照常增长。当时所有人把这当成竞争力的证明。现在我把它当成一次{{failure}}（失效）——不是它的失效，是所有人核对能力的失效。除非有人能给我另一种解释，{{otherwise}}（否则）就只剩下一种可能。\n\nRay 中午过来看我的屏幕，看了很久，问：你这版的{{base case}}（中性假设）是什么。\n\n我说，中性假设就是它一半的收入是真的。\n\n他说，那你{{essential}}（本质）上赌的不是估值，是会计。\n\n我点头。他说，那份研报里那句\"{{we see upside to consensus}}（我们认为市场预期有上修空间）\"，还有那句\"{{undemanding valuation}}（估值不贵）\"，你要不要去查查它们是怎么写出来的。\n\n我说，还有一句更狠的，叫\"{{skewed to the upside}}（风险收益偏向上行）\"。\n\n全市场十一家覆盖。第二天早上，我把它们全部打印出来，叠起来有半尺高。","ft":[{"w":"CAGR","z":"复合年均增长率","d":"多年增长折算成的年化复合增速，研报描述中期趋势常用","a":"CAGR","p":""},{"w":"base case","z":"中性假设；基准情形","d":"模型的主假设情形，目标价通常就基于这一情形算出","a":"","p":""},{"w":"capital asset pricing model","z":"资本资产定价模型","d":"无风险利率加贝塔乘市场风险溢价，用来估算股权成本","a":"CAPM","p":""},{"w":"de-rating","z":"杀估值；估值下修","d":"市场给的倍数持续下移，多伴随增长放缓或不确定性上升","a":"","p":""},{"w":"driver","z":"驱动因子","d":"拆解收入或成本的底层变量，模型里建到量价和单店层面","a":"","p":"'draivә"},{"w":"exit multiple method","z":"退出倍数法","d":"用预测期末EBITDA乘一个倍数算终值，替代永续增长法","a":"","p":""},{"w":"guide down","z":"下调指引","d":"公司主动调低全年目标，通常股价先跌预测再跟着砍","a":"","p":""},{"w":"initiate coverage","z":"首次覆盖","d":"分析师第一次发布该股深度报告并给出评级和目标价","a":"","p":""},{"w":"margin of safety","z":"安全边际","d":"价格低于内在价值留出的缓冲，价值投资常用的说法","a":"","p":""},{"w":"net present value","z":"净现值","d":"未来现金流现值减去初始投入，大于零说明项目创造价值","a":"NPV","p":""},{"w":"payout ratio","z":"分红率；派息比率","d":"分红占净利润的比例，是股息率和DDM估值的关键假设","a":"","p":""},{"w":"raise guidance","z":"上调指引","d":"把全年收入或利润目标调高，是最直接的正面催化剂","a":"","p":""},{"w":"run-rate","z":"年化运行水平","d":"把当期业绩按年折算，判断全年目标完成难度","a":"","p":""},{"w":"skewed to the upside","z":"风险收益偏向上行","d":"研报表述，指上行空间明显大于下行风险","a":"","p":""},{"w":"terminal growth rate","z":"永续增长率","d":"终值假设里的长期增速，一般取不超过名义GDP增速","a":"","p":""},{"w":"undemanding valuation","z":"估值不贵",
