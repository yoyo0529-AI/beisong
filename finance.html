笨的问题：它表内那么干净，那些不干净的东西去哪了。\n\n理财子公司是独立法人，持牌的{{subsidiary}}（子公司），法律上有完整{{autonomy}}（自主权）。可募集说明书倒数第二页，投资顾问那一栏写的是母行资产管理部。所谓独立，{{practically}}（事实上）并不独立。\n\n产品名字排开像一支{{parade}}（游行队伍）：稳健添利 1 号排到 87 号，还有个投{{commonwealth}}（英联邦）国家商业地产的\"环球\"系列。名字全是好词，编号越往后底层越看不清。\n\n说明书我全打了出来，那台{{laser}}（激光）打印机响了四十分钟，出来一沓十二厘米厚。周六下午没人，{{sunlight}}（日光）斜着打进来，我摊了一整张会议桌。\n\n真正{{disclose}}（披露）的少得可怜。底层只到大类：固收 78%，权益 6%，其他 16%，\"其他\"没有明细。整份文件唯一用{{bold}}（粗体）印的是\"本产品不保本\"——所有人都会跳过的那句。\n\n净值一周{{update}}（更新）一次。我把 106 只产品三年的净值曲线叠在一起，没有一只在任何一周跌过。\n\n我问 Danny 能不能拉一份持仓穿透。他从{{gym}}（健身房）回的，喘着气说行，等我洗个澡。四十分钟后{{feedback}}（反馈）过来：这 106 只里有 38% 的仓位是各家银行的{{negotiable certificate of deposit}}（同业存单）——你买我的，我买你的。\n\n我攥了一下{{fist}}（拳头）。这不是投资，是一个闭环。\n\n真正的{{destination}}（目的地）在\"其他\"那 16% 里。我一只一只往下扒，扒出 17 只的底层指向同一个信托计划，融资人是一家供应链服务公司——它过去两年的利润几乎全来自一笔地方{{subsidy}}（补贴），而公开客户名单第四行是东亚新能源。\n\n我的{{thesis}}（论点）在那个下午变了。\n\n之前我以为在查一家造假的制造业公司，顺带查到给它放款的银行。现在反过来了：银行是这条链的资金来源，用的还不是自己的钱，是一堆写着\"稳健\"的产品从散户手上募来的钱。\n\n我打给老周，他在阳台浇花。\n\n\"银行不是一栋楼，\"他说，\"是{{organism}}（有机体）。表内是骨头，表外是血。只量骨头，量不出这个人快不快死。\"\n\n他让我看两个数。\n\n一是{{loan migration ratio}}（迁徙率）：不良不动，关注类往下迁徙的比例两年从 19% 涨到 42%——{{asset quality deterioration}}（资产质量恶化）不是没发生，是被拦在分类门口。\n\n二是{{return on equity}}（净资产收益率）13.5%，同业里很漂亮。可它用{{standardised approach}}（权重法）算风险资产，杠杆高、资本薄，这回报是杠杆撑出来的。它的{{operating jaws}}（经营剪刀差）也反了：成本增速连续六个季度跑赢收入。\n\n我问他，表外那些资产要是回表呢。\n\n\"那就叫{{balance sheet repair}}（修复资产负债表），\"老周说，\"听着像装修，其实是拆房子。先是产品到期兑付不了，本金被{{write-down}}（减记）；然后钱往大行和国债跑，这叫{{flight to quality}}（避险）；再往后小银行放不出款，就是{{credit crunch}}（信贷紧缩）。\"\n\n\"最坏是{{receivership}}（接管清算）。\"他说，\"但那是最后一步。\"\n\n我问他，监管看不见吗。\n\n\"看得见。\"他说，\"国际货币基金组织的{{Financial Sector Assessment Program}}（金融部门评估规划）上一轮就点过表外和刚性兑付。可这家行连{{domestic systemically important bank}}（国内系统重要性银行）名单都进不去，够不上{{total loss-absorbing capacity}}（总损失吸收能力）那套要求。它太小了，小到不值得被盯住。\"\n\n\"它还有个更老实的毛病，\"老周说，\"{{interest rate risk in the banking book}}（银行账簿利率风险）：买了一大堆长久期的债，负债全是短的。利率一动，浮亏比一年的利润还大。\"\n\n窗外太阳落了。我把那 17 只的编号抄下来，下面写了四个字：{{clearing and settlement}}（清算与结算）。这些钱每天都在真实地流动，走真实的账户，对真实的对手方。\n\n我想起刚入行时一位客户经理给我{{endorse}}（背书）过一只产品：放心，银行卖的，出不了事。那话当年的{{incidence}}（发生率）是百分之百。\n\n第二天早上八点四十，Danny 拿着手机进来，脸色不对。\n\n\"它昨天那期存单，\"他说，\"没发满。\"","ft":[{"w":"Financial Sector Assessment Program","z":"金融部门评估规划","d":"国际货币基金组织对一国金融体系的全面体检","a":"FSAP","p":""},{"w":"asset quality deterioration","z":"资产质量恶化","d":"不良、关注类持续上升的状态，研报里的高频说法","a":"","p":""},{"w":"balance sheet repair","z":"修复资产负债表","d":"通过核销、补资本和压降杠杆恢复健康的过程","a":"","p":""},{"w":"clearing and settlement","z":"清算与结算","d":"交易达成后完成资金和证券交收的环节","a":"","p":""},{"w":"credit crunch","z":"信贷紧缩","d":"银行普遍惜贷，实体企业融不到钱，衰退的典型特征","a":"","p":"ˈkredit krʌntʃ"},{"w":"domestic systemically important bank","z":"国内系统重要性银行","d":"国内层面的系统重要性名单，工农中建等均在列","a":"D-SIB","p":""},{"w":"flight to quality","z":"避险；资金转向优质资产","d":"恐慌时资金涌向国债和大行，中小机构失血更快","a":"","p":""},{"w":"interest rate risk in the banking book","z":"银行账簿利率风险","d":"利率变动对存贷和持债组合的冲击，硅谷银行的死因","a":"IRRBB","p":""},{"w":"loan migration ratio","z":"迁徙率","d":"各类贷款向下迁徙的比例，用来预判未来不良生成","a":"","p":""},{"w":"negotiable certificate of deposit","z":"同业存单","d":"银行发行的短期主动负债工具，中小行高度依赖","a":"NCD","p":""},{"w":"operating jaws","z":"经营剪刀差","d":"汇丰、渣打年报常用，强调收入增长要快过成本增长","a":"","p":""},{"w":"receivership","z":"接管；托管清算","d":"监管机构接管倒闭银行并处置其资产的法律安排","a":"","p":"ri'si:vәʃip"},{"w":"return on equity","z":"净资产收益率","d":"净利润除以净资产，银行估值最看重的回报指标","a":"ROE","p":""},{"w":"standardised approach","z":"权重法；标准法","d":"按监管统一权重计算风险资产，中小行普遍采用","a":"","p":""},{"w":"total loss-absorbing capacity","z":"总损失吸收能力","d":"全球系统重要性银行必须备足的可吸损债务和资本","a":"TLAC","p":""},{"w":"write-down","z":"减记","d":"触发事件下把债券本金直接清零，瑞信AT1就是这么归零的","a":"","p":"'raitdaun"}],"iw":[{"w":"gym","p":"dʒim","t":"n. +体育馆, 体育训练, 体育课, 体操"},{"w":"disclose","p":"dis'klәuz","t":"vt. 揭露, 透露; 揭发, 揭露, 公开"},{"w":"fist","p":"fist","t":"n. 拳头, 手; vt. 拳打, 握成拳, 紧握"},{"w":"destination","p":".desti'neiʃәn","t":"n. 目的地, 目标, 目的; 目的文件, 目的单元"},{"w":"endorse","p":"in'dɒ:s","t":"vt. 支持, 赞同, 背书于, 签署; 赞成, 背书"},{"w":"update","p":"ʌp'deit","t":"vt. 更新, 使现代化; n. 更新; 更新"},{"w":"thesis","p":"'θi:sis","t":"n. 论题, 论文"},{"w":"feedback","p":"'fi:dbæk","t":"n. 反馈, 反应; 反馈"},{"w":"commonwealth","p":"'kɔmәnwelθ","t":"n. 共和国；联邦；国民整体"},{"w":"sunlight","p":"'sʌnlait","t":"n. 日光; 日光, 太阳光"},{"w":"laser","p":"'leizә","t":"n. 激光; 激光器"},{"w":"bold","p":"bәuld","t":"a. 大胆的; n. 粗体; 粗体"},{"w":"starting","p":"'stɑ:tiŋ","t":"n. 开端, 开始, 出发, 起动, 开动; 开动, 起动"},{"w":"practically","p":"'præktikli","t":"adv. 几乎, 差不多, 事实上"},{"w":"subsidiary","p":"sәb'sidiәri","t":"n. 子公司, 附件, 辅助者; a. 辅助的, 次要的, 津贴的"},{"w":"incidence","p":"'insidәns","t":"n. 发生, 发生率, 影响, 负担者, 入射, 倾角; 入射, 发生率, 发生数"},{"w":"parade","p":"pә'reid","t":"n. 游行, 炫耀, 阅兵; v. 游行, 炫耀, (使)列队行进"},{"w":"subsidy","p":"'sʌbsidi","t":"n. 补助金, 津贴; 补助金, 津贴, 补贴"},{"w":"autonomy","p":"ɒ:'tɒnәmi","t":"n. 自治, 自治权; 自主性"},{"w":"organism","p":"'ɒ:gәnizm","t":"n. 生物, 有机体, 社会组织; 生物 , 机体"}],"doc":{"k":"金融部门评估规划技术报告摘要","en":"FINANCIAL SECTOR ASSESSMENT PROGRAM - Technical Note (extract). Wealth management products issued through bank subsidiaries remain a principal channel for off-balance-sheet intermediation. Disclosure of underlying holdings is limited to broad asset classes, and a material share of these portfolios consists of negotiable certificate of deposit issued by other deposit-taking institutions, producing circular exposure across the system. Reported asset quality deterioration in the banking book appears modest, yet the loan migration ratio has risen sharply, suggesting that classification lags underlying performance. Return on equity is supported by leverage rather than by asset returns, and most mid-sized issuers apply the standardised approach. Only institutions designated as a domestic systemically important bank face enhanced requirements; total loss-absorbing capacity rules do not apply. Disorderly balance sheet repair could trigger flight to quality and a broader credit crunch.","zh":"金融部门评估规划——技术报告（节录）。经由银行子公司发行的理财产品，仍是表外融资的主要渠道。此类产品对底层持仓的披露仅限于大类资产层面，其中相当比例的仓位为其他吸收存款机构发行的同业存单，从而在体系内形成互持的循环敞口。银行账簿内所披露的资产质量恶化幅度看似有限，但贷款迁徙率已显著上升，显示分类调整滞后于底层资产的实际表现。净资产收益率主要由杠杆而非资产回报支撑，且多数中型发行机构采用权重法。仅被列为国内系统重要性银行的机构须满足强化监管要求；总损失吸收能力规则并不适用于此类机构。若修复资产负债表的过程失序，可能引发避险性资金转移，并进一步演化为更大范围的信贷紧缩。"}},{"i":83,"ti":"没发满","dom":"bank","sc":"流动性与批发融资","tx":"\"没发满\"这三个字，那天上午全市场大概只有几十个人在意。\n\n计划发行 50 亿，实际认购 21 亿，票面利率比上一期高 46 个基点。中国货币网上就是一行数字，夹在上百条公告里，不{{fascinating}}（吸引人），也不吓人。要连着看三个月，才知道这一行意味着什么。\n\nDanny 把三个月的数据导成表，我托着{{chin}}（下巴）一行一行{{flip}}（翻）。九月还能发满，十月开始加价，十一月加 22 个基点勉强发完，这一期直接{{vanish}}（消失）一半认购。\n\n同业存单是它{{interest-bearing liabilities}}（计息负债）里最容易被抽走的一块。存款是黏的，同业的钱是流的：前一天还在，第二天就不来。\n\n资产那一边在往下走。一月做过一次集中的{{loan repricing}}（贷款重定价），存量按新基准下调，{{asset yield}}（资产收益率）一次性掉了 31 个基点，回不来。\n\n一头往上，一头往下。这就是全部的故事。\n\n我把两条线画在同一张纸上，画完先{{confess}}（承认）一件事：我一直有{{bias}}（偏见），只盯造假，把银行当背景板。其实银行才是链上那个每天都要还钱的{{recipient}}（接受方）——得先收到钱，才能把昨天的钱还掉。\n\n晚上加班。Danny 点外卖，我{{peel}}（剥）橘子，剥到一半才发现我们三个小时没说话。他把纸巾团扔向{{garbage}}（垃圾桶），没进。\n\n那天是我生日。他弄来块小蛋糕，插根{{candle}}（蜡烛），说许个愿。我说许过了。他笑得很{{fierce}}（放肆），说肯定是许它跌。\n\n我约的{{therapist}}（心理咨询师），一周一次，那晚第三次，我又取消了。\n\n十点半，我{{edit}}（编辑）了份内部纪要，只发给 Ray 和 Danny，四段。\n\n第一段：三年累计{{write-off}}（核销）89 亿，同期{{recovery}}（清收收回）4 亿，{{net charge-off ratio}}（净核销率）0.61%，而披露的不良率 1.48%，三年不动。损失一直在发生，只是被核销这把刀削平了。\n\n第二段：核销之前很多贷款先走了{{forbearance}}（展期宽限）。展期不算不良，到期还不上再展一次。\n\n第三段：1,100 亿{{trust loan}}（信托贷款）挂在\"投资类金融资产\"下，按 100% 权重计入{{risk-weighted assets}}（风险加权资产）。坏一成，资本的账就要重算。\n\n第四段：它上个月刚做完的{{stress test}}（压力测试）里，同业融资续作假设是\"保持通畅\"。而这一期没发满。\n\nRay 半小时后回：把所有城商行的存单发行数据拉一遍，我要看是它一家还是一批。\n\n拉完是凌晨两点。是一批，但它最难看。我{{contemplate}}（盘算）过要不要把纪要往外发，最后没有。\n\n第二天早上老周打来。他昨晚也在看同一批数据——这{{realm}}（领域）里就剩几个还愿意做手工活的人。\n\n他用了个{{metaphor}}（隐喻）：\"{{credit cycle}}（信贷周期）像潮水。涨的时候船一起浮起来，看不出谁船底有洞；退了才发现，有洞的那几条早在进水。\"\n\n\"再看 2008 年的{{collateralised debt obligation}}（担保债务凭证），\"他说，\"手法和今天的理财一样：把一堆看不清的债{{blend}}（混合）起来，切成几层，最上面那层评高等级卖给最保守的人。逻辑一个字没改。\"\n\n\"欧洲那个更难看的叫{{doom loop}}（主权与银行的死亡循环）：银行大量持有本国国债，国家出事银行跟着完；救银行国家又掏钱，国债更不值钱。\"\n\n我问他最好的结局是什么。\n\n\"最好是{{orderly liquidation}}（有序清算）——按程序变现，按顺序清偿，听上去很{{splendid}}（体面）。\"他说，\"可真走到那一步，前面已经躺着一批{{casualty}}（受害者），第一批永远是买了产品的人。\"\n\n他说{{Financial Stability Board}}（金融稳定理事会）管的是全球性大机构，一家地方城商行不在名单上，也不在任何人的雷达上。\n\n\"还有{{bancassurance}}（银保渠道），\"他说，\"网点替保险公司卖年金，冲中间业务收入。真出事，第一批冲进网点退保的也是这批人。\"\n\n\"每场事故都有个{{starter}}（起头的人），\"他最后说，\"但事后没人找得到他。\"\n\n那天晚上我睡得很好。\n\n第二天，事情没有落在它头上。\n\n周四晚上十一点多，一条五百字的东西开始在群里转。讲的不是这家银行。","ft":[{"w":"Financial Stability Board","z":"金融稳定理事会","d":"协调全球金融监管改革、发布系统重要性名单的机构","a":"FSB","p":""},{"w":"asset yield","z":"资产收益率；资产端定价","d":"生息资产的平均收益水平，反映贷款定价能力","a":"","p":""},{"w":"bancassurance","z":"银保渠道；银保业务","d":"通过银行网点销售保险产品的合作模式","a":"","p":""},{"w":"collateralised debt obligation","z":"担保债务凭证","d":"把债务分层打包的结构化产品，二〇〇八年爆雷核心","a":"CDO","p":""},{"w":"credit cycle","z":"信贷周期","d":"信贷投放由松到紧的循环，决定不良的高低起伏","a":"","p":""},{"w":"doom loop","z":"主权与银行的死亡循环","d":"银行大量持有本国国债，主权与银行风险互相拖累","a":"","p":""},{"w":"forbearance","z":"展期宽限；纾困安排","d":"对还款困难客户放宽条件，容易掩盖真实资产质量","a":"","p":"fɒ:'bєәrәns"},{"w":"interest-bearing liabilities","z":"计息负债","d":"存款、同业负债等需要付息的资金来源","a":"","p":""},{"w":"loan repricing","z":"贷款重定价","d":"存量贷款按新基准调整利率，直接影响下一年息差","a":"","p":""},{"w":"net charge-off ratio","z":"净核销率","d":"核销额减去收回额后占贷款的比例，看真实损失率","a":"NCO","p":""},{"w":"orderly liquidation","z":"有序清算","d":"按既定程序变现资产、清偿债权，避免市场恐慌","a":"","p":""},{"w":"recovery","z":"清收；收回","d":"对已核销或不良贷款追讨回来的部分，可以回补利润","a":"","p":"ri'kʌvәri"},{"w":"risk-weighted assets","z":"风险加权资产","d":"按风险高低给资产打权重后的总额，资本充足率的分母","a":"RWA","p":""},{"w":"stress test","z":"压力测试","d":"假设极端情景测算资本能否扛住，监管年度必修课","a":"","p":"stres test"},{"w":"trust loan","z":"信托贷款","d":"通过信托公司发放的贷款，典型的影子银行通道","a":"","p":""},{"w":"write-off","z":"核销","d":"把确认无法收回的不良从表内直接注销，压降不良率的常用手段","a":"","p":"'rait,ɔf"}],"iw":[{"w":"realm","p":"relm","t":"n. 王国, 领土, 领域; 领域"},{"w":"blend","p":"blend","t":"vt. 混合; n. 混合"},{"w":"therapist","p":"'θerәpist","t":"n. 治疗学家; 治疗学家"},{"w":"recipient","p":"ri'sipiәnt","t":"a. 领受的, 容易接受的, 感受性强的; n. 领受者, 容纳者, 容器"},{"w":"peel","p":"pi:l","t":"n. 皮, 外壳; vt. 削...皮, 剥去...的壳; vi. 蜕皮, 剥落, 脱皮, 脱去衣服"},{"w":"flip","p":"flip","t":"vt. 掷, 弹, 轻击, 空翻; vi. 用指轻弹, 抽打, 蹦跳; n. 抛, 弹, 筋斗; a. 无礼的; 翻转"},{"w":"bias","p":"'baiәs","t":"n. 偏见, 斜纹; a. 偏斜的; adv. 偏斜; vt. 使有偏见; 偏流; 偏压; 偏磁; 偏离"},{"w":"metaphor","p":"'metәfә","t":"n. 隐喻"},{"w":"candle","p":"'kændl","t":"n. 蜡烛; vt. 对着光检查"},{"w":"fierce","p":"fiәs","t":"a. 凶猛的, 猛烈的, 热烈的, 暴躁的"},{"w":"fascinating","p":"'fæsineitiŋ","t":"a. 迷人的, 吸引人的, 使人神魂颠倒的"},{"w":"garbage","p":"'gɑ:bidʒ","t":"n. 垃圾, 废物; 无用信息"},{"w":"edit","p":"'edit","t":"vt. 编辑, 编校, 修订, 剪辑; 编辑; DOS外部命令:该命令是一个用于编辑文本文件的全屏幕编辑程序"},{"w":"casualty","p":"'kæʒjuәlti","t":"n. 意外事故, 伤亡, 受害者; 事故"},{"w":"chin","p":"tʃin","t":"n. 下巴, 颏; 颏"},{"w":"vanish","p":"'væniʃ","t":"vi. 消失, 不见, 成为零"},{"w":"confess","p":"kәn'fes","t":"v. 承认, 坦白, 忏悔, 供认"},{"w":"contemplate","p":"'kɒntempleit","t":"vt. 注视, 沉思, 盘算; vi. 冥思苦想"},{"w":"starter","p":"'stɑ:tә","t":"n. 开端者, 在起跑线上的人, 参加赛跑的人, 调度员, 起动机, 酵母; 启动程序, 启动器"},{"w":"splendid","p":"'spendid","t":"a. 光亮的, 了不起的, 灿烂的, 壮丽的, 显著的, 杰出的"}],"doc":{"k":"银行年报流动性与融资风险披露段落","en":"LIQUIDITY AND FUNDING RISK (extract). During the period the average cost of the Bank's interest-bearing liabilities rose, while asset yield declined by 31 basis points following the scheduled loan repricing of the existing portfolio in January. Cumulative write-off over the past three years totalled RMB 8.9bn against recovery of RMB 0.4bn, implying a net charge-off ratio of 0.61%. Exposures subject to forbearance are not automatically reclassified where repayment is assessed as probable. Trust loan holdings recorded under investment financial assets carry a 100% weighting within risk-weighted assets. The Bank's most recent stress test assumed continued access to interbank funding throughout the projection horizon. Management considers the Bank's position consistent with the prevailing credit cycle, and confirms that no orderly liquidation planning has been initiated.","zh":"流动性与融资风险（节录）。报告期内，本行计息负债的平均成本有所上升；同时，受一月对存量组合实施的集中贷款重定价影响，资产收益率下降 31 个基点。过去三年累计核销人民币 89 亿元，同期清收收回人民币 4 亿元，隐含净核销率为 0.61%。对于经评估还款仍属很可能实现的借款人，其获得展期宽限的敞口不会被自动重新分类。列示于投资类金融资产项下的信托贷款，在风险加权资产中按 100% 权重计量。本行最近一次压力测试假设在整个测算期内可持续获得银行间融资。管理层认为本行状况与当前信贷周期相符，并确认尚未启动任何有序清算的预案安排。"}},{"i":84,"ti":"五百字","dom":"bank","sc":"挤兑与传染","tx":"那条东西五百字，没标题，没署名，转到我手机上时已经是第四手。\n\n它说的是淮通银行——同省另一家城商行，比我盯的那家小一半。全文只讲一件事：该行一笔到期的{{bank acceptance bill}}（银行承兑汇票）没兑付，持票人在网点等了两天。附一张照片，一个柜台，一个背影。\n\n我逐句读了三遍。它的{{accuracy}}（准确性）根本不重要——重要的是写得像真的：有金额，有日期，有支行名字，有一句\"内部人士称\"。它的{{intent}}（意图）我到今天也不知道。\n\n但它挑的点非常准。承兑汇票是银行自己的信用，签字承诺到期一定付。一张票没兑，等于银行说话不算数——不懂金融也听得懂。\n\n周五上午第一批人去了网点。下午，队伍从支行门口排到{{civic}}（市民的）广场那侧的街角。有人拍了视频，柜台上方还挂着上月新{{decorate}}（装饰）的横幅，红底黄字：\"陪伴您三十年\"。\n\n那个周末，这座{{metropolitan}}（大都市）里做银行的人都没睡好。\n\n周六，另外两个市的支行也开始排队。{{geography}}（地理）在这事上没有意义——传播速度和距离无关，只和多少人转发有关。老周说，这跟半夜在戏院里喊\"抓{{thief}}（贼）\"一样：有没有贼不重要，门在哪里才重要。\n\n两天。三成存款。\n\n周日下午我把淮通的年报调出来，做了一次{{inventory}}（清点）。\n\n{{current account and savings account}}（活期占比）58%。这些钱任何一分钟都能走掉，一个手机银行的按钮而已。\n\n{{loan-to-deposit ratio}}（存贷比）91%，本来就高。存款走掉三成，直接崩掉。\n\n{{common equity tier 1}}（核心一级资本）8.4%，看着还行，但那是静态的：资本能扛住亏损，扛不住没钱。\n\n{{interest-earning assets}}（生息资产）里 41% 是长久期的债和非标，卖不掉或只能折价卖。\n\n{{net interest income}}（净利息收入）两年一直在{{diminish}}（减少），因为{{funding cost}}（负债成本）在涨——它前年就开始高息揽储，一年期比大行高 65 个基点。愿意出更高的价买钱，本身就是自白。\n\n还有一批 90 天以上的{{overdue loan}}（逾期贷款），归在\"关注类\"里没下调。\n\n这些数字没一个是新的，都在年报里躺了两年，没人当回事。传闻不需要制造真相，只需要让人重读一遍已经公开的东西。\n\n老周给我讲{{Greece}}（希腊）。2010 年之后，欧洲一批银行明明资不抵债，靠输血活着，叫{{zombie bank}}（僵尸银行）。它们最大的破坏力不是自己倒，是占着信贷资源不放。\n\n他又讲 2007 年。一批银行把资产塞进表外的{{structured investment vehicle}}（结构性投资工具），拿短期票据滚长期资产，母行的资本占用被{{chop}}（砍）掉一大块。这叫{{regulatory capital arbitrage}}（监管资本套利）——用{{securitisation}}（资产证券化）把资产挪出去，风险还在，资本不用占。\n\n\"到最后表外那些东西必须回来，\"老周说，\"回来那天谁都没准备好。\"\n\n真正决定生死的是{{asset-liability management}}（资产负债管理）：期限、利率、流动性要匹配。淮通拉得太开。平时看很{{productive}}（有效益的）——用长资产赚短钱，息差好看；出事时，就是把自己绑成别人的{{hostage}}（人质）。\n\n我又想起一件小事：这家行常年代销一款年金险，那家保险公司的{{embedded value}}（内含价值）报告很干净。可代销渠道一垮，那份干净也没什么{{flavour}}（意味）了——所有的干净都是有条件的。\n\n根子在更早：前几年冲规模，{{underwriting standards}}（授信标准）一路放松，什么都敢批。宽时埋雷，紧时引爆。\n\n去年央行那份《{{Financial Stability Report}}（金融稳定报告）》里有段话我扫一眼就翻过去了：部分中小银行负债结构不稳定，对市场化融资依赖度偏高，需关注风险传染性。没有点名。\n\n这次我把那一页{{descend}}（向下）翻到底，找到脚注。脚注给了个样本量：37 家。\n\n三成存款走掉的{{magnitude}}（量级）不是一家银行的事。我以为这是{{prevention}}（预防）胜于救火的游戏，现在知道不是——没人在预防，所有人都在等谁先{{intervene}}（干预）。\n\n这个周末最{{exceptional}}（反常）的是没有任何官方声音，安静得像块石头。事情的{{gravity}}（严重程度）大概就藏在这份安静里。\n\n周日晚上八点整，公告出来了。\n\n比我想的快。","ft":[{"w":"Financial Stability Report","z":"金融稳定报告","d":"央行或监管定期发布，评估系统性风险状况的报告","a":"FSR","p":""},{"w":"asset-liability management","z":"资产负债管理","d":"匹配期限、利率和流动性结构的经营管理职能","a":"ALM","p":""},{"w":"bank acceptance bill","z":"银行承兑汇票","d":"银行承诺到期兑付的票据，中国企业融资的常见工具","a":"","p":""},{"w":"common equity tier 1","z":"核心一级资本","d":"普通股和留存收益构成，吸收损失能力最强的资本","a":"CET1","p":""},{"w":"current account and savings account","z":"活期存款；活期占比","d":"低息的活期和储蓄存款，占比越高负债成本越低","a":"CASA","p":""},{"w":"embedded value","z":"内含价值","d":"保险公司存量保单价值加调整后净资产的估值口径","a":"EV","p":""},{"w":"funding cost","z":"负债成本；付息率","d":"银行获取存款和同业资金付出的平均利率","a":"","p":""},{"w":"interest-earning assets","z":"生息资产","d":"贷款、债券投资等能产生利息收入的资产","a":"","p":""},{"w":"loan-to-deposit ratio","z":"存贷比","d":"贷款余额除以存款余额，看放贷有没有超出存款支撑","a":"LDR","p":""},{"w":"net interest income","z":"净利息收入","d":"利息收入减利息支出，中资银行营收的大头","a":"NII","p":""},{"w":"overdue loan","z":"逾期贷款","d":"本息未按期偿还的贷款，逾期九十天以上通常要计入不良","a":"","p":""},{"w":"regulatory capital arbitrage","z":"监管资本套利","d":"通过通道或结构安排少占资本，影子银行的老套路","a":"","p":""},{"w":"securitisation","z":"资产证券化","d":"把贷款打包成可交易证券卖出，实现出表和资本释放","a":"","p":"si,kjurətai'zeiʃən"},{"w":"structured investment vehicle","z":"结构性投资工具","d":"靠短期票据融资买长期资产的表外载体，危机中崩塌","a":"SIV","p":""},{"w":"underwriting standards","z":"授信标准；风控尺度","d":"放贷时的审批松紧程度，宽松期埋雷、紧缩期加剧信贷收缩","a":"","p":""},{"w":"zombie bank","z":"僵尸银行","d":"资不抵债却靠输血维持经营的银行，拖累信贷配置","a":"","p":""}],"iw":[{"w":"gravity","p":"'græviti","t":"n. 地心引力, 重力; 重力"},{"w":"intervene","p":".intә'vi:n","t":"vi. 插入, 调停, 干涉; 进场干预"},{"w":"decorate","p":"'dekәreit","t":"v. 装饰"},{"w":"accuracy","p":"'ækjurәsi","t":"n. 精确, 正确; 准确度"},{"w":"diminish","p":"di'miniʃ","t":"v. (使)减少, (使)变小"},{"w":"prevention","p":"pri'venʃәn","t":"n. 阻止, 妨碍, 预防; 预防"},{"w":"intent","p":"in'tent","t":"n. 意图, 含义, 故意; a. 专心的, 决心的, 热心的"},{"w":"metropolitan","p":".metrә'pɒlitn","t":"n. 大都市居民, 都主教, 宗主国的公民; a. 大都市的, 都主教区的, 宗主国的"},{"w":"chop","p":"tʃɒp","t":"n. 肋条肉, 排骨, 砍, 戳记, 商标; vt. 剁碎, 砍, 切击, 割断; vi. 砍, 突然转向"},{"w":"Greece","p":"gri:s","t":"n. 希腊"},{"w":"thief","p":"θi:f","t":"n. 小偷, 贼; 取样"},{"w":"flavour","p":"'fleivә","t":"n. 味, 调味香料, 滋味, 香味, 气味, 风味, 情味, 情趣, 风韵; vt. 给...调味, 给...增添风趣, 加香料, 加味于"},{"w":"productive","p":"prә'dʌktiv","t":"a. 能生产的, 有生产价值的, 多产的; 产出性的, 产生性的"},{"w":"geography","p":"dʒi'ɒgrәfi","t":"n. 地理学, 地理; 地理"},{"w":"inventory","p":"'invәntәri","t":"n. 详细目录, 存货清单; vt. 列入详细目录, 清点存货; 存货清单"},{"w":"civic","p":"'sivik","t":"a. 市的, 市民的, 公民的; 公民的, 市民的, 公民资格的"},{"w":"exceptional","p":"ik'sepʃәnәl","t":"a. 例外的, 异常的, 特别的"},{"w":"descend","p":"di'send","t":"vi. 下降, 世代相传, 屈尊, 袭击; vt. 下降"},{"w":"magnitude","p":"'mægnitju:d","t":"n. 巨大, 重大, 重要, 大小, 数量, 星等(指星的亮度); 大小; 值"},{"w":"hostage","p":"'hɒstidʒ","t":"n. 人质, 抵押品; 人质, 抵押品"}],"doc":{"k":"金融稳定报告专栏节录","en":"FINANCIAL STABILITY REPORT - Box 4: Funding Structures at Small and Medium Banks (extract). A sample of 37 institutions shows rising reliance on price-sensitive funding. Median funding cost increased by 65 basis points, compressing net interest income even as interest-earning assets continued to expand. The share of current account and savings account balances has fallen, while the loan-to-deposit ratio at the upper quartile exceeds 90%. Overdue loan balances of more than 90 days are not consistently downgraded. Several institutions continue to employ securitisation and off-balance-sheet structures in ways that resemble regulatory capital arbitrage, including legacy structured investment vehicle arrangements. Common equity tier 1 ratios appear adequate on a static basis but afford limited protection against rapid funding withdrawal. Loose underwriting standards during the expansion phase remain the principal underlying driver.","zh":"金融稳定报告——专栏四：中小银行的负债结构（节录）。37 家样本机构显示，其对价格敏感型资金的依赖度持续上升。负债成本中位数上升 65 个基点，即使生息资产仍在扩张，净利息收入亦受到挤压。活期与储蓄存款的占比下降，而处于上四分位的机构存贷比已超过 90%。逾期 90 天以上的贷款并未被一致下调分类。部分机构继续通过资产证券化及表外结构安排开展业务，其形式近似于监管资本套利，其中包括历史遗留的结构性投资工具安排。核心一级资本充足率在静态口径下尚属充足，但对资金的快速流失仅能提供有限保护。扩张期内宽松的授信标准，仍是上述问题的根本成因。"}},{"i":85,"ti":"第三段","dom":"bank","sc":"救助与处置","tx":"公告周日晚上八点整挂出来，三段，四百多字，比那条传闻还短。\n\n第一段：自即日起对淮通银行实施接管。第二段：个人存款按存款保险制度全额保障——那家行早就{{enroll}}（登记加入）了，只是没人记得。第三段：同业债权按比例保障。\n\n第三段才狠：个人存款保住了，同业的钱不保。\n\n我站着读了两遍。手机在震，群里有人在骂，那种纯粹的{{rage}}（愤怒），骂完又问：那我买的理财呢？\n\n理财不在保障范围内。没人回答。\n\n我叫了辆{{cab}}（出租车）去机场。司机的广播在播{{automobile}}（汽车）出口，一路没人说话。到{{terminal}}（航站楼）十一点，只剩两个值机柜台开着。红眼航班，我靠窗，能看见下面的山{{ridge}}（山脊）。\n\n真正让我意外的是附件里的第二件事：监管同时对另外六家银行启动{{supervisory review}}（现场检查）。名单第三家就是我盯了三个月的那家城商行。\n\n进驻时间：明日。不是下周，不是本月内。明日。\n\n还有三条：暂停新增同业投资；暂停代销新产品；本年度分红被{{prohibit}}（禁止）。第三条最要命。禁止分红等于公开告诉市场：它的资本不够。\n\n我从没见过{{macroprudential policy}}（宏观审慎管理）落地这么快。现实里是一份四百字的公告，第二天早上人就在门口。也没留{{regulatory forbearance}}（监管容忍）的口子——往年给半年整改期，这次一条没给。\n\n飞机落地是{{dawn}}（黎明）。我在到达大厅走得太急，被行李箱{{stumble}}（绊）了一下。\n\nRay 六点半就在办公室，眼睛是红的。\n\n\"你的三个月，\"他说，\"现在只剩三天。\"\n\n{{NPL formation rate}}（不良生成率）：新增不良加回核销除以期初贷款。我算出来 1.9%，是它披露不良率的一倍多——坏账一直在生成，只是生成一笔核销一笔。\n\n{{net interest margin}}（净息差）1.52% 还在往下走；{{pre-provision operating profit}}（拨备前利润）勉强覆盖减值，前提是生成率不再往上。\n\n{{concentration risk}}（集中度风险）：前十大对公客户占资本净额很大一块，三家在同一条产业链上，包括东亚新能源——要出问题是同时出。\n\n{{undrawn credit line}}（未提用授信额度）2,300 亿，平时是荣誉数字，现在是炸弹——客户一听风声就把额度提满。\n\n它的{{assets under management}}（管理资产规模）8,900 亿不在表内，可持有人都当成\"银行的钱\"。它还是几十只资管产品的{{custodian bank}}（托管银行），一旦出现{{settlement risk}}（结算风险），影响的就不止它一家。\n\nDanny 在交易台喊：它的存单二级有报价了，收益率比上周高 180 个基点。有人在卖。{{funding stress}}（融资压力）不是形容词，是屏幕上看得见的数字。\n\n八点四十，Ray 让我做个{{forecast}}（预测）：它会不会走到{{bank run}}（挤兑）那一步。\n\n我说不会，央行大概率会给{{emergency liquidity assistance}}（紧急流动性援助）；眼下更多是流动性问题，救得住。\n\n\"那你的手为什么在抖。\"\n\n我把手放下。\n\n九点开盘。同一条消息前后十分钟能定出两个价格——这市场是{{dynamic}}（不断变化的）。前十分钟银行股一起跌，第十一分钟起大行收窄，中小行继续往下。\n\n我一直{{cling}}（紧抱）着一个想法：我做空的是一家造假的公司。到这一天我得承认，这想法太{{precious}}（过于精致）了。链的另一头是几万个买了\"稳健添利\"的普通人，他们没做错任何一件事。我不站在他们对面，可也不{{exclusively}}（完全）站在他们这边。\n\n十点，Wendy 的短信进来：下午过来一趟，有些情况需要你{{cooperate}}（配合）。\n\n我回：好。\n\n然后我打开那家城商行的资本申请文件。它三年前就申请用{{internal ratings-based approach}}（内部评级法）算风险权重，资本占用能降一大截。申请三年，没批。\n\n他们不是没看见，只是不批。\n\n监管的{{execution}}（执行）不是慢，是在等一个时点。对一家一直在{{conceal}}（隐瞒）什么的机构，时点一到，代价是{{compulsory}}（强制的）的，{{incur}}（承担）多少不由自己说了算。\n\n下午三点，我在证监会会客室坐下。Wendy 推过来一张纸，上面一个我没听过的名字，注册在纽约。\n\n\"这家机构，\"她说，\"你听说过吗？\"\n\n那个名字对我完全是{{alien}}（陌生的）。","ft":[{"w":"NPL formation rate","z":"不良生成率","d":"当期新增不良加回核销，比不良率更能看清真实趋势","a":"","p":""},{"w":"assets under management","z":"管理资产规模","d":"资管、理财或私行受托管理的资金总量","a":"AUM","p":""},{"w":"bank run","z":"挤兑","d":"储户集中提款导致银行流动性枯竭，硅谷银行就是这么倒的","a":"","p":""},{"w":"concentration risk","z":"集中度风险","d":"对单一客户、行业或地区敞口过大带来的风险","a":"","p":""},{"w":"custodian bank","z":"托管银行","d":"为基金和资管产品保管资产、办理清算的银行","a":"","p":""},{"w":"emergency liquidity assistance","z":"紧急流动性援助","d":"对暂时缺流动性但仍有偿付能力的银行的救急安排","a":"ELA","p":""},{"w":"funding stress","z":"融资压力","d":"机构续不上钱、只能高价融资的状态","a":"","p":""},{"w":"internal ratings-based approach","z":"内部评级法","d":"用银行自己的模型算风险权重，资本占用通常更低","a":"IRB","p":""},{"w":"macroprudential policy","z":"宏观审慎管理","d":"从整体金融体系角度防风险，区别于单家机构监管","a":"","p":""},{"w":"net interest margin","z":"净息差","d":"生息资产收益率减去负债成本，银行盈利能力最核心的指标","a":"NIM","p":""},{"w":"pre-provision operating profit","z":"拨备前利润","d":"计提拨备之前的经营利润，看银行真实创收能力","a":"PPOP","p":""},{"w":"regulatory forbearance","z":"监管容忍","d":"暂时放宽指标要求，给银行时间消化风险","a":"","p":""},{"w":"settlement risk","z":"结算风险","d":"一方已付款而对手方未交割造成损失的风险","a":"","p":""},{"w":"supervisory review","z":"监管检查；现场检查","d":"监管机构对银行风险管理和资本状况的审查","a":"","p":""},{"w":"undrawn credit line","z":"未提用授信额度","d":"已批未用的信贷额度，危机中客户会集中提款","a":"","p":""}],"iw":[{"w":"alien","p":"'eiljәn","t":"n. 外国人, 外侨; a. 外国的, 相异的"},{"w":"dynamic","p":"dai'næmik","t":"a. 动态的, 有活力的, 有力的, 动力的, 不断变化的; n. 动力, 动态; 动态的"},{"w":"forecast","p":"'fɒ:kɑ:st","t":"n. 预想, 预测, 预报; vt. 预想, 预测, 预报; 趋势预测"},{"w":"cling","p":"kliŋ","t":"vi. 粘紧, 附着, 紧贴, 坚持"},{"w":"rage","p":"reidʒ","t":"n. 愤怒, 情绪激动, 狂暴; vi. 大怒, 狂吹, 流行"},{"w":"execution","p":".eksi'kju:ʃәn","t":"n. 实行, 完成, 执行, 死刑; 执行"},{"w":"precious","p":"'preʃәs","t":"a. 宝贵的, 珍贵的, 过于精致的, 珍爱的"},{"w":"prohibit","p":"prә'hibit","t":"vt. 禁止, 阻止; 禁止"},{"w":"exclusively","p":"ik'sklu:sivli","t":"adv. 排他地, 仅仅, 专门, 只, 仅, 唯一地, 专有地"},{"w":"conceal","p":"kәn'si:l","t":"vt. 隐藏, 掩盖, 隐瞒; 隐瞒, 隐匿, 保守秘密"},{"w":"enroll","p":"in'rәul","t":"vt. 登记, 使加入; vi. 参军, 注册"},{"w":"compulsory","p":"kәm'pʌlsәri","t":"a. 被强制的, 强迫的, 义务的; 强迫的, 强制的"},{"w":"stumble","p":"'stʌmbl","t":"n. 绊倒, 蹒跚而行, 失足; vt. 使绊倒, 使困惑; vi. 绊倒, 失足, 失策, 犯错, 蹒跚, 踌躇"},{"w":"ridge","p":"ridʒ","t":"n. 脊, 山脊, 山脉; 嵴, 脊, 棱线"},{"w":"dawn","p":"dɒ:n","t":"n. 破晓, 黎明; vi. 破晓"},{"w":"automobile","p":"'ɒ:tәmәbi:l","t":"n. 汽车; 汽车"},{"w":"terminal","p":"'tә:minәl","t":"n. 终端机, 终点, 末端, 极限, 终点站; a. 终点的, 定期的, 致死的, 结尾的, 末端的, 晚期的; 终端; 终端设备"},{"w":"incur","p":"in'kә:","t":"vt. 招致, 蒙受, 遭遇; 招致, 蒙受, 担负"},{"w":"cab","p":"kæb","t":"n. 出租车, 出租汽车, 出租马车; vi. 乘出租马车(或汽车)"},{"w":"cooperate","p":"kәu'ɒpәreit","t":"vi. 合作, 协力, 配合; 合作"}],"doc":{"k":"监管处置公告","en":"REGULATORY ANNOUNCEMENT (extract). With immediate effect, a takeover panel has assumed control of the named institution. Retail deposits are protected in full under the deposit insurance scheme, while interbank claims will be met on a proportionate basis under arrangements to be announced separately. Emergency liquidity assistance has been extended to address funding stress arising from deposit withdrawal and a partial bank run at three branches. In parallel, an on-site supervisory review will commence tomorrow at six further institutions. Pending its conclusion, the affected banks are prohibited from distributing dividends and from launching new products, and pending applications to adopt the internal ratings-based approach are suspended. No regulatory forbearance will be granted in respect of concentration risk limits or undrawn credit line reporting. Custodian bank operations will continue uninterrupted so as to contain settlement risk.","zh":"监管处置公告（节录）。自即日起，接管组已接管上述机构。个人存款依据存款保险制度获得全额保障；同业债权将按比例受偿，具体安排另行公告。为应对存款流失及三家支行发生的局部挤兑所引致的融资压力，已向该机构提供紧急流动性援助。与此同时，将于明日起对另外六家机构启动现场检查。在检查结论作出之前，相关银行不得分配股利，不得发行新产品，其采用内部评级法的在审申请一并中止。对于集中度风险限额及未提用授信额度的报送要求，不予任何监管容忍。为控制结算风险，托管银行业务将不间断持续运作。"}},{"i":86,"ti":"把马车放到马前面","dom":"bank","sc":"系统性风险","tx":"香港那家城商行被接管的消息推到曼哈顿下城的时候，纽约是周五下午四点二十。\n\nElena Vasquez 站在三十楼{{rear}}（后方的）那间小会议室里，手上还捏着一个没拆{{seal}}（封条）的证物袋。屏幕上的推送只有三行：监管宣布对该行实施{{conservatorship}}（托管），对全部存款提供{{blanket guarantee}}（全额担保），派一个{{interim}}（临时的）管理组进驻，由跨部门小组{{oversee}}（监督）执行。\n\n比所有人预期的都快，也都狠。\n\n助理检察官 Nate 站在门口说：\"止住了。周一就没事了。\"\n\nElena {{scarcely}}（几乎不）抬头。\"止住的是{{sentiment}}（市场情绪）。\"\n\n她把纸质材料摊在长桌上，一行一行地{{scan}}（浏览）。这是她的老毛病，也是{{occupational}}（职业上的）本能：不管别人怎么总结，她要自己看原文。方法很{{primitive}}（原始的），慢，但十年下来没出过大错。\n\n第二天早上，卖方的报告出来了。口径出奇地一致，也出奇地{{verbal}}（停留在口头上的）：这家银行在一个{{coastal}}（沿海的）省份，总资产两千多亿人民币，不是{{global systemically important bank}}（全球系统重要性银行），谈不上{{systemic importance}}（系统重要性）；{{NPL ratio}}（不良率）一点四，{{net interest spread}}（净利差）还在两个点以上，{{jaws ratio}}（收入成本增速差）今年刚刚转正，{{price-to-book ratio}}（市净率）已经跌到零点三倍，\"估值提供了足够的保护\"。\n\nElena 在纸上写了一个词：cart。她抬头对 Nate 说，这叫把{{cart}}（马车）放到马前面——先默认它是一家银行，再讨论它值多少钱。\n\n\"那它是什么？\"\n\n\"是一个出口。\"\n\n她圈出来的是另外三行。\n\n第一行，{{uninsured deposits}}（未受保存款）占存款总额的百分之六十一。第二行，资产端那一大块{{available-for-sale securities}}（可供出售金融资产），过去六个月按{{mark-to-market}}（按市值计价）重估之后，浮亏吃掉了将近一半的核心资本，只是没进利润表。第三行藏在附注最末：{{entrusted loan}}（委托贷款）和{{related-party lending}}（关联方贷款）合计余额三年翻了四倍，交易对手是七家名字长得很像的贸易公司。\n\n那七个名字，她见过。它们是那批\"中国制造业应收账款\"票据的原始债务人——躺在美国养老金和保险账户里的那一批。\n\n所以在她这里，这不是一家地方银行的资产质量问题。这是一条{{shadow banking}}（影子银行）链上的一个节点断了，而节点的另一端在纽约。\n\nNate 说，可它毕竟不大。\n\nElena 让他坐下。\"系统重要性不是按资产规模发的{{bronze}}（青铜）奖牌。它不看你多大，看你是谁的{{constituent}}（组成部分）。我们要做的是{{systematic}}（有系统的）梳理——把它上下游的每一笔钱排出来。这跟它算不算 systemic，是两个词，也是两件事。\"\n\n她指着处置方案里的一条：拟对部分贷款实施{{debt-to-equity swap}}（债转股）。\n\n\"看这里。债转股一签，那七家公司从明天起就不再是{{payable}}（应付账款的欠款）一方了。债权变股权，应收账款清零。而在纽约，有一批票据的底层资产就是这些应收。\"\n\n会议室安静了几秒。走廊尽头有人在放音乐，很轻，像一支{{orchestra}}（管弦乐队）在很远的地方调音。她今晚本来有票，已经决定不去了。\n\n大陪审团的{{deadline}}（截止期限）在两周之后。她没有等到什么{{divine}}（神启般的）时刻，这些年从来没有过。她只是把那三行数字并排放好，然后看见了它们中间那条线。\n\n夜里两点，她在办公室沙发上把{{pillow}}（靠枕）翻了个面，睡了三个小时。醒来第一件事是给香港的联络人写邮件，一句话：\n\n请核对该行委托贷款交易对手名单，与我方案卷附件三是否存在重合。","ft":[{"w":"NPL ratio","z":"不良率","d":"不良贷款占总贷款的比例，市场最盯的一个数","a":"","p":""},{"w":"available-for-sale securities","z":"可供出售金融资产","d":"公允价值计量、浮亏直接进其他综合收益","a":"AFS","p":""},{"w":"blanket guarantee","z":"全额担保","d":"政府宣布对全部存款兜底，用来快速止住挤兑","a":"","p":""},{"w":"conservatorship","z":"托管","d":"监管接管但维持经营，力图恢复机构正常运转","a":"","p":""},{"w":"debt-to-equity swap","z":"债转股","d":"把银行债权转成企业股权，缓解企业债务压力的处置方式","a":"","p":""},{"w":"entrusted loan","z":"委托贷款","d":"企业委托银行放给指定对象的贷款，银行只收通道费","a":"","p":""},{"w":"global systemically important bank","z":"全球系统重要性银行","d":"被认定为倒了会拖垮全球金融体系的大行，附加资本要求更高","a":"G-SIB","p":""},{"w":"jaws ratio","z":"收入成本增速差；剪刀差","d":"收入增速减去费用增速，正剪刀差说明经营杠杆在改善","a":"","p":""},{"w":"mark-to-market","z":"按市值计价；盯市","d":"按市场价格重估资产，下跌时会迅速侵蚀资本","a":"","p":"'mɑ:kt'əm'ɑ:kɪt"},{"w":"net interest spread","z":"净利差","d":"生息资产收益率与计息负债成本率之差，比净息差口径窄","a":"","p":""},{"w":"price-to-book ratio","z":"市净率；PB估值","d":"股价除以每股净资产，银行股最常用的估值方法","a":"P/B","p":""},{"w":"related-party lending","z":"关联方贷款","d":"向股东或关联企业放贷，是中小银行出事的常见诱因","a":"","p":""},{"w":"shadow banking","z":"影子银行","d":"游离在银行监管之外、行使信用中介功能的融资活动","a":"","p":""},{"w":"systemic importance","z":"系统重要性","d":"机构一旦倒闭对金融体系冲击程度的评估维度","a":"","p":""},{"w":"uninsured deposits","z":"未受保存款","d":"超出存款保险限额的部分，最容易在恐慌中跑路","a":"","p":""}],"iw":[{"w":"pillow","p":"'pilәu","t":"n. 枕头, 靠垫, 枕状岩; vt. 作...的枕头, 垫, 枕于; vi. 靠在枕上"},{"w":"primitive","p":"'primitiv","t":"n. 原始人, 早期艺术家; a. 原始的, 上古的; 图元; 原语; 基元"},{"w":"seal","p":"si:l","t":"n. 印章, 封条, 海豹, 海豹皮, 火漆, 封蜡, 玺, 保证, 批准, 象征, 标志; vt. 封闭, 盖印, 盖章; vi. 猎海豹"},{"w":"bronze","p":"brɒnz","t":"n. 青铜, 铜像; a. 青铜色的"},{"w":"orchestra","p":"'ɒ:kistrә","t":"n. 管弦乐队, 乐队演奏处"},{"w":"scarcely","p":"'skɑ:sli","t":"adv. 简直不, 一定不, 仅仅"},{"w":"scan","p":"skæn","t":"n. 审视, 浏览, 扫描, 细查; vt. 细看, 浏览, 扫描, 详细调查, 标出格律; vi. 押韵, 扫描; 网络软件目录, 编码与分析系统"},{"w":"deadline","p":"'dedlain","t":"n. 最后期限, 截止期限; 截止日期"},{"w":"rear","p":"riә","t":"n. 后面, 背后, 后方; a. 后面的, 背面的, 后方的; vt. 养育, 培养, 饲养, 举起, 树立, 栽种; vi. 高耸, 暴跳"},{"w":"occupational","p":".ɒkju'peiʃәnl","t":"a. 职业的, 军事占领的; 职业的"},{"w":"verbal","p":"'vә:bl","t":"a. 用言辞的, 言语的, 口头的, 逐字的, 动词的; 言语的, 口述的"},{"w":"coastal","p":"'kәustәl","t":"a. 海岸的, 沿海的, 沿岸的; 海岸的, 沿海的"},{"w":"systematic","p":".sisti'mætik","t":"a. 有系统的, 分类上的, 体系的; 系统的, 系的, 分类的"},{"w":"constituent","p":"kәn'stitjuәnt","t":"n. 成分, 选民, 构成物; a. 构成的, 组织的, 选举的"},{"w":"payable","p":"'peiәbl","t":"a. 可付的, 到期的, 应付的, 有利益的; 应付的"},{"w":"sentiment","p":"'sentimәnt","t":"n. 感情, 感伤, 情操, 情绪, 感想, 意见; 情感, 情操"},{"w":"divine","p":"di'vain","t":"a. 神的, 神圣的, 非凡的; n. 神学家"},{"w":"cart","p":"kɑ:t","t":"n. 二轮运货马车; vi. 驾运货马车; vt. 用车装载"},{"w":"interim","p":"'intәrim","t":"a. 暂时的, 临时的, 间歇的; n. 过渡时期"},{"w":"oversee","p":".әuvә'si:","t":"vt. 向下看, 了望, 监督, 偷看到; 监察, 监督, 俯瞰"}],"doc":{"k":"金融稳定报告节录","en":"Regional Banking Sector - Interim Assessment. The institution has been placed under conservatorship and a blanket guarantee has been extended to all deposits, including uninsured deposits, which represented 61% of the funding base. The reported NPL ratio remains below peer averages but is not considered informative given the scale of entrusted loan and related-party lending exposures channelled through off-balance-sheet vehicles. Mark-to-market losses on available-for-sale securities have materially eroded common equity, a factor not captured by the net interest spread, the jaws ratio or the prevailing price-to-book ratio. Although the institution is not a global systemically important bank, systemic importance here derives from interconnectedness within shadow banking funding chains rather than from balance-sheet size. A debt-to-equity swap remains under consideration.","zh":"区域性银行业——中期评估。该机构已被实施托管，并对全部存款提供全额担保，其中未受保存款占其资金来源的 61%。所披露的不良率仍低于同业平均水平，但鉴于经由表外载体投放的委托贷款与关联方贷款规模巨大，该指标不具备参考意义。可供出售金融资产按市值计价产生的损失已显著侵蚀普通股权益，而净利差、收入成本增速差以及当前的市净率均无法反映这一因素。尽管该机构并非全球系统重要性银行，但此处的系统重要性来自其在影子银行融资链条中的关联度，而非其资产负债表规模。债转股方案仍在考虑之中。"}},{"i":87,"ti":"没有底","dom":"bank","sc":"火线抛售与去杠杆","tx":"香港，周四上午九点四十。我在交易室里第一次看见一个我以为只存在于教科书里的场面：所有人同时卖同样的东西。\n\nDanny 把耳机摘了半边：\"那只{{contingent convertible bond}}（应急可转债）从九十二掉到五十一。不是跌，是没有报价。\"\n\n不是一只。整个板块的银行资本工具都在往下掉。经纪商开始{{advertise}}（挂出来叫卖）一整篮子债券，一页 PDF 甩进群里，二十几个代码，问谁要。没人接。\n\n我把屏幕上的红色看了太久，觉得那颜色像一记{{slap}}（耳光）。\n\n顺序其实很清楚。银行手里有一大堆{{held-to-maturity securities}}（持有至到期投资），按摊余成本记账，账面上一分{{unrealised loss}}（浮亏）都看不见。可是{{repurchase agreement}}（回购）市场先动了：折扣率一天提两次，同样的券昨天能融九成，今天只能融七成半。融不到钱就得卖资产，一卖，浮亏当场变实亏，{{book value per share}}（每股净资产）重算一遍。\n\n这就是{{maturity mismatch}}（期限错配）真正的样子。它平时藏得很好，藏在\"我们不打算卖\"这句话里。\n\nRay 站在我身后看了十分钟，一句话没说。他四十五岁，在这一行算{{elder}}（前辈）了，2008 年他做的就是这个。他最后只说了一句：\"这不需要{{inspiration}}（灵感）。这种时候没有{{genius}}（天才）。\"\n\n他说得对。市场上最{{talented}}（有才能的）那几个人，这两天亏得最多，因为他们的模型都假设存在一个{{equilibrium}}（均衡）价格。现在没有。价格不是在寻找均衡，是在寻找最后一个还有现金的人。这是一场{{quest}}（找寻），而且{{invariably}}（无一例外地）以更低的价格结束。\n\n十一点，风控发了限额通知。主经纪商把我们抵押品的折扣率提了，理由写得很{{stiff}}（生硬的）：市场条件。我们被迫{{sacrifice}}（牺牲）掉一部分流动性最好的多头——不是因为它们不好，恰恰因为它们还卖得掉。所有人都在做同一件事：{{deleveraging}}（去杠杆）。先卖能卖的，最后才卖想卖的。\n\n于是相关性{{breakdown}}（崩溃）。原本对冲得好好的两条腿，同一天同方向亏钱。我们的空头在赚，但赚的速度赶不上被追缴的速度，这个局面{{awkward}}（棘手）得可笑：判断对了，也可能死。\n\n监管这时候还在收紧。传闻说要上调几家银行的{{Pillar 2 requirement}}（第二支柱资本要求），还要重新核查{{net stable funding ratio}}（净稳定资金比例）达标情况。老周在电话里骂了一句，说这就是{{procyclicality}}（顺周期性）：好的时候放，坏的时候收，监管自己就是放大器。\n\n真正让我背上发凉的是资产端。这些年的{{evergreening}}（借新还旧）——展期、续贷、连利息也一起借给你——把坏账推到了将来。现在续不下去了，将来一次性到达。\n\nDanny 中午下楼去{{supermarket}}（超市），回来说米面货架空了一半。楼上卖资产，楼下抢米，是同一件事的两个版本。\n\n有人在行业群里开玩笑，说不如把仓位{{donate}}（捐）了算了。没人笑。Danny 说他爸大半存款在那家银行，说这话的时候我第一次在他脸上看见{{grief}}（悲伤）。\n\n到收盘，性质已经变了。这不再是一家银行的{{solvency}}（偿付能力）问题——那是长期的、可以慢慢算的。这是{{systemic risk}}（系统性风险）：一家的流动性问题传给下一家，谁也不敢先接盘，因为不知道自己接到手的是不是{{toxic}}（有毒的）资产。托管名册上那些{{nominee}}（名义持有人）后面究竟是谁，这时候更没人说得清。\n\n我问 Ray，什么东西能让它停下来。\n\n他给了一个很{{definite}}（明确的）回答，只有两种可能：一个可信的{{backstop}}（兜底安排），或者{{lender of last resort}}（最后贷款人）直接下场。\n\n\"那要等到什么时候？\"\n\n\"等到有人愿意丢掉{{dignity}}（体面），在周末打电话求人。\"他说，\"通常是周日。\"","ft":[{"w":"Pillar 2 requirement","z":"第二支柱资本要求","d":"监管针对单家银行额外提出的资本要求","a":"P2R","p":""},{"w":"backstop","z":"兜底安排；后盾","d":"官方提供的最终保障承诺，用来稳住市场信心","a":"","p":"'bækstɒp"},{"w":"book value per share","z":"每股净资产","d":"归母净资产除以总股本，银行股估值的分母","a":"BVPS","p":""},{"w":"contingent convertible bond","z":"应急可转债；CoCo债","d":"触发条件下自动转股或减记的资本工具","a":"CoCo","p":""},{"w":"deleveraging","z":"去杠杆","d":"主动或被动压降负债和资产规模，往往伴随信用收缩","a":"","p":""},{"w":"evergreening","z":"借新还旧；掩盖不良","d":"不断续贷让坏账看起来正常，是资产质量最大的水分","a":"","p":""},{"w":"held-to-maturity securities","z":"持有至到期投资","d":"按摊余成本计量、账面不体现浮亏的债券资产","a":"HTM","p":""},{"w":"lender of last resort","z":"最后贷款人","d":"央行在市场融不到钱时对银行提供流动性的角色","a":"","p":""},{"w":"maturity mismatch","z":"期限错配","d":"短借长贷造成的结构性风险，挤兑时最先出事的环节","a":"","p":""},{"w":"net stable funding ratio","z":"净稳定资金比例","d":"稳定资金对长期资产的支撑程度，看中长期流动性","a":"NSFR","p":""},{"w":"procyclicality","z":"顺周期性","d":"监管和信贷行为放大经济周期波动的倾向","a":"","p":""},{"w":"repurchase agreement","z":"回购；正回购","d":"以债券质押融入资金的短期融资，金融机构的日常操作","a":"repo","p":""},{"w":"solvency","z":"偿付能力","d":"机构长期能否偿还全部债务的能力，比流动性更根本","a":"","p":"'sɒlvәnsi"},{"w":"systemic risk","z":"系统性风险","d":"单点风险蔓延成整个金融体系危机的可能性","a":"","p":""},{"w":"unrealised loss","z":"浮亏；未实现损失","d":"债券市值下跌但未卖出的损失，一旦被迫卖出就变实亏","a":"","p":""}],"iw":[{"w":"elder","p":"'eldә","t":"n. 年长者, 老人, 前辈; a. 年长的, 资深的"},{"w":"inspiration","p":".inspә'reiʃәn","t":"n. 灵感, 鼓舞人心的人或物, 妙计, 吸气; 吸"},{"w":"equilibrium","p":".i:kwi'libriәm","t":"n. 平衡, 平静, 均衡; 平衡"},{"w":"genius","p":"'dʒi:njәs","t":"n. 天才, 天赋, 精神, 神魔; 特征"},{"w":"quest","p":"kwest","t":"n. 探索, 寻求, 调查; v. 寻找, 找, 追寻猎物"},{"w":"sacrifice","p":"'sækrifais","t":"n. 牺牲, 供奉, 祭品; vt. 牺牲, 祭祀, 贱卖; vi. 献祭"},{"w":"talented","p":"'tælәntid","t":"a. 天资高的, 有才能的"},{"w":"nominee","p":".nɒmi'ni:","t":"n. 被提名者, 被任命者; 被指定人"},{"w":"definite","p":"'definit","t":"a. 明确的, 一定的; 明确的, 确切的, 一定的"},{"w":"stiff","p":"stif","t":"a. 坚硬的, 严厉的, 呆板的, 生硬的, 刚强的, 强烈的, 粘的, 稠的, 艰难的; n. 死尸, 醉鬼, 钞票; vt. 不肯付...小费"},{"w":"advertise","p":"'ædvәtaiz","t":"vt. 做广告, 通知, 公布; vi. 做广告"},{"w":"slap","p":"slæp","t":"n. 掴, 掌击, 侮辱, 拍击声; v. 拍击, 惩罚; adv. 正面地, 直接地, 突然地"},{"w":"supermarket","p":"'sju:pәmɑ:kit","t":"n. 超级市场; 超级市场, 自助售货商店"},{"w":"toxic","p":"'tɒksik","t":"a. 有毒的, 中毒的; 中毒的, 毒物的"},{"w":"grief","p":"gri:f","t":"n. 伤心, 忧愁, 悲痛, 不幸, 灾难"},{"w":"donate","p":"'dәuneit","t":"v. 捐赠"},{"w":"breakdown","p":"'breikdaun","t":"n. 崩溃, 故障; 事故; 击穿"},{"w":"awkward","p":"'ɒ:kwәd","t":"a. 笨拙的, 棘手的"},{"w":"invariably","p":"in'vєәriәbli","t":"adv. 不变化地, 恒定地, 始终如一地"},{"w":"dignity","p":"'digniti","t":"n. 尊严, 高贵; 尊严, 高位, 高贵"}],"doc":{"k":"宏观策略研报摘要","en":"Strategy Note - Bank Credit. We move to underweight. The proximate trigger is not solvency but funding: haircuts on repurchase agreement collateral have widened twice in a week, and the net stable funding ratio is now the binding constraint for several mid-sized lenders. Forced sales of held-to-maturity securities would crystallise unrealised loss and reset book value per share materially lower. Contingent convertible bond prices already discount coupon suspension. Years of evergreening have deferred, not removed, credit costs, and maturity mismatch makes the adjustment abrupt. Deleveraging at this speed is self-reinforcing; procyclicality is the mechanism by which idiosyncratic stress becomes systemic risk. Absent a credible backstop, only the lender of last resort can set a floor. Pillar 2 requirement decisions remain pending.","zh":"策略报告——银行信用。我们下调至低配。直接触发因素并非偿付能力，而是融资：回购抵押品的折扣率一周内两次上调，净稳定资金比例已成为若干中型银行的约束性指标。被迫出售持有至到期投资将使浮亏兑现为实亏，并令每股净资产大幅重估下修。应急可转债的价格已经计入了停付票息的可能。多年的借新还旧只是推迟而非消除了信用成本，期限错配使这一调整来得非常突然。以当前速度进行的去杠杆具有自我强化的性质；顺周期性正是个体风险演变为系统性风险的传导机制。在缺乏可信兜底安排的情况下，只有最后贷款人能够为价格托底。第二支柱资本要求的相关决定仍待公布。"}},{"i":88,"ti":"周日晚上十一点四十","dom":"bank","sc":"最后贷款人","tx":"周日晚上十一点四十，我在阳台上收{{washing}}（晾着的衣服），手机在客厅震了三下。\n\n是 Danny：官网挂东西了。\n\n我进屋点开。一份公告，不到四百字，没有发布会，没有配图，页面最下面只有一个句号大小的{{dot}}（圆点）标着更新时间。二十三点二十六分。这个时点跟纽约周日晚开盘几乎{{coincide}}（重合），但香港这边，绝大多数人已经睡了。\n\n公告开了三个口子。\n\n第一，扩大合格抵押品范围。除了国债这类{{high-quality liquid assets}}（优质流动性资产），一批地方债和政策性金融债也可以拿来质押融资。翻译过来：只要你还有东西，就还能借到钱。——顺带说一句，境外{{correspondent bank}}（代理行）上周五已经开始拒绝为那家行清算美元，这一条公告里没写，但市场都知道。\n\n第二，设立一个专门载体承接问题资产，就是{{bad bank}}（坏账银行）。资产按独立评估价划过去，银行一次性确认{{expected credit loss}}（预期信用损失），不必在市场上贱卖。这一条是给{{dispose}}（处置）留了体面：不是不认损失，是不用在最坏的价格上认。同时对{{capital adequacy ratio}}（资本充足率）和{{leverage ratio}}（杠杆率）给了两年的过渡{{grace}}（宽限）。\n\n第三条最狠。按{{resolution}}（风险处置）安排，被接管银行的{{additional tier 1}}（其他一级资本）全额减记，一分不留；而{{deposit franchise}}（存款基础）整体平移给一家大行。储户被{{shield}}（护）住了，投资人{{dissolve}}（清得干干净净）。\n\n我盯着这一条看了很久。银行最值钱的东西从来不是贷款，是那些又便宜又不动的存款。把这块拿走，剩下的壳，{{tangible book value}}（有形账面净值）基本归零。\n\n附件里还有一段容易被漏掉的：一家专做储蓄型产品的{{non-bank financial institution}}（非银金融机构）——一家寿险——{{solvency ratio}}（偿付能力充足率）已经跌破监管线，{{value of new business}}（新业务价值）连续三年负增长，将单独安排监管。它买过那批票据。\n\n我给老周打电话，他还没睡。他在那头说了句他老家的话：谷仓着火之后才想起买保险。他家以前真有个{{barn}}（谷仓）。\n\n\"这不叫救市，\"他说，\"这叫承认{{maturity transformation}}（期限转换）是有代价的。银行拿短钱做长贷，太平年月这是本事，出事的时候这就是原罪。\"\n\n我问那些还没被点名的银行怎么办。\n\n\"看谁真的{{specialize}}（专攻）零售存款，谁靠同业。市场对小行的{{prejudice}}（偏见）这次会更深，但偏见有时候是对的。\"\n\n我说，{{provision coverage ratio}}（拨备覆盖率）看着都还行啊。\n\n\"报表是{{shallow}}（浅的），\"老周说，\"你看深一点。\"\n\n周一早上八点半，地铁像散场的{{stadium}}（体育场），人挤人，没人知道昨晚发生了什么。我把手机{{tuck}}（塞）回口袋走进公司。九点半开盘，前十分钟还在跌，然后有一笔大单把银行板块拉起来，接着是第二笔。到十点，市场终于读懂了那四百个字。\n\n一天之内，几年积起来的{{bubble}}（泡沫）预期换了个方向。有人开始讲{{parental}}（母公司的）支持，讲{{forthcoming}}（即将出台的）细则，讲那些下个季度就要{{mature}}（到期）的债\"现在应该没事了\"。Danny 一边{{hedge}}（对冲）我们的敞口一边说：这就完了？\n\n我说没完。这是一个{{dilemma}}（两难）：这次救了，下一次所有人都会更大胆。老周对这家银行没有任何{{affection}}（感情），他只是不想再看一遍二十年前那一幕。\n\n那天夜里我做了另一件事。我打开利率数据，把时间轴一直往回拖。\n\n拖到三年前的那个九月，我停住了。","ft":[{"w":"additional tier 1","z":"其他一级资本","d":"永续债、优先股等，触发条件下可减记或转股","a":"AT1","p":""},{"w":"bad bank","z":"坏账银行；不良剥离平台","d":"把问题资产集中剥离出去的专门载体，让好银行轻装上阵","a":"","p":""},{"w":"capital adequacy ratio","z":"资本充足率","d":"资本除以风险加权资产，银行能扛多少损失的底线指标","a":"CAR","p":""},{"w":"correspondent bank","z":"代理行","d":"为境外银行提供跨境结算服务的银行","a":"","p":""},{"w":"deposit franchise","z":"存款基础；揽储能力","d":"低成本、粘性强的存款盘子，是银行最值钱的护城河","a":"","p":""},{"w":"expected credit loss","z":"预期信用损失","d":"按前瞻性模型提前计提减值，而不是等违约发生","a":"ECL","p":""},{"w":"high-quality liquid assets","z":"优质流动性资产","d":"国债等能迅速变现且不打折的资产，危机时的救命钱","a":"HQLA","p":""},{"w":"leverage ratio","z":"杠杆率","d":"一级资本除以调整后表内外资产，不看风险权重的兜底约束","a":"","p":""},{"w":"maturity transformation","z":"期限转换","d":"银行把短期存款变成长期贷款的核心功能，也是风险来源","a":"","p":""},{"w":"non-bank financial institution","z":"非银金融机构","d":"券商、保险、信托等不吸收存款的金融机构","a":"NBFI","p":""},{"w":"provision coverage ratio","z":"拨备覆盖率","d":"贷款损失准备除以不良贷款，反映风险抵补能力","a":"PCR","p":""},{"w":"resolution","z":"风险处置","d":"对已经无法持续经营的银行进行有序处理的机制","a":"","p":".rezә'lu:ʃәn"},{"w":"solvency ratio","z":"偿付能力充足率","d":"保险公司实际资本对最低资本的比率，等同其资本充足率","a":"","p":""},{"w":"tangible book value","z":"有形账面净值","d":"净资产扣掉商誉和无形资产，欧美银行更常用的估值口径","a":"TBV","p":""},{"w":"value of new business","z":"新业务价值","d":"当年新卖保单带来的价值增量，寿险最看重的指标","a":"VNB","p":""}],"iw":[{"w":"dispose","p":"dis'pәuz","t":"vt. 处理, 排列, 布置; vi. 处置"},{"w":"affection","p":"ә'fekʃәn","t":"n. 影响, 病, 喜爱, 情感, 倾向; 疾患, 病变, 病; 感情"},{"w":"parental","p":"pә'rentәl","t":"a. 父母亲的, 做双亲的, 作为渊源的; 父母的, 双亲的"},{"w":"bubble","p":"'bʌbl","t":"n. 泡沫; vi. 冒泡, 沸腾; vt. 使冒泡, 滔滔不绝地说"},{"w":"grace","p":"greis","t":"n. 优雅, 风度, 慈悲, 恩惠, 体面, 赦免, 恩典, 谢恩祷告; vt. 使优美"},{"w":"barn","p":"bɑ:n","t":"n. 谷仓; 靶(恩)(核反应截面单位)"},{"w":"dissolve","p":"di'zɒlv","t":"v. 溶解, 解散"},{"w":"specialize","p":"'speʃәlaiz","t":"vt. 使特殊化, 列举, 特别指明, 限定...的范围; vi. 成为专家, 专攻"},{"w":"prejudice","p":"'predʒudis","t":"n. 偏见, 成见, 侵害; vt. 使存偏见, 使有成见, 侵害"},{"w":"shield","p":"'ʃi:ld","t":"n. 盾, 防卫物, 保护者, 屏蔽; vt. 保护, 遮蔽, 屏蔽, 庇护, 挡开, 避开; vi. 起保护作用"},{"w":"tuck","p":"tʌk","t":"n. 缝褶, 活力, 鼓声, 船尾突出部, 食品; vt. 打褶, 卷起, 挤进, 塞, 收藏; vi. 缝褶裥, 缩拢"},{"w":"forthcoming","p":"'fɒ:θ'kʌmɑŋ","t":"a. 即将来临的; n. 来临"},{"w":"dilemma","p":"di'lemә","t":"n. 困境, (进退两难的)窘境"},{"w":"hedge","p":"hedʒ","t":"n. 树篱, 障碍, 套头交易; vt. 用树篱围, 套期保值, 妨碍, 两面下注以防...的损失; vi. 筑树篱, 躲闪, 两面下注以防损失; a. 树篱的, 偷偷摸摸的"},{"w":"mature","p":"mә'tjuә","t":"a. 成熟的, 到期的, 充分考虑的; vt. 使成熟; vi. 成熟, 到期"},{"w":"shallow","p":"'ʃælәu","t":"n. 水浅的地方, 浅滩; a. 浅的, 肤浅的; v. (使)变浅"},{"w":"stadium","p":"'steidiәm","t":"n. 露天大型运动场; 期, 病期"},{"w":"washing","p":"'wɒʃiŋ","t":"n. 洗涤, 浸, 洗涤物; 涂浆, 洗涤"},{"w":"dot","p":"dɒt","t":"n. 点, 圆点, 小数点, 小东西, 嫁妆; vt. 作小点记号, 加小点于; vi. 打上点; 点"},{"w":"coincide","p":".kәuin'said","t":"vi. 一致, 符合; 重合"}],"doc":{"k":"央行政策声明","en":"Statement. Effective immediately, the eligible collateral schedule for liquidity operations is expanded beyond the existing high-quality liquid assets list. A dedicated vehicle (a bad bank) will acquire impaired exposures at independently assessed value, permitting recognition of expected credit loss without disorderly disposal; transitional relief is granted on the capital adequacy ratio and the leverage ratio. Under the resolution framework, additional tier 1 instruments at the affected institution will be written down in full, while the deposit franchise transfers intact to an acquiring bank. Correspondent bank relationships are expected to be maintained. One non-bank financial institution whose solvency ratio has fallen below the regulatory minimum will be supervised separately.","zh":"公告。自即日起，流动性操作的合格抵押品范围在现有优质流动性资产清单之外予以扩大。将设立专门载体（即坏账银行）按独立评估价值收购受损资产敞口，使银行得以确认预期信用损失而无需无序处置；对资本充足率与杠杆率给予过渡期安排。按照风险处置框架，被处置机构的其他一级资本工具将被全额减记，其存款基础则完整平移至承接银行。代理行关系预计将维持不变。一家偿付能力充足率已低于监管最低要求的非银金融机构，将被单独实施监管。"}},{"i":89,"ti":"三年前的那个九月","dom":"macro","sc":"利率与货币政策","tx":"凌晨一点，我做了一件一年来没做过的事：把东亚新能源的模型关掉，从{{drawer}}（抽屉）里翻出三年前的一本笔记。\n\n那年九月，{{People's Bank of China}}（中国人民银行）下调了{{medium-term lending facility}}（中期借贷便利）利率十五个基点。同一周，{{open market operations}}（公开市场操作）连续净投放。我当时在本子上写了四个字：\"影响有限。\"\n\n现在看，那四个字是我这一年所有错误的{{ancestor}}（源头）。\n\n我把利率曲线和公司的收入曲线叠在一起。不用做回归，肉眼就能看出{{correspondence}}（对应关系）：降息之后第二个季度，它的收入开始加速；此后每一次宽松，加速一次。我盯这家公司盯了一年，翻它的用电量、招工数、物流单，我以为我在查一家公司。\n\n我查的其实是钱变便宜之后会流去哪里。\n\n那三年，全世界都在同一条路上。美联储的{{dot plot}}（点阵图）——那张一堆小点的图，远看真像一幅{{cartoon}}（漫画）——连着几个季度中位数不动；{{summary of economic projections}}（经济预测摘要）里的长期利率一次比一次低；{{forward guidance}}（前瞻指引）说得非常明白：这次会耐心很久。市场把这句话当成了一张保票。\n\n学界那时候在认真讨论{{secular stagnation}}（长期停滞）：人口老了，生产率上不去，均衡利率会长期下移。这个假说被广泛{{deem}}（认为）成立，于是低利率不再是应急，是常态。所有人都被这个判断{{bless}}（庇佑）了三年。\n\n数据也配合。核心通胀每个月的{{print}}（读数）都很温和，{{breakeven inflation}}（盈亏平衡通胀率）稳在两个点以下，就业还有大量{{labor market slack}}（劳动力市场闲置），工资涨不动。增长按{{annualized rate}}（折年率）算，不快不慢。教科书管这个叫{{Goldilocks economy}}（金发女孩经济）——不冷不热，刚刚好。风险资产最喜欢这四个字。\n\n后来{{reflation}}（再通胀）真的来了。需求回来，价格一点一点{{creep}}（爬升）上去，闲置的劳动力被吃干净，变成{{tight labor market}}（劳动力市场紧张）。等到政策要转向，才发现这三年里长出来的东西已经太多了。\n\n只有一个地方发出过声音。{{Bank for International Settlements}}（国际清算银行）连着两年在年报里写同一段话：低利率环境会让信用扩张脱离实体需求，风险不会消失，只会换个地方待着。那份报告在网上完全{{accessible}}（可以取得的），免费，PDF，我三年前甚至下载过。我没读完。\n\n香港的处境更硬。港元实行{{currency peg}}（联系汇率），钉住美元。这意味着{{impossible trinity}}（不可能三角）在这里不是理论：要固定汇率，又要资本自由流动，就不可能有独立的货币政策。美国降息，香港跟着降；美国加息，香港跟着加，不管香港自己需不需要。作为这座城市的{{inhabitant}}（居民），你的房贷、你公司的融资成本，都由一群从没来过这里的人去{{formulate}}（制订）。\n\n我把这三年的东西按年份{{classify}}（分类），摊在桌上，像在准备一场补{{exam}}（考试）。\n\n窗外天开始白。我忽然明白，这一年我做的每一件事——渠道调研、卫星图、审计附注——都建立在一个前提上：这是一家公司的问题。我把它当成一只待宰的{{lamb}}（羔羊），一个孤立的坏东西。\n\n它不是。它是这一轮信用扩张伸出来的一根手指。你砍掉这根，还有九根。每一轮周期都会换一身{{costume}}（行头）：这一轮是新能源材料，上一轮是地产，再上一轮是互联网。脱下来，底下是同一件事——太便宜的钱要找地方去。\n\n我在纸上给自己写了一个{{verdict}}（结论），字很难看：\n\n你做的不是空头研究。你做的是周期研究，只是你自己一直不知道。\n\n这句话对我不算{{hostile}}（不客气），但也不好受。三年前那一次降息，本质上是一支退烧药，不是{{vaccine}}（疫苗）——它压住了症状，没有让谁产生免疫力。而当时几乎所有人，包括我，都把它读成了后者。\n\n我把那本笔记塞回{{rack}}（架子）上。\n\n第二天上班，我给 Ray 发消息，说我想改一下研究框架，需要跟宏观那边{{collaboration}}（协作）。\n\nRay 只回了一个字：可。\n\n隔了半分钟又补一句：这不是{{bug}}（缺陷），这是设计。三年前把钱印出来的时候，就已经知道会长出这种公司。","ft":[{"w":"Bank for International Settlements","z":"国际清算银行（BIS）","d":"被称为央行的央行，其报告是研究全球流动性的重要来源","a":"BIS","p":""},{"w":"Goldilocks economy","z":"金发女孩经济；不冷不热","d":"增长稳健且通胀温和的理想状态，对风险资产最友好","a":"","p":""},{"w":"People's Bank of China","z":"中国人民银行（央行）","d":"中国的中央银行，负责货币政策、汇率管理与金融稳定","a":"PBOC","p":""},{"w":"annualized rate","z":"折年率","d":"把短期变化按全年换算的口径，美国GDP和环比数据常用","a":"","p":""},{"w":"breakeven inflation","z":"盈亏平衡通胀率","d":"普通国债与通胀保值债券的收益率之差，代表市场隐含的通胀预期","a":"","p":""},{"w":"currency peg","z":"汇率盯住；联系汇率","d":"把本币汇率固定在某一货币上的制度，港币盯美元是典型例子","a":"","p":""},{"w":"dot plot","z":"点阵图","d":"美联储官员对未来利率路径的匿名预测散点图，每季度公布一次","a":"","p":""},{"w":"forward guidance","z":"前瞻指引","d":"央行对未来政策路径的公开承诺或暗示，用来引导市场预期","a":"","p":""},{"w":"impossible trinity","z":"不可能三角","d":"固定汇率、资本自由流动、独立货币政策三者只能取其二","a":"","p":""},{"w":"labor market slack","z":"劳动力市场闲置；就业市场松弛度","d":"经济中未被利用的用工空间，越大说明工资通胀压力越小","a":"","p":""},{"w":"medium-term lending facility","z":"中期借贷便利（MLF）","d":"中国央行向银行提供中期资金的工具，其利率曾是LPR的定价锚","a":"MLF","p":""},{"w":"open market operations","z":"公开市场操作","d":"央行买卖债券投放或回笼短期流动性的日常工具","a":"OMO","p":""},{"w":"print","z":"数据读数","d":"指某项数据公布出来的具体数值，如CPI print指本次通胀读数","a":"","p":"print"},{"w":"reflation","z":"再通胀","d":"经济从低迷中复苏、物价和需求同步回升的阶段，常对应顺周期交易","a":"","p":".ri:'fleiʃәn"},{"w":"secular stagnation","z":"长期停滞","d":"人口和生产率因素导致潜在增速与均衡利率长期下移的假说","a":"","p":""},{"w":"summary of economic projections","z":"经济预测摘要（SEP）","d":"美联储季度公布的增长、通胀、失业和利率预测，含点阵图","a":"SEP","p":""},{"w":"tight labor market","z":"劳动力市场紧张","d":"招工难、空缺多、工资上涨快的状态，通常伴随通胀压力","a":"","p":""}],"iw":[{"w":"ancestor","p":"'ænsestә","t":"n. 祖先, 祖宗"},{"w":"hostile","p":"'hɒstail","t":"a. 敌人的, 怀敌意的, 敌对的; n. 敌对分子"},{"w":"formulate","p":"'fɒ:mjuleit","t":"vt. 用公式表示, 明确叙述, 制订; 公式化, 公式表示"},{"w":"rack","p":"ræk","t":"n. 架, 行李架, 饲草架, 搁物架, 痛苦, 折磨, 齿条, 行云团; vt. 把...放在架上, 在架上制作, 折磨, 使痛苦, 压榨, 榨取, 猛烈撕拉, 拷问; vi. 变形, 倾斜, (云)随风飘, (马)小步跑; 机架"},{"w":"correspondence","p":".kɒri'spɒndәns","t":"n. 相符, 通信, 信件; 对应, 相对"},{"w":"costume","p":"'kɒstju:m","t":"n. 装束, 服装"},{"w":"cartoon","p":"kɑ:'tu:n","t":"n. 卡通画, 漫画; v. 画漫画"},{"w":"creep","p":"kri:p","t":"n. 爬, 徐行, 蠕动; vi. 爬, 蔓延, 潜行"},{"w":"bug","p":"bʌg","t":"n. 错误, 虫, 病菌, 缺陷, 窃听器, 癖好, 防盗报警器, 双座小汽车, 要人; vt. 装防盗报警器, 装窃听器, 激怒; vi. 捉虫, 暴突; 缺点, 错误"},{"w":"bless","p":"bles","t":"vt. 祝福, 祈佑, 使神圣化"},{"w":"accessible","p":"әk'sesәbl","t":"a. 易接近的, 可进入的, 可使用的, 易受影响的, 可理解的"},{"w":"verdict","p":"'vә:dikt","t":"n. 裁决, 判决, 判断性意见, 定论, 结论; 定论, 判断, 意见"},{"w":"deem","p":"di:m","t":"v. 认为, 相信"},{"w":"inhabitant","p":"in'hæbitәnt","t":"n. 居民, 居住者; 居民"},{"w":"classify","p":"'klæsifai","t":"vt. 分类, 归类, 分等; 分类, 分级, 分粒"},{"w":"lamb","p":"læm","t":"n. 小羊, 羔羊; v. 产羊羔"},{"w":"vaccine","p":"'væksi:n","t":"n. 牛痘苗, 疫苗; a. 疫苗的, 牛痘的"},{"w":"exam","p":"ig'zæm","t":"n. 考试, 测验"},{"w":"drawer","p":"'drɒ:ә","t":"n. 抽屉, 开票人; 抽屉"},{"w":"collaboration","p":"kә.læbә'ræʃәn","t":"n. 合作, 勾结; 通敌卖国者, 奸细"}],"doc":{"k":"国际清算银行年度报告节录","en":"Bank for International Settlements - Annual Report (extract). Three years of exceptionally accommodative settings have left a durable imprint. In the major economies, forward guidance and the summary of economic projections anchored expectations of a prolonged low-rate path, and the dot plot implied no tightening within the forecast horizon. Where the People's Bank of China lowered the medium-term lending facility rate and expanded open market operations, credit growth outran nominal activity measured at an annualized rate. Markets priced a Goldilocks economy: each inflation print benign, breakeven inflation contained, labor market slack ample. That framing was reinforced by the secular stagnation hypothesis. Reflation, when it came, met a tight labor market. Economies operating a currency peg confront the impossible trinity directly.","zh":"国际清算银行——年度报告（节录）。三年异常宽松的政策环境留下了持久的印记。在主要经济体，前瞻指引与经济预测摘要将市场预期锚定在长期低利率路径上，点阵图也显示预测期内不会收紧。在中国人民银行下调中期借贷便利利率并加大公开市场操作投放之处，信用增速超过了按折年率衡量的名义经济活动。市场按金发女孩经济定价：每一次通胀读数都很温和，盈亏平衡通胀率受控，劳动力市场闲置充裕。长期停滞假说进一步强化了这一框架。当再通胀最终到来时，它遇上的是一个紧张的劳动力市场。实行联系汇率的经济体则直接面对不可能三角。"}},{"i":90,"ti":"四十一张纸","dom":"macro","sc":"通胀与经济数据","tx":"第二天我占了一整天会议室，把三年的宏观数据全部打印出来，摊在长桌上，一共四十一张纸，用一个铁{{clip}}（夹子）分成四摞。\n\nRay 路过问我在干嘛。我说我在把自己拆开重装。\n\n第一摞是信用：{{total social financing}}（社会融资规模）同比增速，三十六个点。第二摞是价格：CPI、{{producer price index}}（生产者物价指数）、各个分项。第三摞是政策：{{relending}}（再贷款）额度、公开市场、美联储会议纪要。第四摞是我自己这一年的模型输出。\n\n我把第一摞和第四摞叠在灯下。\n\n社融增速的曲线，和东亚新能源收入增速的曲线，滞后两个季度之后，几乎重合。不是相关，是同一个形状换了个刻度。\n\n这是我这一年最难受的{{revelation}}（发现）。我一直以为自己是猎人，它是{{prey}}（猎物）。其实我们都在同一条{{orbit}}（轨道）上转，只是我离中心远一点。\n\nPPI 那一摞更清楚。出厂价格两年前见顶，全行业毛利率跟着塌。只有它的毛利率是一条{{marble}}（大理石）一样的直线，光滑、冰冷。我以前把这当成造假的证据。现在我知道，那更是造假的动机——当所有人的利润被价格压掉，只有做出来的利润才是{{immune}}（不受影响的）。\n\n那三年美联储的措辞我全抄过：{{data-dependent}}（看数据行事）、{{meeting-by-meeting}}（逐次会议决定）、保留{{optionality}}（政策灵活性）。听起来很谨慎，其实是把判断交给了下一份数据。{{liftoff}}（首次加息）之前，官员讲话{{hitherto}}（迄今为止）是清一色的{{dovish}}（鸽派的）；等到不得不动，又要{{front-load}}（前置发力），一次五十个基点地加。先太慢，后太快，这是每一轮都会犯的错。我的{{predecessor}}（前任）在旧文件里写过一模一样的抱怨。\n\n真正让他们晚了的是{{Phillips curve}}（菲利普斯曲线）。失业率那么低，通胀却起不来，这条曲线看上去平了，于是\"再等等\"很有说服力。等到{{supercore inflation}}（超级核心通胀）——剔掉房租的核心服务——开始往上走，工资已经在追价格了。{{inflation expectations}}（通胀预期）一旦松动，央行就没有从容可言。\n\n{{soft data}}（调查类软数据）——信心指数、采购经理调查——早半年就在往下掉，但因为情绪成分重，大家都说要跟硬数据交叉验证。这只是让人有理由再等一个季度。\n\n我把{{automatic stabilizer}}（自动稳定器）那一页抽出来：失业保险、累进税，经济一差就自动发力。它们能减震，不能改方向。\n\n然后是钱。{{Bank of Japan}}（日本央行）三年里一直是全世界最便宜的钱。借日元、借{{sterling}}（英镑）去买高息资产，这种{{carry trade}}（套息交易）在低波动的年份是白捡的，波动一起来就集中平仓，卖的是同一批东西——那就是上个月的那三天。至于香港，{{Hong Kong Monetary Authority}}（香港金管局）能做的只有在弱方兑换保证上{{patrol}}（巡守）汇率，利率上没有任何余地。\n\n我这一年的{{haul}}（战果）是账面上一个很好看的数字。这一天我第一次觉得那个数字有点便宜。\n\n我以前挑股票，像在柜台上挑{{jewelry}}（珠宝）：一件一件拿起来，看这一件干不干净、有没有瑕疵。三年下来我对这家公司的每一个数字都熟到近乎{{intimate}}（亲密），却从来没抬头看过柜台是谁开的、这条街为什么突然开满了首饰店。\n\n最{{notable}}（值得注意的）一点是：那些看起来最{{exotic}}（花哨、罕见的）的结构——七层股权、开曼通道、票据分层——都不是原因，是结果。便宜的钱要找出口，出口自然长得复杂。\n\n而所有的{{bull}}（多头）——包括 Marcus——他们买的从来不是这家公司的技术。他们买的是这三年。\n\n这已经超出我的{{competence}}（能力范围）了。这不是{{secular}}（长期性的）趋势能不能判断对的问题，是我根本没把它当成一个问题。\n\n下午四点半我站起来，两条{{thigh}}（大腿）全麻了。\n\nRay 进来看那四十一张纸，看了很久，语气罕见地{{tender}}（温和）：\"你终于问对问题了。\"\n\n他指着社融那条线：\"这条线才是主角。你那家公司只是它的一个注脚。\"\n\n我说我想把这条线再往前推十年。\n\n他说：那你不该问我。\n\n我给老周发了一条消息。三分钟后他回：\n\n明天上午九点来我这里。我给你讲上一轮是怎么开始的。","ft":[{"w":"Bank of Japan","z":"日本央行（BOJ）","d":"长期实施超宽松和收益率曲线控制，其转向牵动全球套息交易","a":"BOJ","p":""},{"w":"Hong Kong Monetary Authority","z":"香港金管局（HKMA）","d":"香港的类央行机构，维持联系汇率制度并管理外汇基金","a":"HKMA","p":""},{"w":"Phillips curve","z":"菲利普斯曲线","d":"描述失业率与通胀反向关系的经典框架，是央行政策讨论的基本语言","a":"","p":""},{"w":"automatic stabilizer","z":"自动稳定器","d":"失业保险和累进税等无需新决策就能平滑周期的财政机制","a":"","p":""},{"w":"carry trade","z":"套息交易","d":"借低息货币买高息资产赚利差，波动率上升时会集中平仓","a":"","p":""},{"w":"data-dependent","z":"看数据行事；数据依赖","d":"央行不预设路径、逐次会议根据最新数据决定，是常见的政策措辞","a":"","p":"'deɪtədɪp'endənt"},{"w":"dovish","z":"鸽派的（倾向宽松）","d":"指央行官员或政策立场偏向降息、维持宽松，与鹰派相对","a":"","p":"'dʌviʃ"},{"w":"front-load","z":"前置发力；把加息降息提前做","d":"央行把政策力度集中在周期早期，先大幅动作再观察效果","a":"","p":"'frʌntləud; 'frɔnt'ləud"},{"w":"inflation expectations","z":"通胀预期","d":"居民、企业和市场对未来物价的看法，一旦失控央行会非常紧张","a":"","p":""},{"w":"liftoff","z":"首次加息；开启加息","d":"从零利率或超低利率状态启动的第一次加息，标志宽松周期结束","a":"","p":"'lɪftˌɒf"},{"w":"meeting-by-meeting","z":"逐次会议决定","d":"央行不给出中期承诺，每次会议单独判断，常与数据依赖连用","a":"","p":""},{"w":"optionality","z":"政策灵活性；保留余地","d":"央行刻意不锁定路径以保留后续调整空间，声明措辞里常见","a":"","p":"'ɒpʃənælɪtɪ"},{"w":"producer price index","z":"生产者物价指数（PPI）","d":"衡量出厂环节价格变化，通常领先CPI，反映企业盈利压力","a":"PPI","p":""},{"w":"relending","z":"再贷款","d":"中国央行向银行提供的定向低成本资金，用于支持特定领域","a":"","p":""},{"w":"soft data","z":"调查类软数据","d":"靠问卷和信心指数得来的数据，情绪成分重，需与硬数据交叉验证","a":"","p":""},{"w":"supercore inflation","z":"超级核心通胀","d":"剔除住房的核心服务通胀，被视为最能反映工资压力的分项","a":"","p":""},{"w":"total social financing","z":"社会融资规模（社融）","d":"中国衡量实体经济从金融体系获得资金总量的指标，是信用周期的核心口径","a":"TSF","p":""}],"iw":[{"w":"orbit","p":"'ɒ:bit","t":"n. 轨道, 常轨, 眼眶; vt. 绕...轨道而行; vi. 进入轨道, 盘旋"},{"w":"prey","p":"prei","t":"n. 被掠食者, 牺牲者; vi. 捕食"},{"w":"patrol","p":"pә'trәul","t":"n. 巡逻, 巡逻员, 侦察队; v. 巡逻, 巡视"},{"w":"predecessor","p":".predi'sesә","t":"n. 前任, 先辈, 前身; 初牙, 前辈, 祖先"},{"w":"revelation","p":".revi'leiʃәn","t":"n. 揭露, 泄露, 发觉, 默示, 启示"},{"w":"jewelry","p":"'dʒu:әlri","t":"n. 珠宝, 珠宝类"},{"w":"haul","p":"hɒ:l","t":"n. 用力拖拉, 拖运, 强拉, 捕获量, 拖运距离; vi. 拖, 拉, 改变方向, 改变主意; vt. 拖拉, 拖运"},{"w":"sterling","p":"'stә:liŋ","t":"n. 英国货币, 标准纯银; a. 英国货币的, 标准纯银的, 含标准成分的"},{"w":"hitherto","p":".hiðә'tu:","t":"adv. 迄今, 至今"},{"w":"notable","p":"'nәutәbl","t":"n. 著名人士, 值得注意之事物; a. 值得注意的, 显著的"},{"w":"marble","p":"'mɑ:bl","t":"n. 大理石, 石弹, 雕刻品; a. 大理石的, 冷酷无情的, 有大理石花纹的"},{"w":"immune","p":"i'mju:n","t":"a. 免疫的, 免除的, 不受影响的; n. 免疫者"},{"w":"competence","p":"'kɒmpitәns","t":"n. 胜任, 职称, 能力; 能力, 活性"},{"w":"exotic","p":"ig'zɒtik","t":"a. 异国的, 外来的; n. 外来人, 外来物, 舶来品"},{"w":"bull","p":"bul","t":"n. 公牛; 买方, 买空者"},{"w":"clip","p":"klip","t":"n. 修剪, 夹子, 回形针, 剪下来的东西; vt. 修剪, 痛打, 夹牢, 剪报; vi. 剪报"},{"w":"thigh","p":"θai","t":"n. 大腿, 股; 股, 大腿"},{"w":"intimate","p":"'intimәt","t":"a. 亲密的, 私人的, 秘密的; vt. 暗示, 通知, 告诉; n. 至交"},{"w":"secular","p":"'sekjulә","t":"n. 修道院外的教士; a. 世俗的, 现世的, 长期的"},{"w":"tender","p":"'tendә","t":"a. 嫩的, 柔软的, 脆弱的, 温柔的, 亲切的, 未成熟的, 微妙的, 棘手的, 审慎的; vt. 使变嫩, 提供, 偿还; vi. 变柔软, 投标; n. 照料, 看管人, 供应船, 小船, 提出, 偿付, 投标"}],"doc":{"k":"宏观数据点评研报摘要","en":"Data Review. The producer price index turned negative year on year while total social financing growth decelerated for a fourth consecutive month; targeted relending has not offset the weakening credit impulse. In the United States, supercore inflation remains the swing factor and the Phillips curve relationship has proved unstable, though inflation expectations are still contained. Officials describe policy as data-dependent and decided meeting-by-meeting, preserving optionality rather than repeating the dovish stance and the front-load tightening that followed liftoff. Soft data have deteriorated faster than hard data. Automatic stabilizer effects will cushion, not prevent, a slowdown. A shift at the Bank of Japan would unwind carry trade positions, and the Hong Kong Monetary Authority has no independent room.","zh":"数据点评。生产者物价指数同比转负，社会融资规模增速连续第四个月放缓；定向再贷款并未抵消走弱的信用脉冲。在美国，超级核心通胀仍是关键变量，菲利普斯曲线的关系已被证明并不稳定，不过通胀预期目前仍受控制。官员们将政策描述为看数据行事、逐次会议决定，以保留政策灵活性，而不是重复首次加息之后先鸽派、后前置发力的做法。调查类软数据的恶化快于硬数据。自动稳定器只能缓冲而无法阻止经济放缓。日本央行一旦转向，将引发套息交易的平仓，而香港金管局在利率上没有任何独立空间。"}},{"i":91,"ti":"每一轮都是这样开始的","dom":"macro","sc":"经济周期与衰退","tx":"我把那张三年的宏观图卷成一卷，带去了老周家。\n\n他在阳台上煮水，壶盖被顶得直响，他说等{{boil}}（沸腾）了再进屋。海风从北角那边过来，很轻的一阵{{breeze}}（微风），图纸在栏杆上自己翻页。\n\n我指给他看三条线：{{federal funds rate}}（联邦基金利率）从零抬起来的那一年，{{purchasing managers index}}（采购经理人指数）跌到荣枯线以下，而东亚新能源的收入曲线在同一个季度往上翘。\n\n\"这不像{{conspiracy}}（阴谋），\"我说，\"太整齐了。\"\n\n老周把老花镜推上额头，看了很久。\n\n\"因为它不是阴谋，\"他说，\"是{{biology}}（生物学）。\"\n\n他讲这句话的时候语气很平，像在念一份很久以前签过的底稿。\n\n先是钱变便宜。{{repo}}（回购）利率压到地板上，银行手里的钱没地方去。然后是产能，一年之内像{{mushroom}}（迅速冒出）一样起来一批厂，个个背后都站着被叫做{{entrepreneur}}（企业家）的人，个个都说自己踩中了风口。{{output gap}}（产出缺口）从负转正的那两年，谁的数字都好看，因为需求真的在那儿。\n\n\"接下来就是那一下，\"老周伸手比了个动作，像挥了半下{{whip}}（鞭子），\"需求先停，产能还在往前跑。差出来的那一截，就是所有故事开始的地方。\"\n\n差出来的那一截不会立刻被承认。第一年叫季节性，第二年叫渠道调整。到第三年，有人开始{{manipulate}}（做手脚）——不是凭空造，是把明年的订单挪到今年，把关联方的货算成销售，一针一针{{stitch}}（缝）起来，缝到看不出接缝。\n\n\"它长在正常组织里，\"老周说，\"切开的时候，你很难分清哪一块是{{tumour}}（肿瘤），哪一块本来就是它自己。\"\n\n我把美国那一侧也摊开。{{initial jobless claims}}（首次申请失业救济人数）连着六周往上，{{average hourly earnings}}（平均时薪）却还在涨，{{Sahm rule}}（萨姆法则）差 0.1 个百分点触发。{{ISM}}（美国供应管理协会指数）的新订单分项已经掉进四十几，可那个月非农是个{{upside surprise}}（超预期），当天市场就{{rally}}（跌停回升）了两个点。{{Beige Book}}（褐皮书）里各地区分行的说法是分裂的：有的说需求稳，有的说客户开始砍单。\n\n那两年所有人只吵一个问题：{{soft landing}}（软着陆）还是{{hard landing}}（硬着陆）。而真正压到我们头上的，是另一条更闷的路——香港的{{linked exchange rate system}}（联系汇率制度）让港元利率被动跟着美国走，人民币那边{{central parity rate}}（中间价）一天一天往下挪。两边一拉开，钱就自己开始动。\n\n\"你们这代人入行的年份很怪，\"老周说。那几年{{modern monetary theory}}（现代货币理论）忽然被到处引用，好像财政可以没有边界，直到{{de-anchoring}}（通胀预期脱锚）这个词第一次出现在会议纪要里。他说他见过{{taper tantrum}}（缩减恐慌），全球利率一夜之间抬起来，新兴市场的钱像被人抽走。\n\n\"那次之后我以为大家都记住了。\"他笑了一下，\"没有。记忆是很{{costly}}（昂贵的）的东西，没人愿意付这个钱。\"\n\n我说我把所有{{puzzle}}（碎片）都拼上了，拼完并不痛快。\n\n\"你想要{{certainty}}（确凿）。\"他说，\"你只会拿到一个{{loop}}（闭环）。\"\n\n他讲起二十年前签的那份报告。那家公司也是这样，也是在一轮宽松的尾巴上，也有{{terrific}}（好得吓人）的增长。他不是不知道，他只是想再等一个季度确认。等到确认那天，报告已经在外面走了两年。\n\n\"我没资格要你{{sympathetic}}（同情）我，\"他说，\"我只想告诉你，{{conscience}}（良心）不是留到最后一刻用的，是在中间那几百次里用的。\"\n\n回程的车上我一直在想那句\"每一轮都是这样开始的\"。它没有安慰我。它把我做的事变小了：我以为我在抓一家公司，其实我抓的是一段周期落下来的渣。\n\n值不值得？{{worthwhile}}（值得的）这个词我很久没想了。我只知道，这件事已经{{spoil}}（毁掉）了我看年报的方式，往后我再也没办法只看一家公司。\n\n下车前，老周发来一条消息，六个字：钱是怎么出去的。","ft":[{"w":"Beige Book","z":"褐皮书","d":"美联储各地区分行汇总的经济状况报告，议息会议前两周发布","a":"","p":""},{"w":"ISM","z":"美国供应管理协会指数（ISM）","d":"美国最受关注的制造业和服务业景气调查，分项细节常被引用","a":"","p":"'izm"},{"w":"Sahm rule","z":"萨姆法则","d":"失业率三月均值较低点上升0.5个百分点即判定衰退开始的经验规则","a":"","p":""},{"w":"average hourly earnings","z":"平均时薪","d":"非农报告里的工资分项，是判断工资通胀压力的核心指标","a":"","p":""},{"w":"central parity rate","z":"（人民币）中间价","d":"中国央行每日公布的汇率基准，日内波动围绕它设定区间","a":"","p":""},{"w":"de-anchoring","z":"通胀预期脱锚","d":"长期通胀预期偏离央行目标，出现这种迹象通常意味着要加快收紧","a":"","p":""},{"w":"federal funds rate","z":"联邦基金利率","d":"美国银行间隔夜拆借利率，美联储加息降息说的就是它的目标区间","a":"FFR","p":""},{"w":"hard landing","z":"硬着陆","d":"为压通胀而把经济打入衰退，失业率显著上升的情形","a":"","p":""},{"w":"initial jobless claims","z":"首次申请失业救济人数","d":"每周公布的高频就业指标，拐点出现得比非农更早","a":"","p":""},{"w":"linked exchange rate system","z":"联系汇率制度","d":"香港把港元与美元挂钩的制度，使香港利率被动跟随美国","a":"","p":""},{"w":"modern monetary theory","z":"现代货币理论（MMT）","d":"主张主权货币国家的赤字约束是通胀而非债务规模","a":"MMT","p":""},{"w":"output gap","z":"产出缺口","d":"实际产出与潜在产出之差，为正说明过热，为负说明需求不足","a":"","p":""},{"w":"purchasing managers index","z":"采购经理人指数（PMI）","d":"企业调查得出的景气指标，50是荣枯线，公布早于官方数据","a":"PMI","p":""},{"w":"repo","z":"回购；正回购","d":"以债券作抵押的短期融资交易，也是央行投放流动性的常用工具","a":"","p":"'ri:pәu"},{"w":"soft landing","z":"软着陆","d":"通胀顺利回落而经济不陷入衰退，是央行紧缩周期里的理想结局","a":"","p":""},{"w":"taper tantrum","z":"缩减恐慌","d":"2013年美联储暗示缩减购债引发的全球利率飙升与资金外流","a":"","p":""},{"w":"upside surprise","z":"超预期；高于预期","d":"数据好于市场一致预期，对应的反向表述是downside surprise","a":"","p":""}],"iw":[{"w":"biology","p":"bai'ɒlәdʒi","t":"n. 生物学; 生物; 生物学"},{"w":"conspiracy","p":"kәn'spirәsi","t":"n. 同谋, 阴谋, 阴谋集团; 阴谋, 通谋, 共谋"},{"w":"rally","p":"'ræli","t":"n. 重振旗鼓, 集合, 群众集会, 跌停回升; v. 重整旗鼓, 集合, 恢复精神, 团结, 挖苦, 嘲笑"},{"w":"terrific","p":"tә'rifik","t":"a. 非常好的, 极端的, 可怕的"},{"w":"stitch","p":"stitʃ","t":"n. 一针, 疼痛, 针法, 碎布条, 针脚; v. 缝, 缝合, 装订"},{"w":"manipulate","p":"mә'nipjuleit","t":"vt. 操纵, 利用, 操作, 巧妙地处理, 假造"},{"w":"tumour","p":"'tju:mә","t":"n. 瘤, 肿块"},{"w":"loop","p":"lu:p","t":"n. 环, 圈, 弯曲部分, 循环; vt. 使成环, 以圈结, 以环连结; vi. 打环, 翻筋斗; 循环"},{"w":"whip","p":"hwip","t":"n. 鞭子, 抽打, 车夫, 搅拌器; vt. 鞭打, 搅拌, 煽动, 召集, 仓促制成; vi. 拍击, 急走, 抽打"},{"w":"puzzle","p":"'pʌzl","t":"n. 难题, 迷惑; vt. 使困惑, 使为难; vi. 迷惑, 苦思"},{"w":"mushroom","p":"'mʌʃrum","t":"n. 蘑菇形物, 蘑菇, 暴发户; vi. 迅速生长, 迅速增加, 采蘑菇; a. 蘑菇形的, 迅速生长的"},{"w":"boil","p":"bɒil","t":"n. 煮沸, 沸腾, 疖; v. 煮沸, 激动"},{"w":"worthwhile","p":"'wә:θ'hwail","t":"a. 值得花时间的, 值得做的, 有真实价值的"},{"w":"conscience","p":"'kɒnʃәns","t":"n. 良心; 良心, 道德感, 正义感"},{"w":"entrepreneur","p":".ɒntrәprә'nә:","t":"n. 企业家, 主办人; 承包商, 企业家"},{"w":"sympathetic","p":".simpә'θetik","t":"a. 有同情心的, 合意的, 赞成的; n. 交感神经, 容易感受的人"},{"w":"spoil","p":"spɒil","t":"n. 战利品, 赃物, 奖品, 变质, 次品; vt. 损坏, 破坏, 溺爱; vi. 腐坏, 掠夺"},{"w":"breeze","p":"bri:z","t":"n. 微风, 煤屑, 轻而易举的事; vi. 吹微风, 逃走"},{"w":"certainty","p":"'sә:tәnti","t":"n. 确定, 确实的事情; 确定, 肯定, 必然的事"},{"w":"costly","p":"'kɒstli","t":"a. 昂贵的, 奢华的, 费用大的"}],"doc":{"k":"央行议息会议纪要（节选）","en":"Minutes of the Monetary Policy Meeting (excerpt). Participants reviewed the data received since the previous meeting. Several members observed that the purchasing managers index had remained below the expansion threshold for a fourth consecutive month, while the latest employment report represented a clear upside surprise. Initial jobless claims had drifted higher, and average hourly earnings continued to run above a pace consistent with the inflation objective. Anecdotal reports in the Beige Book were mixed across districts. Members judged that the output gap had narrowed materially, but they differed on whether a soft landing remained the most probable outcome. A minority cautioned that holding the federal funds rate in its current target range for an extended period materially raised the risk of a hard landing. The Committee agreed to continue repo operations as required to maintain orderly funding conditions.","zh":"货币政策会议纪要（节选）。与会者审视了上次会议以来收到的数据。数位委员注意到，采购经理人指数已连续第四个月低于荣枯线，而最新一期就业报告则明显超预期。首次申请失业救济人数缓步走高，平均时薪的增速仍高于与通胀目标相符的水平。褐皮书中各地区的实地反馈并不一致。委员们判断产出缺口已明显收窄，但对于软着陆是否仍是概率最高的结果存在分歧。少数委员告诫称，将联邦基金利率长时间维持在当前目标区间，会显著抬高硬着陆的风险。委员会同意按需继续开展回购操作，以维持融资环境的有序运行。"}},{"i":92,"ti":"出去和回来","dom":"macro","sc":"汇率与跨境资金","tx":"钱出去的那条路，写在一张所有人都能下载的表里，只是没人愿意一行一行看。\n\n我把五年的国际收支表拉出来。经常项目那一栏很干净，货物贸易顺差年年为正。不对劲的在下面：净误差与遗漏连续二十个季度朝同一个方向，是一{{lump}}（一大笔）越滚越大的数，从几百亿爬到两千多亿。教科书说这一栏应该在{{zero}}（零）附近来回摆。它没有摆，它是一条斜线。\n\n第二天我约了一个做贸易融资的老同学。中环那栋楼的共享办公，玻璃隔出来一个{{booth}}（小隔间），门关上还听得见外面咖啡机的{{disturbance}}（嘈杂）。\n\n他没先回答我，他先问：你知道一笔应收账款要{{discharge}}（结清）需要几步？\n\n然后他在纸上画：内地实体把债权折价卖给香港的保理公司，香港公司拿这笔债权去做背对背融资，钱以服务费和预付款的名义走出去。每一步都有单据，每一步都站得住。\n\n\"手法本身很{{minimal}}（极简的），\"他说，\"复杂的是{{handling}}（操作处理）。\"\n\n一{{suite}}（一整套）标准化的合同模板，用了三年没换过。转让通知的背书栏是{{blank}}（空白的）——留白本身就是设计。我说这套东西有一种{{aesthetic}}（美学上的）洁癖：不留一笔多余的交易。我在合规培训里见过很像的图，讲的是{{cocaine}}（可卡因）的钱怎么变成合法资产：先切碎，再分散，最后集中。区别只在于，这一次被切碎的是发票。\n\n那位老同学最后说：从头到尾，可能没有一{{penny}}（一分钱）现金真的搬过家，动的只是权利。\n\n为什么偏偏是那几年？因为两边的利差被撕开了。\n\n美国那时刚从{{quantitative easing}}（量化宽松）里往外爬，{{tapering}}（缩减购债）已经开始，官员一个比一个{{hawkish}}（鹰派的）；欧洲反着来，{{European Central Bank}}（欧洲央行）还在负利率里泡着。国内则是另一头：{{reserve requirement ratio}}（存款准备金率）一年降三次，{{consumer price index}}（消费者物价指数）低到只有零点几，人民币慢慢贬，而汇率对物价的{{pass-through}}（传导）只有零点二，所以谁都不着急。\n\n我把美国那侧的日历也贴上去。{{JOLTS}}（职位空缺与劳动力流动调查）的空缺数创了纪录，联储怕的是{{wage-price spiral}}（工资物价螺旋）；按{{Taylor rule}}（泰勒规则）推出来的合意利率，比实际政策利率高出两百多个基点，等于承认已经站在{{neutral rate}}（中性利率）之上。中间有过一次{{insurance cut}}（预防式降息），理由写着\"外部不确定性\"，事后看只是一个{{soft patch}}（阶段性走弱）。那两年华盛顿还在为{{debt ceiling}}（债务上限）吵，年底又要过一道{{fiscal cliff}}（财政悬崖）——每一次吵完，全球的钱都更急着去找一个说得通的收益率。\n\n国内是完全相反的病。地产开始还债，企业不肯借钱，宽松放出去的水停在银行间转圈，这叫{{balance sheet recession}}（资产负债表衰退），再往前一步就是{{liquidity trap}}（流动性陷阱）。政策一路{{tighten}}（收紧）不动，反而是敢借钱的人变得特别值钱。\n\n东亚新能源就是那个敢借钱的人。它{{ambitious}}（野心勃勃）得刚刚好：在一个所有人都{{distress}}（困顿）的行业里，只有它扩产、只有它招人、只有它敢签长约。地方要它，银行要它，卖方也要它。\n\n我花了整整一个{{fortnight}}（两星期）把路径对完。钱出去的时候叫应收账款，回来的时候叫外商投资和跨境认购，中间隔着两三个法域，像在边界上{{erect}}（竖）起了一堵只朝一个方向开门的墙。真正被{{crush}}（碾碎）的是时间差：三个月的账期，在纽约被拉成七年的票据。\n\n写完最后一页，我给老周发邮件，{{enclose}}（附上）了那张路径图。\n\n我想起江西那个基地的门房，墙上挂着一排崭新的{{helmet}}（安全帽），一顶都没戴过。厂是空的，钱是真的。\n\n老周半夜回我一句：那你再看看，它加速的那一年，国内发生了什么。","ft":[{"w":"European Central Bank","z":"欧洲央行（ECB）","d":"欧元区统一的货币政策制定机构，总部设在法兰克福","a":"ECB","p":""},{"w":"JOLTS","z":"职位空缺与劳动力流动调查（JOLTS）","d":"美国岗位空缺数据，用来衡量劳动力市场的供需缺口","a":"","p":"dʒəults"},{"w":"Taylor rule","z":"泰勒规则","d":"根据通胀缺口和产出缺口推算合意政策利率的经典公式","a":"","p":""},{"w":"balance sheet recession","z":"资产负债表衰退","d":"私人部门忙于还债而非投资，导致货币宽松失效的长期低迷","a":"","p":""},{"w":"consumer price index","z":"消费者物价指数（CPI）","d":"衡量居民消费篮子价格变化的指标，是最常被引用的通胀数据","a":"CPI","p":""},{"w":"debt ceiling","z":"债务上限","d":"美国国会设定的联邦举债法定上限，触及时会引发政治博弈","a":"","p":""},{"w":"fiscal cliff","z":"财政悬崖","d":"减税到期与自动减支同时生效，导致财政力度骤然收缩","a":"","p":""},{"w":"hawkish","z":"鹰派的（倾向收紧）","d":"指央行官员或政策立场偏向加息、收紧流动性","a":"","p":"'hɒ:kiʃ"},{"w":"insurance cut","z":"预防式降息","d":"经济尚未明显恶化时提前降息，用来对冲下行风险的做法","a":"","p":""},{"w":"liquidity trap","z":"流动性陷阱","d":"利率降到极低后再放水也刺激不动需求的状态","a":"","p":""},{"w":"neutral rate","z":"中性利率","d":"既不刺激也不抑制经济的理论利率水平，常写作r-star，用来判断政策松紧","a":"r*","p":""},{"w":"pass-through","z":"传导；价格传导","d":"上游成本或汇率变动多大比例转移到终端价格，是通胀预测的关键假设","a":"","p":"'pɑ:sθru:"},{"w":"quantitative easing","z":"量化宽松（QE）","d":"央行大规模买入债券投放基础货币，压低长端利率的非常规工具","a":"QE","p":""},{"w":"reserve requirement ratio","z":"存款准备金率；准备金率","d":"商业银行必须上缴央行的存款比例，降准即下调这一比例","a":"RRR","p":""},{"w":"soft patch","z":"阶段性走弱","d":"经济短暂放缓但未进入衰退，常用于淡化单月数据的疲弱","a":"","p":""},{"w":"tapering","z":"缩减购债（Taper）","d":"央行逐步减少每月资产购买规模，是退出QE的第一步","a":"","p":"'teipәriŋ"},{"w":"wage-price spiral","z":"工资物价螺旋","d":"工资上涨推高物价、物价再倒逼涨薪的自我强化循环","a":"","p":""}],"iw":[{"w":"ambitious","p":"æm'biʃәs","t":"a. 有野心的, 抱负不凡的, 雄心勃勃的"},{"w":"distress","p":"di'stres","t":"n. 苦恼, 贫困, 痛苦; vt. 使苦恼; a. 亏本出售的"},{"w":"fortnight","p":"'fɒ:tnait","t":"n. 两星期"},{"w":"suite","p":"swi:t","t":"n. 随员, 套房, (一)组, (一)套, 组曲, 继之而来的事; 程序组"},{"w":"disturbance","p":"dis'tә:bәns","t":"n. 扰乱, 不安, 忧虑; 扰动; 干扰; 失调"},{"w":"tighten","p":"'taitn","t":"vt. 勒紧, 使变紧; vi. 变紧, 绷紧"},{"w":"aesthetic","p":"i:s'θetik","t":"a. 美学的, 审美的, 有美感的"},{"w":"zero","p":"'ziәrәu","t":"n. 零, 零点, 零度, 无, 乌有, 最低点; a. 零的, 没有的; vt. 调零, 对(炮火等)作协调校正; 零"},{"w":"booth","p":"bu:θ","t":"n. 亭, 摊棚; 货摊, 电话间"},{"w":"lump","p":"lʌmp","t":"n. 块, 瘤, 很多, 肿块, 笨人; vt. 使成块状, 混在一起; vi. 结块"},{"w":"erect","p":"i'rekt","t":"a. 直立的, 竖立的, 笔直的; vt. 使竖立, 使直立, 树立, 建立; vi. 勃起"},{"w":"helmet","p":"'helmit","t":"n. 钢盔, 盔, 防护帽; vt. 给...戴头盔"},{"w":"penny","p":"'peni","t":"n. 便士, 一分, 小钱, 点滴; 便士"},{"w":"handling","p":"'hændliŋ","t":"n. 处理; a. 操作的"},{"w":"blank","p":"blæŋk","t":"n. 空格, 空白; a. 空白的, 空虚的, 完全的, 无色的; vi. 消失, 成为空白; vt. 使无效, 取消, 封锁; 空白"},{"w":"crush","p":"krʌʃ","t":"n. 压碎, 粉碎, 群众, 迷恋; vt. 压破, 征服, 塞, 弄皱, 榨出; vi. 被压碎, 起皱, 挤"},{"w":"enclose","p":"in'klәuz","t":"vt. 围绕, 圈起, 放入封套, 附上"},{"w":"minimal","p":"'miniml","t":"a. 最小的, 极微的, 最小限度的; 最小的, 最低的"},{"w":"discharge","p":"dis'tʃɑ:dʒ","t":"vt. 卸下, 放出, 解雇, 拔染, 履行, 放电; vi. 卸货, 流出; n. 卸货, 流出, 放电"},{"w":"cocaine","p":"kә'kein","t":"n. 可卡因, 古柯碱; 可卡因; 古柯碱"}],"doc":{"k":"国际收支数据评论","en":"Balance of Payments Commentary. Net errors and omissions have printed negative for twenty consecutive quarters, an outcome difficult to reconcile with a persistently large goods surplus. We attribute part of the gap to receivables assigned offshore and financed against, a channel that records no corresponding capital inflow. The macro backdrop is permissive: after tapering concluded, official commentary turned steadily hawkish, while the European Central Bank held policy below zero. Domestically, three cuts to the reserve requirement ratio and a consumer price index near zero point to a balance sheet recession rather than to demand-led credit growth. Exchange rate pass-through remains near 0.2, so the authorities have tolerated gradual depreciation. Until the neutral rate converges, the differential itself will keep directing flows.","zh":"国际收支数据评论。净误差与遗漏已连续二十个季度为负，这一结果很难与长期存在的巨额货物贸易顺差相调和。我们认为其中一部分缺口来自被转让至境外并据以融资的应收账款，这一通道不会记录任何对应的资本流入。宏观背景是纵容性的：缩减购债结束之后，官方表态持续转向鹰派，而欧洲央行仍将政策利率维持在零以下。国内方面，一年三次下调存款准备金率、消费者物价指数逼近零，指向的是资产负债表衰退，而非由需求带动的信贷扩张。汇率对物价的传导仍在 0.2 附近，因此当局容忍了汇率的渐进贬值。在中性利率收敛之前，利差本身就会持续指挥资金的流向。"}},{"i":93,"ti":"退坡那一年","dom":"macro","sc":"财政与产业政策","tx":"退坡的公告是那年六月发的，过渡期一结束，单车补贴砍掉七成。行业里每个人都清楚那意味着什么：需求会被硬生生{{smash}}（砸）掉一截。\n\n那年下半年，同业十一家上市公司里九家收入负增长，最惨的掉了四成。\n\n东亚新能源那半年收入增长 61%。\n\n我盯着这个数看了很久。这不是抗周期，这是{{contradiction}}（矛盾）。\n\n于是我从公司往回退，退到那个县。\n\n基地所在的县那两年发了三期{{special purpose bond}}（地方政府专项债），募集说明书里的项目名叫\"新能源材料产业园基础设施配套\"，工程于当年三月{{commence}}（开工）。钱从债券出来，进园区平台，平台盖厂房、修路、通电，再\"租\"给入驻企业，租金接近于零。风险因素那一节里，政策变化的{{hazard}}（风险）只写了两行，还被排在最后。\n\n同一年，那家城商行的信贷投放里，新能源材料的占比从 3% 跳到 19%。我打电话去{{enquire}}（询问）一位在当地做过公司业务的人，他只说了四个字：{{window guidance}}（窗口指导）。不是命令，是建议。你可以不听，明年的额度会自己变少。\n\n真正的关键在第三步：园区平台开始向公司采购\"储能配套设备\"，付款用的正是专项债的资金，公司确认收入，应收账款挂在平台名下。\n\n直接补贴是{{donation}}（捐赠）性质的，进不了收入，只能记在营业外；换成采购，它就变成了收入，而且是有增长{{momentum}}（动能）的收入。{{irony}}（讽刺的是）退坡这件事本身，反而让它的报表更好看。附注里当然{{omit}}（略去）了政府补助的对手方明细，只留一句\"其他\"。\n\nRay 听完只说了两个字，用的还是英文：很{{cute}}（讨巧）。他说这套安排的{{charm}}（迷人之处）在于每一步都合法，你没有一处可以{{pin}}（钉死）。\n\n我把三张纸并排贴在隔板上，中间那张是那条通往园区的{{alley}}（小路）的照片，两边全是没上牌的厂房，尽头一台塔吊{{halt}}（停）在半空，三年没动过。有个{{anonymous}}（匿名的）账号在论坛上贴过同一个角度，配的字是\"欢迎参观\"。\n\n增长是一个{{illusion}}（错觉），但它是被两只手一起托起来的：财政和货币怎么{{interact}}（互相作用），决定了这个错觉能撑多久。\n\n那几年国内喊了三年{{fiscal consolidation}}（财政整固），赤字率却年年抬；一边压隐性债务，一边靠专项债扩基建。{{loan prime rate}}（贷款市场报价利率）一年调了四次，五年期那档动得最狠，因为要救的是另一件事。{{core inflation}}（核心通胀）掉到 0.5 以下，{{headline inflation}}（整体通胀）有几个月是负的，PPI 连着二十个月同比为负——真正压在头上的不是通胀，是{{deflation}}（通缩）的影子。\n\n美国那一侧完全反过来。{{FOMC}}（联邦公开市场委员会）已经把政策利率抬进{{restrictive territory}}（限制性区间），{{quantitative tightening}}（量化紧缩）在跑，每月{{balance sheet runoff}}（被动缩表）上限九百五十亿。那年{{Jackson Hole}}（杰克逊霍尔年会）上主席只讲了八分钟，讲完没人再敢押{{pivot}}（政策转向）。市场先赌{{technical recession}}（技术性衰退）会逼美联储低头，赌输之后又开始改口讲{{no landing}}（不着陆）。\n\n国内{{accommodative}}（宽松的）到不能再松，美国紧到不能再紧，{{interest rate differential}}（利差）就是这么撑开的。到那年{{mid}}（中段），一份欧洲机构的产业政策报告写了这件事，作者是个{{Polish}}（波兰的）经济学家，最后一句是：补贴不会消失，它只会换一个记账科目。\n\n我把这句话抄在停牌公告的背面。那份公告我留着，{{suspension}}（停牌）到今天还没解除。\n\n第四张纸我一直没贴上去——那年秋天，联储的声明里改了七个词。","ft":[{"w":"FOMC","z":"联邦公开市场委员会（FOMC）","d":"美联储的货币政策决策机构，每年召开八次议息会议","a":"","p":""},{"w":"Jackson Hole","z":"杰克逊霍尔（年会）","d":"每年八月的全球央行行长会议，常被用来释放重大政策信号","a":"","p":""},{"w":"accommodative","z":"宽松的；支持性的","d":"形容货币政策偏松、有意压低利率支持经济，与限制性相对","a":"","p":"ә'kɒmәdeitiv"},{"w":"balance sheet runoff","z":"被动缩表；到期不续做","d":"央行让持有债券自然到期不再买入，从而缓慢缩减资产负债表","a":"","p":""},{"w":"core inflation","z":"核心通胀","d":"剔除食品和能源后的物价涨幅，央行更看重它判断趋势","a":"","p":""},{"w":"deflation","z":"通缩","d":"物价水平持续下跌，会抬高实际债务负担并抑制消费投资","a":"","p":"di'fleiʃәn"},{"w":"fiscal consolidation","z":"财政整固；紧财政","d":"政府压缩赤字、控制债务的过程，常与austerity紧缩并称","a":"","p":""},{"w":"headline inflation","z":"整体通胀；名义通胀","d":"包含食品和能源在内的全口径物价涨幅，波动比核心通胀大","a":"","p":""},{"w":"interest rate differential","z":"利差","d":"两国政策或市场利率之差，是解释汇率和跨境资金流向的主线","a":"","p":""},{"w":"loan prime rate","z":"贷款市场报价利率（LPR）","d":"中国实际贷款定价的基准，分1年期和5年期，房贷跟5年期挂钩","a":"LPR","p":""},{"w":"no landing","z":"不着陆","d":"经济不减速、通胀也不回落，意味着利率需要更高更久","a":"","p":""},{"w":"pivot","z":"政策转向","d":"央行从紧缩立场转为宽松（或反向），是交易主线级别的关键词","a":"","p":"'pivәt"},{"w":"quantitative tightening","z":"量化紧缩（缩表）","d":"央行主动缩减资产负债表规模，与QE方向相反","a":"QT","p":""},{"w":"restrictive territory","z":"限制性区间","d":"政策利率高于中性水平、对经济形成压制的状态，常用于描述紧缩程度","a":"","p":""},{"w":"special purpose bond","z":"地方政府专项债","d":"中国地方政府为特定项目发行的债券，是基建投资的主要资金来源","a":"","p":""},{"w":"technical recession","z":"技术性衰退","d":"连续两个季度实际GDP环比负增长的简易判定标准","a":"","p":""},{"w":"window guidance","z":"窗口指导","d":"央行以非正式沟通引导银行信贷投放方向和节奏，中国常用","a":"","p":""}],"iw":[{"w":"illusion","p":"i'lju:ʒәn","t":"n. 幻影, 错觉, 幻想; 错觉"},{"w":"anonymous","p":"ә'nɒnimәs","t":"a. 姓氏不详的, 无名的, 无特色的; 无记录"},{"w":"commence","p":"kә'mens","t":"v. (使)开始, 得学位"},{"w":"hazard","p":"'hæzәd","t":"n. 冒险, 危险, 机会; vt. 冒...的危险, 赌运气, 使冒危险; 相关危险; 冒险"},{"w":"momentum","p":"mәu'mentәm","t":"n. 动力, 动量; 动量"},{"w":"donation","p":"dәu'neiʃәn","t":"n. 捐赠物, 捐款, 捐赠; 赠品, 捐款, 捐赠"},{"w":"irony","p":"'aiәrәni","t":"n. 反语, 讽刺, 具有讽刺意味的事"},{"w":"alley","p":"'æli","t":"n. 小路, 巷"},{"w":"enquire","p":"in'kwaiә","t":"v. 询问"},{"w":"interact","p":".intәr'ækt","t":"vi. 互相影响, 交互作用; n. 幕间剧, 幕间休息"},{"w":"Polish","p":"'pɒliʃ","t":"a. 波兰的; n. 波兰人, 上光剂, 光泽, 优雅; vt. 擦亮, 擦去, 使完美; vi. 擦亮, 变得光亮"},{"w":"cute","p":"kju:t","t":"a. 可爱的, 聪明的, 伶俐的; 品他病"},{"w":"mid","p":"mid","t":"a. 中间的, 中央的, 中部的; prep. 在...之中"},{"w":"pin","p":"pin","t":"n. 大头针, 针, 别针, 栓, 销子, 图钉, 插头, 管脚, 品(液量单位); vt. 将...用针别住, 钉住, 压住, 牵制, 使不能动, 归罪于; a. 针的, 销子的, 闩的"},{"w":"charm","p":"tʃɑ:m","t":"n. 吸引力, 魔力, 符咒; vt. 迷住, 使陶醉, 行魔法; vi. 用符咒, 有魅力"},{"w":"smash","p":"smæʃ","t":"n. 打碎, 粉碎, 打碎时哗啦声, 猛击, 扣球, 杀球, 经营失败, 破产, 硬币, 假硬币; a. 非常轰动的, 了不起的; vt. 打碎, 粉碎, 击溃, 使破产, 使裂变, 使用假硬币; vi. 碎裂, 猛撞, 破产, 扣球, 杀球; adv. 轰隆一声, 哗啦一声"},{"w":"omit","p":"әu'mit","t":"vt. 省略, 删除, 疏忽, 遗漏; 省略"},{"w":"halt","p":"hɒ:lt","t":"n. 停止, 立定, 休息; vt. 使停止, 使立定; vi. 立定, 停止, 蹒跚, 踌躇, 有缺点; 停止"},{"w":"contradiction","p":".kɒntrә'dikʃәn","t":"n. 反驳, 矛盾; 矛盾, 否认, 反驳"},{"w":"suspension","p":"sә'spenʃәn","t":"n. 悬挂, 暂停, 中止; 悬浮; 悬浮体; 悬浮液"}],"doc":{"k":"产业政策文件（英文译本节选）","en":"Implementation Measures for the New Energy Materials Industrial Park (translated excerpt). Article 7. Infrastructure works within the park shall be funded through the special purpose bond programme approved for the current fiscal year. Article 9. Where the county platform company procures supporting equipment from enterprises registered in the park, settlement may be deferred by up to three hundred and sixty days. Article 12. Financial institutions operating locally are encouraged, through window guidance, to allocate incremental credit to qualifying enterprises at rates referencing the loan prime rate. Article 15. These measures shall remain accommodative in orientation until the sector's growth normalises. The county acknowledges that fiscal consolidation targets apply, that headline inflation and core inflation both remain far below the national objective, and that persistent deflation in upstream prices may require the schedule to be revised.","zh":"新能源材料产业园实施办法（译文节选）。第七条 园区内基础设施工程，应通过本财政年度已获批准的地方政府专项债项目安排资金。第九条 县属平台公司向园区注册企业采购配套设备的，结算账期最长可延至三百六十天。第十二条 鼓励本地经营的金融机构，通过窗口指导，按参照贷款市场报价利率的价格，向符合条件的企业投放增量信贷。第十五条 在本行业增速回归正常之前，本办法在取向上应保持宽松。本县知悉财政整固目标同样适用，整体通胀与核心通胀均远低于全国目标，且上游价格持续通缩可能要求对上述安排的时间表作出修订。"}},{"i":94,"ti":"七个词","dom":"macro","sc":"央行沟通","tx":"那句话只改了七个词。\n\n上一次的声明写的是\"委员会预计额外的政策收紧可能是适当的\"；这一次改成\"在决定额外政策收紧的程度时\"。收紧从\"是否\"变成了\"多少\"。\n\n发布后的十一分钟里，两年期美债收益率掉了 19 个基点。\n\n我把那天的分时图打印出来。没有新数据，没有新事件，只有措辞。市场在那十一分钟里重估的不是经济，是央行的{{reaction function}}（反应函数）——它到底会对什么反应，反应多大。声明的文字像{{naval}}（海军的）电报，每个字都称过重量，删一个副词就是一次信号。\n\n两天后的{{nonfarm payrolls}}（非农就业）比预期高六万，市场只跌了半小时就翻红。因为它已经改了框架：坏消息也是好消息，好消息还是好消息。{{Fed put}}（美联储兜底）回来了。\n\n半年前所有人还在讲{{stagflation}}（滞胀），讲{{fiscal dominance}}（财政主导），讲极端情形下的{{helicopter money}}（直升机撒钱）。那时{{inverted yield curve}}（收益率曲线倒挂）已经十四个月，每一份策略会都以它开头。转折之后没人再提。{{disinflation}}（通胀放缓）成了新词，虽然那一段回落有一半来自{{base effect}}（基数效应）——去年同期基数太高，同比自然好看。失业率还压在{{NAIRU}}（非加速通胀失业率）之下，可只要{{anchored expectations}}（通胀预期锚定）没坏，央行就允许自己有耐心。加息的{{policy lag}}（政策时滞）被反复援引：药已经吃了，热度总会退，{{fever}}（发烧）总会{{heal}}（愈合）。\n\n那两周，一场三十年期国债{{auction}}（拍卖）需求好得反常，{{term premium}}（期限溢价）掉了三十个基点。同一时间，国内央行把{{reverse repo}}（逆回购）的量放大，{{credit impulse}}（信用脉冲）在数据里翘了一下——那是一整条{{vein}}（血管）重新有血流过去的样子；人民币在{{managed float}}（有管理的浮动汇率）的区间里稳住了；日本那边还在用{{yield curve control}}（收益率曲线控制），在长端筑着一道{{dam}}（水坝），全世界的长钱就顺着这道坝的缺口往外淌。\n\n我不需要更多的数据了。我需要一个日期。\n\n我把那批票据的{{placement}}（配售）完成日翻出来，和声明的日期并排放。中间隔了九天。\n\n九天。信用利差在那九天里收窄了四十个基点，是全年最窄的一周。一批以中国制造业应收账款为底层的票据，就是在那扇门开着的时候卖出去的。再早两个月卖不掉，再晚三个月也卖不掉。\n\n这批应收账款{{originate}}（源自）同一个县、同一个平台、同一套模板。它们被切开、分层、评级，最后躺进一堆养老金的账户里，跟{{commodity}}（大宗商品）基金和{{electronics}}（电子）行业的股票放在一起，编号排得整整齐齐。\n\n我坐在工位上，脑子里反复过一件事：有没有人提前知道那七个词？\n\n我想不出证明的路径。我甚至相信没有人提前知道。他们不需要知道。他们只是把整套东西准备好，放在那里，然后等门开一次。这个结构最厉害的地方，是它可以等。\n\n这件事没有{{manual}}（手册），没有人写过怎么查。这半年像一场{{expedition}}（远征），我一层一层往里走，剥掉一层，下面还是一层。\n\n那天我下楼买咖啡，楼下停着一排共享{{bicycle}}（自行车），有一辆倒在地上，踏板转了半圈停住。我想起为了去纽约，我在{{embassy}}（使领馆）的预约系统上刷了两个星期。想起 Elena 那边正在谈的{{plea}}（认罪协议）。想起有人在网上发过一份要求彻查的{{petition}}（请愿书），签了不到四百个名字，两天后就沉了。\n\n我回办公室，把整条链画在一张纸上：从降息画到退市。画完我抬头，发现自己没有一处可以{{shed}}（甩掉）——从头到尾，这张图里没有一个环节是犯罪。\n\n阳台上老周家那种旧{{tile}}（瓷砖）的颜色忽然在我脑子里冒出来。他曾说，制度是用来{{foster}}（培育）好行为的，不是用来抓坏人的。\n\n我把纸对折，塞进{{purse}}（钱包）里那一格。明天要拿给 Ray 看。","ft":[{"w":"Fed put","z":"美联储看跌期权；美联储兜底","d":"市场相信股市大跌时美联储会出手救市的预期","a":"","p":""},{"w":"NAIRU","z":"非加速通胀失业率（NAIRU）","d":"不会推高通胀的最低失业率水平，低于它一般视为经济过热","a":"","p":"'nairu:"},{"w":"anchored expectations","z":"通胀预期锚定","d":"公众长期通胀预期稳定在央行目标附近，是政策可信度的体现","a":"","p":""},{"w":"base effect","z":"基数效应","d":"去年同期基数高低导致同比读数失真，解读数据时必须先剔除","a":"","p":""},{"w":"credit impulse","z":"信用脉冲","d":"新增信贷占GDP比重的变化，领先于经济增长约两到三个季度","a":"","p":""},{"w":"disinflation","z":"通胀放缓；去通胀","d":"物价还在涨但涨幅收窄，注意与价格下跌的通缩区分","a":"","p":".disin'fleiʃәn"},{"w":"fiscal dominance","z":"财政主导","d":"政府债务压力大到迫使央行维持低利率，货币政策失去独立性","a":"","p":""},{"w":"helicopter money","z":"直升机撒钱","d":"央行直接给居民发钱的极端刺激设想，常用于讨论政策极限","a":"","p":""},{"w":"inverted yield curve","z":"收益率曲线倒挂","d":"短端利率高于长端，历史上是相对可靠的衰退领先信号","a":"","p":""},{"w":"managed float","z":"有管理的浮动汇率","d":"汇率大体由市场决定但央行会择机干预，人民币属于此类","a":"","p":""},{"w":"nonfarm payrolls","z":"非农就业（数据）","d":"美国每月新增就业人数，是全球市场关注度最高的单项经济数据","a":"NFP","p":""},{"w":"policy lag","z":"政策时滞","d":"货币政策从出台到影响实体经济需要的时间，通常被认为是几个季度","a":"","p":""},{"w":"reaction function","z":"反应函数","d":"央行如何根据通胀和就业数据调整利率的隐含规则，用于预判政策","a":"","p":""},{"w":"reverse repo","z":"逆回购","d":"央行向市场投放资金的操作，或市场机构的资金拆出方向，注意中美口径相反","a":"","p":""},{"w":"stagflation","z":"滞胀","d":"增长停滞与高通胀并存，货币政策进退两难的最糟组合","a":"","p":"stæg'fleiʃәn"},{"w":"term premium","z":"期限溢价","d":"投资者持有长期债券要求的额外补偿，上行会推高长端利率","a":"","p":""},{"w":"yield curve control","z":"收益率曲线控制（YCC）","d":"央行直接把某一期限国债收益率锁定在目标位，日本央行长期使用","a":"YCC","p":""}],"iw":[{"w":"vein","p":"vein","t":"n. 血管, 静脉, 纹理, 气质, 情绪; vt. 使有脉络, 像脉络般分布于"},{"w":"petition","p":"pi'tiʃәn","t":"n. 请愿, 诉状, 陈情书, 申请, 祈求, 祷文; v. 正式请求, 恳求, 请愿"},{"w":"shed","p":"ʃed","t":"n. 车棚, 小屋, 脱落之物, 分水岭; vt. 使流出, 放射, 脱落, 散发, 摆脱; vi. 流出, 散布, 脱落"},{"w":"purse","p":"pә:s","t":"n. 钱包, 小钱袋, 金钱, 募捐款, 囊状物; v. 缩拢, 皱起"},{"w":"foster","p":"'fɒstә","t":"a. 收养的, 养育的; vt. 养育, 抚育, 培养, 鼓励, 抱(希望)"},{"w":"expedition","p":".ekspi'diʃәn","t":"n. 远征, 探险队, 迅速"},{"w":"plea","p":"pli:","t":"n. 恳求, 辩解, 抗辩, 诉讼, 请愿, 托词; 抗辩, 申诉案件, 答辩"},{"w":"commodity","p":"kә'mɒditi","t":"n. 农产品, 商品, 有用的物品; 商品, 货物, 日用品"},{"w":"bicycle","p":"'baisikl","t":"n. 自行车"},{"w":"auction","p":"'ɒ:kʃәn","t":"n. 拍卖; vt. 拍卖"},{"w":"heal","p":"hi:l","t":"vi. 痊愈; vt. 使复原, 使和解, 治愈"},{"w":"fever","p":"'fi:vә","t":"n. 发烧, 发热, 热病; 发热, 热"},{"w":"naval","p":"'neivl","t":"a. 海军的, 军舰的, 有舰队的; 海军的, 军舰的, 船的"},{"w":"tile","p":"tail","t":"n. 砖瓦, 瓷砖, 瓦片; vt. 铺以瓦, 铺以瓷砖; 平铺"},{"w":"manual","p":"'mænjuәl","t":"n. 手册, 指南; a. 手的, 手动的, 手工的, 体力的; 人工的, 手动的"},{"w":"originate","p":"ә'ridʒineit","t":"vt. 创始, 发明, 发起; vi. 发源, 发生, 起航; 发自"},{"w":"embassy","p":"'embәsi","t":"n. 大使馆, 大使馆全体人员; 大使馆"},{"w":"placement","p":"'pleismәnt","t":"n. 放置, 布置, 工作安排, 编班, 定位球; 放置"},{"w":"electronics","p":".ilek'trɒniks","t":"n. 电子学; 电子学"},{"w":"dam","p":"dæm","t":"n. 水坝, 障碍; v. 控制, 筑坝; 直接存取法"}],"doc":{"k":"央行政策声明措辞对照说明","en":"Statement Language Comparison, prepared for the rates desk. The Committee removed the phrase indicating that additional policy firming may be appropriate and substituted language referring to the extent of any additional firming. In our reading this is a change to the reaction function rather than to the outlook. Nonfarm payrolls surprised to the upside two days later without reversing the move, which we regard as evidence that the Fed put has been re-priced. Disinflation over the past two quarters is flattered by base effect, and the unemployment rate remains below most estimates of NAIRU; anchored expectations, not realised inflation, are doing the work. We note a thirty-basis-point decline in term premium and a corresponding narrowing of credit spreads, and we expect the inverted yield curve to steepen from the front end.","zh":"政策声明措辞对照说明，供利率交易台参考。委员会删去了\"额外的政策收紧可能是适当的\"这一表述，代之以\"额外收紧的程度\"这一措辞。我们的解读是：这是对反应函数的修改，而非对经济前景的修改。两天后非农就业数据超出预期，却未逆转此前的走势，我们视其为美联储兜底预期被重新定价的证据。过去两个季度的通胀放缓受到基数效应的美化，失业率仍低于大多数关于非加速通胀失业率的估计；真正在起作用的是通胀预期锚定，而不是已实现的通胀。我们注意到期限溢价下行三十个基点，信用利差同步收窄，并预计倒挂的收益率曲线将从短端开始陡峭化。"}},{"i":95,"ti":"所有人都在等","dom":"macro","sc":"软着陆与市场预期","tx":"那天联储{{on hold}}（按兵不动），声明一个字没改，只有一票{{dissent}}（投票反对）。\n\n一票反对。市场把它读成转向的前兆，指数当晚涨了 1.4%。\n\n我关掉屏幕，去茶水间站了一会儿。窗外维港有船开过，浪打在防波堤上溅起一层白色的{{spray}}（水花）。\n\n市场做了一年半的事情，其实只有一件：给一个结局定价。{{Federal Reserve}}（美联储）的点阵图说今年还有一次加息，期货隐含的{{terminal rate}}（终端利率）比它自己的预测低六十个基点。所有人都在赌央行先眨眼。\n\n数据没有配合。{{PCE price index}}（个人消费支出物价指数）的核心口径从 5.6 掉到 3.1，最后那一段走得极慢，房租和服务是典型的{{sticky inflation}}（通胀黏性）。就业也不配合，按双重使命的口径，{{maximum employment}}（充分就业）根本不是问题。于是官员们改用嘴：{{jawboning}}（口头干预），不用真动手，说说就够。{{policy rate}}（政策利率）一动不动，\"{{higher for longer}}（利率在高位维持更久）\"这句话被印在每一份策略报告的第一页。\n\n有一次{{revision}}（数据修正）把过去六个月的新增就业下修了三十多万，市场热闹了半小时就散了。有人说央行{{behind the curve}}（落后于形势），有人说恰恰相反，两边引用的是同一组数字，只是{{texture}}（质地）读得不一样。{{real interest rate}}（实际利率）已经是十几年最高，可信用利差还在收窄，{{animal spirits}}（动物精神）根本没死。财政那头，{{fiscal impulse}}（财政脉冲）居然还是正的，国债供给大到开始有人认真讨论{{crowding out}}（挤出效应）。\n\n每一次议息都变成一场对央行可信度的{{referendum}}（公投），{{tourism}}（旅游业）和电影票房这种边角数据都被拿出来当证据。整件事像一场排练过的{{ballet}}（芭蕾）：所有人知道下一个动作，所有人还是要跳完。\n\n软着陆这个词有一种{{magnetic}}（磁性的）吸引力。它允许所有人都不必承担后果——公司不必倒，基金不必平仓，监管不必动手，养老金不必减记。\n\n那一周所有人都在等。Ray 在等三个 LP 的最终答复；Elena 在等第一个愿意开口的人；那家{{outfit}}（机构）在等我们先撑不住；我在等复牌。\n\nRay 从纽约机场的{{lounge}}（休息室）打电话给我，背景音里在广播登机口。他问我那张图画完了没有。我说画完了，我把这半年的东西编成一份{{catalog}}（目录），一百四十条，每条都贴了{{tag}}（标签）：可证实、可推断、只是感觉。可证实的那部分只有三十一条。\n\n\"这个结构没有{{defect}}（缺陷），\"我说，\"我找过了。\"\n\n它连{{patent}}（专利）都是真的，只是从没用于生产。它的{{bureaucracy}}（官僚流程）比任何一家同行都完整，走到{{bowel}}（最深处）你会发现每一层都有人签字，每一个签字的人都只看得见自己那一层。这不是{{empirical}}（经验上）意义上的欺诈，是设计。\n\n我最大的{{handicap}}（不利条件）不是信息，是我一直以为自己站在一条{{frontier}}（边界）上，一边是对，一边是错。其实那条线不在那儿。\n\nRay 沉默了几秒，说了一句我没料到的话：\"你是以谁的{{behalf}}（名义）在做这件事？\"\n\n我说我不知道。我只知道我们持仓 4.7 个点，而它已经停牌一百三十四天。\n\n挂掉电话我打开{{notebook}}（笔记本），把第一页那行字重看了一遍。那是十四个月前写的：产能与用电量对不上。手在轻轻{{tremble}}（发抖），不是紧张，是太久没睡。\n\n所有人都在等一个不会发生的结局——软着陆不会有，认罪不会有，道歉更不会有。会发生的只有一件事，而它在四十分钟后就到了。\n\n十一点二十，Danny 把公告转进群里：东亚新能源，下周一上午九时起恢复买卖。","ft":[{"w":"Federal Reserve","z":"美联储","d":"美国中央银行，负责美国货币政策，全球流动性的定价方","a":"Fed","p":""},{"w":"PCE price index","z":"个人消费支出物价指数","d":"美联储真正盯的通胀口径，权重会随消费替代动态调整，2%目标对应它","a":"","p":""},{"w":"animal spirits","z":"动物精神","d":"凯恩斯用来形容驱动投资的非理性信心，解释周期波动","a":"","p":""},{"w":"behind the curve","z":"落后于形势；行动太慢","d":"批评央行对通胀或衰退反应迟缓，加息降息节奏跟不上基本面","a":"","p":""},{"w":"crowding out","z":"挤出效应","d":"政府大量举债推高利率，从而挤占私人部门投资的现象","a":"","p":""},{"w":"dissent","z":"投票反对；异议票","d":"委员在决议中投反对票，票数增多往往预示政策即将转向","a":"","p":"di'sent"},{"w":"fiscal impulse","z":"财政脉冲","d":"
