"d":"研报的委婉说法，指当前倍数处在合理偏低的水平","a":"","p":""},{"w":"we see upside to consensus","z":"我们认为市场预期有上修空间","d":"卖方固定句式，暗示当前一致预期偏保守、后续会被上调","a":"","p":""},{"w":"revenue recognition","z":"收入确认","d":"判断何时以及按多少金额确认收入的会计处理，是造假高发区","a":"","p":""}],"iw":[{"w":"global","p":"'glәubl","t":"a. 通用的, 全球的, 球形的, 综合的, 普遍的; 共用"},{"w":"reform","p":"ri'fɒ:m","t":"n. 改革, 改正, 改造; vt. 改革, 改过, 革新, 重整; vi. 革新, 改过"},{"w":"scale","p":"skeil","t":"n. 刻度, 衡量, 比例, 比例尺, 数值范围, 等级, 规模, 天平, 秤, 鳞, 积垢; vt. 依比例决定, 攀登, 测量, 绘制, 刮鳞, 使生垢, 过秤; vi. 剥落, 生水垢, 重量为, 攀登, 衡量; 刻度"},{"w":"equipment","p":"i'kwipmәnt","t":"n. 装备, 设备, 才能; 设备; 装备; 装置"},{"w":"release","p":"ri'li:s","t":"n. 释放, 发泄, 豁免, 发行, 释放证书; vt. 释放, 解除, 放松, 豁免, 免除, 发布, 放弃, 让与; n. 发布; 版本, 发布"},{"w":"credit","p":"'kredit","t":"n. 信用, 信任, 荣誉, 贷款, 学分; vt. 归功于, 赞颂, 信任, 相信; 信用量"},{"w":"critical","p":"'kritikәl","t":"a. 批评的, 决定性的, 危险的, 临界的; 危象的; 临界的, 极期的"},{"w":"male","p":"meil","t":"n. 男人, 雄性动物; a. 男性的, 雄性的, 有力的"},{"w":"recall","p":"ri'kɒ:l","t":"n. 回忆, 召回, 撤消; vt. 回想, 回忆, 召回, 撤消, 使恢复; 检索"},{"w":"otherwise","p":"'ʌðәwaiz","t":"adv. 否则, 不同地, 别的方式"},{"w":"status","p":"'steitәs","t":"n. 状态, 情形, 地位, 要人身份; 状态"},{"w":"track","p":"træk","t":"n. 轨迹, 足迹, 径迹, 小道, 轨道, 磁轨, 途径; vt. 循路而行, 追踪, 通过, 用纤拉; vi. 追踪, 留下足迹, 沿轨道运行; 跟踪"},{"w":"band","p":"bænd","t":"n. 带子, 队, 乐队; v. 联合, 结合; 频带; 波段; 区"},{"w":"strike","p":"straik","t":"n. 罢工, 打击, 殴打; vt. 打, 撞击, 冲击, 侵袭, 取消, 结算, 打掉, 罢工, 刺透, 使生根, 遇见; vi. 打, 打击, 抓, 罢工, 搏动, 触礁, 敲, 响, 穿透, 打动"},{"w":"failure","p":"'feiljә","t":"n. 失败, 失败者, 不足, 缺乏, 破产; 故障; 失效"},{"w":"freedom","p":"'fri:dәm","t":"n. 自由, 坦率, 特权; 自由, 自主, 免除"},{"w":"essential","p":"i'senʃәl","t":"n. 要素, 要点, 本质; a. 必要的, 重要的, 本质的; 本质冒险"},{"w":"confirm","p":"kәn'fә:m","t":"vt. 证实, 确定, 批准, 使巩固; 确认"},{"w":"adopt","p":"ә'dɒpt","t":"vt. 采用, 正式通过, 收养, 接受; 采取"},{"w":"file","p":"fail","t":"n. 档案, 公文箱, 文件夹, 文件, 卷宗, 锉刀; vi. 列队行进, 用锉刀做; vt. 归档, 申请, 锉, 琢磨; 文件"}],"doc":{"k":"做空报告的执行摘要","en":"Executive summary (internal draft, not for distribution). We believe the reported accounts of Orient Kinetic Materials overstate genuine economic activity, principally through revenue recognition on distributor shipments booked at delivery under 180-day terms. Our base case assumes only half of that revenue is collectible, which cuts the three-year CAGR from 62% to 11%. Discounting free cash flow at 11.4%, derived from the capital asset pricing model, and cross-checking with the exit multiple method at 6x EBITDA, we reach a net present value of HK$11-14 per share against HK$44 today. A terminal growth rate of 1.5% is deliberately conservative. Even at a 100% payout ratio the current multiple is unsupportable. We expect a sustained de-rating and see no margin of safety at these levels.","zh":"执行摘要（内部草稿，不对外分发）。我们认为东亚新能源材料所披露的财务数据高估了真实经营活动，主要问题出在收入确认上：对经销商的发货在交付时即确认收入，账期长达一百八十天。我们的中性假设是这部分收入只有一半能够收回，这将三年复合年均增长率从 62% 下调至 11%。我们以资本资产定价模型推导出 11.4% 的折现率对自由现金流折现，并以 6 倍 EBITDA 的退出倍数法交叉验证，得到每股净现值 11 至 14 港元，而当前股价为 44 港元。1.5% 的永续增长率是我们刻意采取的保守假设。即便按 100% 的分红率计算，当前估值倍数也无法支撑。我们预计估值将持续下修，在当前价位上看不到任何安全边际。"}},{"i":13,"ti":"十一家覆盖，十家买入，我把假设一条条拆开","dom":"valuation","sc":"卖方研报","tx":"十一份研报打印出来，叠起来半尺高。我用了两天，把它们拆成一张表。\n\n十家买入，一家中性。\n\n先看最厚的那份，某家{{British}}（英国的）投行香港{{branch}}（分部）出的，一百二十页，光是{{length}}（篇幅）就够唬人。作者简历里写着{{Oxford}}（牛津）的材料学硕士。他的{{investment thesis}}（投资逻辑）只有三句话：需求超预期、技术领先、产能兑现。三句话，没有一句是能被证伪的。\n\n他的{{financial model}}（财务模型）附在最后两页。我把假设一条条抄进自己的表里，抄到第七行就停了——他 2026 年的收入假设，正好等于管理层在一次{{non-deal roadshow}}（非交易路演）上口头提过的数字。那场路演我也去了，就在这家券商三十七楼的直播{{studio}}（演播室）里，全程没有任何书面材料。\n\n估值他用{{comparable company analysis}}（可比公司分析）。{{peer group}}（可比公司组）里放了六家公司，一家做储能集成，一家做电池回收，还有一家——我看了三遍——是零售连锁，报告里居然引用了它的{{same-store sales growth}}（同店销售增长）来佐证\"下游景气度\"。选谁进这个篮子，本身就已经决定了结论。\n\n他给的{{EV/EBITDA}}（企业价值倍数）是十八倍。可江西基地的厂房是租的，租赁负债挂在表上，对应的{{right-of-use asset}}（使用权资产）有二十六亿，他的企业价值里一分钱租赁负债都没加回去。加回去，十八倍变二十三倍。\n\n{{terminal value}}（终值）占他 DCF 结果的百分之七十四。这一百二十页里，四分之三的结论来自最后一个他没有解释的数字。\n\n报告里还有一段讲原料，说公司锁定了{{African}}（非洲的）锂辉石长单，{{transport}}（运输）成本比同业低三成，并把这条长单当成公司最核心的{{strength}}（优势）。我打电话问了两家货代，这条线路的运费去年反而涨了。这家券商在{{States}}（美国）的销售把这份报告转给了他们的机构客户，其中有几家养老金。\n\n这不是不专业。写这些的人多半比我聪明。问题在{{beginning}}（起点）：他们从公司给的数字开始，而不是从能核对的事实开始。\n\n十一家里，有一家去年五月{{drop coverage}}（终止覆盖）过一次，三个月后又回来，中间那三个月正好是公司做增发的窗口。有一家至今把评级挂在{{under review}}（评级与目标价待调整），从去年十一月挂到现在。还有一家写公司已经{{de-risked}}（风险已释放），理由是审计师出了标准无保留意见。\n\n只有一家不一样。\n\n那是个很小的本地研究所，作者是位女分析师，报告只有九页。标题下面第一句就是{{we turn cautious}}（我们转为谨慎），评级从买入降到{{market perform}}（与大市同步）。她写了一个完整的{{bear case}}（悲观情形）：如果应收账款的账龄继续恶化，公司必须外部融资，那所有的{{re-rating}}（估值重估）逻辑都不成立。她甚至提到公司曾暗示要派{{special dividend}}（特别股息），而账上的{{cash}}（现金）大部分是受限的。\n\n她把行业的{{headwinds and tailwinds}}（逆风与顺风）列成一张表，逆风七条，顺风两条。这是我在这十一份里唯一看到的{{balance}}（平衡）。\n\n我找到这家研究所的{{contact}}（联系人），想跟她聊聊。前台说她三月就离职了。\n\n那天晚上表做完，最{{obvious}}（明显的）一件事浮上来：十一家里有九家的母公司，要么是这家公司 IPO 承销团的成员，要么给它做过债券融资。这不叫阴谋，这叫结构性的利益{{conflict}}（冲突）——每个人都在按规则办事，合起来就是没有一个人在做研究。\n\n我把这段发给 Ray。他回了一条：所以这种事总要等到{{crisis}}（危机）才被发现。\n\n第二天，我调出它 2020 年的{{annual}}（年度的）报告，想看看最早的利润{{contribution}}（贡献）是怎么拆的。翻到第一百一十八页，一个我完全没预料到的东西跳出来：给它应收账款承保的信用{{insurance}}（保险）机构，注册地在开曼，跟我上个月在附注里看到的那家关联方，同一个地址。\n\n我盯着屏幕，第一次觉得这不只是一家公司的问题。我把那页截图存下，文件名写成\"{{investigation}}（调查）·第一天\"。\n\n后来我才知道，就在同一周，纽约有人正在看同一条链的另一头。","ft":[{"w":"EV/EBITDA","z":"企业价值倍数","d":"剔除资本结构和折旧差异的倍数，重资产和跨国比较时常用","a":"","p":""},{"w":"bear case","z":"悲观情形","d":"假设恶化情况下的估值下限，衡量下跌风险的参照","a":"","p":""},{"w":"comparable company analysis","z":"可比公司分析；comps","d":"挑一组同业公司比倍数，相对估值里最常用的做法","a":"comps","p":""},{"w":"de-risked","z":"风险已释放","d":"利空落地后不确定性下降，估值具备修复的条件","a":"","p":""},{"w":"drop coverage","z":"终止覆盖","d":"研究所不再跟踪该股票，一般不代表对基本面的判断","a":"","p":""},{"w":"financial model","z":"财务模型","d":"三张表加假设驱动的预测表格，卖方研究的基本工作底稿","a":"","p":""},{"w":"headwinds and tailwinds","z":"逆风与顺风；不利与有利因素","d":"压制或推动业绩的外部条件，如成本上涨或政策支持","a":"","p":""},{"w":"investment thesis","z":"投资逻辑","d":"支撑推荐的核心论证链条，研报开头那三点通常就是它","a":"","p":""},{"w":"market perform","z":"与大市同步；中性","d":"预期表现与基准指数接近，实质就是持有评级","a":"","p":""},{"w":"non-deal roadshow","z":"非交易路演；NDR","d":"不涉及融资的管理层路演，卖方安排的核心服务之一","a":"NDR","p":""},{"w":"peer group","z":"可比公司组；同业样本","d":"选来做倍数比较的一篮子公司，选谁进去直接影响结论","a":"","p":""},{"w":"re-rating","z":"估值重估；估值上修","d":"市场愿意给更高倍数，通常由逻辑改善或风险下降驱动","a":"","p":""},{"w":"same-store sales growth","z":"同店销售增长","d":"零售餐饮看内生经营的关键指标，剔除开店带来的增量","a":"SSSG","p":""},{"w":"special dividend","z":"特别股息","d":"一次性大额分红，常在资产出售或现金冗余时派发","a":"","p":""},{"w":"terminal value","z":"终值；永续价值","d":"预测期之后所有现金流的现值，常占DCF结果的六七成","a":"TV","p":""},{"w":"under review","z":"评级与目标价待调整","d":"重大事件后先把评级挂起，等信息明确再更新","a":"","p":""},{"w":"we turn cautious","z":"我们转为谨慎","d":"下调看法的委婉表述，通常伴随评级或预测的下调","a":"","p":""},{"w":"right-of-use asset","z":"使用权资产","d":"新租赁准则下承租人对租入资产确认的资产，与租赁负债对应","a":"ROU","p":""}],"iw":[{"w":"Oxford","p":"'ɒksfәd","t":"n. 牛津, 牛津大学"},{"w":"obvious","p":"'ɒbviәs","t":"a. 明显的, 明白的, 显然的, 平淡无奇的"},{"w":"length","p":"leŋθ","t":"n. 长度, 长, 期间, 一段; 记录长度; 块长; 字长"},{"w":"investigation","p":"in.vesti'geiʃәn","t":"n. 调查, 审查; 调查, 调查研究"},{"w":"balance","p":"'bælәns","t":"n. 平衡, 差额; vi. 平衡, 相等; vt. 称, 权衡, 比较, 使平衡, 结算, 抵消"},{"w":"branch","p":"bræntʃ","t":"n. 树枝, 支店, 支流, 分部; vi. 分支, 出枝; vt. 分割, 用枝状叶脉刺绣花纹装饰; 分支, 目录分支"},{"w":"conflict","p":"'kɒnflikt","t":"n. 战斗, 冲突, 矛盾, 争执; vi. 争执, 战斗, 冲突, 抵触; 冲突"},{"w":"States","p":"","t":"n. 美国"},{"w":"British","p":"'britiʃ","t":"a. 英国的; n. 英国人, 英国英语"},{"w":"studio","p":"'stju:diәu","t":"n. 工作室, 画室, 演播室, 电影制片厂"},{"w":"strength","p":"streŋθ","t":"n. 力量, 实力, 强度, 浓度, 人数, 抵抗力; 强度"},{"w":"contact","p":"'kɒntækt","t":"n. 联系, 交际, 熟人, 接触; vi. 接触, 联系; vt. 使接触"},{"w":"insurance","p":"in'ʃurәns","t":"n. 保险, 保险业, 保险费; 保险"},{"w":"beginning","p":"bi'giniŋ","t":"n. 开始"},{"w":"contribution","p":".kɒntri'bju:ʃәn","t":"n. 捐助, 捐助之物, 贡献; 贡献, 捐款, 补助品"},{"w":"transport","p":"træns'pɒ:t","t":"n. 运输, 运输工具, 激动, 狂喜, 流放犯; vt. 传送, 运输, 流放; 传送"},{"w":"African","p":"'æfrikәn","t":"n. 非洲人; a. 非洲的, 非洲人的"},{"w":"cash","p":"kæʃ","t":"n. 现金; vt. 兑现"},{"w":"crisis","p":"'kraisis","t":"n. 危机, 危险期, 紧要关头; 危象; 骤退, 临界, 极期"},{"w":"annual","p":"'ænjuәl","t":"n. 年刊, 年报; a. 每年的, 一年一次的, 全年的, 一年生的"}],"doc":{"k":"卖方研报摘要","en":"We turn cautious on Orient Kinetic Materials and downgrade to market perform, with our target price under review. Our investment thesis no longer holds: the bear case, in which receivable ageing continues to deteriorate and the company must raise external funding, now looks more probable than the re-rating scenario. We note that the peer group used across the street is poorly constructed, and that consensus EV/EBITDA of 18x excludes lease liabilities against a right-of-use asset of RMB2.6bn. Terminal value accounts for roughly three quarters of most published DCF outputs. Headwinds and tailwinds are no longer balanced, and management's hint at a special dividend is not credible given restricted cash.","zh":"我们对东亚新能源材料转为谨慎，评级下调至与大市同步，目标价待调整。我们原有的投资逻辑已不再成立：悲观情形——应收账款账龄持续恶化、公司不得不进行外部融资——目前看来比估值重估的情形更有可能发生。我们注意到，市场上通行的可比公司组构建得很粗糙，而一致预期的 18 倍企业价值倍数并未把租赁负债计入，其对应的使用权资产高达 26 亿元人民币。在多数已发布的现金流折现结果中，终值大约占到四分之三。行业的逆风与顺风已不再均衡，考虑到公司账上现金大部分受限，管理层关于派发特别股息的暗示并不可信。"}},{"i":14,"ti":"它上调了指引，创了新高，Ray 说这是最好的入场点","dom":"valuation","sc":"业绩指引与预期","tx":"公司是在周四晚上七点十二分发的{{pre-announcement}}（业绩预告），把全年收入目标一口气上调了 14%。\n\n我当时在自己的{{apartment}}（公寓）里，锅还在灶上。\n\n第二天九点半开盘，股价直接跳空，五分钟内摸到四十九块八。{{consensus estimate}}（市场一致预期）在两个小时里被上修了三次，中午之前，三家券商把它放进了{{top pick}}（首选标的）名单。它是那天整个{{regional}}（区域性的）指数里贡献最大的一只。\n\n下午四点是{{earnings call}}（业绩电话会）。我提前二十分钟拨进去，想听听{{key debate}}（市场核心分歧）会不会被人问出来。\n\n问的人不多。第一个提问的是买方的一位{{associate}}（同事），问产能爬坡的{{route}}（路线）。第二个问{{segment information}}（分部信息）里正极和前驱体怎么拆，Vivian Sze 说这个口径要等年报。第三个问{{Africa}}（非洲）的原料布局，她讲了四分钟，讲得非常好，一个数字都没有。管理层的{{presence}}（出席）无可挑剔，语速、停顿、礼貌，全都到位。\n\n没有人问应收账款。\n\n真正{{relevant}}（相关的）问题只有一个，是一位{{Christian}}（基督徒）分析师提的——他先道歉说圣诞周打扰大家——他问：这次上调之后，四季度的{{underlying profit}}（核心利润）需要环比增长多少才能达成。Vivian 停了一秒，说她不做单季度的{{assessment}}（评估），然后{{deny}}（否认）了任何激进确认的{{potential}}（可能性），语气好得挑不出毛病。\n\n那一秒的停顿，是整场会里唯一{{emerge}}（浮现）出来的东西。\n\n会后我做了三件事。第一，重算{{diluted EPS}}（摊薄每股收益）——它有一笔可转债，全部转股会摊薄 9%，卖方模型里有四家压根没算。第二，把{{forward P/E}}（前瞻市盈率）的基准年往前{{roll}}（滚动）一年，市场就是这么把六十倍变成三十八倍的：不是估值降了，是把明年当成了今年。第三，画一张历史倍数的{{standard deviation band}}（标准差通道），它已经在上沿之外待了十四个月。\n\n我还顺手算了{{EV/sales}}（市销率）。从{{practical}}（实际的）角度讲，如果收入本身有问题，这个指标只是把错误再放大一遍。\n\n那天{{spot}}（现货的）碳酸锂价格又跌了 2%，而它的毛利率据说纹丝不动。\n\nRay 站在我身后看完，说了一句我很久没想明白的话：这是最好的入场点。\n\n我说，可它刚{{beat}}（超预期），还创了新高。\n\n他说，正因为它 beat 了。公司{{sandbagging}}（指引留有余地）是常态——先给低目标，再一次次超预期，那没什么可怕的。但这家不是。它在往上抬目标，抬到自己也必须持续超预期才行。这种公司只有一个结局。\n\n他拿笔在我纸上画了两条线，一条是{{normalized earnings}}（正常化盈利），一条是它自己报的数。两条线之间的{{distance}}（距离），三年来一直在拉大，从来没有收敛过。\n\n\"你算过{{weighted average cost of capital}}（加权平均资本成本）了吧。\"他说，\"再给它一个{{mid-cycle multiple}}（周期中枢倍数）看看。行业中枢九倍，它现在三十八倍。这中间的{{proportion}}（比例），不是增长能解释的。\"\n\n我问，那什么时候会出现反过来的{{re-rating catalyst}}（估值修复催化剂）。\n\n他说，不需要催化剂。所有靠预期撑着的东西，最后都是被自己的{{consequence}}（后果）压垮的。\n\n他还提了一句{{holding company discount}}（控股公司折价）：它上面那个香港的控股平台，市值比它持有的股权还低两成，市场其实早就在打折了，只是没人说出来。\n\n我们之间的{{understanding}}（谅解）一直是这样：他给方向，我给数。他的{{aim}}（目标）从来不是证明这家公司在造假，而是在市场承认之前，把仓位建好。\n\n收盘涨了 6.4%。他关掉屏幕，说了四个字：明天开始。\n\n然后他转向 Danny：去借券。","ft":[{"w":"EV/sales","z":"市销率（企业价值口径）","d":"还没盈利的公司用收入倍数估值，常见于科技和创新药","a":"","p":""},{"w":"beat","z":"超预期；超市场预期","d":"实际业绩高于一致预期，英文研报直接说beat","a":"","p":"bi:t"},{"w":"consensus estimate","z":"市场一致预期","d":"覆盖分析师预测的平均值，判断业绩超预期与否的基准","a":"","p":""},{"w":"diluted EPS","z":"摊薄每股收益","d":"考虑可转债和期权全部转股后的每股盈利，估值应以此为准","a":"","p":""},{"w":"earnings call","z":"业绩电话会","d":"财报后管理层讲解业绩并答问，纪要是研究的重要信息源","a":"","p":""},{"w":"forward P/E","z":"前瞻市盈率；动态PE","d":"用未来十二个月或明年预测盈利算的市盈率，研报默认口径","a":"","p":""},{"w":"holding company discount","z":"控股公司折价","d":"控股平台市值低于所持资产加总，市场对治理和流动性打折","a":"","p":""},{"w":"key debate","z":"市场核心分歧","d":"多空双方争论的关键问题，研报常单列一节来回应","a":"","p":""},{"w":"mid-cycle multiple","z":"周期中枢倍数","d":"跨越完整周期后的平均倍数，用来给周期股定合理估值","a":"","p":""},{"w":"normalized earnings","z":"正常化盈利；中枢盈利","d":"剔除周期高低点和一次性因素后的可持续盈利水平","a":"","p":""},{"w":"pre-announcement","z":"业绩预告","d":"正式财报前先披露大致业绩，A股常见的正面或负面预告","a":"","p":""},{"w":"re-rating catalyst","z":"估值修复催化剂","d":"能让市场提高估值倍数的事件，如分拆上市或治理改善","a":"","p":""},{"w":"sandbagging","z":"指引留有余地；藏业绩","d":"公司故意给偏低的指引，方便后续持续超预期","a":"","p":"ˈsændbæɡɪŋ"},{"w":"standard deviation band","z":"标准差通道","d":"以历史倍数均值加减标准差画带，看当前处在什么分位","a":"SD band","p":""},{"w":"top pick","z":"首选标的","d":"研究所在某个行业里最推荐的一只股票","a":"","p":""},{"w":"underlying profit","z":"经常性利润；核心利润","d":"去掉非经常项目后的可持续利润，港股研报常见口径","a":"","p":""},{"w":"weighted average cost of capital","z":"加权平均资本成本；WACC","d":"股权和债务成本按市值加权，折现自由现金流的标准折现率","a":"WACC","p":""},{"w":"segment information","z":"分部信息","d":"按业务或地区拆分的收入和利润数据，是拆分模型的主要来源","a":"","p":""}],"iw":[{"w":"associate","p":"ә'sәuʃieit","t":"n. 同伴, 伙伴, 关联的事物; vt. 使联合, 使发生联系; vi. 交往; 关联"},{"w":"presence","p":"'prezns","t":"n. 出席, 面前, 存在, 仪态, 风度; 出现"},{"w":"spot","p":"spɒt","t":"n. 污点, 地点, 斑点, 点, 娱乐场所, 处境, 少量; a. 当场的, 现场的, 现货买卖的, 现金交易的, 抽样的; vt. 点缀, 玷污, 认出, 准确定...的位, 用灯光照射; vi. 玷污, (从空中)侦察敌方目标"},{"w":"consequence","p":"'kɒnsikwәns","t":"n. 结果, 重要性; 结果, 后果, 推断"},{"w":"distance","p":"'distәns","t":"n. 距离, 远方, 遥远; 位距"},{"w":"relevant","p":"'relivәnt","t":"a. 有关联的, 有关系的, 适当的, 相应的; 有关的, 相关的"},{"w":"route","p":"ru:t","t":"n. 路径, 途径, 路线; vt. 确定路线, 按规定路线发送; 传递, 路由设定程序"},{"w":"proportion","p":"prә'pɒ:ʃәn","t":"n. 比例, 比率, 均衡, 部分, 面积; vt. 使成比例, 使均衡"},{"w":"assessment","p":"ә'sesmәnt","t":"n. 评估, 估定, 评定的款额; 评估"},{"w":"roll","p":"rәul","t":"n. 卷, 滚动, 名单, 案卷, 压路机; vi. 滚, 滚动, 飘流, 起伏, 卷, 绕; vt. 使滚动, 卷, 绕"},{"w":"Africa","p":"'æfrikә","t":"n. 非洲"},{"w":"emerge","p":"i'mә:dʒ","t":"vi. 浮现, 形成, 出现, (事实)显露"},{"w":"regional","p":"'ri:dʒәnәl","t":"a. 地方的, 地域性的; 区的, 部位的"},{"w":"deny","p":"di'nai","t":"v. 否认, 拒绝"},{"w":"practical","p":"'præktikl","t":"a. 实际的, 现实的, 实用性的; 事实上的, 实际上的, 接近...的"},{"w":"potential","p":"pә'tenʃәl","t":"n. 潜在性, 可能性, 潜力, 潜能, 势, 位; a. 有潜力的, 可能的, 潜在的"},{"w":"understanding","p":".ʌndә'stændiŋ","t":"n. 理解, 谅解; 协商, 协议, 谅解"},{"w":"aim","p":"eim","t":"n. 目标, 瞄准, 击中目标的能力; vi. 对准目标, 致力, 打算; vt. 瞄准; 医学文摘索引, 存取隔离机构, 高级信息管理程序, 先进接口模块; 应用接口模块, 医学人工智能, 相联索引法, 异步接口模块; 自动化信息管理, 自动化综合制造, 自动化库存管理"},{"w":"Christian","p":"'kristʃәn","t":"n. 基督徒, 正派人; a. 基督的, 基督教的"},{"w":"apartment","p":"ә'pɑ:tmәnt","t":"n. 房间, 公寓"}],"doc":{"k":"业绩电话会问答片段","en":"Analyst: Thank you. Following last night's pre-announcement, consensus estimate for the full year is moving up sharply. Could you tell us how much of the beat sits in the cathode business, and whether we should expect fuller segment information at the annual results? Also, on a diluted EPS basis, does the raised target already assume conversion of the outstanding notes?\n\nCFO: We don't guide on a quarterly basis, and I'd caution against reading the raise as a change in accounting posture. On underlying profit the trend has been consistent for eight quarters. Normalized earnings, adjusted for the subsidy timing you all know about, are tracking slightly ahead of our internal plan. We'll give the full segment split with the audited accounts.","zh":"分析师：谢谢。在昨晚的业绩预告之后，全年的市场一致预期正在大幅上修。能否请您说明，这次超预期有多少来自正极业务？以及我们是否可以期待在年度业绩中看到更完整的分部信息？另外，按摊薄每股收益口径，上调后的目标是否已经假设了在外可转债全部转股？\n\n首席财务官：我们不对单季度作出指引，同时我要提醒各位，不要把这次上调理解为会计立场的变化。就核心利润而言，趋势已经连续八个季度保持一致。剔除各位都清楚的补贴时点因素后，正常化盈利略好于我们的内部计划。完整的分部拆分我们会随经审计的报表一并披露。"}},{"i":15,"ti":"借券不够，Danny 跑了三家券商","dom":"trading","sc":"卖空机制","tx":"Ray 的原话只有四个字：明天开始。\n\nDanny 的第一反应是笑：\"借券？这票你上哪儿借去。\"\n\n第二天早上八点四十，他已经在打第三个电话。我们在主经纪商那边的{{margin account}}（保证金账户）额度是够的，问题从来不是钱，是券——市场上根本没有那么多可借的票。\n\n第一家答复得很客气：可借三十万股，费率年化 18%，而且是{{regular}}（常规的）非锁定券，随时可能被召回。三十万股，不到我们要的十分之一。\n\nDanny 挂了电话，敲了敲桌子：\"这个数字本身就是{{content}}（内容）。\"我明白他的意思：借券这么紧，说明{{positioning}}（持仓结构）已经很拥挤了，能借的早被人借走了。\n\n第二家是他前{{employer}}（雇主）的股票借贷台。那边的{{chief}}（主管）跟他吃过很多次饭，愿意帮忙，但只能从一只长线的家族{{estate}}（财产）账户里凑出四十万股，条件是我们随时准备{{deliver}}（交付）——一旦对方要券，我们必须在两个交易日内还上，还不上就是{{forced buy-in}}（强制买回），成本完全不受我们控制。\n\n我在旁边听着，脑子里在算另一件事：如果 forced buy-in 真发生，而那时候股价正在{{melt-up}}（逼空式上涨），那我们面对的就不是亏钱的问题，是被抬出去的问题。\n\n第三家把缺口补上了。三家一共{{contribute}}（贡献）了一百一十万股，加上后来两笔{{additional}}（额外的）零券，第一笔仓位总算有了着落。整个过程花掉两天。\n\nDanny 把{{candlestick chart}}（K线图）调出来，指给我看。上周五那根长上影，{{volume spike}}（放量）是二十日均量的四倍，收盘价创了{{52-week high}}（52周新高）。这几天在四十八到五十之间{{consolidation}}（盘整），{{relative strength index}}（相对强弱指标）读数 78，已经{{overbought}}（超买）好几天。\n\n\"技术上讲，\"他说，\"这里往下破一根就是{{breakdown}}（破位），一堆人挂在下面的{{stop-loss order}}（止损单）会连锁触发。但你得小心这是个{{bear trap}}（空头陷阱）——假破位，把空头骗进来，然后一根拉回去。\"\n\n我问他打算怎么下单。\n\n他{{propose}}（提议）用{{TWAP}}（时间加权均价）分批走，尽量贴着{{average}}（平均）成交量的节奏，绝不{{hit the bid}}（主动砸卖）。\"我们一砸，盘口立刻知道有人在出货。反过来也一样，那些追涨的人{{lift the offer}}（主动扫货），第二天全市场都看得见。\"\n\n我{{observe}}（观察）了半天盘口，问了一个外行问题：为什么不一次做完。\n\n他说：因为我们不是唯一在{{link}}（关联）这条线的人。你今天砸一笔大的，明天就有人来问你为什么。\n\n中午出了个插曲。市场传闻公司要做{{top-up placement}}（先旧后新），大股东先卖老股再认购新股。真要是这样，短期供给增加、股价会跌，但对我们不见得是好事——增发意味着公司拿到现金，能撑更久。Danny 的{{comment}}（评论）是一句粗话。\n\n下午两点，股价果然跌了 3%，然后又拉回来。有人在群里喊这是{{dead cat bounce}}（超跌反弹）。我没接话——那是下跌趋势里才成立的说法，现在还远远不是。\n\n收盘后我们对账。第一笔空头建完，T+2 {{settle}}（结算），借券费按日计，这笔{{debt}}（债务）我们每天都在付。我抽了一个{{sample}}（样本），看当天最大的几笔{{block}}（大宗）成交，其中一笔一百八十万股走的是场外，价格比收盘还高两分钱。\n\n我把它记了下来。当时没多想。\n\nRay 在飞纽约的{{flight}}（航班）上，落地后回了一条消息，只有一句：{{due}}（到期的）压力永远比你想的来得早。\n\n我的{{conclusion}}（结论）写在那天笔记的最后一行：我们第一次真的站到了它的对面。\n\n三周之后我才知道，那一百八十万股的买家是谁。","ft":[{"w":"52-week high","z":"52周新高","d":"过去一年内的最高价，创新高常吸引趋势资金跟进","a":"","p":""},{"w":"TWAP","z":"时间加权均价","d":"把大单按时间均匀拆分执行，降低对盘面的冲击","a":"TWAP","p":""},{"w":"bear trap","z":"空头陷阱","d":"假破位诱空之后迅速拉回，空头被迫高位回补","a":"","p":""},{"w":"breakdown","z":"破位","d":"跌穿关键支撑位，技术派通常在此止损离场","a":"","p":"'breikdaun"},{"w":"candlestick chart","z":"K线图；蜡烛图","d":"用开高低收四个价格画出的图形，反映多空博弈","a":"","p":""},{"w":"consolidation","z":"盘整；横盘","d":"大幅波动后价格在窄幅区间整理，等待方向选择","a":"","p":"kәn.sɒli'deiʃәn"},{"w":"dead cat bounce","z":"死猫跳；超跌反弹","d":"下跌趋势中的短暂反弹，之后通常继续创出新低","a":"","p":""},{"w":"forced buy-in","z":"强制买回；强制回补","d":"无法按时交付股票被券商强行买入还券，成本不可控","a":"","p":""},{"w":"hit the bid","z":"主动砸卖；砸盘","d":"以买一价直接卖出，急于出货时会明显压低盘面价格","a":"","p":""},{"w":"lift the offer","z":"主动扫货；扫单","d":"以卖一价直接买入，说明买方急于建仓不计较价格","a":"","p":""},{"w":"margin account","z":"保证金账户；两融账户","d":"可以融资买入或融券卖出的信用交易账户","a":"","p":"ˈmɑ:dʒin əˈkaunt"},{"w":"melt-up","z":"逼空式上涨","d":"缺乏基本面支撑的加速上涨，多由踏空资金追进推动","a":"","p":""},{"w":"overbought","z":"超买","d":"短期涨幅过大导致技术指标偏高，回调风险上升","a":"","p":",әuvә'bɔ:t"},{"w":"positioning","z":"仓位；持仓结构","d":"市场参与者的多空分布，常用来判断潜在的反向风险","a":"","p":"pә'ziʃәniŋ"},{"w":"relative strength index","z":"相对强弱指标","d":"衡量涨跌力度的震荡指标，常用超买超卖阈值判断","a":"RSI","p":""},{"w":"stop-loss order","z":"止损单","d":"价格触及设定水平就自动卖出的委托，用来控制单笔亏损","a":"","p":"stɔp lɔs ˈɔ:də"},{"w":"top-up placement","z":"先旧后新","d":"港股大股东先卖老股再认购新股的快速融资方式","a":"","p":""},{"w":"volume spike","z":"放量","d":"成交量显著高于近期均值，说明分歧或资金进出加剧","a":"","p":""}],"iw":[{"w":"regular","p":"'regjulә","t":"a. 规则的, 常例的, 有秩序的, 整齐的, 等边的, 定期的, 经常的, 合格的, 常备军的; n. 正规军, 正式队员; adv. 经常地; n. 正常体; 正常体"},{"w":"link","p":"liŋk","t":"n. 环, 连结物, 链接, 火把; vt. 连结, 联合, 挽住; vi. 连接起来; 连接, 链路"},{"w":"comment","p":"'kɒment","t":"n. 注解, 批评, 评论, 备注; vi. 评论, 注解; 备注"},{"w":"due","p":"dju:","t":"n. 应得的东西, 应付款; a. 到期的, 应得的, 应付的, 约定的"},{"w":"content","p":"kәn'tent","t":"n. 内容, 满足, 意义, 要旨; a. 满足的, 满意的; vt. 使...满足, 使...安心; 内容"},{"w":"conclusion","p":"kәn'klu:ʒәn","t":"n. 结论, 结尾, 推论; 缔结, 结论, 推论"},{"w":"chief","p":"tʃi:f","t":"n. 领袖, 酋长, 长官, 主要部分; a. 主要的, 首位的"},{"w":"deliver","p":"di'livә","t":"vt. 递送, 陈述, 释放, 发表, 引渡, 投递, 交付; 交运"},{"w":"observe","p":"әb'zә:v","t":"vt. 觉察到, 遵守, 注意到, 庆祝; vi. 注意, 评论"},{"w":"flight","p":"flait","t":"n. 飞行, 射程, 逃走, 飞跃, 飞机航程, 班机, 迁徙, 飞逝; vi. 迁徙; vt. 射击(飞禽), 为(箭)装上羽毛, 使惊飞"},{"w":"settle","p":"'setl","t":"n. 有背长椅; vt. 决定, 整理, 安放, 使定居, 使平静, 支付, 安排, 解决, 结算; vi. 停留, 下陷, 沉淀, 澄清, 安下心来, 结清, 定居, 安家"},{"w":"average","p":"'ævәridʒ","t":"n. 平均, 平均数, 一般水平, 海损; a. 平均的, 中等的, 平常的; vt. 算出...平均数, 平均做, 均分, 使平衡; vi. 平均为, 呈中间色"},{"w":"estate","p":"i'steit","t":"n. 不动产, (人生的)阶段, 阶层, 财产; 房地产, 遗产, 财产"},{"w":"propose","p":"prә'pәuz","t":"vt. 计划, 打算, 建议, 提议, 求(婚); vi. 打算, 求婚"},{"w":"additional","p":"ә'diʃәnәl","t":"a. 附加的, 另外的, 额外的; 加添的, 附加的"},{"w":"sample","p":"'sæmpl","t":"n. 样品, 范例, 样本; vt. 抽样, 尝试; 示例, 字样"},{"w":"contribute","p":"kәn'tribju:t","t":"vt. 有助于, 捐助, 投稿; vi. 出力, 捐献, 投稿"},{"w":"block","p":"blɒk","t":"n. 街区, 木块, 石块, 块; vt. 阻塞, 封锁, 使成块状; 块, 数据块"},{"w":"employer","p":"im'plɒiә","t":"n. 雇主, 老板; 雇主, 业主"},{"w":"debt","p":"det","t":"n. 债务, 罪过; 借款, 欠款, 债务"}],"doc":{"k":"内部合规邮件","en":"To: Trading Desk. Subject: 2318.HK short sale - borrow and execution parameters. All sales in this name must be flagged as designated short selling against a confirmed locate. Borrow secured across three lenders totals 1.10m shares at a weighted fee of 16.5% p.a.; none is term borrow, and recall may occur without notice. If a recall cannot be covered within the settlement cycle, the lender will execute a forced buy-in at our expense. Please build the position via TWAP over not fewer than eight sessions; do not hit the bid or lift the offer aggressively, and avoid trading into any volume spike. A stop-loss order is not to be left resting. Desk positioning limits apply; the margin account is under daily review while the shares sit at a 52-week high.","zh":"致：交易台。主题：2318.HK 卖空——借券与执行参数。本标的所有卖出必须标记为指定卖空，并以已确认的可借券为前提。目前从三家出借方合计取得 110 万股，加权费率年化 16.5%；其中没有一笔是锁定期借券，可能在不作通知的情况下被召回。若召回在交收周期内无法平补，出借方将实施强制买回，费用由我方承担。请通过时间加权均价分不少于八个交易日建仓；不得主动砸卖或主动扫货，并避免在任何放量时段交易。不得挂出未撤的止损单。交易台的仓位限额继续适用；在股价处于 52 周新高期间，保证金账户将按日复核。"}},{"i":16,"ti":"我们分了十一天建仓，尽量不惊动市场","dom":"trading","sc":"建仓与执行","tx":"Danny 把手机屏幕转过来给我看时才八点四十，离开盘还有二十分钟。三家券商凑出来的第一笔券已经躺在账上，量不大，但是真的。\n\n\"{{pre-market}}（盘前）已经有人在挂了，\"他说，\"昨天收盘价上面两个价位，全是买单。\"\n\n我没接话。接下来的事比借券难得多：把一笔相当于三天成交额的空头塞进市场，还不能让市场发现是我们在做。\n\nRay 只给了一句话的{{objective}}（目标）：十一个交易日，建满，不留痕迹。\n\nDanny 把执行方案摊在桌上。他用券商那套算法{{engine}}（执行引擎），按{{VWAP}}（成交量加权均价）拆单，每天只吃当日{{volume}}（成交量）的百分之八到十二。超过这个比例，盘口自己会说话。\n\n\"你看，\"他调出{{market depth}}（盘口深度）截图，\"卖五档加起来不到两百万港元。我一口气砸下去，价格自己就跌三个点，剩下九天全在更低的位置卖，均价被我自己打坏。\"\n\n这就是自己给自己制造{{injury}}（损伤）。我懂。\n\n所以他全程用{{iceberg order}}（冰山单），每次只露出两万股，成交一笔补一笔。别人看到的是一堆零散卖盘，看不出背后有统一的{{identity}}（身份）。\n\n第三天出了意外。股价没跌，反而放量往上走，一口气吃掉我标在四十二块八的{{resistance level}}（阻力位）。技术派管这个叫{{breakout}}（突破），论坛上一片欢腾。我盯着分时图，手心出汗。\n\n\"{{momentum}}（动量）资金进来了，\"Danny 说，\"还有内地的{{domestic}}（境内的）游资。A 股那个可比标的今天{{limit down}}（跌停），钱反倒跑到港股来接力。\"\n\n那天的{{AH premium}}（AH溢价）拉到两年最高。同一门生意，隔着一条深圳河的{{border}}（分界线），两边定价差六成，两边的人都觉得自己是对的。\n\nRay 中午过来站在我身后看了两分钟，走时拍了一下我的椅背。那是他表达{{confidence}}（信心）的方式：不解释，但不撤。\n\n我拉开{{cabinet}}（文件柜）最下面一格，把那张十九条疑点的清单又读了一遍。价格在涨，清单上没有一条因此改变。\n\n第五天，一家欧资券商的销售来敲门，是个{{French}}（法国人），带着刚发的一批{{covered warrant}}（窝轮）来{{promote}}（推销）：认购证，杠杆十五倍，专挂这只票。他说散户抢疯了。我把材料收下，等他走了才跟 Danny 说：这也算一个信号。\n\n第六到第八天，股价横住。先破{{support level}}（支撑位）再拉回去，假装要向上突破，然后掉头。Danny 说这叫{{whipsaw}}（来回震荡），多空两边都被打脸。他没给这笔仓位设{{trailing stop}}（移动止损）——空头设那玩意儿等于把退场时间交给运气。\n\n\"我们不做动量，\"他说，\"我们做的是{{commitment}}（承担的义务）。答应了要建满就得建满，涨着也得建。\"\n\n第九天，短期均线终于向下穿过长期均线，一个标准的{{death cross}}（死叉）。技术指标已接近{{oversold}}（超卖）区间——{{nevertheless}}（然而），这只票的基本面根本没被认真讨论过。所有人还在为产能扩张鼓掌。\n\n{{complex}}（复杂的）的从来不是这笔交易，是这家公司。\n\n我{{concentrate}}（专心）看了一整天逐笔成交，想找出对手盘是谁。买得最狠的几笔全走同一家托管行通道，节奏干净得不像散户。\n\n我们的仓位在第十一天下午三点五十四分建满。总{{entry}}（入场）成本比同期的成交量加权均价高了 0.3%，Danny 说这是他这辈子做得最漂亮的一单。\n\n我在纸上写了一行：{{bearish}}（看空）不是情绪，是一张能被{{demonstrate}}（证明）出来的资产负债表。\n\n那天晚上我把港股卖空申报的{{legislation}}（法规）又看了一遍，确认每笔都报对了。我不想在程序上出问题——真出事，第一个被翻的就是这些。\n\n真正让我睡不着的是：如果我们错了，最后不会是体面认输，而是{{forced liquidation}}（强平），券商替你决定什么时候退场；如果我们对了，市场要一直走到{{capitulation}}（投降式抛售）才算完，中间那段路比我想象的长。\n\n我需要的是{{faith}}（信心），{{plus}}（加上）一笔能撑到那一天的现金。\n\n第二天早上，开盘竞价，股价高开了 4%。","ft":[{"w":"AH premium","z":"AH溢价","d":"同一公司A股相对H股的价格溢价，反映两地资金差异","a":"","p":""},{"w":"VWAP","z":"成交量加权均价","d":"按成交量加权的平均成交价，常作为机构执行的考核基准","a":"VWAP","p":""},{"w":"bearish","z":"看空；偏空","d":"预期价格下跌，倾向于减仓或者建立空头头寸","a":"","p":"'bєәri:ʃ"},{"w":"breakout","z":"突破","d":"股价放量越过关键阻力位，常被视为趋势启动的信号","a":"","p":"'breikajt"},{"w":"capitulation","z":"恐慌割肉；投降式抛售","d":"投资者放弃抵抗集中抛售，往往对应阶段性底部","a":"","p":"kәpitju'leiʃәn"},{"w":"covered warrant","z":"窝轮；权证","d":"券商发行的杠杆凭证，港股散户常用来放大方向押注","a":"","p":""},{"w":"death cross","z":"死叉","d":"短期均线向下穿过长期均线，被视为偏空的技术信号","a":"","p":""},{"w":"forced liquidation","z":"强平；爆仓","d":"保证金不足时券商强制卖出持仓，往往加速价格下跌","a":"","p":""},{"w":"iceberg order","z":"冰山单","d":"只显示小部分数量的大额委托，避免暴露真实买卖意图","a":"","p":""},{"w":"limit down","z":"跌停","d":"触及单日最大跌幅，卖单大量堆积但很难成交","a":"","p":""},{"w":"market depth","z":"盘口深度","d":"各价位挂单量的厚薄，决定大单能否不推动价格就成交","a":"","p":""},{"w":"momentum","z":"动量","d":"价格延续原有方向的倾向，也指追涨杀跌的策略","a":"","p":"mәu'mentәm"},{"w":"oversold","z":"超卖","d":"短期跌幅过大指标处于低位，容易出现技术性反弹","a":"","p":"'әuvә'sәuld"},{"w":"pre-market","z":"盘前","d":"正式开盘前的交易或竞价时段，常反映隔夜消息的影响","a":"","p":""},{"w":"resistance level","z":"阻力位","d":"价格多次受阻回落的价位，上方套牢盘相对较多","a":"","p":""},{"w":"support level","z":"支撑位","d":"价格多次止跌企稳的价位，买盘在此相对集中","a":"","p":""},{"w":"trailing stop","z":"移动止损","d":"止损价随股价上涨自动上移，锁定已有浮盈","a":"","p":""},{"w":"whipsaw","z":"反复打脸；来回震荡","d":"价格先破位再反向走，让追单的多空双方都被止损","a":"","p":"'(h)wipsɔ:"}],"iw":[{"w":"identity","p":"ai'dentiti","t":"n. 身份, 相同, 一致, 特性, 恒等式; (打)标记, 标识"},{"w":"objective","p":"әb'dʒektiv","t":"n. 目的, 目标, 宗旨, 宾格, 实物; a. 客观的, 如实的, 无偏见的, 宾格的"},{"w":"faith","p":"feiθ","t":"n. 信心, 信任, 忠实, 保证; 信任, 信仰, 信念"},{"w":"promote","p":"prәu'mәut","t":"vt. 促进, 晋升, 创办, 推销; 促进, 推广, 推销"},{"w":"injury","p":"'indʒәri","t":"n. 伤害, 侮辱; 伤, 损伤"},{"w":"nevertheless","p":".nevәðә'les","t":"adv. 然而, 虽然如此; conj. 然而"},{"w":"complex","p":"kәm'pleks","t":"n. 综合体, 情结, 络合物; a. 复杂的, 组合的"},{"w":"concentrate","p":"'kɒnsәntreit","t":"n. 浓缩, 精选; v. 集中, 专心"},{"w":"confidence","p":"'kɒnfidәns","t":"n. 信心; 可靠"},{"w":"border","p":"'bɒ:dә","t":"n. 边缘, 边境, 边界, 花坛; vt. 在...上镶边, 接近; vi. 接界, 近似; 边框"},{"w":"commitment","p":"kә'mitmәnt","t":"n. 委托, 交押, 承担义务, 赞助; 院禁"},{"w":"plus","p":"plʌs","t":"prep. 加上, 加, 外加; a. 正的, 附加的; n. 正号, 加号, 附加额, 正数, 增益; 正差"},{"w":"volume","p":"'vɒljum","t":"n. 册, 卷, 体积, 容量, 大量, 许多, 份量, 音量; vi. 成团卷起; vt. 把...收集成卷; a. 大量的; 卷"},{"w":"French","p":"frentʃ","t":"n. 法国人, 法文, 法式; a. 法国的, 法国人的, 法语的"},{"w":"legislation","p":".ledʒis'leiʃәn","t":"n. 立法, 法律; 立法, 法规"},{"w":"entry","p":"'entri","t":"n. 登录, 条目, 进入, 入口, 报关; 登录项, 输入项, 条目"},{"w":"engine","p":"'endʒin","t":"n. 引擎, 发动机, 机车; vt. 安装发动机于"},{"w":"cabinet","p":"'kæbinit","t":"n. 橱柜, 内阁; a. 内阁的, 细木工做的; 机柜"},{"w":"demonstrate","p":"'demәnstreit","t":"vt. 示范, 证明; vi. 示威"},{"w":"domestic","p":"dәu'mestik","t":"a. 家庭的, 国内的, 驯养的; 家庭的, 家用的"}],"doc":{"k":"卖方研报摘要","en":"Trading Desk Note - Orient Kinetic Materials (2318.HK). We maintain our Buy rating and raise our target price to HK$56.00. The shares completed a clean breakout above the HK$42.80 resistance level on above-average volume, with the nearest support level now at HK$40.50. Market depth remains thin at the touch, and we would advise institutional clients to work orders against VWAP or through iceberg order execution in order to contain slippage. Our structured products desk has launched a new series of covered warrant on the name for retail accounts. Risks to our view: the AH premium is at a two-year high, momentum indicators would approach oversold territory on any pullback, and a death cross on the weekly chart would turn the technical picture bearish.","zh":"交易台笔记——东亚新能源材料（2318.HK）。我们维持买入评级，并将目标价上调至 56.00 港元。该股放量向上突破 42.80 港元的阻力位，形态干净，最近的支撑位现位于 40.50 港元。买卖一档的盘口深度依然偏薄，我们建议机构客户以成交量加权均价为基准执行，或采用冰山单方式下单，以控制滑点。我们的结构性产品部已就该标的向零售客户发行了一批新的窝轮。观点风险：AH 溢价处于两年高位；一旦回调，动量指标将接近超卖区间；周线若出现死叉，技术面将转为看空。"}},{"i":17,"ti":"股价又涨了 18%，风控给我们发了第一封邮件","dom":"trading","sc":"保证金与风控","tx":"邮件标题只有一行：\"Position Review — 2318.HK\"，收件人 Ray，抄送合规，没抄送我。是 Danny 转给我的。\n\n写邮件的是风控部的 Cindy，公司里少数几个敢跟 Ray 顶回去的{{female}}（女性）。她只列了三行数字：这只票十四个交易日涨 18%，空头浮亏吃掉基金 1.9% 的净值，单一标的敞口已到{{internal}}（内部的）限额的八成。\n\n最后一句是：请说明持仓逻辑是否发生变化。\n\n逻辑没变，变的是价格。可这两件事在风控的表格里长得一模一样。\n\n我下楼买咖啡。中环这条街整个夏天都在{{construction}}（施工），棚架从八楼搭到地面。Danny 跟出来，他是土生土长的香港{{native}}（本地人），能从棚架缝里抄近路。\n\n\"最难受的不是亏钱，\"他说，\"是亏钱的方式。\"\n\n这就是{{pain trade}}（痛苦交易）——让持仓最多的人最难受的方向。市场总能找到它。\n\n涨的原因不是业绩，是{{index inclusion}}（纳入指数）。上周公告这只票要进中盘指数，被动资金到日子必须买，那一{{wave}}（波）买盘不看估值。跟着来的还有{{Northbound flows}}（北向资金）：它在 A 股有个兄弟公司，两边一起炒。\n\n还有 ETF 在做{{creation and redemption}}（申购赎回），场内价格贴着净值上方跑，{{premium/discount to NAV}}（折溢价）翻正到 1.4%，套利盘一边申购一边卖，又给现货添一层买盘。\n\nDanny 说，散户在{{chase the rally}}（追高）。\n\n我更在意另一批钱。把逐笔成交切开看，每天两点半以后总有几笔很安静的买单，不急不抢，永远挂{{limit order}}（限价单），从不主动吃{{bid-ask spread}}（买卖价差）。这是标准的{{accumulation}}（吸筹）：有人在慢慢收，不想被看见。\n\n当然也可能反过来——有人在高位悄悄{{distribution}}（派发）。同一张盘口，两种解读。\n\n\"技术上讲，\"Danny 摊手，\"你现在需要一个{{gap down}}（跳空低开）。\"\n\n我说我不需要技术，我需要{{intelligence}}（情报）。\n\n我又给那三家电池厂打电话，这次不问出货，只问{{sell-through}}（终端动销）——真正卖到下游手里的量。两家愿意讲，加起来不到公司口径的四成。\n\n回办公室路上，一个财经媒体的{{editor}}（编辑）打来，说听说 Zenith 在做空这只票，想{{engage}}（约）我聊聊。我说没这回事，挂掉。消息已经在走，我不知道从哪走的。\n\nRay 把我叫进办公室。他今天罕见地穿了{{suit}}（西装），下午要见 LP。\n\n\"Cindy 的邮件我回了，\"他说，\"我{{grant}}（给）我们自己两周。要么给我新证据，要么减一半。\"\n\n他对回撤的态度接近某种{{religion}}（信仰）：可以错，但不能失控。\n\n我问他，怕不怕股价一路涨到{{suspension}}（停牌）。一停牌就平不掉仓，浮亏冻在那里，一天一天算利息。\n\n\"那是{{regulation}}（监管）的事，\"他说，\"我们只管能控制的。\"\n\n我们能控制的只有两件：仓位，和{{market impact}}（冲击成本）。要加仓就得多卖，卖得多就推价格，建仓期间推价格反而让均价变差。\n\n那天下午我做了一张最{{ordinary}}（普通的）不过的图：股价叠 60 日{{moving average}}（均线），下面画每天的{{turnover}}（成交额）。是个很像样的向上突破，但每根阳线的量都在递减。\n\n我把图发给 Ray，附了一句：我认为这是一个{{bull trap}}（多头陷阱）。\n\n他回了两个字：继续。\n\n那不算{{relief}}（安慰），但够了。市场还很热，一点{{risk-off}}（避险）的意思都没有，所有人都信自己能踩准点，包括群里那个刚入行三个月、天天喊单的{{youth}}（年轻人）。\n\n我{{acquire}}（拿到）了别人没有的东西：那两家电池厂的动销数字。接下来要把它变成一份无法反驳的{{technical}}（专业的）证据。\n\n从我的{{perspective}}（视角）看，它每涨一次，都是在把后面的下跌挖深一层。\n\n我在笔记本上新开了一个{{category}}（类别），标题三个字：证据链。\n\n我们已经{{commit}}（投入）了基金 4.2% 的净值，这不是能悄悄退回去的动作。\n\n第二周周二早上，Danny 站在我桌前，脸色不对。他说：公司出公告了。","ft":[{"w":"Northbound flows","z":"北向资金；外资","d":"境外投资者经沪深股通买卖A股的资金流向","a":"","p":""},{"w":"accumulation","z":"吸筹；低位建仓","d":"资金在低位分批买入而尽量不推高价格的过程","a":"","p":"ә.kju:mju'leiʃәn"},{"w":"bid-ask spread","z":"买卖价差","d":"最高买价与最低卖价之差，价差越窄流动性越好","a":"","p":""},{"w":"bull trap","z":"多头陷阱","d":"假突破诱多之后快速回落，追进的资金被直接套住","a":"","p":""},{"w":"chase the rally","z":"追高","d":"在股价已经大涨之后追进，成本高且容易接最后一棒","a":"","p":""},{"w":"creation and redemption","z":"申购赎回","d":"ETF份额通过一篮子股票换入换出的机制","a":"","p":""},{"w":"distribution","z":"派发；出货","d":"主力资金借高位或利好分批卖出手中的筹码","a":"","p":".distrә'bju:ʃәn"},{"w":"gap down","z":"跳空低开","d":"开盘价明显低于昨日收盘，通常源于隔夜的利空消息","a":"","p":""},{"w":"index inclusion","z":"纳入指数","d":"个股被指数选为成分股，带来被动资金的一次性买入","a":"","p":""},{"w":"limit order","z":"限价单","d":"指定价格上下限的委托，价格优先但可能一直不成交","a":"","p":""},{"w":"market impact","z":"冲击成本","d":"自己的委托把价格推离原有水平所造成的隐性成本","a":"","p":""},{"w":"moving average","z":"均线","d":"一段时间收盘价的平均值，用来平滑价格判断趋势","a":"MA","p":""},{"w":"pain trade","z":"痛苦交易","d":"让多数持仓者最难受的方向，往往是阻力最小的方向","a":"","p":""},{"w":"premium/discount to NAV","z":"折溢价","d":"ETF或封闭式基金价格与净值的偏离，反映场内供需","a":"","p":""},{"w":"risk-off","z":"避险","d":"资金撤出风险资产，转向现金和防御性板块","a":"","p":""},{"w":"suspension","z":"停牌","d":"股票长时间暂停买卖，多因重大事项或信息披露问题","a":"","p":"sә'spenʃәn"},{"w":"turnover","z":"成交额；成交量","d":"一段时间内的成交金额或成交股数，反映活跃程度","a":"","p":"'tә:n.әuvә"},{"w":"sell-through","z":"终端动销；实际销售","d":"经销商真正卖给终端客户的量，与向渠道压货的出货量不同","a":"","p":"sel θru:"}],"iw":[{"w":"religion","p":"ri'lidʒәn","t":"n. 宗教, 信仰; 宗教, 宗教信仰, 信仰"},{"w":"editor","p":"'editә","t":"n. 编者, 编辑, 主笔, 编辑器, 编辑装置; 编辑器"},{"w":"engage","p":"in'geidʒ","t":"vi. 答应, 从事, 交战; vt. 使忙碌, 雇佣, 预定, 使从事于, 使参加"},{"w":"ordinary","p":"'ɒ:dinәri","t":"a. 平常的, 普通的, 平凡的; n. 平常的人(或事)"},{"w":"relief","p":"ri'li:f","t":"n. 减轻, 解除, 救济, 安慰, 调剂, 浮雕, 换班, (地势的)起伏; 缓减, 减轻, 浮雕(绘画中)"},{"w":"commit","p":"kә'mit","t":"vt. 委托(托付), 犯罪, 指派...作战, 使承担义务; 犯, 做, 把...交托给"},{"w":"technical","p":"'teknikl","t":"a. 技术上的, 专门的, 工业的, 严格根据法律的; 技巧"},{"w":"grant","p":"grænt","t":"n. 授予, 授予物, 允许; vt. 允许, 承认, 授与; 授权命令"},{"w":"female","p":"'fi:meil","t":"n. 女性, 女人, 雌性动物; a. 女性的, 女子的"},{"w":"youth","p":"ju:θ","t":"n. 年轻, 青年时代, 青年们, 青春; 青年, 青年时期, 青春时期"},{"w":"wave","p":"weiv","t":"n. 波, 波浪, 波动, 起伏, 高潮, 潮涌, 挥手致意, (气压)突变; vi. 波动, 飘动, 挥手示意, 起伏; vt. 使波动, 使飘扬, 挥舞, 使成波浪形"},{"w":"regulation","p":".regju'leiʃәn","t":"n. 规则, 管理, 调整; 调整; 规章; 规则; 调节"},{"w":"native","p":"'neitiv","t":"n. 本地人, 土产, 当地人; a. 本国的, 与生俱来的, 自然的"},{"w":"acquire","p":"ә'kwaiә","t":"vt. 获得, 学到; 目标锁定"},{"w":"suit","p":"sju:t. su:t","t":"n. 套装, 诉讼, 请求, 起诉, 套, 组; vt. 适合, 使适应; vi. 合适, 相称"},{"w":"perspective","p":"pә'spektiv","t":"n. 远景, 透视感, (观察问题的)视角, 透视法, 看法, 透视图; a. 透视的, 透视法的; 透视"},{"w":"construction","p":"kәn'strʌkʃәn","t":"n. 建筑, 构造, 建筑物; 施工"},{"w":"intelligence","p":"in'telidʒәns","t":"n. 智力, 情报, 信息; 智力"},{"w":"internal","p":"in'tә:nәl","t":"a. 内在的, 国内的; 内的, 内部的"},{"w":"category","p":"'kætigәri","t":"n. 种类, 类项; 分类"}],"doc":{"k":"内部合规邮件","en":"To: Portfolio Management. Cc: Compliance. Subject: Position Review - 2318.HK. The short position has moved 18% against the Fund over fourteen sessions and now stands at 80% of the internal single-name limit. Risk identifies three drivers: index inclusion effective this month, sustained Northbound flows into the listed A-share peer, and ETF creation and redemption activity that has pushed the premium/discount to NAV to plus 1.4%. Daily turnover has doubled, yet the bid-ask spread has widened at the touch, and we estimate market impact on a full unwind at 60 to 90 basis points. Please confirm in writing whether the investment thesis has changed, and address the risk of a trading suspension, under which the position could not be covered. - Risk Management","zh":"致：投资部。抄送：合规部。主题：持仓复核——2318.HK。该空头头寸在十四个交易日内已反向波动 18%，目前占用内部单一标的限额的八成。风控部认为有三个驱动因素：本月生效的纳入指数、持续流入其 A 股关联标的的北向资金，以及 ETF 的申购赎回活动——后者已将折溢价推高至正 1.4%。日成交额翻了一倍，但买卖价差在一档上反而走阔，我们估计全部平仓的冲击成本在 60 至 90 个基点。请以书面形式确认投资逻辑是否发生变化，并就停牌风险作出说明：一旦停牌，该头寸将无法平仓。——风险管理部"}},{"i":18,"ti":"那一周我每天醒来第一件事是看隔夜价格","dom":"trading","sc":"波动率与回撤","tx":"公告是{{after-hours}}（盘后）发的，香港时间晚上七点零四分。\n\n我正在洗碗，手机在流理台上震了一下。标题很长，我只记住三个数字：全年指引再上调 20%，二季度收入同比增长 96%，毛利率 38.7%。\n\n我擦干手，把 PDF 翻到尾。第 14 页附注有一行小字：本期{{selling, general and administrative expenses}}（销售及管理费用）同比增长 9%。\n\n收入涨 96%，把东西卖出去的费用只涨 9%。而指引调得这么高，经营现金流依然是{{negative}}（负的）。\n\n我把这行截图，存进那个已经有一百多张图的文件夹，然后再也睡不着了。\n\n那一周过得像{{hell}}（地狱）。我每天醒来的第一件事不是刷牙，是摸手机看隔夜价格。\n\n周一{{gap up}}（跳空高开）7%。A 股那个兄弟公司直接{{limit up}}（涨停），封单排到收盘。港股这边开盘二十分钟后走了一笔{{block trade}}（大宗交易），四千八百万港元，折价两个点。谁会在这个位置折价卖？我把它记在那张{{sheet}}（工作表）上。\n\n周二冲高回落，整个{{session}}（交易时段）都很{{choppy}}（震荡）。Danny 说这种日子最磨人：拿不到趋势，却扛着全部风险。卖方一片{{bullish}}（看多），十一家覆盖里又有两家上调目标价。\n\n周三是{{index rebalancing}}（指数调整）生效日。被动资金必须在收盘那一秒买进去，收盘价被硬抬高 3.4%，{{turnover ratio}}（换手率）冲到 11%。那不是有人看好，那是规则。\n\n周四终于跌了 5%，Danny 说是{{profit taking}}（获利了结盘），前面追进去的资金开始{{take profit}}（止盈）。那几天整个市场都是{{risk-on}}（风险偏好上升），题材股一起飞，没人想听基本面。\n\n周五{{Southbound flows}}（南向资金）净买入创了这只票的纪录。内地的钱正在过来接盘。\n\n我们的浮亏最深时到了净值的 2.6%。\n\nRay 在群里发了一句：{{cut losses}}（止损离场）是纪律，扛不住的仓位不叫信心。然后他补了第二句：但这一笔我不减。\n\n那几天我反复看一件事：价格和量能的{{divergence}}（背离）。股价一根比一根高，可阳线背后的成交量在缩，指标高点在往下走。价格说牛，量能说不。这种{{contrast}}（对比）我以前只在教科书上见过。\n\nDanny 做了件很笨的事。他挂了一手{{odd lot}}（碎股），只有 43 股，看{{market maker}}（做市商）怎么报价。结果是{{partial fill}}（部分成交）——成交 12 股，剩下的挂了一整天没动，报价比正股差了将近一个点。\n\n\"盘口是假的，\"他说，\"上面热闹，下面根本没有承接。\"\n\n我把那一周每天的收益率画成一张图看{{distribution}}（分布）：尾巴又肥又长，两边都是。波动率不再是一个{{academic}}（学术的）概念，它变成了我每天早上心跳的速度。\n\n周末我一个人回了趟公司，办公室的灯只开了一半。\n\n我重新打开最初那份调研笔记。第一条写着：我第一次听到这家公司，是在东莞一个行业{{exhibition}}（展览会）上，对方销售报了一个让我当场愣住的产能数字。\n\n我又调出江西基地的卫星底图，确认那个{{location}}（位置）：一片厂区，三条产线，其中一条从来没开过。\n\n公告里对那条产线的{{description}}（描述）是\"已进入量产爬坡阶段\"。上个月他们还{{launch}}（发布）了新的高镍产品系列，配了一场两小时直播。\n\n外表的{{appearance}}（外观）一直在{{improvement}}（改善），这我认。\n\n但改善是有代价的。产能真翻倍，银行的{{loan}}（贷款）该同步上升，用电量该上升，招工人数该上升。这三样，一样都没有。\n\n我把这三条和之前的十九条{{combine}}（合并）在一起，重新编了{{code}}（编号），一共二十四条。\n\n第 24 条我是这样写的：所有解释单独看都成立，合起来就不成立了。\n\n做空需要的不是聪明，是{{discipline}}（纪律）：每天开盘前把清单再读一遍，{{remind}}（提醒）自己你做空的是什么，而不是一个价格。\n\n我要{{retain}}（保留）的就是这个：无论股价涨到哪里，那三条产线的{{existence}}（存在）状态都不会改变。\n\n周一开盘前，Danny 发消息给我：Ray 一早就把自己关进会议室，说要写月报。\n\n他说光是第一段，Ray 已经改了七遍。","ft":[{"w":"Southbound flows","z":"南向资金","d":"内地投资者经港股通买卖港股的资金流向","a":"","p":""},{"w":"after-hours","z":"盘后","d":"收盘后的交易时段，业绩公布常在此时引发大幅波动","a":"","p":"'ɑ:ftər'aʊəz"},{"w":"block trade","z":"大宗交易","d":"盘后按协议价成交的大额股份转让，通常带一定折价","a":"","p":""},{"w":"bullish","z":"看多；偏多","d":"预期价格上涨并据此建立或加大多头仓位","a":"","p":"'buliʃ"},{"w":"choppy","z":"震荡；磨人","d":"没有明确方向的反复上下波动，趋势交易者容易亏损","a":"","p":"'tʃɒpi"},{"w":"cut losses","z":"割肉；止损离场","d":"认亏卖出持仓，以避免亏损继续扩大","a":"","p":""},{"w":"divergence","z":"背离","d":"价格创新高但技术指标没有同步，提示动能正在减弱","a":"","p":"dai'vә:dʒәns"},{"w":"gap up","z":"跳空高开","d":"开盘价明显高于昨日收盘，中间价位没有发生成交","a":"","p":""},{"w":"index rebalancing","z":"指数调整；指数换仓","d":"指数定期调整成分股和权重，引发被动资金买卖","a":"","p":""},{"w":"limit up","z":"涨停","d":"触及交易所规定的单日最大涨幅，价格不再继续上行","a":"","p":""},{"w":"market maker","z":"做市商","d":"持续提供双边报价并承担库存风险的交易商","a":"","p":""},{"w":"odd lot","z":"零股；碎股","d":"不足一个交易单位的股份，港股碎股通常只能折价卖出","a":"","p":""},{"w":"partial fill","z":"部分成交","d":"委托只成交了一部分，剩余数量继续挂在盘口等待","a":"","p":""},{"w":"profit taking","z":"获利了结盘","d":"前期获利资金集中卖出，造成上涨之后的短线回落","a":"","p":""},{"w":"risk-on","z":"风险偏好上升","d":"资金流向高波动资产，成长股和小盘股相对跑赢","a":"","p":""},{"w":"take profit","z":"止盈","d":"在达到目标价位时卖出，把浮盈锁定为实际收益","a":"","p":""},{"w":"turnover ratio","z":"换手率","d":"成交股数占流通股本的比例，衡量筹码交换的频繁程度","a":"","p":""},{"w":"selling, general and administrative expenses","z":"销售及管理费用","d":"把销售费用和管理费用合并列示的英美口径科目","a":"SG&A","p":""}],"iw":[{"w":"exhibition","p":".eksi'biʃәn","t":"n. 表现, 展览会, 展览品; 投药, 展览, 展出"},{"w":"launch","p":"lɒ:ntʃ","t":"n. 下水, 汽艇, 发射; vt. 使下水, 发射, 发动; vi. 起飞, 下水, 投入, 开始"},{"w":"sheet","p":"ʃi:t","t":"n. 床单, 张, 纸张, 印刷品, 裹尸布, 薄片; vt. 盖上被单, 遍布; vi. 大片落下; a. 片状的, 成薄片的; 工作表"},{"w":"location","p":"lәu'keiʃәn","t":"n. 位置, 场所, 特定区域; 位置"},{"w":"appearance","p":"ә'piәrәns","t":"n. 出现, 露面, 外观, 外表, 出版; 外观, 版面"},{"w":"improvement","p":"im'pru:vmәnt","t":"n. 进步, 改善, 利用; 改善, 好转, 进步"},{"w":"description","p":"di'skripʃәn","t":"n. 描述, 说明, 种类; 说明书(物品), 品名种类, 货物名称"},{"w":"session","p":"'seʃәn","t":"n. 期间, 开庭期, 会议, 学期; 会话, 对话, 会晤, 通用任务程序"},{"w":"combine","p":"kәm'bain","t":"v. (使)联合, (使)结合; n. (企业的)联合, 联合收割机"},{"w":"discipline","p":"'disiplin","t":"n. 训练, 纪律; vt. 训练, 惩罚"},{"w":"contrast","p":"kәn'træst","t":"n. 差别, 对比, 对照物; vt. 使对比; vi. 成对照; 反差; 对比度"},{"w":"existence","p":"ig'zistәns","t":"n. 存在, 生存; 存在, 存在状态, 实体"},{"w":"distribution","p":".distrә'bju:ʃәn","t":"n. 分配; 分布"},{"w":"hell","p":"hel","t":"n. 地狱, 邪恶势力, 苦境, 阴间, 毁坏, 训斥; vi. 狂饮, 飞驰"},{"w":"remind","p":"ri'maind","t":"vt. 提醒, 使想起"},{"w":"retain","p":"ri'tein","t":"vt. 保持, 保有, 留住, 记得, 付定金聘请; 保留, 留存"},{"w":"academic","p":".ækә'demik","t":"a. 学院的, 学术的, 不切实际的; n. 大学生, 大学教师, 学者, 学会会员"},{"w":"loan","p":"lәun","t":"n. 贷款, 借出; v. 借, 供应货款, 借给"},{"w":"code","p":"kәud","t":"n. 代码, 密码, 法规, 法典; vt. 把...编码; 代码"},{"w":"negative","p":"'negәtiv","t":"n. 否定, 否定语, 负数, 底片; a. 否定的, 消极的, 负的, 阴性的; n. 负数, 负值; 负数, 负值"}],"doc":{"k":"业绩电话会问答片段","en":"Analyst: Thank you for taking my question. Two items. First, your top line grew 96% year on year, yet selling, general and administrative expenses rose only 9%. Could you walk us through that gap? Second, the results were released after-hours, and the following morning we observed a large block trade at a two percent discount. Was the company aware of it in advance?\nCFO (Ms. Sze): On the first point, we have combined our regional sales offices, so the operating leverage is genuine and repeatable. On the second, we do not comment on any block trade. Index rebalancing that week produced an unusually high turnover ratio, and Southbound flows were also a factor. We remain bullish on full-year delivery.","zh":"分析师：谢谢给我提问的机会。两个问题。第一，你们的收入端同比增长了 96%，而销售及管理费用只增长了 9%，能否解释一下这个差距？第二，业绩是在盘后发布的，第二天早上我们观察到一笔折价两个百分点的大宗交易，公司事先知情吗？\n首席财务官（施女士）：关于第一点，我们合并了各区域销售办公室，因此这种经营杠杆是真实且可持续的。关于第二点，我们不对任何大宗交易置评。那一周的指数调整带来了异常高的换手率，南向资金也是一个因素。我们对全年的交付量仍然看多。"}},{"i":19,"ti":"月度报告要发给 LP 了，Ray 在措辞上纠结了一个下午","dom":"fund","sc":"基金运作","tx":"Ray 在会议室坐了一下午，面前只有一段话，一百四十个词。\n\n那是月度信的第三段，要写这个月最大的一笔新仓。写多了等于摊牌；写少了，LP 会问：你们把我 4.2% 的钱放进了一个不肯说名字的东西？\n\n第一版的开头软得像一封道歉信。\n\n\"这不是一笔试探，\"他自己先否掉，\"这是{{high conviction}}（重仓想法）。\"\n\n我说那就写清楚。他摇头：\"写清楚，两周内全市场都知道我们在做空谁。\"\n\n这是每封 LP 信的两难：你得让人相信你有{{edge}}（认知优势），又不能把优势本身送出去。\n\n我们的 LP 由三类人{{consist}}（组成）。一是{{fund of funds}}（母基金），专业的{{allocator}}（配置方），会把我们的{{sharpe ratio}}（夏普比率）跟另外二十家摆一张表上比。二是欧美的{{pension}}（养老金），钱最慢也最{{Conservative}}（保守的），一旦进来就是{{sticky capital}}（长期资金）。三是几个家族办公室，最{{familiar}}（熟悉）我们，也最容易被一句话吓到。\n\n架构是标准的{{master-feeder structure}}（主从基金结构）：开曼两只喂养基金把钱汇进主基金，统一下单记账。\n\nRay 的{{track record}}（历史业绩）有十一年，是他最硬的{{asset}}（资产）。可{{historical}}（历史的）业绩在这行的保质期只有三年。\n\n上个月我们还是{{net inflows}}（净流入）。他不想让下个月变成{{redemption pressure}}（赎回压力）。\n\n第四版他把所有 \"we believe\" 删了。Ray 的{{writing}}（写作）习惯是先写结论再删形容词。第五版加了一句{{leverage}}（杠杆）说明：总敞口是净值的 1.6 倍，这个数字要主动写，不能等人问。\n\n第六版他动了{{capacity}}（策略容量）那段。去年一家配置方尽调时问：你们这策略最多能装多少钱。Ray 说\"比现在管的多不了太多\"。对方的{{representative}}（代表）愣了两秒。后来那笔钱进来了——诚实有时候比{{pitch book}}（推介材料）管用。\n\n我{{participate}}（参与）的部分是脚注：用最{{formal}}（正式的）英文把三条{{finding}}（发现）压成两句话，不点名，不给证据，只给方向——应收账款、存货、现金的可用性。写的时候我手心是凉的。\n\n他犹豫要不要写产地：写了{{eastern}}（东部的）中国，范围就从六家缩到三家。最后没写。\n\n我顺手核了遍它的权益。{{share capital}}（股本）几乎没动，但{{share premium}}（股本溢价）两年增加 39 亿港元——一直在增发。{{share-based compensation}}（股权激励费用）一年 4.7 亿，全额计费用，不流出现金，正好把利润表做难看一点，显得保守。而{{shareholders' equity}}（股东权益）看着很厚，厚在一笔谁也说不清的应收账款上。\n\n账面上很厚，能拿出来用的很薄。\n\nRay 站起来倒水，忽然说：投资不是{{democracy}}（民主）。不能因为十个人说不就改判断，也不能因为十个人说是就以为自己对。\n\n我说，那 LP 呢。\n\n\"LP 买的就是我的{{conviction}}（确信度），\"他说，\"我要是每个月换一种说法，他们买的就是空气。\"\n\n九点半定稿。他在最后加了一句：本月表现主要来自这笔浮亏，管理人已与风控完成复核。\n\n我说，这句会让人紧张。\n\n\"会，\"他说，\"但不写才是问题。\"\n\n我们这行的{{circle}}（圈子）很小，一句话传三次就变形。\n\n按下发送前我最后{{assess}}（评估）了一遍：如果这封信明天到了记者手里，哪句会被拿去当标题？我觉得是那句\"a Hong Kong-listed cathode materials producer\"——全市场符合的不超过六家。\n\nDanny 在楼下等我，问要是这单错了怎么办。\n\n我说，那大概去{{grab}}（抢）一个卖方的位置，或者直接{{unemployment}}（失业）。\n\n他笑了，说别怕，你还能去那家{{factory}}（工厂）当质检。\n\n我没笑。Ray 改了一下午的其实不是措辞，是他自己的退路。每个基金经理写月报时都带一点{{actor}}（演员）成分——不是撒谎，是必须在还不确定时先把语气定下来。\n\n信发出去第二天早上，我打开一个空白文档。标题栏敲了六个字，删掉，又敲一遍。\n\n最后留下的是：Short Report — Draft 1。","ft":[{"w":"allocator","z":"配置方；出资机构","d":"决定把钱分给哪些管理人的机构，如养老金和母基金","a":"","p":"'ælәkeitә"},{"w":"capacity","z":"容量；策略容量","d":"策略在不明显损耗收益的前提下能装下的最大资金量","a":"","p":"kә'pæsiti"},{"w":"conviction","z":"信心；确信度","d":"对一个投资逻辑有多信，直接决定敢下多重的仓位","a":"","p":"kәn'vikʃәn"},{"w":"edge","z":"认知优势；超额认知","d":"比市场多知道或想得更对的地方，是赚钱的根本来源","a":"","p":"edʒ"},{"w":"fund of funds","z":"母基金；FOF","d":"不直接买股票，而是挑选并配置一篮子基金的产品","a":"FoF","p":""},{"w":"high conviction","z":"重仓；高确信度","d":"最有把握的想法，通常给到组合里最大的仓位权重","a":"","p":""},{"w":"leverage","z":"杠杆","d":"借钱放大仓位，放大收益的同时也同比放大回撤","a":"","p":"'levәridʒ"},{"w":"master-feeder structure","z":"主从基金结构","d":"多只喂养基金把钱汇到一只主基金统一投资的架构","a":"","p":""},{"w":"net inflows","z":"净申购；净流入","d":"申购减去赎回后的净额，直接反映投资人的态度","a":"","p":""},{"w":"pitch book","z":"推介材料","d":"介绍团队、策略和历史业绩的一整套材料，路演时用","a":"","p":""},{"w":"redemption pressure","z":"赎回压力","d":"投资人集中要钱，逼得基金不得不卖出好票来换现金","a":"","p":""},{"w":"sharpe ratio","z":"夏普比率","d":"每承担一单位波动换来多少超额收益，越高性价比越好","a":"","p":""},{"w":"sticky capital","z":"长期资金；稳定资金","d":"不会被短期波动吓跑的钱，是基金活得久的关键","a":"","p":""},{"w":"track record","z":"历史业绩","d":"过往的业绩记录，没有三年以上很难拿到机构的钱","a":"","p":""},{"w":"share capital","z":"股本","d":"按面值计量的已发行股份金额，与资本公积分开列示","a":"","p":""},{"w":"share premium","z":"股本溢价；资本公积","d":"发行价高于面值的部分，港股称股份溢价，美股称额外实收资本","a":"APIC","p":""},{"w":"share-based compensation","z":"股权激励费用","d":"按授予日公允价值在等待期内分摊的费用，不产生现金流出","a":"SBC","p":""},{"w":"shareholders' equity","z":"股东权益；净资产","d":"总资产减总负债后归属股东的余额，即账面净资产","a":"","p":""}],"iw":[{"w":"representative","p":".repri'zentәtiv","t":"n. 代表, 众议员, 典型; a. 描写的, 表现的, 代理的, 代表的, 代议制的, 典型的"},{"w":"historical","p":"hi'stɒrikәl","t":"a. 历史的, 史实的, 历史上的; 历史性的"},{"w":"finding","p":"'faindiŋ","t":"n. 发现, 发现物, 决定, 裁决; 调查结果, 对事实的认定, 判定的要素"},{"w":"grab","p":"græb","t":"n. 抓握, 掠夺, 强占, 东方沿岸帆船; vi. 抓取, 抢去; vt. 攫取, 捕获, 霸占"},{"w":"formal","p":"'fɒ:mәl","t":"a. 正式的, 形式的, 礼仪的, 拘于礼节的, 拘谨的; n. 正式的社交活动"},{"w":"participate","p":"pɑ:'tisipeit","t":"vi. 参加, 分享, 参与, 带有; vt. 分享, 分担"},{"w":"writing","p":"'raitiŋ","t":"n. 书写, 著作, 笔迹, 作品; 书写"},{"w":"assess","p":"ә'ses","t":"vt. 估定, 对...征税, 评定; 估计, 估价, 确定(税款罚款等)的金额"},{"w":"pension","p":"'penʃәn","t":"n. 养老金, 退休金, 津贴, 年金, 抚恤金, 膳宿学校, 膳宿费; vt. 发给退休金, 用津贴拉拢"},{"w":"familiar","p":"fә'miljә","t":"a. 熟悉的, 常见的, 亲密的; n. 熟友, 常客"},{"w":"consist","p":"kәn'sist","t":"vi. 组成, 存在于, 一致"},{"w":"unemployment","p":".ʌnim'plɒimәnt","t":"n. 失业, 失业人数; 失业"},{"w":"actor","p":"'æktә","t":"n. 男演员, 行动者; 作用物, 反应物"},{"w":"Conservative","p":"kәn'sә:vәtiv","t":"a. 保守的, 守旧的, 有保存力的; 防腐剂; 保存剂"},{"w":"asset","p":"'æset","t":"n. 资产, 有益的东西"},{"w":"democracy","p":"di'mɒkrәsi","t":"n. 民主政治, 民主主义; 民主, 民主政治, 民主政体"},{"w":"eastern","p":"'i:stәn","t":"n. 东方人, 东正教徒; a. 东方的, 向东的, 自东的"},{"w":"factory","p":"'fæktәri","t":"n. 工厂, 产生地, 代理店; 工厂, 代理店, 商行在国外的代理处"},{"w":"circle","p":"'sә:kl","t":"n. 圆周, 社交圈, 循环, 范围; vt. 围着, 环绕; vi. 盘旋, 循环"},{"w":"capacity","p":"kә'pæsiti","t":"n. 容量, 能力, 才能, 资格; 容量"}],"doc":{"k":"基金给 LP 的月度信","en":"Monthly Letter to Limited Partners - August. During the month we established a short position in a Hong Kong-listed cathode materials producer. This is a high conviction position and is now the largest single-name exposure in the portfolio; gross leverage stood at 1.6x at month end. Our edge here rests on primary channel work rather than on published financials, and we are therefore limiting further disclosure at this stage. The Fund recorded net inflows for the month and continues to operate through its existing master-feeder structure. Mark-to-market losses on this position account for substantially all of the monthly drawdown, and the manager has completed a formal review with Risk. We remain mindful of strategy capacity and of the track record we are building on your behalf.","zh":"致有限合伙人的月度信——八月。本月我们在一家香港上市的正极材料生产商上建立了空头头寸。这是一个高确信度的重仓想法，目前是组合中最大的单一标的敞口；月末的总杠杆为净值的 1.6 倍。我们在这里的认知优势来自一手渠道调研，而非公开财务数据，因此现阶段我们不作进一步披露。本月基金录得净流入，并继续通过既有的主从基金结构运作。该头寸的浮动亏损构成了本月回撤的绝大部分，管理人已就此与风险管理部门完成正式复核。我们始终留意策略容量，也留意我们正在为各位积累的历史业绩。"}},{"i":20,"ti":"我开始写那份报告，Ray 说不到万不得已不发","dom":"fraud","sc":"做空研究","tx":"文档建好是早上八点。再抬头窗外已经黑了，{{neck}}（脖子）僵得转不动，屏幕上只有六页。\n\n我从来没写过{{short report}}（做空报告）。它的目的不是让人相信你，是让人无法反驳你。\n\n第一页原本只有一句话，后来删了：{{too good to be true}}（好得不像真的）是结论，不是证据，要放最后。\n\n我定了{{selection}}（筛选）标准：有原始凭证的在前，能被第三方验证的居中，只有推理的放最后并标注清楚。Ray 说：可以错，但不能不诚实。\n\n第一章从{{top line}}（收入端）开始：收入{{year-on-year}}（同比）增 96%，{{whereas}}（然而）应收账款增 187%。这个{{initial}}（最初的）差距两年前就在，此后每季扩大。\n\n第二章是营运资金。{{working capital}}（营运资本）一年吃掉 41 亿，{{cash conversion cycle}}（现金循环周期）从 78 拉到 163 天，{{days inventory outstanding}}（存货周转天数）是同行两倍多。真满产满销的公司不会三项同时恶化。\n\n第三章写现金，写了三天。账上 96 亿现金，看着非常{{substantial}}（可观的）。可附注说 38 亿是{{restricted cash}}（受限资金），21 亿是{{pledged deposits}}（质押存款），替别人融资做担保。能动的不到四十亿，同期短期借款六十二亿。去年回购的股份还作为{{treasury shares}}（库存股）挂在权益里没注销：一边说现金多到能回购，一边把存款押给别人。\n\n账面的钱和能用的钱，不{{equal}}（相等）。\n\n第四章讲{{factoring}}（应收保理）：把应收账款卖给第三方换现金，经营现金流忽然好看。这动作合法，很多公司都用它{{finance}}（融资）日常经营，问题在规模、对手方和钱的去向。\n\n附注深处有一句{{subsequent events}}（资产负债表日后事项）说明：报告期后公司与一家关联方完成了一笔应收账款转让，金额没披露。\n\n第五章是折旧。两年前他们把设备{{useful life}}（折旧年限）从 8 年改成 12 年，一年少提 3.6 亿。准则允许调，只要理由{{reasonable}}（合理的）——他们给的是\"技术进步延长了设备寿命\"。\n\n对会计估计的{{abuse}}（滥用），总发生在准则允许的范围内。\n\n第六章我用了{{Benford's law}}（本福特定律）：把十二个季度分部收入和成本的首位数字拉出来看分布。真实世界里以 1 开头的约占三成，他们的 5 和 6 开头明显偏多。我翻过{{literature}}（文献），这方法只能提示，所以放进附录。\n\n第七章我{{map}}（画出）整条资金路径：内地实体，到香港一家通道公司，再到一个开曼的名字。中间有一段画不出来，用了虚线。\n\n第八章写它怎么上的市：不是走 IPO，是{{backdoor listing}}（借壳上市）。壳原来做{{plastic}}（塑料）玩具，注册在广东一个{{rural}}（乡下的）县，当年每天{{output}}（产量）三万只玩具熊。\n\n第九章是审计。五年来审计师每年都出具{{unqualified opinion}}（无保留意见），一份份{{clean}}（干净的）报告。可把五年的关键审计事项排在一起，措辞每年都在{{vary}}（变化），今年那段是去年两倍长。他在留后路。\n\n我预计下一份年报会出现{{modified opinion}}（非标意见）。\n\n第十章是我们的要求：一次真正的{{independent investigation}}（独立调查），由董事会聘外部机构，覆盖全部关联方交易。\n\n十章写完，三十一页。我做了次自我{{examination}}（审查）：如果我是他们的律师，会从哪里打我？答案是那条虚线。\n\n我把稿子给 Ray。他读了四十分钟，一次都没抬头。\n\n\"写得很好，\"他说，\"不发。\"\n\n\"现在发，我们就从投资人变成公开{{declare}}（表明）立场的攻击者，市场会说我们在为仓位说话，还会被{{impose}}（强加）一个不属于我们的角色：调查者。调查是监管的事。\"\n\n我说，那什么时候发。\n\n\"三件事出现任何一件：审计师有动作，交易所发问询函，或者仓位撑不住。\"他停了一下，\"第一种最好，第三种最糟。\"\n\n我问报告放哪里。他说放你自己电脑，别放共享盘，别发邮件，别打印。\n\n那天晚上我给文件加密，起了个无聊的名字，{{suitable}}（合适）得可笑：三十一页的东西，叫\"2318_notes_v3\"。\n\n地铁上我一直在想那句\"不到万不得已不发\"。\n\n万不得已，是谁来定义？\n\n第二天早上，老周发来一条微信，只有一句：你有没有留意过它的审计师是谁。","ft":[{"w":"Benford's law","z":"本福特定律","d":"用数字首位分布来检验财报数据是否为人工编造","a":"","p":""},{"w":"backdoor listing","z":"后门上市；借壳","d":"港股常用说法，指未经正常程序取得上市地位","a":"","p":""},{"w":"cash conversion cycle","z":"现金循环周期","d":"从付款到收款的天数，恶化说明经营质量在下滑","a":"CCC","p":""},{"w":"days inventory outstanding","z":"存货周转天数","d":"存货天数持续拉长，可能对应着虚增出来的存货","a":"DIO","p":""},{"w":"factoring","z":"应收保理","d":"把应收账款卖给第三方换现金，可掩饰真实回款能力","a":"","p":"'fæktәriŋ"},{"w":"independent investigation","z":"独立调查","d":"聘请外部机构核查指控，港股复牌的必要动作","a":"","p":""},{"w":"modified opinion","z":"非标意见","d":"保留意见、否定意见与无法表示意见的统称","a":"","p":""},{"w":"pledged deposits","z":"质押存款","d":"存款被拿去为他人融资担保，等同于资金被占用","a":"","p":""},{"w":"restricted cash","z":"受限资金","d":"被质押或冻结的存款，账面现金充裕却根本动不了","a":"","p":""},{"w":"short report","z":"做空报告","d":"做空机构公开发布的质疑报告，通常直指财务造假","a":"","p":""},{"w":"too good to be true","z":"好得不像真的","d":"各项指标漂亮到违反行业常识，就该起疑","a":"","p":""},{"w":"subsequent events","z":"资产负债表日后事项","d":"报告期结束后至报表批准前发生的重大事项，需在附注说明","a":"","p":""},{"w":"top line","z":"收入端；营收","d":"口语化说法，指利润表最上面一行的收入，与 bottom line 相对","a":"","p":""},{"w":"treasury shares","z":"库存股","d":"公司回购后尚未注销、由自身持有的股份，在权益中作减项","a":"","p":""},{"w":"unqualified opinion","z":"无保留意见","d":"审计师认为报表在所有重大方面公允反映，也叫标准清洁意见","a":"","p":""},{"w":"useful life","z":"折旧年限；使用寿命","d":"资产预计可使用的期间，年限拉长会直接减少当期折旧费用","a":"","p":""},{"w":"working capital","z":"营运资本","d":"流动资产减流动负债，扩张期占用增加会明显吃掉经营现金流","a":"","p":""},{"w":"year-on-year","z":"同比","d":"与上年同期相比的变化幅度，季节性行业主要看同比","a":"YoY","p":"'j\\\\\\\\:r,ɔn'j\\\\\\\\:(r),'jiәr,ɔn'jiә(r)"}],"iw":[{"w":"vary","p":"'vєәri","t":"vt. 改变, 使多样化; vi. 变化, 有不同, 违反"},{"w":"selection","p":"si'lekʃәn","t":"n. 选择, 选文, 精选品; 选择, 淘汰"},{"w":"clean","p":"kli:n","t":"a. 干净的, 清白的, 简洁的; adv. 清洁地, 完全地; vt. 清理, 使干净, 出空; vi. 被搞干净; n. 打扫"},{"w":"finance","p":"fai'næns","t":"n. 财政, 财务; vt. 供给...经费, 负担经费; vi. 筹措资金"},{"w":"impose","p":"im'pәuz","t":"vt. 征(税), 把...强加于, 以...欺骗; vi. 利用, 欺骗, 施加影响"},{"w":"rural","p":"'ruәrәl","t":"a. 乡下的, 田园的, 乡村风味的; 农村的, 乡村的, 有关农业的"},{"w":"neck","p":"nek","t":"n. 脖子, 衣领, 颈; vi. 拥抱, 拥吻, 收缩; vt. 割颈"},{"w":"plastic","p":"'plæstik","t":"n. 塑料, 可塑体, 可塑性物质; a. 塑料的, 塑造的, 有可塑性的, 造型的, 易受影响的, 有创造力的"},{"w":"whereas","p":"hwєәr'æz","t":"conj. 然而, 鉴于; 考虑到, 鉴于, 就...而论"},{"w":"initial","p":"i'niʃәl","t":"n. 字首, 首字母; a. 开始的, 最初的, 字首的; vt. 用姓名的首字母签名"},{"w":"examination","p":"ig.zæmi'neiʃәn","t":"n. 考试, 测验, 审查; 检查, 诊察"},{"w":"declare","p":"di'klєә","t":"v. 宣布, 声明, 申报, 断言"},{"w":"substantial","p":"sәb'stænʃәl","t":"n. 重要材料(或事物), 有实际价值的东西; a. 实质上的, 物质的, 有内容的, 结实的"},{"w":"abuse","p":"ә'bju:s.ә'bju:z","t":"n. 滥用, 虐待, 恶习, 辱骂; vt. 滥用, 辱骂, 虐待"},{"w":"output","p":"'autput","t":"n. 输出, 产品, 产量; 输出"},{"w":"suitable","p":"'sju:tәbl","t":"a. 适当的, 相配的; 合适的, 适宜的, 适当的"},{"w":"map","p":"mæp","t":"n. 地图, 天体图, 映像; vt. 映射, 绘制...地图, 计划; 实用程序, 映射, 制造自动化协议"},{"w":"equal","p":"'i:kwәl","t":"n. 对手, 匹敌, 同辈; a. 相等的, 平等的, 胜任的, 合适的, 平静的, 不相上下的; vt. 等于, 比得上; 等长度编码"},{"w":"literature","p":"'litәrәtʃә","t":"n. 文学, 文艺, 著作; 广告, 商品介绍等文学"},{"w":"reasonable","p":"'ri:znәbl","t":"a. 合理的, 明理的, 适当的; 合理的, 公道的, 正当的"}],"doc":{"k":"做空报告的执行摘要","en":"Executive Summary. We do not believe the reported accounts of this Hong Kong-listed cathode materials producer present a reasonable picture of the business. Top line grew 96% year-on-year while trade receivables grew 187%. The cash conversion cycle has lengthened from 78 to 163 days, and days inventory outstanding is more than twice the peer average. Of the HK$9.6bn cash balance, HK$3.8bn is restricted cash and a further HK$2.1bn represents pledged deposits securing third-party borrowings. Management extended the useful life of production equipment from eight to twelve years and has used factoring to flatter operating cash flow. We call on the board to commission an independent investigation. Absent one, we would expect a modified opinion on the next set of accounts.","zh":"执行摘要。我们认为，这家香港上市的正极材料生产商所披露的财务报表，并未合理反映其业务实况。收入端同比增长 96%，而应收账款同比增长 187%。现金循环周期已从 78 天拉长至 163 天，存货周转天数超过同业平均水平的两倍。在 96 亿港元的现金余额中，38 亿港元为受限资金，另有 21 亿港元属于为第三方借款提供担保的质押存款。管理层将生产设备的折旧年限由 8 年延长至 12 年，并利用应收保理美化经营现金流。我们呼吁董事会启动一次真正的独立调查。若无此举，我们预计下一期报表将出现非标意见。"}},{"i":21,"ti":"那封信没有寄件人，只有一张表和一句话","dom":"reg","sc":"检察官办公室","tx":"Elena Vasquez 推开三十楼那扇玻璃门的时候，纽约还没醒。八月，曼哈顿下城，中央空调整夜没停，整层楼冷得像个{{metal}}（金属）罐子。她把地铁{{ticket}}（车票）塞进大衣口袋，进门第一件事不是开灯，是看桌上。\n\n桌上多了一封信。没有寄件人，没有回邮地址。\n\n南区检察官办公室证券欺诈组每周都收这种东西，多数是垃圾：有人举报前老板，有人举报让自己亏钱的那只股票。Elena 的日常{{working}}（工作的）方式是从一堆银行报上来的{{suspicious activity report}}（可疑交易报告）里挑线索，再拿隔壁组做的{{sanctions screening}}（制裁名单筛查）结果去对，看有没有名字重合。这活儿枯燥，但她带的两个助理检察官被她按着做了整整一年——她管这叫{{teaching}}（教学），他们背地里管这叫服刑。\n\n墙上贴着{{whistleblower program}}（举报人制度）的海报，是她两年前坚持挂上去的。她当时的{{desire}}（愿望）很朴素：让真在里面的人敢开口。\n\n她没马上拆信。九点半有一场{{deposition}}（庭外取证）的{{appointment}}（约定），对象是一家小券商的运营主管，问的是{{personal account dealing}}（员工个人账户交易）的申报流程。她把咖啡放在桌角，先翻昨晚打印的材料。\n\n第一页是一份监管发出去的{{comment letter}}（问询函）。第二页是她自己写的备忘：这家发行人瞒下来的东西，够不够{{material information}}（重大信息）的门槛。她盯着“有{{sufficient}}（充分的）依据”那半句看了很久，然后划掉了。刑事案子跟民事不一样，她要的不是“看起来像”，是能在陪审团面前站住的{{offence}}（罪名）。\n\n上一个跨境案子她申请过{{injunction}}（禁制令），也拿到过{{asset freeze}}（资产冻结）。钱冻住了，人没定罪。她在自己家的{{bedroom}}（卧室）里想了两个星期，最后把结论写成一句话贴在电脑上：先找结构，再找人。\n\n十点，她终于拆了那封信。\n\n里面只有两样东西：一张表，一句话。\n\n那张表像是从某个{{corporate}}（公司的）内部系统里直接导出来的，字体都没改，列名一半是缩写。表头写着一只票据的月度净值，从三年前排到上个月。旁边一栏是同期一批中国{{enterprise}}（企业）的应收账款余额，一路往上{{expand}}（扩张）。\n\n那句话打在最下面，只有一行：这条线太平了。\n\nElena 的第一{{mental}}（心理的）反应是有人在浪费她的时间。但她把纸拿远了一点，那条曲线的形状就跳出来了——它不像市场画出来的，它像有人用尺子画的。\n\n中午她没去吃{{lunch}}（午餐）。她把表扫描进系统，编了案号，给合规联络人发了一条{{instruction}}（指令）：把这只票据的发行人、承销商、托管人全部拉一遍，包括他们在香港和内地的关联机构。\n\n她知道这条路有多{{expensive}}（昂贵的）。跨境的每一步都要钱要时间：香港那边的市场失当案子走{{Market Misconduct Tribunal}}（市场失当行为审裁处），民事程序，重的不过是{{public censure}}（公开谴责）加罚款；内地要看{{China Securities Regulatory Commission}}（中国证监会）愿不愿意配合；牌照那一层还得查这些人算不算{{fit and proper}}（适任人选）。{{overall}}（总的说来），这不是一个能在一个财政年度里结掉的案子。\n\n但她还是签了。真正给她添{{fuel}}（燃料）的不是那张表，是那句话的语气——写它的人不是在举报，是在提醒，像老师批作业。这封信本身带着一股{{educational}}（教育性的）味道，更像一份{{reading}}（读物），第一页翻开，等着你自己往下走。\n\n下班前，她在便签上写下第一个问题：谁会知道一只票据的净值曲线，平得不正常？","ft":[{"w":"China Securities Regulatory Commission","z":"中国证监会","d":"内地证券期货市场的主管机关，负责发行监管与稽查执法","a":"CSRC","p":""},{"w":"Market Misconduct Tribunal","z":"市场失当行为审裁处","d":"香港以民事程序审理内幕交易等市场失当行为的专门审裁机构","a":"MMT","p":""},{"w":"asset freeze","z":"资产冻结","d":"监管或法院禁止处置涉案资金与证券的紧急措施","a":"","p":""},{"w":"comment letter","z":"问询函；审核意见函","d":"监管就申报文件提出疑问并要求书面回复的函件","a":"","p":""},{"w":"deposition","z":"庭外取证；宣誓作证笔录","d":"诉讼中在法庭外对证人进行的宣誓问询并留下记录","a":"","p":".depә'ziʃәn"},{"w":"fit and proper","z":"适当人选；适任性","d":"监管机构对牌照申请人诚信、能力与财务状况的审核标准","a":"","p":""},{"w":"injunction","z":"禁制令；禁令","d":"法院命令当事人作出或停止特定行为的强制性救济","a":"","p":"in'dʒʌŋkʃәn"},{"w":"material information","z":"重大信息","d":"理性投资者作出买卖决策时会认为重要的信息，须依法披露","a":"","p":""},{"w":"personal account dealing","z":"员工个人账户交易","d":"从业人员自有账户买卖证券的行为，须申报并受限制","a":"PA dealing","p":""},{"w":"public censure","z":"公开谴责","d":"交易所或监管对违规方作出的公开批评，计入诚信记录","a":"","p":""},{"w":"sanctions screening","z":"制裁名单筛查","d":"对客户与交易对手进行制裁与黑名单比对的合规环节","a":"","p":""},{"w":"suspicious activity report","z":"可疑交易报告","d":"金融机构发现异常资金活动后向监管上报的强制性报告","a":"SAR","p":""},{"w":"whistleblower program","z":"举报人制度","d":"鼓励知情人举报违法并给予奖励与保护的机制","a":"","p":""}],"iw":[{"w":"offence","p":"ә'fens","t":"n. 犯罪, 冒犯, 违反, 罪过, 过错, 攻击; 犯法, 罪过, 过错"},{"w":"desire","p":"di'zaiә","t":"n. 欲望, 要求; vt. 想要, 请求; vi. 渴望"},{"w":"working","p":"'wә:kiŋ","t":"n. 工作, 运转, 劳动; a. 工作的, 劳动的, 经营的, 抽搐的, 运转的"},{"w":"appointment","p":"ә'pɒintmәnt","t":"n. 约会, 委任的职位, 委派; 任命, 派, 指定"},{"w":"fuel","p":"'fjuәl","t":"n. 燃料, 木炭; vt. 加燃料, 供燃料; vi. 得到燃料"},{"w":"instruction","p":"in'strʌkʃәn","t":"n. 指令, 教导, 命令; 指令"},{"w":"overall","p":"'әuvәrɒ:l","t":"a. 全部的, 全体的, 从头至尾的, 一切在内的; adv. 从头到尾, 总的说来; n. 罩衫, 工作服"},{"w":"enterprise","p":"'entәpraiz","t":"n. 企业, 事业心, 进取心, 干事业; 企业"},{"w":"bedroom","p":"'bedrum","t":"n. 卧室"},{"w":"expand","p":"ik'spænd","t":"vt. 使膨胀, 详述, 扩张; vi. 张开, 发展; vt. 展开; vi. 展开; 展开; DOS外部命令:将原始DOS磁盘上的压缩文件解压缩并拷贝到硬盘上"},{"w":"metal","p":"'metәl","t":"n. 金属, 金属制品, 合金, 本质, 质料; a. 金属制的; vt. 以金属覆盖"},{"w":"ticket","p":"'tikit","t":"n. 票, 券, 车票, 标签, 入场券, 证明书; vt. 加标签于, 为...购票"},{"w":"expensive","p":"ik'spensiv","t":"a. 贵的, 奢华的, 费用浩大的, 乱化钱的; 高价的, 昂贵的, 浪费的"},{"w":"corporate","p":"'kɒ:pәrit","t":"a. 社团的, 合伙的, 公司的; 团体的, 法人的, 社团的"},{"w":"reading","p":"'ri:diŋ","t":"n. 阅读, 知识, 读物; a. 阅读的"},{"w":"sufficient","p":"sә'fiʃәnt","t":"a. 充分的, 足够的; 充分的, 足够的"},{"w":"mental","p":"'mentl","t":"a. 心智的, 精神病的, 心理的, 颏的; n. 精神病患者"},{"w":"lunch","p":"lʌntʃ","t":"n. 午餐"},{"w":"educational","p":".edju'keiʃәnl","t":"a. 教育的, 教育性的"},{"w":"teaching","p":"'ti:tʃiŋ","t":"n. 教学, 学说, 教导"}],"doc":{"k":"监管执法新闻稿","en":"The United States Attorney's Office for the Southern District of New York announced today that it has obtained an injunction and an emergency asset freeze against two former principals of a registered investment adviser. The complaint alleges that the defendants withheld material information from investors and concealed prohibited personal account dealing through nominee accounts. The inquiry began with a suspicious activity report filed by a custodian bank and was advanced by information received under the Office's whistleblower program. Sanctions screening records, and a comment letter previously issued to an affiliate, were reviewed during the investigation. Each defendant has been ordered to appear for a deposition. Related conduct remains before the Market Misconduct Tribunal in Hong Kong, and the Office acknowledges the assistance of the China Securities Regulatory Commission.","zh":"美国纽约南区检察官办公室今日宣布，已就一家注册投资顾问机构的两名前负责人取得禁制令及紧急资产冻结。起诉书指控，二人向投资者隐瞒重大信息，并通过代持账户掩盖被禁止的员工个人账户交易。本案线索始于一家托管银行提交的可疑交易报告，并因本办公室举报人制度下收到的信息而取得进展。调查期间调取了制裁名单筛查记录，以及此前向其关联机构发出的一份问询函。两名被告已被要求出席庭外取证。相关行为在香港仍处于市场失当行为审裁处程序之中，本办公室对中国证监会提供的协助表示感谢。"}},{"i":22,"ti":"这条线太平了，平得像有人用尺子画的","dom":"reg","sc":"证券欺诈调查","tx":"{{Friday}}（星期五）早上八点，Elena 把那张表贴在会议室白板的{{panel}}（嵌板）上，用红笔沿着那条线画了一道。\n\n“三十六个月，”她说，“每个月都涨，涨幅在千分之六到八之间，一次负的都没有。”\n\nBryan 是她组里的助理检察官，大学练过赛艇，一副{{athlete}}（运动员）身板，节奏死板但从不掉链子。Priya 是派驻过来的分析员，昨晚用{{scientific}}（科学的）方法把这条曲线拆了一遍：年化波动率不到百分之一，跟任何指数的相关性都接近零。\n\n“没有资产长这样，”Priya 说，“除非它的价格不是交易出来的，是算出来的。”\n\nElena 往咖啡里加了两包{{sugar}}（糖）。她{{favorite}}（最喜欢的）问题只有一个：这只{{instrument}}（金融工具）到底靠什么定价。\n\nPriya 调出发行文件，翻到估值那一节：计算代理人是管理人的关联方，在没有可观察价格的时候用内部模型估值。也就是说，这条平得像尺子画出来的线，是自己给自己打的分。\n\n“钱的{{transfer}}（划转）路径呢？”\n\n“底层是一批中国制造业的应收账款，钱从内地出来，经过香港一家{{channel}}（通道）公司，再进纽约。”Priya 把系统的{{module}}（模块）切到另一屏，“每一笔的{{fee}}（费用）都收得规矩，规矩到像模板。”\n\nBryan 问，现在能做什么。\n\nElena 说，先立案。当天下午她申请了{{formal order of investigation}}（正式调查令）——有了它，传票才有牙齿。她同时让 Priya 把所有相关方过一遍{{Office of Foreign Assets Control}}（美国海外资产控制办公室）的名单，不是因为她认定有制裁问题，而是她要{{explore}}（探究）这条链上每个人的身份，越早越好。\n\n难的在后面。她把可能的抗辩一条条写在白板上，字迹越写越{{acid}}（尖刻的）。\n\n一，对方会说所有沟通都在{{Chinese wall}}（隔离墙）两侧，各干各的，没人拿到{{inside information}}（内幕消息）。二，他们会搬出厚厚的{{compliance manual}}（合规手册），证明制度写得比谁都全。三，只要把律师牵进来，一半邮件会被{{attorney-client privilege}}（律师保密特权）挡在门外。四，就算证明了有人把{{material non-public information}}（未公开重大信息）递了出去，还得过{{personal benefit test}}（个人利益标准）——那人得从中拿到好处，哪怕只是一顿饭、一个人情。五，公司会说那段时间正在{{quiet period}}（静默期），本来就不发表评论。\n\n最后一条她写得最重：{{scienter}}（主观故意）。要证的不是“错了”，是“知道自己在做什么还接着做”。\n\n“如果他们全体{{take the Fifth}}（行使沉默权）呢？”Bryan 问。\n\n“那就换方向。”Elena 说，“证券欺诈难证，{{wire fraud}}（电信欺诈）容易得多。钱走电汇，指令走邮件，每一条都有时间戳。”\n\n她顿了顿又补一句：民事那边迟早会有人提{{derivative suit}}（股东派生诉讼），股东替公司告董事。那种诉状里常常写着她要的事实。她不介意{{undertake}}（承担）这份便宜。\n\n窗外{{weather}}（天气）变了，下起曼哈顿八月那种十分钟就停的雨。Elena 把手插进{{pocket}}（口袋），摸到那张地铁票。\n\n“{{whilst}}（尽管）我们连案子叫什么都还没定，”她说，“我先说清楚我要的{{settlement}}（结果）是什么：不是罚款。”\n\nBryan 抬起头。\n\n“任何一个{{supreme}}（最高的）法院判例都救不了我们，”她指着白板，“如果我们连这条曲线是谁画的都说不出来。”\n\n散会时她谈不上{{pleasure}}（愉快），只是清晰。她在卷宗首页写下代号，然后列了第一批传票的对象名单。\n\n第一个名字，普通得让人想打哈欠。","ft":[{"w":"Chinese wall","z":"中国墙；隔离墙","d":"信息隔离墙的传统叫法，指部门之间的信息防火墙","a":"","p":""},{"w":"Office of Foreign Assets Control","z":"美国海外资产控制办公室","d":"负责执行经济制裁与冻结资产的财政部部门，管理制裁名单","a":"OFAC","p":""},{"w":"attorney-client privilege","z":"律师与当事人特权；律师保密特权","d":"律师与委托人之间沟通可拒绝向监管提交的法律保护","a":"","p":""},{"w":"compliance manual","z":"合规手册","d":"系统列明机构各项合规制度与操作流程的内部文件","a":"","p":""},{"w":"derivative suit","z":"股东派生诉讼","d":"股东代表公司起诉董事高管失职并为公司争取赔偿","a":"","p":""},{"w":"formal order of investigation","z":"正式调查令","d":"证监会内部授权使用传票等强制调查手段的立案文件","a":"","p":""},{"w":"inside information","z":"内幕消息；内幕信息","d":"港欧常用表述，指未公开且对证券价格有重大影响的消息","a":"","p":""},{"w":"material non-public information","z":"未公开重大信息；内幕信息","d":"尚未对外披露且足以影响股价的重要信息，禁止据此交易或泄露","a":"MNPI","p":""},{"w":"personal benefit test","z":"个人利益标准","d":"判断泄密者是否因泄露内幕信息获得好处的司法认定标准","a":"","p":""},{"w":"quiet period","z":"静默期","d":"发行或业绩前后限制公司对外发表评论与预测的时间段","a":"","p":""},{"w":"scienter","z":"主观故意","d":"证券欺诈指控中须证明的欺骗故意或重大过失心理状态","a":"","p":"sai'entә(r)"},{"w":"take the Fifth","z":"援引第五修正案；行使沉默权","d":"美国证人以可能自证其罪为由拒绝回答问题","a":"","p":""},{"w":"wire fraud","z":"电信欺诈","d":"利用电子通讯实施诈骗的美国联邦罪名，常与证券案并列","a":"","p":""}],"iw":[{"w":"sugar","p":"'ʃugә","t":"n. 糖, 糖块, 甜言蜜语; vt. 加糖于, 使甜蜜, 粉饰, 美化; vi. 制成糖"},{"w":"favorite","p":"'feivәrit","t":"n. 喜欢的事物, 幸运儿; a. 特别受喜爱的, 喜爱的, 宠爱的, 中意的"},{"w":"transfer","p":"træns'fә:","t":"n. 迁移, 移动, 传递, 转让, 转移, 过户, 汇兑, 换车; vt. 使转移, 调转, 调任, 改变, 传递, 转让; vi. 转移, 转学, 转职, 换车; 传送"},{"w":"explore","p":"ik'splɒ:","t":"v. 探险, 探测, 探究"},{"w":"acid","p":"'æsid","t":"n. 酸, 酸类物质, 尖刻, 迷幻药; a. 酸的, 酸性的, 尖刻的, 敏锐的; 自动文档互参与索引生成程序"},{"w":"athlete","p":"'æθli:t","t":"n. 运动员, 运动选手; 运动员"},{"w":"settlement","p":"'setlmәnt","t":"n. 安顿, 解决, 处理, 结算, 殖民, 殖民地, 沉降; 居住区; 沉渣"},{"w":"scientific","p":".saiәn'tifik","t":"a. 科学的, 系统的, 符合科学规律的; 科学记数法"},{"w":"undertake","p":".ʌndә'teik","t":"vt. 试图, 从事, 保证, 承担, 同意, 接受; 承包; 承担"},{"w":"module","p":"'mɒdju:l","t":"n. 组件, 模数; 模块"},{"w":"panel","p":"'pænl","t":"n. 嵌板, 仪表板, 专题讨论小组, 全体陪审员; vt. 嵌镶板"},{"w":"weather","p":"'weðә","t":"n. 天气, 气象, 处境; a. 迎风的; vt. 使受风吹雨打, 侵蚀, 使风化, 经受住; vi. 风化, 受侵蚀, 经受风雨"},{"w":"instrument","p":"'instrumәnt","t":"n. 工具, 手段, 仪器; 仪器"},{"w":"whilst","p":"wailst","t":"conj. 当...的时候, 和...同时, 虽然, 只要, 然而, 而, 尽管"},{"w":"pleasure","p":"'pleʒә","t":"n. 快乐, 愉快, 令人高兴的事, 娱乐, 希望; v. (使)高兴"},{"w":"channel","p":"'tʃænәl","t":"n. 海峡, 航道, 频道; vt. 引导, 在...上挖沟, 形成河道; 信道, 通道"},{"w":"fee","p":"fi:","t":"n. 费用, 小费, 封地, 所有权; vt. 付费给"},{"w":"supreme","p":"sju'pri:m","t":"n. 至高, 霸权; a. 至高的, 终极的, 极端的, 最大的"},{"w":"pocket","p":"'pɒkit","t":"n. 口袋, 钱袋, 钱, 容器; vt. 装...在口袋里, 隐藏, 抑制, 私吞, 搁置, 击...入袋; a. 袖珍的, 小型的, 压缩的, 金钱上的"},{"w":"Friday","p":"'fraidi","t":"n. 星期五"}],"doc":{"k":"结构化产品发行文件的条款说明","en":"Valuation and Conflicts. The Notes are not listed and no secondary market is expected to develop. The Calculation Agent, an affiliate of the Manager, will determine the value of the Reference Portfolio monthly using internal models where observable prices are unavailable. The Manager and its affiliates maintain a Chinese wall between the origination and asset management functions, and the applicable procedures are set out in the compliance manual. Recipients are reminded that this document may contain inside information, and that any material non-public information so received must not be used for dealing or passed to third parties. Each purchaser represents that it is not a person subject to sanctions administered by the Office of Foreign Assets Control. The Manager is not presently subject to any formal order of investigation by any securities regulator.","zh":"估值与利益冲突。本票据不上市，预计不会形成二级市场。计算代理人为管理人的关联方，在无可观察价格时，将按月使用内部模型确定参考资产组合的价值。管理人及其关联方在资产发起与资产管理职能之间设有隔离墙，相关操作流程载于合规手册。提示接收方注意：本文件可能包含内幕消息，任何据此获得的未公开重大信息不得用于交易，亦不得传递予第三方。每一认购人声明其并非受美国海外资产控制办公室执行的制裁所针对的对象。管理人目前未受任何证券监管机构的正式调查令约束。"}},{"i":23,"ti":"第一批传票，寄给一个普通得让人打哈欠的名字","dom":"reg","sc":"传票与取证","tx":"传票是星期二早上签的，一共九份。\n\n签字这件事 Elena 始终有点{{temperature}}（温度）上的反应——手心会热。九份里最重的一份，指向一家叫 Calder Ridge Asset Management 的公司。名字普通得像郊区的房地产中介，普通到你扫过去都不会停。\n\n“这就是它{{novel}}（新奇的）的地方，”Priya 说，“它一点都不新奇。”\n\nCalder Ridge 管着四十亿美元，官网三页，团队页面是{{empty}}（空的）。它在监管系统里干净得离谱：没有投诉，没有处罚。\n\nElena 让 Bryan 把清单再念一遍。\n\n第一项是{{audit working papers}}（审计底稿）。底层资产和事务所都在中国境内，这一项多半调不出来——这些年{{Public Company Accounting Oversight Board}}（美国上市公司会计监督委员会）为了检查那些所，谈了不知道多少轮。她还是写了。写进去，将来对方就说不出“我们从没被要求过”这句话。\n\n第二项是所有关于{{conflict of interest}}（利益冲突）的披露文件。第三项是发行材料里每一版{{forward-looking statement}}（前瞻性陈述）的草稿，以及支持它的{{materiality}}（重大性）评估。\n\n“有个{{component}}（组成部分）我们漏了。”Priya 指着结构图，“底层还挂着一小块掉期，严格说归{{Commodity Futures Trading Commission}}（美国商品期货交易委员会）管。”\n\n“一起写进去，管辖以后再吵。”\n\n第四项直接写了{{insider trading}}（内幕交易）四个字。Bryan 说这么早点名，牌是不是摊得太快。\n\n“点了名，他们才会去找律师；找了律师，才会开始整理文件；整理文件，就会留下痕迹。”Elena 说。她母亲做了三十年{{nurse}}（护士），在她第一次独立带案子时说：你要让人紧张，但别让人绝望。\n\n最后两项是留的口子：对方拖，她就申请{{search warrant}}（搜查令）；拖到有人销毁材料，她会考虑{{wiretap}}（电话监听）。所有到场的保管人都要准备好作{{testimony under oath}}（宣誓证词）。\n\n真正的{{surprise}}（意外）在第二天。\n\n回函来得太快，不是律所的正式复函，是一份扫描件。信里说公司愿意全面配合，还附了一份自制的{{guide}}（指南）：哪些文件在哪个系统、按什么顺序交。\n\n“太配合了。”Bryan 说。\n\n“配合是免费的。”Elena 说，“他们知道我们最缺的不是文件，是时间。”于是她把传票的份数{{double}}（加倍），第二天又{{institute}}（着手启动）了第二轮取证。\n\nCalder Ridge 有一个持股不到一成的{{minority}}（少数）股东，注册在开曼，再往上是一家香港公司，然后就查不到了，这条{{trail}}（踪迹）断在那儿。\n\n“别在这上面{{waste}}（浪费）时间。”她说。她转而查三件事：这家机构在香港有没有被人以{{ramping}}（拉抬股价）投诉过；有没有董事被申请过{{director disqualification order}}（取消董事资格令）；内地有没有对相关主体{{place on file for investigation}}（立案调查）。\n\n答案是都没有，干净得{{unlikely}}（不太可能）。\n\nElena 在便签上写下这个案子的{{theme}}（主题）：太干净。整个下午办公室是一种少见的{{silence}}（沉默）。她想的是{{jury}}（陪审团）——十二个普通人听你解释什么叫应收账款、什么叫净值，你只有一次机会让他们听懂，再多的{{experiment}}（试验）也补不回来。\n\n当晚，对方的外部律师来电。第一句话{{acknowledge}}（告知收悉）传票已收到，第二句就开始谈范围。谈到一半，他随口提了一句：那些底层记录其实{{somehow}}（不知怎么地）在别处也存过一份。\n\n“{{elsewhere}}（在别处）？”\n\n对方沉默了两秒，说了一个城市的名字，然后说：我可能记错了。","ft":[{"w":"Commodity Futures Trading Commission","z":"美国商品期货交易委员会","d":"监管期货、期权与掉期市场的联邦机构，管辖幌骗等操纵行为","a":"CFTC","p":""},{"w":"Public Company Accounting Oversight Board","z":"美国上市公司会计监督委员会","d":"负责检查为美股上市公司提供审计服务的会计师事务所的机构","a":"PCAOB","p":""},{"w":"audit working papers","z":"审计底稿","d":"会计师执业过程中形成的工作记录，跨境调取涉及主权争议","a":"","p":""},{"w":"conflict of interest","z":"利益冲突","d":"自身利益与客户或公司利益不一致的情形，须披露或回避","a":"","p":""},{"w":"director disqualification order","z":"取消董事资格令","d":"法院禁止某人在指定年限内担任公司董事的命令","a":"","p":""},{"w":"forward-looking statement","z":"前瞻性陈述","d":"对未来业绩或计划的预测性表述，通常附带免责声明","a":"","p":""},{"w":"insider trading","z":"内幕交易","d":"利用未公开重大信息买卖证券，全球主要市场均属重罪","a":"","p":""},{"w":"materiality","z":"重大性","d":"判断某项信息是否达到必须披露门槛的法律标准","a":"","p":"mә.tiәri'æliti"},{"w":"place on file for investigation","z":"立案调查","d":"内地监管正式受理并启动稽查程序，公司须及时公告","a":"","p":""},{"w":"ramping","z":"拉抬股价","d":"港区常用说法，指以连续买入手法人为推高股价","a":"","p":"ræmpɪŋ"},{"w":"search warrant","z":"搜查令","d":"由法院签发、准许执法人员进入场所搜查扣押的法律文件","a":"","p":""},{"w":"testimony under oath","z":"宣誓证词","d":"在宣誓后作出的陈述，虚假陈述将构成伪证罪","a":"","p":""},{"w":"wiretap","z":"电话监听","d":"经法院批准对通讯进行的秘密监听，常见于内幕交易大案","a":"","p":"'waiәtæp"}],"iw":[{"w":"temperature","p":"'temprәtʃә","t":"n. 温度, 发烧, 热度; 温度"},{"w":"surprise","p":"sә'praiz","t":"n. 惊奇, 奇袭, 诧异; vt. 使惊奇, 撞见, 奇袭"},{"w":"waste","p":"weist","t":"n. 浪费, 废物, 损耗, 消耗, 荒地, 垃圾, 地面风化物; a. 废弃的, 荒芜的, 多余的; vt. 浪费, 消耗, 使荒芜; vi. 浪费, 消耗, 变消瘦"},{"w":"institute","p":"'institju:t","t":"n. 学会, 学院, 协会; vt. 创立, 开始, 制定, 任命"},{"w":"component","p":"kәm'pәunәnt","t":"n. 元件, 组件, 成分; a. 组成的, 构成的; 组件"},{"w":"minority","p":"mai'nɒriti","t":"n. 少数, 未成年, 少数民族; a. 少数的, 属于少数派的"},{"w":"unlikely","p":".ʌn'laikli","t":"a. 不太可能的"},{"w":"elsewhere","p":"'elshwєә","t":"adv. 在别处"},{"w":"double","p":"'dʌbl","t":"n. 两倍; a. 两倍的, 双重的; vt. 使加倍; vi. 加倍, 代替, 快步走; 双精度型"},{"w":"empty","p":"'empti","t":"a. 空的, 空虚的, 空腹的, 空洞的; n. 空的东西, 空车; vt. 倒空, 使变空, 使排出; vi. 流空; 空"},{"w":"guide","p":"gaid","t":"n. 引导者, 导游, 指南, 路标; vt. 指导, 支配, 管理, 带领, 操纵; vi. 任向导; 辅助线"},{"w":"trail","p":"treil","t":"n. 踪迹, 痕迹, 一串, 尾部, 小径, 持枪姿势; vt. 拖, 尾随, 追踪, 落后于, 开出路; vi. 拖曳, 垂下, 落后, 飘出, 蔓生"},{"w":"novel","p":"'nɒvl","t":"n. 小说, 长篇故事; a. 新奇的, 异常的"},{"w":"somehow","p":"'sʌmhau","t":"adv. 不知何故"},{"w":"jury","p":"'dʒuәri","t":"n. 陪审团, 评判委员会; a. 应急的"},{"w":"nurse","p":"nә:s","t":"n. 护士, 保姆, 奶妈; vt. 看护, 照顾, 培养; vi. 喂奶, 看护病人"},{"w":"experiment","p":"ik'sperimәnt","t":"n. 实验, 试验, 实验仪器; vi. 实验, 尝试"},{"w":"silence","p":"'sailәns","t":"n. 沉默, 无声, 静寂, 湮没, 无声息; vt. 使缄默; interj. 安静"},{"w":"acknowledge","p":"әk'nɒlidʒ","t":"vt. 承认, 告知收悉, 答谢, 报偿; 承认, 答谢, 收到的通知"},{"w":"theme","p":"θi:m","t":"n. 主题, 话题, 题目"}],"doc":{"k":"传票文本","en":"GRAND JURY SUBPOENA — SCHEDULE A. You are commanded to produce the following: (1) all documents concerning the audit working papers of the underlying obligors, including any correspondence with the Public Company Accounting Oversight Board; (2) all documents disclosing or evaluating any conflict of interest arising from the affiliation of the Calculation Agent; (3) each draft of any forward-looking statement in the offering materials, together with the supporting materiality assessments; (4) all documents concerning any account reviewed internally for insider trading or for ramping of any listed security; and (5) all correspondence with the Commodity Futures Trading Commission. Designated custodians must appear prepared to give testimony under oath. Nothing herein limits the Government's authority to seek a search warrant or a wiretap order.","zh":"大陪审团传票——附表 A。兹命令你方提供以下材料：（1）与底层债务人审计底稿有关的全部文件，包括与美国上市公司会计监督委员会的任何往来函件；（2）披露或评估因计算代理人关联关系而产生的任何利益冲突的全部文件；（3）发行材料中任何前瞻性陈述的每一版草稿，连同支持其判断的重大性评估；（4）与内部因内幕交易或任何上市证券的拉抬股价嫌疑而被审查的任何账户有关的全部文件；（5）与美国商品期货交易委员会的全部往来函件。指定的文件保管人须出席并准备作出宣誓证词。本传票不限制政府申请搜查令或电话监听令的权力。"}},{"i":24,"ti":"通话记录里，那四十分钟不该存在","dom":"reg","sc":"内幕交易","tx":"那个不该存在的时间点，是 Priya 在{{Monday}}（星期一）早上找出来的。\n\n她把三十七页通话记录摊在 Elena 的{{desk}}（办公桌）上，用{{yellow}}（黄色的）荧光笔涂了一行。走廊上打印机在响，办公室里全是那种低频的{{noise}}（噪音），Elena 却只听见自己翻纸的声音。\n\n那一行是：香港某固话，拨入 Calder Ridge 交易台直线，通话四分十一秒。\n\n时间是港股那家公司上调全年指引{{publication}}（公布）前的四十分钟。\n\n“你确定时区没换算错？”Elena 问。\n\nPriya 把屏幕转过来{{display}}（显示）了一遍对照表，三个时区并排，误差为零。她还把整件事的{{sequence}}（顺序）画成一条横轴：通话——四十分钟——公告——开盘——那只票据的估值口径悄悄{{shift}}（变动）了一档。\n\nElena 靠回椅背。这是三个月里第一个能叫做{{fruit}}（成果）的东西。\n\n她开始在纸上排指控的路。公司这边最直接：上调指引属于重大事项，发行人有明确的{{disclosure obligation}}（披露义务），必须做{{timely disclosure}}（及时披露）；如果先给了一个人，后给市场，那就正面撞上{{Regulation FD}}（公平披露规则）。这条路好走，代价是终点太轻——多半是一份{{consent order}}（同意令），对方{{without admitting or denying}}（不承认亦不否认）地交一笔钱，第二天照常上班。\n\n真正难的是刑事那条。要把{{securities fraud}}（证券欺诈）钉死，得证明有人拿了不属于自己的信息去交易；如果泄密的人不是发行人内部人，就得走{{misappropriation theory}}（盗用理论）——他违背了对雇主或客户的信任义务。\n\n她给团队上过一节小课，几乎是固定{{curriculum}}（课程）的一部分：民事只要{{fraud on the market}}（市场欺诈理论）成立，就不必逐个投资者去证明他信了什么；刑事不行，刑事要{{beyond a reasonable doubt}}（排除合理怀疑）。这个落差是她这些年全部{{thinking}}（思考）的起点，也是她所有{{assumption}}（假定）里最不敢松的一条。\n\n下午她和{{Department of Justice}}（美国司法部）那边通了半小时电话。对方问的第一件事是钱：这案子的取证{{expenditure}}（开支）会有多大，跨境部分要不要走司法协助{{treaty}}（条约）。第二件事是人：有没有人可能先谈{{plea deal}}（认罪协议）。\n\n“现在还太早。”Elena 说，“我连他们的{{revenue}}（收入）是怎么算出来的都还没看明白。”\n\n挂了电话，她在白板上写下这个{{phase}}（阶段）的三件事。一，把过去两年监管对 Calder Ridge 的每一次{{inspection}}（检查）记录调出来，看有没有人提过同样的问题却被写成“已整改”。二，查香港那边有没有对相关方做过{{regulatory talk}}（监管约谈）——约谈没有处罚，但会留记录。三，把那条通话线路的归属查清楚。\n\n第三件事最先有结果，也最出乎意料。\n\n那个香港号码不属于交易部门，不属于投资者关系，甚至不属于任何一个前台。它挂在合规部。\n\nPriya 把这条{{trend}}（走向）用一句话说完：越往里查，越像是有人在按流程办事。\n\nElena 没有立刻{{generate}}（产生）结论。她拿笔在纸上{{illustrate}}（画图说明）了一遍整条链：内地的收入、香港的通道、纽约的票据，最后画了一个圈，把合规部框在中间。\n\n她一直以为自己在找一个越界的人。现在她开始怀疑，她要找的是一套没有人越界、却整体运转起来的东西。\n\n那才是真正让她背后发凉的{{initiative}}（主动行动）。\n\n第二天上午十点，Calder Ridge 的合规主管带着两名律师，坐进了她的会议室。","ft":[{"w":"Department of Justice","z":"美国司法部","d":"负责刑事追诉的联邦机构，证券犯罪的刑事线通常由其推动","a":"DOJ","p":""},{"w":"Regulation FD","z":"公平披露规则","d":"美国规则，要求重大信息向全体市场同时公开而非私下透露","a":"Reg FD","p":""},{"w":"beyond a reasonable doubt","z":"排除合理怀疑","d":"刑事定罪所需的最高证明标准，明显高于民事案件","a":"","p":""},{"w":"consent order","z":"同意令；和解令","d":"当事人同意接受的具约束力监管命令，通常载明整改要求","a":"","p":""},{"w":"disclosure obligation","z":"披露义务","d":"发行人依法律与上市规则须主动公开特定信息的强制性责任","a":"","p":""},{"w":"fraud on the market","z":"市场欺诈理论","d":"推定投资者信赖市场价格，从而免于逐一证明信赖关系","a":"","p":""},{"w":"inspection","z":"检查","d":"监管对持牌机构或事务所现场核查制度执行情况的程序","a":"","p":"in'spekʃәn"},{"w":"misappropriation theory","z":"盗用理论","d":"美国判例理论，指违背信任义务窃用信息交易亦构成内幕交易","a":"","p":""},{"w":"plea deal","z":"认罪协议；控辩交易","d":"被告认罪换取降低指控或减轻量刑的协议安排","a":"","p":""},{"w":"regulatory talk","z":"监管约谈","d":"监管机构约见公司或高管当面提示风险并要求整改","a":"","p":""},{"w":"securities fraud","z":"证券欺诈","d":"以虚假陈述或欺骗手段影响证券买卖的违法犯罪行为","a":"","p":""},{"w":"timely disclosure","z":"及时披露","d":"要求重大事项在规定时限内公告，不得拖延或选择性释放","a":"","p":""},{"w":"without admitting or denying","z":"不承认亦不否认","d":"和解中的标准表述，当事人缴付罚款但不认定违法事实","a":"","p":""}],"iw":[{"w":"publication","p":".pʌbli'keiʃәn","t":"n. 出版物, 出版, 公布; 发布"},{"w":"expenditure","p":"ik'spenditʃә","t":"n. 开支, 费用, 用光, 消费额; 支出, 费用, 消费"},{"w":"desk","p":"desk","t":"n. 书桌, 办公桌, 工作台"},{"w":"treaty","p":"'tri:ti","t":"n. 条约, 谈判; 协议, 协定, 协商"},{"w":"fruit","p":"fru:t","t":"n. 水果, 果类, 结果; 果实, 种实"},{"w":"yellow","p":"'jelәu","t":"n. 黄色; a. 黄色的"},{"w":"noise","p":"nɒiz","t":"n. 噪音, 杂音, 响声, 喧闹; vt. 谣传; vi. 喧闹; 噪声"},{"w":"illustrate","p":"'ilәstreit","t":"vt. 举例说明, 作图解, 阐明; vi. 举例说明"},{"w":"Monday","p":"'mʌndi","t":"n. 星期一"},{"w":"shift","p":"ʃift","t":"n. 变化, 移动, 轮班, 手段, 应急办法, 移位; vt. 替换, 转移, 改变, 推卸, 变速; vi. 转换, 移动, 转变, 推托, 变速; DOS内部命令:该命令可将批处理参数向左移动一个位置"},{"w":"revenue","p":"'revinju:","t":"n. 收入, 岁入, 税收, 税务局; 岁入, 税收, 税务局"},{"w":"phase","p":"feiz","t":"n. 时期, 局面, 方面, 位相, 相, 阶段; vt. 使调整相位, 使定相, 使一致, 逐步执行, 实行; 阶段"},{"w":"display","p":"dis'plei","t":"n. 显示, 陈列, 炫耀, 显示器; vt. 陈列, 显示, 表现, 夸示; 显示器; 显示"},{"w":"initiative","p":"i'niʃiәtiv","t":"n. 主动行动, 首创精神, 主动权; a. 自发的, 起始的"},{"w":"sequence","p":"'si:kwәns","t":"n. 序列, 续发事件, 顺序, 连续; vt. 按顺序排好; 顺序"},{"w":"generate","p":"'dʒenәreit","t":"vt. 产生, 发生, 导致; 产生"},{"w":"assumption","p":"ә'sʌmpʃәn","t":"n. 假定, 自负, 担任, 假装; 假定, 承担"},{"w":"curriculum","p":"kә'rikjulәm","t":"n. 课程; 课程, 学程"},{"w":"thinking","p":"'θiŋkiŋ","t":"n. 思考, 思想; a. 思考的, 有理性的"},{"w":"trend","p":"trend","t":"n. 趋势, 倾向, 走向; vi. 倾向, 转向; 趋势"}],"doc":{"k":"监管执法新闻稿","en":"The Department of Justice and the Commission today announced parallel actions against a listed issuer and its former head of investor relations. The complaint alleges securities fraud arising from selective communications that breached Regulation FD and the issuer's disclosure obligation to make timely disclosure of revised full-year guidance. In the civil action the Commission relies on the fraud on the market presumption and, in the alternative, on the misappropriation theory. Following an inspection of the issuer's disclosure controls and a regulatory talk with its audit committee, the issuer has agreed to a consent order without admitting or denying the findings. The former officer has entered a plea deal. The criminal charges remain allegations that must be proven beyond a reasonable doubt at trial.","zh":"美国司法部与证监会今日宣布，对一家上市发行人及其前投资者关系负责人提起平行诉讼。起诉书指控，其选择性沟通行为违反公平披露规则以及发行人对修订后全年指引作出及时披露的披露义务，构成证券欺诈。在民事诉讼中，证监会援引市场欺诈理论的推定，并备位援引盗用理论。在对该发行人的披露内控进行检查、并与其审计委员会进行监管约谈之后，该发行人已同意接受同意令，且不承认亦不否认相关认定。该前高管已达成认罪协议。刑事指控目前仍属指控，须在审判中达到排除合理怀疑的证明标准。"}},{"i":25,"ti":"他说隔离墙从来没有被越过，一次都没有","dom":"reg","sc":"合规与隔离墙","tx":"Dale Prentice 坐得很{{comfortable}}（舒服）。\n\n五十岁上下，浅灰西装，两名律师一左一右。走廊上挂着一排前任检察官的照片，像个小{{gallery}}（画廊）；他进来时说“这些人我认得一半”。这就是他的{{opening}}（开场）。\n\n她把录音设备推到桌子中间，说明今天不是{{hearing}}（听证），但内容可以用在将来的程序里。\n\n“我们做过{{internal investigation}}（内部调查）。”Prentice 说，“结论很清楚：{{Chinese wall}}（隔离墙）从来没有被越过。一次都没有。”\n\n他推过来一份摘要，封面上印着一行小字：受{{work product doctrine}}（工作成果豁免）保护。她早料到了：他们{{afford}}（负担得起）全城最贵的律所，而最贵的律所第一件事，就是把材料变成不可调取的东西。她当然不会{{rely}}（依赖）这份摘要。\n\n制度写得漂亮：业绩前后有{{blackout period}}（禁止买卖期），客户大单信息严禁外泄，任何形式的{{front running}}（抢先交易）一经发现即刻解雇。手册里连族裔与{{ethnic}}（种族的）多元政策都写了两页——唯独“重大信息”的定义写得极其{{liberal}}（宽泛的），宽到什么都能装进去。\n\n“那通电话怎么解释？”Elena 问，“发指引之前四十分钟，你们合规部的线路，接了一通四分十一秒的来电。”\n\nPrentice 没有{{angry}}（生气）。他甚至笑了一下，说这正好证明制度在运转：香港的关联机构按流程报备了一项即将公开的事项，合规部据此把标的放进限制名单。程序上，这不是{{selective disclosure}}（选择性披露），是内控。\n\n“有录音吗？”\n\n“合规部的线路默认不录，”他说，“系统只{{capture}}（抓取）交易台的通话。”\n\nElena 写下这句话，笔尖压得很重。她的{{chest}}（胸口）有点发紧——不是因为他在撒谎，是因为他可能没有。\n\n她换了个方向，问{{disclosure of interests}}（权益披露）：谁在那只票据上持有权益。律师递上一份表格。她又问，有没有人因为这件事被{{reprimand}}（谴责）过。有一位分析员在窗口期误下了一笔个人交易，收到书面警告。\n\n“Prentice 先生，”Elena 说，“你要理解我的{{priority}}（优先级）。我不是来{{investigate}}（调查）你们的员工手册的。如果这条链上有人构成{{conspiracy}}（共谋），或者钱在中间做过{{money laundering}}（洗钱），我会把它拆到底。到那时候，第一个愿意{{plead guilty}}（认罪）的人拿最好的条件。”\n\n她停住，让{{stress}}（强调）落地。这不是威胁，是一个{{prospect}}（前景）。\n\n两名律师低头记东西。Prentice 说他理解，但想强调一点：{{Rule 10b-5}}（反欺诈条款）要的是欺骗，而他们每一步都留了痕迹，没有一步是藏着做的。至于谁是{{tippee}}（内幕信息接受人）——他摊了摊手——你得先证明有人是消息源。\n\n问话到第三个小时，楼下那家{{Japanese}}（日式的）餐厅开始派外卖。这不是什么{{emergency}}（紧急状况），Elena 提醒自己，急的人容易犯错。\n\n散场前她问了最后一个问题，随意得像闲话：那只票据的每日估值文件，除了内部还发给过谁？\n\nPrentice 想了两秒，说这个安排其实很{{unique}}（独特的），只有一个外部机构长期收，因为对方是最大的持有人之一。\n\n他报了名字：Halberd Partners。\n\nElena 把它写在纸上，圈了一下。她心里冒出一个不太合适的{{notion}}（念头）：这是整个案子里第一件带点{{beauty}}（美感）的事——一条断了很久的线突然接上了。她同时意识到，{{Division of Enforcement}}（执法部）那边的同事，可能早就在查同一批人。","ft":[{"w":"Division of Enforcement","z":"执法部","d":"证监会内部负责调查与提起指控的部门，是执法案件的主办方","a":"","p":""},{"w":"Rule 10b-5","z":"反欺诈条款","d":"美国证券法核心反欺诈规则，是内幕交易与虚假陈述的依据","a":"","p":""},{"w":"blackout period","z":"窗口期；禁止买卖期","d":"业绩公布前等敏感时段，内部人不得买卖本公司股票","a":"","p":""},{"w":"conspiracy","z":"共谋","d":"两人以上合谋实施违法行为的独立罪名，无需既遂","a":"","p":"kәn'spirәsi"},{"w":"disclosure of interests","z":"权益披露","d":"港股要求大股东与董事申报持股及其变动的制度","a":"DI","p":""},{"w":"front running","z":"抢先交易","d":"利用客户大额订单信息先行下单获利，属背信违规行为","a":"","p":""},{"w":"internal investigation","z":"内部调查","d":"公司自行聘请律所核查违规线索并向监管汇报的程序","a":"","p":""},{"w":"money laundering","z":"洗钱","d":"将非法所得通过交易转换为合法外观资金的犯罪行为","a":"","p":"ˈmʌni ˈlɔ:ndərɪŋ"},{"w":"plead guilty","z":"认罪","d":"被告在法庭上承认控罪，案件直接进入量刑阶段","a":"","p":""},{"w":"reprimand","z":"谴责；批评","d":"纪律处分的一种，公开或私下指出违规并记录在案","a":"","p":"'reprimɑ:nd"},{"w":"selective disclosure","z":"选择性披露","d":"只向部分分析师或投资者透露未公开信息，属违规行为","a":"","p":""},{"w":"tippee","z":"内幕信息接受人","d":"从知情人处获得内幕消息并据此交易的一方，同受追责","a":"","p":"ti'pi:"},{"w":"work product doctrine","z":"工作成果豁免","d":"律师为应诉准备的分析材料可免于被对方调取的规则","a":"","p":""}],"iw":[{"w":"comfortable","p":"'kʌmfәtәbl","t":"a. 舒服的, 轻松的; n. 盖被"},{"w":"angry","p":"'æŋgri","t":"a. 生气的, 愤怒的"},{"w":"investigate","p":"in'vestigeit","t":"v. 调查, 审查"},{"w":"hearing","p":"'hiәriŋ","t":"n. 听, 听觉, 听讯; 听, 听觉"},{"w":"gallery","p":"'gælәri","t":"n. 走廊, 最高楼座, 画廊, 收集, 图库; 图库"},{"w":"notion","p":"'nәuʃәn","t":"n. 概念, 观念, 想法, 打算, 别致的小东西; 概念, 打算, 想法"},{"w":"capture","p":"'kæptʃә","t":"n. 抓取, 战利品, 捕获之物; vt. 抓取, 获得, 迷住; 截获命令"},{"w":"chest","p":"tʃest","t":"n. 胸, 胸部, 衣柜, 箱子; 胸, 胸廓"},{"w":"Japanese","p":".dʒæpә'ni:z","t":"n. 日本人, 日语; a. 日本的, 日语的"},{"w":"afford","p":"ә'fɒ:d","t":"vt. 买得起, 足以, 给予"},{"w":"beauty","p":"'bju:ti","t":"n. 美, 美人"},{"w":"prospect","p":"'prɒspekt","t":"n. 景色, 展望; vt. 勘探, 勘察; vi. 勘探, 有前途"},{"w":"emergency","p":"i'mә:dʒәnsi","t":"n. 紧急状况, 紧急事件, 紧急需要; 紧急情况"},{"w":"unique","p":"ju:'ni:k","t":"a. 独一无二的, 独特的, 稀罕的"},{"w":"ethnic","p":"'eθnik","t":"a. 人种的, 种族的; 人种的"},{"w":"priority","p":"prai'ɒriti","t":"n. 优先权, 优先; 优先级"},{"w":"opening","p":"'әupәniŋ","t":"n. 开始, 口子, 穴, 揭幕; a. 开始的"},{"w":"stress","p":"stres","t":"n. 压力, 紧迫, 强调, 重音, 重点, 应力; vt. 加压力于, 着重, 重读"},{"w":"rely","p":"ri'lai","t":"vi. 信赖, 依赖, 信任"},{"w":"liberal","p":"'libәrәl","t":"n. 自由主义者; a. 慷慨的, 不拘泥的, 宽大的, 自由主义的"}],"doc":{"k":"内部合规邮件","en":"From: Office of the Chief Compliance Officer. To: All Investment and Trading Staff. Subject: Reminder — Information Barriers. A blackout period now applies to every name on the restricted list. Our internal investigation, conducted with outside counsel and protected by the work product doctrine, has identified no instance in which the firm's information barrier was crossed. Staff are reminded that selective disclosure of client information, or any front running of a client order, may violate Rule 10b-5 and may expose the firm to allegations of conspiracy or money laundering. Any person who receives non-public information as a tippee must escalate it the same day. The Division of Enforcement has requested our disclosure of interests filings. Breaches will result in a written reprimand, and staff who plead guilty to any related offence will be terminated.","zh":"发件人：首席合规官办公室。收件人：全体投资与交易人员。主题：提醒——信息隔离。限制名单上的每一只标的现已适用禁止买卖期。我们在外部律师协助下开展的内部调查（受工作成果豁免保护）未发现本公司信息隔离墙被越过的任何情形。提醒各位：对客户信息的选择性披露，或对客户订单的任何抢先交易，均可能违反反欺诈条款，并可能使公司面临共谋或洗钱的指控。任何作为内幕信息接受人取得未公开信息的人员，必须于当日上报。执法部已要求我们提交权益披露备案文件。违规者将受到书面谴责；对任何相关罪名认罪的员工将被解雇。"}},{"i":26,"ti":"底稿在四千公里外，而我的传票到不了那儿","dom":"reg","sc":"跨境监管","tx":"Elena 花了三天才{{appreciate}}（领会）这件事到底有多难。\n\n传票发出去两周，回来的材料堆了半张桌子：开户表、划款指令、董事名册，全是形式上的。她真要的那份不在里面——那一万多笔应收账款背后的审计底稿，纸质的，锁在中国境内一家会计师事务所的档案室里，她的传票在那个地址上不产生效力。\n\n助理检察官 Ruiz 坐红眼航班回来，从{{airport}}（机场）直接过来，衬衫皱得像团纸。他把一沓文件摔在桌上：“香港那边非常客气，客气到什么都没给我们。”\n\n香港那层派出来的是他们的{{responsible officer}}（负责人员），一位姓何先生，客气得挑不出毛病：香港这家公司只是通道，账簿在内地；上市主体在港交所有自己的{{continuing obligations}}（持续披露义务），该披的都披了，其余不归他管。\n\n“他还说，如果我们要底稿，{{ultimately}}（最终）得走两地之间那份合作备忘录。”\n\nElena 把备忘录调出来，把相关那段{{passage}}（段落）读了两遍。写得很{{attractive}}（有吸引力的）：双方应在互惠基础上相互提供协助。但每个动词后面都跟着一个条件从句。这条路只有一条{{lane}}（单行道），还限速。\n\n于是她想了一个{{alternative}}（替代方案）：不去要底稿，去要底稿的影子。\n\n她让 Ruiz 掉头，从钱那一端往回摸。第一站是{{Financial Crimes Enforcement Network}}（美国金融犯罪执法局）：通道公司在美国这一侧的全部申报记录。银行的{{know your customer}}（客户身份识别）档案里，实际控制人填的是一位二十四岁的秘书，学历栏空着——典型的{{nominee account}}（代名人账户），名字在前面，人在后面。再往下一层，有个名字被系统标成了{{politically exposed person}}（政治公众人物）：申报人是某地一位退休官员的女婿。系统打了标记，然后放行。Elena 读到这里有点{{sick}}（恶心），不是因为罕见，恰恰因为太不罕见。\n\n唯一主动交上来的，是三年前一份{{Schedule 13D}}（大额持股披露表），申报人是家名字很干净的资管公司，声明有意“参与被投企业的治理
