hen follow rapidly, and any consent solicitation may not succeed.","zh":"风险因素——我们的债务。本票据依据 144A 规则向合格机构投资者发售，未经注册登记。我们的债务期限结构较为集中，存续票据信用利差的走阔可能显著抬高我们未来的融资成本。我们的主体评级近期已被列为负面展望。评级若进一步下调，我们将成为堕落天使，并可能迫使挂钩指数的持有人被动卖出。本票据设有产生性契约，但仅设有范围有限的维持性契约。若我们未能支付利息且未在适用的宽限期内补正，持有人可宣布本票据加速到期。其后可能迅速出现流动性紧张，且任何征求同意程序均未必能够成功。"}},{"i":40,"ti":"交叉违约在第一百零七页","dom":"credit","sc":"契约条款","tx":"我是在第一百零七页找到它的。\n\n那天办公室空调坏了，窗外是 {{bay}}（海湾）的反光，白得晃眼。我把募集说明书打印出来，一页一页翻，桌上放着早上买的一杯 {{juice}}（果汁），到中午已经温了。\n\n第一百零七页，标题叫 Events of Default。往下第四款——{{event of default}}（违约事件）里明明白白写着交叉违约：只要发行人或其任何重要附属公司在其他债务上违约，且未偿本金总额超过两千万美元，本期票据即可被宣布加速到期。\n\n我把那一款读了三遍，然后打开另一份文件。\n\n那是我上个月存下来的、这家公司境内那家合作方的资料。那家合作方挂在一个 {{local government financing vehicle}}（城投平台）底下，做的是园区基建。它所在的县是个国家级 {{poverty}}（贫困）县，一年的财政收入还不如这家公司报表上一个季度的利润。当地那些项目的 {{hidden debt}}（隐性债务）从来没有真正 {{visible}}（可见的）过，你只能从担保清单和银行授信的边角料里往回猜。\n\n如果那边先炸——而不是这家公司自己先炸——交叉违约条款一样会响。\n\n这就是 {{contagion}}（风险传染）真正的样子：不是恐慌，是合同条款把两个看上去毫不相干的主体绑在了一起。\n\n我把这条链画在纸上，越画心跳越快，那种 {{intense}}（强烈的）感觉不太好受。我起身倒了杯水，让 {{mood}}（心情）平下来一点，再回去 {{adjust}}（调整）我的模型。\n\n我重新算了两个指标。{{interest coverage ratio}}（利息保障倍数）：如果把虚增的那部分收入剔掉，只剩零点七，也就是说赚的钱连利息都不够付。{{cash to short-term debt}}（现金短债比）：零点三一。这个数字很 {{amazing}}（令人惊异的），但不是好的那种惊异。\n\n再往前翻，还有几条我之前跳过的。{{negative pledge}}（禁止设定抵押条款）写了，但例外条款列了整整一页半，等于开了个后门。整只债其实相当接近 {{covenant-lite}}（弱契约）：条款保护松，投资人真出事的时候手里没牌。有一笔 {{floating rate note}}（浮息债）附在后面，票息随基准重置，久期风险小，但 {{convexity}}（凸性）在利率大幅波动时会咬人。至于 {{accrued interest}}（应计利息），二级市场现在的报价已经把它当成了一个几乎不会兑现的数字。\n\n发行的时候完全不是这个气氛。我调出当年的 {{presentation}}（路演材料），做得像实验室成果发布会——那些中试线的照片、{{laboratory}}（实验室）里穿白大褂的人、一张全厂 {{electricity}}（用电量）负荷曲线，用来证明产能是真的。就是那张图，三年前把我 {{inspire}}（启发）到了，也把我骗了：我后来去现场核过，那条曲线跟电网的实际取数对不上。\n\n{{book building}}（簿记建档）阶段据说超额认购十几倍，定价压到区间下限，报道写得跟一出 {{drama}}（戏剧）一样：全球投资人抢购中国新材料。承销团当时把这单当作最有 {{competitive}}（竞争力的）的样本案例到处讲。还有 {{NDRC registration}}（发改委备案登记），额度批下来那天公司发过一条公告，语气骄傲得不行。\n\n现在这只债在二级市场的报价是三十七块，标准的 {{junk bond}}（垃圾债），甚至已经进了一部分基金的 {{distressed debt}}（困境债）名单。评级机构上周把它放进了 {{credit watch}}（信用观察名单），比展望更急一档。\n\n我知道接下来会发生什么。先是找持有人谈 {{maturity extension}}（展期），谈不下来就是 {{debt restructuring}}（债务重组），削本金、降票息、拉长年限，中间还会夹一堆 {{penalty}}（罚息）的算法，谁都算不清。\n\n那不是 {{temporary}}（暂时的）困难。这个词在公告里会出现，但没有人当真。\n\n我把那一页拍下来发给 Ray，只写了一句：交叉违约在第一百零七页。\n\n他回得很快：这一条不 {{enhance}}（增强）你的报告，它改变你的报告。\n\n我明白他的意思。到这一步，我们要写的已经不只是一家公司在 {{owe}}（亏欠）多少钱，而是这些债背后的 {{wealth}}（财富）到底是谁的、又是从哪里来的。\n\n晚上十一点，Danny 发来一条消息：审计师那边有动静。\n\n我看着屏幕，第一次觉得这事的结局可能不是我赢或者他赢，而是一场谁都收不了场的 {{disaster}}（灾难）。","ft":[{"w":"NDRC registration","z":"发改委备案登记","d":"中资企业境外发债需完成的外债额度登记程序","a":"NDRC","p":""},{"w":"accrued interest","z":"应计利息","d":"上一付息日到交易日之间累积但尚未支付的利息","a":"","p":""},{"w":"book building","z":"簿记建档","d":"承销商收集投资人订单以确定发行价格的过程","a":"","p":""},{"w":"cash to short-term debt","z":"现金短债比","d":"货币资金与一年内到期债务之比，看短期偿债安全垫","a":"","p":""},{"w":"contagion","z":"风险传染","d":"个别主体违约引发同板块其他发行人利差集体走阔","a":"","p":"kәn'teidʒәn"},{"w":"convexity","z":"凸性","d":"久期之外的二阶修正，利率大幅变动时才会明显体现","a":"","p":"kɒn'veksiti"},{"w":"covenant-lite","z":"弱契约","d":"契约保护条款明显放松的债务，投资人保护较弱","a":"cov-lite","p":""},{"w":"credit watch","z":"信用观察名单","d":"评级机构提示短期内可能调级，比展望更紧迫","a":"","p":""},{"w":"debt restructuring","z":"债务重组","d":"通过展期、降息或削债重新安排偿债条件","a":"","p":""},{"w":"distressed debt","z":"困境债；折价债","d":"价格深度折价、市场已计入重组预期的债券","a":"","p":""},{"w":"event of default","z":"违约事件","d":"募集文件中列明的、可触发加速到期的具体情形","a":"","p":""},{"w":"floating rate note","z":"浮息债","d":"票息随基准利率浮动重置的债券，久期风险很小","a":"FRN","p":""},{"w":"hidden debt","z":"隐性债务","d":"未纳入政府显性债务口径但实际由地方承担的负债","a":"","p":""},{"w":"interest coverage ratio","z":"利息保障倍数","d":"息税前利润对利息支出的覆盖倍数，看付息压力","a":"","p":""},{"w":"junk bond","z":"垃圾债","d":"高收益债的口语说法，财经报道里出现频率很高","a":"","p":"dʒʌŋk bɔnd"},{"w":"local government financing vehicle","z":"城投平台","d":"地方政府设立的基建投融资主体，信用与地方财政高度绑定","a":"LGFV","p":""},{"w":"maturity extension","z":"展期","d":"把到期日往后推，是境内外最常见的纾困安排","a":"","p":""},{"w":"negative pledge","z":"禁止设定抵押条款","d":"限制发行人把资产抵押给其他债权人的约定","a":"","p":""}],"iw":[{"w":"amazing","p":"ә'meiziŋ","t":"a. 令人惊异的"},{"w":"intense","p":"in'tens","t":"a. 非常的, 强烈的, 紧张的, 热情的; 强的"},{"w":"electricity","p":".ilek'trisiti","t":"n. 电, 电流, 电学, 热情, 电力供应; 电学; 电"},{"w":"penalty","p":"'penәlti","t":"n. 处罚, 刑罚, 罚款, 罚球, 报应, 不利结果, 妨碍; 罚金(款), 违约金"},{"w":"inspire","p":"in'spaiә","t":"vt. 使感动, 激发, 启示, 吸入, 鼓舞, 产生, 使生灵感; vi. 吸入, 赋予灵感"},{"w":"adjust","p":"ә'dʒʌst","t":"vt. 调整, 使适应于, 校准; vi. 适应于, 被调节, 相互熟悉而适应"},{"w":"temporary","p":"'tempәrәri","t":"a. 暂时的, 临时的; n. 临时工, 临时雇员; 临时"},{"w":"visible","p":"'vizәbl","t":"a. 看得见的, 明显的, 显然的; n. 可见物"},{"w":"competitive","p":"kәm'petitiv","t":"a. 竞争的; 竞争的"},{"w":"drama","p":"'drɑ:mә","t":"n. 戏剧, 戏剧艺术"},{"w":"juice","p":"dʒu:s","t":"n. 汁, 活力, 体液; vt. 挤出汁来, 加汁"},{"w":"wealth","p":"welθ","t":"n. 财富, 资源, 财产, 丰富, 富裕, 大量; 财富"},{"w":"presentation","p":".prezәn'teiʃәn","t":"n. 赠与, 描述, 介绍; 简报"},{"w":"laboratory","p":"'læbrәtәri","t":"n. 实验室, 研究室, 化工厂; 实验室, 检验室, 化验室"},{"w":"disaster","p":"di'zɑ:stә","t":"n. 灾祸, 不幸, 彻底失败"},{"w":"owe","p":"әu","t":"vt. 亏欠, 负...债, 归功于, 怀有, 应给予, 感恩; vi. 欠钱"},{"w":"mood","p":"mu:d","t":"n. 心情, 气氛, 生气, 基调; 心境"},{"w":"bay","p":"bei","t":"n. 海湾, 狗吠声, 月桂; vt. 吠, 使走投无路; vi. 吠"},{"w":"enhance","p":"in'hæns","t":"vt. 提高, 加强, 增加"},{"w":"poverty","p":"'pɒvәti","t":"n. 贫穷, 贫困, 缺乏; 贫乏, 缺乏"}],"doc":{"k":"债券募集说明书的条款说明","en":"Terms and Conditions — Condition 10 (Events of Default). An event of default occurs if the Issuer fails to pay principal or accrued interest when due, or if any indebtedness of the Issuer or a Material Subsidiary is accelerated (cross-default). The Issuer covenants to comply with the negative pledge in Condition 8 and to maintain an interest coverage ratio of not less than 2.0 times and a cash to short-term debt ratio of not less than 1.0 times. Holders should note that these Notes are otherwise covenant-lite. Placement on credit watch, any maturity extension, or the commencement of a debt restructuring may cause the Notes to trade as distressed debt or as a junk bond. The offering follows completion of NDRC registration.","zh":"条款与条件——第 10 条（违约事件）。若发行人未能于到期日支付本金或应计利息，或发行人及任何重要附属公司的任何债务被宣布加速到期（交叉违约），即构成违约事件。发行人承诺遵守第 8 条项下的禁止设定抵押条款，并维持利息保障倍数不低于 2.0 倍、现金短债比不低于 1.0 倍。持有人应注意，除上述约定外，本票据属于弱契约。若被列入信用观察名单、发生任何展期，或启动债务重组程序，本票据可能按困境债或垃圾债的水平交易。本次发行已在完成发改委备案登记后进行。"}},{"i":41,"ti":"上一次是怎么走的","dom":"credit","sc":"违约与重组","tx":"老周把一个牛皮纸袋推到我面前，说：上一次，是这么走的。\n\n袋子边角磨得起毛，胶带换过至少三次。里面是十年前的一份重组方案，一家做建材的民企，路径跟东亚新能源像到让我后背发凉——先扩产，后发债，再暴雷。这份复印件在他{{possession}}（占有）里放了十年。他说他想不明白，所以一直留着。\n\n那天是{{Tuesday}}（星期二），维港上空灰得像块旧布。\n\n我一页页往下翻。出事前一年，境外那笔债是按 {{Reg S}}（面向美国境外投资人的发行豁免）发的，只卖给美国以外的机构，{{coupon}}（票息）九个点，典型的{{high yield}}（高收益债），结构是{{bullet maturity}}（到期一次还本）——存续期内只付息，本金全压在最后一天。条款里还写着{{change of control put}}（控制权变更回售权），实控人一换，投资人就能按面值把债塞回去。\n\n“先看{{ratio}}（比率）。”老周敲了敲一张表。那年它的{{net debt to EBITDA}}（净负债与EBITDA之比）从三点二跳到六点八。评级机构的{{downgrade}}（下调评级）来得很快，从{{investment grade}}（投资级）掉出去只用了十一周。掉出去那天，境外{{credit bond}}（信用债）一夜被砍掉三成——大批只配投资级的资金必须卖，不是不想拿，是章程不许拿。\n\n“这就是{{psychological}}（心理上的）那一层。”他说，“评级不是判断，是许可证。”\n\n我问，然后呢。\n\n然后是{{exchange offer}}（交换要约）。新债换旧债，把三年内的{{maturity wall}}（到期高峰）往后推五年，票息从九降到四点五。债权人分成两派，激进的那派提了个很{{radical}}（激进的）方案：要么把核心资产抵押过来，要么全体拒绝，直接触发{{cross-acceleration}}（交叉加速到期）——只要有一笔债被宣布加速，其他人也能同时上桌。\n\n“你猜谁赢了。”\n\n我没猜。他自己答：谁都没赢。债权人组了{{alliance}}（联盟），开了七次会，最后还是接了要约，因为不接的结果是清盘，拿回来更少。他们唯一{{accomplish}}（达到）的，是把顺位往前挪了半格。\n\n那家公司还有一只可转债。暴雷前股价被推得很高，{{conversion premium}}（转股溢价率）一度只有百分之三；公司随即启动{{forced conversion}}（强制赎回），把债主一次性变成股东。半年后，这批人手里的{{certificate}}（凭证）不值一张纸。\n\n“最难看的是这个。”他抽出最后一页，是一份{{keepwell deed}}（维好协议）。境内母公司白纸黑字承诺维持境外子公司的偿付能力，法庭上却被认定不构成担保。写得漂亮，一分钱执行不了。投资人的{{anger}}（愤怒）全撒在这四个字上。\n\n我问：钱最后从哪来的？\n\n“地方上。”那两年正好在推{{debt swap program}}（债务置换），用低成本长期限的{{local government special bond}}（地方政府专项债）去换存量高息债务。市里兜了一部分底，条件是厂区和土地划回国资。真正的{{spending}}（开支）不在报表上，在财政里。那年出来讲话的是个大学{{chancellor}}（校长）出身的官员，讲了四十分钟，没提“救助”两个字。\n\n回去路上我一直在想：这套东西我们能{{evaluate}}（评估）、能{{monitor}}（监控）——终端上把{{digital}}（数字的）报价一档档翻，看每天的{{bid}}（买价）跌多少个{{basis point}}（基点）；把它的{{expansion}}（扩张）节奏跟同行对，看谁的钱是自己挣的。市场的{{custom}}（惯例）是等评级动了再动，可评级永远最后一个到。\n\n晚上 Ray 发来消息：信用市场的传闻像{{missile}}（导弹），发出去就召不回，所以按下之前你得确定坐标。\n\n我回：你要我确定到什么程度。\n\n他没答。二十分钟后他改了口，说这周他约了东亚新能源两个前员工吃饭，走公司的{{entertainment}}（招待）预算，问我去不去。\n\n我去。因为我已经不{{dependent}}（依赖）于公开文件了——上一次的剧本我拿到了，我缺的是这一次的人。","ft":[{"w":"Reg S","z":"Reg S","d":"面向美国境外投资人发行的豁免条款，中资美元债最常用","a":"Reg S","p":""},{"w":"basis point","z":"基点","d":"万分之一，债券收益率和利差的标准计量单位","a":"bp","p":""},{"w":"bullet maturity","z":"到期一次还本","d":"存续期内只付息、到期日一次性偿还全部本金","a":"","p":""},{"w":"change of control put","z":"控制权变更回售权","d":"实控人变更时投资人有权要求按面值回售","a":"","p":""},{"w":"conversion premium","z":"转股溢价率","d":"转债价格高于其转股价值的比例，反映期权价值","a":"","p":""},{"w":"coupon","z":"票息；票面利率","d":"债券按面值每年支付的利息比例，是持有期现金流的来源","a":"","p":"'ku:pɒn"},{"w":"credit bond","z":"信用债","d":"相对利率债而言、含信用风险的公司类债券","a":"","p":""},{"w":"cross-acceleration","z":"交叉加速到期","d":"他项债务被宣布加速到期时本债也可被要求提前偿还","a":"","p":""},{"w":"debt swap program","z":"债务置换","d":"用低成本长期限政府债替换存量高息隐性债务","a":"","p":""},{"w":"downgrade","z":"下调评级","d":"评级机构调低评级等级，往往触发被动抛售","a":"","p":"'dajn^reid"},{"w":"exchange offer","z":"交换要约","d":"以新债换旧债的方式延后偿付并调整条款","a":"","p":""},{"w":"forced conversion","z":"强制赎回；强赎","d":"股价触发条件后发行人赎回以逼迫投资人转股","a":"","p":""},{"w":"high yield","z":"高收益；高息债","d":"评级低于投资级、以高票息补偿信用风险的债券","a":"HY","p":""},{"w":"investment grade","z":"投资级","d":"BBB-或Baa3以上的评级区间，机构资金主要配置范围","a":"IG","p":""},{"w":"keepwell deed","z":"维好协议","d":"境内母公司承诺维持境外子公司偿付能力，法律约束力偏弱","a":"","p":""},{"w":"local government special bond","z":"地方政府专项债","d":"以项目收益偿还、纳入政府性基金预算的地方债","a":"","p":""},{"w":"maturity wall","z":"到期高峰；偿债墙","d":"某一时段集中到期的大额债务，市场最关注的时间点","a":"","p":""},{"w":"net debt to EBITDA","z":"净负债与EBITDA之比","d":"衡量偿债年限的核心杠杆指标，评级下调常引用","a":"","p":""}],"iw":[{"w":"possession","p":"pә'zeʃәn","t":"n. 拥有, 占有, 所有, 财产, 领土, 领地, 自制, 着迷; 占有, 持有"},{"w":"spending","p":"'spendiŋ","t":"n. 经费, 开销; 开支, 开销, 经费"},{"w":"evaluate","p":"i'væljueit","t":"vt. 评估, 评价, 赋值"},{"w":"certificate","p":"sә'tifikeit","t":"n. 证书, 证明书; vt. 发给证明书, 用证书批准, 用证书证明"},{"w":"custom","p":"'kʌstәm","t":"n. 习惯, 风俗, 海关, 自定义; a. 定制的; 定制; 自定义"},{"w":"accomplish","p":"ә'kʌmpliʃ","t":"vt. 完成, 达到, 实现, 使完美"},{"w":"Tuesday","p":"'tju:zdi","t":"n. 星期二"},{"w":"monitor","p":"'mɒnitә","t":"n. 监督器, 级长, 监听员, 班长, 监视器, 告诫物; v. 监视, 监听, 监督; 监视器, 监视程序; 监视"},{"w":"entertainment","p":".entә'teinmәnt","t":"n. 娱乐, 款待, 娱乐表演"},{"w":"alliance","p":"ә'laiәns","t":"n. 联盟, 联合; 同盟, 联盟, 联姻"},{"w":"dependent","p":"di'pendәnt","t":"n. 依赖他人者; a. 依赖的, 从属的"},{"w":"digital","p":"'didʒitәl","t":"a. 数字显示的, 数字的; n. 数字仪表, 数字式电子表(或时钟); 数字, 数字式"},{"w":"bid","p":"bid","t":"n. 出价; v. 命令, 吩咐, 请求, 表示, 宣布, 投标"},{"w":"expansion","p":"ik'spænʃәn","t":"n. 扩充, 开展, 膨胀; 扩展"},{"w":"psychological","p":".saikә'lɒdʒikәl","t":"a. 心理学的, 精神上的, 心灵的; 心理上的, 心理学的"},{"w":"radical","p":"'rædikl","t":"n. 激进分子, 词根, 基础, 根式, 根; a. 激进的, 根本的, 基本的, 根的"},{"w":"anger","p":"'æŋgә","t":"n. 忿怒; vt. 激怒, 使发怒; vi. 发怒"},{"w":"chancellor","p":"'tʃɑ:nsәlә","t":"n. 大臣, 总理, 首相, 大使馆/领事馆的一等秘书, 司法官, 大学校长"},{"w":"ratio","p":"'reiʃәu","t":"n. 比, 比率; 比, 比率, 比例"},{"w":"missile","p":"'misail","t":"n. 发射物, 导弹, 飞弹, 火箭; a. 可发射的"}],"doc":{"k":"债券募集说明书的风险因素段","en":"Risk Factors. The Notes are offered outside the United States in reliance on Reg S and constitute senior obligations of the Issuer bearing a fixed coupon payable semi-annually, with a bullet maturity. Holders should note that the Notes are rated below investment grade and trade as high yield credit bond instruments; a downgrade may compel certain institutional holders to dispose of their positions within a short period. The indenture contains a change of control put and a cross-acceleration provision. Any deterioration in the Group's net debt to EBITDA, or a concentrated maturity wall, may require the Issuer to launch an exchange offer. Credit support is limited to a keepwell deed, which does not constitute a guarantee.","zh":"风险因素。本票据依据 Reg S 面向美国境外发售，构成发行人的高级债务，按固定票息每半年支付，到期一次还本。持有人应注意，本票据评级低于投资级，按高收益信用债交易；一旦评级下调，部分机构持有人可能被迫在短期内卖出。契约中载有控制权变更回售权与交叉加速到期条款。若本集团净负债与EBITDA之比恶化，或出现集中的到期高峰，发行人可能需要推出交换要约。相关增信安排仅限于一份维好协议，该协议并不构成担保。"}},{"i":42,"ti":"展望负面，二十六个单词","dom":"credit","sc":"评级迁移","tx":"评级机构的公告只有一句话。\n\n“展望由稳定调整为负面，反映我们对该发行人收入质量及应收账款回款能力的关注。”\n\n一句话，二十六个英文单词。Danny 在群里回了个问号：就这？我说：就这。\n\n在信用市场，一句话值很多钱。{{credit rating}}（信用评级）本身没动，还挂在原来那档，但展望负面是信号弹。市场比公告诚实：那只{{callable bond}}（可赎回债券）的{{clean price}}（净价）当天跌了四个点，{{Z-spread}}（零波动利差）从两百八十走到三百六十。\n\n我们那间小{{chamber}}（会议室）里四条线一起往下掉，画面有点{{disorder}}（混乱）。Danny 说，这条曲线终于开始{{rapid}}（迅速）地长得像一条正常的信用曲线了。\n\nRay 站在门口没进来，只说：别高兴。评级机构不是先知，它是{{clinic}}（诊所）——病人排队，医生三分钟，看的是病历不是病人。它对造假不{{sensitive}}（敏感），只对已经发生的{{phenomenon}}（现象）反应。\n\n那天下午我把它的信用结构又拆了一遍。\n\n境内主体有一只永续债，条款写着{{coupon deferral}}（递延付息）——可以推迟付息，且不构成{{default}}（违约）。一家公司可以一分钱利息不付，还理直气壮说自己从未违约。同一只债有个首个赎回日，不赎回也不算错，只是投资人得承担{{extension risk}}（不赎回风险），久期被动拉长。等于{{issuer}}（发行人）手里多了两次拖延的机会。\n\n转债那边，股价早跌破了{{conversion price}}（转股价），条款里的{{downward revision of conversion price}}（下修转股价）迟迟没启动；{{bond floor}}（债底）成了唯一支撑——当纯债估，下限在八十二块附近。可它现在报七十四。市场已经不信债底了。\n\n真正让我停下来的是{{cross-default}}（交叉违约）那一条。上个月我在募集说明书里找到它时只觉得是技术细节，现在配上展望负面，它是一根引线：任何一笔债出现{{missed coupon payment}}（未按时付息），先进宽限期，宽限期一过，所有债一起视同违约。\n\n评级报告里还有两个加分项。一是{{implicit government support}}（政府隐性支持）——它的基地在省级园区，评级机构默认关键时刻有人兜底，直接给了两个子级。二是大股东那封{{letter of support}}（安慰函），措辞恳切，法律上一文不值。我把这两项剔掉重算，档位往下掉三级。\n\n老周在电话那头笑了一声。他是这个市场的{{veteran}}（老手），八十年代就在看这些。他说：你去看它最近一次发债的{{new issue concession}}（新发溢价）。\n\n我去看了。同一个发行人，存量债收益率七点二，新发那笔给到九点一。将近两百个基点——这不是定价，是求人。这数字比任何评级都{{pure}}（纯粹）。它的{{gearing}}（净负债率）在年报里写四十八，看着挺{{adequate}}（说得过去的），可分母是被应收账款撑起来的。如果真出事，我按抵押物覆盖倒推，{{loss given default}}（违约损失率）在七成以上。\n\n晚上我一个人留下。楼下是节前的铜锣湾，全是{{tourist}}（观光客），{{festival}}（节日）的灯箱亮成一片。我翻到评级报告最后一页，页脚是分析师的名字和资历，{{qualification}}（资格）那栏印着 {{Cambridge}}（剑桥）。我盯了一会儿，觉得荒唐：一个在伦敦郊外读过三年书的人，用一句话决定了一批中国资产的价格。\n\n我又做了件笨功课：把它三年所有的{{transportation}}（运输）单据金额跟收入对了一遍，比率一年比一年低。收入在涨，货越来越少。这个{{tendency}}（趋势）三年了，没有一份评级报告提过。\n\n我把这页打印出来，塞进那份还没发的报告。手有点抖，不是{{nervous}}（紧张），是别的什么。\n\nRay 走过来，把外套搭在椅背上：市场里一半人靠{{luck}}（运气），我们不能靠。要不要{{toss}}（抛硬币）决定？\n\n我说不用。我们付得起这间办公室的{{rent}}（租金），也付得起律师的{{deposit}}（定金），我只想问一句——什么时候发。\n\n他看着我：等评级从展望负面变成真正下调那天，我们就没有先手了。","ft":[{"w":"Z-spread","z":"零波动利差","d":"让贴现现金流等于市价所需在即期曲线上平行加的点差","a":"","p":""},{"w":"bond floor","z":"债底","d":"把转债当作纯债估值得到的价格下限","a":"","p":""},{"w":"callable bond","z":"可赎回债券","d":"发行人有权在约定日期提前赎回，利率下行时对投资人不利","a":"","p":""},{"w":"clean price","z":"净价","d":"不含应计利息的报价方式，境外债券报价通行做法","a":"","p":""},{"w":"conversion price","z":"转股价","d":"可转债换成股票时使用的每股价格","a":"","p":""},{"w":"coupon deferral","z":"递延付息","d":"永续债允许发行人推迟支付利息且不构成违约","a":"","p":""},{"w":"credit rating","z":"信用评级","d":"评级机构对发行人或债项偿债能力给出的等级判断","a":"","p":""},{"w":"cross-default","z":"交叉违约","d":"一笔债务违约即视同其他债务同时违约的条款","a":"","p":""},{"w":"default","z":"违约","d":"未按约定支付本息或触发其他违约事件","a":"","p":"di'fɒ:lt"},{"w":"downward revision of conversion price","z":"下修转股价","d":"股价长期低迷时发行人调低转股价的条款","a":"","p":""},{"w":"extension risk","z":"不赎回风险","d":"发行人放弃首个赎回日行权，久期被动拉长","a":"","p":""},{"w":"gearing","z":"净负债率","d":"净负债占权益的比例，房企信用分析常用口径","a":"","p":"'giәriŋ"},{"w":"implicit government support","z":"政府隐性支持","d":"无书面担保但市场普遍预期政府会兜底的支持","a":"","p":""},{"w":"issuer","z":"发行人","d":"举债一方，可以是企业、金融机构或政府平台","a":"","p":"'iʃjuә"},{"w":"letter of support","z":"安慰函","d":"股东表达支持意愿但不构成法律担保的文件","a":"","p":""},{"w":"loss given default","z":"违约损失率","d":"违约发生后预计损失的比例，等于一减回收率","a":"LGD","p":""},{"w":"missed coupon payment","z":"未按时付息","d":"到付息日未支付票息，通常先进入宽限期","a":"","p":""},{"w":"new issue concession","z":"新发溢价","d":"新债相对同发行人存量债多给的那部分收益率","a":"NIC","p":""}],"iw":[{"w":"disorder","p":"dis'ɒ:dә","t":"n. 杂乱, 混乱; vt. 扰乱, 使失调"},{"w":"sensitive","p":"'sensitiv","t":"a. 敏感的, 易感的, 灵敏的, 感光的; 敏感的, 灵敏的, 感度高的"},{"w":"transportation","p":".trænspә'teiʃәn","t":"n. 运输, 输送, 交通车辆; 运转, 运输, 运输费"},{"w":"tendency","p":"'tendәnsi","t":"n. 趋向, 倾向; 趋向, 趋势"},{"w":"chamber","p":"'tʃeimbә","t":"n. 室, 房间, 枪膛; vt. 装(弹药), 把...关在室内; a. 室内的"},{"w":"deposit","p":"di'pɒzit","t":"n. 存款, 定金, 堆积物; vt. 存放, 堆积; vi. 沉淀"},{"w":"luck","p":"lʌk","t":"n. 运气, 幸运, 好运, 侥幸; vi. 靠好运成功"},{"w":"rent","p":"rent","t":"n. 租金, 房租, 出租物, 裂缝, 破裂处, 分裂; vt. 租用, 租出; vi. 出租; a. 分裂的, 破裂的; rend的过去式和过去分词"},{"w":"pure","p":"pjuә","t":"a. 纯的, 纯净的, 纯洁的, 清白的, 完美的, 无瑕的, 抽象的; 的, 纯净的"},{"w":"clinic","p":"'klinik","t":"n. 诊所, 临床教学; 诊所(门诊部); 临床(讲解); 临床(学)科"},{"w":"veteran","p":"'vetәrәn","t":"n. 老手, 退伍军人, 老兵, 老树; a. 老兵的, 老练的, 经验丰富的"},{"w":"phenomenon","p":"fi'nɒminәn","t":"n. 现象, 迹象, 表现, 奇迹, 奇才; 现象"},{"w":"nervous","p":"'nә:vәs","t":"a. 神经紧张的, 不安的, 神经的; 神经的; 神经质的, 神经过敏的"},{"w":"Cambridge","p":"'keimbridʒ","t":"n. 剑桥"},{"w":"tourist","p":"'tuәrist","t":"n. 观光客, 旅行者; a. 旅游的"},{"w":"festival","p":"'festәvәl","t":"a. 节日的, 喜庆的, 快乐的; n. 节日, 庆祝, 欢宴"},{"w":"qualification","p":".kwɒlifi'keiʃәn","t":"n. 资格, 条件, 限制; 限定"},{"w":"toss","p":"tɒs","t":"n. 投掷, 抛, 摇摆, 震荡, 掷钱币决定; vt. 投掷, 猛抬, 摇荡, 使不安, 掷钱币决定; vi. 被到处扔, 摇摆, 颠簸, 辗转, 掷钱币决定某事"},{"w":"adequate","p":"'ædikwәt","t":"a. 适当的, 足够的; 胜任的, 适当的, 充分的"},{"w":"rapid","p":"'ræpid","t":"a. 迅速的, 飞快的, 急促的, 陡的; n. 急流"}],"doc":{"k":"评级机构公告","en":"Outlook Revised to Negative; Credit Rating Affirmed. The outlook on the issuer has been revised to negative from stable, reflecting our concerns over revenue quality and receivable collection. We note that the perpetual instrument permits coupon deferral without constituting a default, and that investors bear extension risk should the first call date pass. A missed coupon payment on any obligation could trigger the cross-default provision across the capital structure. Our rating continues to incorporate two notches of implicit government support; the letter of support furnished by the controlling shareholder carries no legal force. Reported gearing remains within tolerance, but the new issue concession at the latest placement and the widening Z-spread indicate deteriorating market access and an elevated loss given default.","zh":"展望调整为负面；信用评级维持不变。该发行人的展望已由稳定调整为负面，反映我们对其收入质量及应收账款回款的关注。我们注意到，其永续债工具允许递延付息且不构成违约；若首个赎回日过后未行使赎回，投资人将承担不赎回风险。任何一笔债务出现未按时付息，均可能触发贯穿整个资本结构的交叉违约条款。我们的评级仍包含两个子级的政府隐性支持；控股股东出具的安慰函不具法律效力。披露的净负债率仍在容忍范围内，但最近一次发行的新发溢价以及零波动利差的走阔，显示其市场融资能力恶化，违约损失率上升。"}},{"i":43,"ti":"凌晨四点四十九分，我按了发送","dom":"fraud","sc":"做空报告","tx":"凌晨四点十七分，我把光标停在“发送”上，没有按。\n\n三十七页。两百一十四张照片。九点二兆。收件人栏里四百多个地址：卖方、买方、媒体、交易所、四家评级机构。这些邮箱我攒了三年。\n\n办公室只剩我一个。{{furniture}}（家具）是便宜的灰色板材，凌晨在屏幕反光里显得特别假。空调停了，机箱的{{frequency}}（频率）单调地嗡着。我去了趟{{bathroom}}（洗手间），用冷水洗了两遍脸，抬头看镜子时突然明白：按下去之后，这世界上再没有一个版本的我，是没写过这份报告的。\n\n我们改了九稿。第一稿很{{rough}}（粗糙的），全是感叹号，Ray 看两页就说这不是研究，是骂街。到第五稿——{{fifth}}（第五）稿——我们请了个{{designer}}（设计者）排版，把每条指控和它的证据编号绑死，一条一图，图下标日期、地点、来源。Ray 说，可信度不在结论，在于结论有多容易被别人自己验一遍。\n\n第一页不是论点，是{{position disclosure}}（持仓披露）：我们持有空头，会从下跌中获利。有人说这削弱说服力，Ray 说藏起来才会死。\n\n正文从第三页开始。\n\n一、{{fictitious revenue}}（虚增收入）。我们没写“我们认为它造假”，我们把三年的{{days sales outstanding}}（应收账款周转天数）画成一条线——从六十一天涨到两百四十七天。收入翻两倍，回款几乎没动。同行那条线是平的。两条线放一张图上，不需要解释。\n\n二、{{bad debt provision}}（坏账计提）。计提比例不到同行{{maximum}}（最大）值的五分之一，账龄两年以上的应收占四成，只提百分之一点二。\n\n三、照片。我们做了{{mystery shopping}}（神秘顾客暗访），假装采购方去了三个基地和七家所谓下游客户的厂区，拍停车场、电表箱、装卸区。江西那个基地的夜班照片里，只有门房亮着一盏灯，没有{{smoke}}（烟），没有车。连拍十一个月，形成一个可比的{{dimension}}（维度）：时间。\n\n四、人。{{insider selling}}（内部人减持）清单，三年里高管净卖出九点四亿港元。还有{{personnel}}（人事）异动表：四年三任财务负责人，最近一次{{CFO resignation}}（财务负责人离职）在审计进场前六周，公告理由是“个人时间安排”。\n\n五、钱。境外那笔{{offshore dollar bond}}（中资美元债）以一千美元{{par value}}（面值）为单位，条款写着{{pari passu}}（同顺位受偿），可它在境内还有一批{{onshore bond}}（境内债），实际顺序根本不是一回事。{{offering circular}}（发售通函）披露的担保范围，跟它在境内做的{{off-balance sheet debt}}（表外负债）对不上。{{option-adjusted spread}}（期权调整利差）我们也算了，剔掉赎回条款之后，市场给它的定价早已不是投资级公司的定价。\n\n最后一部分写的是“我们可能错在哪里”，四百字，三条自己都没排除的可能。老周坚持要加：一份没有{{awareness}}（自我意识）的报告，本质上是宣传。\n\n发之前有一道所有人都做、没人承认做过的{{routine}}（例行公事）：三天前我用{{electronic}}（电子的）邮件把二十九个问题发给公司投资者关系部，请求回应。这叫{{confront}}（当面对质）——不是为了拿答案，是为了让“你没给我们机会”这句话说不出口。他们回了两行字，措辞极其{{smooth}}（圆滑的），说数据均已依法披露。\n\n我知道接下来的剧本。他们会{{categorically deny}}（断然否认），会申请{{trading halt}}（停牌），会有{{resumption guidance}}（复牌指引），会有律师函。作为一家{{short seller}}（做空机构），我们没有{{ally}}（同盟者），没人会站出来替我们说话。\n\nRay 四点半进的门，没问准备好没有，拉过椅子坐下：你算过没有，我们要是错了，基金的{{deficit}}（亏空）有多大。\n\n我说算过。全平掉，扣掉今年所有收益，还差百分之六。\n\n他说：那就是{{remarkable}}（不平常）的一天了。\n\n四点四十九分，天开始泛白。我最后看了一眼收件人——里面有四个是我同一批入行的{{peer}}（同行），还有一个是我大学老师。这是一份{{mixture}}（混合物）：三年的电话录音、水表读数、卫星图、十九条对不上的数，和我三十一年全部的判断。\n\n我按了发送。\n\n三秒钟，什么都没发生。然后手机开始震，一直震到天亮。","ft":[{"w":"CFO resignation","z":"财务负责人离职","d":"关键财务岗位突然更换，是财报风险的前置信号","a":"","p":""},{"w":"bad debt provision","z":"坏账计提","d":"计提比例明显低于同行，是掩盖收入质量的常用手段","a":"","p":""},{"w":"categorically deny","z":"断然否认","d":"公司回应做空报告时的标准措辞","a":"","p":""},{"w":"days sales outstanding","z":"应收账款周转天数","d":"收入涨而回款不涨，该指标飙升是最经典的红旗","a":"DSO","p":""},{"w":"fictitious revenue","z":"虚增收入；虚构收入","d":"凭空造出并不存在的销售，做空报告最常见的核心指控","a":"","p":""},{"w":"insider selling","z":"内部人减持","d":"高管与大股东持续卖出，是对基本面最直接的投票","a":"","p":""},{"w":"mystery shopping","z":"神秘顾客暗访","d":"假扮顾客到店暗访，验证客流与真实单价","a":"","p":""},{"w":"position disclosure","z":"持仓披露","d":"报告中声明自身多空仓位的固定段落","a":"","p":""},{"w":"resumption guidance","z":"复牌指引","d":"港交所列出的复牌条件，通常包含独立调查","a":"","p":""},{"w":"short seller","z":"做空机构；空头","d":"通过发布负面研究并做空标的获利的机构，港股美股常见","a":"","p":""},{"w":"trading halt","z":"停牌","d":"股票暂停交易，做空报告发布后的常见反应","a":"","p":""},{"w":"off-balance sheet debt","z":"表外负债","d":"未体现在合并报表内但实际需承担的债务","a":"","p":""},{"w":"offering circular","z":"发售通函","d":"境外债发行使用的招募文件，条款细节都在这里","a":"OC","p":""},{"w":"offshore dollar bond","z":"中资美元债","d":"中国主体在境外发行的美元计价债券","a":"CGB","p":""},{"w":"onshore bond","z":"境内债","d":"在中国境内银行间或交易所市场发行的债券","a":"","p":""},{"w":"option-adjusted spread","z":"期权调整利差","d":"剔除赎回或回售条款影响后的信用利差","a":"OAS","p":""},{"w":"par value","z":"面值；票面金额","d":"债券到期时偿还的本金金额，中资美元债通常以一千美元为单位","a":"par","p":""},{"w":"pari passu","z":"同顺位；平等受偿","d":"与其他同类债务享有同等清偿顺序的条款表述","a":"","p":""}],"iw":[{"w":"deficit","p":"'defisit","t":"n. 赤字, 不足额; 短缺"},{"w":"awareness","p":"ә'weәnis","t":"n. 意识, 认识; 识别, 议定, 明白"},{"w":"bathroom","p":"'bɑ:θru:m","t":"n. 浴室, 厕所"},{"w":"frequency","p":"'fri:kwәnsi","t":"n. 频率, 频数; 频率"},{"w":"electronic","p":".ilek'trɒnik","t":"a. 电子的; 电子工业协会接口"},{"w":"ally","p":"'ælai. ә'lai","t":"n. 同盟者, 同盟国, 助手; vt. 使联盟, 使联合, 使有关系; vi. 结盟"},{"w":"mixture","p":"'mikstʃә","t":"n. 混合, 混淆, 混合物; 混合物"},{"w":"smoke","p":"smәuk","t":"n. 烟, 雾气, 烟熏剂, 抽烟, 烟色; vi. 吸烟, 冒烟, 弥漫; vt. 以烟熏, 抽烟而导致..."},{"w":"confront","p":"kәn'frʌnt","t":"vt. 使面对, 对抗, 遭遇, 使对质, 比较; 对证, 使对质, 比较"},{"w":"fifth","p":"fifθ","t":"num. 第五, 五分之一"},{"w":"dimension","p":"dai'menʃәn","t":"n. 尺寸, 次元, 面积, 维数; vt. 标出尺寸"},{"w":"routine","p":"ru:'ti:n","t":"n. 常规, 日常工作, 惯例, 例行公事; a. 日常的, 常规的; 例程"},{"w":"rough","p":"rʌf","t":"n. 粗糙的东西, 毛坯, 未加工品, 梗概, 草图, 暴徒, 艰难; a. 粗糙的, 粗暴的, 蓬乱的, 草率的, 大致的, 简陋的, 暴风雨的, 艰难的; vt. 使粗糙, 使不平, 使蓬乱, 粗制, 草拟, 粗暴对待, 对...动粗; vi. 变粗糙; adv. 粗糙地, 粗暴地"},{"w":"smooth","p":"smu:ð","t":"a. 平滑的, 平稳的, 流畅的, 和蔼的, 安祥的, 圆滑的, 调匀的, 无毛的; vt. 使光滑, 烫平, 使平和, 消除; vi. 变平滑, 变平静; n. 一块平地, 平滑部分"},{"w":"remarkable","p":"ri'mɑ:kәbl","t":"a. 不平常的, 值得注意的, 显著的"},{"w":"peer","p":"piә","t":"n. 同等的人, 匹敌, 贵族; vi. 凝视, 窥视, 费力地看, 隐现; vt. 与...同等, 封为贵族"},{"w":"personnel","p":".pә:sә'nel","t":"n. 人员, 人事部门, 人事科(处); 人事, 全体人员, 职工"},{"w":"designer","p":"di'zainә","t":"n. 设计者, 谋划者, 制图者; 设计员"},{"w":"maximum","p":"'mæksimәn","t":"n. 极点, 最大量, 极大; a. 最高的, 最大的, 最大极限的; 最大值"},{"w":"furniture","p":"'fәnitʃә","t":"n. 家具, 帆具"}],"doc":{"k":"做空报告的执行摘要","en":"Executive Summary. Position disclosure: funds managed by the publisher hold a short position and stand to profit from a decline in the securities discussed. We believe the issuer has recorded fictitious revenue for at least three financial years. Days sales outstanding has risen from 61 to 247 days while peers remained flat, and bad debt provision stands at under one fifth of the peer median. Mystery shopping conducted monthly over eleven months found no meaningful activity at three facilities. We further identify sustained insider selling, a CFO resignation weeks before the audit, and off-balance sheet debt inconsistent with the offering circular for the offshore dollar bond. We expect the company to categorically deny these findings and to request a trading halt.","zh":"执行摘要。持仓披露：本报告发布方管理的基金持有空头头寸，将从所涉证券价格下跌中获利。我们认为，该发行人至少在过去三个财政年度存在虚增收入。其应收账款周转天数已由61天升至247天，同期同业保持平稳；坏账计提不足同业中位数的五分之一。历时十一个月、每月一次的神秘顾客暗访显示，三处基地均无实质性生产活动。我们进一步发现持续的内部人减持、审计进场前数周发生的财务负责人离职，以及与该笔中资美元债发售通函披露不一致的表外负债。我们预计公司将断然否认上述发现，并申请停牌。"}},{"i":44,"ti":"九点零一分没有开盘，晚上七点半他们说要告我们","dom":"fraud","sc":"公司反击","tx":"九点零一分，股票没有开出来。\n\nDanny 盯着屏幕，清了清{{throat}}（嗓子）说：停了。\n\n九点十四分，交易所挂出短讯：应公司要求，股份自今日九时正起短暂停止买卖，以待刊发构成内幕消息的公告。这一步我在报告里预判过，真看到还是心里一沉。\n\n会议室{{entrance}}（入口）挤了六个人，谁都没坐下。Ray 背对我们看窗外，一上午只说了一句：从现在开始，我们说的每个字都会被人逐字读。\n\n真正的东西晚上七点半来。四页公告，写得非常{{brilliant}}（漂亮）。漂亮不是夸奖，是在评价一件工艺品。\n\n董事会认为报告所载指控毫无根据；本公司已委聘法律顾问，将就诽谤及市场操纵提起诉讼，并{{reserve}}（保留）一切权利；财务报表均经国际所审计，不存在{{financial misstatement}}（财务错报）。\n\n附件逐条回应：应收账款周转天数上升是行业性的；我们的{{channel checks}}（渠道调研）不能代表全貌；所谓{{premature revenue recognition}}（提前确认收入）是对合同条款的误读；{{deconsolidation}}（出表）属正常重组，已依规披露；{{internal control deficiency}}（内控缺陷）已于上年度整改完毕。至于{{reverse merger}}（借壳上市），公告说那是“公开信息，无任何不当”。\n\n每一条都不是谎话。每一条都刚好绕开了问题。\n\n最狠的在最后。他们把我们那句“依靠不断融资维持的结构”引出来，写道：指本公司为{{Ponzi scheme}}（庞氏骗局）之表述，属严重诽谤；报告暗示控股股东{{tunnelling}}（掏空、利益输送），同属恶意中伤。\n\nRay 读到这儿笑了：好，他们把这两个词摆上台面了。以后所有人讨论这件事，都得从这里开始。\n\n那晚没人走。Danny 在算{{short squeeze}}（轧空）的风险——复牌后若不跌反涨，逼空头平仓，成本会被推到哪里。他把{{equation}}（等式）写在白板上，左边是仓位，右边是可借券余量。“涨三成，”他说，“这个{{swing}}（波动）就吃掉全年的业绩报酬。”我说那你少拿点{{salary}}（薪水）。他说他{{literally}}（真的、不夸张地）已经在少拿了。\n\n凌晨一点，一个{{junior}}（初级的）同事把一份东西放上我桌。他翻完股东{{register}}（名册），找到三个持股都卡在百分之四点九的账户，注册地址在同一栋楼同一层——典型的{{nominee shareholder}}（代持股东）痕迹。我说不确定也要摆出来。\n\n另一件更慢的事只能等：{{bank confirmation}}（银行询证函）。最容易出问题的就是这一环，函件被拦下、被改。\n\nRay 把人叫齐：市场只看两件事——我们能不能{{overcome}}（克服）这轮反击，和它这笔债能不能还上。债的部分他交给我。\n\n那只{{puttable bond}}（可回售债券）的回售窗口在四个月后，集中行权就要一次拿出十九亿；再往后是{{reset date}}（票息重置日），成本还要跳。{{refinancing risk}}（再融资风险）已经不是理论问题——上周它询过一次{{price talk}}（初始询价区间），十一个点都没人接，最后取消发行。按市场隐含的{{probability of default}}（违约概率）倒推，一年期百分之三十四；假设{{recovery rate}}（回收率）三成，真走到{{payment default}}（实质性违约），债权人拿回来的不超过面值三分之一。\n\n天快亮时手机弹出一条推送：某财经媒体引述“接近公司人士”，称公司将向监管提交材料，指控做空方在报告发布前已建仓获利。我盯着那行字很久。这不是{{anxiety}}（焦虑）——焦虑是不知道会发生什么。我知道。\n\n第二天上午，交易所的{{enquiry}}（问询）函到了公司；同一天，我们收到律师楼第一封信。Ray 摊开看两秒：{{flag}}（标记）一下日期，存档。他双手在胸前一{{embrace}}（交叠）：我在纽约见过{{breach}}（违反）之后的公司怎么{{behave}}（表现），排序永远一样——先告人，再换审计师，最后才认账。\n\n我问为什么告人排第一。他说：告人不花钱，一张纸而已。它买的是时间。\n\n中午电梯里遇到一个快{{retirement}}（退休）的老前辈，行业{{rank}}（排名）拿过第一。他看我一眼，只说：孩子，注意{{pace}}（节奏），这才第一天。","ft":[{"w":"Ponzi scheme","z":"庞氏骗局","d":"用新投资者的钱支付老投资者收益，靠不断融资维持","a":"","p":""},{"w":"bank confirmation","z":"银行询证函","d":"审计师向银行核实存款，造假案中常被伪造或拦截","a":"","p":""},{"w":"channel checks","z":"渠道调研","d":"向经销商与供应商核实真实出货量和价格","a":"","p":""},{"w":"deconsolidation","z":"出表","d":"把亏损或负债主体移出合并范围，报表瞬间变好看","a":"","p":""},{"w":"financial misstatement","z":"财务错报","d":"报表数据与事实不符，可能出于差错也可能是蓄意","a":"","p":""},{"w":"internal control deficiency","z":"内控缺陷","d":"流程或制度上的漏洞，为造假提供了操作空间","a":"","p":""},{"w":"nominee shareholder","z":"代持股东","d":"名义持股人背后另有实际控制人，用于隐藏关联关系","a":"","p":""},{"w":"premature revenue recognition","z":"提前确认收入","d":"把未来期间的收入拉到本期，掩盖增长失速","a":"","p":""},{"w":"reverse merger","z":"借壳上市","d":"通过收购上市壳公司实现上市，绕开正常发行审核","a":"","p":""},{"w":"short squeeze","z":"轧空","d":"股价上涨逼迫空头平仓，反过来进一步推高股价","a":"","p":""},{"w":"tunnelling","z":"掏空；利益输送","d":"控股股东把上市公司的资源转移到自己口袋","a":"","p":"'tʌnәliŋ"},{"w":"payment default","z":"实质性违约","d":"到期本息未能支付，最直接的违约形态","a":"","p":""},{"w":"price talk","z":"初始询价区间","d":"路演阶段给出的收益率参考区间，用来试探需求","a":"","p":""},{"w":"probability of default","z":"违约概率","d":"一定期限内发行人发生违约的可能性","a":"PD","p":""},{"w":"puttable bond","z":"可回售债券","d":"投资人有权在约定日要求发行人提前买回","a":"","p":""},{"w":"recovery rate","z":"回收率","d":"违约后债权人最终收回金额占本金的比例","a":"","p":""},{"w":"refinancing risk","z":"再融资风险","d":"到期债务无法接续新融资而被迫违约的风险","a":"","p":""},{"w":"reset date","z":"票息重置日","d":"按新的基准利率加点重新确定票息的日期","a":"","p":""}],"iw":[{"w":"brilliant","p":"'briljәnt","t":"a. 光辉的, 灿烂的, 有才气的; 亮的"},{"w":"register","p":"'redʒistә","t":"n. 寄存器, 记录, 登记簿, 注册; vt. 记录, 注册, 提示, 表达, 把...挂号; vi. 登记, 注册, 挂号; 寄存器"},{"w":"retirement","p":"ri'taiәmәnt","t":"n. 退休, 隐居, 撤退; 退休, 退股, (固定资产)报废"},{"w":"flag","p":"flæg","t":"n. 标志, 旗标, 旗子, 信号旗, 菖蒲; vt. 悬旗, 打旗号, 铺石板; vi. 无力地下垂; 标志; 属性标记命令"},{"w":"throat","p":"θrәut","t":"n. 咽喉, 喉咙, 嗓音; vt. 用喉音说, 开沟于"},{"w":"breach","p":"bri:tʃ","t":"n. 裂口, 违背, 破坏, 违反, 突破, 破裂; vt. 攻破, 突破; vi. 跳出水面"},{"w":"junior","p":"'dʒu:njә","t":"n. 年少者, 地位较低者, 大学三年级学生; a. 年少的, 下级的, 后进的"},{"w":"swing","p":"swiŋ","t":"n. 摇摆, 振幅, 音律, 节奏, 涨落, 秋千, 旋转, 行动自由; vi. 摇摆, 悬挂, 旋转, 大摇大摆地走, 转向; vt. 挥舞, 使旋转, 使转向, 悬挂, 吊运; a. 旋转的, 悬挂的, 强节奏爵士音乐的"},{"w":"salary","p":"'sælәri","t":"n. 薪水; vt. 给...加薪"},{"w":"equation","p":"i'kweiʃәn","t":"n. 相等, 等式, 平衡; 方程式; 等式; 反应式; 公式"},{"w":"pace","p":"peis","t":"n. 速度, 步调, 步法; vi. 踱步, 缓慢走; vt. 用步测, 踱步于"},{"w":"overcome","p":".әuvә'kʌm","t":"vt. 战胜, 克服, 胜过; vi. 得胜"},{"w":"behave","p":"bi'heiv","t":"vi. 举止端正, 行为规矩; vt. 检点(自己的)行为, 使表现好"},{"w":"rank","p":"ræŋk","t":"n. 等级, 排, 横列, 队伍, 阶级; a. 茂密丛生的, 恶臭的, 十足的, 粗俗的; vt. 排列, 归类于, 把...分等; vi. 列为, 列队; n. 秩; 秩"},{"w":"entrance","p":"'entrәns","t":"n. 入口, 进入点, 入场, 入学, 进入, 开始(阶段), 就任; vt. 使出神, 使入迷; 入口"},{"w":"anxiety","p":"æŋ'zaiәti","t":"n. 焦虑, 忧虑, 令人焦虑的事; 焦虑"},{"w":"literally","p":"'litәrәli","t":"adv. 逐字地, 按照字面上地, 不夸张地"},{"w":"enquiry","p":"in'kwaiәri","t":"n. 询问; 询价, 询盘"},{"w":"embrace","p":"im'breis","t":"n. 拥抱; vt. 拥抱, 互相拥抱, 包含, 收买; vi. 拥抱"},{"w":"reserve","p":"ri'zә:v","t":"n. 储备品, 贮量, 后备军, 自然保护区, 保留, 拘谨, 节制, 储备金; vt. 保留, 保存, 预订, 延期, 推迟"}],"doc":{"k":"公司公告","en":"CLARIFICATION ANNOUNCEMENT AND LEGAL ACTION. The Board notes a report published by a short seller alleging fictitious revenue, premature revenue recognition and internal control deficiency at the Company. The Board categorically denies these allegations, which rely on selective channel checks. There has been no financial misstatement in the audited accounts; the deconsolidation referred to was disclosed under the Listing Rules, and the Company's admission by reverse merger is a matter of public record. Any suggestion that the Company operates as a Ponzi scheme, or that tunnelling has occurred, is defamatory. The Company faces no payment default and holds adequate resources for the puttable bond redemption window. Solicitors have been instructed and all rights are reserved.","zh":"澄清公告及法律行动。董事会注意到一家做空机构发布的报告，指控本公司存在虚增收入、提前确认收入及内控缺陷。董事会断然否认上述指控，该等指控建立在片面的渠道调研之上。经审计账目不存在财务错报；报告所指的出表事项已按《上市规则》披露，而本公司当年经借壳上市取得上市地位一事亦属公开记录。任何暗示本公司以庞氏骗局方式运作、或存在掏空行为的表述，均属诽谤。本公司并未发生实质性违约，且拥有充足资源应对可回售债券的回售窗口。本公司已委聘律师，并保留一切权利。"}},{"i":45,"ti":"他们请了一个我尊敬的人，来查一件我确信的事","dom":"fraud","sc":"独立调查","tx":"第三天早上，公告出来了：董事会成立独立调查委员会。\n\n主席的名字我认得，这市场待过五年的都认得。二十六年审计合伙人，交易所培训{{platform}}（平台）上挂着他的课；{{Birmingham}}（伯明翰）念的书，回香港四十年，业余是本地{{cricket}}（板球）会名誉会长。你没法说这个人不好。\n\n委员会由三名独立非执行董事{{comprise}}（组成），聘法证会计团队和一家独立法律{{consultant}}（顾问）协助，成员{{allowance}}（津贴）另定。范围五项：{{channel stuffing}}（渠道压货）、迟迟不提的{{inventory write-down}}（存货减值）、报表里大量的{{non-GAAP adjustments}}（非公认准则调整）、涉嫌替关联方做的{{undisclosed guarantees}}（未披露担保），以及靠{{roll-up}}（并购整合式扩张）吞下同类小厂的做法。公告仍用那句{{baseless and misleading}}（毫无根据且具误导性），仍驳斥我们最后一页那句{{price target of zero}}（目标价归零）。\n\n老周把公告铺在客厅的{{carpet}}（地毯）上，蹲着看了很久：这个人是真的干净。\n\n我说那不是好事吗。\n\n他抬头看我：这就是最难的地方。\n\n他去书房拿了一张{{pink}}（粉红色的）财经日报，翻到二十年前一小块新闻——他自己签过字的那家公司。当年也成立过独立调查委员会，主席也很受尊敬。他说：委员会最大的功能不是查案，是买时间。它一{{install}}（就位），话术就统一了——“调查正在进行中，不便置评”。这句能用九个月。\n\n他让我{{detect}}（察觉）一件更细的事：范围写的是“报告所提出的指控”——我们没写到的，它不查。我们的报告三十七页，它的账三十七年。\n\n那天下午我做了两件事。\n\n一，调了三家子公司的{{SAIC filings}}（工商备案报表）。三年数据摊开，境内合计收入只有年报口径的四成一。解释有很多——口径、合并范围。每条都成立，每条都差一点。\n\n二，重跑三年的{{foot traffic data}}（客流数据），看三个基地围栏内工作日人流的{{curve}}（曲线）。江西那个三年是一条贴地的直线，只有每年三月和九月各鼓一个包——审计进场和券商调研的月份。\n\n发给 Ray。他回三个字：留着，别发。现在发会被说成干扰独立调查。这是个{{historic}}（历史性的）时刻，市场在看谁沉得住气。\n\n我说我沉不住。他说那你去跑步。\n\n晚上我真去跑了，脑子里全是那笔债。委员会一成立，境外债反而涨了点——有人赌“愿意自查”是好信号。但{{spreads widened}}（利差走阔）没停：{{senior unsecured}}（高级无抵押）那一档比同评级可比债券高四百个基点。它还有一只{{secured bond}}（有抵押债券），拿两个厂区抵押，明显抗跌——差价就是市场对回收率的判断。\n\n更要命的是{{structural subordination}}（结构性次级）：债是母公司发的，资产和现金都在境内子公司，一旦出事，境内银行债权人排前面，境外投资人在最后。它一年前有一份城商行出的{{standby letter of credit}}（备用信用证），把债项评级抬了两档；上个月到期没续，附注里只有半行字。\n\n我记下一句：把它的{{standalone credit profile}}（个体信用状况）单独算一遍，剔掉外部支持。一算就明白，它不是那种被上调进投资级的{{rising star}}（明日之星），是反过来的。真走到{{delisting}}（退市），股权一文不值——这正是我们整份{{short thesis}}（做空逻辑）的落点。\n\n回到家十一点。我打开调研{{journal}}（日志）——三年了，每天一行。今天这页我停了很久，写下：他们请了一个我尊敬的人，来查一件我确信的事。\n\n{{stomach}}（胃）不舒服，一天没怎么吃。银行的{{mail}}（邮件）这时进来，{{mortgage}}（按揭）月供提醒，还有二十二年。如果我错了，赔上的不只是基金的钱——还有我每个月那几千{{buck}}（块钱）。\n\n睡前手机响。Wendy Chan，很短：下周有空喝杯咖啡吗？她是证监会法规执行部的人，程序至上，不站队。她约人喝咖啡不需要对方{{consent}}（同意），也不是在给谁{{favor}}（好意）。\n\n我回：有空。\n\n然后我搜了那位主席的名字。跳出三年前一条旧闻：他曾以独立董事身份出席一家清盘公司的{{administrator}}（清盘管理人）交接仪式。照片里他站得很直。\n\n我把这条也记进日志，后面加个问号。","ft":[{"w":"SAIC filings","z":"工商年报；工商备案报表","d":"中国工商系统备案的财务数据，与年报差异大即为红旗","a":"","p":""},{"w":"baseless and misleading","z":"毫无根据且具误导性","d":"澄清公告中形容做空报告的固定说法","a":"","p":""},{"w":"channel stuffing","z":"渠道压货","d":"把货强压给经销商提前确认收入，后期必然反噬，典型造假手法","a":"","p":""},{"w":"delisting","z":"退市","d":"被交易所取消上市地位，做空案例的最坏结局","a":"","p":"di'listiŋ"},{"w":"foot traffic data","z":"客流数据","d":"用手机定位或人工计数还原门店真实人流","a":"","p":""},{"w":"inventory write-down","z":"存货减值","d":"迟迟不计提的存货减值，往往是造假暴露的突破口","a":"","p":""},{"w":"non-GAAP adjustments","z":"非公认准则调整","d":"自定义口径剔除不利项目，调整项越多越可疑","a":"","p":""},{"w":"price target of zero","z":"目标价归零","d":"做空报告最强硬的表述，认为股权最终一文不值","a":"","p":""},{"w":"roll-up","z":"并购整合式扩张","d":"反复收购同类小公司拼成规模，掩盖主业停滞","a":"","p":"rəul ʌp"},{"w":"short thesis","z":"做空逻辑；空头论点","d":"做空报告的核心论证，说明公司为何被高估或造假","a":"","p":""},{"w":"undisclosed guarantees","z":"违规担保；未披露担保","d":"替关联方担保却不披露，A股频发的暴雷来源","a":"","p":""},{"w":"rising star","z":"明日之星","d":"从高收益级被上调进投资级的发行人","a":"","p":"ˈraɪzɪŋ stɑ:"},{"w":"secured bond","z":"有抵押债券","d":"以特定资产作担保、违约时可优先受偿的债券","a":"","p":"siˈkjuəd bɔnd"},{"w":"senior unsecured","z":"高级无抵押","d":"受偿顺序靠前但没有抵押物支持的债务","a":"","p":""},{"w":"spreads widened","z":"利差走阔","d":"信用债相对基准利率的溢价上升，市场担忧加剧","a":"","p":""},{"w":"standalone credit profile","z":"个体信用状况","d":"剥离股东或政府支持后发行人自身的信用水平","a":"SACP","p":""},{"w":"standby letter of credit","z":"备用信用证","d":"银行出具的付款保证，可显著提升债项评级","a":"SBLC","p":""},{"w":"structural subordination","z":"结构性次级","d":"母公司层面发债，受偿顺序天然劣后于子公司债权人","a":"","p":""}],"iw":[{"w":"consultant","p":"kәn'sʌltәnt","t":"n. 顾问, 征询意见者; 顾问医师"},{"w":"allowance","p":"ә'lauәns","t":"n. 津贴, 零用钱, 限额, 折扣, 允许; vt. 定量供应"},{"w":"mortgage","p":"'mɒ:gidʒ","t":"n. 抵押, 约束性义务, 抵押借款; vt. 抵押, 以...作担保, 把...许给"},{"w":"administrator","p":"әd'ministreitә","t":"n. 管理人, 行政官; 遗产管理人员"},{"w":"carpet","p":"'kɑ:pit","t":"n. 地毯, 地毯状物; vt. 铺以地毯, 铺盖"},{"w":"mail","p":"meil","t":"n. 邮件, 邮政, 邮递, 盔甲; vt. 邮寄, 给...穿盔甲; 邮件"},{"w":"pink","p":"piŋk","t":"n. 粉红色, 石竹花, 化身, 典范, 头面人物, 极度; a. 粉红的, 石竹科的, 比较激进的, 脸色发红的, 精致的, 有点下流的; vt. 刺, 扎, 刺痛, 射伤, 使面红耳赤, 使变粉红色; vi. 变粉红色"},{"w":"platform","p":"'plætfɒ:m","t":"n. 站台, 月台, 讲台, 论坛, 平台; 平台"},{"w":"historic","p":"hi'stɒrik","t":"a. 历史上著名的, 有历史性的"},{"w":"buck","p":"bʌk","t":"n. 元, 雄鹿, 纨绔子弟, 鞍马, 培克(赌博时的庄家标志), 碱水, 自夸, 谈话; vi. 马背突然拱起, 反对, 吹牛, 闲聊; vt. 马背突然拱起将骑手摔下, 反对, 用碱水洗; a. 雄的"},{"w":"cricket","p":"'krikit","t":"n. 蟋蟀, 板球"},{"w":"favor","p":"'feivә","t":"n. 好意, 喜爱; vt. 赐予, 支持, 喜欢, 证实"},{"w":"journal","p":"'dʒә:nәl","t":"n. 日记, 杂志, 日报; 轴颈"},{"w":"detect","p":"di'tekt","t":"vt. 发现, 察觉, 探测; 发现, 查明, 探测"},{"w":"consent","p":"kәn'sent","t":"n. 同意, 许可; vi. 同意, 赞同"},{"w":"stomach","p":"'stʌmәk","t":"n. 胃, 食欲, 欲望, 肚子; vt. 吃下, 忍受"},{"w":"comprise","p":"kәm'praiz","t":"vt. 包含, 构成"},{"w":"Birmingham","p":"'bә:miŋәm","t":"n. 伯明翰"},{"w":"install","p":"in'stɒ:l","t":"vt. 安装, 安置, 使就职; 安装, 安装程序; DOS内部命令:安装常驻程序"},{"w":"curve","p":"kә:v","t":"n. 曲线, 弯曲, 曲线球; vt. 弯, 使弯曲; vi. 成曲形"}],"doc":{"k":"公司公告","en":"ESTABLISHMENT OF INDEPENDENT INVESTIGATION COMMITTEE. The Board announces the establishment of an Independent Investigation Committee, which shall comprise three independent non-executive Directors. The Committee will engage forensic accountants and independent legal advisers to review each allegation raised in the short thesis published by the short seller, including those concerning channel stuffing, inventory write-down, non-GAAP adjustments, undisclosed guarantees, the Group's roll-up acquisitions, and discrepancies against the Company's SAIC filings. The Board reiterates that the allegations are baseless and misleading and rejects the price target of zero. The Board notes that spreads widened on its senior unsecured notes and confirms that the standby letter of credit was not renewed. Resumption will be sought under the resumption guidance in due course.","zh":"成立独立调查委员会。董事会宣布成立独立调查委员会，该委员会将由三名独立非执行董事组成。委员会将委聘法证会计师及独立法律顾问，就该做空机构所发布做空逻辑中提出的每一项指控进行审阅，包括涉及渠道压货、存货减值、非公认准则调整、未披露担保、本集团的并购整合式扩张，以及与本公司工商备案报表之间差异的相关指控。董事会重申，该等指控毫无根据且具误导性，并驳斥目标价归零的说法。董事会注意到本公司高级无抵押票据的利差走阔，并确认该份备用信用证并未续期。本公司将于适当时候按照复牌指引申请复牌。"}},{"i":46,"ti":"第九天早上八点四十，审计师递了辞呈","dom":"fraud","sc":"审计师辞任","tx":"辞任函是早上八点四十挂出来的，两页，四百三十个英文单词，通篇没有一个形容词。\n\n从董事会宣布成立独立调查委员会那天算起，正好第九天。\n\nDanny 在群里连发三个感叹号，说这条太{{exciting}}（令人兴奋的）了。我没回他。我把那两页读了四遍，越读越冷。签字的那家所干了六年，出的全是标准无保留意见，现在他们决定{{quit}}（辞职），理由写得极其克制：无法就若干交易取得充分适当的审计证据；无法识别若干交易对手的{{beneficial owner}}（实际受益人）；无法确认若干安排是否应纳入合并范围。最后一句是 We hereby resign with immediate effect。\n\n老周中午打电话过来，开口第一句：写得像一篇{{essay}}（短文），对吧。\n\n“审计师这辈子都不会在纸上写{{accounting fraud}}（财务造假）这四个字，”他说，“他们只写取不到证据。你要读的是他们不写什么。”\n\n他让我把第二页第三段再念一遍。那段说，若干交易对手同时是公司的客户与供应商，账款收付的时间高度接近。老周在电话那头静了几秒，说这句看着最{{elementary}}（基础的），其实最重——它在说{{circular transactions}}（闭环交易）。\n\n“钱可能根本没出过这个圈。”他说，“{{round-tripping}}（资金空转），老手法，没什么新{{recipe}}（配方）。你把三年的收付明细发我，我周末看。”\n\n挂电话前他补一句：这种信我不是第一次读，我现在更像个{{historian}}（历史学家），只做旧账考古。\n\n下午两点，独立调查委员会发公告，说已委聘一家{{forensic accounting}}（法务会计）团队，重点核查若干{{off-balance sheet entity}}（表外主体），以及可能存在的{{undisclosed liabilities}}（隐藏负债）。措辞同样克制，克制到{{presumably}}（大概）双方早就谈崩了。年报会{{delay}}（延迟）——这一点公告里没写，但所有人心里都清楚。\n\n我翻出三个月前那次{{site visit}}（实地走访）的笔记。江西基地，三号线配电箱上的封条干净得反光，那条{{circuit}}（电路）从没通过电。我又调出他们过去十二个月的{{job postings}}（招聘数据）：那个基地一共招了九个人，六个是保安。一家号称在猛扩产的公司，招工数据{{genuine}}（真实的）得让人难受。\n\n真正的连锁反应在债券那边。\n\n公司有一笔三年{{tenor}}（期限）的美元债，募集说明书里{{use of proceeds}}（募集资金用途）写着“偿还现有债务及补充营运资金”。审计师辞任触发了信息交付条款，构成{{technical default}}（技术性违约）——不是没还钱，是违反了约定。当晚{{trustee}}（受托管理人）就发了持有人通知。开盘前那只债还在九十二，只能算{{trading at a discount}}（折价交易），下午收在三十七，已经是{{trading at distressed levels}}（价格已跌至困境水平）。\n\n更难看的是隔壁。公司所在那个地级市的一只{{urban investment bond}}（城投债）也被砸掉六个点，只因为交叉{{guarantee}}（担保）名单里出现过一个相关的名字。恐慌像一场{{infection}}（传染），谁沾上谁倒霉。\n\n论坛上开始有人骂{{pump and dump}}（拉高出货）。骂得很{{aggressive}}（挑衅的），方向只对了一半——拉高出货只需要一个故事，而这一套需要一整套账。\n\nRay 傍晚把我叫进办公室。他说报告要出第二{{edition}}（版本），这次不写观点，只写证据，最后那页{{disclaimer}}（免责声明）一个字都不许改。\n\n“我们不需要写得多{{extreme}}（极端的），”他说，“事实本身已经够极端了。”\n\n我问，会有人因为这封信进{{jail}}（监狱）吗。\n\nRay 说不会。一封辞任函从来送不了任何人进监狱，它只是把灯关掉，让你看清楚谁一直站在暗处。\n\nDanny 工位后面常年靠着一把{{guitar}}（吉他），他本来买了当晚一场{{concert}}（音乐会）的票，那天下午把票转手了。他说留下来陪我看盘，为了我的{{sake}}（缘故）。我说滚。\n\n回家的巴士钻进海底{{tube}}（隧道）时手机没了信号。我在黑暗里反复想老周那句话。\n\n星期六早上，他把三年的收付明细摊了一整桌：坐下，我给你看这笔钱怎么走完一圈。","ft":[{"w":"accounting fraud","z":"财务造假","d":"系统性伪造账目粉饰业绩，与一般会计估计差异有本质区别","a":"","p":""},{"w":"beneficial owner","z":"实际受益人","d":"穿透层层股权结构后真正控制公司的自然人","a":"","p":""},{"w":"circular transactions","z":"闭环交易","d":"买卖双方互为对方客户，交易额虚增而现金原地打转","a":"","p":""},{"w":"disclaimer","z":"免责声明","d":"做空报告结尾的责任声明，强调信息仅供参考","a":"","p":"dis'kleimә"},{"w":"forensic accounting","z":"法务会计；财务鉴证","d":"用调查手法还原真实交易，专门用于识别造假","a":"","p":""},{"w":"job postings","z":"招聘数据","d":"招聘岗位的数量与地点，可反推真实扩张节奏","a":"","p":""},{"w":"off-balance sheet entity","z":"表外主体","d":"游离于合并范围之外的公司，是体外循环的常见载体","a":"","p":""},{"w":"pump and dump","z":"拉高出货","d":"先炒高股价再在高位派发，常配合虚假利好消息","a":"","p":""},{"w":"round-tripping","z":"循环交易；资金空转","d":"资金在关联方之间转一圈变成收入，报表虚增但无真实业务","a":"","p":"'rajnd,tripiŋ"},{"w":"site visit","z":"实地走访","d":"亲自到厂区、门店查看真实经营状况","a":"","p":""},{"w":"undisclosed liabilities","z":"隐藏负债","d":"未在报表体现的债务，暴露后往往直接压垮公司","a":"","p":""},{"w":"technical default","z":"技术性违约","d":"未付本息但违反财务或行为契约构成的违约","a":"","p":""},{"w":"tenor","z":"期限；年期","d":"债券从发行到到期的存续时间，常说三年期、五年期","a":"","p":"'tenә"},{"w":"trading at a discount","z":"折价交易","d":"二级市场价格低于面值，通常反映信用担忧或利率上行","a":"","p":""},{"w":"trading at distressed levels","z":"价格已跌至困境水平","d":"债券报价大幅低于面值，隐含收益率通常超过千点利差","a":"","p":""},{"w":"trustee","z":"受托管理人","d":"代表全体持有人行使权利、监督发行人的机构","a":"","p":".trʌs'ti:"},{"w":"urban investment bond","z":"城投债","d":"城投平台发行的债券，定价核心在于政府支持预期","a":"","p":""},{"w":"use of proceeds","z":"募集资金用途","d":"说明本次募资将用于再融资、项目还是补充营运资金","a":"","p":""}],"iw":[{"w":"recipe","p":"'resipi","t":"n. 食谱, 处方, 秘诀; 取(处方头语), 处方"},{"w":"infection","p":"in'fekʃәn","t":"n. 传染, 影响, 传染病; 传染, 感染"},{"w":"elementary","p":".eli'mentәri","t":"a. 初步的, 基本的; 元素的, 基础的, 初级的"},{"w":"aggressive","p":"ә'gresiv","t":"a. 侵略的, 挑畔的, 进取的; 侵略的, 爱挑衅的, 行为过火的"},{"w":"concert","p":"'kɒnsәt","t":"n. 音乐会, 和声, 一致; vt. 协力, 协调; vi. 协力; 美国北卡罗来纳州Internet网"},{"w":"guitar","p":"gi'tɑ:","t":"n. 吉他"},{"w":"extreme","p":"ik'stri:m","t":"n. 极端, 末端; a. 极端的, 尽头的, 极度的, 偏激的"},{"w":"tube","p":"tju:b","t":"n. 管, 软管, 隧道; vt. 把...装管, 使通过管子; 管子"},{"w":"presumably","p":"pri'zu:mәbli","t":"adv. 推测上, 大概"},{"w":"quit","p":"kwit","t":"vi. 离开, 辞职, 停止; vt. 离开, 放弃, 使解除, 停止; n. 离开; 结束, 退出"},{"w":"genuine","p":"'dʒenjuin","t":"a. 真正的, 真实的, 诚恳的; 真性的"},{"w":"guarantee","p":".gærәn'ti:","t":"n. 担保, 抵押品, 保证书; vt. 保证, 担保"},{"w":"jail","p":"dʒeil","t":"n. 监牢, 监狱, 拘留所; vt. 监禁, 下狱"},{"w":"delay","p":"di'lei","t":"n. 耽搁, 迟滞; v. 耽搁, 延迟; 延迟, 延时"},{"w":"sake","p":"seik","t":"n. 目的, 缘故, 理由"},{"w":"essay","p":"'esei. e'sei","t":"n. 随笔, 短文, 评论, 企图; vt. 试图"},{"w":"edition","p":"i'diʃәn","t":"n. 版本, 版, 翻版"},{"w":"circuit","p":"'sә:kit","t":"n. 电路, 环(行)道, 巡回; 线路; 电路"},{"w":"exciting","p":"ik'saitiŋ","t":"a. 令人兴奋的, 刺激的; 激磁"},{"w":"historian","p":"hi'stɒ:riәn","t":"n. 历史学家, 记事者"}],"doc":{"k":"审计师辞任函","en":"To the Board of Directors. We hereby resign as auditors of the Company with immediate effect. During our audit we were unable to obtain sufficient appropriate evidence in respect of certain sales and purchase arrangements which, on the information available to us, may constitute circular transactions or round-tripping between counterparties that are simultaneously customers and suppliers of the Group. We could not identify the beneficial owner of several such counterparties, nor determine whether certain off-balance sheet entity arrangements should be consolidated. We were further unable to satisfy ourselves that there are no undisclosed liabilities, or that the use of proceeds of the outstanding notes was applied as represented. Our requests for a site visit and for direct bank confirmations were not met. A copy of this letter has been sent to the trustee.","zh":"致董事会。本所谨此辞任贵公司核数师，即时生效。在审计过程中，我们未能就若干销售及采购安排取得充分、适当的审计证据；根据我们所掌握的资料，该等安排可能构成闭环交易或资金空转，交易对手同时是本集团的客户与供应商。我们未能识别其中若干交易对手的实际受益人，亦未能判断若干表外主体安排是否应予合并。我们进一步未能使自己确信本集团不存在任何隐藏负债，亦未能确信尚未偿还票据的募集资金用途已按所述方式使用。我们提出的实地走访要求及银行直接函证要求均未获满足。本函副本已送交受托管理人。"}},{"i":47,"ti":"钱转了一圈，又回到起点","dom":"fraud","sc":"循环交易","tx":"老周把三年的收付明细摊满整张旧门板桌，抽出一支铅笔。\n\n“电脑先别开。开了电脑你就只找规律，找规律的人只看得见自己想找的东西。”墙上那台{{clock}}（时钟）慢三分钟，二十年没修。我睡了四小时，{{biological}}（生物的）节律全乱。\n\n他第一件事是不看金额：纸上画一条竖线当时间轴，一百万以上的收付按日期点上去，收在左，付在右。两小时，一个字没说，然后把纸转过来。\n\n三月十一号收进八千九百六十万。三月十五号付出八千九百六十万。四月二号又收回八千九百六十万——只是付款方换了个名字。“一模一样的数字，隔四天。真生意的金额零碎、带尾数、拖账期。太整齐了。”\n\n同样的形状三年出现十一次。收付双方名字全都{{differ}}（不同），但有三家地址是同一栋楼同一层，开户行也一样。我问，这算{{undisclosed related party}}（未披露关联方）吗。“只能算怀疑。你要判断的是够不够重。”\n\n他翻出现金流量表。“收入从十九亿做到六十一亿，净利翻四倍，{{operating cash flow}}（经营性现金流）两年是负的。这个背离一个数就够：{{accrual ratio}}（应计比率）——非现金部分大到这家公司赚的全是纸上的钱。”\n\n审计报告翻到{{key audit matters}}（关键审计事项）那页。六年，每年第一项都是收入确认。“他年年都在告诉你他最不放心哪儿，只是说得礼貌。今年要么{{resign}}（辞职），要么出{{disclaimer of opinion}}（无法表示意见）。他选前者，因为后者要写理由。”\n\n我问银行流水。他把对账单推到台灯下，手指顺页脚编号划过去，又划回来。“我不敢说这是{{forged bank statement}}（伪造银行流水）。我只能讲两件事：正常的对账单不长这样；我拿不到银行直接函证。”他不是在证明什么，是在把“证明不了”一条条钉住。\n\n存货那栏：{{slow-moving inventory}}（呆滞存货）占比从九跳到三十一，减值一分没提。“高镍材料放两年就废，又不是{{classical}}（古典的）油画。”\n\n中午汽水一开，气{{pop}}（砰的一声）窜出来。我问像不像{{pyramid scheme}}（传销）。“不像。传销拉人头，这个拉资金。人头会跑，资金不会——只要下一笔还进来。”\n\n下午他做了那个{{demonstration}}（演示）：十一次交易连成一个闭圈。发票从内地实体开出，钱付给一家壳公司；那家买了批设备，钱落到另一家名义上无关的{{shell}}（空壳）；这家再以{{advanced}}（预付的）货款名义打回起点，账上先变预收，再变收入。铅笔落回起点。\n\n“钱转了一圈，回到出发的地方。每一笔都有合同有发票，单独看都合规。只是这圈里少了一样——真实的{{consumption}}（消耗）。没人真用掉那批货。”\n\n他去洗脸。老唐楼的{{bath}}（浴缸）里堆着一摞旧底稿。\n\n“这不是我能向你{{assure}}（保证）的结论，”他说，“但你问我有没有把握——我很{{confident}}（有把握的）。”\n\n我把纸拍给 Ray。他回：每一笔{{split}}（拆开）到最小，我要能对上电力和{{utility}}（公用事业）账单，还要{{satellite imagery}}（卫星图像）。\n\n当晚公司发{{clarification announcement}}（澄清公告），称做空报告“毫无根据且具误导性”，董事会对公司{{survival}}（生存）有信心。末尾一句不起眼的{{remark}}（附注）：正与一名债权人商讨一笔到期债务。\n\n老周只说了两个词。{{big bath}}（财务大洗澡）：下一份报表会一次性把亏损计到底，把这三年埋掉。{{winding-up petition}}（清盘呈请）：只要一个债权人不肯等，就有人去法院。\n\n那笔债是只{{zero-coupon bond}}（零息债），不付票息，到期还本。当天报二十七，{{yield to maturity}}（到期收益率）百分之四十九；按最近赎回日算，{{yield to call}}（赎回收益率）三位数。“没人相信它能活到到期，市场在替它办后事了。”\n\n我走到门口被他叫住。“这个圈还不足以{{defeat}}（击败）他们。你缺一个名字——一个能把这圈签在自己头上的人。”去哪儿找？他说，找{{acquisition}}（收购）：圈上总有一家是被买进来的，买的时候有人签过字，写清自己是谁。那家挂什么{{brand}}（牌子）不重要，重要的是谁签的。","ft":[{"w":"accrual ratio","z":"应计比率","d":"利润中非现金部分的占比，越高越可能被人为操纵","a":"","p":""},{"w":"big bath","z":"财务大洗澡","d":"一次性把亏损计提到底，给后续年度腾出利润空间","a":"","p":""},{"w":"clarification announcement","z":"澄清公告","d":"公司就市场传闻或做空报告作出的正式回应","a":"","p":""},{"w":"disclaimer of opinion","z":"无法表示意见","d":"证据不足以支撑判断，审计师拒绝发表审计意见","a":"","p":""},{"w":"forged bank statement","z":"伪造银行流水","d":"篡改银行对账单，以配合虚假的收入与存款","a":"","p":""},{"w":"key audit matters","z":"关键审计事项","d":"审计师认为最重要的审计领域，透露风险所在","a":"KAM","p":""},{"w":"operating cash flow","z":"经营性现金流","d":"与净利润长期背离，是判断收入真假最直接的指标","a":"OCF","p":""},{"w":"pyramid scheme","z":"传销","d":"靠拉人头层层返利的模式，收入并非来自真实销售","a":"","p":""},{"w":"satellite imagery","z":"卫星图像","d":"用卫星照片核实工地进度、车流与堆场库存","a":"","p":""},{"w":"slow-moving inventory","z":"呆滞存货","d":"长期卖不动的库存，占比上升说明需求或收入有问题","a":"","p":""},{"w":"undisclosed related party","z":"未披露关联方","d":"表面独立实为同一实控人，常用来承接虚假交易","a":"","p":""},{"w":"winding-up petition","z":"清盘呈请","d":"债权人向法院申请强制清算发行人的法律动作","a":"","p":""},{"w":"yield to call","z":"赎回收益率","d":"假设发行人在最近赎回日行权计算出来的收益率","a":"YTC","p":""},{"w":"yield to maturity","z":"到期收益率","d":"持有债券到期的年化回报，是债券定价最核心的指标","a":"YTM","p":""},{"w":"zero-coupon bond","z":"零息债","d":"不付票息、以折价发行到期按面值兑付的债券","a":"","p":"ˈziərəu ˈku:pɔn bɔnd"}],"iw":[{"w":"clock","p":"klɒk","t":"n. 时钟, 计时器, (袜子上的)绣花边花; vt. 绣花样, 记时, 记录; vi. 记录时间; 时钟"},{"w":"pop","p":"pɒp","t":"n. 砰然声, 枪击, 含气饮料, 流行音乐, 通俗艺术; a. 流行的, 热门的, 通俗的; vt. 使发出爆裂声, 开枪打, 突然伸出; vi. 发出爆裂声, 射击, 突然出现, 瞪大; adv. 突然, 砰地; 出现点, 邮局协议"},{"w":"demonstration","p":".demәn'streiʃәn","t":"n. 示范, 实证; 示教, 实物教授"},{"w":"resign","p":"ri'zain","t":"vt. 辞职, 放弃, 使顺从; vi. 辞职, 屈从"},{"w":"bath","p":"bæθ.bɑ:θ","t":"n. 沐浴, 浴室; 浴"},{"w":"differ","p":"'difә","t":"vi. 不一致, 不同; 差异, 不同"},{"w":"advanced","p":"әd'vɑ:nst","t":"a. 在前的, 高级的, 先进的, 年老的; 预付的, 预支的, 垫付的"},{"w":"defeat","p":"di'fi:t","t":"n. 败北, 失败; vt. 击败, 使落空"},{"w":"shell","p":"ʃel","t":"n. 贝壳, 壳, 外形, 炮弹; vt. 去壳, 脱落, 炮轰; vi. 剥落, 脱壳; 外壳; DOS内部命令:指定命令行处理程序"},{"w":"consumption","p":"kәn'sʌmpʃәn","t":"n. 消费, 消费量, 痨病; 消耗量; 耗量"},{"w":"classical","p":"'klæsikl","t":"a. 古典的, 正统派的, 经典的; 古典的; 标准的, 典型的"},{"w":"biological","p":".baiәu'lɒdʒikәl","t":"a. 生物学的; 生物学的"},{"w":"acquisition","p":".ækwi'ziʃәn","t":"n. 获得, 获得物; 收购, 招揽, 取得"},{"w":"brand","p":"brænd","t":"n. 商标, 牌子, 烙印; vt. 打烙印于"},{"w":"assure","p":"ә'ʃuә","t":"vt. 保证, 使确信, 弄清楚, 担保; 确信, 保证, 保障"},{"w":"split","p":"split","t":"n. 劈开, 裂片, 裂缝, 分裂, 派系, 派别, 柳条; a. 劈开的; vi. 分离, 分开, 裂开, 被劈开; vt. 劈开, 切开, 使分裂, 使分离; 拆分"},{"w":"utility","p":"ju:'tiliti","t":"n. 功用, 有用之物, 实用, 公用事业, 实用程序; a. 实用的, 有多种用途的; 实用程序, 工具"},{"w":"confident","p":"'kɒnfidәnt","t":"a. 有信心的, 有把握的"},{"w":"remark","p":"ri'mɑ:k","t":"n. 评论, 注意; vt. 评论, 注意; vi. 评论, 谈论; 注释"},{"w":"survival","p":"sә'vaivәl","t":"n. 生存, 残存, 幸存者; a. 赖以生存的"}],"doc":{"k":"交易所问询函段落","en":"Further to the Company's clarification announcement, the Exchange requests the Board to provide the following. (1) A reconciliation, for each of the past three financial years, between reported revenue and operating cash flow, together with the accrual ratio implied by that difference. (2) Details of any counterparty that is both a customer and a supplier, and confirmation whether any such counterparty is an undisclosed related party. (3) An explanation of the provisioning policy for slow-moving inventory. (4) The Board's assessment of the matters raised as key audit matters in each of the last three audit reports, and whether the incoming auditor has indicated that a disclaimer of opinion may be issued. (5) Particulars of any winding-up petition served on the Company or its subsidiaries.","zh":"就贵公司之澄清公告，本所要求董事会提供以下资料。（1）过去三个财政年度中，每一年度所呈报收入与经营性现金流之间的勾稽说明，并列示该差异所隐含的应计比率。（2）任何同时为客户及供应商之交易对手的详情，并确认该等交易对手是否属未披露关联方。（3）呆滞存货计提政策的说明。（4）董事会对最近三份审计报告中被列为关键审计事项的相关事宜的评估，以及接任核数师是否已表示可能出具无法表示意见。（5）向贵公司或其附属公司送达的任何清盘呈请的详情。"}},{"i":48,"ti":"合影第七个和第九个，隔着一个人","dom":"fraud","sc":"关联方与资金占用","tx":"Ray 星期一早上把这条线{{assign}}（指派）给我，{{guidance}}（指示）只有六个字：找那个签字的人。\n\n开曼那家公司叫 Fairstead Materials，2019 年注册，地址是家信托公司的信箱。它在附注里出现过两次：一次在应收账款前五大客户，一次在一笔设备采购里，都归在“独立第三方”。\n\n公司注册处的资料是公开的。Fairstead 香港子公司 2020 年周年申报表，董事栏写着一个名字：何维桢。我把名字丢进搜索框，前三页全是同名的人，第四页是一份 2003 年的校友通讯扫描件。里面有张{{workshop}}（研讨会）合影，说明那行列了十四个名字。\n\n第七个是何维桢。第九个是施慧敏——就是 Vivian Sze，公司的 CFO。我盯着屏幕看了三十秒，心口一{{sink}}（下沉）。\n\n老周在电话里给我上了十分钟{{lecture}}（训诫）：名字不是证据，同学更不是关联方。关联方有法律定义，你要找的是{{stake}}（持股）和控制，能写进{{consolidation scope}}（合并范围）的那种。\n\n何维桢毕业后做{{fiber}}（纤维）材料贸易，换过四家公司，注册资本都不超过五十万。Vivian 一路做到 CFO，去年{{compensation}}（薪酬）一千一百万港币，另有大笔期权。两条曲线 2019 年后开始咬合，像两只{{gear}}（齿轮）。\n\n它的中国关联实体在工商年报里报的收入，跟东亚新能源披露的对该客户采购额差了十七个亿。这个{{discrepancy}}（差异）不是四舍五入能解释的。Danny 说这些壳公司像一群{{refugee}}（流亡者），在法域之间搬家。\n\n更{{classic}}（经典的）的是合并范围。这家实体 2021 年短暂纳表，2022 年又被移出，理由是“失去控制”。同一年它的采购额翻了三倍——出表那年交易量最大。\n\n销售合同模板附件里有一条：货物在客户书面通知前由公司代为保管。这是{{bill and hold}}（已开票未发货）的写法，条件本该极严，但写在纸上谁都能写。{{ingredient}}（成分）都齐了。\n\n接下来是{{scuttlebutt}}（草根调研）。我托一个在物流做调度的朋友打听那园区的出货。他回：三年里车队去过一次，装的是设备，不是货。他正在换班，背景全是柴油机的响。\n\n然后是{{statistics}}（统计资料）。同业二十六家的人均产出画成散点图，用最笨的{{formula}}（公式）：收入除以员工数。东亚新能源是唯一的{{outlier}}（异常值），高出第二名四倍。\n\n那天下午压力开始{{mount}}（增长）：不只我们在做。纽约一家{{activist short seller}}（激进做空机构）当天发了报告，四十六页，结论一个词：{{uninvestable}}（不具备投资价值）。他们没有资金流那条线，但拿到两份合同。“比我们快，”Danny 说，“也比我们浅。”\n\nRay 没接话。他只在意一件事：市场一旦认定这是一个{{gang}}（一伙人）在协同做空，我们的证据都会被读成动机。\n\n接任的所提出：就算做完，最好也只能出{{qualified opinion}}（保留意见），且必须加{{going concern}}（持续经营）重大不确定性段落。年报的{{late filing}}（延迟披露）不会是几周，是几个月。\n\n一层层{{barrier}}（壁垒）挡在中间：语言的、法域的、程序的。我们能拿到的永远比知道的少。\n\n但那张合影不一样。它{{distinct}}（清楚的）到不需要解释：两个二十出头的人站在同一排，中间只隔着一个人。我把它做成一页，标题两个字：{{smoking gun}}（铁证）。老周看完摇头。\n\n“这还不是铁证，只是一个理由。真正的{{killer}}（杀手）在钱上——你要证明资金{{occupation}}（占用）：公司的钱什么时候、以什么名义、被谁拿走。”\n\n“找得到吗？”“找得到。”他摘老花镜擦，“那种事发生在真实世界里，真实世界会留下影子。”\n\n第二天早上，Ray 批了一笔预算：买三年的卫星存档。","ft":[{"w":"activist short seller","z":"激进做空机构","d":"公开发报告并主动做空、推动股价下跌的机构，如浑水一类","a":"","p":""},{"w":"bill and hold","z":"已开票未发货","d":"货未发出就确认收入，只在极严格条件下才被允许","a":"","p":""},{"w":"consolidation scope","z":"合并范围","d":"哪些子公司并表，随意进出合并范围是典型红旗","a":"","p":""},{"w":"discrepancy","z":"差异；对不上","d":"两个来源的数据互相矛盾，做空报告的关键证据","a":"","p":"dis'krepәnsi"},{"w":"going concern","z":"持续经营","d":"审计师对公司能否活下去的判断，被提示即重大风险","a":"","p":""},{"w":"late filing","z":"延迟披露","d":"年报迟迟不出，多半是审计师与公司谈不拢","a":"","p":""},{"w":"outlier","z":"异常值","d":"与同业分布明显偏离的数据点，值得深挖","a":"","p":"'autlaiә"},{"w":"qualified opinion","z":"保留意见","d":"审计师对个别事项无法认可而出具的非标意见","a":"","p":""},{"w":"scuttlebutt","z":"草根调研","d":"从产业链各方打听真实情况的调研方法","a":"","p":"'skʌtlbʌt"},{"w":"smoking gun","z":"铁证","d":"无法辩解的直接证据，做空报告的杀手锏","a":"","p":"ˈsməʊkɪŋ ɡʌn"},{"w":"uninvestable","z":"不具备投资价值","d":"做空报告的定性结论，意指这只股票不该碰","a":"","p":""}],"iw":[{"w":"sink","p":"siŋk","t":"n. 藏垢的场所, 沟渠, 污水槽; vi. 下沉, 沉没, 下陷, 减弱, 衰退, 消沉, 堕落, 渗透; vt. 使低落, 使下沉, 陷于, 投入(资金等), 挖掘"},{"w":"workshop","p":"'wә:kʃɒp","t":"n. 工场, 车间, 研讨会; 讨论会; 专题研究组"},{"w":"lecture","p":"'lektʃә","t":"n. 演讲, 谴责, 讲稿; vt. 演讲, 训诫, 说教; vi. 讲演"},{"w":"ingredient","p":"in'gri:diәnt","t":"n. 成分, 因素; 配合剂; 拼料; 成分; 组分"},{"w":"occupation","p":".ɒkju'peiʃәn","t":"n. 职业, 占有, 占有期, 占领, 占领军; 占有, 占用, 职业"},{"w":"stake","p":"steik","t":"n. 桩, 炮烙刑, 木柱, 赌注, 奖金; vt. 打桩, 用桩撑, 下赌注, 资助; vi. 打赌"},{"w":"fiber","p":"'faibә","t":"n. 纤维, 构造, 纤维制品; 纤维"},{"w":"mount","p":"maunt","t":"n. 乘骑用马, 框, 衬纸, 山; vi. 乘马, 爬上, 增长; vt. 爬上, 使上马, 装上, 装裱, 安放, 制作...的标本, 设置, 上演; 安装"},{"w":"refugee","p":".refju'dʒi:","t":"n. 难民, 流亡者; 避难者, 流亡者, 难民"},{"w":"formula","p":"'fɒ:mjulә","t":"n. 客套语, 公式, 准则; 公式"},{"w":"guidance","p":"'gaidns","t":"n. 指导, 领导; 导"},{"w":"statistics","p":"stә'tistiks","t":"n. 统计学, 统计资料; 统计信息"},{"w":"gear","p":"giә","t":"n. 齿轮, 工具; vt. 以齿轮连起, 开动, 使适应, 安排; vi. 连接上, 适合"},{"w":"barrier","p":"'bæriә","t":"n. 障碍, 栅栏; 势垒; 阻片; 阻挡层"},{"w":"distinct","p":"dis'tiŋkt","t":"a. 清楚的, 显著的, 不同的"},{"w":"assign","p":"ә'sain","t":"vt. 分配, 指派, 赋值; 赋值"},{"w":"compensation","p":".kɒmpen'seiʃәn","t":"n. 补偿, 赔偿金, 工资; 代偿(机能), 补偿"},{"w":"killer","p":"'kilә","t":"n. (非正式)杀人者, 屠杀者, 猛兽, 致死(疾病), 杀手, 止痛药, 限制器, 瞄准器; 删除程序; 断路器"},{"w":"gang","p":"gæŋ","t":"n. 队, 群, 帮; vi. 成群结队, 结成一伙; vt. 使成群结队"},{"w":"classic","p":"'klæsik","t":"n. 古典作品, 杰作, 大艺术家; a. 第一流的, 最优秀的, 古典的"}],"doc":{"k":"独立调查委员会公告","en":"The Special Committee wishes to update shareholders. Following the report published by an activist short seller, the Committee and its forensic advisers have begun reviewing the discrepancy between amounts recorded as purchases from a principal counterparty and the revenue reported by that counterparty in its public filings. The Committee is also reviewing the basis on which that entity entered and subsequently left the consolidation scope of the Group, and the application of bill and hold arrangements under the Group's standard sales contracts. Certain per-employee ratios appear as an outlier against industry peers. Shareholders are cautioned that the auditor has indicated a qualified opinion and a going concern paragraph may be unavoidable, and that late filing of the annual results should be expected.","zh":"特别委员会谨此向股东提供最新资料。继一家激进做空机构发表报告后，本委员会及其法务顾问已着手核查以下差异：本集团记录的向一名主要交易对手的采购金额，与该交易对手在其公开备案中呈报的收入之间存在出入。本委员会亦正在检视该主体进入并其后退出本集团合并范围的依据，以及本集团标准销售合同项下已开票未发货安排的适用情况。本集团若干人均比率相对同业呈现为异常值。谨提请股东注意：核数师已表示，出具保留意见并加入持续经营段落或难以避免，年度业绩延迟披露亦属预期之内。"}},{"i":49,"ti":"三年三十六张图，停车场一直是空的","dom":"fraud","sc":"卫星图与另类数据","tx":"数据商是家{{Canadian}}（加拿大的）公司，卖的是{{satellite}}（卫星）影像的历史存档。Ray 批的预算刚好够买三年，三十六期，覆盖江西那个基地十二平方公里。\n\n对方销售很实在：我们的星每十六天{{sweep}}（扫过）同一个点，云太厚的几期作废。他问要不要买停车场计数的成品数据。我说不要，我要原图。“为什么？”“成品数据是别人替我{{tackle}}（处理）过的，我想自己看。”\n\n图周三下午到。Danny 买了一{{bunch}}（一串）香蕉和两板{{chocolate}}（巧克力）搁桌上，说今晚不回去了。我们从最早那期翻起。\n\n2022 年 3 月，厂区北侧停车场是空的。2022 年 9 月，空的。2023 年 2 月是春节，{{vacation}}（假期）期间本来就没人，不算数。2023 年 5 月，空的。2024 年 1 月，空的。\n\n三十六期里有二十九期能看清地面。这二十九期，那片停车场加起来停过十一辆车，其中七辆在同一位置三年没挪过——一块被杂草围住的白色影子。\n\n同期，公司说这个基地有六千八百名员工，三班倒。\n\n我把 2023 年 8 月正午那张放大到极限。屋顶、道路、堆场，看不见一件{{clothing}}（衣服）的颜色。正午的正极材料厂，本该到处是蓝工服。\n\nDanny 把一块巧克力{{pitch}}（投掷）过来，砸在我键盘上：“不用看了，这张图比三十七页报告更{{pregnant}}（意味深长的）。”\n\n他说得对。但得{{conscious}}（有意识的）一点：一张照片能被解释成任何东西，我们需要能对上的东西。\n\n第一条是{{social insurance contributions}}（社保缴纳人数）。当地公开系统查得到总数：那家实体去年参保两千一百人。六千八百和两千一百之间的距离比任何图都硬。\n\n第二条是{{bill of lading}}（提单）。出口那条线走海运，提单号可查。三年里从那港口发出、收货人是它前五大客户的柜子，加起来不到披露出货量的一成五。\n\n第三条是账。{{receivables ageing}}（应收账款账龄）里一年以上的占四成七，同业中位数是六。这不是回款慢，是收不回来——当初确认的收入本来就{{distant}}（遥远的），远到看不见对手方。再往下是{{overstated assets}}（资产虚增）：在建工程挂着四十一亿，而卫星图上那块地三年没有新的基础开挖。\n\nRay 让我把这些做成第三版{{draft}}（草稿）。\n\n“{{adjusted EBITDA}}（调整后EBITDA）那段重写。它把股权激励、汇兑、研发资本化全加回来，加完比经营现金流高出五十亿。这不是口径，是修辞。”\n\n我补了两段。{{cookie jar reserves}}（利润蓄水池）：好年份多提、差年份冲回，利润曲线被熨得比{{universal}}（普遍的）行业周期还平。{{goodwill impairment}}（商誉减值）：2021 年那笔收购形成的商誉，一分没减。\n\n报告第一行照旧是{{we are short}}（我们持有空头仓位）。利益冲突写在最前面是规矩，也是我的{{preference}}（偏好）。\n\n问题出在借券。Danny 打完一圈电话脸色不好：{{securities lending}}（融券）费率从年化 4% 跳到 28%，两家提出提前召回。做空最讽刺的就在这儿——你越接近对的，成本越{{awful}}（可怕的）。\n\n“再{{yield}}（屈服）一点点就行，”他说，“撑到复牌。”\n\n傍晚，A 股一家给它供过设备的上市公司收到{{letter of concern}}（关注函），问的正是同一笔交易。而全市场十一家覆盖，到这天还有三家在做它的{{advocate}}（拥护者）。\n\n我们做{{due diligence}}（尽职调查）做了七个月，公司的{{spin}}（说辞）也编了七个月。真正把两边拉平的，是一张没有人的停车场。\n\nRay 交代最后一件事：每张原图留档，元数据不许动，将来可能要拿去做{{testimony}}（证据）。\n\n十一点他从纽约打回来。\n\n“明天上午港交所会出复牌指引。”他停了一下，“我看过条件了。林砚，我们可能等不到复牌那天。”","ft":[{"w":"adjusted EBITDA","z":"调整后EBITDA","d":"被反复加回各种费用的利润口径，非常容易被美化","a":"","p":""},{"w":"bill of lading","z":"提单","d":"海运单据，能反映真实发货量与交易对手","a":"","p":""},{"w":"cookie jar reserves","z":"利润蓄水池；秘密准备","d":"好年份多计提、坏年份冲回，人为熨平利润曲线","a":"","p":""},{"w":"due diligence","z":"尽职调查","d":"对公司业务与财务的核查过程，业内简称尽调","a":"DD","p":"dju: ˈdɪlədʒəns"},{"w":"goodwill impairment","z":"商誉减值","d":"并购泡沫破灭后的集中计提，常一次性抹掉多年利润","a":"","p":""},{"w":"letter of concern","z":"关注函","d":"A股交易所就可疑事项发出的关注性函件","a":"","p":""},{"w":"overstated assets","z":"资产虚增","d":"账面资产远高于实际价值，甚至根本不存在","a":"","p":""},{"w":"receivables ageing","z":"应收账款账龄","d":"长账龄应收占比高，说明确认的收入可能收不回来","a":"","p":""},{"w":"securities lending","z":"融券；借券","d":"做空必须先借到股票，借券难易决定能否做空","a":"","p":""},{"w":"social insurance contributions","z":"社保缴纳人数","d":"公开的参保人数，用来验证公司披露的员工规模","a":"","p":""},{"w":"we are short","z":"我们持有空头仓位","d":"做空报告开头的持仓披露，说明作者存在利益冲突","a":"","p":""}],"iw":[{"w":"vacation","p":"vei'keiʃәn","t":"n. 假期, 休假; 假期, 停审期, 休庭期"},{"w":"advocate","p":"'ædvәkeit","t":"n. 提倡者, 拥护者; vt. 主张, 提倡"},{"w":"draft","p":"dræft. drɑ:ft","t":"n. 气流, 草稿, 汇票, 草案; vt. 起草, 征兵; 草稿"},{"w":"pregnant","p":"'pregnәnt","t":"a. 怀孕的, 充满的, 思想丰富的, 成果丰硕的; 妊娠的, 有孕的"},{"w":"distant","p":"'distәnt","t":"a. 远的, 疏远的; 远期的"},{"w":"satellite","p":"'sætlait","t":"n. 人造卫星; 伴行静脉, 陪静脉, 陪病部, 随体, 卫星"},{"w":"conscious","p":"'kɒnʃәs","t":"a. 有意识的, 知觉的, 觉察的; 有意识的, 清醒的"},{"w":"tackle","p":"'tækl","t":"n. 工具, 复滑车, 滑车, 装备, 扭倒; vt. 固定, 处理, 抓住; vi. 扭倒"},{"w":"chocolate","p":"'tʃɒkәlit","t":"n. 巧克力; a. 巧克力制的"},{"w":"sweep","p":"swi:p","t":"n. 扫除, 打扫, 肃清, 视野, 范围, 全胜; vt. 扫除, 掸去, 猛拉, 扫荡, 肃清, 冲走, 刮起, 环视, 掠过, 扫射; vi. 扫, 打扫, 袭击, 席卷, 扫视, 掠过"},{"w":"Canadian","p":"kә'neidiәn","t":"a. 加拿大的"},{"w":"preference","p":"'prefәrәns","t":"n. 偏爱, 优先, 喜爱物; 首选项"},{"w":"universal","p":".ju:ni'vә:sl","t":"a. 全世界的, 普遍的, 宇宙的, 通用的; n. 一般概念"},{"w":"spin","p":"spin","t":"n. 旋转, 自旋, 疾驰, 情绪低落; vt. 纺织, 纺, 使旋转, 编造; vi. 纺纱, 吐丝, 作茧, 结网, 旋转, 自旋, 疾驰"},{"w":"clothing","p":"'klәuðiŋ","t":"n. 衣服"},{"w":"pitch","p":"pitʃ","t":"n. 程度, 坡度, 顶点, 前倾, 倾斜, 投掷, 音高, 螺距, 节距, 摊位, 树脂, 沥青; vt. 投, 掷, 向前倾跌, 扎营, 竭力推销, 为...定调, 定位于, 用沥青涂; vi. 搭帐篷, 投掷, 向前跌, 猛然摔倒, 坠落, 倾斜; 孔距"},{"w":"yield","p":"ji:ld","t":"n. 生产量, 投资收益; vt. 出产, 给予, 让出, 放弃, 使屈服; vi. 出产, 屈服, 投降, 倒塌"},{"w":"bunch","p":"bʌntʃ","t":"n. 串, 束; 骨肿块(马)"},{"w":"awful","p":"'ɒ:ful","t":"a. 可怕的, 庄严的, 虔敬的"},{"w":"testimony","p":"'testimәni","t":"n. 证言, 证据, 声明; 证据"}],"doc":{"k":"独立调查委员会中期进展公告","en":"The Special Committee provides the following interim update. The forensic advisers have completed the first phase of their due diligence on the Jiangxi facility. Their work has compared disclosed employee numbers against social insurance contributions filed locally, and disclosed shipment volumes against bill of lading records obtained from the relevant port. The advisers have also reviewed the receivables ageing profile, the basis on which adjusted EBITDA has been presented, and whether provisioning practices are consistent with cookie jar reserves. Preliminary findings indicate that certain construction in progress may constitute overstated assets, and that a goodwill impairment arising from the 2021 acquisition has not been recognised. The Committee is unable to confirm the Company's previously reported production capacity.","zh":"特别委员会谨此提供以下中期进展。法务顾问已完成对江西基地尽职调查的第一阶段工作，将披露的员工人数与当地备案的社保缴纳人数作了比对，并将披露的出货量与自相关港口取得的提单记录作了比对。顾问亦已检视应收账款账龄结构、调整后EBITDA的列报基础，以及计提做法是否构成利润蓄水池。初步发现显示，若干在建工程可能属于资产虚增，且 2021 年收购所产生的商誉减值并未确认。本委员会目前无法确认公司此前呈报的产能。"}},{"i":50,"ti":"十八个月，五个条件，令本所满意","dom":"fraud","sc":"退市与除牌","tx":"复牌指引是上午九点半{{distribute}}（发布）出来的，五条，中英文各一页。\n\n我在楼梯间读完。电梯坏了，爬到十一层，读到第三条还在{{pant}}（喘息）。\n\n第一条：公布所有欠缺的财务业绩，处理审计师的保留事项。翻译过来是：你得先让人肯签字，而桌上最好的结果是{{adverse opinion}}（否定意见）。\n\n第二条：就做空报告的指控独立调查、公布结果、补救。主导的是{{special committee}}（特别委员会），三名独立董事，上周走了一个。\n\n第三条：证明拥有足够的业务运作及资产。第四条：披露所有重大信息。第五条：完成内控检讨并证明有效。\n\n每一条后面都跟着同一句：令本所{{satisfaction}}（满意）。这是港交所文件里最常见也最狠的一句——标准不在纸上，在人手里。期限十八个月，不复牌就除牌。Danny 读了两遍，说写得真{{impressive}}（令人印象深刻的）。“漂亮，”我说，“也几乎不可能完成。”\n\n第一条要先把三年的账{{reconcile}}（勾稽）一遍：公司系统、银行记录、工商备案，三套数对到能互相解释。而我们知道对不上。\n\n第二条要拿到{{cooperation}}（配合）。可这几个月配合最稀缺——两名内地财务离职，一台服务器“例行维护”。\n\n第三条要证明业务真实存在。可全市场都看过那张停车场的图，算过{{headcount}}（员工人数）：两千一百对六千八百。\n\n老周问最后会怎么收场。“大概率不复牌，”我说，“最后剩一个{{listing shell}}（壳资源）。”他点头：“这种{{ownership}}（所有权）游戏最后都变成壳的价格。以前一个壳卖三亿，现在卖不动了。”\n\n下午我们把{{corporate registry filings}}（工商登记资料）重过一遍，从股东、地址翻到历任法定代表人，拉出实控人的{{profile}}（侧写）。图上七家公司、六个自然人，两条线落在同一个村的两个门牌。这就是{{self-dealing}}（自我交易）的形状：管理层站在交易两头。\n\n“做这行三十年，”老周说，“我见过的{{practitioner}}（从业者）里做到这个程度的没几个。他们不是不懂规则，是太懂了。”\n\n真正让我发凉的是{{paper trail}}（书面证据链）：七年的合同、单据、备案，每一份都真实存在，每一份都指向一门不存在的生意。\n\n三点，一封邮件进了我的私人信箱，发件人是串乱码。正文两行：“我是那家实体的前财务经理，可以做{{whistleblower}}（举报人）。但我要先知道，说完之后会怎么样。”\n\n附件是张照片：一份会议纪要的一角，日期在三年前。我把手机扣在桌上，隔了一个{{interval}}（间隔）才拿起来。那一瞬间脑子里全是{{confusion}}（混乱）——这是真的，还是有人给我下套。\n\nDanny 递过来一盒{{tissue}}（纸巾）。我说我没哭，是空调吹的。Ray 只问一句：能不能证明他{{qualify}}（有资格）作为知情人。“{{provided}}（倘若）他说得出那笔设备采购的具体流转，”我说，“就能。”\n\n除牌不会有{{ceremony}}（仪式）。上市那天敲过锣，退场没有。行情软件上那个代码是灰的，报价窗口像个被{{disabled}}（停用的）按钮，交易早已{{cease}}（停止），只有美元债还在报价：二十七、二十三、十九。\n\n我想起两年前路演上那种{{enthusiasm}}（热情），满屋子人跟着一个数字走，像一群{{sheep}}（羊）。{{earnings management}}（盈余管理）起初不过是把这季度的利润挪到下季度，用最温和的{{measurement}}（衡量）尺度。等它变成今天这样，中间隔了七年——没有哪一天是它变坏的那一天。\n\nRay 说现在只剩一个办法：{{boots on the ground}}（实地蹲点）。派人去园区门口驻着，数车、数人，数三个月。最笨的{{resort}}（手段），也是唯一还能拿到新证据的路。\n\n我说我去。\n\n他说不行。\n\n我问为什么。\n\n他把手机转过来。屏幕上是一条短信，来自 Wendy Chan：林小姐，明天下午有空吗？想请你喝杯咖啡。谈的不是公司。","ft":[{"w":"adverse opinion","z":"否定意见","d":"审计师认为报表整体不公允，最严厉的审计结论","a":"","p":""},{"w":"boots on the ground","z":"实地蹲点","d":"派人长期驻点数车数人，做空报告的经典取证方式","a":"","p":""},{"w":"corporate registry filings","z":"工商登记资料","d":"股东、地址、法人等公开信息，用于穿透关联方","a":"","p":""},{"w":"earnings management","z":"盈余管理","d":"在准则边缘调节利润节奏，未必违法但常是造假前奏","a":"","p":""},{"w":"headcount","z":"员工人数","d":"人均产出高得离谱，往往说明收入是编出来的","a":"","p":"ˈhedkaʊnt"},{"w":"listing shell","z":"壳资源；壳股","d":"无实质业务但保有上市地位的公司，专供借壳之用","a":"","p":""},{"w":"paper trail","z":"书面证据链","d":"合同、单据、备案等可追溯的书面痕迹","a":"","p":"ˈpeipə treil"},{"w":"reconcile","z":"勾稽；对账","d":"核对不同报表或不同来源的数据能否对得上","a":"","p":"'rekәnsail"},{"w":"self-dealing","z":"自我交易","d":"管理层与自家公司做交易，为自己一方争取利益","a":"","p":"'selfd'i:lɪŋ"},{"w":"special committee","z":"特别委员会","d":"由独立董事组成，负责主导独立调查的临时机构","a":"","p":""},{"w":"whistleblower","z":"举报人；吹哨人","d":"内部人向监管或媒体揭发问题，做空报告的重要线索","a":"","p":"'wɪsəlˌbləʊə"}],"iw":[{"w":"distribute","p":"di'stribju:t","t":"vt. 分配, 散布, 分发; 分配, 分发"},{"w":"measurement","p":"'meʒәdmәnt","t":"n. 尺寸, 度量, 度量单位; 度量, 度量单位"},{"w":"cooperation","p":"kәu.ɒpә'reiʃәn","t":"n. 合作, 协力, 配合; 合作"},{"w":"ceremony","p":"'serimәni","t":"n. 典礼, 仪式, 礼节; 典礼, 仪式"},{"w":"disabled","p":"dis'eibld","t":"a. 残废的, 有缺陷的, 失效的; 失效的"},{"w":"ownership","p":"'әunәʃip","t":"n. 所有权, 物主身份; 所有权, 所有制"},{"w":"practitioner","p":"præk'tiʃәnә","t":"n. 从业者, 开业者; 行医者, 医师"},{"w":"profile","p":"'prәufail","t":"n. 侧面, 轮廓, 传略; vt. 描绘...轮廓, 写...的传略; 提问档; 剖面图法; 剖面法"},{"w":"enthusiasm","p":"in'θju:ziæzәm","t":"n. 巨大的热情, 热心"},{"w":"cease","p":"si:s","t":"n. 停止; v. 停止, 终了"},{"w":"impressive","p":"im'presiv","t":"a. 给人深刻印象的, 威严的"},{"w":"satisfaction","p":".sætis'fækʃәn","t":"n. 满足, 满意, 快事, 赔偿, 赎罪, 报仇的机会; 偿还, 赎回"},{"w":"resort","p":"ri'zɒ:t","t":"n. 度假胜地, 手段, 凭借, 常去之地; vi. 诉诸, 常去"},{"w":"qualify","p":"'kwɒlifai","t":"vi. 取得资格, 有资格; vt. 使有资格, 使合格, 限定, 限制, 准予"},{"w":"tissue","p":"'tiʃu:","t":"n. 薄的织物, 薄纱, 棉纸, 组织, 一套; 组织"},{"w":"interval","p":"'intәvәl","t":"n. 间隔, 距离, 间歇, 间隙; 时间间隔"},{"w":"pant","p":"pænt","t":"n. 喘息, 悸动; vi. 喘息, 渴望; vt. 气喘吁吁地说"},{"w":"confusion","p":"kәn'fju:ʒәn","t":"n. 混乱, 混淆, 无秩序; 含混"},{"w":"provided","p":"prә'vaidid","t":"conj. 倘若, 以...为条件"},{"w":"sheep","p":"ʃi:p","t":"n. 羊, 胆小者"}],"doc":{"k":"复牌指引公告","en":"The Exchange has imposed the following resumption guidance on the Company. The Company must: (1) publish all outstanding financial results and address any audit modification, including the adverse opinion indicated by the incoming auditor; (2) procure the special committee to complete an independent investigation into the allegations of self-dealing and earnings management, announce its findings and take appropriate remedial action; (3) reconcile its accounting records against bank records and corporate registry filings, and produce the supporting paper trail; (4) disclose all material information, including actual headcount at each production base and any matters raised by a whistleblower; and (5) demonstrate adequate operations and assets, in each case to the satisfaction of the Exchange, failing which the listing will be cancelled.","zh":"本所已就贵公司施加以下复牌指引。公司须：（1）刊发所有欠缺的财务业绩，并处理任何审计意见修饰事项，包括接任核数师所示意的否定意见；（2）促使特别委员会就有关自我交易及盈余管理的指控完成独立调查、公布调查结果并采取适当补救行动；（3）将其会计记录与银行记录及工商登记资料勾稽核对，并提供相应的书面证据链；（4）披露所有重大信息，包括各生产基地的实际员工人数，以及任何举报人提出的事项；（5）证明其拥有足够的业务运作及资产。以上各项均须令本所满意，否则本所将取消贵公司的上市地位。"}},{"i":51,"ti":"咖啡是她请的","dom":"reg","sc":"证监会调查","tx":"Wendy Chan 挑的地方在中环一栋旧楼的二层。窗上那排百叶{{blind}}（窗帘）拉到一半，阳光被切成一条一条，铺在桌面上。\n\n她比我早到十分钟，一杯黑咖啡，没加糖。旁边坐着个不说话的年轻人，她介绍说是她的{{assistant}}（助理）。年轻人打开笔记本，全程没抬过头。\n\n\"今天是自愿性质，\"她说，\"你随时可以走。\"\n\n我说我知道。但她带了记录的人，这句话就只剩{{theoretical}}（理论上的）意义。\n\n她推过来一份很薄的文件。第一页是{{summary}}（摘要），三段。我读到第二段就明白了：这一次被看的不是东亚新能源，是远岑。\n\n第一条，{{market manipulation}}（市场操纵）。第二条，{{wash trading}}（对倒交易）。第三条，{{painting the tape}}（做量）。\n\n\"这三条我一条都不认。\"\n\n\"没有人要你现在认，\"她说，\"我只是要你知道桌上摆着什么。\"\n\n我端起杯子，手是稳的，心跳不是。做空这一年我预设过各种{{encounter}}（遭遇）——公司起诉、传闻、跟车的人。唯独没预设过坐在对面的是她。\n\n她翻到第二页。那是一份{{catalogue}}（目录）：过去十四个月我通过{{expert network}}（专家网络）安排的四十一次付费访谈，时间、时长、访谈对象所属行业，一条不落。\n\n\"你们的{{storage}}（存储器）里留了很多东西。\"\n\n\"纪要全部归档，也全部做过合规备案。\"\n\n\"我知道。\"她把那页转正，\"我要问的是另一件事。其中六次，发生在我们内部把这只股票列入敏感范围之后。\"\n\n我说那是巧合。她说她不用这个词。\n\n她讲了监管的{{incentive}}（动机）：他们不需要证明我做空是错的，只要证明我在信息上处于{{dominant}}（占优势的）位置。\n\n第三页是处罚清单，写得很干。{{civil penalty}}（民事罚款），按获利倍数算；{{industry bar}}（市场禁入），三年起；最重的一条是{{revocation of licence}}（吊销牌照）——远岑的牌照一没，基金当天清盘。\n\n\"还有一件事你要{{accurate}}（准确的）地记住，\"她说，\"{{statute of limitations}}（追诉时效）从行为发生日起算，不是从我们找你那天起算。你以为过去的事，可能还没过去。\"\n\n我问她纽约那边呢。\n\n她说她不代表纽约，但可以提醒我两件。一，如果那边发出拟指控通知，我有一次机会提交{{Wells submission}}（韦尔斯申辩书），那是正式指控前唯一一次把自己的话写进卷宗的机会；二，他们的检察官会给愿意先开口的人安排{{proffer session}}（坦白会谈），而第一个坐下来的人，条件永远最好。\n\n\"我不是内部人，我是研究员。\"\n\n\"我知道，\"她说，\"但在这套{{architecture}}（体系结构）里，谁先坐下，谁就是内部人。\"\n\n窗外一辆双层巴士停了很久。我忽然想起 Ray 那句挂在嘴边的话：做空是一场关于时间的{{bet}}（赌注）。以前听着觉得帅，现在像句判词。\n\n她合上文件，语气软了半分。\n\n\"整个{{Asia}}（亚洲）区这两年都在收紧。有一批在美国上市的公司因为{{Holding Foreign Companies Accountable Act}}（外国公司问责法）被逼到退市线上，底稿连着三年调不出来；这边数据量大的公司想出去，得先过{{cybersecurity review}}（网络安全审查）。规则被{{strengthen}}（加强）了，可查案的人手只有那个{{minimum}}（最低）配置。所以我们会挑，挑最能立规矩的那一个。\"\n\n\"你们打算拿我立规矩。\"\n\n\"我们打算把事情弄清楚。\"她说，\"这两句话有时候是同一句。\"\n\n她起身买单。走之前把杯子往我这边推了半寸，说了最后一段，我一个字没敢漏：\n\n\"这行有一种{{genetic}}（遗传的）毛病，一代传一代——看见对的东西，就以为自己做的每件事都是对的。它像个{{virus}}（病毒），传得比消息还快。你要是真想活下来，就别做那些{{strategic}}（战略上的）盘算，别猜我们下一步。你的建仓时间只要有一天{{exceed}}（超过）了报告里那句'我们于近期建立空头头寸'，所有跟这只票{{related}}（有关联的）的动作都会被重新解释一遍。\"\n\n我走出旧楼，海风迎面。手机震了两下。\n\nDanny 发来一张照片：我们办公室的玻璃门外站着四个人，两个穿制服。配文只有五个字——\n\n\"他们上来了。\"","ft":[{"w":"Holding Foreign Companies Accountable Act","z":"外国公司问责法","d":"美国法律，审计底稿连续多年无法检查的中概股面临退市","a":"HFCAA","p":""},{"w":"Wells submission","z":"韦尔斯申辩书","d":"当事人收到拟指控通知后提交的书面抗辩意见","a":"","p":""},{"w":"civil penalty","z":"民事罚款","d":"监管机构对违规主体作出的金钱处罚，不涉刑事定罪","a":"","p":""},{"w":"cybersecurity review","z":"网络安全审查","d":"涉及大量数据的企业赴境外上市前须通过的国家审查","a":"","p":""},{"w":"expert network","z":"专家网络","d":"撮合投资者与行业专家付费访谈的中介，曾是内幕交易高发环节","a":"","p":""},{"w":"industry bar","z":"市场禁入；行业禁入","d":"禁止当事人在一定期限或终身从事证券业务的处罚","a":"","p":""},{"w":"market manipulation","z":"市场操纵","d":"以人为手段影响价格或成交量、误导其他投资者的违法行为","a":"","p":""},{"w":"painting the tape","z":"做量；粉饰成交记录","d":"通过尾市集中交易制造活跃或特定收盘价的操纵行为","a":"","p":""},{"w":"proffer session","z":"坦白会谈","d":"嫌疑人在有限豁免下向检方交代事实，以争取宽大处理","a":"","p":""},{"w":"revocation of licence","z":"吊销牌照","d":"监管撤销机构或个人的执业资格，属最重的行政处罚之一","a":"","p":""},{"w":"statute of limitations","z":"追诉时效；诉讼时效","d":"法律规定提起追诉或索赔的最长期限，逾期则丧失权利","a":"","p":""},{"w":"wash trading","z":"对倒交易","d":"同一实际控制人自买自卖，制造虚假成交量的操纵手法","a":"","p":""}],"iw":[{"w":"bet","p":"bet","t":"n. 打赌, 赌注; v. 打赌"},{"w":"virus","p":"'vaiәrәs","t":"n. 病毒, 滤过性病毒, 毒害; 病毒"},{"w":"strategic","p":"strә'ti:dʒik","t":"a. 战略的, 战略上的; 战略的"},{"w":"storage","p":"'stɒ:ridʒ","t":"n. 存储器, 储藏, 保管, 库存, 仓库; 存放处; 存储"},{"w":"assistant","p":"ә'sistәnt","t":"n. 助手, 助理, 助教; a. 有帮助的, 辅助的, 助理的"},{"w":"strengthen","p":"'streŋθәn","t":"vt. 加强, 变坚固; vi. 变强, 股票上涨"},{"w":"summary","p":"'sʌmәri","t":"n. 摘要, 概要; a. 摘要的, 简略的; 摘要; 概要"},{"w":"catalogue","p":"'kætәlɒg","t":"n. 目录, 大学情况一览; vt. 编入目录"},{"w":"architecture","p":"'ɑ:kitektʃә","t":"n. 建筑学, 建筑式样; 体系结构"},{"w":"encounter","p":"in'kauntә","t":"n. 相会, 相遇, 遭遇; vt. 遇见, 邂逅, 会战; vi. 偶然相遇"},{"w":"minimum","p":"'minimәm","t":"a. 最小的, 最低的; n. 最小值; 最小值"},{"w":"blind","p":"blaind","t":"n. 蒙蔽物, 窗帘; a. 盲目的, 瞎的, 不加思考的; vt. 使失明, 蒙蔽, 遮暗; adv. 盲目地"},{"w":"exceed","p":"ik'si:d","t":"vt. 超过, 超越, 胜过; vi. 超过其他"},{"w":"dominant","p":"'dɒminәnt","t":"a. 占优势的, 支配的; 优性的, 显性的"},{"w":"Asia","p":"'eiʒә","t":"n. 亚洲"},{"w":"genetic","p":"dʒi'netik","t":"a. 创始的, 遗传的, 起源的, 遗传学的; 生殖的, 遗传的"},{"w":"incentive","p":"in'sentiv","t":"n. 动机; a. 激励的"},{"w":"related","p":"ri'leitid","t":"a. 讲述的, 叙述的；有关系的, 有关联的"},{"w":"accurate","p":"'ækjurәt","t":"a. 正确的, 精确的; 准确的, 精确的"},{"w":"theoretical","p":"θiә'retikәl","t":"a. 理论的, 理论上的, 假设的, 推理的; 理论的"}],"doc":{"k":"监管问话通知","en":"NOTICE REQUIRING ATTENDANCE. Pursuant to the Ordinance, you are required to attend before an investigator of the Commission and to answer questions on oath. The Commission is investigating whether market manipulation, including wash trading and painting the tape, was carried out in the securities of a listed issuer. All records of engagements arranged through any expert network must be produced in unredacted form. Should the investigation conclude adversely, the Commission may seek a civil penalty, an industry bar, or, in the most serious cases, revocation of licence. Your attention is drawn to the applicable statute of limitations, which runs from the date of the conduct concerned. Where parallel proceedings are commenced overseas, a Wells submission may be filed within the prescribed period.","zh":"问话通知。根据本条例规定，阁下须到证监会调查人员席前接受问话，并在宣誓后回答提问。本会正在调查某上市发行人的证券是否存在市场操纵行为，包括对倒交易与做量。凡经由任何专家网络安排的访谈记录，均须以未经遮盖的原件形式提交。倘调查结论不利，本会可寻求处以民事罚款、市场禁入，情节最严重者可吊销牌照。请阁下注意适用的追诉时效，该期限自相关行为发生之日起算。倘境外同时展开平行程序，阁下可在规定期限内提交韦尔斯申辩书。"}},{"i":52,"ti":"报告之前十九天","dom":"reg","sc":"市场操纵指控","tx":"四个人里只有一个说话。他出示证件，说这是{{dawn raid}}（突击搜查），依法执行。时间是上午十点二十，太阳很好，一点也不 dawn。\n\nDanny 后来说，那是他这辈子第一次知道什么叫{{terror}}（惊悸）——不是害怕，是脑子空掉的那半秒。\n\n他们要的东西非常{{precise}}（精确的）：三台机器、两个人的手机、以及从建仓第一天起的全部下单记录。带队的递给 Ray 一份{{subpoena}}（传票），Ray 从头看到尾，只说了\"配合\"两个字，然后让所有人回工位。\n\n上个月这事还只是{{informal inquiry}}（非正式问询）——一封邮件，请我们\"自愿提供\"几份文件。从自愿到强制，中间隔了三十一天。\n\n十一点，公司那边的律师函到了。三页纸，用词讲究，翻成人话只有一句：远岑资本在报告发布之前就已经把仓位建好了，那份报告不是研究，是工具。\n\n信里给我们扣了四顶帽子：{{marking the close}}（尾市操纵收盘价）、{{parking}}（代持）、{{rumour-mongering}}（编造传播虚假信息），以及在他们看来最要命的一条——我们在公司发布{{profit alert}}（盈喜）当天集中下单。\n\n\"他们把因果调过来了，\"我说，\"是他们先发盈喜，我们才加的空。\"\n\n\"这两句话在法律上长得一模一样。\"Ray 说。\n\n他把外套挂好，坐下，从抽屉里翻出那本被我们叫做{{bible}}（圣经）的合规手册，说这东西他八年没打开过，今天要一页页读完。\n\n下午的会开成了一场{{Olympic}}（巨大的）级别的耐力赛，四点开始，九点没散。桌上是 Danny 买回来的鸡饭，{{rice}}（米饭）都坨成一块，没人动。\n\n合规的 Ivy 把{{watch list}}（观察名单）调出来，一行行念时间戳。这份名单从不对外，连我都是今天第一次看见自己的名字{{alongside}}（在旁边）2318 出现——名单上还有两只做{{solar}}（太阳能的）组件的票，都是我覆盖的。\n\n我们把三样东西并排贴在墙上：建仓记录、报告定稿时间、公司公告序列。三条时间线像三根平行的{{chart}}（图表）曲线。\n\n\"看这儿。\"我用笔尖点住第三条。最后一笔加空在 11 月 6 日 14:58，距离收盘还有两分钟。\n\nDanny 的脸白了。\"那单是我下的。\"\n\n\"为什么压到最后两分钟？\"\n\n\"因为盘口薄，我怕冲击成本。\"\n\n这是全世界交易员都会给的答案，也是全世界监管最不爱听的答案。\n\n我们花两个小时把那两分钟拆成秒：逐笔委托、撤单、成交回报，一条条对。结论是那两分钟我们占全市场成交的百分之四，而收盘价比我们下单前还高了半个价位——不但没把价格砸下去，反而是被人抬着走的。\n\n\"这就是{{replacement}}（代替者）证据，\"Ray 说，\"光说'我没做'没用，得拿'当时真正发生的是什么'去替换掉他们那个故事。\"\n\n十点，又来一件。一家美国律所在纽约替持股人提起了{{class action}}（集体诉讼），被告名单里除了公司和管理层，还有\"某些从公司股价下跌中获利的市场参与者\"。名字没点，指向很清楚。\n\n\"美国法院管得着香港的基金？\"Danny 问。\n\n\"只要有一分钱走过美国的清算通道，{{extraterritorial jurisdiction}}（长臂管辖）就能伸过来。\"\n\n同一晚，内地监管网站挂出一份{{administrative penalty decision}}（行政处罚决定书）。对象不是我们，是那家开曼公司在境内的一个关联主体：罚六十万，禁入五年。文书克制到没有一个形容词，却把三笔资金往来写得清清楚楚——那是我们找了半年的一段链条，突然免费送到眼前。\n\n而港交所把{{Listing Committee}}（上市委员会）的纪律聆讯排进了议程，他们有权直接{{strip}}（剥夺）一家发行人的上市地位。\n\n夜里我一个人坐地铁回家。过海时车厢钻进那条{{tunnel}}（隧道），灯闪了三下。我看着玻璃上自己的影子，忽然想通一件很朴素的事：这几个月我们都以为自己是拿着{{telescope}}（望远镜）的那一方，在很远的地方观察一家公司。原来从一开始，也有人在观察我们。\n\n我不属于任何{{elite}}（精英）圈子，也没有{{leisure}}（闲暇）去做长线规划。这一年我唯一学会的，是把{{complicated}}（复杂的）问题拆成一秒一秒。\n\n到家十二点半。浴室镜子上全是{{steam}}（蒸汽），我抹开一块。镜子里那张脸的{{strain}}（紧张）藏不住。\n\nRay 的消息进来：明早八点，把你个人账户的对账单全部打出来。\n\n我打了句\"你怀疑我？\"，删掉，改成\"好\"。\n\n这场{{tournament}}（锦标赛）打到这一轮，最有效的辩护从来不是否认，而是{{admission}}（承认）——承认每一件可以承认的事，把剩下那部分守死。\n\n第二天我到得最早。打印机吐出三十七页，我一页页看。翻到第二十九页，手停住了。\n\n上面有一笔 2318.HK 的成交。日期在报告发布前十九天。两万股。方向：买入。\n\n不是我下的。那片{{tremendous}}（巨大的）空白就那样落在纸上。","ft":[{"w":"Listing Committee","z":"上市委员会","d":"港交所内负责上市审批并对违规发行人作出纪律处分的委员会","a":"","p":""},{"w":"administrative penalty decision","z":"行政处罚决定书","d":"内地监管认定违法事实并作出罚款禁入等处罚的正式文书","a":"","p":""},{"w":"class action","z":"集体诉讼","d":"由代表人为全体受损投资者提起的共同诉讼","a":"","p":""},{"w":"dawn raid","z":"突击搜查","d":"监管或执法机构未经预告直接进入办公场所取证的行动","a":"","p":""},{"w":"extraterritorial jurisdiction","z":"长臂管辖；域外管辖","d":"一国将本国法律适用于境外主体与行为的管辖主张","a":"","p":""},{"w":"informal inquiry","z":"非正式问询","d":"监管在正式立案前以自愿配合方式索取资料的初步了解","a":"","p":""},{"w":"marking the close","z":"尾市操纵收盘价","d":"在收盘前突击下单以影响当日收盘价的违规操作","a":"","p":""},{"w":"parking","z":"代持；隐匿持股","d":"借他人名义持股以规避披露或持股比例限制的安排","a":"","p":"'pɑ:kiŋ"},{"w":"profit alert","z":"盈喜；正面盈利预告","d":"港股用语，指公司预告业绩将显著改善而发布的公告","a":"","p":""},{"w":"rumour-mongering","z":"编造传播虚假信息","d":"散布未经证实的消息影响股价，属市场失当行为","a":"","p":""},{"w":"subpoena","z":"传票","d":"强制要求提交文件或出庭作证的法律文书，收到即意味正式调查","a":"","p":"sәb'pi:nә"},{"w":"watch list","z":"观察名单；监察名单","d":"合规部门内部保密监控的敏感股票名单，不对外公布","a":"","p":""}],"iw":[{"w":"terror","p":"'terә","t":"n. 恐怖, 可怕的人; 惊吓, 惊悸"},{"w":"elite","p":"ei'li:t","t":"n. 精华, 精锐, 中坚分子"},{"w":"complicated","p":"'kɒmplikeitid","t":"a. 复杂的; 并发的"},{"w":"Olympic","p":"әu'limpik","t":"a. 奥林匹亚的, 奥林匹斯山的, 强有力的, 巨大的"},{"w":"alongside","p":"ә'lɒŋ'said","t":"adv. 在旁边, 靠拢着; prep. 在...旁边, 与...在一起"},{"w":"rice","p":"rais","t":"n. 米, 米饭, 稻; vt. 将...压成米粒状"},{"w":"bible","p":"'baibl","t":"n. 圣经"},{"w":"replacement","p":"ri'pleismәnt","t":"n. 归还, 更换, 代替者; 复位, 置换"},{"w":"chart","p":"tʃɑ:t","t":"n. 图表, 海图; vt. 制成图表; 图表"},{"w":"solar","p":"'sәulә","t":"a. 太阳的, 日光的, 源自太阳的; 太阳的; 腹腔丛的"},{"w":"strain","p":"strein","t":"n. 紧张, 拉紧, 张力, 过劳, 扭伤, 血缘, 种, 族, 气质, 曲调, 旋律, 口吻; vt. 使劳累, 拉紧, 过分使用, 扭伤, 滥用, 曲解, 滤; vi. 尽力, 努力, 紧拉, 弯曲, 被滤出"},{"w":"leisure","p":"'li:ʒә","t":"n. 空闲, 闲暇, 悠闲; a. 空闲的, 有闲的"},{"w":"strip","p":"strip","t":"n. 长条, 条状, 带, 脱衣舞; vt. 脱衣, 被剥去, 剥夺, 拆卸; vi. 脱衣服"},{"w":"steam","p":"sti:m","t":"n. 蒸汽, 精力; a. 蒸汽的; vi. 蒸发, 行驶, 发怒; vt. 蒸, 煮, 散发"},{"w":"telescope","p":"'teliskәup","t":"n. 望远镜; vi. 叠缩, 嵌进, 缩短; vt. 使叠缩, 使缩短"},{"w":"precise","p":"pri'sais","t":"a. 精确的, 严谨的, 明确的; 精密的, 正确的"},{"w":"tournament","p":"'tә:nәmәnt","t":"n. 比赛, 竞赛, 锦标赛, 联赛"},{"w":"admission","p":"әd'miʃәn","t":"n. 准许进入, 入场费, 录用, 承认; 加入, 入股"},{"w":"tremendous","p":"tri'mendәs","t":"a. 巨大的, 非常的, 可怕的"},{"w":"tunnel","p":"'tʌnl","t":"n. 隧道, 地下道; vi. 挖隧道; vt. 掘隧道于"}],"doc":{"k":"律师函","en":"WITHOUT PREJUDICE. We act for the Company. Our client has reviewed the trading records disclosed in the course of the informal inquiry and considers that your firm accumulated its short position prior to publication of the report. Our client's complaint particularises marking the close, parking of shares through nominees, and rumour-mongering during the period surrounding its profit alert. We are instructed to record that a subpoena has been served in New York, that a class action has been filed there, and that our client will rely upon extraterritorial jurisdiction where applicable. The matter has been referred to the Listing Committee, and your firm has been placed on the regulator's watch list. We require your written response within fourteen days.","zh":"在不损害权利的前提下发出。本所受某上市发行人（下称本方当事人）委托发出本函。本方当事人已审阅在非正式问询过程中披露的交易记录，认为贵司在报告发布之前即已建立空头头寸。本方当事人的申诉具体列明：尾市操纵收盘价、通过代名人代持股份，以及在其发布盈喜前后期间编造传播虚假信息。本所受指示记录如下：纽约方面已送达传票，当地已提起集体诉讼，本方当事人将在适用范围内主张长臂管辖。该事项已提交上市委员会处理，贵司亦已被列入监管机构的观察名单。请于十四日内作出书面答复。"}},{"i":53,"ti":"写信的人还在里面","dom":"fraud","sc":"举报与内部人","tx":"那两万股是 Ray 买的。\n\n他没解释，直接把交割单调出来：买入两万股，两天后原价卖出，一分不赚。\n\n\"我要知道券源到底有多紧，\"他说，\"那时候{{borrow cost}}（借券成本）已经跑到年化十八，我不信，就自己开个户试一次。\"\n\n\"你为什么不告诉我。\"\n\n\"因为我以为两天平掉就不算持仓。\"他笑得很难看，\"这是个很不{{sensible}}（明智的）的决定。\"\n\n我坐下，第一次看清这个我跟了四年的人也有他{{raw}}（生疏的）的一面。那一刻我们之间的{{mutual}}（相互的）信任被削掉了一层——不多，但我知道它少了。\n\n中午我去湾仔见老周。他只点了一份{{salad}}（色拉），说医生不让他吃别的。\n\n我把 Wendy 给我看的那三页复印件推过去。他看得极慢，看到第二页停住，用手指压住一张表。\n\n\"这张表，\"他说，\"不是研究员做的。\"\n\n\"怎么讲？\"\n\n\"研究员做表会留过程。这张表没有过程，只有结果，而且每一栏的口径都跟公司自己的内部报表对得上——连期间码都对得上。做这张表的人不需要{{cross-check}}（交叉验证），因为她本来就坐在数据出生的地方。\"\n\n那是那封匿名举报信里的表。纽约那边最初就是从这张表查起的：一只票据的净值曲线太平了。\n\n老周把纸转过来，用笔在三处画了圈。\n\n第一处是{{earnings quality}}（盈利质量）的算法。她不是用现金流除以净利润这种教科书写法，而是拿\"收现比\"减去一个季节性调整项——那是内部管理报表才有的口径。\n\n第二处是那一列{{turnover}}（周转）天数。全市场做{{peer comparison}}（同业对比）时都用期末余额，这张表用的是月度平均。只有每个月都能看到十二张月报的人，才会顺手这么写。\n\n第三处最要命：她把{{high cash and high debt}}（存贷双高）单独列了一行，标注写的是\"待解释\"。不是\"异常\"，不是\"造假\"，是\"待解释\"。\n\n\"写这封信的人，\"老周说，\"没有把它当作指控。她当时是在给自己做备忘录。\"\n\n我脑子里那副被人洗过的{{deck}}（纸牌）忽然翻了个面。\n\n我回办公室调了一份履历。1998 到 2001，{{Bristol}}（布里斯托尔），读的是{{economics}}（经济学）；毕业后进四大，做过八年审计；2013 年进这家公司。\n\n施慧敏。Vivian Sze。这家公司的首席财务官。\n\n我盯着屏幕，很久没动。\n\n她在业绩会上答过我三次问题，语气永远很{{gentle}}（温和的），永远滴水不漏。她解释{{aggressive accounting}}（激进会计处理）的时候用的是\"行业惯例\"；解释{{window dressing}}（粉饰报表）的时候用的是\"季节性\"；解释公司为什么是个{{serial acquirer}}（连环并购者）的时候，她说\"我们买的是产能，不是报表\"。所有解释都成立，所有解释都刚好差一点。\n\n我一直以为那是她在挡。现在我明白了：她是在替一套她自己也不{{sustain}}（承受）得住的东西挡，一边挡，一边把每一处不对劲抄进自己的本子。\n\nDanny 说：那她算好人还是坏人。\n\n\"她不是{{innocent}}（无罪的）的，\"我说，\"她也不是在帮我们。她是在给自己求一个{{favour}}（宽待）。\"\n\n举报人制度就是这么设计的：结构崩之前，第一个开口的人能换到条件。我不觉得高尚，但我理解那份{{determination}}（决心）——她大概在三年前的某个晚上算清楚了，这条船一定会沉。\n\n老周补了一句更冷的：那家开曼公司只是个{{vessel}}（容器），装什么都行；真正的东西是{{fabric}}（结构），一张织了七年的网，她是织的人之一。\n\n下午 Elena 那边的一个分析师给我们发来了信封扫描件。邮戳在纽约，纸是最普通的打印纸。那位分析师是个{{Pole}}（波兰人），姓氏一长串辅音，他在邮件里写了一句：写信的人非常小心，但她把假设{{bake}}（烤）进了模型里，而不是写在旁边——这是做惯内部报表的人的习惯。\n\n我把三个可能人选排开，用了一整晚做{{diverse}}（不同的）方向的验证，最后只剩她一个。命中率百分之一百，样本量一。这个{{percent}}（百分比）说明不了什么，但我确信。\n\n晚上十一点，我打开邮箱，给她写了一封信。\n\n只有两句：\n\n\"施女士，我知道那张表是谁做的。我们需要一次{{dialogue}}（对话）。\"\n\n这不是{{stock promotion}}（吹票）那种见光死的东西，我也不打算把它捅给媒体。我要的只是一个答案。\n\n十二点零四分，回信来了。发件时间戳显示对方在同一个时区。\n\n正文一行字：\n\n\"如果公司真的走到{{long suspension}}（长期停牌）那一步，我会说。在那之前，别再发邮件给我这个地址。\"\n\n而所有{{red flag}}（危险信号）里最刺眼的那一条，我到这一刻才看懂——一家公司最了解真相的人，居然是最早开始收集证据的人。","ft":[{"w":"aggressive accounting","z":"激进会计处理","d":"选用最宽松的确认口径把利润做高，属重要红旗","a":"","p":""},{"w":"borrow cost","z":"借券成本","d":"融券利率高说明可借股份稀缺，做空成本很大","a":"","p":""},{"w":"cross-check","z":"交叉验证","d":"用独立第三方数据来印证公司自己的说法","a":"","p":"krɔs'tʃek; (?@) 'krɔ:s-"},{"w":"earnings quality","z":"盈利质量","d":"利润有没有真金白银的现金支撑，做空的核心切口","a":"","p":""},{"w":"high cash and high debt","z":"存贷双高","d":"现金多却仍大举借债并付高息，明显不合商业逻辑","a":"","p":""},{"w":"long suspension","z":"长期停牌","d":"港股公司被质疑后停牌数年，最终可能被除牌","a":"","p":""},{"w":"peer comparison","z":"同业对比","d":"把公司指标与可比公司并排看，异常自然显形","a":"","p":""},{"w":"red flag","z":"危险信号；红旗","d":"财报或经营中反常到值得深挖的迹象，做空报告的起点","a":"","p":""},{"w":"serial acquirer","z":"连环并购者","d":"靠不停并购做大报表的公司，内生增长往往很弱","a":"","p":""},{"w":"stock promotion","z":"吹票；股价推广","d":"付费发布看多内容制造买盘，美股小盘股中常见","a":"","p":""},{"w":"window dressing","z":"粉饰报表","d":"在期末临时做账让报表好看，季末年末最为常见","a":"","p":""}],"iw":[{"w":"fabric","p":"'fæbrik","t":"n. 织物, 布, 结构, 构造, 建筑物; 组织, 建筑物, 工厂"},{"w":"salad","p":"'sælәd","t":"n. 色拉"},{"w":"sustain","p":"sә'stein","t":"vt. 承受, 支持, 供养, 继续, 忍受, 蒙受, 证实, 准许; 持续"},{"w":"innocent","p":"'inәsәnt","t":"a. 无罪的, 不懂事的, 无知的; n. 天真的人, 笨蛋"},{"w":"gentle","p":"'dʒentl","t":"a. 温和的, 文雅的"},{"w":"vessel","p":"'vesl","t":"n. 船, 容器, 脉管; 管, 脉管, (容)器"},{"w":"favour","p":"'feivә","t":"n. 好感, 偏爱, 喜爱, 相信, 庇护, 赞同, 支持, 信赖, 善行, 恩惠, 徽章, 礼物; vt. 赞成, 帮助, 支持, 喜爱, 偏袒, 关切, 赐与, 给与, 有利于, 有助于, 像, 体恤"},{"w":"raw","p":"rɒ:","t":"n. 擦伤处, 半成品; a. 生的, 未加工的, 生疏的, 不成熟的, 阴冷的, 刺痛的, 擦掉皮的; vt. 擦伤; 写后读"},{"w":"economics","p":".i:kә'nɒmiks","t":"n. 经济学; 经济学"},{"w":"deck","p":"dek","t":"n. 甲板, (汽车后部的)行李仓; vt. 装饰, 打扮, 装甲板; 纸牌背面图案"},{"w":"determination","p":"di.tә:mi'neiʃәn","t":"n. 决心, 果断; 判定; 测定"},{"w":"Pole","p":"pәul","t":"n. 波兰人, 极点, 磁极, 电极, 杆, 竿, 相反的极端; vt. 用竿支撑; vi. 撑篙"},{"w":"Bristol","p":"'bristәl","t":"n. 布里斯托尔(英国西部港口)"},{"w":"dialogue","p":"'daiәlɒg","t":"n. 对话; vi. 对话; vt. 用对话表达"},{"w":"turnover","p":"'tә:n.әuvә","t":"n. 翻倒, 翻转, 半圆酥饼, 营业额, 流通, 周转; a. 可翻转的"},{"w":"mutual","p":"'mju:tʃuәl","t":"a. 相互的, 共有的; 相互的"},{"w":"percent","p":"pә'sent","t":"n. 百分比, 百分数, 部分; 百分率"},{"w":"sensible","p":"'sensәbl","t":"a. 有感觉的, 敏感的, 明智的; 可感觉的"},{"w":"bake","p":"beik","t":"vt. 烘焙, 烤; vi. 烤面包; n. 烘焙, 烤"},{"w":"diverse","p":"dai'vә:s","t":"a. 不同的, 变化多的"}],"doc":{"k":"内部合规邮件","en":"INTERNAL - COMPLIANCE. Team, following this morning's review, please note the following. Our short thesis rests on documented red flag items rather than market commentary: deteriorating earnings quality, aggressive accounting in revenue recognition, window dressing at each period end, and the high cash and high debt profile disclosed in the last three annual reports. Every assertio
