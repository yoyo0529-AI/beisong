ildings in the world, for it was made of iron and glass.","zh":"水晶宫与世界上所有其他建筑都不同，因为它是由钢铁和玻璃建造的。","kind":"text"},{"t":43.01,"en":"It was one of the biggest buildings of all time and a lot of people from many countries came to see it.","zh":"它是迄今为止最大的建筑之一，许多国家的人们都前来参观。","kind":"text"},{"t":52.23,"en":"A great many goods were sent to the exhibition from various parts of the world.","zh":"许多商品从世界各地运到博览会展出。","kind":"text"},{"t":58.38,"en":"There was also a great deal of machinery on display.","zh":"还有大量机器展出。","kind":"text"},{"t":63.67,"en":"The most wonderful piece of machinery on show was Nasmyth's steam hammer.","zh":"展出的最精彩的机器是纳史密斯蒸汽锤。","kind":"text"},{"t":71.5,"en":"Though in those days travelling was not as easy as it is today,","zh":"尽管在那些日子里旅行不像今天这样容易，","kind":"text"},{"t":77.79,"en":"steam boats carried thousands of visitors across the Channel from Europe.","zh":"汽船还是载着成千上万的游客从欧洲渡过英吉利海峡。","kind":"text"},{"t":83.94,"en":"On arriving in England, they were, taken to the Crystal Palace by train.","zh":"抵达英国后，他们乘火车前往水晶宫。","kind":"text"},{"t":90.34,"en":"There were six million visitors in all,","zh":"总共有六百万游客，","kind":"text"},{"t":93.91,"en":"and the profits from the exhibition were used to build museums and colleges.","zh":"博览会的利润被用于建造博物馆和学院。","kind":"text"},{"t":99.94,"en":"Later, the Crystal Palace was moved to South London.","zh":"后来，水晶宫被搬到了伦敦南部。","kind":"text"},{"t":104.67,"en":"It remained one of the most famous buildings in the world until it was burnt down in 1936.","zh":"它一直是世界上最著名的建筑之一，直到1936年被烧毁。","kind":"text"}]},{"id":"NCE2-81","book":"NCE2","bookCn":"第二册","num":81,"title":"Escape","slug":"81.Escape","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/81.Escape.mp3","sentenceCount":14,"wordCount":185,"lines":[{"t":9.76,"en":"Why did the prisoner attack the driver?","zh":"囚犯为什么要袭击司机？","kind":"question"},{"t":14.72,"en":"When he had killed the guard, the prisoner of war quickly dragged him into the bushes.","zh":"杀死看守后，这名战俘迅速将他拖进了灌木丛。","kind":"text"},{"t":22.17,"en":"Working rapidly in the darkness, he soon changed into the dead man's clothes.","zh":"在黑暗中迅速行动，他很快换上了死人的衣服。","kind":"text"},{"t":29.11,"en":"Now, dressed in a blue uniform and with a rifle over his shoulder,","zh":"现在，他身穿蓝色制服，肩上扛着一支步枪，","kind":"text"},{"t":35.61,"en":"the prisoner marched boldly up and down in front of the camp.","zh":"这名囚犯大胆地在营地前走来走去。","kind":"text"},{"t":40.97,"en":"He could hear shouting in the camp itself.","zh":"他能听到营地里传来喊叫声。","kind":"text"},{"t":44.53,"en":"Lights were blazing and men were running here and there: they had just discovered that a prisoner had escaped.","zh":"灯火通明，人们四处奔跑：他们刚刚发现一名囚犯越狱了。","kind":"text"},{"t":54.19,"en":"At that moment, a large black car with four officers inside it, stopped at the camp gates.","zh":"就在这时，一辆载有四名军官的黑色轿车在营地大门前停了下来。","kind":"text"},{"t":63.8,"en":"The officers got out and the prisoner stood to attention and saluted as they passed.","zh":"军官们下了车，囚犯立正向他们敬礼。","kind":"text"},{"t":71.43,"en":"When they had gone the driver of the car came towards him.","zh":"他们走后，轿车司机朝他走来。","kind":"text"},{"t":76.65,"en":"The man obviously wanted to talk.","zh":"那个人显然想说话。","kind":"text"},{"t":80.28,"en":"He was rather elderly with grey hair and clear blue eyes.","zh":"他年纪相当大，头发灰白，眼睛湛蓝清澈。","kind":"text"},{"t":85.9,"en":"The prisoner felt sorry for him, but there was nothing else he could do.","zh":"囚犯为他感到抱歉，但他别无选择。","kind":"text"},{"t":92.48,"en":"As the man came near the prisoner knocked him to the ground with a sharp blow.","zh":"那人走近时，囚犯一记重击将他打倒在地。","kind":"text"},{"t":99.66,"en":"Then, jumping into the car, he drove off as quickly as he could.","zh":"然后，他跳进车里，以最快的速度开走了。","kind":"text"}]},{"id":"NCE2-82","book":"NCE2","bookCn":"第二册","num":82,"title":"Monster or Fish","slug":"82.Monster or Fish","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/82.Monster%20or%20Fish.mp3","sentenceCount":11,"wordCount":182,"lines":[{"t":11.44,"en":"What was the monster called?","zh":"那个怪物叫什么名字？","kind":"question"},{"t":15.27,"en":"Fishermen and sailors sometimes claim to have seen monsters in the sea.","zh":"渔民和水手有时声称在海中见过怪物。","kind":"text"},{"t":21.92,"en":"Though people have often laughed at stories told by seamen,","zh":"尽管人们常常嘲笑水手们讲述的故事，","kind":"text"},{"t":27.1,"en":"it is now known that many of these 'monsters' which have at times been sighted are simply strange fish.","zh":"但现在已知，这些有时被目击到的“怪物”很多只是奇怪的鱼。","kind":"text"},{"t":36.82,"en":"Occasionally, unusual creatures are washed to the shore, but they are rarely caught out at sea.","zh":"偶尔，不寻常的生物会被冲到岸边，但它们很少在海上被捕获。","kind":"text"},{"t":45.77,"en":"Some time ago, however, a peculiar fish was caught near Madagascar.","zh":"然而，不久前，一条奇特的鱼在马达加斯加附近被捕获。","kind":"text"},{"t":53.36,"en":"A small fishing boat was carried miles out to sea by the powerful fish as it pulled on the line.","zh":"当这条强壮的鱼拉扯鱼线时，一艘小渔船被拖离海岸数英里。","kind":"text"},{"t":62.23,"en":"Realizing that this was no ordinary fish, the fisherman made every effort not to damage it in any way.","zh":"渔民意识到这不是一条普通的鱼，便竭尽全力不损坏它。","kind":"text"},{"t":73.66,"en":"When it was eventually brought to shore, it was found to be over thirteen feet long.","zh":"当它最终被带到岸上时，发现它有十三英尺多长。","kind":"text"},{"t":81.91,"en":"It had a head like a horse big blue eyes, shining silver skin, and a bright red tail.","zh":"它有一个像马一样的头，大大的蓝眼睛，闪亮的银色皮肤和一条鲜红的尾巴。","kind":"text"},{"t":91.54,"en":"The fish, which has since been set to a museum where it is being examined by a scientist, is called an oarfish.","zh":"这条鱼后来被送往博物馆，由科学家进行研究，它被称为皇带鱼。","kind":"text"},{"t":101.93,"en":"Such creatures have rarely been seen alive by man as they live at a depth of six hundred feet.","zh":"这种生物很少被人类活体发现，因为它们生活在六百英尺深的地方。","kind":"text"}]},{"id":"NCE2-83","book":"NCE2","bookCn":"第二册","num":83,"title":"After the Elections","slug":"83.After the Elections","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/83.After%20the%20Elections.mp3","sentenceCount":14,"wordCount":176,"lines":[{"t":10.65,"en":"Why did Patrick keep on asking the same question?","zh":"帕特里克为什么一直问同一个问题？","kind":"question"},{"t":16.9,"en":"The former Prime Minister, Mr. Wentworth Lane, was defeated in the recent elections.","zh":"前首相温特沃斯·莱恩先生在最近的选举中失利。","kind":"text"},{"t":24.64,"en":"He is now retiring from political life and has gone abroad.","zh":"他现在正退出政坛，并且已经出国了。","kind":"text"},{"t":30.5,"en":"My friend, Patrick, has always been a fanatical opponent of Mr. Lane's Radical Progressive Party.","zh":"我的朋友帕特里克一直是莱恩先生激进进步党的狂热反对者。","kind":"text"},{"t":39.87,"en":"After the elections, Patrick went to the former Prime Minister's house.","zh":"选举结束后，帕特里克去了前首相的家。","kind":"text"},{"t":46.36,"en":"When he asked if Mr. Lane lived there, the policeman on duty told him that since his defeat, the ex-Prime Minister had gone abroad.","zh":"当他问莱恩先生是否住在那儿时，值班警察告诉他，自从失利后，这位前首相就出国了。","kind":"text"},{"t":58.53,"en":"On the following day Patrick went to the house again.","zh":"第二天，帕特里克又去了那所房子。","kind":"text"},{"t":63.77,"en":"The same policeman was just walking slowly past the entrance, when Patrick asked the same question.","zh":"还是那个警察，他正慢慢地走过入口，这时帕特里克又问了同样的问题。","kind":"text"},{"t":72.83,"en":"Though a little suspicious this time the policeman gave him the same answer.","zh":"尽管这次有些怀疑，警察还是给了他同样的答案。","kind":"text"},{"t":80.1,"en":"The day after, Patrick went to the house once more and asked exactly the same question.","zh":"第二天，帕特里克又一次去了那所房子，问了完全相同的问题。","kind":"text"},{"t":89.64,"en":"This time, the policeman lost his temper.","zh":"这次，警察发火了。","kind":"text"},{"t":94.34,"en":"'I told you yesterday and the day before yesterday,' he shouted,","zh":"“我昨天和前天都告诉你了，”他喊道，","kind":"text"},{"t":101.65,"en":"'Mr.Lane was defeated in the elections.","zh":"“莱恩先生在选举中失利了。","kind":"text"},{"t":105.66,"en":"He has retired from political life and gone to live abroad!'","zh":"他已经退出政坛并出国定居了！”","kind":"text"},{"t":112.0,"en":"'I know,' answered Patrick,' but I love to hear you say it!'","zh":"“我知道，”帕特里克回答说，“但我喜欢听你说！”","kind":"text"}]},{"id":"NCE2-84","book":"NCE2","bookCn":"第二册","num":84,"title":"On Strike","slug":"84.On Strike","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/84.On%20Strike.mp3","sentenceCount":14,"wordCount":178,"lines":[{"t":10.29,"en":"Who will be driving the buses next week?","zh":"下周谁来开公交车？","kind":"question"},{"t":15.18,"en":"Busmen have decided to go on strike next week.","zh":"公交车司机们已决定下周举行罢工。","kind":"text"},{"t":19.77,"en":"The strike is due to begin on Tuesday.","zh":"罢工定于周二开始。","kind":"text"},{"t":23.83,"en":"No one knows how long it will last.","zh":"没人知道罢工会持续多久。","kind":"text"},{"t":27.51,"en":"The busmen have stated that the strike will continue until general agreement is reached about pay and working conditions.","zh":"公交车司机们声明，罢工将持续到在工资和工作条件方面达成普遍协议为止。","kind":"text"},{"t":38.37,"en":"Most people believe that the strike will last for at least a week.","zh":"大多数人认为罢工至少会持续一周。","kind":"text"},{"t":44.15,"en":"Many owners of private cars are going to offer 'free rides' to people on their way to work.","zh":"许多私家车车主将为上班族提供“免费搭车”服务。","kind":"text"},{"t":52.07,"en":"This will relieve pressure on the trains to some extent.","zh":"这将在一定程度上减轻火车的压力。","kind":"text"},{"t":56.81,"en":"Meanwhile, a number of university students have volunteered to drive buses while the strike lasts.","zh":"同时，一些大学生已志愿在罢工期间驾驶公交车。","kind":"text"},{"t":65.56,"en":"All the students are expert drivers,","zh":"所有学生都是驾驶专家，","kind":"text"},{"t":68.88,"en":"but before they drive any of the buses, they will have to pass a special test.","zh":"但在他们驾驶任何公交车之前，他们必须通过一项特殊的考试。","kind":"text"},{"t":76.72,"en":"The students are going to take the test in two days' time.","zh":"学生们将在两天后参加考试。","kind":"text"},{"t":81.72,"en":"Even so, people are going to find it difficult to get to work.","zh":"即使如此，人们仍然会发现上班很困难。","kind":"text"},{"t":87.43,"en":"But so far, the public has expressed its gratitude to the students in lettters to the Press.","zh":"但到目前为止，公众已通过写信给报社的方式表达了对学生的感激之情。","kind":"text"},{"t":95.31,"en":"Only one or two people have objected that the students will drive too fast!","zh":"只有一两个人反对，认为学生们会开得太快！","kind":"text"}]},{"id":"NCE2-85","book":"NCE2","bookCn":"第二册","num":85,"title":"Never Too Old To Learn","slug":"85.Never Too Old To Learn","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/85.Never%20Too%20Old%20To%20Learn.mp3","sentenceCount":9,"wordCount":167,"lines":[{"t":10.57,"en":"How long has Mr. Page been teaching?","zh":"佩奇先生教书多久了？","kind":"question"},{"t":14.97,"en":"I have just received a letter from my old school, informing me that my former headmaster, Mr. Stuart Page, will be retiring next week.","zh":"我刚收到母校的一封信，通知我我们以前的校长斯图尔特·佩奇先生下周就要退休了。","kind":"text"},{"t":27.95,"en":"Pupils of the school old and new, will be sending him a present to mark the occasion.","zh":"学校的新老学生将送他一份礼物，以示纪念。","kind":"text"},{"t":35.53,"en":"All those who have contributed towards the gift will sign their names in a large album which will be sent to the headmaster's home.","zh":"所有为这份礼物捐款的人都将在一个大相册上签名，这个相册将寄到校长家中。","kind":"text"},{"t":45.53,"en":"We shall all remember Mr. Page for his patience and understanding and for the kindly encouragement he gave us when we went so unwillingly to school.","zh":"我们都会记住佩奇先生的耐心和理解，以及当我们不情愿地去上学时他给予我们的亲切鼓励。","kind":"text"},{"t":59.48,"en":"A great many former pupils will be attending a farewell dinner in his honour next Thursday.","zh":"许多以前的学生将于下周四出席为他举行的告别晚宴。","kind":"text"},{"t":67.4,"en":"It is a curious coincidence that the day before his retirement, Mr. Page will have been teaching for a total of forty years.","zh":"巧合的是，在他退休的前一天，佩奇先生教书的总时长将满四十年。","kind":"text"},{"t":78.66,"en":"After he has retired he will devote himself to gardening.","zh":"退休后，他将致力于园艺。","kind":"text"},{"t":84.22,"en":"For him, this will be an entirely new hobby.","zh":"对他来说，这将是一个全新的爱好。","kind":"text"},{"t":89.06,"en":"But this does not matter, for, as he has often remarked, one is never too old to learn.","zh":"但这无关紧要，因为正如他常说的，活到老学到老。","kind":"text"}]},{"id":"NCE2-86","book":"NCE2","bookCn":"第二册","num":86,"title":"Out of Control","slug":"86.Out of Control","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/86.Out%20of%20Control.mp3","sentenceCount":13,"wordCount":186,"lines":[{"t":10.76,"en":"What was the danger?","zh":"危险是什么？","kind":"question"},{"t":14.45,"en":"As the man tried to swing the speedboat round, the steering wheel came away in his hands.","zh":"当那人试图把快艇转弯时，方向盘脱落在他手中。","kind":"text"},{"t":22.55,"en":"He waved desperately to his companion, who had been water skiing for the last fifteen minutes.","zh":"他绝望地向他的同伴挥手，他的同伴在过去的15分钟里一直在滑水。","kind":"text"},{"t":30.82,"en":"Both men had hardly had time to realize what was happening when they were thrown violently into the sea.","zh":"两名男子还没来得及意识到发生了什么，就被猛地甩进海里。","kind":"text"},{"t":40.9,"en":"The speedboat had struck a buoy, but it continued to move very quickly across the water.","zh":"快艇撞上了一个浮标，但它仍然在水面上快速行驶。","kind":"text"},{"t":49.2,"en":"Both men had just begun to swim towards the shore,","zh":"两名男子刚开始向岸边游去，","kind":"text"},{"t":53.93,"en":"when they noticed with dismay that the speedboat was moving in a circle.","zh":"却沮丧地发现快艇正在画圈行驶。","kind":"text"},{"t":60.07,"en":"It now came straight towards them at tremendous speed.","zh":"它现在以惊人的速度径直朝他们冲来。","kind":"text"},{"t":65.95,"en":"In less than a minute, it roared past them only a few feet away.","zh":"不到一分钟，它咆哮着从他们身边几英尺的地方冲过。","kind":"text"},{"t":73.18,"en":"After it had passed, they swam on as quickly as they could because they knew that the boat would soon return.","zh":"快艇驶过之后，他们尽力快速向前游，因为他们知道快艇很快就会回来。","kind":"text"},{"t":83.52,"en":"They had just had enough time to swim out of danger when the boat again completed a circle.","zh":"他们刚来得及游出危险区域，快艇又完成了一圈。","kind":"text"},{"t":92.13,"en":"On this occasion, however, it had slowed down considerably.","zh":"然而，这一次，它已经明显减速了。","kind":"text"},{"t":98.41,"en":"The petrol had nearly all been used up.","zh":"汽油差不多用完了。","kind":"text"},{"t":102.6,"en":"Before long, the noise dropped completely and the boat began to drift gently across the water.","zh":"不久，噪音完全消失了，快艇开始在水面上轻轻地漂浮。","kind":"text"}]},{"id":"NCE2-87","book":"NCE2","bookCn":"第二册","num":87,"title":"A Perfect Alibi","slug":"87.A Perfect Alibi","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/87.A%20Perfect%20Alibi.mp3","sentenceCount":16,"wordCount":178,"lines":[{"t":11.31,"en":"What was wrong with the man's story?","zh":"这个人的话有什么漏洞？","kind":"question"},{"t":16.13,"en":"'At the time the murder was committed, I was travelling on the 8 o'clock train to London,' said the man.","zh":"“在谋杀发生的时候，我正坐8点钟的火车去伦敦。”那人说。","kind":"text"},{"t":25.96,"en":"'Do you always catch such an early train?' asked the inspector.","zh":"“你总是赶这么早的火车吗？”探长问。","kind":"text"},{"t":31.71,"en":"'Of course I do,' answered the man.","zh":"“我当然是。”那人回答。","kind":"text"},{"t":35.86,"en":"'I must be at work at 10 o'clock.","zh":"“我10点钟必须上班。","kind":"text"},{"t":39.0,"en":"My employer will confirm that I was there on time.'","zh":"我的雇主可以证明我准时到了那里。”","kind":"text"},{"t":44.69,"en":"'Would a later train get you to work on time?' asked the inspector.","zh":"“晚一点的火车也能让你准时上班吗？”探长问。","kind":"text"},{"t":51.08,"en":"'I suppose it would, but I never catch a later train.'","zh":"“我想是的，但我从不赶晚一点的火车。”","kind":"text"},{"t":57.15,"en":"'At what time did you arrive at the station?'","zh":"“你什么时候到车站的？”","kind":"text"},{"t":62.05,"en":"'At ten to eight. I bought a paper and waited for the train.'","zh":"“7点50分。我买了一份报纸，然后等火车。”","kind":"text"},{"t":68.08,"en":"'And you didn't notice anything unusual?'","zh":"“你没注意到什么不寻常的事情吗？”","kind":"text"},{"t":73.13,"en":"'Of course not.'","zh":"“当然没有。”","kind":"text"},{"t":75.68,"en":"'I suggest,' said the inspector,' that you are not telling the truth.","zh":"“我猜想，”探长说，“你没有说实话。","kind":"text"},{"t":82.98,"en":"I suggest that you did not catch the 8 o'clock train,","zh":"我猜想你并没有赶上8点钟的火车，","kind":"text"},{"t":87.84,"en":"but that you caught the 8.25 which would still get you to work on time.","zh":"而是赶了8点25分的火车，那也能让你准时上班。","kind":"text"},{"t":94.87,"en":"You see, on the morning of the murder, the 8 o'clock train did not run at all.","zh":"你看，在谋杀发生的那天早上，8点钟的火车根本就没有开。","kind":"text"},{"t":102.66,"en":"It broke down at Ferngreen station and was taken off the line.'","zh":"它在弗恩格林车站出了故障，被拉下了线路。”","kind":"text"}]},{"id":"NCE2-88","book":"NCE2","bookCn":"第二册","num":88,"title":"Trapped in a Mine","slug":"88.Trapped in a Mine","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/88.Trapped%20in%20a%20Mine.mp3","sentenceCount":15,"wordCount":184,"lines":[{"t":10.1,"en":"Why is the rescue taking so long?","zh":"为什么救援用了这么长时间？","kind":"question"},{"t":15.18,"en":"Six men have been trapped in a mine for seventeen hours.","zh":"六名男子被困在矿井里已经十七个小时了。","kind":"text"},{"t":21.12,"en":"If they are not brought to the surface soon they may lose their lives.","zh":"如果他们不尽快被带到地面，他们可能会失去生命。","kind":"text"},{"t":26.79,"en":"However, rescue operations are proving difficult.","zh":"然而，救援行动进展困难。","kind":"text"},{"t":31.65,"en":"If explosives are used, vibrations will cause the roof of the mine to collapse.","zh":"如果使用炸药，震动将导致矿井顶部坍塌。","kind":"text"},{"t":38.73,"en":"Rescue workers are therefore drilling a hole on the north side of the mine.","zh":"因此，救援人员正在矿井北侧钻一个洞。","kind":"text"},{"t":45.14,"en":"They intend to bring the men up in a special capsule.","zh":"他们打算用一个特殊的胶囊将这些人带上来。","kind":"text"},{"t":50.09,"en":"If there had not been a hard layer of rock beneath the soil,","zh":"如果土壤下面没有一层坚硬的岩石，","kind":"text"},{"t":55.15,"en":"they would have completed the job in a few hours.","zh":"他们几个小时就能完成这项工作。","kind":"text"},{"t":59.64,"en":"As it is, they have been drilling for 16 hours and they still have a long way to go.","zh":"事实上，他们已经钻了16个小时，还有很长的路要走。","kind":"text"},{"t":68.62,"en":"Meanwhile, a microphone, which was lowered into the mine two hours ago,","zh":"同时，两个小时前被放入矿井的麦克风，","kind":"text"},{"t":75.18,"en":"has enabled the men to keep in touch with their closest relatives.","zh":"使这些男子能够与他们最亲近的亲属保持联系。","kind":"text"},{"t":80.74,"en":"Though they are running out of food and drink,","zh":"尽管他们的食物和饮用水即将耗尽，","kind":"text"},{"t":84.18,"en":"the men are cheerful and confident that they will get out soon.","zh":"这些男子仍然很乐观，并相信他们很快就能出来。","kind":"text"},{"t":89.9,"en":"They have been told that rescue operations are progressing smoothly.","zh":"他们被告知救援行动进展顺利。","kind":"text"},{"t":95.41,"en":"If they knew how difficult it was to drill through the hard rock, they would lose heart.","zh":"如果他们知道钻穿坚硬的岩石有多困难，他们就会灰心丧气。","kind":"text"}]},{"id":"NCE2-89","book":"NCE2","bookCn":"第二册","num":89,"title":"A Slip of the Tongue","slug":"89.A Slip of the Tongue","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/89.A%20Slip%20of%20the%20Tongue.mp3","sentenceCount":12,"wordCount":176,"lines":[{"t":10.5,"en":"Who made the only funny joke that evening and why?","zh":"谁在那个晚上讲了唯一一个好笑的笑话，为什么？","kind":"question"},{"t":16.68,"en":"People will do anything to see a free show--even if it is a bad one.","zh":"人们会不惜一切去看免费演出——即使演出很糟糕。","kind":"text"},{"t":24.43,"en":"When the news got round that a comedy show would be presented","zh":"当喜剧表演将在当地电影院上演的消息传开时","kind":"text"},{"t":29.24,"en":"at our local cinema by the P. and U. Bird Seed Company, we all rushed to see it.","zh":"由P. and U. 鸟食公司在当地电影院呈现时，我们都抢着去看。","kind":"text"},{"t":37.11,"en":"We had to queue for hours to get in and there must have been several hundred people present just before the show began.","zh":"我们排了几个小时的队才进去，演出开始前肯定有几百人到场。","kind":"text"},{"t":47.17,"en":"Unfortunately, the show was one of the dullest we have ever seen.","zh":"不幸的是，这场演出是我们看过的最乏味的一场。","kind":"text"},{"t":53.4,"en":"Those who failed to get in need not have felt disappointed,","zh":"那些没能进去的人大可不必感到失望，","kind":"text"},{"t":59.06,"en":"as many of the artistes who should have appeared did not come.","zh":"因为许多本应出席的艺人都没有来。","kind":"text"},{"t":64.69,"en":"The only funny things we heard that evening came from the advertiser at the beginning of the programme.","zh":"那个晚上我们听到的唯一有趣的事情，来自节目开始时的广告商。","kind":"text"},{"t":72.81,"en":"He was obviously very nervous and for some minutes stood awkwardly before the microphone.","zh":"他显然非常紧张，几分钟内尴尬地站在麦克风前。","kind":"text"},{"t":81.18,"en":"As soon as he opened his mouth, everyone burst out laughing.","zh":"他一开口，每个人都哈哈大笑起来。","kind":"text"},{"t":87.76,"en":"We all know what the poor man should have said,","zh":"我们都知道这位可怜人本该说什么，","kind":"text"},{"t":91.48,"en":"but what he actually said was: 'This is the Poo and Ee Seed Bird Company. Good ladies, evening and gentlemen!'","zh":"但他实际说的是：“这是噗和咿鸟食公司。女士们，晚上好，先生们！”","kind":"text"}]},{"id":"NCE2-90","book":"NCE2","bookCn":"第二册","num":90,"title":"What's for Supper","slug":"90.What's for Supper","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/90.What%27s%20for%20Supper.mp3","sentenceCount":15,"wordCount":189,"lines":[{"t":10.32,"en":"What kind of fish are they?","zh":"它们是什么鱼？","kind":"question"},{"t":14.64,"en":"Fish and chips has always been a favourite dish in Britain,","zh":"炸鱼薯条一直是英国人最喜欢的菜肴，","kind":"text"},{"t":19.85,"en":"but as the oceans have been overfished, fish has become more and more expensive.","zh":"但由于海洋被过度捕捞，鱼类变得越来越昂贵。","kind":"text"},{"t":27.29,"en":"So it comes as a surprise to learn that giant fish are terrifying the divers on North Sea oil rigs.","zh":"因此，当得知巨型鱼类正在恐吓北海石油钻井平台的潜水员时，这令人感到惊讶。","kind":"text"},{"t":37.3,"en":"Oil rigs have to be repaired frequently and divers, who often have to work in darkness a hundred feet under water,","zh":"石油钻井平台需要经常维修，而潜水员通常必须在水下百英尺的黑暗中工作，","kind":"text"},{"t":47.27,"en":"have been frightened out of their wits by giant fish bumping into them as they work.","zh":"他们在工作时被撞到他们的巨型鱼吓得魂不附体。","kind":"text"},{"t":54.83,"en":"Now they have had special cages made to protect them from these monsters.","zh":"现在他们已经制造了特殊的笼子来保护他们免受这些“怪物”的侵害。","kind":"text"},{"t":61.06,"en":"The fish are not sharks or killer whales,","zh":"这些鱼不是鲨鱼也不是虎鲸，","kind":"text"},{"t":65.12,"en":"but favourite eating varieties like cod and skate which grow to unnatural sizes,","zh":"而是人们喜欢吃的品种，比如鳕鱼和鳐鱼，它们长得异常大，","kind":"text"},{"t":72.92,"en":"sometimes as much as twelve feet in length.","zh":"有时甚至长达十二英尺。","kind":"text"},{"t":77.85,"en":"Three factors have caused these fish to grow so large:","zh":"有三个因素导致这些鱼长得如此巨大：","kind":"text"},{"t":83.01,"en":"the warm water round the hot oil pipes under the sea;","zh":"海底热油管道周围的温暖水域；","kind":"text"},{"t":88.17,"en":"the plentiful supply of food thrown overboard by the crews on the rigs;","zh":"钻井平台船员扔到海里的丰富食物供应；","kind":"text"},{"t":94.73,"en":"the total absence of fishing boats around the oil rigs.","zh":"以及石油钻井平台周围完全没有渔船。","kind":"text"},{"t":99.95,"en":"As a result, the fish just eat and eat and grow and grow in the lovely warm water.","zh":"结果，这些鱼就在这宜人的暖水中不停地吃，不停地长大。","kind":"text"},{"t":109.24,"en":"Who eats who?","zh":"到底是谁吃了谁？","kind":"text"}]},{"id":"NCE2-91","book":"NCE2","bookCn":"第二册","num":91,"title":"Three Men in a Basket","slug":"91.Three Men in a Basket","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/91.Three%20Men%20in%20a%20Basket.mp3","sentenceCount":12,"wordCount":184,"lines":[{"t":11.12,"en":"Where was the station's Commanding Officer?","zh":"车站的指挥官在哪里？","kind":"question"},{"t":16.33,"en":"A pilot noticed a balloon which seemed to be making for a Royal Air Force station nearby.","zh":"一名飞行员注意到一个气球，它似乎正朝着附近的一个皇家空军基地飞去。","kind":"text"},{"t":24.07,"en":"He informed the station at once, but no one there was able to explain the mystery.","zh":"他立即通知了基地，但那里没有人能解释这个谜团。","kind":"text"},{"t":31.75,"en":"The officer in the control tower was very angry when he heard the news,","zh":"控制塔里的军官听到这个消息后非常生气，","kind":"text"},{"t":37.89,"en":"because balloons can be a great danger to aircraft.","zh":"因为气球对飞机来说可能是一个巨大的危险。","kind":"text"},{"t":42.83,"en":"He said that someone might be spying on the station and the pilot was ordered to keep track of the strange object.","zh":"他说可能有人在监视基地，飞行员被命令跟踪这个奇怪的物体。","kind":"text"},{"t":52.04,"en":"The pilot managed to circle the balloon for some time.","zh":"飞行员设法绕着气球盘旋了一段时间。","kind":"text"},{"t":56.94,"en":"He could make out three men in a basket under it and one of them was holding a pair of binoculars.","zh":"他能辨认出气球下面的篮子里有三个人，其中一人拿着一副双筒望远镜。","kind":"text"},{"t":64.92,"en":"When the balloon was over the station, the pilot saw one of the men taking photographs.","zh":"当气球飞到基地上空时，飞行员看到其中一个人在拍照。","kind":"text"},{"t":72.18,"en":"Soon afterwards, the balloon began to descend and it landed near an airfield.","zh":"不久之后，气球开始下降，并降落在一个机场附近。","kind":"text"},{"t":79.25,"en":"The police were called in, but they could not arrest anyone,","zh":"警方被召来，但他们无法逮捕任何人，","kind":"text"},{"t":84.01,"en":"for the basket contained two Members of Parliament and the Commanding Officer of the station!","zh":"因为篮子里坐着两名议会成员和基地的指挥官！","kind":"text"},{"t":91.62,"en":"As the Commanding Officer explained later, one half of the station did not know what the other half was doing!","zh":"正如指挥官后来解释的那样，基地的一半人不知道另一半人在做什么！","kind":"text"}]},{"id":"NCE2-92","book":"NCE2","bookCn":"第二册","num":92,"title":"Asking for Trouble","slug":"92.Asking for Trouble","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/92.Asking%20for%20Trouble.mp3","sentenceCount":17,"wordCount":184,"lines":[{"t":10.4,"en":"Why did the policeman ask the writer to come to the police station?","zh":"警察为什么要叫这位作者到警察局去？","kind":"question"},{"t":17.41,"en":"It must have been about two in the morning when I returned home.","zh":"我回到家时，大约是凌晨两点钟。","kind":"text"},{"t":22.77,"en":"I tried to wake up my wife by ringing the doorbell,","zh":"我按门铃想叫醒我的妻子，","kind":"text"},{"t":26.83,"en":"but she was fast asleep,","zh":"但她睡得很熟，","kind":"text"},{"t":29.25,"en":"so I got a ladder from the shed in the garden, put it against the wall,","zh":"于是我从花园的小屋里搬来一架梯子，把它靠在墙上，","kind":"text"},{"t":34.71,"en":"and began climbing towards the bedroom window.","zh":"开始朝着卧室的窗户爬去。","kind":"text"},{"t":38.6,"en":"I was almost there when a sarcastic voice below said.","zh":"我快爬到窗户时，下面传来一个挖苦人的声音：","kind":"text"},{"t":44.36,"en":"'I don't think the windows need cleaning at this time of the night.'","zh":"“我认为窗户在夜间这个时候不需要擦洗。”","kind":"text"},{"t":50.07,"en":"I looked down and nearly fell off the ladder when I saw a policeman.","zh":"我向下看去，当看到一个警察时，我差点从梯子上掉下来。","kind":"text"},{"t":56.45,"en":"I immediately regretted answering in the way I did, but I said, 'I enjoy cleaning windows at night.'","zh":"我马上后悔不该那样回答，但我还是说：“我喜欢在夜间擦洗窗户。”","kind":"text"},{"t":67.86,"en":"'So do I,' answered the policeman in the same tone.","zh":"“我也喜欢，”警察用同样的声调回答说。","kind":"text"},{"t":73.36,"en":"Excuse my interrupting you.","zh":"“请原谅我打断你一下。","kind":"text"},{"t":76.2,"en":"I hate to interrupt a man when he's busy working, but would you mind coming with me to the station?'","zh":"我不愿意打断一个正在忙碌的人，但你介意跟我到警察局去一趟吗？”","kind":"text"},{"t":85.82,"en":"'Well, I'd prefer to stay here,' I said.","zh":"“嗯，我宁愿呆在这儿，”我说。","kind":"text"},{"t":90.64,"en":"'You see, I've forgotten my key.'","zh":"“您瞧，我忘了带钥匙。”","kind":"text"},{"t":94.12,"en":"'Your what?' he called.","zh":"“你的什么？”他大声问。","kind":"text"},{"t":97.11,"en":"'My key,' I shouted.","zh":"“我的钥匙！”我喊道。","kind":"text"},{"t":101.21,"en":"Fortunately, the shouting woke up my wife who opened the window just as the policeman had started to climb towards me.","zh":"幸运的是，我的喊叫声把妻子吵醒了，她打开窗户，而此时那个警察刚开始向我爬过来。","kind":"text"}]},{"id":"NCE2-93","book":"NCE2","bookCn":"第二册","num":93,"title":"A Noble Gift","slug":"93.A Noble Gift","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/93.A%20Noble%20Gift.mp3","sentenceCount":13,"wordCount":179,"lines":[{"t":10.7,"en":"Where was the Statue of Liberty made?","zh":"自由女神像是在哪里制造的？","kind":"question"},{"t":15.67,"en":"One of the most famous monuments in the world, the Statue of Liberty,","zh":"世界上最著名的纪念碑之一，自由女神像，","kind":"text"},{"t":21.58,"en":"was presented to the USA in the nineteenth century by the people of France.","zh":"在十九世纪由法国人民赠送给美国。","kind":"text"},{"t":29.3,"en":"The great statue, which was designed by the sculptor Auguste Bartholdi, took ten years to complete.","zh":"这座由雕塑家奥古斯特·巴托尔迪设计的宏伟雕像，花了十年才完成。","kind":"text"},{"t":39.14,"en":"The actual figure was made of copper supported by a metal framework which had been especially constructed by Eiffel.","zh":"实际雕像由铜制成，由埃菲尔专门建造的金属框架支撑。","kind":"text"},{"t":49.09,"en":"Before it could be transported to the United States,","zh":"在它被运往美国之前，","kind":"text"},{"t":53.21,"en":"a site had to be found for it and a pedestal had to be built.","zh":"必须为它找到一个地点并建造一个基座。","kind":"text"},{"t":58.79,"en":"The site chosen was an island at the entrance of New York Harbour.","zh":"所选地点是纽约港入口处的一个岛屿。","kind":"text"},{"t":64.37,"en":"By 1884, a statue which was 151 feet tall had been erected in Paris.","zh":"到1884年，一座151英尺高的雕像已在巴黎建成。","kind":"text"},{"t":73.43,"en":"The following year, it was taken to pieces and sent to America.","zh":"次年，它被拆解并运往美国。","kind":"text"},{"t":79.43,"en":"By the end of October 1886,","zh":"到1886年10月底，","kind":"text"},{"t":83.8,"en":"the statue had been put together again and it was officially presented to the American people by Bartholdi.","zh":"雕像已被重新组装，并由巴托尔迪正式赠送给美国人民。","kind":"text"},{"t":93.85,"en":"Ever since then, the great monument has been a symbol of liberty","zh":"从那时起，这座伟大的纪念碑一直是自由的象征，","kind":"text"},{"t":99.32,"en":"for the millions of people who have passed through New York Harbour to make their homes in America.","zh":"对数百万穿过纽约港来美国安家的人们来说。","kind":"text"}]},{"id":"NCE2-94","book":"NCE2","bookCn":"第二册","num":94,"title":"Future Champions","slug":"94.Future Champions","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/94.Future%20Champions.mp3","sentenceCount":12,"wordCount":179,"lines":[{"t":11.29,"en":"What kind of race do the children compete in?","zh":"孩子们参加的是哪种比赛？","kind":"question"},{"t":16.63,"en":"Experiments have proved that children can be instructed in swimming at a very early age.","zh":"实验证明，孩子们可以在很小的时候就被教导游泳。","kind":"text"},{"t":25.1,"en":"At a special swimming pool in Los Angeles,","zh":"在洛杉矶的一个特殊游泳池里，","kind":"text"},{"t":28.72,"en":"children become expert at holding their breath under water even before they can walk.","zh":"孩子们甚至在学会走路之前就能熟练地在水下憋气。","kind":"text"},{"t":36.5,"en":"Babies of two months old do not appear to be reluctant to enter the water.","zh":"两个月大的婴儿似乎并不抵触下水。","kind":"text"},{"t":42.95,"en":"It is not long before they are so accustomed to swimming that they can pick up weights from the floor of the pool.","zh":"没过多久，他们就非常适应游泳了，甚至能从泳池底部捡起重物。","kind":"text"},{"t":51.71,"en":"A game that is very popular with these young swimmers is the underwater tricycle race.","zh":"这些小泳者非常喜欢的一项游戏是水下三轮车比赛。","kind":"text"},{"t":59.56,"en":"Tricycles are lined up on the floor of the pool seven feet under water.","zh":"三轮车排成一列，放置在水下七英尺深的泳池底部。","kind":"text"},{"t":66.26,"en":"The children compete against each other to reach the other end of the pool.","zh":"孩子们互相竞争，看谁先到达泳池的另一端。","kind":"text"},{"t":72.26,"en":"Many pedal their tricycles but most of them prefer to push or drag them.","zh":"许多孩子会蹬他们的三轮车，但大多数人更喜欢推或拖它们。","kind":"text"},{"t":79.68,"en":"Some children can cover the whole length of the pool without coming up for breath even once.","zh":"有些孩子甚至可以游完整个泳池的长度而不用浮出水面换气一次。","kind":"text"},{"t":88.12,"en":"Whether they will ever become future Olympic champions, only time will tell.","zh":"他们将来是否会成为奥运冠军，只有时间能证明。","kind":"text"},{"t":94.5,"en":"Meanwhile, they should encourage those among us who cannot swim five yards before they are gasping for air.","zh":"同时，他们应该鼓励我们中那些游不到五码就气喘吁吁的人。","kind":"text"}]},{"id":"NCE2-95","book":"NCE2","bookCn":"第二册","num":95,"title":"A Fantasy","slug":"95.A Fantasy","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/95.A%20Fantasy.mp3","sentenceCount":22,"wordCount":181,"lines":[{"t":9.57,"en":"Why was the Ambassador particularly lucky?","zh":"为什么大使特别幸运？","kind":"question"},{"t":14.92,"en":"When the Ambassador of Escalopia returned home for lunch, his wife got a shock.","zh":"当埃斯卡洛皮亚大使回家吃午饭时，他的妻子吓了一跳。","kind":"text"},{"t":23.22,"en":"He looked pale and his clothes were in a frightful state.","zh":"他脸色苍白，衣服也糟透了。","kind":"text"},{"t":28.74,"en":"'What has happened?' she asked.","zh":"“出什么事了？”她问道。","kind":"text"},{"t":32.77,"en":"'How did your clothes get into such a mess?'","zh":"“你的衣服怎么搞得这么乱？”","kind":"text"},{"t":37.81,"en":"'A fire extinguisher, my dear,' answered the Ambassador drily.","zh":"“灭火器，亲爱的，”大使干巴巴地回答道。","kind":"text"},{"t":43.66,"en":"'University students set the Embassy on fire this morning.'","zh":"“今天早上大学生把大使馆点着了。”","kind":"text"},{"t":48.63,"en":"'Good heavens!' exclaimed his wife.","zh":"“天哪！”他的妻子惊呼道。","kind":"text"},{"t":52.87,"en":"'And where were you at the time?'","zh":"“那你当时在哪里？”","kind":"text"},{"t":56.61,"en":"'I was in my office as usual,' answered the Ambassador.","zh":"“我像往常一样在办公室里，”大使回答道。","kind":"text"},{"t":61.45,"en":"'The fire broke out in the basement.","zh":"“火灾发生在地下室。","kind":"text"},{"t":64.41,"en":"I went down immediately, of course, and that fool, Horst,","zh":"我当然立刻下去了，然后那个傻瓜霍斯特，","kind":"text"},{"t":69.87,"en":"aimed a fire extinguisher at me.","zh":"把灭火器对准了我。","kind":"text"},{"t":72.8,"en":"He thought I was on fire.","zh":"他以为我着火了。","kind":"text"},{"t":75.67,"en":"I must definitely get that fellow posted.'","zh":"我一定要把那个家伙调走。”","kind":"text"},{"t":80.33,"en":"The Ambassador's wife went on asking questions,","zh":"大使夫人继续提问，","kind":"text"},{"t":84.4,"en":"when she suddenly noticed a big hole in her husband's hat.","zh":"突然她发现丈夫的帽子上有一个大洞。","kind":"text"},{"t":90.27,"en":"'And how can you explain that?' she asked.","zh":"“那你怎么解释那个？”她问道。","kind":"text"},{"t":94.88,"en":"'Oh, that,' said the Ambassador.","zh":"“哦，那个，”大使说道。","kind":"text"},{"t":98.56,"en":"'Someone fired a shot through my office window.","zh":"“有人朝我办公室窗户开了一枪。","kind":"text"},{"t":102.59,"en":"Accurate, don't you think?","zh":"够准的，不是吗？","kind":"text"},{"t":104.88,"en":"Fortunately, I wasn't wearing it at the time.","zh":"幸好，我当时没戴着它。","kind":"text"},{"t":109.36,"en":"If I had been, I would not have been able to get home for lunch.'","zh":"如果我当时戴着，我就不能回家吃午饭了。”","kind":"text"}]},{"id":"NCE2-96","book":"NCE2","bookCn":"第二册","num":96,"title":"The Dead Return","slug":"96.The Dead Return","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/96.The%20Dead%20Return.mp3","sentenceCount":13,"wordCount":185,"lines":[{"t":11.01,"en":"What happens to the lanterns at the end of the festival?","zh":"节日结束后，那些灯笼会怎么样？","kind":"question"},{"t":17.38,"en":"A Festival for the Dead is held once a year in Japan.","zh":"日本每年举行一次亡灵节。","kind":"text"},{"t":22.72,"en":"This festival is a cheerful occasion,","zh":"这个节日是个欢乐的时刻，","kind":"text"},{"t":26.05,"en":"for on this day, the dead are said to return to their homes and they are welcomed by the living.","zh":"因为据说在这一天，逝者会回到他们的家园，受到生者的欢迎。","kind":"text"},{"t":34.36,"en":"As they are expected to be hungry after their long journey, food is laid out for them.","zh":"由于他们长途跋涉后会感到饥饿，人们会为他们摆放食物。","kind":"text"},{"t":41.81,"en":"Specially-made lanterns are hung outside each house to help the dead to find their way.","zh":"每家每户外面都挂着特制的灯笼，帮助逝者找到回家的路。","kind":"text"},{"t":49.85,"en":"All night long, people dance and sing.","zh":"人们通宵达旦地载歌载舞。","kind":"text"},{"t":54.07,"en":"In the early morning the food that had been laid out for the dead","zh":"清晨，为逝者摆放的食物","kind":"text"},{"t":59.49,"en":"is thrown into a river or into the sea as it is considered unlucky for anyone living to eat it.","zh":"被扔进河里或海里，因为活人吃了被认为是不吉利的。","kind":"text"},{"t":69.25,"en":"In towns that are near the sea, the tiny lanterns which had been hung in the streets the night before,","zh":"在沿海城镇，头天晚上挂在街上的小灯笼，","kind":"text"},{"t":77.84,"en":"are placed into the water when the festival is over.","zh":"节日结束后会被放入水中。","kind":"text"},{"t":82.15,"en":"Thousands of lanterns slowly drift out to sea guiding the dead on their return journey to the other world.","zh":"数千盏灯笼缓缓地漂向大海，指引逝者返回另一个世界。","kind":"text"},{"t":91.58,"en":"This is a moving spectacle, for crowds of people","zh":"这是一幅感人的景象，因为成群的人们","kind":"text"},{"t":96.07,"en":"stand on the shore watching the lanterns drifting away until they can be seen no more.","zh":"站在岸边，看着灯笼渐渐远去，直到它们完全消失不见。","kind":"text"}]},{"id":"NCE3-01","book":"NCE3","bookCn":"第三册","num":1,"title":"A Puma at Large","slug":"01.A Puma at Large","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/01.A%20Puma%20at%20Large.mp3","sentenceCount":21,"wordCount":273,"lines":[{"t":0.68,"en":"Lesson 1","zh":"第1课","kind":"lesson"},{"t":2.36,"en":"A puma at large","zh":"豹子出逃","kind":"title"},{"t":9.81,"en":"Where must the puma have come from?","zh":"这头美洲狮是从哪里来的呢？","kind":"question"},{"t":14.48,"en":"Pumas are large, cat-like animals which are found in America.","zh":"美洲狮是一种体形似猫的大动物，产于美洲。","kind":"text"},{"t":19.17,"en":"When reports came into London Zoo that a wild puma had been spotted forty-five miles south of London,","zh":"当伦敦动物园接到报告，说在伦敦南面45英里处发现一头野生美洲狮时，","kind":"text"},{"t":26.27,"en":"they were not taken seriously.","zh":"他们并没有认真对待。","kind":"text"},{"t":29.15,"en":"However, as the evidence began to accumulate,","zh":"然而，随着证据的增多，","kind":"text"},{"t":33.21,"en":"experts from the Zoo felt obliged to investigate,","zh":"动物园的专家们感到有必要进行一番调查，","kind":"text"},{"t":37.15,"en":"for the descriptions given by people who claimed to have seen the puma were extraordinarily similar.","zh":"因为凡是声称见过美洲狮的人们所描述的情况竟然惊人地相似。","kind":"text"},{"t":43.86,"en":"The hunt for the puma began in a small village where a woman picking blackberries saw 'a large cat' only five yards away from her.","zh":"搜捕美洲狮的行动是从一个小村庄开始的，在那里，一位采摘黑莓的妇女看见“一只大猫”离她只有五码远。","kind":"text"},{"t":53.61,"en":"It immediately ran away when she saw it,","zh":"她一看到它，它就立刻跑开了，","kind":"text"},{"t":56.49,"en":"and experts confirmed that a puma will not attack a human being unless it is cornered.","zh":"专家证实，美洲狮除非被逼入绝境，否则是不会伤人的。","kind":"text"},{"t":62.94,"en":"The search proved difficult,","zh":"搜寻工作很困难，","kind":"text"},{"t":65.2,"en":"for the puma was often observed at one place in the morning and at another place twenty miles away in the evening.","zh":"因为常常是早晨在一个地方发现美洲狮，晚上却在20英里以外的另一个地方发现它。","kind":"text"},{"t":72.58,"en":"Wherever it went, it left behind it a trail of dead deer and small animals like rabbits.","zh":"无论它走到哪里，身后都留下了死鹿及死兔子之类小动物的痕迹。","kind":"text"},{"t":79.38,"en":"Paw prints were seen in a number of places and puma fur was found clinging to bushes.","zh":"在许多地方都发现了美洲狮的爪印，灌木丛中也发现了美洲狮的毛。","kind":"text"},{"t":85.39,"en":"Several people complained of 'cat-like noises' at night and a businessman on a fishing trip saw the puma up a tree.","zh":"有几个人抱怨说夜里听到了“像猫叫一样的声音”，一位商人在钓鱼时也看见那只美洲狮爬到了一棵树上。","kind":"text"},{"t":94.26,"en":"The experts were now fully convinced that the animal was a puma,","zh":"专家们现在完全相信那只动物就是美洲狮，","kind":"text"},{"t":98.72,"en":"but where had it come from?","zh":"可是它是从哪里来的呢？","kind":"text"},{"t":101.27,"en":"As no pumas had been reported missing from any zoo in the country,","zh":"由于全国任何一家动物园都没有报道说美洲狮失踪，","kind":"text"},{"t":105.55,"en":"this one must have been in the possession of a private collector and somehow managed to escape.","zh":"那么这只美洲狮一定是某个私人收藏者喂养的，且不知怎么设法逃脱了。","kind":"text"},{"t":112.16,"en":"The hunt went on for several weeks,","zh":"搜捕进行了数周，","kind":"text"},{"t":114.18,"en":"but the puma was not caught.","zh":"但那只美洲狮仍未捕获。","kind":"text"},{"t":117.42,"en":"It is disturbing to think that a dangerous wild animal is still at large in the quiet countryside.","zh":"想到在这宁静的乡村里，一只危险的野生动物仍然逍遥在外，真令人不安。","kind":"text"}]},{"id":"NCE3-02","book":"NCE3","bookCn":"第三册","num":2,"title":"Thirteen Equals One","slug":"02.Thirteen Equals One","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/02.Thirteen%20Equals%20One.mp3","sentenceCount":20,"wordCount":252,"lines":[{"t":0.29,"en":"Lesson 2","zh":"第2课","kind":"lesson"},{"t":2.18,"en":"Thirteen equals one","zh":"十三等于一","kind":"title"},{"t":10.1,"en":"Was the vicar pleased that the clock was striking? Why?","zh":"牧师对钟声响起感到高兴吗？为什么？","kind":"question"},{"t":16.63,"en":"Our vicar is always raising money for one cause or another,","zh":"我们的牧师总是为这样或那样的缘故筹款，","kind":"text"},{"t":20.87,"en":"but he has never managed to get enough money to have the church clock repaired.","zh":"但他从未筹集到足够的钱来修理教堂的时钟。","kind":"text"},{"t":26.49,"en":"The big clock which used to strike the hours day and night was damaged many years ago and has been silent ever since.","zh":"那座日夜报时的大钟多年前损坏了，从那以后就一直沉默不语。","kind":"text"},{"t":36.38,"en":"One night, however, our vicar woke up with a start:the clock was striking the hours!","zh":"然而，一天晚上，我们的牧师突然惊醒：钟正在报时！","kind":"text"},{"t":43.48,"en":"Looking at his watch, he saw that it was one o'clock,","zh":"他看了看表，发现是一点钟，","kind":"text"},{"t":47.38,"en":"but the bell struck thirteen times before it stopped.","zh":"但钟声响了十三次才停下来。","kind":"text"},{"t":51.91,"en":"Armed with a torch, the vicar went up into the clock tower to see what was going on.","zh":"牧师拿着手电筒，爬上钟楼，想看看发生了什么事。","kind":"text"},{"t":58.03,"en":"In the torchlight, he caught sight of a figure whom he immediately recognized as Bill Wilkins, our local grocer.","zh":"在手电筒的光束中，他看到一个人影，他立刻认出那是比尔·威尔金斯，我们当地的杂货商。","kind":"text"},{"t":66.24,"en":"'Whatever are you doing up here Bill?' asked the vicar in surprise.","zh":"“比尔，你在这上面做什么？”牧师惊讶地问道。","kind":"text"},{"t":71.57,"en":"'I'm trying to repair the bell, ' answered Bill.","zh":"“我正在努力修理钟，”比尔回答道。","kind":"text"},{"t":75.23,"en":"'I've been coming up here night after night for weeks now.","zh":"“我来这里已经好几个星期了，夜复一夜。","kind":"text"},{"t":78.64,"en":"You see, I was hoping to give you a surprise.'","zh":"你看，我本来希望能给你一个惊喜。”","kind":"text"},{"t":82.4,"en":"'You certainly did give me a surprise!' said the vicar.","zh":"“你确实给了我一个惊喜！”牧师说。","kind":"text"},{"t":85.82,"en":"'You've probably woken up everyone in the village as well.","zh":"“你可能也把村里所有人都吵醒了。","kind":"text"},{"t":89.51,"en":"Still, I'm glad the bell is working again.'","zh":"不过，我很高兴钟又响了。”","kind":"text"},{"t":93.01,"en":"'That's the trouble, vicar, 'answered Bill. 'It's working all right,","zh":"“问题就在这儿，牧师，”比尔回答道。“它确实在响，","kind":"text"},{"t":98.07,"en":"but I'm afraid that at one o'clock it will strike thirteen times and there's nothing I can do about it.'","zh":"但我担心一点钟的时候它会响十三次，我对此束手无策。”","kind":"text"},{"t":105.01,"en":"'We'll get used to that, Bill, 'said the vicar.","zh":"“我们会习惯的，比尔，”牧师说。","kind":"text"},{"t":108.05,"en":"'Thirteen is not as good as one, but it's better than nothing.","zh":"“十三次不如一次好，但总比没有好。","kind":"text"},{"t":112.95,"en":"Now let's go downstairs and have a cup of tea.'","zh":"现在我们下去喝杯茶吧。”","kind":"text"}]},{"id":"NCE3-03","book":"NCE3","bookCn":"第三册","num":3,"title":"An Unknown Goddess","slug":"03.An Unknown Goddess","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/03.An%20Unknown%20Goddess.mp3","sentenceCount":17,"wordCount":253,"lines":[{"t":0.95,"en":"Lesson 3","zh":"第3课","kind":"lesson"},{"t":2.34,"en":"An unknown goddess","zh":"一个不知名的女神","kind":"title"},{"t":10.64,"en":"How did the archaeologists know that the statue was a goddess?","zh":"考古学家怎么知道这座雕像是女神？","kind":"question"},{"t":16.23,"en":"Some time ago, an interesting discovery was made by archaeologists on the Aegean island of Kea.","zh":"不久前，考古学家在爱琴海的凯阿岛上有一项有趣的发现。","kind":"text"},{"t":24.33,"en":"An American team explored a temple which stands in an ancient city on the promontory of Ayia Irini.","zh":"一个美国小组考察了在阿伊亚伊里尼海角的一座古城中的一座神庙。","kind":"text"},{"t":32.71,"en":"The city at one time must have been prosperous, for it enjoyed a high level of civilization.","zh":"这座城市曾一度繁荣，因为它享有高度的文明。","kind":"text"},{"t":38.98,"en":"Houses -- often three storeys high -- were built of stone.","zh":"房屋——通常有三层楼高——是用石头建造的。","kind":"text"},{"t":44.07,"en":"They had large rooms with beautifully decorated walls.","zh":"它们有大房间，墙壁装饰精美。","kind":"text"},{"t":48.39,"en":"The city was even equipped with a drainage system, for a great many clay pipes were found beneath the narrow streets.","zh":"这座城市甚至配备了排水系统，因为在狭窄的街道下发现了大量的陶土管道。","kind":"text"},{"t":57.46,"en":"The temple which the archaeologists explored was used as a place of worship from the fifteenth century B.C. until Roman times.","zh":"考古学家考察的神庙从公元前15世纪一直到罗马时代都被用作礼拜场所。","kind":"text"},{"t":67.15,"en":"In the most sacred room of the temple, clay fragments of fifteen statues were found.","zh":"在神庙最神圣的房间里，发现了15尊雕像的陶土碎片。","kind":"text"},{"t":74.21,"en":"Each of these represented a goddess and had, at one time, been painted.","zh":"每一尊都代表一位女神，并且曾被涂上颜色。","kind":"text"},{"t":80.18,"en":"The body of one statue was found among remains dating from the 15th century B.C.","zh":"一尊雕像的身体是在可追溯到公元前15世纪的遗迹中发现的。","kind":"text"},{"t":87.02,"en":"Its missing head happened to be among remains of the fifth century B.C.","zh":"它缺失的头部碰巧在公元前5世纪的遗迹中。","kind":"text"},{"t":92.8,"en":"This head must have been found in Classical times and carefully preserved.","zh":"这个头部一定是在古典时期被发现并精心保存下来的。","kind":"text"},{"t":97.84,"en":"It was very old and precious even then.","zh":"即使在当时，它也非常古老而珍贵。","kind":"text"},{"t":101.87,"en":"When the archaeologists reconstructed the fragments, they were amazed to find that the goddess turned out to be a very modern-looking woman.","zh":"当考古学家重组这些碎片时，他们惊讶地发现这位女神竟然是一个看起来非常现代的女人。","kind":"text"},{"t":111.07,"en":"She stood three feet high and her hands rested on her hips.","zh":"她身高三英尺，双手叉腰。","kind":"text"},{"t":115.76,"en":"She was wearing a full-length skirt which swept the ground.","zh":"她穿着一件拖地的长裙。","kind":"text"},{"t":119.95,"en":"Despite her great age, she was very graceful indeed, but, so far, the archaeologists have been unable to discover her identity.","zh":"尽管她年代久远，但确实非常优雅，不过到目前为止，考古学家们还未能发现她的身份。","kind":"text"}]},{"id":"NCE3-04","book":"NCE3","bookCn":"第三册","num":4,"title":"The Double Life of Alfred Bloggs","slug":"04.The Double Life of Alfred Bloggs","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/04.The%20Double%20Life%20of%20Alfred%20Bloggs.mp3","sentenceCount":14,"wordCount":249,"lines":[{"t":0.78,"en":"Lesson 4","zh":"第4课","kind":"lesson"},{"t":2.44,"en":"The double life of Alfred Bloggs","zh":"阿尔弗雷德·布洛格斯的双重生活","kind":"title"},{"t":11.34,"en":"Why did Alf want a white-collar job?","zh":"阿尔弗为什么想找份白领工作？","kind":"question"},{"t":16.83,"en":"These days, people who do manual work often receive far more money than people who work in offices.","zh":"如今，从事体力劳动的人挣的钱，常常比办公室工作人员挣的钱多得多。","kind":"text"},{"t":24.76,"en":"People who work in offices are frequently referred to as 'white-collar workers' for the simple reason that they usually wear a collar and tie to go to work.","zh":"办公室工作人员通常被称为“白领工人”，原因很简单，他们上班时通常穿带领带的衬衫。","kind":"text"},{"t":36.74,"en":"Such is human nature, that a great many people are often willing to sacrifice higher pay for the privilege of becoming white-collar workers.","zh":"人性如此，许多人常常愿意牺牲较高的工资，以换取成为白领工人的殊荣。","kind":"text"},{"t":48.19,"en":"This can give rise to curious situations, as it did in the case of Alfred Bloggs who worked as a dustman for the Ellesmere Corporation.","zh":"这可能导致一些奇怪的情况，就像阿尔弗雷德·布洛格斯的情况一样，他曾是埃尔斯米尔公司的一名清洁工。","kind":"text"},{"t":60.78,"en":"When he got married, Alf was too embarrassed to say anything to his wife about his job.","zh":"结婚时，阿尔弗太不好意思告诉妻子他的工作了。","kind":"text"},{"t":67.63,"en":"He simply told her that he worked for the Corporation.","zh":"他只告诉她他在公司上班。","kind":"text"},{"t":71.57,"en":"Every morning, he left home dressed in a smart black suit.","zh":"每天早上，他都穿着一套漂亮的黑色西装出门。","kind":"text"},{"t":76.45,"en":"He then changed into overalls and spent the next eight hours as a dustman.","zh":"然后他换上工作服，接下来的八个小时都当清洁工。","kind":"text"},{"t":82.9,"en":"Before returning home at night, he took a shower and changed back into his suit.","zh":"晚上回家前，他洗了个澡，又换回了他的西装。","kind":"text"},{"t":89.02,"en":"Alf did this for over two years and his fellow dustmen kept his secret.","zh":"阿尔弗这样做了两年多，他的清洁工同事们都替他保密。","kind":"text"},{"t":95.66,"en":"Alf's wife has never discovered that she married a dustman and she never will, for Alf has just found another job.","zh":"阿尔弗的妻子从未发现她嫁给了一个清洁工，而且她永远也不会发现了，因为阿尔弗刚刚找到了另一份工作。","kind":"text"},{"t":104.47,"en":"He will soon be working in an office.","zh":"他很快就要在办公室工作了。","kind":"text"},{"t":107.61,"en":"He will be earning only half as much as he used to, but he feels that his rise in status is well worth the loss of money.","zh":"他挣的钱将只有以前的一半，但他觉得地位的提升，很值得损失这点钱。","kind":"text"},{"t":117.05,"en":"From now on, he will wear a suit all day and others will call him 'Mr.Bloggs', not 'Alf'.","zh":"从现在起，他将一整天都穿西装，别人会称呼他“布洛格斯先生”，而不是“阿尔弗”。","kind":"text"}]},{"id":"NCE3-05","book":"NCE3","bookCn":"第三册","num":5,"title":"The Facts","slug":"05.The Facts","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/05.The%20Facts.mp3","sentenceCount":14,"wordCount":249,"lines":[{"t":0.67,"en":"Lesson 5","zh":"第5课","kind":"lesson"},{"t":2.12,"en":"The facts","zh":"事实真相","kind":"title"},{"t":8.68,"en":"What was the consequence of the editor's insistence on facts and statistics?","zh":"编辑坚持事实和统计数据的后果是什么？","kind":"question"},{"t":16.65,"en":"Editors of newspapers and magazines often go to extremes to provide their readers with unimportant facts and statistics.","zh":"报纸杂志的编辑们常常不厌其烦地向读者提供一些无关紧要的事实和统计数字。","kind":"text"},{"t":25.01,"en":"Last year a journalist had been instructed by a well-known magazine to write an article on the president's palace in a new African republic.","zh":"去年，一家有名的杂志派一名记者去撰写一篇有关一个非洲新共和国总统府的稿件。","kind":"text"},{"t":35.09,"en":"When the article arrived, the editor read the first sentence and then refused to publish it.","zh":"稿件寄来后，编辑看了第一句话就拒绝发表。","kind":"text"},{"t":42.43,"en":"The article began:'Hundreds of steps lead to the high wall which surrounds the president's palace.'","zh":"文章的开头是这样的：“几百级台阶通向总统府四周的高墙。”","kind":"text"},{"t":50.24,"en":"The editor at once sent the journalist a fax instructing him to find out the exact number of steps and the height of the wall.","zh":"编辑立即给记者发了一份传真，指示他查明台阶的确切数字和围墙的高度。","kind":"text"},{"t":61.28,"en":"The journalist immediately set out to obtain these important facts, but he took a long time to send them.","zh":"记者立即动身去搜集这些重要的事实，但过了很久才把材料寄来。","kind":"text"},{"t":68.66,"en":"Meanwhile, the editor was getting impatient, for the magazine would soon go to press.","zh":"与此同时，编辑等得不耐烦了，因为杂志很快就要付印。","kind":"text"},{"t":74.24,"en":"He sent the journalist two more faxes, but received no reply.","zh":"他又给记者发了两份传真，但没有任何回音。","kind":"text"},{"t":79.44,"en":"He sent yet another fax informing the journalist that if he did not reply soon he would be fired.","zh":"他又发了一份传真，通知记者说如果再不迅速回复，他就将被解雇。","kind":"text"},{"t":86.81,"en":"When the journalist again failed to reply, the editor reluctantly published the article as it had originally been written.","zh":"记者还是没有回复，编辑只好不情愿地按原样发表了那篇文章。","kind":"text"},{"t":95.61,"en":"A week later, the editor at last received a fax from the journalist.","zh":"一周后，编辑终于接到了记者的一份传真。","kind":"text"},{"t":100.98,"en":"Not only had the poor man been arrested, but he had been sent to prison as well.","zh":"那可怜的记者不仅被捕了，而且还被送进了监狱。","kind":"text"},{"t":107.19,"en":"However, he had at last been allowed to send a fax in which he informed the editor that he had been arrested","zh":"然而，他最终获准发了一份传真，在传真中他告诉编辑，他被捕了，","kind":"text"},{"t":115.99,"en":"while counting the 1, 084 steps leading to the 15th foot wall which surrounded the president's palace.","zh":"因为他正在数通向总统府的1084级台阶和围绕总统府15英尺高的围墙。","kind":"text"}]},{"id":"NCE3-06","book":"NCE3","bookCn":"第三册","num":6,"title":"Smash-and-Grab","slug":"06.Smash-and-Grab","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/06.Smash-and-Grab.mp3","sentenceCount":19,"wordCount":248,"lines":[{"t":0.42,"en":"Lesson 6","zh":"第6课","kind":"lesson"},{"t":2.22,"en":"Smash-and-grab","zh":"砸橱窗抢劫","kind":"title"},{"t":8.7,"en":"How did Mr. Taylor try to stop the thieves?","zh":"泰勒先生是怎样试图阻止窃贼的？","kind":"question"},{"t":13.91,"en":"The expensive shops in a famous arcade near Piccadilly were just opening.","zh":"靠近皮卡迪利大街的著名拱形建筑里的那些高档商店刚刚开门。","kind":"text"},{"t":19.86,"en":"At this time of the morning, the arcade was almost empty.","zh":"在早晨这个时候，拱形建筑里几乎空无一人。","kind":"text"},{"t":24.53,"en":"Mr. Taylor, the owner of a jewellery shop was admiring a new window display.","zh":"珠宝店店主泰勒先生正在欣赏新布置的橱窗。","kind":"text"},{"t":30.92,"en":"Two of his assistants had been working busily since 8 o'clock and had only just finished.","zh":"他的两名助手从8点钟就开始忙碌，刚刚才把橱窗布置好。","kind":"text"},{"t":38.1,"en":"Diamond necklaces and rings had been beautifully arranged on a background of black velvet.","zh":"钻石项链和戒指精美地摆放在黑色丝绒的衬托下。","kind":"text"},{"t":45.36,"en":"After gazing at the display for several minutes, Mr. Taylor went back into his shop.","zh":"泰勒先生凝视橱窗几分钟之后，便回到了店里。","kind":"text"},{"t":52.13,"en":"The silence was suddenly broken when a large car, with its headlights on and its horn blaring, roared down the arcade.","zh":"正在这时，突然一辆开着车灯、鸣着喇叭的汽车，咆哮着冲进了拱形建筑，打破了寂静。","kind":"text"},{"t":61.86,"en":"It came to a stop outside the jeweller's.","zh":"它在珠宝店门口停了下来。","kind":"text"},{"t":65.68,"en":"One man stayed at the wheel while two others with black stockings over their faces jumped out and smashed the window of the shop with iron bars.","zh":"一个人留在驾驶座上，另外两个人则蒙着黑色丝袜跳下车，用铁棍砸碎了商店的橱窗。","kind":"text"},{"t":76.82,"en":"While this was going on, Mr. Taylor was upstairs.","zh":"就在这当儿，泰勒先生正在楼上。","kind":"text"},{"t":81.36,"en":"He and his staff began throwing furniture out of the window.","zh":"他和店员开始把家具往窗外扔。","kind":"text"},{"t":86.25,"en":"Chairs and tables went flying into the arcade.","zh":"椅子和桌子飞进了拱形建筑。","kind":"text"},{"t":90.59,"en":"One of the thieves was struck by a heavy statue,","zh":"其中一个窃贼被一尊沉重的塑像砸中，","kind":"text"},{"t":94.21,"en":"but he was too busy helping himself to diamonds to notice any pain.","zh":"但他只顾忙着抢钻石，根本没注意到疼痛。","kind":"text"},{"t":100.36,"en":"The raid was all over in three minutes, for the men scrambled back into the car and it moved off at a fantastic speed.","zh":"抢劫在3分钟之内便结束了，因为劫匪们又争先恐后地跳上汽车，汽车以惊人的速度开走了。","kind":"text"},{"t":110.19,"en":"Just as it was leaving,","zh":"就在汽车开走的时候，","kind":"text"},{"t":112.38,"en":"Mr.Taylor rushed out and ran after it throwing ashtrays and vases,","zh":"泰勒先生冲了出来，一边追赶汽车，一边扔烟灰缸和花瓶，","kind":"text"},{"t":117.86,"en":"but it was impossible to stop the thieves.","zh":"但根本无法阻止窃贼。","kind":"text"},{"t":120.99,"en":"They had got away with thousands of pounds worth of diamonds.","zh":"他们已带着价值数千英镑的钻石逃走了。","kind":"text"}]},{"id":"NCE3-07","book":"NCE3","bookCn":"第三册","num":7,"title":"Mutilated Ladies","slug":"07.Mutilated Ladies","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/07.Mutilated%20Ladies.mp3","sentenceCount":17,"wordCount":245,"lines":[{"t":0.24,"en":"Lesson 7","zh":"第7课","kind":"lesson"},{"t":1.89,"en":"Mutilated Ladies","zh":"残损的钞票","kind":"title"},{"t":8.69,"en":"Why did Jane cook John's wallet?","zh":"简为什么要烹调约翰的钱包？","kind":"question"},{"t":12.78,"en":"Has it ever happened to you?","zh":"你有过这种经历吗？","kind":"text"},{"t":15.17,"en":"Have you ever put your trousers in the washing machine and then remembered there was a large bank note in your back pocket?","zh":"你是否曾经把裤子放进洗衣机里，然后才想起你的后裤袋里有一张大额钞票？","kind":"text"},{"t":23.29,"en":"When you rescued your trousers, did you find the note was whiter than white?","zh":"当你把裤子拿出来时，是否发现那张钞票比雪还白？","kind":"text"},{"t":29.1,"en":"People who live in Britain needn't despair when they make mistakes like this (and a lot of people do)!","zh":"在英国居住的人们犯了这种错误不必绝望（而且很多人都会犯这种错误）！","kind":"text"},{"t":36.62,"en":"Fortunately for them, the Bank of England has a team called Mutilated Ladies","zh":"对他们来说幸运的是，英格兰银行有一个名为“残钞处理小组”的团队，","kind":"text"},{"t":42.32,"en":"which deals with claims from people who fed their money to a machine or to their dog.","zh":"处理那些把钱喂给机器或喂给狗的人提出的索赔。","kind":"text"},{"t":48.62,"en":"Dogs, it seems, love to chew up money!","zh":"看来狗很喜欢嚼钱！","kind":"text"},{"t":52.94,"en":"A recent case concerns Jane Butlin whose fiance, John, runs a successful furniture business.","zh":"最近有一件事是关于简·巴特林，她的未婚夫约翰经营着一家成功的家具公司。","kind":"text"},{"t":61.06,"en":"John had a very good day and put his wallet containing ￡3, 000 into the microwave oven for safekeeping.","zh":"约翰那天生意很好，就把装有3000英镑的钱包放进了微波炉里，以求安全。","kind":"text"},{"t":69.99,"en":"Then he and Jane went horse-riding.","zh":"然后他和简去骑马了。","kind":"text"},{"t":72.63,"en":"When they got home, Jane cooked their dinner in the microwave oven and without realizing it, cooked her fiance's wallet as well.","zh":"他们到家后，简在微波炉里做了晚餐，并且在不知不觉中，也把她未婚夫的钱包给煮了。","kind":"text"},{"t":82.99,"en":"Imagine their dismay when they found a beautifully-cooked wallet and notes turned to ash!","zh":"想象一下当他们发现一个“烹调精美”的钱包和变成灰烬的钞票时，他们的沮丧！","kind":"text"},{"t":91.09,"en":"John went to see his bank manager who sent the remains of wallet and the money","zh":"约翰去见了银行经理，经理把钱包和钱的残余部分","kind":"text"},{"t":96.68,"en":"to the special department of the Bank of England in Newcastle: the Mutilated Ladies!","zh":"送到了英格兰银行在纽卡斯尔的特别部门：残钞处理小组！","kind":"text"},{"t":102.82,"en":"They examined the remains and John got all his money back.","zh":"他们检查了残余物，约翰拿回了他所有的钱。","kind":"text"},{"t":108.33,"en":"'So long as there's something to identify, we will give people their money back,' said a spokeswoman for the Bank.","zh":"“只要有可识别的部分，我们就会把钱还给人们，”银行的一位女发言人说。","kind":"text"},{"t":116.56,"en":"'Last year, we paid ￡1.5 million on 21,000 claims.'","zh":"“去年，我们为21000份索赔支付了150万英镑。”","kind":"text"}]},{"id":"NCE3-08","book":"NCE3","bookCn":"第三册","num":8,"title":"A Famous Monastery","slug":"08.A Famous Monastery","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/08.A%20Famous%20Monastery.mp3","sentenceCount":24,"wordCount":250,"lines":[{"t":0.54,"en":"Lesson 8","zh":"第8课","kind":"lesson"},{"t":2.15,"en":"A famous monastery","zh":"一座著名的修道院","kind":"title"},{"t":9.49,"en":"What are the St.Bernard dogs used for?","zh":"圣伯纳狗是用来做什么的？","kind":"question"},{"t":15.03,"en":"The Great St.Bernard Pass connects Switzerland to Italy.","zh":"大圣伯纳山口连接着瑞士和意大利。","kind":"text"},{"t":20.49,"en":"At 2,473 metres, it is the highest mountain pass in Europe.","zh":"它海拔2473米，是欧洲最高的山口。","kind":"text"},{"t":28.15,"en":"The famous monastery of St.Bernard,","zh":"著名的圣伯纳修道院，","kind":"text"},{"t":31.71,"en":"which was founded in the eleventh century, lies about a mile away.","zh":"建立于11世纪，距此约一英里。","kind":"text"},{"t":36.95,"en":"For hundreds of years, St.Bernard dogs have saved the lives of travellers crossing the dangerous Pass.","zh":"数百年来，圣伯纳狗一直在拯救穿越这个危险山口的旅行者的生命。","kind":"text"},{"t":44.64,"en":"These friendly dogs, which were first brought from Asia,","zh":"这些友善的狗，最初从亚洲引进，","kind":"text"},{"t":49.2,"en":"were used as watchdogs even in Roman times.","zh":"甚至在罗马时代就被用作看门狗。","kind":"text"},{"t":53.39,"en":"Now that a tunnel has been built through the mountains, the Pass is less dangerous,","zh":"如今，随着一条穿山隧道的建成，这个山口不再那么危险了，","kind":"text"},{"t":58.92,"en":"but each year, the dogs are still sent out into the snow whenever a traveller is in difficulty.","zh":"但是每年，只要有旅行者遇到困难，这些狗仍然会被派出去在雪地里搜救。","kind":"text"},{"t":66.32,"en":"Despite the new tunnel,","zh":"尽管有了新隧道，","kind":"text"},{"t":67.93,"en":"there are still a few people who rashly attempt to cross the Pass on foot.","zh":"仍然有一些人冒险徒步穿越山口。","kind":"text"},{"t":74.69,"en":"During the summer months, the monastery is very busy,","zh":"在夏季，修道院非常繁忙，","kind":"text"},{"t":78.3,"en":"for it is visited by thousands of people who cross the Pass in cars.","zh":"因为成千上万驾车穿越山口的人会来这里参观。","kind":"text"},{"t":84.01,"en":"As there are so many people about, the dogs have to be kept in a special enclosure.","zh":"由于人太多，狗必须被关在一个特殊的围栏里。","kind":"text"},{"t":90.32,"en":"In winter, however, life at the monastery is quite different.","zh":"然而，在冬天，修道院的生活则截然不同。","kind":"text"},{"t":95.72,"en":"The temperature drops to -30 degrees,","zh":"气温降至零下30度，","kind":"text"},{"t":98.73,"en":"and very few people attempt to cross the Pass.","zh":"很少有人尝试穿越山口。","kind":"text"},{"t":102.74,"en":"The monks prefer winter to summer for they have more privacy.","zh":"僧侣们更喜欢冬天而不是夏天，因为他们有更多的隐私。","kind":"text"},{"t":107.68,"en":"The dogs have greater freedom, too,","zh":"狗也有更大的自由，","kind":"text"},{"t":110.39,"en":"for they are allowed to wander outside their enclosure.","zh":"因为它们被允许在围栏外自由漫步。","kind":"text"},{"t":113.92,"en":"The only regular visitors to the monastery in winter are parties of skiers who go there at Christmas and Easter.","zh":"冬季修道院唯一的常客是圣诞节和复活节前往那里的滑雪者们。","kind":"text"},{"t":122.36,"en":"These young people,","zh":"这些年轻人，","kind":"text"},{"t":124.34,"en":"who love the peace of the mountains,","zh":"热爱山间的宁静，","kind":"text"},{"t":126.56,"en":"always receive a warm welcome at St.Bernard's monastery.","zh":"总能在圣伯纳修道院受到热烈的欢迎。","kind":"text"}]},{"id":"NCE3-09","book":"NCE3","bookCn":"第三册","num":9,"title":"Flying Cats","slug":"09.Flying Cats","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/09.Flying%20Cats.mp3","sentenceCount":20,"wordCount":247,"lines":[{"t":0.7,"en":"Lesson 9","zh":"第9课","kind":"lesson"},{"t":2.62,"en":"Flying cats","zh":"会飞的猫","kind":"title"},{"t":10.02,"en":"How do cats try to protect themselves when falling from great heights?","zh":"猫从高处跌落时如何保护自己？","kind":"question"},{"t":17.34,"en":"Cats never fail to fascinate human beings.","zh":"猫总是能吸引人类。","kind":"text"},{"t":21.77,"en":"They can be friendly and affectionate towards humans, but they lead mysterious lives of their own as well.","zh":"它们可以对人类友好和亲热，但它们也有自己的神秘生活。","kind":"text"},{"t":29.47,"en":"They never become submissive like dogs and horses.","zh":"它们从不像狗和马那样变得顺从。","kind":"text"},{"t":33.63,"en":"As a result, humans have learned to respect feline independence.","zh":"结果，人类学会了尊重猫的独立性。","kind":"text"},{"t":39.36,"en":"Most cats remain suspicious of humans all their lives.","zh":"大多数猫一生都对人类保持警惕。","kind":"text"},{"t":43.91,"en":"One of the things that fascinates us most about cats is the popular belief that they have nine lives.","zh":"关于猫最吸引我们的一点是，人们普遍认为它们有九条命。","kind":"text"},{"t":51.86,"en":"Apparently, there is a good deal of truth in this idea.","zh":"显然，这种说法有相当多的真实性。","kind":"text"},{"t":57.69,"en":"A cat's ability to survive falls is based on fact.","zh":"猫从高处跌落后幸存的能力是有事实依据的。","kind":"text"},{"t":63.18,"en":"Recently the New York Animal Medical Centre made a study of 132 cats over a period of five months.","zh":"最近，纽约动物医疗中心对132只猫进行了为期五个月的研究。","kind":"text"},{"t":73.0,"en":"All these cats had one experience in common: they had fallen off high buildings,","zh":"所有这些猫都有一个共同的经历：它们都从高楼上跌落过，","kind":"text"},{"t":77.88,"en":"yet only eight of them died from shock or injuries.","zh":"然而只有八只死于休克或受伤。","kind":"text"},{"t":84.07,"en":"Of course, New York is the ideal place for such an interesting study, because there is no shortage of tall buildings.","zh":"当然，纽约是进行这项有趣研究的理想地点，因为那里不缺少高楼大厦。","kind":"text"},{"t":93.79,"en":"There are plenty of high-rise windowsills to fall from!","zh":"有很多高层窗台可供跌落！","kind":"text"},{"t":98.48,"en":"One cat, Sabrina, fell 32 storeys, yet only suffered from a broken tooth.","zh":"一只名叫萨布丽娜的猫从32层楼高的地方摔下，却只受了牙齿折断的伤。","kind":"text"},{"t":106.89,"en":"'Cats behave like well-trained paratroopers,' a doctor said.","zh":"“猫的行为就像训练有素的伞兵，”一位医生说。","kind":"text"},{"t":112.15,"en":"It seems that the further cats fall, the less they are likely to injure themselves.","zh":"猫似乎跌落得越远，受伤的可能性就越小。","kind":"text"},{"t":119.16,"en":"In a long drop, they reach speeds of 60 miles an hour and more.","zh":"在长距离跌落中，它们的速度可达每小时60英里甚至更高。","kind":"text"},{"t":125.01,"en":"At high speeds, falling cats have time to relax.","zh":"在高速跌落时，猫有时间放松。","kind":"text"},{"t":129.23,"en":"They stretch out their legs like flying squirrels.","zh":"它们像飞鼠一样伸展四肢。","kind":"text"},{"t":133.69,"en":"This increases their air-resistance and reduces the shock of impact when they hit the ground.","zh":"这增加了它们的空气阻力，并减少了它们撞击地面时的冲击。","kind":"text"}]},{"id":"NCE3-10","book":"NCE3","bookCn":"第三册","num":10,"title":"The Loss of the Titanic","slug":"10.The Loss of the Titanic","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/10.The%20Loss%20of%20the%20Titanic.mp3","sentenceCount":17,"wordCount":258,"lines":[{"t":1.14,"en":"Lesson 10","zh":"第10课","kind":"lesson"},{"t":2.92,"en":"The loss of the Titanic","zh":"泰坦尼克号的沉没","kind":"title"},{"t":10.52,"en":"What'd have happened if only two of the 16 water-tight compartments had been flooded?","zh":"如果16个水密舱室中只有两个被淹没，会发生什么？","kind":"question"},{"t":19.25,"en":"The great ship, Titanic sailed for New York from Southampton on April 10th, 1912.","zh":"1912年4月10日，巨轮“泰坦尼克号”从南安普顿启程驶往纽约。","kind":"text"},{"t":27.22,"en":"She was carrying 1, 316 passengers and a crew of 891.","zh":"船上载有1316名乘客和891名船员。","kind":"text"},{"t":35.33,"en":"Even by modern standards, the 46, 000 ton Titanic was a colossal ship.","zh":"即使按现代标准来看，46000吨的泰坦尼克号也是一艘巨轮。","kind":"text"},{"t":42.72,"en":"At that time, however, she was not only the largest ship that had ever been built, but was regarded as unsinkable, for she had sixteen water-tight compartments.","zh":"然而，在那个时代，她不仅是当时建造过的最大的船只，而且被认为是永不沉没的，因为她有十六个水密舱室。","kind":"text"},{"t":55.71,"en":"Even if two of these were flooded, she would still be able to float.","zh":"即使其中两个舱室被水淹没，她仍然能够漂浮。","kind":"text"},{"t":60.83,"en":"The tragic sinking of this great liner will always be remembered, for she went down on her first voyage with heavy loss of life.","zh":"这艘巨型邮轮的悲剧性沉没将永远被铭记，因为她在首次航行中就沉没了，造成了大量人员伤亡。","kind":"text"},{"t":71.82,"en":"Four days after setting out, while the Titanic was sailing across the icy waters of the North Atlantic,","zh":"启程四天后，当泰坦尼克号航行在北大西洋冰冷的海域时，","kind":"text"},{"t":79.22,"en":"a huge iceberg was suddenly spotted by a lookout.","zh":"一名瞭望员突然发现了一座巨大的冰山。","kind":"text"},{"t":83.88,"en":"After the alarm had been given, the great ship turned sharply to avoid a direct collision.","zh":"警报发出后，这艘巨轮急剧转向，以避免直接碰撞。","kind":"text"},{"t":91.18,"en":"The Titanic turned just in time, narrowly missing the immense wall of ice which rose over 100 feet out of the water beside her.","zh":"泰坦尼克号及时转向，险些错过了她旁边那堵高出水面100多英尺的巨大冰墙。","kind":"text"},{"t":102.6,"en":"Suddenly, there was a slight trembling sound from below,","zh":"突然，从下方传来一阵轻微的颤抖声，","kind":"text"},{"t":107.57,"en":"and the captain went down to see what had happened.","zh":"船长下去查看发生了什么。","kind":"text"},{"t":111.73,"en":"The noise had been so faint that no one thought that the ship had been damaged.","zh":"声音如此微弱，以至于没有人认为船只受到了损坏。","kind":"text"},{"t":117.36,"en":"Below, the captain realized to his horror that the Titanic was sinking rapidly,","zh":"在下方，船长惊恐地意识到泰坦尼克号正在迅速下沉，","kind":"text"},{"t":123.98,"en":"for five of her sixteen watertight compartments had already been flooded!","zh":"因为她16个水密舱室中的5个已经进水了！","kind":"text"},{"t":130.0,"en":"The order to abandon ship was given and hundreds of people plunged into the icy water.","zh":"弃船命令下达，数百人跳入冰冷的水中。","kind":"text"},{"t":137.23,"en":"As there were not enough life-boats for everybody, 1, 500 lives were lost.","zh":"由于救生艇不足，有1500人丧生。","kind":"text"}]},{"id":"NCE3-11","book":"NCE3","bookCn":"第三册","num":11,"title":"Not Guilty","slug":"11.Not Guilty","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/11.Not%20Guilty.mp3","sentenceCount":27,"wordCount":271,"lines":[{"t":0.44,"en":"Lesson 11","zh":"第11课","kind":"lesson"},{"t":2.11,"en":"Not guilty","zh":"无罪","kind":"title"},{"t":8.86,"en":"What was the Customs Officer looking for?","zh":"海关官员在找什么？","kind":"question"},{"t":13.22,"en":"Customs Officers are quite tolerant these days, but they can still stop you when you are going through the Green Channel and have nothing to declare.","zh":"如今海关官员相当宽容，但当你走绿色通道并且没有东西要申报时，他们仍然可以拦住你。","kind":"text"},{"t":23.0,"en":"Even really honest people are often made to feel guilty.","zh":"即使是非常诚实的人也常常会感到内疚。","kind":"text"},{"t":27.47,"en":"The hardened professional smuggler, on the other hand, is never troubled by such feelings,","zh":"另一方面，那些老练的职业走私犯从不会被这种感觉所困扰，","kind":"text"},{"t":33.67,"en":"even if he has five hundred gold watches hidden in his suitcase.","zh":"即使他的手提箱里藏着五百块金表。","kind":"text"},{"t":38.97,"en":"When I returned from abroad recently, a particularly officious young Customs Officer","zh":"最近我从国外回来时，一位特别爱管闲事的年轻海关官员","kind":"text"},{"t":44.92,"en":"clearly regarded me as a smuggler.","zh":"显然把我当成了走私犯。","kind":"text"},{"t":48.39,"en":"'Have you anything to declare?' he asked, looking me in the eye.","zh":"“你有什么要申报的吗？”他直视着我的眼睛问道。","kind":"text"},{"t":54.07,"en":"'No,' I answered confidently.","zh":"“没有，”我自信地回答道。","kind":"text"},{"t":57.61,"en":"'Would you mind unlocking this suitcase please? '","zh":"“请您打开这个手提箱好吗？”","kind":"text"},{"t":61.55,"en":"'Not at all,' I answered.","zh":"“当然可以，”我回答道。","kind":"text"},{"t":63.97,"en":"The Officer went through the case with great care.","zh":"那个官员非常仔细地检查了箱子。","kind":"text"},{"t":67.71,"en":"All the things I had packed so carefully were soon in a dreadful mess.","zh":"我费尽心思整理好的所有东西很快就乱七八糟了。","kind":"text"},{"t":73.57,"en":"I felt sure I would never be able to close the case again.","zh":"我确信我再也无法把箱子合上了。","kind":"text"},{"t":78.27,"en":"Suddenly, I saw the Officer's face light up.","zh":"突然，我看到那个官员的脸上露出了喜色。","kind":"text"},{"t":82.34,"en":"He had spotted a tiny bottle at the bottom of my case","zh":"他发现了一个小瓶子在我的箱子底部","kind":"text"},{"t":86.25,"en":"and he pounced on it with delight.","zh":"他欣喜若狂地扑了上去。","kind":"text"},{"t":89.35,"en":"'Perfume, eh?' he asked sarcastically.","zh":"“香水，嗯？”他挖苦地问道。","kind":"text"},{"t":94.68,"en":"'You should have declared that.","zh":"“你应该申报那个。","kind":"text"},{"t":96.66,"en":"Perfume is not exempt from import duty. '","zh":"香水不免除进口关税。”","kind":"text"},{"t":101.38,"en":"'But it isn't perfume, I said. 'It's hair gel. '","zh":"“但它不是香水，”我说，“它是发胶。”","kind":"text"},{"t":106.96,"en":"Then I added with a smile,","zh":"然后我笑着补充道，","kind":"text"},{"t":109.55,"en":"'It's a strange mixture I make myself.","zh":"“这是我自己调制的一种奇怪的混合物。”","kind":"text"},{"t":113.36,"en":"As I expected, he did not believe me.","zh":"如我所料，他没有相信我。","kind":"text"},{"t":117.25,"en":"'Try it!' I said encouragingly.","zh":"“尝尝看！”我鼓励地说。","kind":"text"},{"t":120.96,"en":"The Officer unscrewed the cap and put the bottle to his nostrils.","zh":"那个官员拧开瓶盖，把瓶子凑到鼻孔前。","kind":"text"},{"t":125.46,"en":"He was greeted by an unpleasant smell which convinced him that I was telling the truth.","zh":"一股难闻的气味扑鼻而来，这让他相信我说的是实话。","kind":"text"},{"t":131.96,"en":"A few minutes later, I was able to hurry away with precious chalk marks on my baggage.","zh":"几分钟后，我带着行李上珍贵的粉笔标记，匆匆离开了。","kind":"text"}]},{"id":"NCE3-12","book":"NCE3","bookCn":"第三册","num":12,"title":"Life on a Desert Island","slug":"12.Life on a Desert Island","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/12.Life%20on%20a%20Desert%20Island.mp3","sentenceCount":17,"wordCount":258,"lines":[{"t":0.49,"en":"Lesson 12","zh":"第12课","kind":"lesson"},{"t":2.27,"en":"Life on a desert island","zh":"荒岛生活","kind":"title"},{"t":9.61,"en":"What was exceptional about the two men's stay on the desert island?","zh":"那两个人留在荒岛上有什么特别之处？","kind":"question"},{"t":16.24,"en":"Most of us have formed an unrealistic picture of life on a desert island.","zh":"我们大多数人对荒岛生活形成了一种不切实际的想象。","kind":"text"},{"t":22.19,"en":"We sometimes imagine a desert island to be a sort of paradise where the sun always shines.","zh":"我们有时把荒岛想象成一个阳光普照的天堂。","kind":"text"},{"t":29.85,"en":"Life there is simple and good.","zh":"那里的生活简单而美好。","kind":"text"},{"t":32.44,"en":"Ripe fruit falls from the trees and you never have to work.","zh":"成熟的果实从树上掉下来，你根本不用劳动。","kind":"text"},{"t":37.52,"en":"The other side of the picture is quite the opposite.","zh":"而另一方面的情况却恰恰相反。","kind":"text"},{"t":41.16,"en":"Life on a desert island is wretched.","zh":"荒岛上的生活是悲惨的。","kind":"text"},{"t":43.94,"en":"You either starve to death or live like Robinson Crusoe, waiting for a boat which never comes.","zh":"你不是饿死，就是像鲁滨逊漂流记一样，苦等一艘永不来临的船。","kind":"text"},{"t":52.49,"en":"Perhaps there is an element of truth in both these pictures, but few of us have had the opportunity to find out.","zh":"也许这两种景象都有点真实性，但我们很少有人有机会去证实。","kind":"text"},{"t":60.81,"en":"Two men who recently spent five days on a coral island wished they had stayed there longer.","zh":"最近，有两个人在一个珊瑚岛上待了五天，他们真希望能在那里待得更久。","kind":"text"},{"t":69.25,"en":"They were taking a badly damaged boat from the Virgin Islands to Miami to have it repaired.","zh":"他们正驾驶一艘严重受损的船从维尔京群岛前往迈阿密修理。","kind":"text"},{"t":75.85,"en":"During the journey, their boat began to sink.","zh":"旅途中，他们的船开始下沉。","kind":"text"},{"t":80.15,"en":"They quickly loaded a small rubber dinghy with food, matches, and cans of beer and rowed for a few miles across the Caribbean until they arrived at a tiny coral island.","zh":"他们迅速将食物、火柴和几罐啤酒装上一艘小橡皮艇，划行了几英里穿过加勒比海，直到抵达一个微小的珊瑚岛。","kind":"text"},{"t":93.63,"en":"There were hardly any trees on the island and there was no water, but this did not prove to be a problem.","zh":"岛上几乎没有树木，也没有水，但这并没有成为一个问题。","kind":"text"},{"t":101.52,"en":"The men collected rainwater in the rubber dinghy.","zh":"两人用橡皮艇收集雨水。","kind":"text"},{"t":105.28,"en":"As they had brought a spear gun with them, they had plenty to eat.","zh":"由于他们带了一支鱼枪，所以食物很充足。","kind":"text"},{"t":109.56,"en":"They caught lobster and fish every day, and as one of them put it 'ate like kings'.","zh":"他们每天都捕捞龙虾和鱼，正如其中一人所说，他们“吃得像国王一样”。","kind":"text"},{"t":117.2,"en":"When a passing tanker rescued them five days later, both men were genuinely sorry that they had to leave.","zh":"五天后，当一艘过往的油轮救起他们时，两人都真诚地感到遗憾，因为他们不得不离开。","kind":"text"}]},{"id":"NCE3-13","book":"NCE3","bookCn":"第三册","num":13,"title":"It's Only Me","slug":"13.It's Only Me","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/13.It%27s%20Only%20Me.mp3","sentenceCount":17,"wordCount":252,"lines":[{"t":0.63,"en":"Lesson 13","zh":"第13课","kind":"lesson"},{"t":2.84,"en":"'It's only me'","zh":"“是我呀”","kind":"title"},{"t":10.87,"en":"What did the man expect to find under the stairs?","zh":"那个男人期望在楼梯下找到什么？","kind":"question"},{"t":16.42,"en":"After her husband had gone to work, Mrs. Richards sent her children to school and went upstairs to her bedroom.","zh":"丈夫去上班后，理查兹夫人把孩子们送去学校，然后上楼到卧室。","kind":"text"},{"t":24.96,"en":"She was too excited to do any housework that morning, for in the evening she would be going to a fancy-dress party with her husband.","zh":"那个上午她兴奋得顾不上做家务，因为晚上她要和丈夫一起去参加一个化装舞会。","kind":"text"},{"t":34.89,"en":"She intended to dress up as a ghost and as she had made her costume the night before, she was impatient to try it on.","zh":"她打算打扮成一个鬼魂。由于头天晚上她已做好了化装服，所以她迫不及待地想试穿一下。","kind":"text"},{"t":44.23,"en":"Though the costume consisted only of a sheet, it was very effective.","zh":"尽管化装服只是一块床单，但效果却非常好。","kind":"text"},{"t":49.62,"en":"After putting it on, Mrs. Richards went downstairs.","zh":"穿上衣服后，理查兹夫人下了楼。","kind":"text"},{"t":53.93,"en":"She wanted to find out whether it would be comfortable to wear.","zh":"她想看看穿上是否舒服。","kind":"text"},{"t":58.27,"en":"Just as Mrs. Richards was entering the dining-room, there was a knock on the front door.","zh":"理查兹夫人刚走进饭厅，前门就传来了敲门声。","kind":"text"},{"t":64.84,"en":"She knew that it must be the baker.","zh":"她知道肯定是面包师。","kind":"text"},{"t":67.48,"en":"She had told him to come straight in if ever she failed to open the door and to leave the bread on the kitchen table.","zh":"她曾告诉他，如果她没有开门，他就直接进来，把面包放在厨房的桌子上。","kind":"text"},{"t":74.42,"en":"Not wanting to frighten the poor man, Mrs. Richards quickly hid in the small storeroom under the stairs.","zh":"理查兹夫人不想吓着那个可怜的人，便迅速躲到了楼梯下的小储藏室里。","kind":"text"},{"t":82.13,"en":"She heard the front door open and heavy footsteps in the hall.","zh":"她听到前门打开了，走廊里传来沉重的脚步声。","kind":"text"},{"t":87.05,"en":"Suddenly the door of the storeroom was opened and a man entered.","zh":"突然，储藏室的门开了，一个男人走了进来。","kind":"text"},{"t":91.48,"en":"Mrs. Richards realized that it must be the man from the Electricity Board who had come to read the metre.","zh":"理查兹夫人意识到这一定是电力公司的抄表员。","kind":"text"},{"t":98.78,"en":"She tried to explain the situation, saying","zh":"她试图解释情况，说道：","kind":"text"},{"t":102.15,"en":"'It's only me', but it was too late.","zh":"“是我呀”，但为时已晚。","kind":"text"},{"t":106.49,"en":"The man let out a cry and jumped back several paces.","zh":"那个男人大叫一声，后退了几步。","kind":"text"},{"t":111.82,"en":"When Mrs. Richards walked towards him, he fled, slamming the door behind him.","zh":"当理查兹夫人走向他时，他逃走了，并在身后砰地关上了门。","kind":"text"}]},{"id":"NCE3-14","book":"NCE3","bookCn":"第三册","num":14,"title":"A Noble Gangster","slug":"14.A Noble Gangster","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/14.A%20Noble%20Gangster.mp3","sentenceCount":11,"wordCount":249,"lines":[{"t":0.48,"en":"Lesson 14","zh":"第14课","kind":"lesson"},{"t":2.45,"en":"A noble gangster","zh":"一位“高尚的”歹徒","kind":"title"},{"t":9.81,"en":"How did Hawkwood make money in times of peace?","zh":"霍克伍德在和平时期是怎样赚钱的？","kind":"question"},{"t":15.2,"en":"There was a time when the owners of shops and businesses in Chicago had to pay large sums of money to gangsters in return for 'protection'.","zh":"过去，芝加哥的店主和商人们不得不向歹徒支付大笔金钱，以换取“保护”。","kind":"text"},{"t":26.33,"en":"If the money was not paid promptly, the gangsters would quickly put a man out of business by destroying his shop.","zh":"如果不及时付款，歹徒就会捣毁店主的店铺，使其很快破产。","kind":"text"},{"t":35.46,"en":"Obtaining 'protection money' is not a modern crime.","zh":"敲诈“保护费”并非是现代社会的罪行。","kind":"text"},{"t":39.67,"en":"As long ago as the fourteenth century, an Englishman, Sir John Hawkwood, made the remarkable discovery that people would rather pay large sums of money than have their life work destroyed by gangsters.","zh":"远在14世纪，英国人约翰·霍克伍德爵士就有了惊人的发现，人们情愿支付大笔金钱，也不愿自己的毕生心血毁于歹徒之手。","kind":"text"},{"t":56.51,"en":"Six hundred years ago, Sir John Hawkwood arrived in Italy with a band of soldiers and settled near Florence.","zh":"600年前，约翰·霍克伍德爵士率领一队士兵抵达意大利，在佛罗伦萨附近定居下来。","kind":"text"},{"t":65.36,"en":"He soon made a name for himself and came to be known to the Italians as Giovanni Acuto.","zh":"他很快就出了名，意大利人称他为乔瓦尼·阿库托。","kind":"text"},{"t":73.45,"en":"Whenever the Italian city-states were at war with each other, Hawkwood used to hire his soldiers to princes who were willing to pay the high price he demanded.","zh":"无论意大利城邦之间何时交战，霍克伍德总是将他的士兵雇佣给那些愿意支付他所要求的高价的君主。","kind":"text"},{"t":85.4,"en":"In times of peace, when business was bad, Hawkwood and his men would march into a city-state, and after burning down a few farms, would offer to go away if protection money was paid to them.","zh":"在和平时期，当生意不好时，霍克伍德和他的手下就会开进一个城邦，烧毁几座农场后，提出如果向他们支付保护费，他们就离开。","kind":"text"},{"t":100.29,"en":"Hawkwood made large sums of money in this way.","zh":"霍克伍德就是这样赚取了大笔金钱。","kind":"text"},{"t":104.35,"en":"In spite of this, the Italians regarded him as a sort of hero.","zh":"尽管如此，意大利人还是把他看作一个英雄。","kind":"text"},{"t":109.86,"en":"When he died at the age of eighty, the Florentines gave him a state funeral and had a picture painted which was dedicated to the memory of 'the most valiant soldier and most notable leader, Signor Giovanni Haukodue'.","zh":"他80岁去世时，佛罗伦萨人为他举行了国葬，并绘制了一幅纪念他的画像，画像上写着：“最英勇的士兵和最杰出的领袖，乔瓦尼·霍克伍德先生”。","kind":"text"}]},{"id":"NCE3-15","book":"NCE3","bookCn":"第三册","num":15,"title":"Fifty Pence Worth of Trouble","slug":"15.Fifty Pence Worth of Trouble","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/15.Fifty%20Pence%20Worth%20of%20Trouble.mp3","sentenceCount":17,"wordCount":267,"lines":[{"t":0.44,"en":"Lesson 15","zh":"第15课","kind":"lesson"},{"t":2.65,"en":"Fifty pence worth of trouble","zh":"五十便士的麻烦","kind":"title"},{"t":10.16,"en":"Did George ge
