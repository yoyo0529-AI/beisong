wordCount":371,"lines":[{"t":0.13,"en":"Lesson 36","zh":"第36课","kind":"lesson"},{"t":2.12,"en":"A chance in a million","zh":"百万分之一的机遇","kind":"title"},{"t":9.59,"en":"What was the chance in a million?","zh":"这百万分之一的机遇是什么呢？","kind":"question"},{"t":13.45,"en":"We are less credulous than we used to be.","zh":"我们不像以前那样轻信了。","kind":"text"},{"t":17.13,"en":"In the nineteenth century, a novelist would bring his story to a conclusion","zh":"在19世纪，小说家在故事的结尾","kind":"text"},{"t":22.6,"en":"by presenting his readers with a series of coincidences--most of them wildly improbable.","zh":"会给读者安排一连串的巧合——其中大部分都是极不可能发生的。","kind":"text"},{"t":30.29,"en":"Readers happily accepted the fact that an obscure maidservant was really the hero's mother.","zh":"读者们欣然接受一个默默无闻的女仆竟然是主人公的母亲这一事实。","kind":"text"},{"t":37.78,"en":"A long-lost brother, who was presumed dead, was really alive all the time","zh":"一个被认为已死去的失散多年的兄弟，实际上一直活着，","kind":"text"},{"t":44.07,"en":"and wickedly plotting to bring about the hero's downfall. And so on.","zh":"并且阴险地策划着让主人公垮台。诸如此类。","kind":"text"},{"t":50.02,"en":"Modern readers would find such naive solutions totally unacceptable.","zh":"现代读者会觉得这种天真的结局完全不能接受。","kind":"text"},{"t":56.13,"en":"Yet, in real life, circumstances do sometimes conspire to bring about coincidences which anyone but a nineteenth century novelist would find incredible.","zh":"然而，在现实生活中，情况有时确实会凑巧地导致巧合的发生，除了19世纪的小说家，其他任何人都觉得不可思议。","kind":"text"},{"t":69.39,"en":"When I was a boy, my grandfather told me how a German taxi driver, Franz Bussman,","zh":"我小时候，祖父给我讲了一个德国出租车司机弗朗兹·布斯曼的故事，","kind":"text"},{"t":76.37,"en":"found a brother who was thought to have been killed twenty years before.","zh":"他找到了一个被认为在20年前阵亡的兄弟。","kind":"text"},{"t":81.39,"en":"While on a walking tour with his wife, he stopped to talk to a workman.","zh":"在和妻子徒步旅行时，他停下来和一名工人交谈。","kind":"text"},{"t":87.1,"en":"After they had gone on, Mrs. Bussman commented on the workman's close resemblance to her husband","zh":"他们继续前行后，布斯曼夫人评论说那个工人长得很像她丈夫，","kind":"text"},{"t":94.34,"en":"and even suggested that he might be his brother.","zh":"甚至猜测他可能是她丈夫的兄弟。","kind":"text"},{"t":98.71,"en":"Franz poured scorn on the idea,","zh":"弗朗兹对这个想法嗤之以鼻，","kind":"text"},{"t":102.09,"en":"pointing out that his brother had been killed in action during the war.","zh":"指出他兄弟在战争中阵亡了。","kind":"text"},{"t":107.35,"en":"Though Mrs. Bussman was fully acquainted with this story,","zh":"尽管布斯曼夫人完全了解这个故事，","kind":"text"},{"t":111.7,"en":"she thought that there was a chance in a million that she might be right.","zh":"她觉得她有可能说对了，尽管几率是百万分之一。","kind":"text"},{"t":117.09,"en":"A few days later, she sent a boy to the workman to ask him if his name was Hans Bussman.","zh":"几天后，她派了一个男孩去问那个工人，他是否叫汉斯·布斯曼。","kind":"text"},{"t":125.01,"en":"Needless to say, the man's name was Hans Bussman and he really was Franz's long-lost brother.","zh":"不用说，那个人的名字就是汉斯·布斯曼，他确实是弗朗兹失散多年的兄弟。","kind":"text"},{"t":133.94,"en":"When the brothers were reunited,","zh":"兄弟俩团聚后，","kind":"text"},{"t":136.2,"en":"Hans explained how it was that he was still alive.","zh":"汉斯解释了他为什么还活着。","kind":"text"},{"t":140.36,"en":"After having been wounded towards the end of the war,","zh":"在战争快结束时受伤后，","kind":"text"},{"t":144.73,"en":"he had been sent to hospital and was separated from his unit.","zh":"他被送往医院，与部队失散了。","kind":"text"},{"t":149.84,"en":"The hospital had been bombed and Hans had made his way back into Western Germany on foot.","zh":"医院被轰炸了，汉斯徒步回到了西德。","kind":"text"},{"t":157.64,"en":"Meanwhile, his unit was lost and all records of him had been destroyed.","zh":"同时，他的部队失散了，所有关于他的记录都被销毁了。","kind":"text"},{"t":163.74,"en":"Hans returned to his family home, but the house had been bombed","zh":"汉斯回到了他的老家，但是房子被炸毁了，","kind":"text"},{"t":168.37,"en":"and no one in the neighbourhood knew what had become of the inhabitants.","zh":"邻居们也不知道住户们怎么样了。","kind":"text"},{"t":173.03,"en":"Assuming that his family had been killed during an air raid,","zh":"以为他的家人在空袭中丧生，","kind":"text"},{"t":177.0,"en":"Hans settled down in a village fifty miles away where he had remained ever since.","zh":"汉斯在一个五十英里外的小村庄安顿下来，自此一直住在那里。","kind":"text"}]},{"id":"NCE3-37","book":"NCE3","bookCn":"第三册","num":37,"title":"The Westhaven Express","slug":"37.The Westhaven Express","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/37.The%20Westhaven%20Express.mp3","sentenceCount":25,"wordCount":362,"lines":[{"t":0.22,"en":"Lesson 37","zh":"第37课","kind":"lesson"},{"t":2.1,"en":"The Westhaven Express","zh":"韦斯特黑文特快","kind":"title"},{"t":8.86,"en":"What was the mistake the author made?","zh":"作者犯了什么错误？","kind":"question"},{"t":14.04,"en":"We have learnt to expect that trains will be punctual.","zh":"我们已经习惯了认为火车是准时的。","kind":"text"},{"t":18.46,"en":"After years of conditioning, most of us have developed an unshakable faith in railway timetables.","zh":"经过多年的条件反射，我们大多数人对火车时刻表都产生了不可动摇的信任。","kind":"text"},{"t":26.14,"en":"Ships may be delayed by storms;","zh":"船只可能因风暴而延误；","kind":"text"},{"t":28.93,"en":"flights may be cancelled because of bad weather; but trains must be on time.","zh":"航班可能因恶劣天气而取消；但火车必须准时。","kind":"text"},{"t":35.9,"en":"Only an exceptionally heavy snow fall might temporarily dislocate railway services.","zh":"只有异常大的降雪才可能暂时打乱铁路服务。","kind":"text"},{"t":43.33,"en":"It is all too easy to blame the railway authorities when something does go wrong.","zh":"当事情出错时，责备铁路当局实在是太容易了。","kind":"text"},{"t":49.57,"en":"The truth is that when mistakes occur, they are more likely to be ours than theirs.","zh":"事实是，当错误发生时，它们更有可能是我们的，而不是他们的。","kind":"text"},{"t":56.76,"en":"After consulting my railway timetable, I noted with satisfaction that there was an express train to Westhaven.","zh":"查阅了我的火车时刻表后，我满意地注意到有一趟开往韦斯特黑文的特快列车。","kind":"text"},{"t":66.0,"en":"It went direct from my local station and the journey lasted a mere hour and seventeen minutes.","zh":"它直接从我当地的车站出发，行程仅需一小时十七分钟。","kind":"text"},{"t":73.55,"en":"When I boarded the train, I could not help noticing that a great many local people got on as well.","zh":"当我登上火车时，我不禁注意到许多当地人也上车了。","kind":"text"},{"t":81.11,"en":"At the time, this did not strike me as odd.","zh":"当时，这并没有让我觉得奇怪。","kind":"text"},{"t":84.97,"en":"I reflected that there must be a great many people besides myself who wished to take advantage of this excellent service.","zh":"我想，除了我自己之外，肯定有很多人也希望利用这项优质服务。","kind":"text"},{"t":93.31,"en":"Neither was I surprised when the train stopped at Widley, a tiny station a few miles along the line.","zh":"当火车在离铁路线几英里外的一个小站威德利停靠时，我也没有感到惊讶。","kind":"text"},{"t":101.74,"en":"Even a mighty express train can be held up by signals.","zh":"即使是强大的特快列车也可能被信号灯拦住。","kind":"text"},{"t":105.94,"en":"But when the train dawdled at station after station, I began to wonder.","zh":"但当火车在一个又一个车站磨蹭时，我开始感到疑惑。","kind":"text"},{"t":112.11,"en":"It suddenly dawned on me that this express was not roaring down the line at ninety miles an hour, but barely chugging along at thirty.","zh":"我突然意识到，这趟特快列车并不是以每小时九十英里的速度呼啸而过，而是以每小时三十英里的速度缓慢行驶。","kind":"text"},{"t":122.9,"en":"One hour and seventeen minutes passed and we had not even covered half the distance.","zh":"一小时十七分钟过去了，我们甚至还没有走完一半的路程。","kind":"text"},{"t":129.85,"en":"I asked a passenger if this was the Westhaven Express, but he had not even heard of it.","zh":"我问一位乘客这是否是韦斯特黑文特快，但他甚至没有听说过。","kind":"text"},{"t":136.56,"en":"I determined to lodge a complaint as soon as we arrived.","zh":"我决定一到站就投诉。","kind":"text"},{"t":141.06,"en":"Two hours later, I was talking angrily to the station master at Westhaven.","zh":"两个小时后，我正在韦斯特黑文车站愤怒地与站长交谈。","kind":"text"},{"t":147.3,"en":"When he denied the train's existence, I borrowed his copy of the timetable.","zh":"当他否认这趟火车存在时，我借了他的时刻表。","kind":"text"},{"t":153.44,"en":"There was a note of triumph in my voice when I told him that it was there in black and white.","zh":"当我告诉他白纸黑字写着时，我的声音带着一丝胜利。","kind":"text"},{"t":160.49,"en":"Glancing at it briefly, he told me to look again.","zh":"他简短地瞥了一眼，然后告诉我再看一次。","kind":"text"},{"t":165.15,"en":"A tiny asterisk conducted me to a footnote at the bottom of the page.","zh":"一个小小的星号引导我看到了页面底部的脚注。","kind":"text"},{"t":170.96,"en":"It said: 'This service has been suspended.'","zh":"它写着：“此项服务已暂停。”","kind":"text"}]},{"id":"NCE3-38","book":"NCE3","bookCn":"第三册","num":38,"title":"The First Calendar","slug":"38.The First Calendar","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/38.The%20First%20Calendar.mp3","sentenceCount":21,"wordCount":340,"lines":[{"t":0.31,"en":"Lesson 38","zh":"第38课","kind":"lesson"},{"t":2.23,"en":"The first calendar","zh":"第一个日历","kind":"title"},{"t":9.58,"en":"What is the importance of the dots, lines, and symbols engraved on stone, bones and ivory?","zh":"刻在石头、骨头和象牙上的点、线和符号有什么重要性？","kind":"question"},{"t":20.52,"en":"Future historians will be in a unique position when they come to record the history of our own times.","zh":"未来的历史学家在记录我们这个时代的历史时将处于独特的地位。","kind":"text"},{"t":28.58,"en":"They will hardly know which facts to select from the great mass of evidence that steadily accumulates.","zh":"他们将很难知道从不断积累的大量证据中选择哪些事实。","kind":"text"},{"t":37.07,"en":"What is more, they will not have to rely solely on the written word.","zh":"更重要的是，他们不必仅仅依赖书面文字。","kind":"text"},{"t":42.25,"en":"Films, videos, CDs and CD-ROMs are just some of the bewildering amount of information they will have.","zh":"电影、视频、CD和CD-ROM只是他们将拥有的令人眼花缭乱的信息中的一部分。","kind":"text"},{"t":52.41,"en":"They will be able, as it were, to see and hear us in action.","zh":"他们将能够，可以说，看到和听到我们的行动。","kind":"text"},{"t":58.9,"en":"But the historian attempting to reconstruct the distant past is always faced with a difficult task.","zh":"但是，试图重构遥远过去的历史学家总是面临一项艰巨的任务。","kind":"text"},{"t":67.0,"en":"He has to deduce what he can from the few scanty clues available.","zh":"他必须从仅有的稀少线索中推断出他所能推断的一切。","kind":"text"},{"t":72.61,"en":"Even seemingly insignificant remains can shed interesting light on the history of early man.","zh":"即使看似微不足道的遗迹也能为早期人类的历史提供有趣的线索。","kind":"text"},{"t":80.69,"en":"Up to now, historians have assumed that calendars came into being with the advent of agriculture,","zh":"迄今为止，历史学家一直认为日历是随着农业的出现而产生的，","kind":"text"},{"t":88.67,"en":"for then man was faced with a real need to understand something about the seasons.","zh":"因为那时人类确实需要了解一些关于季节的知识。","kind":"text"},{"t":95.55,"en":"Recent scientific evidence seems to indicate that this assumption is incorrect.","zh":"最近的科学证据似乎表明这个假设是错误的。","kind":"text"},{"t":103.01,"en":"Historians have long been puzzled by dots, lines and symbols which have been engraved on walls, bones, and the ivory tusks of mammoths.","zh":"历史学家长期以来一直对刻在墙壁、骨头和猛犸象牙上的点、线和符号感到困惑。","kind":"text"},{"t":114.98,"en":"The nomads who made these markings lived by hunting and fishing during the last Ice Age which began about 35, 000 B.C. and ended about 10, 000 B.C.","zh":"制造这些标记的游牧民族在最后一次冰河时期（约公元前35,000年开始，约公元前10,000年结束）靠狩猎和捕鱼为生。","kind":"text"},{"t":129.27,"en":"By correlating markings made in various parts of the world,","zh":"通过关联世界各地制作的标记，","kind":"text"},{"t":133.81,"en":"historians have been able to read this difficult code.","zh":"历史学家已经能够解读这个难懂的密码。","kind":"text"},{"t":138.11,"en":"They have found that it is connected with the passage of days and the phases of the moon.","zh":"他们发现它与日子的流逝和月亮的盈亏有关。","kind":"text"},{"t":144.49,"en":"It is, in fact, a primitive type of calendar.","zh":"事实上，这是一种原始的日历。","kind":"text"},{"t":149.25,"en":"It has long been known that the hunting scenes depicted on walls were not simply a form of artistic expression.","zh":"长期以来人们都知道墙壁上描绘的狩猎场景不仅仅是一种艺术表现形式。","kind":"text"},{"t":157.4,"en":"They had a definite meaning, for they were as near as early man could get to writing.","zh":"它们具有明确的含义，因为它们是早期人类最接近书写文字的形式。","kind":"text"},{"t":163.94,"en":"It is possible that there is a definite relation between these paintings and the markings that sometimes accompany them.","zh":"这些绘画与有时伴随它们的标记之间可能存在明确的关系。","kind":"text"},{"t":173.58,"en":"It seems that man was making a real effort to understand the seasons 20, 000 years earlier than has been supposed.","zh":"看来人类早在比人们猜测的20,000年前就在真正努力理解季节了。","kind":"text"}]},{"id":"NCE3-39","book":"NCE3","bookCn":"第三册","num":39,"title":"Nothing to Worry About","slug":"39.Nothing to Worry About","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/39.Nothing%20to%20Worry%20About.mp3","sentenceCount":24,"wordCount":358,"lines":[{"t":0.32,"en":"Lesson 39","zh":"第39课","kind":"lesson"},{"t":2.19,"en":"Nothing to worry about","zh":"无忧无虑","kind":"title"},{"t":10.93,"en":"What was the differnce between Bruce's behaviour and that of other people?","zh":"布鲁斯的行为与其他人的行为有什么不同？","kind":"question"},{"t":18.55,"en":"The rough road across the plain soon became so bad that we tried to get Bruce to drive back to the village we had come from.","zh":"穿过平原的崎岖道路很快变得非常糟糕，以至于我们试图让布鲁斯开车回到我们来时的村庄。","kind":"text"},{"t":28.49,"en":"Even though the road was littered with boulders and pitted with holes, Bruce was not in the least perturbed.","zh":"尽管路面上布满了巨石和坑洞，布鲁斯却丝毫没有感到不安。","kind":"text"},{"t":37.64,"en":"Glancing at his map, he informed us that the next village was a mere twenty miles away.","zh":"他扫了一眼地图，告诉我们下一个村庄只有区区二十英里远。","kind":"text"},{"t":45.62,"en":"It was not that Bruce always underestimated difficulties.","zh":"并不是布鲁斯总是低估困难。","kind":"text"},{"t":49.76,"en":"He simply had no sense of danger at all.","zh":"他根本就没有危险意识。","kind":"text"},{"t":53.87,"en":"No matter what the conditions were, he believed that a car should be driven as fast as it could possibly go.","zh":"无论条件如何，他都认为汽车应该尽可能快地行驶。","kind":"text"},{"t":62.58,"en":"As we bumped over the dusty track, we swerved to avoid large boulders.","zh":"当我们在尘土飞扬的小路上颠簸时，我们猛打方向盘以避开大块巨石。","kind":"text"},{"t":68.47,"en":"The wheels scooped up stones which hammered ominously under the car.","zh":"车轮卷起石子，在车底下发出不祥的敲击声。","kind":"text"},{"t":74.9,"en":"We felt sure that sooner or later a stone would rip a hole in our petrol tank or damage the engine.","zh":"我们确信迟早会有石子把我们的油箱撕开一个洞或者损坏发动机。","kind":"text"},{"t":83.6,"en":"Because of this, we kept looking back, wondering if we were leaving a trail of oil and petrol behind us.","zh":"因此，我们不停地回头看，想知道我们是否在身后留下了一串油迹和汽油。","kind":"text"},{"t":93.22,"en":"What a relief it was when the boulders suddenly disappeared,","zh":"当巨石突然消失时，我们松了一口气，","kind":"text"},{"t":97.45,"en":"giving way to a stretch of plain where the only obstacles were clumps bushes.","zh":"取而代之的是一片平坦的开阔地，那里唯一的障碍物是灌木丛。","kind":"text"},{"t":104.64,"en":"But there was worse to come. Just ahead of us there was a huge fissure.","zh":"但更糟糕的还在后面。就在我们前方，有一道巨大的裂缝。","kind":"text"},{"t":111.8,"en":"In response to renewed pleadings, Bruce stopped.","zh":"布鲁斯响应我们再次的恳求，停了下来。","kind":"text"},{"t":116.77,"en":"Though we all got out to examine the fissure, he remained in the car.","zh":"尽管我们都下车检查裂缝，他却仍然待在车里。","kind":"text"},{"t":122.09,"en":"We informed him that the fissure extended for fifty yards and was two feet wide and four feet deep.","zh":"我们告诉他，那道裂缝绵延五十码，宽两英尺，深四英尺。","kind":"text"},{"t":131.31,"en":"Even this had no effect.","zh":"即使这样也毫无作用。","kind":"text"},{"t":134.88,"en":"Bruce went into a low gear and drove at a terrifying speed,","zh":"布鲁斯挂入低档，以惊人的速度行驶，","kind":"text"},{"t":140.67,"en":"keeping the front wheels astride the crack as he followed its zigzag course.","zh":"让前轮跨过裂缝，沿着它之字形的路线前进。","kind":"text"},{"t":147.14,"en":"Before we had time to worry about what might happen, we were back on the plain again.","zh":"还没等我们有时间担心会发生什么，我们又回到了平原上。","kind":"text"},{"t":154.67,"en":"Bruce consulted the map once more and told us that the village was now only fifteen miles away.","zh":"布鲁斯又一次查阅了地图，告诉我们村庄现在只剩下十五英里远了。","kind":"text"},{"t":163.24,"en":"Our next obstacle was a shallow pool of water about half a mile across.","zh":"我们的下一个障碍是一个大约半英里宽的浅水池。","kind":"text"},{"t":169.12,"en":"Bruce charged at it, but in the middle, the car came to a grinding halt.","zh":"布鲁斯冲了过去，但在水池中央，汽车嘎然而止。","kind":"text"},{"t":175.96,"en":"A yellow light on the dashboard flashed angrily and Bruce cheerfully announced that there was no oil in the engine!","zh":"仪表盘上一个黄灯愤怒地闪烁着，布鲁斯却高兴地宣布发动机里没油了！","kind":"text"}]},{"id":"NCE3-40","book":"NCE3","bookCn":"第三册","num":40,"title":"Who's Who","slug":"40.Who's Who","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/40.Who%27s%20Who.mp3","sentenceCount":23,"wordCount":362,"lines":[{"t":0.27,"en":"Lesson 40","zh":"第40课","kind":"lesson"},{"t":1.99,"en":"Who's who","zh":"谁是谁","kind":"title"},{"t":8.14,"en":"How did the policeman discover that the whole thing was a joke?","zh":"警察是如何发现这整件事是个恶作剧的？","kind":"question"},{"t":14.21,"en":"It has never been explained why university students seem to enjoy practical jokes more than anyone else.","zh":"大学学生为什么似乎比其他人更喜欢恶作剧，这一点从未得到解释。","kind":"text"},{"t":22.71,"en":"Students specialize in a particular type of practical joke: the hoax.","zh":"学生们擅长一种特殊类型的恶作剧：骗局。","kind":"text"},{"t":28.79,"en":"Inviting the fire brigade to put out a nonexistent fire is a crude form of deception which no self-respecting student would ever indulde in.","zh":"邀请消防队扑灭一场不存在的火灾是一种粗俗的欺骗形式，任何有自尊的学生都不会沉溺其中。","kind":"text"},{"t":39.45,"en":"Students often create amusing situations which are funny to everyone except the victims.","zh":"学生们经常制造一些有趣的场面，除了受害者，每个人都觉得好笑。","kind":"text"},{"t":46.93,"en":"When a student recently saw two workmen using a pneumatic drill outside his university,","zh":"最近，当一名学生看到两名工人在他大学外面使用一台气动钻时，","kind":"text"},{"t":54.24,"en":"he immediately telephoned the police and informed them that two students dressed up as workmen","zh":"他立即打电话报警，并告知警察有两名打扮成工人的学生","kind":"text"},{"t":61.2,"en":"were tearing up the road with a pneumatic drill.","zh":"正在用气动钻挖路。","kind":"text"},{"t":64.69,"en":"As soon as he had hung up, he went over to the workmen and told them that if a policeman ordered them to go away,","zh":"他一挂掉电话，就走到工人那里，告诉他们如果一个警察命令他们离开，","kind":"text"},{"t":72.7,"en":"they were not to take him seriously.","zh":"他们不必把他当真。","kind":"text"},{"t":75.42,"en":"He added that a student had dressed up as a policeman and was playing all sorts of silly jokes on people.","zh":"他补充说，有个学生打扮成警察，正在对人们开各种愚蠢的玩笑。","kind":"text"},{"t":83.78,"en":"Both the police and the workmen were grateful to the student for this piece of advance information.","zh":"警察和工人都很感谢这名学生提供的这条提前消息。","kind":"text"},{"t":91.58,"en":"The student hid in an archway nearby where he could watch and hear everything that went on.","zh":"这名学生藏在附近的一个拱门里，在那里他能看到和听到发生的一切。","kind":"text"},{"t":98.73,"en":"Sure enough, a policeman arrived on the scene and politely asked the workmen to go away.","zh":"果不其然，一名警察来到了现场，并礼貌地要求工人离开。","kind":"text"},{"t":105.75,"en":"When he received a very rude reply from one of the workmen, he threatened to remove them by force.","zh":"当他从其中一名工人那里得到非常粗鲁的答复时，他威胁要强行把他们带走。","kind":"text"},{"t":113.54,"en":"The workmen told him to do as he pleased and the policeman telephoned for help.","zh":"工人们告诉他想怎样就怎样，于是警察打电话请求支援。","kind":"text"},{"t":119.16,"en":"Shortly afterwards, 4 more policemen arrived and remonstrated with the workmen.","zh":"不久之后，又有4名警察赶到，并与工人们进行交涉。","kind":"text"},{"t":125.79,"en":"As the men refused to stop working, the police attempted to seize the pneumatic drill.","zh":"由于工人们拒绝停止工作，警察试图没收气动钻。","kind":"text"},{"t":132.84,"en":"The workmen struggled fiercely and one of them lost his temper.","zh":"工人们激烈反抗，其中一人发了脾气。","kind":"text"},{"t":138.04,"en":"He threatened to call the police.","zh":"他威胁要报警。","kind":"text"},{"t":140.87,"en":"At this, the police pointed out ironically that this would hardly be necessary as the men were already under arrest.","zh":"听罢此言，警察讽刺地指出，这几乎没有必要，因为这些人已经被逮捕了。","kind":"text"},{"t":150.34,"en":"Pretending to speak seriously, one of the workmen asked if he might make a telephone call before being taken to the station.","zh":"其中一名工人假装认真地问道，在被带到警察局之前，他是否可以打个电话。","kind":"text"},{"t":159.61,"en":"Permission was granted and a policeman accompanied him to a pay phone.","zh":"许可被准予，一名警察陪他去了公用电话亭。","kind":"text"},{"t":165.09,"en":"Only when he saw that the man was actually telephoning the police did he realize that they had all been the victims of a hoax.","zh":"只有当他看到那个人实际上是在打电话给警察时，他才意识到他们都成了骗局的受害者。","kind":"text"}]},{"id":"NCE3-41","book":"NCE3","bookCn":"第三册","num":41,"title":"Illusions of Pastoral Peace","slug":"41.Illusions of Pastoral Peace","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/41.Illusions%20of%20Pastoral%20Peace.mp3","sentenceCount":33,"wordCount":525,"lines":[{"t":0.13,"en":"Lesson 41","zh":"第41课","kind":"lesson"},{"t":2.4,"en":"Illusions of pastoral peace","zh":"田园宁静的遐想","kind":"title"},{"t":10.97,"en":"What particular anxiety spoils the country dweller's visit to the theatre?","zh":"乡下人进城看戏，有什么特殊的忧虑会使他们败兴？","kind":"question"},{"t":17.94,"en":"The quiet life of the country has never appealed to me.","zh":"宁静的乡村生活从来没有吸引过我。","kind":"text"},{"t":22.45,"en":"City born and city bred,","zh":"我生在城里，长在城里，","kind":"text"},{"t":24.9,"en":"I have always regarded the country as something you look at through a train window, or something you occasionally visit during the weekend.","zh":"始终认为乡村是透过火车车窗看的东西，或者至多是周末偶尔去逛逛的地方。","kind":"text"},{"t":35.61,"en":"Most of my friends live in the city, yet they always go into raptures at the mere mention of the country.","zh":"我的大部分朋友都住在城里，然而他们一提到乡村就手舞足蹈。","kind":"text"},{"t":45.18,"en":"Though they extol the virtues of the peaceful life,","zh":"尽管他们盛赞宁静生活的种种好处，","kind":"text"},{"t":49.15,"en":"only one of them has ever gone to live in the country and he was back in town within six months.","zh":"但只有一个人去乡下住过，而且不到6个月就回到了城里。","kind":"text"},{"t":57.41,"en":"Even he still lives under the illusion that country life is somehow superior to town life.","zh":"即使他，至今仍幻想乡村生活不知怎么的要优于城市生活。","kind":"text"},{"t":66.07,"en":"He is forever talking about the friendly people, the clean atmosphere, the closeness to nature and the gentle pace of living.","zh":"他总是谈论那里的人们多么友好，空气多么清新，多么贴近大自然，生活节奏多么悠闲。","kind":"text"},{"t":76.04,"en":"Nothing can be compared, he maintains, with the first cockcrow, the twittering of birds at dawn,","zh":"他坚持认为，没有什么能与第一声鸡鸣、黎明时鸟儿的啁啾相比，","kind":"text"},{"t":84.79,"en":"the sight of the rising sun glinting on the trees and pastures.","zh":"也不能与旭日普照树林和牧场的景象相比。","kind":"text"},{"t":90.55,"en":"This idyllic pastoral scene is only part of the picture.","zh":"这田园诗般的乡村景色只是部分景象。","kind":"text"},{"t":95.95,"en":"My friend fails to mention the long and friendless winter evenings in front of the TV--virtually the only form of entertainment.","zh":"我的朋友没有提到在电视机前度过的漫长而孤寂的冬夜——这几乎是唯一的娱乐方式。","kind":"text"},{"t":106.87,"en":"He says nothing about the poor selection of goods in the shops,","zh":"他没有提及商店里商品的选择少得可怜，","kind":"text"},{"t":111.66,"en":"or about those unfortunate people who have to travel from the country to the city every day to get to work.","zh":"也没有提及那些每天不得不从乡下到城里上班的可怜人。","kind":"text"},{"t":120.73,"en":"Why people are prepared to tolerate a four-hour journey each day for the dubious privilege of living in the country is beyond me.","zh":"为什么人们愿意每天忍受4个小时的车程，只为享受住在乡下这种可疑的优待，这真是超出我的理解。","kind":"text"},{"t":131.87,"en":"They could be saved so much misery and expense if they chose to live in the city where they rightly belong.","zh":"如果他们选择住在他们本该居住的城市，就可以避免许多痛苦和花费。","kind":"text"},{"t":141.99,"en":"If you can do without the few pastoral pleasures of the country, you will find the city can provide you with the best that life can offer.","zh":"如果你能放弃乡村那一点点田园乐趣，你就会发现城市能为你提供生活中最美好的东西。","kind":"text"},{"t":152.11,"en":"You never have to travel miles to see your friends.","zh":"你永远不必跑很远的路去看望朋友。","kind":"text"},{"t":156.17,"en":"They invariably live nearby and are always available for an informal chat or an evening's entertainment.","zh":"他们总是住在附近，随时都可以进行非正式的聊天或晚间娱乐。","kind":"text"},{"t":165.81,"en":"Some of my acquaintances in the country come up to town once or twice a year to visit the theatre as a special treat.","zh":"我乡下的一些熟人每年进城一两次，看戏作为一种特殊的享受。","kind":"text"},{"t":174.74,"en":"For them this is a major operation which involves considerable planning.","zh":"对他们来说，这是一项大工程，需要周密的计划。","kind":"text"},{"t":181.5,"en":"As the play draws to its close, they wonder whether they will ever catch that last train home.","zh":"随着戏接近尾声，他们会担心是否能赶上最后一班回家的火车。","kind":"text"},{"t":188.77,"en":"The city dweller never experiences anxieties of this sort.","zh":"城市居民从不会经历这种焦虑。","kind":"text"},{"t":194.16,"en":"The latest exhibitions, films, or plays are only a short bus ride away.","zh":"最新的展览、电影或戏剧，只需坐一小段公交车就能到达。","kind":"text"},{"t":201.46,"en":"Shopping, too, is always a pleasure.","zh":"购物也总是一种乐趣。","kind":"text"},{"t":205.24,"en":"There is so much variety that you never have to make do with second best.","zh":"品种如此繁多，你永远不必将就次等货。","kind":"text"},{"t":212.3,"en":"Country people run wild when they go shopping in the city and stagger home loaded with as many of the exotic items as they can carry.","zh":"乡下人进城购物时会变得狂热，然后蹒跚着回家，身上背着尽可能多的异国情调的物品。","kind":"text"},{"t":223.18,"en":"Nor is the city without its moments of beauty.","zh":"城市也并非没有它的美丽时刻。","kind":"text"},{"t":227.08,"en":"There is something comforting about the warm glow shed by advertisements on cold wet winter nights.","zh":"在寒冷潮湿的冬夜，广告牌散发出的温暖光芒总能给人带来慰藉。","kind":"text"},{"t":235.15,"en":"Few things could be more impressive than the peace that descends on deserted city streets at weekends","zh":"几乎没有什么能比周末空旷的城市街道上降临的宁静更令人印象深刻，","kind":"text"},{"t":242.61,"en":"when the thousands that travel to work every day are tucked away in their homes in the country.","zh":"当每天上班的成千上万人都在乡下的家中安睡时。","kind":"text"},{"t":250.08,"en":"It has always been a mystery to me why city dwellers, who appreciate all these things,","zh":"对我来说，城市居民明明欣赏所有这些优点，","kind":"text"},{"t":257.67,"en":"obstinately pretend that they would prefer to live in the country.","zh":"却固执地假装他们更喜欢住在乡下，这始终是个谜。","kind":"text"}]},{"id":"NCE3-42","book":"NCE3","bookCn":"第三册","num":42,"title":"Modern Cavemen","slug":"42.Modern Cavemen","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/42.Modern%20Cavemen.mp3","sentenceCount":33,"wordCount":517,"lines":[{"t":0.2,"en":"Lesson 42","zh":"第42课","kind":"lesson"},{"t":2.2,"en":"Modern cavemen","zh":"现代穴居人","kind":"title"},{"t":9.46,"en":"With what does the writer compare the Gouffre Berger?","zh":"作者把贝杰深洞与什么作比较？","kind":"question"},{"t":15.31,"en":"Cave exploration, or pot-holing, as it has come to be known, is a relatively new sport.","zh":"洞穴探险，即人们所知的“探洞”，是一项比较新的运动。","kind":"text"},{"t":23.34,"en":"Perhaps it is the desire for solitude or the chance of making an unexpected discovery that lures people down to the depths of the earth.","zh":"也许是出于对孤独的渴望，或是想作一次意想不到的发现，把人们引到地下去的。","kind":"text"},{"t":34.42,"en":"It is impossible to give a satisfactory explanation for a pot-holer's motives.","zh":"想对探洞者的动机作出满意的解释是不可能的。","kind":"text"},{"t":40.92,"en":"For him, caves have the same peculiar fascination which high mountains have for the climber.","zh":"对于他来说，洞穴有着与高山对于登山者一样的奇异魅力。","kind":"text"},{"t":48.99,"en":"They arouse instincts which can only be dimly understood.","zh":"它们唤起人们只能模模糊糊感知到的本能。","kind":"text"},{"t":54.42,"en":"Exploring really deep caves is not a task for the Sunday afternoon rambler.","zh":"勘探真正深的洞穴并非是周日下午散步者所能胜任的。","kind":"text"},{"t":60.19,"en":"Such undertakings require the precise planning and foresight of military operations.","zh":"这种活动需要像军事行动一样精确的计划和预见性。","kind":"text"},{"t":68.04,"en":"It can take as long as eight days to rig up rope ladders and to establish supply bases before a descent can be made into a very deep cave.","zh":"在下到一个很深的洞穴之前，光是架设绳梯和建立补给站就可能需要长达8天的时间。","kind":"text"},{"t":80.61,"en":"Precautions of this sort are necessary, for it is impossible to foretell the exact nature of the difficulties which will confront the pot-holer.","zh":"这种预防是必要的，因为无法预知探洞者将会遇到的困难究竟是什么性质。","kind":"text"},{"t":92.06,"en":"The deepest known cave in the world is the Gouffre Berger near Grenoble.","zh":"世界上已知最深的洞穴是格勒诺布尔附近的贝杰深洞。","kind":"text"},{"t":98.66,"en":"It extends to a depth of 3, 723 feet.","zh":"它深达3723英尺。","kind":"text"},{"t":104.33,"en":"This immense chasm has been formed by an underground stream which has tunnelled a course through a flaw in the rocks.","zh":"这个巨大的深渊是由一条地下河形成的，这条河在岩石的裂缝中开凿出一条通道。","kind":"text"},{"t":113.65,"en":"The entrance to the cave is on a plateau in the Dauphine Alps.","zh":"洞口位于多芬阿尔卑斯山脉的一个高原上。","kind":"text"},{"t":120.13,"en":"As it is only six feet across, it is barely noticeable.","zh":"由于洞口只有6英尺宽，所以几乎难以察觉。","kind":"text"},{"t":125.39,"en":"The cave might never have been discovered had not the entrance been spotted by the distinguished French pot-holer, Berger.","zh":"如果不是杰出的法国探洞者贝杰发现了洞口，这个洞穴可能永远也不会被发现。","kind":"text"},{"t":135.0,"en":"Since its discovery, it has become a sort of pot-holers' Everest.","zh":"自从被发现以来，它已成为探洞者们的一种“珠穆朗玛峰”。","kind":"text"},{"t":140.66,"en":"Though a number of descents have been made, much of it still remains to be explored.","zh":"尽管已经进行过多次下降探险，但其中大部分仍有待勘探。","kind":"text"},{"t":147.85,"en":"A team of pot-holers recently went down the Gouffre Berger.","zh":"一队探洞者最近下到了贝杰深洞。","kind":"text"},{"t":153.27,"en":"After entering the narrow gap on the plateau,","zh":"他们进入高原上的那个狭窄的缝隙后，","kind":"text"},{"t":156.96,"en":"they climbed down the steep sides of the cave until they came to a narrow corridor.","zh":"沿着洞穴陡峭的侧壁向下攀爬，直到来到一条狭窄的通道。","kind":"text"},{"t":163.62,"en":"They had to edge their way along this,","zh":"他们不得不侧身沿着这条通道前行，","kind":"text"},{"t":166.29,"en":"sometimes wading across shallow streams, or swimming across deep pools.","zh":"有时涉过浅浅的小溪，有时游过深深的水潭。","kind":"text"},{"t":172.62,"en":"Suddenly they came to a waterfall which dropped into an underground lake at the bottom of the cave.","zh":"突然，他们来到一个瀑布，瀑布落入洞穴底部的一个地下湖中。","kind":"text"},{"t":180.69,"en":"They plunged into the lake, and after loading their gear on an inflatable rubber dinghy, let the current carry them to the other side.","zh":"他们跳入湖中，把装备装到一艘充气橡皮艇上，然后让水流把他们带到对岸。","kind":"text"},{"t":191.67,"en":"To protect themselves from the icy water, they had to wear special rubber suits.","zh":"为了保护自己不受冰冷湖水的侵袭，他们不得不穿上特制的橡胶衣。","kind":"text"},{"t":198.58,"en":"At the far end of the lake, they came to huge piles of rubble which had been washed up by the water.","zh":"在湖的远端，他们遇到了被水冲刷而成的巨大碎石堆。","kind":"text"},{"t":206.87,"en":"In this part of the cave, they could hear an insistent booming sound","zh":"在洞穴的这部分，他们能听到一种持续不断的轰鸣声，","kind":"text"},{"t":212.17,"en":"which they found was caused by a small waterspout shooting down into a pool from the roof of the cave.","zh":"他们发现这是由一股小小的水柱从洞顶射入水潭所引起的。","kind":"text"},{"t":220.42,"en":"Squeezing through a cleft in the rocks, the pot-holers arrived at an enormous cavern, the size of a huge concert hall.","zh":"探洞者们挤过岩石中的一道裂缝，来到一个巨大的洞穴，其大小相当于一个巨大的音乐厅。","kind":"text"},{"t":229.72,"en":"After switching on powerful arc lights,","zh":"打开强光弧光灯后，","kind":"text"},{"t":233.0,"en":"they saw great stalagmites--some of them over forty feet high--rising up like tree-trunks to meet the stalactites suspended from the roof.","zh":"他们看到了巨大的石笋——其中一些高达40多英尺——像树干一样向上生长，与悬挂在洞顶的钟乳石相接。","kind":"text"},{"t":245.43,"en":"Round about, piles of limestone glistened in all the colours of the rainbow.","zh":"四周，一堆堆的石灰石闪耀着彩虹般的光芒。","kind":"text"},{"t":252.14,"en":"In the eerie silence of the cavern, the only sound that could be heard was made by water which dripped continuously from the high dome above them.","zh":"在洞穴诡异的寂静中，唯一能听到的声音是头顶高高的拱顶不断滴落的水声。","kind":"text"}]},{"id":"NCE3-43","book":"NCE3","bookCn":"第三册","num":43,"title":"Fully Insured","slug":"43.Fully Insured","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/43.Fully%20Insured.mp3","sentenceCount":29,"wordCount":517,"lines":[{"t":0.29,"en":"Lesson 43","zh":"第43课","kind":"lesson"},{"t":3.01,"en":"Fully insured","zh":"全额投保","kind":"title"},{"t":10.94,"en":"Who owned the pie dish and why?","zh":"馅饼盘属于谁，为什么？","kind":"question"},{"t":15.55,"en":"Insurance companies are normally willing to insure anything.","zh":"保险公司通常愿意为任何东西投保。","kind":"text"},{"t":20.85,"en":"Insuring public or private property is a standard practice in most countries in the world.","zh":"在世界上大多数国家，为公共或私人财产投保是一种惯例。","kind":"text"},{"t":28.14,"en":"If, however, you were holding an open air garden party or a fete it would be equally possible to insure yourself in the event of bad weather.","zh":"然而，如果你要举办一场露天花园派对或游园会，同样可以为自己投保，以防恶劣天气。","kind":"text"},{"t":40.27,"en":"Needless to say, the bigger the risk an insurance company takes, the higher the premium you will have to pay.","zh":"不言而喻，保险公司承担的风险越大，你将支付的保费就越高。","kind":"text"},{"t":49.9,"en":"It is not uncommon to hear that a shipping company has made a claim for the cost of salvaging a sunken ship.","zh":"航运公司为打捞沉船的费用提出索赔并非罕见。","kind":"text"},{"t":58.02,"en":"But the claim made by a local authority to recover the cost of salvaging a sunken pie dish must surely be unique.","zh":"但地方当局为打捞沉没的馅饼盘而提出的索赔，肯定是非同寻常的。","kind":"text"},{"t":68.34,"en":"Admittedly it was an unusual pie dish, for it was eighteen feet long and six feet wide.","zh":"诚然，这是一个不寻常的馅饼盘，因为它有18英尺长，6英尺宽。","kind":"text"},{"t":77.4,"en":"It had been purchased by a local authority so that an enormous pie could be baked for an annual fair.","zh":"它是由地方当局购买的，以便为一年一度的集市烤制一个巨大的馅饼。","kind":"text"},{"t":86.4,"en":"The pie committee decided that the best way to transport the dish would be by canal so they insured it for the trip.","zh":"馅饼委员会决定，运输这个盘子的最好方式是水路，所以他们为这次行程投了保。","kind":"text"},{"t":96.61,"en":"Shortly after it was launched, the pie committee went to a local inn to celebrate.","zh":"盘子下水后不久，馅饼委员会就去了一家当地的旅店庆祝。","kind":"text"},{"t":103.28,"en":"At the same time, a number of teenagers climbed on to the dish and held a little party of their own.","zh":"同时，一些青少年爬上盘子，开起了他们自己的小型派对。","kind":"text"},{"t":111.27,"en":"Dancing proved to be more than the dish could bear,","zh":"跳舞对盘子来说是无法承受的，","kind":"text"},{"t":115.25,"en":"for during the party it capsized and sank in seven feet of water.","zh":"因为在派对期间，它翻了船，沉入了七英尺深的水中。","kind":"text"},{"t":121.76,"en":"The pie committee telephoned a local garage owner who arrived in a recovery truck to salvage the pie dish.","zh":"馅饼委员会给当地的一位修车厂老板打电话，他开着一辆救援卡车前来打捞馅饼盘。","kind":"text"},{"t":130.67,"en":"Shivering in their wet clothes, the teenagers looked on while three men dived repeatedly into the water to locate the dish.","zh":"少年们穿着湿衣服颤抖着，看着三名男子反复潜入水中寻找盘子。","kind":"text"},{"t":141.41,"en":"They had little difficulty in finding it, but hauling it out of the water proved to be a serious problem.","zh":"他们找到它几乎没什么困难，但把它从水中拖出来却是个大问题。","kind":"text"},{"t":150.27,"en":"The sides of the dish were so smooth that it was almost impossible to attach hawsers and chains to the rim without damaging it.","zh":"盘子的侧面非常光滑，几乎不可能在不损坏它的情况下将缆绳和链条固定到边缘。","kind":"text"},{"t":162.12,"en":"Eventually chains were fixed to one end of the dish and a powerful winch was put into operation.","zh":"最终，链条被固定在盘子的一端，一台强大的绞车开始工作。","kind":"text"},{"t":170.84,"en":"The dish rose to the surface and was gently drawn towards the canal bank.","zh":"盘子浮出水面，被轻轻地拉向运河岸边。","kind":"text"},{"t":178.1,"en":"For one agonizing moment, the dish was perched precariously on the bank of the canal,","zh":"有一刻，盘子摇摇晃晃地栖息在运河岸边，令人心焦，","kind":"text"},{"t":185.67,"en":"but it suddenly overbalanced and slid back into the water.","zh":"但它突然失去平衡，滑回了水中。","kind":"text"},{"t":191.34,"en":"The men were now obliged to try once more.","zh":"男人们现在不得不再次尝试。","kind":"text"},{"t":195.82,"en":"This time they fixed heavy metal clamps to both sides of the dish so that they could fasten the chains.","zh":"这次他们在盘子的两边固定了沉重的金属夹，以便系上链条。","kind":"text"},{"t":204.77,"en":"The dish now had to be lifted vertically because one edge was resting against the side of the canal.","zh":"盘子现在必须垂直吊起，因为一侧正抵着运河的侧面。","kind":"text"},{"t":212.23,"en":"The winch was again put into operation and one of the men started up the truck.","zh":"绞车再次启动，其中一名男子发动了卡车。","kind":"text"},{"t":218.89,"en":"Several minutes later, the dish was successfully hauled above the surface of the water.","zh":"几分钟后，盘子被成功地吊出水面。","kind":"text"},{"t":225.3,"en":"Water streamed in torrents over its sides with such force that it set up a huge wave in the canal.","zh":"水从盘子两侧倾泻而下，力量之大，以至于在运河中掀起了巨浪。","kind":"text"},{"t":233.96,"en":"There was a danger that the wave would rebound off the other side of the bank and send the dish plunging into the water again.","zh":"存在着波浪会从运河对岸反弹回来，再次将盘子冲入水中的危险。","kind":"text"},{"t":244.44,"en":"By working at tremendous speed, the men managed to get the dish on to dry land before the wave returned.","zh":"男人们以惊人的速度工作，在波浪返回之前设法将盘子弄上了岸。","kind":"text"}]},{"id":"NCE3-44","book":"NCE3","bookCn":"第三册","num":44,"title":"Speed and Comfort","slug":"44.Speed and Comfort","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/44.Speed%20and%20Comfort.mp3","sentenceCount":35,"wordCount":512,"lines":[{"t":0.31,"en":"Lesson 44","zh":"第44课","kind":"lesson"},{"t":2.17,"en":"Speed and comfort","zh":"速度与舒适","kind":"title"},{"t":8.93,"en":"Which type of transport does the writer prefer, do you think?","zh":"你认为作者更喜欢哪种交通方式？","kind":"question"},{"t":15.05,"en":"People travelling long distances frequently have to decide whether they would prefer to go by land, sea, or air.","zh":"长途旅行的人经常不得不决定他们是愿意乘陆路、海路还是空路。","kind":"text"},{"t":23.94,"en":"Hardly anyone can positively enjoy sitting in a train for more than a few hours.","zh":"几乎没有人会真正喜欢坐几个小时以上的火车。","kind":"text"},{"t":30.98,"en":"Train compartments soon get cramped and stuffy.","zh":"火车车厢很快就会变得又挤又闷。","kind":"text"},{"t":34.86,"en":"It is almost impossible to take your mind off the journey.","zh":"几乎不可能不去想旅途。","kind":"text"},{"t":39.1,"en":"Reading is only a partial solution, for the monotonous rhythm of the wheels clicking on the rails soon lull you to sleep.","zh":"阅读只是一个部分解决方案，因为车轮在铁轨上单调的咔嗒声很快就会让你昏昏欲睡。","kind":"text"},{"t":49.1,"en":"During the day, sleep comes in snatches.","zh":"白天，睡眠是断断续续的。","kind":"text"},{"t":52.9,"en":"At night, when you really wish to go to sleep, you rarely manage to do so.","zh":"晚上，当你真正想睡觉时，你却很少能做到。","kind":"text"},{"t":58.6,"en":"If you are lucky enough to get a sleeper,","zh":"如果你足够幸运能得到一个卧铺，","kind":"text"},{"t":61.43,"en":"you spend half the night staring at the small blue light in the ceiling, or fumbling to find your ticket for inspection.","zh":"你会花半夜的时间盯着天花板上那盏小蓝灯，或者摸索着找票以备查验。","kind":"text"},{"t":70.91,"en":"Inevitably you arrive at your destination almost exhausted.","zh":"不可避免地，你到达目的地时几乎精疲力尽。","kind":"text"},{"t":77.13,"en":"Long car journeys are even less pleasant, for it is quite impossible even to read.","zh":"长途汽车旅行甚至更不愉快，因为连阅读都是完全不可能的。","kind":"text"},{"t":83.68,"en":"On motorways you can, at least, travel fairly safely at high speeds,","zh":"在高速公路上，你至少可以相当安全地高速行驶，","kind":"text"},{"t":89.31,"en":"but more often than not, the greater part of the journey is spent on roads with few service stations and too much traffic.","zh":"但通常情况下，旅途的大部分时间是在服务站很少且交通拥堵的道路上度过的。","kind":"text"},{"t":98.94,"en":"By comparison, ferry trips or cruises offer a great variety of civilized comforts.","zh":"相比之下，渡轮旅行或邮轮旅行提供了各种文明的舒适享受。","kind":"text"},{"t":106.94,"en":"You can stretch your legs on the spacious decks, play games,","zh":"你可以在宽敞的甲板上伸展双腿，玩游戏，","kind":"text"},{"t":111.0,"en":"meet interesting people and enjoy good food--always assuming, of course, that the sea is calm.","zh":"结识有趣的人，享受美食——当然，前提是海面风平浪静。","kind":"text"},{"t":120.53,"en":"If it is not, and you are likely to get seasick, no form of transport could be worse.","zh":"如果不是，而且你很可能会晕船，那么没有哪种交通方式会更糟了。","kind":"text"},{"t":128.15,"en":"Even if you travel in ideal weather, sea journeys take a long time.","zh":"即使你在理想的天气中旅行，海路旅行也需要很长时间。","kind":"text"},{"t":133.69,"en":"Relatively few people are prepared to sacrifice holiday time for the pleasure of travelling by sea.","zh":"相对而言，很少有人愿意为了海上旅行的乐趣而牺牲假期时间。","kind":"text"},{"t":141.98,"en":"Aeroplanes have the reputation of being dangerous and even hardened travellers are intimidated by them.","zh":"飞机有危险的名声，即使是经验丰富的旅行者也会被它们吓倒。","kind":"text"},{"t":149.86,"en":"They also have the disadvantage of being an expensive form of transport.","zh":"它们还有另一个缺点，就是价格昂贵的交通方式。","kind":"text"},{"t":155.68,"en":"But nothing can match them for speed and comfort.","zh":"但论速度和舒适度，没有任何交通工具能与它们相比。","kind":"text"},{"t":160.07,"en":"Travelling at a height of 30, 000 feet, far above the clouds, and at over 500 miles an hour is an exhilarating experience.","zh":"在三万英尺高空，远在云层之上，以每小时超过500英里的速度飞行，是一种令人兴奋的体验。","kind":"text"},{"t":171.17,"en":"You do not have to devise ways of taking your mind off the journey, for an aeroplane gets you to your destination rapidly.","zh":"你不必绞尽脑汁去分散旅途的注意力，因为飞机能迅速将你送达目的地。","kind":"text"},{"t":179.72,"en":"For a few hours, you settle back in a deep armchair to enjoy the flight.","zh":"几个小时里，你可以靠在舒适的扶手椅上享受飞行。","kind":"text"},{"t":186.26,"en":"The real escapist can watch a film and sip champagne on some services.","zh":"真正的逃避现实者可以在某些航班上观看电影并品尝香槟。","kind":"text"},{"t":192.79,"en":"But even when such refinements are not available, there is plenty to keep you occupied.","zh":"但即使没有这些精致的服务，也有很多事情能让你保持忙碌。","kind":"text"},{"t":198.57,"en":"An aeroplane offers you an unusual and breathtaking view of the world.","zh":"飞机为你提供了独特而令人惊叹的世界景观。","kind":"text"},{"t":204.61,"en":"You soar effortlessly over high mountains and deep valleys.","zh":"你毫不费力地翱翔于高山深谷之上。","kind":"text"},{"t":209.84,"en":"You really see the shape of the land.","zh":"你真切地看到了大地的轮廓。","kind":"text"},{"t":212.94,"en":"If the landscape is hidden from view,","zh":"如果风景被遮挡，","kind":"text"},{"t":215.59,"en":"you can enjoy the extraordinary sight of unbroken cloud plains that stretch out for miles before you, while the sun shines brilliantly in a clear sky.","zh":"你可以欣赏到绵延数英里的连绵不断的云海奇景，同时阳光在晴朗的天空中灿烂地照耀。","kind":"text"},{"t":228.89,"en":"The journey is so smooth that there is nothing to prevent you from reading or sleeping.","zh":"旅途如此平稳，没有什么能阻止你阅读或睡觉。","kind":"text"},{"t":235.62,"en":"However you decide to spend your time, one thing is certain: you will arrive at your destination fresh and uncrumpled.","zh":"无论你决定如何度过时间，有一件事是肯定的：你将精神焕发、衣着整洁地抵达目的地。","kind":"text"},{"t":245.57,"en":"You will not have to spend the next few days recovering from a long and arduous journey.","zh":"你不必花接下来的几天来从漫长而艰辛的旅程中恢复。","kind":"text"}]},{"id":"NCE3-45","book":"NCE3","bookCn":"第三册","num":45,"title":"The Power of the Press","slug":"45.The Power of the Press","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/45.The%20Power%20of%20the%20Press.mp3","sentenceCount":28,"wordCount":392,"lines":[{"t":0.17,"en":"Lesson 45","zh":"第45课","kind":"lesson"},{"t":2.26,"en":"The power of the press","zh":"新闻界的力量","kind":"title"},{"t":9.99,"en":"Does the writer think the parents were lucky or unlucky to gain prosperity in this way? Why?","zh":"作者认为这对父母以这种方式获得财富是幸运还是不幸？为什么？","kind":"question"},{"t":20.22,"en":"In democratic countries any efforts to restrict the freedom of the press are rightly condemned.","zh":"在民主国家，任何限制新闻自由的努力都理应受到谴责。","kind":"text"},{"t":28.59,"en":"However, this freedom can easily be abused.","zh":"然而，这种自由很容易被滥用。","kind":"text"},{"t":33.74,"en":"Stories about people often attract far more public attention than political events.","zh":"关于人物的故事常常比政治事件更能吸引公众的注意力。","kind":"text"},{"t":40.73,"en":"Though we may enjoy reading about the lives of others,","zh":"尽管我们可能喜欢阅读别人的生活故事，","kind":"text"},{"t":44.94,"en":"it is extremely doubtful whether we would equally enjoy reading about ourselves.","zh":"但我们是否同样喜欢阅读关于我们自己的故事，这一点是极度怀疑的。","kind":"text"},{"t":51.76,"en":"Acting on the contention that facts are sacred,","zh":"记者们秉持着“事实神圣不可侵犯”的论点，","kind":"text"},{"t":56.16,"en":"reporters can cause untold suffering to individuals by publishing details about their private lives.","zh":"通过刊登个人私生活的细节，给他们造成了无法言喻的痛苦。","kind":"text"},{"t":65.83,"en":"Newspapers exert such tremendous influence that they can not only bring about major changes to the lives of ordinary people but can even overthrow a government.","zh":"报纸施加着巨大的影响力，它们不仅能给普通人的生活带来巨大变化，甚至可以推翻一个政府。","kind":"text"},{"t":79.22,"en":"The story of a poor family that acquired fame and fortune overnight, dramatically illustrates the power of the press.","zh":"一个贫困家庭一夜之间获得名利的故事，戏剧性地说明了新闻界的力量。","kind":"text"},{"t":88.3,"en":"The family lived in Aberdeen, a small town of 23, 000 inhabitants in South Dakota.","zh":"这个家庭住在南达科他州一个拥有23,000居民的小镇阿伯丁。","kind":"text"},{"t":96.02,"en":"As the parents had five children, life was a perpetual struggle against poverty.","zh":"由于这对父母有五个孩子，生活一直是与贫困的无休止的斗争。","kind":"text"},{"t":102.12,"en":"They were expecting their sixth child and were faced with even more pressing economic problems.","zh":"他们正期待着第六个孩子，面临着更加紧迫的经济问题。","kind":"text"},{"t":109.51,"en":"If they had only had one more child, the fact would have passed unnoticed.","zh":"如果他们只多生一个孩子，这件事就会不为人知。","kind":"text"},{"t":115.53,"en":"They would have continued to struggle against economic odds and would have lived in obscurity.","zh":"他们会继续在经济困境中挣扎，并默默无闻地生活。","kind":"text"},{"t":122.51,"en":"But they suddenly became the parents of quintuplets, four girls and a boy, an event which radically changed their lives.","zh":"但他们突然成了五胞胎的父母，四个女孩和一个男孩，这一事件彻底改变了他们的生活。","kind":"text"},{"t":132.99,"en":"The day after the birth of the five children, an aeroplane arrived in Aberdeen bringing sixty reporters and photographers.","zh":"孩子们出生后的第二天，一架飞机抵达阿伯丁，带来了六十名记者和摄影师。","kind":"text"},{"t":142.41,"en":"The rise to fame was swift.","zh":"成名之路迅速。","kind":"text"},{"t":144.75,"en":"Television cameras and newspapers carried the news to everyone in the country.","zh":"电视摄像机和报纸将这一消息传遍了全国各地。","kind":"text"},{"t":150.03,"en":"Newspapers and magazines offered the family huge sums for the exclusive rights to publish stories and photographs.","zh":"报纸和杂志为独家刊登这些故事和照片的权利，向这个家庭提供了巨额报酬。","kind":"text"},{"t":158.52,"en":"Gifts poured in not only from unknown people,","zh":"礼物源源不断地涌来，不仅来自陌生人，","kind":"text"},{"t":162.22,"en":"but from baby food and soap manufacturers who wished to advertise their products.","zh":"也来自希望宣传产品的婴儿食品和肥皂制造商。","kind":"text"},{"t":168.83,"en":"The old farmhouse the family lived in was to be replaced by a new $500, 000 home.","zh":"这家人住的老农舍将被一座价值50万美元的新房子取代。","kind":"text"},{"t":176.83,"en":"Reporters kept pressing for interviews so lawyers had to be employed to act as spokesmen for the family at press conferences.","zh":"记者们不停地要求采访，所以不得不雇佣律师在新闻发布会上担任这个家庭的发言人。","kind":"text"},{"t":186.84,"en":"While the five babies were still quietly sleeping in oxygen tents in a hospital nursery,","zh":"当五个婴儿还在医院育婴室的氧气帐篷里安静地睡觉时，","kind":"text"},{"t":193.58,"en":"their parents were paying the price for fame.","zh":"他们的父母却在为名声付出代价。","kind":"text"},{"t":197.27,"en":"It would never again be possible for them to lead normal lives.","zh":"他们再也无法过上正常的生活了。","kind":"text"},{"t":202.2,"en":"They had become the victims of commercialization, for their names had acquired a market value.","zh":"他们成了商业化的受害者，因为他们的名字已经有了市场价值。","kind":"text"},{"t":210.25,"en":"Instead of being five new family members, these children had immediately become a commodity.","zh":"这些孩子不再是五个新的家庭成员，而是立刻变成了商品。","kind":"text"}]},{"id":"NCE3-46","book":"NCE3","bookCn":"第三册","num":46,"title":"Do It Yourself","slug":"46.Do It Yourself","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/46.Do%20It%20Yourself.mp3","sentenceCount":37,"wordCount":539,"lines":[{"t":0.49,"en":"Lesson 46","zh":"第46课","kind":"lesson"},{"t":2.61,"en":"Do it yourself","zh":"自己动手","kind":"title"},{"t":9.29,"en":"Did the writer repair his lawn mower in the end? Why/Why not?","zh":"作者最终修好了他的割草机吗？为什么/为什么不？","kind":"question"},{"t":16.95,"en":"So great is our passion for doing things for ourselves,","zh":"我们自己动手做事情的热情如此高涨，","kind":"text"},{"t":21.4,"en":"that we are becoming increasingly less dependent on specialized labour.","zh":"以至于我们对专业劳动的依赖越来越少。","kind":"text"},{"t":27.22,"en":"No one can plead ignorance of a subject any longer, for there are countless do-it-yourself publications.","zh":"任何人不能再声称对某事一无所知了，因为有无数的自己动手刊物。","kind":"text"},{"t":35.22,"en":"Armed with the right tools and materials, newlyweds gaily embark on the task of decorating their own homes.","zh":"新婚夫妇带着合适的工具和材料，愉快地着手装饰自己的家园。","kind":"text"},{"t":43.7,"en":"Men, particularly, spend hours of their leisure time installing their own fireplaces,","zh":"男人们，尤其是，花费数小时的闲暇时间安装自己的壁炉，","kind":"text"},{"t":50.59,"en":"laying out their own gardens; building garages and making furniture.","zh":"布置自己的花园；建造车库和制作家具。","kind":"text"},{"t":56.23,"en":"Some really keen enthusiasts go so far as to build their own computers.","zh":"一些真正热心的爱好者甚至自己组装电脑。","kind":"text"},{"t":62.48,"en":"Shops cater for the do-it-yourself craze not only by running special advisory services for novices,","zh":"商店为了迎合这种自己动手热潮，不仅为新手提供专门的咨询服务，","kind":"text"},{"t":70.21,"en":"but by offering consumers bits and pieces which they can assemble at home.","zh":"而且还向消费者提供他们可以在家组装的零配件。","kind":"text"},{"t":75.74,"en":"Such things provide an excellent outlet for pent up creative energy, but unfortunately not all of us are born handymen.","zh":"这样的事情为积压的创造性精力提供了很好的发泄途径，但不幸的是，我们并非所有人都是天生的巧匠。","kind":"text"},{"t":86.47,"en":"Some wives tend to believe that their husbands are infinitely resourceful and can fix anything.","zh":"一些妻子倾向于认为她们的丈夫足智多谋，什么都能修好。","kind":"text"},{"t":93.94,"en":"Even men who can hardly drive a nail in straight are supposed to be born electricians, carpenters, plumbers and mechanics.","zh":"即使那些连钉子都钉不直的男人，也被认为是天生的电工、木匠、水管工和机械师。","kind":"text"},{"t":103.52,"en":"When lights fuse, furniture gets rickety, pipes get clogged, or vacuum cleaners fail to operate,","zh":"当灯泡烧坏、家具摇晃、管道堵塞或吸尘器无法工作时，","kind":"text"},{"t":111.83,"en":"some women assume that their husbands will somehow put things right.","zh":"一些女人会认为她们的丈夫总会把事情弄好。","kind":"text"},{"t":116.51,"en":"The worst thing about the do-it-yourself game is that sometimes even men live under the delusion that they can do anything,","zh":"自己动手游戏的糟糕之处在于，有时连男人也活在自己无所不能的错觉中，","kind":"text"},{"t":125.2,"en":"even when they have repeatedly been proved wrong.","zh":"即使他们一再被证明是错的。","kind":"text"},{"t":129.05,"en":"It is a question of pride as much as anything else.","zh":"这更多的是一个面子问题。","kind":"text"},{"t":133.1,"en":"Last spring my wife suggested that I call in a man to look at our lawn mower.","zh":"去年春天，我妻子建议我请人来修理我们的割草机。","kind":"text"},{"t":139.3,"en":"It had broken down the previous summer, and though I promised to repair it, I had never got round to it.","zh":"它在前一个夏天坏了，虽然我答应修理，但一直没空动手。","kind":"text"},{"t":147.78,"en":"I would not hear of the suggestion and said that I would fix it myself.","zh":"我不听她的建议，说我会自己修好它。","kind":"text"},{"t":153.7,"en":"One Saturday afternoon, I hauled the machine into the garden and had a close look at it.","zh":"一个星期六下午，我把机器拖到花园里仔细查看。","kind":"text"},{"t":160.45,"en":"As far as I could see, it needed only a minor adjustment:","zh":"据我所见，它只需要做一些小调整：","kind":"text"},{"t":165.27,"en":"a turn of a screw here, a little tightening up there, a drop of oil and it would be as good as new.","zh":"这里拧一下螺丝，那里紧一紧，再滴一滴油，就会焕然一新。","kind":"text"},{"t":173.88,"en":"Inevitably the repair job was not quite so simple.","zh":"不可避免地，这项修理工作远没有那么简单。","kind":"text"},{"t":179.04,"en":"The mower firmly refused to mow, so I decided to dismantle it.","zh":"割草机坚决不肯割草，所以我决定把它拆开。","kind":"text"},{"t":185.22,"en":"The garden was soon littered with chunks of metal which had once made up a lawn mower.","zh":"花园里很快就散落着曾经组成割草机的金属碎片。","kind":"text"},{"t":192.99,"en":"But I was extremely pleased with myself. I had traced the cause of the trouble.","zh":"但我对自己非常满意。我找到了故障的原因。","kind":"text"},{"t":198.61,"en":"One of the links in the chain that drives the wheels had snapped.","zh":"驱动车轮的链条上的一环断裂了。","kind":"text"},{"t":203.64,"en":"After buying a new chain I was faced with the insurmountable task of putting the confusing jigsaw puzzle together again.","zh":"买了一条新链条后，我面临着一项无法克服的任务：把这个令人困惑的拼图重新组装起来。","kind":"text"},{"t":214.7,"en":"I was not surprised to find that the machine still refused to work after I had reassembled it,","zh":"我重新组装好机器后，发现它仍然无法工作，对此我并不感到惊讶，","kind":"text"},{"t":222.35,"en":"for the simple reason that I was left with several curiously shaped bits of metal which did not seem to fit anywhere.","zh":"理由很简单，我剩下了一些形状奇特的金属零件，似乎哪里也安不上。","kind":"text"},{"t":232.44,"en":"I gave up in despair.","zh":"我绝望地放弃了。","kind":"text"},{"t":235.01,"en":"The weeks passed and the grass grew.","zh":"几周过去了，草长高了。","kind":"text"},{"t":238.12,"en":"When my wife nagged me to do something about it,","zh":"当我妻子唠叨我该做些什么时，","kind":"text"},{"t":241.52,"en":"I told her that either I would have to buy a new mower or let the grass grow.","zh":"我告诉她，要么我买一台新割草机，要么就让草长着。","kind":"text"},{"t":246.91,"en":"Needless to say our house is now surrounded by a jungle.","zh":"不用说，我们的房子现在被一片丛林包围着。","kind":"text"},{"t":251.75,"en":"Buried somewhere in deep grass there is a rusting lawn mower which I have promised to repair one day.","zh":"某个地方，在深草丛中埋着一台生锈的割草机，我曾承诺有一天会把它修好。","kind":"text"}]},{"id":"NCE3-47","book":"NCE3","bookCn":"第三册","num":47,"title":"Too High a Price","slug":"47.Too High a Price","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/47.Too%20High%20a%20Price.mp3","sentenceCount":34,"wordCount":485,"lines":[{"t":0.24,"en":"Lesson 47","zh":"第47课","kind":"lesson"},{"t":2.45,"en":"Too high a price?","zh":"代价太高了吗？","kind":"title"},{"t":9.98,"en":"What does the writer describe as an 'amusing old-fashioned source of noise' ?","zh":"作者把什么描述为“一个有趣的、老式的噪音来源”？","kind":"question"},{"t":18.65,"en":"Pollution is the price we pay for an overpopulated, overindustrialized planet.","zh":"污染是人口过剩、过度工业化的地球所付出的代价。","kind":"text"},{"t":25.49,"en":"When you come to think about it, there are only four ways you can deal with rubbish:","zh":"仔细想想，处理垃圾只有四种方法：","kind":"text"},{"t":30.76,"en":"dump it, burn it, turn it into something you can use again, attempt to produce less of it.","zh":"倾倒、焚烧、回收利用，或者试图减少垃圾产量。","kind":"text"},{"t":37.73,"en":"We keep trying all four methods, but sheer volume of rubbish we produce worldwide threatens to overwhelm us.","zh":"我们一直在尝试这四种方法，但全球垃圾的巨大产量正威胁着要将我们淹没。","kind":"text"},{"t":48.1,"en":"Rubbish, however, is only part of the problem of polluting our planet.","zh":"然而，垃圾只是污染地球问题的一部分。","kind":"text"},{"t":53.5,"en":"The need to produce ever increasing quantities of cheap food leads to a different kind of pollution.","zh":"生产日益增长的廉价食物的需求导致了另一种污染。","kind":"text"},{"t":60.99,"en":"Industriallized farming metheods produce cheap meat products: beef, pork and chicken.","zh":"工业化农业方法生产廉价肉类产品：牛肉、猪肉和鸡肉。","kind":"text"},{"t":68.21,"en":"The use of pesticides and fertilizers produces cheap grain and vegetables.","zh":"杀虫剂和化肥的使用生产廉价谷物和蔬菜。","kind":"text"},{"t":74.44,"en":"The price we pay for cheap food may be already too high:","zh":"我们为廉价食物付出的代价可能已经太高了：","kind":"text"},{"t":79.63,"en":"Mad Cow Disease (BSE) in cattle, salmonella in chicken and eggs, and listeria in dairy products.","zh":"牛身上的疯牛病（BSE），鸡肉和鸡蛋中的沙门氏菌，以及奶制品中的李斯特菌。","kind":"text"},{"t":89.65,"en":"And if you think you'll abandon meat and become a vegetarian,","zh":"如果你认为你会放弃肉类成为素食者，","kind":"text"},{"t":93.86,"en":"you have the choice of very expensive organically-grown vegetables","zh":"你可以选择非常昂贵的有机蔬菜，","kind":"text"},{"t":98.89,"en":"or a steady diet of pesticides every time you think you're eating fresh salads and vegetables,","zh":"或者每次你以为在吃新鲜沙拉和蔬菜时，都伴随着大量的农药，","kind":"text"},{"t":105.59,"en":"or just having an innocent glass of water!","zh":"或者仅仅是喝一杯纯净的水！","kind":"text"},{"t":109.6,"en":"However, there is an even more insidious kind of pollution that particularly affects urban area and invades our daily lives, and that is noise.","zh":"然而，还有一种更阴险的污染，它尤其影响城市地区并侵入我们的日常生活，那就是噪音。","kind":"text"},{"t":122.48,"en":"Burglar alarms going off at any time of the day or night serve only to annoy passers-by and actually assist burglars to burgle.","zh":"昼夜不停响起的防盗警报只会惹恼路人，并实际上帮助窃贼入室盗窃。","kind":"text"},{"t":133.1,"en":"Car alarms constantly scream at us in the street and are a source of profound irritation.","zh":"汽车警报在街上不断对我们尖叫，是极度恼人的来源。","kind":"text"},{"t":140.09,"en":"A recent survey of the effects of noise revealed (surprisingly?)","zh":"最近一项关于噪音影响的调查显示（令人惊讶的是？）","kind":"text"},{"t":145.37,"en":"that dogs barking incessantly in the night rated the highest form of noise pollution on a scale ranging from 1 to 7.","zh":"狗在夜间不停吠叫被评为1到7级噪音污染中最高的形式。","kind":"text"},{"t":155.37,"en":"The survey revealed a large number of sources of noise that we really dislike.","zh":"该调查揭示了许多我们真正不喜欢的噪音来源。","kind":"text"},{"t":161.79,"en":"Lawn mowers whining on a summer's day, late-night parties in apartment blocks,","zh":"夏日里割草机的嗡嗡声，公寓楼里的深夜派对，","kind":"text"},{"t":167.97,"en":"noisy neighbours, vehicles of all kinds,","zh":"吵闹的邻居，各种车辆，","kind":"text"},{"t":171.51,"en":"especially large container trucks thundering through quiet villages,","zh":"特别是大型集装箱卡车轰隆隆地穿过宁静的村庄，","kind":"text"},{"t":176.23,"en":"planes and helicopters flying overhead, large radios carried round in public places and played at maximum volume.","zh":"飞机和直升机从头顶飞过，公共场所里大声播放的收音机。","kind":"text"},{"t":186.3,"en":"New technology has also made its own contribution to noise.","zh":"新技术也对噪音有所“贡献”。","kind":"text"},{"t":191.44,"en":"A lot of people object to mobile phones, especially when they are used in public places like restaurant or on public transport.","zh":"很多人反对手机，尤其是在餐馆或公共交通工具等公共场所使用手机。","kind":"text"},{"t":201.69,"en":"Loud conversations on mobile phones invade our thoughts or interrupt the pleasure of meeting friends for a quiet chat.","zh":"手机上的大声对话侵扰我们的思绪，或者打断我们与朋友安静聊天的乐趣。","kind":"text"},{"t":211.17,"en":"The noise pollution survey revealed a rather surprising and possibly amusing old-fashioned source of noise.","zh":"噪音污染调查揭示了一个相当令人惊讶且可能有趣的、老式的噪音来源。","kind":"text"},{"t":219.9,"en":"It turned out to be snoring! Men were found to be the worst offenders.","zh":"结果是打鼾！男性被发现是最大的“罪魁祸首”。","kind":"text"},{"t":226.22,"en":"It was revealed that 20% of men in their mid-thirties snore.","zh":"调查显示，20%的三十多岁男性会打鼾。","kind":"text"},{"t":232.06,"en":"This figure rises to a staggering 60% of men in their sixties.","zh":"这个数字在六十多岁男性中飙升至惊人的60%。","kind":"text"},{"t":238.26,"en":"Against these figures, it was found that only 5% of women snore regularly,","zh":"与这些数字相比，只有5%的女性会规律性打鼾，","kind":"text"},{"t":244.52,"en":"while the rest are constantly woken or kept awake by their trumpeting partners.","zh":"而其余的女性则不断地被她们打鼾的伴侣吵醒或保持清醒。","kind":"text"},{"t":251.34,"en":"Whatever the source of noise, one thing is certain: silence, it seems, has become a golden memory.","zh":"无论噪音来源是什么，有一件事是肯定的：宁静，似乎已成为一段美好的回忆。","kind":"text"}]},{"id":"NCE3-48","book":"NCE3","bookCn":"第三册","num":48,"title":"The Silent Village","slug":"48.The Silent Village","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/48.The%20Silent%20Village.mp3","sentenceCount":36,"wordCount":540,"lines":[{"t":0.43,"en":"Lesson 48","zh":"第48课","kind":"lesson"},{"t":2.45,"en":"The silent village","zh":"寂静的村庄","kind":"title"},{"t":10.01,"en":"Why was the village silent?","zh":"村庄为什么寂静？","kind":"question"},{"t":14.61,"en":"In this much-travelled world, there are still thousands of places which are inaccessible to tourists.","zh":"在这个人们频繁往来的世界上，仍然有成千上万个旅游者望而却步的地方。","kind":"text"},{"t":23.07,"en":"We always assume that villagers in remote places are friendly and hospitable.","zh":"我们总是认为，住在偏远地方的村民是友好而殷勤好客的。","kind":"text"},{"t":29.74,"en":"But people who are cut off not only from foreign tourists, but even from their own countrymen can be hostile to travellers.","zh":"但是，那些不仅与外国旅游者隔绝，甚至与本国同胞也隔绝的人们，却可能对旅游者怀有敌意。","kind":"text"},{"t":40.02,"en":"Visits to really remote villages are seldom enjoyable--as my wife and I discovered during a tour through the Balkans.","zh":"访问真正偏僻的村庄，很少有什么乐趣可言——我和我妻子在巴尔干半岛旅行时就发现了这一点。","kind":"text"},{"t":48.81,"en":"We had spent several days in a small town and visited a number of old churches in the vicinity.","zh":"我们在一个小镇上呆了几天，参观了附近的一些古老的教堂。","kind":"text"},{"t":56.13,"en":"These attracted many visitors, for they were not only of great architectural interest, but contained a large number of beautifully preserved frescoes as well.","zh":"这些教堂吸引了许多旅游者，因为它们不仅有很高的建筑价值，而且还保存了大量的制作精美的壁画。","kind":"text"},{"t":67.95,"en":"On the day before our departure, several bus loads of tourists descended on the town.","zh":"在我们动身的前一天，好几车游客涌入了小镇。","kind":"text"},{"t":74.5,"en":"This was more than we could bear, so we decided to spend our last day exploring the countryside.","zh":"这太让我们受不了了，于是我们决定最后一天到乡下去。","kind":"text"},{"t":82.86,"en":"Taking a path which led out of the town, we crossed a few fields until we came to a dense wood.","zh":"我们沿着一条从小镇延伸出去的小路，穿过几片田地，来到一片茂密的树林。","kind":"text"},{"t":90.38,"en":"We expected the path to end abruptly, but we found that it traced its way through the trees.","zh":"我们本以为小路会突然中断，不料它却在树林中蜿蜒而行。","kind":"text"},{"t":98.22,"en":"We tramped through the wood for over two hours until we arrived at a deep stream.","zh":"我们在树林里跋涉了两个多小时，来到一条很深的溪流前。","kind":"text"},{"t":104.54,"en":"We could see that the path continued on the other side, but we had no idea how we could get across the stream.","zh":"我们看到小路在对岸延伸，但不知道怎样才能穿过溪流。","kind":"text"},{"t":113.5,"en":"Suddenly my wife spotted a boat moored to the bank.","zh":"突然，我妻子发现了一条系在岸边的船。","kind":"text"},{"t":117.76,"en":"In it there was a boatman fast asleep.","zh":"船上有一个船夫，睡得很熟。","kind":"text"},{"t":121.38,"en":"We gently woke him up and asked him to ferry us to the other side.","zh":"我们轻轻地把他叫醒，请他把我们摆渡到对岸。","kind":"text"},{"t":126.67,"en":"Though he was reluctant to do so at first, we eventually persuaded him to take us.","zh":"虽然他开始不情愿，但我们最终说服他带我们过去了。","kind":"text"},{"t":133.23,"en":"The path led to a tiny village perched on the steep sides of a mountain.","zh":"小路通向一个坐落在陡峭山腰上的小村庄。","kind":"text"},{"t":139.39,"en":"The place consisted of a straggling unmade road which was lined on either side by small houses.","zh":"这个地方只有一条弯弯曲曲的土路，两旁是些小房子。","kind":"text"},{"t":146.93,"en":"Even under a clear blue sky, the village looked forbidding, as all the houses were built of grey mud bricks.","zh":"即使在晴朗的蓝天下，这个村庄看上去也令人望而生畏，因为所有的房子都是用灰色土坯建造的。","kind":"text"},{"t":156.09,"en":"The village seemed deserted,","zh":"村庄似乎空无一人，","kind":"text"},{"t":158.49,"en":"the only sign of life being an ugly-looking black goat on a short length of rope tied to a tree in a field nearby.","zh":"唯一的生命迹象是在附近的一块田地里，有一只拴在树上的黑山羊，它被短绳系着，面目丑陋。","kind":"text"},{"t":169.12,"en":"Sitting down on a dilapidated wooden fence near the field, we opened a couple of tins of sardines and had a picnic lunch.","zh":"我们在田边一处破旧的木栅栏旁坐了下来，打开了两罐沙丁鱼罐头，吃起了野餐。","kind":"text"},{"t":178.85,"en":"All at once, I noticed that my wife seemed to be filled with alarm.","zh":"突然，我注意到我妻子好像惊恐万状。","kind":"text"},{"t":184.72,"en":"Looking up I saw that we were surrounded by children in rags who were looking at us silently as we ate.","zh":"我抬起头，看到我们已经被一群衣衫褴褛的孩子围住了，他们一言不发地看着我们吃东西。","kind":"text"},{"t":193.3,"en":"We offered them food and spoke to them kindly, but they remained motionless.","zh":"我们给他们食物，和善地对他们说话，但他们仍然一动不动。","kind":"text"},{"t":199.93,"en":"I concluded that they were simply shy of strangers.","zh":"我断定他们只是害羞，不愿见陌生人。","kind":"text"},{"t":204.12,"en":"When we later walked down the main street of the village, we were followed by a silent procession of children.","zh":"后来我们沿着村里的主要街道走去，一群默默无声的孩子跟在我们后面。","kind":"text"},{"t":212.46,"en":"The village which had seemed deserted, immediately came to life.","zh":"这个村庄，本来似乎空无一人，立刻变得活跃起来。","kind":"text"},{"t":218.24,"en":"Faces appeared at windows.","zh":"窗户里出现了脸庞。","kind":"text"},{"t":220.4,"en":"Men in shirt sleeves stood outside their houses and glared at us.","zh":"穿着衬衫的男人站在屋外，怒视着我们。","kind":"text"},{"t":225.78,"en":"Old women in black shawls peered at us from doorways.","zh":"披着黑色披肩的老妇人从门道里窥视着我们。","kind":"text"},{"t":230.73,"en":"The most frightening thing of all was that not a sound could be heard.","zh":"最令人恐惧的是，一点声音都听不到。","kind":"text"},{"t":236.64,"en":"There was no doubt that we were unwelcome visitors.","zh":"毫无疑问，我们是不受欢迎的客人。","kind":"text"},{"t":241.54,"en":"We needed no further warning.","zh":"我们不再需要更多的警告了。","kind":"text"},{"t":244.25,"en":"Turning back down the main street,","zh":"我们转身沿着主要街道往回走，","kind":"text"},{"t":246.6,"en":"we quickened our pace and made our way rapidly towards the stream where we hoped the boatman was waiting.","zh":"加快了脚步，迅速朝小溪走去，我们希望船夫还在那里等着。","kind":"text"}]},{"id":"NCE3-49","book":"NCE3","bookCn":"第三册","num":49,"title":"The Ideal Servant","slug":"49.The Ideal Servant","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/49.The%20Ideal%20Servant.mp3","sentenceCount":38,"wordCount":514,"lines":[{"t":0.31,"en":"Lesson 49","zh":"第49课","kind":"lesson"},{"t":2.34,"en":"The ideal servant","zh":"理想的仆人","kind":"title"},{"t":9.9,"en":"What was Bessie's 'little weakness' ?","zh":"贝茜的“小缺点”是什么？","kind":"question"},{"t":14.96,"en":"It is a good thing my aunt Harriet died years ago.","zh":"幸好我姑妈哈里特在多年前就去世了。","kind":"text"},{"t":18.97,"en":"If she were alive today she would not be able to air her views on her favourite topic of conversation: domestic servants.","zh":"如果她今天还活着，她就不能再对她最喜欢的话题——佣人——发表意见了。","kind":"text"},{"t":29.25,"en":"Aunt Harriet lived in that leisurely age when servants were employed to do housework.","zh":"哈里特姑妈生活在那个悠闲的时代，那时人们雇佣仆人来做家务。","kind":"text"},{"t":35.42,"en":"She had a huge, rambling country house called 'The Gables'.","zh":"她有一幢名叫“山墙”的巨大而凌乱的乡村别墅。","kind":"text"},{"t":40.36,"en":"She was sentimentally attached to this house,","zh":"她对这所房子感情深厚，","kind":"text"},{"t":43.82,"en":"for even though it was far too big for her needs, she persisted in living there long after her husband's death.","zh":"因为尽管它对她来说太大了，但在她丈夫去世后很久，她仍然坚持住在那里。","kind":"text"},{"t":52.82,"en":"Before she grew old, aunt Harriet used to entertain lavishly.","zh":"在她变老之前，哈里特姑妈经常大摆宴席。","kind":"text"},{"t":57.84,"en":"I often visited The Gables when I was a boy.","zh":"我小时候经常去“山墙”探望。","kind":"text"},{"t":61.45,"en":"No matter how many guests were present, the great house was always immaculate.","zh":"无论有多少客人，这幢大房子总是 immaculate（一尘不染的）。","kind":"text"},{"t":67.62,"en":"The parquet floors shone like mirrors;","zh":"镶木地板擦得像镜子一样亮；","kind":"text"},{"t":70.94,"en":"highly polished silver was displayed in gleaming glass cabinets;","zh":"擦得锃亮的银器摆放在闪闪发光的玻璃橱柜里；","kind":"text"},{"t":76.31,"en":"even my uncle's huge collection of books was kept miraculously free from dust.","zh":"甚至我叔叔那一大批藏书也奇迹般地没有沾上一点灰尘。","kind":"text"},{"t":83.38,"en":"Aunt Harriet presided over an invisible army of servants that continuously scrubbed, cleaned, and polished.","zh":"哈里特姑妈统管着一支无形的仆人队伍，他们不停地擦洗、清洁、打磨。","kind":"text"},{"t":92.83,"en":"She always referred to them as 'the shifting population',","zh":"她总是称他们为“流动人口”，","kind":"text"},{"t":97.88,"en":"for they came and went with such frequency that I never even got a chance to learn their names.","zh":"因为他们来去匆匆，我甚至都没机会记住他们的名字。","kind":"text"},{"t":105.56,"en":"Though my aunt pursued what was, in those days an enlightened policy,","zh":"尽管我姑妈在那时实行着一项开明的政策，","kind":"text"},{"t":111.26,"en":"in that she never allowed her domestic staff to work more than eight hours a day, she was extremely difficult to please.","zh":"即她从不允许她的家政人员每天工作超过八小时，但她还是非常难以取悦。","kind":"text"},{"t":120.28,"en":"While she always criticized the fickleness of human nature,","zh":"虽然她总是批评人性的反复无常，","kind":"text"},{"t":124.95,"en":"she carried on an unrelenting search for the ideal servant to the end of her days,","zh":"但她毕生都在不懈地寻找理想的仆人，","kind":"text"},{"t":132.1,"en":"even after she had been sadly disillusioned by Bessie.","zh":"即使在她被贝茜伤透了心之后也是如此。","kind":"text"},{"t":137.29,"en":"Bessie worked for aunt Harriet for three years.","zh":"贝茜为哈里特姑妈工作了三年。","kind":"text"},{"t":141.04,"en":"During that time she so gained my aunt's confidence, that she was put in charge of the domestic staff.","zh":"在此期间，她深得姑妈的信任，被任命为家政人员的负责人。","kind":"text"},{"t":149.03,"en":"Aunt Harriet could not find words to praise Bessie's industriousness and efficiency.","zh":"哈里特姑妈对贝茜的勤劳和效率赞不绝口。","kind":"text"},{"t":156.05,"en":"In addition to all her other qualifications, Bessie was an expert cook.","zh":"除了她所有的其他优点，贝茜还是一位烹饪专家。","kind":"text"},{"t":162.1,"en":"She acted the role of the perfect servant for three years before Aunt Harriet discovered her 'little weakness'.","zh":"她扮演了三年完美仆人的角色，直到哈里特姑妈发现了她的“小缺点”。","kind":"text"},{"t":170.67,"en":"After being absent from The Gables for a week,","zh":"在离开“山墙”一周后，","kind":"text"},{"t":173.84,"en":"my aunt unexpectedly returned one afternoon with a party of guests and instructed Bessie to prepare dinner.","zh":"姑妈在一个下午 unexpectedly（出乎意料地）带着一群客人回来了，并吩咐贝茜准备晚餐。","kind":"text"},{"t":182.21,"en":"Not only was the meal well below the usual standard, but Bessie seemed unable to walk steadily.","zh":"晚餐不仅远低于平时的水准，而且贝茜似乎无法稳稳地走路。","kind":"text"},{"t":189.97,"en":"She bumped into the furniture and kept mumbling about the guests.","zh":"她撞到了家具，嘴里不停地咕哝着关于客人的话。","kind":"text"},{"t":194.83,"en":"When she came in with the last course--a huge pudding--she tripped on the carpet","zh":"当她端着最后一道菜——一个巨大的布丁——进来时，她在地毯上绊了一跤，","kind":"text"},{"t":201.08,"en":"and the pudding went flying through the air, narrowly missed my aunt, and crashed on the dining table with considerable force.","zh":"布丁飞了起来，险些砸到我姑妈，然后重重地摔在了餐桌上。","kind":"text"},{"t":211.31,"en":"Though this caused great mirth among the guests, Aunt Harriet was horrified.","zh":"尽管这让客人们大笑，但哈里特姑妈却吓坏了。","kind":"text"},{"t":218.37,"en":"She reluctantly came to the conclusion that Bessie was drunk.","zh":"她 reluctantly（不情愿地）得出结论：贝茜喝醉了。","kind":"text"},{"t":223.37,"en":"The guests had, of course, realized this from the moment Bessie opened the door for them and, long before the final catastrophe,","zh":"客人们当然从贝茜为他们开门的那一刻起就意识到了这一点，而且早在最后一场灾难发生之前，","kind":"text"},{"t":233.35,"en":"had had a difficult time trying to conceal their amusement.","zh":"他们就一直在努力掩饰自己的 amused（好笑）。","kind":"text"},{"t":238.04,"en":"The poor girl was dismissed instantly.","zh":"这个可怜的女孩被立刻解雇了。","kind":"text"},{"t":241.69,"en":"After her departure, Aunt Harriet discovered that there were piles of empty wine bottles of all shapes and sizes neatly stacked in what had once been Bessie's wardrobe.","zh":"在她离开后，哈里特姑妈发现，曾是贝茜衣柜的地方，整齐地堆放着各种形状和大小的空酒瓶。","kind":"text"},{"t":254.97,"en":"They had mysteriously found their way there from the wine cellar!","zh":"它们神秘地从酒窖里“溜”到了那里！","kind":"text"}]},{"id":"NCE3-50","book":"NCE3","bookCn":"第三册","num":50,"title":"New Year Resolutions","slug":"50.New Year Resolutions","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/50.New%20Year%20Resolutions.mp3","sentenceCount":36,"wordCount":530,"lines":[{"t":0.52,"en":"Lesson 50","zh":"第50课","kind":"lesson"},{"t":2.79,"en":"New Year resolutions","zh":"新年决心","kind":"title"},{"t":10.99,"en":"What marked the end of the writer's New Year resolutions?","zh":"是什么标志着作者的新年决心的终结？","kind":"question"},{"t":16.81,"en":"The New Year is a time for resolutions.","zh":"新年是制定决心的时候。","kind":"text"},{"t":19.91,"en":"Mentally, at least, most of us could compile formidable lists of 'dos' and 'don'ts'.","zh":"至少在心理上，我们大多数人都能列出一长串“该做”和“不该做”的事情。","kind":"text"},{"t":27.54,"en":"The same old favourites recur year in year out with monotonous regularity.","zh":"那些老掉牙的旧习惯年复一年地以单调的规律重现。","kind":"text"},{"t":34.27,"en":"We resolve to get up earlier each morning, eat less,","zh":"我们下决心每天早起，少吃，","kind":"text"},{"t":38.35,"en":"find more time to play with the children, do a thousand and one jobs about the house,","zh":"抽出更多时间陪孩子们玩，做成千上万件家务，","kind":"text"},{"t":44.12,"en":"be nice to people we don't like, drive carefully, and take the dog for a walk every day.","zh":"对不喜欢的人和善，小心驾驶，以及每天遛狗。","kind":"text"},{"t":51.73,"en":"Past experience has taught us that certain accomplishments are beyond attainment.","zh":"过去的经验告诉我们，有些成就是无法实现的。","kind":"text"},{"t":57.86,"en":"If we remain inveterate smokers, it is only because we have so often experienced the frustration that results from failure.","zh":"如果我们仍是老烟枪，那只是因为我们屡次体验了失败带来的挫折感。","kind":"text"},{"t":67.83,"en":"Most of us fail in our efforts at self-improvement because our schemes are too ambitious and we never have time to carry them out.","zh":"我们大多数人在自我改进方面都失败了，因为我们的计划过于雄心勃勃，我们根本没有时间去实施。","kind":"text"},{"t":77.37,"en":"We also make the fundamental error of announcing our resolutions to everybody","zh":"我们还犯了一个根本性的错误，那就是向所有人宣布我们的决心，","kind":"text"},{"t":83.01,"en":"so that we look even more foolish when we slip back into our bad old ways.","zh":"这样当我们故态复萌时，就会显得更加愚蠢。","kind":"text"},{"t":89.2,"en":"Aware of these pitfalls, this year I attempted to keep my resolutions to myself.","zh":"意识到这些陷阱，今年我试图把我的决心藏在心里。","kind":"text"},{"t":96.21,"en":"I limited myself to two modest ambitions: to do physical exercises every morning and to read more of an evening.","zh":"我只限制自己两个适度的抱负：每天早上做体育锻炼，晚上多读书。","kind":"text"},{"t":106.61,"en":"An all-night party on New Year's Eve provided me with a good excuse for not carrying out either of these new resolutions on the first day of the year,","zh":"新年前夜的通宵派对给了我一个很好的借口，让我在新年第一天没有执行这两项新决心，","kind":"text"},{"t":117.9,"en":"but on the second, I applied myself assiduously to the task.","zh":"但在第二天，我勤奋地投入到这项任务中。","kind":"text"},{"t":123.67,"en":"The daily exercises lasted only eleven minutes and I proposed to do them early in the morning before anyone had got up.","zh":"每天的锻炼只持续11分钟，我打算在大家起床之前一大早做。","kind":"text"},{"t":133.4,"en":"The self-discipline required to drag myself out of bed 11 minutes earlier than usual was considerable.","zh":"要比平时早11分钟把自己从床上拽起来，需要的自律性是相当大的。","kind":"text"},{"t":141.74,"en":"Nevertheless, I managed to creep down into the living room for two days before anyone found me out.","zh":"尽管如此，我还是设法偷偷溜到客厅里去了两天，才被人发现。","kind":"text"},{"t":151.03,"en":"After jumping about on the carpet and twisting the human frame into uncomfortable positions,","zh":"在地毯上跳来跳去，把身体扭曲成不舒服的姿势之后，","kind":"text"},{"t":157.82,"en":"I sat down at the breakfast table in an exhausted condition.","zh":"我筋疲力尽地坐到早餐桌旁。","kind":"text"},{"t":162.89,"en":"It was this that betrayed me.","zh":"就是这个把我出卖了。","kind":"text"},{"t":165.78,"en":"The next morning the whole family trooped in to watch the performance.","zh":"第二天早上，全家人都跑进来观看表演。","kind":"text"},{"t":170.51,"en":"That was really unsettling but I fended off the taunts and jibes of the family good-humouredly and soon everybody got used to the idea.","zh":"这确实让人不安，但我还是好脾气地抵挡住了家人的嘲讽和揶揄，很快大家就习惯了。","kind":"text"},{"t":180.4,"en":"However, my enthusiasm waned.","zh":"然而，我的热情消退了。","kind":"text"},{"t":183.85,"en":"The time I spent at exercises gradually diminished.","zh":"我花在锻炼上的时间逐渐减少。","kind":"text"},{"t":187.67,"en":"Little by little the eleven minutes fell to zero.","zh":"渐渐地，那11分钟变成了零。","kind":"text"},{"t":192.29,"en":"By January 10th, I was back to where I had started from.","zh":"到了1月10日，我又回到了起点。","kind":"text"},{"t":197.33,"en":"I argued that if I spent less time exhausting myself at exercises in the morning,","zh":"我辩解说，如果早上少花点时间在锻炼上把自己搞得精疲力尽，","kind":"text"},{"t":203.54,"en":"I would keep my mind fresh for reading when I got home from work.","zh":"那么我下班回家时，头脑会更清醒，可以用来阅读。","kind":"text"},{"t":208.32,"en":"Resisting the hypnotizing effect of television,","zh":"抵制住电视的催眠作用，","kind":"text"},{"t":212.16,"en":"I sat in my room for a few evenings with my eyes glued to a book.","zh":"有几个晚上，我坐在房间里，眼睛紧盯着一本书。","kind":"text"},{"t":217.18,"en":"One night, however, feeling cold and lonely, I went downstairs and sat in front of the television pretending to read.","zh":"然而，有一天晚上，我感到又冷又寂寞，于是下楼坐在电视机前假装看书。","kind":"text"},{"t":227.05,"en":"That proved to be my undoing, for I soon got back to my old bad habit of dozing off in front of the screen.","zh":"那被证明是我的失败，因为我很快又回到了在屏幕前打瞌睡的旧习惯。","kind":"text"},{"t":237.32,"en":"I still haven't given up my resolution to do more reading.","zh":"我还没有放弃多读书的决心。","kind":"text"},{"t":241.22,"en":"In fact, I have just bought a book entitled How to Read a Thousand Words a Minute.","zh":"事实上，我刚买了一本名为《如何一分钟阅读一千字》的书。","kind":"text"},{"t":248.7,"en":"Perhaps it will solve my problem, but I just haven't had time to read it!","zh":"也许它能解决我的问题，但我就是没时间读它！","kind":"text"}]},{"id":"NCE3-51","book":"NCE3","bookCn":"第三册","num":51,"title":"Predicting the Future","slug":"51.Predicting the Future","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/51.Predicting%20the%20Future.mp3","sentenceCount":34,"wordCount":453,"lines":[{"t":0.34,"en":"Lesson 51","zh":"第51课","kind":"lesson"},{"t":3.53,"en":"Predicting the future","zh":"预测未来","kind":"title"},{"t":10.26,"en":"What was the 'future' electronic development that Leon Bagrit wasn't able to foresee?","zh":"莱昂·巴格里特未能预见到的“未来”电子发展是什么？","kind":"question"},{"t":19.4,"en":"Predicting the future is notoriously difficult.","zh":"预测未来是出了名的困难。","kind":"text"},{"t":23.21,"en":"Who could have imagined, in the mid 1970s, for example,","zh":"举例来说，在20世纪70年代中期，谁能想到，","kind":"text"},{"t":28.33,"en":"that by the end of the 20th century, computers would be as common in people's homes as TV sets?","zh":"到20世纪末，电脑在人们家中会像电视机一样普及？","kind":"text"},{"t":36.23,"en":"In the 1970s, computers were common enough,","zh":"在20世纪70年代，电脑已经很常见了，","kind":"text"},{"t":40.83,"en":"but only in big business, government departments and large organizations.","zh":"但只存在于大企业、政府部门和大型机构中。","kind":"text"},{"t":47.2,"en":"These were the so-called mainframe machines.","zh":"这些就是所谓的“大型机”。","kind":"text"},{"t":52.06,"en":"Mainframe computers were very large indeed often occupying whole air-conditioned rooms,","zh":"大型机确实非常大，常常占据整个空调房间，","kind":"text"},{"t":59.08,"en":"employing full-time technicians and run on specially-written software.","zh":"雇用全职技术人员，并运行专门编写的软件。","kind":"text"},{"t":65.11,"en":"Though these large machines still exist,","zh":"尽管这些大型机器仍然存在，","kind":"text"},{"t":68.14,"en":"many of their functions have been taken over by small powerful personal computers, commonly known as PCs.","zh":"但它们的许多功能已被小型、强大的个人电脑（通常称为PC）所取代。","kind":"text"},{"t":78.12,"en":"In 1975, a primitive machine called the Altair, was launched in the USA.","zh":"1975年，一台名为Altair的原始机器在美国问世。","kind":"text"},{"t":86.54,"en":"It can properly be described as the first 'home computer' and it pointed the way to the future.","zh":"它完全可以被称为第一台“家用电脑”，它指明了未来的方向。","kind":"text"},{"t":93.58,"en":"This was followed, at the end of the 1970s, by a machine called an Apple.","zh":"随后，在20世纪70年代末，一台名为Apple的机器问世。","kind":"text"},{"t":101.09,"en":"In the early 1980s, the computer giant, IBM produced the world's first Personal Computer.","zh":"在20世纪80年代初，电脑巨头IBM生产了世界上第一台个人电脑。","kind":"text"},{"t":109.76,"en":"This ran on an 'operating system' called DOS,","zh":"它运行在一个名为DOS的“操作系统”上，","kind":"text"},{"t":114.15,"en":"produced by a then small company named Microsoft.","zh":"由当时一家名为微软的小公司开发。","kind":"text"},{"t":119.19,"en":"The IBM Personal Computer was widely copied.","zh":"IBM个人电脑被广泛复制。","kind":"text"},{"t":123.75,"en":"From those humble beginnings,","zh":"从这些不起眼的开端，","kind":"text"},{"t":126.11,"en":"we have seen the development of the user-friendly home computers and multimedia machines which are in common use today.","zh":"我们看到了今天普遍使用的用户友好的家用电脑和多媒体机器的发展。","kind":"text"},{"t":136.32,"en":"Considering how recent these developments are, it is even more remarkable that as long ago as the 1960s, an Englishman,","zh":"考虑到这些发展是如此之新，更令人称奇的是，早在20世纪60年代，一位名叫","kind":"text"},{"t":147.52,"en":"Leon Bagrit, was able to predict some of the uses of computers which we know today.","zh":"莱昂·巴格里特的英国人就能预言我们今天所知道的一些电脑用途。","kind":"text"},{"t":154.98,"en":"Bagrit dismissed the idea that computers would learn to 'think' for themselves and would 'rule the world', which people liked to believe in those days.",
