":69.92,"en":"'No,' she answered.","zh":"“不，”她答道。","kind":"text"},{"t":72.94,"en":"In despair, I asked her whether she was enjoying her dinner.","zh":"绝望中，我问她是否喜欢她的晚餐。","kind":"text"},{"t":78.5,"en":"'Young man,' she answered,","zh":"“年轻人，”她回答说，","kind":"text"},{"t":81.7,"en":"'if you ate more and talked less, we would both enjoy our dinner!'","zh":"“如果你多吃点，少说点，我们俩都会享受晚餐的！”","kind":"text"}]},{"id":"NCE2-41","book":"NCE2","bookCn":"第二册","num":41,"title":"Do You Call That a Hat","slug":"41.Do You Call That a Hat","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/41.Do%20You%20Call%20That%20a%20Hat.mp3","sentenceCount":13,"wordCount":146,"lines":[{"t":11.52,"en":"What kind of shopping does the writer enjoy, do you think?","zh":"你认为作者喜欢哪种购物方式？","kind":"question"},{"t":17.83,"en":"'Do you call that a hat?' I said to my wife.","zh":"“你管那玩意儿叫帽子？”我对妻子说。","kind":"text"},{"t":22.99,"en":"'You needn't be so rude about it,'","zh":"“你没必要这么粗鲁，”","kind":"text"},{"t":26.28,"en":"my wife answered as she looked at herself in the mirror.","zh":"妻子对着镜子看着自己，回答道。","kind":"text"},{"t":31.68,"en":"I sat down on one of those modern chairs with holes in it and waited.","zh":"我坐在一把带洞的现代椅子上，等着。","kind":"text"},{"t":37.94,"en":"We had been in the hat shop for half an hour and my wife was still in front of the mirror.","zh":"我们已经在帽子店里待了半个小时了，妻子还在镜子前面。","kind":"text"},{"t":45.5,"en":"'We mustn't buy things we don't need,' I remarked suddenly.","zh":"“我们不该买不需要的东西，”我突然说道。","kind":"text"},{"t":51.39,"en":"I regretted saying it almost at once.","zh":"我几乎立刻就后悔说了这句话。","kind":"text"},{"t":55.47,"en":"'You needn't have said that,' my wife answered.","zh":"“你本没必要说那些话的，”妻子回答道。","kind":"text"},{"t":59.98,"en":"'I needn't remind you of that terrible tie you bought yesterday.'","zh":"“我也没必要提醒你昨天买的那条糟糕的领带。”","kind":"text"},{"t":65.85,"en":"'I find it beautiful,' I said. 'A man can never have too many ties.'","zh":"“我觉得它很漂亮，”我说，“男人永远不嫌领带多。”","kind":"text"},{"t":73.4,"en":"'And a woman can't have too many hats,' she answered.","zh":"“女人也永远不嫌帽子多，”她回答道。","kind":"text"},{"t":79.07,"en":"Ten minutes later we walked out of the shop together.","zh":"十分种后，我们一起走出了商店。","kind":"text"},{"t":83.84,"en":"My wife was wearing a hat that looked like a lighthouse!","zh":"妻子戴着一顶看起来像灯塔一样的帽子！","kind":"text"}]},{"id":"NCE2-42","book":"NCE2","bookCn":"第二册","num":42,"title":"Not Very Musical","slug":"42.Not Very Musical","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/42.Not%20Very%20Musical.mp3","sentenceCount":14,"wordCount":142,"lines":[{"t":10.09,"en":"What happened when the snake charmer began to play jazz?","zh":"耍蛇人开始演奏爵士乐时发生了什么？","kind":"question"},{"t":16.24,"en":"As we had had a long walk through one of the markets of old Delhi,","zh":"我们在老德里的一处市场走了很长一段路之后，","kind":"text"},{"t":22.01,"en":"we stopped at a square to have a rest.","zh":"在一个广场停下来休息。","kind":"text"},{"t":26.05,"en":"After a time, we noticed a snake charmer with","zh":"过了一会儿，我们注意到广场的另一边有位耍蛇人，","kind":"text"},{"t":29.8,"en":"two large baskets at the other side of the square,","zh":"带着两个大篮子。","kind":"text"},{"t":34.06,"en":"so we went to have a look at him.","zh":"于是我们走过去看他。","kind":"text"},{"t":37.59,"en":"As soon as he saw us,","zh":"他一看到我们，","kind":"text"},{"t":39.85,"en":"he picked up a long pipe which was covered with coins and opened one of the baskets.","zh":"便拿起一根盖满硬币的长笛，打开了一个篮子。","kind":"text"},{"t":47.11,"en":"When he began to play a tune,","zh":"当他开始吹奏曲子时，","kind":"text"},{"t":49.89,"en":"we had our first glimpse of the snake.","zh":"我们第一次瞥见了那条蛇。","kind":"text"},{"t":53.85,"en":"It rose out of the basket and began to follow the movements of the pipe.","zh":"它从篮子里钻出来，开始跟着长笛的动作舞动。","kind":"text"},{"t":60.19,"en":"We were very much surprised when the snake charmer","zh":"当耍蛇人突然开始演奏爵士乐和现代流行歌曲时，","kind":"text"},{"t":63.81,"en":"suddenly began to play jazz and modern pop songs.","zh":"我们感到非常惊讶。","kind":"text"},{"t":69.41,"en":"The snake, however, continued to 'dance' slowly.","zh":"然而，那条蛇却继续缓慢地“跳舞”。","kind":"text"},{"t":74.53,"en":"It obviously could not tell the difference between Indian music and jazz!","zh":"它显然分辨不出印度音乐和爵士乐的区别！","kind":"text"}]},{"id":"NCE2-43","book":"NCE2","bookCn":"第二册","num":43,"title":"Over the South Pole","slug":"43.Over the South Pole","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/43.Over%20the%20South%20Pole.mp3","sentenceCount":13,"wordCount":145,"lines":[{"t":10.69,"en":"How was the plane able to clear the mountains?","zh":"飞机是如何能够越过山脉的？","kind":"question"},{"t":15.88,"en":"In 1929, three years after his flight over the North Pole,","zh":"1929年，在他飞越北极三年后，","kind":"text"},{"t":22.78,"en":"the American explorer, R.E. Byrd,","zh":"美国探险家R.E.伯德，","kind":"text"},{"t":27.04,"en":"successfully flew over the South Pole for the first time.","zh":"首次成功飞越了南极。","kind":"text"},{"t":32.03,"en":"Though, at first, Byrd and his men were able to take a","zh":"虽然起初，伯德和他的队员们能够拍摄到","kind":"text"},{"t":37.06,"en":"great many photographs of the mountains that lay below,","zh":"许多下方山脉的照片，","kind":"text"},{"t":42.09,"en":"they soon ran into serious trouble.","zh":"但他们很快就遇到了严重的麻烦。","kind":"text"},{"t":46.01,"en":"At one point, it seemed certain that their plane would crash.","zh":"有一刻，他们的飞机似乎肯定会坠毁。","kind":"text"},{"t":51.39,"en":"It could only get over the mountains if it rose to 10, 000 feet.","zh":"只有当飞机上升到10,000英尺时，才能越过山脉。","kind":"text"},{"t":57.71,"en":"Byrd at once ordered his men to throw out two heavy food sacks.","zh":"伯德立即命令他的队员们扔掉两个沉重的食物袋。","kind":"text"},{"t":64.15,"en":"The plane was then able to rise and it cleared the mountains by 400 feet.","zh":"飞机随后得以升高，并以400英尺的高度越过了山脉。","kind":"text"},{"t":71.03,"en":"Byrd now knew that he would be able to reach the South Pole which was 300 miles away,","zh":"伯德现在知道他将能够抵达300英里外的南极，","kind":"text"},{"t":78.78,"en":"for there were no more mountains in sight.","zh":"因为视线中没有更多的山脉了。","kind":"text"},{"t":82.53,"en":"The aircraft was able to fly over the endless white plains without difficulty.","zh":"飞机能够毫不费力地飞越无尽的白色平原。","kind":"text"}]},{"id":"NCE2-44","book":"NCE2","bookCn":"第二册","num":44,"title":"Through the Forest","slug":"44.Through the Forest","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/44.Through%20the%20Forest.mp3","sentenceCount":15,"wordCount":145,"lines":[{"t":10.02,"en":"How did Mrs. Sterling get her bag back?","zh":"斯特林夫人是如何找回她的包的？","kind":"question"},{"t":15.23,"en":"Mrs. Anne Sterling did not think of the risk","zh":"安妮·斯特林夫人没有考虑到她所冒的风险，","kind":"text"},{"t":18.74,"en":"she was taking when she ran through a forest after two men.","zh":"当她穿过森林追赶两个男人时。","kind":"text"},{"t":24.91,"en":"They had rushed up to her while she was having a picnic at the edge of a forest","zh":"当她和孩子们在森林边缘野餐时，他们冲了过来，","kind":"text"},{"t":30.39,"en":"with her children and tried to steal her handbag.","zh":"试图偷走她的手提包。","kind":"text"},{"t":35.01,"en":"In the struggle, the strap broke and,","zh":"在搏斗中，包带断了，","kind":"text"},{"t":38.4,"en":"with the bag in their possession,","zh":"包落到了他们手里，","kind":"text"},{"t":41.12,"en":"both men started running through the trees.","zh":"两人便开始穿过树林逃跑。","kind":"text"},{"t":45.45,"en":"Mrs. Sterling got so angry that she ran after them.","zh":"斯特林夫人非常生气，她追了上去。","kind":"text"},{"t":51.07,"en":"She was soon out of breath,","zh":"她很快就气喘吁吁，","kind":"text"},{"t":53.23,"en":"but she continued to run.","zh":"但她继续奔跑。","kind":"text"},{"t":56.22,"en":"When she caught up with them,","zh":"当她追上他们时，","kind":"text"},{"t":58.28,"en":"she saw that they had sat down and were going through the contents of the bag,","zh":"她看到他们已经坐了下来，正在翻看包里的东西，","kind":"text"},{"t":64.5,"en":"so she ran straight at them.","zh":"于是她直接向他们冲过去。","kind":"text"},{"t":67.81,"en":"The men got such a fright that they dropped the bag and ran away.","zh":"男人们吓了一跳，扔下包就跑了。","kind":"text"},{"t":74.75,"en":"'The strap needs mending,' said Mrs. Sterling later, 'but they did not steal anything.'","zh":"“包带需要修一下，”斯特林夫人后来表示，“但他们什么也没偷走。”","kind":"text"}]},{"id":"NCE2-45","book":"NCE2","bookCn":"第二册","num":45,"title":"A Clear Conscience","slug":"45.A Clear Conscience","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/45.A%20Clear%20Conscience.mp3","sentenceCount":14,"wordCount":142,"lines":[{"t":10.18,"en":"How did Sam get his money back?","zh":"萨姆是怎么把钱找回来的？","kind":"question"},{"t":14.7,"en":"The whole village soon learnt that a large sum of money had been lost.","zh":"整个村子很快就知道一大笔钱丢了。","kind":"text"},{"t":21.01,"en":"Sam Benton, the local butcher,","zh":"当地屠夫萨姆·本顿","kind":"text"},{"t":24.33,"en":"had lost his wallet while taking his savings to the post office.","zh":"在去邮局存钱的路上丢了钱包。","kind":"text"},{"t":30.29,"en":"Sam was sure that the wallet must have been found by one of the villagers,","zh":"萨姆确信钱包一定是被村里人捡走了，","kind":"text"},{"t":36.74,"en":"but it was not returned to him.","zh":"但一直没有还给他。","kind":"text"},{"t":40.43,"en":"Three months passed, and then one morning, Sam found his wallet outside his front door.","zh":"三个月过去了，一天早上，萨姆在自家门外发现了他的钱包。","kind":"text"},{"t":49.07,"en":"It had been wrapped up in newspaper and it contained half the money he had lost,","zh":"钱包用报纸包着，里面有他丢失的一半钱，","kind":"text"},{"t":56.09,"en":"together with a note which said:","zh":"还有一张纸条，上面写着：","kind":"text"},{"t":59.06,"en":"'A thief, yes, but only 50 per cent a thief!'","zh":"“我是个小偷，但只算50%的小偷！”","kind":"text"},{"t":65.13,"en":"Two months later,","zh":"两个月后，","kind":"text"},{"t":66.81,"en":"some more money was sent to Sam with another note:","zh":"又有一些钱连同另一张纸条寄给了萨姆：","kind":"text"},{"t":72.12,"en":"'Only 25 per cent a thief now!'","zh":"“现在我只算25%的小偷了！”","kind":"text"},{"t":76.32,"en":"In time, all Sam's money was paid back in this way.","zh":"渐渐地，萨姆所有的钱都以这种方式还了回来。","kind":"text"},{"t":82.34,"en":"The last note said: 'I am 100 per cent honest now!'","zh":"最后一张纸条写着：“我现在是100%的诚实人！”","kind":"text"}]},{"id":"NCE2-46","book":"NCE2","bookCn":"第二册","num":46,"title":"Expensive and Uncomfortable","slug":"46.Expensive and Uncomfortable","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/46.Expensive%20and%20Uncomfortable.mp3","sentenceCount":13,"wordCount":147,"lines":[{"t":11.39,"en":"What did the man in this story do?","zh":"这个故事里的男人做了什么？","kind":"question"},{"t":16.15,"en":"When a plane from London arrived at Sydney airport,","zh":"当一架从伦敦起飞的飞机抵达悉尼机场时，","kind":"text"},{"t":20.66,"en":"workers began to unload a number of wooden boxes which contained clothing.","zh":"工人们开始卸下一些装有衣服的木箱。","kind":"text"},{"t":27.95,"en":"No one could account for the fact that one of the boxes was extremely heavy.","zh":"没有人能解释其中一个箱子异常沉重的原因。","kind":"text"},{"t":35.42,"en":"It suddenly occurred to one of the workers to open up the box.","zh":"其中一个工人突然想到要打开那个箱子。","kind":"text"},{"t":41.62,"en":"He was astonished at what he found.","zh":"他对自己的发现感到震惊。","kind":"text"},{"t":45.57,"en":"A man was lying in the box on top of a pile of woollen goods.","zh":"一个人躺在箱子里，在一堆羊毛制品上面。","kind":"text"},{"t":52.41,"en":"He was so surprised at being discovered that he did not even try to run away.","zh":"他被发现时非常惊讶，甚至没有试图逃跑。","kind":"text"},{"t":60.85,"en":"After he was arrested,","zh":"他被捕后，","kind":"text"},{"t":63.1,"en":"the man admitted hiding in the box before the plane left London.","zh":"这个人承认在飞机离开伦敦之前藏进了箱子里。","kind":"text"},{"t":70.06,"en":"He had had a long and uncomfortable trip,","zh":"他经历了一次漫长而不舒服的旅行，","kind":"text"},{"t":74.62,"en":"for he had been confined to the wooden box for over eighteen hours.","zh":"因为他被关在木箱里超过十八个小时。","kind":"text"},{"t":81.89,"en":"The man was ordered to pay ￡3, 500 for the cost of the trip.","zh":"这个人被勒令支付3,500英镑作为旅行费用。","kind":"text"},{"t":89.89,"en":"The normal price of a ticket is ￡2, 000!","zh":"一张机票的正常价格是2,000英镑！","kind":"text"}]},{"id":"NCE2-47","book":"NCE2","bookCn":"第二册","num":47,"title":"A Thirsty Ghost","slug":"47.A Thirsty Ghost","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/47.A%20Thirsty%20Ghost.mp3","sentenceCount":14,"wordCount":139,"lines":[{"t":10.47,"en":"What evidence is there of a ghost?","zh":"有什么证据证明有鬼？","kind":"question"},{"t":15.82,"en":"A public house which was recently bought by Mr.Ian Thompson is up for sale.","zh":"伊恩·汤普森先生最近购买的一家酒吧正在出售。","kind":"text"},{"t":23.79,"en":"Mr.Thompson is going to sell it because it is haunted.","zh":"汤普森先生打算出售它，因为它闹鬼。","kind":"text"},{"t":29.63,"en":"He told me that he could not go to sleep one night","zh":"他告诉我，一天晚上他无法入睡","kind":"text"},{"t":33.59,"en":"because he heard a strange noise coming from the bar.","zh":"因为他听到酒吧里传来奇怪的声音。","kind":"text"},{"t":38.9,"en":"The next morning,","zh":"第二天早上，","kind":"text"},{"t":40.43,"en":"he found that the doors had been blocked by chairs and the furniture had been moved.","zh":"他发现门被椅子堵住了，家具也被挪动了。","kind":"text"},{"t":47.61,"en":"Though Mr.Thompson had turned the lights off before he went to bed,","zh":"虽然汤普森先生睡前关了灯，","kind":"text"},{"t":53.29,"en":"they were on in the morning.","zh":"但早上却亮着。","kind":"text"},{"t":56.42,"en":"He also said that he had found five empty whisky bottles","zh":"他还说他发现了五个空威士忌酒瓶，","kind":"text"},{"t":61.91,"en":"which the ghost must have drunk the night before.","zh":"一定是那个鬼前一天晚上喝光的。","kind":"text"},{"t":66.68,"en":"When I suggested that some villagers must have come","zh":"当我暗示说一定是一些村民过来","kind":"text"},{"t":70.57,"en":"in for a free drink, Mr.Thompson shook his head.","zh":"免费喝酒时，汤普森先生摇了摇头。","kind":"text"},{"t":76.52,"en":"The villagers have told him that","zh":"村民们告诉他，","kind":"text"},{"t":78.79,"en":"they will not accept the pub even if he gives it away.","zh":"即使他白送，他们也不会接受那家酒吧。","kind":"text"}]},{"id":"NCE2-48","book":"NCE2","bookCn":"第二册","num":48,"title":"Did You Want to Tell Me Something","slug":"48.Did You Want to Tell Me Something","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/48.Did%20You%20Want%20to%20Tell%20Me%20Something.mp3","sentenceCount":11,"wordCount":137,"lines":[{"t":12.07,"en":"Why did the writer become very worried?","zh":"作者为什么变得非常担心？","kind":"question"},{"t":17.48,"en":"Dentists always ask questions when it is impossible for you to answer.","zh":"牙医总是在你无法回答的时候问问题。","kind":"text"},{"t":25.0,"en":"My dentist had just pulled out one of my teeth and had told me to rest for a while.","zh":"我的牙医刚刚拔掉我的一颗牙，并让我休息一会儿。","kind":"text"},{"t":32.31,"en":"I tried to say something,","zh":"我试图说些什么，","kind":"text"},{"t":34.47,"en":"but my mouth was full of cotton wool.","zh":"但我的嘴里塞满了棉花。","kind":"text"},{"t":38.4,"en":"He knew I collected match boxes and asked me whether my collection was growing.","zh":"他知道我收集火柴盒，问我我的收藏是否在增加。","kind":"text"},{"t":44.89,"en":"He then asked me how my brother was and whether I liked my new job in London.","zh":"然后他问我哥哥怎么样，以及我是否喜欢我在伦敦的新工作。","kind":"text"},{"t":52.98,"en":"In answer to these questions I either nodded or made strange noises.","zh":"回答这些问题时，我不是点头就是发出奇怪的声音。","kind":"text"},{"t":60.04,"en":"Meanwhile, my tongue was busy searching out the hole where the tooth had been.","zh":"同时，我的舌头忙着寻找牙齿拔掉后的那个洞。","kind":"text"},{"t":66.94,"en":"I suddenly felt very worried, but could not say anything.","zh":"我突然感到非常担心，却什么也说不出来。","kind":"text"},{"t":73.52,"en":"When the dentist at last removed the cotton wool from my mouth,","zh":"当牙医最终从我嘴里取出棉花时，","kind":"text"},{"t":78.76,"en":"I was able to tell him that he had pulled out the wrong tooth.","zh":"我才得以告诉他他拔错了牙。","kind":"text"}]},{"id":"NCE2-49","book":"NCE2","bookCn":"第二册","num":49,"title":"The End of a Dream","slug":"49.The End of a Dream","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/49.The%20End%20of%20a%20Dream.mp3","sentenceCount":18,"wordCount":169,"lines":[{"t":11.05,"en":"How did the dream end?","zh":"这个梦是怎样结束的呢？","kind":"question"},{"t":15.15,"en":"Tired of sleeping on the floor,","zh":"德黑兰有个年轻人，他睡在地板上，感到厌倦，","kind":"text"},{"t":18.01,"en":"a young man in Teheran saved up for years to buy a real bed.","zh":"于是积蓄了好几年，买了一张真正的床。","kind":"text"},{"t":24.98,"en":"For the first time in his life,","zh":"他生平第一次","kind":"text"},{"t":28.05,"en":"he became the proud owner of a bed which had springs and a mattress.","zh":"拥有了一张带弹簧和床垫的床，他为此感到十分自豪。","kind":"text"},{"t":35.22,"en":"Because the weather was very hot,","zh":"因为天气很热，","kind":"text"},{"t":38.62,"en":"he carried the bed on to the roof of his house.","zh":"他便把床搬到了屋顶上。","kind":"text"},{"t":43.36,"en":"He slept very well for the first two nights,","zh":"头两晚他睡得很好，","kind":"text"},{"t":48.0,"en":"but on the third night, a storm blew up.","zh":"但第三天晚上，暴风雨突然降临。","kind":"text"},{"t":53.12,"en":"A gust of wind swept the bed off the roof and sent it crashing into the courtyard below.","zh":"一阵狂风把床从屋顶上刮了下来，摔到了下面的院子里。","kind":"text"},{"t":62.03,"en":"The young man did not wake up","zh":"那个年轻人直到","kind":"text"},{"t":64.44,"en":"until the bed had struck the ground.","zh":"床撞到地上才醒过来。","kind":"text"},{"t":68.46,"en":"Although the bed was smashed to pieces,","zh":"尽管床摔成了碎片，","kind":"text"},{"t":72.03,"en":"the man was miraculously unhurt.","zh":"但那个人却奇迹般地没有受伤。","kind":"text"},{"t":76.21,"en":"When he woke up, he was still on the mattress.","zh":"他醒来时，仍然躺在床垫上。","kind":"text"},{"t":80.84,"en":"Glancing at the bits of wood and metal that lay around him,","zh":"他看了一眼周围的木头和金属碎片，","kind":"text"},{"t":85.72,"en":"the man sadly picked up the mattress and carried it into his house.","zh":"伤心地抱起床垫，把它搬进了屋里。","kind":"text"},{"t":91.82,"en":"After he had put it on the floor,","zh":"他把床垫放到地板上，","kind":"text"},{"t":94.56,"en":"he promptly went to sleep again.","zh":"便很快又睡着了。","kind":"text"}]},{"id":"NCE2-50","book":"NCE2","bookCn":"第二册","num":50,"title":"Taken for a Ride","slug":"50.Taken for a Ride","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/50.Taken%20for%20a%20Ride.mp3","sentenceCount":20,"wordCount":163,"lines":[{"t":9.59,"en":"Why did the writer not get off the bus at Woodford Green?","zh":"为什么作者没有在伍德福德格林下车？","kind":"question"},{"t":16.09,"en":"I love travelling in the country,","zh":"我喜欢在乡下旅行，","kind":"text"},{"t":18.92,"en":"but I don't like losing my way.","zh":"但我不喜欢迷路。","kind":"text"},{"t":22.63,"en":"I went on an excursion recently,","zh":"我最近去了一次短途旅行，","kind":"text"},{"t":25.41,"en":"but my trip took me longer than I expected.","zh":"但我的旅程比我预期的要长。","kind":"text"},{"t":30.2,"en":"'I'm going to Woodford Green,'","zh":"“我要去伍德福德格林，”","kind":"text"},{"t":32.63,"en":"I said to the conductor as I got on the bus,","zh":"我上车时对售票员说，","kind":"text"},{"t":36.84,"en":"'but I don't know where it is.'","zh":"“但我不知道它在哪里。”","kind":"text"},{"t":40.5,"en":"'I'll tell you where to get off.' answered the conductor.","zh":"“我会告诉你哪里下车。”售票员回答。","kind":"text"},{"t":46.0,"en":"I sat in the front of the bus to get a good view of the countryside.","zh":"我坐在巴士前排，以便更好地欣赏乡村景色。","kind":"text"},{"t":52.18,"en":"After some time, the bus stopped.","zh":"过了一会儿，巴士停了下来。","kind":"text"},{"t":55.92,"en":"Looking round, I realized with a shock that I was the only passenger left on the bus.","zh":"我环顾四周，震惊地发现我是车上唯一的乘客了。","kind":"text"},{"t":64.21,"en":"'You'll have to get off here,'","zh":"“你必须在这里下车，”","kind":"text"},{"t":67.03,"en":"the conductor said. 'This is as far as we go.'","zh":"售票员说。“我们只能到这里了。”","kind":"text"},{"t":72.42,"en":"'Is this Woodford Green?' I asked.","zh":"“这是伍德福德格林吗？”我问道。","kind":"text"},{"t":76.04,"en":"'Oh dear,' said the conductor suddenly.","zh":"“哦，天哪，”售票员突然说道。","kind":"text"},{"t":80.23,"en":"'I forgot to put you off.'","zh":"“我忘了让你下车了。”","kind":"text"},{"t":83.32,"en":"'It doesn't matter,' I said. 'I'll get off here.'","zh":"“没关系，”我说，“我就在这里下车。”","kind":"text"},{"t":88.45,"en":"'We're going back now,' said the conductor.","zh":"“我们现在要回去了，”售票员说。","kind":"text"},{"t":92.68,"en":"'Well, in that case,","zh":"“好吧，既然如此，”","kind":"text"},{"t":94.9,"en":"I prefer to stay on the bus,' I answered.","zh":"我宁愿留在车上，”我回答道。","kind":"text"}]},{"id":"NCE2-51","book":"NCE2","bookCn":"第二册","num":51,"title":"Reward for Virtue","slug":"51.Reward for Virtue","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/51.Reward%20for%20Virtue.mp3","sentenceCount":15,"wordCount":163,"lines":[{"t":10.28,"en":"Why did Hugh's diet not work?","zh":"休的节食为什么没有成功？","kind":"question"},{"t":15.33,"en":"My friend, Hugh, has always been fat,","zh":"我的朋友休一直很胖，","kind":"text"},{"t":19.77,"en":"but things got so bad recently that he decided to go on a diet.","zh":"但最近情况变得如此糟糕，以至于他决定节食。","kind":"text"},{"t":26.32,"en":"He began his diet a week ago.","zh":"他一周前开始节食。","kind":"text"},{"t":29.61,"en":"First of all, he wrote out a long list of all the foods which were forbidden.","zh":"首先，他列出了一长串所有被禁止的食物。","kind":"text"},{"t":36.88,"en":"The list included most of the things Hugh loves:","zh":"清单上包括了休喜欢的大部分东西：","kind":"text"},{"t":41.3,"en":"butter, potatoes, rice, beer, milk, chocolate, and sweets.","zh":"黄油、土豆、米饭、啤酒、牛奶、巧克力和糖果。","kind":"text"},{"t":48.64,"en":"Yesterday I paid him a visit.","zh":"昨天我去看望了他。","kind":"text"},{"t":51.97,"en":"I rang the bell and was not surprised to see that Hugh was still as fat as ever.","zh":"我按响了门铃，毫不意外地看到休仍然和以前一样胖。","kind":"text"},{"t":59.28,"en":"He led me into his room and hurriedly hid a large parcel under his desk.","zh":"他把我带进他的房间，然后匆忙地把一个大包裹藏到书桌下。","kind":"text"},{"t":65.8,"en":"It was obvious that he was very embarrassed.","zh":"显然他感到非常尴尬。","kind":"text"},{"t":70.03,"en":"When I asked him what he was doing,","zh":"当我问他在做什么时，","kind":"text"},{"t":72.7,"en":"he smiled guiltily and then put the parcel on the desk.","zh":"他内疚地笑了笑，然后把包裹放在了书桌上。","kind":"text"},{"t":77.78,"en":"He explained that his diet was so strict that he had to reward himself occasionally.","zh":"他解释说他的节食计划太严格了，所以他偶尔需要奖励一下自己。","kind":"text"},{"t":85.59,"en":"Then he showed me the contents of the parcel.","zh":"接着他给我看了包裹里的东西。","kind":"text"},{"t":89.35,"en":"It contained five large bars of chocolate and three bags of sweets!","zh":"里面有五大块巧克力和三袋糖果！","kind":"text"}]},{"id":"NCE2-52","book":"NCE2","bookCn":"第二册","num":52,"title":"A Pretty Carpet","slug":"52.A Pretty Carpet","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/52.A%20Pretty%20Carpet.mp3","sentenceCount":14,"wordCount":159,"lines":[{"t":9.89,"en":"What is the writer's carpet made of?","zh":"作者的地毯是用什么做的？","kind":"question"},{"t":14.42,"en":"We have just moved into a new house and I have been working hard all morning.","zh":"我们刚搬进一所新房子，我一上午都在忙碌着。","kind":"text"},{"t":22.27,"en":"I have been trying to get my new room in order.","zh":"我一直想把我的新房间整理好。","kind":"text"},{"t":27.17,"en":"This has not been easy because I own over a thousand books.","zh":"这可不容易，因为我拥有一千多本书。","kind":"text"},{"t":34.01,"en":"To make matters worse,","zh":"更糟糕的是，","kind":"text"},{"t":36.02,"en":"the room is rather small,","zh":"房间相当小，","kind":"text"},{"t":38.71,"en":"so I have temporarily put my books on the floor.","zh":"所以我只好暂时把书放在地板上。","kind":"text"},{"t":44.3,"en":"At the moment, they cover every inch of floor space","zh":"这会儿，它们覆盖了地板上的每一寸地方，","kind":"text"},{"t":48.83,"en":"and I actually have to walk on them to get in or out of the room.","zh":"我实际上得踩着它们才能进出房间。","kind":"text"},{"t":55.8,"en":"A short while ago, my sister helped me to carry one of my old bookcases up the stairs.","zh":"不久前，我妹妹帮我把一个旧书柜搬上了楼。","kind":"text"},{"t":64.52,"en":"She went into my room and got a big surprise when she saw all those books on the floor.","zh":"她走进我的房间，当她看到地板上所有的书时，大吃一惊。","kind":"text"},{"t":73.35,"en":"'This is the prettiest carpet I have ever seen,' she said.","zh":"“这是我见过的最漂亮的地毯了，”她说。","kind":"text"},{"t":79.77,"en":"She gazed at it for some time then added,","zh":"她凝视了一会儿，然后补充说，","kind":"text"},{"t":84.03,"en":"'You don't need bookcases at all.","zh":"“你根本不需要书柜。","kind":"text"},{"t":87.25,"en":"You can sit here in your spare time and read the carpet!'","zh":"你可以在业余时间坐在这里，读读这地毯！”","kind":"text"}]},{"id":"NCE2-53","book":"NCE2","bookCn":"第二册","num":53,"title":"Hot Snake","slug":"53.Hot Snake","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/53.Hot%20Snake.mp3","sentenceCount":13,"wordCount":161,"lines":[{"t":10.58,"en":"What caused the fire?","zh":"火灾是由什么引起的？","kind":"question"},{"t":14.44,"en":"At last firemen have put out a big forest fire in California.","zh":"消防队员终于扑灭了加利福尼亚州的一场森林大火。","kind":"text"},{"t":21.11,"en":"Since then, they have been trying to find out how the fire began.","zh":"从那时起，他们一直在努力查明火灾是如何开始的。","kind":"text"},{"t":27.63,"en":"Forest fires are often caused by broken glass or by cigarette ends which people carelessly throw away.","zh":"森林火灾通常是由碎玻璃或人们随意丢弃的烟头引起的。","kind":"text"},{"t":37.96,"en":"Yesterday the firemen examined the ground carefully,","zh":"昨天消防队员仔细检查了地面，","kind":"text"},{"t":42.32,"en":"but were not able to find any broken glass.","zh":"但没能找到任何碎玻璃。","kind":"text"},{"t":46.8,"en":"They were also quite sure that a cigarette end did not start the fire.","zh":"他们也相当确定不是烟头引起的火灾。","kind":"text"},{"t":53.01,"en":"This morning, however, a firemen accidentally discovered the cause.","zh":"然而，今天早上，一名消防队员偶然发现了起火原因。","kind":"text"},{"t":59.38,"en":"He noticed the remains of a snake which was wound round the electric wires of a 16, 000-volt power line.","zh":"他发现了一条缠绕在16000伏高压电线上的蛇的残骸。","kind":"text"},{"t":69.98,"en":"In this way, he was able to solve the mystery.","zh":"就这样，他解开了这个谜团。","kind":"text"},{"t":74.65,"en":"The explanation was simple but very unusual.","zh":"解释很简单，但非常不同寻常。","kind":"text"},{"t":80.03,"en":"A bird had snatched up the snake from the ground and then dropped it on to the wires.","zh":"一只鸟从地上抓起这条蛇，然后把它掉到了电线上。","kind":"text"},{"t":87.83,"en":"The snake then wound itself round the wires.","zh":"然后蛇缠绕在电线上。","kind":"text"},{"t":91.74,"en":"When it did so, it sent sparks down to the ground and these immediately started a fire.","zh":"当它这样做时，它向地面发出了火花，这些火花立刻引发了一场火灾。","kind":"text"}]},{"id":"NCE2-54","book":"NCE2","bookCn":"第二册","num":54,"title":"Sticky Fingers","slug":"54.Sticky Fingers","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/54.Sticky%20Fingers.mp3","sentenceCount":13,"wordCount":169,"lines":[{"t":10.52,"en":"What two interruptions did the writer have?","zh":"作者遇到了哪两次打扰？","kind":"question"},{"t":15.83,"en":"After breakfast, I sent the children to school and then I went to the shops.","zh":"早饭后，我把孩子们送到学校，然后就去商店了。","kind":"text"},{"t":23.02,"en":"It was still early when I returned home.","zh":"我回到家时，时间还早。","kind":"text"},{"t":27.3,"en":"The children were at school, my husband was at work and the house was quiet.","zh":"孩子们在学校，我丈夫去上班了，家里很安静。","kind":"text"},{"t":34.05,"en":"So I decided to make some meat pies.","zh":"于是我决定做些肉馅饼。","kind":"text"},{"t":38.34,"en":"In a short time I was busy mixing butter","zh":"没过多久，我就忙着搅和黄油","kind":"text"},{"t":41.82,"en":"and flour and my hands were soon covered with sticky pastry.","zh":"和面粉，很快我的手上就沾满了黏糊糊的面团。","kind":"text"},{"t":47.98,"en":"At exactly that moment, the telephone rang.","zh":"就在那时，电话铃响了。","kind":"text"},{"t":53.28,"en":"Nothing could have been more annoying.","zh":"没有什么比这更烦人的了。","kind":"text"},{"t":56.75,"en":"I picked up the receiver between two sticky fingers and was dismayed when I recognized the voice of Helen Bates.","zh":"我用两根黏糊糊的手指拿起听筒，当认出海伦·贝茨的声音时，我感到很沮丧。","kind":"text"},{"t":68.01,"en":"It took me ten minutes to persuade her to ring back later. At last I hung up the receiver.","zh":"我花了十分钟才说服她稍后再打来。最后我挂断了电话。","kind":"text"},{"t":77.22,"en":"What a mess! There was pastry on my fingers, on the telephone, and on the doorknobs.","zh":"真是一团糟！我的手指上、电话上、门把手上都沾满了面团。","kind":"text"},{"t":87.01,"en":"I had no sooner got back to the kitchen than the doorbell rang loud enough to wake the dead.","zh":"我刚回到厨房，门铃就响了，声音大得足以把死人吵醒。","kind":"text"},{"t":95.88,"en":"This time it was the postman and he wanted me to sign for a registered letter!","zh":"这次是邮递员，他要我签收一封挂号信！","kind":"text"}]},{"id":"NCE2-55","book":"NCE2","bookCn":"第二册","num":55,"title":"Not a Gold Mine","slug":"55.Not a Gold Mine","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/55.Not%20a%20Gold%20Mine.mp3","sentenceCount":11,"wordCount":165,"lines":[{"t":10.19,"en":"What did the team find?","zh":"团队发现了什么？","kind":"question"},{"t":14.25,"en":"Dreams of finding lost treasure almost came true recently.","zh":"最近，寻找失落宝藏的梦想差点成真。","kind":"text"},{"t":20.36,"en":"A new machine called 'The Revealer' has been invented","zh":"一种名为“揭示者”的新机器被发明出来","kind":"text"},{"t":25.28,"en":"and it has been used to detect gold which has been buried in the ground.","zh":"并且它被用来探测埋在地下的黄金。","kind":"text"},{"t":32.07,"en":"The machine was used in a cave near the seashore where--it is said--pirates used to hide gold.","zh":"这台机器被用在海边的一个洞穴里，据说海盗曾在那儿藏匿黄金。","kind":"text"},{"t":41.97,"en":"The pirates would often bury gold in the cave and then fail to collect it.","zh":"海盗们经常把黄金埋在洞穴里，然后却未能取走。","kind":"text"},{"t":49.07,"en":"Armed with the new machine, a search party went into the cave hoping to find buried treasure.","zh":"带着这台新机器，一支搜索队进入洞穴，希望能找到埋藏的宝藏。","kind":"text"},{"t":57.25,"en":"The leader of the party was examining the soil near the entrance to the cave when the machine showed that there was gold under the ground.","zh":"当机器显示地下有黄金时，搜索队的队长正在检查洞穴入口附近的泥土。","kind":"text"},{"t":68.51,"en":"Very excited, the party dug a hole two feet deep.","zh":"队员们非常兴奋，挖了一个两英尺深的洞。","kind":"text"},{"t":74.14,"en":"They finally found a small gold coin which was almost worthless.","zh":"他们最终发现了一枚几乎毫无价值的小金币。","kind":"text"},{"t":80.66,"en":"The party then searched the whole cave thoroughly but did not find anything except an empty tin trunk.","zh":"随后，队员们彻底搜查了整个洞穴，但除了一个空锡箱外什么也没找到。","kind":"text"},{"t":91.21,"en":"In spite of this, many people are confident that 'The Revealer' may reveal something of value fairly soon.","zh":"尽管如此，许多人仍然相信，“揭示者”很快会揭示出一些有价值的东西。","kind":"text"}]},{"id":"NCE2-56","book":"NCE2","bookCn":"第二册","num":56,"title":"Faster Than Sound","slug":"56.Faster Than Sound","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/56.Faster%20Than%20Sound.mp3","sentenceCount":12,"wordCount":163,"lines":[{"t":10.5,"en":"How fast did the winning car go?","zh":"获胜的赛车开得有多快？","kind":"question"},{"t":15.46,"en":"Once a year, a race is held for old cars.","zh":"每年一度，都会举行一次老爷车比赛。","kind":"text"},{"t":20.93,"en":"A lot of cars entered for this race last year and there was a great deal of excitement just before it began.","zh":"去年，许多汽车报名参加了这场比赛，比赛开始前气氛异常热烈。","kind":"text"},{"t":30.67,"en":"One of the most handsome cars was a Rolls-Royce Silver Ghost.","zh":"其中一辆最漂亮的车是劳斯莱斯“银灵”。","kind":"text"},{"t":36.65,"en":"The most unusual car was a Benz which had only three wheels.","zh":"最不寻常的车是一辆只有三个轮子的奔驰车。","kind":"text"},{"t":43.42,"en":"Built in 1885, it was the oldest car taking part.","zh":"它建于1885年，是参赛车辆中最老的一辆。","kind":"text"},{"t":50.17,"en":"After a great many loud explosions, the race began.","zh":"在一阵阵巨大的轰鸣声之后，比赛开始了。","kind":"text"},{"t":56.11,"en":"Many of the cars broke down on the course and some drivers spent more time under their cars than in them!","zh":"许多汽车在赛道上抛锚了，有些司机待在车底的时间比待在车里的时间还长！","kind":"text"},{"t":65.86,"en":"A few cars, however, completed the race.","zh":"然而，有几辆车完成了比赛。","kind":"text"},{"t":69.7,"en":"The winning car reached a speed of forty miles an hour -- much faster than any of its rivals.","zh":"获胜的赛车达到了每小时40英里的速度——比任何竞争对手都要快得多。","kind":"text"},{"t":78.47,"en":"It sped downhill at the end of the race and its driver had a lot of trouble trying to stop it.","zh":"在比赛结束时，它向下冲刺，司机费了很大的劲才把它停下来。","kind":"text"},{"t":86.04,"en":"The race gave everyone a great deal of pleasure.","zh":"这场比赛给每个人带来了极大的乐趣。","kind":"text"},{"t":90.19,"en":"It was very different from modern car races but no less exciting.","zh":"它与现代汽车比赛大相径庭，但同样激动人心。","kind":"text"}]},{"id":"NCE2-57","book":"NCE2","bookCn":"第二册","num":57,"title":"Can I Help You, Madam","slug":"57.Can I Help You, Madam","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/57.Can%20I%20Help%20You%2C%20Madam.mp3","sentenceCount":15,"wordCount":175,"lines":[{"t":10.74,"en":"Did the woman get what she wanted?","zh":"女人得到了她想要的吗？","kind":"question"},{"t":15.08,"en":"A woman in jeans stood at the window of an expensive shop.","zh":"一个穿着牛仔裤的女人站在一家高档商店的橱窗前。","kind":"text"},{"t":20.6,"en":"Though she hesitated for a moment,","zh":"尽管她犹豫了片刻，","kind":"text"},{"t":23.77,"en":"she finally went in and asked to see a dress that was in the window.","zh":"但她最终还是走了进去，要求看一件陈列在橱窗里的连衣裙。","kind":"text"},{"t":30.33,"en":"The assistant who served her did not like the way she was dressed.","zh":"接待她的店员不喜欢她的穿着打扮。","kind":"text"},{"t":35.88,"en":"Glancing at her scornfully, he told her that the dress was sold.","zh":"他轻蔑地瞥了她一眼，告诉她那件连衣裙已经卖掉了。","kind":"text"},{"t":41.89,"en":"The woman walked out of the shop angrily and decided to punish the assistant next day.","zh":"女人气愤地走出商店，决定第二天惩罚那个店员。","kind":"text"},{"t":48.85,"en":"She returned to the shop the following morning dressed in a fur coat,","zh":"第二天上午，她回到店里，穿了一件裘皮大衣，","kind":"text"},{"t":54.13,"en":"with a handbag in one hand and a long umbrella in the other.","zh":"一只手拿着坤包，另一只手拿着一把长柄伞。","kind":"text"},{"t":60.05,"en":"After seeking out the rude assistant,","zh":"找到那个无礼的店员后，","kind":"text"},{"t":62.91,"en":"she asked for the same dress.","zh":"她又问起那件连衣裙。","kind":"text"},{"t":66.2,"en":"Not realizing who she was, the assistant was eager to serve her this time.","zh":"店员没有认出她，这次却殷勤地为她服务。","kind":"text"},{"t":73.81,"en":"With great difficulty, he climbed into the shop window to get the dress.","zh":"他费了很大的劲儿才爬进橱窗去取那件连衣裙。","kind":"text"},{"t":80.45,"en":"As soon as she saw it, the woman said she did not like it.","zh":"她一看就说不喜欢。","kind":"text"},{"t":86.18,"en":"She enjoyed herself making the assistant bring almost everything in the window","zh":"她让店员把橱窗里几乎所有的东西都拿出来，","kind":"text"},{"t":92.04,"en":"before finally buying the dress she had first asked for.","zh":"最后才买了她第一次看中的那件连衣裙，以此来取乐。","kind":"text"}]},{"id":"NCE2-58","book":"NCE2","bookCn":"第二册","num":58,"title":"A Blessing in Disguise","slug":"58.A Blessing in Disguise","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/58.A%20Blessing%20in%20Disguise.mp3","sentenceCount":12,"wordCount":166,"lines":[{"t":11.01,"en":"Why does the vicar refuse to cut down the tree?","zh":"为什么牧师拒绝砍掉这棵树？","kind":"question"},{"t":16.94,"en":"The tiny village of Frinley is said to possess a 'cursed tree'.","zh":"弗林利这个小村庄据说有一棵“被诅咒的树”。","kind":"text"},{"t":22.89,"en":"Because the tree was mentioned in a newspaper,","zh":"因为这棵树在报纸上被提及，","kind":"text"},{"t":26.47,"en":"the number of visitors to Frinley has now increased.","zh":"弗林利的游客数量现在增加了。","kind":"text"},{"t":31.71,"en":"The tree was planted near the church fifty years ago, but it is only in recent years that it has gained an evil reputation.","zh":"这棵树是五十年前种在教堂附近的，但直到最近几年才声名狼藉。","kind":"text"},{"t":43.07,"en":"It is said that if anyone touches the tree, he will have bad luck; if he picks a leaf, he will die.","zh":"据说如果任何人触摸这棵树，他就会有厄运；如果他摘一片叶子，他就会死去。","kind":"text"},{"t":52.89,"en":"Many villagers believe that the tree has already claimed a number of victims.","zh":"许多村民相信这棵树已经夺走了许多受害者的生命。","kind":"text"},{"t":59.95,"en":"The vicar has been asked to have the tree cut down, but so far he has refused.","zh":"牧师被要求砍掉这棵树，但到目前为止他一直拒绝。","kind":"text"},{"t":68.52,"en":"He has pointed out that the tree is a useful source of income,","zh":"他指出这棵树是一个有用的收入来源，","kind":"text"},{"t":74.13,"en":"as tourists have been coming from all parts of the country to see it.","zh":"因为游客们从全国各地赶来参观它。","kind":"text"},{"t":80.04,"en":"In spite of all that has been said,","zh":"尽管有各种说法，","kind":"text"},{"t":83.23,"en":"the tourists have been picking leaves and cutting their names on the tree-trunk.","zh":"游客们一直在摘叶子并在树干上刻下他们的名字。","kind":"text"},{"t":89.1,"en":"So far, not one of them has been struck down by sudden death!","zh":"到目前为止，他们中没有一个人被突然死亡击倒！","kind":"text"}]},{"id":"NCE2-59","book":"NCE2","bookCn":"第二册","num":59,"title":"In or Out","slug":"59.In or Out","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/59.In%20or%20Out.mp3","sentenceCount":11,"wordCount":159,"lines":[{"t":11.22,"en":"Why did Rex run away?","zh":"雷克斯为什么跑了？","kind":"question"},{"t":15.52,"en":"Our dog, Rex, used to sit outside our front gate and bark.","zh":"我们的狗雷克斯，过去常常坐在前门外面吠叫。","kind":"text"},{"t":22.54,"en":"Every time he wanted to come into the garden he would bark until someone opened the gate.","zh":"每次他想进花园时，都会吠叫，直到有人把门打开。","kind":"text"},{"t":30.39,"en":"As the neighbours complained of the noise, my husband spent weeks training him to press his paw on the latch to let himself in.","zh":"由于邻居们抱怨噪音，我丈夫花了几周时间训练他用爪子按压门闩，好让他自己进来。","kind":"text"},{"t":41.56,"en":"Rex soon became an expert at opening the gate.","zh":"雷克斯很快就成了开门的专家。","kind":"text"},{"t":46.22,"en":"However, when I was going out shopping last week, I noticed him in the garden near the gate.","zh":"然而，上周我外出购物时，注意到他在花园里，靠近门的地方。","kind":"text"},{"t":54.81,"en":"This time he was barking so that someone would let him out!","zh":"这次他在吠叫，好让有人把他放出去！","kind":"text"},{"t":60.09,"en":"Since then, he has developed another bad habit.","zh":"从那时起，他又养成了一个坏习惯。","kind":"text"},{"t":65.1,"en":"As soon as he opens the gate from the outside, he comes into the garden and waits until the gate shuts.","zh":"他一从外面打开门，就走进花园，然后等着门关上。","kind":"text"},{"t":74.07,"en":"Then he sits and barks until someone lets him out.","zh":"然后他坐着吠叫，直到有人把他放出去。","kind":"text"},{"t":78.58,"en":"After this he immediately lets himself in and begins barking again.","zh":"之后他立刻自己进来，又开始吠叫。","kind":"text"},{"t":86.28,"en":"Yesterday my husband removed the gate and Rex got so annoyed we have not seen him since.","zh":"昨天我丈夫把门拆掉了，雷克斯非常生气，从那以后我们就再也没见过他了。","kind":"text"}]},{"id":"NCE2-60","book":"NCE2","bookCn":"第二册","num":60,"title":"The Future","slug":"60.The Future","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/60.The%20Future.mp3","sentenceCount":12,"wordCount":163,"lines":[{"t":9.35,"en":"Does what Madam Bellinsky said come true?","zh":"贝林斯基夫人说的会成真吗？","kind":"question"},{"t":14.66,"en":"At a village fair, I decided to visit a fortune-teller called Madam Bellinsky.","zh":"在一个乡村集市上，我决定去拜访一位名叫贝林斯基夫人的算命师。","kind":"text"},{"t":22.34,"en":"I went into her tent and she told me to sit down.","zh":"我走进她的帐篷，她叫我坐下。","kind":"text"},{"t":27.23,"en":"After I had given her some money, she looked into a crystal ball and said:","zh":"我给了她一些钱后，她看着水晶球说：","kind":"text"},{"t":34.11,"en":"'A relation of yours is coming to see you.","zh":"“你的一位亲戚要来看你。","kind":"text"},{"t":38.29,"en":"She will be arriving this evening and intends to stay for a few days.","zh":"她今晚会到，打算住几天。","kind":"text"},{"t":44.4,"en":"The moment you leave this tent, you will get a big surprise.","zh":"你一离开这个帐篷，就会有一个大惊喜。","kind":"text"},{"t":49.83,"en":"A woman you know well will rush towards you.","zh":"一位你很熟悉的女人会向你跑来。","kind":"text"},{"t":54.18,"en":"She will speak to you and then she will lead you away from this place. That is all.'","zh":"她会和你说话，然后带你离开这个地方。就这些了。”","kind":"text"},{"t":62.4,"en":"As soon as I went outside, I forgot all about Madam Bellinsky because my wife hurried towards me.","zh":"我一出去，就完全把贝林斯基夫人忘在脑后了，因为我妻子匆匆向我走来。","kind":"text"},{"t":71.48,"en":"'Where have you been hiding?' she asked impatiently.","zh":"“你躲到哪里去了？”她不耐烦地问。","kind":"text"},{"t":76.83,"en":"'Your sister will be here in less than an hour and we must be at the station to meet her. We are late already.'","zh":"“你妹妹不到一小时就要到了，我们必须去车站接她。我们已经迟到了。”","kind":"text"},{"t":86.58,"en":"As she walked away, I followed her out of the fair.","zh":"她走开时，我跟着她离开了集市。","kind":"text"}]},{"id":"NCE2-61","book":"NCE2","bookCn":"第二册","num":61,"title":"Trouble with the Hubble","slug":"61.Trouble with the Hubble","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/61.Trouble%20with%20the%20Hubble.mp3","sentenceCount":12,"wordCount":162,"lines":[{"t":10.59,"en":"What is the special importance of a telescope in space?","zh":"望远镜在太空有什么特别的重要性？","kind":"question"},{"t":17.11,"en":"The Hubble telescope was launched into","zh":"哈勃望远镜是","kind":"text"},{"t":19.66,"en":"space by NASA on April 20, 1990 at a cost of over a billion dollars.","zh":"1990年4月20日由美国宇航局发射升空的，耗资10多亿美元。","kind":"text"},{"t":28.68,"en":"Right from the start there was trouble with the Hubble.","zh":"哈勃望远镜从一开始就出了毛病。","kind":"text"},{"t":33.84,"en":"The pictures it sent us were very disappointing because its main mirror was faulty!","zh":"它给我们发回的图片非常令人失望，因为它的主镜有缺陷！","kind":"text"},{"t":41.31,"en":"NASA is now going to put the telescope right,","zh":"美国宇航局现在将把望远镜修复好，","kind":"text"},{"t":45.34,"en":"so it will soon be sending up four astronauts to repair it.","zh":"所以它很快将派4名宇航员上去修复它。","kind":"text"},{"t":51.2,"en":"The shuttle Endeavour will be taking the astronauts to the Hubble.","zh":"“奋进”号航天飞机将把宇航员送往哈勃。","kind":"text"},{"t":56.33,"en":"A robot-arm from the Endeavour will grab the telescope and hold it while the astronauts make the necessary repairs.","zh":"“奋进”号的一个机械臂将抓住望远镜并将其固定住，而宇航员则进行必要的修理。","kind":"text"},{"t":66.35,"en":"Of course, the Hubble is above the earth's atmosphere,","zh":"当然，哈勃望远镜处于地球大气层之外，","kind":"text"},{"t":71.24,"en":"so it will soon be sending us the clearest pictures of the stars and distant galaxies that we have ever seen.","zh":"所以它很快将给我们发回我们从未见过的最清晰的恒星和遥远星系的图片。","kind":"text"},{"t":80.73,"en":"The Hubble will tell us a great deal about the age and size of the universe.","zh":"哈勃望远镜将告诉我们许多关于宇宙的年龄和大小的信息。","kind":"text"},{"t":87.74,"en":"By the time you read this, the Hubble's eagle eye will have sent us thousands and thousands of wonderful pictures.","zh":"当你读到这里时，哈勃的“鹰眼”将已经给我们发回了成千上万张精彩的图片。","kind":"text"}]},{"id":"NCE2-62","book":"NCE2","bookCn":"第二册","num":62,"title":"After the Fire","slug":"62.After the Fire","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/62.After%20the%20Fire.mp3","sentenceCount":12,"wordCount":162,"lines":[{"t":10.3,"en":"What was the danger to the villages after the fire?","zh":"火灾过后，村庄面临的危险是什么？","kind":"question"},{"t":16.43,"en":"Firemen had been fighting the forest fire for nearly three weeks before they could get it under control.","zh":"消防队员们同那场森林大火搏斗了将近3个星期才把火势控制住。","kind":"text"},{"t":24.71,"en":"A short time before, great trees had covered the countryside for miles around.","zh":"不久前，大树还覆盖着周围几英里长的乡村。","kind":"text"},{"t":32.82,"en":"Now, smoke still rose up from the warm ground over the desolate hills.","zh":"如今，烟雾依然从荒凉山丘的温暖地面上冉冉升起。","kind":"text"},{"t":40.73,"en":"Winter was coming on and the hills threatened the surrounding villages with destruction,","zh":"冬天快到了，这些山丘威胁着周围的村庄，要将它们毁灭，","kind":"text"},{"t":48.68,"en":"for heavy rain would not only wash away the soil but would cause serious floods as well.","zh":"因为大雨不仅会冲走泥土，还会引起严重的水灾。","kind":"text"},{"t":56.96,"en":"When the fire had at last been put out,","zh":"大火最终被扑灭后，","kind":"text"},{"t":60.53,"en":"the forest authorities ordered several tons of a special type of grass-seed which would grow quickly.","zh":"森林管理机构订购了几吨很快就能生长的特殊草籽。","kind":"text"},{"t":68.8,"en":"The seed was sprayed over the ground in huge quantities by aeroplanes.","zh":"草籽由飞机大量地撒向地面。","kind":"text"},{"t":75.84,"en":"The planes had been planting seed for nearly a month when it began to rain.","zh":"飞机撒播草籽将近一个月后，天下起了雨。","kind":"text"},{"t":81.84,"en":"By then, however, in many places the grass had already taken root.","zh":"然而，到那时许多地方的草已经生根了。","kind":"text"},{"t":88.38,"en":"In place of the great trees which had been growing there for centuries,","zh":"原本在那里生长了几个世纪的大树，","kind":"text"},{"t":93.66,"en":"patches of green had begun to appear in the blackened soil.","zh":"如今在焦黑的泥土上开始出现一片片绿色。","kind":"text"}]},{"id":"NCE2-63","book":"NCE2","bookCn":"第二册","num":63,"title":"She Was Not Amused","slug":"63.She Was Not Amused","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/63.She%20Was%20Not%20Amused.mp3","sentenceCount":11,"wordCount":159,"lines":[{"t":11.28,"en":"Why did Jenny want to leave the wedding reception?","zh":"珍妮为什么想离开婚宴？","kind":"question"},{"t":16.8,"en":"Jeremy Hampden has a large circle of friends and is very popular at parties.","zh":"杰里米·汉普顿交友甚广，在聚会上很受欢迎。","kind":"text"},{"t":24.2,"en":"Everybody admires him for his great sense of humour--everybody, that is, except his six-year-old daughter, Jenny.","zh":"人人都羡慕他那绝妙的幽默感——人人都羡慕，除了他六岁的女儿珍妮。","kind":"text"},{"t":34.85,"en":"Recently, one of Jeremy's closest friends asked him to make a speech at a wedding reception.","zh":"最近，杰里米的一位最亲密的朋友请他在一个婚宴上讲话。","kind":"text"},{"t":43.1,"en":"This is the sort of thing that Jeremy loves.","zh":"这正是杰里米喜欢做的事情。","kind":"text"},{"t":47.35,"en":"He prepared the speech carefully and went to the wedding with Jenny.","zh":"他精心准备了演讲稿，并和珍妮一起去了婚礼。","kind":"text"},{"t":52.84,"en":"He had included a large number of funny stories in the speech and, of course, it was a great success.","zh":"他在演讲中讲了许多有趣的故事，当然，演讲非常成功。","kind":"text"},{"t":61.52,"en":"As soon as he had finished Jenny told him she wanted to go home.","zh":"演讲刚一结束，珍妮就告诉他她想回家。","kind":"text"},{"t":68.38,"en":"Jeremy was a little disappointed by this but he did as his daughter asked.","zh":"杰里米对此有点失望，但他还是照他女儿的要求做了。","kind":"text"},{"t":74.98,"en":"On the way home, he asked Jenny if she had enjoyed the speech.","zh":"在回家的路上，他问珍妮是否喜欢那个演讲。","kind":"text"},{"t":81.03,"en":"To his surprise she said she hadn't.","zh":"令他惊讶的是，她说她不喜欢。","kind":"text"},{"t":85.1,"en":"Jeremy asked her why this was so and she told him that she did not like to see so many people laughing at him!","zh":"杰里米问她为什么不喜欢，她告诉他她不喜欢看到那么多人嘲笑他！","kind":"text"}]},{"id":"NCE2-64","book":"NCE2","bookCn":"第二册","num":64,"title":"The Channel Tunnel","slug":"64.The Channel Tunnel","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/64.The%20Channel%20Tunnel.mp3","sentenceCount":12,"wordCount":159,"lines":[{"t":10.0,"en":"Why was the first tunnel not completed?","zh":"为什么第一条隧道没有建成？","kind":"question"},{"t":14.67,"en":"In 1858, a French engineer, Aime Thome de Gamond,","zh":"1858年，一位名叫埃梅·托梅·德·加蒙的法国工程师，","kind":"text"},{"t":20.8,"en":"arrived in England with a plan for a 21-mile tunnel under the English Channel.","zh":"带着修建一条21英里长的英吉利海峡隧道的计划抵达英国。","kind":"text"},{"t":27.69,"en":"He said that it would be possible to build a platform in the centre of the Channel.","zh":"他说可以在海峡中央修建一个平台。","kind":"text"},{"t":34.17,"en":"This platform would serve as a port and a railway station.","zh":"这个平台将作为港口和火车站。","kind":"text"},{"t":39.63,"en":"The tunnel would be well-ventilated if tall chimneys were built above sea level.","zh":"如果在海平面以上修建高烟囱，隧道将能很好地通风。","kind":"text"},{"t":46.35,"en":"In 1860, a better plan was put forward by an Englishman, William Low.","zh":"1860年，英国人威廉·洛提出了一个更好的方案。","kind":"text"},{"t":53.93,"en":"He suggested that a double railway-tunnel should be built.","zh":"他建议修建一条双轨铁路隧道。","kind":"text"},{"t":58.66,"en":"This would solve the problem of ventilation for if a train entered this tunnel, it would draw in fresh air behind it.","zh":"这将解决通风问题，因为如果火车进入这条隧道，它会从后面吸入新鲜空气。","kind":"text"},{"t":68.89,"en":"Forty-two years later a tunnel was actually begun.","zh":"四十二年后，一条隧道实际开始动工。","kind":"text"},{"t":73.97,"en":"If, at the time, the British had not feared invasion, it would have been completed.","zh":"如果当时英国人没有害怕入侵，它就会建成。","kind":"text"},{"t":82.13,"en":"The world had to wait almost another 100 years for the Channel Tunnel.","zh":"世界不得不又等了将近100年才等到英吉利海峡隧道。","kind":"text"},{"t":88.61,"en":"It was officially opened on March 7, 1994, finally connecting Britain to the European continent.","zh":"它于1994年3月7日正式开通，最终将英国与欧洲大陆连接起来。","kind":"text"}]},{"id":"NCE2-65","book":"NCE2","bookCn":"第二册","num":65,"title":"Jumbo Versus the Police","slug":"65.Jumbo Versus the Police","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/65.Jumbo%20Versus%20the%20Police.mp3","sentenceCount":11,"wordCount":162,"lines":[{"t":11.07,"en":"Why did the police have to push Jumbo off the main street?","zh":"为什么警察不得不把Jumbo从大街上推开？","kind":"question"},{"t":17.78,"en":"Last Christmas, the circus owner, Jimmy Gates, decided to take some presents to a children's hospital.","zh":"去年圣诞节，马戏团老板吉米·盖茨决定给一家儿童医院送些礼物。","kind":"text"},{"t":26.85,"en":"Dressed up as Father Christmas and accompanied by a 'guard of honour' of six pretty girls,","zh":"他打扮成圣诞老人，由六个漂亮女孩组成的“仪仗队”陪同，","kind":"text"},{"t":34.0,"en":"he set off down the main street of the city riding a baby elephant called Jumbo.","zh":"骑着一头名叫Jumbo的小象，沿着城市的主街出发了。","kind":"text"},{"t":41.6,"en":"He should have known that the police would never allow this sort of thing.","zh":"他本该知道警察绝不会允许这种事情发生。","kind":"text"},{"t":47.87,"en":"A policeman approached Jimmy and told him he ought to have gone along a side street as Jumbo was holding up the traffic.","zh":"一名警察走近吉米，告诉他本该走小巷，因为Jumbo正在阻碍交通。","kind":"text"},{"t":57.78,"en":"Though Jimmy agreed to go at once, Jumbo refused to move.","zh":"尽管吉米同意立即离开，但Jumbo却拒绝移动。","kind":"text"},{"t":64.87,"en":"Fifteen policemen had to push very hard to get him off the main street.","zh":"十五名警察不得不非常用力地推，才把他弄下主街。","kind":"text"},{"t":71.05,"en":"The police had a difficult time, but they were most amused.","zh":"警察们费了好大劲，但他们都觉得很有趣。","kind":"text"},{"t":76.72,"en":"'Jumbo must weigh a few tons,' said a policeman afterwards,","zh":"“Jumbo肯定有几吨重，”一名警察事后说，","kind":"text"},{"t":82.77,"en":"'so it was fortunate that we didn't have to carry him.","zh":"“所以我们不必抬他真是幸运。","kind":"text"},{"t":87.79,"en":"Of course, we should arrest him, but as he has a good record, we shall let him off this time.'","zh":"当然，我们应该逮捕他，但鉴于他表现良好，这次我们就放过他了。”","kind":"text"}]},{"id":"NCE2-66","book":"NCE2","bookCn":"第二册","num":66,"title":"Sweet as Honey","slug":"66.Sweet as Honey","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/66.Sweet%20as%20Honey.mp3","sentenceCount":12,"wordCount":162,"lines":[{"t":10.69,"en":"What was 'sweet as honey' and why?","zh":"什么是“甜如蜂蜜”以及为什么？","kind":"question"},{"t":16.04,"en":"In 1963 a Lancaster bomber crashed on Wallis Island,","zh":"1963年，一架兰开斯特轰炸机坠毁在沃利斯岛，","kind":"text"},{"t":22.41,"en":"a remote place in the South Pacific, a long way west of Samoa.","zh":"一个位于南太平洋的偏远地方，在萨摩亚以西很远。","kind":"text"},{"t":28.6,"en":"The plane wasn't too badly damaged,","zh":"飞机没有损坏得太严重，","kind":"text"},{"t":31.61,"en":"but over the years the crash was forgotten and the wreck remained undisturbed.","zh":"但多年来，这次坠机事件被遗忘，残骸也一直未被触动。","kind":"text"},{"t":38.58,"en":"Then in 1989, twenty-six years after the crash, the plane was accidentally rediscovered in an aerial survey of the island.","zh":"1989年，坠机26年后，在一项对该岛的空中勘测中，这架飞机被意外重新发现。","kind":"text"},{"t":51.34,"en":"By this time, a Lancaster bomber in reasonable condition was rare and worth rescuing.","zh":"此时，一架状况尚可的兰开斯特轰炸机已属罕见，值得营救。","kind":"text"},{"t":59.89,"en":"The French authorities had the plane packaged and moved in parts back to France.","zh":"法国当局将飞机打包，并分批运回法国。","kind":"text"},{"t":66.28,"en":"Now a group of enthusiasts are going to have the plane restored.","zh":"现在，一群爱好者正准备修复这架飞机。","kind":"text"},{"t":71.64,"en":"It has four Rolls-Royce Merlin engines but the group will need to have only three of them rebuilt.","zh":"它有四台劳斯莱斯梅林发动机，但该团队只需要重建其中三台。","kind":"text"},{"t":80.44,"en":"Imagine their surprise and delight when they broke open the packing cases","zh":"想象一下，当他们打开包装箱时，是多么惊喜和高兴，","kind":"text"},{"t":86.63,"en":"and found that the fourth engine was sweet as honey--still in perfect condition.","zh":"发现第四台发动机“甜如蜂蜜”——仍然处于完美状态。","kind":"text"},{"t":94.21,"en":"A colony of bees had turned the engine into a hive and it was totally preserved in beeswax!","zh":"一群蜜蜂把发动机变成了一个蜂巢，它完全被蜂蜡保存了下来！","kind":"text"}]},{"id":"NCE2-67","book":"NCE2","bookCn":"第二册","num":67,"title":"Volcanoes","slug":"67.Volcanoes","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/67.Volcanoes.mp3","sentenceCount":10,"wordCount":165,"lines":[{"t":10.03,"en":"Why does Tazieff risk his life like this?","zh":"为什么塔齐耶夫要这样冒生命危险？","kind":"question"},{"t":15.75,"en":"Haroun Tazieff, the Polish scientist, has spent his lifetime studying active volcanoes and deep caves in all parts of the world.","zh":"波兰科学家哈伦·塔齐耶夫一生都在研究世界各地的活火山和深洞。","kind":"text"},{"t":27.85,"en":"In 1948, he went to Lake Kivu in the Congo to observe a new volcano which he later named Kituro.","zh":"1948年，他去了刚果的基伍湖，观察一座新火山，他后来将其命名为基图罗。","kind":"text"},{"t":39.75,"en":"Tazieff was able to set up his camp very close to the volcano while it was erupting violently.","zh":"塔齐耶夫在火山猛烈喷发时，能够把营地设在离火山很近的地方。","kind":"text"},{"t":49.28,"en":"Though he managed to take a number of brilliant photographs, he could not stay near the volcano for very long.","zh":"尽管他设法拍了许多精彩的照片，但他不能在火山附近待太久。","kind":"text"},{"t":58.83,"en":"He noticed that a river of liquid rock was coming towards him.","zh":"他注意到一条液态岩石的河流正向他涌来。","kind":"text"},{"t":63.93,"en":"It threatened to surround him completely, but Tazieff managed to escape just in time.","zh":"它威胁要将他完全包围，但塔齐耶夫设法及时逃脱了。","kind":"text"},{"t":72.79,"en":"He waited until the volcano became quiet and he was able to return two days later.","zh":"他等到火山平静下来，两天后才得以返回。","kind":"text"},{"t":80.47,"en":"This time, he managed to climb into the mouth of Kituro so that he could take photographs and measure temperatures.","zh":"这次，他设法爬进了基图罗的火山口，以便拍照和测量温度。","kind":"text"},{"t":90.92,"en":"Tazieff has often risked his life in this way.","zh":"塔齐耶夫经常以这种方式冒生命危险。","kind":"text"},{"t":95.69,"en":"He has been able to tell us more about active volcanoes than any man alive.","zh":"他比任何在世的人都能告诉我们更多关于活火山的信息。","kind":"text"}]},{"id":"NCE2-68","book":"NCE2","bookCn":"第二册","num":68,"title":"Persistent","slug":"68.Persistent","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/68.Persistent.mp3","sentenceCount":14,"wordCount":155,"lines":[{"t":10.12,"en":"Why did Elizabeth tell Nigel that she was going to the dentist?","zh":"伊丽莎白为什么告诉奈杰尔她要去看牙医？","kind":"question"},{"t":17.62,"en":"I crossed the street to avoid meeting him but he saw me and came running towards me.","zh":"我穿过街道，想避开他，但他看见了我，朝我跑过来。","kind":"text"},{"t":25.25,"en":"It was no use pretending that I had not seen him, so I waved to him.","zh":"假装没看见他也没用，所以我朝他挥了挥手。","kind":"text"},{"t":32.56,"en":"I never enjoy meeting Nigel Dykes.","zh":"我从不喜欢遇到奈杰尔·戴克斯。","kind":"text"},{"t":36.76,"en":"He never has anything to do.","zh":"他从没有什么事可做。","kind":"text"},{"t":40.34,"en":"No matter how busy you are, he always insists on coming with you.","zh":"不管你有多忙，他总是坚持要和你一起去。","kind":"text"},{"t":47.77,"en":"I had to think of a way of preventing him from following me around all morning.","zh":"我得想个办法阻止他整个上午跟着我。","kind":"text"},{"t":54.8,"en":"'Hello, Nigel,' I said 'Fancy meeting you here!'","zh":"“你好，奈杰尔，”我说，“真巧在这儿见到你！”","kind":"text"},{"t":60.59,"en":"'Hi, Elizabeth,' Nigel answered. 'I was just wondering how to spend the morning--until I saw you.","zh":"“嗨，伊丽莎白，”奈杰尔回答，“我刚才还在想怎么打发这个上午呢——直到我看见你。","kind":"text"},{"t":70.77,"en":"You're not busy doing anything, are you?'","zh":"你没什么事要做吧，是吗？”","kind":"text"},{"t":74.56,"en":"'No, not at all,' I answered. 'I'm going to...'","zh":"“不，一点也不忙，”我回答，“我要去……”","kind":"text"},{"t":79.86,"en":"'Would you mind my coming with you?' he asked, before I had finished speaking.","zh":"“你介意我跟你一起去吗？”他没等我说完就问道。","kind":"text"},{"t":86.53,"en":"'Not at all,' I lied, 'but I'm going to the dentist.'","zh":"“一点也不，”我撒谎说，“不过我要去看牙医。”","kind":"text"},{"t":92.57,"en":"'Then I'll come with you,' he answered.","zh":"“那我跟你一起去，”他回答道。","kind":"text"},{"t":96.02,"en":"'There's always plenty to read in the waiting room!'","zh":"“候诊室里总是有很多东西可以读的！”","kind":"text"}]},{"id":"NCE2-69","book":"NCE2","bookCn":"第二册","num":69,"title":"But not Murder","slug":"69.But not Murder","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/69.But%20not%20Murder.mp3","sentenceCount":12,"wordCount":160,"lines":[{"t":11.05,"en":"Do you think that the writer passed his driving test? Why?","zh":"你认为作者通过驾照考试了吗？为什么？","kind":"question"},{"t":18.03,"en":"I was being tested for a driving licence for the third time.","zh":"我第三次参加驾驶执照考试。","kind":"text"},{"t":23.38,"en":"I had been asked to drive in heavy traffic and had done so successfully.","zh":"我被要求在车辆很多的道路上驾驶，并成功完成了。","kind":"text"},{"t":30.18,"en":"After having been instructed to drive out of town, I began to acquire confidence.","zh":"在被指示开出市区后，我开始有了信心。","kind":"text"},{"t":37.95,"en":"Sure that I had passed, I was almost beginning to enjoy my test.","zh":"确信我已通过，我几乎开始享受我的考试了。","kind":"text"},{"t":45.04,"en":"The examiner must have been pleased with my performance, for he smiled and said, 'Just one more thing Mr. Eames.","zh":"考官一定对我的表现很满意，因为他微笑着说：“还有一件事，伊姆斯先生。","kind":"text"},{"t":55.66,"en":"Let us suppose that a child suddenly crosses the road in front of you.","zh":"假设有个孩子突然从你车前跑过。","kind":"text"},{"t":61.75,"en":"As soon as I tap on the window, you must stop within five feet.'","zh":"我一敲车窗，你必须在五英尺内把车停住。”","kind":"text"},{"t":68.32,"en":"I continued driving and after some time, the examiner tapped loudly.","zh":"我继续驾驶，过了一会儿，考官大声敲击车窗。","kind":"text"},{"t":74.64,"en":"Though the sound could be heard clearly, it took me a long time to react.","zh":"尽管声音听得很清楚，但我过了好一会儿才做出反应。","kind":"text"},{"t":81.62,"en":"I suddenly pressed the brake pedal hard and we were both thrown forward.","zh":"我猛地踩下刹车踏板，结果我们俩都被猛地向前甩去。","kind":"text"},{"t":87.64,"en":"The examiner looked at me sadly.","zh":"考官悲伤地看着我。","kind":"text"},{"t":91.22,"en":"'Mr. Eames,' he said, in a mournful voice, 'you have just killed that child!'","zh":"“伊姆斯先生，”他用悲哀的声音说，“你刚才把那个孩子撞死了！”","kind":"text"}]},{"id":"NCE2-70","book":"NCE2","bookCn":"第二册","num":70,"title":"Red for Danger","slug":"70.Red for Danger","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/70.Red%20for%20Danger.mp3","sentenceCount":13,"wordCount":157,"lines":[{"t":10.54,"en":"How was the drunk removed from the ring?","zh":"醉汉是怎样被弄出斗牛场的？","kind":"question"},{"t":15.52,"en":"During a bullfight, a drunk suddenly wandered into the middle of the ring.","zh":"在一场斗牛中，一个醉汉突然晃晃悠悠地走进斗牛场中央。","kind":"text"},{"t":22.1,"en":"The crowd began to shout, but the drunk was unaware of the danger.","zh":"观众开始大叫，但醉汉全然不知危险。","kind":"text"},{"t":28.65,"en":"The bull was busy with the matador at the time,","zh":"那时，公牛正忙着对付斗牛士，","kind":"text"},{"t":33.03,"en":"but it suddenly caught sight of the drunk who was shouting rude remarks and waving a red cap.","zh":"但它突然发现那个醉汉正在大声说粗话，挥舞着一顶红帽子。","kind":"text"},{"t":41.14,"en":"Apparently sensitive to criticism,","zh":"显然，公牛对批评很敏感，","kind":"text"},{"t":44.66,"en":"the bull forgot all about the matador and charged at the drunk.","zh":"它把斗牛士忘得一干二净，径直向醉汉冲去。","kind":"text"},{"t":50.69,"en":"The crowd suddenly grew quiet.","zh":"观众突然鸦雀无声。","kind":"text"},{"t":54.48,"en":"The drunk, however, seemed quite sure of himself.","zh":"然而，那醉汉好像十分自信。","kind":"text"},{"t":59.38,"en":"When the bull got close to him, he clumsily stepped aside to let it pass.","zh":"当公牛冲到他身边时，他笨拙地闪到一边，让公牛过去。","kind":"text"},{"t":66.51,"en":"The crowd broke into cheers and the drunk bowed.","zh":"观众爆发出阵阵喝彩声，醉汉则鞠躬致意。","kind":"text"},{"t":71.33,"en":"By this time, however three men had come into the ring and they quickly dragged the drunk to safety.","zh":"就在这时，3个人走进斗牛场，他们迅速把醉汉拖到安全地带。","kind":"text"},{"t":80.11,"en":"Even the bull seemed to feel sorry for him,","zh":"好像连公牛都为他感到惋惜，","kind":"text"},{"t":83.79,"en":"for it looked on sympathetically until the drunk was out of the way before once more turning its attention to the matador.","zh":"它一直同情地看着，直到醉汉离开场地才再次把注意力转向斗牛士。","kind":"text"}]},{"id":"NCE2-71","book":"NCE2","bookCn":"第二册","num":71,"title":"A Famous Clock","slug":"71.A Famous Clock","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/71.A%20Famous%20Clock.mp3","sentenceCount":11,"wordCount":159,"lines":[{"t":10.44,"en":"Has Big Ben ever gone wrong?","zh":"大本钟出过错吗？","kind":"question"},{"t":15.41,"en":"When you visit London, one of the first things you will see is Big Ben,","zh":"当你游览伦敦时，首先会看到的是大本钟，","kind":"text"},{"t":21.99,"en":"the famous clock which can be heard all over the world on the B.B.C.","zh":"这个著名的钟，在BBC广播中全世界都能听到。","kind":"text"},{"t":29.08,"en":"If the Houses of Parliament had not been burned down in 1834,","zh":"如果议会大厦在1834年没有被烧毁的话，","kind":"text"},{"t":35.36,"en":"the great clock would never have been erected.","zh":"这个大钟就永远不会被建造。","kind":"text"},{"t":39.87,"en":"Big Ben takes its name from Sir Benjamin Hall who was responsible for the making of the clock when the new Houses of Parliament were being built.","zh":"大本钟的名字来源于本杰明·霍尔爵士，他在建造新议会大厦时负责制造这个钟。","kind":"text"},{"t":52.51,"en":"It is not only of immense size, but is extremely accurate as well.","zh":"它不仅体积巨大，而且极其精确。","kind":"text"},{"t":60.35,"en":"Officials from Greenwich Observatory have the clock checked twice a day.","zh":"格林尼治天文台的官员每天检查这个钟两次。","kind":"text"},{"t":67.17,"en":"On the B.B.C. you can hear the clock when it is actually striking because microphones are connected to the clock tower.","zh":"在BBC广播中，当大本钟报时时，你可以听到它的声音，因为麦克风连接到了钟楼。","kind":"text"},{"t":77.47,"en":"Big Ben has rarely gone wrong.","zh":"大本钟很少出错。","kind":"text"},{"t":81.16,"en":"Once, however, it failed to give the correct time.","zh":"然而，有一次它没能报出正确的时间。","kind":"text"},{"t":86.03,"en":"A painter who had been working on the tower hung a pot of paint on one of the hands and slowed it down!","zh":"一位在钟楼上工作的画家把一罐颜料挂在了其中一根指针上，把它弄慢了！","kind":"text"}]},{"id":"NCE2-72","book":"NCE2","bookCn":"第二册","num":72,"title":"A Car Called Bluebird","slug":"72.A Car Called Bluebird","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/72.A%20Car%20Called%20Bluebird.mp3","sentenceCount":12,"wordCount":168,"lines":[{"t":11.59,"en":"What mistake was made?","zh":"犯了什么错误？","kind":"question"},{"t":15.43,"en":"The great racing driver, Sir Malcolm Campbell, was the first man to drive at over 300 miles per hour.","zh":"伟大的赛车手马尔科姆·坎贝尔爵士是第一个时速超过300英里的人。","kind":"text"},{"t":26.14,"en":"He set up a new world record in September 1935 at Bonneville Salt Flats, Utah.","zh":"他于1935年9月在犹他州博纳维尔盐滩创造了一项新的世界纪录。","kind":"text"},{"t":36.32,"en":"Bluebird, the car he was driving, had been specially built for him.","zh":"他驾驶的赛车“蓝鸟”是专门为他制造的。","kind":"text"},{"t":42.92,"en":"It was over 30 feet in length and had a 2, 500-horsepower engine.","zh":"它长30多英尺，配有2500马力的发动机。","kind":"text"},{"t":50.42,"en":"Although Campbell reached a speed of over 304 miles per hour,","zh":"尽管坎贝尔达到了每小时304英里以上的速度，","kind":"text"},{"t":56.2,"en":"he had great difficulty in controlling the car because a tyre burst during the first run.","zh":"但他很难控制赛车，因为在第一次行驶时，一个轮胎爆裂了。","kind":"text"},{"t":64.39,"en":"After his attempt, Campbell was disappointed to learn that his average speed had been 299 miles per hour.","zh":"尝试结束后，坎贝尔沮丧地得知他的平均速度是每小时299英里。","kind":"text"},{"t":75.53,"en":"However, a few days later, he was told that a mistake had been made.","zh":"然而，几天后，他被告知犯了一个错误。","kind":"text"},{"t":82.11,"en":"His average speed had been 301 miles per hour.","zh":"他的平均速度是每小时301英里。","kind":"text"},{"t":87.54,"en":"Since that time, racing drivers have reached speeds over 600 miles an hour.","zh":"从那时起，赛车手已经达到了每小时600英里以上的速度。","kind":"text"},{"t":95.58,"en":"Following in his father's footsteps many years later, Sir Malcolm's son, Donald, also set up a world record.","zh":"许多年后，马尔科姆爵士的儿子唐纳德也追随父亲的脚步，创造了一项世界纪录。","kind":"text"},{"t":105.91,"en":"Like his father, he was driving a car called Bluebird.","zh":"和他父亲一样，他驾驶的也是一辆名为“蓝鸟”的赛车。","kind":"text"}]},{"id":"NCE2-73","book":"NCE2","bookCn":"第二册","num":73,"title":"The Record-Holder","slug":"73.The Record-Holder","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/73.The%20Record-Holder.mp3","sentenceCount":13,"wordCount":183,"lines":[{"t":10.76,"en":"Did the boy go where he wanted to?","zh":"那个男孩去他想去的地方了吗？","kind":"question"},{"t":15.41,"en":"Children who play truant from school are unimaginative.","zh":"逃学的孩子都缺乏想象力。","kind":"text"},{"t":20.83,"en":"A quiet days' fishing,","zh":"安静地钓上一天鱼，","kind":"text"},{"t":22.88,"en":"or eight hours in a cinema seeing the same film over and over again, is usually as far as they get.","zh":"或者在电影院里看8小时的同一部电影，这通常是他们能做到的最大限度了。","kind":"text"},{"t":32.68,"en":"They have all been put to shame by a boy who, while playing truant travelled 1, 600 miles.","zh":"然而，一个逃学竟走了1600英里的孩子使他们都相形见绌了。","kind":"text"},{"t":42.9,"en":"He hitchhiked to Dover and towards evening went into a boat to find somewhere to sleep.","zh":"他搭便车到了多佛，傍晚时分进了一条船想找个地方睡觉。","kind":"text"},{"t":51.32,"en":"When he woke up next morning, he discovered that the boat had, in the meantime, travelled to Calais.","zh":"第二天早晨醒来时，他发现那条船已行驶到加来。","kind":"text"},{"t":60.9,"en":"No one noticed the boy as he crept off.","zh":"他悄悄溜下船时没人注意到他。","kind":"text"},{"t":64.89,"en":"From there, he hitchhiked to Paris in a lorry.","zh":"从那里，他又搭上一辆卡车去了巴黎。","kind":"text"},{"t":69.46,"en":"The driver gave him a few biscuits and a cup of coffee and left him just outside the city.","zh":"司机给了他几块饼干和一杯咖啡，在城外把他放下了。","kind":"text"},{"t":78.09,"en":"The next car the boy stopped did not take him into the centre of Paris as he hoped it would,","zh":"男孩拦的下一辆车并没有像他希望的那样把他带到巴黎市中心，","kind":"text"},{"t":86.4,"en":"but to Perpignan on the French-Spanish border.","zh":"而是带到了法国和西班牙边境上的佩皮尼昂。","kind":"text"},{"t":91.54,"en":"There he was picked up by a policeman and sent back to England by the local authorities.","zh":"在那里他被一个警察发现，然后当地政府把他遣送回了英国。","kind":"text"},{"t":99.1,"en":"He has surely set up a record for the thousands of children who dream of evading school.","zh":"他无疑为成千上万梦想逃学的孩子们创造了一项纪录。","kind":"text"}]},{"id":"NCE2-74","book":"NCE2","bookCn":"第二册","num":74,"title":"Out of the Limelight","slug":"74.Out of the Limelight","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/74.Out%20of%20the%20Limelight.mp3","sentenceCount":17,"wordCount":190,"lines":[{"t":11.18,"en":"Why was their disguise 'too perfect' ?","zh":"为什么他们的伪装“太完美”了？","kind":"question"},{"t":16.66,"en":"An ancient bus stopped by a dry river bed and a party of famous actors and actresses got off.","zh":"一辆老旧的公共汽车停在一条干涸的河床上，一群著名演员下了车。","kind":"text"},{"t":25.63,"en":"Dressed in dark glasses and old clothes,","zh":"他们戴着墨镜，穿着旧衣服，","kind":"text"},{"t":29.28,"en":"they had taken special precautions so that no one should recognize them.","zh":"他们采取了特殊的预防措施，以防被人认出来。","kind":"text"},{"t":35.84,"en":"But as they soon discovered, disguises can sometimes be too perfect.","zh":"但他们很快发现，伪装有时会过于完美。","kind":"text"},{"t":43.83,"en":"'This is a wonderful place for a picnic,' said Gloria Gleam.","zh":"“这里真是个野餐的好地方，”格洛丽亚·格莱姆说。","kind":"text"},{"t":49.62,"en":"'It couldn't be better, Gloria,' Brinksley Meers agreed.","zh":"“再好不过了，格洛丽亚，”布林克斯利·米尔斯同意道。","kind":"text"},{"t":55.04,"en":"'No newspaper men, no film fans! Why don't we come more often?'","zh":"“没有记者，没有影迷！我们为什么不常来呢？”","kind":"text"},{"t":62.18,"en":"Meanwhile, two other actors Rockwall Slinger and Merlin Greeves,","zh":"与此同时，另外两名演员洛克沃尔·斯林格和梅林·格里夫斯，","kind":"text"},{"t":69.49,"en":"had carried two large food baskets to a shady spot under some trees.","zh":"已经把两大篮食物搬到了一片树荫下。","kind":"text"},{"t":76.7,"en":"When they had all made themselves comfortable, a stranger appeared.","zh":"当他们都安顿好时，一个陌生人出现了。","kind":"text"},{"t":82.56,"en":"He looked very angry.","zh":"他看起来非常生气。","kind":"text"},{"t":85.96,"en":"'Now you get out of here, all of you!' he shouted.","zh":"“你们现在都给我滚出去，你们所有人！”他喊道。","kind":"text"},{"t":91.29,"en":"'I'm sheriff here. Do you see that notice? It says \"No Camping\"  -- in case you can't read!'","zh":"“我是这里的治安官。你看到那张告示了吗？上面写着‘禁止露营’——以防你不识字！”","kind":"text"},{"t":103.12,"en":"'Look, sheriff,' said Rockwall,","zh":"“看，治安官，”洛克沃尔说，","kind":"text"},{"t":106.54,"en":"'don't be too hard on us. I'm Rockwall Slinger and this is Merlin Greeves.'","zh":"“别对我们太严厉。我是洛克沃尔·斯林格，这是梅林·格里夫斯。”","kind":"text"},{"t":115.69,"en":"'Oh, is it?' said the sheriff with a sneer.","zh":"“哦，是吗？”治安官嘲讽地说。","kind":"text"},{"t":120.11,"en":"'Well, I'm Brinksley Meers, and my other name is Gloria Gleam. Now you get out of here fast!'","zh":"“嗯，我是布林克斯利·米尔斯，我的另一个名字是格洛丽亚·格莱姆。你们现在赶紧滚出去！”","kind":"text"}]},{"id":"NCE2-75","book":"NCE2","bookCn":"第二册","num":75,"title":"SOS","slug":"75.SOS","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/75.SOS.mp3","sentenceCount":15,"wordCount":179,"lines":[{"t":10.24,"en":"How did the woman get help?","zh":"这位妇女是怎样获得救援的？","kind":"question"},{"t":14.45,"en":"When a light passenger plane flew off course some time ago,","zh":"前些日子，一架小型客机偏离航线","kind":"text"},{"t":19.68,"en":"it crashed in the mountains and its pilot was killed.","zh":"在山区坠毁，飞行员当场丧生。","kind":"text"},{"t":25.25,"en":"The only passengers, a young woman and her two baby daughters, were unhurt.","zh":"唯一的乘客，一位年轻的妇女和她的两个女婴却安然无恙。","kind":"text"},{"t":33.51,"en":"It was the middle of winter.","zh":"那时正值隆冬。","kind":"text"},{"t":36.08,"en":"Snow lay thick on the ground.","zh":"地上覆盖着厚厚的积雪。","kind":"text"},{"t":39.77,"en":"The woman knew that the nearest village was miles away.","zh":"妇女知道最近的村庄也在数英里之外。","kind":"text"},{"t":45.05,"en":"When it grew dark, she turned a suitcase into a bed and put the children inside it,","zh":"天黑时，她把一只手提箱当作小床，把孩子们放了进去，","kind":"text"},{"t":53.2,"en":"covering them with all the clothes she could find.","zh":"又把自己能找到的所有衣服都盖在了她们身上。","kind":"text"},{"t":57.93,"en":"During the night, it got terribly cold.","zh":"夜里，天气变得异常寒冷。","kind":"text"},{"t":62.47,"en":"The woman kept as near as she could to the children and even tried to get into the case herself, but it was too small.","zh":"妇女尽可能地靠近孩子，甚至想自己也钻进箱子里，但箱子太小了。","kind":"text"},{"t":74.04,"en":"Early next morning,","zh":"第二天清早，","kind":"text"},{"t":75.79,"en":"she heard planes passing overhead and wondered how she could send a signal.","zh":"她听到飞机从头顶飞过，心想该如何发出求救信号呢？","kind":"text"},{"t":82.7,"en":"Then she had an idea. She stamped out the letters 'SOS' in the snow.","zh":"接着她有了一个主意。她在雪地上踩出了“SOS”这几个字母。","kind":"text"},{"t":91.98,"en":"Fortunately, a pilot saw the signal and sent a message by radio to the nearest town.","zh":"幸运的是，一名飞行员看到了这个信号，并用无线电把消息发给了最近的城镇。","kind":"text"},{"t":100.47,"en":"It was not long before a helicopter arrived on the scene to rescue the survivors of the plane crash.","zh":"不久，一架直升机飞抵现场，营救了这次飞机坠毁事故的幸存者。","kind":"text"}]},{"id":"NCE2-76","book":"NCE2","bookCn":"第二册","num":76,"title":"April Fools' Day","slug":"76.April Fools' Day","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/76.April%20Fools%27%20Day.mp3","sentenceCount":16,"wordCount":186,"lines":[{"t":11.32,"en":"What was the joke?","zh":"笑话是什么？","kind":"question"},{"t":15.08,"en":"'To end our special news bulletin,'","zh":"“为结束我们的特别新闻快报，”","kind":"text"},{"t":18.79,"en":"said the voice of the television announcer, 'we're going over to the macaroni fields of Calabria.","zh":"电视播音员的声音说道，“我们现在转向卡拉布里亚的通心粉田。”","kind":"text"},{"t":28.34,"en":"Macaroni has been grown in this area for over six hundred years.","zh":"通心粉在这片区域种植已有六百多年了。","kind":"text"},{"t":34.57,"en":"Two of the leading growers Giuseppe Moldova and Riccardo Brabante,","zh":"两位主要的种植者朱塞佩·摩尔多瓦和里卡尔多·布拉班特，","kind":"text"},{"t":41.31,"en":"tell me that they have been expecting a splendid crop this year and harvesting has begun earlier than usual.","zh":"告诉我他们今年预计会有一个丰收，而且收割比往常开始得早。","kind":"text"},{"t":50.79,"en":"Here you can see two workers who, between them,","zh":"在这里你可以看到两位工人，他们俩，","kind":"text"},{"t":55.37,"en":"have just finished cutting three cartloads of golden brown macaroni stalks.","zh":"刚砍完了三车金黄色的通心粉茎。","kind":"text"},{"t":62.84,"en":"The whole village has been working day and night gathering and threshing this year's crop before the September rains.","zh":"整个村庄昼夜不停地收割和脱粒今年的庄稼，以赶在九月雨季之前。","kind":"text"},{"t":73.34,"en":"On the right, you can see Mrs. Brabante herself.","zh":"在右边，你可以看到布拉班特夫人本人。","kind":"text"},{"t":78.47,"en":"She has been helping her husband for thirty years now.","zh":"她已经帮助她的丈夫三十年了。","kind":"text"},{"t":83.09,"en":"Mrs. Brabante is talking to the manager of the local factory where the crop is processed.","zh":"布拉班特夫人正在和当地加工庄稼的工厂经理交谈。","kind":"text"},{"t":90.39,"en":"This last scene shows you what will happen at the end of the harvest:","zh":"这最后一幕向你展示了收割结束后将发生的事情：","kind":"text"},{"t":96.23,"en":"the famous Calabrian macaroni-eating competition!","zh":"著名的卡拉布里亚通心粉大赛！","kind":"text"},{"t":101.42,"en":"Signor Fratelli, the present champion, has won it every year since 1991.","zh":"现任冠军弗拉特利先生自1991年以来每年都赢得了比赛。","kind":"text"},{"t":109.69,"en":"And that ends our special bulletin for today, Thursday, April 1st.","zh":"今天的特别快报到此结束，今天是4月1日星期四。","kind":"text"},{"t":116.25,"en":"We're now going back to the studio.'","zh":"我们现在回到演播室。”","kind":"text"}]},{"id":"NCE2-77","book":"NCE2","bookCn":"第二册","num":77,"title":"A Successful Operation","slug":"77.A Successful Operation","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/77.A%20Successful%20Operation.mp3","sentenceCount":14,"wordCount":175,"lines":[{"t":10.98,"en":"Did the doctors find out how the woman died?","zh":"医生们查出这名妇女是怎么死的了吗？","kind":"question"},{"t":16.55,"en":"The mummy of an Egyptian woman who died in 800 B.C. has just had an operation.","zh":"一具死于公元前800年的埃及妇女木乃伊刚刚接受了一次手术。","kind":"text"},{"t":25.14,"en":"The mummy is that of Shepenmut who was once a singer in the Temple of Thebes.","zh":"这具木乃伊是谢芬姆特的，她曾是底比斯神庙里的一名歌手。","kind":"text"},{"t":32.44,"en":"As there were strange marks on the X-ray plates taken of the mummy,","zh":"由于对这具木乃伊X光片上有一些奇怪的印记，","kind":"text"},{"t":38.2,"en":"doctors have been trying to find out whether the woman died of a rare disease.","zh":"医生们一直在设法弄清这名妇女是否死于一种罕见的疾病。","kind":"text"},{"t":44.92,"en":"The only way to do this was to operate.","zh":"唯一的方法就是进行手术。","kind":"text"},{"t":49.6,"en":"The operation, which lasted for over four hours,","zh":"手术持续了四个多小时，","kind":"text"},{"t":54.4,"en":"proved to be very difficult because of the hard resin which covered the skin.","zh":"由于木乃伊的皮肤上覆盖着坚硬的树脂，手术做起来非常困难。","kind":"text"},{"t":60.89,"en":"The doctors removed a section of the mummy and sent it to a laboratory.","zh":"医生们取走了木乃伊的一小块，并把它送到了实验室。","kind":"text"},{"t":66.75,"en":"They also found something which the X-ray plates did not show: a small wax figure of the god Duamutef.","zh":"他们还发现了一些X光片上没有显示出来的东西：一个小的、蜡制的杜穆特夫神像。","kind":"text"},{"t":77.1,"en":"This god which has the head of a cow was normally placed inside a mummy.","zh":"这个长着牛头的神像通常被放置在木乃伊里面。","kind":"text"},{"t":83.78,"en":"The doctors have not yet decided how the woman died.","zh":"医生们尚未确定这名妇女是如何死亡的。","kind":"text"},{"t":88.9,"en":"They feared that the mummy would fall to pieces when they cut it open,","zh":"他们担心当他们切开木乃伊时，它会碎裂，","kind":"text"},{"t":93.91,"en":"but fortunately this has not happened.","zh":"但幸运的是，这种情况并没有发生。","kind":"text"},{"t":97.77,"en":"The mummy successfully survived the operation.","zh":"这具木乃伊成功地经受住了这次手术。","kind":"text"}]},{"id":"NCE2-78","book":"NCE2","bookCn":"第二册","num":78,"title":"The Last One","slug":"78.The Last One","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/78.The%20Last%20One.mp3","sentenceCount":13,"wordCount":183,"lines":[{"t":10.39,"en":"For how long did the writer give up smoking?","zh":"作者戒烟戒了多久？","kind":"question"},{"t":15.78,"en":"After reading an article entitled 'Cigarette Smoking and Your Health' I lit a cigarette to calm my nerves.","zh":"读了一篇题为《吸烟与健康》的文章后，我点燃了一支香烟来镇定情绪。","kind":"text"},{"t":26.25,"en":"I smoked with concentration and pleasure as I was sure that this would be my last cigarette.","zh":"我聚精会神、津津有味地抽着，因为我确信这是我的最后一支香烟了。","kind":"text"},{"t":35.11,"en":"For a whole week I did not smoke at all and during this time my wife suffered terribly.","zh":"整整一个星期我根本没吸烟，在此期间我妻子可遭了大罪了。","kind":"text"},{"t":43.84,"en":"I had all the usual symptoms of someone giving up smoking: a bad temper and an enormous appetite.","zh":"我具备了戒烟者的所有常见症状：脾气暴躁，胃口大开。","kind":"text"},{"t":53.83,"en":"My friends kept on offering me cigarettes and cigars.","zh":"我的朋友们不断地给我递香烟和雪茄。","kind":"text"},{"t":59.15,"en":"They made no effort to hide their amusement whenever I produced a packet of sweets from my pocket.","zh":"每当我从口袋里掏出一包糖果时，他们都毫不掩饰地取笑我。","kind":"text"},{"t":68.29,"en":"After seven days of this I went to a party.","zh":"这样过了7天，我参加了一个聚会。","kind":"text"},{"t":73.04,"en":"Everybody around me was smoking and I felt extremely uncomfortable.","zh":"我周围的人都在吸烟，我感到非常不舒服。","kind":"text"},{"t":79.78,"en":"When my old friend Brian urged me to accept a cigarette, it was more than I could bear.","zh":"当我的老朋友布赖恩极力劝我抽一支烟时，我再也忍不住了。","kind":"text"},{"t":89.23,"en":"I took one guiltily, lit it and smoked with satisfaction.","zh":"我内疚地拿了一支，点上，心满意足地抽了起来。","kind":"text"},{"t":95.71,"en":"My wife was delighted that things had returned to normal once more.","zh":"我妻子很高兴一切又恢复了正常。","kind":"text"},{"t":101.63,"en":"Anyway, as Brian pointed out, it is the easiest thing in the world to give up smoking.","zh":"不过，正如布赖恩指出的，戒烟是世界上最容易的事情。","kind":"text"},{"t":110.01,"en":"He himself has done it lots of times!","zh":"他自己就戒过好多次了！","kind":"text"}]},{"id":"NCE2-79","book":"NCE2","bookCn":"第二册","num":79,"title":"By Air","slug":"79.By Air","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/79.By%20Air.mp3","sentenceCount":13,"wordCount":184,"lines":[{"t":10.25,"en":"Why did the plane turn back?","zh":"飞机为什么返航了？","kind":"question"},{"t":14.78,"en":"I used to travel by air a great deal when I was a boy.","zh":"我小时候经常乘飞机旅行。","kind":"text"},{"t":20.06,"en":"My parents used to live in South America and I used to fly there from Europe in the holidays.","zh":"我父母过去住在南美洲，我放假时常从欧洲飞到那里。","kind":"text"},{"t":28.92,"en":"A flight attendant would take charge of me and I never had an unpleasant experience.","zh":"乘务员会照顾我，我从未有过不愉快的经历。","kind":"text"},{"t":36.25,"en":"I am used to travelling by air and only on one occasion have I ever felt frightened.","zh":"我习惯了乘飞机旅行，只有一次感到害怕。","kind":"text"},{"t":44.16,"en":"After taking off, we were flying low over the city and slowly gaining height,","zh":"起飞后，我们低空飞过城市，慢慢爬升，","kind":"text"},{"t":51.2,"en":"when the plane suddenly turned round and flew back to the airport.","zh":"飞机突然掉头飞回了机场。","kind":"text"},{"t":57.9,"en":"While we were waiting to land, a flight attendant told us to keep calm","zh":"当我们等待降落时，一位乘务员告诉我们要保持冷静，","kind":"text"},{"t":63.46,"en":"and to get off the plane quietly as soon as it had touched down.","zh":"飞机一着陆就安静地下飞机。","kind":"text"},{"t":69.23,"en":"Everybody on board was worried and we were curious to find out what had happened.","zh":"飞机上的每个人都很担心，我们都很好奇发生了什么事。","kind":"text"},{"t":76.21,"en":"Later we learnt that there was a very important person on board.","zh":"后来我们得知飞机上有一位非常重要的人物。","kind":"text"},{"t":81.17,"en":"The police had been told that a bomb had been planted on the plane.","zh":"警方接到报告说飞机上被安放了炸弹。","kind":"text"},{"t":86.79,"en":"After we had landed, the plane was searched thoroughly.","zh":"飞机降落后，被彻底搜查了一番。","kind":"text"},{"t":91.89,"en":"Fortunately, nothing was found and five hours later we were able to take off again.","zh":"幸运的是，什么也没发现，五小时后我们得以再次起飞。","kind":"text"}]},{"id":"NCE2-80","book":"NCE2","bookCn":"第二册","num":80,"title":"The Crystal Palace","slug":"80.The Crystal Palace","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/80.The%20Crystal%20Palace.mp3","sentenceCount":14,"wordCount":188,"lines":[{"t":10.28,"en":"How many people visited the Great Exhibition of 1851?","zh":"有多少人参观了1851年的万国博览会？","kind":"question"},{"t":18.2,"en":"Perhaps the most extraordinary building of the 19th century was the Crystal Palace","zh":"19世纪最不同寻常的建筑，或许就是水晶宫了，","kind":"text"},{"t":26.04,"en":"which was built in Hyde Park for the Great Exhibition of 1851.","zh":"它是为1851年的万国博览会在海德公园建造的。","kind":"text"},{"t":33.43,"en":"The Crystal Palace was different from all other bu
