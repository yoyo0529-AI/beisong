t anything for his fifty pence? What?","zh":"乔治用他的五十便士买到什么东西了吗？什么东西？","kind":"question"},{"t":16.65,"en":"Children always appreciate small gifts of money.","zh":"孩子们总是喜欢收到小额的零用钱。","kind":"text"},{"t":20.6,"en":"Mum or dad, of course, provides a regular supply of pocket money, but uncles and aunts are always a source of extra income.","zh":"当然，爸爸妈妈会定期地给零花钱，但叔叔阿姨们总是额外的收入来源。","kind":"text"},{"t":30.99,"en":"With some children, small sums go a long way.","zh":"对有些孩子来说，小数目也能派上大用场。","kind":"text"},{"t":35.17,"en":"If fifty pence pieces are not exchanged for sweets, they rattle for months inside money boxes.","zh":"如果五十便士没有换成糖果，它们就会在钱箱里叮当响上好几个月。","kind":"text"},{"t":43.16,"en":"Only very thrifty children manage to fill up a money box.","zh":"只有非常节俭的孩子才能把钱箱装满。","kind":"text"},{"t":48.59,"en":"For most of them, fifty pence is a small price to pay for a nice big bar of chocolate.","zh":"对于他们中的大多数人来说，五十便士买一大块美味的巧克力是很划算的。","kind":"text"},{"t":56.95,"en":"My nephew, George, has a money box but it is always empty.","zh":"我的侄子乔治有一个钱箱，但它总是空的。","kind":"text"},{"t":62.34,"en":"Very few of the fifty pence pieces and pound coins I have given him have found their way there.","zh":"我给他的五十便士硬币和英镑硬币很少有能存到那里的。","kind":"text"},{"t":70.05,"en":"I gave him fifty pence yesterday and advised him to save it.","zh":"昨天我给了他五十便士，并建议他存起来。","kind":"text"},{"t":74.63,"en":"Instead, he bought himself fifty pence worth of trouble.","zh":"结果，他却给自己买来了五十便士的麻烦。","kind":"text"},{"t":79.56,"en":"On his way to the sweet shop, he dropped his fifty pence and it bounced along the pavement and then disappeared down a drain.","zh":"在去糖果店的路上，他把五十便士掉了，它沿着人行道跳动，然后掉进了一个下水道。","kind":"text"},{"t":89.81,"en":"George took off his jacket,","zh":"乔治脱下他的夹克，","kind":"text"},{"t":92.21,"en":"rolled up his sleeves and pushed his right arm through the drain cover.","zh":"卷起袖子，把右臂伸进了下水道盖子。","kind":"text"},{"t":97.54,"en":"He could not find his 50 pence piece anywhere, and what is more, he could not get his arm out.","zh":"他到处都找不到他的五十便士硬币，更糟的是，他抽不出他的胳膊了。","kind":"text"},{"t":105.86,"en":"A crowd of people gathered round him and a lady rubbed his arm with soap and butter, but George was firmly stuck.","zh":"一群人围在他周围，一位女士用肥皂和黄油擦他的胳膊，但乔治被牢牢地卡住了。","kind":"text"},{"t":115.35,"en":"The fire brigade was called and two fire fighters freed George using a special type of grease.","zh":"消防队被叫来了，两名消防队员用一种特殊的润滑脂把乔治解救了出来。","kind":"text"},{"t":122.73,"en":"George was not too upset by his experience because the lady who owns the sweet shop heard about his troubles and rewarded him with a large box of chocolates.","zh":"乔治并没有因为这次经历而太难过，因为糖果店的老板娘听说了他的麻烦，并奖励了他一大盒巧克力。","kind":"text"}]},{"id":"NCE3-16","book":"NCE3","bookCn":"第三册","num":16,"title":"Mary Had a Little Lamb","slug":"16.Mary Had a Little Lamb","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/16.Mary%20Had%20a%20Little%20Lamb.mp3","sentenceCount":18,"wordCount":252,"lines":[{"t":0.27,"en":"Lesson 16","zh":"第16课","kind":"lesson"},{"t":2.55,"en":"Mary had a little lamb","zh":"玛丽有只小羊羔","kind":"title"},{"t":10.19,"en":"Was Dimitri right to apologize to his neighbour? Why not?","zh":"迪米特里向他的邻居道歉对吗？为什么不对？","kind":"question"},{"t":15.03,"en":"Mary and her husband Dimitri lived in the tiny village of Perachora in southern Greece.","zh":"玛丽和她的丈夫迪米特里住在希腊南部佩拉霍拉的一个小村庄里。","kind":"text"},{"t":25.07,"en":"One of Mary's prize possessions was a little white lamb which her husband had given her.","zh":"玛丽最珍贵的财产之一是她丈夫送给她的一只白色小羊羔。","kind":"text"},{"t":31.82,"en":"She kept it tied to a tree in a field during the day and went to fetch it every evening.","zh":"白天她把它拴在田野里的一棵树上，每天傍晚都去把它牵回来。","kind":"text"},{"t":39.4,"en":"One evening, however the lamb was missing.","zh":"然而，一个晚上，那只羊不见了。","kind":"text"},{"t":43.27,"en":"The rope had been cut, so it was obvious that the lamb had been stolen.","zh":"绳子被割断了，很明显羊被偷了。","kind":"text"},{"t":49.52,"en":"When Dimitri came in from the fields, his wife told him what had happened.","zh":"迪米特里从田里回来时，他的妻子把发生的一切告诉了他。","kind":"text"},{"t":54.17,"en":"Dimitri at once set out to find the thief.","zh":"迪米特里立刻出去寻找小偷。","kind":"text"},{"t":58.91,"en":"He knew it would not prove difficult in such a small village.","zh":"他知道在这样一个小村庄里，找到小偷不会很难。","kind":"text"},{"t":64.21,"en":"After telling several of his friends about the theft,","zh":"在把失窃的事告诉他的几个朋友之后，","kind":"text"},{"t":67.78,"en":"Dimitri found out that his neighbour, Aleko, had suddenly acquired a new lamb.","zh":"迪米特里发现他的邻居阿列科突然多了一只新羊。","kind":"text"},{"t":75.19,"en":"Dimitri immediately went to Aleko's house and angrily accused him of stealing the lamb.","zh":"迪米特里立刻去了阿列科家，愤怒地指责他偷了羊。","kind":"text"},{"t":82.68,"en":"He told him he had better return it or he would call the police.","zh":"他告诉阿列科最好把羊还回来，否则他就报警。","kind":"text"},{"t":87.61,"en":"Aleko denied taking it and led Dimitri into his backyard.","zh":"阿列科否认偷了羊，并把迪米特里领进了他的后院。","kind":"text"},{"t":93.03,"en":"It was true that he had just bought a lamb he explained, but his lamb was black.","zh":"他解释说，他确实刚买了一只羊，但他的羊是黑色的。","kind":"text"},{"t":100.35,"en":"Ashamed of having acted so rashly, Dimitri apologized to Aleko for having accused him.","zh":"迪米特里为自己如此鲁莽的行为感到羞愧，他向阿列科为自己的指责道了歉。","kind":"text"},{"t":108.26,"en":"While they were talking it began to rain and Dimitri stayed in Aleko's house until the rain stopped.","zh":"他们谈话的时候开始下雨了，迪米特里就在阿列科家里待到雨停。","kind":"text"},{"t":116.11,"en":"When he went outside half an hour later, he was astonished to find that the little black lamb was almost white.","zh":"半小时后，当他出去时，他惊奇地发现那只黑色的小羊几乎是白色的。","kind":"text"},{"t":125.48,"en":"Its wool, which had been dyed black, had been washed clean by the rain!","zh":"它的羊毛，原来被染成了黑色，被雨水冲洗干净了！","kind":"text"}]},{"id":"NCE3-17","book":"NCE3","bookCn":"第三册","num":17,"title":"The Longest Suspension Bridge in the World","slug":"17.The Longest Suspension Bridge in the World","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/17.The%20Longest%20Suspension%20Bridge%20in%20the%20World.mp3","sentenceCount":18,"wordCount":255,"lines":[{"t":0.29,"en":"Lesson 17","zh":"第17课","kind":"lesson"},{"t":2.83,"en":"The longest suspension bridge in the world","zh":"世界上最长的吊桥","kind":"title"},{"t":12.3,"en":"How is the bridge supported?","zh":"这座桥是如何支撑起来的？","kind":"question"},{"t":16.67,"en":"Verrazano, an Italian about whom little is known, sailed into New York Harbour in 1524 and named it Angouleme.","zh":"韦拉扎诺，一位鲜为人知的意大利人，于1524年航行进入纽约港，并将其命名为昂古莱姆。","kind":"text"},{"t":28.43,"en":"He described it as 'a very agreeable situation located within two small hills in the midst of which flowed a great river.'","zh":"他将其描述为“一个非常宜人的地方，坐落在两座小山之间，中间流淌着一条大河。”","kind":"text"},{"t":39.43,"en":"Though Verrazano is by no means considered to be a great explorer, his name will probably remain immortal,","zh":"尽管韦拉扎诺绝不被认为是一位伟大的探险家，但他的名字可能会流芳百世，","kind":"text"},{"t":48.07,"en":"for on November 21st, 1964, the longest suspension bridge in the world was named after him.","zh":"因为在1964年11月21日，世界上最长的吊桥以他的名字命名。","kind":"text"},{"t":59.32,"en":"The Verrazano Bridge, which was designed by Othmar Ammann, joins Brooklyn to Staten Island.","zh":"韦拉扎诺大桥由奥斯马·阿曼设计，连接着布鲁克林和史泰登岛。","kind":"text"},{"t":67.72,"en":"It has a span of 4, 260 feet.","zh":"它有一个4260英尺的跨度。","kind":"text"},{"t":72.52,"en":"The bridge is so long that the shape of the earth had to be taken into account by its designer.","zh":"这座桥非常长，以至于它的设计师不得不将地球的形状考虑在内。","kind":"text"},{"t":79.92,"en":"Two great towers support four huge cables.","zh":"两座巨大的塔架支撑着四根巨大的缆索。","kind":"text"},{"t":85.53,"en":"The towers are built on immense underwater platforms made of steel and concrete.","zh":"这些塔架建在由钢和混凝土制成的巨大水下平台上。","kind":"text"},{"t":92.28,"en":"The platforms extend to a depth of over 100 feet under the sea.","zh":"这些平台延伸到海面以下100多英尺的深度。","kind":"text"},{"t":97.65,"en":"These alone took sixteen months to build.","zh":"仅仅这些就花了16个月来建造。","kind":"text"},{"t":101.48,"en":"Above the surface of the water, the towers rise to a height of nearly 700 feet.","zh":"在水面之上，塔架上升到近700英尺的高度。","kind":"text"},{"t":108.25,"en":"They support the cables from which the bridge has been suspended.","zh":"它们支撑着悬挂大桥的缆索。","kind":"text"},{"t":112.62,"en":"Each of the four cables contains 26, 108 lengths of wire.","zh":"四根缆索中的每一根都含有26108股钢丝。","kind":"text"},{"t":119.62,"en":"It has been estimated that if the bridge were packed with cars, it would still only be carrying a third of its total capacity.","zh":"据估计，即使桥上挤满了汽车，它也只承载了其总容量的三分之一。","kind":"text"},{"t":129.73,"en":"However, size and strength are not the only important things about this bridge.","zh":"然而，尺寸和强度并不是这座桥唯一重要的方面。","kind":"text"},{"t":135.93,"en":"Despite its immensity, it is both simple and elegant,","zh":"尽管它如此巨大，却既简洁又优雅，","kind":"text"},{"t":141.49,"en":"fulfilling its designer's dream to creat 'an enormous object drawn as faintly as possible'.","zh":"实现了设计师创造“一个尽可能轻描淡写地勾勒出的巨大物体”的梦想。","kind":"text"}]},{"id":"NCE3-18","book":"NCE3","bookCn":"第三册","num":18,"title":"Electric Currents in Modern Art","slug":"18.Electric Currents in Modern Art","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/18.Electric%20Currents%20in%20Modern%20Art.mp3","sentenceCount":19,"wordCount":249,"lines":[{"t":0.11,"en":"Lesson 18","zh":"第18课","kind":"lesson"},{"t":2.1,"en":"Electric currents in modern art","zh":"现代艺术中的电流","kind":"title"},{"t":11.09,"en":"How might some of the exhibits have been dangerous?","zh":"有些展品是怎样有危险的呢？","kind":"question"},{"t":15.62,"en":"Modern sculpture rarely surprises us any more.","zh":"现代雕塑已很少令我们感到惊奇了。","kind":"text"},{"t":19.58,"en":"The idea that modern art can only be seen in museums is mistaken.","zh":"现代艺术只能在博物馆里才能看到这种想法是错误的。","kind":"text"},{"t":25.6,"en":"Even people who take no interest in art cannot have failed to notice examples of modern sculpture on display in public places.","zh":"即使是对艺术不感兴趣的人，也不会没有注意到在公共场所展出的现代雕塑作品。","kind":"text"},{"t":35.42,"en":"Strange forms stand in gardens, and outside buildings and shops.","zh":"花园里、大楼和商店门外都矗立着奇形怪状的雕塑。","kind":"text"},{"t":40.66,"en":"We have got quite used to them.","zh":"我们对它们已习以为常了。","kind":"text"},{"t":43.55,"en":"Some so-called 'modern' pieces have been on display for nearly eighty years.","zh":"有些所谓的“现代”作品已经展出了将近80年了。","kind":"text"},{"t":49.9,"en":"In spite of this, some people--including myself--were surprised by a recent exhibition of modern sculpture.","zh":"尽管如此，最近举办的一次现代雕塑展览还是使一些人——包括我本人在内——大吃一惊。","kind":"text"},{"t":58.69,"en":"The first thing I saw when I entered the art gallery was a notice which said: 'Do not touch the exhibits, some of them are dangerous!'","zh":"我走进美术馆时，首先看到的是一块牌子，上面写着：“展品切勿触摸，有些是危险品！”","kind":"text"},{"t":69.44,"en":"The objects on display were pieces of moving sculpture.","zh":"展出的作品都是动态雕塑。","kind":"text"},{"t":74.16,"en":"Oddly shaped forms that are suspended from the ceiling and move in response to a gust of wind are quite familiar to everybody.","zh":"悬挂在天花板上随风摆动的奇形怪状的雕塑，大家是相当熟悉的。","kind":"text"},{"t":84.0,"en":"These objects, however, were different.","zh":"然而，这些展品却与众不同。","kind":"text"},{"t":87.91,"en":"Lined up against the wall, there were long thin wires attached to metal spheres.","zh":"靠墙摆放着的是些系有金属球的长长的细电线。","kind":"text"},{"t":94.17,"en":"The spheres had been magnetized and attracted or repelled each other all the time.","zh":"金属球都带磁，因此它们总是互相吸引或排斥。","kind":"text"},{"t":101.01,"en":"In the centre of the hall,","zh":"在展览厅中央，","kind":"text"},{"t":102.89,"en":"there were a number of tall structures which contained coloured lights.","zh":"有些高高的建筑物模型，里面装着彩灯。","kind":"text"},{"t":107.68,"en":"These lights flickered continuously like traffic lights which have gone mad.","zh":"这些彩灯不停地闪烁，就像发了疯的红绿灯。","kind":"text"},{"t":113.94,"en":"Sparks were emitted from small black boxes and red lamps flashed on and off angrily.","zh":"小黑盒子里迸出火花，红色灯泡恼怒地闪着。","kind":"text"},{"t":121.2,"en":"It was rather like an exhibition of prehistoric electronic equipment.","zh":"这简直是史前电子设备展览。","kind":"text"},{"t":126.94,"en":"These peculiar forms not only seemed designed to shock people emotionally, but to give them electric shocks as well!","zh":"这些奇特的造型，似乎不仅要给人以情感上的冲击，还要给人以电击！","kind":"text"}]},{"id":"NCE3-19","book":"NCE3","bookCn":"第三册","num":19,"title":"A Very Dear Cat","slug":"19.A Very Dear Cat","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/19.A%20Very%20Dear%20Cat.mp3","sentenceCount":19,"wordCount":251,"lines":[{"t":0.44,"en":"Lesson 19","zh":"第19课","kind":"lesson"},{"t":2.41,"en":"A very dear cat","zh":"一只非常名贵的猫","kind":"title"},{"t":10.28,"en":"Why was Rastus 'very dear' in more ways than one?","zh":"为什么拉斯特斯是一只多方面都“非常名贵”的猫？","kind":"question"},{"t":16.88,"en":"Kidnappers are rarely interested in animals, but they recently took considerable interest in Mrs. Eleanor Ramsay's cat.","zh":"绑架者极少对动物感兴趣，但他们最近却对埃莉诺·拉姆齐夫人的猫产生了极大兴趣。","kind":"text"},{"t":26.36,"en":"Mrs. Eleanor Ramsay, a very wealthy old lady, has shared a flat with her cat, Rastus, for a great many years.","zh":"埃莉诺·拉姆齐夫人，一位非常富有的老太太，与她的猫拉斯特斯共同住在一个公寓里已经很多年了。","kind":"text"},{"t":36.36,"en":"Rastus leads an orderly life.","zh":"拉斯特斯过着有规律的生活。","kind":"text"},{"t":38.82,"en":"He usually takes a short walk in the evenings and is always home by seven o'clock.","zh":"它通常在傍晚散步一小会儿，总是在7点钟前到家。","kind":"text"},{"t":45.58,"en":"One evening, however he failed to arrive.","zh":"然而，一天晚上，它没有回来。","kind":"text"},{"t":49.8,"en":"Mrs. Ramsay got very worried.","zh":"拉姆齐夫人非常焦急。","kind":"text"},{"t":52.41,"en":"She looked everywhere for him but could not find him.","zh":"她到处寻找，但没有找到它。","kind":"text"},{"t":57.2,"en":"Three days after Rastus' disappearance, Mrs. Ramsay received an anonymous letter.","zh":"拉斯特斯失踪3天后，拉姆齐夫人收到一封匿名信。","kind":"text"},{"t":64.34,"en":"The writer stated that Rastus was in safe hands and would be returned immediately if Mrs. Ramsay paid a ransom of ￡1, 000.","zh":"写信人称拉斯特斯很安全，如果拉姆齐夫人支付1000英镑赎金，它将立即被送回。","kind":"text"},{"t":75.73,"en":"Mrs.Ramsay was instructed to place the money in a cardboard box and to leave it outside her door.","zh":"拉姆齐夫人被指示将钱放进一个纸箱，并将其放在门外。","kind":"text"},{"t":82.62,"en":"At first, she decided to go to the police,","zh":"最初，她决定报警，","kind":"text"},{"t":86.66,"en":"but fearing that she would never see Rastus again--the letter had made that quite clear--she changed her mind.","zh":"但由于担心再也见不到拉斯特斯——信中已把这一点说得一清二楚——她改变了主意。","kind":"text"},{"t":96.31,"en":"She withdrew ￡1000 from her bank and followed the kidnapper's instructions.","zh":"她从银行取出1000英镑，按照绑架者的指示做了。","kind":"text"},{"t":101.97,"en":"The next morning, the box had disappeared but Mrs.Ramsay was sure that the kidnapper would keep his word.","zh":"第二天早上，箱子不见了，但拉姆齐夫人确信绑架者会遵守诺言。","kind":"text"},{"t":110.27,"en":"Sure enough, Rastus arrived punctually at seven o'clock that evening.","zh":"果不其然，拉斯特斯那天晚上7点准时回来了。","kind":"text"},{"t":116.58,"en":"He looked very well, though he was rather thirsty, for he drank half a bottle of milk.","zh":"它看上去很好，只是有点渴，喝了半瓶牛奶。","kind":"text"},{"t":124.04,"en":"The police were astounded when Mrs. Ramsay told them what she had done.","zh":"当拉姆齐夫人告诉警察她所做的一切时，警察都惊呆了。","kind":"text"},{"t":129.64,"en":"She explained that Rastus was very dear to her.","zh":"她解释说拉斯特斯对她来说非常宝贵。","kind":"text"},{"t":133.38,"en":"Considering the amount she paid, he was dear in more ways than one!","zh":"考虑到她所支付的金额，它在多方面都确实很“名贵”！","kind":"text"}]},{"id":"NCE3-20","book":"NCE3","bookCn":"第三册","num":20,"title":"Pioneer Pilots","slug":"20.Pioneer Pilots","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/20.Pioneer%20Pilots.mp3","sentenceCount":19,"wordCount":252,"lines":[{"t":0.25,"en":"Lesson 20","zh":"第20课","kind":"lesson"},{"t":2.1,"en":"Pioneer pilots","zh":"拓荒飞行员","kind":"title"},{"t":9.15,"en":"What was the name of the first plane to fly across the English Channel?","zh":"第一架飞越英吉利海峡的飞机叫什么名字？","kind":"question"},{"t":15.81,"en":"In 1908 Lord Northcliffe offered a prize of ￡1, 000 to the first man who would fly across the English Channel.","zh":"1908年，诺思克利夫勋爵悬赏1000英镑，奖给第一位飞越英吉利海峡的人。","kind":"text"},{"t":26.78,"en":"Over a year passed before the first attempt was made.","zh":"一年多过去了，才有人首次尝试。","kind":"text"},{"t":31.28,"en":"On July 19th, 1909, in the early morning,","zh":"1909年7月19日清晨，","kind":"text"},{"t":36.36,"en":"Hubert Latham took off from the French coast in his plane the 'Antoinette IV.'","zh":"休伯特·拉瑟姆驾驶他的“安托瓦内特四号”飞机从法国海岸起飞。","kind":"text"},{"t":43.14,"en":"He had travelled only seven miles across the Channel when his engine failed and he was forced to land on the sea.","zh":"他飞越海峡仅七英里，发动机就失灵了，被迫降落在海面上。","kind":"text"},{"t":52.26,"en":"The 'Antoinette' floated on the water until Latham was picked up by a ship.","zh":"“安托瓦内特”号浮在水面，直到拉瑟姆被一艘船救起。","kind":"text"},{"t":59.22,"en":"Two days later, Louis Bleriot arrived near Calais with a plane called 'No.XI'.","zh":"两天后，路易·布莱里奥带着一架名叫“十一号”的飞机抵达加来附近。","kind":"text"},{"t":67.16,"en":"Bleriot had been making planes since 1905 and this was his latest model.","zh":"布莱里奥自1905年起就在制造飞机，这是他的最新型号。","kind":"text"},{"t":74.33,"en":"A week before, he had completed a successful overland flight during which he covered twenty-six miles.","zh":"一周前，他成功完成了一次陆上飞行，飞行距离达二十六英里。","kind":"text"},{"t":82.54,"en":"Latham, however, did not give up easily.","zh":"然而，拉瑟姆并没有轻易放弃。","kind":"text"},{"t":85.76,"en":"He, too, arrived near Calais on the same day with a new 'Antoinette'.","zh":"他也在同一天带着一架新的“安托瓦内特”号抵达加来附近。","kind":"text"},{"t":92.2,"en":"It looked as if there would be an exciting race across the Channel.","zh":"看来将有一场激动人心的跨海峡比赛。","kind":"text"},{"t":97.19,"en":"Both planes were going to take off on July 25th, but Latham failed to get up early enough.","zh":"两架飞机都准备在7月25日起飞，但拉瑟姆未能足够早地起床。","kind":"text"},{"t":105.05,"en":"After making a short test flight at 4.15 a.m., Bleriot set off half an hour later.","zh":"在凌晨4点15分进行了一次短程试飞后，布莱里奥在半小时后出发了。","kind":"text"},{"t":113.1,"en":"His great flight lasted thirty-seven minutes.","zh":"他这次伟大的飞行持续了三十七分钟。","kind":"text"},{"t":116.9,"en":"When he landed near Dover, the first person to greet him was a local policeman.","zh":"当他在多佛附近着陆时，第一个迎接他的是一位当地警察。","kind":"text"},{"t":123.67,"en":"Latham made another attempt a week later and got within half a mile of Dover,","zh":"一周后，拉瑟姆又进行了一次尝试，到达了离多佛半英里以内的地方，","kind":"text"},{"t":129.34,"en":"but he was unlucky again.","zh":"但他再次不幸。","kind":"text"},{"t":131.85,"en":"His engine failed and he landed on the sea for the second time.","zh":"他的发动机失灵了，他第二次降落在海面上。","kind":"text"}]},{"id":"NCE3-21","book":"NCE3","bookCn":"第三册","num":21,"title":"Daniel Mendoza","slug":"21.Daniel Mendoza","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/21.Daniel%20Mendoza.mp3","sentenceCount":25,"wordCount":344,"lines":[{"t":0.34,"en":"Lesson 21","zh":"第21课","kind":"lesson"},{"t":2.21,"en":"Daniel Mendoza","zh":"丹尼尔·门多萨","kind":"title"},{"t":9.93,"en":"How many unsuccessful attempts did Mendoza make before becoming Champion of all England?","zh":"门多萨在成为全英冠军之前，有过多少次失败的尝试？","kind":"question"},{"t":18.59,"en":"Boxing matches were very popular in England two hundred years ago.","zh":"两百年前，拳击比赛在英格兰非常盛行。","kind":"text"},{"t":23.52,"en":"In those days, boxers fought with bare fists for prize money.","zh":"在那些日子里，拳击手们赤手空拳地搏斗以争夺奖金。","kind":"text"},{"t":28.93,"en":"Because of this, they were known as 'prizefighters'.","zh":"正因为如此，他们被称为“职业拳击手”。","kind":"text"},{"t":33.27,"en":"However, boxing was very crude,","zh":"然而，拳击是非常原始的，","kind":"text"},{"t":36.63,"en":"for there were no rules and a prizefighter could be seriously injured or even killed during a match.","zh":"因为当时没有规则，职业拳击手在比赛中可能会受重伤，甚至死亡。","kind":"text"},{"t":44.94,"en":"One of the most colourful figures in boxing history was Daniel Mendoza, who was born in 1764.","zh":"拳击史上最引人注目的人物之一是丹尼尔·门多萨，他出生于1764年。","kind":"text"},{"t":53.56,"en":"The use of gloves was not introduced until 1860, when the Marquis of Queensberry drew up the first set of rules.","zh":"直到1860年，昆斯伯里侯爵制定了第一套规则后，才引入了手套的使用。","kind":"text"},{"t":62.63,"en":"Though he was technically a prizefighter,","zh":"尽管从技术上讲他是一名职业拳击手，","kind":"text"},{"t":65.75,"en":"Mendoza did much to change crude prizefighting into a sport, for he brought science to the game.","zh":"但门多萨为将原始的职业拳击比赛转变为一项运动做了很多工作，因为他将科学带入了这项运动。","kind":"text"},{"t":73.71,"en":"In his day, Mendoza enjoyed tremendous popularity.","zh":"在他那个时代，门多萨享有巨大的声望。","kind":"text"},{"t":78.41,"en":"He was adored by rich and poor alike.","zh":"他深受富人和穷人的喜爱。","kind":"text"},{"t":81.94,"en":"Mendoza rose to fame swiftly after a boxing match when he was only fourteen years old.","zh":"门多萨在14岁时参加一场拳击比赛后迅速成名。","kind":"text"},{"t":88.42,"en":"This attracted the attention of Richard Humphries who was then the most eminent boxer in England.","zh":"这引起了理查德·汉弗莱斯的注意，他当时是英格兰最杰出的拳击手。","kind":"text"},{"t":95.87,"en":"He offered to train Mendoza and his young pupil was quick to learn.","zh":"他主动提出训练门多萨，而他的年轻学生也学得很快。","kind":"text"},{"t":100.98,"en":"In fact, Mendoza soon became so successful that Humphries turned against him.","zh":"事实上，门多萨很快就变得非常成功，以至于汉弗莱斯转而反对他。","kind":"text"},{"t":108.01,"en":"The two men quarrelled bitterly and it was clear that the argument could only be settled by a fight.","zh":"两人激烈争吵，很明显，争论只能通过一场战斗来解决。","kind":"text"},{"t":116.5,"en":"A match was held at Stilton, where both men fought for an hour.","zh":"在斯蒂尔顿举行了一场比赛，两人激战了一个小时。","kind":"text"},{"t":121.6,"en":"The public bet a great deal of money on Mendoza, but he was defeated.","zh":"公众在门多萨身上下了大笔赌注，但他被击败了。","kind":"text"},{"t":127.22,"en":"Mendoza met Humphries in the ring on a later occasion and he lost for a second time.","zh":"门多萨后来又在拳击台上与汉弗莱斯相遇，但他第二次输了。","kind":"text"},{"t":133.97,"en":"It was not until his third match in 1790 that he finally beat Humphries and became Champion of England.","zh":"直到1790年的第三场比赛，他才最终击败汉弗莱斯，成为英格兰冠军。","kind":"text"},{"t":143.5,"en":"Meanwhile, he founded a highly successful Academy and even Lord Byron became one of his pupils.","zh":"同时，他创办了一所非常成功的拳击学院，甚至拜伦勋爵也成了他的学生之一。","kind":"text"},{"t":151.59,"en":"He earned enormous sums of money and was paid as much as ￡100 for a single appearance.","zh":"他赚取了巨额财富，单次出场费高达100英镑。","kind":"text"},{"t":159.85,"en":"Despite this, he was so extravagant that he was always in debt.","zh":"尽管如此，他非常奢侈，总是负债累累。","kind":"text"},{"t":165.91,"en":"After he was defeated by a boxer called Gentleman Jackson, he was quickly forgotten.","zh":"在他被一位名叫“绅士”杰克逊的拳击手击败后，他很快就被遗忘了。","kind":"text"},{"t":172.53,"en":"He was sent to prison for failing to pay his debts and died in poverty in 1836.","zh":"他因未能偿还债务而被送进监狱，并于1836年贫困潦倒地去世。","kind":"text"}]},{"id":"NCE3-22","book":"NCE3","bookCn":"第三册","num":22,"title":"By Heart","slug":"22.By Heart","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/22.By%20Heart.mp3","sentenceCount":23,"wordCount":356,"lines":[{"t":0.51,"en":"Lesson 22","zh":"第22课","kind":"lesson"},{"t":2.55,"en":"By heart","zh":"熟记于心","kind":"title"},{"t":9.44,"en":"Which actor read the letter in the end, the aristocrat or the gaoler?","zh":"最终是哪位演员读了信，是贵族还是狱卒？","kind":"question"},{"t":17.32,"en":"Some plays are so successful that they run for years on end.","zh":"有些戏剧非常成功，一连上演好几年。","kind":"text"},{"t":22.41,"en":"In many ways, this is unfortunate for the poor actors who are required to go on repeating the same lines night after night.","zh":"在许多方面，这对可怜的演员来说是不幸的，他们被要求夜复一夜地重复相同的台词。","kind":"text"},{"t":32.97,"en":"One would expect them to know their parts by heart and never have cause to falter.","zh":"人们会期望他们熟记自己的角色台词，永不结巴。","kind":"text"},{"t":39.12,"en":"Yet this is not always the case.","zh":"然而，事实并非总是如此。","kind":"text"},{"t":42.81,"en":"A famous actor in a highly successful play was once cast in the role of an aristocrat who had been imprisoned in the Bastille for twenty years.","zh":"一部非常成功的戏剧中，一位著名演员曾被塑造成一位在巴士底狱被囚禁了二十年的贵族。","kind":"text"},{"t":54.25,"en":"In the last act, a gaoler would always come on to the stage with a letter which he would hand to the prisoner.","zh":"在最后一幕中，一个狱卒总是会带着一封信上台，然后递给囚犯。","kind":"text"},{"t":63.38,"en":"Even though the noble was expected to read the letter at each performance, he always insisted that it should be written out in full.","zh":"尽管这位贵族在每次表演中都应该读这封信，但他总是坚持信应该写得清清楚楚。","kind":"text"},{"t":72.81,"en":"One night, the gaoler decided to play a joke on his colleague to find out if,","zh":"一天晚上，狱卒决定和他的同事开个玩笑，想看看，","kind":"text"},{"t":78.41,"en":"after so many performances, he had managed to learn the contents of the letter by heart.","zh":"在这么多场演出之后，他是否已经把信的内容熟记于心。","kind":"text"},{"t":85.45,"en":"The curtain went up on the final act of the play and revealed the aristocrat sitting alone behind bars in his dark cell.","zh":"戏剧的最后一幕拉开了帷幕，露出了贵族独自一人坐在漆黑牢房的铁窗后面。","kind":"text"},{"t":95.16,"en":"Just then, the gaoler appeared with the precious letter in his hands.","zh":"就在那时，狱卒手里拿着那封珍贵的信出现了。","kind":"text"},{"t":100.55,"en":"He entered the cell and presented the letter to the aristocrat.","zh":"他走进牢房，把信递给了贵族。","kind":"text"},{"t":105.36,"en":"But the copy he gave him had not been written out in full as usual.","zh":"但他给他的那份信件并未像往常一样完整写出。","kind":"text"},{"t":110.5,"en":"It was simply a blank sheet of paper.","zh":"那只是一张白纸。","kind":"text"},{"t":114.14,"en":"The gaoler looked on eagerly, anxious to see if his fellow actor had at last learnt his lines.","zh":"狱卒焦急地看着，渴望知道他的同事演员是否终于记住了台词。","kind":"text"},{"t":122.23,"en":"The noble stared at the blank sheet of paper for a few seconds.","zh":"贵族盯着那张白纸看了几秒钟。","kind":"text"},{"t":127.45,"en":"Then, squinting his eyes, he said: 'The light is dim. Read the letter to me.'","zh":"然后，他眯着眼睛说：“光线太暗了。你把信念给我听吧。”","kind":"text"},{"t":136.04,"en":"And he promptly handed the sheet of paper to the gaoler.","zh":"他立刻把那张纸递给了狱卒。","kind":"text"},{"t":140.49,"en":"Finding that he could not remember a word of the letter either,","zh":"狱卒发现自己也记不住信里一个字，","kind":"text"},{"t":144.83,"en":"the gaoler replied: 'The light is indeed dim, sire. I must get my glasses. '","zh":"他回答说：“陛下，光线确实很暗。我必须去拿我的眼镜。”","kind":"text"},{"t":152.56,"en":"With this, he hurried off the stage.","zh":"说完，他匆匆忙忙地下了台。","kind":"text"},{"t":156.38,"en":"Much to the aristocrat's amusement,","zh":"令贵族非常有趣的是，","kind":"text"},{"t":158.83,"en":"the gaoler returned a few moments later with a pair of glasses and the usual copy of the letter which he proceeded to read to the prisoner.","zh":"狱卒几分钟后带着一副眼镜和往常那封信的副本回来了，然后他开始念给囚犯听。","kind":"text"}]},{"id":"NCE3-23","book":"NCE3","bookCn":"第三册","num":23,"title":"One Man's Meat is Another Man's Poison","slug":"23.One Man's Meat is Another Man's Poison","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/23.One%20Man%27s%20Meat%20is%20Another%20Man%27s%20Poison.mp3","sentenceCount":23,"wordCount":356,"lines":[{"t":0.35,"en":"Lesson 23","zh":"第23课","kind":"lesson"},{"t":2.28,"en":"One man's meat is another man's poison","zh":"各有所爱","kind":"title"},{"t":11.55,"en":"What was it about snails that made the writer collect them for his friend on that day in particular?","zh":"是什么让作者在那天为他的朋友特别收集蜗牛呢？","kind":"question"},{"t":20.29,"en":"People become quite illogical when they try to decide what can be eaten and what cannot be eaten.","zh":"人们在决定什么能吃，什么不能吃的时候，会变得相当不合逻辑。","kind":"text"},{"t":28.51,"en":"If you lived in the Mediterranean, for instance, you would consider octopus a great delicacy.","zh":"例如，如果你住在地中海地区，你会认为章鱼是人间美味。","kind":"text"},{"t":35.92,"en":"You would not be able to understand why some people find it repulsive.","zh":"你会不理解为什么有些人觉得它令人厌恶。","kind":"text"},{"t":41.78,"en":"On the other hand, your stomach would turn at the idea of frying potatoes in animal fat-the normally accepted practice in many northern countries.","zh":"另一方面，一想到用动物脂肪炸土豆——这在许多北方国家是普遍接受的做法——你就会反胃。","kind":"text"},{"t":53.91,"en":"The sad truth is that most of us have been brought up to eat certain foods and we stick to them all our lives.","zh":"可悲的事实是，我们大多数人从小就被教导吃某些食物，并且我们一生都坚持这些食物。","kind":"text"},{"t":63.19,"en":"No creature has received more praise and abuse than the common garden snail.","zh":"没有哪种生物比普通的园林蜗牛得到过更多的赞扬和辱骂。","kind":"text"},{"t":69.56,"en":"Cooked in wine, snails are a great luxury in various parts of the world.","zh":"用酒烹制的蜗牛在世界各地都是一种高级奢侈品。","kind":"text"},{"t":75.43,"en":"There are countless people who, ever since their early years, have learned to associate snails with food.","zh":"无数人从小就学会将蜗牛与食物联系在一起。","kind":"text"},{"t":84.2,"en":"My friend, Robert, lives in a country where snails are despised.","zh":"我的朋友罗伯特住在一个厌恶蜗牛的国家。","kind":"text"},{"t":90.31,"en":"As his flat is in a large town, he has no garden of his own.","zh":"因为他的公寓在一个大城镇里，他没有自己的花园。","kind":"text"},{"t":95.31,"en":"For years he has been asking me to collect snails from my garden and take them to him.","zh":"多年来他一直让我从我的花园里收集蜗牛带给他。","kind":"text"},{"t":102.46,"en":"The idea never appealed to me very much, but one day, after a heavy shower,","zh":"这个想法从来没有太吸引我，但有一天，在一场大雨之后，","kind":"text"},{"t":109.17,"en":"I happened to be walking in my garden when I noticed a huge number of snails taking a stroll on some of my prize plants.","zh":"我碰巧在我的花园里散步，这时我注意到大量的蜗牛在我的几株珍贵植物上爬行。","kind":"text"},{"t":118.55,"en":"Acting on a sudden impulse, I collected several dozen, put them in a paper bag, and took them to Robert.","zh":"我一时冲动，收集了几十只，把它们放进一个纸袋里，然后带给了罗伯特。","kind":"text"},{"t":127.01,"en":"Robert was delighted to see me and equally pleased with my little gift.","zh":"罗伯特很高兴见到我，也同样喜欢我的小礼物。","kind":"text"},{"t":133.03,"en":"I left the bag in the hall and Robert and I went into the living room where we talked for a couple of hours.","zh":"我把袋子留在门厅里，罗伯特和我走进客厅，我们在那里聊了几个小时。","kind":"text"},{"t":140.56,"en":"I had forgotten all about the snails when Robert suddenly said that I must stay to dinner.","zh":"我已经完全忘记了蜗牛，这时罗伯特突然说我必须留下来吃晚饭。","kind":"text"},{"t":147.73,"en":"Snails would, of course, be the main dish.","zh":"蜗牛当然是主菜。","kind":"text"},{"t":151.79,"en":"I did not fancy the idea and I reluctantly followed Robert out of the room.","zh":"我不喜欢这个主意，我只好不情愿地跟着罗伯特离开了房间。","kind":"text"},{"t":157.9,"en":"To our dismay,","zh":"令我们沮丧的是，","kind":"text"},{"t":159.7,"en":"we saw that there were snails everywhere:","zh":"我们看到到处都是蜗牛：","kind":"text"},{"t":162.97,"en":"they had escaped from the paper bag","zh":"它们已经从纸袋里跑了出来","kind":"text"},{"t":165.4,"en":"and had taken complete possession of the hall! I have never be able to look at a snail since then.","zh":"并且完全占据了门厅！从那时起，我再也无法正眼看蜗牛了。","kind":"text"}]},{"id":"NCE3-24","book":"NCE3","bookCn":"第三册","num":24,"title":"A Skeleton in the Cupboard","slug":"24.A Skeleton in the Cupboard","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/24.A%20Skeleton%20in%20the%20Cupboard.mp3","sentenceCount":25,"wordCount":356,"lines":[{"t":0.34,"en":"Lesson 24","zh":"第24课","kind":"lesson"},{"t":2.44,"en":"A skeleton in the cupboard","zh":"橱柜里的骷髅","kind":"title"},{"t":9.68,"en":"Who was Sebastian?","zh":"塞巴斯蒂安是谁？","kind":"question"},{"t":11.87,"en":"We often read in novels how a seemingly respectable person","zh":"我们经常在小说中读到，一个看似体面的人","kind":"text"},{"t":17.06,"en":"or family has some terrible secret which has been concealed from strangers for years.","zh":"或家庭隐藏着某个可怕的秘密，多年来一直对陌生人保密。","kind":"text"},{"t":24.73,"en":"The English language possesses a vivid saying to describe this sort of situation.","zh":"英语中有一个生动的说法来描述这种情况。","kind":"text"},{"t":30.61,"en":"The terrible secret is called 'a skeleton in the cupboard'.","zh":"这个可怕的秘密被称为“橱柜里的骷髅”。","kind":"text"},{"t":35.69,"en":"At some dramatic moment in the story, the terrible secret becomes known and a reputation is ruined.","zh":"在故事的某个戏剧性时刻，这个可怕的秘密公诸于世，声誉也随之毁掉。","kind":"text"},{"t":43.08,"en":"The reader's hair stands on end when he reads in the final pages of the novel that the heroine,","zh":"当读者在小说的最后几页读到女主人公——","kind":"text"},{"t":49.34,"en":"a dear old lady who had always been so kind to everybody, had, in her youth, poisoned every one of her five husbands.","zh":"一位一直对每个人都非常和蔼可亲的老太太，在年轻时毒死了她的五个丈夫时，会毛骨悚然。","kind":"text"},{"t":59.79,"en":"It is all very well for such things to occur in fiction.","zh":"这种事情发生在小说里是完全可以的。","kind":"text"},{"t":64.47,"en":"To varying degrees, we all have secrets which we do not want even our closest friends to learn,","zh":"在不同程度上，我们都有一些甚至不想让最亲密的朋友知道的秘密，","kind":"text"},{"t":71.76,"en":"but few of us have skeletons in the cupboard.","zh":"但我们中很少有人有“橱柜里的骷髅”。","kind":"text"},{"t":75.5,"en":"The only person I know who has a skeleton in the cupboard is George Carlton, and he is very proud of the fact.","zh":"我认识的唯一一个有“橱柜里的骷髅”的人是乔治·卡尔顿，他对此引以为豪。","kind":"text"},{"t":83.87,"en":"George studied medicine in his youth.","zh":"乔治年轻时学医。","kind":"text"},{"t":86.67,"en":"Instead of becoming a doctor, however, he became a successful writer of detective stories.","zh":"然而，他没有成为一名医生，而是成为了一名成功的侦探小说作家。","kind":"text"},{"t":93.77,"en":"I once spent an uncomfortable weekend which I shall never forget at his house.","zh":"我有一次在他家度过了一个令我永生难忘的不舒服的周末。","kind":"text"},{"t":99.38,"en":"George showed me to the guestroom which, he said, was rarely used.","zh":"乔治把我带到客房，他说那个房间很少用。","kind":"text"},{"t":104.02,"en":"He told me to unpack my things and then come down to dinner.","zh":"他让我把行李打开，然后下来吃饭。","kind":"text"},{"t":108.33,"en":"After I had stacked my shirts and underclothes in two empty drawers, I decided to hang one of the two suits I had brought with me in the cupboard.","zh":"我把衬衫和内衣叠放在两个空抽屉里后，决定把我带来的两套西装中的一套挂在橱柜里。","kind":"text"},{"t":118.38,"en":"I opened the cupboard door and then stood in front of it petrified.","zh":"我打开橱柜门，然后僵在原地，吓呆了。","kind":"text"},{"t":123.32,"en":"A skeleton was dangling before my eyes.","zh":"一个骷髅在我眼前晃动。","kind":"text"},{"t":127.06,"en":"The sudden movement of the door made it sway slightly and it gave me the impression that it was about to leap out at me.","zh":"门的突然移动使它轻轻摇晃，给我一种它要向我扑过来的感觉。","kind":"text"},{"t":135.32,"en":"Dropping my suit, I dashed downstairs to tell George.","zh":"我扔下西装，冲下楼去告诉乔治。","kind":"text"},{"t":140.4,"en":"This was worse than 'a terrible secret'; this was a real skeleton!","zh":"这比“可怕的秘密”更糟糕；这是一个真正的骷髅！","kind":"text"},{"t":145.85,"en":"But George was unsympathetic.","zh":"但乔治无动于衷。","kind":"text"},{"t":148.42,"en":"'Oh, that,' he said with a smile as if he were talking about an old friend.","zh":"“哦，那个啊，”他微笑着说，好像在谈论一位老朋友。","kind":"text"},{"t":154.56,"en":"'That's Sebastian. You forget that I was a medical student once upon a time.'","zh":"“那是塞巴斯蒂安。你忘了我以前也是个医学院的学生。”","kind":"text"}]},{"id":"NCE3-25","book":"NCE3","bookCn":"第三册","num":25,"title":"The Cutty Sark","slug":"25.The Cutty Sark","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/25.The%20Cutty%20Sark.mp3","sentenceCount":26,"wordCount":367,"lines":[{"t":0.32,"en":"Lesson 25","zh":"第25课","kind":"lesson"},{"t":2.35,"en":"The Cutty Sark","zh":"卡蒂萨克号","kind":"title"},{"t":9.48,"en":"What piece of bad luck prevented the Cutty Sark from winning the race?","zh":"什么厄运阻止了卡蒂萨克号赢得比赛？","kind":"question"},{"t":16.14,"en":"One of the most famous sailing ships of the nineteenth century, the Cutty Sark, can still be seen at Greenwich.","zh":"19世纪最著名的帆船之一，“卡蒂萨克”号至今仍可在格林威治见到。","kind":"text"},{"t":24.39,"en":"She stands on dry land and is visited by thousands of people each year.","zh":"她停泊在陆地上，每年都有成千上万的人参观。","kind":"text"},{"t":30.28,"en":"She serves as an impressive reminder of the great ships of the past.","zh":"她作为对过去伟大船只的深刻纪念。","kind":"text"},{"t":36.09,"en":"Before they were replaced by steamships,","zh":"在它们被蒸汽船取代之前，","kind":"text"},{"t":39.07,"en":"sailing vessels like the Cutty Sark were used to carry tea from China and wool from Australia.","zh":"像卡蒂萨克号这样的帆船被用来从中国运茶，从澳大利亚运羊毛。","kind":"text"},{"t":47.25,"en":"The Cutty Sark was one of the fastest sailing ships that has ever been built.","zh":"卡蒂萨克号是建造过的最快的帆船之一。","kind":"text"},{"t":53.22,"en":"The only other ship to match her was the Thermopylae.","zh":"唯一能与她匹敌的船是“特莫皮莱”号。","kind":"text"},{"t":58.15,"en":"Both these ships set out from Shanghai on June 18th, 1872 on an exciting race to England.","zh":"这两艘船于1872年6月18日从上海启程，进行一场激动人心的英国竞赛。","kind":"text"},{"t":67.82,"en":"This race, which went on for exactly four months, was the last of its kind.","zh":"这场持续了整整四个月的比赛是同类比赛中的最后一场。","kind":"text"},{"t":74.61,"en":"It marked the end of the great tradition of ships with sails and the beginning of a new era.","zh":"它标志着帆船伟大传统的结束和新时代的开始。","kind":"text"},{"t":82.51,"en":"The first of the two ships to reach Java after the race had begun was the Thermopylae,","zh":"比赛开始后，两艘船中最先抵达爪哇的是“特莫皮莱”号，","kind":"text"},{"t":89.6,"en":"but on the Indian Ocean, the Cutty Sark took the lead.","zh":"但在印度洋上，“卡蒂萨克”号取得了领先。","kind":"text"},{"t":93.88,"en":"It seemed certain that she would be the first ship home,","zh":"似乎她肯定会是第一艘抵达的船，","kind":"text"},{"t":97.67,"en":"but during the race she had a lot of bad luck.","zh":"但在比赛中她遭遇了很多厄运。","kind":"text"},{"t":101.86,"en":"In August, she was struck by a very heavy storm during which her rudder was torn away.","zh":"八月，她遭遇了一场特大风暴，船舵被刮走了。","kind":"text"},{"t":109.43,"en":"The Cutty Sark rolled from side to side and it became impossible to steer her.","zh":"卡蒂萨克号左右摇晃，无法掌舵。","kind":"text"},{"t":115.93,"en":"A temporary rudder was made on board from spare planks and it was fitted with great difficulty.","zh":"船上用备用木板做了一个临时船舵，并费了很大力气才安装好。","kind":"text"},{"t":123.64,"en":"This greatly reduced the speed of the ship, for there was a danger that if she travelled too quickly,","zh":"这大大降低了船速，因为存在一个危险，如果她航行过快，","kind":"text"},{"t":130.86,"en":"this rudder would be torn away as well.","zh":"这个船舵也会被刮走。","kind":"text"},{"t":134.6,"en":"Because of this, the Cutty Sark lost her lead.","zh":"因此，卡蒂萨克号失去了领先地位。","kind":"text"},{"t":138.74,"en":"After crossing the Equator, the captain called in at a port to have a new rudder fitted,","zh":"越过赤道后，船长在一个港口停靠，安装了一个新船舵，","kind":"text"},{"t":145.65,"en":"but by now the Thermopylae was over five hundred miles ahead.","zh":"但此时“特莫皮莱”号已经领先五百多英里了。","kind":"text"},{"t":150.98,"en":"Though the new rudder was fitted at tremendous speed, it was impossible for the Cutty Sark to win.","zh":"尽管新船舵以惊人的速度安装好了，卡蒂萨克号还是不可能赢得比赛。","kind":"text"},{"t":159.18,"en":"She arrived in England a week after the Thermopylae.","zh":"她在“特莫皮莱”号之后一周抵达英国。","kind":"text"},{"t":163.39,"en":"Even this was remarkable, considering that she had had so many delays.","zh":"考虑到她有如此多的延误，即使这样也值得称赞。","kind":"text"},{"t":169.29,"en":"There is no doubt that if she had not lost her rudder she would have won the race easily.","zh":"毫无疑问，如果她没有失去船舵，她会轻易赢得比赛。","kind":"text"}]},{"id":"NCE3-26","book":"NCE3","bookCn":"第三册","num":26,"title":"Wanted a Large Biscuit Tin","slug":"26.Wanted a Large Biscuit Tin","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/26.Wanted%20a%20Large%20Biscuit%20Tin.mp3","sentenceCount":26,"wordCount":350,"lines":[{"t":0.46,"en":"Lesson 26","zh":"第26课","kind":"lesson"},{"t":2.45,"en":"Wanted: a large biscuit tin","zh":"征集：一个大饼干盒","kind":"title"},{"t":11.15,"en":"Who won the prize for the biggest biscuit?","zh":"谁赢得了最大饼干的奖品？","kind":"question"},{"t":15.29,"en":"No one can avoid being influenced by advertisements.","zh":"没人能避免受到广告的影响。","kind":"text"},{"t":19.62,"en":"Much as we may pride ourselves on our good taste,","zh":"尽管我们可能为自己的好品味而自豪，","kind":"text"},{"t":23.32,"en":"we are no longer free to choose the things we want,","zh":"但我们不再能自由选择我们想要的东西，","kind":"text"},{"t":26.61,"en":"for advertising exerts a subtle influence on us.","zh":"因为广告对我们施加着微妙的影响。","kind":"text"},{"t":30.96,"en":"In their efforts to persuade us to buy this or that product,","zh":"为了说服我们购买这种或那种产品，","kind":"text"},{"t":35.11,"en":"advertisers have made a close study of human nature and have classified all our little weaknesses.","zh":"广告商们已经深入研究了人性，并对我们所有的小缺点进行了分类。","kind":"text"},{"t":43.15,"en":"Advertisers discovered years ago that all of us love to get something for nothing.","zh":"广告商多年前就发现，我们所有人都喜欢不劳而获。","kind":"text"},{"t":48.96,"en":"An advertisement which begins with the magic word FREE can rarely go wrong.","zh":"以“免费”这个神奇词语开头的广告很少会出错。","kind":"text"},{"t":55.87,"en":"These days, advertisers not only offer free samples,","zh":"如今，广告商不仅提供免费样品，","kind":"text"},{"t":59.82,"en":"but free cars, free houses, and free trips round the world as well.","zh":"还提供免费汽车、免费房屋，以及免费环球旅行。","kind":"text"},{"t":66.8,"en":"They devise hundreds of competitions which will enable us to win huge sums of money.","zh":"他们设计了数百种竞赛，使我们能够赢得巨额奖金。","kind":"text"},{"t":72.73,"en":"Radio and television have made it possible for advertisers to capture the attention of millions of people in this way.","zh":"无线电和电视使广告商能够通过这种方式吸引数百万人的注意力。","kind":"text"},{"t":81.12,"en":"During a radio programme, a company of biscuit manufacturers once asked listeners to bake biscuits and send them to their factory.","zh":"在一个广播节目中，一家饼干制造商曾要求听众烘烤饼干并寄到他们的工厂。","kind":"text"},{"t":91.29,"en":"They offered to pay $10 a pound for the biggest biscuit baked by a listener.","zh":"他们提出为听众烘烤的最大饼干支付每磅10美元。","kind":"text"},{"t":97.09,"en":"The response to this competition was tremendous.","zh":"这项竞赛的反响非常热烈。","kind":"text"},{"t":100.86,"en":"Before long, biscuits of all shapes and sizes began arriving at the factory.","zh":"不久，各种形状和大小的饼干开始运抵工厂。","kind":"text"},{"t":107.05,"en":"One lady brought biscuit on a wheelbarrow. It weighed nearly 500 pounds.","zh":"一位女士用独轮手推车运来一块饼干。它重近500磅。","kind":"text"},{"t":113.41,"en":"A little later, a man came along with a biscuit which occupied the whole boot of his car.","zh":"稍后，一位男士带来一块饼干，它占满了他的汽车后备箱。","kind":"text"},{"t":120.71,"en":"All the biscuits that were sent were carefully weighed.","zh":"所有送来的饼干都被仔细称重。","kind":"text"},{"t":124.3,"en":"The largest was 713 pounds. It seemed certain that this would win the prize.","zh":"最大的一块重713磅。这似乎肯定会赢得奖品。","kind":"text"},{"t":132.33,"en":"But just before the competition closed,","zh":"但就在竞赛结束前，","kind":"text"},{"t":135.63,"en":"a lorry arrived at the factory with a truly colossal biscuit which weighed 2, 400 pounds.","zh":"一辆卡车运载着一块重达2400磅的巨型饼干抵达工厂。","kind":"text"},{"t":144.44,"en":"It had been baked by a college student who had used over 1, 000 pounds of flour, 800 pounds of sugar,","zh":"它是由一名大学生烘烤的，他使用了超过1000磅面粉、800磅糖、","kind":"text"},{"t":152.59,"en":"200 pounds of fat, and 400 pounds of various other ingredients.","zh":"200磅脂肪和400磅其他各种配料。","kind":"text"},{"t":158.26,"en":"It was so heavy that a crane had to be used to remove it from the lorry.","zh":"它太重了，不得不动用起重机将其从卡车上卸下。","kind":"text"},{"t":163.97,"en":"The manufacturers had to pay more money than they had anticipated, for they bought the biscuit from the student for $24, 000.","zh":"制造商不得不支付超出他们预期的金额，因为他们以24000美元从这名学生手中买下了这块饼干。","kind":"text"}]},{"id":"NCE3-27","book":"NCE3","bookCn":"第三册","num":27,"title":"Nothing to Sell and Nothing to Buy","slug":"27.Nothing to Sell and Nothing to Buy","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/27.Nothing%20to%20Sell%20and%20Nothing%20to%20Buy.mp3","sentenceCount":24,"wordCount":347,"lines":[{"t":0.3,"en":"Lesson 27","zh":"第27课","kind":"lesson"},{"t":2.43,"en":"Nothing to sell and nothing to buy","zh":"无物可卖，无物可买","kind":"title"},{"t":11.24,"en":"What is the most important thing for a tramp?","zh":"对一个流浪汉来说，什么是最重要的？","kind":"question"},{"t":16.99,"en":"It has been said that everyone lives by selling something.","zh":"有人说，人人都靠出售某种东西来维持生活。","kind":"text"},{"t":21.3,"en":"In the light of this statement, teachers live by selling knowledge,","zh":"依此而论，教师靠出售知识为生，","kind":"text"},{"t":25.93,"en":"philosophers by selling wisdom and priests by selling spiritual comfort.","zh":"哲学家靠出售智慧为生，牧师靠出售精神安慰为生。","kind":"text"},{"t":31.97,"en":"Though it may be possible to measure the value of material goods in terms of money,","zh":"衡量物质产品的价值或许可以用金钱尺度，","kind":"text"},{"t":38.43,"en":"it is extremely difficult to estimate the true value of the services which people perform for us.","zh":"但要估量人们为我们提供的服务的真正价值是极其困难的。","kind":"text"},{"t":46.57,"en":"There are times when we would willingly give everything we possess to save our lives,","zh":"有时，我们甘愿付出我们所拥有的一切来挽救自己的生命，","kind":"text"},{"t":52.85,"en":"yet we might grudge paying a surgeon a high fee for offering us precisely this service.","zh":"然而我们却可能不愿支付一个外科医生为我们提供了这种服务而索取的高额费用。","kind":"text"},{"t":60.36,"en":"The conditions of society are such that skills have to be paid for in the same way that goods are paid for at a shop.","zh":"社会现状是，技术和商店里的商品一样，是需要花钱购买的。","kind":"text"},{"t":68.79,"en":"Everyone has something to sell.","zh":"人人都有东西可卖。","kind":"text"},{"t":72.01,"en":"Tramps seem to be the only exception to this general rule.","zh":"流浪汉似乎是这条普遍规律的唯一例外。","kind":"text"},{"t":76.71,"en":"Beggars almost sell themselves as human beings to arouse the pity of passers-by.","zh":"乞丐几乎是出卖他们自身以博得过路人的同情。","kind":"text"},{"t":83.13,"en":"But real tramps are not beggars.","zh":"但真正的流浪汉不是乞丐。","kind":"text"},{"t":85.62,"en":"They have nothing to sell and require nothing from others.","zh":"他们无物可卖，也无需别人的任何东西。","kind":"text"},{"t":90.15,"en":"In seeking independence, they do not sacrifice their human dignity.","zh":"在寻求独立的同时，他们并没有牺牲自己做人的尊严。","kind":"text"},{"t":95.55,"en":"A tramp may ask you for money, but he will never ask you to feel sorry for him.","zh":"流浪汉可能会向你要钱，但他绝不会让你可怜他。","kind":"text"},{"t":101.54,"en":"He has deliberately chosen to lead the life he leads and is fully aware of the consequences.","zh":"他是故意选择他所过的这种生活的，并且完全清楚这种选择的后果。","kind":"text"},{"t":109.15,"en":"He may never be sure where the next meal is coming from,","zh":"他可能从不确定下一顿饭的着落，","kind":"text"},{"t":113.69,"en":"but he is free from the thousands of anxieties which afflict other people.","zh":"但他却摆脱了困扰其他人的成千上万的忧虑。","kind":"text"},{"t":119.99,"en":"His few material possessions make it possible for him to move from place to place with ease.","zh":"他那一点点物质财富使他能够轻松自如地从一个地方走到另一个地方。","kind":"text"},{"t":127.89,"en":"By having to sleep in the open, he gets far closer to the world of nature than most of us ever do.","zh":"由于不得不露宿野外，他比我们大多数人任何时候都更接近大自然。","kind":"text"},{"t":136.18,"en":"He may hunt, beg, or steal occasionally to keep himself alive;","zh":"他可能偶尔狩猎、乞讨或偷窃以维持生存；","kind":"text"},{"t":141.89,"en":"he may even, in times of real need, do a little work; but he will never sacrifice his freedom.","zh":"在真正需要的时候，他甚至可以做一点工作；但他绝不会牺牲他的自由。","kind":"text"},{"t":150.07,"en":"We often speak of tramps with contempt and put them in the same class as beggars,","zh":"我们经常轻蔑地谈起流浪汉，并把他们和乞丐划为一类，","kind":"text"},{"t":156.15,"en":"but how many of us can honestly say that we have not felt a little envious of their simple way of life and their freedom from care?","zh":"但我们中有多少人能诚实地说，我们没有一点羡慕他们那种简单的生活方式和无忧无虑的生活呢？","kind":"text"}]},{"id":"NCE3-28","book":"NCE3","bookCn":"第三册","num":28,"title":"Five Pounds Too Dear","slug":"28.Five Pounds Too Dear","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/28.Five%20Pounds%20Too%20Dear.mp3","sentenceCount":27,"wordCount":364,"lines":[{"t":0.36,"en":"Lesson 28","zh":"第28课","kind":"lesson"},{"t":2.68,"en":"Five pounds too dear","zh":"五镑也嫌贵","kind":"title"},{"t":10.72,"en":"Why was even five pounds 'too dear' ?","zh":"为什么连五镑也“嫌贵”？","kind":"question"},{"t":16.88,"en":"Small boats loaded with wares sped to the great liner as she was entering the harbour.","zh":"当那艘巨型客轮驶进港口的时候，许多装载着货品的小船疾驶着向它靠拢。","kind":"text"},{"t":23.63,"en":"Before she had anchored, the men from the boats had climbed on board","zh":"没等船停稳，小船上的人就爬上了客轮。","kind":"text"},{"t":28.49,"en":"and the decks were soon covered with colourful rugs from Persia,","zh":"甲板上很快就摆满了：来自波斯的五光十色的地毯、","kind":"text"},{"t":33.3,"en":"silks from India, copper coffee pots, and beautiful handmade silverware.","zh":"印度的丝绸、铜咖啡壶以及制作精美的手工银器。","kind":"text"},{"t":40.08,"en":"It was difficult not to be tempted.","zh":"谁都很难不为之所动。","kind":"text"},{"t":43.3,"en":"Many of the tourists on board had begun bargaining with the tradesmen,","zh":"船上许多游客已和小贩们讨价还价起来，","kind":"text"},{"t":47.47,"en":"but I decided not to buy anything until I had disembarked.","zh":"而我却决定不买任何东西，直到下船为止。","kind":"text"},{"t":53.56,"en":"I had no sooner got off the ship than I was assailed by a man who wanted to sell me a diamond ring.","zh":"我刚一下船，就受到一个要向我兜售钻石戒指的人的纠缠。","kind":"text"},{"t":62.16,"en":"I had no intention of buying one,","zh":"我根本不想买钻石戒指，","kind":"text"},{"t":64.87,"en":"but I could not conceal the fact that I was impressed by the size of the diamonds.","zh":"但我不得不承认我还是给那些钻石的大小留下了深刻的印象。","kind":"text"},{"t":71.44,"en":"Some of them were as big as marbles.","zh":"有些钻石大得像弹子。","kind":"text"},{"t":74.63,"en":"The man went to great lengths to prove that the diamonds were real.","zh":"那个人竭力证明他的钻石是真的。","kind":"text"},{"t":79.9,"en":"As we were walking past a shop, he held a diamond firmly against the window and made a deep impression in the glass.","zh":"当我们走过一家商店的时候，他把一枚钻石使劲地抵在橱窗上，在玻璃上划出了一道深痕。","kind":"text"},{"t":88.9,"en":"It took me over half an hour to get rid of him.","zh":"我花了半个多小时才摆脱了他。","kind":"text"},{"t":92.93,"en":"The next man to approach me was selling expensive pens and watches.","zh":"第二个向我走来的人是卖高档钢笔和手表的。","kind":"text"},{"t":98.1,"en":"I examined one of the pens closely. It certainly looked genuine.","zh":"我仔细地察看了一支钢笔。它看上去确实是真品。","kind":"text"},{"t":103.79,"en":"At the base of the gold cap, the words 'made in the U.S.A.' had been neatly inscribed.","zh":"在金笔帽的底部，刻有“美国制造”的字样。","kind":"text"},{"t":112.31,"en":"The man said that the pen was worth ￡50, but as a special favour, he would let me have it for ￡30.","zh":"那人说这支笔值50镑，但作为特别优惠，他愿以30镑卖给我。","kind":"text"},{"t":122.21,"en":"I shook my head and held up five fingers indicating that I was willing to pay ￡5.","zh":"我摇了摇头，伸出5个手指，表示我愿付5镑。","kind":"text"},{"t":130.51,"en":"Gesticulating wildly, the man acted as if he found my offer outrageous,","zh":"那人狂乱地打着手势，装出我的出价不可思议的样子，","kind":"text"},{"t":137.42,"en":"but he eventually reduced the price to 10 pounds.","zh":"但最终还是把价格降到了10镑。","kind":"text"},{"t":142.62,"en":"Shrugging my shoulders I began to walk away when,","zh":"我耸了耸肩膀，刚要走开，","kind":"text"},{"t":146.62,"en":"a moment later, he ran after me and thrust the pen into my hands.","zh":"片刻之后，他便追了上来，把钢笔塞到我手里。","kind":"text"},{"t":153.35,"en":"Though he kept throwing up his arms in despair, he readily accepted the ￡5 I gave him.","zh":"尽管他不停地绝望地挥舞着双臂，但他还是爽快地收下了我给他的5镑钱。","kind":"text"},{"t":160.57,"en":"I felt especially pleased with my wonderful bargain--until I got back to the ship.","zh":"我对这笔了不起的交易特别满意——直到我回到船上。","kind":"text"},{"t":167.77,"en":"No matter how hard I tried,","zh":"无论我怎么努力，","kind":"text"},{"t":170.58,"en":"it was impossible to fill this beautiful pen with ink and to this day it has never written a single word!","zh":"也无法把墨水灌进这支漂亮的钢笔里，而且直到今天，它连一个字也没写出来过！","kind":"text"}]},{"id":"NCE3-29","book":"NCE3","bookCn":"第三册","num":29,"title":"Funny or Not","slug":"29.Funny or Not","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/29.Funny%20or%20Not.mp3","sentenceCount":27,"wordCount":354,"lines":[{"t":0.3,"en":"Lesson 29","zh":"第29课","kind":"lesson"},{"t":2.23,"en":"Funny or not?","zh":"好笑与否？","kind":"title"},{"t":9.34,"en":"What is the basis of 'sick' humour?","zh":"“病态”幽默的基础是什么？","kind":"question"},{"t":14.46,"en":"Whether we find a joke funny or not largely depends on where we have been brought up.","zh":"我们觉得一个笑话好不好笑，在很大程度上取决于我们是在哪里长大的。","kind":"text"},{"t":21.14,"en":"The sense of humour is mysteriously bound up with national characteristics.","zh":"幽默感与民族特点有着神秘的联系。","kind":"text"},{"t":27.58,"en":"A Frenchman, for instance, might find it hard to laugh at a Russian joke.","zh":"例如，法国人可能觉得俄罗斯笑话不好笑。","kind":"text"},{"t":33.15,"en":"In the same way, a Russian might fail to see anything amusing in a joke","zh":"同样，俄罗斯人可能觉得一个笑话没什么可乐的，","kind":"text"},{"t":38.74,"en":"which would make an Englishman laugh to tears.","zh":"而这个笑话却能让英国人捧腹大笑。","kind":"text"},{"t":43.08,"en":"Most funny stories are based on comic situations.","zh":"大多数有趣的故事都基于滑稽的情境。","kind":"text"},{"t":47.99,"en":"In spite of national differences, certain funny situations have a universal appeal.","zh":"尽管存在民族差异，但某些滑稽情境具有普遍的吸引力。","kind":"text"},{"t":54.56,"en":"No matter where you live,","zh":"无论你住在哪里，","kind":"text"},{"t":56.47,"en":"you would find it difficult not to laugh at, say, Charlie Chaplin's early films.","zh":"你都会觉得很难不对，比如说，查理·卓别林的早期电影发笑。","kind":"text"},{"t":63.16,"en":"However, a new type of humour, which stems largely from U.S., has recently come into fashion.","zh":"然而，一种主要源自美国的幽默新类型，最近流行起来。","kind":"text"},{"t":71.51,"en":"It is called 'sick humour'. Comedians base their jokes on tragic situations like violent death or serious accidents.","zh":"它被称为“病态幽默”。喜剧演员将他们的笑话建立在悲剧情境上，例如暴力死亡或严重事故。","kind":"text"},{"t":82.68,"en":"Many people find this sort of joke distasteful.","zh":"许多人觉得这种笑话令人反感。","kind":"text"},{"t":87.3,"en":"The following example of 'sick humour' will enable you to judge for yourself.","zh":"下面这个“病态幽默”的例子能让你自己评判。","kind":"text"},{"t":93.87,"en":"A man who had broken his right leg was taken to hospital a few weeks before Christmas.","zh":"一个右腿骨折的男人在圣诞节前几周被送进了医院。","kind":"text"},{"t":100.55,"en":"From the moment he arrived there,","zh":"从他到达那里那一刻起，","kind":"text"},{"t":102.86,"en":"he kept on pestering his doctor to tell him when he would be able to go home.","zh":"他就一直缠着医生，问他什么时候能回家。","kind":"text"},{"t":108.84,"en":"He dreaded having to spend Christmas in hospital.","zh":"他害怕不得不在医院过圣诞节。","kind":"text"},{"t":112.72,"en":"Though the doctor did his best, the patient's recovery was slow.","zh":"尽管医生尽了力，但病人的康复很慢。","kind":"text"},{"t":117.98,"en":"On Christmas day, the man still had his right leg in plaster.","zh":"圣诞节那天，这个男人右腿上仍然打着石膏。","kind":"text"},{"t":123.68,"en":"He spent a miserable day in bed thinking of all the fun he was missing.","zh":"他在床上度过了悲惨的一天，想着自己错过了所有的乐趣。","kind":"text"},{"t":129.44,"en":"The following day, however, the doctor consoled him by telling him","zh":"然而，第二天，医生安慰他说，","kind":"text"},{"t":134.27,"en":"that his chances of being able to leave hospital in time for New Year celebrations were good.","zh":"他赶在新年庆祝活动前出院的可能性很大。","kind":"text"},{"t":141.56,"en":"The man took heart and sure enough, on New Year's Eve he was able to hobble along to a party.","zh":"男人振作起来，果然，在除夕夜他能一瘸一拐地去参加派对。","kind":"text"},{"t":149.68,"en":"To compensate for his unpleasant experiences in hospital,","zh":"为了弥补他在医院的不愉快经历，","kind":"text"},{"t":154.63,"en":"the man drank a little more than was good for him.","zh":"他多喝了一点酒，这对他身体不好。","kind":"text"},{"t":158.28,"en":"In the process, he enjoyed himself thoroughly and kept telling everybody how much he hated hospitals.","zh":"在此过程中，他玩得很开心，并且不停地告诉所有人他有多么讨厌医院。","kind":"text"},{"t":167.15,"en":"He was still mumbling something about hospitals at the end of the party when he slipped on a piece of ice and broke his left leg.","zh":"派对结束时，他还在嘟囔着关于医院的事情，这时他滑到了一块冰上，摔断了左腿。","kind":"text"}]},{"id":"NCE3-30","book":"NCE3","bookCn":"第三册","num":30,"title":"The Death of a Ghost","slug":"30.The Death of a Ghost","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/30.The%20Death%20of%20a%20Ghost.mp3","sentenceCount":28,"wordCount":365,"lines":[{"t":0.35,"en":"Lesson 30","zh":"第30课","kind":"lesson"},{"t":2.09,"en":"The death of a ghost","zh":"幽灵之死","kind":"title"},{"t":9.46,"en":"Why did the two brothers keep the secret?","zh":"为什么两兄弟保守了这个秘密？","kind":"question"},{"t":13.75,"en":"For years, villagers believed that Endley farm was haunted.","zh":"多年来，村民们一直认为恩德利农场闹鬼。","kind":"text"},{"t":18.87,"en":"The farm was owned by two brothers, Joe and Bob Cox.","zh":"这个农场归乔和鲍勃·科克斯两兄弟所有。","kind":"text"},{"t":23.74,"en":"They employed a few farmhands, but no one was willing to work there long.","zh":"他们雇了一些农场工人，但没有人愿意在那里长时间工作。","kind":"text"},{"t":29.26,"en":"Every time a worker gave up his job, he told the same story.","zh":"每次有工人辞职，他们都会讲同样的故事。","kind":"text"},{"t":34.95,"en":"Farm labourers said that they always woke up to find that work had been done overnight.","zh":"农场工人说，他们醒来时总是发现工作已经在一夜之间完成了。","kind":"text"},{"t":41.59,"en":"Hay had been cut and cowsheds had been cleaned.","zh":"干草被割了，牛棚也被清理了。","kind":"text"},{"t":46.03,"en":"A farm worker, who stayed up all night, claimed to have seen a figure cutting corn in the moonlight.","zh":"一位彻夜未眠的农场工人声称在月光下看到一个身影在割玉米。","kind":"text"},{"t":53.64,"en":"In time, it became an accepted fact that the Cox brothers employed a conscientious ghost that did most of their work for them.","zh":"渐渐地，科克斯兄弟雇佣了一个尽职尽责的幽灵为他们做了大部分工作，这成了一个公认的事实。","kind":"text"},{"t":64.02,"en":"No one suspected that there might be someone else on the farm who had never been seen.","zh":"没有人怀疑农场上可能还有其他人从未被见过。","kind":"text"},{"t":70.07,"en":"This was indeed the case.","zh":"事实确实如此。","kind":"text"},{"t":72.81,"en":"A short time ago, villagers were astonished to learn that the ghost of Endley had died.","zh":"不久前，村民们惊讶地得知恩德利的幽灵已经死了。","kind":"text"},{"t":80.0,"en":"Everyone went to the funeral, for the 'ghost' was none other than Eric Cox,","zh":"所有人都去参加了葬礼，因为那个“幽灵”不是别人，正是埃里克·科克斯，","kind":"text"},{"t":86.85,"en":"a third brother who was supposed to have died as a young man.","zh":"据说他年轻时就去世了的第三个兄弟。","kind":"text"},{"t":91.43,"en":"After the funeral, Joe and Bob revealed a secret which they had kept for over fifty years.","zh":"葬礼结束后，乔和鲍勃揭露了一个他们保守了五十多年的秘密。","kind":"text"},{"t":99.48,"en":"Eric had been the eldest son of the family, very much older than his two brothers.","zh":"埃里克是家里的长子，比他的两个兄弟大得多。","kind":"text"},{"t":105.49,"en":"He had been obliged to join the army during the Second World War.","zh":"第二次世界大战期间，他被迫参军。","kind":"text"},{"t":110.25,"en":"As he hated army life, he decided to desert his regiment.","zh":"由于他厌恶军队生活，他决定开小差。","kind":"text"},{"t":116.13,"en":"When he learnt that he would be sent abroad,","zh":"当他得知自己将被派往国外时，","kind":"text"},{"t":118.99,"en":"he returned to the farm and his father hid him until the end of the war.","zh":"他回到了农场，他的父亲把他藏起来直到战争结束。","kind":"text"},{"t":124.41,"en":"Fearing the authorities, Eric remained in hiding after the war as well.","zh":"由于害怕当局，埃里克在战后也一直躲藏着。","kind":"text"},{"t":130.36,"en":"His father told everybody that Eric had been killed in action.","zh":"他的父亲告诉所有人埃里克在战斗中牺牲了。","kind":"text"},{"t":135.03,"en":"The only other people who knew the secret were Joe and Bob.","zh":"唯一知道这个秘密的其他人是乔和鲍勃。","kind":"text"},{"t":139.49,"en":"They did not even tell their wives.","zh":"他们甚至没有告诉他们的妻子。","kind":"text"},{"t":142.69,"en":"When their father died they thought it their duty to keep Eric in hiding.","zh":"当他们的父亲去世后，他们认为有责任继续把埃里克藏起来。","kind":"text"},{"t":147.7,"en":"All these years, Eric had lived as a recluse.","zh":"这么多年来，埃里克一直过着隐居生活。","kind":"text"},{"t":152.66,"en":"He used to sleep during the day and work at night,","zh":"他白天睡觉，晚上工作，","kind":"text"},{"t":155.66,"en":"quite unaware of the fact that he had become the ghost of Endley.","zh":"完全没有意识到自己已经成为了恩德利的幽灵。","kind":"text"},{"t":160.6,"en":"When he died, however, his brothers found it impossible to keep the secret any longer.","zh":"然而，当他去世后，他的兄弟们发现再也无法保守这个秘密了。","kind":"text"}]},{"id":"NCE3-31","book":"NCE3","bookCn":"第三册","num":31,"title":"A Lovable Eccentric","slug":"31.A Lovable Eccentric","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/31.A%20Lovable%20Eccentric.mp3","sentenceCount":26,"wordCount":346,"lines":[{"t":0.28,"en":"Lesson 31","zh":"第31课","kind":"lesson"},{"t":2.52,"en":"A lovable eccentric","zh":"可爱的怪人","kind":"title"},{"t":10.58,"en":"Why did the shop assistant refuse to serve Dickie?","zh":"为什么店员拒绝为迪基服务？","kind":"question"},{"t":16.37,"en":"True eccentrics never deliberately set out to draw attention to themselves.","zh":"真正的怪人从不刻意引人注目。","kind":"text"},{"t":22.11,"en":"They disregard social conventions without being conscious that they are doing anything extraordinary.","zh":"他们无视社会习俗，却没意识到自己在做任何非凡的事情。","kind":"text"},{"t":29.72,"en":"This invariably wins them the love and respect of others, for they add colour to the dull routine of everyday life.","zh":"这总能让他们赢得他人的爱戴和尊重，因为他们为平淡的日常生活增添了色彩。","kind":"text"},{"t":40.57,"en":"Up to the time of his death, Richard Colson was one of the most notable figures in our town.","zh":"直到去世，理查德·科尔森都是我们镇上最著名的人物之一。","kind":"text"},{"t":47.86,"en":"He was a shrewd and wealthy businessman,","zh":"他是一位精明富有的商人，","kind":"text"},{"t":48.62,"en":"but most people in the town hardly knew anything about this side of his life.","zh":"但镇上大多数人对他生活的这一面几乎一无所知。","kind":"text"},{"t":57.14,"en":"He was known to us all as Dickie and his eccentricity had become legendary long before he died.","zh":"他被我们称为迪基，他的怪癖在他去世前很久就已成为传奇。","kind":"text"},{"t":65.8,"en":"Dickie disliked snobs intensely.","zh":"迪基非常讨厌势利小人。","kind":"text"},{"t":68.92,"en":"Though he owned a large car, he hardly ever used it, preferring always to go on foot.","zh":"尽管他有一辆大车，但他几乎从不用它，总是喜欢步行。","kind":"text"},{"t":75.83,"en":"Even when it was raining heavily, he refused to carry an umbrella.","zh":"即使下大雨，他也不撑伞。","kind":"text"},{"t":81.11,"en":"One day, he walked into an expensive shop after having been caught in a particularly heavy shower.","zh":"一天，他在一场大雨中淋湿后走进一家昂贵的商店。","kind":"text"},{"t":89.15,"en":"He wanted to buy a ￡300 watch for his wife,","zh":"他想为妻子买一块300英镑的手表，","kind":"text"},{"t":93.97,"en":"but he was in such a bedraggled condition that an assistant refused to serve him.","zh":"但他衣衫褴褛，店员拒绝为他服务。","kind":"text"},{"t":100.84,"en":"Dickie left the shop without a word and returned carrying a large cloth bag.","zh":"迪基一言不发地离开了商店，然后提着一个大布袋回来了。","kind":"text"},{"t":107.2,"en":"As it was extremely heavy, he dumped it on the counter.","zh":"因为袋子很重，他把它扔在柜台上。","kind":"text"},{"t":111.79,"en":"The assistant asked him to leave, but Dickie paid no attention to him and requested to see the manager.","zh":"店员让他离开，但迪基没有理会他，要求见经理。","kind":"text"},{"t":120.08,"en":"Recognizing who the customer was,","zh":"经理认出了这位顾客，","kind":"text"},{"t":122.94,"en":"the manager was most apologetic and reprimanded the assistant severely.","zh":"非常抱歉，并严厉训斥了店员。","kind":"text"},{"t":129.63,"en":"When Dickie was given the watch, he presented the assistant with the cloth bag.","zh":"当迪基拿到手表时，他把布袋递给了店员。","kind":"text"},{"t":135.59,"en":"It contained ￡300 in pennies.","zh":"里面装着300英镑的便士。","kind":"text"},{"t":140.43,"en":"He insisted on the assistant's counting the money before he left--30, 000 pennies in all!","zh":"他坚持要店员在他离开前数清钱——总共3万枚便士！","kind":"text"},{"t":148.76,"en":"On another occasion, he invited a number of important critics to see his private collection of modern paintings.","zh":"另一次，他邀请了一些重要的评论家参观他的现代绘画私人收藏。","kind":"text"},{"t":157.2,"en":"This exhibition received a great deal of attention in the press,","zh":"这次展览受到了媒体的广泛关注，","kind":"text"},{"t":161.74,"en":"for though the pictures were supposed to be the work of famous artists,","zh":"因为尽管这些画被认为是著名艺术家的作品，","kind":"text"},{"t":166.56,"en":"they had in fact been painted by Dickie.","zh":"但实际上它们是迪基画的。","kind":"text"},{"t":170.63,"en":"It took him four years to stage this elaborate joke simply to prove that critics do not always know what they are talking about.","zh":"他花了四年时间策划这个精心设计的玩笑，只是为了证明评论家并不总是知道他们在说什么。","kind":"text"}]},{"id":"NCE3-32","book":"NCE3","bookCn":"第三册","num":32,"title":"A Lost Ship","slug":"32.A Lost Ship","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/32.A%20Lost%20Ship.mp3","sentenceCount":24,"wordCount":361,"lines":[{"t":0.23,"en":"Lesson 32","zh":"第32课","kind":"lesson"},{"t":2.18,"en":"A lost ship","zh":"一艘失踪的船","kind":"title"},{"t":9.03,"en":"Did the crew of the Elkor find what they were looking for? Why?","zh":"“埃尔科”号的全体船员找到他们要寻找的东西了吗？为什么？","kind":"question"},{"t":15.38,"en":"The salvage operation had been a complete failure.","zh":"打捞行动彻底失败了。","kind":"text"},{"t":19.2,"en":"The small ship, Elkor, which had been searching the Barents Sea for weeks, was on its way home.","zh":"“埃尔科”号这艘小船在巴伦支海域搜寻了几个星期后，正在返航的途中。","kind":"text"},{"t":26.72,"en":"A radio message from the mainland had been received by the ship's captain instructing him to give up the search.","zh":"船长收到了一份来自大陆的电报，指示他放弃搜寻。","kind":"text"},{"t":34.53,"en":"The captain knew that another attempt would be made later,","zh":"船长知道以后还会再进行一次尝试，","kind":"text"},{"t":38.1,"en":"for the sunken ship he was trying to find had been carrying a precious cargo of gold bullion.","zh":"因为他试图寻找的那艘沉船载有一批珍贵的金条。","kind":"text"},{"t":45.33,"en":"Despite the message, the captain of the Elkor decided to try once more.","zh":"尽管收到那份电报，“埃尔科”号的船长还是决定再试一次。","kind":"text"},{"t":51.89,"en":"The sea bed was scoured with powerful nets and there was tremendous excitement on board when a chest was raised from the bottom.","zh":"海底被强力拖网仔细搜寻，当一个箱子从海底被捞上来时，船上的人都非常兴奋。","kind":"text"},{"t":60.76,"en":"Though the crew were at first under the impression that the lost ship had been found,","zh":"虽然船员们最初以为找到了那艘失踪的船，","kind":"text"},{"t":65.99,"en":"the contents of the chest proved them wrong.","zh":"但箱子里的东西证明他们错了。","kind":"text"},{"t":69.52,"en":"What they had in fact found was a ship which had been sunk many years before.","zh":"事实上，他们找到的是一艘多年前就已经沉没的船。","kind":"text"},{"t":75.62,"en":"The chest contained the personal belongings of a seaman, Alan Fielding.","zh":"箱子里装着一个名叫艾伦·菲尔丁的海员的个人物品。","kind":"text"},{"t":80.76,"en":"There were books, clothing and photographs, together with letters which the seaman had once received from his wife.","zh":"里面有书、衣服和照片，还有海员以前从他妻子那里收到的信件。","kind":"text"},{"t":88.34,"en":"The captain of the Elkor ordered his men to salvage as much as possible from the wreck.","zh":"“埃尔科”号的船长命令他的船员尽可能多地从残骸中打捞物品。","kind":"text"},{"t":94.32,"en":"Nothing of value was found,","zh":"没找到什么有价值的东西，","kind":"text"},{"t":96.48,"en":"but the numerous items which were brought to the surface proved to be of great interest.","zh":"但打捞上来的许多物品却引起了人们极大的兴趣。","kind":"text"},{"t":101.75,"en":"From a heavy gun that was raised, the captain realized that the ship must have been a cruiser.","zh":"从打捞上来的一门重型火炮，船长意识到这艘船一定是一艘巡洋舰。","kind":"text"},{"t":108.01,"en":"In another chest which contained the belongings of a ship's officer,","zh":"在另一个箱子里，装着一名船上军官的物品，","kind":"text"},{"t":112.68,"en":"there was an unfinished letter which had been written on March 14th, 1943.","zh":"里面有一封写于1943年3月14日、尚未写完的信。","kind":"text"},{"t":120.01,"en":"The captain learnt from the letter that the name of the lost ship was the Karen.","zh":"船长从信中得知那艘失踪的船名叫“卡伦”号。","kind":"text"},{"t":125.21,"en":"The most valuable find of all was the ship's log book, parts of which it was still possible to read.","zh":"最有价值的发现是船上的航海日志，其中一部分仍然可以阅读。","kind":"text"},{"t":133.41,"en":"From this the captain was able to piece together all the information that had come to light.","zh":"从日志中，船长得以把所有已发现的信息拼凑起来。","kind":"text"},{"t":139.06,"en":"The Karen had been sailing in a convoy to Russia when she was torpedoed by an enemy submarine.","zh":"“卡伦”号当时正在驶往俄罗斯的护航船队中，结果被一艘敌方潜艇鱼雷击中。","kind":"text"},{"t":145.63,"en":"This was later confirmed by a naval official at the Ministry of Defence after the Elkor had returned home.","zh":"“埃尔科”号返回家园后，国防部的一名海军官员证实了这一点。","kind":"text"},{"t":153.16,"en":"All the items that were found were sent to the War Museum.","zh":"所有找到的物品都被送往战争博物馆。","kind":"text"}]},{"id":"NCE3-33","book":"NCE3","bookCn":"第三册","num":33,"title":"A Day to Remember","slug":"33.A Day to Remember","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/33.A%20Day%20to%20Remember.mp3","sentenceCount":28,"wordCount":359,"lines":[{"t":0.19,"en":"Lesson 33","zh":"第33课","kind":"lesson"},{"t":2.45,"en":"A day to remember","zh":"值得纪念的一天","kind":"title"},{"t":8.98,"en":"What incident began the series of traffic accidents?","zh":"是什么事件引发了这一系列交通事故？","kind":"question"},{"t":15.47,"en":"We have all experienced days when everything goes wrong.","zh":"我们都经历过事事不顺的日子。","kind":"text"},{"t":19.83,"en":"A day may begin well enough, but suddenly everything seems to get out of control.","zh":"一天也许开始得很好，但突然间一切似乎都失去了控制。","kind":"text"},{"t":25.98,"en":"What invariably happens is that a great number of things choose to go wrong at precisely the same moment.","zh":"事情总是这样，很多事情偏偏选择在同一时刻出错。","kind":"text"},{"t":33.97,"en":"It is as if a single unimportant event set up a chain of reactions.","zh":"仿佛一个微不足道的事件引发了一连串的连锁反应。","kind":"text"},{"t":39.93,"en":"Let us suppose that you are preparing a meal and keeping an eye on the baby at the same time.","zh":"假设你正在准备饭菜，同时还要照看婴儿。","kind":"text"},{"t":47.23,"en":"The telephone rings and this marks the prelude to an unforeseen series of catastrophes.","zh":"电话铃响了，这预示着一系列意想不到的灾难即将发生。","kind":"text"},{"t":55.44,"en":"While you are on the phone, the baby pulls the tablecloth off the table,","zh":"当你打电话的时候，婴儿把桌布从桌子上扯了下来，","kind":"text"},{"t":61.12,"en":"smashing half your best crockery and cutting himself in the process.","zh":"打碎了你一半最好的餐具，还把自己划伤了。","kind":"text"},{"t":66.49,"en":"You hang up hurriedly and attend to baby, crockery, etc.","zh":"你急忙挂断电话，去照看婴儿、餐具等。","kind":"text"},{"t":71.9,"en":"Meanwhile, the meal gets burnt.","zh":"与此同时，饭菜烧糊了。","kind":"text"},{"t":74.62,"en":"As if this were not enough to reduce you to tears, your husband arrives, unexpectedly bringing three guests to dinner.","zh":"好像这些还不足以让你落泪，你的丈夫又回来了，出乎意料地带了三位客人来吃晚饭。","kind":"text"},{"t":84.51,"en":"Things can go wrong on a big scale as a number of people recently discovered in Parramatta, a suburb of Sydney.","zh":"事情也会大规模地出错，正如最近在悉尼郊区帕拉马塔的一些人所发现的那样。","kind":"text"},{"t":93.52,"en":"During the rush hour one evening two cars collided and both drivers began to argue.","zh":"一天晚上，在交通高峰期，两辆汽车相撞，两位司机开始争吵起来。","kind":"text"},{"t":101.09,"en":"The woman immediately behind the two cars happened to be a learner.","zh":"紧跟在两辆车后面的一位女士碰巧是位新手司机。","kind":"text"},{"t":106.3,"en":"She suddenly got into a panic and stopped her car.","zh":"她突然惊慌失措，把车停了下来。","kind":"text"},{"t":110.97,"en":"This made the driver following her brake hard.","zh":"这使得跟在她后面的司机猛踩刹车。","kind":"text"},{"t":114.8,"en":"His wife was sitting beside him holding a large cake.","zh":"他的妻子坐在他旁边，手里拿着一个大蛋糕。","kind":"text"},{"t":119.08,"en":"As she was thrown forward,","zh":"当她向前扑去时，","kind":"text"},{"t":121.2,"en":"the cake went right through the windscreen and landed on the road.","zh":"蛋糕直接穿过挡风玻璃，落在了路上。","kind":"text"},{"t":126.53,"en":"Seeing a cake flying through the air,","zh":"看到一个蛋糕飞过空中，","kind":"text"},{"t":129.42,"en":"a lorry driver who was drawing up alongside the car, pulled up all of a sudden.","zh":"一位正把车开到汽车旁边的货车司机，突然把车停了下来。","kind":"text"},{"t":136.17,"en":"The lorry was loaded with empty beer bottles and hundreds of them slid off the back of the vehicle and on to the road.","zh":"货车上装满了空啤酒瓶，几百个瓶子从车后部滑落到路上。","kind":"text"},{"t":145.47,"en":"This led to yet another angry argument.","zh":"这又引发了另一场激烈的争吵。","kind":"text"},{"t":149.11,"en":"Meanwhile, the traffic piled up behind.","zh":"与此同时，后面的交通堵塞了。","kind":"text"},{"t":153.46,"en":"It took the police nearly an hour to get the traffic on the move again.","zh":"警察花了将近一个小时才让交通再次恢复通行。","kind":"text"},{"t":158.96,"en":"In the meantime, the lorry driver had to sweep up hundreds of broken bottles.","zh":"与此同时，货车司机不得不清扫数百个碎瓶子。","kind":"text"},{"t":165.57,"en":"Only two stray dogs benefited from all this confusion, for they greedily devoured what was left of the cake.","zh":"只有两只流浪狗从这场混乱中受益，因为它们贪婪地吞食了剩下的蛋糕。","kind":"text"},{"t":174.22,"en":"It was just one of those days!","zh":"真是倒霉的一天！","kind":"text"}]},{"id":"NCE3-34","book":"NCE3","bookCn":"第三册","num":34,"title":"A Happy Discovery","slug":"34.A Happy Discovery","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/34.A%20Happy%20Discovery.mp3","sentenceCount":25,"wordCount":361,"lines":[{"t":0.38,"en":"Lesson 34","zh":"第34课","kind":"lesson"},{"t":2.39,"en":"A happy discovery","zh":"幸福的发现","kind":"title"},{"t":9.99,"en":"What was the 'happy discovery' ?","zh":"什么是“幸福的发现”？","kind":"question"},{"t":14.53,"en":"Antique shops exert a peculiar fascination on a great many people.","zh":"古玩店对许多人来说都有一种特殊的魅力。","kind":"text"},{"t":21.2,"en":"The more expensive kind of antique shop where rare objects are beautifully displayed in glass cases","zh":"那些高档古玩店，珍品都漂亮地陈列在玻璃柜里","kind":"text"},{"t":29.11,"en":"to keep them free from dust is usually a forbidding place.","zh":"以免沾染灰尘，通常是令人望而却步的地方。","kind":"text"},{"t":34.65,"en":"But no one has to muster up courage to enter a less pretentious antique shop.","zh":"但对于不那么做作的古玩店，人们无需鼓起勇气进去。","kind":"text"},{"t":41.64,"en":"There is always hope that in its labyrinth of musty, dark, disordered rooms a real rarity will be found amongst the piles of assorted junk that litter the floors.","zh":"人们总是希望在那些发霉、阴暗、杂乱的房间构成的迷宫中，能在堆满地板的各式各样的旧货中找到一件真正的珍品。","kind":"text"},{"t":55.1,"en":"No one discovers a rarity by chance.","zh":"没有人会偶然发现珍品。","kind":"text"},{"t":59.29,"en":"A truly dedicated bargain hunter must have patience,","zh":"一个真正专注的廉价商品搜寻者必须有耐心，","kind":"text"},{"t":63.19,"en":"and above all, the ability to recognize the worth of something when he sees it.","zh":"最重要的是，当他看到一件东西时，要有识别其价值的能力。","kind":"text"},{"t":69.74,"en":"To do this, he must be at least as knowledgeable as the dealer.","zh":"为此，他必须至少和经销商一样知识渊博。","kind":"text"},{"t":75.71,"en":"Like a scientist bent on making a discovery,","zh":"就像一个决心有所发现的科学家一样，","kind":"text"},{"t":79.36,"en":"he must cherish the hope that one day he will be amply rewarded.","zh":"他必须怀揣希望，总有一天他会得到丰厚的回报。","kind":"text"},{"t":85.2,"en":"My old friend, Frank Halliday, is just such a person.","zh":"我的老朋友弗兰克·哈利迪就是这样一个人。","kind":"text"},{"t":90.9,"en":"He has often described to me how he picked up a masterpiece for a mere ￡50.","zh":"他常常向我描述他是如何以区区50英镑买到一件杰作的。","kind":"text"},{"t":97.51,"en":"One Saturday morning, Frank visited an antique shop in my neighbourhood.","zh":"一个星期六的上午，弗兰克去了我附近的一家古玩店。","kind":"text"},{"t":104.16,"en":"As he had never been there before, he found a great deal to interest him.","zh":"因为他以前从未来过这里，所以发现了很多让他感兴趣的东西。","kind":"text"},{"t":110.22,"en":"The morning passed rapidly and Frank was about to leave when he noticed a large packing case lying on the floor.","zh":"上午很快过去了，弗兰克正准备离开时，他注意到地板上放着一个大包装箱。","kind":"text"},{"t":119.25,"en":"The dealer told him that it had just come in, but that he could not be bothered to open it.","zh":"经销商告诉他，这东西刚到，但他懒得打开。","kind":"text"},{"t":126.29,"en":"Frank begged him to do so and the dealer reluctantly prised it open.","zh":"弗兰克恳求他打开，经销商不情愿地撬开了箱子。","kind":"text"},{"t":132.14,"en":"The contents were disappointing.","zh":"里面的东西令人失望。","kind":"text"},{"t":134.85,"en":"Apart from an interesting-looking carved dagger, the box was full of crockery, much of it broken.","zh":"除了一个看起来有趣的雕花匕首外，箱子里装满了陶器，其中大部分都碎了。","kind":"text"},{"t":143.03,"en":"Frank gently lifted the crockery out of the box and suddenly noticed a miniature painting at the bottom of the packing case.","zh":"弗兰克轻轻地把陶器从箱子里拿出来，突然注意到包装箱底部有一幅微型画。","kind":"text"},{"t":153.16,"en":"As its composition and line reminded him of an Italian painting he knew well, he decided to buy it.","zh":"由于它的构图和线条让他想起了他很熟悉的一幅意大利画作，他决定买下它。","kind":"text"},{"t":162.44,"en":"Glancing at it briefly the dealer told him that it was worth ￡50.","zh":"经销商匆匆看了一眼，告诉他这幅画值50英镑。","kind":"text"},{"t":168.21,"en":"Frank could hardly conceal his excitement, for he knew that he had made a real discovery.","zh":"弗兰克几乎无法掩饰他的兴奋，因为他知道他做了一个真正的发现。","kind":"text"},{"t":175.47,"en":"The tiny painting proved to be an unknown masterpiece by Correggio and was worth hundreds and thousands of pounds.","zh":"这幅小画被证实是科雷吉奥的一幅不为人知的杰作，价值数十万英镑。","kind":"text"}]},{"id":"NCE3-35","book":"NCE3","bookCn":"第三册","num":35,"title":"Justice was Done","slug":"35.Justice was Done","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/35.Justice%20was%20Done.mp3","sentenceCount":27,"wordCount":359,"lines":[{"t":0.43,"en":"Lesson 35","zh":"第35课","kind":"lesson"},{"t":2.64,"en":"Justice was done","zh":"正义得以伸张","kind":"title"},{"t":10.56,"en":"The word 'justice' is given two different meanings in the text.","zh":"在课文中，“正义”一词被赋予了两种不同的含义。","kind":"question"},{"t":15.28,"en":"What is the distinction between them?","zh":"它们之间有什么区别呢？","kind":"question"},{"t":19.85,"en":"The word justice is usually associated with courts of law.","zh":"“正义”一词通常与法庭联系在一起。","kind":"text"},{"t":25.49,"en":"We might say that justice has been done when a man's innocence or guilt has been proved beyond doubt.","zh":"当一个人的清白或罪行被无可置疑地证明时，我们可能会说正义得到了伸张。","kind":"text"},{"t":33.15,"en":"Justice is part of the complex machinery of the law.","zh":"正义是法律复杂机制的一部分。","kind":"text"},{"t":37.75,"en":"Those who seek it, undertake an arduous journey and can never be sure that they will find it.","zh":"追求正义的人会踏上一段艰难的旅程，而且永远无法确定他们是否会找到它。","kind":"text"},{"t":44.88,"en":"Judges, however wise or eminent, are human and can make mistakes.","zh":"法官，无论多么明智或杰出，都是人，也可能犯错误。","kind":"text"},{"t":51.18,"en":"There are rare instances when justice almost ceases to be an abstract concept.","zh":"在极少数情况下，正义几乎不再是一个抽象的概念。","kind":"text"},{"t":58.16,"en":"Reward or punishment are meted out quite independent of human interference.","zh":"奖励或惩罚在完全没有人类干预的情况下被施加。","kind":"text"},{"t":64.3,"en":"At such times, justice acts like a living force.","zh":"在这种时候，正义就像一股活生生的力量。","kind":"text"},{"t":69.44,"en":"When we use a phrase like 'it serves him right',","zh":"当我们使用“活该”这样的短语时，","kind":"text"},{"t":73.51,"en":"we are, in part, admitting that a certain set of circumstances has enabled justice to act of its own accord.","zh":"我们部分承认了某种情况使正义得以自然而然地发挥作用。","kind":"text"},{"t":83.84,"en":"When a thief was caught on the premises of a large jewellery store one morning,","zh":"一天早上，当一个小偷在一家大型珠宝店的院子里被抓到时，","kind":"text"},{"t":89.48,"en":"the shop assistants must have found it impossible to resist the temptation to say 'it serves him right'.","zh":"店员们一定觉得很难抵制住说“活该”的冲动。","kind":"text"},{"t":97.67,"en":"The shop was an old converted house with many large, disused fireplaces and tall, narrow chimneys.","zh":"这家店是一座由老房子改建而成的，有很多大的废弃壁炉和又高又窄的烟囱。","kind":"text"},{"t":106.07,"en":"Towards midday, a girl heard a muffled cry coming from behind one of the walls.","zh":"快到中午时，一个女孩听到墙后传来一阵低沉的哭声。","kind":"text"},{"t":112.86,"en":"As the cry was repeated several times,","zh":"哭声重复了几次之后，","kind":"text"},{"t":115.79,"en":"she ran to tell the manager who promptly rang up the fire brigade.","zh":"她跑去告诉经理，经理立刻给消防队打了电话。","kind":"text"},{"t":121.37,"en":"The cry had certainly come from one of the chimneys,","zh":"哭声确实是从一个烟囱里传出来的，","kind":"text"},{"t":124.65,"en":"but as there were so many of them, the firemen could not be certain which one it was.","zh":"但由于烟囱太多，消防员无法确定是哪一个。","kind":"text"},{"t":132.25,"en":"They located the right chimney by tapping at the walls and listening for the man's cries.","zh":"他们通过敲击墙壁并聆听那个人的哭声来确定正确的烟囱。","kind":"text"},{"t":139.67,"en":"After chipping through a wall which was eighteen inches thick,","zh":"在凿穿一堵18英寸厚的墙后，","kind":"text"},{"t":144.23,"en":"they found that a man had been trapped in the chimney.","zh":"他们发现一个人被困在烟囱里了。","kind":"text"},{"t":148.4,"en":"As it was extremely narrow, the man was unable to move,","zh":"由于烟囱非常狭窄，那个人无法动弹，","kind":"text"},{"t":153.21,"en":"but the fire fighters were eventually able to free him by cutting a huge hole in the wall.","zh":"但消防员最终通过在墙上凿开一个大洞，成功地解救了他。","kind":"text"},{"t":160.91,"en":"The sorry-looking, blackened figure that emerged,","zh":"那个狼狈不堪、浑身漆黑的人影出现后，","kind":"text"},{"t":164.98,"en":"admitted at once that he had tried to break into the shop during the night but had got stuck in the chimney.","zh":"立刻承认他曾试图在夜间闯入商店，但被卡在了烟囱里。","kind":"text"},{"t":173.22,"en":"He had been there for nearly ten hours.","zh":"他已经在里面待了将近十个小时。","kind":"text"},{"t":177.25,"en":"Justice had been done even before the man was handed over to the police.","zh":"甚至在将那个人移交给警方之前，正义就已经得到了伸张。","kind":"text"}]},{"id":"NCE3-36","book":"NCE3","bookCn":"第三册","num":36,"title":"A Chance in a Million","slug":"36.A Chance in a Million","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/36.A%20Chance%20in%20a%20Million.mp3","sentenceCount":29,"
