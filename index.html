"zh":"巴格里特驳斥了电脑会学会“独立思考”并“统治世界”的观点，这在当时是人们喜欢相信的。","kind":"text"},{"t":165.76,"en":"Bagrit foresaw a time when computers would be small enough to hold in the hand,","zh":"巴格里特预见到一个时代，那时电脑会小到可以手持，","kind":"text"},{"t":171.78,"en":"when they would be capable of providing information about traffic jams and suggesting alterative routes,","zh":"能够提供交通堵塞信息并建议替代路线，","kind":"text"},{"t":179.88,"en":"when they would be used in hospitals to help doctors to diagnose illnesses,","zh":"在医院里用来帮助医生诊断疾病，","kind":"text"},{"t":185.78,"en":"when they would relieve office workers and accountants of dull, repetitive clerical work.","zh":"解放办公室职员和会计师们枯燥、重复的文书工作。","kind":"text"},{"t":193.64,"en":"All these computer uses have become commonplace.","zh":"所有这些电脑用途都已变得司空见惯。","kind":"text"},{"t":197.96,"en":"Of course, Leon Bagrit couldn't possibly have foreseen the development of the Internet,","zh":"当然，莱昂·巴格里特不可能预见到互联网的发展，","kind":"text"},{"t":204.3,"en":"the worldwide system that enables us to communicate instantly with anyone in any part of the world by using computers linked to telephone networks.","zh":"这个全球性的系统使我们能够通过连接到电话网络的电脑与世界任何地方的任何人即时交流。","kind":"text"},{"t":217.49,"en":"Nor could he have foreseen how we could use the Internet to obtain information on every known subject,","zh":"他也无法预见到我们如何利用互联网获取所有已知主题的信息，","kind":"text"},{"t":224.79,"en":"so we can read it on a screen in our homes and even print it as well if we want to.","zh":"以便我们可以在家中屏幕上阅读，如果需要甚至可以打印出来。","kind":"text"},{"t":231.87,"en":"Computers have become smaller and smaller, more and more powerful and cheaper and cheaper.","zh":"电脑变得越来越小，越来越强大，也越来越便宜。","kind":"text"},{"t":239.55,"en":"This is what makes Leon Bagrit's predictions particularly remarkable.","zh":"这就是莱昂·巴格里特的预测显得格外引人注目的原因。","kind":"text"},{"t":244.91,"en":"If he, or someone like him, were alive today, he might be able to tell us what to expect in the next fifty years.","zh":"如果他，或者像他一样的人，今天还活着，他或许能告诉我们未来五十年会发生什么。","kind":"text"}]},{"id":"NCE3-52","book":"NCE3","bookCn":"第三册","num":52,"title":"Mud is Mud","slug":"52.Mud is Mud","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/52.Mud%20is%20Mud.mp3","sentenceCount":34,"wordCount":515,"lines":[{"t":0.27,"en":"Lesson 52","zh":"第52课","kind":"lesson"},{"t":2.21,"en":"Mud is mud","zh":"泥就是泥","kind":"title"},{"t":10.04,"en":"Why did Harry decide to give up his little game?","zh":"哈里为什么决定放弃他那个小把戏呢？","kind":"question"},{"t":15.35,"en":"My cousin, Harry, keeps a large curiously-shaped bottle on permanent display in his study.","zh":"我的表兄哈里在他书房里长期陈列着一个硕大而形状奇特的瓶子。","kind":"text"},{"t":23.47,"en":"Despite the fact that the bottle is tinted a delicate shade of green,","zh":"尽管瓶子是淡绿色的，","kind":"text"},{"t":27.74,"en":"an observant visitor would soon notice that it is filled with what looks like a thick, greyish substance.","zh":"细心的来访者很快就会注意到瓶子里盛满了像厚厚的灰白色物质。","kind":"text"},{"t":35.6,"en":"If you were to ask Harry what was in the bottle, he would tell you that it contained perfumed mud.","zh":"如果你问哈里瓶子里装的是什么，他会告诉你里面装的是香泥。","kind":"text"},{"t":42.44,"en":"If you expressed doubt or surprise, he would immediately invite you to smell it and then to rub some into your skin.","zh":"如果你表示怀疑或惊奇，他会立刻请你闻一闻，然后让你往皮肤上擦一些。","kind":"text"},{"t":52.01,"en":"The brief experiment would dispel any further doubts she might have.","zh":"这一短暂的试验会打消你可能有的任何疑虑。","kind":"text"},{"t":56.84,"en":"The bottle really does contain perfumed mud.","zh":"瓶子里确实盛有香泥。","kind":"text"},{"t":60.8,"en":"How Harry came into the possession of this outlandish stuff makes an interesting story which he is fond of relating.","zh":"哈里是如何得到这种稀奇古怪的东西的，说来话长，他本人也乐于讲述。","kind":"text"},{"t":69.36,"en":"Furthermore, the acquisition of this bottle cured him of a bad habit he had been developing for years.","zh":"此外，得到这个瓶子还纠正了他多年来养成的一个坏习惯。","kind":"text"},{"t":77.66,"en":"Harry used to consider it a great joke to go into expensive cosmetic shops and make outrageous requests for goods that do not exist.","zh":"哈里过去认为，到高级化妆品商店去提出一些闻所未闻的要求，寻找一些根本不存在的商品，是一种莫大的乐趣。","kind":"text"},{"t":88.92,"en":"He would invent fanciful names on the spot.","zh":"他会当场编造一些新奇的名称。","kind":"text"},{"t":92.37,"en":"On entering a shop,","zh":"一进商店，","kind":"text"},{"t":94.06,"en":"he would ask for a new perfume called 'Scented Shadow' or for 'insoluble bath cubes'.","zh":"他会要求买一种叫“香影”的新型香水，或“不溶性浴块”。","kind":"text"},{"t":102.32,"en":"If a shop assistant told him she had not heard of it, he would pretend to be considerably put out.","zh":"如果店员告诉他从未听说过，他便会装出相当不悦的样子。","kind":"text"},{"t":109.63,"en":"He loved to be told that one of his imaginary products was temporarily out of stock","zh":"他喜欢听人说他臆造的商品暂时缺货，","kind":"text"},{"t":116.35,"en":"and he would faithfully promise to call again at some future date, but of course he never did.","zh":"他会信誓旦旦地答应改日再来，当然他从来也没有去过。","kind":"text"},{"t":123.27,"en":"How Harry managed to keep a straight face during these performances is quite beyond me.","zh":"哈里在做这些表演时是如何能不露出笑容的，我简直无法理解。","kind":"text"},{"t":130.31,"en":"Harry does not need to be prompted to explain how he bought his precious bottle of mud.","zh":"哈里无需别人提醒就会讲他是如何买到那珍贵的泥巴瓶的。","kind":"text"},{"t":136.1,"en":"One day, he went to an exclusive shop in London and asked for 'Myrolite'.","zh":"有一天，他去了伦敦一家高级商店，要买“美妙来特”。","kind":"text"},{"t":143.14,"en":"The shop assistant looked puzzled and Harry repeated the word, slowly stressing each syllable.","zh":"店员看上去很迷惑，哈里便重复了一遍这个词，并慢慢地重读每个音节。","kind":"text"},{"t":151.0,"en":"When the woman shook her head in bewilderment,","zh":"当那个店员困惑地摇了摇头时，","kind":"text"},{"t":154.19,"en":"Harry went on to explain that 'myrolite' was a hard, amber-like substance which could be used to remove freckles.","zh":"哈里接着解释说，“美妙来特”是一种硬的、琥珀状物质，可以用来消除雀斑。","kind":"text"},{"t":164.08,"en":"This explanation evidently conveyed something to the woman who searched shelf after shelf.","zh":"这种解释显然使那个店员明白了一些什么，她便搜寻了一个又一个的货架。","kind":"text"},{"t":170.69,"en":"She produced all sorts of weird concoctions, but none of them met with Harry's requirements.","zh":"她拿出了各种稀奇古怪的混合物，但没有一样符合哈里的要求。","kind":"text"},{"t":178.09,"en":"When Harry put on his act of being mildly annoyed, the assistant promised to order some for him.","zh":"当哈里装出有点不高兴的样子时，店员答应为他订购一些。","kind":"text"},{"t":185.09,"en":"Intoxicated by his success, Harry then asked for perfumed mud.","zh":"哈里成功后有点得意忘形，接着要买香泥。","kind":"text"},{"t":191.64,"en":"He expected the assistant to look at him in blank astonishment.","zh":"他原以为店员会目瞪口呆地看着他。","kind":"text"},{"t":195.81,"en":"However, it was his turn to be surprised, for the woman's eyes immediately lit up","zh":"然而，这次轮到他吃惊了，因为店员的眼睛立刻亮了起来，","kind":"text"},{"t":203.01,"en":"and she fetched several bottles which she placed on the counter for Harry to inspect.","zh":"拿来了好几瓶放在柜台上让哈里检查。","kind":"text"},{"t":209.03,"en":"For once, Harry had to admit defeat.","zh":"哈里只好承认这次是自己输了。","kind":"text"},{"t":212.65,"en":"He picked up what seemed to be the smallest bottle and discreetly asked the price.","zh":"他拿起看似最小的一瓶，悄悄地问了问价格。","kind":"text"},{"t":219.3,"en":"He was glad to get away with a mere twenty pounds and he beat a hasty retreat, clutching the precious bottle under his arm.","zh":"他庆幸只花了区区20英镑就脱身了，他赶忙溜走，把那瓶宝贝紧紧地夹在胳膊下。","kind":"text"},{"t":228.57,"en":"From then on, Harry decided that this little game he had invented might prove to be expensive.","zh":"从那以后，哈里认为他发明的这个小把戏可能代价太大。","kind":"text"},{"t":235.68,"en":"The curious bottle which now adorns the bookcase in his study was his first and last purchase of rare cosmetics.","zh":"现在他书房书柜上陈列的那个奇特的瓶子是他最后一次购买这种稀奇化妆品。","kind":"text"}]},{"id":"NCE3-53","book":"NCE3","bookCn":"第三册","num":53,"title":"In the Public Interest","slug":"53.In the Public Interest","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/53.In%20the%20Public%20Interest.mp3","sentenceCount":31,"wordCount":463,"lines":[{"t":0.4,"en":"Lesson 53","zh":"第53课","kind":"lesson"},{"t":2.65,"en":"In the public interest","zh":"为了公众利益","kind":"title"},{"t":9.65,"en":"What could not be reported in the official files?","zh":"官方档案里什么内容不会被记录？","kind":"question"},{"t":15.8,"en":"The Scandinavian countries are much admired all over the world for their enlightened social policies.","zh":"斯堪的纳维亚国家以其开明的社会政策而受到全世界的普遍赞扬。","kind":"text"},{"t":23.38,"en":"Sweden has evolved an excellent system for protecting the individual citizen from high-handed or incompetent public officers.","zh":"瑞典已逐步建立起一套完善的制度来保护公民不受专横或渎职的政府官员的侵害。","kind":"text"},{"t":33.22,"en":"The system has worked so well, that it has been adopted in other countries too.","zh":"这套制度非常行之有效，以至于其他国家也采用了它。","kind":"text"},{"t":40.21,"en":"The Swedes were the first to recognize that public officials like civil servants,","zh":"瑞典人最先认识到，政府官员，如公务员、","kind":"text"},{"t":46.23,"en":"police officers, health inspectors or tax-collectors can make mistakes or act over-zealously in the belief that they are serving the public.","zh":"警官、卫生检察员或税务官，都可能犯错误，或者相信他们在为公众服务而工作过分热心。","kind":"text"},{"t":56.76,"en":"As long ago as 1809, the Swedish Parliament introduced a scheme to safeguard the interest of the individual.","zh":"早在1809年，瑞典议会就制定了一项保护个人利益的计划。","kind":"text"},{"t":66.75,"en":"A parliamentary committee representing all political parties appoints a person who is suitably qualified to investigate private grievances against the State.","zh":"一个由所有政党组成的议会委员会任命一位有资格调查个人对国家不满的投诉的人。","kind":"text"},{"t":78.63,"en":"The official title of the person is 'Justiteombudsman', but the Swedes commonly refer to him as the 'J.O.' or 'Ombudsman'.","zh":"这个人的官方头衔是“司法特派员”，但瑞典人通常称他为“J.O.”或“特派员”。","kind":"text"},{"t":89.51,"en":"The Ombudsman is not subject to political pressure.","zh":"监察官不受政治压力。","kind":"text"},{"t":93.72,"en":"He investigates complaints large and small that come to him from all levels of society.","zh":"他调查来自社会各阶层的大小投诉。","kind":"text"},{"t":100.31,"en":"As complaints must be made in writing, the Ombudsman receives an average of 1, 200 letters a year.","zh":"由于投诉必须以书面形式提出，监察官平均每年收到1200封信。","kind":"text"},{"t":108.78,"en":"He has eight lawyer assistants to help him and he examines every single letter in detail.","zh":"他有八名律师助理帮助他，他会详细审查每一封信。","kind":"text"},{"t":116.26,"en":"There is nothing secretive about the Ombudsman's work, for his correspondence is open to public inspection.","zh":"监察官的工作毫无秘密可言，因为他的信件都公开供公众查阅。","kind":"text"},{"t":124.5,"en":"If a citizen's complaint is justified the Ombudsman will act on his behalf.","zh":"如果公民的投诉是有根据的，监察官将代表他采取行动。","kind":"text"},{"t":131.26,"en":"The action he takes varies according to the nature of the complaint.","zh":"他采取的行动因投诉的性质而异。","kind":"text"},{"t":136.0,"en":"He may gently reprimand an official or even suggest to parliament that a law be altered.","zh":"他可以温和地训斥一名官员，甚至向议会建议修改法律。","kind":"text"},{"t":143.23,"en":"The following case is a typical example of the Ombudsman's work.","zh":"下面这个案例是监察官工作的典型例子。","kind":"text"},{"t":149.28,"en":"A foreigner living in a Swedish village wrote to the Ombudsman complaining that he had been ill-treated by the police,","zh":"一个住在瑞典乡村的外国人写信给监察官，抱怨他受到警察的虐待，","kind":"text"},{"t":157.37,"en":"simply because he was a foreigner.","zh":"只因为他是个外国人。","kind":"text"},{"t":160.42,"en":"The Ombudsman immediately wrote to the Chief of Police in the district asking him to send a record of the case.","zh":"监察官立即写信给该地区的警察局长，要求他寄送案件记录。","kind":"text"},{"t":169.38,"en":"There was nothing in the record to show that the foreigner's complaint was justified","zh":"记录中没有任何内容表明该外国人的投诉是有根据的，","kind":"text"},{"t":175.32,"en":"and the Chief of Police strongly denied the accusation.","zh":"警察局长也强烈否认了这一指控。","kind":"text"},{"t":180.56,"en":"It was impossible for the Ombudsman to take action,","zh":"监察官无法采取行动，","kind":"text"},{"t":184.52,"en":"but when he received a similar complaint from another foreigner in the same village,","zh":"但当他收到同一村庄另一名外国人的类似投诉时，","kind":"text"},{"t":190.2,"en":"he immediately sent one of his lawyers to investigate the matter.","zh":"他立即派他的一名律师去调查此事。","kind":"text"},{"t":195.03,"en":"The lawyer ascertained that a policeman had indeed dealt roughly with foreigners on several occasions.","zh":"律师证实，一名警察确实曾多次粗暴对待外国人。","kind":"text"},{"t":203.18,"en":"The fact that the policeman was prejudiced against foreigners could not be recorded in the official files.","zh":"这名警察对外国人有偏见的事实，无法记录在官方档案中。","kind":"text"},{"t":210.55,"en":"It was only possible for the Ombudsman to find this out by sending one of his representatives to check the facts.","zh":"监察官只有通过派他的一名代表去核实事实才能发现这一点。","kind":"text"},{"t":220.24,"en":"The policeman in question was severely reprimanded","zh":"这名警察受到了严厉的训斥，","kind":"text"},{"t":224.2,"en":"and was informed that if any further complaints were lodged against him, he would be prosecuted.","zh":"并被告知，如果再有针对他的投诉，他将被起诉。","kind":"text"},{"t":231.78,"en":"The Ombudsman's prompt action at once put an end to an unpleasant practice which might have gone unnoticed.","zh":"监察官的迅速行动立即制止了一种可能被忽视的不愉快的做法。","kind":"text"}]},{"id":"NCE3-54","book":"NCE3","bookCn":"第三册","num":54,"title":"Instinct or Cleverness","slug":"54.Instinct or Cleverness","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/54.Instinct%20or%20Cleverness.mp3","sentenceCount":34,"wordCount":519,"lines":[{"t":0.31,"en":"Lesson 54","zh":"第54课","kind":"lesson"},{"t":2.26,"en":"Instinct or cleverness?","zh":"本能还是智慧？","kind":"title"},{"t":10.16,"en":"Was the writer successful in protecting his peach tree? Why not?","zh":"作者成功保护了他的桃树吗？为什么没有？","kind":"question"},{"t":17.67,"en":"We have been brought up to fear insects.","zh":"我们从小就被教导要害怕昆虫。","kind":"text"},{"t":20.65,"en":"We regard them as unnecessary creatures that do more harm than good.","zh":"我们认为它们是多余的生物，弊大于利。","kind":"text"},{"t":26.54,"en":"We continually wage war on them, for they contaminate our food, carry diseases, or devour our crops.","zh":"我们不断地与它们作斗争，因为它们会污染我们的食物，传播疾病，或吞噬我们的庄稼。","kind":"text"},{"t":35.76,"en":"They sting or bite without provocation; they fly uninvited into our rooms on summer nights, or beat against our lighted windows.","zh":"它们无故蜇人或咬人；在夏天的夜晚，它们不请自来地飞进我们的房间，或拍打我们点亮的窗户。","kind":"text"},{"t":46.15,"en":"We live in dread not only of unpleasant insects like spiders or wasps, but of quite harmless ones like moths.","zh":"我们不仅害怕蜘蛛或黄蜂等令人不快的昆虫，也害怕像飞蛾这样完全无害的昆虫。","kind":"text"},{"t":55.33,"en":"Reading about them increases our understanding without dispelling our fears.","zh":"阅读有关它们的文章增加了我们的理解，却无法消除我们的恐惧。","kind":"text"},{"t":61.67,"en":"Knowing that the industrious ant lives in a highly organized society","zh":"即使知道勤劳的蚂蚁生活在一个高度组织化的社会中，","kind":"text"},{"t":67.57,"en":"does nothing to prevent us from being filled with revulsion when we find hordes of them crawling over a carefully prepared picnic lunch.","zh":"也无法阻止我们在一群蚂蚁爬满精心准备的野餐时感到厌恶。","kind":"text"},{"t":78.08,"en":"No matter how much we like honey,","zh":"无论我们多么喜欢蜂蜜，","kind":"text"},{"t":80.89,"en":"or how much we have read about the uncanny sense of direction which bees possess, we have a horror of being stung.","zh":"无论我们读过多少关于蜜蜂拥有不可思议的方向感，我们都害怕被蜇。","kind":"text"},{"t":90.32,"en":"Most of our fears are unreasonable, but they are impossible to erase.","zh":"我们大部分的恐惧都是不合理的，但它们又难以消除。","kind":"text"},{"t":96.15,"en":"At the same time, however, insects are strangely fascinating.","zh":"然而，与此同时，昆虫又有着奇特的魅力。","kind":"text"},{"t":101.48,"en":"We enjoy reading about them, especially when we find that, like the praying mantis, they lead perfectly horrible lives.","zh":"我们喜欢阅读有关它们的文章，特别是当我们发现，像螳螂一样，它们过着极其可怕的生活时。","kind":"text"},{"t":111.1,"en":"We enjoy staring at them, entranced as they go about their business, unaware (we hope) of our presence.","zh":"我们喜欢凝视它们，着迷地看着它们忙碌，希望它们没有察觉到我们的存在。","kind":"text"},{"t":119.91,"en":"Who has not stood in awe at the sight of a spider pouncing on a fly,","zh":"谁不曾敬畏地看着蜘蛛扑向苍蝇，","kind":"text"},{"t":124.96,"en":"or a column of ants triumphantly bearing home an enormous dead beetle?","zh":"或一队蚂蚁凯旋地将一只巨大的死甲虫搬回家呢？","kind":"text"},{"t":131.43,"en":"Last summer I spent days in the garden watching thousands of ants crawling up the trunk of my prize peach tree.","zh":"去年夏天，我在花园里花了好几天时间，观察成千上万的蚂蚁爬上我那棵珍贵的桃树树干。","kind":"text"},{"t":140.64,"en":"The tree has grown against a warm wall on a sheltered side of the house.","zh":"这棵树长在房子避风处的一面暖墙边。","kind":"text"},{"t":146.08,"en":"I am especially proud of it,","zh":"我特别为它感到自豪，","kind":"text"},{"t":148.61,"en":"not only because it has survived several severe winters, but because it occasionally produces luscious peaches.","zh":"不仅因为它熬过了好几个严酷的冬天，还因为它偶尔会结出甜美的桃子。","kind":"text"},{"t":159.08,"en":"During the summer, I noticed that the leaves of the tree were beginning to wither.","zh":"夏天的时候，我注意到树叶开始枯萎了。","kind":"text"},{"t":165.01,"en":"Clusters of tiny insects called aphides were to be found on the underside of the leaves.","zh":"树叶的背面可以发现成群的微小昆虫，叫做蚜虫。","kind":"text"},{"t":172.48,"en":"They were visited by a large colony of ants which obtained a sort of honey from them.","zh":"一大群蚂蚁来访，从它们那里获取一种蜜露。","kind":"text"},{"t":179.12,"en":"I immediately embarked on an experiment which even though it failed to get rid of the ants kept me fascinated for twenty-four hours.","zh":"我立即开始了一项实验，尽管它未能除掉蚂蚁，但却让我着迷了二十四个小时。","kind":"text"},{"t":190.0,"en":"I bound the base of the tree with sticky tape, making it impossible for the ants to reach the aphides.","zh":"我用胶带缠住了树的底部，使蚂蚁无法接触到蚜虫。","kind":"text"},{"t":197.71,"en":"The tape was so sticky that they did not dare to cross it.","zh":"胶带非常粘，它们不敢越过。","kind":"text"},{"t":202.59,"en":"For a long time, I watched them scurrying around the base of the tree in bewilderment.","zh":"我长时间地看着它们困惑地在树底跑来跑去。","kind":"text"},{"t":209.59,"en":"I even went out at midnight with a torch and noted with satisfaction (and surprise)","zh":"我甚至在午夜带着手电筒出去，满意地（也惊讶地）注意到","kind":"text"},{"t":216.88,"en":"that the ants were still swarming around the sticky tape without being able to do anything about it.","zh":"蚂蚁仍然在胶带周围聚集，却无计可施。","kind":"text"},{"t":223.94,"en":"I got up early next morning hoping to find that the ants had given up in despair.","zh":"第二天早上我早早起床，希望能看到蚂蚁已经绝望地放弃了。","kind":"text"},{"t":229.84,"en":"Instead, I saw that they had discovered a new route.","zh":"结果，我发现它们开辟了一条新路线。","kind":"text"},{"t":234.31,"en":"They were climbing up the wall of the house and then on to the leaves of the tree.","zh":"它们正在爬上房子的墙壁，然后爬到树叶上。","kind":"text"},{"t":239.58,"en":"I realized sadly that I had been completely defeated by their ingenuity.","zh":"我伤心地意识到，我完全被它们的足智多谋打败了。","kind":"text"},{"t":245.79,"en":"The ants had been quick to find an answer to my thoroughly unscientific methods!","zh":"蚂蚁很快就找到了应对我这种完全不科学的方法的办法！","kind":"text"}]},{"id":"NCE3-55","book":"NCE3","bookCn":"第三册","num":55,"title":"From the Earth Greetings","slug":"55.From the Earth Greetings","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/55.From%20the%20Earth%20Greetings.mp3","sentenceCount":32,"wordCount":511,"lines":[{"t":0.37,"en":"Lesson 55","zh":"第55课","kind":"lesson"},{"t":2.47,"en":"From the earth: Greetings","zh":"来自地球的问候","kind":"title"},{"t":10.35,"en":"Which life forms are most likely to develop on a distant planet?","zh":"哪些生命形式最有可能在遥远的行星上发展？","kind":"question"},{"t":17.41,"en":"Recent developments in astronomy have made it possible to detect planets in our own Milky Way and in other galaxies.","zh":"天文学的最新发展使得在我们自己的银河系和其他星系中探测行星成为可能。","kind":"text"},{"t":26.55,"en":"This is a major achievement because, in relative terms, planets are very small and do not emit light.","zh":"这是一个重大成就，因为相对而言，行星非常小且不发光。","kind":"text"},{"t":34.99,"en":"Finding planets is proving hard enough, but finding life on them will prove infinitely more difficult.","zh":"发现行星已经够难了，但在行星上发现生命将是无限困难的。","kind":"text"},{"t":42.52,"en":"The first question to answer is whether a planet can actually support life.","zh":"首先要回答的问题是，一个行星是否真的能够支持生命。","kind":"text"},{"t":48.55,"en":"In our own solar system, for example, Venus is far to hot and Mars is far too cold to support life.","zh":"例如，在我们自己的太阳系中，金星太热，火星太冷，都无法支持生命。","kind":"text"},{"t":57.03,"en":"Only the Earth provides ideal conditions, and even here it has taken more than four billion years for plant and animal life to evolve.","zh":"只有地球提供了理想的条件，即使在这里，植物和动物生命也用了超过40亿年才得以进化。","kind":"text"},{"t":68.35,"en":"Whether a planet can support life depends on the size and brightness of its star, that is its 'sun'.","zh":"行星是否能支持生命取决于其恒星，也就是它的“太阳”的大小和亮度。","kind":"text"},{"t":75.68,"en":"Imagine a star up to twenty times larger, brighter and hotter than our own sun.","zh":"想象一颗比我们自己的太阳大20倍、亮20倍、热20倍的恒星。","kind":"text"},{"t":82.25,"en":"A planet would have to be a very long way from it to be capable of supporting life.","zh":"一个行星必须离它非常遥远才能支持生命。","kind":"text"},{"t":87.92,"en":"Alternatively, if the star were small,","zh":"另一方面，如果恒星很小，","kind":"text"},{"t":91.09,"en":"the life-supporting planet would have to have a close orbit round it and also provide the perfect conditions for life forms to develop.","zh":"支持生命的行星就必须围绕它近距离运行，并且提供生命形式发展的完美条件。","kind":"text"},{"t":101.37,"en":"But how would we find such a planet?","zh":"但是我们如何才能找到这样一个行星呢？","kind":"text"},{"t":104.73,"en":"At present, there is no telescope in existence that is capable of detecting the presence of life.","zh":"目前，还没有任何望远镜能够探测到生命的存在。","kind":"text"},{"t":112.38,"en":"The development of such a telescope will be one of the great astronomical projects of the 21st century.","zh":"这种望远镜的开发将是21世纪伟大的天文学项目之一。","kind":"text"},{"t":121.15,"en":"It is impossible to look for life on another planet using earth-based telescopes.","zh":"使用基于地球的望远镜来寻找其他行星上的生命是不可能的。","kind":"text"},{"t":127.34,"en":"Our own warm atmosphere and the heat generated by the telescope","zh":"我们温暖的大气层和望远镜产生的热量","kind":"text"},{"t":131.98,"en":"would make it impossible to detect objects as small as planets.","zh":"将使我们不可能探测到像行星一样小的物体。","kind":"text"},{"t":137.1,"en":"Even a telescope in orbit round the earth, like the very successful Hubble telescope,","zh":"即使是像非常成功的哈勃望远镜那样围绕地球轨道运行的望远镜，","kind":"text"},{"t":143.32,"en":"would not be suitable because of the dust particles in our solar system.","zh":"也不会适用，因为我们太阳系中有尘埃颗粒。","kind":"text"},{"t":149.03,"en":"A telescope would have to be as far away as the planet Jupiter to look for life in outer space,","zh":"望远镜必须远达木星才能在外太空寻找生命，","kind":"text"},{"t":156.55,"en":"because the dust becomes thinner the further we travel towards the outer edges of our own solar system.","zh":"因为我们越往太阳系外围移动，尘埃就越稀薄。","kind":"text"},{"t":163.97,"en":"Once we detected a planet, we would have to find a way of blotting out the light from its star,","zh":"一旦我们探测到一颗行星，我们就必须找到一种方法来遮挡其恒星的光线，","kind":"text"},{"t":170.47,"en":"so that we would be able to 'see' the planet properly and analyse its atmosphere.","zh":"这样我们才能清楚地“看清”这颗行星并分析其大气层。","kind":"text"},{"t":176.38,"en":"In the first instance, we would be looking for plant life, rather than 'little green men'.","zh":"首先，我们将寻找植物生命，而不是“小绿人”。","kind":"text"},{"t":182.99,"en":"The life forms most likely to develop on a planet would be bacteria.","zh":"最有可能在行星上发展的生命形式将是细菌。","kind":"text"},{"t":188.85,"en":"It is bacteria that have generated the oxygen we breathe on earth.","zh":"是细菌产生了我们地球上呼吸的氧气。","kind":"text"},{"t":194.08,"en":"For most of the earth's history they have been the only form of life on our planet.","zh":"在地球的大部分历史中，它们一直是地球上唯一的生命形式。","kind":"text"},{"t":199.95,"en":"As Earth-dwellers, we always cherish the hope that we will be visited by little green men and that we will be able to communicate with them.","zh":"作为地球居民，我们总是怀着这样的希望：我们会受到小绿人的拜访，并能与他们交流。","kind":"text"},{"t":210.24,"en":"But this hope is always in the realms of science fiction.","zh":"但这种希望始终停留在科幻小说的范畴。","kind":"text"},{"t":215.38,"en":"If we were able to discover lowly forms of life like bacteria on another planet, it would completely change our view of ourselves.","zh":"如果我们能在另一个行星上发现像细菌这样低级的生命形式，它将彻底改变我们对自身的看法。","kind":"text"},{"t":225.41,"en":"As Daniel Goldin of NASA observed, 'Finding life elsewhere would change everything.","zh":"正如美国宇航局的丹尼尔·戈尔丁所观察到的，“在别处发现生命将改变一切。","kind":"text"},{"t":232.33,"en":"No human endeavour or thought would be unchanged by it.'","zh":"任何人类的努力或思想都不会因此而保持不变。”","kind":"text"}]},{"id":"NCE3-56","book":"NCE3","bookCn":"第三册","num":56,"title":"Our Neighbour, the River","slug":"56.Our Neighbour, the River","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/56.Our%20Neighbour%2C%20the%20River.mp3","sentenceCount":33,"wordCount":492,"lines":[{"t":0.32,"en":"Lesson 56","zh":"第56课","kind":"lesson"},{"t":2.55,"en":"Our neighbour, the river","zh":"我们的邻居，河流","kind":"title"},{"t":9.41,"en":"Why had the neighbours left their farm?","zh":"邻居们为什么离开了他们的农场？","kind":"question"},{"t":13.91,"en":"The river which forms the eastern boundary of our farm has always played an important part in our lives.","zh":"构成了我们农场东部边界的河流，在我们的生活中一直扮演着重要的角色。","kind":"text"},{"t":21.26,"en":"Without it we could not make a living.","zh":"没有它，我们就无法谋生。","kind":"text"},{"t":24.33,"en":"There is only enough spring water to supply the needs of the house so we have to pump from the river for farm use.","zh":"泉水仅够供应房屋使用，所以农场用水必须从河里抽。","kind":"text"},{"t":32.59,"en":"We tell the river all our secrets.","zh":"我们向河流倾诉我们所有的秘密。","kind":"text"},{"t":35.36,"en":"We know instinctively, just as beekeepers with their bees,","zh":"我们本能地知道，就像养蜂人对他们的蜜蜂一样，","kind":"text"},{"t":39.98,"en":"that misfortune might overtake us if the important events of our lives were not related to it.","zh":"如果我们生活中的重要事件不与河流相关，不幸可能会降临到我们身上。","kind":"text"},{"t":48.62,"en":"We have special river birthday parties in the summer.","zh":"夏天我们会在河边举行特别的生日派对。","kind":"text"},{"t":52.63,"en":"Sometimes we go upstream to a favourite backwater,","zh":"有时我们逆流而上到我们最喜欢的一个回水湾，","kind":"text"},{"t":56.49,"en":"sometimes we have our party at the boathouse,","zh":"有时我们会在船屋举行派对，","kind":"text"},{"t":59.61,"en":"which a predecessor of ours at the farm built in the meadow hard by the deepest pool for swimming and diving.","zh":"那是我们在农场的前任在草地边上，紧邻最深的游泳和跳水池建造的。","kind":"text"},{"t":67.74,"en":"In a heat wave we choose a midnight birthday party and that is the most exciting of all.","zh":"在热浪来袭时，我们选择举行午夜生日派对，那是所有派对中最令人兴奋的。","kind":"text"},{"t":74.5,"en":"We welcome the seasons by the riverside, crowning the youngest girl with flowers in the spring,","zh":"我们在河边迎接季节，春天给最小的女孩戴上花冠，","kind":"text"},{"t":81.08,"en":"holding a summer festival on Midsummer Eve, giving thanks for the harvest in the autumn, and throwing a holly wreath into the current in the winter.","zh":"在仲夏夜举行夏季节庆，秋天感谢丰收，冬天则将冬青花环抛入水流中。","kind":"text"},{"t":92.66,"en":"After a long period of rain the river may overflow its banks.","zh":"经过长时间的降雨，河流可能会泛滥。","kind":"text"},{"t":97.93,"en":"This is a rare occurrence as our climate seldom goes to extremes.","zh":"这很少发生，因为我们这里的气候很少出现极端情况。","kind":"text"},{"t":103.11,"en":"We are lucky in that only the lower fields,","zh":"我们很幸运，只有较低的田地，","kind":"text"},{"t":106.4,"en":"which make up a very small proportion of our farm, are affected by flooding,","zh":"这只占我们农场很小的一部分，会受到洪水的影响，","kind":"text"},{"t":111.73,"en":"but other farms are less favourably sited, and flooding can sometimes spell disaster for their owners.","zh":"但其他农场的位置不太好，洪水有时会给他们的主人带来灾难。","kind":"text"},{"t":120.33,"en":"One bad winter we watched the river creep up the lower meadows.","zh":"一个糟糕的冬天，我们看着河水悄悄漫上了低洼的草地。","kind":"text"},{"t":126.04,"en":"All the cattle had been moved into stalls and we stood to lose little.","zh":"所有的牛都已移入畜栏，我们几乎没什么损失。","kind":"text"},{"t":131.01,"en":"We were, however, worried about our nearest neighbours, whose farm was low lying and who were newcomers to the district.","zh":"然而，我们担心我们最近的邻居，他们的农场地势低洼，而且他们是这个地区的新来者。","kind":"text"},{"t":140.08,"en":"As the floods had put the telephone out of order, we could not find out how they were managing.","zh":"由于洪水导致电话失灵，我们无法了解他们的情况。","kind":"text"},{"t":146.3,"en":"From an attic window we could get a sweeping view of the river where their land joined ours,","zh":"从阁楼窗户，我们可以俯瞰河流，看到他们的土地与我们农场相接之处，","kind":"text"},{"t":152.65,"en":"and at the most critical juncture we took turns in watching that point.","zh":"在最关键的时刻，我们轮流守望那个地方。","kind":"text"},{"t":157.8,"en":"The first sign of disaster was a dead sheep floating down.","zh":"灾难的第一个迹象是一只死羊顺流而下。","kind":"text"},{"t":162.99,"en":"Next came a horse, swimming bravely,","zh":"接着来了一匹马，勇敢地游着，","kind":"text"},{"t":166.07,"en":"but we were afraid that the strength of the current would prevent its landing anywhere before it became exhausted.","zh":"但我们担心水流太急，它在筋疲力尽之前无法靠岸。","kind":"text"},{"t":173.85,"en":"Suddenly a raft appeared, looking rather like Noah's ark, carrying the whole family, a few hens, the dogs, a cat, and a bird in a cage.","zh":"突然，一个木筏出现了，看起来很像诺亚方舟，上面载着全家人、几只母鸡、狗、猫和一只笼子里的鸟。","kind":"text"},{"t":185.9,"en":"We realized that they must have become unduly frightened by the rising flood,","zh":"我们意识到他们一定是过度被上涨的洪水吓到了，","kind":"text"},{"t":191.63,"en":"for their house, which had sound foundations, would have stood stoutly even if it had been almost submerged.","zh":"因为他们的房子地基牢固，即使几乎被淹没，也能坚固地屹立不倒。","kind":"text"},{"t":200.42,"en":"The men of our family waded down through our flooded meadows with boat hooks,","zh":"我们家的男人们带着船钩，趟过被淹没的草地，","kind":"text"},{"t":205.34,"en":"in the hope of being able to grapple a corner of the raft and pull it out of the current towrds our bank.","zh":"希望能钩住木筏的一角，把它从水流中拉到我们这边的岸边。","kind":"text"},{"t":213.53,"en":"We still think it a miracle that they were able to do so.","zh":"我们仍然认为他们能做到这一点是个奇迹。","kind":"text"}]},{"id":"NCE3-57","book":"NCE3","bookCn":"第三册","num":57,"title":"Back in the Old Country","slug":"57.Back in the Old Country","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/57.Back%20in%20the%20Old%20Country.mp3","sentenceCount":37,"wordCount":535,"lines":[{"t":0.27,"en":"Lesson 57","zh":"第57课","kind":"lesson"},{"t":2.3,"en":"Back in the old country","zh":"回到故乡","kind":"title"},{"t":9.57,"en":"Did the narrater find his mother's grave?","zh":"叙述者找到他母亲的坟墓了吗？","kind":"question"},{"t":13.98,"en":"I stopped to let the car cool off and to study the map.","zh":"我停车让车冷却下来，并研究地图。","kind":"text"},{"t":18.28,"en":"I had expected to be near my objective by now, but everything still seemed alien to me.","zh":"我本以为现在应该离目的地很近了，但周围的一切对我来说仍然很陌生。","kind":"text"},{"t":25.73,"en":"I was only five when my father had taken me abroad, and that was eighteen years ago.","zh":"我父亲带我出国时我才五岁，那已经是十八年前的事了。","kind":"text"},{"t":32.35,"en":"When my mother had died after a tragic accident, he did not quickly recover from the shock and loneliness.","zh":"母亲在一场悲惨的事故中去世后，他未能很快从震惊和孤独中恢复过来。","kind":"text"},{"t":40.37,"en":"Everything around him was full of her presence, continually reopening the wound.","zh":"他周围的一切都充满了她的气息，不断地撕开他的伤口。","kind":"text"},{"t":46.02,"en":"So he decided to emigrate.","zh":"所以他决定移民。","kind":"text"},{"t":48.41,"en":"In the new country he became absorbed in making a new life for the two of us, so that he gradually ceased to grieve.","zh":"在新的国家，他全心投入为我们俩创造新生活，于是他渐渐停止了悲伤。","kind":"text"},{"t":57.04,"en":"He did not marry again and I was brought up without a woman's care; but I lacked for nothing, for he was both father and mother to me.","zh":"他没有再婚，我是在没有女性关爱的情况下长大的；但我什么都不缺，因为他既是我的父亲也是我的母亲。","kind":"text"},{"t":66.9,"en":"He always meant to go back one day, but not to stay.","zh":"他一直打算有一天回去，但不是为了留下。","kind":"text"},{"t":70.65,"en":"His roots and mine had become too firmly embedded in the new land.","zh":"他和我的根基都已在新土地上扎得太深了。","kind":"text"},{"t":75.54,"en":"But he wanted to see the old folk again and to visit my mother's grave.","zh":"但他想再见见老乡们，并去我母亲的坟墓看看。","kind":"text"},{"t":80.32,"en":"He became mortally ill a few months before we had planned to go and, when he knew that he was dying, he made me promise to go on my own.","zh":"在我们计划动身前的几个月，他得了绝症，当他知道自己快要去世时，他让我答应独自前往。","kind":"text"},{"t":91.44,"en":"I hired a car the day after landing and bought a comprehensive book of maps,","zh":"降落的第二天，我租了一辆车，买了一本详尽的地图册，","kind":"text"},{"t":96.93,"en":"which I found most helpful on the cross-country journey, but which I did not think I should need on the last stage.","zh":"我发现这本地图册在跨国旅途中非常有用，但我不认为在最后一段路程中我还需要它。","kind":"text"},{"t":104.62,"en":"It was not that I actually remembered anything at all.","zh":"并不是我真的记得任何东西。","kind":"text"},{"t":108.56,"en":"But my father had described over and over again what we should see at every milestone after leaving the nearest town,","zh":"但父亲曾一遍又一遍地描述，离开最近的城镇后，每过一个里程碑我们会看到什么，","kind":"text"},{"t":117.66,"en":"so that I was positive I should recognize it as familiar territory.","zh":"所以我确信我会认出那是熟悉的土地。","kind":"text"},{"t":122.93,"en":"Well, I had been wrong, for I was now lost.","zh":"嗯，我错了，因为我现在迷路了。","kind":"text"},{"t":127.74,"en":"I looked at the map and then at the milometer.","zh":"我看了看地图，然后看了看里程表。","kind":"text"},{"t":131.33,"en":"I had come ten miles since leaving the town and at this point, according to my father,","zh":"我离开城镇已经走了十英里，按照我父亲的说法，在这个地方，","kind":"text"},{"t":138.39,"en":"I should be looking at farms and cottages in a valley,","zh":"我应该能看到山谷里的农场和小屋，","kind":"text"},{"t":142.48,"en":"with the spire of the church of our village showing in the far distance.","zh":"远处还能看到我们村教堂的尖顶。","kind":"text"},{"t":147.63,"en":"I could see no valley, no farms, no cottages and no church spire-only a lake.","zh":"我看不到山谷，看不到农场，看不到小屋，也看不到教堂尖顶——只有一片湖。","kind":"text"},{"t":154.88,"en":"I decided that I must have taken a wrong turning somewhere.","zh":"我断定我一定是在某个地方拐错了弯。","kind":"text"},{"t":159.19,"en":"So I drove back to the town and began to retrace the route, taking frequent glances at the map.","zh":"于是我开车回到城镇，开始按原路返回，并不时地看一眼地图。","kind":"text"},{"t":166.44,"en":"I landed up at the same corner.","zh":"我最终还是回到了同一个路口。","kind":"text"},{"t":169.18,"en":"The curious thing was that the lake was not marked on the map.","zh":"奇怪的是，地图上并没有标示这片湖。","kind":"text"},{"t":173.27,"en":"I felt as if I had stumbled into a nightmare country, as you sometimes do in dreams.","zh":"我感觉自己好像偶然闯入了一个噩梦般的国度，就像你在梦中有时会遇到的那样。","kind":"text"},{"t":179.55,"en":"And, as in a nightmare, there was nobody in sight to help me.","zh":"就像在噩梦中一样，四周没有人能帮助我。","kind":"text"},{"t":184.43,"en":"Fortunately for me, as I was wondering what to do next,","zh":"幸运的是，正当我不知下一步该怎么办的时候，","kind":"text"},{"t":188.52,"en":"there appeared on the horizon a man on horseback, riding in my direction.","zh":"地平线上出现了一位骑马的人，正朝我这个方向骑来。","kind":"text"},{"t":194.01,"en":"I waited till he came near, then I asked him the way to our old village.","zh":"我等到他走近，然后问他去我们那个老村子的路。","kind":"text"},{"t":199.45,"en":"He said that there was now no village.","zh":"他说现在已经没有那个村子了。","kind":"text"},{"t":202.51,"en":"I thought he must have misunderstood me, so I repeated its name.","zh":"我以为他一定是误解了我的意思，所以我又重复了一遍村子的名字。","kind":"text"},{"t":208.08,"en":"This time he pointed to the lake.","zh":"这次他指向了湖面。","kind":"text"},{"t":211.15,"en":"The village no longer existed because it had been submerged, and all the valley too.","zh":"那个村子已经不复存在了，因为它连同整个山谷都被淹没了。","kind":"text"},{"t":218.49,"en":"The lake was not a natural one, but a man-made reservoir.","zh":"那片湖不是天然形成的，而是一个人工水库。","kind":"text"}]},{"id":"NCE3-58","book":"NCE3","bookCn":"第三册","num":58,"title":"A Spot of Bother","slug":"58.A Spot of Bother","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/58.A%20Spot%20of%20Bother.mp3","sentenceCount":30,"wordCount":518,"lines":[{"t":0.48,"en":"Lesson 58","zh":"第58课","kind":"lesson"},{"t":2.48,"en":"A spot of bother","zh":"一点麻烦","kind":"title"},{"t":9.52,"en":"What did the old lady find when she got home?","zh":"老太太回家后发现了什么？","kind":"question"},{"t":14.73,"en":"The old lady was glad to be back at the block of flats where she lived.","zh":"老太太很高兴回到她住的公寓楼。","kind":"text"},{"t":20.86,"en":"Her shopping had tired her and her basket had grown heavier with every step of the way home.","zh":"购物让她感到疲惫，回家的每一步都让她手里的篮子变得更沉。","kind":"text"},{"t":28.27,"en":"In the lift her thoughts were on lunch and a good rest;","zh":"在电梯里，她想着午餐和好好休息；","kind":"text"},{"t":32.65,"en":"but when she got out at her own floor, both were forgotten in her sudden discovery that her front door was open.","zh":"但当她走出电梯到达自己的楼层时，她突然发现前门开着，午餐和休息都被抛到了脑后。","kind":"text"},{"t":42.07,"en":"She was thinking that she must reprimand her home help the next morning for such a monstrous piece of negligence,","zh":"她心想，明天早上一定要训斥她的家政人员，因为她如此严重的疏忽，","kind":"text"},{"t":50.44,"en":"when she remembered that she had gone shopping after the home help had left and she knew that she had turned both keys in their locks.","zh":"但她随即想起，家政人员离开后她才去购物，而且她确定自己把两把钥匙都锁好了。","kind":"text"},{"t":60.63,"en":"She walked slowly into the hall and at once noticed that all the room doors were open,","zh":"她慢慢地走进门厅，立刻注意到所有的房门都开着，","kind":"text"},{"t":67.58,"en":"yet following her regular practice she had shut them before going out.","zh":"然而按照她的习惯，出门前她都会关好门。","kind":"text"},{"t":72.69,"en":"Looking into the drawing room, she saw a scene of confusion over by her writing desk.","zh":"往客厅里一看，她看到写字台附近一片混乱。","kind":"text"},{"t":79.28,"en":"It was as clear as daylight then that burglars had forced an entry during her absence.","zh":"这时，她才明白，在她外出期间，窃贼破门而入了，这简直是明摆着的事。","kind":"text"},{"t":85.89,"en":"Her first impulse was to go round all the rooms looking for the thieves,","zh":"她最初的冲动是把所有房间都找一遍，看看有没有小偷，","kind":"text"},{"t":91.23,"en":"but then she decided that at her age it might be more prudent to have someone with her,","zh":"但后来她觉得，以她的年纪，找个人陪着会更稳妥，","kind":"text"},{"t":97.62,"en":"so she went to fetch the porter from his basement.","zh":"于是她下楼去地下室找看门人。","kind":"text"},{"t":101.71,"en":"By this time her legs were beginning to tremble, so she sat down and accepted a cup of very strong tea, while he telephoned the police.","zh":"这时她的双腿开始颤抖，于是她坐下来，喝了一杯很浓的茶，看门人则打电话报了警。","kind":"text"},{"t":112.27,"en":"Then, her composure regained, she was ready to set off with the porter's assistance to search for any intruders who might still be lurking in her flat.","zh":"恢复镇定后，她在看门人的协助下准备出发，搜寻可能仍藏在她公寓里的不速之客。","kind":"text"},{"t":124.54,"en":"They went through the rooms, being careful to touch nothing,","zh":"他们检查了各个房间，小心翼翼地不碰任何东西，","kind":"text"},{"t":128.73,"en":"as they did not want to hinder the police in their search for fingerprints.","zh":"因为他们不想妨碍警方寻找指纹。","kind":"text"},{"t":133.88,"en":"The chaos was inconceivable.","zh":"现场一片狼藉，简直难以置信。","kind":"text"},{"t":137.27,"en":"She had lived in the flat for thirty years and was a veritable magpie at hoarding:","zh":"她在这间公寓住了三十年，是个名副其实的“喜鹊”，喜欢囤积物品：","kind":"text"},{"t":143.59,"en":"and it seemed as though everything she possessed had been tossed out and turned over and over.","zh":"似乎她所有的东西都被翻了出来，翻了个底朝天。","kind":"text"},{"t":151.08,"en":"At least sorting out the things she should have discarded years ago was now being made easier for her.","zh":"至少，现在整理那些她几年前就该扔掉的东西变得容易多了。","kind":"text"},{"t":158.73,"en":"Then a police inspector arrived with a constable and she told them of her discovery of the ransacked flat.","zh":"随后，一名警督带着一名警员赶到，她向他们讲述了她发现公寓被洗劫一空的情况。","kind":"text"},{"t":167.15,"en":"The inspector began to look for fingerprints, while the constable checked that the front door locks had not been forced,","zh":"警督开始寻找指纹，而警员则检查前门锁是否没有被撬，","kind":"text"},{"t":174.4,"en":"thereby proving that the burglars had either used skeleton keys or entered over the balcony.","zh":"这证明窃贼要么使用了万能钥匙，要么是从阳台进入的。","kind":"text"},{"t":182.03,"en":"There was no trace of fingerprints, but the inspector found a dirty red bundle that contained jewellery which the old lady said was not hers.","zh":"没有指纹痕迹，但警督发现了一个脏兮兮的红色包裹，里面装着珠宝，老太太说那不是她的。","kind":"text"},{"t":193.07,"en":"So their entry into this flat was apparently not the burglars' first job that day and they must have been disturbed.","zh":"所以他们闯入这间公寓显然不是窃贼当天做的第一起案子，而且他们一定是在作案时受到了惊扰。","kind":"text"},{"t":201.84,"en":"The inspector then asked the old lady to try to check what was missing by the next day,","zh":"警督随后要求老太太在第二天之前尽量清点一下丢失的物品，","kind":"text"},{"t":208.2,"en":"and advised her not to stay alone in the flat for a few nights.","zh":"并建议她几晚不要独自待在公寓里。","kind":"text"},{"t":212.11,"en":"The old lady thought he was a fussy creature,","zh":"老太太觉得他是个爱挑剔的人，","kind":"text"},{"t":216.47,"en":"but since the porter agreed with him, she rang up her daughter and asked for her help in what she described as a little spot of bother.","zh":"但看门人也同意他的看法，于是她打电话给女儿，请她帮忙解决她所说的“一点小麻烦”。","kind":"text"}]},{"id":"NCE3-59","book":"NCE3","bookCn":"第三册","num":59,"title":"Collecting","slug":"59.Collecting","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/59.Collecting.mp3","sentenceCount":32,"wordCount":508,"lines":[{"t":0.33,"en":"Lesson 59","zh":"第59课","kind":"lesson"},{"t":2.4,"en":"Collecting","zh":"收藏","kind":"title"},{"t":8.71,"en":"What in particular does a person gain when he or she becomes a serious collector?","zh":"一个人成为一名真正的收藏家后，他或她究竟获得了什么？","kind":"question"},{"t":17.12,"en":"People tend to amass possessions, sometimes without being aware of doing so.","zh":"人们倾向于积累财产，有时甚至没有意识到自己在这样做。","kind":"text"},{"t":22.96,"en":"Indeed they can have a delightful surprise when they find something useful which they did not know they owned.","zh":"事实上，当他们发现一些自己并不知道拥有的有用物品时，他们会感到惊喜。","kind":"text"},{"t":30.68,"en":"Those who never have to move house become indiscriminate collectors of what can only be described as clutter.","zh":"那些从不搬家的人成了不加选择的收藏者，而他们的收藏只能被称为杂物。","kind":"text"},{"t":38.27,"en":"They leave unwanted objects in drawers, cupboards and attics for years, in the belief that they may one day need just those very things.","zh":"他们把不用的东西放在抽屉、碗柜和阁楼上好多年，相信总有一天会用上这些东西。","kind":"text"},{"t":48.4,"en":"As they grow old, people also accumulate belongings for two other reasons,","zh":"随着年龄的增长，人们还因为另外两个原因而积累物品：","kind":"text"},{"t":54.85,"en":"lack of physical and mental energy, both of which are essential in turning out and throwing away, and sentiment.","zh":"缺少清理和扔掉东西所必需的体力和精力，以及情感因素。","kind":"text"},{"t":63.55,"en":"Things owned for a long time are full of associations with the past,","zh":"拥有了很久的东西，充满了与过去的联系，","kind":"text"},{"t":68.41,"en":"perhaps with relatives who are dead, and so they gradually acquire a value beyond their true worth.","zh":"也许与已故的亲人有关，因此它们逐渐获得超出其真实价值的价值。","kind":"text"},{"t":76.11,"en":"Some things are collected deliberately in the home in an attempt to avoid waste.","zh":"有些东西是人们为了避免浪费而特意在家中收藏的。","kind":"text"},{"t":81.49,"en":"Among these I would list string and brown paper,","zh":"在这些东西中，我会列举麻线和牛皮纸，","kind":"text"},{"t":84.5,"en":"kept by thrifty people when a parcel has been opened, to save buying these two requisites.","zh":"节俭的人在包裹拆开后会把它们留下，以节省购买这两种必需品的钱。","kind":"text"},{"t":91.45,"en":"Collecting small items can easily become a mania.","zh":"收集小物品很容易变成一种癖好。","kind":"text"},{"t":95.57,"en":"I know someone who always cuts sketches out from newspapers of model clothes that she would like to buy if she had the money.","zh":"我认识一个人，她总是从报纸上剪下她有钱就想买的服装款式图。","kind":"text"},{"t":103.88,"en":"As she is not rich, the chances that she will ever be able to afford such purchases are remote;","zh":"由于她不富裕，她将来能买得起这些东西的可能性很小；","kind":"text"},{"t":111.93,"en":"but she is never sufficiently strongminded to be able to stop the practice.","zh":"但她从没有足够的毅力来停止这种做法。","kind":"text"},{"t":117.24,"en":"It is a harmless habit, but it litters up her desk to such an extent that every time she opens it, loose bits of paper fall out in every direction.","zh":"这是一种无害的习惯，但它把她的书桌弄得一团糟，以至于她每次打开书桌，散乱的纸片都会四处掉落。","kind":"text"},{"t":129.31,"en":"Collecting as a serious hobby is quite different and has many advantages.","zh":"作为一种严肃的爱好，收藏就完全不同了，它有很多优点。","kind":"text"},{"t":135.15,"en":"It provides relaxation for leisure hours, as just looking at one's treasures is always a joy.","zh":"它为闲暇时间提供了放松，因为仅仅看着自己的珍藏就是一种乐趣。","kind":"text"},{"t":142.72,"en":"One does not have to go outside for amusement, since the collection is housed at home.","zh":"人不必外出寻找乐趣，因为藏品就放在家里。","kind":"text"},{"t":148.8,"en":"Whatever it consists of, stamps, records, first editions of books, china, glass,","zh":"无论是邮票、唱片、书籍初版、瓷器、玻璃制品、","kind":"text"},{"t":157.08,"en":"antique furniture, pictures, model cars, stuffed birds, toy animals, there is always something to do in connection with it,","zh":"古董家具、画作、模型汽车、填充鸟类、玩具动物，总有与它相关的事情可做，","kind":"text"},{"t":167.44,"en":"from finding the right place for the latest addition, to verifying facts in reference books.","zh":"从为最新藏品找到合适的位置，到在参考书中核实事实。","kind":"text"},{"t":173.67,"en":"This hobby educates one not only in the chosen subject, but also in general matters which have some bearing on it.","zh":"这种爱好不仅能让人们在所选的领域受到教育，还能在与此相关的一般事务上学到知识。","kind":"text"},{"t":182.06,"en":"There are also other benefits.","zh":"还有其他好处。","kind":"text"},{"t":184.94,"en":"One wants to meet like-minded collectors, to get advice, to compare notes, to exchange articles, to show off the latest find.","zh":"人们会想结识志同道合的收藏家，以获取建议、交流心得、交换物品、炫耀最新的发现。","kind":"text"},{"t":194.33,"en":"So one's circle of friends grows.","zh":"这样一来，朋友圈子就扩大了。","kind":"text"},{"t":197.07,"en":"Soon the hobby leads to travel, perhaps to a meeting in another town,","zh":"很快，这项爱好就会带来旅行，也许是去另一个城市参加会议，","kind":"text"},{"t":202.5,"en":"possibly a trip abroad in search of a rare specimen, for collectors are not confined to any one country.","zh":"也可能是出国旅行寻找稀有标本，因为收藏家并不局限于某个国家。","kind":"text"},{"t":210.33,"en":"Over the years, one may well become an authority on one's hobby and will very probably be asked to give informal talks to little gatherings","zh":"多年以后，人们很可能成为自己爱好领域的权威人士，并且很可能会被邀请在小型聚会上做非正式的演讲，","kind":"text"},{"t":220.08,"en":"and then, if successful, to larger audiences.","zh":"然后，如果成功，还会面向更多的听众。","kind":"text"},{"t":224.84,"en":"In this way self-confidence grows, first from mastering a subject, then from being able to talk about it.","zh":"这样，自信心就会增长，首先是掌握了一门学科，然后是能够谈论它。","kind":"text"},{"t":233.93,"en":"Collecting, by occupying spare time so constructively, makes a person contented, with no time for boredom.","zh":"收藏，通过如此建设性地占据了业余时间，使人感到满足，没有时间感到无聊。","kind":"text"}]},{"id":"NCE3-60","book":"NCE3","bookCn":"第三册","num":60,"title":"Too Early and Too Late","slug":"60.Too Early and Too Late","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE3/60.Too%20Early%20and%20Too%20Late.mp3","sentenceCount":37,"wordCount":586,"lines":[{"t":0.22,"en":"Lesson 60","zh":"第60课","kind":"lesson"},{"t":2.39,"en":"Too early and too late","zh":"为时过早和为时过晚","kind":"title"},{"t":10.62,"en":"Why did the young girl miss the train?","zh":"小女孩为什么错过了火车？","kind":"question"},{"t":15.76,"en":"Punctuality is a necessary habit in all public affairs in civilized society.","zh":"在文明社会中，准时是处理一切公共事务的必要习惯。","kind":"text"},{"t":23.31,"en":"Without it, nothing could ever be brought to a conclusion; everything would be in a state of chaos.","zh":"没有它，任何事情都无法成功；一切都将处于混乱之中。","kind":"text"},{"t":31.53,"en":"Only in a sparsely-populated rural community is it possible to disregard it.","zh":"只有在人口稀少的乡村社区，才有可能忽视它。","kind":"text"},{"t":38.44,"en":"In ordinary living, there can be some tolerance of unpunctuality.","zh":"在日常生活中，对不准时可以有一些宽容。","kind":"text"},{"t":44.04,"en":"The intellectual, who is working on some abstruse problem, has everything coordinated and organized for the matter in hand.","zh":"正在研究某个深奥问题的知识分子，会把手头的一切事物都协调组织好。","kind":"text"},{"t":53.53,"en":"He is therefore forgiven if late for a dinner party.","zh":"因此，如果他赴晚宴迟到了，是可以被原谅的。","kind":"text"},{"t":58.07,"en":"But people are often reproached for unpunctuality when their only fault is cutting things fine.","zh":"但人们常常因为不准时而受到指责，尽管他们唯一的过错只是把时间安排得太紧凑。","kind":"text"},{"t":65.63,"en":"It is hard for energetic, quick-minded people to waste time,","zh":"对于精力充沛、头脑敏捷的人来说，浪费时间是很难的，","kind":"text"},{"t":70.47,"en":"so they are often tempted to finish a job before setting out to keep an appointment.","zh":"所以他们常常想在赴约之前完成一项工作。","kind":"text"},{"t":76.25,"en":"If no accidents occur on the way, like punctured tyres, diversions of traffic, sudden descent of fog, they will be on time.","zh":"如果路上没有发生意外，比如爆胎、交通改道、突如其来的大雾，他们就会准时到达。","kind":"text"},{"t":85.88,"en":"They are often more industrious, useful citizens than those who are never late.","zh":"他们往往比那些从不迟到的人更勤劳、更有用。","kind":"text"},{"t":92.04,"en":"The over-punctual can be as much a trial to others as the unpunctual.","zh":"过分准时的人和不准时的人一样，都会给别人带来麻烦。","kind":"text"},{"t":98.12,"en":"The guest who arrives half an hour too soon is the greatest nuisance.","zh":"提前半小时到达的客人是最让人讨厌的。","kind":"text"},{"t":104.56,"en":"Some friends of my family had this irritating habit.","zh":"我家里有些朋友就有这种令人恼火的习惯。","kind":"text"},{"t":108.32,"en":"The only thing to do was ask them to come half an hour later than the other guests.","zh":"唯一的办法就是请他们比其他客人晚半小时来。","kind":"text"},{"t":114.09,"en":"Then they arrived just when we wanted them.","zh":"这样他们就能在我们想要的时候到达。","kind":"text"},{"t":117.69,"en":"If you are catching a train, it is always better to be comfortably early than even a fraction of a minute too late.","zh":"如果你要赶火车，最好是提前充足时间，而不是哪怕晚一分钟。","kind":"text"},{"t":125.97,"en":"Although being early may mean wasting a little time,","zh":"尽管提前到达可能会浪费一点时间，","kind":"text"},{"t":129.57,"en":"this will be less than if you miss the train and have to wait an hour or more for the next one;","zh":"但这比你错过火车，不得不等一个多小时才能搭乘下一班车要好；","kind":"text"},{"t":135.48,"en":"and you avoid the frustration of arriving at the very moment when the train is drawing out of the station and being unable to get on it.","zh":"而且你还能避免那种火车正驶出车站而你却无法上车的沮丧。","kind":"text"},{"t":146.35,"en":"An even harder situation is to be on the platform in good time for a train and still to see it go off without you.","zh":"更令人恼火的情况是，你准时到了站台，却眼睁睁看着火车没有你开走。","kind":"text"},{"t":156.02,"en":"Such an experience befell a certain young girl the first time she was travelling alone.","zh":"这样的经历就发生在一个年轻女孩身上，那是她第一次独自旅行。","kind":"text"},{"t":162.72,"en":"She entered the station twenty minutes before the train was due,","zh":"她在火车到站前20分钟就进了车站，","kind":"text"},{"t":167.2,"en":"since her parents had impressed upon her","zh":"因为她的父母曾告诫她","kind":"text"},{"t":169.96,"en":"that it would be unforgivable to miss it and cause the friends with whom she was going to stay to make two journeys to meet her.","zh":"错过火车是不可原谅的，那会让她要去拜访的朋友来接她两次。","kind":"text"},{"t":179.32,"en":"She gave her luggage to a porter and showed him her ticket.","zh":"她把行李交给一个搬运工，并给他看了她的车票。","kind":"text"},{"t":183.92,"en":"To her horror he said that she was two hours too soon.","zh":"让她吃惊的是，他说她早来了两个小时。","kind":"text"},{"t":189.16,"en":"She felt in her handbag for the piece of paper on which her father had written down all the details of the journey and gave it to the porter.","zh":"她从手提包里摸索出父亲写下所有旅行细节的纸条，交给了搬运工。","kind":"text"},{"t":198.85,"en":"He agreed that a train did come into the station at the time on the paper and that it did stop, but only to take on mail, not passengers.","zh":"他承认火车确实在纸上写的时间到达车站，也确实停靠了，但那只是为了装载邮件，而不是载客。","kind":"text"},{"t":210.9,"en":"The girl asked to see a timetable, feeling sure that her father could not have made such a mistake.","zh":"女孩要求看时刻表，她确信她父亲不可能犯这样的错误。","kind":"text"},{"t":218.29,"en":"The porter went to fetch one and arrived back with the station master,","zh":"搬运工去拿时刻表，回来时带着站长，","kind":"text"},{"t":223.19,"en":"who produced it with a flourish and pointed out a microscopic 'o' beside the time of the arrival of the train at his station;","zh":"站长得意地拿出时刻表，指出了他们车站火车到站时间旁边的一个微小的“o”；","kind":"text"},{"t":233.04,"en":"this little 'o' indicated that the train only stopped for mail.","zh":"这个小小的“o”表示火车只停靠装载邮件。","kind":"text"},{"t":238.86,"en":"Just as that moment the train came into the station.","zh":"就在那时，火车进站了。","kind":"text"},{"t":243.59,"en":"The girl, tears streaming down her face, begged to be allowed to slip into the guard's van.","zh":"女孩泪流满面，乞求允许她溜进守车。","kind":"text"},{"t":250.78,"en":"But the station master was adamant: rules could not be broken.","zh":"但站长态度坚决：规则不能打破。","kind":"text"},{"t":257.08,"en":"And she had to watch that train disappear towards her destination while she was left behind.","zh":"她不得不眼睁睁看着那列火车开往目的地，而她却被留在了原地。","kind":"text"}]}];
/* ============ 工具 ============ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const today = () => new Date().toLocaleDateString('sv');           // YYYY-MM-DD 本地时区
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv'); };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900); }

/* ============ 默写判分 ============ */
// 只展开无歧义的缩写；'s 因为和所有格同形，不展开（仅去掉撇号）
const CONTR = [
  [/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],
  [/\bshan't\b/g,'shall not'],[/\bain't\b/g,'am not'],
  [/\b(\w+)n't\b/g,'$1 not'],
  [/\b(\w+)'ll\b/g,'$1 will'],[/\b(\w+)'ve\b/g,'$1 have'],
  [/\b(\w+)'re\b/g,'$1 are'],[/\b(\w+)'m\b/g,'$1 am'],
];
function normWords(s){
  let t = String(s).toLowerCase()
    .replace(/[‘’ʼ]/g, "'")                     // 弯撇号 → 直撇号
    .replace(/[“”]/g, '"')
    .replace(/[￡]/g, '£').replace(/[＄]/g, '$'); // 全角货币符号 → 半角，否则孩子打 £ 会判错
  t = t.replace(/(\w)'\s+t\b/g, "$1't");        // "can' t" → "can't"，再交给下面的规则表
  CONTR.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/(\d)\s*[.,]\s*(\d)/g, '$1$2')   // 1,316 / 1, 316 / 1.5 里的分隔符不算标点
       .replace(/[^a-z0-9'\s£€¥$]/g, ' ')        // 去标点，保留货币符号
       .replace(/'/g, '')                        // 去所有格 / 未展开的撇号
       .replace(/\s+/g, ' ').trim();
  return t ? t.split(' ') : [];
}
// 同样的归一化，但记住每个词来自原句的第几个 token —— 高亮要靠它才不会错位
function normTokens(s){
  const toks = String(s).split(/\s+/).filter(Boolean);
  const units = [];
  for (let i = 0; i < toks.length; i++){
    let text = toks[i], ois = [i];
    // 原文里 "10, 000" 被空格拆成两个 token，要先合回一个数字再归一化
    while (i + 1 < toks.length &&
           ((/\d[.,]$/.test(text) && /^\d/.test(toks[i+1])) ||      // "10," + "000"
            (/'$/.test(text) && /^t\b/i.test(toks[i+1])))){          // "can'" + "t"
      text += toks[i+1]; ois.push(++i);
    }
    units.push({ text, ois });
  }
  const out = [];
  units.forEach(u => normWords(u.text).forEach(w => out.push({ w, ois: u.ois })));
  return out;
}
// 词级 LCS，用于标出错在哪
function diffWords(want, got){
  const n = want.length, m = got.length;
  const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = want[i].w===got[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while (i<n && j<m){
    if (want[i].w===got[j]){ out.push({t:'ok', ois:want[i].ois}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]){ out.push({t:'miss', ois:want[i].ois}); i++; }
    else { out.push({t:'extra', w:got[j]}); j++; }
  }
  while (i<n){ out.push({t:'miss', ois:want[i].ois}); i++; }
  while (j<m){ out.push({t:'extra', w:got[j]}); j++; }
  return out;
}
function grade(target, input){
  const want = normTokens(target), got = normWords(input);
  const pass = want.length === got.length && want.every((x,i) => x.w === got[i]);
  return { pass, diff: pass ? null : diffWords(want, got) };
}
// 把原句按词渲染。mask=true 时把答错的词遮成「首字母+点」，给提示但不直接给答案
function renderDiff(target, diff, mask){
  const toks = String(target).split(/(\s+)/);
  const bad = new Set(); diff.forEach(d => { if (d.t === 'miss') d.ois.forEach(o => bad.add(o)); });
  let oi = -1, html = '', wrong = 0;
  for (const piece of toks){
    if (/^\s+$/.test(piece)){ html += piece; continue; }
    oi++;
    if (!bad.has(oi)){ html += `<w-ok>${esc(piece)}</w-ok>`; continue; }
    wrong++;
    if (mask){
      const m = piece.match(/[A-Za-z]+/);
      const w = m ? m[0] : piece;
      html += `<w-mask>${esc(w[0])}${'·'.repeat(Math.max(w.length - 1, 1))}</w-mask>`;
    } else {
      html += `<w-miss>${esc(piece)}</w-miss>`;
    }
  }
  return { html, wrong, extras: diff.filter(d => d.t === 'extra').map(d => d.w) };
}

/* ============ 存档 ============ */
const KEY = 'nce-recite-v1';
const REVIEW_GAPS  = [1,2,4,7,15];   // 艾宾浩斯复习间隔（天）
const REVIEW_SAMPLE = 8;             // 复习时抽查几句
const DUE_SHOW      = 5;             // 首页一次最多列几课复习
let DB = load();

function load(){
  let r = null;
  try { r = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  // 存档可能被手改坏 / 是旧版本 / 恢复时粘了半截，每个字段都要体检，坏了就用默认值而不是白屏
  if (!r || typeof r !== 'object' || !r.p || typeof r.p !== 'object') r = { p:{}, days:[] };
  if (!Array.isArray(r.days)) r.days = [];
  r.days = r.days.filter(d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const pl = (r.plan && typeof r.plan === 'object') ? r.plan : {};
  r.plan = {
    perDay: (Number.isFinite(+pl.perDay) && +pl.perDay >= 1 && +pl.perDay <= 50) ? Math.round(+pl.perDay) : 8,
    unlockTo: (Number.isFinite(+pl.unlockTo) && +pl.unlockTo >= 1) ? Math.round(+pl.unlockTo) : 999,
    lastNewDate: typeof pl.lastNewDate === 'string' ? pl.lastNewDate : null,
  };
  // 老存档没有 pos 字段，补上：已通关的课当作全部背完
  for (const id of Object.keys(r.p)){
    const c = r.p[id], l = DATA.find(x => x.id === id);
    if (!l || !c || typeof c !== 'object'){ delete r.p[id]; continue; }
    const total = l.lines.filter(x => x.kind === 'text').length;
    if (!Number.isFinite(+c.pos)) c.pos = c.done ? total : 0;          // 老存档没有 pos
    c.pos = Math.max(0, Math.min(Math.round(+c.pos), total));
    c.stage = (Number.isFinite(+c.stage) && +c.stage >= 0 && +c.stage <= 4) ? Math.round(+c.stage) : 0;
    c.done = !!c.done;
    c.rIdx = (Number.isFinite(+c.rIdx) && +c.rIdx >= 0) ? Math.min(Math.round(+c.rIdx), REVIEW_GAPS.length - 1) : 0;
    if (typeof c.next !== 'string') c.next = c.done ? addDays(today(), REVIEW_GAPS[0]) : null;
  }
  return r;
}
let saveWarned = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); saveWarned = false; }
  catch(e){                       // 无痕模式 / 存储满：必须让人知道，否则一整天白背
    if (!saveWarned){ saveWarned = true; toast('⚠️ 进度存不进去！可能开了无痕模式，今天的记录关掉就没了'); }
  }
}
function rec(id){ return DB.p[id] || (DB.p[id] = { pos:0, stage:0, done:false, cleared:null, rIdx:0, next:null }); }
function markDay(){ const d = today(); if (!DB.days.includes(d)){ DB.days.push(d); DB.days.sort(); } save(); }
function streak(){
  if (!DB.days.length) return 0;
  let n = 0, d = today();
  if (!DB.days.includes(d)) d = addDays(d,-1);
  while (DB.days.includes(d)){ n++; d = addDays(d,-1); }
  return n;
}

/* ============ 背诵计划 ============ */
// 一课按每天句数切成若干段；剩下不多时（≤1.5 倍）一次做完，不留两三句的尾巴
function textCount(l){ return l.lines.filter(x => x.kind === 'text').length; }
function segOf(l){
  const r = DB.p[l.id] || { pos:0 };
  const total = textCount(l);            // 只信真实行数；sentenceCount 万一对不上会导致永远背不完
  const pos = Math.min(r.pos || 0, total);
  const remain = total - pos;
  if (remain <= 0) return null;
  const n = DB.plan.perDay;
  const len = remain <= Math.ceil(n * 1.5) ? remain : n;
  return { from: pos, len, to: pos + len, remain, total };
}
// 下一课新背：第一门没背完、且在"已解锁"范围内的课
function nextNew(){
  for (const l of DATA){
    if (l.num > DB.plan.unlockTo && l.book === 'NCE2') continue;
    if (l.book === 'NCE3' && DB.plan.unlockTo < 900 && !allDone('NCE2')) continue;
    const r = DB.p[l.id];
    if (r && r.done) continue;
    const s = segOf(l);
    if (s) return { lesson: l, seg: s };
  }
  return null;
}
function allDone(book){ return DATA.filter(l => l.book === book).every(l => (DB.p[l.id]||{}).done); }
function newDoneToday(){ return DB.plan.lastNewDate === today(); }

function dueList(){
  const t = today();
  return DATA
    .filter(l => { const r = DB.p[l.id];
      if (!r || !r.done) return false;
      if (r.lastRev === t) return true;               // 今天已复习过的留在列表里打勾，不然"还剩N项"会跳
      return r.next && r.next <= t; })
    .sort((a,b) => { const x = DB.p[a.id].next || '', y = DB.p[b.id].next || '';
                     return x === y ? a.num - b.num : (x < y ? -1 : 1); });
}
function overdueDays(id){
  const n = DB.p[id] && DB.p[id].next; if (!n) return 0;
  return Math.max(0, Math.round((new Date(today()) - new Date(n)) / 86400000));
}
function reviewedToday(id){ const r = DB.p[id]; return r && r.lastRev === today(); }
function todayTasks(){
  const due = dueList().slice(0, DUE_SHOW).map(l => ({ kind:'review', lesson:l, done:reviewedToday(l.id) }));
  const nn = nextNew();
  if (nn) due.push({ kind:'new', lesson:nn.lesson, seg:nn.seg, done:newDoneToday() });
  return due;
}

function clearLesson(id){
  const r = rec(id);
  const first = !r.done;                 // 第一次通关才排复习；重练不该把档位打回去
  r.done = true; r.stage = 0;
  const l = DATA.find(x => x.id === id); r.pos = textCount(l);
  r.cleared = r.cleared || today();
  if (first){ r.rIdx = 0; r.next = addDays(today(), REVIEW_GAPS[0]); }
  markDay(); save();
}
function finishReview(id, clean){
  const r = rec(id); r.lastRev = today();
  if (clean){ r.rIdx = Math.min((r.rIdx||0) + 1, REVIEW_GAPS.length - 1);
              r.next = addDays(today(), REVIEW_GAPS[r.rIdx]); }
  else      { r.next = addDays(today(), 1); }
  markDay(); save();
}

/* ============ 音频 ============ */
const au = new Audio(); au.preload = 'auto';
let stopAt = null, onSentenceEnd = null, pendingSeek = null;
let RATE = 1;
function setRate(v){                       // load() 会把 playbackRate 打回 defaultPlaybackRate，两个都要设
  RATE = v; au.defaultPlaybackRate = v; au.playbackRate = v;
}
function audioReset(){                     // 换课 / 回首页：把上一课残留的定时停止点和待触发回调全部拆掉
  au.pause(); stopAt = null; onSentenceEnd = null;
  if (pendingSeek){ au.removeEventListener('loadedmetadata', pendingSeek); pendingSeek = null; }
}
au.addEventListener('timeupdate', () => {
  if (stopAt !== null && au.currentTime >= stopAt){ au.pause(); stopAt = null; const f = onSentenceEnd; onSentenceEnd = null; f && f(); }
  if (VIEW === 'stage1') hilite();
});
au.addEventListener('ended', () => { stopAt = null; const f = onSentenceEnd; onSentenceEnd = null; f && f(); });
function playRange(from, to, after){
  if (pendingSeek){ au.removeEventListener('loadedmetadata', pendingSeek); pendingSeek = null; }
  stopAt = to ?? null; onSentenceEnd = after || null;
  const seek = () => { try { au.currentTime = from; } catch(e){} };
  // iOS 要求 play() 同步发生在点击里，所以先无条件 play() 解锁，再在能 seek 的时候 seek
  const p = au.play();
  if (au.readyState === 0){
    pendingSeek = () => { pendingSeek = null; seek(); setRate(RATE); au.play().catch(()=>{}); };
    au.addEventListener('loadedmetadata', pendingSeek, { once:true });
  } else seek();
  if (p && p.catch) p.catch(err => {
    if (err && err.name === 'NotAllowedError') toast('再点一下播放就有声音了');
    else toast('音频加载失败，检查网络');
  });
}
function playSentence(i, after){
  const b = BODY[i]; if (!b) return;
  // b.end 是这句在【整课】里的结束时刻；最后一句没有 end，才放到音频自然结束
  playRange(b.t, b.end ?? null, after);
}

/* ============ 状态 ============ */
let VIEW = 'home', BOOK = 'NCE2', L = null, BODY = [], STAGE = 1, IDX = 0;
let MODE = 'new';                 // new | review
let REDO = false;                 // 正在重练一门已通关的课
let SEG = null;                   // 本次练习的句段
let picked = [], pool = [], wrongTaps = 0, tries = 0, reviewClean = true;
let busy = false;   // 防连点：段结算 / 跳下一句 期间锁住
let GEN = 0;        // 每次进课/回首页 +1；延时回调先对代号，防止打到别的课上
let tapLock = false;   // 单纯防连点，和 busy 分开——用 busy 会把 nextStage 自己挡住
function tap(fn){ if (tapLock) return; tapLock = true; setTimeout(() => tapLock = false, 250); fn(); }
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }

/* ============ 首页 ============ */

  }).join('') : (DB.plan.unlockTo < 900 && !allDone('NCE2')
      ? `<div class="card q"><div class="tiny muted">第二册前 <b>${DB.plan.unlockTo}</b> 课都背完了 👏
           后面的课还锁着——课学到哪了，就去右上角 <b>⋯</b> 把「只背到第二册第几课」往后调。</div></div>`
      : `<div class="card q"><div class="tiny muted">全部课文都背完了 👏 想复习就从下面挑一课。</div></div>`);

    </div>
    <div class="sec">今天的任务
      ${tasks.length ? (left ? `<span class="cnt2">还剩 ${left} 项</span>` : `<span class="cnt2 ok">全部完成 🎉</span>`) : ''}</div>
    <div class="prog" style="margin-bottom:10px"><i style="width:${tasks.length ? (tasks.length-left)/tasks.length*100 : 100}%"></i></div>

    ${dueAll.length > DUE_SHOW ? `<div class="tiny muted" style="margin:2px 4px 0">还有 ${dueAll.length - DUE_SHOW} 课待复习，做完上面这些会自动补上来。</div>` : ''}

/* ============ 进入一课 ============ */
function openLesson(id, mode){
  GEN++; busy = false;
  L = DATA.find(l => l.id === id);
  const raw = L.lines.filter(x => x.kind === 'text');
  // end = 整课里下一句的起点。最后一句留 null（播到音频自然结束）
  const all = raw.map((x, i) => Object.assign({}, x, { end: raw[i+1] ? raw[i+1].t - 0.05 : null }));
  MODE = mode === 'review' ? 'review' : 'new';
  reviewClean = true;
  if (MODE === 'review'){
    // 复习不默写整课（三册一课最多 38 句），随机抽 8 句，按原顺序排好
    BODY = all.length > REVIEW_SAMPLE
      ? shuffle(all.map((x,i) => i)).slice(0, REVIEW_SAMPLE).sort((a,b)=>a-b).map(i => all[i])
      : all;
    SEG = null; STAGE = 4;
  } else {
    const r = rec(id);
    REDO = !!r.done;
    if (r.done && r.pos >= all.length){ r.pos = 0; r.stage = 0; save(); }   // 已通关的课再点 = 从头重练
    SEG = segOf(L) || { from:0, len:all.length, to:all.length, total:all.length };
    BODY = all.slice(SEG.from, SEG.to);
    STAGE = Math.min((r.stage || 0) + 1, 4);
  }
  audioReset(); au.src = L.audioUrl; setRate(RATE);
  IDX = 0; renderStage();
}
function renderStage(){
  $('#bar').classList.remove('hide');
  const sub = MODE === 'review' ? '复习' : (SEG && SEG.total > BODY.length ? `第 ${SEG.from+1}-${SEG.to} 句` : '');
  $('#head').innerHTML = `<div class="hbar">
      <button class="iconbtn" id="back">‹</button>
      <h1>${esc(L.title)}</h1>
      <span class="tiny muted">${sub || (L.bookCn + '·' + L.num)}</span></div>`;
  $('#back').onclick = () => { au.pause(); renderHome(); };
  if (MODE === 'review'){
    $('#stagebar').innerHTML = `<div class="stages"><div class="sg on">复习 · 抽查 ${BODY.length} 句默写</div></div>`;
  } else {
    const names = ['听读','跟读','拼句','默写'];
    $('#stagebar').innerHTML = `<div class="stages">${names.map((n,i) => {
      const k = i + 1;
      return `<div class="sg ${k===STAGE?'on':(k<STAGE?'pass':'')}">${k}. ${n}</div>`; }).join('')}</div>`;
  }
  IDX = 0; picked = []; pool = [];
  ({1:stage1, 2:stage2, 3:stage3, 4:stage4}[STAGE])();
}
function nextStage(){
  if (busy) return;
  const r = rec(L.id);
  if (MODE === 'review'){ busy = true; finishReview(L.id, reviewClean); return doneScreen(); }
  r.stage = Math.max(r.stage || 0, STAGE); markDay(); save();
  if (STAGE < 4){ STAGE++; renderStage(); return; }
  busy = true;
  // 这一段四关走完
  r.pos = Math.min((r.pos || 0) + BODY.length, L.sentenceCount);
  r.stage = 0;
  if (!REDO) DB.plan.lastNewDate = today();   // 重练旧课不占用"今天的新背"名额
  if (r.pos >= L.sentenceCount) clearLesson(L.id); else { markDay(); save(); }
  doneScreen();
}
function doneScreen(){
  busy = false; audioReset(); $('#stagebar').innerHTML = ''; $('#bar').classList.add('hide');
  const r = rec(L.id);
  const finished = MODE === 'review' || (r.done && r.pos >= textCount(L));
  const rest = textCount(L) - r.pos;
  let title, note;
  if (MODE === 'review'){
    title = reviewClean ? '复习通过！' : '复习完成，明天再来一次';
    note = `下次复习：${r.next}`;
  } else if (r.done && r.pos >= textCount(L)){
    title = REDO ? '这一课又过了一遍！' : '这一课通关了！';
    note = `全部 ${textCount(L)} 句 · 下次复习：${r.next}`;
  } else {
    title = '这一段背完了！';
    note = `这一课还剩 ${rest} 句，明天接着背`;
  }
  $('#app').innerHTML = `<div class="card done">
      <div class="big">${MODE==='review' && !reviewClean ? '💪' : '🎉'}</div>
      <h2>${title}</h2>
      <p class="muted">${esc(L.title)}</p>
      <p class="tiny muted">${note}</p>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn pri" id="home">回到首页</button>
        ${!finished ? `<button class="btn" id="cont">继续背下一段</button>` : ''}
      </div></div>`;
  $('#home').onclick = renderHome;
  const c = $('#cont'); if (c) c.onclick = () => openLesson(L.id, 'new');
}
/* ============ 第1关 听读 ============ */
let lastHi = -1;
function hilite(){
  const els = $$('#app .s'); let k = -1;
  BODY.forEach((b,i) => { if (au.currentTime >= b.t - 0.05) k = i; });
  els.forEach((e,i) => e.classList.toggle('cur', i === k));
  if (k >= 0 && k !== lastHi){
    lastHi = k;
    els[k] && els[k].scrollIntoView({block:'center', behavior:'smooth'});
  }
}
function stage1(){
  VIEW = 'stage1'; lastHi = -1;                       // hilite() 靠这个开关，忘了设它高亮就永远不动
  const q = L.lines.find(x => x.kind === 'question');
  $('#app').innerHTML = `
    ${q ? `<div class="card q"><div class="lab">课前问题（不用背）</div>
        <div class="zhbig">${esc(q.zh)}</div><div class="tiny muted" style="margin-top:4px">${esc(q.en)}</div></div>` : ''}
    ${BODY.map((b,i) => `<button class="s" data-i="${i}">
        <div class="idx">${i+1}</div><div class="bd"><div class="en">${esc(b.en)}</div>
        <div class="zh">${esc(b.zh)}</div></div></button>`).join('')}
    <div style="height:16px"></div>`;
  $$('#app .s').forEach(el => el.onclick = () => { const i = +el.dataset.i; playSentence(i); });
  bar([
    ['▶ 连续播这一段','pri', () => playRange(BODY[0].t, BODY[BODY.length-1].end ?? null)],
    ['■ 暂停','', () => au.pause()],
    ['听完了，下一关 ›','ok', () => tap(nextStage)],
  ], true);
}

/* ============ 第2关 跟读 ============ */
function stage2(){ VIEW = 'stage'; drawFollow(); }
function drawFollow(){
  const b = BODY[IDX];
  $('#app').innerHTML = `
    <div class="prog"><i style="width:${IDX/BODY.length*100}%"></i></div>
    <div class="card q">
      <div class="lab">第 ${IDX+1} / ${BODY.length} 句 · 听一遍，然后大声读出来</div>
      <div class="enbig">${esc(b.en)}</div>
      <div class="zhbig muted" style="font-size:15px;margin-top:8px">${esc(b.zh)}</div>
    </div>
    <div class="tiny muted" style="text-align:center">读完点「读好了」。想再听一遍就点「再听」。</div>`;
  bar([
    ['🔊 再听','', () => playSentence(IDX)],
    ['读好了 ›','pri', () => tap(() => {
        if (IDX + 1 < BODY.length){ IDX++; drawFollow(); playSentence(IDX); } else nextStage(); })],
  ], true);
  playSentence(IDX);
}

/* ============ 第3关 拼句 ============ */
function stage3(){ VIEW = 'stage'; drawBuild(); }
function drawBuild(){
  const b = BODY[IDX];
  const words = b.en.split(/\s+/).filter(Boolean);
  pool = shuffle(words.map((w,i) => ({w, i})));
  picked = []; wrongTaps = 0;
  $('#app').innerHTML = `
    <div class="prog"><i style="width:${IDX/BODY.length*100}%"></i></div>
    <div class="card q">
      <div class="lab">第 ${IDX+1} / ${BODY.length} 句 · 按顺序点出这句英文</div>
      <div class="zhbig">${esc(b.zh)}</div>
    </div>
    <div class="slot" id="slot"></div>
    <div class="chips" id="pool"></div>`;
  paintBuild();
  bar([
    ['↩ 退一个','', () => { if (picked.length){ picked.pop(); paintBuild(); } }],
    ['🔊 听一遍','', () => playSentence(IDX)],
    ['清空','ghost', () => { picked = []; paintBuild(); }],
  ], true);
}
function paintBuild(){
  const b = BODY[IDX];
  const words = b.en.split(/\s+/).filter(Boolean);
  $('#slot').innerHTML = picked.map(p => `<span class="w">${esc(p.w)}</span>`).join(' ') || '<span class="muted" style="font-size:15px">点下面的词，按顺序拼出这句话</span>';
  $('#pool').innerHTML = pool.map((p,k) => `<button class="chip ${picked.some(x => x.i === p.i) ? 'used' : ''}" data-k="${k}">${esc(p.w)}</button>`).join('');
  $$('#pool .chip').forEach(c => c.onclick = () => {
    const p = pool[+c.dataset.k];
    if (picked.some(x => x.i === p.i)) return;
    // 逐个词校验：点错立刻拒绝，不让孩子拼出一整句错的再推倒重来
    if (p.w !== words[picked.length]){
      c.classList.add('wrong');
      setTimeout(() => c.classList.remove('wrong'), 420);
      wrongTaps++;
      if (wrongTaps === 3){ toast('提示：下一个词是「' + words[picked.length] + '」'); wrongTaps = 0; }
      return;
    }
    wrongTaps = 0;
    picked.push(p); paintBuild();
    if (picked.length === words.length){
      $('#slot').classList.add('good');
      playSentence(IDX);
      const step = IDX;
      const g = GEN;
      setTimeout(() => { if (g !== GEN || STAGE !== 3 || IDX !== step || VIEW !== 'stage') return;
        if (IDX + 1 < BODY.length){ IDX++; drawBuild(); } else nextStage(); }, 1400);
    }
  });
}

/* ============ 第4关 默写 ============ */
function stage4(){ VIEW = 'stage'; drawWrite(); }
function drawWrite(){
  const b = BODY[IDX];
  $('#app').innerHTML = `
    <div class="prog"><i style="width:${IDX/BODY.length*100}%"></i></div>
    <div class="card q">
      <div class="lab">第 ${IDX+1} / ${BODY.length} 句 · 看中文，写出英文原句</div>
      <div class="zhbig">${esc(b.zh)}</div>
    </div>
    <textarea id="ans" autocapitalize="sentences" autocomplete="off" autocorrect="off"
      spellcheck="false" placeholder="在这里写出英文…"></textarea>
    <div id="res"></div>
    <div style="height:12px"></div>`;
  tries = 0;
  busy = false;
  $('#ans').readOnly = false;
  $('#ans').focus();
  $('#ans').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); check(); } };
  bar([
    ['🔊 听一遍','', () => playSentence(IDX)],
    ['对答案','pri', check],
    ['跳过','ghost', () => tap(() => { if (busy) return; reviewClean = false; advance(); })],
  ], true);
}
function advance(){
  if (busy) return;
  tries = 0;
  if (IDX + 1 < BODY.length){ IDX++; drawWrite(); } else nextStage();
}
function check(){
  if (busy) return;
  const b = BODY[IDX];
  const val = $('#ans').value.trim();
  if (!val){ toast('先写点什么再对答案'); return; }
  const g = grade(b.en, val);
  if (g.pass){
    $('#res').innerHTML = `<div class="res good"><div class="hd">✓ 完全正确</div>${esc(b.en)}</div>`;
    $('#ans').readOnly = true;              // 用 readOnly 不用 disabled：iOS 上 disabled 会收键盘且不再弹回
    tries = 0; busy = true;
    const g = GEN, ix = IDX;
    setTimeout(() => { busy = false;                       // 锁一定要解，否则条件不满足时会永久卡住
                       if (g !== GEN || ix !== IDX) return; advance(); }, 1100);
    return;
  }
  tries++;
  // 前两次只给位置提示（首字母 + 占位点），第三次才给完整答案
  const show = tries >= 3;
  const d = renderDiff(b.en, g.diff, !show);
  $('#res').innerHTML = `<div class="res bad">
      <div class="hd">✗ 有 ${d.wrong} 处还不对${show ? '（这是正确答案）' : ''}</div>
      ${d.html}
      ${d.extras.length ? `<div class="extra">这些词不在原句里：${esc(d.extras.join(' '))}</div>` : ''}
      <div class="cnt muted">${show ? '照着改对，或点「跳过」。' : '红点是遮住的词，一个点代表一个字母。不区分大小写和标点。'}</div>
      ${show ? '' : `<button class="btn ghost reveal" id="rev">想不起来了，看答案</button>`}</div>`;
  if (show) reviewClean = false;
  const rv = $('#rev'); if (rv) rv.onclick = () => { tries = 3; reviewClean = false; check(); };
}

/* ============ 底栏 ============ */
function bar(items, withRate){
  $('#bar').innerHTML = `<div class="in">
    ${items.map((it,i) => `<button class="btn ${it[1]}" data-b="${i}">${it[0]}</button>`).join('')}
    ${withRate ? `<select id="rate"><option value="0.75">0.75×</option><option value="1">1.0×</option><option value="1.25">1.25×</option></select>` : ''}
  </div>`;
  $$('#bar [data-b]').forEach(el => el.onclick = items[+el.dataset.b][2]);
  const r = $('#rate'); if (r){ r.value = String(RATE); r.onchange = () => setRate(parseFloat(r.value)); }
}


/* ============ 设置 · 备份 ============ */
function renderSetting(){
  VIEW = 'setting'; audioReset(); GEN++;
  $('#head').innerHTML = `<div class="hbar"><button class="iconbtn" id="back">‹</button><h1>设置与备份</h1></div>`;
  $('#stagebar').innerHTML = ''; $('#bar').classList.add('hide');
  const cleared = Object.values(DB.p).filter(r => r.done).length;
  const unlocked = DB.plan.unlockTo >= 900 ? '' : DB.plan.unlockTo;
  $('#app').innerHTML = `
    <div class="card q">
      <div class="lab">背诵计划</div>
      <div class="row2"><span>每天新背</span>
        <select id="perDay">${[4,5,6,8,10,12,15].map(n =>
          `<option value="${n}" ${n===DB.plan.perDay?'selected':''}>${n} 句</option>`).join('')}</select></div>
      <div class="tiny muted" style="margin-top:6px">一课会按这个数切成几段，每天背一段。剩下不多时会一次做完，不留两三句的尾巴。</div>
      <div class="row2" style="margin-top:16px"><span>只背到第二册第</span>
        <input id="unlock" type="number" min="1" max="96" inputmode="numeric" value="${unlocked}" placeholder="不限">
        <span>课</span></div>
      <div class="tiny muted" style="margin-top:6px">你的课学到哪，就填哪。工具不会给你排还没学过的课。留空 = 不限制，一路背下去。</div>
    </div>
    <div class="card q">
      <div class="lab">为什么要备份</div>
      <div class="tiny" style="line-height:1.7">进度只存在这台设备的浏览器里。iPad 的 Safari 长期不打开某个网站会清掉它的数据，换设备也带不过去。
      隔一阵子备份一次，或者换设备时导一下，就不会丢。</div>
    </div>
    <div class="card q">
      <div class="lab">当前进度</div>
      <div>已通关 <b>${cleared}</b> 课 · 打卡 <b>${DB.days.length}</b> 天</div>
      <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn pri" id="dl">下载备份文件</button>
        <button class="btn" id="copy">复制到剪贴板</button>
      </div>
      <textarea id="box" spellcheck="false" style="margin-top:12px;min-height:96px;font-size:12px"
        placeholder="备份内容会出现在这里；恢复时把备份内容粘贴进来"></textarea>
    </div>
    <div class="card q">
      <div class="lab">恢复</div>
      <div class="tiny muted">把备份内容粘贴到上面的框里，再点这里。<b>会覆盖这台设备现在的进度。</b></div>
      <div style="margin-top:12px"><button class="btn ok" id="restore">用粘贴的内容恢复</button></div>
    </div>
    <div class="card q">
      <div class="lab">清空</div>
      <div class="tiny muted">删掉这台设备上的全部进度，无法撤销。建议先备份。</div>
      <div style="margin-top:12px"><button class="btn" id="wipe" style="color:var(--err);border-color:var(--err)">清空全部进度</button></div>
    </div>
    <div style="height:20px"></div>`;
  $('#back').onclick = renderHome;
  const text = () => JSON.stringify({ app:'nce-recite', v:2, at: today(), db: DB });
  const refresh = () => { $('#box').value = text(); };
  $('#perDay').onchange = e => { DB.plan.perDay = parseInt(e.target.value, 10); save(); refresh(); toast('每天 ' + DB.plan.perDay + ' 句'); };
  $('#unlock').onchange = e => {
    const v = parseInt(e.target.value, 10);
    DB.plan.unlockTo = (v >= 1 && v <= 96) ? v : 999; save(); refresh();
    toast(DB.plan.unlockTo >= 900 ? '不限制课程范围' : '只排到第二册第 ' + DB.plan.unlockTo + ' 课');
  };
  refresh();
  $('#dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text()], {type:'application/json'}));
    a.download = `新概念背诵进度-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已下载。手机上如果没反应，用「复制到剪贴板」');
  };
  $('#copy').onclick = async () => {
    const el = $('#box'); el.select(); el.setSelectionRange(0, 999999);
    try { await navigator.clipboard.writeText(text()); toast('已复制'); }
    catch(e){ document.execCommand('copy'); toast('已复制'); }
  };
  $('#restore').onclick = () => {
    let o; try { o = JSON.parse($('#box').value); } catch(e){ toast('内容不对，粘贴的可能不完整'); return; }
    const d = o && o.db && o.db.p ? o.db : (o && o.p ? o : null);
    if (!d){ toast('这不是一份有效的备份'); return; }
    if (!confirm('用粘贴的内容覆盖这台设备的进度？')) return;
    localStorage.setItem(KEY, JSON.stringify({ p: d.p || {}, days: d.days || [], plan: d.plan || {} }));
    DB = load(); save();
    toast('恢复成功'); setTimeout(renderHome, 700);
  };
  $('#wipe').onclick = () => {
    if (!confirm('清空这台设备上的全部进度？无法撤销。')) return;
    localStorage.removeItem(KEY); DB = load(); save();
    toast('已清空'); setTimeout(renderHome, 700);
  };
}

renderHome();

</script>
</body>
</html>
