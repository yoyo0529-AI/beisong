<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="新概念背诵">
<meta name="theme-color" content="#2f6bd8">
<title>新概念背诵</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#161a1f; --dim:#697585; --line:#e3e7ec;
  --acc:#2f6bd8; --accbg:#e9f0fd; --ok:#1a9c62; --okbg:#e6f6ee; --err:#d63a3a; --errbg:#fdecec;
  --warn:#b8730a; --warnbg:#fdf3e2; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1116; --card:#171b22; --ink:#e9ecf1; --dim:#98a2b3; --line:#272d38;
  --acc:#6ea2ff; --accbg:#16233d; --ok:#4ac795; --okbg:#122c22; --err:#ff6b6b; --errbg:#33191b;
  --warn:#e0a34a; --warnbg:#2e2415; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:17px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none !important}

/* ---------- 通用 ---------- */
.wrap{max-width:820px;margin:0 auto;padding:16px;width:100%;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:16px;font-weight:500;min-height:48px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.muted{color:var(--dim)}
.tiny{font-size:13px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:820px;margin:0 auto}
.hbar h1{flex:1;font-size:16px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.iconbtn:active{background:var(--accbg)}

/* ---------- 首页 ---------- */
.hero{padding:18px;margin-bottom:14px;display:flex;gap:14px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:27px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--dim)}
.sec{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.05em;margin:20px 4px 9px}
.rev{padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.rev .t{flex:1;min-width:0}
.rev .t b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--warnbg);color:var(--warn);font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:15px;font-weight:600;text-align:center}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.les{padding:12px 13px;text-align:left;display:flex;gap:10px;align-items:center;border-radius:13px;
  border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.les:active{border-color:var(--acc)}
.les .num{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--accbg);color:var(--acc);
  font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.les.done .num{background:var(--okbg);color:var(--ok)}
.les .ti{flex:1;min-width:0;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les .st{font-size:11px;color:var(--dim);margin-top:2px}
.les.due{border-color:var(--warn)}

/* ---------- 关卡条 ---------- */
.stages{display:flex;gap:6px;padding:0 16px 10px;max-width:820px;margin:0 auto}
.sg{flex:1;padding:8px 4px;border-radius:10px;text-align:center;font-size:12.5px;font-weight:600;
  background:var(--bg);color:var(--dim);border:1px solid transparent}
.sg.on{background:var(--acc);color:#fff}
.sg.pass{background:var(--okbg);color:var(--ok)}

/* ---------- 句子 ---------- */
.s{padding:13px 15px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;border-radius:13px;
  border:1px solid var(--line);background:var(--card);text-align:left;width:100%;box-shadow:var(--shadow)}
.s .idx{flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:var(--accbg);color:var(--acc);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.s .bd{flex:1;min-width:0}
.s .en{font-size:17.5px;line-height:1.55}
.s .zh{font-size:14px;color:var(--dim);margin-top:3px}
.s.cur{border-color:var(--acc);background:var(--accbg)}

/* ---------- 单句练习区 ---------- */
.q{padding:18px;margin-bottom:14px}
.q .lab{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.05em;margin-bottom:7px}
.q .zhbig{font-size:19px;line-height:1.6}
.q .enbig{font-size:20px;line-height:1.6;margin-top:10px}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:17px;min-height:46px;box-shadow:var(--shadow)}
.chip:active{background:var(--accbg)}
.chip.used{opacity:.28;pointer-events:none}
.slot{min-height:58px;padding:11px 13px;border-radius:12px;border:1.5px dashed var(--line);
  background:var(--card);margin-bottom:12px;font-size:18px;line-height:1.7;word-break:break-word}
.slot.good{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.slot .w{display:inline-block;margin:0 3px}
textarea{width:100%;min-height:110px;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:18px;line-height:1.6;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.res{padding:14px 15px;border-radius:12px;margin-top:12px;font-size:17.5px;line-height:1.75}
.res.good{background:var(--okbg);border:1px solid var(--ok)}
.res.bad{background:var(--errbg);border:1px solid var(--err)}
.res .hd{font-size:13.5px;font-weight:600;margin-bottom:6px}
.res.good .hd{color:var(--ok)} .res.bad .hd{color:var(--err)}
w-ok{color:var(--ok)}
w-bad{color:var(--err);text-decoration:underline wavy var(--err);text-underline-offset:3px}
w-miss{color:var(--err);background:var(--errbg);border-radius:4px;padding:0 3px}
.extra{font-size:14px;color:var(--err);margin-top:7px}

/* ---------- 底栏 ---------- */
.bar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
select{font-size:15px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);min-height:48px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:11px;font-size:15px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
.toast.on{opacity:.94}
.done{text-align:center;padding:34px 20px}
.done .big{font-size:52px}
.done h2{font-size:21px;margin:12px 0 6px}
.chip.wrong{animation:shake .38s;border-color:var(--err);background:var(--errbg);color:var(--err)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* 默写反馈：错词按首字母+占位遮挡，给提示但不直接给答案 */
w-mask{color:var(--err);font-weight:600;letter-spacing:.04em}
.res .cnt{font-size:14px;margin-top:9px}
.reveal{margin-top:11px}

/* 今日任务卡 */
.task{width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.task .tick{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;
  background:var(--warnbg);color:var(--warn);white-space:nowrap}
.task .tick.new{background:var(--accbg);color:var(--acc)}
.task.ok{opacity:.55}
.task.ok .tick{background:var(--okbg);color:var(--ok)}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt2{float:right;font-weight:600;letter-spacing:0}
.cnt2.ok{color:var(--ok)}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.row2 input{width:96px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;min-height:46px}

</style>
</head>
<body>
<header id="head"></header>
<div id="stagebar"></div>
<main class="wrap" id="app"></main>
<div class="bar hide" id="bar"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = [{"id":"NCE2-01","book":"NCE2","bookCn":"第二册","num":1,"title":"A Private Conversation","slug":"01.A Private Conversation","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/01.A%20Private%20Conversation.mp3","sentenceCount":17,"wordCount":101,"lines":[{"t":9.77,"en":"Why did the writer complain to the people behind him?","zh":"作者为什么要向他身后的人抱怨？","kind":"question"},{"t":15.91,"en":"Last week I went to the theatre.","zh":"上周我去了剧院。","kind":"text"},{"t":19.39,"en":"I had a very good seat.","zh":"我有一个很好的座位。","kind":"text"},{"t":22.07,"en":"The play was very interesting.","zh":"戏很有趣。","kind":"text"},{"t":25.1,"en":"I did not enjoy it.","zh":"我却没有享受到乐趣。","kind":"text"},{"t":27.43,"en":"A young man and a young woman were sitting behind me.","zh":"一对年轻的男女坐在我身后。","kind":"text"},{"t":31.96,"en":"They were talking loudly.","zh":"他们大声地说着话。","kind":"text"},{"t":34.59,"en":"I got very angry.","zh":"我非常生气。","kind":"text"},{"t":37.41,"en":"I could not hear the actors.","zh":"我听不见演员的讲话。","kind":"text"},{"t":40.64,"en":"I turned round.","zh":"我转过身。","kind":"text"},{"t":42.8,"en":"I looked at the man and the woman angrily.","zh":"我怒气冲冲地看着那一男一女。","kind":"text"},{"t":47.27,"en":"They did not pay any attention.","zh":"他们却不理不睬。","kind":"text"},{"t":50.69,"en":"In the end, I could not bear it.","zh":"最后，我忍不住了。","kind":"text"},{"t":54.98,"en":"I turned round again.","zh":"我又转过身去。","kind":"text"},{"t":57.75,"en":"'I can't hear a word!' I said angrily.","zh":"“我一个字也听不见了！”我生气地说。","kind":"text"},{"t":63.45,"en":"'It's none of your business,'","zh":"“不关你的事，”","kind":"text"},{"t":66.27,"en":"the young man said rudely.","zh":"那个年轻人粗鲁地说。","kind":"text"},{"t":69.0,"en":"'This is a private conversation!'","zh":"“这是私人谈话！”","kind":"text"}]},{"id":"NCE2-02","book":"NCE2","bookCn":"第二册","num":2,"title":"Breakfast or Lunch","slug":"02.Breakfast or Lunch","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/02.Breakfast%20or%20Lunch.mp3","sentenceCount":18,"wordCount":96,"lines":[{"t":10.47,"en":"Why was the writer's aunt surprised?","zh":"作家的阿姨为什么感到惊讶？","kind":"question"},{"t":16.0,"en":"It was Sunday.","zh":"那是星期天。","kind":"text"},{"t":17.99,"en":"I never get up early on Sundays.","zh":"我星期天从不起早。","kind":"text"},{"t":22.03,"en":"I sometimes stay in bed until lunchtime.","zh":"我有时会一直睡到午饭时间。","kind":"text"},{"t":26.81,"en":"Last Sunday I got up very late.","zh":"上个星期天我起得很晚。","kind":"text"},{"t":31.06,"en":"I looked out of the window.","zh":"我向窗外望去。","kind":"text"},{"t":33.45,"en":"It was dark outside.","zh":"外面天很黑。","kind":"text"},{"t":35.84,"en":"'What a day!' I thought.","zh":"“这是什么天气啊！”我想。","kind":"text"},{"t":39.6,"en":"'It's raining again.'","zh":"“又下雨了。”","kind":"text"},{"t":42.61,"en":"Just then, the telephone rang.","zh":"就在那时，电话响了。","kind":"text"},{"t":46.04,"en":"It was my aunt Lucy.","zh":"是我的露西姨妈。","kind":"text"},{"t":49.04,"en":"'I've just arrived by train,' she said.","zh":"她说：“我刚乘火车到了。”","kind":"text"},{"t":53.09,"en":"'I'm coming to see you.'","zh":"“我要来看你。”","kind":"text"},{"t":56.01,"en":"'But I'm still having breakfast,' I said.","zh":"“可是我还在吃早饭呢。”我说。","kind":"text"},{"t":60.54,"en":"'What are you doing?' she asked.","zh":"她问：“你在做什么？”","kind":"text"},{"t":63.84,"en":"'I'm having breakfast,' I repeated.","zh":"“我在吃早饭。”我重复道。","kind":"text"},{"t":67.5,"en":"'Dear me,' she said.","zh":"“哎呀！”她说。","kind":"text"},{"t":70.4,"en":"'Do you always get up so late?","zh":"“你总是起这么晚吗？","kind":"text"},{"t":73.39,"en":"It's one o'clock!'","zh":"已经一点钟了！”","kind":"text"}]},{"id":"NCE2-03","book":"NCE2","bookCn":"第二册","num":3,"title":"Please Send Me a Card","slug":"03.Please Send Me a Card","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/03.Please%20Send%20Me%20a%20Card.mp3","sentenceCount":13,"wordCount":98,"lines":[{"t":11.05,"en":"How many cards did the writer send?","zh":"作者寄了多少张明信片？","kind":"question"},{"t":16.17,"en":"Postcards always spoil my holidays.","zh":"明信片总是破坏我的假期。","kind":"text"},{"t":21.01,"en":"Last summer, I went to Italy.","zh":"去年夏天，我去了意大利。","kind":"text"},{"t":24.26,"en":"I visited museums and sat in public gardens.","zh":"我参观了博物馆，并坐在公共花园里。","kind":"text"},{"t":28.95,"en":"A friendly waiter taught me a few words of Italian.","zh":"一位友好的服务员教了我几句意大利语。","kind":"text"},{"t":33.45,"en":"Then he lent me a book.","zh":"然后他借给我一本书。","kind":"text"},{"t":36.1,"en":"I read a few lines, but I did not understand a word.","zh":"我读了几行，但一个字也看不懂。","kind":"text"},{"t":41.78,"en":"Everyday I thought about postcards.","zh":"每天我都想着明信片。","kind":"text"},{"t":46.08,"en":"My holidays passed quickly,","zh":"我的假期过得很快，","kind":"text"},{"t":48.84,"en":"but I did not send cards to my friends.","zh":"但我没有给朋友们寄明信片。","kind":"text"},{"t":52.98,"en":"On the last day I made a big decision.","zh":"在最后一天，我做了一个重大决定。","kind":"text"},{"t":57.49,"en":"I got up early and bought thirty-seven cards.","zh":"我起得很早，买了三十七张明信片。","kind":"text"},{"t":63.08,"en":"I spent the whole day in my room,","zh":"我在房间里待了一整天，","kind":"text"},{"t":66.55,"en":"but I did not write a single card!","zh":"但我一张明信片也没写！","kind":"text"}]},{"id":"NCE2-04","book":"NCE2","bookCn":"第二册","num":4,"title":"An Exciting Trip","slug":"04.An Exciting Trip","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/04.An%20Exciting%20Trip.mp3","sentenceCount":12,"wordCount":93,"lines":[{"t":9.85,"en":"Why is Tim finding this trip exciting?","zh":"蒂姆为什么觉得这次旅行令人兴奋？","kind":"question"},{"t":15.95,"en":"I have just received a letter from my brother, Tim.","zh":"我刚收到我哥哥蒂姆的一封信。","kind":"text"},{"t":20.73,"en":"He is in Australia.","zh":"他在澳大利亚。","kind":"text"},{"t":23.12,"en":"He has been there for six months.","zh":"他在那里已经六个月了。","kind":"text"},{"t":26.5,"en":"Tim is an engineer.","zh":"蒂姆是一名工程师。","kind":"text"},{"t":28.72,"en":"He is working for a big firm and he has already visited","zh":"他在一家大公司工作，并且他已经参观了","kind":"text"},{"t":33.45,"en":"a great number of different places in Australia.","zh":"澳大利亚的许多不同地方。","kind":"text"},{"t":37.61,"en":"He has just bought an Australian car and has gone to Alice Springs,","zh":"他刚买了一辆澳大利亚汽车，然后去了爱丽丝泉，","kind":"text"},{"t":43.52,"en":"a small town in the centre of Australia.","zh":"一个位于澳大利亚中部的小镇。","kind":"text"},{"t":47.5,"en":"He will soon visit Darwin.","zh":"他很快将参观达尔文。","kind":"text"},{"t":50.09,"en":"From there, he will fly to Perth.","zh":"从那里，他将飞往珀斯。","kind":"text"},{"t":53.81,"en":"My brother has never been abroad before,","zh":"我哥哥以前从未出过国，","kind":"text"},{"t":57.13,"en":"so he is finding this trip very exciting.","zh":"所以他觉得这次旅行非常令人兴奋。","kind":"text"}]},{"id":"NCE2-05","book":"NCE2","bookCn":"第二册","num":5,"title":"No Wrong Numbers","slug":"05.No Wrong Numbers","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/05.No%20Wrong%20Numbers.mp3","sentenceCount":11,"wordCount":95,"lines":[{"t":10.38,"en":"What does 'No wrong numbers' mean?","zh":"“没有打错的电话”是什么意思？","kind":"question"},{"t":15.79,"en":"Mr.James Scott has a garage in Silbury","zh":"詹姆斯·斯科特先生在西尔伯里有一家汽车修理厂","kind":"text"},{"t":19.91,"en":"and now he has just bought another garage in Pinhurst.","zh":"现在他刚刚在平赫斯特又买了一家。","kind":"text"},{"t":25.6,"en":"Pinhurst is only five miles from Silbury,","zh":"平赫斯特离西尔伯里只有五英里，","kind":"text"},{"t":29.72,"en":"but Mr. Scott cannot get a telephone for his new garage,","zh":"但斯科特先生无法为他的新修理厂安装电话，","kind":"text"},{"t":34.57,"en":"so he has just bought twelve pigeons.","zh":"所以他刚买了十二只鸽子。","kind":"text"},{"t":38.96,"en":"Yesterday, a pigeon carried the first message from Pinhurst to Silbury.","zh":"昨天，一只鸽子把第一封信从平赫斯特带到了西尔伯里。","kind":"text"},{"t":45.61,"en":"The bird covered the distance in three minutes.","zh":"这只鸟在三分钟内飞完了这段距离。","kind":"text"},{"t":49.3,"en":"Up to now,","zh":"到目前为止，","kind":"text"},{"t":50.86,"en":"Mr.Scott has sent a great many requests for spare parts","zh":"斯科特先生已经送出了大量的备件请求","kind":"text"},{"t":56.05,"en":"and other urgent messages from one garage to the other.","zh":"以及其他紧急信息，从一家修理厂到另一家。","kind":"text"},{"t":60.95,"en":"In this way, he has begun his own private 'telephone' service.","zh":"通过这种方式，他开创了自己私人的“电话”服务。","kind":"text"}]},{"id":"NCE2-06","book":"NCE2","bookCn":"第二册","num":6,"title":"Percy Buttons","slug":"06.Percy Buttons","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/06.Percy%20Buttons.mp3","sentenceCount":13,"wordCount":104,"lines":[{"t":10.05,"en":"Who is Percy Buttons?","zh":"谁是珀西·巴顿斯？","kind":"question"},{"t":14.5,"en":"I have just moved to a house in Bridge Street.","zh":"我刚搬到桥街的一所房子里。","kind":"text"},{"t":18.76,"en":"Yesterday a beggar knocked at my door.","zh":"昨天一个乞丐敲我的门。","kind":"text"},{"t":22.36,"en":"He asked me for a meal and a glass of beer.","zh":"他向我要一顿饭和一杯啤酒。","kind":"text"},{"t":26.54,"en":"In return for this,","zh":"作为回报，","kind":"text"},{"t":28.41,"en":"the beggar stood on his head and sang songs.","zh":"乞丐倒立着唱歌。","kind":"text"},{"t":32.87,"en":"I gave him a meal.","zh":"我给了他一顿饭。","kind":"text"},{"t":35.17,"en":"He ate the food and drank the beer.","zh":"他吃了食物，喝了啤酒。","kind":"text"},{"t":38.41,"en":"Then he put a piece of cheese in his pocket and went away.","zh":"然后他把一块奶酪放进口袋里，走了。","kind":"text"},{"t":43.23,"en":"Later a neighbour told me about him.","zh":"后来一位邻居告诉我关于他的事。","kind":"text"},{"t":46.47,"en":"Everybody knows him.","zh":"每个人都认识他。","kind":"text"},{"t":48.63,"en":"His name is Percy Buttons.","zh":"他的名字叫珀西·巴顿斯。","kind":"text"},{"t":51.37,"en":"He calls at every house in the street once a month","zh":"他每个月到街上的每家每户拜访一次","kind":"text"},{"t":55.39,"en":"and always asks for a meal and a glass of beer.","zh":"并且总是要求一顿饭和一杯啤酒。","kind":"text"}]},{"id":"NCE2-07","book":"NCE2","bookCn":"第二册","num":7,"title":"Too Late","slug":"07.Too Late","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/07.Too%20Late.mp3","sentenceCount":15,"wordCount":103,"lines":[{"t":9.23,"en":"Did the detectives save the diamonds?","zh":"侦探们保住钻石了吗？","kind":"question"},{"t":14.04,"en":"The plane was late and detectives were waiting at the airport all morning.","zh":"飞机晚点了，侦探们在机场等了一上午。","kind":"text"},{"t":20.38,"en":"They were expecting a valuable parcel of diamonds from South Africa.","zh":"他们正在等一个从南非寄来的贵重钻石包裹。","kind":"text"},{"t":26.06,"en":"A few hours earlier,","zh":"几个小时前，","kind":"text"},{"t":28.29,"en":"someone had told the police that","zh":"有人告诉警方，","kind":"text"},{"t":30.52,"en":"thieves would try to steal the diamonds.","zh":"小偷会设法偷走这些钻石。","kind":"text"},{"t":34.32,"en":"When the plane arrived,","zh":"飞机抵达时，","kind":"text"},{"t":36.57,"en":"some of the detectives were waiting","zh":"一些侦探在","kind":"text"},{"t":38.7,"en":"inside the main building","zh":"主楼里等候，","kind":"text"},{"t":40.8,"en":"while others were waiting on the airfield.","zh":"另一些则在机场跑道上等候。","kind":"text"},{"t":44.89,"en":"Two men took the parcel off the plane","zh":"两名男子把包裹从飞机上卸下来，","kind":"text"},{"t":48.13,"en":"and carried it into the Customs House.","zh":"并把它搬进了海关。","kind":"text"},{"t":51.8,"en":"While two detectives were keeping guard at the door,","zh":"两名侦探在门口守卫，","kind":"text"},{"t":55.93,"en":"two others opened the parcel.","zh":"另外两名打开了包裹。","kind":"text"},{"t":58.93,"en":"To their surprise,","zh":"令他们吃惊的是，","kind":"text"},{"t":60.98,"en":"the precious parcel was full of stones and sand!","zh":"这个贵重包裹里装满了石头和沙子！","kind":"text"}]},{"id":"NCE2-08","book":"NCE2","bookCn":"第二册","num":8,"title":"The Best and the Worst","slug":"08.The Best and the Worst","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/08.The%20Best%20and%20the%20Worst.mp3","sentenceCount":17,"wordCount":97,"lines":[{"t":9.96,"en":"Why is Joe's garden","zh":"为什么乔的花园","kind":"question"},{"t":12.05,"en":"the most beautiful one in the town?","zh":"是镇上最漂亮的一个？","kind":"question"},{"t":16.92,"en":"Joe Sanders has the most beautiful garden","zh":"乔·桑德斯拥有最美丽的花园","kind":"text"},{"t":20.67,"en":"in our town.","zh":"在我们镇上。","kind":"text"},{"t":22.27,"en":"Nearly everybody enters for","zh":"几乎每个人都报名参加","kind":"text"},{"t":25.17,"en":"'The Nicest Garden Competition' each year,","zh":"每年的“最美花园竞赛”，","kind":"text"},{"t":29.12,"en":"but Joe wins every time.","zh":"但乔每次都赢。","kind":"text"},{"t":32.6,"en":"Bill Frith's garden is larger than Joe's.","zh":"比尔·弗里斯的花园比乔的花园大。","kind":"text"},{"t":36.52,"en":"Bill works harder than Joe","zh":"比尔比乔更努力工作","kind":"text"},{"t":38.88,"en":"and grows more flowers and vegetables,","zh":"并且种植更多的花卉和蔬菜，","kind":"text"},{"t":42.12,"en":"but Joe's garden is more interesting.","zh":"但乔的花园更有趣。","kind":"text"},{"t":45.75,"en":"He has made neat paths","zh":"他修建了整齐的小径","kind":"text"},{"t":47.96,"en":"and has built a wooden bridge over a pool.","zh":"并在池塘上架起了一座木桥。","kind":"text"},{"t":52.25,"en":"I like gardens too,","zh":"我也喜欢花园，","kind":"text"},{"t":54.38,"en":"but I do not like hard work.","zh":"但我不喜欢辛苦劳作。","kind":"text"},{"t":57.8,"en":"Every year","zh":"每年","kind":"text"},{"t":59.05,"en":"I enter for the garden competition too,","zh":"我也参加花园竞赛，","kind":"text"},{"t":62.76,"en":"and I always win a little prize","zh":"我总是赢得一个小奖","kind":"text"},{"t":65.97,"en":"for the worst garden in the town!","zh":"因为我是镇上最差的花园！","kind":"text"}]},{"id":"NCE2-09","book":"NCE2","bookCn":"第二册","num":9,"title":"A Cold Welcome","slug":"09.A Cold Welcome","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/09.A%20Cold%20Welcome.mp3","sentenceCount":16,"wordCount":102,"lines":[{"t":9.41,"en":"What does 'a cold welcome' refer to?","zh":"“冷淡的欢迎”指的是什么？","kind":"question"},{"t":15.22,"en":"On Wednesday evening, we went to the Town Hall.","zh":"星期三晚上，我们去了市政厅。","kind":"text"},{"t":19.29,"en":"It was the last day of the year","zh":"那是今年的最后一天，","kind":"text"},{"t":21.86,"en":"and a large crowd of people had gathered under the Town Hall clock.","zh":"一大群人聚集在市政厅大钟下面。","kind":"text"},{"t":27.32,"en":"It would strike twelve in twenty minutes' time.","zh":"再过二十分钟，大钟就要敲响十二点了。","kind":"text"},{"t":31.52,"en":"Fifteen minutes passed and then,","zh":"十五分钟过去了，接着，","kind":"text"},{"t":34.22,"en":"at five to twelve, the clock stopped.","zh":"在十二点差五分的时候，大钟停了。","kind":"text"},{"t":37.85,"en":"The big minute hand did not move.","zh":"巨大的分针一动不动。","kind":"text"},{"t":40.74,"en":"We waited and waited,","zh":"我们等啊等，","kind":"text"},{"t":43.35,"en":"but nothing happened.","zh":"但什么也没有发生。","kind":"text"},{"t":45.14,"en":"Suddenly someone shouted.","zh":"突然有人喊道：","kind":"text"},{"t":47.69,"en":"'It's two minutes past twelve!","zh":"“已经十二点过两分了！","kind":"text"},{"t":50.72,"en":"The clock has stopped!'","zh":"大钟停了！”","kind":"text"},{"t":53.03,"en":"I looked at my watch.","zh":"我看了看我的表。","kind":"text"},{"t":54.7,"en":"It was true.","zh":"果然如此。","kind":"text"},{"t":56.43,"en":"The big clock refused to welcome the New Year.","zh":"那座大钟拒不迎接新年。","kind":"text"},{"t":60.66,"en":"At that moment, everybody began to laugh and sing.","zh":"就在那一刻，所有人都开始笑啊唱啊。","kind":"text"}]},{"id":"NCE2-10","book":"NCE2","bookCn":"第二册","num":10,"title":"Not for Jazz","slug":"10.Not for Jazz","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/10.Not%20for%20Jazz.mp3","sentenceCount":12,"wordCount":95,"lines":[{"t":8.89,"en":"What happened to the clavichord?","zh":"","kind":"question"},{"t":12.57,"en":"We have an old musical instrument.","zh":"我们有一件古老的乐器。","kind":"text"},{"t":16.1,"en":"It is called a clavichord.","zh":"它被称为击弦古钢琴。","kind":"text"},{"t":18.91,"en":"It was made in Germany in 1681.","zh":"它于1681年在德国制造。","kind":"text"},{"t":23.78,"en":"Our clavichord is kept in the living room.","zh":"我们的击弦古钢琴放在客厅里。","kind":"text"},{"t":27.31,"en":"It has belonged to our family for a long time.","zh":"它已经属于我们家很长时间了。","kind":"text"},{"t":31.61,"en":"The instrument was bought by my grandfather many years ago.","zh":"这件乐器是多年前我祖父买的。","kind":"text"},{"t":36.42,"en":"Recently it was damaged by a visitor.","zh":"最近，它被一位访客损坏了。","kind":"text"},{"t":39.87,"en":"She tried to play jazz on it!","zh":"她试图在上面演奏爵士乐。","kind":"text"},{"t":42.88,"en":"She struck the keys too hard and two of the strings were broken.","zh":"她敲击琴键太用力，导致两根琴弦断裂了。","kind":"text"},{"t":48.43,"en":"My father was shocked.","zh":"我父亲很震惊。","kind":"text"},{"t":51.32,"en":"Now we are not allowed to touch it.","zh":"现在我们不被允许碰它。","kind":"text"},{"t":54.36,"en":"It is being repaired by a friend of my father's.","zh":"它正在由我父亲的一位朋友修理。","kind":"text"}]},{"id":"NCE2-11","book":"NCE2","bookCn":"第二册","num":11,"title":"One Good Turn Deserves Another","slug":"11.One Good Turn Deserves Another","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/11.One%20Good%20Turn%20Deserves%20Another.mp3","sentenceCount":11,"wordCount":103,"lines":[{"t":10.82,"en":"Who paid for Tony's dinner?","zh":"谁付了托尼的晚餐钱？","kind":"question"},{"t":14.36,"en":"I was having dinner at a restaurant when Tony Steele came in.","zh":"我正在一家餐馆吃饭，这时托尼·斯蒂尔走了进来。","kind":"text"},{"t":19.9,"en":"Tony worked in a lawyer's office years ago,","zh":"托尼多年前在一家律师事务所工作，","kind":"text"},{"t":23.42,"en":"but he is now working at a bank.","zh":"但他现在在一家银行工作。","kind":"text"},{"t":27.04,"en":"He gets a good salary,","zh":"他薪水很高，","kind":"text"},{"t":29.43,"en":"but he always borrows money from his friends and never pays it back.","zh":"但他总是向朋友借钱，从不还。","kind":"text"},{"t":35.61,"en":"Tony saw me and came and sat at the same table.","zh":"托尼看到了我，走过来坐在同一张桌子旁。","kind":"text"},{"t":39.94,"en":"He has never borrowed money from me.","zh":"他从没向我借过钱。","kind":"text"},{"t":43.19,"en":"While he was eating, I asked him to lend me twenty pounds.","zh":"他吃饭的时候，我请他借给我二十英镑。","kind":"text"},{"t":48.33,"en":"To my surprise, he gave me the money immediately.","zh":"令我惊讶的是，他立刻把钱给了我。","kind":"text"},{"t":53.78,"en":"'I have never borrowed any money from you,'","zh":"“我从没向你借过钱，”","kind":"text"},{"t":56.77,"en":"Tony said, 'so now you can pay for my dinner!'","zh":"托尼说，“所以现在你可以为我的晚餐付钱了！”","kind":"text"}]},{"id":"NCE2-12","book":"NCE2","bookCn":"第二册","num":12,"title":"Goodbye and Good Luck","slug":"12.Goodbye and Good Luck","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/12.Goodbye%20and%20Good%20Luck.mp3","sentenceCount":11,"wordCount":91,"lines":[{"t":10.64,"en":"Where is Captain Alison going and how?","zh":"艾莉森船长要去哪里，怎么去？","kind":"question"},{"t":16.15,"en":"Our neighbour, Captain Charles Alison, will sail from Portsmouth tomorrow.","zh":"我们的邻居，查尔斯·艾莉森船长，明天将从朴茨茅斯启航。","kind":"text"},{"t":23.68,"en":"We'll meet him at the harbour early in the morning.","zh":"我们明天一早将在港口与他会合。","kind":"text"},{"t":27.51,"en":"He will be in his small boat, Topsail.","zh":"他将乘坐他的小船“上帆号”。","kind":"text"},{"t":31.64,"en":"Topsail is a famous little boat.","zh":"“上帆号”是一艘著名的小船。","kind":"text"},{"t":34.97,"en":"It has sailed across the Atlantic many times.","zh":"它已经多次横渡大西洋。","kind":"text"},{"t":39.48,"en":"Captain Alison will set out at eight o'clock,","zh":"艾莉森船长将在八点钟出发，","kind":"text"},{"t":43.04,"en":"so we'll have plenty of time.","zh":"所以我们有充足的时间。","kind":"text"},{"t":46.0,"en":"We'll see his boat and then we'll say goodbye to him.","zh":"我们将去看他的船，然后向他告别。","kind":"text"},{"t":50.16,"en":"He will be away for two months.","zh":"他将离开两个月。","kind":"text"},{"t":53.09,"en":"We are very proud of him.","zh":"我们为他感到非常自豪。","kind":"text"},{"t":55.91,"en":"He will take part in an important race across the Atlantic.","zh":"他将参加一场重要的横渡大西洋的比赛。","kind":"text"}]},{"id":"NCE2-13","book":"NCE2","bookCn":"第二册","num":13,"title":"The Greenwood Boys","slug":"13.The Greenwood Boys","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/13.The%20Greenwood%20Boys.mp3","sentenceCount":10,"wordCount":98,"lines":[{"t":9.99,"en":"Why will the police have a difficult time?","zh":"警察为什么会遇到困难？","kind":"question"},{"t":15.28,"en":"The Greenwood Boys are a group of pop singers.","zh":"“格林伍德少年”是一个流行歌手组合。","kind":"text"},{"t":19.38,"en":"At present, they are visiting all parts of the country.","zh":"目前，他们正在全国各地巡回演出。","kind":"text"},{"t":24.48,"en":"They will be arriving here tomorrow.","zh":"他们明天将抵达这里。","kind":"text"},{"t":27.76,"en":"They will be coming by train and most of the young people in the town will be meeting them at the station.","zh":"他们将乘火车来，镇上的大部分年轻人会去车站迎接他们。","kind":"text"},{"t":35.81,"en":"Tomorrow evening they will be singing at the Workers' Club.","zh":"明天晚上，他们将在工人俱乐部演唱。","kind":"text"},{"t":40.82,"en":"The Greenwood Boys will be staying for five days.","zh":"“格林伍德少年”将停留5天。","kind":"text"},{"t":45.24,"en":"During this time, they will give five performances.","zh":"在此期间，他们将演出5场。","kind":"text"},{"t":50.16,"en":"As usual, the police will have a difficult time.","zh":"和往常一样，警察将遇到很多麻烦。","kind":"text"},{"t":54.7,"en":"They will be trying to keep order.","zh":"他们将尽力维持秩序。","kind":"text"},{"t":57.56,"en":"It is always the same on these occasions.","zh":"每逢这种场合，情况总是如此。","kind":"text"}]},{"id":"NCE2-14","book":"NCE2","bookCn":"第二册","num":14,"title":"Do You Speak English","slug":"14.Do You Speak English","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/14.Do%20You%20Speak%20English.mp3","sentenceCount":13,"wordCount":114,"lines":[{"t":10.47,"en":"Did the young man speak English?","zh":"那个年轻人会说英语吗？","kind":"question"},{"t":15.27,"en":"I had an amusing experience last year.","zh":"去年我有一个有趣的经历。","kind":"text"},{"t":19.24,"en":"After I had left a small village in the south of France,","zh":"在我离开法国南部的一个小村庄后，","kind":"text"},{"t":23.47,"en":"I drove on to the next town.","zh":"我驱车前往下一个城镇。","kind":"text"},{"t":26.82,"en":"On the way, a young man waved to me.","zh":"在路上，一个年轻人向我招手。","kind":"text"},{"t":30.58,"en":"I stopped and he asked me for a lift.","zh":"我停了下来，他请求我搭他一程。","kind":"text"},{"t":34.62,"en":"As soon as he had got into the car,","zh":"他一上车，","kind":"text"},{"t":37.9,"en":"I said good morning to him in French and he replied in the same language.","zh":"我就用法语向他问好，他也用同样的语言回答我。","kind":"text"},{"t":44.36,"en":"Apart from a few words,","zh":"除了一些词语，","kind":"text"},{"t":46.65,"en":"I do not know any French at all.","zh":"我一点法语也不会。","kind":"text"},{"t":50.17,"en":"Neither of us spoke during the journey.","zh":"在旅途中，我们两人都没有说话。","kind":"text"},{"t":53.32,"en":"I had nearly reached the town, when the young man suddenly said, very slowly,","zh":"我快到城镇时，那个年轻人突然非常缓慢地说，","kind":"text"},{"t":60.63,"en":"'Do you speak English?'","zh":"“你会说英语吗？”","kind":"text"},{"t":64.63,"en":"As I soon learnt, he was English himself!","zh":"我很快了解到，他自己就是英国人！","kind":"text"}]},{"id":"NCE2-15","book":"NCE2","bookCn":"第二册","num":15,"title":"Good News","slug":"15.Good News","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/15.Good%20News.mp3","sentenceCount":11,"wordCount":96,"lines":[{"t":9.78,"en":"What was the good news?","zh":"好消息是什么？","kind":"question"},{"t":13.88,"en":"The secretary told me that Mr. Harmsworth would see me.","zh":"秘书告诉我哈姆斯沃思先生会见我。","kind":"text"},{"t":19.28,"en":"I felt very nervous when I went into his office.","zh":"当我走进他的办公室时，我感到非常紧张。","kind":"text"},{"t":24.36,"en":"He did not look up from his desk when I entered.","zh":"我进去时，他没有从办公桌上抬起头。","kind":"text"},{"t":28.84,"en":"After I had sat down,","zh":"我坐下后，","kind":"text"},{"t":31.23,"en":"he said that business was very bad.","zh":"他说生意很糟。","kind":"text"},{"t":35.1,"en":"He told me that the firm could not afford to pay such large salaries.","zh":"他告诉我公司负担不起支付如此高的薪水。","kind":"text"},{"t":41.52,"en":"Twenty people had already left.","zh":"已经有二十人离开了。","kind":"text"},{"t":45.06,"en":"I knew that my turn had come.","zh":"我知道轮到我了。","kind":"text"},{"t":48.59,"en":"'Mr. Harmsworth,' I said in a weak voice.","zh":"“哈姆斯沃思先生，”我用微弱的声音说。","kind":"text"},{"t":53.3,"en":"'Don't interrupt,' he said.","zh":"“不要打断，”他说。","kind":"text"},{"t":56.14,"en":"Then he smiled and told me I would receive an extra thousand pounds a year!","zh":"然后他笑了，告诉我每年将额外获得一千英镑！","kind":"text"}]},{"id":"NCE2-16","book":"NCE2","bookCn":"第二册","num":16,"title":"A Polite Request","slug":"16.A Polite Request","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/16.A%20Polite%20Request.mp3","sentenceCount":10,"wordCount":99,"lines":[{"t":10.02,"en":"What was the polite request?","zh":"有礼貌的请求是什么？","kind":"question"},{"t":14.64,"en":"If you park your car in the wrong place,","zh":"如果你把车停错了地方，","kind":"text"},{"t":18.11,"en":"a traffic policeman will soon find it.","zh":"交通警察很快就会发现它。","kind":"text"},{"t":21.68,"en":"You will be very lucky if he lets you go without a ticket.","zh":"如果他让你走而不开罚单，你将非常幸运。","kind":"text"},{"t":26.86,"en":"However, this does not always happen.","zh":"然而，这并非总是发生。","kind":"text"},{"t":31.48,"en":"Traffic police are sometimes very polite.","zh":"交通警察有时非常有礼貌。","kind":"text"},{"t":35.98,"en":"During a holiday in Sweden,","zh":"在瑞典度假期间，","kind":"text"},{"t":38.66,"en":"I found this note on my car:","zh":"我在车上发现了这张字条：","kind":"text"},{"t":42.04,"en":"'sir, we welcome you to our city. This is a No Parking area.","zh":"“先生，我们欢迎您来到我们的城市。这里是禁停区。","kind":"text"},{"t":49.85,"en":"You will enjoy your stay here if you pay attention to our street signs. This note is only a reminder.'","zh":"如果您注意我们的路标，您会在这里度过愉快的时光。这张字条只是一个提醒。”","kind":"text"},{"t":60.31,"en":"If you receive a request like this, you cannot fail to obey it!","zh":"如果你收到这样的请求，你不能不遵守它！","kind":"text"}]},{"id":"NCE2-17","book":"NCE2","bookCn":"第二册","num":17,"title":"Always Young","slug":"17.Always Young","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/17.Always%20Young.mp3","sentenceCount":10,"wordCount":100,"lines":[{"t":10.34,"en":"Why doesn't Aunt Jennifer tell anyone how old she is?","zh":"珍妮弗姨妈为什么不告诉任何人她多大了？","kind":"question"},{"t":17.39,"en":"My aunt Jennifer is an actress.","zh":"我的珍妮弗姨妈是个演员。","kind":"text"},{"t":20.95,"en":"She must be at least thirty-five years old.","zh":"她肯定至少35岁了。","kind":"text"},{"t":25.21,"en":"In spite of this, she often appears on the stage as a young girl.","zh":"尽管如此，她还是经常在舞台上扮演一个年轻姑娘。","kind":"text"},{"t":31.68,"en":"Jennifer will have to take part in a new play soon.","zh":"珍妮弗很快就要参加一个新剧的演出了。","kind":"text"},{"t":36.1,"en":"This time, she will be a girl of seventeen.","zh":"这次，她将扮演一个17岁的姑娘。","kind":"text"},{"t":41.18,"en":"In the play, she must appear in a bright red dress and long black stockings.","zh":"在剧中，她必须穿一件鲜红的连衣裙和一双长长的黑丝袜。","kind":"text"},{"t":49.17,"en":"Last year in another play,","zh":"去年在另一个剧中，","kind":"text"},{"t":51.7,"en":"she had to wear short socks and a bright, orange-coloured dress.","zh":"她不得不穿短袜和一件鲜艳的橙色连衣裙。","kind":"text"},{"t":58.45,"en":"If anyone ever asks her how old she is,","zh":"如果有人问起她多大了，","kind":"text"},{"t":62.55,"en":"she always answers, 'Darling, it must be terrible to be grown up!'","zh":"她总是回答说：“亲爱的，长大成人真是太可怕了！”","kind":"text"}]},{"id":"NCE2-18","book":"NCE2","bookCn":"第二册","num":18,"title":"He Often does This","slug":"18.He Often does This","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/18.He%20Often%20does%20This.mp3","sentenceCount":9,"wordCount":102,"lines":[{"t":9.56,"en":"What had happened to the writer's bag?","zh":"作家的包怎么了？","kind":"question"},{"t":14.28,"en":"After I had had lunch at a village pub, I looked for my bag.","zh":"我在一家乡村酒吧吃过午饭后，就去找我的包。","kind":"text"},{"t":20.98,"en":"I had left it on a chair beside the door and now it wasn't there!","zh":"我把它放在门旁边的一把椅子上，现在它不在那里了！","kind":"text"},{"t":27.45,"en":"As I was looking for it, the landlord came in.","zh":"当我正在找它的时候，房东进来了。","kind":"text"},{"t":32.45,"en":"'Did you have a good meal?' he asked.","zh":"“你吃得好吗？”他问。","kind":"text"},{"t":35.94,"en":"'Yes, thank you,' I answered, 'but I can't pay the bill. I haven't got my bag.'","zh":"“是的，谢谢你，”我回答说，“但我付不了账单。我没有我的包。”","kind":"text"},{"t":44.3,"en":"The landlord smiled and immediately went out.","zh":"房东笑了，立刻出去了。","kind":"text"},{"t":48.8,"en":"In a few minutes he returned with my bag and gave it back to me.","zh":"几分钟后，他带着我的包回来了，并把它还给了我。","kind":"text"},{"t":54.93,"en":"'I'm very sorry,' he said.","zh":"“我非常抱歉，”他说。","kind":"text"},{"t":58.43,"en":"'My dog had taken it into the garden. He often does this!'","zh":"“我的狗把它叼到花园里去了。它经常这样做！”","kind":"text"}]},{"id":"NCE2-19","book":"NCE2","bookCn":"第二册","num":19,"title":"Sold Out","slug":"19.Sold Out","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/19.Sold%20Out.mp3","sentenceCount":15,"wordCount":106,"lines":[{"t":10.2,"en":"When will the writer see the play?","zh":"作者什么时候会看这部戏？","kind":"question"},{"t":15.14,"en":"'The play may begin at any moment,' I said.","zh":"“这出戏随时都可能开始，”我说。","kind":"text"},{"t":19.47,"en":"'It may have begun already,' Susan answered.","zh":"“可能已经开始了，”苏珊回答说。","kind":"text"},{"t":24.55,"en":"I hurried to the ticket office.","zh":"我赶紧跑到售票处。","kind":"text"},{"t":27.78,"en":"'May I have two tickets please?' I asked.","zh":"“请给我两张票好吗？”我问道。","kind":"text"},{"t":32.35,"en":"'I'm sorry, we've sold out,' the girl said.","zh":"“对不起，票已经卖完了，”那个女孩说。","kind":"text"},{"t":37.1,"en":"'What a pity!' Susan exclaimed.","zh":"“真可惜！”苏珊惊呼道。","kind":"text"},{"t":41.51,"en":"Just then, a man hurried to the ticket office.","zh":"就在那时，一个男人匆匆跑到售票处。","kind":"text"},{"t":46.59,"en":"'Can I return these two tickets?' he asked.","zh":"“我能退这两张票吗？”他问道。","kind":"text"},{"t":51.15,"en":"'Certainly,' the girl said.","zh":"“当然可以，”那个女孩说。","kind":"text"},{"t":55.05,"en":"I went back to the ticket office at once.","zh":"我立刻回到了售票处。","kind":"text"},{"t":59.44,"en":"'Could I have those two tickets please?' I asked.","zh":"“我能要那两张票吗？”我问道。","kind":"text"},{"t":65.21,"en":"'Certainly,' the girl said,","zh":"“当然可以，”那个女孩说，","kind":"text"},{"t":68.69,"en":"'but they're for next Wednesday's performance.","zh":"“但那是下周三演出的票。","kind":"text"},{"t":72.4,"en":"Do you still want them?'","zh":"你还要吗？”","kind":"text"},{"t":75.35,"en":"'I might as well have them,' I said sadly.","zh":"“我还是把它们拿走吧，”我伤心地说。","kind":"text"}]},{"id":"NCE2-20","book":"NCE2","bookCn":"第二册","num":20,"title":"One Man in a Boat","slug":"20.One Man in a Boat","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/20.One%20Man%20in%20a%20Boat.mp3","sentenceCount":14,"wordCount":103,"lines":[{"t":11.03,"en":"Why is fishing the writer's favourite sport?","zh":"为什么钓鱼是作者最喜欢的运动？","kind":"question"},{"t":15.9,"en":"Fishing is my favourite sport.","zh":"钓鱼是我最喜欢的运动。","kind":"text"},{"t":18.88,"en":"I often fish for hours without catching anything.","zh":"我经常钓好几个小时，却什么也钓不到。","kind":"text"},{"t":24.11,"en":"But this does not worry me.","zh":"但这并不困扰我。","kind":"text"},{"t":27.65,"en":"Some fishermen are unlucky.","zh":"有些渔夫运气不好。","kind":"text"},{"t":30.69,"en":"Instead of catching fish,","zh":"他们不是钓到鱼，","kind":"text"},{"t":33.27,"en":"they catch old boots and rubbish.","zh":"而是钓到旧靴子和垃圾。","kind":"text"},{"t":37.33,"en":"I am even less lucky.","zh":"我甚至更不走运。","kind":"text"},{"t":40.24,"en":"I never catch anything -- not even old boots.","zh":"我什么也钓不到——甚至连旧靴子都钓不到。","kind":"text"},{"t":46.48,"en":"After having spent whole mornings on the river,","zh":"在河上度过整个上午之后，","kind":"text"},{"t":50.52,"en":"I always go home with an empty bag.","zh":"我总是空手回家。","kind":"text"},{"t":54.86,"en":"'You must give up fishing!' my friends say. 'It's a waste of time.'","zh":"“你必须放弃钓鱼！”我的朋友们说，“这简直是浪费时间。”","kind":"text"},{"t":62.5,"en":"But they don't realize one important thing.","zh":"但他们没有意识到一件重要的事情。","kind":"text"},{"t":67.05,"en":"I'm not really interested in fishing.","zh":"我对钓鱼并不真正感兴趣。","kind":"text"},{"t":70.78,"en":"I am only interested in sitting in a boat and doing nothing at all!","zh":"我只对坐在船上什么也不做感兴趣！","kind":"text"}]},{"id":"NCE2-21","book":"NCE2","bookCn":"第二册","num":21,"title":"Mad or Not","slug":"21.Mad or Not","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/21.Mad%20or%20Not.mp3","sentenceCount":9,"wordCount":109,"lines":[{"t":10.51,"en":"Why do people think the writer is mad?","zh":"为什么人们认为这位作者疯了？","kind":"question"},{"t":15.83,"en":"Aeroplanes are slowly driving me mad.","zh":"飞机正慢慢地把我逼疯。","kind":"text"},{"t":20.58,"en":"I live near an airport and passing planes can be heard night and day.","zh":"我住在一个机场附近，飞机从早到晚轰鸣而过。","kind":"text"},{"t":27.2,"en":"The airport was built years ago, but for some reason it could not be used then.","zh":"机场是多年前修建的，但由于某种原因，那时无法投入使用。","kind":"text"},{"t":34.93,"en":"Last year, however, it came into use.","zh":"然而，去年它投入使用了。","kind":"text"},{"t":39.66,"en":"Over a hundred people must have been driven away from their homes by the noise.","zh":"一百多人一定是被噪音逼离了家园。","kind":"text"},{"t":46.47,"en":"I am one of the few people left.","zh":"我是少数留下来的人之一。","kind":"text"},{"t":50.39,"en":"Sometimes I think this house will be knocked down by a passing plane.","zh":"有时我想这房子会被一架路过的飞机撞倒。","kind":"text"},{"t":57.24,"en":"I have been offered a large sum of money to go away, but I am determined to stay here.","zh":"有人给我一大笔钱让我搬走，但我决心留在这里。","kind":"text"},{"t":65.82,"en":"Everybody says I must be mad and they are probably right.","zh":"大家都说我一定疯了，他们可能是对的。","kind":"text"}]},{"id":"NCE2-22","book":"NCE2","bookCn":"第二册","num":22,"title":"A Glass Envelope","slug":"22.A Glass Envelope","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/22.A%20Glass%20Envelope.mp3","sentenceCount":7,"wordCount":98,"lines":[{"t":10.79,"en":"How did Jane receive a letter from a stranger?","zh":"简是如何收到陌生人的来信的？","kind":"question"},{"t":16.79,"en":"My daughter, Jane, never dreamed of receiving a letter from a girl of her own age in Holland.","zh":"我的女儿简从未想过会收到一个荷兰同龄女孩的来信。","kind":"text"},{"t":26.87,"en":"Last year, we were travelling across the Channel and Jane put a piece of paper with her name and address on it into a bottle.","zh":"去年，我们渡海旅行，简把一张写有她姓名和地址的纸条放进了一个瓶子里。","kind":"text"},{"t":37.71,"en":"She threw the bottle into the sea.","zh":"她把瓶子扔进了海里。","kind":"text"},{"t":41.19,"en":"She never thought of it again, but ten months later, she received a letter from a girl in Holland.","zh":"她再也没想起这件事，但十个月后，她收到了一个荷兰女孩的来信。","kind":"text"},{"t":49.93,"en":"Both girls write to each other regularly now.","zh":"现在两个女孩定期通信。","kind":"text"},{"t":54.19,"en":"However, they have decided to use the post office.","zh":"然而，她们决定使用邮局。","kind":"text"},{"t":59.72,"en":"Letters will cost a little more, but they will certainly travel faster.","zh":"信件会贵一点，但肯定会更快到达。","kind":"text"}]},{"id":"NCE2-23","book":"NCE2","bookCn":"第二册","num":23,"title":"A New House","slug":"23.A New House","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/23.A%20New%20House.mp3","sentenceCount":11,"wordCount":108,"lines":[{"t":10.53,"en":"Why is the new house special?","zh":"这新房子有什么特别之处？","kind":"question"},{"t":15.29,"en":"I had a letter from my sister yesterday.","zh":"昨天我收到了我姐姐的一封信。","kind":"text"},{"t":19.23,"en":"She lives in Nigeria.","zh":"她住在尼日利亚。","kind":"text"},{"t":22.23,"en":"In her letter, she said that she would come to England next year.","zh":"在信中她说她明年将来英国。","kind":"text"},{"t":28.38,"en":"If she comes, she will get a surprise.","zh":"如果她来了，她会大吃一惊的。","kind":"text"},{"t":32.58,"en":"We are now living in a beautiful new house in the country.","zh":"我们现在正住在这乡下一所漂亮的新房子里。","kind":"text"},{"t":37.85,"en":"Work on it had begun before my sister left.","zh":"这所房子的建造在我姐姐离开之前就动工了。","kind":"text"},{"t":42.58,"en":"The house was completed five months ago.","zh":"房子在5个月前就竣工了。","kind":"text"},{"t":46.5,"en":"In my letter, I told her that she could stay with us.","zh":"我在信中告诉她，她可以和我们住在一起。","kind":"text"},{"t":51.52,"en":"The house has many large rooms and there is a lovely garden.","zh":"这所房子有许多大房间，还有一个漂亮的花园。","kind":"text"},{"t":57.35,"en":"It is a very modern house, so it looks strange to some people.","zh":"这是一座很现代化的房子，所以有些人觉得它样子很怪。","kind":"text"},{"t":63.69,"en":"It must be the only modern house in the district.","zh":"它肯定是这个地区唯一的一座现代化住宅。","kind":"text"}]},{"id":"NCE2-24","book":"NCE2","bookCn":"第二册","num":24,"title":"It Could be Worse","slug":"24.It Could be Worse","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/24.It%20Could%20be%20Worse.mp3","sentenceCount":10,"wordCount":103,"lines":[{"t":10.39,"en":"Had the writer's money been stolen?","zh":"作者的钱被偷了吗？","kind":"question"},{"t":15.33,"en":"I entered the hotel manager's office and sat down.","zh":"我走进旅馆经理的办公室，坐了下来。","kind":"text"},{"t":20.13,"en":"I had just lost ￡50 and I felt very upset.","zh":"我刚刚丢失了50英镑，感到非常沮丧。","kind":"text"},{"t":26.39,"en":"'I left the money in my room,' I said, 'and it's not there now. '","zh":"“我把钱落在房间里了，”我说，“现在它不在那儿了。”","kind":"text"},{"t":33.33,"en":"The manager was sympathetic, but he could do nothing.","zh":"经理深表同情，但他无能为力。","kind":"text"},{"t":38.93,"en":"'Everyone's losing money these days,' he said.","zh":"“现在大家都在丢钱，”他说。","kind":"text"},{"t":44.08,"en":"He started to complain about this wicked world but was interrupted by a knock at the door.","zh":"他开始抱怨这个邪恶的世界，但被一阵敲门声打断了。","kind":"text"},{"t":52.53,"en":"A girl came in and put an envelope on his desk.","zh":"一个女孩走了进来，在他的桌上放了一个信封。","kind":"text"},{"t":56.98,"en":"It contained ￡50.","zh":"里面装着50英镑。","kind":"text"},{"t":59.97,"en":"'I found this outside this gentleman's room,' she said.","zh":"“我在这位先生的房间外面发现了这个，”她说。","kind":"text"},{"t":65.16,"en":"'Well,' I said to the manager,'there is still some honesty in this world!'","zh":"“噢，”我对经理说，“这世界上还是有诚实可言的！”","kind":"text"}]},{"id":"NCE2-25","book":"NCE2","bookCn":"第二册","num":25,"title":"Do the English Speak English","slug":"25.Do the English Speak English","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/25.Do%20the%20English%20Speak%20English.mp3","sentenceCount":16,"wordCount":135,"lines":[{"t":3.3,"en":"Do they speak English?","zh":"他们说英语吗？","kind":"question"},{"t":12.26,"en":"Why does the writer not understand the porter?","zh":"为什么作者听不懂搬运工的话？","kind":"question"},{"t":17.71,"en":"I arrived in London at last.","zh":"我终于抵达伦敦了。","kind":"text"},{"t":21.05,"en":"The railway station was big, black and dark.","zh":"火车站又大，又黑，又暗。","kind":"text"},{"t":26.35,"en":"I did not know the way to my hotel, so I asked a porter.","zh":"我不知道去旅馆的路，所以我问了一位搬运工。","kind":"text"},{"t":32.6,"en":"I not only spoke English very carefully, but very clearly as well.","zh":"我不仅非常仔细地说英语，而且说得非常清楚。","kind":"text"},{"t":40.16,"en":"The porter, however, could not understand me.","zh":"然而，那个搬运工却听不懂我。","kind":"text"},{"t":44.44,"en":"I repeated my question several times and at last he understood.","zh":"我重复了我的问题好几次，最后他终于明白了。","kind":"text"},{"t":51.37,"en":"he answered me, but he spoke neither slowly nor clearly.","zh":"他回答了我，但他既说得不慢也不清楚。","kind":"text"},{"t":57.42,"en":"'I am a foreigner,' I said.","zh":"“我是一个外国人，”我说。","kind":"text"},{"t":61.12,"en":"Then he spoke slowly, but I could not understand him.","zh":"然后他慢慢地说，但我仍然听不懂他。","kind":"text"},{"t":67.15,"en":"My teacher never spoke English like that!","zh":"我的老师从来没有那样说过英语！","kind":"text"},{"t":71.68,"en":"The porter and I looked at each other and smiled.","zh":"搬运工和我互相对视，然后笑了。","kind":"text"},{"t":75.91,"en":"Then he said something and I understood it.","zh":"然后他说了一些话，我听懂了。","kind":"text"},{"t":80.14,"en":"'You'll soon learn English!' he said.","zh":"“你很快就会学好英语的！”他说。","kind":"text"},{"t":84.32,"en":"I wonder.","zh":"我怀疑。","kind":"text"},{"t":86.53,"en":"In England, each person speaks a different language.","zh":"在英国，每个人都说着不同的语言。","kind":"text"},{"t":91.5,"en":"The English understand each other, but I don't understand them!","zh":"英国人彼此听得懂，但我听不懂他们！","kind":"text"}]},{"id":"NCE2-26","book":"NCE2","bookCn":"第二册","num":26,"title":"The Best Art Critics","slug":"26.The Best Art Critics","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/26.The%20Best%20Art%20Critics.mp3","sentenceCount":17,"wordCount":145,"lines":[{"t":10.99,"en":"Who is the student's best critic?","zh":"谁是学生最好的评论家？","kind":"question"},{"t":15.97,"en":"I am an art student and I paint a lot of pictures.","zh":"我是一名艺术生，画了很多画。","kind":"text"},{"t":21.45,"en":"Many people pretend that they understand modern art.","zh":"许多人假装他们懂现代艺术。","kind":"text"},{"t":26.32,"en":"They always tell you what a picture is 'about'.","zh":"他们总是告诉你一幅画是“关于”什么的。","kind":"text"},{"t":30.55,"en":"Of course, many pictures are not 'about' anything.","zh":"当然，许多画根本就不是“关于”什么的。","kind":"text"},{"t":35.3,"en":"They are just pretty patterns.","zh":"它们只是漂亮的图案。","kind":"text"},{"t":38.11,"en":"We like them in the same way that we like pretty curtain material.","zh":"我们喜欢它们的方式，就像我们喜欢漂亮的窗帘布料一样。","kind":"text"},{"t":44.18,"en":"I think that young children often appreciate modern pictures better than anyone else.","zh":"我认为小孩子往往比任何人都更能欣赏现代画。","kind":"text"},{"t":52.01,"en":"They notice more.","zh":"他们注意到更多。","kind":"text"},{"t":54.27,"en":"My sister is only seven,","zh":"我的妹妹只有七岁，","kind":"text"},{"t":57.08,"en":"but she always tells me whether my pictures are good or not.","zh":"但她总是告诉我我的画好不好。","kind":"text"},{"t":62.67,"en":"She came into my room yesterday.","zh":"昨天她进了我的房间。","kind":"text"},{"t":65.94,"en":"'What are you doing?' she asked.","zh":"“你在做什么？”她问。","kind":"text"},{"t":69.36,"en":"'I'm hanging this picture on the wall,' I answered. 'It's a new one. Do you like it?'","zh":"“我正在把这幅画挂在墙上，”我回答。“这是一幅新画。你喜欢吗？”","kind":"text"},{"t":77.48,"en":"She looked at it critically for a moment.","zh":"她批判性地看了一会儿。","kind":"text"},{"t":81.07,"en":"'It's all right,' she said, 'but isn't it upside down?'","zh":"“还行，”她说，“但这幅画是不是倒着挂的？”","kind":"text"},{"t":86.93,"en":"I looked at it again.","zh":"我又看了一遍。","kind":"text"},{"t":88.97,"en":"She was right! It was!","zh":"她是对的！确实是！","kind":"text"}]},{"id":"NCE2-27","book":"NCE2","bookCn":"第二册","num":27,"title":"A Wet Night","slug":"27.A Wet Night","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/27.A%20Wet%20Night.mp3","sentenceCount":12,"wordCount":147,"lines":[{"t":10.29,"en":"What happened to the boys in the night?","zh":"晚上男孩们发生了什么事？","kind":"question"},{"t":15.08,"en":"Late in the afternoon, the boys put up their tent in the middle of a field.","zh":"下午很晚的时候，男孩们把帐篷搭在了田野中央。","kind":"text"},{"t":21.85,"en":"As soon as this was done, they cooked a meal over an open fire.","zh":"这一切刚弄好，他们就在篝火上做了一顿饭。","kind":"text"},{"t":27.98,"en":"They were all hungry and the food smelled good.","zh":"他们都饿了，食物闻起来很香。","kind":"text"},{"t":32.99,"en":"After a wonderful meal, they told stories and sang songs by the campfire.","zh":"美餐一顿之后，他们围着篝火讲故事，唱歌。","kind":"text"},{"t":40.91,"en":"But some time later it began to rain.","zh":"但过了一会儿，天开始下雨了。","kind":"text"},{"t":44.71,"en":"The boys felt tired so they put out the fire and crept into their tent.","zh":"男孩们感到疲倦了，于是他们熄灭了篝火，钻进了帐篷。","kind":"text"},{"t":51.47,"en":"Their sleeping bags were warm and comfortable, so they all slept soundly.","zh":"他们的睡袋又暖和又舒服，所以他们都睡得很香。","kind":"text"},{"t":58.66,"en":"In the middle of the night, two boys woke up and began shouting.","zh":"半夜里，两个男孩醒了，开始大叫起来。","kind":"text"},{"t":64.55,"en":"The tent was full of water!","zh":"帐篷里全是水！","kind":"text"},{"t":67.56,"en":"They all leapt out of their sleeping bags and hurried outside.","zh":"他们都跳出睡袋，匆匆忙忙跑到了外面。","kind":"text"},{"t":73.65,"en":"It was raining heavily and they found that a stream had formed in the field.","zh":"雨下得很大，他们发现田野里形成了一条小溪。","kind":"text"},{"t":80.09,"en":"The stream wound its way across the field and then flowed right under their tent!","zh":"小溪蜿蜒穿过田野，然后正好从他们的帐篷下面流过！","kind":"text"}]},{"id":"NCE2-28","book":"NCE2","bookCn":"第二册","num":28,"title":"No Parking","slug":"28.No Parking","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/28.No%20Parking.mp3","sentenceCount":10,"wordCount":151,"lines":[{"t":9.64,"en":"What is Jasper White's problem?","zh":"贾斯珀·怀特有什么问题？","kind":"question"},{"t":14.22,"en":"Jasper White is one of those rare people who believes in ancient myths.","zh":"贾斯珀·怀特是那种相信古代神话的稀有人物之一。","kind":"text"},{"t":21.12,"en":"He has just bought a new house in the city, but ever since he moved in, he has had trouble with cars and their owners.","zh":"他刚在城里买了新房子，但自从他搬进来后，他就一直被汽车和它们的车主所困扰。","kind":"text"},{"t":31.96,"en":"When he returns home at night, he always finds that someone has parked a car outside his gate.","zh":"每当他晚上回家时，他总是发现有人把车停在他家门口。","kind":"text"},{"t":40.56,"en":"Because of this, he has not been able to get his own car into his garage even once.","zh":"因此，他甚至一次都没能把自己的车开进车库。","kind":"text"},{"t":49.02,"en":"Jasper has put up 'No Parking' signs outside his gate, but these have not had any effect.","zh":"贾斯珀在他家门口竖起了“禁止停车”的牌子，但这些都没有任何效果。","kind":"text"},{"t":58.94,"en":"Now he has put an ugly stone head over the gate.","zh":"现在他在门上放了一个丑陋的石头脑袋。","kind":"text"},{"t":64.19,"en":"It is one of the ugliest faces I have ever seen.","zh":"这是我见过的最丑陋的脸之一。","kind":"text"},{"t":69.51,"en":"I asked him what it was and he told me that it was Medusa, the Gorgon.","zh":"我问他那是什么，他告诉我那是美杜莎，那个戈尔贡女妖。","kind":"text"},{"t":76.75,"en":"Jasper hopes that she will turn cars and their owners to stone.","zh":"贾斯珀希望她能把汽车和它们的车主变成石头。","kind":"text"},{"t":82.58,"en":"But none of them has been turned to stone yet!","zh":"但他们中还没有人变成石头！","kind":"text"}]},{"id":"NCE2-29","book":"NCE2","bookCn":"第二册","num":29,"title":"Taxi","slug":"29.Taxi","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/29.Taxi.mp3","sentenceCount":10,"wordCount":144,"lines":[{"t":9.28,"en":"Does Captain Fawcett think any trip is too dangerous?","zh":"福西特上尉认为有哪次飞行会太危险吗？","kind":"question"},{"t":15.69,"en":"Captain Ben Fawcett has bought an unusual taxi and has begun a new service.","zh":"本·福西特上尉购买了一架不同寻常的“出租车”，并开始了一项新业务。","kind":"text"},{"t":23.34,"en":"The 'taxi' is a small Swiss aeroplane called a 'Pilatus Porter'.","zh":"这架“出租车”是一架名为“皮拉图斯搬运工”的瑞士小型飞机。","kind":"text"},{"t":29.69,"en":"This wonderful plane can carry seven passengers.","zh":"这架奇妙的飞机能载七名乘客。","kind":"text"},{"t":34.4,"en":"The most surprising thing about it, however, is that it can land anywhere: on snow, water, or even on a ploughed field.","zh":"然而，它最令人惊讶的地方是它能降落在任何地方：雪地、水面，甚至是一块耕过的田地。","kind":"text"},{"t":47.11,"en":"Captain Fawcett's first passenger was a doctor who flew from Birmingham to a lonely village in the Welsh mountains.","zh":"福西特上尉的第一位乘客是一位医生，他从伯明翰飞到威尔士山区的一个偏僻村庄。","kind":"text"},{"t":56.89,"en":"Since then, Captain Fawcett has flown passengers to many unusual places.","zh":"从那以后，福西特上尉已载送乘客去过许多不寻常的地方。","kind":"text"},{"t":64.48,"en":"Once he landed on the roof of a block of flats and on another occasion, he landed in a deserted car park.","zh":"他曾有一次降落在公寓楼的屋顶上，还有一次降落在废弃的停车场里。","kind":"text"},{"t":74.86,"en":"Captain Fawcett has just refused a strange request from a businessman.","zh":"福西特上尉刚刚拒绝了一位商人提出的一个奇怪请求。","kind":"text"},{"t":81.17,"en":"The man wanted to fly to Rockall, a lonely island in the Atlantic Ocean,","zh":"那位商人想飞到大西洋中的一座孤岛——罗科尔岛，","kind":"text"},{"t":88.27,"en":"but Captain Fawcett did not take him because the trip was too dangerous.","zh":"但福西特上尉没有载他，因为那次飞行太危险了。","kind":"text"}]},{"id":"NCE2-30","book":"NCE2","bookCn":"第二册","num":30,"title":"Football or Polo","slug":"30.Football or Polo","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/30.Football%20or%20Polo.mp3","sentenceCount":10,"wordCount":146,"lines":[{"t":9.99,"en":"What happened to the man in the boat?","zh":"船上的那个人怎么了？","kind":"question"},{"t":13.78,"en":"The Wayle is a small river that cuts across the park near my home.","zh":"威勒河是一条小河，它横穿过我家附近的公园。","kind":"text"},{"t":20.02,"en":"I like sitting by the Wayle on fine afternoons.","zh":"我喜欢在天气晴朗的下午坐在威勒河边。","kind":"text"},{"t":24.73,"en":"It was warm last Sunday, so I went and sat on the river bank as usual.","zh":"上个星期天天气很暖和，于是我像往常一样去坐在了河岸上。","kind":"text"},{"t":32.21,"en":"Some children were playing games on the bank and there were some people rowing on the river.","zh":"一些孩子在岸边玩游戏，河里有一些人在划船。","kind":"text"},{"t":39.58,"en":"Suddenly, one of the children kicked a ball very hard and it went towards a passing boat.","zh":"突然，一个孩子非常用力地踢了一个球，球飞向了一艘路过的船。","kind":"text"},{"t":48.04,"en":"Some people on the bank called out to the man in the boat, but he did not hear them.","zh":"岸边的一些人向船上的那个人大声喊叫，但他没有听到。","kind":"text"},{"t":55.56,"en":"The ball struck him so hard that he nearly fell into the water.","zh":"球重重地打在他身上，他差点儿掉进水里。","kind":"text"},{"t":62.52,"en":"I turned to look at the children, but there weren't any in sight: they had all run away!","zh":"我转身去看孩子们，但一个也看不见了：他们都跑掉了！","kind":"text"},{"t":70.23,"en":"The man laughed when he realized what had happened.","zh":"当那个人意识到发生了什么事时，他笑了。","kind":"text"},{"t":74.83,"en":"He called out to the children and threw the ball back to the bank.","zh":"他冲孩子们喊了一声，把球扔回了岸边。","kind":"text"}]},{"id":"NCE2-31","book":"NCE2","bookCn":"第二册","num":31,"title":"Success Story","slug":"31.Success Story","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/31.Success%20Story.mp3","sentenceCount":16,"wordCount":147,"lines":[{"t":10.09,"en":"What was Frank's first job?","zh":"弗兰克的第一个工作是什么？","kind":"question"},{"t":14.48,"en":"Yesterday afternoon Frank Hawkins was telling me about","zh":"昨天下午，弗兰克·霍金斯正在给我讲","kind":"text"},{"t":19.08,"en":"his experiences as a young man.","zh":"他年轻时的经历。","kind":"text"},{"t":23.07,"en":"Before he retired,","zh":"在他退休之前，","kind":"text"},{"t":25.39,"en":"Frank was the head of","zh":"弗兰克是一家","kind":"text"},{"t":26.96,"en":"a very large business company, but as a boy he used to work in a small shop.","zh":"非常大的商业公司的负责人，但小时候他曾在一家小商店工作。","kind":"text"},{"t":34.44,"en":"It was his job to repair bicycles","zh":"他的工作是修理自行车，","kind":"text"},{"t":37.5,"en":"and at that time he used to work fourteen hours a day.","zh":"那时候他每天工作十四个小时。","kind":"text"},{"t":42.98,"en":"He saved money for years and","zh":"他攒了好几年的钱，","kind":"text"},{"t":45.37,"en":"in 1958 he bought a small workshop of his own.","zh":"1958年他买下了一间自己的小作坊。","kind":"text"},{"t":50.77,"en":"In his twenties Frank used to make spare parts for aeroplanes.","zh":"二十多岁时，弗兰克曾为飞机制造备件。","kind":"text"},{"t":56.63,"en":"At that time he had two helpers.","zh":"那时候他有两个助手。","kind":"text"},{"t":60.18,"en":"In a few years the small workshop had become a large factory","zh":"几年之内，这个小作坊就变成了一家大工厂，","kind":"text"},{"t":65.56,"en":"which employed seven hundred and twenty-eight people.","zh":"雇佣了七百二十八名工人。","kind":"text"},{"t":70.63,"en":"Frank smiled when he remembered his hard early years and the long road to success.","zh":"弗兰克回忆起他艰难的早年和漫长的成功之路时笑了。","kind":"text"},{"t":78.24,"en":"He was still smiling when the door opened and his wife came in.","zh":"门开了，他妻子走进来的时候，他还在笑。","kind":"text"},{"t":83.59,"en":"She wanted him to repair their grandson's bicycle!","zh":"她想让他修理他们孙子的自行车！","kind":"text"}]},{"id":"NCE2-32","book":"NCE2","bookCn":"第二册","num":32,"title":"Shopping Made Easy","slug":"32.Shopping Made Easy","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/32.Shopping%20Made%20Easy.mp3","sentenceCount":23,"wordCount":144,"lines":[{"t":10.68,"en":"Who was the thief?","zh":"谁是小偷？","kind":"question"},{"t":14.65,"en":"People are not so honest as","zh":"人们不像从前那样诚实，","kind":"text"},{"t":16.81,"en":"they once were.","zh":"曾经是那样。","kind":"text"},{"t":18.75,"en":"The temptation to steal is greater than","zh":"偷窃的诱惑比以往任何时候都","kind":"text"},{"t":22.12,"en":"ever before--especially in large shops.","zh":"更大——尤其是在大型商店里。","kind":"text"},{"t":27.03,"en":"A detective recently watched a well-dressed","zh":"一名侦探最近发现一名穿着考究的","kind":"text"},{"t":30.36,"en":"woman who always went into a large store","zh":"妇女，她总是周一上午","kind":"text"},{"t":33.8,"en":"on Monday mornings.","zh":"去一家大商店。","kind":"text"},{"t":35.9,"en":"One Monday,","zh":"有一个周一，","kind":"text"},{"t":37.46,"en":"there were fewer people in the shop","zh":"商店里的人比平时","kind":"text"},{"t":39.71,"en":"than usual when the woman came in,","zh":"少，当时那个妇女进来了，","kind":"text"},{"t":43.52,"en":"so it was easier for the detective to watch her.","zh":"因此侦探更容易监视她。","kind":"text"},{"t":48.6,"en":"The woman first bought a few small articles.","zh":"这名妇女首先买了几件小商品。","kind":"text"},{"t":52.98,"en":"After a little time,","zh":"过了一会儿，","kind":"text"},{"t":54.95,"en":"she chose one of the most expensive dresses","zh":"她选择了一件店里最昂贵的","kind":"text"},{"t":58.71,"en":"in the shop and handed it to an assistant","zh":"连衣裙，并把它递给了一名店员，","kind":"text"},{"t":62.41,"en":"who wrapped it up for her as quickly as possible.","zh":"店员尽快地为她包好了。","kind":"text"},{"t":67.16,"en":"Then the woman simply took the parcel","zh":"然后，这名妇女只是拿起包裹","kind":"text"},{"t":70.94,"en":"and walked out of the shop without paying.","zh":"没有付钱就走出了商店。","kind":"text"},{"t":75.38,"en":"When she was arrested,","zh":"当她被捕时，","kind":"text"},{"t":77.49,"en":"the detective found out that","zh":"侦探发现","kind":"text"},{"t":79.49,"en":"the shop assistant was her daughter.","zh":"这名店员是她的女儿。","kind":"text"},{"t":83.02,"en":"The girl 'gave' her mother","zh":"这女孩每周“送给”她母亲","kind":"text"},{"t":85.33,"en":"a free dress once a week!","zh":"一件免费连衣裙！","kind":"text"}]},{"id":"NCE2-33","book":"NCE2","bookCn":"第二册","num":33,"title":"Out of the Darkness","slug":"33.Out of the Darkness","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/33.Out%20of%20the%20Darkness.mp3","sentenceCount":23,"wordCount":130,"lines":[{"t":10.68,"en":"Why was the girl in hospital?","zh":"女孩为什么住院了？","kind":"question"},{"t":14.62,"en":"Nearly a week passed before","zh":"将近一个星期过去了","kind":"text"},{"t":16.96,"en":"the girl was able to explain","zh":"女孩才能解释","kind":"text"},{"t":19.54,"en":"what had happened to her.","zh":"发生在她身上的事情。","kind":"text"},{"t":23.15,"en":"One afternoon she set out","zh":"一个下午，她出发了","kind":"text"},{"t":25.7,"en":"from the coast in a small boat","zh":"乘小船从海岸出发","kind":"text"},{"t":28.22,"en":"and was caught in a storm.","zh":"结果遭遇了暴风雨。","kind":"text"},{"t":31.49,"en":"Towards evening,","zh":"傍晚时分，","kind":"text"},{"t":33.09,"en":"the boat struck a rock and","zh":"小船撞上了一块礁石","kind":"text"},{"t":35.13,"en":"the girl jumped into the sea.","zh":"女孩跳入了海中。","kind":"text"},{"t":38.3,"en":"Then she swam to the shore","zh":"然后她游向岸边","kind":"text"},{"t":40.63,"en":"after spending the whole night in the water.","zh":"在水里待了一整夜。","kind":"text"},{"t":44.71,"en":"During that time she covered","zh":"在那段时间里，她游了","kind":"text"},{"t":47.5,"en":"a distance of eight miles.","zh":"八英里的距离。","kind":"text"},{"t":50.81,"en":"Early next morning,","zh":"第二天一早，","kind":"text"},{"t":52.9,"en":"she saw a light ahead.","zh":"她看到前方有灯光。","kind":"text"},{"t":55.8,"en":"She knew she was near the shore","zh":"她知道她靠近岸边了","kind":"text"},{"t":58.9,"en":"because the light was high up on the cliffs.","zh":"因为灯光在高高的悬崖上。","kind":"text"},{"t":63.51,"en":"On arriving at the shore,","zh":"到达岸边后，","kind":"text"},{"t":66.16,"en":"the girl struggled up the cliff towards","zh":"女孩艰难地爬上悬崖","kind":"text"},{"t":69.56,"en":"the light she had seen.","zh":"朝着她看到的灯光。","kind":"text"},{"t":72.09,"en":"That was all she remembered.","zh":"这就是她所记得的一切。","kind":"text"},{"t":75.17,"en":"When she woke up a day later,","zh":"一天后她醒来时，","kind":"text"},{"t":77.97,"en":"she found herself in hospital.","zh":"她发现自己躺在医院里。","kind":"text"}]},{"id":"NCE2-34","book":"NCE2","bookCn":"第二册","num":34,"title":"Quick Work","slug":"34.Quick Work","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/34.Quick%20Work.mp3","sentenceCount":22,"wordCount":132,"lines":[{"t":10.3,"en":"How long had the police taken to find his bicycle?","zh":"警察花了多长时间才找到他的自行车？","kind":"question"},{"t":16.58,"en":"Dan Robinson has been worried all week.","zh":"丹·罗宾逊整个星期都忧心忡忡。","kind":"text"},{"t":20.97,"en":"Last Tuesday he received a letter","zh":"上周二，他收到了一封信","kind":"text"},{"t":23.82,"en":"from the local police.","zh":"来自当地警察局。","kind":"text"},{"t":26.19,"en":"In the letter he was asked to call at the station.","zh":"信中要求他到警察局一趟。","kind":"text"},{"t":30.94,"en":"Dan wondered why","zh":"丹想知道为什么","kind":"text"},{"t":32.54,"en":"he was wanted by the police,","zh":"警察要找他，","kind":"text"},{"t":35.71,"en":"but he went to the station yesterday","zh":"但他昨天去了警察局，","kind":"text"},{"t":38.53,"en":"and now he is not worried anymore.","zh":"现在他不再担心了。","kind":"text"},{"t":42.18,"en":"At the station,","zh":"在警察局，","kind":"text"},{"t":43.72,"en":"he was told by a smiling policeman","zh":"一位面带微笑的警察告诉他","kind":"text"},{"t":46.81,"en":"that his bicycle had been found.","zh":"他的自行车已经找到了。","kind":"text"},{"t":50.69,"en":"Five days ago, the policeman told him,","zh":"警察告诉他，五天前，","kind":"text"},{"t":54.69,"en":"the bicycle was picked up in a small village","zh":"这辆自行车在一个小村庄被发现，","kind":"text"},{"t":58.35,"en":"four hundred miles away.","zh":"距离这里四百英里。","kind":"text"},{"t":61.27,"en":"It is now being sent to his home by train.","zh":"现在正通过火车运往他家。","kind":"text"},{"t":65.61,"en":"Dan was most surprised","zh":"丹听到这个消息时","kind":"text"},{"t":68.03,"en":"when he heard the news.","zh":"非常惊讶。","kind":"text"},{"t":70.41,"en":"He was amused too,","zh":"他也觉得很有趣，","kind":"text"},{"t":73.16,"en":"because he never expected","zh":"因为他从未想过","kind":"text"},{"t":75.44,"en":"the bicycle to be found.","zh":"自行车会被找到。","kind":"text"},{"t":78.36,"en":"It was stolen twenty years ago","zh":"这辆自行车是二十年前被偷的，","kind":"text"},{"t":81.44,"en":"when Dan was a boy of fifteen!","zh":"当时丹还是个15岁的男孩！","kind":"text"}]},{"id":"NCE2-35","book":"NCE2","bookCn":"第二册","num":35,"title":"Stop Thief","slug":"35.Stop Thief","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/35.Stop%20Thief.mp3","sentenceCount":21,"wordCount":147,"lines":[{"t":11.67,"en":"How did Roy stop the thieves?","zh":"罗伊是怎样制止小偷的？","kind":"question"},{"t":16.41,"en":"Roy Trenton used to drive a taxi.","zh":"罗伊·特伦顿以前是开出租车的。","kind":"text"},{"t":20.62,"en":"A short while ago, however,","zh":"然而，不久前，","kind":"text"},{"t":23.65,"en":"he became a bus driver","zh":"他当上了一名公共汽车司机，","kind":"text"},{"t":25.93,"en":"and he has not regretted it.","zh":"他一点也不后悔。","kind":"text"},{"t":29.27,"en":"He is finding his new work far more exciting.","zh":"他觉得自己的新工作更加激动人心。","kind":"text"},{"t":34.53,"en":"When he was driving","zh":"最近，当他开着车","kind":"text"},{"t":35.75,"en":"along Catford Street recently,","zh":"沿卡特福德大街行驶时，","kind":"text"},{"t":38.95,"en":"he saw two thieves rush out of a shop","zh":"他看见两个小偷从一家商店里冲出来，","kind":"text"},{"t":43.02,"en":"and run towards a waiting car.","zh":"朝一辆等在那里的汽车跑去。","kind":"text"},{"t":46.37,"en":"One of them was carrying a bag full of money.","zh":"其中一个提着一满袋钱。","kind":"text"},{"t":51.24,"en":"Roy acted quickly and drove the bus","zh":"罗伊迅速行动，","kind":"text"},{"t":54.46,"en":"straight at the thieves.","zh":"把公共汽车径直朝小偷开去。","kind":"text"},{"t":57.29,"en":"The one with the money got such a fright","zh":"拿钱的那个小偷吓了一大跳，","kind":"text"},{"t":60.67,"en":"that he dropped the bag.","zh":"把袋子都弄掉了。","kind":"text"},{"t":63.25,"en":"As the thieves were trying to get away in their car,","zh":"当小偷们试图乘车逃跑时，","kind":"text"},{"t":67.6,"en":"Roy drove his bus into the back of it.","zh":"罗伊开着公共汽车撞在小偷汽车的尾部。","kind":"text"},{"t":71.89,"en":"While the battered car was moving away,","zh":"就在那辆被撞坏的汽车开走的时候，","kind":"text"},{"t":75.46,"en":"Roy stopped his bus and telephoned the police.","zh":"罗伊停下公共汽车给警察打了电话。","kind":"text"},{"t":79.33,"en":"The thieves' car was badly damaged and easy to recognize.","zh":"小偷的汽车已严重受损，很容易辨认。","kind":"text"},{"t":85.05,"en":"Shortly afterwards,","zh":"不久，","kind":"text"},{"t":87.27,"en":"the police stopped the car and both men were arrested.","zh":"警察截住了那辆汽车，两名男子都被捕了。","kind":"text"}]},{"id":"NCE2-36","book":"NCE2","bookCn":"第二册","num":36,"title":"Across the Channel","slug":"36.Across the Channel","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/36.Across%20the%20Channel.mp3","sentenceCount":21,"wordCount":145,"lines":[{"t":9.9,"en":"What is Debbie going to try to do?","zh":"黛比将要尝试做什么？","kind":"question"},{"t":14.66,"en":"Debbie Hart is going to swim","zh":"黛比·哈特将于","kind":"text"},{"t":16.98,"en":"across the English Channel tomorrow.","zh":"明天横渡英吉利海峡。","kind":"text"},{"t":20.41,"en":"She is going to set out from the French coast","zh":"她将于明天凌晨5点","kind":"text"},{"t":23.6,"en":"at five o'clock in the morning.","zh":"从法国海岸出发。","kind":"text"},{"t":26.6,"en":"Debbie is only eleven years old","zh":"黛比年仅11岁，","kind":"text"},{"t":29.7,"en":"and she hopes to set up a new world record.","zh":"她希望能创造一个新的世界纪录。","kind":"text"},{"t":33.42,"en":"She is a strong swimmer and many people feel","zh":"她是一名出色的游泳运动员，许多人觉得","kind":"text"},{"t":36.81,"en":"that she is sure to succeed.","zh":"她一定会成功。","kind":"text"},{"t":40.07,"en":"Debbie's father will set out with her","zh":"黛比的父亲将与她一起","kind":"text"},{"t":42.85,"en":"in a small boat.","zh":"乘一艘小船出发。","kind":"text"},{"t":44.91,"en":"Mr. Hart has trained his daughter for years.","zh":"哈特先生训练他的女儿已经多年了。","kind":"text"},{"t":49.16,"en":"Tomorrow he will be watching her anxiously","zh":"明天，他将焦急地看着她","kind":"text"},{"t":52.66,"en":"as she swims the long distance to England.","zh":"游过那漫长的距离去英国。","kind":"text"},{"t":56.89,"en":"Debbie intends to take short rests every two hours.","zh":"黛比打算每两小时短暂停歇一次。","kind":"text"},{"t":61.68,"en":"She will have something to drink","zh":"她会喝些东西，","kind":"text"},{"t":63.59,"en":"but she will not eat any solid food.","zh":"但不吃任何固体食物。","kind":"text"},{"t":67.63,"en":"Most of Debbie's school friends will be","zh":"黛比的大部分同学都将","kind":"text"},{"t":70.18,"en":"waiting for her on the English coast.","zh":"在英国海岸等候她。","kind":"text"},{"t":73.3,"en":"Among them will be Debbie's mother,","zh":"其中包括黛比的母亲，","kind":"text"},{"t":76.33,"en":"who swam the Channel herself","zh":"她本人在还是个女孩的时候","kind":"text"},{"t":78.4,"en":"when she was a girl.","zh":"也曾游过英吉利海峡。","kind":"text"}]},{"id":"NCE2-37","book":"NCE2","bookCn":"第二册","num":37,"title":"The Olympic Games","slug":"37.The Olympic Games","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/37.The%20Olympic%20Games.mp3","sentenceCount":22,"wordCount":141,"lines":[{"t":10.34,"en":"When was the last time this country","zh":"这个国家上次是何时","kind":"question"},{"t":12.97,"en":"hosted the Olympic Games?","zh":"举办奥运会的？","kind":"question"},{"t":17.0,"en":"The Olympic Games will be held","zh":"奥运会将在","kind":"text"},{"t":18.98,"en":"in our country in four years' time.","zh":"四年后在我国举行。","kind":"text"},{"t":22.6,"en":"As a great many people will be","zh":"由于很多人将会","kind":"text"},{"t":25.14,"en":"visiting the country,","zh":"访问这个国家，","kind":"text"},{"t":26.97,"en":"the government will be building new hotels,","zh":"政府将建造新酒店、","kind":"text"},{"t":30.45,"en":"an immense stadium,","zh":"一个巨大的体育场，","kind":"text"},{"t":32.41,"en":"and a new Olympic-standard swimming pool.","zh":"和一个符合奥运标准的新游泳池。","kind":"text"},{"t":36.32,"en":"They will also be building new roads","zh":"他们还将修建新道路","kind":"text"},{"t":39.29,"en":"and a special railway line.","zh":"和一条专用铁路线。","kind":"text"},{"t":42.09,"en":"The Games will be held just outside the capital","zh":"奥运会将在首都郊外举行，","kind":"text"},{"t":45.9,"en":"and the whole area will be called 'Olympic City'.","zh":"整个地区将被命名为“奥运城”。","kind":"text"},{"t":50.49,"en":"Workers will have completed the new roads","zh":"工人们将在今年年底","kind":"text"},{"t":53.25,"en":"by the end of this year.","zh":"完成新道路的修建。","kind":"text"},{"t":55.82,"en":"By the end of next year,","zh":"到明年年底，","kind":"text"},{"t":58.16,"en":"they will have finished work on the new stadium.","zh":"他们将完成新体育场的建设工作。","kind":"text"},{"t":62.04,"en":"The fantastic modern buildings have been designed","zh":"这些奇妙的现代化建筑已由","kind":"text"},{"t":65.58,"en":"by Kurt Gunter.","zh":"库尔特·冈瑟设计。","kind":"text"},{"t":68.47,"en":"Everybody will be watching anxiously","zh":"每个人都会焦急地关注","kind":"text"},{"t":71.32,"en":"as the new buildings go up.","zh":"这些新建筑的建成。","kind":"text"},{"t":74.63,"en":"We are all very excited and are looking forward to","zh":"我们都非常兴奋并期待着","kind":"text"},{"t":78.75,"en":"the Olympic Games because","zh":"奥运会的到来，因为","kind":"text"},{"t":80.74,"en":"they have never been held before in this country.","zh":"这个国家以前从未举办过奥运会。","kind":"text"}]},{"id":"NCE2-38","book":"NCE2","bookCn":"第二册","num":38,"title":"Everything Except the Weather","slug":"38.Everything Except the Weather","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/38.Everything%20Except%20the%20Weather.mp3","sentenceCount":19,"wordCount":141,"lines":[{"t":10.98,"en":"Why did Harrison sell his house so quickly?","zh":"为什么哈里森把房子卖得这么快？","kind":"question"},{"t":16.51,"en":"My old friend, Harrison, had lived in","zh":"我的老朋友哈里森在","kind":"text"},{"t":20.0,"en":"the Mediterranean for many years","zh":"地中海地区住过多年，","kind":"text"},{"t":22.65,"en":"before he returned to England.","zh":"然后才回到英国。","kind":"text"},{"t":25.97,"en":"He had often dreamed of retiring in England","zh":"他曾常常梦想在英国退休，","kind":"text"},{"t":29.89,"en":"and had planned to settle down in the country.","zh":"并计划在乡村安顿下来。","kind":"text"},{"t":33.61,"en":"He had no sooner returned than he bought","zh":"他刚一回来就买下","kind":"text"},{"t":37.38,"en":"a house and went to live there.","zh":"了所房子住了进去。","kind":"text"},{"t":40.05,"en":"Almost immediately he began to complain","zh":"他几乎是立刻就开始抱怨","kind":"text"},{"t":43.62,"en":"about the weather,","zh":"天气了，","kind":"text"},{"t":45.62,"en":"for even though it was still summer,","zh":"因为尽管当时仍是夏天，","kind":"text"},{"t":49.2,"en":"it rained continually and it was often bitterly cold.","zh":"但却一直下雨，而且常常冷得厉害。","kind":"text"},{"t":54.84,"en":"After so many years of sunshine,","zh":"在阳光充足的地方生活了那么多年之后，","kind":"text"},{"t":57.84,"en":"Harrison got a shock.","zh":"哈里森感到很震惊。","kind":"text"},{"t":60.47,"en":"He acted as if he had never lived in England before.","zh":"他的举动就好像他以前从未在英国生活过一样。","kind":"text"},{"t":65.6,"en":"In the end, it was more than he could bear.","zh":"最终，他再也忍受不了了。","kind":"text"},{"t":69.79,"en":"He had hardly had time to settle down","zh":"他还没来得及安顿下来，","kind":"text"},{"t":73.04,"en":"when he sold the house and left the country.","zh":"就把房子卖掉离开了英国。","kind":"text"},{"t":77.21,"en":"The dream he had had for so many years ended there.","zh":"他多年的梦想就这样破灭了。","kind":"text"},{"t":82.79,"en":"Harrison had thought of everything except the weather.","zh":"哈里森把什么都考虑到了，就是没想到天气。","kind":"text"}]},{"id":"NCE2-39","book":"NCE2","bookCn":"第二册","num":39,"title":"Am I All Right","slug":"39.Am I All Right","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/39.Am%20I%20All%20Right.mp3","sentenceCount":22,"wordCount":140,"lines":[{"t":10.49,"en":"Why did Mr. Gilbert telephone Dr. Millington?","zh":"吉尔伯特先生为什么给米林顿医生打电话？","kind":"question"},{"t":16.42,"en":"While John Gilbert was in hospital,","zh":"约翰·吉尔伯特住院期间，","kind":"text"},{"t":19.72,"en":"he asked his doctor to tell him","zh":"他请医生告诉他","kind":"text"},{"t":22.55,"en":"whether his operation had been successful,","zh":"他的手术是否成功，","kind":"text"},{"t":26.16,"en":"but the doctor refused to do so.","zh":"但医生拒绝了。","kind":"text"},{"t":30.06,"en":"The following day,","zh":"第二天，","kind":"text"},{"t":31.89,"en":"the patient asked for a bedside telephone.","zh":"病人要了一部床头电话。","kind":"text"},{"t":35.85,"en":"When he was alone,","zh":"他独处时，","kind":"text"},{"t":37.87,"en":"he telephoned the hospital exchange","zh":"他给医院总机打电话","kind":"text"},{"t":40.82,"en":"and asked for Doctor Millington.","zh":"要求找米林顿医生。","kind":"text"},{"t":44.42,"en":"When the doctor answered the phone,","zh":"医生接电话后，","kind":"text"},{"t":47.05,"en":"Mr. Gilbert said he was inquiring about a certain patient,","zh":"吉尔伯特先生说他正在询问一位病人，","kind":"text"},{"t":52.71,"en":"a Mr. John Gilbert.","zh":"约翰·吉尔伯特先生。","kind":"text"},{"t":55.41,"en":"He asked if Mr. Gilbert's operation had been successful","zh":"他问吉尔伯特先生的手术是否成功，","kind":"text"},{"t":60.49,"en":"and the doctor told him that it had been.","zh":"医生告诉他成功了。","kind":"text"},{"t":64.88,"en":"He then asked when Mr. Gilbert would be allowed to","zh":"他又问吉尔伯特先生何时可以","kind":"text"},{"t":68.74,"en":"go home and the doctor told him","zh":"回家，医生告诉他","kind":"text"},{"t":71.67,"en":"that he would have to stay","zh":"他必须在医院","kind":"text"},{"t":73.07,"en":"in hosptial for another two weeks.","zh":"再住两周。","kind":"text"},{"t":76.95,"en":"Then Dr. Millington asked the caller","zh":"接着米林顿医生问打电话的人","kind":"text"},{"t":80.49,"en":"if he was a relative of the patient.","zh":"他是不是病人的亲属。","kind":"text"},{"t":83.6,"en":"'No,' the patient answered,","zh":"“不，”病人回答说，","kind":"text"},{"t":86.57,"en":"'I am Mr. John Gilbert.'","zh":"“我就是约翰·吉尔伯特先生。”","kind":"text"}]},{"id":"NCE2-40","book":"NCE2","bookCn":"第二册","num":40,"title":"Food and Talk","slug":"40.Food and Talk","audioUrl":"https://raw.githubusercontent.com/yoyo0529-AI/nce/main/us/NCE2/40.Food%20and%20Talk.mp3","sentenceCount":18,"wordCount":134,"lines":[{"t":9.79,"en":"Was Mrs. Rumbold a good companion at dinner?","zh":"伦布尔德夫人是个好的晚餐伴侣吗？","kind":"question"},{"t":15.06,"en":"Last week at a dinner party,","zh":"上周在一个晚宴上，","kind":"text"},{"t":17.55,"en":"the hostess asked me to sit next to Mrs. Rumbold.","zh":"女主人请我坐在伦布尔德夫人旁边。","kind":"text"},{"t":22.74,"en":"Mrs. Rumbold was a large,","zh":"伦布尔德夫人是个身材魁梧、","kind":"text"},{"t":24.99,"en":"unsmiling lady in a tight black dress.","zh":"不苟言笑的女士，穿着一件紧身黑连衣裙。","kind":"text"},{"t":29.34,"en":"She did not even look up when I took my seat beside her.","zh":"我在她身边坐下时，她甚至没有抬头看我。","kind":"text"},{"t":34.73,"en":"Her eyes were fixed on her plate and in a short time,","zh":"她的眼睛盯着自己的盘子，不一会儿，","kind":"text"},{"t":39.22,"en":"she was busy eating.","zh":"她就开始大吃起来。","kind":"text"},{"t":42.09,"en":"I tried to make conversation.","zh":"我试图和她攀谈。","kind":"text"},{"t":44.95,"en":"'A new play is coming to \"The Globe\" soon,'","zh":"“一部新戏很快就要在‘环球剧场’上演了，”","kind":"text"},{"t":48.27,"en":"I said. 'Will you be seeing it?'","zh":"我说，“您会去看吗？”","kind":"text"},{"t":53.12,"en":"'No,' she answered.","zh":"“不，”她答道。","kind":"text"},{"t":55.95,"en":"'Will you be spending your holidays abroad this year?' I asked.","zh":"“今年您会到国外度假吗？”我问。","kind":"text"},{"t":63.23,"en":"'No,' she answered.","zh":"“不，”她答道。","kind":"text"},{"t":65.81,"en":"'Will you be staying in England?' I asked.","zh":"“您会留在英格兰吗？”我问。","kind":"text"},{"t
